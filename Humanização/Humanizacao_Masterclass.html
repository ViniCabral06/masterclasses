<script id="dataset" type="application/json">{"lessons":[{"id":"a02","number":2,"title":"Humanização e integralidade","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a02-1","title":"O encontro clínico e o sujeito","paragraphs":["Na consulta, o diagnóstico da doença organiza hipóteses e condutas, enquanto a experiência de adoecimento revela medo, expectativas e efeitos na vida diária. O cuidado centrado na pessoa articula essas duas perspectivas. Perguntar o que a pessoa considera prioritário muda a proposta terapêutica quando a conduta tecnicamente possível não é viável no cotidiano.","O modelo biomédico é útil para localizar mecanismos e tratar a doença, mas tende a produzir fragmentação quando usado como única lente. A abordagem biopsicossocial inclui sofrimento emocional, rede de apoio e condições materiais, sem perder precisão diagnóstica."],"refs":["s80-27","s81-09","p83-14"],"figures":[],"q":[{"id":"a02-1-q1","aula":"a02","segment":"a02-1","prompt":"Maria, 54 anos, hipertensa, abandonou o anti-hipertensivo. O médico repete a explicação sobre risco cardiovascular e aumenta a dose. Qual abordagem se aproxima mais do cuidado centrado na pessoa?","options":["Trocar o fármaco sem conversar sobre o abandono","Reforçar que a prescrição é indispensável e encerrar a consulta","Explorar o que ela pensa do medicamento, seus medos, rotina e custos antes de repactuar o plano","Encaminhar ao psicólogo sem investigar a causa"],"answer":2,"why":"A abordagem centrada na pessoa investiga a experiência de adoecer e o contexto antes de repetir a conduta. Reforçar o risco ou trocar o fármaco sem entender o abandono mantém a barreira.","origin":null},{"id":"a02-1-q2","aula":"a02","segment":"a02-1","prompt":"Qual afirmação diferencia corretamente doença e adoecimento?","options":["Doença é a vivência subjetiva; adoecimento é o achado de exame","São sinônimos na prática clínica","Adoecimento só ocorre em doenças crônicas","Doença é a alteração biológica reconhecida pelo profissional; adoecimento é a experiência vivida, com medo, expectativas e limitações"],"answer":3,"why":"Disease é a perspectiva biomédica; illness é a perspectiva da pessoa. As duas coexistem e precisam ser articuladas.","origin":null}],"terms":["centrado no paciente","biomédico","biopsicossocial"],"keys":["Doença (disease) é a alteração biológica; adoecimento (illness) é a experiência vivida pela pessoa.","O cuidado centrado na pessoa integra as duas perspectivas e não substitui o raciocínio diagnóstico.","Perguntar prioridades e contexto muda a conduta quando o ideal técnico é inviável no cotidiano.","O modelo biopsicossocial amplia o biomédico sem abandonar a precisão diagnóstica."],"deep":["A distinção entre disease (alteração biológica reconhecida pelo profissional), illness (vivência subjetiva) e sickness (papel social do doente) explica por que dois pacientes com o mesmo diagnóstico têm necessidades diferentes. O método clínico centrado na pessoa propõe explorar a doença e a experiência de adoecer, compreender a pessoa como um todo, buscar terreno comum para o plano e incorporar prevenção e promoção, fortalecendo a relação. O modelo biopsicossocial foi formalizado por George Engel (1977) como crítica à redução do sofrimento à lesão de órgão."],"case":"Sr. Antônio, 62 anos, diabético, mantém HbA1c elevada. A insulina três vezes ao dia é tecnicamente adequada, mas ele é motorista de ônibus, tem refeições irregulares e teme hipoglicemia ao volante. Ao perguntar o que o preocupa, o médico descobre o obstáculo real e negocia um esquema simplificado, horários e orientação sobre hipoglicemia.","trap":"Centrado na pessoa não significa aceitar qualquer pedido nem dispensar o diagnóstico: a conduta segue fundamentada tecnicamente e é negociada."},{"id":"a02-2","title":"Acolhimento, vínculo e responsabilização","paragraphs":["Acolher envolve escutar, reconhecer risco e vulnerabilidade e construir uma resposta. É uma postura de todo o serviço, inclusive quando a primeira ação é orientar ou encaminhar. Um encaminhamento responsável inclui explicar o motivo, combinar o próximo passo e prever retorno se houver piora ou falha no acesso.","O vínculo se consolida com continuidade e confiança. Responsabilizar-se é acompanhar o percurso dentro da própria competência e compartilhar decisões com a rede. A assinatura de um encaminhamento, por si só, não assegura continuidade."],"refs":["s80-10","s80-11","s80-12","s81-10","s81-12","s81-27","p83-12"],"figures":[],"q":[{"id":"a02-2-q1","aula":"a02","segment":"a02-2","prompt":"Um paciente sem consulta marcada chega com tosse há dois dias, sem sinais de gravidade. A recepção diz que só atende com agendamento. Qual conduta expressa acolhimento?","options":["Orientar a voltar na semana seguinte com horário marcado","Escutar a queixa, avaliar risco e vulnerabilidade e resolver ou combinar o próximo passo no próprio serviço","Pedir que retorne com um acompanhante","Encaminhar ao pronto-socorro sem avaliação"],"answer":1,"why":"Acolher é escutar, avaliar risco e construir resposta, mesmo sem agendamento prévio. Mandar embora sem avaliação não é acolhimento.","origin":null},{"id":"a02-2-q2","aula":"a02","segment":"a02-2","prompt":"Qual encaminhamento é considerado responsável?","options":["Não registrar no prontuário para evitar responsabilização","Encaminhar e considerar o caso encerrado","Explicar o motivo, combinar o próximo passo e orientar retorno se houver piora ou falha no acesso","Entregar o documento e pedir que o paciente procure o serviço por conta própria"],"answer":2,"why":"A assinatura do encaminhamento não assegura continuidade. O cuidado responsável inclui explicação, combinado e previsão de retorno.","origin":null}],"terms":["vínculo","responsabilização","acolhimento"],"keys":["Acolhimento é postura de todo o serviço, não um setor nem apenas uma triagem.","Inclui escuta, reconhecimento de risco e vulnerabilidade e construção de uma resposta.","Encaminhamento responsável: explica o motivo, combina o próximo passo e prevê retorno se houver piora ou falha no acesso.","Vínculo = continuidade e confiança; responsabilização = acompanhar o percurso dentro da própria competência."],"deep":["Acolhimento não é ser simpático nem atender todos sem critério: na PNH ele convive com a classificação de risco, que ordena o atendimento por gravidade e vulnerabilidade, e não por ordem de chegada. Escutar e responder pode significar resolver na hora, orientar, agendar ou encaminhar; o que não se pode é devolver a pessoa sem resposta. Na atenção primária, vínculo e longitudinalidade melhoram a detecção de problemas, a adesão e o uso racional de recursos."],"case":"Dona Lúcia chega à UBS com dor lombar, mas conta que o filho que a ajudava se mudou e que teme perder o emprego. A equipe avalia sinais de alerta, orienta analgesia, agenda retorno em uma semana, aciona a assistente social e registra quem é a referência. O encaminhamento saiu com motivo, prazo e canal de retorno.","trap":"Entregar a guia de encaminhamento não encerra a responsabilidade: se a pessoa não conseguiu a vaga, a falha continua sendo do cuidado."},{"id":"a02-3","title":"Três olhares da integralidade e tecnologias do cuidado","paragraphs":["Integralidade pode ser lida como atributo das práticas profissionais, da organização dos serviços e das respostas governamentais a necessidades de grupos específicos. Na prática clínica ela aparece quando a equipe reconhece necessidades além da queixa inicial. Na gestão aparece na articulação entre promoção, prevenção, assistência e reabilitação, com fluxo entre pontos da rede.","Tecnologias duras incluem equipamentos e estruturas. As leve-duras incluem saberes estruturados como epidemiologia e clínica. As leves são produzidas na relação, como escuta, vínculo e negociação. Um plano de cuidado costuma mobilizar os três tipos ao mesmo tempo."],"refs":["s80-07","s80-25","s81-28","s81-31","p83-19"],"figures":[],"q":[{"id":"a02-3-q1","aula":"a02","segment":"a02-3","prompt":"Qual par associa corretamente o tipo de tecnologia e o exemplo?","options":["Leve: aparelho de ressonância magnética","Leve-dura: saberes estruturados, como epidemiologia e clínica","Dura: vínculo e acolhimento","Leve-dura: sala de espera climatizada"],"answer":1,"why":"Leve-dura são saberes estruturados. Equipamentos são duras; vínculo e acolhimento são leves.","origin":null},{"id":"a02-3-q2","aula":"a02","segment":"a02-3","prompt":"Um paciente procura a UBS por hipertensão. Além de ajustar o anti-hipertensivo, a equipe percebe sofrimento por desemprego e oferece grupo de apoio e encaminhamento ao CRAS. Esse cuidado expressa principalmente:","options":["Uso exclusivo de tecnologias duras","Priorização da doença sobre o contexto","Integralidade na prática clínica, ao reconhecer necessidades além da queixa inicial","Fragmentação do cuidado por especialidade"],"answer":2,"why":"Reconhecer necessidades além da queixa e articular a rede caracteriza integralidade.","origin":null}],"terms":["integralidade","tecnologias leves"],"keys":["Integralidade: atributo das práticas, da organização dos serviços e das respostas governamentais.","Na clínica: reconhecer necessidades além da queixa inicial. Na gestão: articular promoção, prevenção, assistência e reabilitação.","Tecnologias duras (equipamentos), leve-duras (saberes estruturados) e leves (relações).","Um plano de cuidado costuma mobilizar os três tipos ao mesmo tempo."],"deep":["A classificação em tecnologias leve, leve-dura e dura vem de Emerson Merhy, no contexto do trabalho vivo em ato na saúde. A integralidade é também um princípio doutrinário do SUS, ao lado da universalidade e da equidade (Lei 8.080/1990). Os três olhares da integralidade (práticas, organização dos serviços e políticas) lembram que ela não se reduz a atender tudo: é responder ao conjunto de necessidades e articular os pontos da Rede de Atenção à Saúde."],"case":"Gestante de 17 anos com anemia faz pré-natal. A equipe prescreve sulfato ferroso (dura/leve-dura), investiga alimentação e rede de apoio, conversa sobre medos do parto (leve) e organiza vacinação, saúde bucal e retorno à escola, articulando UBS, maternidade e CRAS (integralidade na gestão).","trap":"Tecnologia leve não é menos técnica nem menos importante: é a que se produz no encontro. E integralidade não é pedir todos os exames."}],"review":"O encontro clínico e o sujeito → Acolhimento, vínculo e responsabilização → Três olhares da integralidade e tecnologias do cuidado"},{"id":"a03","number":3,"title":"Política Nacional de Humanização e políticas específicas","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a03-1","title":"Princípios e diretrizes do HumanizaSUS","paragraphs":["A PNH propõe transversalidade, indissociabilidade entre atenção e gestão e protagonismo, corresponsabilidade e autonomia dos sujeitos e coletivos. Transversalizar é aumentar a comunicação entre grupos e saberes. Indissociabilidade significa que a organização do trabalho altera diretamente a experiência de cuidado. Protagonismo exige participação real de usuários, gestores e trabalhadores.","Diretrizes como acolhimento, cogestão, ambiência, clínica ampliada, valorização do trabalhador e defesa dos direitos dos usuários traduzem os princípios em mudanças do cotidiano."],"refs":["s81-16","s81-30","p83-18","p83-24"],"figures":[],"q":[{"id":"a03-1-q1","aula":"a03","segment":"a03-1","prompt":"Qual descrição corresponde à transversalidade na PNH?","options":["Transferir pacientes entre níveis de atenção","Padronizar condutas sem participação dos trabalhadores","Separar equipes de gestão e de assistência","Aumentar o grau de comunicação entre grupos e saberes, reduzindo hierarquias rígidas"],"answer":3,"why":"Transversalizar é ampliar a comunicação intra e intergrupos. Separar gestão e assistência contraria a indissociabilidade.","origin":null},{"id":"a03-1-q2","aula":"a03","segment":"a03-1","prompt":"Gestores alteram o horário de visitas depois de uma reunião em que trabalhadores e usuários analisaram o problema e decidiram juntos. Esse é um exemplo de:","options":["Ambiência restrita à estrutura física","Cogestão","Clínica reduzida","Triagem de risco"],"answer":1,"why":"Compartilhar a análise e a decisão é a essência da cogestão.","origin":null}],"terms":["transversalidade","indissociabilidade","protagonismo"],"keys":["Princípios: transversalidade; indissociabilidade entre atenção e gestão; protagonismo, corresponsabilidade e autonomia.","Transversalizar é aumentar a comunicação entre grupos e saberes.","Indissociabilidade: a organização do trabalho altera a experiência de cuidado.","Diretrizes: acolhimento, cogestão, ambiência, clínica ampliada, valorização do trabalhador e defesa dos direitos dos usuários."],"deep":["A Política Nacional de Humanização (HumanizaSUS) foi lançada em 2003 e propõe a humanização como estratégia de qualificação da atenção e da gestão, não como campanha de gentileza. Seu método é a tríplice inclusão: de sujeitos, de analisadores sociais (conflitos, problemas) e de coletivos (redes). Os dispositivos (colegiado gestor, acolhimento com classificação de risco, PTS, visita aberta, entre outros) traduzem os princípios em prática."],"case":"Uma maternidade recebe queixas de atendimento frio. Em vez de treinar apenas simpatia, cria um colegiado gestor com trabalhadores e usuárias, revê fluxos de visita e disponibiliza cadeiras para acompanhantes. Isso une atenção e gestão (indissociabilidade), compartilha decisões (cogestão) e amplia a voz dos usuários (protagonismo).","trap":"Humanização na PNH não é apenas tratar bem: é mudar modos de gerir e de organizar o trabalho."},{"id":"a03-2","title":"Dispositivos, clínica ampliada e ambiência","paragraphs":["Cogestão compartilha análise de problemas e decisões. Ambiência considera conforto, privacidade, relações e organização do trabalho, além da estrutura física. Clínica ampliada considera dimensões biológicas, psíquicas e sociais e integra saberes na decisão.","O Projeto Terapêutico Singular pode reunir diagnóstico ampliado, metas pactuadas, divisão de responsabilidades e reavaliação. Em um caso complexo, explicitar profissional de referência e data de revisão ajuda a transformar a discussão em cuidado acompanhável."],"refs":["s81-11","s81-14","s81-15","s81-29","p83-16"],"figures":[],"q":[{"id":"a03-2-q1","aula":"a03","segment":"a03-2","prompt":"O que transforma a discussão de um caso complexo em cuidado acompanhável, no PTS?","options":["A decisão do profissional mais experiente, sem participação do usuário","Uma lista de exames solicitados","Metas pactuadas, profissional de referência definido e data de reavaliação","O encaminhamento ao especialista focal"],"answer":2,"why":"Metas, responsabilidades explícitas e reavaliação tornam o plano acompanhável.","origin":null},{"id":"a03-2-q2","aula":"a03","segment":"a03-2","prompt":"Uma enfermaria troca leitos coletivos sem cortinas por boxes com privacidade e reorganiza a rotina para reduzir o ruído noturno. Essa intervenção é melhor descrita como:","options":["Cogestão sem participação","Clínica ampliada isolada","Melhoria apenas estética","Ambiência"],"answer":3,"why":"Ambiência considera conforto, privacidade e organização do trabalho, não só a estrutura física.","origin":null}],"terms":["ambiência","cogestão","clínica ampliada","projeto terapêutico"],"keys":["Cogestão: análise de problemas e decisões compartilhadas.","Ambiência: conforto, privacidade, relações e organização do trabalho, além da estrutura física.","Clínica ampliada: dimensões biológica, psíquica e social, com integração de saberes.","PTS: diagnóstico ampliado, metas pactuadas, divisão de responsabilidades e reavaliação."],"deep":["O Projeto Terapêutico Singular costuma ser descrito em quatro momentos: diagnóstico (avaliação orgânica, psicológica e social, com vulnerabilidades e potencialidades), definição de metas negociadas com a pessoa, divisão de responsabilidades (quem faz o quê) e reavaliação. É especialmente útil em casos complexos e na saúde mental. A ambiência é pensada em três eixos: o espaço que favorece privacidade e conforto, o espaço como ferramenta do processo de trabalho e o espaço como lugar de encontro entre sujeitos."],"case":"Na ESF, uma idosa acamada com úlcera por pressão e cuidadora exausta é discutida por médico, enfermeira, agente comunitário, fisioterapeuta e assistente social. Definem metas (curativo, colchão, revezamento de cuidado), a enfermeira como profissional de referência e reavaliação em 15 dias.","trap":"O PTS não é um formulário preenchido por um profissional: é construído em equipe, com a pessoa, e tem data de reavaliação."},{"id":"a03-3","title":"Equidade e políticas específicas","paragraphs":["Equidade responde a barreiras desiguais de acesso. Políticas específicas ajudam a identificar barreiras ligadas a racismo, capacitismo, transfobia, situação de rua e vulnerabilidades por fase da vida. São exemplos de aplicação respeitar nome social, garantir comunicação acessível e articular o cuidado no território.","Na prova, procure o mecanismo que bloqueia o acesso. Uma regra uniforme pode produzir desigualdade se pressupõe endereço estável, disponibilidade de acompanhante ou capacidade de ler um formulário. A resposta deve remover a barreira e manter a pessoa inserida na rede."],"refs":["s80-28","s81-13","p83-08","p83-09"],"figures":[],"q":[{"id":"a03-3-q1","aula":"a03","segment":"a03-3","prompt":"Uma mulher trans é chamada pelo nome de registro na recepção e deixa de voltar à UBS. Qual medida reduz essa barreira?","options":["Exigir justificativa documental para o uso do nome social","Respeitar o nome social nas chamadas e nos registros, orientando toda a equipe","Manter o nome de registro por padronização","Atendê-la apenas em horário separado da rotina"],"answer":1,"why":"Respeitar o nome social é medida concreta de equidade e de acolhimento.","origin":null},{"id":"a03-3-q2","aula":"a03","segment":"a03-3","prompt":"Uma UBS exige comprovante de residência para cadastrar usuários. Qual é o principal problema do ponto de vista da equidade?","options":["Ausência de classificação de risco","Excesso de zelo administrativo sem efeito sobre o acesso","Violação da diretriz de ambiência","Regra uniforme que pressupõe endereço estável e bloqueia o acesso de pessoas em situação de rua"],"answer":3,"why":"Uma regra igual para todos pode gerar desigualdade quando pressupõe condições que nem todos têm.","origin":null}],"terms":["população negra","situação de rua","lgbt","deficiência","equidade","idosa","pnaisc"],"keys":["Equidade responde a barreiras desiguais de acesso.","Políticas específicas ajudam a identificar barreiras ligadas a racismo, capacitismo, transfobia, situação de rua e fases da vida.","Exemplos: respeitar o nome social, garantir comunicação acessível, articular o cuidado no território.","Na prova, procure o mecanismo que bloqueia o acesso e escolha a resposta que o remove."],"deep":["Entre as políticas específicas estão a Política Nacional de Saúde Integral da População Negra (2009), a Política Nacional de Saúde Integral de Lésbicas, Gays, Bissexuais, Travestis e Transexuais (2011), a Política Nacional de Atenção Integral à Saúde da Criança, a PNAISC (2015), a Política Nacional de Saúde da Pessoa Idosa e a Política Nacional para a População em Situação de Rua (Decreto 7.053/2009). Equidade difere de igualdade: tratar todos de modo idêntico pode manter desigualdades; equidade distribui atenção conforme as necessidades."],"case":"Um homem em situação de rua com tuberculose precisa de seis meses de tratamento, mas a unidade só cadastra quem comprova endereço. A resposta equitativa é cadastrar sem comprovante, oferecer tratamento diretamente observado em local acessível e articular Consultório na Rua e assistência social.","trap":"Equidade não é privilégio: é remover barreiras para que o acesso seja de fato possível."}],"review":"Princípios e diretrizes do HumanizaSUS → Dispositivos, clínica ampliada e ambiência → Equidade e políticas específicas"},{"id":"a04","number":4,"title":"Introdução à comunicação","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a04-1","title":"Mensagem, canal e ruído","paragraphs":["Comunicação envolve emissor, mensagem, canal, receptor, código e contexto. O receptor interpreta a mensagem a partir de repertório e expectativas. Mesmo uma orientação tecnicamente correta pode falhar por ruído ambiental, jargão, instruções contraditórias ou ansiedade.","O retorno do interlocutor mostra como a mensagem foi recebida. Ao pedir que explique com as próprias palavras, o profissional avalia a clareza da sua orientação e pode ajustá-la no mesmo encontro."],"refs":["s80-17","s80-18","s81-18","s81-19","p83-15","p83-23"],"figures":[],"q":[{"id":"a04-1-q1","aula":"a04","segment":"a04-1","prompt":"Depois de explicar a posologia, o médico pergunta 'entendeu tudo?' e a paciente diz que sim. Qual conduta verifica melhor a compreensão?","options":["Considerar entendido, pois ela concordou","Entregar um folheto e encerrar","Pedir que explique, com as próprias palavras, como tomará os remédios","Repetir a explicação mais rápido"],"answer":2,"why":"Pedir que a pessoa reformule a orientação avalia a clareza e permite ajuste no mesmo encontro.","origin":null},{"id":"a04-1-q2","aula":"a04","segment":"a04-1","prompt":"Uma orientação correta falha porque foi dada em corredor barulhento, com termos técnicos. Esses fatores correspondem a:","options":["Feedback adequado","Código compartilhado","Ruído ambiental e semântico na comunicação","Canal ideal"],"answer":2,"why":"Barulho e jargão interferem na recepção da mensagem: são ruídos.","origin":null}],"terms":["emissor","receptor","ruído","canal"],"keys":["Elementos: emissor, mensagem, canal, receptor, código e contexto.","O receptor interpreta a partir de repertório e expectativas.","Uma orientação correta pode falhar por ruído, jargão, instruções contraditórias ou ansiedade.","Feedback: peça que a pessoa explique com as próprias palavras (teach-back)."],"deep":["O teach-back (pedir que a pessoa repita a orientação com as próprias palavras) é recomendado para confirmar compreensão, sobretudo quando a literacia em saúde é baixa. Prefira 'como você explicaria isso em casa?' a 'entendeu?', pois a segunda tende a receber um 'sim' por educação. O ruído pode ser físico (barulho), semântico (jargão), psicológico (ansiedade) ou fisiológico (dor, fome)."],"case":"O médico explica a insuficiência cardíaca com 'edema', 'congestão' e 'fração de ejeção' e pergunta 'ficou claro?'. A paciente assente, mas não se pesa em casa. Na consulta seguinte ele usa 'inchaço' e 'água acumulada' e pede que ela diga como saberá que está piorando.","trap":"'Entendeu?' costuma gerar um 'sim' automático. Verifique pedindo que a pessoa explique."},{"id":"a04-2","title":"Comunicação verbal e não verbal","paragraphs":["Palavras organizam conteúdo. Ritmo, volume, pausas, expressão facial e postura modulam a relação e podem contradizer a fala. Silêncio pode sinalizar processamento, medo ou desejo de interromper. A maneira mais segura de interpretar é verificar a percepção com uma pergunta respeitosa.","Uma conversa sobre adesão pode começar com linguagem simples e pergunta aberta, depois usar perguntas fechadas para esclarecer detalhes. Concluir com resumo e checagem de entendimento reduz ambiguidades."],"refs":["s80-14","s80-16","s81-17","p80-01","p83-13"],"figures":[],"q":[{"id":"a04-2-q1","aula":"a04","segment":"a04-2","prompt":"Uma paciente diz que está bem, mas chora e evita o olhar. Qual é a melhor conduta?","options":["Aceitar a fala e seguir o roteiro","Ignorar o choro para não constrangê-la","Concluir que ela está mentindo e confrontá-la","Verificar a percepção com uma pergunta respeitosa sobre o que o profissional observou"],"answer":3,"why":"A forma mais segura de interpretar sinais não verbais é checar com uma pergunta respeitosa.","origin":null},{"id":"a04-2-q2","aula":"a04","segment":"a04-2","prompt":"Em uma conversa sobre adesão, qual sequência de perguntas costuma funcionar melhor?","options":["Começar com pergunta aberta, depois usar fechadas para detalhar e concluir com resumo e checagem","Usar apenas perguntas fechadas","Usar apenas perguntas abertas, sem resumo","Começar por perguntas fechadas e dispensar o resumo"],"answer":0,"why":"Abertas exploram a perspectiva, fechadas esclarecem detalhes e o resumo reduz ambiguidades.","origin":null}],"terms":["não verbal","paralinguagem","linguagem corporal"],"keys":["O verbal organiza o conteúdo; ritmo, volume, pausas, expressão facial e postura modulam a relação e podem contradizer a fala.","Silêncio pode ser processamento, medo ou desejo de interromper.","Verifique a percepção com uma pergunta respeitosa em vez de supor.","Comece com pergunta aberta, esclareça com perguntas fechadas e conclua com resumo e checagem."],"deep":["Paralinguagem engloba tom, ritmo, volume e pausas; cinésica, os gestos e a postura; proxêmica, a distância entre as pessoas; e háptica, o toque. Quando o verbal e o não verbal se contradizem, o interlocutor tende a confiar mais no não verbal. Cuidado com o mito de que 93% da comunicação é não verbal, uma leitura equivocada de estudos de Mehrabian sobre sentimentos e atitudes. Atitudes úteis: sentar na altura do paciente, olhar sem fixar e evitar digitar o tempo todo."],"case":"Ao ouvir o diagnóstico de hipertensão, a paciente diz 'tudo bem, doutor', mas cruza os braços e responde baixinho. Em vez de seguir a prescrição, ele diz: 'Percebi que a notícia pareceu pesada. O que está pensando?'. Ela revela medo de um AVC como o do pai.","trap":"Não leia mentes: um gesto isolado é hipótese, não conclusão. Cheque com uma pergunta."}],"review":"Mensagem, canal e ruído → Comunicação verbal e não verbal"},{"id":"a05","number":5,"title":"Comunicação com paciente, acompanhante e família","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a05-1","title":"Agenda, perspectiva e aliança","paragraphs":["A entrevista começa abrindo espaço para o motivo do encontro e as preocupações. Uma pergunta aberta seguida de síntese ajuda a definir a agenda compartilhada. Explorar ideias, expectativas e impacto funcional permite explicar a hipótese e pactuar um plano compatível com o cotidiano.","Quando o encontro é difícil, avalie a interação. Dor, falta de confiança, experiências anteriores e expectativas divergentes podem explicar resistência. Reconheça a emoção, peça exemplos e negocie uma meta possível antes de atribuir intenção ao paciente."],"refs":["s80-09","s80-13","s81-07","s81-08","s81-09"],"figures":[],"q":[{"id":"a05-1-q1","aula":"a05","segment":"a05-1","prompt":"O paciente chega dizendo 'já fui a cinco médicos e ninguém resolve'. Qual primeira resposta é mais adequada?","options":["Reconhecer a emoção e pedir exemplos do que ocorreu antes de propor condutas","Atribuir a queixa à ansiedade","Explicar que as condutas anteriores foram adequadas e que ele deve confiar","Exigir o prontuário de todos os médicos antes de começar"],"answer":0,"why":"Reconhecer a emoção e explorar a experiência prévia constrói aliança antes de qualquer proposta.","origin":null},{"id":"a05-1-q2","aula":"a05","segment":"a05-1","prompt":"Qual sequência favorece a construção de uma agenda compartilhada?","options":["Solicitar exames antes de ouvir o paciente","Pergunta aberta, escuta, síntese e confirmação das demandas antes de aprofundar","Ir direto ao exame físico","Priorizar somente a primeira queixa citada"],"answer":1,"why":"A síntese e a confirmação das demandas definem a agenda de forma compartilhada.","origin":null}],"terms":["relação médico","paciente difícil","comunicação clínica","biopsicossocial"],"keys":["Abra com pergunta aberta e faça uma síntese para definir a agenda compartilhada.","Explore ideias, preocupações, expectativas e impacto funcional antes de explicar e pactuar.","No encontro difícil, avalie a interação: dor, desconfiança, experiências prévias, expectativas divergentes.","Reconheça a emoção, peça exemplos e negocie uma meta possível antes de atribuir intenção."],"deep":["Um roteiro prático explora as ideias do paciente sobre o que está acontecendo, suas preocupações e suas expectativas, além do impacto na funcionalidade. O modelo Calgary-Cambridge organiza a consulta em iniciar, coletar informações, explicar e planejar e encerrar, com construção da relação como eixo contínuo. Rótulos como 'paciente difícil' deslocam o problema para a pessoa; muitas vezes o difícil é o encontro. O mnemônico NURSE (nomear, entender, respeitar, apoiar, explorar) ajuda a responder a emoções."],"case":"Paciente com lombalgia crônica chega irritado: 'ninguém resolve nada'. O médico diz: 'Parece que você passou por muita coisa sem alívio. Pode me contar o que mais te atrapalha no dia a dia?'. Descobre medo de perder o emprego e a expectativa de uma ressonância. Pactuam retomar meio período de trabalho com fisioterapia e retorno em duas semanas.","trap":"Rotular o paciente como 'difícil' ou 'poliqueixoso' interrompe a investigação."},{"id":"a05-2","title":"Autonomia, sigilo e participação familiar","paragraphs":["Com a pessoa capaz, confirme quem ela quer na conversa e quais informações autoriza compartilhar. Fale com o paciente diretamente, mesmo quando o acompanhante tem informações importantes. Ofereça oportunidade de conversar em particular quando for necessário.","Família e acompanhantes podem ajudar a lembrar informações, executar o plano e reconhecer sinais de alerta. A equipe precisa distinguir essas contribuições da decisão que cabe ao paciente. Ao final, verifique compreensão, combine responsabilidades e indique um canal de retorno."],"refs":["s80-13","s81-13","p83-20","p83-21"],"figures":[],"q":[{"id":"a05-2-q1","aula":"a05","segment":"a05-2","prompt":"Um idoso lúcido vem com a filha, que responde por ele. Qual conduta é adequada?","options":["Informar o diagnóstico à filha antes de ao paciente","Dirigir-se ao paciente, perguntar quem ele deseja presente e quais informações autoriza compartilhar","Pedir que a filha saia sem consultá-lo","Conversar só com a filha para ganhar tempo"],"answer":1,"why":"A pessoa capaz decide quem participa e o que é compartilhado.","origin":null},{"id":"a05-2-q2","aula":"a05","segment":"a05-2","prompt":"O marido de uma paciente adulta e capaz telefona pedindo o resultado dos exames dela. Qual conduta respeita o sigilo?","options":["Entregar o resultado ao marido na próxima consulta","Informar, pois ele é familiar","Informar apenas se o resultado for normal","Compartilhar somente se a paciente autorizar, oferecendo a ela conversar com ele"],"answer":3,"why":"Sem autorização, o sigilo se mantém, independentemente do parentesco ou do resultado.","origin":null}],"terms":["acompanhante","família","confidencialidade","sigilo"],"keys":["Com a pessoa capaz, confirme quem ela quer na conversa e o que autoriza compartilhar.","Fale diretamente com o paciente, mesmo quando o acompanhante tem informações importantes.","Ofereça conversa a sós quando necessário.","A família ajuda a lembrar, executar o plano e reconhecer sinais de alerta, mas a decisão é do paciente capaz.","Feche verificando compreensão, combinando responsabilidades e indicando um canal de retorno."],"deep":["O sigilo é dever ético (Código de Ética Médica, capítulo sobre sigilo profissional) e só se rompe por dever legal, justa causa ou autorização do paciente. Com adolescentes, a conversa a sós faz parte da consulta e a confidencialidade tem limites, como risco grave para si ou para terceiros e situações de violência. Quando a capacidade está reduzida, preserve a participação possível da pessoa (assentimento) e envolva o representante nas decisões."],"case":"A filha acompanha o pai de 78 anos e responde por ele. O médico cumprimenta os dois, pergunta ao pai se quer a filha na consulta e o que pode ser comentado, e escuta-o diretamente. Depois, a filha informa quedas recentes, o que o médico incorpora e confirma com o pai.","trap":"Falar só com o acompanhante 'por praticidade' apaga a voz do paciente capaz."}],"review":"Agenda, perspectiva e aliança → Autonomia, sigilo e participação familiar"},{"id":"a06","number":6,"title":"Comunicação interprofissional","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a06-1","title":"Papéis complementares e plano compartilhado","paragraphs":["Reunir profissões diferentes cria potencial para cuidado abrangente. O trabalho interprofissional exige troca de informações, decisões compartilhadas e metas centradas no paciente. Uma equipe que atende em paralelo pode produzir condutas incompatíveis mesmo quando cada profissional atua bem individualmente.","No plano compartilhado, registre necessidade, objetivo, responsável e prazo. Se houver divergência, explicite a preocupação e confirme a decisão com a equipe. Competência profissional, organização do serviço e necessidade da pessoa orientam a distribuição de tarefas."],"refs":["s80-19","s80-20","s81-20","s81-21","s81-22"],"figures":[],"q":[{"id":"a06-1-q1","aula":"a06","segment":"a06-1","prompt":"Qual situação caracteriza trabalho interprofissional?","options":["A equipe discute o caso, define metas centradas no paciente e divide responsabilidades","O médico decide e os demais apenas executam, sem discussão","Cada profissional atende e registra no seu prontuário sem trocar informações","Os pacientes passam em sequência por cada profissional, sem contato entre eles"],"answer":0,"why":"Interprofissionalidade exige troca de informações, decisões compartilhadas e metas centradas no paciente.","origin":null},{"id":"a06-1-q2","aula":"a06","segment":"a06-1","prompt":"Dois profissionais divergem sobre uma conduta. Qual atitude é mais adequada?","options":["Seguir sem comentar para evitar conflito","Explicitar a preocupação e confirmar a decisão com a equipe, registrando o combinado","Adiar a decisão sem prazo","Decidir pela hierarquia sem ouvir"],"answer":1,"why":"Explicitar a preocupação e confirmar a decisão reduz risco e preserva a relação da equipe.","origin":null}],"terms":["interprofissional","multiprofissional","trabalho em equipe"],"keys":["Multiprofissional: várias profissões atuam lado a lado. Interprofissional: trocam informações, decidem juntas e têm metas centradas no paciente.","Atendimento em paralelo pode produzir condutas incompatíveis, mesmo que cada profissional atue bem.","Plano compartilhado: necessidade, objetivo, responsável e prazo.","Em divergência, explicite a preocupação e confirme a decisão com a equipe."],"deep":["A OMS fala em prática colaborativa quando profissionais de diferentes áreas prestam cuidado integral trabalhando com pacientes, famílias e comunidades. Os domínios de competência colaborativa (CIHC) incluem comunicação interprofissional, cuidado centrado no paciente e na família, esclarecimento de papéis, funcionamento da equipe, liderança colaborativa e resolução de conflitos. Na prova, 'multi' costuma indicar justaposição de saberes, e 'inter' indica interação e integração."],"case":"Um paciente pós-AVC recebe fisioterapia, fonoaudiologia e nutrição com metas separadas. A nutricionista prescreve dieta pastosa enquanto a fonoaudióloga liberou líquidos. Em reunião, a equipe fixa uma meta única (alimentação segura por via oral), a responsável (fono) e o prazo de uma semana.","trap":"Várias profissões atendendo não é, por si só, interprofissionalidade."},{"id":"a06-2","title":"Segurança, passagem de caso e comunicação em circuito fechado","paragraphs":["Passagens de plantão e transições precisam destacar situação atual, histórico relevante, avaliação e recomendação. O SBAR ajuda a organizar essa sequência. Uma transferência segura inclui pendências, responsáveis e sinais que exigem reavaliação.","No circuito fechado, quem recebe repete a mensagem crítica e quem enviou confirma ou corrige. A confirmação ativa reduz risco quando há pressão, ruído ou nomes de medicamentos parecidos. O prontuário permite recuperar a informação, mas urgências exigem comunicação oportuna."],"refs":["s80-21","s81-23"],"figures":[],"q":[{"id":"a06-2-q1","aula":"a06","segment":"a06-2","prompt":"Qual sequência corresponde ao SBAR?","options":["Segurança, base, alta, referência","Sintomas, bioquímica, anamnese, resultados","Situação, resultados, ação, retorno","Situação, histórico, avaliação, recomendação"],"answer":3,"why":"SBAR = Situation, Background, Assessment, Recommendation.","origin":null},{"id":"a06-2-q2","aula":"a06","segment":"a06-2","prompt":"Em uma urgência, o médico diz verbalmente 'hidralazina 10 mg' e a enfermeira repete 'hidroxizina 10 mg'. Qual conduta completa o circuito fechado?","options":["Administrar e registrar depois","O emissor corrige e a enfermeira repete a ordem correta antes de administrar","Administrar a que parecer mais usada","Considerar que o silêncio indica concordância"],"answer":1,"why":"No circuito fechado, a repetição é confirmada ou corrigida pelo emissor antes da execução. Nomes parecidos tornam esse passo essencial.","origin":null}],"terms":["passagem","segurança do paciente","sbar","transferência"],"keys":["SBAR: Situação, Histórico (background), Avaliação e Recomendação.","Transferência segura inclui pendências, responsáveis e sinais que exigem reavaliação.","Circuito fechado: quem recebe repete a mensagem crítica e quem enviou confirma ou corrige.","O prontuário recupera a informação, mas urgências exigem comunicação oportuna."],"deep":["No SBAR, a Situação responde 'o que está acontecendo agora?', o Histórico traz o contexto clínico relevante, a Avaliação é o que você pensa que é o problema e sua gravidade, e a Recomendação é o que você precisa e em quanto tempo. O circuito fechado tem três passos: mensagem, repetição pelo receptor (read-back) e confirmação pelo emissor. Prescrições verbais e medicamentos com nomes parecidos (look-alike/sound-alike) são cenários clássicos de erro. A comunicação efetiva é uma das metas de segurança do paciente."],"case":"No plantão noturno, a enfermeira liga: 'Leito 12, Sr. João, 68 anos, com dispneia e saturação de 88% (S). Internado há 3 dias por pneumonia, em uso de ceftriaxona (B). Acho que está piorando, FR 28 (A). Preciso que venha avaliar agora e considere gasometria (R)'. O médico repete: 'Avaliar o leito 12 agora e gasometria, correto?'.","trap":"Registrar no prontuário não substitui avisar quem precisa agir agora."}],"review":"Papéis complementares e plano compartilhado → Segurança, passagem de caso e comunicação em circuito fechado"},{"id":"a07","number":7,"title":"Comunicação não violenta","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a07-1","title":"Observação e sentimento","paragraphs":["Na CNV, observação descreve fato situado e verificável. Dizer que o relatório chegou depois do horário combinado deixa espaço para examinar o ocorrido. Chamar o colega de irresponsável transforma o fato em julgamento sobre a pessoa.","Sentimento nomeia a experiência própria, como preocupação, frustração ou medo. Dizer que se sente ignorado pode já trazer uma interpretação da intenção alheia. O exercício é separar acontecimento, emoção e leitura da situação."],"refs":["s80-03","s81-01","s81-02","s81-03"],"figures":[],"q":[{"id":"a07-1-q1","aula":"a07","segment":"a07-1","prompt":"Qual frase é uma observação, no sentido da CNV?","options":["Você nunca respeita a equipe","O relatório chegou às 19h, depois do horário combinado","Você é irresponsável com os prazos","Você me desrespeitou de propósito"],"answer":1,"why":"Observação descreve fato situado e verificável. As demais trazem julgamento ou atribuição de intenção.","origin":null},{"id":"a07-1-q2","aula":"a07","segment":"a07-1","prompt":"Qual alternativa expressa um sentimento, e não uma interpretação?","options":["Sinto que fui traído","Sinto que você me ignora","Sinto que você não liga para a equipe","Estou preocupado com o paciente"],"answer":3,"why":"Preocupação é experiência própria. As outras carregam uma leitura da intenção do outro.","origin":null}],"terms":["observação","sentimento","comunicação não violenta","rosenberg"],"keys":["Observação: fato situado e verificável, sem julgamento.","Sentimento: nomeia a experiência própria, como preocupação, frustração ou medo.","'Sinto-me ignorado' pode trazer uma interpretação da intenção alheia.","O exercício é separar acontecimento, emoção e leitura da situação."],"deep":["A Comunicação Não Violenta, de Marshall Rosenberg, tem quatro componentes: observação, sentimento, necessidade e pedido. Na prática, é preciso distinguir sentimento de pensamento disfarçado: 'sinto que você não liga' é avaliação; 'sinto-me preocupado' é sentimento. Palavras como 'sempre' e 'nunca' costumam indicar avaliação, não observação. O modelo é útil para feedback entre colegas e conflitos de equipe, mas não é fórmula a ser recitada: o tom e a intenção importam."],"case":"Em vez de 'você é irresponsável, sempre atrasa o relatório', o residente diz: 'O relatório de ontem chegou às 19h, depois do horário combinado. Fiquei preocupado com a passagem de plantão'. A primeira frase é julgamento; a segunda, observação e sentimento.","trap":"'Eu sinto que você...' geralmente anuncia um julgamento disfarçado de sentimento."},{"id":"a07-2","title":"Necessidade, pedido e escuta empática","paragraphs":["Necessidade explica o que está em jogo, como segurança, previsibilidade ou apoio. Pedido traduz essa necessidade numa ação concreta, possível e formulada positivamente. Perguntar se a pessoa consegue avisar antes do fim do turno permite resposta e negociação.","Quando a recusa é recebida com culpa ou ameaça, o pedido opera como exigência. Escutar empaticamente é tentar entender sentimentos e necessidades do outro, checar a hipótese e negociar alternativas sem dispensar limites e responsabilidade."],"refs":["s80-01","s80-02","s81-02","s81-03"],"figures":[],"q":[{"id":"a07-2-q1","aula":"a07","segment":"a07-2","prompt":"Qual formulação é um pedido, no sentido da CNV?","options":["Você consegue me avisar antes do fim do turno se houver pendência?","Nunca mais me deixe sem informação","Quero que pare de me ignorar","Preciso que você seja mais responsável"],"answer":0,"why":"Pedido é concreto, possível e positivo. As demais são vagas, negativas ou acusatórias.","origin":null},{"id":"a07-2-q2","aula":"a07","segment":"a07-2","prompt":"O colega responde 'não consigo' ao pedido. Qual atitude é coerente com a CNV?","options":["Escutar sentimentos e necessidades dele, checar a hipótese e negociar uma alternativa","Insistir, lembrando que é obrigação dele","Acusá-lo de falta de compromisso","Retirar o pedido e abrir mão do limite"],"answer":0,"why":"A escuta empática busca entender e negociar sem dispensar limites.","origin":null}],"terms":["necessidade","pedido","exigência","empatia"],"keys":["Necessidade explica o que está em jogo: segurança, previsibilidade, apoio.","Pedido traduz a necessidade em ação concreta, possível e formulada de modo positivo.","Se a recusa gera culpa ou ameaça, o pedido operou como exigência.","Escuta empática: entender sentimentos e necessidades, checar a hipótese e negociar alternativas, sem abrir mão de limites e responsabilidades."],"deep":["Necessidades (segurança, previsibilidade, autonomia, respeito) são diferentes de estratégias: avisar antes do fim do turno é uma estratégia para atender à necessidade de previsibilidade, e pode haver outras. Um bom pedido é concreto, possível, no presente e em linguagem positiva ('você pode avisar...?' em vez de 'não me deixe sem aviso'). Empatia não é concordar nem aconselhar de imediato: é presença atenta ao que o outro vive."],"case":"A enfermeira ao técnico: 'Quando o soro do leito 4 passa do horário sem aviso, fico apreensiva, porque preciso de segurança na infusão. Você pode me avisar quando faltarem 15 minutos?'. Se ele diz que não consegue, ela pergunta o que dificulta e negociam outra alternativa.","trap":"Se um 'não' provoca represália ou culpa, foi exigência, e não pedido."}],"review":"Observação e sentimento → Necessidade, pedido e escuta empática"},{"id":"a08","number":8,"title":"Cuidados paliativos","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a08-1","title":"Indicação precoce e sofrimento multidimensional","paragraphs":["Cuidados paliativos podem começar cedo, em paralelo ao tratamento modificador da doença, conforme necessidades. Avaliam sofrimento físico, psicológico, social e espiritual e incluem apoio a familiares e cuidadores. O objetivo é qualidade de vida com cuidado proporcional e coordenado.","Dor total é uma formulação clínica para entender como sintomas, medo, perdas e relações se influenciam. Tratar apenas a dimensão física pode deixar sofrimento relevante sem abordagem. Avalie prioridades da pessoa, condições no domicílio e apoio da rede."],"refs":["s80-05","s80-06","s81-05","s81-06"],"figures":[],"q":[{"id":"a08-1-q1","aula":"a08","segment":"a08-1","prompt":"Qual afirmativa sobre cuidados paliativos está correta?","options":["Restringem-se aos últimos dias de vida","Só devem ser iniciados quando cessa todo tratamento específico","Atendem apenas à dor física","Podem começar cedo, em paralelo ao tratamento modificador da doença, conforme as necessidades"],"answer":3,"why":"Os CP são indicados conforme a necessidade, inclusive em paralelo ao tratamento modificador.","origin":null},{"id":"a08-1-q2","aula":"a08","segment":"a08-1","prompt":"Um homem com câncer avançado tem dor persistente mesmo após ajuste do opioide e relata medo de morrer, preocupação financeira e afastamento do filho. Qual interpretação é mais adequada?","options":["Exagero da queixa, bastando aumentar a dose","Dor total: dimensões física, psicológica, social e espiritual se influenciam e precisam ser abordadas","Problema exclusivamente psiquiátrico","Caso sem indicação de cuidados paliativos"],"answer":1,"why":"Tratar só a dimensão física deixa sofrimento relevante sem abordagem. É o conceito de dor total.","origin":null}],"terms":["cuidados paliativos","sofrimento","dor total"],"keys":["Cuidados paliativos (CP) podem começar cedo, em paralelo ao tratamento modificador da doença.","Avaliam sofrimento físico, psicológico, social e espiritual e incluem apoio a familiares e cuidadores.","Dor total: sintomas, medo, perdas e relações se influenciam.","Objetivo: qualidade de vida com cuidado proporcional e coordenado."],"deep":["A OMS define cuidados paliativos como a abordagem que melhora a qualidade de vida de pacientes e famílias diante de doença que ameaça a vida, por meio da prevenção e do alívio do sofrimento. A Política Nacional de Cuidados Paliativos (Portaria GM/MS 3.681/2024) os integra ao SUS. O conceito de dor total é de Cicely Saunders, fundadora do movimento hospice moderno. Instrumentos usados na prática: escala PPS (Palliative Performance Scale), ESAS para sintomas e a 'pergunta surpresa'. A escada analgésica da OMS e o uso adequado de opioides têm papel central."],"case":"Mulher de 58 anos com câncer de pâncreas em quimioterapia tem dor, insônia, culpa por 'ser um fardo' e conflito com o filho. Cuidados paliativos precoces: ajuste do opioide, avaliação do sono, apoio psicossocial e espiritual, reunião familiar e definição de metas. A quimioterapia continua: CP não significa suspender o tratamento.","trap":"Cuidados paliativos não são sinônimo de 'não há mais nada a fazer' nem se limitam aos últimos dias."},{"id":"a08-2","title":"Proporcionalidade, tipos de morte e bioética","paragraphs":["Ortotanásia respeita o curso da morte com alívio do sofrimento. Distanásia prolonga o processo de morrer com intervenções desproporcionais. Eutanásia designa ação intencional para causar a morte. Na discussão de caso, procure objetivo, benefício esperado, ônus e intenção da intervenção.","Autonomia, beneficência, não maleficência e justiça ajudam a estruturar a deliberação. Limitar um tratamento desproporcional precisa vir acompanhado de plano explícito de cuidado, controle de sintomas, apoio e reavaliação."],"refs":["s80-04","s81-04"],"figures":[],"q":[{"id":"a08-2-q1","aula":"a08","segment":"a08-2","prompt":"Qual alternativa descreve a distanásia?","options":["Interrupção de todo cuidado ao paciente","Ação intencional para antecipar a morte","Respeito ao curso natural da morte, com alívio do sofrimento","Prolongamento do processo de morrer com intervenções desproporcionais e sem benefício"],"answer":3,"why":"Distanásia é a obstinação terapêutica. Ação intencional para causar a morte é eutanásia.","origin":null},{"id":"a08-2-q2","aula":"a08","segment":"a08-2","prompt":"Em um paciente com doença avançada, a equipe decide não realizar nova reanimação invasiva e mantém analgesia, apoio à família e reavaliação diária. Qual conceito se aplica?","options":["Ortotanásia, com limitação proporcional e plano de cuidado","Distanásia","Eutanásia ativa","Omissão de socorro sem plano"],"answer":0,"why":"A limitação proporcional acompanhada de plano de cuidado, controle de sintomas e apoio caracteriza a ortotanásia.","origin":null}],"terms":["ortotanásia","distanásia","eutanásia","autonomia","bioética"],"keys":["Ortotanásia: respeita o curso da morte com alívio do sofrimento.","Distanásia: prolonga o processo de morrer com intervenções desproporcionais.","Eutanásia: ação intencional para causar a morte.","Autonomia, beneficência, não maleficência e justiça estruturam a deliberação.","Limitar tratamento desproporcional exige plano explícito de cuidado, controle de sintomas, apoio e reavaliação."],"deep":["No Brasil, o Código de Ética Médica veda abreviar a vida do paciente (art. 41) e, em doença incurável e terminal, orienta oferecer cuidados paliativos sem ações diagnósticas ou terapêuticas inúteis ou obstinadas, considerando a vontade do paciente. A Resolução CFM 1.995/2012 trata das diretivas antecipadas de vontade. Na deliberação, pergunte: qual o objetivo da intervenção, qual o benefício esperado, qual o ônus (efeitos adversos e sofrimento) e quais os valores do paciente? Não iniciar ou suspender tratamento fútil não é eutanásia: a causa da morte continua sendo a doença."],"case":"Idoso com demência avançada e pneumonias recorrentes, em UTI com ventilação e diálise, sem melhora há semanas. Após reunião com a família, a equipe decide não escalar novas invasões e manter conforto, analgesia, higiene, presença da família e reavaliação diária. Isso é ortotanásia (proporcionalidade), não eutanásia.","trap":"Não escalar ou retirar suporte desproporcional não é eutanásia: o que distingue é a intenção e a proporcionalidade, com cuidado mantido."}],"review":"Indicação precoce e sofrimento multidimensional → Proporcionalidade, tipos de morte e bioética"},{"id":"a09","number":9,"title":"Comunicação de más notícias","lead":"Estude os conceitos e abra as referências de prova nos trechos grifados.","sections":[{"id":"a09-1","title":"SPIKES: preparação, percepção e convite","paragraphs":["Uma má notícia é aquela que altera negativamente a visão de futuro da pessoa. No SPIKES, Setting organiza privacidade, tempo e acompanhantes autorizados. Perception explora o que a pessoa já compreendeu. Invitation pergunta o quanto deseja saber e como prefere receber a informação.","Esses passos evitam informar com base em suposições. Se a pessoa não quiser detalhes naquele momento, combine como retomar a conversa e avalie quais informações ainda são necessárias para uma decisão imediata."],"refs":["s80-23","s81-26"],"figures":[],"q":[{"id":"a09-1-q1","aula":"a09","segment":"a09-1","prompt":"Qual pergunta corresponde à etapa Perception do SPIKES?","options":["O senhor prefere que eu repita o diagnóstico?","Posso contar o diagnóstico agora?","O que o senhor já entendeu sobre o que está acontecendo com a sua saúde?","O senhor quer que eu ligue para a família?"],"answer":2,"why":"Perception explora o que a pessoa já compreende antes de informar.","origin":null},{"id":"a09-1-q2","aula":"a09","segment":"a09-1","prompt":"Após a preparação, o paciente diz que prefere que a filha receba os detalhes. Qual conduta condiz com a etapa Invitation?","options":["Insistir em dar os detalhes porque é seu dever","Omitir definitivamente a informação","Respeitar a preferência, combinar como retomar a conversa e avaliar quais informações são necessárias para decisões imediatas","Informar apenas a filha sem pactuar com ele"],"answer":2,"why":"Invitation respeita quanto e como a pessoa deseja saber, sem deixar de verificar o que é necessário para decidir.","origin":null}],"terms":["spikes","perception","invitation","setting"],"keys":["Má notícia: informação que altera negativamente a visão de futuro da pessoa.","SPIKES: Setting, Perception, Invitation, Knowledge, Emotions, Strategy and Summary.","Setting: privacidade, tempo e acompanhantes autorizados.","Perception: explorar o que a pessoa já compreendeu. Invitation: perguntar o quanto deseja saber."],"deep":["O protocolo SPIKES (Baile et al., 2000) foi desenhado para a oncologia, mas serve a qualquer má notícia. Na preparação, conheça os dados antes, evite interrupções, sente-se e combine previamente quem pode estar presente. Percepção: 'O que você já entendeu sobre o seu problema?'. Convite: 'Como você gostaria que eu fosse explicando os resultados?'. Há pessoas que preferem delegar os detalhes à família; respeite e ofereça retomar a conversa depois."],"case":"O residente vai informar o resultado de uma biópsia: reserva uma sala, pede à enfermeira que evite interrupções, senta-se ao lado da paciente e do marido que ela escolheu. Pergunta o que ela entendeu sobre os exames e ela diz que acha que é 'só um cisto'. Depois pergunta se deseja os detalhes e, com o sim, prossegue.","trap":"Não pule Percepção e Convite: informar com base em suposições é um erro clássico."},{"id":"a09-2","title":"Informação, emoção, estratégia e resumo","paragraphs":["Knowledge oferece informação em pequenas partes, com linguagem acessível e checagem de compreensão. Emotions pede reconhecimento explícito da reação e espaço para silêncio. Strategy and Summary sintetiza o que ficou entendido e combina próximos passos.","A hierarquia das necessidades de comunicação apresentada na aula enfatiza confiança, ressonância emocional e alinhamento cognitivo. Diante de desconfiança ou emoção intensa, pode ser preciso retornar aos níveis anteriores antes de avançar com detalhes técnicos."],"refs":["s80-22","s81-24","s81-25"],"figures":[],"q":[{"id":"a09-2-q1","aula":"a09","segment":"a09-2","prompt":"Após receber a notícia, o paciente chora e silencia. Qual atitude é mais adequada?","options":["Continuar detalhando o estadiamento","Garantir que tudo ficará bem","Reconhecer a emoção, permitir o silêncio e oferecer presença antes de prosseguir","Mudar de assunto para aliviar o momento"],"answer":2,"why":"Emotions pede reconhecimento explícito da reação e espaço para o silêncio.","origin":null},{"id":"a09-2-q2","aula":"a09","segment":"a09-2","prompt":"Qual alternativa descreve corretamente a etapa Knowledge?","options":["Transmitir todos os dados técnicos de uma só vez","Resumir os próximos passos e encerrar","Oferecer informações em pequenas partes, com linguagem acessível, checando a compreensão","Perguntar o que o paciente já sabe antes de iniciar a consulta"],"answer":2,"why":"Knowledge é a informação dosada e checada. Perguntar o que já sabe é Perception; resumir é Strategy and Summary.","origin":null}],"terms":["knowledge","emotions","strategy","ressonância","alinhamento cognitivo"],"keys":["Knowledge: informação em pequenas partes, linguagem acessível, checagem de compreensão.","Emotions: reconhecer explicitamente a reação e dar espaço ao silêncio.","Strategy and Summary: sintetizar o que ficou entendido e combinar os próximos passos.","Hierarquia das necessidades de comunicação: confiança, ressonância emocional e alinhamento cognitivo."],"deep":["A resposta empática no E do SPIKES envolve observar a emoção, identificar sua causa e conectar as duas numa frase ('Vejo que isso assustou a senhora; imagino que seja pelo que aconteceu com sua mãe'). Evite tranquilizações prematuras ('vai dar tudo certo') e o excesso de informação. Uma frase de aviso ('Infelizmente, os resultados não foram os que esperávamos') prepara a pessoa para o que vem. Quando a emoção está intensa, a informação técnica não é processada: volte aos níveis anteriores (confiança, ressonância) antes de avançar."],"case":"Após informar a recidiva de um câncer, o médico percebe silêncio e choro. Em vez de continuar com detalhes, faz uma pausa, diz 'imagino que isso seja muito difícil de ouvir' e aguarda. Só depois pergunta o que ela gostaria de saber, resume as decisões imediatas e combina nova consulta em 48 horas com o marido.","trap":"A tranquilização precoce ('vai dar tudo certo') bloqueia a emoção e fere a confiança."}],"review":"SPIKES: preparação, percepção e convite → Informação, emoção, estratégia e resumo"}],"exams":[{"key":"p80","group":"parciais","turma":"80","file":"Parcial humanização 80.pdf","items":[{"id":"p80-01","page":1,"short":"Página 1 · Item 1","label":"Parcial 80 · p. 1","src":null,"ocr":"Início / MEDICINA -40 PERÍODO - PARCIAL -31/03-2025/1 / MEDICINA - HUMANIZAÇÃO E\nINTEGRALIDADE - MÚLTIPLA ESCOLHA - PARCIAL - 31/03 - 2025/1\nItem 1\nCódigo:\nSituação Problema\nO processo comunicativo é definido como um ato caracterizado não por relações de poder, mas\npor atitudes de sensibilidade, aceitação e empatia entre os sujeitos, em um universo de\nsignificações que envolvem tanto a dimensão verbal como a não verbal.\nComando Resposta\nSão exemplos de comunicação não-verbal:\nVocê acertou\nA. Postura e gestos.\nYe.Lju.sXi.f-jg.atjxa-da-alt2E.a-ntjya\nB. Escrita e oratória\nYe.Lju.s.tlf-j.ga-tiya-d.a-a.l.tgran.tj.ya\nC. Oratória e postura\nygr_justificativa da alterantiva\nD. Vestuário e escrita\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"O processo comunicativo é definido como um ato caracterizado não por relações de poder, mas por atitudes de sensibilidade, aceitação e empatia entre os sujeitos, em um universo de significações que envolvem tanto a dimensão verbal como a não verbal.","command":"São exemplos de comunicação não-verbal:","options":["Postura e gestos.","Escrita e oratória","Oratória e postura","Vestuário e escrita"],"answer":0,"check_layout":false}},{"id":"p80-02","page":2,"short":"Página 2 · Item 2","label":"Parcial 80 · p. 2","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nAlém de propiciar uma relação terapêutica, a comunicação deve propiciar condições para\npráticas de promoção da saúde, tornando o usuário/cuidador autônomo à negociação diante\ndo tratamento e das condições que favorecem o autocuidado e/ou o cuidado da criança sob\nsua responsabilidade.\nComando Resposta\nO processo de comunicação efetiva favorece a Humanização do atendimento em quais\naspectos?\nA. Acolhimento, vínculo e Hombridade\nB. Biológicos, tecnológicos e Integralidade\nygr_justificativa da alterantiva\nC. Acolhimento, tecnológicos e Lealdade\nY-eLju.sgj.f-jgatjya-da-aJ.t2E.an.t-iya\nVocê acertou\nD. Acolhimento, vínculo e Integralidade\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Além de propiciar uma relação terapêutica, a comunicação deve propiciar condições para práticas de promoção da saúde, tornando o usuário/cuidador autônomo à negociação diante do tratamento e das condições que favorecem o autocuidado e/ou o cuidado da criança sob sua responsabilidade.","command":"O processo de comunicação efetiva favorece a Humanização do atendimento em quais\naspectos?","options":["Acolhimento, vínculo e Hombridade","Biológicos, tecnológicos e Integralidade","Acolhimento, tecnológicos e Lealdade","Acolhimento, vínculo e Integralidade"],"answer":3,"check_layout":false}},{"id":"p80-03","page":3,"short":"Página 3 · Item 3","label":"Parcial 80 · p. 3","src":null,"ocr":"Item 3\nCódigo:\nSituação Problema\nA comunicação terapêutica é definida como a habilidade do trabalhador de saúde em ajudar as\npessoas a enfrentar situações temporárias de estresse, conviver com outras pessoas, ajustar-se\nà realidade, superar os bloqueios, favorecer o tratamento e o desenvolvimento dos pacientes,\ntornando-os ativos no processo de cuidar.\nComando Resposta\nCom base na definição acima, qual é o foco da comunicação entre trabalhadores de saúde e\nusuários?\nA. Estabelecer uma relação autoritária e unidirecional.\nY-eLjus-tjíj.ca.tj.ga-da-alLeLa.n.tj.ya\nVocê acertou\nB.\nAjudar os pacientes a enfrentar situações de estresse e envolvê-los no processo de cuidado\nY-eLjustjíi.gaiiy-a-da-alte.La.n-tiya\nC. Priorizar a tecnologia em detrimento da interação humana\nVer justificativa da alterantiva\nD. Fornecer apenas informações clínicas sem considerar o aspecto emocional do paciente.\nYe.Ljustificativa da alterantivq","question":{"kind":"choice","stem":"A comunicação terapêutica é definida como a habilidade do trabalhador de saúde em ajudar as pessoas a enfrentar situações temporárias de estresse, conviver com outras pessoas, ajustar-se à realidade, superar os bloqueios, favorecer o tratamento e o desenvolvimento dos pacientes, tornando-os ativos no processo de cuidar.","command":"Com base na definição acima, qual é o foco da comunicação entre trabalhadores de saúde e\nusuários?","options":["Estabelecer uma relação autoritária e unidirecional.","Ajudar os pacientes a enfrentar situações de estresse e envolvê-los no processo de cuidado","Priorizar a tecnologia em detrimento da interação humana","Fornecer apenas informações clínicas sem considerar o aspecto emocional do paciente."],"answer":1,"check_layout":false}},{"id":"p80-04","page":4,"short":"Página 4 · Item 4","label":"Parcial 80 · p. 4","src":null,"ocr":"Item 4\nCódigo:\nSituação Problema\nO artigo \"Comunicação nas práticas em saúde: revisão integrativa da literatura\" de Coriolano-\nMarini et al. (2014) discute a importância da comunicação eficaz entre profissionais de saúde e\npacientes. A pesquisa revela que a comunicação é um elemento crucial para a qualidade do\natendimento e a adesão aos tratamentos. Os autores identificam desafios, como barreiras\nlinguísticas e a falta de formação em habilidades comunicativas, sugerindo que investimento\nem treinamento é essencial para melhorar essas práticas.\nComando Resposta\nCom base no artigo de Coriolano-Marini et al. (2014), assinale a alternativa que melhor resume\na importância da comunicação nas práticas em saúde.\nA comunicação nas práticas de saúde é secundária, pois os profissionais devem priorizar\nsomente a técnica e o procedimento\nYgr-justificativa da alterantiva\nA comunicação entre profissionais de saúde e pacientes é apenas importante para a realização\nB.\nde diagnósticos precisos\nY-e.r-jus.tj-fjg.a-tjxa-da-alig.can-tjya\nC. A comunicação é irrelevante quando os pacientes seguem estritamente as orientações médicas\nVer justificativa da alterantiva\nVocê acertou\nA comunicação eficaz é fundamental para a construção de vínculos e melhoria na adesão ao\nD.\ntratamento, além de promover uma experiência de saúde mais positiva\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"O artigo \"Comunicação nas práticas em saúde: revisão integrativa da literatura\" de Coriolano- Marini et al. (2014) discute a importância da comunicação eficaz entre profissionais de saúde e pacientes. A pesquisa revela que a comunicação é um elemento crucial para a qualidade do atendimento e a adesão aos tratamentos. Os autores identificam desafios, como barreiras linguísticas e a falta de formação em habilidades comunicativas, sugerindo que investimento em treinamento é essencial para melhorar essas práticas.","command":"Com base no artigo de Coriolano-Marini et al. (2014), assinale a alternativa que melhor resume\na importância da comunicação nas práticas em saúde.","options":["A comunicação nas práticas de saúde é secundária, pois os profissionais devem priorizar somente a técnica e o procedimento","A comunicação entre profissionais de saúde e pacientes é apenas importante para a realização de diagnósticos precisos","A comunicação é irrelevante quando os pacientes seguem estritamente as orientações médicas","A comunicação eficaz é fundamental para a construção de vínculos e melhoria na adesão ao tratamento, além de promover uma experiência de saúde mais positiva"],"answer":3,"check_layout":false}},{"id":"p80-05","page":5,"short":"Página 5 · Item 5","label":"Parcial 80 · p. 5","src":null,"ocr":"Item 5\nCódigo:\nSituação Problema\nHumanizar se traduz, então, como inclusão das diferenças nos processos de gestão e de\ncuidado. Tais mudanças são construídas não por uma pessoa ou grupo isolado, mas de forma\ncoletiva e compartilhada. Incluir para estimular a produção de novos modos de cuidar e novas\nformas de organizar o trabalho.\nComando Resposta\nComo a inclusão pode ser realizada?\nVocê acertou\nAtravés de rodas de conversa, o incentivo às redes e movimentos sociais e a gestão dos\nconflitos gerados pela inclusão das diferenças são ferramentas experimentadas nos serviços\nde saúde a partir das orientações da Política Nacional de Humanização.\nle.Lju.s-tj.f-lc.a.tlya-da-a.l.te.La-n-tl!.a\nComo muitas pessoas atendidas não sabem ler e escrever, a participação dos usuários nas\nB. decisões da equipe é inviável. Este fato é corroborado pelo fato dos conhecimentos\nacadêmicos sobrepor aos populares.\nY-e.r-jus.tjf-lc.a.tl.y-a-da-al.te.ca.n-tjya\nApesar da coletividade ser um ponto positivo na criação de estratégias promissoras para\nC. melhorias no sistema de saúde, a inclusão das diferenças gera transtornos e inviabiliza a\ngestão da equipe de saúde.\nVer justificativa da alterantiva\nD.\nCom a escuta ativa de forma individualizada e pontual por agentes de saúde é possível fazer\na ponte com a gestão e demais esferas do governo para servindo como material para\nformular políticas públicas para toda população.","question":{"kind":"choice","stem":"Humanizar se traduz, então, como inclusão das diferenças nos processos de gestão e de cuidado. Tais mudanças são construídas não por uma pessoa ou grupo isolado, mas de forma coletiva e compartilhada. Incluir para estimular a produção de novos modos de cuidar e novas formas de organizar o trabalho.","command":"Como a inclusão pode ser realizada?","options":["Através de rodas de conversa, o incentivo às redes e movimentos sociais e a gestão dos conflitos gerados pela inclusão das diferenças são ferramentas experimentadas nos serviços de saúde a partir das orientações da Política Nacional de Humanização.","Como muitas pessoas atendidas não sabem ler e escrever, a participação dos usuários nas decisões da equipe é inviável. Este fato é corroborado pelo fato dos conhecimentos acadêmicos sobrepor aos populares.","Apesar da coletividade ser um ponto positivo na criação de estratégias promissoras para melhorias no sistema de saúde, a inclusão das diferenças gera transtornos e inviabiliza a gestão da equipe de saúde.","Com a escuta ativa de forma individualizada e pontual por agentes de saúde é possível fazer a ponte com a gestão e demais esferas do governo para servindo como material para formular políticas públicas para toda população."],"answer":0,"check_layout":false}},{"id":"p80-06","page":6,"short":"Página 6 · Item 6","label":"Parcial 80 · p. 6","src":null,"ocr":"Item 6\nCódigo:\nSituação Problema\nO Humaniza SUS, como também é conhecida a Política Nacional de Humanização (PNH), aposta\nna inclusão de trabalhadores, usuários e gestores na produção e gestão do cuidado e dos\nprocessos de trabalho. Para isso, atua a partir de orientações clínicas, éticas e políticas, que se\ntraduzem em determinados arranjos de trabalho-as chamadas diretrizes.\nComando Resposta\nCom base na PNH, qual definição abaixo está correta?\nGestão participativa e cogestão: É importante dar visibilidade à experiência dos\ntrabalhadores e incluí-los na tomada de decisão, apostando na sua capacidade de analisar,\ndefinir e qualificar os processos de trabalho.\nYEjustificativa da alterantiva\nVocê marcou\nClínica ampliada e compartilhada: Expressa tanto a inclusão de novos sujeitos nos processos\nde análise e decisão quanto a ampliação das tarefas da gestão - que se transforma também\nB.\nem espaço de realização de análise dos contextos, da política em geral e da saúde em\nparticular, em lugar de formulação e de pactuação de tarefas e de aprendizado coletivo.\nValorização do trabalhador: É uma ferramenta teórica e prática cuja finalidade é contribuir\npara uma abordagem clínica do adoecimento e do sofrimento, que considere a singularidade\nc.\ndo sujeito e a complexidade do processo saúde/doença. Permite o enfrentamento da\nfragmentação do conhecimento e das ações de saúde e seus respectivos danos e ineficácia.\nYe.Lju.s.tj.f.jga.tj!.a-da-a-lte.r-a.n.tjya\nResposta correta\nDefesa dos direitos dos usuários: Os usuários de saúde possuem direitos garantidos por lei e\nos serviços de saúde devem incentivar o conhecimento desses direitos e assegurar que eles\nsejam cumpridos em todas as fases do cuidado, desde a recepção até a alta.\nY-eLjus.uf-jga.tjya-da-a-lte.r-a.n.uya","question":{"kind":"choice","stem":"O Humaniza SUS, como também é conhecida a Política Nacional de Humanização (PNH), aposta na inclusão de trabalhadores, usuários e gestores na produção e gestão do cuidado e dos processos de trabalho. Para isso, atua a partir de orientações clínicas, éticas e políticas, que se traduzem em determinados arranjos de trabalho-as chamadas diretrizes.","command":"Com base na PNH, qual definição abaixo está correta?","options":["Gestão participativa e cogestão: É importante dar visibilidade à experiência dos trabalhadores e incluí-los na tomada de decisão, apostando na sua capacidade de analisar, definir e qualificar os processos de trabalho.","Clínica ampliada e compartilhada: Expressa tanto a inclusão de novos sujeitos nos processos de análise e decisão quanto a ampliação das tarefas da gestão - que se transforma também em espaço de realização de análise dos contextos, da política em geral e da saúde em particular, em lugar de formulação e de pactuação de tarefas e de aprendizado coletivo.","Valorização do trabalhador: É uma ferramenta teórica e prática cuja finalidade é contribuir para uma abordagem clínica do adoecimento e do sofrimento, que considere a singularidade do sujeito e a complexidade do processo saúde/doença. Permite o enfrentamento da fragmentação do conhecimento e das ações de saúde e seus respectivos danos e ineficácia.","Defesa dos direitos dos usuários: Os usuários de saúde possuem direitos garantidos por lei e os serviços de saúde devem incentivar o conhecimento desses direitos e assegurar que eles sejam cumpridos em todas as fases do cuidado, desde a recepção até a alta."],"answer":3,"check_layout":false}},{"id":"p80-07","page":7,"short":"Página 7 · Item 7","label":"Parcial 80 · p. 7","src":null,"ocr":"Item 7\nCódigo:\nSituação Problema\nA PNH estimula a comunicação entre gestores, trabalhadores e usuários para construir\nprocessos coletivos de enfrentamento de relações de poder, trabalho e afeto que muitas vezes\nproduzem atitudes e práticas desumanizadoras que inibem a autonomia e a\ncorresponsabilidade dos profissionais de saúde em seu trabalho e dos usuários no cuidado de\nsi.\nComando Resposta\nPortanto, seu principal objetivo é:\nVocê acertou\nAtivar dispositivos que favoreçam ações de humanização na atenção e na gestão da saúde\nbrasileira.\nVer justificativa da alterantiva\nA valorização do conhecimento técnico adquirido em instituições de ensino superior como forma\nB.\nde melhorar a qualidade de atendimento no SUS.\nYe.Ljustificativa da alterantiva\nFortalecer os gestores para elaboração de políticas públicas mais efetivas baseadas na formação\nc.\ntécnica desses profissionais.\nVer justificativa da alterantiva\nRegionalizar a gestão do atendimento integral do usuário de saúde e focar na generalização dos\nD.\ncasos para diminuição dos gastos públicos.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"A PNH estimula a comunicação entre gestores, trabalhadores e usuários para construir processos coletivos de enfrentamento de relações de poder, trabalho e afeto que muitas vezes produzem atitudes e práticas desumanizadoras que inibem a autonomia e a corresponsabilidade dos profissionais de saúde em seu trabalho e dos usuários no cuidado de si.","command":"Portanto, seu principal objetivo é:","options":["Ativar dispositivos que favoreçam ações de humanização na atenção e na gestão da saúde brasileira.","A valorização do conhecimento técnico adquirido em instituições de ensino superior como forma de melhorar a qualidade de atendimento no SUS.","Fortalecer os gestores para elaboração de políticas públicas mais efetivas baseadas na formação técnica desses profissionais.","Regionalizar a gestão do atendimento integral do usuário de saúde e focar na generalização dos casos para diminuição dos gastos públicos."],"answer":0,"check_layout":false}},{"id":"p80-08","page":8,"short":"Página 8 · Item 8","label":"Parcial 80 · p. 8","src":null,"ocr":"Item 8\nCódigo:\nSituação Problema\nO HumanizaSUS, como também é conhecida a Política Nacional de Humanização, aposta na\ninclusão de trabalhadores, usuários e gestores na produção e gestão do cuidado e dos\nprocessos de trabalho.\nComando Resposta\nQual afirmativa abaixo justifica essa \"aposta\"?\nA fragmentação do sistema facilita a responsabilização e promove um melhor atendimento\nA. uma vez que cada profissional contribui melhor ao utilizar os conhecimentos acadêmicos de\nforma individualizada. Portanto, melhora o fluxo de atendimento do SUS.\nY.e.Ljustifj.gatiya-da-a-l.tera.ntjya\nA clínica dos profissionais da equipe de saúde precisa ser submetida às decisões dos\ngestores que são profissionais mais capacitados para a tomada de decisões da equipe e, por\nB.\nesse motivo, ocupam esse cargo. Desta forma, as decisões tomadas pelos gestores mais são\nassertivas.\nY.eLju.sti-f.j.g.a-tjyg-d-a-altg.r.a.n.tiy.Q\nA possibilidade de todos auxiliarem nas tomadas de decisões causa transtornos à equipe e\nmaior trabalho ao gestor. É importante que os profissionais foquem nos protocolos clínicos\nc.\npara potencializar o atendimento uma vez que a demanda e necessidade de atualização está\nmaior a cada dia.\nD.\nVocê acertou\nA comunicação entre esses três atores do SUS provoca movimentos de perturbação e\ninquietação que a PNH considera o \"motor\" de mudanças e que também precisam ser\nincluídos como recursos para a produção de saúde.\nYe.Ljus.tlfj.catjy.a-da-alte.ran-tj.ya","question":{"kind":"choice","stem":"O HumanizaSUS, como também é conhecida a Política Nacional de Humanização, aposta na inclusão de trabalhadores, usuários e gestores na produção e gestão do cuidado e dos processos de trabalho.","command":"Qual afirmativa abaixo justifica essa \"aposta\"?","options":["A fragmentação do sistema facilita a responsabilização e promove um melhor atendimento uma vez que cada profissional contribui melhor ao utilizar os conhecimentos acadêmicos de forma individualizada. Portanto, melhora o fluxo de atendimento do SUS.","A clínica dos profissionais da equipe de saúde precisa ser submetida às decisões dos gestores que são profissionais mais capacitados para a tomada de decisões da equipe e, por esse motivo, ocupam esse cargo. Desta forma, as decisões tomadas pelos gestores mais são assertivas.","A possibilidade de todos auxiliarem nas tomadas de decisões causa transtornos à equipe e maior trabalho ao gestor. É importante que os profissionais foquem nos protocolos clínicos para potencializar o atendimento uma vez que a demanda e necessidade de atualização está maior a cada dia.","A comunicação entre esses três atores do SUS provoca movimentos de perturbação e inquietação que a PNH considera o \"motor\" de mudanças e que também precisam ser incluídos como recursos para a produção de saúde."],"answer":3,"check_layout":false}},{"id":"p80-09","page":9,"short":"Página 9 · Item 9","label":"Parcial 80 · p. 9","src":null,"ocr":"Item 9\nCódigo:\nSituação Problema\nA comunicação eficaz é vital para o sucesso do tratamento, mas diversos obstáculos podem\ninterferir nesse processo. Identificar esses desafios é crucial para melhorar a interação entre\nprofissionais de saúde, pacientes e acompanhantes.\nComando Resposta\nQuais são os principais obstáculos à comunicação eficaz entre profissionais de saúde, pacientes\ne seus acompanhantes?\nA falta de interesse dos pacientes.\nY-eLjus.tjílga.U.!.a-da-a.l.te.ran-tjya\nVocê acertou\nB. Barreiras linguísticas, culturais e emocionais que podem dificultar a compreensão.\nY.eLjustLf-i.g.a.tjy.a-da-al.teran.tjya\nC. O uso de tecnologia no atendimento.\nYEjustificativa da alterantiva\nD. A presença de acompanhantes.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"A comunicação eficaz é vital para o sucesso do tratamento, mas diversos obstáculos podem interferir nesse processo. Identificar esses desafios é crucial para melhorar a interação entre profissionais de saúde, pacientes e acompanhantes.","command":"Quais são os principais obstáculos à comunicação eficaz entre profissionais de saúde, pacientes\ne seus acompanhantes?","options":["A falta de interesse dos pacientes.","Barreiras linguísticas, culturais e emocionais que podem dificultar a compreensão.","O uso de tecnologia no atendimento.","A presença de acompanhantes."],"answer":1,"check_layout":false}},{"id":"p80-10","page":10,"short":"Página 10 · Item 10","label":"Parcial 80 · p. 10","src":null,"ocr":"Item 10\nCódigo:\nSituação Problema\nA inclusão de acompanhantes e familiares no atendim
