equentes na fala do paciente.\nu.e.Ljus.ti.f-i.ca.tiya-da-a-l.te.ran.tiya\nD. Não adesão ou não entendimento do tratamento.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Ana*, mulher de 38 anos, em tratamento periódico de diabetes, viúva há seis meses, procurou atendimento por dores nas costas sem causa evidente, Ela mencionou sua preocupação com o impacto emocional dos sintomas, visto que já estava atrapalhando suas atividades laborais, gerando sofrimento. O médico logo comenta que irá ajudá-la. Realiza exames rápidos e deixa Ana sem respostas a alguns de seus questionamentos. O médico concluiu não ser nada grave, indicou analgésicos, já que o diabetes estava controlado. Ana, emocionada, tentou explicar que já havia tentado esse tratamento antes e solicitou outras possibilidades, algumas que ela viu ao pesquisar na internet, mas o médico levantou e abriu a porta, indicando que a consulta havia se encerrado (*Os nomes e casos são fictícios).","command":"Assinale a alternativa que apresenta, de acordo com Cruvinel e Grosseman (2023), na\nperspectiva do paciente, elementos que evidenciem no caso de Ana, um médico difícil.","options":["Omissão de informações e falta de confiança.","Concordância sobre o ponto principal da consulta.","Interrupções frequentes na fala do paciente.","Não adesão ou não entendimento do tratamento."],"answer":2,"check_layout":false}},{"id":"p80-21","page":21,"short":"Página 21 · Item 21","label":"Parcial 80 · p. 21","src":null,"ocr":"Item 21\nCódigo:\nSituação Problema\nA dificuldade de estabelecer uma comunicação clara e acessível promove inúmeros problemas,\nentre eles a falta de adesão às propostas terapêuticas. Em determinadas realidades, 50% dos\npacientes não fazem uso das medicações prescritas ou as utilizam de maneira incorreta. A falta\nde vínculos de confiança é muito prejudicial e cara. Os custos de medicações desperdiçadas ou\ncom uso inadequado extrapolam os 5 bilhões de dólares canadenses anualmente, além de\ncustos de difícil mensuração relacionados a lucros cessantes, visitas extras ao médico,\ninternações e mortes prematuras, ocasionando um prejuízo em torno de 7 a 9 bilhões de\ndólares canadenses por ano. (Adaptado de Cruvinel e Grossman, 2023).\nComando Resposta\nUma boa relação médico paciente reduz:\nSatisfação de médicos e equipes.\nVer justificativa da alterantiva\nB.\nEficiência na alocação de recursos.\nY-eLju.stj.f.lgatly.a-d.a-a-l.tg.r-a.nXjya\nC. Produtividade de equipes de saúde.\nYe.Lju.s.tLf-i.c.a.tiya-da-al.teE.an.tLga\nVocê acertou\nD.\nProcessos legais contra serviços.\nYe.Ljus-tlf.j.g.a.tj!.a-d.a-a-l.te-r-a.n.tLua","question":{"kind":"choice","stem":"A dificuldade de estabelecer uma comunicação clara e acessível promove inúmeros problemas, entre eles a falta de adesão às propostas terapêuticas. Em determinadas realidades, 50% dos pacientes não fazem uso das medicações prescritas ou as utilizam de maneira incorreta. A falta de vínculos de confiança é muito prejudicial e cara. Os custos de medicações desperdiçadas ou com uso inadequado extrapolam os 5 bilhões de dólares canadenses anualmente, além de custos de difícil mensuração relacionados a lucros cessantes, visitas extras ao médico, internações e mortes prematuras, ocasionando um prejuízo em torno de 7 a 9 bilhões de dólares canadenses por ano. (Adaptado de Cruvinel e Grossman, 2023).","command":"Uma boa relação médico paciente reduz:","options":["Satisfação de médicos e equipes.","Eficiência na alocação de recursos.","Produtividade de equipes de saúde.","Processos legais contra serviços."],"answer":3,"check_layout":false}},{"id":"p80-22","page":22,"short":"Página 22 · Item 1","label":"Parcial 80 · p. 22","src":null,"ocr":"Início / MEDICINA -40 PERíODO- PARCIAL -31/03-2025/1 / MEDICINA - HUMANIZAÇÃO E\nINTEGRALIDADE - DISCURSIVA - PARCIAL - 31/03 - 2025/1\nItem 1\nCódigo:\nSituação Problema\nA comunicação eficaz nas práticas de saúde é um componente fundamental para a qualidade\ndo atendimento e para a adesão ao tratamento dos pacientes. No entanto, diversos desafios se\nimpõem nessa interação, conforme analisado por Coriolano-Marini et al. (2014).\nComando Resposta\nAnalise os desafios da comunicação nas práticas de saúde, abordando a falta de formação em\nQual é o papel da formação na prática da comunicação\nhabilidades comunicativas.\nem saúde?\nSua resposta\nResposta esperada:\nA formação dos profissionais de saúde muitas vezes é focada em aspectos técnicos e\nclínicos, com pouca ênfase em habilidades comunicativas. Essa lacuna pode levar à\nincapacidade de se conectar com os pacientes em um nível mais pessoal e empático.\nInvestir em treinamento específico para o desenvolvimento de habilidades comunicativas\né crucial, pois capacita os profissionais a abordarem os pacientes de forma mais\nhumanizada, passando não apenas informações, mas também se mostrando disponíveis e\ncompreensivos em relação ao estado emocional dos mesmos.","question":{"kind":"written","stem":"A comunicação eficaz nas práticas de saúde é um componente fundamental para a qualidade do atendimento e para a adesão ao tratamento dos pacientes. No entanto, diversos desafios se impõem nessa interação, conforme analisado por Coriolano-Marini et al. (2014).","command":"Analise os desafios da comunicação nas práticas de saúde, abordando a falta de formação em\nQual é o papel da formação na prática da comunicação\nhabilidades comunicativas.\nem saúde?","expected":"A formação dos profissionais de saúde muitas vezes é focada em aspectos técnicos e\nclínicos, com pouca ênfase em habilidades comunicativas. Essa lacuna pode levar à\nincapacidade de se conectar com os pacientes em um nível mais pessoal e empático.\nInvestir em treinamento específico para o desenvolvimento de habilidades comunicativas\né crucial, pois capacita os profissionais a abordarem os pacientes de forma mais\nhumanizada, passando não apenas informações, mas também se mostrando disponíveis e\ncompreensivos em relação ao estado emocional dos mesmos."}},{"id":"p80-23","page":23,"short":"Página 23 · Item 2","label":"Parcial 80 · p. 23","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nA Política Nacional de Humanização atua a partir de orientações clínicas, éticas e políticas, que\nse traduzem em determinados arranjos de trabalho. Dentre os conceitos que norteiam o\ntrabalho da PNH, a Ambiência pode ser pensada por profissionais da equipe de saúde junto a\nprofissionais de outras áreas do conhecimento.\nComando Resposta\nDefina abaixo o que é ambiência e como fazê-la.\nSua resposta\nResposta esperada:\nDefinição: Criar espaços saudáveis, acolhedores e confortáveis, que respeitem a\nprivacidade, propiciem mudanças no processo de trabalho e sejam lugares de encontro\nentre as pessoas.\nComo fazê-la: A discussão compartilhada do projeto arquitetônico, das reformas e do uso\ndos espaços de acordo com as necessidades de usuários e trabalhadores de cada serviço\né uma orientação que pode melhorar o trabalho em saúde.","question":{"kind":"written","stem":"A Política Nacional de Humanização atua a partir de orientações clínicas, éticas e políticas, que se traduzem em determinados arranjos de trabalho. Dentre os conceitos que norteiam o trabalho da PNH, a Ambiência pode ser pensada por profissionais da equipe de saúde junto a profissionais de outras áreas do conhecimento.","command":"Defina abaixo o que é ambiência e como fazê-la.","expected":"Definição: Criar espaços saudáveis, acolhedores e confortáveis, que respeitem a\nprivacidade, propiciem mudanças no processo de trabalho e sejam lugares de encontro\nentre as pessoas.\nComo fazê-la: A discussão compartilhada do projeto arquitetônico, das reformas e do uso\ndos espaços de acordo com as necessidades de usuários e trabalhadores de cada serviço\né uma orientação que pode melhorar o trabalho em saúde."}},{"id":"p80-24","page":24,"short":"Página 24 · Item 3","label":"Parcial 80 · p. 24","src":null,"ocr":"Item 3\nCódigo:\nSituação Problema\nAna*, mulher de 38 anos, em tratamento periódico de diabetes, viúva há seis meses, procurou\natendimento por dores nas costas sem causa evidente, Ela mencionou sua preocupação com o\nimpacto emocional dos sintomas, visto que já estava atrapalhando suas atividades laborais,\ngerando sofrimento. O médico logo comenta que irá ajudá-la. Realiza exames rápidos e deixa\nAna sem respostas a alguns de seus questionamentos. O médico concluiu não ser nada grave,\nindicou analgésicos, já que o diabetes estava controlado. Ana, emocionada, tentou explicar que\njá havia tentado esse tratamento antes e solicitou outras possibilidades, algumas que ela viu ao\npesquisar na internet, mas o médico levantou e abriu a porta, indicando que a consulta havia se\nencerrado (*Os nomes e casos são fictícios).\nComando Resposta\nTendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três\nelementos que tornam Ana, uma paciente difícil, do ponto de vista do médico.\nSua resposta\nResposta esperada:\nPodem ser listados três das seguintes opções: 1. Condições psicossomáticas e de saúde\nmental (sua dor nas costas ainda sem causa aparente); 2. Sofrimento (sua preocupação\ncom o impacto emocional); 3. Excesso de participação na consulta (\"excesso\" de fala ou\nquestionamento durante a consulta); 4. Pesquisa sobre sua condição ou busca outras\nopiniões médicas (ideias que surgiram de tratamento ao pesquisar na internet).","question":{"kind":"written","stem":"Ana*, mulher de 38 anos, em tratamento periódico de diabetes, viúva há seis meses, procurou atendimento por dores nas costas sem causa evidente, Ela mencionou sua preocupação com o impacto emocional dos sintomas, visto que já estava atrapalhando suas atividades laborais, gerando sofrimento. O médico logo comenta que irá ajudá-la. Realiza exames rápidos e deixa Ana sem respostas a alguns de seus questionamentos. O médico concluiu não ser nada grave, indicou analgésicos, já que o diabetes estava controlado. Ana, emocionada, tentou explicar que já havia tentado esse tratamento antes e solicitou outras possibilidades, algumas que ela viu ao pesquisar na internet, mas o médico levantou e abriu a porta, indicando que a consulta havia se encerrado (*Os nomes e casos são fictícios).","command":"Tendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três\nelementos que tornam Ana, uma paciente difícil, do ponto de vista do médico.","expected":"Podem ser listados três das seguintes opções: 1. Condições psicossomáticas e de saúde\nmental (sua dor nas costas ainda sem causa aparente); 2. Sofrimento (sua preocupação\ncom o impacto emocional); 3. Excesso de participação na consulta (\"excesso\" de fala ou\nquestionamento durante a consulta); 4. Pesquisa sobre sua condição ou busca outras\nopiniões médicas (ideias que surgiram de tratamento ao pesquisar na internet)."}}]},{"key":"p81","group":"parciais","turma":"81","file":"Parcial humanização 81.pdf","items":[{"id":"p81-01","page":1,"short":"Página 1","label":"Parcial 81 · p. 1","src":null,"ocr":"Situação Problema\nA comunicação é uma habilidade essencial na prática médica, pois impacta diretamente a qualidade do atendimento ao\npaciente. A interação eficaz com pacientes, acompanhantes e familiares é fundamental para a construção de uma relação de\nconfiança, compreensão e empatia. Além disso, a comunicação interprofissional é crucial para garantir que a equipe de saúde\ntrabalhe de forma integrada, promovendo um cuidado mais seguro e eficaz.\nA seguir, apresentamos algumas afirmativas sobre esses temas.\nAfirmativa l: A escuta ativa é uma técnica que permite ao médico entender melhor as preocupações e necessidades do paciente,\npromovendo uma comunicação mais eficaz.\nAfirmativa II: A comunicação não verbal, como expressões faciais e gestos, não tem impacto na interação entre o médico e o\npaciente.\nAfirmativa III: A inclusão do acompanhante nas discussões sobre o tratamento pode ajudar a esclarecer dúvidas e aumentar a\nadesão do paciente ao plano de cuidados.\nComando Resposta\nAnalise cada uma delas e indique quais são verdadeiras ou falsas.\nA. Apenas a afirmativa I é verdadeira.\nVer iustificativa da alterantiva\nB. Apenas a I e II são verdadeiras.\nVer justificativa da alterantiva\nC. Apenas a II e III são verdadeiras.\ngecjusütigal!-ga-gg-a-ltec.anuga\nD.\nVocê acertou\nApenas a I e III são verdadeiras.","question":{"kind":"choice","stem":"A comunicação é uma habilidade essencial na prática médica, pois impacta diretamente a qualidade do atendimento ao paciente. A interação eficaz com pacientes, acompanhantes e familiares é fundamental para a construção de uma relação de confiança, compreensão e empatia. Além disso, a comunicação interprofissional é crucial para garantir que a equipe de saúde trabalhe de forma integrada, promovendo um cuidado mais seguro e eficaz. A seguir, apresentamos algumas afirmativas sobre esses temas. Afirmativa l: A escuta ativa é uma técnica que permite ao médico entender melhor as preocupações e necessidades do paciente, promovendo uma comunicação mais eficaz. Afirmativa II: A comunicação não verbal, como expressões faciais e gestos, não tem impacto na interação entre o médico e o paciente. Afirmativa III: A inclusão do acompanhante nas discussões sobre o tratamento pode ajudar a esclarecer dúvidas e aumentar a adesão do paciente ao plano de cuidados.","command":"Analise cada uma delas e indique quais são verdadeiras ou falsas.","options":["Apenas a afirmativa I é verdadeira.","Apenas a I e II são verdadeiras.","Apenas a II e III são verdadeiras.","Apenas a I e III são verdadeiras."],"answer":3,"check_layout":false}},{"id":"p81-02","page":2,"short":"Página 2","label":"Parcial 81 · p. 2","src":null,"ocr":"Situação Problema\nAnalise as afirmativas abaixo:\nl. A comunicação eficaz pode aumentar a satisfação do paciente e a adesão ao tratamento.\nII. A comunicação não verbal não influencia a percepção do paciente sobre o médico.\nIII. A escuta ativa é uma habilidade essencial para entender as preocupações e necessidades do paciente.\nIV. A comunicação interprofissional não é relevante para a segurança do paciente.\nComando Resposta\nSobre a comunicação interpessoal entre médicos e pacientes, assinale V para as afirmativas verdadeiras e F para as falsas e\nmarque a alternativa correta:\nVer justificativa da alterantjva\nVocê\nVer justificativa da alterantiva\nD.","question":{"kind":"choice","stem":"Analise as afirmativas abaixo: l. A comunicação eficaz pode aumentar a satisfação do paciente e a adesão ao tratamento. II. A comunicação não verbal não influencia a percepção do paciente sobre o médico. III. A escuta ativa é uma habilidade essencial para entender as preocupações e necessidades do paciente. IV. A comunicação interprofissional não é relevante para a segurança do paciente.","command":"Sobre a comunicação interpessoal entre médicos e pacientes, assinale V para as afirmativas verdadeiras e F para as falsas e\nmarque a alternativa correta:","options":["V, V, V, V","F, V, F, V","V, F, V, F","V, V, F, F"],"answer":2,"check_layout":false}},{"id":"p81-03","page":3,"short":"Página 3","label":"Parcial 81 · p. 3","src":null,"ocr":"Situação Problema\nA Política Nacional de Humanização (PNH) no Sistema Único de Saúde (SUS) é um marco importante na busca por um\natendimento mais humanizado e acolhedor. Essa abordagem não apenas melhora a qualidade do atendimento, mas também\nfortalece a relação entre profissionais de saúde e pacientes, promovendo um cuidado mais integral e humanizado.\nComando Resposta\nQual dos seguintes princípios é fundamental para a implementação da Política Nacional de Humanização (PNH) no SUS?\nA. Foco exclusivo na aceleração de processos de diagnóstico.\nVer justificativa da alterantiva\nVocê acertou\nB.\nValorização da gestão compartilhada e do protagonismo dos trabalhadores e usuários no processo de cuidado.\nVer justificativa da alterantiva\nC. Prioridade ao tratamento médico em detrimento do acolhimento e escuta do paciente.\nVer justificativa da alterantiva\nD.\nAumento da quantidade de exames realizados para otimizar a eficiência do sistema.","question":{"kind":"choice","stem":"A Política Nacional de Humanização (PNH) no Sistema Único de Saúde (SUS) é um marco importante na busca por um atendimento mais humanizado e acolhedor. Essa abordagem não apenas melhora a qualidade do atendimento, mas também fortalece a relação entre profissionais de saúde e pacientes, promovendo um cuidado mais integral e humanizado.","command":"Qual dos seguintes princípios é fundamental para a implementação da Política Nacional de Humanização (PNH) no SUS?","options":["Foco exclusivo na aceleração de processos de diagnóstico.","Valorização da gestão compartilhada e do protagonismo dos trabalhadores e usuários no processo de cuidado.","Prioridade ao tratamento médico em detrimento do acolhimento e escuta do paciente.","Aumento da quantidade de exames realizados para otimizar a eficiência do sistema."],"answer":1,"check_layout":false}},{"id":"p81-04","page":4,"short":"Página 4","label":"Parcial 81 · p. 4","src":null,"ocr":"Situação Problema\nA Política Nacional de Humanização (PNH) surge como uma resposta às necessidades de transformação nas práticas de cuidado\ndentro do Sistema Único de Saúde (SUS).\nComando Resposta\nNo contexto do SUS, a Política Nacional de Humanização (PNH) tem como objetivo principal:\nA. Reduzir os custos operacionais nos serviços de saúde.\nVer justificativa da alterantiva\nB. Priorizar o atendimento especializado sobre o atendimento básico.\nMEL justificativa d? alterantiva\nVocê acertou\nMelhorar a qualidade das relações entre profissionais de saúde, pacientes e familiares, promovendo um atendimento\nc.\nacolhedor e humanizado.\nVer justificativa da alterantiva\nD. Centralizar a tomada de decisões em gestores e diretores dos serviços de saúde.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"A Política Nacional de Humanização (PNH) surge como uma resposta às necessidades de transformação nas práticas de cuidado dentro do Sistema Único de Saúde (SUS).","command":"No contexto do SUS, a Política Nacional de Humanização (PNH) tem como objetivo principal:","options":["Reduzir os custos operacionais nos serviços de saúde.","Priorizar o atendimento especializado sobre o atendimento básico.","Melhorar a qualidade das relações entre profissionais de saúde, pacientes e familiares, promovendo um atendimento acolhedor e humanizado.","Centralizar a tomada de decisões em gestores e diretores dos serviços de saúde."],"answer":2,"check_layout":false}},{"id":"p81-05","page":5,"short":"Página 5","label":"Parcial 81 · p. 5","src":null,"ocr":"Situação Problema\nA comunicação em saúde é um componente fundamental para a eficácia do atendimento e a promoção do bem-estar dos\npacientes.\nComando Resposta\nSobre o processo de comunicação em saúde, qual alternativa descreve corretamente uma falha de codificação por parte do\nprofissional de saúde?\nO paciente não compreende as instruções devido a um problema de \"decodificação\" causado pelo uso de termos técnicos\ninadequados.\nVer justificativa da alterantiva\nVocê acertou\nO profissional utiliza termos complexos e técnicos, sem adaptá-los ao conhecimento do paciente, dificultando a compreensão\nB.\nda mensagem.\nVer justificativa da alterantiva\nC. O paciente interrompe constantemente o profissional, o que configura uma falha de \"emissão\" na comunicação.\nVer justificativa da alterantiva\nD. O ambiente ruidoso durante a consulta impediu a transmissão clara da mensagem, comprometendo a \"decodificação\".\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"A comunicação em saúde é um componente fundamental para a eficácia do atendimento e a promoção do bem-estar dos pacientes.","command":"Sobre o processo de comunicação em saúde, qual alternativa descreve corretamente uma falha de codificação por parte do\nprofissional de saúde?","options":["O paciente não compreende as instruções devido a um problema de \"decodificação\" causado pelo uso de termos técnicos inadequados.","O profissional utiliza termos complexos e técnicos, sem adaptá-los ao conhecimento do paciente, dificultando a compreensão da mensagem.","O paciente interrompe constantemente o profissional, o que configura uma falha de \"emissão\" na comunicação.","O ambiente ruidoso durante a consulta impediu a transmissão clara da mensagem, comprometendo a \"decodificação\"."],"answer":1,"check_layout":false}},{"id":"p81-06","page":6,"short":"Página 6","label":"Parcial 81 · p. 6","src":null,"ocr":"Situação Problema\nA Cartilha Nacional de Humanização é um documento fundamental que visa promover a humanização no atendimento à saúde\nno Brasil. Desenvolvida pelo Ministério da Saúde, essa cartilha propõe diretrizes e práticas que buscam transformar a relação\nentre profissionais de saúde e pacientes, priorizando a dignidade, o respeito e a acolhida. Sobre os conceitos básicos da Cartilha\nNacional de Humanização, assinale V para as afirmativas verdadeiras e F para as falsas:\nI A humanização no atendimento à saúde envolve a promoção de relações mais acolhedoras e respeitosas entre profissionais de\nsaúde e pacientes, priorizando a dignidade do ser humano.\nII A Cartilha Nacional de Humanização propõe que a participação da comunidade e dos usuários nos processos de gestão e\ncontrole social não é uma prioridade nas práticas de saúde.\nIII A abordagem humanizada na saúde busca integrar aspectos físicos, emocionais e sociais do paciente, reconhecendo-o como\num indivíduo completo em suas necessidades.\nComando Resposta\nSobre as afirmativas acima, assinale a alternativa correta:\nA. Todas as afirmativas são verdadeiras.\nVer justificativa da alterantiva\nVocê acertou\nB.\nApenas as afirmativas I e III são verdadeiras.\nVer justificativa da alterantiva\nC. Apenas a afirmativa II é verdadeira.\nVer justificativa da alterantiva\nD. Todas as afirmativas são falsas.\nVer iustificativa da alterantiva","question":{"kind":"choice","stem":"A Cartilha Nacional de Humanização é um documento fundamental que visa promover a humanização no atendimento à saúde no Brasil. Desenvolvida pelo Ministério da Saúde, essa cartilha propõe diretrizes e práticas que buscam transformar a relação entre profissionais de saúde e pacientes, priorizando a dignidade, o respeito e a acolhida. Sobre os conceitos básicos da Cartilha Nacional de Humanização, assinale V para as afirmativas verdadeiras e F para as falsas: I A humanização no atendimento à saúde envolve a promoção de relações mais acolhedoras e respeitosas entre profissionais de saúde e pacientes, priorizando a dignidade do ser humano. II A Cartilha Nacional de Humanização propõe que a participação da comunidade e dos usuários nos processos de gestão e controle social não é uma prioridade nas práticas de saúde. III A abordagem humanizada na saúde busca integrar aspectos físicos, emocionais e sociais do paciente, reconhecendo-o como um indivíduo completo em suas necessidades.","command":"Sobre as afirmativas acima, assinale a alternativa correta:","options":["Todas as afirmativas são verdadeiras.","Apenas as afirmativas I e III são verdadeiras.","Apenas a afirmativa II é verdadeira.","Todas as afirmativas são falsas."],"answer":1,"check_layout":false}},{"id":"p81-07","page":7,"short":"Página 7","label":"Parcial 81 · p. 7","src":null,"ocr":"Situação Problema\nA Política Nacional de Humanização (PNH) foi instituída com o objetivo de promover uma abordagem mais acolhedora e\nrespeitosa nos serviços de saúde do Brasil. Baseada em princípios como a integralidade, a equidade e a participação social, a\nPNH busca transformar as relações entre usuários e profissionais de saúde, assegurando que o atendimento seja centrado nas\nnecessidades e na dignidade de cada indivíduo. A implementação dessa política requer a compreensão de conceitos\nfundamentais que orientam a prática humanizada, como o fortalecimento do vínculo, a escuta ativa e a valorização da\nsubjetividade do paciente.\nAnalise as afirmativas abaixo:\nA) A integralidade no atendimento refere-se apenas à oferta de serviços médicos, desconsiderando aspectos sociais e\nemocionais dos pacientes.\nB) A equidade implica tratar todos os pacientes da mesma forma, independentemente de suas particularidades e necessidades\nespecíficas.\nC) A participação social é um princípio que visa incluir a comunidade na construção e avaliação dos serviços de saúde,\npromovendo a corresponsabilidade.\nD) O fortalecimento do vínculo entre profissionais de saúde e pacientes é uma abordagem que deve ser evitada, pois pode\ncomprometer a objetividade do atendimento.\nComando Resposta\nSobre os conceitos que norteiam o trabalho da Política Nacional de Humanização, assinale a alternativa correta:\nA. Apenas a alternativa A é correta.\nVer justificativa da alterantiva\nB.\nApenas a alternativa B é correta.\nVer justificativa da alterantiva\nVocê acertou\nC. Apenas a alternativa C é correta.\nVer justificativa da alterantiva\nD. Apenas a alternativa D é correta.\nVer iustificativa da alterantiva","question":{"kind":"choice","stem":"A Política Nacional de Humanização (PNH) foi instituída com o objetivo de promover uma abordagem mais acolhedora e respeitosa nos serviços de saúde do Brasil. Baseada em princípios como a integralidade, a equidade e a participação social, a PNH busca transformar as relações entre usuários e profissionais de saúde, assegurando que o atendimento seja centrado nas necessidades e na dignidade de cada indivíduo. A implementação dessa política requer a compreensão de conceitos fundamentais que orientam a prática humanizada, como o fortalecimento do vínculo, a escuta ativa e a valorização da subjetividade do paciente. Analise as afirmativas abaixo: A) A integralidade no atendimento refere-se apenas à oferta de serviços médicos, desconsiderando aspectos sociais e emocionais dos pacientes. B) A equidade implica tratar todos os pacientes da mesma forma, independentemente de suas particularidades e necessidades específicas. C) A participação social é um princípio que visa incluir a comunidade na construção e avaliação dos serviços de saúde, promovendo a corresponsabilidade. D) O fortalecimento do vínculo entre profissionais de saúde e pacientes é uma abordagem que deve ser evitada, pois pode comprometer a objetividade do atendimento.","command":"Sobre os conceitos que norteiam o trabalho da Política Nacional de Humanização, assinale a alternativa correta:","options":["Apenas a alternativa A é correta.","Apenas a alternativa B é correta.","Apenas a alternativa C é correta.","Apenas a alternativa D é correta."],"answer":2,"check_layout":false}},{"id":"p81-08","page":8,"short":"Página 8","label":"Parcial 81 · p. 8","src":null,"ocr":"Situação Problema\nMuitas barreiras dificultam a comunicação, que gera significados relevantes tanto para o trabalhador de saúde como para o\nusuário, sendo objeto de vários estudos que abordam essa temática. Essas dificuldades decorrem de linguagens e saberes\ndiferentes, nem sempre compartilhados entre os interlocutores, limitações orgânicas do receptor ou emissor (afasias, déficit\nauditivo, déficit visual), imposição de valores e influência de mecanismos inconscientes, entre outros.\nComando Resposta\nCaso o usuário não consiga entender o que foi informado, pode-se afirmar que houve uma falha na comunicação. Em qual parte\ndo processo ocorreu a falha?\nVocê acertou\nA. Decodificação.\nVer justificativa da alterantiva\nB.\nCod ificação.\nVer justificativa da alterantiva\nC. Canal.\nVer justificativa da alterantiva\nD. Processo.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Muitas barreiras dificultam a comunicação, que gera significados relevantes tanto para o trabalhador de saúde como para o usuário, sendo objeto de vários estudos que abordam essa temática. Essas dificuldades decorrem de linguagens e saberes diferentes, nem sempre compartilhados entre os interlocutores, limitações orgânicas do receptor ou emissor (afasias, déficit auditivo, déficit visual), imposição de valores e influência de mecanismos inconscientes, entre outros.","command":"Caso o usuário não consiga entender o que foi informado, pode-se afirmar que houve uma falha na comunicação. Em qual parte\ndo processo ocorreu a falha?","options":["Decodificação.","Cod ificação.","Canal.","Processo."],"answer":0,"check_layout":false}},{"id":"p81-09","page":9,"short":"Página 9","label":"Parcial 81 · p. 9","src":null,"ocr":"Situação Problema\nO processo comunicativo é definido como um ato caracterizado não por relações de poder, mas por atitudes de sensibilidade,\naceitação e empatia entre os sujeitos, em um universo de significações que envolvem tanto a dimensão verbal como a não\nverbal.\nComando Resposta\nSão exemplos de comunicação não-verbal:\nVocê acertou\nA. Postura e gestos.\nVer justificativa da alterantiva\nB. Escrita e oratória.\nVer justificativa da alterantiva\nC. Oratória e postura.\nVer justificativa da alterantiva\nD. Vestuário e escrita.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"O processo comunicativo é definido como um ato caracterizado não por relações de poder, mas por atitudes de sensibilidade, aceitação e empatia entre os sujeitos, em um universo de significações que envolvem tanto a dimensão verbal como a não verbal.","command":"São exemplos de comunicação não-verbal:","options":["Postura e gestos.","Escrita e oratória.","Oratória e postura.","Vestuário e escrita."],"answer":0,"check_layout":false}},{"id":"p81-10","page":10,"short":"Página 10","label":"Parcial 81 · p. 10","src":null,"ocr":"Situação Problema\nAlém de propiciar uma relação terapêutica, a comunicação deve propiciar condições para práticas de promoção da saúde,\ntornando o usuário/cuidador autônomo à negociação diante do tratamento e das condições que favorecem o autocuidado e/ou\no cuidado da criança sob sua responsabilidade.\nComando Resposta\nO processo de comunicação efetiva favorece a Humanização do atendimento em quais aspectos?\nA. Acolhimento, vínculo e Hombridade.\nB. Biológicos, tecnológicos e Integralidade.\nVer justificativa da alterantiva\nC. Acolhimento, tecnológicos e Lealdade.\nVer justificativa da alterantiva\nD.\nVocê acertou\nAcolhimento, vínculo e Integralidade.","question":{"kind":"choice","stem":"Além de propiciar uma relação terapêutica, a comunicação deve propiciar condições para práticas de promoção da saúde, tornando o usuário/cuidador autônomo à negociação diante do tratamento e das condições que favorecem o autocuidado e/ou o cuidado da criança sob sua responsabilidade.","command":"O processo de comunicação efetiva favorece a Humanização do atendimento em quais aspectos?","options":["Acolhimento, vínculo e Hombridade.","Biológicos, tecnológicos e Integralidade.","Acolhimento, tecnológicos e Lealdade.","Acolhimento, vínculo e Integralidade."],"answer":3,"check_layout":false}},{"id":"p81-11","page":11,"short":"Página 11","label":"Parcial 81 · p. 11","src":null,"ocr":"Situação Problema\nMarcos* , homem de 55 anos, com diagnóstico de hipertensão arterial sistêmica e diabetes mellitus tipo 2, compareceu à\nUnidade Básica de Saúde (UBS) para consulta de rotina previamente agendada. Durante a espera, relatou à recepcionista que\nestava com dor de cabeça intensa. Foi orientado a aguardar até o horário marcado, pois a agenda estava cheia e alguns casos\nde demanda espontânea mais graves foram passados na frente, No entanto, após insistir sobre suas queixas, um técnico de\nenfermagem verificou sua pressão arterial, que estava muito elevada (200/110 mmHg), indicando uma urgência hipertensiva. O\nmédico foi chamado, realizou atendimento imediato e prescreveu medidas de estabilização. O técnico de enfermagem\nadministrou a medicação e retornou para verificar seus sinais vitais (*Os nomes e casos são fictícios).\nComando Resposta\nAssinale a alternativa que apresenta um dos três olhares da integralidade que foi descumprido no caso de Marcos e sua\nrespectiva justificativa.\nA. Traço da boa medicina, visto que houve espaço para conversa para além da demanda explícita e da atenção biopsicossocial.\nVer justificativa da alterantiva\nB. Respostas governamentais a problemas específicos, pois houve dificuldade de articulação entre diferentes políticas públicas.\nEjustificativa da alterantiva\nC. Modos de organizar as práticas, pois não houve conversa para além da demanda explícita entre atenção básica e especializada.\nVer justificativa da alterantiva\nVocê acertou\nD. Modos de organizar as práticas, visto que faltou articulação entre demanda programada e demanda espontânea.\nEjustificativa da alterantiva","question":{"kind":"choice","stem":"Marcos* , homem de 55 anos, com diagnóstico de hipertensão arterial sistêmica e diabetes mellitus tipo 2, compareceu à Unidade Básica de Saúde (UBS) para consulta de rotina previamente agendada. Durante a espera, relatou à recepcionista que estava com dor de cabeça intensa. Foi orientado a aguardar até o horário marcado, pois a agenda estava cheia e alguns casos de demanda espontânea mais graves foram passados na frente, No entanto, após insistir sobre suas queixas, um técnico de enfermagem verificou sua pressão arterial, que estava muito elevada (200/110 mmHg), indicando uma urgência hipertensiva. O médico foi chamado, realizou atendimento imediato e prescreveu medidas de estabilização. O técnico de enfermagem administrou a medicação e retornou para verificar seus sinais vitais (*Os nomes e casos são fictícios).","command":"Assinale a alternativa que apresenta um dos três olhares da integralidade que foi descumprido no caso de Marcos e sua","options":["Traço da boa medicina, visto que houve espaço para conversa para além da demanda explícita e da atenção biopsicossocial.","Respostas governamentais a problemas específicos, pois houve dificuldade de articulação entre diferentes po cios).","command":"No caso do Sr. Antônio assinale a alternativa que apresenta uma consequência da relação médico paciente que se estabeleceu.","options":["Maior satisfação de médicos e equipes.","Eleva a eficiência na alocação de recursos.","Aumento de processos legais contra serviços.","Aumento da produtividade de equipes de saúde."],"answer":2,"check_layout":false}},{"id":"p81-22","page":22,"short":"Página 22","label":"Parcial 81 · p. 22","src":null,"ocr":"Situação Problema\nA Política Nacional de Humanização atua a partir de orientações clínicas, éticas e políticas, que se traduzem em determinados\narranjos de trabalho. Dentre os conceitos que norteiam o trabalho da PNH, a Ambiência pode ser pensada por profissionais da\nequipe de saúde junto a profissionais de outras áreas do conhecimento.\nComando Resposta\nDefina abaixo o que é ambiência e como fazê-la.\nSua resposta\nAmbiência se trata da construção de um local acolhedor, confortável e ideal para o paciente, fortalecendo sua confiança com o\nprofissional e permitindo uma maior humanização do atendimento. Ela é feita por meio do preparo arquitetônico e do planejamento do\nlocal em conjunto, ou seja, os diferentes profissionais que vão participar da construção e da atuação nesse local devem entrar em\nconcenso para que haja a formulação de um espaço adequado.\nTotal de caracteres: 445\nResposta esperada:\nDefinição: Criar espaços saudáveis, acolhedores e confortáveis, que respeitem a privacidade, propiciem mudanças no processo de\ntrabalho e sejam lugares de encontro entre as pessoas.\nComo fazê-la: A discussão compartilhada do projeto arquitetônico, das reformas e do uso dos espaços de acordo com as\nnecessidades de usuários e trabalhadores de cada serviço é uma orientação que pode melhorar o trabalho em saúde.","question":{"kind":"written","stem":"A Política Nacional de Humanização atua a partir de orientações clínicas, éticas e políticas, que se traduzem em determinados arranjos de trabalho. Dentre os conceitos que norteiam o trabalho da PNH, a Ambiência pode ser pensada por profissionais da equipe de saúde junto a profissionais de outras áreas do conhecimento.","command":"Defina abaixo o que é ambiência e como fazê-la.","expected":"Definição: Criar espaços saudáveis, acolhedores e confortáveis, que respeitem a privacidade, propiciem mudanças no processo de\ntrabalho e sejam lugares de encontro entre as pessoas.\nComo fazê-la: A discussão compartilhada do projeto arquitetônico, das reformas e do uso dos espaços de acordo com as\nnecessidades de usuários e trabalhadores de cada serviço é uma orientação que pode melhorar o trabalho em saúde."}},{"id":"p81-23","page":23,"short":"Página 23","label":"Parcial 81 · p. 23","src":null,"ocr":"Situação Problema\nA comunicação terapêutica é definida como a habilidade do trabalhador de saúde em ajudar as pessoas a enfrentar situações\ntemporárias de estresse, conviver com outras pessoas, ajustar-se à realidade, superar os bloqueios, favorecer o tratamento e o\ndesenvolvimento dos pacientes, tornando-os ativos no processo de cuidar.\nComando Resposta\nCom base na definição acima, qual é o foco da comunicação entre trabalhadores de saúde e usuários?\nSua resposta\nO foca na da comunicação deve ser a criação de vínculo. Para que, então, o usuário se sinta confortável em expressar suas queixas,\nsejam elas físicas, psicológicas ou sociais. Isso ocorre, pois o profissional propiciou uma relação adequada, com escuta ativa e escolha\ndas palavras corretas, propiciando um entendimento e abertura ideal por parte do usuário.\nTotal de caracteres: 357\nResposta esperada:\nAjudar os pacientes a enfrentar situações de estresse e envolvê-los no processo de cuidado. A definição de comunicação\nterapêutica menciona que essa habilidade permite ao trabalhador de saúde ajudar os pacientes a enfrentar estresse, conviver com\noutras pessoas, ajustar-se à realidade e se tornar ativo no seu processo de cuidado. Isso implica uma abordagem humanizada,\nonde o foco está na interação e no apoio ao paciente, promovendo seu desenvolvimento e bem-estar, ao invés de uma relação\nautoritária ou puramente informativa.","question":{"kind":"written","stem":"A comunicação terapêutica é definida como a habilidade do trabalhador de saúde em ajudar as pessoas a enfrentar situações temporárias de estresse, conviver com outras pessoas, ajustar-se à realidade, superar os bloqueios, favorecer o tratamento e o desenvolvimento dos pacientes, tornando-os ativos no processo de cuidar.","command":"Com base na definição acima, qual é o foco da comunicação entre trabalhadores de saúde e usuários?","expected":"Ajudar os pacientes a enfrentar situações de estresse e envolvê-los no processo de cuidado. A definição de comunicação\nterapêutica menciona que essa habilidade permite ao trabalhador de saúde ajudar os pacientes a enfrentar estresse, conviver com\noutras pessoas, ajustar-se à realidade e se tornar ativo no seu processo de cuidado. Isso implica uma abordagem humanizada,\nonde o foco está na interação e no apoio ao paciente, promovendo seu desenvolvimento e bem-estar, ao invés de uma relação\nautoritária ou puramente informativa."}},{"id":"p81-24","page":24,"short":"Página 24","label":"Parcial 81 · p. 24","src":null,"ocr":"Situação Problema\nCarla*, mulher de 42 anos, tinha consulta agendada com reumatologista e relatou dores difusas pelo corpo e cansaço extremo,\nsintomas que já vinham comprometendo seu trabalho e vida social. Ela explicou que outros médicos já haviam solicitado\nexames, todos com resultados normais, mas que as dores persistem, estavam piorando e que ela não conseguia fazer nada.\nDurante a consulta, Carla falava muito, mas o reumatologista a interrompia, relacionando seu quadro ao \"nervosismo\" e\nansiedade, assim, prescreveu analgésicos e calmante. Quando Carla tentou falar sobre tratamentos que leu em grupos de\npacientes com fibromialgia, o médico reagiu com impaciência, encerrou a consulta e recomendou que ela \"tentasse relaxar\".\n(*Os nomes e casos são fictícios).\nComando Resposta\nTendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três elementos que tornam Carla, uma\npaciente difícil, do ponto de vista do médico.\nSua resposta\nCarla apresenta sintomas inespecíficos- Além disso, teve contato com outros médicos o que gera um preconceito prévio. E o fato dela\nentrar no consultório com uma pesquisa própria, faz com que ela inicie o atendimento com uma expectativa de determinado diagnóstico.\nTotal de caracteres: 264\nResposta esperada:\nPodem ser listados três dos seguintes elementos: Condições psicossomáticas e de saúde mental, já que a dor crônica da\nfibromialgia não se explica por exames objetivos. Sofrimento, evidenciado pelo impacto emocional e social das dores. Excesso de\nparticipação na consulta, quando Carla tenta expor repetidamente sua experiência e preocupações. Pesquisa sobre sua condição\nou busca por outras opiniões médicas, ao mencionar alternativas vistas em grupos de pacientes e na internet.","question":{"kind":"written","stem":"Carla*, mulher de 42 anos, tinha consulta agendada com reumatologista e relatou dores difusas pelo corpo e cansaço extremo, sintomas que já vinham comprometendo seu trabalho e vida social. Ela explicou que outros médicos já haviam solicitado exames, todos com resultados normais, mas que as dores persistem, estavam piorando e que ela não conseguia fazer nada. Durante a consulta, Carla falava muito, mas o reumatologista a interrompia, relacionando seu quadro ao \"nervosismo\" e ansiedade, assim, prescreveu analgésicos e calmante. Quando Carla tentou falar sobre tratamentos que leu em grupos de pacientes com fibromialgia, o médico reagiu com impaciência, encerrou a consulta e recomendou que ela \"tentasse relaxar\". (*Os nomes e casos são fictícios).","command":"Tendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três elementos que tornam Carla, uma\npaciente difícil, do ponto de vista do médico.","expected":"Podem ser listados três dos seguintes elementos: Condições psicossomáticas e de saúde mental, já que a dor crônica da\nfibromialgia não se explica por exames objetivos. Sofrimento, evidenciado pelo impacto emocional e social das dores. Excesso de\nparticipação na consulta, quando Carla tenta expor repetidamente sua experiência e preocupações. Pesquisa sobre sua condição\nou busca por outras opiniões médicas, ao mencionar alternativas vistas em grupos de pacientes e na internet."}}]},{"key":"p82","group":"parciais","turma":"82","file":"Parcial humanização 82.pdf","items":[{"id":"p82-01","page":1,"short":"Página 1 · Item 1","label":"Parcial 82 · p. 1","src":null,"ocr":"Item 1\nCódigo:\nSituação Problema\nUm médico atende um paciente idoso em sua primeira consulta. Durante a anamnese, o médico\nmantém contato visual, acena positivamente com a cabeça enquanto o paciente fala e mantém\numa postura corporal aberta, sem interromper o paciente para fazer anotações.\nComando Resposta\nCom base nos conceitos de comunicação, qual componente está sendo priorizado pelo médico?\nVocê acertou\nA. Comunicação não-verbal\nVer justificativa da alterantiva\nB. Comunicação verbal escrita\nVer justificativa da alterantiva\nC. Ruído de comunicação\nVer justificativa da alterantiva\nD. Comunicação agressiva\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Um médico atende um paciente idoso em sua primeira consulta. Durante a anamnese, o médico mantém contato visual, acena positivamente com a cabeça enquanto o paciente fala e mantém uma postura corporal aberta, sem interromper o paciente para fazer anotações.","command":"Com base nos conceitos de comunicação, qual componente está sendo priorizado pelo médico?","options":["Comunicação não-verbal","Comunicação verbal escrita","Ruído de comunicação","Comunicação agressiva"],"answer":0,"check_layout":false}},{"id":"p82-02","page":2,"short":"Página 2 · Item 2","label":"Parcial 82 · p. 2","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nDurante a explicação de um diagnóstico complexo, o médico utiliza termos técnicos como\n\"dislipidemia\" e \"esteatose hepática\" com um paciente de baixa escolaridade. O paciente balança a\ncabeça em concordância, mas mantém uma expressão facial de confusão.\nComando Resposta\nConsiderando o processo de comunicação, qual elemento apresenta falha nesta interação?\nO canal de comunicação\nVer justificativa da alterantiva\nVocê acertou\nB. A codificação da mensagem\nVer justificativa da alterantiva\nC. O feedback negativo\nVer justificativa da alterantiva\nD. A ausência de um receptor\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Durante a explicação de um diagnóstico complexo, o médico utiliza termos técnicos como \"dislipidemia\" e \"esteatose hepática\" com um paciente de baixa escolaridade. O paciente balança a cabeça em concordância, mas mantém uma expressão facial de confusão.","command":"Considerando o processo de comunicação, qual elemento apresenta falha nesta interação?","options":["O canal de comunicação","A codificação da mensagem","O feedback negativo","A ausência de um receptor"],"answer":1,"check_layout":false}},{"id":"p82-03","page":3,"short":"Página 3 · Item 3","label":"Parcial 82 · p. 3","src":null,"ocr":"Item 3\nCódigo:\nSituação Problema\nNo processo de comunicação interpessoal, o sucesso da transmissão de uma ideia depende da\nintegridade de diferentes etapas.\nComando Resposta\nQuando um médico traduz o seu raciocínio clínico em orientações verbais e o paciente, ao recebê-\nIas, interpreta-as sob a influência de seus próprios valores e experiências prévias, estamos diante,\nrespectivamente, das etapas de:\ncanal e descodificação.\nVer justificativa da alterantiva\nVocê acertou\nB.\ncodificação e decodificação\nVer justificativa da alterantiva\nC. retroalimentação e repertório\nVer justificativa da alterantiva\nD. emissão e ruído semântico\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"No processo de comunicação interpessoal, o sucesso da transmissão de uma ideia depende da integridade de diferentes etapas.","command":"Quando um médico traduz o seu raciocínio clínico em orientações verbais e o paciente, ao recebê-\nIas, interpreta-as sob a influência de seus próprios valores e experiências prévias, estamos diante,\nrespectivamente, das etapas de:","options":["canal e descodificação.","codificação e decodificação","retroalimentação e repertório","emissão e ruído semântico"],"answer":1,"check_layout":false}},{"id":"p82-04","page":4,"short":"Página 4 · Item 4","label":"Parcial 82 · p. 4","src":null,"ocr":"Item 4\nCódigo:\nSituação Problema\nUma médica precisa comunicar uma notícia difícil à família de um paciente internado. Ela escolhe\num local reservado, utiliza um tom de voz calmo, mantém o silêncio após a fala e permite que os\nfamiliares expressem suas emoções livremente.\nComando Resposta\nEssa postura exemplifica qual conceito fundamental da comunicação médica?\nComunicação centrada no médico\nVer justificativa da alterantiva\nVocê acertou\nB. Humanização da assistência\nVer justificativa da alterantiva\nC. Ruído físico de ambiente\nVer justificativa da alterantiva\nD. Descodificação técnica\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Uma médica precisa comunicar uma notícia difícil à família de um paciente internado. Ela escolhe um local reservado, utiliza um tom de voz calmo, mantém o silêncio após a fala e permite que os familiares expressem suas emoções livremente.","command":"Essa postura exemplifica qual conceito fundamental da comunicação médica?","options":["Comunicação centrada no médico","Humanização da assistência","Ruído físico de ambiente","Descodificação técnica"],"answer":1,"check_layout":false}},{"id":"p82-05","page":5,"short":"Página 5 · Item 5","label":"Parcial 82 · p. 5","src":null,"ocr":"Item 5\nCódigo:\nSituação Problema\nUm hospital decide reformar sua recepção, removendo balcões altos que separavam funcionários\nde pacientes, instalando iluminação natural e criando espaços que facilitam o encontro e a\ncirculação das pessoas.\nComando Resposta\nDe acordo com o referencial da Política Nacional de Humanização, a diretriz de \"Ambiência\" é\nentendida como:\nO tratamento estético do espaço físico visando o conforto hoteleiro.\nVer justificativa da alterantiva\nVocê acertou\nEspaço que favorece a reflexão sobre o processo de trabalho e a facilitação de encontros entre\nB.\nsujeitos.\nVer justificativa da alterantiva\nC. A padronização dos fluxos administrativos para evitar o contato social.\nVer justificativa da alterantiva\nD. A estrutura arquitetônica para isolamento de doenças.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Um hospital decide reformar sua recepção, removendo balcões altos que separavam funcionários de pacientes, instalando iluminação natural e criando espaços que facilitam o encontro e a circulação das pessoas.","command":"De acordo com o referencial da Política Nacional de Humanização, a diretriz de \"Ambiência\" é\nentendida como:","options":["O tratamento estético do espaço físico visando o conforto hoteleiro.","Espaço que favorece a reflexão sobre o processo de trabalho e a facilitação de encontros entre sujeitos.","A padronização dos fluxos administrativos para evitar o contato social.","A estrutura arquitetônica para isolamento de doenças."],"answer":1,"check_layout":false}},{"id":"p82-06","page":6,"short":"Página 6 · Item 6","label":"Parcial 82 · p. 6","src":null,"ocr":"Item 6\nCódigo:\nSituação Problema\nA Política Nacional de Humanização (PNH) afirma que a inclusão dos sujeitos e dos coletivos nos\nprocessos de gestão e de cuidado produz alterações significativas nos modos de gerir e de cuidar,\nconsolidando o Método da PNH.\nComando Resposta\nNeste contexto, a diretriz da \"Transversalidade\" na PNH é corretamente definida como:\na criação de novos órgãos hierárquicos para fiscalizar a humanização.\nVer justificativa da alterantiva\nB.\no aumento da autonomia técnica do médico sobre a equipe.\nVer justificativa da alterantiva\nVocê acertou\nC.\na ampliação do diálogo e a quebra de fronteiras entre diferentes saberes, poderes e sujeitos.\nVer justificativa da alterantiva\nD.\na separação estrita entre as práticas de gestão e a assistência direta.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"A Política Nacional de Humanização (PNH) afirma que a inclusão dos sujeitos e dos coletivos nos processos de gestão e de cuidado produz alterações significativas nos modos de gerir e de cuidar, consolidando o Método da PNH.","command":"Neste contexto, a diretriz da \"Transversalidade\" na PNH é corretamente definida como:","options":["a criação de novos órgãos hierárquicos para fiscalizar a humanização.","o aumento da autonomia técnica do médico sobre a equipe.","a ampliação do diálogo e a quebra de fronteiras entre diferentes saberes, poderes e sujeitos.","a separação estrita entre as práticas de gestão e a assistência direta."],"answer":2,"check_layout":false}},{"id":"p82-07","page":7,"short":"Página 7 · Item 7","label":"Parcial 82 · p. 7","src":null,"ocr":"Item 7\nCódigo:\nSituação Problema\nUm gestor de uma Unidade Básica de Saúde decide implementar a Política Nacional de\nHumanização (PNH). Para isso, ele convoca uma reunião restrita apenas ao corpo médico para\ndefinir novas metas de produtividade, sem incluir os demais profissionais da equipe\nmultiprofissional ou os representantes dos usuários.\nComando Resposta\nConsiderando os princípios da PNH, qual conceito fundamental está sendo negligenciado pelo\ngestor?\nVocê marcou\nA. Indissociabilidade entre gestão e atenção.\nVer justificativa da alterantiva\nB. Transversalidade.\nVer justificativa da alterantiva\nResposta correta\nC. Protagonismo, corresponsabilidade e autonomia dos sujeitos.\nVer justificativa da alterantiva\nD. Acolhimento com classificação de risco.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Um gestor de uma Unidade Básica de Saúde decide implementar a Política Nacional de Humanização (PNH). Para isso, ele convoca uma reunião restrita apenas ao corpo médico para definir novas metas de produtividade, sem incluir os demais profissionais da equipe multiprofissional ou os representantes dos usuários.","command":"Considerando os princípios da PNH, qual conceito fundamental está sendo negligenciado pelo\ngestor?","options":["Indissociabilidade entre gestão e atenção.","Transversalidade.","Protagonismo, corresponsabilidade e autonomia dos sujeitos.","Acolhimento com classificação de risco."],"answer":2,"check_layout":false}},{"id":"p82-08","page":8,"short":"Página 8 · Item 8","label":"Parcial 82 · p. 8","src":null,"ocr":"Item 8\nCódigo:\nSituação Problema\nUma Unidade de Pronto Atendimento (UPA) enfrenta superlotação. A equipe decide extinguir a fila\npor ordem estrita de chegada, implementando uma escuta qualificada que utiliza critérios de\ngravidade e vulnerabilidade para priorizar o tempo de espera.\nComando Resposta\nEssa estratégia de intervenção da Política Nacional de Humanização é denominada:\nambiência.\nVer justificativa da alterantiva\nVocê acertou\nB.\nacolhimento com classificação de risco\nVer justificativa da alterantiva\nC. gestão participativa\nVer justificativa da alterantiva\nD. clínica ampliada\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Uma Unidade de Pronto Atendimento (UPA) enfrenta superlotação. A equipe decide extinguir a fila por ordem estrita de chegada, implementando uma escuta qualificada que utiliza critérios de gravidade e vulnerabilidade para priorizar o tempo de espera.","command":"Essa estratégia de intervenção da Política Nacional de Humanização é denominada:","options":["ambiência.","acolhimento com classificação de risco","gestão participativa","clínica ampliada"],"answer":1,"check_layout":false}},{"id":"p82-09", ndimentos da unidade de saúde.\nVer justificativa da alterantiva\nVocê acertou\nA atuação da enfermeira mitiga riscos de processos legais e eventos adversos ao validar a subjetividade da\nB.\npaciente e discutir o plano de cuidado.\nVer justificativa da alterantiva\nO médico estabeleceu uma comunicação assertiva e produtiva, garantindo que a paciente focasse nas\nc.\nnecessidades nutricionais do recém-nascido.\nVer justificativa da alterantiva\nAs condutas de médico e enfermeira elevam a satisfação entre membros da equipe, visto que cada um traz\nD.\ncontribuições para o cuidado humanizado.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Maria*, 22 anos, puérpera há 12 dias, comparece à consulta com seu bebê e sua mãe (acompanhante). Maria relata choro constante e medo de não conseguir cuidar do bebê. Sua mãe explica que a filha não está comendo e nem dormindo bem e pergunta se poderia dar umas vitaminas que pesquisou na internet. O médico interrompe a fala da acompanhante afirmando que \"o cansaço é inerente à maternidade\" e que \"o foco agora deve ser o ganho de peso do recém-nascido\". Maria explica sobre o sono ruim, ele a interrompe e prescreve um suplemento vitamínico e a encaminha para a enfermeira. A enfermeira, ao recebê-las, detalha o plano de cuidado para amamentação, alimentação e sono, além de encaminhar para a psicóloga, explicando um pouco sobre a disforia puerperal e a depressão pós-parto. (*Os nomes e casos são fictícios).","command":"Assinale a alternativa que analisa corretamente a situação de Maria sob a ótica da gestão do cuidado\nhumanizado.","options":["A conduta do médico eleva a eficiência na alocação de recursos ao priorizar o binômio biológico e agilizar o fluxo de atendimentos da unidade de saúde.","A atuação da enfermeira mitiga riscos de processos legais e eventos adversos ao validar a subjetividade da paciente e discutir o plano de cuidado.","O médico estabeleceu uma comunicação assertiva e produtiva, garantindo que a paciente focasse nas necessidades nutricionais do recém-nascido.","As condutas de médico e enfermeira elevam a satisfação entre membros da equipe, visto que cada um traz contribuições para o cuidado humanizado."],"answer":1,"check_layout":false}},{"id":"p82-22","page":22,"short":"Página 22 · Item 1","label":"Parcial 82 · p. 22","src":null,"ocr":"Item 1\nCódigo:\nSituação Problema\nDurante uma aula prática de semiologia, um estudante questiona o professor sobre porque ele deve se\npreocupar com a forma como se senta ou olha para o paciente, se o mais importante é fazer o diagnóstico\ncorreto da doença.\nComando Resposta\nExplique o conceito de comunicação no contexto da saúde e porque ela é considerada uma \"via de mão dupla\".\nSua resposta\nComunicação nesse contexto é mais que só a forma de falar, é a codificacao correta da mensagem (que garanta uma\ndecodificação adequada pelo ouvinte).É tambem a postura, gestos e expreçoes (comunicação não verbal corporal), a\nescuta ativa das queixas do paciente e a garantia de entendimento de seus dizeres (assim como a confirmação de que\no paciente entendeu tudo aquilo que foi passado para ele)\nTotal de caracteres: 397\nResposta esperada:\nA comunicação na saúde é o processo de troca de informações, sentimentos e significados entre profissionais e\npacientes. Ela é uma \"via de mão dupla\" porque não envolve apenas a transmissão de dados pelo médico\n(emissor), mas exige a recepção, compreensão e o feedback do paciente (receptor). A interação eficaz depende da\nvalidação de que a mensagem foi entendida, permitindo que ambos os atores construam juntos o plano\nterapêutico.","question":{"kind":"written","stem":"Durante uma aula prática de semiologia, um estudante questiona o professor sobre porque ele deve se preocupar com a forma como se senta ou olha para o paciente, se o mais importante é fazer o diagnóstico correto da doença.","command":"Explique o conceito de comunicação no contexto da saúde e porque ela é considerada uma \"via de mão dupla\".","expected":"A comunicação na saúde é o processo de troca de informações, sentimentos e significados entre profissionais e\npacientes. Ela é uma \"via de mão dupla\" porque não envolve apenas a transmissão de dados pelo médico\n(emissor), mas exige a recepção, compreensão e o feedback do paciente (receptor). A interação eficaz depende da\nvalidação de que a mensagem foi entendida, permitindo que ambos os atores construam juntos o plano\nterapêutico."}},{"id":"p82-23","page":23,"short":"Página 23 · Item 2","label":"Parcial 82 · p. 23","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nUm hospital universitário percebe que as decisões clínicas são tomadas exclusivamente pelo preceptor da\ndisciplina, sem ouvir a equipe de enfermagem ou os desejos do paciente sobre o tratamento. A Política\nNacional de Humanização sugere a implementação de \"Colegiados Gestores\" e \"Equipes de Referência\".\nComando Resposta\nExplique o que é a diretriz de Indissociabilidade entre Atenção e Gestão proposta pela Política Nacional de\nHumanização e como ela se aplica para resolver o problema de autoritarismo descrito no caso.\nSua resposta\nA diretriz de indissociabilidade diz que a organisacao, tomada de decisao e a propria gestao do espaço de saude deve\nser realizada por todos os proficionais que ali trabalham, utilizando dos conhecimentos e praticas individuais para\ngarantir uma gestao integrada, inteligente e funcional. Nesse caso apresentado a diretriz entraria mudando o fluxo das\ndecisoes clinicas, que seriam tomadas em conunto por todos os setores pertinentes de maneira integrada e funcional.\nTotal de caracteres: 467\nResposta esperada:\nA indissociabilidade entre atenção e gestão significa que o modo como se gerencia o serviço reflete diretamente no\nmodo como se cuida do paciente. No caso citado, a aplicação desta diretriz exige que a gestão deixe de ser vertical\ne autoritária para ser compartilhada (cogestão). Ao incluir diferentes saberes e a voz do paciente na tomada de\ndecisão, melhora-se tanto a qualidade da assistência quanto a democratização das relações de trabalho.","question":{"kind":"written","stem":"Um hospital universitário percebe que as decisões clínicas são tomadas exclusivamente pelo preceptor da disciplina, sem ouvir a equipe de enfermagem ou os desejos do paciente sobre o tratamento. A Política Nacional de Humanização sugere a implementação de \"Colegiados Gestores\" e \"Equipes de Referência\".","command":"Explique o que é a diretriz de Indissociabilidade entre Atenção e Gestão proposta pela Política Nacional de\nHumanização e como ela se aplica para resolver o problema de autoritarismo descrito no caso.","expected":"A indissociabilidade entre atenção e gestão significa que o modo como se gerencia o serviço reflete diretamente no\nmodo como se cuida do paciente. No caso citado, a aplicação desta diretriz exige que a gestão deixe de ser vertical\ne autoritária para ser compartilhada (cogestão). Ao incluir diferentes saberes e a voz do paciente na tomada de\ndecisão, melhora-se tanto a qualidade da assistência quanto a democratização das relações de trabalho."}},{"id":"p82-24","page":24,"short":"Página 24 · Item 3","label":"Parcial 82 · p. 24","src":null,"ocr":"Item 3\nCódigo:\nSituação Problema\nMaria*, 22 anos, puérpera há 12 dias, comparece à consulta com seu bebê e sua mãe (acompanhante). Maria\nrelata choro constante e medo de não conseguir cuidar do bebê. Sua mãe explica que a filha não está comendo\ne nem dormindo bem e pergunta se poderia dar umas vitaminas que pesquisou na internet. O médico\ninterrompe a fala da acompanhante afirmando que \"o cansaço é inerente à maternidade\" e que \"o foco agora\ndeve ser o ganho de peso do recém-nascido\". Maria explica sobre o sono ruim, ele a interrompe e prescreve\num suplemento vitamínico e a encaminha para a enfermeira. A enfermeira, ao recebê-las, detalha o plano de\ncuidado para amamentação, alimentação e sono, além de encaminhar para a psicóloga, explicando um pouco\nsobre a disforia puerperal e a depressão pós-parto. (*Os nomes e casos são fictícios).\nComando Resposta\nTendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três elementos que\ntornam Maria, uma paciente difícil, do ponto de vista do médico.\nSua resposta\n1: Paciente possui queixas tanto fisicas quando psicologicas (Um tipo de queixa impactando o outro)\n2: Maria esta em um contexto de vulnerabilidade, por estar diante de um episodio novo e impactante em sua vida.\n3: A acompanhante de maria propoe tratamentos paralelos e opcoes nao embasadas em conhecimentos medicos\nestabelecidos, confundindo a terapeutica de Maria.\nTotal de caracteres: 366\nResposta esperada:\nPodem ser listados três dos seguintes elementos: Condições psicossomáticas e de saúde mental, já que existe o\nrisco dela estar vivenciando a disforia puerperal ou pior, uma depressão pós parto. Sofrimento, evidenciado pelo\nimpacto emocional e de qualidade de vida no puerpério. Excesso de participação na consulta, quando Maria e a\nmãe tentam expor mais de uma vez as preocupações com sono e alimentação. Pesquisa sobre sua condição ou\nbusca por outras opiniões médicas, ao mencionar alternativas vistas na internet como o uso de vitaminas.","question":{"kind":"written","stem":"Maria*, 22 anos, puérpera há 12 dias, comparece à consulta com seu bebê e sua mãe (acompanhante). Maria relata choro constante e medo de não conseguir cuidar do bebê. Sua mãe explica que a filha não está comendo e nem dormindo bem e pergunta se poderia dar umas vitaminas que pesquisou na internet. O médico interrompe a fala da acompanhante afirmando que \"o cansaço é inerente à maternidade\" e que \"o foco agora deve ser o ganho de peso do recém-nascido\". Maria explica sobre o sono ruim, ele a interrompe e prescreve um suplemento vitamínico e a encaminha para a enfermeira. A enfermeira, ao recebê-las, detalha o plano de cuidado para amamentação, alimentação e sono, além de encaminhar para a psicóloga, explicando um pouco sobre a disforia puerperal e a depressão pós-parto. (*Os nomes e casos são fictícios).","command":"Tendo em vista o caso acima, descreva, de acordo com Cruvinel e Grosseman (2023), três elementos que\ntornam Maria, uma paciente difícil, do ponto de vista do médico.","expected":"Podem ser listados três dos seguintes elementos: Condições psicossomáticas e de saúde mental, já que existe o\nrisco dela estar vivenciando a disforia puerperal ou pior, uma depressão pós parto. Sofrimento, evidenciado pelo\nimpacto emocional e de qualidade de vida no puerpério. Excesso de participação na consulta, quando Maria e a\nmãe tentam expor mais de uma vez as preocupações com sono e alimentação. Pesquisa sobre sua condição ou\nbusca por outras opiniões médicas, ao mencionar alternativas vistas na internet como o uso de vitaminas."}}]},{"key":"p83","group":"parciais","turma":"83","file":"Parcial humanização 83.pdf","items":[{"id":"p83-01","page":1,"short":"Página 1 · Item 1","label":"Parcial 83 · p. 1","src":null,"ocr":"Item 1\nCódigo:\nSituação Problema\nMarcos*, 42 anos, servente de pedreiro, procura o Centro de Saúde com queixa de lombalgia intensa e episódios de insônia\ndesde que perdeu o emprego, há quatro meses. Ao chegar na recepção, foi informado que a triagem da sua equipe já havia\nencerrado e que ele deveria retornar na próxima semana bem cedo. para tentar uma vaga. Diante de sua expressão de intensa\ndor, o enfermeiro de sua equipe interveio e o convidou para uma sala, onde ele contou sobre a fase de angústia devido à perda\ndo emprego. O enfermeiro, preocupado com Marcos, providenciou um encaixe e o médico clínico geral, ao receber Marcos,\nafirmou: \"Vou prescrever um analgésico forte, isso vai te ajudar, interrompeu as tentativas de Marcos de falar mais sobre Si e\nencerrou a consulta (*Os nomes e casos são fictícios).\nComando Resposta\nCom base na reflexão teórica de Mattos (2001) sobre os três sentidos da integralidade, assinale a alternativa que analisa\ncorretamente a falha observada na dimensão do modo de organizar as práticas no atendimento de Marcos.\nResposta correta\nApresenta-se pelo término do horário da triagem como justificativa para que Marcos voltasse outro dia, evidenciando uma\norganização de serviços burocrática. sem acolhimento da demanda espontânea.\nVer justificativa da alterantiva\nVocê marcou\nConsiste na postura restritiva do médico durante a consulta, ao interromper o relato de Marcos sobre a perda do emprego e\nB.\nfocar a conduta apenas na prescrição de analgésicos para a dor lombar física.\nRevela-se na ausência de diretrizes e protocolos ministeriais específicos que obriguem as equipes de Atenção Primária à Saúde a\nc.\nrealizar triagens voltadas às dores crônicas associadas ao desemprego.\nVer justificativa da alterantiva\nManifesta-se na intervenção do enfermeiro para conseguir o encaixe do paciente, visto que a quebra do fluxo programado\nD.\ndesrespeita os critérios institucionais de organização da rede assistencial.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Marcos*, 42 anos, servente de pedreiro, procura o Centro de Saúde com queixa de lombalgia intensa e episódios de insônia desde que perdeu o emprego, há quatro meses. Ao chegar na recepção, foi informado que a triagem da sua equipe já havia encerrado e que ele deveria retornar na próxima semana bem cedo. para tentar uma vaga. Diante de sua expressão de intensa dor, o enfermeiro de sua equipe interveio e o convidou para uma sala, onde ele contou sobre a fase de angústia devido à perda do emprego. O enfermeiro, preocupado com Marcos, providenciou um encaixe e o médico clínico geral, ao receber Marcos, afirmou: \"Vou prescrever um analgésico forte, isso vai te ajudar, interrompeu as tentativas de Marcos de falar mais sobre Si e encerrou a consulta (*Os nomes e casos são fictícios).","command":"Com base na reflexão teórica de Mattos (2001) sobre os três sentidos da integralidade, assinale a alternativa que analisa\ncorretamente a falha observada na dimensão do modo de organizar as práticas no atendimento de Marcos.","options":["Apresenta-se pelo término do horário da triagem como justificativa para que Marcos voltasse outro dia, evidenciando uma organização de serviços burocrática. sem acolhimento da demanda espontânea.","Consiste na postura restritiva do médico durante a consulta, ao interromper o relato de Marcos sobre a perda do emprego e focar a conduta apenas na prescrição de analgésicos para a dor lombar física.","Revela-se na ausência de diretrizes e protocolos ministeriais específicos que obriguem as equipes de Atenção Primária à Saúde a realizar triagens voltadas às dores crônicas associadas ao desemprego.","Manifesta-se na intervenção do enfermeiro para conseguir o encaixe do paciente, visto que a quebra do fluxo programado desrespeita os critérios institucionais de organização da rede assistencial."],"answer":0,"check_layout":false}},{"id":"p83-02","page":2,"short":"Página 2 · Item 2","label":"Parcial 83 · p. 2","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nMarcos, 42 anos, servente de pedreiro, procura o Centro de Saúde com queixa de lombalgia intensa e episódios de insônia\ndesde que perdeu o emprego, há quatro meses, Ao chegar na recepção, foi informado que a triagem da sua equipe já havia\nencerrado e que ele deveria retornar na próxima semana bem cedo, para tentar uma vaga. Diante de sua expressão de intensa\ndor, o enfermeiro de sua equipe interveio e o convidou para uma sala, onde ele contou sobre a fase de angústia devido à perda\ndo emprego. O enfermeiro, preocupado com Marcos, providenciou um encaixe e o médico clínico geral, ao receber Marcos,\nafirmou: \"Vou prescrever um analgésico forte. isso vai te ajudar\", interrompeu as tentativas de Marcos de falar mais sobre si e\nencerrou a consulta (*Os nomes e casos são fictícios).\nComando Resposta\nConsiderando os sentidos da integralidade discutidos por Mattos (2001), assinale a alternativa que analisa corretamente o caso.\nA prescrição do analgésico garantiu um cuidado integral, pois respondeu de forma imediata ao principal sintoma apresentado\npelo usuário.\nA integralidade foi comprometida principalmente pela ausência de encaminhamento de Marcos para um serviço especializado\nB.\nem ortopedia.\nVer justificativa da alterantiva\nA escuta realizada pelo enfermeiro foi suficiente para assegurar a integralidade do atendimento, independentemente da conduta\nc.\nadotada na consulta médica.\nVer justificativa da alterantiva\nD.\nVocê scertou\nA restrição do acesso e a conduta médica revelam problemas na organização do serviço e uma prática que desconsidera as\ndimensões emocional e social do adoecimento.","question":{"kind":"choice","stem":"Marcos, 42 anos, servente de pedreiro, procura o Centro de Saúde com queixa de lombalgia intensa e episódios de insônia desde que perdeu o emprego, há quatro meses, Ao chegar na recepção, foi informado que a triagem da sua equipe já havia encerrado e que ele deveria retornar na próxima semana bem cedo, para tentar uma vaga. Diante de sua expressão de intensa dor, o enfermeiro de sua equipe interveio e o convidou para uma sala, onde ele contou sobre a fase de angústia devido à perda do emprego. O enfermeiro, preocupado com Marcos, providenciou um encaixe e o médico clínico geral, ao receber Marcos, afirmou: \"Vou prescrever um analgésico forte. isso vai te ajudar\", interrompeu as tentativas de Marcos de falar mais sobre si e encerrou a consulta (*Os nomes e casos são fictícios).","command":"Considerando os sentidos da integralidade discutidos por Mattos (2001), assinale a alternativa que analisa corretamente o caso.","options":["A prescrição do analgésico garantiu um cuidado integral, pois respondeu de forma imediata ao principal sintoma apresentado pelo usuário.","A integralidade foi comprometida principalmente pela ausência de encaminhamento de Marcos para um serviço especializado em ortopedia.","A escuta realizada pelo enfermeiro foi suficiente para assegurar a integralidade do atendimento, independentemente da conduta adotada na consulta médica.","A restrição do acesso e a conduta médica revelam problemas na organização do serviço e uma prática que desconsidera as dimensões emocional e social do adoecimento."],"answer":3,"check_layout":false}},{"id":"p83-03","page":3,"short":"Página 3 · Item 3","label":"Parcial 83 · p. 3","src":null,"ocr":"Item 3\nCódigo:\nSituação Problema\nMarcos, 42 anos. servente de pedreiro. procura o Centro de Saúde com queixa de lombalgia intensa e episódios de insônia\ndesde que perdeu o emprego, há quatro meses. Ao chegar na recepção, foi informado que a triagem da sua equipe já havia\nencerrado e que ele deveria retornar na próxima semana bem cedo, para tentar uma vaga. Diante de sua expressão de intensa\ndor. o enfermeiro de sua equipe interveio e o convidou para uma sala, onde ele contou sobre a fase de angústia devido à perda\ndo emprego. O enfermeiro, preocupado com Marcos, providenciou um encaixe e o médico clínico geral, ao receber Marcos,\nafirmou: \"Vou prescrever um analgésico forte, isso vai te ajudar\", interrompeu as tentativas de Marcos de falar mais sobre si e\nencerrou a consulta (*Os nomes e casos são fictícios).\nComando Resposta\nConsiderando o princípio da integralidade, assinale a alternativa que apresenta a conduta mais adequada às necessidades de\nMarcos.\nAvaliar a lombalgia, prescrever o analgésico e orientar Marcos a retornar em consulta programada caso a dor e a insônia\npersistam.\nVer iustificativa da alterantiva\nVocê acertou\nAvaliar a lombalgia, acolher o sofrimento relacionado ao desemprego, construir um plano de cuidado compartilhado e\nB.\narticular acompanhamento.\nVer justificativa da alterpntiva\nEncaminhar Marcos para a ortopedia e para a saúde mental, permitindo que cada serviço conduza separadamente os problemas\nc.\nfísicos e emocionais identificados.\nTratar in \". Sem explicar o procedimento nem solicitar sua autorização, realiza o exame de toque vaginal. Em\nseguida, informa que a acompanhante deverá sair da sala e acrescenta: \"Isso é para sua segurança, melhor não questionar\nminha conduta\". Julieta fica constrangida, chora e deixa de fazer perguntas. Na troca de plantão, uma outra médica se apresenta\ne acolhe Julieta e sua companheira, explica os achados da avaliação e pergunta como elas desejam participar das decisões.\nAntes de cada procedimento, esclarece sua finalidade e solicita o consentimento de Julieta, além de favorecer a permanência da\nacompanhante durante o trabalho de parto. (*Os nomes e os casos são fictícios.)\nComando Resposta\nConsiderando a perspectiva da gestante e de sua acompanhante, assinale a alternativa que identifica corretamente os\ncomportamentos que contribuíram para caracterizar o primeiro profissional como um \"médico difícil\".\nA indicação do exame de toque vaginal, a restrição temporária da acompanhante e a apresentação de orientações sobre o\ntrabalho de parto.\nVer justificativa da alterantiva\nA discordância em relação ao plano de parto, a realização do exame obstétrico e a definição dos limites de participação da\nB.\nacompanhante.\nVer justificativa da alterantiva\nVocê acertou\nA desqualificação dos questionamentos, a imposição da autoridade profissional e a realização do exame sem explicação e\nc.\nconsentimento da gestante.\nYEiustificativa da alterantiva\nA priorização da segurança materno-fetal, a comunicação objetiva das decisões e a condução técnica do atendimento pelo\nD.\nprofissional.\nda alterantiva","question":{"kind":"choice","stem":"Julieta*, 27 anos, primigesta. com 39 semanas de gestação. procura a maternidade acompanhada de sua companheira após o início de contrações dolorosas. Durante a avaliação, Julieta entrega seu plano de parto, pergunta sobre os procedimentos e manifesta o desejo de permanecer com a acompanhante. O médico demonstra impaciência e afirma: \"
