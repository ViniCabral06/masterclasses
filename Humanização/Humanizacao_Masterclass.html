sidades de todos os envolvidos, o que\nfacilita a resolução de conflitos de maneira construtiva.","question":null},{"id":"s80-02","page":2,"short":"Justificativa · p. 2 · D","label":"Somativa 80 · p. 2","src":"_img/4af839504af14924.webp","ocr":"A CNV incentiva a compreensão profunda das necessidades de todos os envolvidos, o que\nfacilita a resolução de conflitos de maneira construtiva.","question":null},{"id":"s80-03","page":3,"short":"Justificativa · p. 3 · A","label":"Somativa 80 · p. 3","src":"_img/d93de6db659a5d5b.webp","ocr":"Os quatro componentes principais da Comunicação Não Violenta, segundo Marshall\nRosenberg, são:\n1. Descrição da situação (Observação): Relatar os fatos concretos, sem julgamentos ou\navaliações.\n2. Identificação do estado emocional (Sentimento): Expressar como nos sentimos em relação\nà situação observada.\n3. Reconhecimento da carência (Necessidade): Identificar qual necessidade nossa está\nconectada ao sentimento.\n4. Formulação do que se deseja (Pedido): Fazer um pedido claro, específico e acionável ao\noutro. A alternativa correta reflete esses quatro componentes de forma clara e concisa. As\noutras opções contêm elementos que não fazem parte da estrutura fundamental da CNV,\ncomo julgamentos, críticas, ordens ou interpretações subjetivas.","question":null},{"id":"s80-04","page":4,"short":"Justificativa · p. 4 · D","label":"Somativa 80 · p. 4","src":"_img/538c18e8cfa2c132.webp","ocr":"A ortotanásia consiste em permitir que a morte siga seu curso natural, sem a utilização de\nmeios artificiais que apenas prolongariam o processo de morrer, sem oferecer perspectiva de\ncura ou melhora significativa na qualidade de vida. A alternativa correta descreve a\nsuspensão de tratamentos que visam modificar a doença (já em fase terminal) e o foco no\ncuidado paliativo, aliviando o sofrimento e permitindo que a morte ocorra naturalmente,\nrespeitando a autonomia do paciente em recusar intervenções que apenas prolongariam seu\nsofrimento.","question":null},{"id":"s80-05","page":5,"short":"Justificativa · p. 5 · A","label":"Somativa 80 · p. 5","src":"_img/354018321015f2d9.webp","ocr":"A equipe multidisciplinar é essencial para oferecer um atendimento integral e personalizado\nem cuidados paliativos, abordando as necessidades físicas, emocionais, sociais e espirituais\ndo paciente e de sua família. Embora médicos e enfermeiros desempenhem papéis cruciais, a\nexpertise de psicólogos, assistentes sociais e outros profissionais (como terapeutas\nocupacionais, fisioterapeutas, nutricionistas e conselheiros espirituais) é fundamental para\num cuidado completo.","question":null},{"id":"s80-06","page":6,"short":"Justificativa · p. 6 · D","label":"Somativa 80 · p. 6","src":"_img/065ecc452fdd0a87.webp","ocr":"Os cuidados paliativos visam atender às necessidades holísticas do paciente e de sua família,\npromovendo conforto e dignidade.","question":null},{"id":"s80-07","page":7,"short":"Justificativa · p. 7 · A","label":"Somativa 80 · p. 7","src":"_img/59f4f641ff502d10.webp","ocr":"As tecnologias leves referem-se às tecnologias das relações, aos processos comunicacionais e\nà produção de vínculos entre profissionais de saúde e pacientes. A escuta qualificada e a\nempatia são ferramentas essenciais para compreender as necessidades do paciente,\nconstruir confiança e promover um cuidado humanizado. As outras alternativas descrevem:\nTecnologias duras: Envolvem equipamentos e recursos materiais.\nTecnologias leve-duras: Relacionam-se aos saberes estruturados, como protocolos e\ndiretrizes. Tecnologias duras: Envolvem ferramentas e sistemas materiais e informacionais.","question":null},{"id":"s80-08","page":8,"short":"Justificativa · p. 8 · D","label":"Somativa 80 · p. 8","src":"_img/567e2e04fa0fe1b2.webp","ocr":"Os profissionais de saúde frequentemente enfrentam dilemas éticos ao tentar equilibrar a\nresponsabilidade pelo cuidado com as necessidades e expectativas dos pacientes. Questões\ncomo a autonomia do paciente, a transparência na comunicação e a gestão de expectativas\npodem complicar essa dinâmica. Discutir esses desafios é fundamental para promover uma\nprática ética e humanizada na saúde.","question":null},{"id":"s80-09","page":9,"short":"Justificativa · p. 9 · D","label":"Somativa 80 · p. 9","src":"_img/fd441bb05364345e.webp","ocr":"A escuta ativa é uma prática essencial na humanização do atendimento, pois demonstra\nrespeito e interesse pelas preocupações do paciente, criando um vínculo de confiança e\npromovendo um ambiente onde o paciente se sente seguro para expressar suas\nnecessidades.","question":null},{"id":"s80-10","page":10,"short":"Justificativa · p. 10 · D","label":"Somativa 80 · p. 10","src":"_img/0588d4f632f222ee.webp","ocr":"O acolhimento visa criar um ambiente seguro e de confiança para o paciente, onde ele se\nsinta ouvido e respeitado. A cordialidade, o interesse genuíno e a escuta atenta são\nelementos essenciais para estabelecer uma relação terapêutica positiva desde o início.","question":null},{"id":"s80-11","page":11,"short":"Justificativa · p. 11 · A","label":"Somativa 80 · p. 11","src":"_img/69a3c3b7d2833f13.webp","ocr":"Fortalecer o vínculo envolve estabelecer uma relação de confiança e empatia,\ncompreendendo a perspectiva da paciente. Promover a responsabilização implica em\nconstruir um plano de cuidado em conjunto, considerando as dificuldades da paciente e\nbuscando soluções realistas, em vez de apenas impor o tratamento.","question":null},{"id":"s80-12","page":12,"short":"Justificativa · p. 12 · D","label":"Somativa 80 · p. 12","src":"_img/b64689263cc7d8ac.webp","ocr":"Em casos complexos, fortalecer o vínculo e a responsabilização exige uma abordagem\nintegrada e multidisciplinar. Compreender as razões da resistência do usuário, revisitar o\nplano de cuidado de forma colaborativa e articular ações com a rede de apoio demonstram\num cuidado integral e uma responsabilização compartilhada pela equipe em garantir a\ncontinuidade do tratamento e o bem-estar do usuário.","question":null},{"id":"s80-13","page":13,"short":"Justificativa · p. 13 · D","label":"Somativa 80 · p. 13","src":"_img/8a9e75554534eaa3.webp","ocr":"A comunicação terapêutica eficaz centra-se na criação de um ambiente de confiança e\ncompreensão mútua. • Empatia permite ao profissional reconhecer e validar os sentimentos e\nperspectivas do paciente, acompanhante ou familiar. • A escuta ativa envolve prestar total\natenção ao que está sendo dito, tanto verbal quanto não verbalmente, demonstrando\ninteresse genuíno e permitindo que o interlocutor se sinta ouvido e compreendido. • Adaptar\na linguagem significa utilizar termos simples e claros, evitando jargões técnicos que possam\ngerar confusão ou ansiedade. Isso garante que a informação seja acessível e que as\norientações sejam seguidas corretamente.","question":null},{"id":"s80-14","page":14,"short":"Justificativa · p. 14 · D","label":"Somativa 80 · p. 14","src":"_img/ca7eba243ac3c690.webp","ocr":"Afirmativa l: Verdadeira. A escuta ativa é uma técnica essencial que permite ao médico\ncompreender melhor as preocupações e necessidades do paciente, facilitando uma\ncomunicação mais eficaz e empática.\nAfirmativa II: Falsa. A comunicação não verbal, incluindo expressões faciais, gestos e postura,\ntem um impacto significativo na interação entre médico e paciente. Ela pode transmitir\nempatia, atenção e compreensão, complementando a comunicação verbal.\nAfirmativa III: Verdadeira. A inclusão do acompanhante nas discussões sobre o tratamento é\nbenéfica, pois pode ajudar a esclarecer dúvidas e aumentar a adesão do paciente ao plano de\ncuidados. Os acompanhantes muitas vezes oferecem suporte emocional e prático, além de\najudar na retenção de informações.","question":null},{"id":"s80-15","page":15,"short":"Justificativa · p. 15 · D","label":"Somativa 80 · p. 15","src":"_img/dfde03d033b6cf39.webp","ocr":"Afirmativa l: Verdadeira. A comunicação eficaz é fundamental para aumentar a satisfação do\npaciente e a adesão ao tratamento, pois promove um entendimento claro das instruções e\ncria um ambiente de confiança.\nAfirmativa II: Falsa, A comunicação não verbal, como expressões faciais e postura, influencia\nsignificativamente a percepção do paciente sobre o médico e pode afetar a relação médico-\npaciente.\nAfirmativa III: Verdadeira. A escuta ativa é uma habilidade essencial que permite ao médico\ncompreender melhor as preocupações e necessidades do paciente, facilitando um\natendimento mais eficaz.\nAfirmativa IV: Falsa. A comunicação interprofissional é extremamente relevante para a\nsegurança do paciente, pois a troca eficaz de informações entre os membros da equipe de\nsaúde é crucial para evitar erros e garantir um cuidado integrado.","question":null},{"id":"s80-16","page":16,"short":"Justificativa · p. 16 · B","label":"Somativa 80 · p. 16","src":"_img/1b3b93bf09843af1.webp","ocr":"Movimento de digitação é uma comunicação não verbal; A testa franzida ou levar a mão à\ntesta são formas de comunicação não verbal; O e-mail com orientações é uma comunicação\nverbal escrita; O prontuário de Elias não foi mencionado e nem uma prescrição\nmedicamentosa; O médico usou a oralidade para dizer \"verifique seu email\"; O tom de voz\nsuave é comunicação não verbal.","question":null},{"id":"s80-17","page":17,"short":"Justificativa · p. 17 · C","label":"Somativa 80 · p. 17","src":"_img/04bbb6a8f2947b88.webp","ocr":"O canal é por onde a mensagem foi transmitida no processo de comunicação. No caso, Elias\nutiliza seu celular e o médico, aparentemente um computador, mas o comando solicita\napenas o que Elias usou.","question":null},{"id":"s80-18","page":18,"short":"Justificativa · p. 18 · A","label":"Somativa 80 · p. 18","src":"_img/093db8b287c0911a.webp","ocr":"O médico decodificou a mensagem não verbal de Elias (franzir testa) e mudou sua\ncomunicação não verbal, tentando melhorar o processo - Correto; Quando Elias compreende\na mensagem sobre o e-mail enviado, ele decodifica e não codifica, visto que o emissor desta\nmensagem era o médico; Elias não apresentou feedback de grande aceitação, mas sim com a\n\"testa ainda franzida, mas assentindo levemente, responde que vai verificar\"; Elias codifica\nsua mensagem e não decodifica, ao franzir a testa, visto que ele é o emissor.","question":null},{"id":"s80-19","page":19,"short":"Justificativa · p. 19 · A","label":"Somativa 80 · p. 19","src":"_img/56c1a5228071ccdd.webp","ocr":"Cada profissional está fazendo a sua parte, porém sem clareza da comunicação entre eles e\ndas trocas entre suas tomadas de decisão, concatenando num cuidado fragmentado que\nconta apenas com justaposição de profissões distintas, mas sem interação efetiva.","question":null},{"id":"s80-20","page":20,"short":"Justificativa · p. 20 · C","label":"Somativa 80 · p. 20","src":"_img/bfba212af5df50b4.webp","ocr":"O terapeuta ocupacional (TO) não atua diretamente na dificuldade de deglutição, mas sim o\nfonoaudiólogo, além de atuar na dificuldade de fala. O TO não atua na restrição de\nmovimentação do paciente, mas sim na retomada de atividades funcionais, motoras finas,\nquando o quadro clínico estiver estável. O psicólogo, por sua vez, não se envolve de forma\ndireta na necessidade de reabilitação, pois é tarefa mais comum do fisioterapeuta.","question":null},{"id":"s80-21","page":21,"short":"Justificativa · p. 21 · D","label":"Somativa 80 · p. 21","src":"_img/8b165820707fb707.webp","ocr":"Não há menção explícita no caso de Joaquim sobre: Barulho de maquinário; Ausência de\nprotocolos; e Expressões faciais e corporais. Porém, há de comunicação verbal escrita\nindecifrável, ou ilegível.","question":null},{"id":"s80-22","page":22,"short":"Justificativa · p. 22 · C","label":"Somativa 80 · p. 22","src":"_img/415da2f1e9a444ae.webp","ocr":"Etapa Ausente: E - Emotions (Abordar as Emoções): Embora a médica tenha sido séria ao\ncomunicar a notícia, não há nenhuma indicação de que ela tenha explicitamente reconhecido\nou abordado as possíveis emoções do pai. A reação do pai à notícia grave (medo, ansiedade,\npreocupação) não é mencionada, e a médica não oferece nenhuma frase ou ação que\ndemonstre empatia ou convide o pai a expressar seus sentimentos. Apenas ao pergunta\ncomo ele se sente é que a médica faz uso da etapa Emotions. Nas demais ela só explica o\nprocedimento ser corriqueiro, dá falsas esperanças, ou reforça a necessidade do\nconsentimento dele.","question":null},{"id":"s80-23","page":23,"short":"Justificativa · p. 23 · C","label":"Somativa 80 · p. 23","src":"_img/ac8d1220e1a12aa0.webp","ocr":"Não é revelada reação do pai e por isso a médica também não percebe essa reação. A médica\nexplica a preparação para a cirurgia e como pode ser o pós operatório. A médica realmente\nnão revela se teve cuidados para o Setting up, tais como privacidade e conforto. A médica não\ntraz falsas esperanças ao pai.","question":null},{"id":"s80-24","page":24,"short":"Justificativa · p. 24 · D","label":"Somativa 80 · p. 24","src":"_img/03b6d845a4efd2e2.webp","ocr":"No passado, pensava-se que verbalizar más notícias aos pacientes poderia interferir\nnegativamente na manutenção de expectativas, o que incentivou a ocultação de informações\npor muitos anos. Atualmente, com o avanço da medicina leva a melhores prognósticos e\nmaior transparência entre médico, paciente e familiares, com diálogo e vínculo.","question":null},{"id":"s80-25","page":25,"short":"Justificativa · p. 25 · B","label":"Somativa 80 · p. 25","src":"_img/1a7168b1357445cd.webp","ocr":"A resposta ao sofrimento do paciente é um traço da boa medicina e não modo de organizar\nas práticas. A articulação de demanda programada e espontânea é um modo de organizar as\npráticas. A horizontalização dos programas é um modo de organizar as práticas. Ao identificar\na situação de risco, a enfermeira Maria, usou o olhar do modo de organizar as práticas e usou\na teleconsulta para uma definição de melhor conduta.","question":null},{"id":"s80-26","page":26,"short":"Justificativa · p. 26 · A","label":"Somativa 80 · p. 26","src":"_img/d22eb94aed46d188.webp","ocr":"Considera-se ação criativa da profissional usar a teleconsulta para resolver uma situação de\nrisco. Não está clara uma política para resolver problemas específicos, inclusive nada foi feito\npor não haver médicos interessados em trabalhar na unidade. A ação criativa dos\nprofissionais é resposta governamental a problemas específicos e não modo de organizar as\npráticas. Não há menção de atividades coletivas com a comunidade.","question":null},{"id":"s80-27","page":27,"short":"Justificativa · p. 27 · D","label":"Somativa 80 · p. 27","src":"_img/8167f1ec46907532.webp","ocr":"A ênfase biopsicossocial eleva o acesso qualitativo, à comunicação, subjetividade, o paciente\ncomo um todo e eleva a relação médico-paciente. Já a ênfase biomédica, eleva o acesso\nquantitativo, os fatos biológicos, densidade tecnológica e afasta a relação médico-paciente.","question":null},{"id":"s80-28","page":28,"short":"Justificativa · p. 28 · C","label":"Somativa 80 · p. 28","src":"_img/b00d0cdb807f0c9e.webp","ocr":"A interação inicial de Leandro na recepção do CS, marcada pelo uso de termos inadequados e\nperguntas invasivas feitas em público por um profissional despreparado, demonstra uma\nfalha significativa na diretriz do Acolhimento da Política Nacional de Humanização. As outras\ndiretrizes podem ser relevantes em outros momentos do atendimento, mas o desrespeito ao\nAcolhimento é o mais evidente na situação descrita. Transversalidade é um princípio e não\ndiretriz.","question":null},{"id":"s80-29","page":29,"short":"Justificativa · p. 29 · D","label":"Somativa 80 · p. 29","src":"_img/fa0fe99977b6f9b1.webp","ocr":"O atendimento com a psicóloga valorizou o protagonismo, a corresponsabilidade e a\nautonomia de Leandro ao criar um espaço onde ele se sentiu à vontade para expressar suas\nangústias e participar ativamente na construção de um plano de cuidado individualizado.\nEssa abordagem respeita a capacidade de Leandro de tomar decisões sobre seu tratamento e\no incentiva a se envolver de forma responsável em seu processo de recuperação. As outras\nalternativas não são o foco principal da valorização observada na consulta com a psicóloga,\nembora possam ser princípios importantes do HumanizaSUS em outros contextos. A\nTransversalidade não é explicitamente demonstrada na interação com a psicóloga e a\nIndissociabilidade entre atenção e gestão não é abordada no caso. Por fim, é diretriz e não\nprincípio, a Ambiência que se refere ao espaço físico, que não é o foco da melhora na\nexperiência de Leandro.","question":null},{"id":"s80-30","page":30,"short":"Justificativa · p. 30 · A","label":"Somativa 80 · p. 30","src":"_img/0a2e1e55323a1d08.webp","ocr":"Não houve incentivo à valorização dos trabalhadores do SUS; Não fica clara a ampliação da\noferta da PNH a gestores e conselhos, os quais sequer foram citados; Fica evidente a\nnecessidade de melhorar a formação (educação em serviço) e a produção de conhecimento\nem saúde para a pessoa LGBTQIAPN+, evitando atendimentos como o do recepcionista do\ncaso; Fortalecer as iniciativas em humanização existentes é um propósito da NH e não um\nmacro objetivo.","question":null}]},{"key":"s81","group":"somativas","turma":"81","file":"Somativa humanização 81.pdf","items":[{"id":"s81-01","page":1,"short":"Justificativa · p. 1 · A","label":"Somativa 81 · p. 1","src":"_img/2d1491054fdbefc4.webp","ocr":"Justificativa: A opção é a única que descreve e relaciona corretamente os conceitos técnicos\nda CNV de Marshall B. Rosenberg: Primeira Fase (Observação) vs. Avaliação/Comunicação\nAlienante: A CNV exige que a Observação dos fatos seja feita sem julgamento ou avaliação. A\nfala do Dr. Fernando (\"irresponsável e negligente\") é um ato de Comunicação Alienante que\nconsiste em julgar, rotular e classificar o paciente. A Avaliação é explicitamente o que a\nprimeira fase busca evitar, pois é uma expressão das necessidades e valores do médico, e\nnão um fato. Terceira Fase (Necessidade) e Responsabilidade: O objetivo da terceira fase\n(Necessidade) é reconhecer a causa do sentimento (no caso, a frustração do médico ou a\nansiedade do paciente) e que ela reside nas nossas necessidades. Ao ignorar essa fase, o\nmédico deixa de assumir a responsabilidade pessoal por seus sentimentos e falha em facilitar\na escuta profunda e a empatia. As demais opções contêm erros conceituais: • Opção 1: Erra\nao colocar o Sentimento como a primeira fase e o Pedido como a quarta, e descreve\nincorretamente o objetivo do Pedido. • Opção 2: Erra ao afirmar que o objetivo da\nObservação é a análise do comportamento ou diagnóstico. O diagnóstico é um dos hábitos\nque levam à Comunicação Alienante. • Opção 3: Erra ao confundir Observação com\nSentimento. O vocabulário de emoções é o foco da segunda fase (Sentimento), e não da\nterceira (Necessidade).","question":null},{"id":"s81-02","page":2,"short":"Página 2","label":"Somativa 81 · p. 2","src":"_img/1e6aa5088d03a57d.webp","ocr":"Justificativa da questão B\nJustificativa: Os quatro componentes principais da Comunicação Não Violenta, segundo\nx\nMarshall Rosenberg, são: 1. Descrição da situação (Observação): Relatar os fatos concretos,\nsem julgamentos ou avaliações. 2. Identificação do estado emocional (Sentimento): Expressar\ncomo nos sentimos em relação à situação observada. 3. Reconhecimento da carência\n(Necessidade): Identificar qual necessidade nossa está conectada ao sentimento. 4.\nFormulação do que se deseja (Pedido): Fazer um pedido claro, específico e acionável ao outro.\nA alternativa correta reflete esses quatro componentes de forma clara e concisa. As outras\nopções contêm elementos que não fazem parte da estrutura fundamental da CNV, como\njulgamentos, críticas, ordens ou interpretações subjetivas.","question":null},{"id":"s81-03","page":3,"short":"Justificativa · p. 3 · B","label":"Somativa 81 · p. 3","src":"_img/2ec70983eaf1b40f.webp","ocr":"Justificativa: A alternativa correta é a única que aplica os quatro componentes da CNV de\nforma técnica e correta, conforme o modelo de Marshall Rosenberg. 1. Observação: \"Quando\nvocê chega depois da hora marcada\" — Relato do fato concreto, neutro e sem avaliação da\nmoral ou caráter do paciente. 2. Sentimento: \"sinto-me apreensivo\" — Expressa um\nsentimento autêntico do médico (vulnerabilidade), e não um pseudo-sentimento que avalia a\nconduta do outro (\"não respeitado\"). 3. Necessidade: \"porque tenho uma necessidade de\norganização\" — Identifica a necessidade universal por trás do sentimento (organização,\nqualidade do cuidado), e não a exige como um meio. 4. Pedido (Ação Concreta e\nColaborativa): \"Gostaria de saber se há algum fator limitante e se podemos pactuar uma\nsolução acionável...\" — Formula um Pedido claro, específico e acionável que busca a\ncolaboração e a Corresponsabilidade na solução, em vez de uma Exigência ou Ordem. As\noutras opções falham nos seguintes conceitos: •\nOpção 1 : Contém um Pseudo-sentimento (\"não respeitado\") e um Pedido que é, na verdade,\numa Ordem/Exigência (\"exijo que você seja pontual\").\n• Opção 2: Contém Avaliação/Julgamento (\"comportamento irresponsável\") em vez de\nObservação e um Pedido Vago (\"esforce mais\") que não é acionável.\n• Opção 3: É um exemplo de Comunicação Alienante (\"falta de comprometimento\") e\nconfunde a Necessidade com o Meio de atendê-la (\"pontualidade\").","question":null},{"id":"s81-04","page":4,"short":"Justificativa · p. 4 · C","label":"Somativa 81 · p. 4","src":"_img/1e06f18645ccb09c.webp","ocr":"Justificativa: A alternativa correta é a única que relaciona corretamente os conceitos técnicos\ndefendidos pelos Cuidados Paliativos: 1. Conceito Oposto (Distanásia): A insistência da família\nem medidas invasivas e fúteis (\"tentar de tudo\") para prolongar a vida biológica a qualquer\ncusto, mesmo que cause sofrimento e sem qualidade de vida, é a definição técnica de\nDistanásia. A equipe de CP opõe-se a esta prática, pois ela viola a dignidade do paciente. 2.\nModalidade Buscada (Ortotanásia): A conduta de não apressar nem retardar o fim da vida,\npermitindo a Morte natural com dignidade e com controle de sintomas (manejo do Sintoma\nTotal), é a definição de Ortotanásia. 3. Princípio Ético (Primum non nocere): A decisão de\nsuspender tratamentos que causam sofrimento e não trazem benefício (como a intubação no\ncaso) é o cerne do princípio \"Primeiro, não prejudicar\", que se alinha à Ortotanásia. As demais\nalternativas contêm erros conceituais:\n• Opção 1: A equipe não busca a Mistanásia (morte miserável/evitável) e não se opõe à\nEutanásia de forma primária (o foco é Distanásia), além de defender o Controle Impecável\ndos Sintomas.\n• Opção 2: A equipe busca a Ortotanásia, não se opõe a ela.\n• Opção 3: A equipe não busca a Eutanásia (abreviar a vida), pois a CP Reafirma a vida e vê a\nmorte como um processo natural","question":null},{"id":"s81-05","page":5,"short":"Justificativa · p. 5 · B","label":"Somativa 81 · p. 5","src":"_img/4797c914d93409cd.webp","ocr":"• l. Falso: Os Cuidados Paliativos não são conduzidos exclusivamente por médicos e\nenfermeiros, nem limitados ao controle de sintomas físicos. O princípio é a abordagem ao\nSintoma Total (físico, psíquico, social e espiritual), o que exige uma equipe multidisciplinar\ncomposta por diversas áreas do saber.\n• II. Verdadeiro: A multidisciplinaridade (ou multiprofissionalidade) é um princípio essencial de\nCP. A formação ideal da equipe (médicos, enfermeiros, psicólogos e assistentes sociais) é o\nnúcleo para o manejo do Sintoma Total e para garantir a integralidade do cuidado.\n• III. Falso: Psicólogos e assistentes sociais são profissionais nucleares e obrigatórios na\nformação da equipe básica, e sua atuação deve ocorrer desde o diagnóstico de uma doença\nque ameace a continuidade da vida, e não apenas no final.\n• IV. Verdadeiro: A multidisciplinaridade implica que a equipe deve ser flexível e adaptável,\nadicionando outros profissionais (fisioterapeutas, nutricionistas, conselheiros espirituais, etc.)\nde acordo com as necessidades específicas e dinâmicas do paciente e da família, visando\nsempre a qualidade de vida.","question":null},{"id":"s81-06","page":6,"short":"Justificativa · p. 6 · B","label":"Somativa 81 · p. 6","src":"_img/a20a84c0c3929107.webp","ocr":"Justificativa: A alternativa demonstra a compreensão técnica e contemporânea dos Cuidados\nPaliativos: 1. Momento de Início (Simultaneidade): Um dos princípios fundamentais é que os\nCuidados Paliativos devem ser aplicados no início do diagnóstico de uma doença ameaçadora\nà vida, simultaneamente aos tratamentos modificadores da doença (como no caso da ELA). A\nhesitação do médico reflete a visão antiga e incorreta de que CP é sinônimo de terminalidade.\n2. Oposição Ética (Distanásia): O objetivo central dos CP é o alívio do sofrimento e a\ndignidade. Ao longo de toda a trajetória da doença, os CP se opõem à Distanásia, que é o\nprolongamento inútil da vida, com sofrimento, por meio de tratamentos que não trazem\nbenefício. A intervenção precoce ajuda o paciente a evitar a Distanásia no futuro e a viver\nmelhor no presente. As demais opções contêm erros conceituais graves:\n• Opção 1: Contém a definição incorreta de abordagem terminalista (o que deve ser evitado) e\nconfunde o foco principal da oposição (CP opõe-se primariamente à Distanásia, não à\nMistanásia, embora esta também seja evitada).\n• Opção 2: Reflete a visão desatualizada de CP e erra ao afirmar que a oposição à Eutanásia\nimplica compromisso com a vida \"a qualquer custo\" (o que seria Distanásia).\n• Opção 3: A dor refratária não é o único critério de inclusão, e CP não é sinônimo de sedação\npaliativa; a sedação é uma medida excepcional usada apenas para controle de sintomas\nrefratários na terminalidade.","question":null},{"id":"s81-07","page":7,"short":"Justificativa · p. 7 · C","label":"Somativa 81 · p. 7","src":"_img/40526f0e10a5d819.webp","ocr":"Justificativa: A opção correta é a única que engloba corretamente os três elementos técnicos\nviolados pela Dra. Ana e o conceito superior em questão:\n• Comunicação Efetiva: É o conceito central que falhou. Sua definição engloba todos os\ndemais elementos.\n• Negligência de Características Individuais: A Dra. Ana ignora o medo do paciente (perda de\nautonomia) e a preocupação da filha, reduzindo o indivíduo à sua patologia (doença renal), o\nque é o oposto de levar as Características Individuais em consideração.\n• Processo de Troca de Emoções: Ao interromper a filha sobre os \"detalhes emocionais\", a\nmédica desqualifica a necessidade da Troca de Emoções e não legitima a fala da família.\n• Inviabilização de Entendimento Mútuo e Relação: A postura rígida, a interrupção e a\ncomunicação unidirecional (folheto) impedem que o Entendimento Mútuo seja estabelecido e\ndestroem a possibilidade de uma Relação saudável e terapêutica, que é o objetivo final da\ncomunicação clínica.\nAs demais opções contêm conceitos trocados ou incompletos:\n• Opção 1: O Acolhimento é mais do que entregar um panfleto; ele pressupõe a escuta. O\ntermo Troca de Informações é incompleto, pois a falha primária foi na Troca de Emoções.\n• Opção 2: A médica não reconheceu as Características Individuais da pessoa, mas sim da\ndoença. O conceito de Corresponsabilização é secundário à falha de comunicação básica.\n• Opção 3: O Vínculo Terapêutico é uma consequência da boa comunicação ao longo do\ntempo, e não o conceito que define a falha pontual na interação. Além disso, a falha é mais\nprofunda do que apenas a Comunicação Não Verbal.","question":null},{"id":"s81-08","page":8,"short":"Justificativa · p. 8 · A","label":"Somativa 81 · p. 8","src":"_img/59a0715d33c7d571.webp","ocr":"Justificativa:\nAfirmativa I - Verdadeira: A escuta ativa é reconhecida como uma competência essencial da\ncomunicação clínica. Ela implica acolher o discurso do paciente sem interrupções, com\natenção plena, linguagem corporal receptiva e devolutivas que demonstrem compreensão\nempática. Essa técnica fortalece o vínculo, promove a construção compartilhada de decisões\ne melhora os desfechos clínicos e a adesão ao plano terapêutico.\nAfirmativa II - Falsa: A comunicação não verbal é fundamental na interação clínica. Elementos\ncomo tom de voz, contato visual, postura e expressões faciais podem **reforçar ou\ncontradizer** a mensagem verbal, impactando diretamente a percepção do paciente sobre o\ncuidado recebido. Ignorar sua importância compromete a eficácia da relação terapêutica.\nAfirmativa III Falsa: A participação de acompanhantes ou familiares, quando consentida pelo\npaciente, é altamente benéfica, especialmente em situações de vulnerabilidade, como idosos,\ncrianças ou pacientes com comprometimento cognitivo. Essa participação pode reforçar a\nsegurança da informação, apoiar a tomada de decisões e contribuir para o suporte\nemocional. O sigilo profissional deve ser mantido, mas não impede a comunicação com\nterceiros autorizados pelo paciente.","question":null},{"id":"s81-09","page":9,"short":"Justificativa · p. 9 · C","label":"Somativa 81 · p. 9","src":"_img/9f95bc7943846cb1.webp","ocr":"Justificativa: Cuidado centrado no Médico e Ênfase Biomédica: O Dr. Lucas demonstra um\nCuidado Centrado no Médico e uma Ênfase Biomédica ao afirmar que \"o que importa é a\ndoença\" e ao utilizar jargões inacessíveis. Esta postura se opõe ao Encontro Centrado na\nPessoa, que exige a exploração do contexto biopsicossocial. Legitimação da Fala: Ao\ninterromper o Sr. Roberto quando ele tenta expressar a preocupação e o contexto de\ndepressão do paciente, o médico falha no dever de validar e legitimar as emoções e na\nLegitimação da fala do... familiar, características fundamentais da Comunicação Efetiva.\nIncorreta 1: O Acolhimento e a Escuta Atenta são posturas permanentes na relação, e não se\nrestringem à recepção, sendo essenciais no Encontro Centrado na Pessoa.\nIncorreta 2: A atitude do Dr. Lucas não representa o modelo de Ênfase Biopsicossocial, mas\nsim o de Ênfase Biomédica, que desvaloriza a pessoa.\nIncorreta 3: Embora a Pactuação do Plano Terapêutico seja importante, ela é uma\nconsequência da boa comunicação. O Vínculo é uma construção de longo prazo, e a falha\nimediata e prioritária reside no modelo de comunicação utilizado (biomédico). A comunicação\nnão verbal (como a ausência de contato visual) é um elemento essencial e não irrelevante.","question":null},{"id":"s81-10","page":10,"short":"Página 10","label":"Somativa 81 · p. 10","src":"_img/fe132f553daa1164.webp","ocr":"Justificativa da questão D\nEm casos complexos, fortalecer o vínculo e a responsabilização exige uma abordagem\nintegrada e multidisciplinar. Compreender as razões da resistência do usuário, revisitar o\nplano de cuidado de forma colaborativa e articular ações com a rede de apoio demonstram\num cuidado integral e uma responsabilização compartilhada pela equipe em garantir a\ncontinuidade do tratamento e o bem-estar do usuário.\nx","question":null},{"id":"s81-11","page":11,"short":"Página 11","label":"Somativa 81 · p. 11","src":"_img/3863a0a72fb5d111.webp","ocr":"Justificativa da questão C\nx\nJustificativa: O caso clínico ilustra a fragmentação do cuidado, um dos problemas centrais\nque a PNH visa combater. A solução exige a articulação dos princípios:\n1. A Clínica Ampliada: É o trabalho clínico que visa o sujeito e a doença, a família e o\ncontexto. Ela exige um compromisso radical com o sujeito doente visto de modo singular,\nindo além do diagnóstico puramente biológico (descompensação glicêmica) para incorporar\nas dimensões psicológicas e sociais (desesperança, isolamento). Seu objetivo é produzir\nsaúde e aumentar a autonomia do sujeito, em contraponto à medicalização da vida.\n2. O Projeto Terapêutico Singular (PTS): É a ferramenta operacional da Clínica Ampliada. O\nPTS é uma reunião da equipe para discutir o caso, contendo uma avaliação orgânica,\npsicológica e social do sujeito, permitindo que a equipe assuma a responsabilidade sobre\nos usuários. Ele busca a singularidade (a diferença) como elemento central. Sua\nimplementação, através da Equipe de Referência, facilita a construção do vínculo\nlongitudinal (processo que ata ou liga, gerando uma ligação afetiva e moral) e transforma o\nprocesso de acolhimento em uma postura de escuta qualificada e compromisso em dar\nrespostas às necessidades de saúde.\n3. Transversalidade e Corresponsabilização: O trabalho em Equipe de Referência com PTS\nestimula a transversalidade (aumento do grau de abertura comunicacional entre os grupos\ne saberes) e reforça a corresponsabilidade entre gestores, trabalhadores e usuários no\nprocesso de produção de saúde. Isso é a manifestação da inseparabilidade entre clínica e\npolítica. Por que as outras alternativas estão incorretas ou são incompletas:\n• Ambiência: Embora importante para o conforto e o bem-estar psíquico e emocional, a\nAmbiência é um dispositivo de suporte, mas não é o instrumento primário para a\ntransformação do modelo clínico e a garantia do vínculo longitudinal (o qual é tarefa do\nPTS/Clínica Ampliada).\n• Acolhimento com Classificação de Risco (CR) e Apoio Matricial: O Acolhimento com CR é\nessencial para reverter a lógica da fila e priorizar o atendimento pelo agravo/sofrimento. O\nApoio Matricial é crucial para integrar especialistas, como a Saúde Mental. Contudo, focar\napenas nestes dispositivos não garante a transformação da prática clínica para além da\nurgência, pois o CR visa a agilidade no atendimento, enquanto o PTS visa o projeto de vida e\na autonomia do sujeito crônico.\n• Contratos de Gestão: Contratos de Gestão são dispositivos gerenciais que pactuam metas\nentre unidades. Embora possam incluir a qualificação e humanização da atenção, eles\noperam no eixo da gestão/financiamento e não no eixo da intervenção clínica singular (PTS)\nexigida pelo comando para lidar com a subjetividade e a fragmentação do cuidado.","question":null},{"id":"s81-12","page":12,"short":"Justificativa · p. 12 · D","label":"Somativa 81 · p. 12","src":"_img/7dc1835983c4a247.webp","ocr":"Justificativa: Segundo a Política Nacional de Humanização (PNH), os dispositivos de\nacolhimento, vínculo e responsabilização são centrais para a qualificação do cuidado e para a\nprodução de saúde. O acolhimento não se restringe à triagem técnica, mas implica escuta\nativa, reconhecimento da demanda e compromisso com a resolução dos problemas de\nsaúde. O vínculo é construído na relação entre trabalhador e usuário, fundamentado na\nconfiança, continuidade e respeito às necessidades singulares do sujeito. A responsabilização\nenvolve o comprometimento da equipe de saúde com o seguimento do caso, integrando\ndiferentes pontos da rede de atenção e promovendo corresponsabilidade com o usuário na\ncondução do cuidado. A conduta da médica no caso é um exemplo claro da aplicação desses\nprincípios: ela realiza uma escuta qualificada, acolhe o usuário sem julgamento, promove\nvínculo e responsabiliza-se por seu cuidado integral.","question":null},{"id":"s81-13","page":13,"short":"Página 13","label":"Somativa 81 · p. 13","src":"_img/93edf10f07547b0d.webp","ocr":"Justificativa da questão B\nx\nJustificativa: A humanização no atendimento envolve considerar a paciente como um ser\nintegral, respeitando suas necessidades físicas, emocionais e sociais. No caso de Maria, sua\ndificuldade de comunicação (relacionada à perda auditiva) e o isolamento social (sem\npresença de familiares) são aspectos fundamentais a serem considerados. A equipe deve\nbuscar proporcionar um ambiente acolhedor e adequado à sua condição, oferecendo\nrecursos que possibilitem sua plena compreensão das informações médicas e diminuam sua\nansiedade. Além disso, um acompanhamento emocional é essencial para que ela se sinta\nmais segura e respeitada durante o processo de internação. As outras alternativas não estão\nalinhadas com os princípios de humanização porque falham em considerar as necessidades\nemocionais e de comunicação da paciente.","question":null},{"id":"s81-14","page":14,"short":"Justificativa · p. 14 · C","label":"Somativa 81 · p. 14","src":"_img/b092eca912881e62.webp","ocr":"A alternativa correta é a única que relaciona corretamente o conceito de cuidado com a\nestratégia de gestão proposta pela Humanização:\n1. Conceito-Chave (Corresponsabilização): A Corresponsabilização implica que a\nresponsabilidade pela saúde e pelo funcionamento do serviço é compartilhada entre os\nprofissionais, a gestão e os usuários. Ao incluir pacientes e representantes no Grupo de\nTrabalho, a unidade transfere o problema do campo gerencial exclusivo para o campo do\ncuidado compartilhado, promovendo a responsabilização de todos no sucesso da\nintervenção.\n2. Dispositivo de Gestão (Gestão Participativa): A criação de um Grupo de Trabalho com a\ninclusão de usuários (\"representantes do conselho local e pacientes\") é um exemplo claro de\nGestão Participativa ou Gestão Colegiada, onde os diversos saberes (técnico e popular) se\nunem para a tomada de decisão. Isso se opõe à gestão hierárquica e centralizada.\nAs alternativas incorretas contêm as seguintes falhas conceituais:\n• Opção 1: O Vínculo Terapêutico é construído na relação individual; o caso foca em uma\nrelação coletiva e gerencial.\n• Opção 2: Acolhimento e Escuta Qualificada são cruciais no atendimento individual de porta\nde entrada, mas a questão trata de uma reorganização de processos e tomada de decisão\ncoletiva, o que é um nível diferente de intervenção (gestão).\n• Opção 3 0 Direito à Informação é uma consequência, mas não o motor principal da\nestratégia; o principal é a participação na tomada de decisão.","question":null},{"id":"s81-15","page":15,"short":"Justificativa · p. 15 · C","label":"Somativa 81 · p. 15","src":"_img/3eb246736e651e2e.webp","ocr":"A alternativa correta é a única que relaciona corretamente o conceito de cuidado com a\nestratégia de gestão proposta pela Humanização:\n1. Conceito-Chave (Corresponsabilização): A Corresponsabilização implica que a\nresponsabilidade pela saúde e pelo funcionamento do serviço é compartilhada entre os\nprofissionais, a gestão e os usuários. Ao incluir pacientes e representantes no Grupo de\nTrabalho, a unidade transfere o problema do campo gerencial exclusivo para o campo do\ncuidado compartilhado, promovendo a responsabilização de todos no sucesso da\nintervenção.\n2. Dispositivo de Gestão (Gestão Participativa): A criação de um Grupo de Trabalho com a\ninclusão de usuários (\"representantes do conselho local e pacientes\") é um exemplo claro de\nGestão Participativa ou Gestão Colegiada, onde os diversos saberes (técnico e popular) se\nunem para a tomada de decisão. Isso se opõe à gestão hierárquica e centralizada.\nAs alternativas incorretas contêm as seguintes falhas conceituais:\n• Opção 1: O Vínculo Terapêutico é construído na relação individual; o caso foca em uma\nrelação coletiva e gerencial.\n• Opção 2: Acolhimento e Escuta Qualificada são cruciais no atendimento individual de porta\nde entrada, mas a questão trata de uma reorganização de processos e tomada de decisão\ncoletiva, o que é um nível diferente de intervenção (gestão).\n• Opção 3 0 Direito à Informação é uma consequência, mas não o motor principal da\nestratégia; o principal é a participação na tomada de decisão.","question":null},{"id":"s81-16","page":16,"short":"Justificativa · p. 16 · D","label":"Somativa 81 · p. 16","src":"_img/b5784a4cf59860f0.webp","ocr":"Justificativa A alternativa correta identifica os dois princípios orientadores essenciais da\nPolítica Nacional de Humanização que foram mobilizados no caso:\n1. Transversalidade: Este princípio é aplicado quando a UPA insere a humanização como uma\npauta permanente e obrigatória em todos os espaços de discussão (clínica, administrativa e\nde acolhimento). A Transversalidade garante que a humanização não seja um programa\nisolado, mas sim um modo de fazer que permeia e afeta todas as práticas e instâncias do\nsistema.\n2. Indissociabilidade entre Atenção e Gestão: Este princípio é aplicado ao co-responsabilizar\ntrabalhadores de diferentes setores (atenção, como a enfermagem, e gestão) nas decisões\nadministrativas (compra de materiais e Plano de Ação Anual). A PNH defende que a qualidade\nda Atenção (o cuidado ao paciente) é intrinsecamente ligada à qualidade da Gestão (o\nfuncionamento do serviço).\nAs alternativas incorretas contêm dispositivos (instrumentos práticos) e não princípios\norientadores, que são os pilares conceituais da PNH:\n• Opção 1: Ambiência e Acolhimento são dispositivos ou diretrizes operacionais, e não\nprincípios estruturantes.\n• Opção 2: Clínica Ampliada é um dispositivo de intervenção na atenção (o fazer clínico), e não\num princípio orientador.\n• Opção 3: Apoio Matricial é um dispositivo de gestão do trabalho entre equipes, e não um\nprincípio fundamental da política. O Protagonismo dos Sujeitos é um princípio, mas a\ncombinação com o Apoio Matricial não descreve o cerne do caso (que é a gestão).","question":null},{"id":"s81-17","page":17,"short":"Justificativa · p. 17 · C","label":"Somativa 81 · p. 17","src":"_img/cca5d12feef387cc.webp","ocr":"Os resultados de exames são comunicação verbal escrita; o semblante preocupado é\ncomunicação não verbal; a comunicação sobre a hipertensão foi verbal, porém a prescrição\nmédica é verbal escrita; a expressão confusa de Julio é não verbal; O prontuário é verbal\nescrita, mas não foi mencionado no caso; coçar a nuca insistentemente é não verbal.","question":null},{"id":"s81-18","page":18,"short":"Justificativa · p. 18 · D","label":"Somativa 81 · p. 18","src":"_img/fb08ec5743af92f8.webp","ocr":"Quem decodifica é o receptor e não o emissor; O feedback não verbal de Julio é crucial para\nque o médico compreenda como ele está após a mensagem; O canal utilizado não possui\ncontraindicações para a mensagem emitida; Quem codifica a mensagem é o emissor médico\ne não Julio.","question":null},{"id":"s81-19","page":19,"short":"Justificativa · p. 19 · A","label":"Somativa 81 · p. 19","src":"_img/27e148a2c0e8c02c.webp","ocr":"Júlio parece concordar verbalmente, mas claramente ainda está em choque e com reduzida\ncompreensão da sua condição e tratamento, por isso pode não ter sido legítimo seu\nfeedback. O médico codifica, pois neste momento ele é emissor. Não há descrição de ruídos\nambientais no caso. O resultado do exame é comunicação verbal escrita.","question":null},{"id":"s81-20","page":20,"short":"Página 20","label":"Somativa 81 · p. 20","src":"_img/ff172aa3870c56a0.webp","ocr":"Justificativa da questão B\nx\nO caso mostra uma equipe diversa (médico, enfermagem, nutricionista, psicólogo) que atua\nde forma multiprofissional, com fazeres justapostos, havendo paralelismo de saberes e não\nintegração e valorização dos distintos saberes. Para o trabalho interprofissional é preciso que\nhaja comunicação articulada, por meio de reuniões e compartilhamento de informações para\ncriar um plano de cuidado integrado, com a valorização dos diferentes saberes na construção\ndo cuidado centrado no paciente.","question":null},{"id":"s81-21","page":21,"short":"Página 21","label":"Somativa 81 · p. 21","src":"_img/3e84ec7e171f398a.webp","ocr":"Justificativa da questão B\nx\nO caso mostra uma equipe diversa (médico, enfermagem, nutricionista, psicólogo) que atua\nde forma multiprofissional, com fazeres justapostos, havendo paralelismo de saberes e não\nintegração e valorização dos distintos saberes. Para o trabalho interprofissional é preciso que\nhaja comunicação articulada, por meio de reuniões e compartilhamento de informações para\ncriar um plano de cuidado integrado, com a valorização dos diferentes saberes na construção\ndo cuidado centrado no paciente.","question":null},{"id":"s81-22","page":22,"short":"Justificativa · p. 22 · C","label":"Somativa 81 · p. 22","src":"_img/794fae30871ce560.webp","ocr":"Não houve menção do assistente social. O enfermeiro ou o técnico de enfermagem podem\nter sido os responsáveis pela realização de curativo e orientações a seu respeito. O\nnutricionista avalia o estado nutricional e não faz atuação direta em sistemas orofacial,\ncervical ou de deglutição, mas sim o fonoaudiólogo. A psicóloga, por sua vez, compreende o\npapel das funções mentais no comportamento individual e social.","question":null},{"id":"s81-23","page":23,"short":"Justificativa · p. 23 · D","label":"Somativa 81 · p. 23","src":"_img/1279ebacc840b15e.webp","ocr":"O caso evidencia uma falha na comunicação interprofissional relacionada à ausência de\nregistro e compartilhamento das informações no prontuário. A decisão do médico de alterar\no horário da medicação sem atualizar o sistema compromete a continuidade do cuidado e\ninterfere na atuação segura dos demais membros da equipe. Não há apresentação de\nprotocolos. Não há menção de rotatividade de profissionais. Não há dados sobre a falta de\nvalorização do trabalhador.","question":null},{"id":"s81-24","page":24,"short":"Justificativa · p. 24 · C","label":"Somativa 81 · p. 24","src":"_img/d22a5ecc5bf6c836.webp","ocr":"Segundo o protocolo SPIKES, após informar o diagnóstico e acolher as reações emocionais, a\netapa seguinte envolve a discussão conjunta sobre as opções terapêuticas, com participação\nativa dos familiares. Essa construção compartilhada de decisões reforça o vínculo, promove\ncompreensão realista do quadro e garante maior adesão ao tratamento.","question":null},{"id":"s81-25","page":25,"short":"Justificativa · p. 25 · A","label":"Somativa 81 · p. 25","src":"_img/bbbfebca0f3962a8.webp","ocr":"Segundo o protocolo SPIKES, a etapa de suporte emocional requer que o profissional valide\nas emoções dos familiares, oferecendo empatia e escuta ativa logo após a má notícia. Essa\npostura fortalece o vínculo terapêutico e cria um ambiente de confiança, essencial para o\nenfrentamento do diagnóstico. O encaminhamento psicológico e o planejamento terapêutico\nsão importantes, mas devem ocorrer após o acolhimento emocional imediato. Minimizar as\npreocupações, por outro lado, rompe com o princípio da honestidade e pode comprometer a\ncredibilidade da comunicação.","question":null},{"id":"s81-26","page":26,"short":"Justificativa · p. 26 · D","label":"Somativa 81 · p. 26","src":"_img/9aad50b351cf582e.webp","ocr":"De acordo com o protocolo SPIKES, antes de fornecer informações difíceis, o profissional deve\nrealizar a etapa \"Invitation\", avaliando se o paciente deseja ouvir todos os detalhes e em que\nmedida está emocionalmente preparado para recebê-los. No caso, Dr. André demonstrou\npreparo técnico e explicou o diagnóstico com clareza, mas não verificou o desejo nem a\nprontidão emocional da gestante, o que caracteriza falha nessa etapa. As demais etapas —\nSetting up, Knowledge e Emotions — foram, em maior ou menor grau, abordadas.","question":null},{"id":"s81-27","page":27,"short":"Justificativa · p. 27 · B","label":"Somativa 81 · p. 27","src":"_img/237c7b913304592d.webp","ocr":"Enxergar o outro como alguém com quem há de se estabelecer pactuações é o que define o\nconceito de Vínculo. Houve um olhar ampliado ao atender as necessidades da gestante, o que\nconfigura cuidado integral. Reconhecer a legítima e singular necessidade de saúde do\npaciente define o conceito de Acolhimento. A Responsabilização é quando o\ntrabalhador/equipe se responsabiliza pelo usuário, desde a sua chegada até a sua saída.","question":null},{"id":"s81-28","page":28,"short":"Justificativa · p. 28 · D","label":"Somativa 81 · p. 28","src":"_img/e6bbf8a2f54caab0.webp","ocr":"A horizontalização é o modo de organizar as práticas. A demanda programada e espontânea,\nnão foi abordada no caso. A indicação do grupo pode ser considerada preventiva, enquanto\nque o uso correto de medicamentos seria assistencial. A prescrição não é o principal foco do\ntraço da boa medicina.","question":null},{"id":"s81-29","page":29,"short":"Justificativa · p. 29 · A","label":"Somativa 81 · p. 29","src":"_img/56c477d445f89f17.webp","ocr":"Transversalidade e Autonomia dos sujeitos e coletivos são princípios, não diretrizes. Não há\nmenção sobre a defesa dos direitos dos usuários. A clínica ampliada é uma ferramenta\nteórica e prática cuja finalidade é contribuir para uma abordagem clínica do adoecimento,\nconsiderando a singularidade do sujeito e a complexidade do processo saúde/doença, a\natenção foi dada por equipe interprofissional, além de abordagem em vários cenários,\nindividuais e coletivo.","question":null},{"id":"s81-30","page":30,"short":"Justificativa · p. 30 · B","label":"Somativa 81 · p. 30","src":"_img/c5172fd78275514b.webp","ocr":"A transversalidade é que faz com que diversas práticas e especialidades da saúde se\ncomunicam para melhorar a experiência do usuário Houve valorização do princípio de\n\"Protagonismo, corresponsabilidade e autonomia dos sujeitos e coletivos\", evidenciado pelo\nrespeito à autonomia de Celina em escolher, por meio de pactuações. Ambiência é uma\ndiretriz e não um princípio do HumanizaSUS. Indissociabilidade entre atenção e gestão\nenvolve a participação ativa dos usuários e profissionais nas decisões de gestão, promovendo\numa atuação colaborativa. No caso de Celina, a gestão do serviço não é mencionada.","question":null},{"id":"s81-31","page":31,"short":"Justificativa · p. 31 · D","label":"Somativa 81 · p. 31","src":"_img/0fa275aa62e59d01.webp","ocr":"São mencionados o acolhimento, vínculo e ambiente confortável para que as trocas entre\npaciente e profissional da saúde ocorressem, o que reforça o uso de tecnologias relacionais.\nNão houve detalhes sobre o fortalecimento de iniciativas em humanização, seja por\nreconhecimento dos gestores ou dos próprios trabalhadores, a atuação de Dr. André foi\nisolada, não associada a outras etapas ou a outras experiências de sucesso.","question":null}]}],"final":[{"id":"h-01","aula":"a02","segment":null,"prompt":"Uma médica precisa entender por que uma paciente deixou de usar a medicação. Qual ação é uma tecnologia leve?","options":["Aferir a pressão com aparelho digital","Explorar dúvidas com escuta ativa","Consultar uma diretriz de prescrição","Revisar os resultados laboratoriais"],"answer":1,"why":"A escuta é produzida na relação. Diretrizes organizam saberes e exames e aparelhos acrescentam outros recursos ao cuidado.","origin":"s80-07"},{"id":"h-02","aula":"a02","segment":null,"prompt":"Um homem falta às consultas porque trabalha no horário da UBS. Qual ação fortalece vínculo e responsabilização?","options":["Solicitar que a chefia libere todas as faltas","Orientar a procurar outra unidade se faltar","Pactuar um horário viável e combinar retorno","Entregar o calendário padrão de consultas"],"answer":2,"why":"O plano considera a barreira e estabelece continuidade compartilhada.","origin":"s80-11"},{"id":"h-03","aula":"a02","segment":null,"prompt":"Uma UBS integra na mesma agenda escuta da demanda espontânea, seguimento programado e ações de prevenção. Qual dimensão aparece mais diretamente?","options":["Classificação dos equipamentos assistenciais","Política dirigida a uma população específica","Atitude individual frente ao sofrimento","Organização das práticas e dos serviços"],"answer":3,"why":"O caso descreve como o trabalho e as ofertas são articulados.","origin":"s81-28"},{"id":"h-04","aula":"a02","segment":null,"prompt":"Durante uma consulta, a equipe explora como a perda do emprego mudou a alimentação e o manejo da diabetes. Qual enfoque orienta a entrevista?","options":["Abordagem biopsicossocial","Triagem clínica por ordem de chegada","Abordagem biomédica centrada na lesão","Acesso quantitativo aos procedimentos"],"answer":0,"why":"A entrevista conecta a doença às circunstâncias e à experiência do paciente.","origin":"s80-27"},{"id":"h-05","aula":"a03","segment":null,"prompt":"Uma UPA inclui usuários, recepção e equipe clínica na revisão do fluxo de acolhimento. O novo fluxo reduz esperas e melhora a escuta. Qual par de princípios é mais direto?","options":["Equidade e vigilância epidemiológica","Transversalidade e atenção–gestão","Universalidade e regionalização hierárquica","Descentralização e controle de agravos"],"answer":1,"why":"O diálogo cruza grupos e a reorganização da gestão transforma o cuidado.","origin":"s81-16"},{"id":"h-06","aula":"a03","segment":null,"prompt":"Um paciente com insuficiência cardíaca recebe orientações incompatíveis e não sabe a quem recorrer. Qual proposta materializa a clínica ampliada?","options":["Oferecer ao paciente uma lista única de prescrições","Adotar a conduta de cada especialidade em separado","Pactuar metas e responsáveis com equipe e paciente","Transferir o seguimento para o setor de maior recurso"],"answer":2,"why":"A clínica ampliada integra contexto, diferentes saberes e corresponsabilidade.","origin":"s81-11"},{"id":"h-07","aula":"a03","segment":null,"prompt":"Uma atendente chama uma pessoa pelo nome registral e pergunta em voz alta sobre sua vida sexual. Qual resposta enfrenta a falha inicial?","options":["Pedir que a pessoa explique a situação na fila","Respeitar o nome social e a privacidade","Adiar o atendimento até validar o documento","Delegar toda comunicação ao acompanhante"],"answer":1,"why":"Acolhimento e defesa de direitos exigem respeito e condições seguras para a conversa.","origin":"s80-28"},{"id":"h-08","aula":"a03","segment":null,"prompt":"A direção pretende redesenhar a rotina da enfermaria. Qual medida expressa cogestão e corresponsabilização?","options":["Solicitar sugestões após aprovar o fluxo","Delegar o desenho a uma chefia técnica","Pactuar fluxos com equipe e usuários","Divulgar o protocolo em treinamento geral"],"answer":2,"why":"Cogestão envolve participação no processo decisório, com responsabilidades distribuídas.","origin":"s81-14"},{"id":"h-09","aula":"a04","segment":null,"prompt":"Uma paciente recebe instruções por e-mail e, na consulta, franze a testa ao lê-las. Como classificar os dois elementos?","options":["Verbal escrita e não verbal","Verbal oral e não verbal","Paraverbal e verbal oral","Não verbal e verbal escrita"],"answer":0,"why":"O texto escrito usa palavras. A expressão facial comunica sem palavras.","origin":"s81-17"},{"id":"h-10","aula":"a04","segment":null,"prompt":"Um profissional explica o novo esquema e a paciente tenta interpretar as instruções. Quem está decodificando a mensagem nesse momento?","options":["A paciente, que recebe a explicação","O canal, que transporta a mensagem","O prontuário, que registra o plano","O profissional, que escolhe as palavras"],"answer":0,"why":"O receptor interpreta e decodifica. O emissor codifica.","origin":"s81-18"},{"id":"h-11","aula":"a04","segment":null,"prompt":"Um paciente balança a cabeça afirmativamente, mas hesita ao dizer quando tomará o remédio. Qual ação resolve melhor a ambiguidade?","options":["Entregar o impresso e encerrar a visita","Repetir a mesma fala com voz mais alta","Pedir que explique como fará em casa","Tomar o aceno como confirmação plena"],"answer":2,"why":"O retorno em palavras próprias permite verificar compreensão e ajustar a explicação.","origin":"s81-19"},{"id":"h-12","aula":"a04","segment":null,"prompt":"Um paciente usa o telefone para enviar uma mensagem de voz à equipe. O que é o canal no exemplo?","options":["A equipe que ouve a mensagem de voz","A pergunta gravada pelo próprio paciente","A língua escolhida para formular a dúvida","O telefone usado para transmitir o áudio"],"answer":3,"why":"O canal veicula a mensagem. O conteúdo, receptor e código ocupam outros papéis.","origin":"s80-17"},{"id":"h-13","aula":"a05","segment":null,"prompt":"Uma paciente começa a explicar por que parou o tratamento. Qual resposta demonstra escuta ativa?","options":["Interromper para antecipar o provável motivo","Deixar concluir e devolver uma síntese","Perguntar apenas se voltou a tomar o remédio","Dar a orientação antes de explorar a dúvida"],"answer":1,"why":"A síntese verifica compreensão e permite que a pessoa corrija ou amplie o relato.","origin":"s81-08"},{"id":"h-14","aula":"a05","segment":null,"prompt":"O médico usa termos técnicos e encerra a consulta sem explorar o medo do paciente. Qual mudança aproxima a consulta do cuidado centrado na pessoa?","options":["Repetir o laudo técnico e oferecer uma cópia","Solicitar ao acompanhante que decida o plano","Explorar receios e explicar com clareza","Concentrar a conversa nos achados do exame"],"answer":2,"why":"O encontro integra perspectiva da pessoa e informação clínica compreensível.","origin":"s81-09"},{"id":"h-15","aula":"a05","segment":null,"prompt":"O acompanhante responde por uma paciente adulta capaz. Como incluir os dois na conversa?","options":["Excluir o acompanhante sem conversar com ela","Solicitar ao acompanhante que escolha a conduta","Perguntar à paciente como deseja incluí-lo","Responder apenas ao interlocutor mais informado"],"answer":2,"why":"A paciente pode autorizar a participação e permanece como interlocutora principal.","origin":"s80-13"},{"id":"h-16","aula":"a05","segment":null,"prompt":"Uma pessoa com perda auditiva chega sozinha e não acompanha as orientações faladas. Qual ajuste é mais adequado?","options":["Adaptar a fala e checar compreensão","Fornecer um formulário padrão ao final","Orientar que só retorne com acompanhante","Elevar o volume e repetir o texto integral"],"answer":0,"why":"Acessibilidade e checagem da mensagem permitem participação direta.","origin":"s81-13"},{"id":"h-17","aula":"a06","segment":null,"prompt":"Quatro profissões atendem a mesma pessoa, mas cada uma define metas próprias. O que transforma o arranjo em trabalho interprofissional?","options":["Aumentar o número de profissões na escala","Registrar a produção de cada categoria","Pactuar metas e revisar o plano em equipe","Organizar a agenda por área de formação"],"answer":2,"why":"Interprofissionalidade exige coordenação e integração de saberes.","origin":"s81-20"},{"id":"h-18","aula":"a06","segment":null,"prompt":"Um médico altera o horário de uma medicação de risco. A enfermagem está prestes a preparar a dose. Qual medida reduz a falha de comunicação?","options":["Atualizar o registro e confirmar o aviso","Manter a ordem anterior até a próxima visita","Deixar a mudança em nota pessoal para consulta","Informar só na passagem do plantão seguinte"],"answer":0,"why":"Registro e comunicação oportuna protegem a continuidade e a segurança.","origin":"s81-23"},{"id":"h-19","aula":"a06","segment":null,"prompt":"Após um AVC, uma pessoa tem tosse ao engolir e dificuldade na fala. Qual profissional avalia diretamente essas funções?","options":["Fonoaudiólogo da equipe de reabilitação","Nutricionista da equipe de reabilitação","Terapeuta ocupacional da equipe de reabilitação","Assistente social da equipe de reabilitação"],"answer":0,"why":"A fonoaudiologia avalia deglutição e comunicação. As outras profissões têm contribuições complementares.","origin":"s80-20"},{"id":"h-20","aula":"a06","segment":null,"prompt":"Uma prescrição escrita é ilegível. Qual é a resposta mais segura?","options":["Inferir a dose a partir da rotina do setor","Repetir a dose usada na internação anterior","Confirmar a ordem com quem prescreveu","Pedir ao paciente que interprete a letra"],"answer":2,"why":"Esclarecer a ordem na fonte evita reproduzir um erro.","origin":"s80-21"},{"id":"h-21","aula":"a07","segment":null,"prompt":"Uma residente quer abrir uma conversa sobre atrasos sem atribuir intenção ao colega. Qual frase é observação?","options":["Você decidiu deixar o plantão esperando","Hoje você chegou após a hora combinada","Seu atraso mostra pouco cuidado com a equipe","Você sempre trata o horário como irrelevante"],"answer":1,"why":"A primeira frase descreve um fato verificável sem julgamento da pessoa.","origin":"s81-01"},{"id":"h-22","aula":"a07","segment":null,"prompt":"Qual sequência corresponde aos quatro componentes da CNV?","options":["Observação, sentimento, necessidade, pedido","Observação, diagnóstico, conselho, decisão","Avaliação, sentimento, julgamento, acordo","Interpretação, emoção, justificativa, regra"],"answer":0,"why":"A CNV separa o fato, a experiência emocional, a necessidade e a ação solicitada.","origin":"s81-02"},{"id":"h-23","aula":"a07","segment":null,"prompt":"A equipe precisa de antecedência para cobrir atrasos. Qual formulação é um pedido concreto?","options":["Quero que passe a respeitar a equipe inteira","Você poderia ter mais compromisso com o grupo?","Prefiro que você deixe de agir sem pensar","Pode avisar antes das sete se atrasar?"],"answer":3,"why":"O pedido descreve ação observável e admite resposta.","origin":"s81-03"},{"id":"h-24","aula":"a07","segment":null,"prompt":"Duas profissionais disputam o mesmo horário de sala. Qual intervenção se alinha à CNV?","options":["Pedir que cada uma defenda sua posição final","Explorar necessidades e pactuar horários","Usar a antiguidade para arbitrar toda disputa","Priorizar a primeira proposta sem discussão"],"answer":1,"why":"Compreender necessidades amplia o espaço para construir alternativas.","origin":"s80-01"},{"id":"h-25","aula":"a08","segment":null,"prompt":"Uma intervenção invasiva só prolongaria o processo de morrer. A equipe mantém analgesia, conforto e presença familiar. Qual conceito descreve a conduta?","options":["Ortotanásia e cuidado de conforto","Abandono por suspensão do cuidado","Distanásia com medidas de suporte","Eutanásia como ação intencional"],"answer":0,"why":"A equipe respeita o curso da morte com alívio ativo de sofrimento.","origin":"s81-04"},{"id":"h-26","aula":"a08","segment":null,"prompt":"Dor, solidão, ansiedade e preocupação espiritual coexistem. Qual plano melhor contempla o sintoma total?","options":["Apoio espiritual como resposta para todo sofrimento","Encaminhamento isolado para psicoterapia semanal","Avaliação multiprofissional das quatro dimensões","Ajuste analgésico e retorno apenas se houver dor"],"answer":2,"why":"Sintoma total integra dimensões físicas, psíquicas, sociais e espirituais.","origin":"s81-05"},{"id":"h-27","aula":"a08","segment":null,"prompt":"Uma paciente inicia tratamento de doença ameaçadora da vida e apresenta sofrimento importante. Quando integrar cuidados paliativos?","options":["Apenas durante os últimos dias de internação","Desde agora, em paralelo ao tratamento indicado","Após suspensão de todo tratamento modificador","Quando surgir incapacidade funcional irreversível"],"answer":1,"why":"Cuidados paliativos podem começar cedo e coexistir com terapia modificadora.","origin":"s81-06"},{"id":"h-28","aula":"a08","segment":null,"prompt":"O paciente deseja permanecer em casa e a família teme não saber cuidar dos sintomas. Qual plano é mais coerente?","options":["Definir alta sem pactuar um canal de retorno","Orientar a família apenas sobre medicação oral","Pactuar suporte com paciente e família","Transferir decisões apenas ao médico assistente"],"answer":2,"why":"A assistência inclui paciente e rede de apoio, com plano individualizado.","origin":"s80-05"},{"id":"h-29","aula":"a09","segment":null,"prompt":"Antes de explicar o resultado de uma biópsia, a médica pergunta se o paciente prefere ouvir todos os detalhes agora. Que etapa pratica?","options":["Perception, ao checar o que ele já sabe","Invitation, ao pactuar quanto explicar","Knowledge, ao comunicar a informação","Setting, ao preparar o ambiente físico"],"answer":1,"why":"O convite explicita a preferência sobre quantidade e forma de receber a informação.","origin":"s81-26"},{"id":"h-30","aula":"a09","segment":null,"prompt":"Ao ouvir o diagnóstico, a paciente chora. O que corresponde à etapa Emotions?","options":["Apresentar todas as opções terapêuticas logo","Reconhecer a reação e dar espaço para falar","Pedir que repita os dados recém-apresentados","Trocar de assunto para diminuir o desconforto"],"answer":1,"why":"Acolher e validar a reação cria condições para retomar a conversa.","origin":"s81-25"},{"id":"h-31","aula":"a09","segment":null,"prompt":"Depois de informar e acolher, o médico combina retorno e próximos passos com o paciente. Qual etapa é essa?","options":["Invitation, com preferência de detalhamento","Setting, com preparação para a conversa","Strategy and Summary, com plano compartilhado","Perception, com verificação de ideias prévias"],"answer":2,"why":"A etapa final sintetiza e pactua o seguimento.","origin":"s81-24"},{"id":"h-32","aula":"a09","segment":null,"prompt":"Um profissional precisa informar uma notícia difícil num corredor cheio. Qual mudança corresponde a Setting?","options":["Apresentar a notícia em blocos de informação","Perguntar quanto detalhe a pessoa deseja ouvir","Reservar tempo e um local privativo","Investigar a percepção atual do diagnóstico"],"answer":2,"why":"Setting prepara ambiente, privacidade, tempo e presença autorizada de terceiros.","origin":"s80-23"},{"id":"h-33","aula":"a02","segment":null,"prompt":"Na recepção, uma mulher chora e diz que não consegue explicar o que sente. Qual conduta inicia o acolhimento?","options":["Pedir que volte com a queixa organizada","Entregar um formulário para triagem posterior","Classificar prioridade antes de ouvi-la","Oferecer privacidade e escutar a demanda"],"answer":3,"why":"A postura acolhedora cria condições de escuta e de resposta à necessidade.","origin":"s80-10"},{"id":"h-34","aula":"a02","segment":null,"prompt":"Um paciente com dor crônica recusa a atividade proposta pela equipe. Qual resposta preserva vínculo e continuidade?","options":["Encerrar o plano e aguardar demanda espontânea","Reencaminhar o paciente sem rever as metas","Reforçar a orientação no mesmo formato","Explorar a recusa e repactuar o plano"],"answer":3,"why":"O motivo da recusa orienta a revisão compartilhada e a articulação da rede.","origin":"s80-12"},{"id":"h-35","aula":"a02","segment":null,"prompt":"No pré-natal, a gestante e a equipe negociam um plano que ela considera possível. Qual elemento caracteriza mais diretamente o vínculo nessa situação?","options":["Reconhecer a gestante como interlocutora","Classificar a gestação em uma faixa de risco","Reunir resultados em um único prontuário","Agendar retorno conforme a agenda da unidade"],"answer":0,"why":"O vínculo inclui reconhecer a legitimidade do outro para construir pactos.","origin":"s81-27"},{"id":"h-36","aula":"a03","segment":null,"prompt":"Uma unidade identifica conflitos repetidos na recepção e decide estudar os próprios atendimentos com a equipe. Qual ação corresponde à formação em serviço?","options":["Analisar casos reais durante reuniões de equipe","Contratar consultoria para decidir todos os fluxos","Medir apenas tempo de espera e número de consultas","Distribuir um manual sem discutir os atendimentos"],"answer":0,"why":"A formação em serviço parte de problemas do cotidiano e produz aprendizagem no trabalho.","origin":"s80-30"},{"id":"h-37","aula":"a03","segment":null,"prompt":"Uma paciente participa da definição de metas e escolhe entre duas estratégias de cuidado viáveis. Qual princípio aparece mais diretamente?","options":["Protagonismo e autonomia","Defesa de direitos por ouvidoria","Transversalidade entre setores","Ambiência e organização do espaço"],"answer":0,"why":"Participar de decisões e construir o plano expressa protagonismo e autonomia.","origin":"s81-30"},{"id":"h-38","aula":"a04","segment":null,"prompt":"Ao notar a testa franzida do usuário, a médica interrompe a explicação e pergunta o que ficou confuso. Qual operação iniciou o ajuste?","options":["Mudar o meio de transmissão do prontuário","Delegar a interpretação ao acompanhante","Codificar novamente a mensagem escrita","Interpretar o retorno não verbal"],"answer":3,"why":"O sinal não verbal funciona como retorno e leva a profissional a verificar a recepção.","origin":"s80-18"},{"id":"h-39","aula":"a05","segment":null,"prompt":"Uma equipe quer aumentar a <script>/* ---------- celebração ao concluir segmento / aula ---------- */
(function(){
  function $(s,c){return (c||document).querySelector(s);}
  var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS={cv:'#ec8a98',resp:'#7cc2dc',gi:'#6fbf8e',acc:'#e0b06a',prova:'#bca0d8'};
  var THEME={cv:'rbc',resp:'bubble',gi:'drop',acc:'cell',prova:'neuron'};
  function groupOf(key){return /^aula[1-4]$/.test(key)?'cv':(/^aula[5-8]$/.test(key)?'resp':(/^tgi[1-4]$/.test(key)?'gi':(/^tgi[5-6]$/.test(key)?'acc':'prova')));}

  /* partículas temáticas em canvas: hemácias (cardio), bolhas (respiratório), neurônios/faíscas (provas) */
  var cv=null,ctx=null,parts=[],raf=0,last=0,tEnd=0,tStart=0,mode='rbc',rainRate=0,W=0,H=0;
  var PAL=['#ec8a98','#f2b84b','#e2574c','#ffffff','#7cc2dc'];
  function rnd(a,b){return a+Math.random()*(b-a);}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function spawn(type,x,y,vx,vy,g,life,size){
    if(parts.length>260)return;
    parts.push({t:type,x:x,y:y,vx:vx,vy:vy,g:g,r:rnd(0,6.28),vr:rnd(-5,5),s:size||rnd(7,13),c1:pick(PAL),l:0,life:life||rnd(1.6,2.8)});
  }
  function typesFor(m){return m==='mix'?['rbc','bubble','neuron','drop','cell']:[m];}
  function burst(n,speed){
    var ts=typesFor(mode);
    for(var i=0;i<n;i++){var a=rnd(0,6.283),v=rnd(speed*.35,speed);var t=pick(ts);
      spawn(t,W/2,H/2,Math.cos(a)*v,Math.sin(a)*v-(t==='bubble'?60:0),t==='neuron'?0:(t==='bubble'?-60:520),rnd(1.2,2.4));}
  }
  function rain(n){
    var ts=typesFor(mode);
    for(var i=0;i<n;i++){var t=pick(ts);
      if(t==='bubble')spawn(t,rnd(0,W),H+20,rnd(-20,20),rnd(-260,-140),-20,rnd(2.2,3.4),rnd(8,20));
      else if(t==='neuron')spawn(t,rnd(0,W),rnd(0,H),rnd(-160,160),rnd(-160,160),0,rnd(.6,1.2),rnd(3,6));
      else spawn(t,rnd(0,W),-20,rnd(-40,40),rnd(120,280),160,rnd(2.4,3.6));}
  }
  function drawP(c,p,a){
    c.globalAlpha=a;
    if(p.t==='rbc'){c.save();c.translate(p.x,p.y);c.rotate(p.r*.4);c.fillStyle='#d6453d';c.beginPath();c.ellipse(0,0,p.s,p.s*.72,0,0,6.283);c.fill();c.fillStyle='#a8302a';c.beginPath();c.ellipse(0,0,p.s*.45,p.s*.3,0,0,6.283);c.fill();c.restore();}
    else if(p.t==='bubble'){c.lineWidth=1.6;c.strokeStyle='#bfe6f2';c.beginPath();c.arc(p.x,p.y,p.s,0,6.283);c.stroke();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(p.x-p.s*.35,p.y-p.s*.35,p.s*.18,0,6.283);c.fill();}
    else if(p.t==='drop'){c.save();c.translate(p.x,p.y);c.rotate(p.r*.3);c.fillStyle='#8fd6a6';c.beginPath();c.moveTo(0,-p.s*1.1);c.quadraticCurveTo(p.s*.9,p.s*.2,0,p.s*.9);c.quadraticCurveTo(-p.s*.9,p.s*.2,0,-p.s*1.1);c.fill();c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(-p.s*.25,0,p.s*.18,0,6.283);c.fill();c.restore();}
    else if(p.t==='cell'){c.save();c.translate(p.x,p.y);c.rotate(p.r*.35);c.fillStyle='#e0b06a';c.beginPath();c.roundRect?c.roundRect(-p.s*.8,-p.s*.8,p.s*1.6,p.s*1.6,p.s*.5):c.rect(-p.s*.8,-p.s*.8,p.s*1.6,p.s*1.6);c.fill();c.fillStyle='#8a5a1c';c.beginPath();c.arc(0,0,p.s*.32,0,6.283);c.fill();c.restore();}
    else{c.strokeStyle=p.c1;c.lineWidth=1.6;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.07,p.y-p.vy*.07);c.stroke();c.fillStyle=p.c1;c.beginPath();c.arc(p.x,p.y,p.s*.6,0,6.283);c.fill();}
    c.globalAlpha=1;
  }
  function frame(now){
    raf=0;if(!ctx)return;
    var dt=Math.min(.033,(now-last)/1000||.016);last=now;var el=(now-tStart)/1000;
    ctx.clearRect(0,0,W,H);
    if(el<tEnd&&rainRate)rain(Math.round(rainRate*dt*60/3));
    parts=parts.filter(function(p){p.l+=dt;if(p.l>p.life)return false;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;drawP(ctx,p,Math.min(1,(p.life-p.l)/.5));return p.y>-60&&p.y<H+60;});
    if(parts.length||el<tEnd)raf=requestAnimationFrame(frame);
  }
  function startFX(m,big){
    if(RM)return;mode=m;cv=$('.cel-cv');var dpr=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    parts=[];tStart=performance.now();last=tStart;tEnd=big?3.2:1.4;rainRate=big?3:1.2;
    burst(big?150:70,big?820:560);if(big)setTimeout(function(){if(ctx)burst(80,640);},450);
    if(!raf)raf=requestAnimationFrame(frame);
  }
  function stopFX(){if(raf)cancelAnimationFrame(raf);raf=0;parts=[];if(ctx)ctx.clearRect(0,0,W,H);ctx=null;}

  /* overlay */
  var ov=document.createElement('div');ov.className='cel-ov';ov.setAttribute('aria-hidden','true');
  ov.innerHTML='<canvas class="cel-cv"></canvas><div class="cel-flash"></div><div class="cel-wave"></div><div class="cel-wave"></div><div class="cel-wave"></div><button type="button" class="cel-skip">Pular</button><div class="cel-box" role="status" aria-live="polite"><div class="cel-badge"></div><div class="cel-kick"></div><div class="cel-t"></div><div class="cel-s"></div><div class="cel-prog"><div class="cel-bar"><i></i></div><div class="cel-bt"></div></div></div>';
  document.body.appendChild(ov);
  var queue=[],busy=false,timer=0,opener=null;
  function close(){
    if(!busy)return;clearTimeout(timer);ov.classList.remove('on');ov.setAttribute('aria-hidden','true');stopFX();
    if(opener&&opener.focus)try{opener.focus({preventScroll:true});}catch(e){}
    setTimeout(function(){busy=false;next();},280);
  }
  function show(o){
    busy=true;opener=document.activeElement;
    ov.className='cel-ov'+(o.title.length>28?' cel-long':'');ov.style.setProperty('--cel-c',o.color);
    $('.cel-badge',ov).innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg>';
    $('.cel-kick',ov).textContent=o.kick;$('.cel-t',ov).textContent=o.title;$('.cel-s',ov).textContent=o.sub||'';
    var pg=$('.cel-prog',ov);pg.style.display=o.prog==null?'none':'';var bar=$('.cel-bar i',ov);bar.style.transition='none';bar.style.width=(o.prog0||0)+'%';$('.cel-bt',ov).textContent=o.progText||'';
    ov.setAttribute('aria-hidden','false');void ov.offsetWidth;ov.classList.add('on');
    if(o.prog!=null)requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.transition='';bar.style.width=o.prog+'%';});});
    startFX(o.theme,o.big);
    timer=setTimeout(close,RM?2200:o.ms);
    setTimeout(function(){var s=$('.cel-skip',ov);if(s)s.focus({preventScroll:true});},40);
  }
  function next(){if(!busy&&queue.length)show(queue.shift());}
  function enqueue(o){queue.push(o);next();}
  ov.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on')){e.preventDefault();close();}});

  window.celeEnqueue=enqueue;
})();
</script>
