 qs.map((q,i)=>'<fieldset class="quiz-item" id="test-'+q.id+'"><legend>'+ (i+1)+'. '+esc(q.prompt)+'</legend>'+q.options.map((o,j)=>'<label class="option'+(sim.done?(j===q.answer?' right':sim.answers[q.id]===j?' wrong':''):'')+'"><input type="radio" data-sim="'+q.id+'" name="sim-'+q.id+'" value="'+j+'"'+(sim.answers[q.id]===j?' checked':'')+(sim.done?' disabled':'')+'><span class="L">'+String.fromCharCode(65+j)+'</span><span class="ot">'+esc(o)+'</span></label>').join('')+
 (sim.done?'<p class="feedback '+(sim.answers[q.id]===q.answer?'good':'bad')+'">Gabarito '+String.fromCharCode(65+q.answer)+'. '+esc(q.why)+' '+link(q.aula,'Rever a aula',q.segment||q.aula+'-revisao')+'</p>':'<button data-flag="'+q.id+'">'+(sim.flags[q.id]?'⚑ Remover marcação':'⚐ Marcar para rever')+'</button>')+'</fieldset>').join('')+
 (sim.done?'<p class="score">Nota: '+qs.filter(q=>sim.answers[q.id]===q.answer).length+' de '+qs.length+'</p>':'<button id="submit-sim">Entregar simulado</button>')+'</section>';
}

function keysBlock(s){return s.keys?'<div class="keys"><b>Pontos-chave</b><ul>'+s.keys.map(k=>'<li>'+esc(k)+'</li>').join('')+'</ul></div>':''}
function deepBlock(s){
 return (s.deep?'<details class="panel extra" open><summary><b>■ EXTRA · Aprofundamento</b></summary>'+s.deep.map(p=>'<p>'+esc(p)+'</p>').join('')+'</details>':'')+
 (s.case?'<div class="panel case"><b>Caso clínico</b><p>'+esc(s.case)+'</p></div>':'')+
 (s.trap?'<div class="panel trap"><b>Atenção na prova</b><p>'+esc(s.trap)+'</p></div>':'');
}
function lessonNav(l){
 const i=data.lessons.indexOf(l),p=data.lessons[i-1],n=data.lessons[i+1];
 return '<div class="lnav">'+(p?link(p.id,'← Aula '+p.number+' · '+p.title):'<span></span>')+(n?link(n.id,'Aula '+n.number+' · '+n.title+' →'):link('simulados','Fazer o simulado →'))+'</div>';
}
function overall(){
 const secs=data.lessons.flatMap(l=>l.sections),read=secs.filter(s=>state.read[s.id]).length;
 const ok=allQ.filter(q=>state.verified[q.id]&&state.answers[q.id]===q.answer).length;
 return {read,total:secs.length,ok,qs:allQ.length};
}
function progressBlock(){
 const o=overall();
 return '<div class="panel"><b>Seu progresso</b><p>Segmentos estudados: '+o.read+' de '+o.total+'</p><progress max="'+o.total+'" value="'+o.read+'"></progress><p>Questões acertadas: '+o.ok+' de '+o.qs+'</p><progress max="'+o.qs+'" value="'+o.ok+'"></progress></div>';
}
function continueLink(){
 const l=data.lessons.find(x=>x.id===state.last);
 const next=data.lessons.find(x=>x.sections.some(s=>!state.read[s.id]));
 const t=l||next;
 return link(t?t.id:'a02',l?'Continuar: aula '+l.number:next&&next!==data.lessons[0]?'Próxima aula pendente: '+next.number:'Começar pela aula 2');
}
function arenaBody(){
 const rows=data.lessons.map(l=>{const qs=allQ.filter(q=>q.aula===l.id),done=qs.filter(q=>state.verified[q.id]),ok=done.filter(q=>state.answers[q.id]===q.answer).length;
  return '<tr><td>'+link(l.id,l.number+'. '+l.title)+'</td><td>'+done.length+'/'+qs.length+'</td><td>'+(done.length?Math.round(ok/done.length*100)+'%':'—')+'</td></tr>'}).join('');
 return '<section class="section"><p class="score">'+xp()+' XP acumulados.</p><p class="muted">Cada questão acertada de primeira vale 10 XP. Abaixo, seu desempenho por aula: priorize as de menor aproveitamento.</p><div class="table"><table><thead><tr><th>Aula</th><th>Respondidas</th><th>Aproveitamento</th></tr></thead><tbody>'+rows+'</tbody></table></div><p>'+link('treino','Abrir casos')+' '+link('minha','Ver pendências')+'</p></section>';
}
function balanced15(){
 const pick=data.lessons.flatMap(l=>shuffled(allQ.filter(q=>q.aula===l.id)).slice(0,2));
 return shuffled(pick).slice(0,15);
}
function progress(){
 let bar=$('#rp');if(!bar){bar=document.createElement('div');bar.id='rp';document.body.append(bar)}
 const f=()=>{const h=document.documentElement.scrollHeight-innerHeight;bar.style.width=(h>0?scrollY/h*100:0)+'%'};
 if(!progress.on){addEventListener('scroll',f,{passive:true});progress.on=true}f();
}
function updateClock(){const el=$('#clock');if(!el||!sim)return;const elapsed=Math.floor(((sim.finished||Date.now())-sim.start)/1000);const left=sim.qs.length*180-elapsed;el.textContent=(left<0?'Tempo excedido +':'Tempo restante ')+Math.floor(Math.abs(left)/60)+':'+String(Math.abs(left)%60).padStart(2,'0')}
function render({scroll=true}={}){
 let [page,anchor]=location.hash.slice(1).split('/');
 active=data.lessons.some(l=>l.id===page)||Object.hasOwn(pages,page)?page:'home';
 const l=data.lessons.find(x=>x.id===active);
 const html=l?lesson(l,anchor):active==='parciais'||active==='somativas'?exam(active,anchor):active==='simulados'?sims():active==='revisao'?review():active==='minha'?myReview():active==='treino'?training():active==='arena'?arena():active==='fontes'?refs():home();
 $('#main').innerHTML='<article class="paper">'+html+'</article>';if(window.MC&&MC.rerunAllWidgets){MC.rerunAllWidgets();if(window.WGarena)WGarena();}delete openGrp[active];curSeg=(l?lessonView:anchor)||'';if(l){state.last=active;save()}progress();
 nav();
 document.querySelectorAll('[data-qid]').forEach(f=>feedback(f));
 document.querySelectorAll('.magnify').forEach(img=>{img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Ampliar: '+img.alt)});
 scores();
 calc();
 updateClock();document.querySelectorAll('[data-exam]').forEach(paintExam);document.querySelectorAll('[data-read]').forEach(paintRead);spy();
 if(scroll){if(anchor&&!(l&&lessonView!=='capa')){const el=document.getElementById(anchor);if(el){if(el.tagName==='DETAILS')el.open=true;requestAnimationFrame(()=>el.scrollIntoView())}}else scrollTo(0,0)}
}
function feedback(f){const q=qById[f.dataset.qid],a=state.answers[q.id],el=$('.feedback',f);const ok=!(a==null||!state.verified[q.id]);el.hidden=!ok;f.querySelectorAll('.option').forEach((o,i)=>{o.classList.toggle('right',ok&&i===q.answer);o.classList.toggle('wrong',ok&&i===a&&a!==q.answer)});if(!ok)return;el.className='feedback '+(a===q.answer?'good':'bad');el.textContent=(a===q.answer?'Correta. ':'Gabarito '+String.fromCharCode(65+q.answer)+'. ')+q.why;if(q.origin){const x=examById[q.origin];const a=document.createElement('a');a.href=route(x.group,x.id);a.textContent='  Ver justificativa de origem';el.append(a)}}
function scores(){document.querySelectorAll('[data-score]').forEach(el=>{const qs=el.dataset.score.split(' ').filter(Boolean);el.textContent=qs.filter(k=>state.verified[k]&&state.answers[k]===qById[k].answer).length+' de '+qs.length+' corretas'})}
function calc(){const calc=$('#calc');if(!calc)return;const out=()=>{const num=+$('#num').value,den=+$('#den').value,base=+$('#scale').value;$('#calc-out').textContent=den>0&&num>=0?(num/den*base).toLocaleString('pt-BR',{maximumFractionDigits:2})+' por '+base.toLocaleString('pt-BR'):'Revise os valores'};calc.oninput=out;out()}
function celebrate(t,c){celeEnqueue({theme:'cell',color:'#f2b84b',big:false,ms:3400,kick:'Progresso de estudo',title:t,sub:c,prog:null})}

 const img=e.target.closest('.magnify');if(img){openImage(img);return}
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-ref-toggle'))b.closest('.ref-wrap').toggleAttribute('data-open');
 if(b.dataset.examCheck||b.dataset.examReset){
  const key=b.dataset.examCheck||b.dataset.examReset, f=b.closest('fieldset'), out=$('.feedback',f), answer=examById[key].question.answer, picked=$('input:checked',f);
  if(b.dataset.examReset){delete state.answers[key];delete state.verified[key];f.querySelectorAll('input').forEach(i=>i.checked=false);out.hidden=true;save();paintExam(f);return}
  out.hidden=false;if(!picked){out.textContent='Selecione uma alternativa.';return}
  const value=+picked.value;state.answers[key]=value;state.verified[key]=true;save();
  out.className='feedback '+(answer==null?'':value===answer?'good':'bad');
  out.textContent=answer==null?'Gabarito indisponível para conferência.':value===answer?'Você acertou.':'Gabarito da prova: '+String.fromCharCode(65+answer)+'.';
 }
 if(b.dataset.examCheck)paintExam(b.closest('fieldset'));if(b.dataset.check){const f=b.closest('fieldset'),q=qById[b.dataset.check],pick=$('input:checked',f);if(!pick){$('.feedback',f).hidden=false;$('.feedback',f).textContent='Selecione uma alternativa.';return}
 const first=state.answers[q.id]==null&&!state.missed[q.id];const a=Number(pick.value);state.answers[q.id]=a;state.verified[q.id]=true;if(a!==q.answer)state.missed[q.id]=true;else if(first)state.rewards[q.id]=true;save();feedback(f);scores();
 const set=b.closest('.quiz');const keys=$('[data-score]',set).dataset.score.split(' ').filter(Boolean);const group=keys[0]+'-perfect';if(keys.length>=2&&keys.every(k=>state.rewards[k])&&!state.rewards[group]){state.rewards[group]=true;save();celebrate('Gabarito perfeito','Você acertou todas as questões deste conjunto de primeira. Siga para o próximo segmento.')}
 }
 if(b.dataset.reset){const f=b.closest('fieldset');delete state.answers[b.dataset.reset];delete state.verified[b.dataset.reset];f.querySelectorAll('input').forEach(i=>i.checked=false);save();feedback(f);scores()}
 if(b.dataset.read){setRead(b.dataset.read,!state.read[b.dataset.read])}
 if(b.dataset.note){const selected=getSelection().toString().trim();if(!selected){b.textContent='Selecione um trecho antes';return}state.notes[b.dataset.note+'-'+Date.now()]={text:selected.slice(0,1200),aula:active,segment:b.dataset.note};save();b.textContent='✓ Trecho guardado'}
 if(b.dataset.deleteNote){delete state.notes[b.dataset.deleteNote];save();render({scroll:false})}
 if(b.dataset.start){const pool=allQ.filter(q=>!$('#sim-aula').value||q.aula===$('#sim-aula').value);const qs=b.dataset.start==='final'?balanced15():shuffled(pool).slice(0,Math.max(1,Math.min(40,+$('#sim-count').value||15)));sim={qs,answers:{},flags:{},start:Date.now(),done:false};render({scroll:false});$('#clock')?.scrollIntoView({block:'center'})}
 if(b.dataset.flag&&sim){sim.flags[b.dataset.flag]=!sim.flags[b.dataset.flag];render({scroll:false})}
 if(b.id==='submit-sim'&&sim){sim.done=true;sim.finished=Date.now();for(const q of sim.qs){if(sim.answers[q.id]!==q.answer)state.missed[q.id]=true}save();render({scroll:false})}
});
$('#main').addEventListener('change',e=>{const el=e.target;if(el.dataset.sim&&sim)sim.answers[el.dataset.sim]=+el.value});
$('#main').addEventListener('input',e=>{const el=e.target;if(el.dataset.draft!=null){state.drafts[el.dataset.draft]=el.value;save()}});
$('#main').addEventListener('pointerdown',e=>{if(e.target.closest('[data-note]'))e.preventDefault()});
const searchIndex=[...data.lessons.flatMap(l=>l.sections.map(s=>({key:l.id,id:s.id,label:'Aula '+l.number+' · '+s.title,text:[l.title,s.title,...s.paragraphs,...(s.keys||[]),...(s.deep||[]),s.case||'',s.trap||''].join(' ')}))),...Object.values(examById).map(x=>({key:x.group,id:x.id,label:x.label,text:x.label+' '+x.ocr}))].map(x=>({...x,normalized:norm(x.text)}));
$('#search').addEventListener('input',e=>{const q=norm(e.target.value.trim()),matches=q.length>2?searchIndex.filter(x=>x.normalized.includes(q)):[];$('#hits').hidden=q.length<3;$('#nav').hidden=q.length>2;$('#search-status').textContent=q.length>2?matches.length+' resultado(s)':'';$('#hits').innerHTML=matches.slice(0,50).map(x=>'<a class="it" href="'+route(x.key,x.id)+'"><span class="x">'+esc(x.label)+'</span></a>').join('')});
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))document.body.classList.remove('drawer')});
window.addEventListener('hashchange',()=>render());
tick=setInterval(updateClock,1000);
render();
</script>

<script id="wg-engine">(function(){

/* ---------- figura com pontos (do material de Farmacologia) ---------- */
function hotFig(img,pts,opts){
  opts=opts||{};
  var wrap=el('div',{'class':'hs-wrap'});if(opts.maxw){wrap.style.maxWidth=opts.maxw+'px';wrap.style.margin='0 auto';}var im=el('img',{alt:''});im.src=SRC(img);wrap.appendChild(im);

    if(p.length>2){b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.style.width=p[2]+'%';b.style.height=p[3]+'%';}else{b.style.left=p[0]+'%';b.style.top=p[1]+'%';if(opts.size){b.style.width=opts.size+'px';b.style.height=opts.size+'px';}}
    if(opts.mask)b.innerHTML='<span>?</span>';
    wrap.appendChild(b);hs[k]=b;});
  return {wrap:wrap,hs:hs,clear:function(){for(var k in hs)hs[k].classList.remove('glow','good','badc','dim');}};
}
function challenge(box,fig,items,prefix,onDone){
  var order=shuffle(items.map(function(_,i){return i;})),pos=0,tries=0;
  var pr=el('div',{'class':'wg-prompt'});var info=el('div',{'class':'wg-info'});var row=el('div',{'class':'wg-row'});
  var sc=el('span',{'class':'wg-score'});var skip=el('button',{'class':'wg-btn sec'},'Pular');var again=el('button',{'class':'wg-btn sec'},'Recomeçar');
  row.appendChild(skip);row.appendChild(again);row.appendChild(sc);
  box.appendChild(pr);box.appendChild(fig.wrap);box.appendChild(info);box.appendChild(row);
  function show(){fig.clear();tries=0;if(pos>=order.length){pr.textContent='🏁 Desafio concluído!';info.innerHTML='Clique em <b>Recomeçar</b> para treinar de novo (o XP só conta na primeira vez que você acerta cada item).';if(onDone)onDone();return;}
    var it=items[order[pos]];pr.innerHTML='🎯 '+(pos+1)+'/'+order.length+' — '+it.q;info.innerHTML='Clique no ponto certo da figura.';sc.textContent='';}
  Object.keys(fig.hs).forEach(function(k){fig.hs[k].addEventListener('click',function(){

      info.innerHTML='✅ <b>Isso.</b> '+(it.ok||'');if(first)MC.award(prefix+':c'+order[pos],5,'acertou de primeira');

  });});
  skip.addEventListener('click',function(){if(pos<order.length){var it=items[order[pos]];it.a.forEach(function(k){fig.hs[k].classList.add('glow');});info.innerHTML='Era aqui. '+(it.ok||'');pos++;setTimeout(show,1800);}});
  again.addEventListener('click',function(){order=shuffle(order);pos=0;show();});
  show();
}
function explore(box,fig,info0,texts){

function cardGame(box,cards,choices,prefix,opt){
  opt=opt||{};var st=sget(prefix+':cg',{best:0});
  var hdr=el('div',{'class':'wg-row',style:'margin-top:0'});var sc=el('span',{'class':'wg-score'});var strk=el('span',{'class':'xp',style:'background:#f3a6cf;color:#2a0f1f'});hdr.appendChild(strk);hdr.appendChild(sc);box.appendChild(hdr);

};

/* ================= curve: sorologia no tempo ================= */
REG.curve=function(root,D,id){
  var W=640,H=260,L=44,R=14,T=16,B=36;
  function X(x){return L+(W-L-R)*x/D.xmax;}function Y(y){return T+(H-T-B)*(1-y);}
  function svg(){var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    (D.phases||[]).forEach(function(p,i){s+='<rect x="'+X(p[0])+'" y="'+T+'" width="'+(X(p[1])-X(p[0]))+'" height="'+(H-T-B)+'" fill="'+(i%2?'#f4ecf3':'#faf6f9')+'"/><text x="'+(X(p[0])+X(p[1]))/2+'" y="'+(T+12)+'" font-size="11" text-anchor="middle" fill="#7a6a78">'+p[2]+'</text>';});
    s+='<line x1="'+L+'" y1="'+Y(0)+'" x2="'+(W-R)+'" y2="'+Y(0)+'" stroke="#999"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+Y(0)+'" stroke="#999"/>';
    for(var t=0;t<=D.xmax;t+=D.xstep||4){s+='<text x="'+X(t)+'" y="'+(H-B+16)+'" font-size="11" text-anchor="middle" fill="#666">'+t+'</text>';}
    s+='<text x="'+(W/2)+'" y="'+(H-4)+'" font-size="11.5" text-anchor="middle" fill="#555">'+(D.xlabel||'semanas após a exposição')+'</text>';
    D.series.forEach(function(se){var d='';se.pts.forEach(function(p,i){d+=(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);});s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" '+(se.dash?'stroke-dasharray="6 5"':'')+'/>';});
    s+='<line class="cur" x1="0" y1="'+T+'" x2="0" y2="'+Y(0)+'" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/></svg>';return s;}
  function val(se,x){var p=se.pts;if(x<=p[0][0])return p[0][1];for(var i=1;i<p.length;i++){if(x<=p[i][0]){var a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]||1);}}return p[p.length-1][1];}
  function phaseOf(x){var r=null;(D.phases||[]).forEach(function(p){if(x>=p[0]&&x<p[1])r=p;});return r;}
  function legend(){return '<div class="cv-leg">'+D.series.map(function(se){return '<span><i style="background:'+se.c+'"></i>'+se.n+'</span>';}).join('')+'</div>';}
  var names=['📈 Explorar no tempo'];var builders=[function(box){
    var ch=el('div',{'class':'chart'},svg());box.appendChild(ch);box.insertAdjacentHTML('beforeend',legend());
    var sl=el('input',{type:'range',min:0,max:D.xmax,step:0.5,value:D.x0||2,'class':'slider'});box.appendChild(sl);var info=el('div',{'class':'wg-info'});box.appendChild(info);
    function upd(){var x=+sl.value;var ln=$('line.cur',ch);ln.setAttribute('x1',X(x));ln.setAttribute('x2',X(x));
      var pos=D.series.filter(function(se){return val(se,x)>(D.thr||0.12)&&!se.hide;}).map(function(se){return '<b style="color:'+se.c+'">'+se.n+'</b>';});
      var ph=phaseOf(x);info.innerHTML='<b>'+(D.xname||'Semana')+' '+x+'</b>'+(ph?' · fase: <b>'+ph[2]+'</b>':'')+'<br>Positivos agora: '+(pos.length?pos.join(', '):'nenhum marcador detectável')+(ph&&ph[3]?'<br><span style="opacity:.85">'+ph[3]+'</span>':'');}
    sl.addEventListener('input',upd);upd();}];
  if(D.phases&&D.quiz!==false){names.push('🎯 Em que fase está?');builders.push(function(box){
    var info0=el('p',{style:'margin:0 0 10px'},'Você recebe só o perfil de marcadores de um paciente (sem o gráfico). Em que fase da infecção ele está?');box.appendChild(info0);
    var card=el('div',{'class':'gcard'});box.appendChild(card);var tg=el('div',{'class':'tog'});box.appendChild(tg);var info=el('div',{'class':'wg-info'});box.appendChild(info);
    var row=el('div',{'class':'wg-row'});var nx=el('button',{'class':'wg-btn'},'Outro paciente →');row.appendChild(nx);box.appendChild(row);
    var cur,lock,n=0;
    D.phases.forEach(function(p,i){var b=el('button',{'data-i':i},p[2]);tg.appendChild(b);b.addEventListener('click',function(){if(lock)return;var ok=cur&&cur.ph===i;
      if(ok){lock=true;b.classList.add('good');MC.award(id+':ph'+i,3,'leu a sorologia');info.innerHTML='✅ '+(D.phases[i][3]||'');}else{b.classList.add('badc');info.innerHTML='❌ Olhe de novo quais marcadores estão presentes e quais já sumiram.';}});});
    function nxt(){lock=false;$$('button',tg).forEach(function(b){b.classList.remove('good','badc');});var i=Math.floor(Math.random()*D.phases.length);var p=D.phases[i];var x=p[0]+(p[1]-p[0])*(0.25+Math.random()*0.5);x=Math.round(x*2)/2;
      cur={ph:i};n++;card.innerHTML='<span class="gcount">paciente '+n+'</span>'+D.series.filter(function(se){return !se.hide;}).map(function(se){var v=val(se,x)>(D.thr||0.12);return '<span class="mk '+(v?'pos':'neg')+'">'+se.n+(v?' +':' −')+'</span>';}).join(' ');info.innerHTML='Escolha a fase.';}
    nx.addEventListener('click',nxt);nxt();});}
  modes(root,names,builders);
};

/* ================= hbv: laboratório de sorologia da hepatite B ================= */
var HBM=[['s','HBsAg'],['e','HBeAg'],['cm','Anti-HBc IgM'],['ct','Anti-HBc total (IgG)'],['ae','Anti-HBe'],['as','Anti-HBs']];
function hbvRead(v){
  var s=v.s,e=v.e,cm=v.cm,ct=v.ct||v.cm,ae=v.ae,as=v.as;
  if(!s&&!e&&!cm&&!v.ct&&!ae&&!as)return ['Suscetível','Nunca teve contato com o vírus e não está vacinado. <b>Conduta: vacinar.</b>','sus'];
  if(as&&!s&&!v.ct&&!cm)return ['Imunidade vacinal','Só o anti-HBs: a vacina usa apenas o HBsAg, então não gera anti-HBc.','vac'];
  if(as&&!s&&v.ct)return ['Imunidade após infecção (curado)','Anti-HBc mostra que houve contato com o vírus; anti-HBs com HBsAg negativo mostra que houve cura.','cur'];
  if(s&&cm)return ['Hepatite B aguda','HBsAg + anti-HBc <b>IgM</b> = infecção recente.'+(e?' HBeAg positivo: replicação viral ativa, alta infectividade.':''),'agu'];
  if(!s&&cm&&!as)return ['Janela imunológica (aguda em resolução)','O HBsAg já sumiu e o anti-HBs ainda não apareceu; o anti-HBc IgM é o único marcador da infecção recente.','jan'];
  if(s&&v.ct&&!cm)return ['Hepatite B crônica','HBsAg persistente (> 6 meses) com anti-HBc total e IgM negativo.'+(e?' HBeAg +: replicação ativa, mais infectante.':ae?' Anti-HBe +: soroconversão — replicação baixa (portador inativo, em geral).':''),'cro'];
  if(s&&!v.ct&&!cm)return ['Infecção muito recente (incubação)','O HBsAg é o primeiro marcador a surgir; o anti-HBc vem algumas semanas depois. Repetir a sorologia.','inc'];
  if(!s&&v.ct&&!as)return ['Anti-HBc isolado','Contato prévio com o vírus: cura com anti-HBs que caiu abaixo do detectável, janela tardia ou infecção oculta. Precisa investigar (HBV-DNA).','iso'];
  return ['Perfil incomum','Combinação atípica — na prova, procure o marcador que “manda”: HBsAg (infecção atual), anti-HBc IgM (recente), anti-HBs (imunidade).','x'];
}
REG.hbv=function(root,D,id){
  modes(root,['🧪 Bancada','🎯 Casos do laboratório'],[
    function(box){box.appendChild(el('p',{style:'margin:0 0 10px'},'Ligue e desligue os marcadores (como se o laudo tivesse chegado) e veja a interpretação.'));
      var tg=el('div',{'class':'tog'});var v={};HBM.forEach(function(m){var b=el('button',{'data-k':m[0]},m[1]+' −');tg.appendChild(b);b.addEventListener('click',function(){v[m[0]]=!v[m[0]];b.classList.toggle('on',!!v[m[0]]);b.textContent=m[1]+(v[m[0]]?' +':' −');upd();});});box.appendChild(tg);

/* ================= ict: laboratório da icterícia ================= */
function ictRead(v){
  if(v.pred==='bi'){
    if(v.hem)return ['Pré-hepática — produção excessiva (mecanismo 1)','Hemólise: muita bilirrubina chegando para um fígado normal. BI ↑, sem colúria (BI não passa no rim), fezes normais ou até mais escuras.','pre'];
    if(v.rn)return ['Icterícia neonatal fisiológica (mecanismo 3)','Imaturidade da UGT1A1 + hemólise fisiológica do RN. BI discreta e transitória (até ~2 semanas); tratada com fototerapia.','neo'];
    if(v.tgo)return ['Hepatocelular com BI','Lesão difusa do hepatócito pode reduzir captação e conjugação — mas na prática costuma ser mista.','hep'];
    return ['Defeito de captação/conjugação (mecanismos 2–3)','BI isolada com transaminases e FA normais e sem hemólise: pense em <b>Gilbert</b> (UGT1A1 parcial, piora com jejum e estresse) ou Crigler-Najjar.','gil'];}
  if(v.pred==='bd'){
    if(v.fa&&v.acolia&&!v.tgo)return ['Colestática (mecanismo 5)','Fluxo biliar bloqueado: BD ↑, colúria, acolia, prurido, FA e GGT muito altas. Investigue obstrução extra-hepática (cálculo, tumor de cabeça de pâncreas, colangiocarcinoma).','col'];
    if(v.tgo)return ['Hepatocelular (mecanismo 4 + mistura)','Transaminases muito altas apontam lesão do hepatócito (hepatite viral, medicamentosa). Costuma haver BI e BD elevadas, com colúria.','hep'];
    return ['Defeito de excreção hepatocelular (mecanismo 4)','BD ↑ isolada com enzimas normais: Dubin-Johnson ou Rotor (defeitos de transporte canalicular).','dub'];}
  return ['Escolha o predomínio','Comece pelo tipo de bilirrubina que está alta.','x'];
}

/* ================= calc: escores clínicos ================= */
function calcScore(D,v){
  if(D.mode==='num'){var a=[],ks=[];D.inputs.forEach(function(x){ks.push(x.k);a.push(+v[x.k]);});
    try{var f=new Function(ks.join(','),'var ln=Math.log,max=Math.max,min=Math.min,sqrt=Math.sqrt,round=Math.round;return ('+D.f+');');var r=f.apply(null,a);return isFinite(r)?r:NaN;}catch(e){return NaN;}}
  var t=0;D.items.forEach(function(it,i){var j=v[i];if(j!=null&&it.opts[j])t+=it.opts[j][1];});return t;
}
function calcBand(D,x){if(isNaN(x))return null;for(var i=0;i<D.bands.length;i++){var b=D.bands[i];if(x>=b[0]&&x<=b[1])return i;}return null;}

    var out=el('div',{'class':'hb-out'});box.appendChild(out);

    var card=el('div',{'class':'gcard'});box.appendChild(card);var tg=el('div',{'class':'tog'});box.appendChild(tg);var info=el('div',{'class':'wg-info'});box.appendChild(info);var row=el('div',{'class':'wg-row'});var nx=el('button',{'class':'wg-btn'},'Próximo caso →');row.appendChild(nx);box.appendChild(row);
    var i=-1,lock;
    D.bands.forEach(function(b,bi){var bt=el('button',null,b[2]);tg.appendChild(bt);bt.addEventListener('click',function(){if(lock)return;var c=D.cases[i];var x=calcScore(D,c.v);var ok=calcBand(D,x);

      else{bt.classList.add('badc');info.innerHTML='❌ Some de novo item por item (use a calculadora ao lado).';}});});
