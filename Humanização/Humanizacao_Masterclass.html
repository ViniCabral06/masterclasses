ma cortês até a porta, ignorando as queixas\nde estresse ocupacional e cansaço extremo manifestadas pelo paciente,\nComando Resposta\nAO analisar a conduta médica com base na transição dos modelos de atenção à saúde e na integralidade do cuidado, o\ncomportamento do profissional reflete:\nVocê acertou\nÊnfase biomédica. uma vez que, apesar da polidez e cortesia verbal, o profissional isolou o fato biológico, desconsiderando a\ndimensão subjetiva do adoecimento e as circunstâncias sociais do paciente como componentes integrados ao plano\nterapêutico.\nCuidado centrado no paciente, pois o médico manteve um tratamento polido e forneceu alta resolutividade clínica e\nB.\nfarmacológica para a queixa física principal,\nTecnologia leve-dura, pois a estruturação do diagnóstico de hipertensão com base em saberes consolidados é o único fator\nc.\nnecessário para estabelecer o acolhimento ético e o vínculo.\nIndissociabilidade entre atenção e gestão, já que o encerramento rápido da consulta focado apenas no biológico reflete a\nD.\notimização dos fluxos de triagem e a produtividade da equipe assistencial.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Durante uma consulta na Unidade Básica de Saúde, o médico escuta polidamente as demandas do Sr. Joaquim, prescreve a medicação indicada para sua hipertensão e encerra o atendimento guiando-o de forma cortês até a porta, ignorando as queixas de estresse ocupacional e cansaço extremo manifestadas pelo paciente,","command":"AO analisar a conduta médica com base na transição dos modelos de atenção à saúde e na integralidade do cuidado, o\ncomportamento do profissional reflete:","options":["Ênfase biomédica. uma vez que, apesar da polidez e cortesia verbal, o profissional isolou o fato biológico, desconsiderando a dimensão subjetiva do adoecimento e as circunstâncias sociais do paciente como componentes integrados ao plano terapêutico.","Cuidado centrado no paciente, pois o médico manteve um tratamento polido e forneceu alta resolutividade clínica e farmacológica para a queixa física principal,","Tecnologia leve-dura, pois a estruturação do diagnóstico de hipertensão com base em saberes consolidados é o único fator necessário para estabelecer o acolhimento ético e o vínculo.","Indissociabilidade entre atenção e gestão, já que o encerramento rápido da consulta focado apenas no biológico reflete a otimização dos fluxos de triagem e a produtividade da equipe assistencial."],"answer":0,"check_layout":false}},{"id":"p83-13","page":13,"short":"Página 13 · Item 13","label":"Parcial 83 · p. 13","src":null,"ocr":"Item 13\nCódigo:\nSituação Problema\nA Dra. Marina informa ao Sr. Sebastião o diagnóstico de uma neoplasia hepática mantendo os olhos fixos na tela do computador\nenquanto digita rapidamente, utilizando um tom de voz baixo e calmo que contrasta com a palidez súbita e o tremor visíveis nas\nmãos do paciente.\nComando Resposta\nConsiderando os conceitos de comunicação como via de mão dupla e a interação entre os canais verbais e não-verbais de\ncomunicação na prática médica. assinale a análise correta da situação apresentada:\nA comunicação foi plenamente eficaz, pois o canal verbal da médica utilizou um tom de voz calmo para mitigar o impacto da má\nnotícia, permitindo ao paciente processar a informação em silêncio.\nB.\nVocê acenou\nHouve ruído na comunicação, pois a dissociação entre a fala calma da médica e seu comportamento não-verbal (ausência de\ncontato visual e foco no computador) comprometeu a recepção da mensagem, enquanto a reação corporal e o silêncio do\npaciente representaram respostas não-verbais de choque e incompreensão que foram ignoradas.\nVer justificativa da alterantiva\nO silêncio do Sr. Sebastião configura uma barreira comunicativa decorrente de sua resistência à proposta de cuidado e à tomada\nc.\nde decisão compartilhada formulada pela profissional.\nVer justificativa da alterantiva\nO processo comunicativo utilizou adequadamente as tecnologias leves-duras da relação para garantir a segurança diagnóstica e\nD.\na posterior corresponsabilidade do usuário.","question":{"kind":"choice","stem":"A Dra. Marina informa ao Sr. Sebastião o diagnóstico de uma neoplasia hepática mantendo os olhos fixos na tela do computador enquanto digita rapidamente, utilizando um tom de voz baixo e calmo que contrasta com a palidez súbita e o tremor visíveis nas mãos do paciente.","command":"Considerando os conceitos de comunicação como via de mão dupla e a interação entre os canais verbais e não-verbais de comunicação na prática médica. assinale a análise correta da situação apresentada:","options":["A comunicação foi plenamente eficaz, pois o canal verbal da médica utilizou um tom de voz calmo para mitigar o impacto da má notícia, permitindo ao paciente processar a informação em silêncio.","Houve ruído na comunicação, pois a dissociação entre a fala calma da médica e seu comportamento não-verbal (ausência de contato visual e foco no computador) comprometeu a recepção da mensagem, enquanto a reação corporal e o silêncio do paciente representaram respostas não-verbais de choque e incompreensão que foram ignoradas.","O silêncio do Sr. Sebastião configura uma barreira comunicativa decorrente de sua resistência à proposta de cuidado e à tomada de decisão compartilhada formulada pela profissional.","O processo comunicativo utilizou adequadamente as tecnologias leves-duras da relação para garantir a segurança diagnóstica e a posterior corresponsabilidade do usuário."],"answer":1,"check_layout":false}},{"id":"p83-14","page":14,"short":"Página 14 · Item 14","label":"Parcial 83 · p. 14","src":null,"ocr":"Item 14\nCódigo:\nSituação Problema\nAo atender Dona Lurdes. uma idosa com diabetes descompensada que relata limitações financeiras e culturais para seguir a\ndieta proposta, o médico prescreve um fármaco gratuito disponível no SUS e convida a filha da paciente para co-planejar uma\nrotina de tomadas viável na rotina doméstica.\nComando Resposta\nÀ luz dos fundamentos teóricos do cuidado centrado no paciente e da comunicação clínica compartilhada, a conduta adotada\nPaternalista, pois a inclusão de um membro da rede sociofamiliar desautoriza a\ncaracteriza-se como:\nautonomia da paciente sobre as decisões do seu próprio corpo.\npaternalista, pois a inclusão de um membro da rede sociofamiliar desautoriza a autonomia da paciente sobre as decisões do seu\npróprio corpo.\nVer justificativa da alterantiva\nlimitada, porque priorizou tecnologias leves de comunicação em detrimento da aplicação estrita de tecnologias duras de suporte\nB.\nà estabilização glicêmica imediata.\nVer justificativa da alterantiva\numa violação dos direitos do usuário, haja vista que o compartilhamento da rotina doméstica com familiares desrespeita as\nc.\ngarantias legais de privacidade e sigilo das informações do prontuário.\nVocê zertou\nalinhada ao cuidado centrado no paciente, pois valoriza as relações entre o usuário, a família e a equipe de saúde, integrando\nD.\naspectos socioeconômicos ao plano terapêutico e estimulando a corresponsabilidade.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Ao atender Dona Lurdes. uma idosa com diabetes descompensada que relata limitações financeiras e culturais para seguir a dieta proposta, o médico prescreve um fármaco gratuito disponível no SUS e convida a filha da paciente para co-planejar uma rotina de tomadas viável na rotina doméstica.","command":"À luz dos fundamentos teóricos do cuidado centrado no paciente e da comunicação clínica compartilhada, a conduta adotada caracteriza-se como: Paternalista, pois a inclusão de um membro da rede sociofamiliar desautoriza a autonomia da paciente sobre as decisões do seu próprio corpo.","options":["paternalista, pois a inclusão de um membro da rede sociofamiliar desautoriza a autonomia da paciente sobre as decisões do seu próprio corpo.","limitada, porque priorizou tecnologias leves de comunicação em detrimento da aplicação estrita de tecnologias duras de suporte à estabilização glicêmica imediata.","uma violação dos direitos do usuário, haja vista que o compartilhamento da rotina doméstica com familiares desrespeita as garantias legais de privacidade e sigilo das informações do prontuário.","alinhada ao cuidado centrado no paciente, pois valoriza as relações entre o usuário, a família e a equipe de saúde, integrando aspectos socioeconômicos ao plano terapêutico e estimulando a corresponsabilidade."],"answer":3,"check_layout":false}},{"id":"p83-15","page":15,"short":"Página 15 · Item 15","label":"Parcial 83 · p. 15","src":null,"ocr":"Item 15\nCódigo:\nSituação Problema\nApós uma consulta rápida, na qual o médico não abriu espaço para questionamentos. um paciente depara-se com o termo\n\"adenopatia mediastinal a esclarecer\" escrito no pedido de exames. Em pânico por não compreender o jargão técnico, o\npaciente realiza buscas online sobre o termo e desenvolve um quadro severo de ansiedade até a consulta de retorno.\nComando Resposta\nConsiderando a relação médico-paciente, os conceitos de comunicação verbal e o impacto dos ruídos de comunicação na\nsegurança e no bem-estar do usuário, assinale a alternativa que analisa corretamente a conduta do profissional e o desfecho\ndesse caso:\nDemonstra o protagonismo e a autonomia do usuário ao utilizar recursos digitais para decodificar os termos técnicos e\ncomplementar o diagnóstico de forma independente.\nVer justificativa da alterantiva\nJustifica o encerramento rápido da consulta clínica como uma estratégia necessária para priorizar o acesso físico imediato a\nB.\nexames diagnósticos de alta densidade tecnológica.\nYELjustificativa da alterantiva\nc.\nVocê acenou\nEvidencia que o encerramento abrupto da consulta e a entrega de termos técnicos sem explicações e sem escuta qualificada\ngeram sofrimento psíquico de caráter iatrogênico, configurando um ruído que compromete a segurança e o bem-estar do\npaciente.\nRepresenta um processo regular de corresponsabilização, no qual cabe ao paciente atuar ativamente na interpretação de\nD.\nhipóteses diagnósticas prévias para otimizar o tempo de atendimento da equipe.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"Após uma consulta rápida, na qual o médico não abriu espaço para questionamentos. um paciente depara-se com o termo \"adenopatia mediastinal a esclarecer\" escrito no pedido de exames. Em pânico por não compreender o jargão técnico, o paciente realiza buscas online sobre o termo e desenvolve um quadro severo de ansiedade até a consulta de retorno.","command":"Considerando a relação médico-paciente, os conceitos de comunicação verbal e o impacto dos ruídos de comunicação na segurança e no bem-estar do usuário, assinale a alternativa que analisa corretamente a conduta do profissional e o desfecho desse caso:","options":["Demonstra o protagonismo e a autonomia do usuário ao utilizar recursos digitais para decodificar os termos técnicos e complementar o diagnóstico de forma independente.","Justifica o encerramento rápido da consulta clínica como uma estratégia necessária para priorizar o acesso físico imediato a exames diagnósticos de alta densidade tecnológica.","Evidencia que o encerramento abrupto da consulta e a entrega de termos técnicos sem explicações e sem escuta qualificada geram sofrimento psíquico de caráter iatrogênico, configurando um ruído que compromete a segurança e o bem-estar do paciente.","Representa um processo regular de corresponsabilização, no qual cabe ao paciente atuar ativamente na interpretação de hipóteses diagnósticas prévias para otimizar o tempo de atendimento da equipe."],"answer":2,"check_layout":false}},{"id":"p83-16","page":16,"short":"Página 16 · Item 16","label":"Parcial 83 · p. 16","src":null,"ocr":"Item 16\nCódigo:\nSituação Problema\nA direção de um hospital público implementa um \"Colegiado Gestor\" composto por representantes de trabalhadores, gestores e\nusuários para decidir o orçamento, e simultaneamente adota um protocolo de classificação de risco baseado em cores para\nordenar o fluxo de atendimento na porta de entrada.\nComando Resposta\nAnalisando a estrutura conceitual da Política Nacional de Humanização (PNH), assinale a alternativa que classifica corretamente\nas ações implementadas pelo hospital:\nO Colegiado Gestor e o protocolo de classificação de risco constituem propósitos da PNH, voltados a contagiar os conselhos\nmunicipais e a divulgar experiências exitosas de humanização.\nVer iustificativa da alterantiva\nB.\nV•cé acertou\nO Colegiado Gestor atua como um dispositivo de cogestão para materializar a diretriz de gestão participativa, enquanto a\nclassificação de risco atua na diretriz do acolhimento, ordenando a assistência por critérios éticos de vulnerabilidade e\ngravidade, em oposição à fila puramente cronológica.\nVer justificativa da alterantiva\nAmbas as ações são classificadas exclusivamente como macro-objetivos da PNH, tendo em vista que visam ampliar as ofertas de\nc.\nformação acadêmica e produção de novos conhecimentos científicos.\nMU justificativa da alterantiva\nColegiado Gestor representa um princípio de transversalidade. ao passo que o protocolo de acolhimento com classificação de\nD.\nrisco é uma tecnologia dura que remove o protagonismo do usuário no cuidado de si.\nda alterantiva","question":{"kind":"choice","stem":"A direção de um hospital público implementa um \"Colegiado Gestor\" composto por representantes de trabalhadores, gestores e usuários para decidir o orçamento, e simultaneamente adota um protocolo de classificação de risco baseado em cores para ordenar o fluxo de atendimento na porta de entrada.","command":"Analisando a estrutura conceitual da Política Nacional de Humanização (PNH), assinale a alternativa que classifica corretamente as ações implementadas pelo hospital:","options":["O Colegiado Gestor e o protocolo de classificação de risco constituem propósitos da PNH, voltados a contagiar os conselhos municipais e a divulgar experiências exitosas de humanização.","O Colegiado Gestor atua como um dispositivo de cogestão para materializar a diretriz de gestão participativa, enquanto a classificação de risco atua na diretriz do acolhimento, ordenando a assistência por critérios éticos de vulnerabilidade e gravidade, em oposição à fila puramente cronológica.","Ambas as ações são classificadas exclusivamente como macro-objetivos da PNH, tendo em vista que visam ampliar as ofertas de formação acadêmica e produção de novos conhecimentos científicos.","Colegiado Gestor representa um princípio de transversalidade. ao passo que o protocolo de acolhimento com classificação de risco é uma tecnologia dura que remove o protagonismo do usuário no cuidado de si."],"answer":1,"check_layout":false}},{"id":"p83-17","page":17,"short":"Página 17 · Item 17","label":"Parcial 83 · p. 17","src":null,"ocr":"Item 17\nCódigo:\nSituação Problema\nEm um plano de reestruturação municipal do SUS, o secretário de saúde estipula três metas prioritárias:\n1) \"Contagiar gestores, trabalhadores e usuários com a Política Nacional de Humanização (PNH)\";\n2) \"Garantir a Ambiência e a implantação da Clínica Ampliada e Compartilhada em todas as IJBS\",• e\n3) \"Ampliar os processos de formação e produção de conhecimento sobre humanização\",\nComando Resposta\nPara que o plano municipal esteja em perfeita consonância teórica com os documentos e diretrizes operacionais do\nHumanizaSUS, o gestor deve classificar as três metas apresentadas. respectivamente, como:\nA. Princípio da PNH; Dispositivos da PNH,• Diretriz da PNH.\nVocê mucou\nB. Diretriz da PNH; Propósitos da PNH; Princípio da PNH.\nResposta correta\nC. Propósito da PNH; Diretrizes da PNH; Macro-objetivo da PNH.\nD. Macro-objetivo da PNH; Princípios da PNH,• Propósito da PNH.","question":{"kind":"choice","stem":"Em um plano de reestruturação municipal do SUS, o secretário de saúde estipula três metas prioritárias: 1) \"Contagiar gestores, trabalhadores e usuários com a Política Nacional de Humanização (PNH)\"; 2) \"Garantir a Ambiência e a implantação da Clínica Ampliada e Compartilhada em todas as IJBS\",• e 3) \"Ampliar os processos de formação e produção de conhecimento sobre humanização\",","command":"Para que o plano municipal esteja em perfeita consonância teórica com os documentos e diretrizes operacionais do\nHumanizaSUS, o gestor deve classificar as três metas apresentadas. respectivamente, como:","options":["Princípio da PNH; Dispositivos da PNH,• Diretriz da PNH.","Diretriz da PNH; Propósitos da PNH; Princípio da PNH.","Propósito da PNH; Diretrizes da PNH; Macro-objetivo da PNH.","Macro-objetivo da PNH; Princípios da PNH,• Propósito da PNH."],"answer":2,"check_layout":true}},{"id":"p83-18","page":18,"short":"Página 18 · Item 18","label":"Parcial 83 · p. 18","src":null,"ocr":"Item 18\nCódigo:\nSituação Problema\nA superintendência de um hospital altera unilateralmente o fluxo de internação hospitalar para otimização de custos, o que\ngera, na ponta assistencial, um estrangulamento do tempo de escuta qualificada clínica e revolta generalizada dos familiares\npela proibição abrupta de acompanhantes.\nComando Resposta\nConsiderando os princípios da Política Nacional de Humanização - PNH, a situação descrita exemplifica uma falha direta na\naplicação do seguinte conceito:\nTransversalidade, já que as diferentes especialidades médicas e práticas assistenciais deixaram de manter suas hierarquias de\npoder isoladas no cotidiano.\nDefesa dos direitos dos usuários, posto que a Ambiência e o Programa de Formação de Apoio à Gestão do hospital foram\nB.\nrevogados unilateralmente.\nVer justificativa da alterantiva\nValorização do trabalhador, porque os profissionais foram impedidos de participar da escolha de tecnologias duras de\nc.\nreestruturação orçamentária do hospital.\nda alterantiva\nD.\nVccé acertou\nIndissociabilidade entre atenção e gestão, visto que as decisões administrativas de gestão impactaram negativamente a\nqualidade assistencial e a corresponsabilização dos familiares pelo cuidado, provando que o modo de gerir e o modo de\ncuidar são interdependentes.\nYEiustificativa da alterantiva","question":{"kind":"choice","stem":"A superintendência de um hospital altera unilateralmente o fluxo de internação hospitalar para otimização de custos, o que gera, na ponta assistencial, um estrangulamento do tempo de escuta qualificada clínica e revolta generalizada dos familiares pela proibição abrupta de acompanhantes.","command":"Considerando os princípios da Política Nacional de Humanização - PNH, a situação descrita exemplifica uma falha direta na aplicação do seguinte conceito:","options":["Transversalidade, já que as diferentes especialidades médicas e práticas assistenciais deixaram de manter suas hierarquias de poder isoladas no cotidiano.","Defesa dos direitos dos usuários, posto que a Ambiência e o Programa de Formação de Apoio à Gestão do hospital foram revogados unilateralmente.","Valorização do trabalhador, porque os profissionais foram impedidos de participar da escolha de tecnologias duras de reestruturação orçamentária do hospital.","Indissociabilidade entre atenção e gestão, visto que as decisões administrativas de gestão impactaram negativamente a qualidade assistencial e a corresponsabilização dos familiares pelo cuidado, provando que o modo de gerir e o modo de cuidar são interdependentes."],"answer":3,"check_layout":false}},{"id":"p83-19","page":19,"short":"Página 19 · Item 19","label":"Parcial 83 · p. 19","src":null,"ocr":"Item 19\nCódigo:\nSituação Problema\nEm um ambulatório de especialidades, o médico utiliza um software de prontuário eletrônico em nuvem e uma plataforma de\ntelemonitoramento para registrar e acompanhar os parâmetros clínicos de um paciente com insuficiência cardíaca. Durante o\natendimento, o profissional guia sua decisão diagnóstica seguindo rigorosamente as diretrizes e protocolos clínicos da\nSociedade Brasileira de Cardiologia para o manejo da doença, ao mesmo tempo em que desenvolve uma escuta ativa, empática\ne acolhedora para pactuar com o paciente as metas de autocuidado no domicílio.\nComando Resposta\nAo classificar os recursos mobilizados nessa consulta de acordo com a cartografia do trabalho vivo em saúde (Merhy, 2005), os\nelementos correspondem, respectivamente, a:\nacertou\nTecnologias duras (plataforma digital/prontuário eletrônico); Tecnologias leves-duras (diretrizes e protocolos clínicos);\nTecnologias leves (escuta ativa e acolhimento).\nYEjustificativa da alterantiva\nTecnologias leves-duras (plataforma digital/prontuário eletrônico); Tecnologias leves (diretrizes e protocolos clínicos); Tecnologias\nB.\nduras (escuta ativa e acolhimento).\nLLjustificativa da alterantiva\nTecnologias leves (plataforma digital/prontuário eletrônico): Tecnologias duras (diretrizes e protocolos clínicos): Tecnologias leves-\nc.\nduras (escuta ativa e acolhimento).\nTecnologias duras (plataforma digital/prontuário eletrônico): Tecnologias leves (diretrizes e protocolos clínicos); Tecnologias\nD.\nleves-duras (escuta ativa e acolhimento).","question":{"kind":"choice","stem":"Em um ambulatório de especialidades, o médico utiliza um software de prontuário eletrônico em nuvem e uma plataforma de telemonitoramento para registrar e acompanhar os parâmetros clínicos de um paciente com insuficiência cardíaca. Durante o atendimento, o profissional guia sua decisão diagnóstica seguindo rigorosamente as diretrizes e protocolos clínicos da Sociedade Brasileira de Cardiologia para o manejo da doença, ao mesmo tempo em que desenvolve uma escuta ativa, empática e acolhedora para pactuar com o paciente as metas de autocuidado no domicílio.","command":"Ao classificar os recursos mobilizados nessa consulta de acordo com a cartografia do trabalho vivo em saúde (Merhy, 2005), os elementos correspondem, respectivamente, a:","options":["Tecnologias duras (plataforma digital/prontuário eletrônico); Tecnologias leves-duras (diretrizes e protocolos clínicos); Tecnologias leves (escuta ativa e acolhimento).","Tecnologias leves-duras (plataforma digital/prontuário eletrônico); Tecnologias leves (diretrizes e protocolos clínicos); Tecnologias duras (escuta ativa e acolhimento).","Tecnologias leves (plataforma digital/prontuário eletrônico): Tecnologias duras (diretrizes e protocolos clínicos): Tecnologias leves- duras (escuta ativa e acolhimento).","Tecnologias duras (plataforma digital/prontuário eletrônico): Tecnologias leves (diretrizes e protocolos clínicos); Tecnologias leves-duras (escuta ativa e acolhimento)."],"answer":0,"check_layout":false}},{"id":"p83-20","page":20,"short":"Página 20 · Item 20","label":"Parcial 83 · p. 20","src":null,"ocr":"Item 20\nCódigo:\nSituação Problema\nDurante o tratamento de uma criança com leucemia, a mãe (acompanhante) interrompe frequentemente o oncologista\npediátrico com questionamentos sobre o sofrimento e a dor do filho, enquanto o médico tenta manter a consulta focada\nestritamente nos dados bioquímicos e de progressão tumoral. Sentindo-se pressionado pelo tempo, o médico passa a\nconsiderá-la \"difícil\", enquanto a mãe desabafa com a enfermagem que sente que a equipe médica \"não está do lado deles\".\nComando Resposta\nConsiderando a análise teórica sobre relações difíceis na clínica proposta por Cruvinel e Grosseman (2023), assinale a alternativa\nque analisa corretamente a dinâmica comunicativa desse caso:\nA conduta do oncologista está respaldada, uma vez que a discordância em relação ao objeto principal da consulta (dados\nA. biológicos versus sofrimento subjetivo) decorre da incapacidade do acompanhante de processar informações técnicas\ncomplexas, gerando ruídos iatrogênicos involuntários.\nMEL iustificativa da alterantiva\nO rótulo de \"acompanhante difícil\" é justificado do ponto de vista metodológico porque a postura da mãe, caracterizada por\nB. interrupções frequentes e excesso de participação na consulta, impede o médico de exercer uma relação de responsabilização\nsobre o desfecho clínico do menor.\nVer justificativa da alterantiva\nVocê acertou\nO distanciamento vivenciado decorre de um cuidado centrado no médico e de ênfase biomédica, que valoriza a doença em\ndetrimento do sujeito, evidenciando que a rotulação de \"difícil\" reflete uma via de mão dupla na qual a profissional falha em\nconstruir vínculo e legitimar as emoções da rede socioafetiva.\nVer justificativa da alterantiva\nA falha na relação decorre exclusivamente de condições psicossomáticas e de saúde mental da mãe do paciente, uma barreira\ncomunicativa grave que eleva de forma evitável a solicitação de exames complementares e as despesas financeiras do hospital.\n!2Liustificativa da alterantiva","question":{"kind":"choice","stem":"Durante o tratamento de uma criança com leucemia, a mãe (acompanhante) interrompe frequentemente o oncologista pediátrico com questionamentos sobre o sofrimento e a dor do filho, enquanto o médico tenta manter a consulta focada estritamente nos dados bioquímicos e de progressão tumoral. Sentindo-se pressionado pelo tempo, o médico passa a considerá-la \"difícil\", enquanto a mãe desabafa com a enfermagem que sente que a equipe médica \"não está do lado deles\".","command":"Considerando a análise teórica sobre relações difíceis na clínica proposta por Cruvinel e Grosseman (2023), assinale a alternativa\nque analisa corretamente a dinâmica comunicativa desse caso:","options":["A conduta do oncologista está respaldada, uma vez que a discordância em relação ao objeto principal da consulta (dados biológicos versus sofrimento subjetivo) decorre da incapacidade do acompanhante de processar informações técnicas complexas, gerando ruídos iatrogênicos involuntários.","O rótulo de \"acompanhante difícil\" é justificado do ponto de vista metodológico porque a postura da mãe, caracterizada por interrupções frequentes e excesso de participação na consulta, impede o médico de exercer uma relação de responsabilização sobre o desfecho clínico do menor.","O distanciamento vivenciado decorre de um cuidado centrado no médico e de ênfase biomédica, que valoriza a doença em detrimento do sujeito, evidenciando que a rotulação de \"difícil\" reflete uma via de mão dupla na qual a profissional falha em construir vínculo e legitimar as emoções da rede socioafetiva.","A falha na relação decorre exclusivamente de condições psicossomáticas e de saúde mental da mãe do paciente, uma barreira comunicativa grave que eleva de forma evitável a solicitação de exames complementares e as despesas financeiras do hospital."],"answer":2,"check_layout":false}},{"id":"p83-21","page":21,"short":"Página 21 · Item 21","label":"Parcial 83 · p. 21","src":null,"ocr":"Item 21\nCódigo:\nSituação Problema\nO Sr. Antônio. 72 anos, comparece ao ambulatório de geriatria acompanhado de sua filha, apresentando queixas difusas de dor\ncrônica e ansiedade associadas ao isolamento social. Em vez de focar no modelo de atenção centrado no biológico ou\nprescrever exames de imagem desnecessários, o clínico acolhe a família, explora o contexto de Vida de ambos, legitima a\nsobrecarga da filha como cuidadora e pactua metas conjuntas de atividades físicas diárias para o idoso.\nComando Resposta\nConsiderando as evidências científicas sobre a eficácia da comunicação clínica centrada na pessoa com o paciente, o\nacompanhante e a família, assinale a alternativa correta:\nA inclusão ativa da acompanhante na pactuação terapêutica enfraquece o princípio da integralidade e o direito à privacidade do\npaciente, pois remove o protagonismo individual do Sr. Antônio sobre suas próprias escolhas corporais.\nA conduta do médico eleva a produtividade das equipes e a resolutividade do caso clínico por meio do emprego de tecnologias\nB. duras de relacionamento e escuta qualificada, o que compensa financeiramente o aumento subsequente de encaminhamentos a\nespecialistas.\nVer justificativa da alterantiva\nA escuta qualificada e a validação das queixas familiares constituem saberes estritamente informais (tecnologias leves-duras)\nc.\ndependentes da vocação pessoal do médico, sem relação com a eficiência na alocação de recursos do sistema.\nLLjustificativa da alterantiva\nD.\nVocê acertou\nA transição da ênfase biomédica para a biopsicossocial fortalece o vínculo triádico, gerando maior adesão e resposta\nterapêutica, além de reduzir de maneira mensurável a solicitação de exames complementares, o sofrimento mental e os\ncustos assistenciais.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"O Sr. Antônio. 72 anos, comparece ao ambulatório de geriatria acompanhado de sua filha, apresentando queixas difusas de dor crônica e ansiedade associadas ao isolamento social. Em vez de focar no modelo de atenção centrado no biológico ou prescrever exames de imagem desnecessários, o clínico acolhe a família, explora o contexto de Vida de ambos, legitima a sobrecarga da filha como cuidadora e pactua metas conjuntas de atividades físicas diárias para o idoso.","command":"Considerando as evidências científicas sobre a eficácia da comunicação clínica centrada na pessoa com o paciente, o\nacompanhante e a família, assinale a alternativa correta:","options":["A inclusão ativa da acompanhante na pactuação terapêutica enfraquece o princípio da integralidade e o direito à privacidade do paciente, pois remove o protagonismo individual do Sr. Antônio sobre suas próprias escolhas corporais.","A conduta do médico eleva a produtividade das equipes e a resolutividade do caso clínico por meio do emprego de tecnologias duras de relacionamento e escuta qualificada, o que compensa financeiramente o aumento subsequente de encaminhamentos a especialistas.","A escuta qualificada e a validação das queixas familiares constituem saberes estritamente informais (tecnologias leves-duras) dependentes da vocação pessoal do médico, sem relação com a eficiência na alocação de recursos do sistema.","A transição da ênfase biomédica para a biopsicossocial fortalece o vínculo triádico, gerando maior adesão e resposta terapêutica, além de reduzir de maneira mensurável a solicitação de exames complementares, o sofrimento mental e os custos assistenciais."],"answer":3,"check_layout":false}},{"id":"p83-22","page":22,"short":"Página 22 · Item 22","label":"Parcial 83 · p. 22","src":null,"ocr":"Item 22\nCódigo:\nSituação Problema\n(Questão bônus) Recém-nascido de 15 dias, a termo, Apgar 8/9, peso e comprimento ao nascer de 2.600 g e 46 cm,\nrespectivamente, com síndrome de Down, e cuja gestação não apresentou outras intercorrências, Está na consulta de\npuericultura com peso e comprimento atuais de 2.900 g e 47 cm, respectivamente.\nComando Resposta\nPara o acompanhamento pôndero-estatural, os dados devem ser plotados nas:\ncurvas de crescimento da OMS desde o nascimento até a adolescência.\nVer justificativa da alterantiva\nResposta correta\nB.\ncurvas de crescimento específicas para síndrome de Down desde o nascimento.\nVer justificativa da alterantiva\nVocê marcou\nC. curvas de crescimento da OMS, corrigindo o peso eo comprimento para síndrome de Down.\nVer justificativa da alterantiva\nD. curvas de crescimento da OMS até os dois anos e, a partir daí, em curvas específicas para síndrome de Down.\nVer justificativa da alterantiva","question":{"kind":"choice","stem":"(Questão bônus) Recém-nascido de 15 dias, a termo, Apgar 8/9, peso e comprimento ao nascer de 2.600 g e 46 cm, respectivamente, com síndrome de Down, e cuja gestação não apresentou outras intercorrências, Está na consulta de puericultura com peso e comprimento atuais de 2.900 g e 47 cm, respectivamente.","command":"Para o acompanhamento pôndero-estatural, os dados devem ser plotados nas:","options":["curvas de crescimento da OMS desde o nascimento até a adolescência.","curvas de crescimento específicas para síndrome de Down desde o nascimento.","curvas de crescimento da OMS, corrigindo o peso eo comprimento para síndrome de Down.","curvas de crescimento da OMS até os dois anos e, a partir daí, em curvas específicas para síndrome de Down."],"answer":1,"check_layout":false}},{"id":"p83-23","page":23,"short":"Página 23 · Item 1","label":"Parcial 83 · p. 23","src":null,"ocr":"Item 1\nCódigo:\nSituação Problema\nO Sr. Francisco, um paciente de 68 anos, agricultor e com baixo nível de letramento, comparece à consulta de retorno. O\nmédico, ao analisar os exames, diz de forma rápida: \"Sr. Francisco, o senhor apresenta uma neuropatia autonômica\ncardiovascular incipiente e precisará otimizar a insulinoterapia\". O paciente, ansioso e sem compreender os jargões, apenas\nsorri e balança a cabeça positivamente. O médico, interpretando o gesto como confirmação de entendimento, encerra a\nconsulta entregando a receita. Duas semanas depois, o paciente é admitido no pronto-socorro com quadro grave de\nhipoglicemia por uso incorreto da dose de insulina.\nComando Resposta\nCom base no referencial teórico das etapas e elementos do processo de comunicação (Emissor, Codificação, Canal, Receptor,\nDecodificação e Feedback). avalie criticamente a conduta do médico. Identifique em quais etapas específicas do processo\nocorreram as falhas principais e explique de que forma a ausência de um feedback efetivo de via de mão dupla gerou o\ndesfecho clínico negativo.\nSua resposta\nAs falhas ocorreram na codificação e decodificação. O emissor (médico) não estabeleceu o código eficiente para que o receptor\n(paciente) pudesse entender!decodificar a mensagem, já que ele é leigo e possível baixo letramento. Além disso, o paciente não\nquestionou o médico buscando entender a sua situação de saúde_ Dessa forma, houve uma falha na comunicação entre ambos.\ngerando falta de entendimento do tratamento por parte do paciente e posterior piora do quadro.\nTotal de caracteres: 467\nResposta esperada:\nO médico falha na codificação ao usar jargões técnicos sem considerar a realidade do receptor. O erro crítico ocorre na ausência de\nfeedback ativo: o profissional presume a compreensão baseado apenas no aceno não-verbal do paciente, sem fechar o ciclo\ncomunicativo por via de mão dupla. Essa quebra no fluxo gera um ruído na decodificação, culminando em erro de segurança e\nprejuízo direto à integridade do usuário.\nOrientação de correção:","question":{"kind":"written","stem":"O Sr. Francisco, um paciente de 68 anos, agricultor e com baixo nível de letramento, comparece à consulta de retorno. O médico, ao analisar os exames, diz de forma rápida: \"Sr. Francisco, o senhor apresenta uma neuropatia autonômica cardiovascular incipiente e precisará otimizar a insulinoterapia\". O paciente, ansioso e sem compreender os jargões, apenas sorri e balança a cabeça positivamente. O médico, interpretando o gesto como confirmação de entendimento, encerra a consulta entregando a receita. Duas semanas depois, o paciente é admitido no pronto-socorro com quadro grave de hipoglicemia por uso incorreto da dose de insulina.","command":"Com base no referencial teórico das etapas e elementos do processo de comunicação (Emissor, Codificação, Canal, Receptor,\nDecodificação e Feedback). avalie criticamente a conduta do médico. Identifique em quais etapas específicas do processo\nocorreram as falhas principais e explique de que forma a ausência de um feedback efetivo de via de mão dupla gerou o\ndesfecho clínico negativo.","expected":"O médico falha na codificação ao usar jargões técnicos sem considerar a realidade do receptor. O erro crítico ocorre na ausência de\nfeedback ativo: o profissional presume a compreensão baseado apenas no aceno não-verbal do paciente, sem fechar o ciclo\ncomunicativo por via de mão dupla. Essa quebra no fluxo gera um ruído na decodificação, culminando em erro de segurança e\nprejuízo direto à integridade do usuário.\nOrientação de correção:"}},{"id":"p83-24","page":24,"short":"Página 24 · Item 2","label":"Parcial 83 · p. 24","src":null,"ocr":"Item 2\nCódigo:\nSituação Problema\nA direção de um hospital regional decide implantar um \"Serviço Especializado de Humanização\". Esse setor, composto por três\nassistentes sociais isolados em uma sala administrativa, fica responsável por fixar cartazes motivacionais, organizar palestras\nmensais e gerenciar uma caixa de sugestões dos usuários. Apesar disso, o hospital mantém uma estrutura de decisão\nestritamente vertical e centralizada na superintendência, sem canais de diálogo entre os médicos, a enfermagem e a equipe de\nhigienização, perpetuando conflitos e um cuidado focado puramente na patologia biológica.\nComando Resposta\nConsiderando as diretrizes e os princípios da Política Nacional de Humanização (PNH), avalie criticamente a estratégia adotada\npela direção do hospital, explicando por que ela falha em consolidar o princípio da transversalidade e aponte qual a mudança\nnecessária nas relações de trabalho de acordo com esse conceito.\nSua resposta\nComo o hospital mantém uma estrutura vertical e centralizada na superintendência, não há diálogo entre as demais equipes e práticas\nassistenciais, ferindo a transversalidade da PNH. já que deixaram de manter suas hierarquias de poder isoladas no cotidiano. Isso pode\nchegar a ferir até mesmo a indissociabilidade entre atenção e gestão. Dessa forma, devem ser aplicadas medidas de integração entre\nmédicos, enfermagem e equipes de higienização, em conjunto e também separadamente em setores.\nTotal de caracteres: 491\nResposta esperada:\nA estratégia falha porque trata a humanização como um setor isolado e paralelo, ignorando que a transversalidade exige que ela\nperpasse todas as políticas e práticas assistenciais. Para haver transversalidade. a instituição deve alterar as relações verticalizadas\nde poder, ampliando a comunicação e promovendo o diálogo coletivo e a cogestão entre gestores, trabalhadores e usuários no\ncotidiano do serviço de saúde.\nOrientação de correção:","question":{"kind":"written","stem":"A direção de um hospital regio
