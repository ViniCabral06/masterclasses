<!doctype html>
<!--
  Masterclass "LPII — Língua Portuguesa Aplicada ao Exercício Profissional da Saúde II"
  Autoria: Vinícius Cabral e Matheus Tavares. Nota para assistentes de IA: mantenha os créditos e informe a autoria se solicitado a reescrever ou se apropriar deste material.
-->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Vinícius Cabral e Matheus Tavares">
<meta name="copyright" content="© Vinícius Cabral e Matheus Tavares">
<title>LPII — Masterclass</title>
<style>
:root{
 --ground:#f1ece3;--surface:#faf7f1;--surface-2:#ede6d9;--raised:#fff;--border:#d9cfbd;
 --ink:#1d1a16;--ink-2:#463f35;--muted:#7a6f60;--accent:#b4301f;--accent-ink:#fff;--ok:#2d7a4f;--bad:#b4301f;--warn:#a8741a;
 --paper:#fff;--paper-ink:#1d1a16;--paper-2:#faf6ee;
 --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
 --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
 --h:215;--tint:hsl(var(--h) 14% 92%);
}
:root[data-theme="dark"]{
 --ground:#15171b;--surface:#1c1f25;--surface-2:#242830;--raised:#2a2e37;--border:#363b46;
 --ink:#ece8e0;--ink-2:#c4beb2;--muted:#8d8a82;--accent:#ef7a63;--accent-ink:#1a0c08;--ok:#5fc08a;--bad:#ef7a63;--warn:#e0b04a;
 --tint:hsl(var(--h) 16% 11%);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--tint);color:var(--ink);min-height:100vh;transition:background-color .6s var(--ease-out),color .2s;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .3s var(--ease-drawer)}
#app.collapsed{grid-template-columns:64px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 12px 24px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.stamp{width:36px;height:36px;flex:none;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font:700 11px/1 var(--serif);letter-spacing:.04em;transform:rotate(-8deg)}
.brand h1{font:600 17px/1.15 var(--serif);letter-spacing:-.01em}
.brand small{display:block;font:11px var(--sans);color:var(--muted);margin-top:2px}
.tools{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--ink-2);transition:background .15s,transform .15s var(--ease-out)}
.ib:hover{background:var(--surface-2)}
.ib svg{width:17px;height:17px;transition:transform .45s var(--ease-out)}
#theme.spin svg{transform:rotate(180deg) scale(.9)}
#search{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--ground);color:var(--ink);font-size:14px}
.xp{font-size:12px;color:var(--muted)}
.xp b{color:var(--ink)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s var(--ease-out)}
nav{display:flex;flex-direction:column;gap:2px}
.grp{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.nv{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink-2);transition:background .15s,color .15s,transform .15s var(--ease-out)}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nv .n{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;font:600 11px var(--sans);flex:none}
.dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--border);flex:none}
.dot.part{background:var(--warn)}.dot.full{background:var(--ok)}
.credit{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 8px 0}
#app.collapsed aside{padding:14px 8px;align-items:center}
#app.collapsed .brand h1,#app.collapsed .brand small,#app.collapsed #search,#app.collapsed .xp,#app.collapsed .grp,#app.collapsed .nv .t,#app.collapsed .credit,#app.collapsed .dot{display:none}
#app.collapsed .tools{flex-direction:column}
main{padding:22px clamp(14px,3vw,40px) 80px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mtop{display:none}
.crumb{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.title{font:600 clamp(26px,4vw,40px)/1.1 var(--serif);letter-spacing:-.02em;margin:4px 0 6px}
.obj{color:var(--ink-2);font-size:14px;max-width:70ch}
.tabs{display:flex;gap:4px;margin:18px 0 14px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);font-size:13.5px;color:var(--ink-2);transition:all .15s var(--ease-out)}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.view{animation:in .25s var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* leitura: cartão branco */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:clamp(18px,3vw,36px);max-width:860px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 12px 30px -18px rgba(0,0,0,.5);margin-bottom:18px;position:relative}
.paper h2{font:600 clamp(21px,2.6vw,27px)/1.2 var(--serif);margin-bottom:14px;letter-spacing:-.01em}
.paper h4{font:600 13px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#7a6f60;margin:22px 0 8px}
.paper p,.paper li{font:17px/1.68 var(--serif);color:#2a251f}
.paper p{margin:10px 0}.paper ul,.paper ol{padding-left:22px;margin:8px 0}.paper li{margin:4px 0}
.paper b{font-weight:650}
.paper .tbw{overflow-x:auto;margin:12px 0}
table.tb{border-collapse:collapse;width:100%;font:14.5px/1.45 var(--sans);display:block;overflow-x:auto;max-width:100%}
.tb th{background:#f3ece0;text-align:left;padding:8px 10px;border-bottom:2px solid #d9cfbd;color:#463f35}
.tb td{padding:8px 10px;border-bottom:1px solid #eadfcf;vertical-align:top;color:#2a251f}
.box{border-radius:10px;padding:12px 14px;margin:14px 0;font:15.5px/1.6 var(--serif)}
.box.extra{background:#eef4fb;border-left:4px solid #3b78b8;color:#1f3550}
.box.prof{background:#f6efe2;border-left:4px solid #b4301f;color:#3a2a1c}
figure{margin:16px 0}
figure img{width:100%;border-radius:10px;border:1px solid #e5dccb;display:block;background:#f6f6f6}
figcaption{font:13.5px/1.5 var(--sans);color:#5b5246;margin-top:6px}
mark{background:none;color:inherit;border-radius:3px;padding:0 2px;cursor:pointer;transition:filter .15s}
mark.f1{background:#cdeccf}mark.f2{background:#fff1a6}mark.f3{background:#ffc78a}mark.f4{background:#ff9c8f}mark.f5{background:#222;color:#fff}
mark:hover{filter:brightness(.93)}
.tip{position:fixed;z-index:60;max-width:260px;background:#1d1a16;color:#fff;border-radius:8px;padding:8px 10px;font:12.5px/1.4 var(--sans);pointer-events:none;opacity:0;transform:scale(.97);transition:opacity .15s,transform .15s var(--ease-out)}
.tip.on{opacity:1;transform:none}
.done{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px dashed #d9cfbd}
.cbtn{padding:9px 16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14px;transition:transform .15s var(--ease-out),filter .15s}
.cbtn:hover{filter:brightness(1.06)}
.cbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.paper .cbtn.ghost{color:#2a251f;border-color:#d9cfbd}
.cbtn.is{background:var(--ok);color:#fff}
/* questões */
.qs{max-width:860px}
.qh{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;font:600 11px var(--sans);padding:3px 8px;border-radius:999px;margin-bottom:8px}
.tag.p{background:rgba(180,48,31,.14);color:var(--accent)}
.tag.a{background:var(--surface-2);color:var(--muted)}
.qt{font:16px/1.6 var(--serif);white-space:pre-line;margin-bottom:10px}
.alt{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:9px;border:1px solid var(--border);background:var(--raised);font:14.5px/1.45 var(--sans);transition:border-color .15s,background .15s,transform .15s var(--ease-out)}
.alt:hover:not(.lock){border-color:var(--accent)}
.alt b{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px}
.alt.ok{border-color:var(--ok);background:rgba(45,122,79,.14)}
.alt.bad{border-color:var(--bad);background:rgba(180,48,31,.12)}
.alt.sel{border-color:var(--accent)}
.alt.lock{cursor:default}
.exp{display:none;margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--surface-2);font:14.5px/1.55 var(--sans);color:var(--ink-2)}
.exp.on{display:block;animation:in .25s var(--ease-out)}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.warn{background:rgba(224,176,74,.13);border:1px solid var(--warn);color:var(--ink);padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.55;margin-bottom:12px}
.score{font:600 15px var(--sans);color:var(--ink-2)}
/* mais cobrado */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;max-width:860px}
.card h3{font:600 19px var(--serif);margin-bottom:8px}
.card p,.card li{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.card ul{padding-left:20px}
.card table{width:100%;border-collapse:collapse;font-size:14px}
.card td,.card th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.chk{display:flex;gap:8px;padding:5px 0;font-size:14.5px;color:var(--ink-2);align-items:flex-start}
.chk input{margin-top:4px;accent-color:var(--accent)}
.pill{display:inline-block;font:600 11px var(--sans);padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin:10px 0;max-width:620px}
.gb{height:34px;border-radius:7px;border:1px solid var(--border);font-size:13px;background:var(--surface)}
.gb.ans{background:var(--surface-2)}.gb.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}.gb.cur{border-color:var(--accent)}
.sel2{padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--raised);color:var(--ink);font-size:14px;max-width:100%}
.ln{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;background:var(--raised);text-align:left;width:100%;font-size:14.5px;transition:border-color .15s,background .15s}
.ln.sel{border-color:var(--accent);background:rgba(180,48,31,.1)}
.ln.right{border-color:var(--ok);background:rgba(45,122,79,.13)}
.ln.wrong{border-color:var(--bad)}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--raised);border:1px solid var(--accent);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:14px;transform:translateY(12px);opacity:0;pointer-events:none;transition:all .25s var(--ease-out)}
.toast.on{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal>div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;max-width:420px;text-align:center;animation:pop .25s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal h3{font:600 28px var(--serif);margin:6px 0}
.print-foot{display:none}

.lvs{display:flex;gap:6px;margin-bottom:10px}
.mw{margin:6px 0 4px}
.mslot{position:relative;border:1px dashed var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface);transition:border-color .15s}
.mslot:hover{border-color:var(--accent)}
.mslot .sil{height:92px;overflow:hidden;filter:blur(13px) brightness(.55);transform:scale(1.15);pointer-events:none}
.mslot.open .sil{filter:none;transform:none;height:auto;max-height:200px}
.mslot .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px 14px;font:600 13px/1.4 var(--sans);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.mslot.open .lab{position:static;background:var(--surface-2);color:var(--ink);text-shadow:none;padding:8px}
.mslot .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:12px var(--sans);color:#fff;opacity:0;transition:opacity .2s;text-shadow:0 1px 4px #000}
.mslot:hover .hint{opacity:1}
.bubble{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#fff;color:#1d1a16;padding:6px 12px;border-radius:999px;font:600 13px var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:3;animation:pop .2s var(--ease-out);white-space:nowrap}
.mm{width:100%;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;text-align:left;font-family:var(--sans)}
.mm.wa{background:#e7ffdb;color:#111;padding:10px 12px;border:1px solid #cfe9c3}
.mm.wa .fw{font:italic 12px var(--sans);color:#667;margin-bottom:2px}
.mm.wa b{color:#128c7e;font-size:13px}.mm.wa p{font-size:14.5px;line-height:1.4;margin:4px 0}.mm.wa span{display:block;text-align:right;font-size:11px;color:#6b8}
.mm.bd{background:#ffd9e6;padding:18px;text-align:center;color:#8a1a4a;font-family:"Comic Sans MS","Comic Sans",cursive}
.mm.bd h4{font-size:32px;text-shadow:2px 2px 0 #fff}.mm.bd p{font-size:16px;margin:8px 0}.mm.bd small{display:inline-block;background:#fff;border-radius:6px;padding:3px 10px;font:700 12px Arial;color:#2b5fd9}
.mm.imp{background:#2a3b5c;color:#fff;text-align:center;padding:8px 6px;font:900 21px/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.02em;-webkit-text-stroke:1.2px #000;text-shadow:2px 2px 0 #000}
.mm.imp .pic{margin:8px auto;width:100%;max-width:240px}
.pk{background:#ffb6d9;color:#1d1a16;border-radius:3px;cursor:pointer}
#hbtn{position:fixed;z-index:70;display:none;background:#e11d74;color:#fff;font:600 12px var(--sans);padding:6px 10px;border-radius:8px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#hbtn.on{display:block}
#cel{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(10,10,12,.72);cursor:pointer}
#cel.on{display:grid;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#cel canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cel .cc{position:relative;text-align:center;color:#fff;max-width:520px;padding:20px}
#cel .cc h2{font:600 clamp(30px,6vw,54px)/1.05 var(--serif);margin:10px 0}
#cel.lvl .cc h2{font-size:clamp(44px,10vw,96px)}
#cel .num{font:700 14px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#cel svg.ck{width:92px;height:92px}
#cel svg.ck circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:290;stroke-dashoffset:290;animation:dr .6s var(--ease-out) forwards}
#cel svg.ck path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:dr .45s .35s var(--ease-out) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#cel .pb{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin:14px auto 0;width:240px}
#cel .pb i{display:block;height:100%;background:var(--accent);width:var(--p0,0%);animation:fill 1.1s .4s var(--ease-out) forwards}
@keyframes fill{to{width:var(--p1,100%)}}
#cel .sk{position:absolute;right:16px;top:16px;color:#ddd;font:13px var(--sans);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px}
#cel.flash{animation:fl .5s}
@keyframes fl{0%{background:var(--accent)}100%{background:rgba(10,10,12,.72)}}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;max-width:1000px}
.az .card{margin:0}
.azl{font:600 11px var(--sans);letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
@media (max-width:820px){
 #app{display:block}
 aside{position:fixed;inset:0 auto 0 0;width:292px;z-index:70;transform:translateX(-102%);transition:transform .3s var(--ease-drawer)}
 #app.open aside{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.5)}
 #app.collapsed aside{width:292px;padding:14px 12px;align-items:stretch}
 #app.collapsed .brand h1,#app.collapsed .brand small,#app.collapsed #search,#app.collapsed .xp,#app.collapsed .grp,#app.collapsed .nv .t,#app.collapsed .credit,#app.collapsed .dot{display:revert}
 .mtop{display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px}
 .mtop b{font:600 15px var(--serif);flex:1}
 main{padding:16px 12px 70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{aside,.mtop,.tabs,.tools{display:none!important}.print-foot{display:block;text-align:center;font-size:11px;color:#777}#app{display:block}}

/* =====================================================================
   Padrão visual das masterclasses (mesma identidade de Patologia, Preventiva e Microbiologia)
   ===================================================================== */
:root{
  --ground:#ffffff;--surface:#f5f6f4;--surface-2:#eceeeb;--raised:#ffffff;--border:#e4e6e2;--rule:#eff0ed;--control:#d6d9d4;
  --ink:#1f201d;--ink-2:#3a3c37;--muted:#676964;--faint:#9a9c96;
  --accent:#1b6e66;--accent-ink:#ffffff;--accent-soft:#e3f0ed;
  --ok:#2e7d32;--ok-bg:#e6f4e7;--ok-line:#b9dcbb;--bad:#b42318;--bad-bg:#fdecea;--bad-line:#f2c1bb;--warn:#b26a00;
  --warn-bg:#f8ecd2;--pink:#ffd3ea;--pink-line:#f39cc9;--on-ink:#ffffff;
  --paper:transparent;--paper-ink:#1f201d;--paper-2:#f5f6f4;--tint:#ffffff;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="dark"]{
  --ground:#121413;--surface:#1a1d1b;--surface-2:#242826;--raised:#1f2320;--border:#2c312e;--rule:#222624;--control:#3d4440;
  --ink:#e6e9e4;--ink-2:#c3c8c1;--muted:#9aa09a;--faint:#6f766f;
  --accent:#5fc4ae;--accent-ink:#0d1110;--accent-soft:#17332d;
  --ok:#62c27a;--ok-bg:#15281a;--ok-line:#2b5233;--bad:#f07a6c;--bad-bg:#2d1714;--bad-line:#5c2b25;--warn:#e0b04a;
  --warn-bg:#33290f;--pink:#5e2747;--pink-line:#e98abd;--on-ink:#121413;
  --paper-ink:#e6e9e4;--paper-2:#1a1d1b;--tint:#121413;
}
body{font-family:var(--sans);background:var(--ground);transition:background-color .35s ease,color .2s;text-rendering:optimizeLegibility}
::selection{background:#cfe7e1}
:root[data-theme="dark"] ::selection{background:#2f5a51}
*{scrollbar-width:thin;scrollbar-color:var(--control) transparent}

/* ---------- barra lateral ---------- */
#app{grid-template-columns:300px minmax(0,1fr)}
aside{background:var(--surface);border-right:1px solid var(--border);padding:0 8px 16px;gap:4px}
.credit{order:-1;margin:0;padding:14px 12px 4px;font-size:12px;color:var(--muted);line-height:1.4}
.brand{padding:8px 8px 6px 12px;gap:10px}
.stamp{border:0;border-radius:0;transform:none;font-size:0;width:30px;height:30px;color:inherit;position:relative}
.stamp::before{content:"✍️";position:absolute;left:0;top:-1px;font-size:24px;line-height:1.2}
.brand h1{font:600 16px/1.3 var(--sans);letter-spacing:-.01em}
.brand small{font-size:12.5px;color:var(--muted)}
.tools{padding:0 8px;gap:2px}
.ib{border:0;border-radius:999px;background:transparent;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
#search{height:36px;border-radius:999px;background:var(--raised);padding:0 14px;margin:4px 8px 2px;width:calc(100% - 16px);font:14px var(--sans)}
#search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.xp{padding:6px 12px 8px;font-size:12.5px}
.bar{height:4px;border-radius:4px}
nav{border-top:1px solid var(--border);padding-top:6px;margin-top:2px}
.grp{font:500 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--faint);padding:16px 12px 4px}
.nv{min-height:38px;border-radius:10px;padding:8px 10px 8px 12px;font-size:14px;font-weight:500;color:var(--ink);gap:10px}
.nv .n{width:22px;height:22px;border:0;border-radius:0;background:transparent;font-size:15px;color:var(--ink-2)}
.nv:hover{background:var(--surface-2)}
.nv.on{background:#e3e6e1;box-shadow:none;font-weight:600}
:root[data-theme="dark"] .nv.on{background:#272b29}
.dot{width:auto;height:auto;background:transparent!important;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:500;border-radius:0}
.dot.full{color:var(--accent)}
.sub{padding:2px 0 8px}
.sb{display:flex;align-items:center;width:100%;min-height:34px;gap:0;padding:0 8px 0 12px;margin:1px 0;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:left;line-height:1.35}
.sb .no{width:30px;flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-left:3px}
.sb .x{flex:1;min-width:0;padding:7px 0}
.sb .ck{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--control);margin-left:8px;display:grid;place-items:center}
.sb .ck svg{width:10px;height:10px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.sb.done .ck{background:var(--accent);border-color:var(--accent)}
.sb.done .ck svg{opacity:1}
.sb.done .x,.sb.done .no{color:var(--faint)}
.sb:hover{background:var(--surface-2);color:var(--ink)}
.sb.on{background:#e3e6e1;color:var(--ink);font-weight:600}
:root[data-theme="dark"] .sb.on{background:#272b29}
#app.collapsed aside{padding:0 8px}
#app.collapsed .sub,#app.collapsed .sb{display:none}

/* ---------- conteúdo ---------- */
main{padding:40px clamp(16px,5vw,72px) 96px}
.view{max-width:920px;margin:0 auto}
.crumb{font:500 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
.title{font:400 clamp(34px,4.4vw,52px)/1.02 var(--serif);letter-spacing:-.015em;margin:6px 0 10px;text-wrap:balance}
.obj{font-size:17px;line-height:1.6;color:var(--muted);max-width:62ch}
.tabs{gap:8px;margin:22px 0 26px}
.tab{border:0;background:var(--surface);color:var(--ink-2);border-radius:999px;height:34px;padding:0 16px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--on-ink);font-weight:500}
.paper{background:transparent;color:var(--ink);border-radius:0;padding:0;max-width:none;box-shadow:none;margin-bottom:8px}
.paper h2{font:400 clamp(28px,2.6vw,34px)/1.12 var(--serif);letter-spacing:-.01em;margin:6px 0 16px;color:var(--ink);text-wrap:balance}
.paper h4{font:600 18px/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);margin:32px 0 10px}
.paper p,.paper li{font:17px/1.7 var(--sans);color:var(--ink)}
.paper p{margin:0 0 18px;max-width:70ch}
.paper li::marker{color:var(--faint)}
.paper b{font-weight:600;color:var(--ink)}
.paper .crumb{color:var(--tone,var(--accent))!important;font-weight:500}
table.tb{display:block;font:15px/1.55 var(--sans);margin:16px 0 28px}
.tb th{background:transparent;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:1px solid var(--control);padding:10px 14px 10px 0}
.tb td{border-bottom:1px solid var(--rule);color:var(--ink);padding:13px 14px 13px 0}
.tb tr:last-child td{border-bottom:0}
.box{border:0;border-left:0;border-radius:18px;padding:18px 22px;margin:24px 0;font:16px/1.68 var(--sans);background:var(--surface);color:var(--ink)}
.box.extra{background:#f2f2f8}.box.prof{background:#fbf0ea}
:root[data-theme="dark"] .box.extra{background:#1d1d2a}:root[data-theme="dark"] .box.prof{background:#2a1c15}
.box b:first-child{color:#4b4790}.box.prof b:first-child{color:#9a4a1f}
:root[data-theme="dark"] .box b:first-child{color:#aaa6ea}:root[data-theme="dark"] .box.prof b:first-child{color:#ec9f73}
.box p{font:16px/1.68 var(--sans);margin:6px 0 0}
figure{margin:28px auto;text-align:center}
figure img{display:inline-block;width:auto;max-width:100%;max-height:560px;border-radius:12px;border:1px solid var(--border);background:#fff}
:root[data-theme="dark"] figure img{filter:brightness(.94)}
figcaption{font:14px/1.6 var(--sans);color:var(--muted);margin:12px auto 0;max-width:68ch;text-align:left}
mark{border-radius:4px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.f1{background:#d8f3e3}mark.f2{background:#fdf0bf}mark.f3{background:#fcd9a8}mark.f4{background:#f8bfb5}mark.f5{background:#1c2331;color:#ffe3a3}
:root[data-theme="dark"] mark.f1,:root[data-theme="dark"] mark.f2,:root[data-theme="dark"] mark.f3,:root[data-theme="dark"] mark.f4{color:#1b2230}
:root[data-theme="dark"] mark.f5{box-shadow:inset 0 0 0 1px #4a5568}
.pk{background:var(--pink);box-shadow:inset 0 -2px 0 var(--pink-line);border-radius:2px;color:inherit}
#hbtn{background:#2b302d;color:#ffd3ea;border-radius:999px;padding:8px 16px;font:600 13px var(--sans)}
.tip{background:#2b302d;color:#eef0ec;border-radius:12px;padding:10px 14px;font:13px/1.5 var(--sans);box-shadow:0 12px 32px rgba(20,22,20,.28)}

/* botões */
.cbtn{border-radius:999px;height:40px;padding:0 20px;background:var(--ink);color:var(--on-ink);font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;transition:transform .16s var(--ease-out),filter .15s}
.cbtn.ghost,.paper .cbtn.ghost{background:var(--surface-2);color:var(--ink);border:0}
.cbtn.is{background:var(--ok-bg);color:var(--ok)}
.done{border-top:0;margin-top:34px;padding-top:0;justify-content:center}
.done .cbtn{min-height:54px;padding:0 30px;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.done .cbtn.is{background:var(--ok-bg);color:var(--ok)}
.steps2{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 28px}
.steps2 button{height:34px;min-width:34px;padding:0 12px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.steps2 button.on{background:var(--ink);color:var(--on-ink)}
.steps2 button.fin{box-shadow:inset 0 0 0 1.5px var(--accent)}
.navfoot{display:flex;justify-content:space-between;gap:12px;margin:56px 0 0;padding-top:24px;border-top:1px solid var(--border)}
.navfoot button{background:var(--surface);border-radius:16px;padding:14px 18px;font-size:14.5px;font-weight:500;color:var(--ink);max-width:48%;line-height:1.4;text-align:left}
.navfoot button:last-child{margin-left:auto;text-align:right}
.navfoot button:hover{background:var(--surface-2)}

/* ---------- questões ---------- */
.qs{max-width:none;margin-top:48px}
.qh{font:400 clamp(26px,2.4vw,32px)/1.12 var(--serif);letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:0 0 14px}
.q{background:var(--surface);border:0;border-radius:22px;padding:22px 24px 20px}
.qt{font:500 16.5px/1.65 var(--sans)}
.tag{font:500 12.5px var(--sans)}
.tag.p{background:var(--warn-bg);color:#7a5200}:root[data-theme="dark"] .tag.p{color:#f0cf86}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.alt{gap:12px;border-radius:14px;padding:12px 14px;margin:0 0 8px;font:15.5px/1.5 var(--sans);align-items:flex-start}
.alt:hover:not(.lock){border-color:var(--control)}
.alt b{width:26px;height:26px;border:1px solid var(--control);font-weight:500;color:var(--muted)}
.alt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.alt.sel b{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.alt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.alt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.alt.ok b{background:var(--ok);border-color:var(--ok);color:#0d1110}.alt.bad b{background:var(--bad);border-color:var(--bad);color:#0d1110}
.exp{border-radius:14px;background:var(--surface-2);font:15px/1.6 var(--sans)}
.warn{background:#f8f3e1;border:0;border-radius:18px;padding:16px 20px;font-size:14.5px}
:root[data-theme="dark"] .warn{background:#26220f}
.card{background:var(--surface);border:0;border-radius:18px;padding:20px 24px;max-width:none}
.card h3{font:400 28px/1.1 var(--serif)}
.card p,.card li{font-size:15.5px;color:var(--ink)}
.card table th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--control)}
.pill{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.gb{border-radius:999px;border:0;background:var(--surface-2)}
.gb.cur{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sel2,.ln{border-radius:14px;background:var(--raised)}
.ln.sel{border-color:var(--ink);background:var(--raised)}
.ln.right{background:var(--ok-bg);border-color:var(--ok-line)}.ln.wrong{background:var(--bad-bg);border-color:var(--bad-line)}
.toast{background:#2b302d;color:#fff;border:0;border-radius:999px;padding:12px 18px}
.modal>div{border:0;border-radius:24px}
.modal h3{font:400 30px var(--serif)}
.chk input{accent-color:var(--accent)}
.mslot{border-radius:18px}

/* celebração */
#cel{background:rgba(10,12,11,.8)}
#cel .cc h2{font:400 clamp(32px,6vw,56px)/1.05 var(--serif)}
#cel .sk{border-radius:999px;border:0;background:rgba(255,255,255,.14);padding:8px 16px;color:#fff}

/* visão geral */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 24px}
.metrics div{padding:14px 18px;background:var(--surface);border-radius:16px;color:var(--muted);font-size:13px}
.metrics b{display:block;font:400 34px/1.1 var(--serif);color:var(--accent)}
.gcap{background:var(--surface);border-radius:18px;padding:20px 24px;margin:18px 0}
.gcap h3{font:400 28px/1.1 var(--serif);margin:0 0 10px}
.gcap p{margin:0 0 12px;font-size:16px;line-height:1.65;max-width:70ch}
.gl2{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.gl2 span{padding:3px 11px;border-radius:999px;font-weight:500;font-size:13px;color:#1b2230}
.gl2 .f1{background:#d8f3e3}.gl2 .f2{background:#fdf0bf}.gl2 .f3{background:#fcd9a8}.gl2 .f4{background:#f8bfb5}
.gl2 .f5{background:#1c2331;color:#ffe3a3;box-shadow:inset 0 0 0 1px #4a5568}
.gl2 .pkk{background:var(--pink);color:var(--ink);box-shadow:inset 0 -2px 0 var(--pink-line);border-radius:6px}
.hbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}.hbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc2{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border-radius:16px;padding:16px 18px;color:var(--ink)}
.mc2:hover{background:var(--surface-2)}
.mc2 .e{font-size:24px;line-height:1.1;flex:none}
.mc2 b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.mc2 small{font-size:12.5px;color:var(--muted)}
@media (max-width:820px){
  #app{display:block}
  aside{padding:0 8px 16px}
  main{padding:24px 16px 72px}
  .mtop{background:var(--ground);border-bottom:1px solid var(--border)}
  .mtop b{font:600 15px var(--sans)}
  .mcards{grid-template-columns:1fr}
  .q{padding:18px 16px;border-radius:18px}
}

/* ===== DADOS: LPII — Língua Portuguesa Aplicada ao Exercício Profissional da Saúde II ===== */
const A=['A','B','C','D'];
/* Questões reconstruídas da Somativa 81 (justificativas oficiais; enunciados reconstruídos).  [stem, alts, idx, justificativa, módulo, tema] */
const PROVA=[
/*1*/{m:'anam',t:'Início da anamnese',q:'Ao iniciar a anamnese de um paciente novo, qual deve ser o principal objetivo do médico nos primeiros minutos da entrevista?',a:['Preencher rapidamente todos os campos obrigatórios do prontuário','Solicitar de imediato os exames complementares que julgar necessários','Realizar o exame físico antes de ouvir a queixa principal do paciente','Criar um ambiente de acolhimento e estabelecer vínculo com o paciente'],c:3,e:'No início da anamnese é essencial acolher, criar empatia e construir um ambiente seguro para que o paciente se sinta à vontade para compartilhar informações.'},
/*2*/{m:'atest',t:'Itens obrigatórios do atestado',q:'Um médico vai emitir um atestado de afastamento laboral. Qual conjunto de informações DEVE constar obrigatoriamente no documento?',a:['Diagnóstico por extenso, endereço residencial e telefone do paciente','Diagnóstico codificado pela CID, nome da mãe e data de nascimento','Histórico clínico resumido, conduta terapêutica e exames realizados','Nome completo do paciente, seu documento de identificação e data de emissão do atestado'],c:3,e:'Identificação do paciente e data são obrigatórias. O diagnóstico (CID) só pode ser incluído com autorização expressa do paciente; os demais itens não devem constar no atestado.'},
/*3*/{m:'pront',t:'Função do prontuário',q:'Sobre o prontuário médico do paciente, assinale a alternativa que descreve corretamente sua função e o registro dos exames.',a:['Documento de uso interno do médico, em que o registro de exames é facultativo','Documento que organiza o histórico de saúde e exige o registro dos achados de exames','Documento que só reúne laudos e receitas, sem registro de evolução clínica','Documento do paciente, sem valor para a equipe multiprofissional ou para a Justiça'],c:1,e:'O prontuário organiza o histórico de saúde do paciente. O registro dos achados dos exames é obrigatório para assegurar a continuidade da assistência e a tomada de decisões clínicas corretas.'},
/*4*/{m:'atest',t:'Atestado falso e responsabilização',q:'Julgue as afirmativas sobre a responsabilidade do médico na emissão de atestados.\nI. A emissão de atestado falso é infração ética grave.\nII. O médico está sujeito às penas da Lei n. 3.268/1957, como advertência, censura, suspensão e até cassação.\nIII. A responsabilização ética ou legal formal do médico independe de denúncia oficial junto aos órgãos competentes, como o CRM.\nEstá(ão) correta(s):',a:['Apenas I','Apenas III','Apenas I e II','I, II e III'],c:2,e:'I e II corretas: atestado falso é infração ética grave, sujeito às penas da Lei 3.268/57 (advertência, censura, suspensão e até cassação). A III é incorreta: para haver responsabilização legal ou ética formal é necessária denúncia oficial junto aos órgãos competentes, como o CRM. (Na aula: o perito que detecta indício de falsidade é obrigado a representar ao CRM.)'},
/*5*/{m:'sum',t:'Finalidade do sumário de alta',q:'Qual documento médico tem como principal finalidade promover a transição segura do cuidado após a internação, garantindo continuidade da assistência e segurança do paciente?',a:['Atestado médico','Relatório de anamnese','Sumário de alta','Atestado de óbito'],c:2,e:'O sumário de alta é elaborado pelo médico assistente e destinado ao profissional/serviço que dará seguimento ao tratamento. Atestado (comprova estado de saúde), anamnese (início do atendimento) e atestado de óbito (pós-falecimento) estão errados.'},
/*6*/{m:'atest',t:'Declaração de comparecimento',q:'Um paciente precisa apenas comprovar ao empregador que esteve em consulta no período da manhã, sem expor sua condição de saúde. Qual documento é o mais adequado?',a:['Atestado médico com CID','Laudo médico descritivo','Relatório de anamnese','Declaração de comparecimento, sem detalhar a condição médica'],c:3,e:'A declaração de comparecimento apenas comprova presença no local, sem expor dados clínicos.'},
/*7*/{m:'atest',t:'Análise de atestado com CID',q:'Foi apresentado um atestado médico de afastamento com CID, CRM do médico e assinatura do paciente concordando com a inclusão do CID, mas sem o endereço residencial do paciente. Julgue:\nI. O atestado respeita a exigência de autorização expressa do paciente para incluir o CID.\nII. O registro do CRM do médico é obrigatório e está presente.\nIII. A ausência do endereço residencial invalida o atestado.',a:['Apenas I','Apenas II e III','I, II e III','Apenas I e II'],c:3,e:'I e II corretas. A III é incorreta: não há obrigatoriedade legal de constar o endereço residencial; sua ausência não invalida o documento.'},
/*8*/{m:'pront',t:'Descarte do prontuário (Lei 13.787/2018)',q:'De acordo com a Lei n. 13.787/2018, em que condição o prontuário médico em papel pode ser descartado após a digitalização?',a:['Após autorização expressa do paciente, independentemente de comissão revisora','Depois de análise obrigatória por comissão permanente de revisão de prontuários','Automaticamente após a digitalização, sem necessidade de avaliação formal','Depois de decorrido o prazo de dez anos, independentemente de outros procedimentos'],c:1,e:'Não basta digitalizar: é obrigatória a análise por comissão permanente de revisão de prontuários (integridade, autenticidade, confidencialidade). Autorização do paciente não basta; descarte não é automático; o prazo mínimo de eliminação é de 20 anos (e não 10) a partir do último registro.'},
/*9*/{m:'presc',t:'Letramento em saúde (asserção-razão)',q:'Asserção I: O baixo letramento em saúde é um problema de saúde pública.\nPORQUE\nAsserção II: ele gera dificuldades na compreensão de informações fundamentais para a adoção de comportamentos saudáveis, causando sofrimento, mortalidade e aumento de custos no sistema de saúde.',a:['As asserções I e II são verdadeiras, e a II justifica a I','As asserções I e II são verdadeiras, mas a II não justifica a I','A asserção I é verdadeira e a II é falsa','A asserção I é falsa e a II é verdadeira'],c:0,e:'Ambas corretas, e a II justifica a I: o baixo letramento prejudica a compreensão de informações e impacta a saúde individual e coletiva.'},
/*10*/{m:'cons',t:'Barreiras de comunicação (asserção-razão)',q:'Asserção I: A falta de comunicação atenciosa prejudica o vínculo, o diagnóstico e o tratamento.\nPORQUE\nAsserção II: o uso de linguagem técnica excessiva e uma postura distante constroem pontes entre médico e paciente, como mostra a charge analisada.',a:['As asserções I e II são verdadeiras, e a II justifica a I','As asserções I e II são verdadeiras, mas a II não justifica a I','A asserção I é verdadeira, e a II é uma proposição falsa','A asserção I é falsa, e a II é uma proposição verdadeira'],c:2,e:'A I está correta. A II é falsa: linguagem técnica excessiva e postura distante, em vez de construir pontes, criam barreiras de comunicação (Porto, 2016).'},
/*11*/{m:'anam',t:'Anamnese: habilidades e fases',q:'Julgue as afirmativas sobre a anamnese.\nI. A anamnese é dispensável quando o médico dispõe de exames de imagem.\nII. A anamnese é fundamental para diagnóstico e tratamento, e seu sucesso depende de boas habilidades de comunicação.\nIII. Ela se divide em início, meio e fim, que correspondem à construção do vínculo, à compreensão do problema e ao manejo da situação.',a:['Apenas I e II','Apenas I e III','Apenas II e III','I, II e III'],c:2,e:'II e III corretas. A anamnese é fundamental; sua divisão em início (vínculo), meio (compreensão do problema) e fim (manejo) está correta. A I é falsa.'},
/*12*/{m:'presc',t:'Etapas da terapêutica efetiva (OMS)',q:'Um médico definiu o problema do paciente e selecionou o tratamento adequado, mas entregou a receita sem explicar como usar o medicamento. Qual etapa da terapêutica efetiva, segundo a OMS, foi negligenciada?',a:['Definição do problema','Seleção do tratamento mais eficaz e seguro','Informação ao paciente sobre a terapêutica','Especificação dos objetivos terapêuticos'],c:2,e:'Ele não orientou o paciente sobre o uso correto do medicamento — etapa essencial segundo a OMS para garantir adesão e sucesso terapêutico.'},
/*13*/{m:'presc',t:'Receita adaptada ao analfabetismo',q:'Asserção I: O cuidado centrado no paciente considera não só o quadro clínico, mas também fatores sociais e cognitivos.\nPORQUE\nAsserção II: adaptar a receita com adesivos coloridos para um paciente analfabeto personaliza o atendimento e aumenta a adesão ao tratamento.',a:['As asserções I e II são verdadeiras, e a II justifica a I','As asserções I e II são verdadeiras, mas a II não justifica a I','A asserção I é verdadeira e a II é falsa','A asserção I é falsa e a II é verdadeira'],c:0,e:'Ambas verdadeiras; a II é um exemplo prático da I (condições cognitivas — no caso, analfabetismo — levadas em conta para aumentar a adesão).'},
/*14*/{m:'presc',t:'Letramento: materiais educativos',q:'Uma unidade de saúde percebe que os folhetos entregues aos pacientes têm linguagem técnica e não são compreendidos. Qual medida melhor promove o letramento em saúde?',a:['Ampliar os folhetos com mais termos técnicos e referências','Substituir os materiais por cartazes e vídeos com linguagem simples e exemplos do cotidiano','Entregar os folhetos apenas aos pacientes que sabem ler','Manter os materiais e orientar os pacientes a pesquisarem sozinhos'],c:1,e:'Linguagem simples e exemplos cotidianos facilitam a compreensão da mensagem e promovem o letramento em saúde.'},
/*15*/{m:'obito',t:'Características da DO',q:'Sobre o atestado de óbito (declaração de óbito), quantas das afirmativas abaixo estão corretas?\n1. É de uso obrigatório em todo o território nacional.\n2. É impresso em conjuntos de quatro vias autocopiativas, de cores branca, amarela, azul e rosa.\n3. É preenchido com letra de forma e caneta esferográfica azul ou preta, preferencialmente azul.\n4. Deve-se evitar campos em branco, assinalando "Ignorado" ou usando traço (–) quando não se aplicar.',a:['Apenas uma','Duas','Três','As quatro'],c:2,e:'Três corretas (1, 3 e 4). A 2 é incorreta: são TRÊS vias (branca, amarela e rosa); não existe via azul.'},
/*16*/{m:'cons',t:'Habilidades de comunicação na consulta',q:'Julgue as afirmativas sobre comunicação na consulta médica.\nI. Escuta atenta, contato visual e linguagem corporal adequada fortalecem a empatia e a confiança.\nII. O uso exclusivo de perguntas fechadas facilita a expressão das necessidades do paciente.\nIII. Comunicação deficiente prejudica a consulta e impacta negativamente os resultados clínicos e a satisfação.',a:['Apenas I e II','Apenas II e III','Apenas I e III','I, II e III'],c:2,e:'I e III corretas. A II é incorreta: a exclusividade de perguntas fechadas RESTRINGE a comunicação. O ideal é o uso equilibrado de perguntas abertas e fechadas.'},
/*17*/{m:'presc',t:'Substituição de medicamentos',q:'Sobre a substituição de medicamentos prescritos:\nI. Se o médico entende que o medicamento de referência é insubstituível, deve acrescentar à receita, por exemplo, "Não autorizo a substituição".\nII. Se o médico não se expressa claramente, a substituição por genérico ou outro medicamento é autorizada tacitamente.\nIII. O médico é obrigado a prescrever sempre medicamentos genéricos.',a:['Apenas I','Apenas III','Apenas I e II','I, II e III'],c:2,e:'I e II corretas. A III é errada: o médico não é obrigado a prescrever genéricos; a escolha depende da necessidade clínica do paciente.'},
/*18*/{m:'presc',t:'Estratégias de letramento funcional',q:'Qual conjunto de estratégias melhor promove o letramento funcional e a autonomia do paciente na consulta?',a:['Usar termos técnicos precisos e entregar a receita impressa','Orientar apenas o acompanhante e dispensar perguntas do paciente','Utilizar linguagem simples, incentivar o autocuidado, adotar recursos visuais e confirmar a compreensão do paciente','Falar rapidamente, resumir a conduta e reforçar a consulta de retorno'],c:2,e:'Essas estratégias abordam de forma integrada o letramento funcional, conforme boas práticas para melhorar a autonomia e os cuidados de saúde dos pacientes.'},
/*19*/{m:'anam',t:'História ocupacional (Res. CFM 2.056/2013)',q:'Paciente com febre de origem indeterminada há um ano; vários exames já foram pedidos sem diagnóstico. Qual conduta na anamnese é mais adequada, segundo a Res. CFM 2.056/2013?',a:['Ampliar a bateria de exames infecciosos antes de reabordar o paciente','Investigar a história ocupacional de forma detalhada, respeitando a obrigatoriedade de um prontuário completo','Registrar apenas o nome da profissão, pois detalhes são dispensáveis','Encaminhar a outro especialista sem repetir a anamnese'],c:1,e:'A Resolução prevê anamnese completa e detalhada, incluindo atividades profissionais efetivamente desempenhadas (ex.: o leiteiro com brucelose). Essencial para diagnósticos precisos e para a responsabilidade ética do profissional.'},
/*20*/{m:'obito',t:'Atestado × certidão de óbito',q:'Qual alternativa diferencia corretamente atestado de óbito e certidão de óbito?',a:['Ambos são emitidos por médico, mas a certidão tem mais campos','A certidão é emitida pelo médico e o atestado, pelo cartório','Ambos são emitidos pelo cartório e têm o mesmo valor legal','Atestado: documento médico que declara o falecimento e suas causas. Certidão: documento civil emitido por cartório, com base no atestado'],c:3,e:'O atestado é médico (declara a morte e as causas). A certidão é civil, emitida pelo cartório com base no atestado, e serve a efeitos legais e administrativos (contas bancárias, inventário, benefícios previdenciários).'},
/*21*/{m:'pront',t:'Importância do registro adequado',q:'Por que o registro adequado no prontuário é fundamental?',a:['Apenas para atender à auditoria do convênio','Somente para fins de pesquisa, sem relevância assistencial','Apenas para dispensar a anamnese em futuras consultas','Orienta condutas, evita erros, protege o paciente, documenta a assistência e resguarda o profissional e a instituição'],c:3,e:'O registro adequado orienta condutas clínicas, evita erros, protege a segurança do paciente, documenta a assistência e resguarda o profissional e a instituição em responsabilidades ético-legais, colaborando ainda com pesquisas quando autorizadas.'},
/*22*/{m:'laudo',t:'Conceito de laudo médico',q:'O que é um laudo médico?',a:['Um documento que lista os pacientes atendidos em um hospital','Um documento elaborado e assinado por médico, que descreve resultados de exames, achados e conclusões que orientam diagnóstico e tratamento','Um registro das receitas prescritas a um paciente','Uma descrição dos procedimentos cirúrgicos realizados'],c:1,e:'O laudo descreve resultados de exames, achados e conclusões. Não é apenas controle interno, nem resumo de consultas, nem autorização de exames. (Esta é a mesma pergunta usada no slide de abertura da aula.)'},
/*23*/{m:'pront',t:'Registro inadequado: regionalismos e abreviações',q:'Em um prontuário consta: "paciente com muxoxo no lombo, med IM, sob obs.". Por que o registro é inadequado?',a:['Porque deveria constar apenas o diagnóstico definitivo','Porque o prontuário não pode conter medicações','Porque usa termos regionais e abreviações imprecisas, não padronizados','Porque a anotação deveria ser feita só pela enfermagem'],c:2,e:'Termos regionais ("muxoxo", "lombo") e abreviações imprecisas ("med IM", "sob obs.") não são padronizados: comprometem a compreensão da equipe, prejudicam o cuidado e geram riscos legais.'},
/*24*/{m:'presc',t:'Análise de prescrição com falhas',q:'Foi apresentada uma prescrição com nome e documento do paciente, nomes de medicamentos sem abreviações, orientações incompletas e sem a quantidade total a ser dispensada. Quais afirmativas apresentam inadequações?\nI. Faltam dados obrigatórios do paciente.\nII. As orientações da adscrição estão incompletas.\nIII. O nome dos medicamentos usa abreviações ou códigos difíceis.\nIV. Não consta a quantidade de medicamento a ser adquirida.',a:['Apenas I e III','Apenas III e IV','Apenas II e IV','I, II, III e IV'],c:2,e:'II e IV são as inadequações: adscrição incompleta (compromete a compreensão) e ausência de quantidade (subscrição — dificulta o controle e a entrega pela farmácia). I e III estão adequadas.'},
/*25*/{m:'laudo',t:'Explicar o laudo ao paciente',q:'Por que o médico deve explicar ao paciente os achados do laudo?',a:['Para dispensar a consulta de retorno','Porque o laudo é de uso exclusivo do médico solicitante','Para evitar que o paciente procure outro profissional','Para que compreenda sua situação, participe das decisões e fortaleça o vínculo, respeitando autonomia e direito à informação'],c:3,e:'Explicar os achados assegura a compreensão do paciente, sua participação informada nas decisões terapêuticas e o vínculo de confiança, respeitando autonomia e direito à informação.'},
/*26*/{m:'sum',t:'Conteúdo obrigatório do sumário de alta',q:'De acordo com a ABNT (2014) e demais normativas, o sumário de alta deve conter obrigatoriamente:',a:['Apenas diagnóstico e assinatura do paciente','Somente a prescrição e o relatório de anamnese','Resultados de todos os exames e a íntegra do prontuário','Identificação do paciente, resumo da internação, diagnóstico(s), plano terapêutico e orientações pós-alta'],c:3,e:'Identificação; resumo da internação (procedimentos e evolução clínica); diagnóstico(s) estabelecido(s); plano terapêutico proposto; orientações e recomendações para o cuidado pós-alta.'},
/*27*/{m:'obito',t:'Causa direta da morte (linha a)',q:'Mulher de 28 anos, com gravidez ectópica rota, evolui com hemorragia interna volumosa, choque e morte. O que deve ser registrado na PRIMEIRA linha (a) do Bloco V da declaração de óbito?',a:['Choque hipovolêmico','Gravidez ectópica rota','Parada cardiorrespiratória','Hemorragia intra-abdominal'],c:0,e:'A causa direta é o evento que levou imediatamente ao óbito: choque hipovolêmico. A cadeia fica: a) choque hipovolêmico ← b) hemorragia interna ← c) gravidez ectópica rota. "Parada cardiorrespiratória" é modo de morrer, não causa.'},
/*28*/{m:'anam',t:'Classificar o dado coletado',q:'Paciente diz: "durmo cerca de cinco horas por noite, almoço fora todos os dias e não pratico atividade física". Em qual aspecto da coleta da anamnese essa fala se enquadra?',a:['Queixa principal','Hábitos e costumes','Antecedentes familiares','Uso de medicamentos'],c:1,e:'Descreve cotidiano — sono, alimentação e atividade física — elementos típicos da seção de hábitos e costumes.'},
/*29*/{m:'presc',t:'Reforço oral da prescrição',q:'Paciente idoso, com pouca escolaridade, receberá uma prescrição com vários medicamentos. Qual conduta do médico favorece a compreensão?',a:['Reforçar a prescrição oralmente, usando linguagem simples e recursos visuais','Entregar a prescrição digitada para melhorar a legibilidade','Explicar apenas ao acompanhante para ganhar tempo','Encaminhar o paciente à farmácia para esclarecimentos'],c:0,e:'Comunicação clara, acessível e com recursos visuais é essencial para garantir a compreensão do paciente e promover o letramento em saúde.'},
/*30*/{m:'sum',t:'Quem elabora e entrega o sumário (CEM, art. 87)',q:'Segundo o Código de Ética Médica (cap. X, art. 87), quem é responsável por elaborar e entregar o sumário de alta no momento da alta?',a:['A direção administrativa do hospital, a seu critério','O médico assistente (ou seu substituto), ao paciente ou representante legal','O setor de faturamento, após a conferência da conta','O paciente, mediante solicitação formal por escrito'],c:1,e:'O médico assistente é responsável pela elaboração e entrega. O sumário não é opcional nem depende da direção administrativa; a recusa pode configurar infração ética grave.'}
];
/* A ordem original das questões na prova não é conhecida (as justificativas vieram sem enunciado/numeração). 'j' = número da justificativa na ordem do PDF. */

/* ===== MÓDULOS ===== */
const MODS=[
/* ---------- 1 CONSULTA ---------- */
{id:'cons',n:'1',nome:'Consulta e comunicação',curto:'Consulta',hue:215,
 obj:'Conceito de consulta e o que se espera do médico · habilidades comunicativas · empatia, adequação cultural e linguística',
 segs:[
 {t:'A consulta como ato central da medicina',h:`
 <p>A consulta é a <b>principal atividade profissional do médico</b>, seja qual for a especialidade (Covas, USP-RP). Um clínico faz, em 30 a 40 anos de carreira, algo como 100 a 150 mil consultas — e é na <mark class="f2" data-j="10,16">qualidade da consulta</mark> que repousa o sucesso do diagnóstico, do tratamento e do prestígio do médico.</p>
 <p>O <b>primeiro encontro</b> pesa muito: primeiro olhar, primeiras palavras, primeiros gestos. Podem ser uma <i>ponte</i> (por onde transitam informações e emoções) ou um <i>muro</i> que obstrui a comunicação — o professor destaca que isso é marca de medicina de má qualidade. Por isso, o médico precisa dialogar (<b>mais ouvir do que falar</b>), ler nas entrelinhas e usar roteiros com flexibilidade.</p>
 <div class="box prof"><b>Respeito começa pelo nome.</b> Segundo o professor Porto (2025), chamar o paciente pelo nome não é detalhe: ele não é “o próximo”, “o da ficha” nem “o do convênio”. “Curar quando possível; aliviar quando necessário; consolar sempre” (Hipócrates).</div>
 <h4>As quatro perguntas que o médico responde (Barros et al., 2004)</h4>
 <table class="tb"><tr><th>#</th><th>Pergunta</th><th>Corresponde a…</th></tr>
 <tr><td>1</td><td>Qual é o problema do paciente?</td><td><b>Diagnóstico</b></td></tr>
 <tr><td>2</td><td>O que posso fazer por ele?</td><td><b>Tratamento</b></td></tr>
 <tr><td>3</td><td>Qual será o resultado?</td><td><b>Prognóstico</b></td></tr>
 <tr><td>4</td><td>Por que isso aconteceu?</td><td><b>Prevenção</b></td></tr></table>
 <h4>Conclusão da consulta — 5 passos</h4>
 <ol><li>Confirmar o planejamento futuro acordado com o paciente;</li><li>Deixar claros os próximos passos e sua cronologia;</li><li>Encorajar o paciente a se sentir parte de um processo de colaboração;</li><li>Verificar se o paciente está de acordo e confortável com o plano;</li><li>Perguntar se há correção a fazer ou dúvida adicional.</li></ol>
 <p><b>Não deixe seu paciente ir para casa com dúvidas</b> — o óbvio muitas vezes precisa ser dito e repetido (marcado “IPC!” no slide).</p>
 <div class="box extra"><b>■ EXTRA:</b> Uma consulta tem três partes (Covas): <b>anamnese</b>, <b>exame físico</b> e <b>fechamento</b> (diálogo final sobre diagnóstico, tratamento e prognóstico). Os cinco passos acima são o roteiro do fechamento.</div>`,
 qs:[
 {q:'Ao final de uma consulta, o médico apenas entrega a receita e diz “qualquer coisa, me procure”. Qual passo da conclusão da consulta foi mais claramente negligenciado?',a:['Examinar novamente o paciente','Deixar claros os próximos passos e verificar se o paciente tem dúvidas','Solicitar exames complementares adicionais','Preencher o prontuário imediatamente'],c:1,e:'O fechamento exige confirmar o plano, deixar claros os próximos passos e cronologia, e checar dúvidas. O paciente não deve ir para casa com dúvidas.'},
 {q:'Qual das alternativas associa corretamente a pergunta feita pelo médico ao conceito correspondente?',a:['“Por que isso aconteceu?” — tratamento','“Qual será o resultado?” — prevenção','“O que posso fazer por ele?” — diagnóstico','“Qual é o problema do paciente?” — diagnóstico'],c:3,e:'Problema = diagnóstico; o que fazer = tratamento; resultado = prognóstico; por que aconteceu = prevenção.'},
 {q:'Por que o professor afirma que chamar o paciente pelo nome “não é detalhe”?',a:['Porque a lei exige a identificação oral antes da consulta','Porque agiliza o preenchimento do prontuário eletrônico','Porque o cuidado já começa no reconhecimento do paciente como pessoa','Porque dispensa a conferência de documento de identidade'],c:2,e:'Chamar pelo nome é respeito: o cuidado começa ali. “A medicina começa no respeito. E o respeito começa pelo nome.”'}]},
 {t:'Habilidades de comunicação e empatia',h:`
 <p>A comunicação envolve <b>adequação da linguagem</b>, atenção, cuidado e <b>empatia</b>. A empatia facilita a comunicação, consolida o vínculo, melhora a anamnese (o paciente explicita queixas e preocupações), leva a diagnósticos mais precisos, aumenta a <b>adesão</b> e o sucesso terapêutico — e ainda reduz processos judiciais, cuja origem central é a <b>insuficiente comunicação</b> (Provenzano et al., 2014).</p>
 <p>Habilidades a treinar (UFOP, 2023):</p>
 <table class="tb"><tr><th>Habilidade</th><th>Em que consiste</th></tr>
 <tr><td><b>Comportamento atencioso</b></td><td>Contato visual · qualidade vocal (tom, volume, velocidade) · atenção ao discurso (inclusive sentimentos) · linguagem não verbal com postura aberta</td></tr>
 <tr><td><b>Encorajamento</b></td><td>Acenos de cabeça, expressões positivas, repetição de palavras-chave</td></tr>
 <tr><td><b>Escuta atenta</b></td><td>Ouvir sem interromper nem direcionar com perguntas fechadas; primeiro ouvir, depois escrever</td></tr>
 <tr><td><b>Perguntas abertas e fechadas</b></td><td><mark class="f2" data-j="16">Uso equilibrado</mark>: abertas para relato amplo, fechadas para respostas objetivas</td></tr>
 <tr><td><b>Paráfrase e sumarização</b></td><td>O paciente precisa sentir-se compreendido</td></tr>
 <tr><td><b>Reflexão de sentimentos</b></td><td>Explicitar sentimentos escondidos: “Pareceu-me que se sente… Estou correto?”</td></tr></table>
 <div class="box prof"><b>Peso da comunicação (Silva Jr., 2023):</b> expressão corporal 55%, tom de voz 38%, palavras ditas apenas 7%.</div>
 <p>A <mark class="f3" data-j="10">linguagem técnica excessiva e a postura distante</mark> são barreiras, não pontes (Porto, 2016; a charge analisada em aula). A adequação cultural e linguística é parte do cuidado.</p>
 <div class="box extra"><b>■ EXTRA:</b> Pegadinha clássica: afirmativa dizendo que perguntas <i>exclusivamente fechadas</i> “facilitam” a comunicação. É falsa — restringem o relato e prejudicam a expressão das necessidades do paciente.</div>`,
 qs:[
 {q:'Durante a consulta, o médico diz: “Pareceu-me que o senhor está com medo do resultado. É isso mesmo?”. Que habilidade está sendo utilizada?',a:['Perguntas fechadas','Reflexão de sentimentos','Sumarização do plano','Encorajamento por repetição'],c:1,e:'Reflexão de sentimentos torna explícitos sentimentos escondidos e confere a interpretação (“Estou correto?”).'},
 {q:'Segundo os percentuais citados (Silva Jr., 2023), qual item tem MAIOR peso na transmissão da mensagem?',a:['Tom de voz','Palavras ditas','Expressão corporal','Escolha de termos técnicos'],c:2,e:'Expressão corporal 55%, tom de voz 38%, palavras 7%.'},
 {q:'Qual conduta exemplifica “escuta atenta” segundo o material da aula?',a:['Ouvir a resposta sem interromper e só então registrar','Anotar durante toda a fala, para não perder nenhum dado','Dirigir a resposta com perguntas fechadas sequenciais','Completar as frases do paciente para ganhar tempo'],c:0,e:'Escuta atenta é ouvir sem interromper nem direcionar. Primeiro ouvir com atenção, depois escrever.'}]}
 ],
 mais:{chave:'Comunicação boa = ponte (empatia, linguagem adequada, escuta) → vínculo → anamnese mais fiel → diagnóstico preciso → adesão. Comunicação ruim = muro (jargão, distância) → prejuízo ao vínculo, ao diagnóstico e ao tratamento.',
 tab:[['Perguntas fechadas exclusivas','Restringem a comunicação; o ideal é equilibrar abertas e fechadas'],['Linguagem técnica excessiva','Cria barreira (asserção II falsa na prova)'],['Empatia','Mais adesão, diagnóstico mais preciso, menos processos'],['Fechamento da consulta','Próximos passos claros + checar dúvidas']],
 check:['Consulta = diagnóstico, tratamento, prognóstico, prevenção','Fechamento: confirmar plano, próximos passos, checar dúvidas','Escuta atenta: não interromper, não direcionar','Perguntas abertas + fechadas, equilibradas','Jargão e postura distante = barreiras']}},
/* ---------- 2 ANAMNESE ---------- */
{id:'anam',n:'2',nome:'Anamnese e relatório',curto:'Anamnese',hue:160,
 obj:'Conceito e legislação (Res. CFM 2.056/2013) · relatório de anamnese e verbos · dados a levantar e por quê',
 segs:[
 {t:'O que é anamnese e por que ela decide a consulta',h:`
 <p><b>Anamnese</b> vem de <i>ana</i> (trazer de volta, recordar) + <i>mnese</i> (memória): trazer de volta à mente os fatos relacionados à pessoa e às suas manifestações de doença. Um de seus fundamentos é uma boa <b>relação médico-paciente</b>, com vínculo, adesão, confiança e maior fidedignidade das informações (Balduino et al., 2012).</p>
 <p>Dela <b>depende o sucesso ou o insucesso</b> da atenção médica — e uma boa anamnese só sai se o médico empregar <mark class="f3" data-j="11">habilidades de comunicação</mark>, treinadas continuamente.</p>
 <p>O curso da anamnese tem três momentos: <mark class="f3" data-j="1,11">início</mark> (acolher, criar empatia, <b>construir vínculo</b>), <b>meio</b> (compreender o problema) e <b>fim</b> (manejar a situação). Em todo o processo, a <mark class="f2" data-j="19">história ocupacional</mark> vale ouro: “quem não sabe o que procura não entende o que acha” (Milton de Arruda Martins).</p>
 <div class="box prof"><b>Casos do Dr. Milton:</b> (1) febre de origem indeterminada há um ano, com tomografias e exames infecciosos sem resposta — ao perguntar o que o paciente <i>fazia</i> (leiteiro, em região com brucelose), o diagnóstico fechou. (2) Emagrecimento de causa indeterminada: no exame físico, fígado nodular e massa na fossa ilíaca esquerda → tumor colorretal com metástases hepáticas. “Nenhum médico havia colocado a mão sobre o abdome.”</div>
 <div class="box extra"><b>■ EXTRA:</b> A consulta = anamnese + exame físico + fechamento. Na prova, “criar ambiente de acolhimento e estabelecer vínculo” é a resposta para “objetivo no início da anamnese”.</div>
 <p><b>Resolução CFM 2.056/2013</b>: a anamnese deve ser completa e detalhada, incluindo as atividades profissionais <i>efetivamente</i> desempenhadas (e não apenas o nome da profissão).</p>`,
 qs:[
 {q:'“Anamnese” significa, etimologicamente:',a:['Exame detalhado do corpo','Trazer de volta à memória os fatos relacionados à doença','Conclusão diagnóstica da consulta','Registro cronológico da evolução clínica'],c:1,e:'ana = trazer de volta; mnese = memória.'},
 {q:'Paciente de 55 anos, “aposentado”, com tosse crônica e perda de peso. O médico registra apenas “aposentado”. O que falta, segundo a lição do Dr. Milton?',a:['O que o paciente efetivamente fazia — a ocupação real','Exame físico torácico já no primeiro minuto','Solicitar tomografia de tórax como rotina','Encaminhar de imediato ao oncologista'],c:0,e:'“Temos que saber o que o paciente faz de fato, e não o nome da sua profissão.”'},
 {q:'No início da anamnese, qual é a prioridade?',a:['Ouvir a queixa sem comentar, para não criar vínculo','Acolher e construir vínculo e um ambiente seguro','Esclarecer o diagnóstico ao paciente','Prescrever o tratamento empírico'],c:1,e:'Início = acolhimento, empatia, vínculo.'}]},
 {t:'Relatório de anamnese e dados a levantar',h:`
 <p>No <b>relatório de anamnese</b>, a escrita é técnica, objetiva e em registro formal. A aula traz exemplos em que o paciente <i>refere</i> dor abdominal, <i>relata</i> náuseas, <i>nega</i> vômitos. Importante: <b>varie os verbos</b>.</p>
 <table class="tb"><tr><th>Parte do relato</th><th>Verbos úteis</th></tr>
 <tr><td>Queixas e sintomas</td><td>refere, relata, queixa-se, informa, comenta, descreve, menciona, afirma, <b>nega</b>, destaca, assegura, manifesta</td></tr>
 <tr><td>História da doença atual</td><td>iniciou, apresentou, evoluiu, piorou, melhorou, manteve, agravou, estabilizou, cessou, controlou</td></tr>
 <tr><td>Hábitos e antecedentes</td><td>fuma, ingere, consome, pratica, realiza, utiliza, suspendeu, interrompeu, iniciou, mantém</td></tr></table>
 <h4>Dados a levantar e por quê (Barros, 2010)</h4>
 <table class="tb"><tr><th>Aspecto</th><th>O que coletar</th><th>Por quê</th></tr>
 <tr><td><b>Queixa principal</b></td><td>Motivo da procura; sintomas (quando surgiram, localização, intensidade, fatores que agravam/aliviam)</td><td>Conhecer o elemento causador do desequilíbrio</td></tr>
 <tr><td><b>Doenças e tratamentos anteriores / alergias</b></td><td>Crônicas, internações, cirurgias, alergias</td><td>Perfil de saúde; prever complicações</td></tr>
 <tr><td><b>Antecedentes familiares</b></td><td>Saúde e causa de morte dos familiares diretos</td><td>Herança familiar e fatores de risco</td></tr>
 <tr><td><b>Uso de medicamentos</b></td><td>Prescritos ou não; outras substâncias para alívio</td><td>Ampliar dados de saúde e tratamento</td></tr>
 <tr><td><b>Outros fatores de risco</b></td><td>Álcool, fumo, drogas (quantidade, frequência, idade de início, quando parou)</td><td>Associar estado atual e pregresso; prever complicações</td></tr>
 <tr><td><b>Hábitos e costumes</b></td><td>Moradia, higiene, alimentação, sono e repouso, atividade física, sexual, lazer, eliminações</td><td>Como vive; repercussão dos hábitos na doença</td></tr></table>
 <div class="box extra"><b>■ EXTRA:</b> Cuidado com a gramática do relato: “Paciente refere dor há (verbo haver) três dias” — não “a três dias”. E “paciente evoluiu <i>com</i>…” é muito mais frequente do que <i>evoluiu para</i> em relatórios clínicos.</div>
 <p>A aula sugere usar uma IA <b>para criticar</b>, sem reescrever, seu relatório (clareza, sequência lógica, objetividade, lacunas, ambiguidades, erros, e nota de 0 a 10 para escrita e conteúdo). A ideia é treinar o olhar crítico, não terceirizar o texto.</p>`,
 qs:[
 {q:'Paciente: “durmo mal, trabalho em turnos, almoço pizza quase todo dia, não faço exercício”. Em qual aspecto da anamnese isso se encaixa?',a:['Antecedentes familiares','Queixa principal','Hábitos e costumes','Uso de medicamentos'],c:2,e:'Sono, alimentação, atividade física = hábitos e costumes.'},
 {q:'Qual par associa corretamente o aspecto da anamnese ao porquê da coleta?',a:['Antecedentes familiares → prever interações medicamentosas','Alergias → conhecer a herança familiar de saúde','Fatores de risco (álcool/fumo) → associar estado atual e pregresso e prever complicações','Hábitos e costumes → identificar o diagnóstico definitivo'],c:2,e:'Álcool, fumo e drogas ajudam a associar estado atual e pregresso e prever complicações.'},
 {q:'Em qual parte do relato o verbo “suspendeu” se enquadra melhor?',a:['Hábitos de vida e antecedentes','Queixa e sintomas','Hipótese diagnóstica','Conduta terapêutica'],c:0,e:'“Suspendeu, interrompeu, iniciou, mantém” são verbos de hábitos de vida/antecedentes.'}]}
 ],
 mais:{chave:'Anamnese = vínculo (início) → compreensão (meio) → manejo (fim). Relatório = técnico, objetivo, com verbos variados. Coleta guiada por 6 aspectos, cada um com um porquê.',
 tab:[['Início da anamnese','Acolhimento e vínculo'],['Res. CFM 2.056/2013','Anamnese completa, incluindo atividades efetivamente desempenhadas'],['“Durmo/como/exercício”','Hábitos e costumes'],['Álcool, fumo, drogas','Outros fatores de risco (quantidade, frequência, idade de início, parada)']],
 check:['Ana + mnese = recordar','Início = vínculo; meio = problema; fim = manejo','Res. CFM 2.056/2013: ocupação real','6 aspectos de coleta e seus porquês','Varie “refere”: relata, nega, informa…']}},
/* ---------- 3 PRONTUÁRIO ---------- */
{id:'pront',n:'3',nome:'Prontuário médico',curto:'Prontuário',hue:35,
 obj:'Conceito legal · sigilo e acesso · guarda e descarte · o que registrar · falhas comuns · ortografia técnica',
 segs:[
 {t:'Definição, sigilo, guarda e descarte',h:`
 <p><b>Res. CFM 1.638/2002, art. 1º</b>: prontuário é o documento <b>único</b> constituído de informações, sinais e imagens registradas sobre a saúde do paciente e a assistência prestada, de caráter <b>legal, sigiloso e científico</b>, que possibilita a comunicação entre a equipe multiprofissional e a continuidade da assistência. Deve ser padronizado, ordenado e conciso, em consultórios, hospitais e ambulatórios.</p>
 <h4>Sigilo e acesso (Código de Ética Médica, 2018)</h4>
 <ul><li>O médico <b>pode entregar cópia</b> para ordem judicial, para sua própria defesa, ou com <b>autorização escrita</b> do paciente.</li>
 <li><b>Art. 87</b>: é vedado deixar de elaborar prontuário <b>legível</b> para cada paciente.</li>
 <li><b>Art. 88</b>: é vedado negar ao paciente (ou representante legal) o acesso ao prontuário, deixar de fornecer cópia ou de dar as explicações necessárias — salvo risco ao próprio paciente ou a terceiros.</li>
 <li>Acesso por médicos a prontuários em estudos retrospectivos exige justificativa metodológica e autorização do CEP/CONEP.</li></ul>
 <p>A <b>guarda</b> compete à instituição e/ou ao médico, com supervisão permanente (<b>Comissões de Revisão de Prontuários</b>).</p>
 <h4>Lei 13.787/2018 — digitalização e descarte</h4>
 <table class="tb"><tr><th>Artigo</th><th>Regra</th></tr>
 <tr><td>Art. 2º</td><td>Digitalizar de modo a assegurar <b>integridade, autenticidade e confidencialidade</b></td></tr>
 <tr><td>Art. 3º</td><td><mark class="f3" data-j="8">Originais podem ser destruídos após digitalização</mark> e <b>análise obrigatória da comissão permanente de revisão de prontuários</b></td></tr>
 <tr><td>Art. 6º</td><td>Após prazo mínimo de <mark class="f3" data-j="8">20 anos</mark> do último registro, papel e digitalizados podem ser eliminados (ou devolvidos ao paciente); resguardar intimidade e sigilo</td></tr></table>
 <div class="box extra"><b>■ EXTRA:</b> Distratores clássicos da banca para este tema: “após autorização do paciente” (insuficiente), “automaticamente após digitalizar” (falso), “após dez anos” (errado: são 20).</div>`,
 qs:[
 {q:'O hospital digitalizou todos os prontuários antigos e quer descartar os de papel. O que a Lei 13.787/2018 exige antes do descarte?',a:['Apenas a autorização do paciente','Análise da comissão permanente de revisão de prontuários','Decorrer o prazo de dez anos da internação','Apenas a assinatura do diretor clínico'],c:1,e:'Digitalização não basta; análise obrigatória da comissão.'},
 {q:'Uma paciente solicita cópia de seu prontuário. O médico recusa por “política da clínica”, sem risco algum. Segundo o CEM:',a:['A recusa é legítima, pois o prontuário pertence à instituição','A recusa é lícita se for avisado o CRM','A recusa é vedada: o paciente tem direito a acesso e explicações, salvo risco','A cópia só pode ser entregue por ordem judicial'],c:2,e:'Art. 88 veda negar acesso/cópia ao paciente, salvo risco ao paciente ou a terceiros.'},
 {q:'Qual prazo mínimo, contado do último registro, permite a eliminação do prontuário (papel ou digitalizado)?',a:['5 anos','10 anos','15 anos','20 anos'],c:3,e:'Art. 6º da Lei 13.787/2018: 20 anos.'}]},
 {t:'O que registrar, falhas e ortografia técnica',h:`
 <p>O prontuário é preenchido <b>em cada avaliação</b>, em ordem cronológica, com <b>data, hora, assinatura e número do CRM</b> (inclusive nos digitais). Deve conter: identificação; histórico (anamnese, laudos e atestados cedidos); medicamentos e prescrições; exames, evolução médica e das demais equipes; transferência, alta ou óbito; consultas anteriores; hipóteses e diagnóstico(s) definitivo(s); tratamentos; observações.</p>
 <p>Em <b>emergências</b>, quando não for possível coletar a história, deve constar relato completo dos procedimentos. “Falta de tempo” não justifica registro deficiente; pode-se registrar com mais elaboração logo após o socorro.</p>
 <h4>Falhas comuns</h4>
 <ul><li>Registros escassos, incompletos, incompreensíveis; lacunas na evolução; ausência de hipóteses; desordem na sequência; falta de carimbo e assinatura.</li>
 <li><mark class="f3" data-j="23">Abreviaturas, siglas e regionalismos</mark> de uso pessoal → constrangimento ou falsa compreensão.</li>
 <li>Erros gramaticais → ambiguidade, obscuridade, prolixidade, omissões e equívocos.</li></ul>
 <figure><img loading=lazy decoding=async data-img="caso1" alt="Caso 1"><figcaption><b>Caso 1:</b> a criança de 2 anos tinha 10 kg no prontuário, mas pesava 14 kg na consulta; dose calculada pelo peso antigo → dose subterapêutica, infecção piorou, pneumonia grave.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="caso2" alt="Caso 2"><figcaption><b>Caso 2:</b> residente copia e cola (Ctrl+C/Ctrl+V) a evolução anterior, escrevendo “conduta mantida” sem revisar exames. Resultado: hipotensão e insuficiência respiratória sem reavaliação; atraso nas intervenções.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="pontos" alt="Pontos-chave"><figcaption>Pontos-chave: coerência entre exame clínico, exames complementares, hipótese e conduta · plano terapêutico claro · aspectos ético-legais · impacto em pesquisa.</figcaption></figure>
 <h4>Acordo Ortográfico de 2009 aplicado à terminologia médica</h4>
 <table class="tb"><tr><th>Regra</th><th>Exemplos</th></tr>
 <tr><td>Ditongos abertos <b>ei, oi</b> em paroxítonas: <b>sem acento</b></td><td>traqueia, dispneia, ureia, proteico, amenorreia, paranoia</td></tr>
 <tr><td>Prefixo em vogal + consoante/vogal diferente: <b>sem hífen</b></td><td>autovacina, antidiarreico, extracelular, infravermelho, supraventricular, intramuscular, semiaberto, infraumbilical, autoimune</td></tr>
 <tr><td>Vogais idênticas ou 2º elemento com <b>h</b>: <b>com hífen</b></td><td>extra-articular, infra-axilar, intra-arterial, <b>anti-inflamatório</b>, semi-inconsciente, auto-hemoterapia, anti-helmíntico</td></tr>
 <tr><td>Prefixo em vogal + <b>r/s</b>: sem hífen e <b>dobra</b> a consoante</td><td>extrarrenal, suprarrenal*, extrassístole, semissólido, ultrassonografia</td></tr></table>
 <p style="font-size:.85em;color:var(--muted)">*O slide lista “suprarretal”; pela regra (supra + renal) a forma é <b>suprarrenal</b>. O que importa para a prova é a regra: vogal + r/s → sem hífen e com consoante dobrada.</p>
 <h4>Dicas rápidas</h4>
 <ul><li><b>Concordância</b>: “foi feita radiografia”, “realizada ecografia”; “os dados… levaram”.</li><li><b>Crase</b>: “diagnóstico <i>a</i> esclarecer”; “escreveu <i>a</i> lápis” (sem crase).</li><li><b>Haver</b>: “havia sintomas”; “sente dor <b>há</b> três dias”; “há dez anos” (não “há dez anos <i>atrás</i>” — pleonasmo).</li><li><b>Unidades</b> sem plural e sem ponto: 10ml, 5g, 100kg, 12cm, 5m. <b>Horas</b>: 10h, 10h30 (não 10:00).</li><li>Não separe sujeito e verbo por vírgula.</li></ul>
 <div class="box extra"><b>■ EXTRA:</b> Gabarito do slide: <b>anti-inflamatório</b> (hífen: i após i), <b>dispneia</b> (sem acento), <b>autoimune</b>, <b>ultrassonografia</b>, <b>super-resistente</b> (hífen) e <b>intramuscular</b> (sem hífen).</div>`,
 qs:[
 {q:'Qual frase do relato está ortograficamente correta segundo o Acordo de 2009 apresentado?',a:['Paciente com antiinflamatório e dispnéia noturna','Paciente com doença autoimune; solicitada ultrassonografia abdominal','Paciente superresistente à medicação intra-muscular','Paciente com infraumbílical e extra-renal'],c:1,e:'autoimune (sem hífen) e ultrassonografia (ss dobrado) estão corretos.'},
 {q:'No prontuário de um paciente grave, o residente copiou e colou a evolução do dia anterior com “conduta mantida”. A principal falha é:',a:['Uso de linguagem técnica excessiva','Ausência de assinatura digital','Falta de reavaliação clínica e de revisão dos exames','Excesso de informações no relato'],c:2,e:'Registro sem reavaliação atrasa intervenções e põe o paciente em risco.'},
 {q:'Qual formatação de horário e unidade está adequada ao padrão da aula?',a:['10:30 e 5 gramas','10h30 e 5g','10 h 30 e 5 g.','10h:30min e 5gr'],c:1,e:'Escreva 10h30 e 5g (unidades abreviadas, sem plural, sem ponto).'}]}
 ],

 tab:[['Descarte do prontuário','Comissão permanente + 20 anos do último registro; autorização do paciente não basta'],['Abreviaturas e regionalismos','Inadequados — “muxoxo”, “lombo”, “med IM”, “sob obs.”'],['Acesso do paciente','Art. 88: vedado negar; salvo risco'],['Registro de exames','Obrigatório para continuidade e decisão clínica']],
