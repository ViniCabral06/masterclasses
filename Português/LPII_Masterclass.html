/* ---------- 4 ATESTADO ---------- */
{id:'atest',n:'4',nome:'Atestado médico',curto:'Atestado',hue:5,
 obj:'Conceito · Res. CFM 2.381/2024 · CID e sigilo · responsabilidades · declaração de comparecimento · estrutura',
 segs:[
 {t:'Legislação, CID e responsabilidade',h:`
 <p><b>Atestado médico</b> é a afirmação simples, por escrito, de fato médico e suas consequências; é parte integrante da consulta e <b>direito subjetivo</b> do paciente. O médico <b>não pode se negar</b> a emiti-lo quando solicitado (CEM).</p>
 <figure><img loading=lazy decoding=async data-img="atinfo" alt="info principais"><figcaption>Atestado de afastamento: <b>tempo de afastamento</b>, <b>diagnóstico</b> (só com autorização por escrito do paciente) e <b>identificação do médico</b> (nome, assinatura e CRM). Registrar de maneira <b>legível</b>.</figcaption></figure>
 <h4>CID no atestado — sigilo</h4>
 <p>CID (Classificação Internacional de Doenças, mantida pela OMS) pode constar apenas se: (1) <b>justa causa</b>; (2) <b>dever legal</b> (ex.: doenças de notificação compulsória); ou (3) <b>solicitação do paciente ou representante legal</b>. Nesse caso (§4º), a concordância deve estar <b>expressa no atestado</b> e <b>registrada na ficha clínica/prontuário</b>. Sem isso, o sigilo é “direito incontestável” do paciente.</p>
 <div class="box extra"><b>■ EXTRA:</b> Exemplos de CID do slide: A09 (infecções intestinais), C34 (neoplasia de brônquios/pulmões), D50 (anemia ferropriva), A90 (dengue clássico), A91 (febre hemorrágica da dengue), N11.1, N20.0 (calculose do rim), Z01.0 (exame dos olhos). Memorize a lógica, não a lista.</div>
 <h4>Após emitir: registre no prontuário</h4>
 <p>Dados dos exames e tratamentos realizados, de modo a atender peritos de empresas, da Previdência e da Justiça.</p>
 <h4>Empresa, homologação e perícia</h4>
 <ul><li>A empresa <b>não pode recusar</b> atestado verídico (presunção de veracidade), salvo divergência de médico da instituição ou perito.</li>
 <li>Indício de falsidade: o médico perito <b>é obrigado a representar ao CRM</b>.</li>
 <li><b>Homologação</b> = perícia por médico do trabalho; pode confirmar, estender ou diminuir os dias.</li></ul>
 <h4>Responsabilidade do médico</h4>
 <p>CEM: é vedado expedir documento sem ato profissional que o justifique, tendencioso ou que não corresponda à verdade, e atestar para obter vantagens. <mark class="f3" data-j="4">Atestado falso é infração ética grave</mark>. A <b>Lei 3.268/1957, art. 22</b> prevê: a) advertência confidencial; b) censura confidencial; c) censura pública; d) suspensão até 30 dias; e) cassação do exercício profissional.</p>`,
 qs:[
 {q:'Paciente pede atestado de 3 dias de afastamento e quer que conste o diagnóstico (CID A90). O que o médico deve fazer?',a:['Recusar, pois o CID nunca pode constar no atestado','Incluir o CID e registrar a concordância do paciente no atestado e no prontuário','Incluir o CID sem registrar nada, por ser direito do paciente','Incluir o CID mediante autorização verbal da empresa'],c:1,e:'§4º: a concordância deve estar expressa no atestado e registrada em ficha clínica/prontuário.'},
 {q:'Qual sanção NÃO está prevista no art. 22 da Lei 3.268/1957 para o médico?',a:['Censura pública em publicação oficial','Suspensão do exercício até 30 dias','Prisão administrativa imediata','Cassação do exercício profissional'],c:2,e:'O art. 22 lista advertência e censura confidenciais, censura pública, suspensão até 30 dias e cassação ad referendum do CFM.'},
 {q:'Um médico do trabalho suspeita que um atestado é falso. O que se espera dele, segundo a aula?',a:['Rasgar o atestado e demitir o funcionário','Representar ao CRM de sua jurisdição','Aguardar denúncia da empresa','Emitir novo atestado em nome próprio'],c:1,e:'Em indício de falsidade, o médico em função pericial é obrigado a representar ao CRM.'}]},
 {t:'Estrutura, declaração de comparecimento e elaboração',h:`
 <p>O atestado é <b>redação técnica</b>: linguagem formal, informação objetiva e concisa. Estrutura:</p>
 <ol><li>Papel timbrado;</li><li>Título <b>ATESTADO</b>;</li><li>Identificação de quem solicitou (nome e identidade);</li><li><b>Descrição da prova</b> — o que a pessoa precisa provar;</li><li>Local e data;</li><li>Assinatura do emitente + <b>CRM</b>.</li></ol>
 <figure><img loading=lazy decoding=async data-img="atmod" alt="modelo"><figcaption>Modelo da aula: “Atesto, para devidos fins, que José Paciente da Silva, portador do CPF…, compareceu para consulta nesta data… CID A90. Em decorrência, deverá permanecer afastado por 3 dias…” — com autorização expressa do paciente para o CID ao final.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="m_atest" alt="atestado real"><figcaption>Atestado real da aula: CID A90 presente, <b>“a referência do CID teve o pedido e consentimento do paciente”</b>, “De acordo” com assinatura do paciente, médico com CRM e data/hora de emissão.</figcaption></figure>
 <h4>Declaração de comparecimento × atestado</h4>
 <table class="tb"><tr><th></th><th>Atestado médico</th><th>Declaração de comparecimento</th></tr>
 <tr><td>Informação clínica</td><td>Certifica a <b>condição médica</b> e justifica a ausência</td><td><b>Não detalha</b> condição; só confirma presença</td></tr>
 <tr><td>Uso típico</td><td>Afastamento, benefícios, liberação para atividades</td><td>Justificar ausência por consulta/exame</td></tr></table>
 <p>Contextos de emissão: justificativa de ausência · liberação para atividades · benefícios e direitos · viagens e eventos.</p>
 <div class="box prof"><b>Caso em aula (Pedro, 20 anos, miopia):</b> usou dilatador de pupila; digitador; não conseguirá trabalhar. Atestado: identificação + data/horário + afastamento do dia por efeito do dilatador + local/data + assinatura/CRM. O diagnóstico (CID Z01.0 só com autorização).</div>`,
 qs:[
 {q:'Paciente só precisa justificar à faculdade que esteve em exame de imagem pela manhã. Qual documento é mais adequado?',a:['Declaração de comparecimento','Atestado de afastamento com CID','Laudo do exame','Sumário de alta'],c:0,e:'Declaração de comparecimento só confirma presença, sem expor condição médica.'},
 {q:'Qual item NÃO faz parte da estrutura básica do atestado?',a:['Assinatura e CRM do emitente','Local e data','Descrição da prova','Plano terapêutico detalhado'],c:3,e:'Atestado é conciso. Plano terapêutico detalhado não faz parte dele.'},
 {q:'Qual afirmação sobre homologação está correta?',a:['É perícia por médico do trabalho que pode confirmar, estender ou reduzir os dias','É a autorização do paciente para uso do CID','É a recusa legítima do atestado pela empresa','É o registro do atestado em cartório'],c:0,e:'Homologação = perícia por médico do trabalho.'}]}
 ],
 mais:{chave:'Atestado = fato médico + consequência. Sigilo é a regra; CID só com justa causa, dever legal ou pedido do paciente (registrado). Identificação do paciente + data são obrigatórias; endereço não.',
 tab:[['CID','Só com autorização expressa (ou justa causa/dever legal)'],['Endereço residencial','Não obrigatório — ausência não invalida'],['Atestado falso','Infração ética grave; Lei 3.268/57'],['Declaração de comparecimento','Sem condição clínica'],['Empresa recusar','Não pode (presunção de veracidade)']],
 check:['Res. CFM 2.381/2024','Tempo + diagnóstico (autorizado) + médico/CRM, legível','Nome, doc e data = obrigatórios','Lei 3.268/57: 5 penas','Declaração ≠ atestado']}},
/* ---------- 5 LAUDO ---------- */
{id:'laudo',n:'5',nome:'Laudo médico',curto:'Laudo',hue:265,
 obj:'Características do laudo · Res. CFM 2.235/2019 · elementos obrigatórios · linguagem · laudo psiquiátrico',
 segs:[
 {t:'Conceito, resolução e elementos do laudo',h:`
 <p><b>Laudo médico</b> é o documento assinado por especialista em que ele <b>descreve os elementos encontrados em um exame</b>, sinalizando normalidade ou alterações. É o meio formal do parecer profissional — e uma das principais atividades de clínicas e hospitais. Dele saem <b>hipóteses diagnósticas</b> que embasam o tratamento; também serve em contextos judiciais, benefícios previdenciários e editais.</p>
 <p>Deve buscar <b>conteúdo probatório e imparcial</b> (Almeida, 2011).</p>
 <h4>Resolução CFM 2.235/2019</h4>
 <ul><li>Exames de patologia clínica, patologia, radiologia/imagem, medicina nuclear, eletrofisiologia, genética, hematologia/hemoterapia e citopatologia, devem ser realizados sob responsabilidade de <b>médico registrado no CRM</b> de jurisdição.</li>
 <li>Art. 2º: resultados em forma de <b>pareceres ou laudos</b> emitidos por médicos, com registro no CRM; descritos de forma <b>minuciosa</b>.</li>
 <li>Art. 4º: laudos devem conter, quando indicado, a <b>descrição da técnica</b>.</li></ul>
 <h4>O que deve ter</h4>
 <p>Identificação do paciente · motivo da solicitação · médico solicitante · técnica utilizada · descrições detalhadas · possível diagnóstico e conclusões · data do exame · assinatura e registro médico · dados da instituição emitente.</p>
 <figure><img loading=lazy decoding=async data-img="m_laudo" alt="laudo"><figcaption><b>Laudo real (TC de tórax):</b> note <b>indicação</b> (PNM? derrame pleural?), <b>técnica</b> (cortes axiais de 1,0 mm, sem contraste), <b>achados</b> (descrição minuciosa), <b>conclusão</b> em tópicos e <b>assinatura com CRM</b>.</figcaption></figure>
 <div class="box extra"><b>■ EXTRA:</b> Ordem típica de um laudo de imagem: identificação → indicação → técnica → achados → conclusão → assinatura. A linguagem é <b>técnica</b>; na conclusão pode-se acrescentar termos não técnicos ao parecer.</div>`,
 qs:[
 {q:'Qual elemento caracteriza o laudo e o distingue de um atestado médico?',a:['Descrição técnica dos achados de um exame e conclusões','Justificativa de ausência no trabalho','Lista dos medicamentos de uso contínuo','Comprovação de comparecimento a consulta'],c:0,e:'O laudo descreve achados de exames e conclusões; o atestado comprova estado/ausência.'},
 {q:'Qual item foi destacado como necessário, “quando indicado”, no art. 4º da Res. 2.235/2019?',a:['Nome do plano de saúde','Descrição da técnica utilizada','Endereço residencial do paciente','Histórico familiar completo'],c:1,e:'Art. 4º: descrição da técnica utilizada, quando indicado.'},
 {q:'Em um laudo, onde pode constar linguagem não técnica?',a:['Em toda a descrição dos achados','No cabeçalho de identificação','Na conclusão, junto ao parecer médico','Nunca; o laudo é exclusivamente técnico'],c:2,e:'Os achados são técnicos; na conclusão, termos não técnicos podem ser adicionados ao parecer.'}]},
 {t:'Laudo psiquiátrico e comunicação do laudo',h:`
 <p>O <b>laudo psiquiátrico</b> é um relatório técnico com: <b>diagnósticos</b>; <b>avaliação do estado mental</b> (humor, cognição, risco de suicídio); <b>recomendações terapêuticas</b> (medicação, terapia, internação); e <b>aptidões legais</b> (capacidade laborativa, por exemplo).</p>
 <p>O laudo é ferramenta vital de comunicação entre médicos, enfermeiros e demais profissionais. Mas <mark class="f2" data-j="25">explicar os achados ao paciente</mark> também é dever: assegura compreensão, decisões informadas, vínculo e respeita autonomia e direito à informação.</p>
 <div class="box extra"><b>■ EXTRA:</b> Pegadinha: “laudo = controle interno / resumo de consultas / autorização de exames” são distratores. O laudo descreve resultados de exames, achados e conclusões.</div>`,
 qs:[
 {q:'Qual item NÃO é típico de um laudo psiquiátrico segundo a aula?',a:['Avaliação do estado mental','Aptidões legais, como capacidade laborativa','Recomendações terapêuticas','Descrição da técnica de ressonância utilizada'],c:3,e:'Técnica de imagem não é elemento do laudo psiquiátrico.'},
 {q:'Por que explicar o laudo ao paciente é conduta recomendada?',a:['Para substituir a consulta de retorno','Para respeitar autonomia e fortalecer o vínculo e a decisão informada','Para evitar o registro em prontuário','Para dispensar o médico solicitante'],c:1,e:'Autonomia, direito à informação, vínculo e participação informada.'},
 {q:'Quem pode assinar o laudo de um exame de radiologia?',a:['Qualquer profissional da clínica','O técnico que operou o equipamento','Médico registrado no CRM da jurisdição','O paciente, ao retirar o resultado'],c:2,e:'Resultados em forma de laudos emitidos por médicos, com registro no CRM da jurisdição.'}]}
 ],
 mais:{chave:'Laudo = descrição técnica de achados de exame + conclusão assinada por médico com CRM → base para hipótese diagnóstica, tratamento, perícia e comunicação entre profissionais.',
 tab:[['Conceito','Descreve resultados de exames, achados e conclusões'],['Res. 2.235/2019','Laudo por médico no CRM; técnica quando indicado'],['Linguagem','Técnica; conclusão pode ter termos não técnicos'],['Explicar ao paciente','Autonomia e direito à informação']],
 check:['Laudo ≠ atestado ≠ receita','9 elementos do laudo','Indicação → técnica → achados → conclusão → CRM','Laudo psiquiátrico: 4 blocos','Explicar o laudo ao paciente']}},
/* ---------- 6 PRESCRIÇÃO ---------- */
{id:'presc',n:'6',nome:'Prescrição médica',curto:'Prescrição',hue:20,
 obj:'Gênero prescrição · partes · tipos de receituário · erros · legislação · adesão, letramento em saúde e etapas da OMS',
 segs:[
 {t:'Partes da prescrição, tipos e erros',h:`
 <p>A prescrição <b>completa o ato médico</b>: é a decisão terapêutica após anamnese, exame clínico e reflexão. Seguir os princípios da relação médico-paciente transfere <b>segurança</b> e, logo, <b>aderência</b>.</p>
 <h4>Partes (Madruga, CRM-PB/CFM, 2011)</h4>
 <table class="tb"><tr><th>Parte</th><th>Conteúdo</th></tr>
 <tr><td><b>Cabeçalho</b></td><td>Dados da clínica/ambiente hospitalar e do médico; <b>uso obrigatório</b> (digital ou impresso)</td></tr>
 <tr><td><b>Superinscrição</b></td><td>Dados do paciente (+ modo de uso: “uso interno”, “uso externo”, “uso oral”)</td></tr>
 <tr><td><b>Inscrição</b></td><td>Nome do fármaco, <b>forma farmacêutica e concentração</b></td></tr>
 <tr><td><b>Subscrição</b></td><td>Quantidade total a ser fornecida (controlados: algarismos arábicos <b>e por extenso, entre parênteses</b>)</td></tr>
 <tr><td><b>Adscrição</b></td><td>Orientações do profissional ao paciente</td></tr>
 <tr><td>Fecho</td><td>Local, data, nome, <b>assinatura e CRM</b></td></tr></table>
 <p><b>Curiosidade do slide:</b> o símbolo <b>®</b> (marca registrada, na caixa do Neosaldina®) indica o <b>nome comercial</b> do produto, e <b>não o princípio ativo</b>.</p>
 <figure><img loading=lazy decoding=async data-img="m_presc" alt="receita real"><figcaption>Receituário externo real: observe via oral/nasal/ocular, forma e concentração, tempo de uso (“12 meses”, “90 dias”, “30 dias”) e adscrições longas. Treine o olhar: quantidade, abreviações, rasuras e informações extras.</figcaption></figure>
 <h4>Tipos de receituário</h4>
 <table class="tb"><tr><th>Tipo</th><th>Uso</th></tr>
 <tr><td><b>Simples</b></td><td>Medicamentos anódinos (paliativos) e de tarja vermelha sem retenção de via</td></tr>
 <tr><td><b>Controle especial</b></td><td>Retenção de uma via; substâncias de controle especial, retinoicas tópicas, imunossupressoras, antirretrovirais, antidepressivos…</td></tr>
 <tr><td><b>Receita amarela (A)</b></td><td>Papel especial numerado; entorpecentes (morfina, fentanila, metadona) e psicotrópicos controlados; adquirido com autorização da vigilância sanitária; validade <b>30 dias</b> (pode variar por estado)</td></tr>
 <tr><td><b>Receita azul (B)</b></td><td>Monitorar psicotrópicos, garantindo prescrição e uso corretos</td></tr></table>
 <h4>Principais erros</h4>
 <p>Letra ilegível · ausência de CRM · rasuras · ausência de validade quando necessário · <mark class="f3" data-j="24">omissão de dose ou de quantidade</mark> · horário errado · erros de escrita · códigos/abreviaturas que dificultam o entendimento.</p>
 <h4>Legislação</h4>
 <ul><li><b>CEM art. 11</b>: vedado receitar, atestar ou emitir laudos de forma secreta ou ilegível, sem CRM, ou assinar em branco.</li><li><b>Lei 5.991/73, art. 43</b>: receituário de controle especial não pode ter rasuras, emendas ou irregularidades.</li></ul>
 <h4>Substituição de medicamentos</h4>
 <p>O médico pode prescrever de referência ou autorizar genérico. Se for insubstituível, deve acrescentar “<mark class="f3" data-j="17">Não autorizo a substituição</mark>” (não há texto legal obrigatório). <b>Se nada disser, está autorizando a troca.</b> O médico <b>não é obrigado</b> a prescrever genérico.</p>
 <div class="box extra"><b>■ EXTRA:</b> Ao prescrever, tenha claro se está escrevendo o <b>nome comercial</b> (marca®) ou o <b>princípio ativo</b> — isso se liga à autorização (ou não) de substituição por genérico.</div>`,
 qs:[
 {q:'Uma prescrição traz “Amoxicilina 500mg, tomar 1 cp de 8 em 8 h por 7 dias”, mas não indica quantidade total. Qual parte está incompleta?',a:['Cabeçalho','Superinscrição','Subscrição','Fecho'],c:2,e:'Subscrição = quantidade total a ser fornecida.'},
 {q:'O médico quer que o medicamento de referência NÃO seja trocado por genérico. Para evitar a substituição, deve:',a:['Nada fazer; a troca exige receita azul','Acrescentar à receita, por exemplo, “Não autorizo a substituição”','Prescrever apenas pelo princípio ativo','Pedir que o paciente avise a farmácia'],c:1,e:'Sem manifestação, a substituição é tacitamente autorizada.'},
 {q:'Qual tipo de receituário é de papel especial numerado, com validade de 30 dias e destinado a entorpecentes como morfina, fentanila e metadona?',a:['Receita simples','Receita de controle especial branca','Receita azul (B)','Receita amarela (A)'],c:3,e:'Receita amarela (A).'}]},
 {t:'Adesão, letramento e etapas da OMS',h:`
 <p>Uma boa prescrição não é só “sem erros”: exige <b>olhar holístico</b>. Proporcionam adesão: <b>transparência</b>, <b>compreensão da receita</b> e <b>conhecimento da prescrição</b>. O médico esclarece dúvidas, fica disponível para efeitos adversos e considera <mark class="f3" data-j="13">condições sociais e cognitivas</mark> do paciente (ex.: analfabetismo → adesivos coloridos por horário).</p>
 <p>Segundo o professor Porto (2025): “diagnosticar é entender o corpo; cuidar é entender a alma; o paciente vem buscar alguém que o escute”.</p>
 <h4>Seis etapas da terapêutica efetiva (OMS — Guia da Boa Prescrição)</h4>
 <ol><li>Definição do problema</li><li>Especificação dos objetivos terapêuticos</li><li>Seleção do tratamento mais eficaz e seguro para o paciente específico</li><li>Prescrição</li><li><mark class="f3" data-j="12">Informação sobre a terapêutica ao paciente</mark></li><li>Monitoramento do tratamento</li></ol>
 <h4>Letramento em saúde — o que a prova repete</h4>
 <ul><li>Baixo letramento → dificuldade de compreensão → pior saúde individual/coletiva, mortalidade, custos (<mark class="f3" data-j="9">just. 9</mark>).</li><li>Materiais: <mark class="f3" data-j="14">linguagem simples e exemplos cotidianos, cartazes e vídeos</mark> (just. 14).</li><li>Estratégias: <mark class="f3" data-j="18">linguagem simples, autocuidado, recursos visuais, confirmar compreensão</mark> (just. 18).</li><li><mark class="f3" data-j="29">Reforçar a prescrição oralmente</mark> com linguagem simples e recursos visuais (just. 29).</li></ul>
 <p><b>Caso da aula:</b> Maria, 16 anos, cistite bacteriana (E. coli), ardor miccional, urgência, ingestão &lt; 800 ml/dia. Treine: cabeçalho, superinscrição, inscrição (antibiótico + concentração), subscrição, adscrição (como tomar, hidratação, retorno), local, data, assinatura e CRM.</p>
 <div class="box extra"><b>■ EXTRA:</b> Esse bloco é o <b>campeão de repetição</b> na Somativa 81: seis justificativas diferentes giram em torno de letramento/linguagem simples/adesão.</div>`,

{id:'sum',n:'7',nome:'Sumário de alta',curto:'Sumário de alta',hue:190,
 obj:'Características do sumário de alta · dados do documento · importância do preenchimento · Portaria 701/2022 e CEM',
 segs:[
 {t:'Finalidade, responsáveis e elementos-chave',h:`
 <p>O <b>sumário de alta</b> é uma narrativa clínica do prontuário: relatório resumido, que <b>deve</b> integrar o prontuário, elaborado pelo médico <b>no término da internação</b>. Deve ser <b>conciso, preciso e adequado</b> à comunicação entre profissionais, paciente e responsáveis. Pode reduzir <b>reinternações evitáveis</b>.</p>
 <p><b>Finalidade principal:</b> <mark class="f3" data-j="5">transição do cuidado</mark> após a internação, com continuidade da assistência e segurança do paciente (ABNT, 2014). Destina-se ao profissional que dará seguimento.</p>
 <table class="tb"><tr><th>Norma</th><th>Conteúdo</th></tr>
 <tr><td><b>CEM, cap. X, art. 87 §3º</b></td><td><mark class="f3" data-j="30">Cabe ao médico assistente ou seu substituto elaborar e entregar</mark> o sumário ao paciente ou representante legal. Responsáveis, em ordem hierárquica: chefe da equipe médica → direção clínica → direção técnica</td></tr>
 <tr><td><b>Portaria 701/2022</b></td><td>Institui o Modelo de Informação Sumário de Alta (SA): <b>adoção obrigatória</b> em todo o sistema de saúde (público, suplementar e privado)</td></tr></table>
 <p>O modelo busca garantir continuidade do cuidado, apoiar profissionais, informar o paciente como protagonista e qualificar a tomada de decisão.</p>
 <h4>Elementos-chave</h4>
 <p>Identificação do ambiente de saúde, título e data da alta · identificação do paciente · <b>caráter da internação</b> · diagnóstico · procedimentos · evolução e medicações · plano pós-alta · informações da alta (motivo) · seguimento de atendimento · <b>assinatura e CRM</b> do responsável. (Conforme a prova: <mark class="f3" data-j="26">identificação, resumo da internação, diagnóstico(s), plano terapêutico e orientações pós-alta</mark>.)</p>
 <figure><img loading=lazy decoding=async data-img="m_sum1" alt="sumário"><figcaption>Sumário real (cálculo renal): cabeçalho institucional, <b>data da alta</b>, <b>identificação</b>, prestador assistente, <b>caráter de internação</b>, convênio, <b>diagnóstico principal/inicial/de alta (N202)</b>, tratamento, <b>evolução</b> (ureterolitotripsia + duplo J), <b>conduta de alta</b> e orientações (repouso, hidratação, retorno com data).</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="m_sum2" alt="sumário p2"><figcaption>Página 2: continuação e assinatura.</figcaption></figure>
 <h4>Principais inadequações</h4>
 <ul><li>Dados insuficientes ou imprecisos para comunicação com a atenção primária;</li><li>Falta de resultados de exames e de medicamentos indicados na alta;</li><li>Legibilidade ruim e falta de assinatura com CRM;</li><li>Falta de aconselhamento no momento da alta.</li></ul>`,
 qs:[
 {q:'Quem tem responsabilidade primária por elaborar e entregar o sumário de alta?',a:['Direção administrativa do hospital','Médico assistente ou seu substituto','Enfermeiro-chefe do setor','O próprio paciente, ao solicitar a alta'],c:1,e:'CEM, art. 87 §3º.'},
 {q:'Em qual situação a Portaria 701/2022 se aplica?',a:['Apenas ao SUS','Apenas a hospitais privados','Apenas a hospitais universitários','Ao sistema de saúde em geral: público, suplementar e privado'],c:3,e:'O modelo SA é de adoção obrigatória no país, em todas as esferas.'},
 {q:'Qual dado NÃO é elemento-chave do sumário de alta?',a:['Caráter da internação','Plano pós-alta','Plano de carreira do médico assistente','Assinatura e CRM do responsável'],c:2,e:'Plano de carreira não tem relação com o documento.'}]}
 ],
 mais:{chave:'Internação termina → médico assistente produz sumário → profissional que recebe o paciente continua o cuidado com segurança → menos reinternações evitáveis.',
 tab:[['Finalidade','Transição/continuidade do cuidado'],['Quem elabora','Médico assistente (ou substituto)'],['Portaria 701/2022','Modelo SA obrigatório'],['Conteúdo obrigatório','Identificação, resumo, diagnóstico(s), plano, orientações'],['Não confundir','Atestado (afastamento), anamnese (início), atestado de óbito (pós-morte)']],
 check:['Finalidade: transição do cuidado','CEM art. 87 §3º','Portaria 701/2022','Elementos-chave','Inadequações: dados insuficientes, sem CRM, sem aconselhamento']}},

{id:'obito',n:'8',nome:'Atestado de óbito',curto:'Atestado de óbito',hue:350,
 obj:'Atestado × certidão · contexto de produção · 59 variáveis em 9 blocos · importância do preenchimento · preencher o Bloco V',
 segs:[
 {t:'Atestado × certidão, formulário e fluxo das vias',h:`
 <p><b>Atestado (declaração) de óbito:</b> emitido por <b>médico</b>; declara o fim da vida e as causas da morte; formulário com <b>59 campos</b>. <b>Certidão:</b> só obtida com o atestado, emitida pelo <b>cartório de registro civil</b>; necessária para a burocracia (contas bancárias, inventário, vínculo empregatício) e <b>sem ela não se realiza o sepultamento</b>. <mark class="f3" data-j="20">O atestado é médico; a certidão é civil.</mark></p>
 <p>O preenchimento é <b>ato médico</b>: o médico tem responsabilidade <b>ética e jurídica</b>. Documento padronizado pelo <b>SIM</b> (Sistema de Informação sobre Mortalidade), de uso <b>obrigatório</b> no território nacional, impresso com <b>numeração única</b>, em <b>três vias</b> autocopiativas: <b>branca, amarela e rosa</b>.</p>
 <h4>Como preencher</h4>
 <ul><li>Letra de forma, caneta esferográfica <b>azul ou preta</b> (preferência azul).</li><li><b>Sem emendas ou rasuras</b>; se ocorrerem, corrigir de forma legível à margem e <b>assinar próximo à ressalva</b> — <b>somente o médico atestante</b> (nunca outro médico ou profissional).</li><li>Evitar campos em branco: <b>“Ignorado”</b> quando não se conhece; <b>traço (–)</b> quando não se aplica ou é impossível obter.</li></ul>
 <h4>Fluxo das vias</h4>
 <figure><img loading=lazy decoding=async data-img="fluxo1" alt="fluxo 1"><figcaption><b>Ocorrência em estabelecimento de saúde:</b> 1ª branca → arquivada no estabelecimento até ser recolhida pela Secretaria de Saúde · 2ª amarela → familiar, para obter a certidão no cartório · 3ª rosa → arquivada no prontuário. (Fetal: DO obrigatória com gestação ≥ 20 semanas, peso ≥ 500 g e/ou estatura ≥ 25 cm.)</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="fluxo2" alt="fluxo 2"><figcaption><b>Ocorrência fora do estabelecimento, com assistência médica:</b> branca e rosa vão à Secretaria de Saúde; amarela vai ao familiar para o cartório.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="fluxo3" alt="fluxo 3"><figcaption><b>Causa externa em localidade com IML:</b> branca → IML até ser recolhida pela Secretaria · amarela → familiar/cartório · rosa → arquivada no laudo de necropsia.</figcaption></figure>
 <div class="box extra"><b>■ EXTRA:</b> Nos três fluxos a <b>via amarela sempre vai ao familiar</b>, para a certidão de óbito no cartório. É o ponto fixo — memorize-o e deduza o resto.</div>`,
 qs:[
 {q:'Qual das alternativas sobre as vias da declaração de óbito está correta?',a:['São quatro vias: branca, amarela, azul e rosa','São três vias: branca, amarela e rosa','São duas vias: branca e amarela','São três vias: branca, azul e rosa'],c:1,e:'Três vias autocopiativas: branca, amarela e rosa.'},
 {q:'O médico errou um dado e o corrigiu à margem. Quem pode assinar a ressalva?',a:['Apenas o médico atestante','Qualquer médico do plantão','O diretor técnico','O oficial do cartório'],c:0,e:'A ressalva é assinada somente pelo médico atestante.'},
 {q:'Qual a via da DO usada pela família para obter a certidão de óbito?',a:['Branca','Amarela','Rosa','Todas as três'],c:1,e:'A amarela vai ao representante/familiar e é usada junto ao cartório.'}]},
 {t:'Os 9 blocos e o Bloco V (causas da morte)',h:`
 <p>Versão atual (<b>2014</b>): <b>59 variáveis em 9 blocos</b>.</p>
 <table class="tb"><tr><th>Bloco</th><th>Conteúdo</th><th>Observação</th></tr>
 <tr><td><b>I</b> Identificação</td><td>Falecido</td><td>14 variáveis; usar documento com foto</td></tr>
 <tr><td><b>II</b> Residência</td><td>Dados da residência</td><td>5 variáveis</td></tr>
 <tr><td><b>III</b> Ocorrência</td><td>Local do óbito</td><td>7 variáveis</td></tr>
 <tr><td><b>IV</b> Fetal ou &lt; 1 ano</td><td>Só nesses casos</td><td>Senão, ir ao bloco V</td></tr>
 <tr><td><b>V</b> Condições e causas</td><td>Causas que provocaram o óbito</td><td>4 variáveis · <b>foco da aula</b></td></tr>
 <tr><td><b>VI</b> Médico</td><td>Quem preenche e assina</td><td>7 variáveis</td></tr>
 <tr><td><b>VII</b> Causas externas</td><td>Prováveis circunstâncias de morte não natural</td><td>5 variáveis; fins epidemiológicos; complementa o V</td></tr>
 <tr><td><b>VIII</b> Cartório</td><td>Dados do cartório e registro</td><td>5 variáveis; só o oficial do registro civil</td></tr>
 <tr><td><b>IX</b> Localidade sem médico</td><td>Duas testemunhas</td><td>Preenchido pelo cartório</td></tr></table>
 <p><b>Natural</b> (causa básica é doença/estado mórbido) → médico assistente preenche. <b>Externa</b> (lesão por violência: homicídio, suicídio, acidente ou morte suspeita, <i>qualquer que seja o tempo decorrido</i>) → <b>médico legista</b>.</p>
 <h4>Bloco V na prática</h4>
 <p>Parte I: linha <b>a</b> = causa <b>direta</b> (a que levou imediatamente à morte); linhas <b>b, c, d</b> = causas antecedentes (“devido a”); a <b>última linha preenchida da Parte I é a causa básica</b> — a que iniciou a cadeia. Parte II: condições que contribuíram, mas não entraram na cadeia.</p>
 <figure><img loading=lazy decoding=async data-img="bv1" alt="covid"><figcaption><b>Ex. 1 — queda com TCE em paciente com covid-19:</b> a) edema cerebral (1 dia) ← b) traumatismo cranioencefálico (2 dias) ← c) queda por escorregão em casa (2 dias). <b>Parte II: Covid-19 (10 dias).</b> Note: a queda é a causa básica da cadeia; a covid contribuiu, mas não causou a morte.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="bv2" alt="IAM"><figcaption><b>Ex. 2 — dor precordial, fibrilação ventricular:</b> a) fibrilação ventricular ← b) infarto agudo do miocárdio ← c) aterosclerose coronariana; Parte II: dislipidemia, hipertensão arterial, obesidade.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="bv3" alt="arma"><figcaption><b>Ex. 3 — projétil de arma de fogo:</b> a) choque hemorrágico agudo (~2 horas) ← b) perfuração cardíaca ← c) projétil de arma de fogo. É causa externa.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="bv4" alt="erro"><figcaption><b>Erro crasso:</b> declarar “parada cardiorrespiratória” como causa. Parada cardíaca/respiratória, PCR e falência múltipla de órgãos são <b>sintomas e modos de morrer</b> (CID-10, vol. II), não causas básicas. Aqui, ainda por cima, a causa básica foi omitida.</figcaption></figure>
 <figure><img loading=lazy decoding=async data-img="bloco7" alt="bloco VII"><figcaption>Bloco VII: tipo (acidente, suicídio, homicídio, outros), acidente de trabalho, fonte da informação, descrição sumária, tipo de local e endereço.</figcaption></figure>
 <div class="box extra"><b>■ EXTRA:</b> Gravidez ectópica rota (prova): a) choque hipovolêmico ← b) hemorragia interna ← c) gravidez ectópica rota.</div>`,
 qs:[
 {q:'Homem de 59 anos, hipertenso e obeso, infarto agudo do miocárdio por aterosclerose coronariana, evolui com fibrilação ventricular e morre. Qual a correta distribuição?',a:['a) aterosclerose ← b) IAM ← c) fibrilação ventricular','a) fibrilação ventricular ← b) IAM ← c) aterosclerose; Parte II: HAS, obesidade','a) parada cardiorrespiratória ← b) fibrilação ventricular','a) hipertensão arterial ← b) obesidade ← c) IAM'],c:1,e:'Linha a = causa direta; última linha da Parte I = causa básica. Fatores contribuintes na Parte II.'},
 {q:'Qual item é um “modo de morrer” que NÃO deve ser declarado como causa básica?',a:['Infarto agudo do miocárdio','Parada cardiorrespiratória','Choque hipovolêmico','Traumatismo cranioencefálico'],c:1,e:'PCR/PCR/falência múltipla de órgãos são modos de morrer.'},
 {q:'Em morte por causa externa (ex.: homicídio), qual bloco complementa o V, com fins epidemiológicos?',a:['Bloco II','Bloco VII','Bloco VIII','Bloco IX'],c:1,e:'O bloco VII (causas externas) complementa o bloco V.'}]}

const LEG=['Letra legível, CRM presente e meme liberado.','Dessa vez ninguém pode dizer que foi pegadinha.','Gabarito perfeito. O professor aprova (talvez).','Anotou, registrou e acertou tudo.','Sem rasura, sem abreviação, sem erro.'];

function ensureDeck(){const M=S.meme;if(!M.deck.length){const d=MEMES.map((_,i)=>i).sort(()=>Math.random()-.5);if(d[0]===M.last&&d.length>1){[d[0],d[1]]=[d[1],d[0]]}M.deck=d}}
function drawMeme(){ensureDeck();const i=S.meme.deck.shift();S.meme.last=i;save();return i}
let lastAnim=-1,lastTaunt=-1;
const ANIMS=[[{transform:'translateX(0)'},{transform:'translateX(-12px)'},{transform:'translateX(12px)'},{transform:'translateX(-8px)'},{transform:'translateX(0)'}],
 [{transform:'scale(1,1)'},{transform:'scale(1.18,.8)'},{transform:'scale(.88,1.15)'},{transform:'scale(1,1)'}],
 [{transform:'translateY(0)'},{transform:'translateY(-18px)'},{transform:'translateY(0)'}],
 [{transform:'rotate(0)'},{transform:'rotate(360deg)'}],
 [{transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},{transform:'rotate(-3deg)'},{transform:'rotate(0)'}],
 [{transform:'perspective(500px) rotateY(0)'},{transform:'perspective(500px) rotateY(180deg)'},{transform:'perspective(500px) rotateY(360deg)'}],
 [{transform:'scale(1)'},{transform:'scale(.84)'},{transform:'scale(1)'}]];
function memeSlot(el,gid,ids){
 if(!el)return;const sc=scoreOf(ids),c=sc[0],t=sc[1];const idx=S.meme.map[gid];const open=idx!=null;
 ensureDeck();const peek=MEMES[S.meme.deck[0]||0];
 let lab;if(open)lab='Meme liberado 🏆 · Clique para ver de novo';else if(t>c&&t>0)lab='Uma errada… zere a questão e tente de novo';else lab='Meme secreto · '+c+' de '+ids.length+' certas · acerte todas para revelar';
 el.innerHTML='<div class="mslot'+(open?' open':'')+'" role="button" tabindex="0" title="Meme secreto"><div class="sil">'+(open?MEMES[idx]():peek())+'</div><div class="lab">'+lab+'</div>'+(open?'':'<div class="hint">👀 Tem um meme aqui. Só aparece com gabarito perfeito.</div>')+'</div>';
 const s=$('.mslot',el);const act=()=>{if(open){memeModal(gid,ids.length);return}
  const red=matchMedia('(prefers-reduced-motion:reduce)').matches;let k;do{k=Math.floor(Math.random()*ANIMS.length)}while(k===lastAnim);lastAnim=k;
  s.animate(red?[{opacity:.5},{opacity:1}]:ANIMS[k],{duration:red?250:400+Math.random()*250,easing:'cubic-bezier(.23,1,.32,1)'});
  let q;do{q=Math.floor(Math.random()*TAUNT.length)}while(q===lastTaunt);lastTaunt=q;$$('.bubble',s).forEach(x=>x.remove());const bb=document.createElement('div');bb.className='bubble';bb.textContent=TAUNT[q];s.appendChild(bb);setTimeout(()=>bb.remove(),1800)};
 s.onclick=act;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}};
}
function memeModal(gid,n){
 if(S.meme.map[gid]==null){S.meme.map[gid]=drawMeme();save()}
 const idx=S.meme.map[gid];S.meme.shown[gid]=1;save();
 modal('<div class="crumb">'+n+' de '+n+' certas</div><h3>Gabarito perfeito</h3><div style="margin:12px 0">'+MEMES[idx]()+'</div><p style="color:var(--muted);font-size:13px;margin-top:6px">'+LEG[Math.floor(Math.random()*LEG.length)]+'</p>');

}

 if(t===ids.length&&c===ids.length&&S.meme.map[gid]==null){setTimeout(()=>memeModal(gid,ids.length),750)}}
/* ===== celebrações ===== */
const CQ=[];let cbusy=false,craf=0,cto=0,cesc=null;
const SHAPE={cons:'bub',anam:'ring',pront:'page',atest:'stamp',laudo:'page',presc:'cap',sum:'cross',obito:'ring'};
function celebrate(kind,title,sub,mid,p0,p1){CQ.push({kind,title,sub,mid,p0,p1});if(!cbusy)celNext()}
function celEnd(){cancelAnimationFrame(craf);clearTimeout(cto);if(cesc)document.removeEventListener('keydown',cesc);$('#cel').className='';$('#cel').onclick=null;setTimeout(celNext,120)}
function celNext(){const n=CQ.shift();if(!n){cbusy=false;return}cbusy=true;
 const el=$('#cel'),cv=$('canvas',el),c=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;const red=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const dur={seg:2600,mod:4200,lvl:5000}[n.kind];
 let h;
 if(n.kind==='lvl')h='<div class="num">Subiu de nível</div><h2>'+esc(n.title)+'</h2><div class="num" style="color:#fff">'+esc(n.sub)+'</div>';
 else h='<svg class="ck" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52l16 16 30-34"/></svg><h2>'+esc(n.title)+'</h2><div class="num">'+esc(n.sub)+'</div><div class="pb" style="--p0:'+n.p0+'%;--p1:'+n.p1+'%"><i></i></div>';
 $('.cc',el).innerHTML=h;el.className='on '+n.kind+(n.kind==='lvl'?' flash':'');
 const sh=n.kind==='lvl'?'let':(SHAPE[n.mid]||'ring');const N=red?0:(n.kind==='seg'?46:n.kind==='mod'?110:90);
 const P=[];for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:-Math.random()*H*.6,v:2+Math.random()*3.5,r:Math.random()*6,w:(Math.random()-.5)*.08,s:10+Math.random()*16,l:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i%26],rot:Math.random()*6});
 const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ef7a63';
 const rr=(x,y,w,hh,r)=>{c.beginPath();if(c.roundRect)c.roundRect(x,y,w,hh,r);else c.rect(x,y,w,hh)};
 const draw=p=>{c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle='#fff';c.strokeStyle=acc;c.lineWidth=2;const s=p.s;
  if(sh==='bub'){rr(-s,-s*.6,s*2,s*1.2,6);c.fill()}else if(sh==='ring'){c.beginPath();c.arc(0,0,s*.6,0,7);c.stroke()}
  else if(sh==='page'){c.fillRect(-s*.6,-s*.8,s*1.2,s*1.6);c.fillStyle=acc;c.fillRect(-s*.4,-s*.4,s*.8,2);c.fillRect(-s*.4,0,s*.8,2)}
  else if(sh==='stamp'){c.beginPath();c.arc(0,0,s*.7,0,7);c.stroke();c.fillStyle=acc;c.font='700 '+s*.5+'px Georgia';c.textAlign='center';c.fillText('CRM',0,s*.18)}
  else if(sh==='cap'){rr(-s,-s*.4,s,s*.8,s*.4);c.fill();c.fillStyle=acc;rr(0,-s*.4,s,s*.8,s*.4);c.fill()}
  else if(sh==='cross'){c.fillStyle=acc;c.fillRect(-s*.2,-s*.6,s*.4,s*1.2);c.fillRect(-s*.6,-s*.2,s*1.2,s*.4)}
  else{c.fillStyle=acc;c.font='700 '+s*1.6+'px Georgia';c.textAlign='center';c.fillText(p.l,0,0)}c.restore()};
 const t0=performance.now();const loop=()=>{c.clearRect(0,0,W,H);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y*.02+p.rot)*.8;p.r+=p.w;if(p.y>H+30){p.y=-20}draw(p)});if(performance.now()-t0<dur)craf=requestAnimationFrame(loop)};if(N)loop();
 cesc=e=>{if(e.key==='Escape')celEnd()};document.addEventListener('keydown',cesc);el.onclick=celEnd;cto=setTimeout(celEnd,dur);
}

 if(!paper||r.startContainer!==r.endContainer||r.startContainer.nodeType!==3||String(sel).trim().length<3){hb.classList.remove('on');return}

hb.onmousedown=e=>e.preventDefault();
hb.onclick=()=>{if(!pend)return;const sp=document.createElement('span');sp.className='pk';const id=Date.now()+''+Math.floor(Math.random()*999);sp.dataset.id=id;try{pend.r.surroundContents(sp)}catch(e){hb.classList.remove('on');return}

function bindPk(root){$$('.pk[data-id]',root).forEach(s=>s.onclick=e=>{e.stopPropagation();const id=s.dataset.id;S.hl=S.hl.filter(h=>h.id!==id);save();const par=s.parentNode;while(s.firstChild)par.insertBefore(s.firstChild,s);s.remove();par.normalize()})}
function applyHL(root){S.hl.forEach(h=>{const paper=$('.paper[data-k="'+h.k+'"]',root);if(!paper)return;const w=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(n.parentElement.closest('.pk'))continue;const i=n.data.indexOf(h.t);if(i<0)continue;const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+h.t.length);const sp=document.createElement('span');sp.className='pk';sp.dataset.id=h.id;try{r.surroundContents(sp)}catch(e){}break}});bindPk(root)}
