<script>
(function(){
  var LECTURE_KEY = "aula2";
  var progress = {};
  var chkByTarget = {};

  function navKeyOf(item){
    return item.dataset.target || item.dataset.view || null;
  }
  function initChecks(){
    // duas arquiteturas convivem neste projeto: a maioria usa <a class="nav-item" data-target="segN">;
    // a Aula 2 (Cardiopatia Isquêmica) usa <button class="navbtn" data-view="segN"> gerado por JS.
    var navItems = document.querySelectorAll('.nav-item[data-target], .navbtn[data-view]');
    navItems.forEach(function(item){
      var key = navKeyOf(item);
      if(!key || key === 'capa' || key === 'home') return;
      if(item.querySelector('.mc-chk')) return;
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'mc-chk';
      // Neutro de propósito: marcar uma seção é apenas progresso, não "concluído" — a cor
      // verde fica reservada só para o badge da aula inteira na sidebar do shell (100%).
      chk.style.marginRight = '6px';
      chk.style.accentColor = '#8A97A8';
      chk.style.filter = 'grayscale(1) opacity(.85)';
      chk.addEventListener('click', function(ev){ ev.stopPropagation(); });
      chk.addEventListener('change', function(){
        progress[key] = chk.checked;
        window.parent.postMessage({type:'setProgress', lecture:LECTURE_KEY, target:key, done:chk.checked}, '*');
      });
      item.prepend(chk);
      chkByTarget[key] = chk;
    });
  }

  function refLabel(parcial, q){
    if(q === '?') return 'Parcial ' + parcial + ' (tema geral)';
    if(String(q).indexOf('aberta') === 0) return 'Parcial ' + parcial + ' — Discursiva ' + q.replace('aberta','');
    return 'Parcial ' + parcial + ' — Questão ' + q;
  }

  var tooltipEl = null;
  function ensureTooltip(){
    if(tooltipEl) return tooltipEl;
    tooltipEl = document.createElement('div');
    tooltipEl.id = 'mc-tooltip';
    tooltipEl.style.cssText = 'position:fixed;z-index:99999;background:#0B1E38;color:#EAF1FA;border:1px solid #2A4468;'+
      'border-radius:8px;padding:10px 12px;font-family:"IBM Plex Sans",sans-serif;font-size:13px;max-width:280px;'+
      'box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;line-height:1.4';
    document.body.appendChild(tooltipEl);
    tooltipEl.addEventListener('mouseenter', function(){ clearTimeout(tooltipEl._hideTimer); });
    tooltipEl.addEventListener('mouseleave', function(){ hideTooltip(); });
    return tooltipEl;
  }
  function hideTooltip(){
    if(!tooltipEl) return;
    tooltipEl._hideTimer = setTimeout(function(){ tooltipEl.style.display='none'; }, 150);
  }
  function showTooltip(markEl){
    var tt = ensureTooltip();
    clearTimeout(tt._hideTimer);
    var refs = (markEl.dataset.refs||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    if(!refs.length) return;
    var html = '<div style="font-size:11px;color:#8FAACB;margin-bottom:6px;letter-spacing:.02em">Caiu em prova — clique para ir direto à questão</div>';
    refs.forEach(function(r){
      var parts = r.split(':'); var parcial=parts[0]; var q=parts[1];
      var label = refLabel(parcial, q);
      var clickable = q && q !== '?';
      html += '<span class="mc-chip" data-parcial="'+parcial+'" data-q="'+(q||'')+'" style="display:inline-block;margin:2px 4px 2px 0;'+
        'padding:4px 9px;border-radius:12px;background:#16355F;color:#EAF1FA;font-size:12px;'+
        (clickable? 'cursor:pointer' : 'cursor:default;opacity:.6') + ';border:1px solid #2A4468">'+label+'</span>';
    });
    tt.innerHTML = html;
    tt.querySelectorAll('.mc-chip').forEach(function(chip){
      if(chip.style.cursor !== 'pointer') return;
      chip.addEventListener('mouseenter', function(){ chip.style.background='#C8476B'; chip.style.borderColor='#C8476B'; });
      chip.addEventListener('mouseleave', function(){ chip.style.background='#16355F'; chip.style.borderColor='#2A4468'; });
      chip.addEventListener('click', function(){
        window.parent.postMessage({type:'jumpToSimulado', parcial:chip.dataset.parcial, q:chip.dataset.q}, '*');
      });
    });
    var rect = markEl.getBoundingClientRect();
    var left = Math.min(rect.left, window.innerWidth-300);
    var top = rect.bottom + 6;
    tt.style.left = left+'px';
    tt.style.top = top+'px';
    tt.style.display = 'block';
  }

  function initTooltips(){
    document.querySelectorAll('mark[data-refs]').forEach(function(m){
      if(m.dataset.ttBound) return;
      m.dataset.ttBound = '1';
      m.style.cursor = 'help';
      m.addEventListener('mouseenter', function(){ showTooltip(m); });
      m.addEventListener('mouseleave', hideTooltip);
    });
  }

  window.addEventListener('message', function(ev){
    if(!ev.data) return;
    if(ev.data.type === 'progressState' && ev.data.lecture === LECTURE_KEY){
      progress = ev.data.state || {};
      Object.keys(chkByTarget).forEach(function(id){ chkByTarget[id].checked = !!progress[id]; });
    }
  });

  function boot(){
    initChecks();
    initTooltips();
    window.parent.postMessage({type:'requestProgress', lecture:LECTURE_KEY}, '*');
  }
  if(document.readyState === 'complete' || document.readyState === 'interactive') boot();
  else document.addEventListener('DOMContentLoaded', boot);
  // fallback: alguns masterclass renderizam nav/conteúdo via JS próprio, possivelmente após
  // este script rodar — reaplica init algumas vezes nos primeiros segundos.
  [300,800,1500,3000].forEach(function(ms){ setTimeout(boot, ms); });
  // e também sempre que o usuário navega (conteúdo de segmentos que só é montado no DOM
  // quando o painel/segmento é aberto pela primeira vez, como na Aula 2)
  document.addEventListener('click', function(ev){
    if(ev.target.closest && (ev.target.closest('.nav-item') || ev.target.closest('.navbtn'))){
      setTimeout(boot, 80);
      setTimeout(boot, 300);
    }
  }, true);
})();
</script>

<script>(function(){
  // Ponte entre a aula (iframe) e a barra lateral do app. Não mexe no conteúdo nem na lógica de quiz.
  var P = window.parent;
  if (!P || P === window) return;
  var root = document.documentElement;
  root.classList.add('embedded');
  var parts = (window.name || '').split('|');
  var LEC = parts[1] || '';
  var progress = {};

  function setTheme(t){ root.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); }
  setTheme(parts[2] || 'dark');

  function navEls(){ return Array.prototype.slice.call(document.querySelectorAll('.nav-item[data-target], .navbtn[data-view]')); }
  function keyOf(e){ return e.getAttribute('data-target') || e.getAttribute('data-view'); }
  function labelOf(e){
    var n = e.querySelector('.navlabel, .nav-num + span');
    return (n ? n.textContent : e.textContent).replace(/\s+/g,' ').trim();
  }
  function activeKey(){
    var a = navEls().filter(function(e){ return e.classList.contains('active'); })[0];
    return a ? keyOf(a) : null;
  }

  // ----- botão "Concluir" no título de cada segmento -----
  function paintDone(btn, key){
    var on = !!progress[key];
    if (btn.classList.contains('on') !== on) btn.classList.toggle('on', on);   // só mexe no DOM se mudou (evita laço do observer)
    var lbl = btn.querySelector('.lbl'), txt = on ? 'Concluído' : 'Concluir';
    if (lbl.textContent !== txt) lbl.textContent = txt;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    var fin = document.querySelector('.cel-finish[data-key="' + key + '"]');
    if (fin) paintFin(fin, on, key);
  }

  // ----- botão grande no fim do segmento -----
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  function isSeg(key){ return /^(seg\d+|s\d+|parcial\d+)$/.test(key); }
  function paintFin(b, on, key){
    if (b.classList.contains('on') !== on) b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    var txt = on ? (isSeg(key) ? 'Segmento concluído' : 'Estudado') + ' · tocar para desfazer'
                 : (isSeg(key) ? 'Concluir segmento' : 'Marcar como estudado');
    var s = b.lastChild; if (s.textContent !== txt) s.textContent = txt;
  }
  function ensureFin(scope, key){
    if (!scope || !key || key === 'capa' || key === 'home') return;
    var foot = scope.querySelector('.navfoot, .segnav');
    if (!foot) return;
    var box = scope.querySelector('.cel-fin');
    if (box && box.getAttribute('data-key') === key && box.nextElementSibling === foot) return;
    if (box) box.remove();
    box = document.createElement('div'); box.className = 'cel-fin'; box.setAttribute('data-key', key);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'cel-finish'; b.setAttribute('data-key', key);
    b.innerHTML = CHECK + '<span></span>';
    b.addEventListener('click', function(){
      var top = document.querySelector('.done-t[data-key="' + key + '"]');
      if (top) top.click();
    });
    box.appendChild(b);
    foot.parentNode.insertBefore(box, foot);
    paintFin(b, !!progress[key], key);
  }
  function attachDone(title, key){
    if (!title || !key || key === 'capa' || key === 'home') return;
    var old = title.querySelector('.done-t');
    if (old && old.getAttribute('data-key') === key) { paintDone(old, key); return; }
    if (old) old.remove();
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'done-t'; b.setAttribute('data-key', key);
    b.innerHTML = '<span class="d"></span><span class="lbl">Concluir</span>';
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      progress[key] = !progress[key];
      paintDone(b, key);
      P.postMessage({type:'setProgress', lecture:LEC, target:key, done:!!progress[key]}, '*');
    });
    if (!title.classList.contains('has-done')) title.classList.add('has-done');
    title.appendChild(b);
    paintDone(b, key);
  }
  function decorate(){
    // aulas estáticas: um .pane por segmento
    document.querySelectorAll('.pane').forEach(function(p){
      if (p.hidden) return;
      attachDone(p.querySelector('.pane-title'), p.id);
      ensureFin(p, p.id);
    });
    // aula 2: conteúdo montado por JS
    var t = document.querySelector('h2.seg-title');
    if (t) { attachDone(t, activeKey()); ensureFin(document.getElementById('content'), activeKey()); }
  }

  // ----- rodapé anterior/próximo (substitui a barra de navegação escondida) -----
  function addNavFoot(){
    var items = navEls();
    if (!items.length || document.querySelector('.segnav')) return;
    items.forEach(function(it, i){
      var id = keyOf(it);
      var pane = document.getElementById(id);
      if (!pane || !pane.classList.contains('pane') || pane.querySelector('.navfoot')) return;
      var prev = items[i-1], next = items[i+1];
      var f = document.createElement('div'); f.className = 'navfoot';
      function mk(target, txt, isNext){
        var b = document.createElement('button'); b.type = 'button';
        b.textContent = isNext ? txt + ' →' : '← ' + txt;
        b.addEventListener('click', function(){ target.click(); });
        return b;
      }
      if (prev) f.appendChild(mk(prev, labelOf(prev), false));
      if (next) f.appendChild(mk(next, labelOf(next), true));
      pane.appendChild(f);
    });
  }

  // piscar o termo achado pela busca
  function flashTerm(rootEl, term){
    if (!rootEl || !term) return;
    var low = term.toLowerCase(), w = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) {
      var p = n.parentElement; if (!p || /^(SCRIPT|STYLE)$/.test(p.tagName)) continue;
      var k = n.data.toLowerCase().indexOf(low);
      if (k < 0) continue;
      var mid = n.splitText(k); mid.splitText(term.length);
      var sp = document.createElement('span'); sp.className = 'find-flash';
      mid.parentNode.insertBefore(sp, mid); sp.appendChild(mid);
      sp.scrollIntoView({block:'center'});
      setTimeout(function(){ var q = sp.parentNode; if (!q) return; while (sp.firstChild) q.insertBefore(sp.firstChild, sp); q.removeChild(sp); q.normalize(); }, 2600);
      return;
    }
  }

  var last = null;
  function reportActive(){
    var k = activeKey();
    if (k !== last) { last = k; P.postMessage({type:'segActive', lecture:LEC, key:k}, '*'); }
    var off = (k && k !== 'capa' && k !== 'home' && !document.querySelector('.hero .tabs')) ? 'off' : 'on';
    if (root.getAttribute('data-hero') !== off) root.setAttribute('data-hero', off);
    decorate();
  }
  var mo = new MutationObserver(function(){ clearTimeout(mo._t); mo._t = setTimeout(reportActive, 30); });
  mo.observe(document.body, {subtree:true, attributes:true, attributeFilter:['class','hidden']});
  var content = document.getElementById('content');
  if (content) mo.observe(content, {childList:true});

  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || !d.type) return;
    if (d.type === 'setTheme') setTheme(d.theme);
    else if (d.type === 'goto') {
      var el = navEls().filter(function(e){ return keyOf(e) === d.key; })[0];
      if (el) el.click();
    }
    else if (d.type === 'gotoPane') {
      if (document.getElementById('hl-pop')) return;   // aulas com marca-texto rosa tratam sozinhas
      var pe = navEls().filter(function(e){ return keyOf(e) === d.pane; })[0];
      if (pe) pe.click();
      setTimeout(function(){ flashTerm(document.getElementById(d.pane) || document.getElementById('content') || document.body, d.term); }, 140);
    }
    else if (d.type === 'progressState' && d.lecture === LEC) {
      progress = d.state || {};
      document.querySelectorAll('.done-t').forEach(function(b){ paintDone(b, b.getAttribute('data-key')); });
    }
  });

  function boot(){
    addNavFoot();
    reportActive();
    P.postMessage({type:'bridgeReady', lecture:LEC}, '*');
    P.postMessage({type:'requestProgress', lecture:LEC}, '*');
  }
  if (document.readyState === 'complete') setTimeout(boot, 0);
  else window.addEventListener('load', function(){ setTimeout(boot, 0); });
})();
</script>
