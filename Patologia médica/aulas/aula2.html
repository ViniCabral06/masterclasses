<!DOCTYPE html>
<html lang="pt-BR" data-tone="cv" data-theme="dark">
<head><!--vidro:cabeca--><script>document.documentElement.dataset.vidro="pato";document.documentElement.classList.add('vidro-aula','vidro-ready')</script><link rel="stylesheet" href="../../_tema/vidro.css"><script defer src="../../_tema/notas.js"></script><!--/vidro:cabeca-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardiopatia Isquêmica — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet"><style>/* ===== Visual "Farmacologia" aplicado às aulas de Patologia ===== */
:root{
  --ground:#ffffff; --surface:#f5f6f4; --surface-2:#eceeeb; --raised:#ffffff;
  --border:#e4e6e2; --rule:#eff0ed; --control:#d6d9d4;
  --ink:#1f201d; --ink-2:#3a3c37; --muted:#676964; --faint:#9a9c96;
  --accent:#1b6e66; --accent-ink:#0f4d47; --accent-soft:#e3f0ed;
  --tone:var(--accent);
  --ok:#2e7d32; --ok-bg:#e6f4e7; --ok-line:#b9dcbb;
  --bad:#b42318; --bad-bg:#fdecea; --bad-line:#f2c1bb;
  --warn:#b26a00; --warn-bg:#f8ecd2; --warn-ink:#7a5200;
  --on-ink:#fff;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121413; --surface:#1a1d1b; --surface-2:#242826; --raised:#1f2320;
  --border:#2c312e; --rule:#222624; --control:#3d4440;
  --ink:#e6e9e4; --ink-2:#c3c8c1; --muted:#9aa09a; --faint:#6f766f;
  --accent:#5fc4ae; --accent-ink:#93e0cd; --accent-soft:#17332d;
  --ok:#62c27a; --ok-bg:#15281a; --ok-line:#2b5233;
  --bad:#f07a6c; --bad-bg:#2d1714; --bad-line:#5c2b25;
  --warn-bg:#33290f; --warn-ink:#f0cf86;
  --on-ink:#121413;
}
/* cada grupo de aulas tem a sua cor, só no que orienta */
:root[data-tone="cv"]{--tone:#a3263a}
:root[data-tone="resp"]{--tone:#1f6f8b}
:root[data-tone="prova"]{--tone:#6b4c8a}
:root[data-tone="sim"]{--tone:#1b6e66}
:root[data-tone="gi"]{--tone:#2e7d4f}
:root[data-tone="acc"]{--tone:#9a5a00}
:root[data-theme="dark"][data-tone="cv"]{--tone:#ec8a98}
:root[data-theme="dark"][data-tone="resp"]{--tone:#7cc2dc}
:root[data-theme="dark"][data-tone="prova"]{--tone:#bca0d8}
:root[data-theme="dark"][data-tone="sim"]{--tone:#5fc4ae}
:root[data-theme="dark"][data-tone="gi"]{--tone:#6fbf8e}
:root[data-theme="dark"][data-tone="acc"]{--tone:#e0b06a}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--ground)!important;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit}
::selection{background:#cfe7e1}
:root[data-theme="dark"] ::selection{background:#2f5a51}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
*{scrollbar-width:thin;scrollbar-color:var(--control) transparent}

/* ---------- cabeçalho da aula (era "hero") ---------- */
.hero{background:transparent;color:var(--ink);padding:40px clamp(16px,5vw,72px) 0}
.hero-in{max-width:920px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:28px;border-bottom:1px solid var(--border);
  margin-bottom:32px}
.hero h1{order:1;font-family:var(--serif);font-size:clamp(34px,4.4vw,52px);line-height:1.02;margin:0;font-weight:400;
  letter-spacing:-.015em;color:var(--ink);max-width:none;text-wrap:balance}
.tag{order:2;display:block;align-self:flex-start;background:transparent;color:var(--tone);font-family:var(--sans);font-size:14px;
  font-weight:500;letter-spacing:0;padding:0;border-radius:0;margin:12px 0 0}
.hero p{order:3;margin:14px 0 0;color:var(--muted);font-family:var(--sans);font-size:14.5px;line-height:1.6;max-width:68ch}
.strip{order:4;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px;overflow:hidden;border-radius:0}
.strip img{width:100%;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--border);filter:none;opacity:.92}
:root[data-theme="dark"] .strip img{filter:brightness(.9)}
@media (max-width:700px){.strip{grid-template-columns:repeat(3,1fr)}.strip img:nth-child(n+4){display:none}}

/* ---------- layout (a navegação agora vive na barra lateral do app) ---------- */
.shell{display:block;max-width:none;margin:0;padding:0 clamp(16px,5vw,72px) 96px}
nav.rail{display:none}
main{display:block;max-width:920px;margin:0 auto;padding:0;background:transparent;border-radius:0;box-shadow:none}
.pane{display:block;animation:rise .35s var(--ease-out) both;scroll-margin-top:100vh}
/* o cabeçalho grande só aparece na capa da aula; nos segmentos o título do próprio segmento assume */
html[data-hero="off"] header.hero{display:none}
html[data-hero="off"] .shell{padding-top:40px}
.pane[hidden]{display:none}

.pane-title{position:relative;font-family:var(--serif);font-size:clamp(28px,3.4vw,40px);line-height:1.08;margin:0 0 28px;
  padding:0 0 22px;font-weight:400;letter-spacing:-.012em;color:var(--ink);border-bottom:1px solid var(--border);text-wrap:balance}
.pane-title.has-done{padding-right:150px}

/* ---------- leitura ---------- */
.prose,.intro{max-width:none}
.prose p,.intro p,.prose li,.intro li{font-size:17px;line-height:1.7;color:var(--ink)}
.prose p,.intro p{margin:0 0 18px;max-width:70ch}
.prose ul,.prose ol,.intro ul,.intro ol{padding-left:22px;margin:0 0 20px;max-width:70ch}
.prose li,.intro li{margin-bottom:8px}
.prose li::marker,.intro li::marker{color:var(--faint)}
.prose h2,.intro h2{font-family:var(--serif);font-size:clamp(28px,2.6vw,34px);line-height:1.12;margin:56px 0 16px;font-weight:400;
  color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.intro h2:first-child{margin-top:0}
.prose h3,.intro h3{font-family:var(--sans);font-size:18px;margin:32px 0 10px;color:var(--ink);font-weight:600;letter-spacing:-.005em}
.prose strong,.intro strong,.prose b,.intro b{font-weight:600;color:var(--ink)}
.prose hr,.intro hr{border:0;border-top:1px solid var(--border);margin:36px 0}
.prose em,.intro em{color:inherit}
table{width:100%;border-collapse:collapse;margin:16px 0 28px;font-size:15px;font-family:var(--sans)}
th{background:transparent;color:var(--muted);text-align:left;padding:10px 14px 10px 0;font-weight:500;font-size:13.5px;
  border-bottom:1px solid var(--control);vertical-align:bottom}
td{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55;text-align:left;
  font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
@media (max-width:700px){table{display:block;overflow-x:auto}}

.fig{margin:28px auto;max-width:100%;text-align:center}
.fig img{display:inline-block;max-width:100%;width:auto;max-height:560px;border-radius:12px;border:1px solid var(--border);background:#fff;
  cursor:zoom-in;transition:transform .2s var(--ease-out)}
:root[data-theme="dark"] .fig img{border-color:var(--border);filter:brightness(.94)}
.fig figcaption{font-family:var(--sans);font-size:14px;color:var(--muted);margin:12px auto 0;line-height:1.6;text-align:left;
  max-width:68ch;padding:0;border:0}

/* ---------- painéis (notas) ---------- */
.note{border-radius:18px;padding:18px 22px;margin:24px 0;font-size:16px;line-height:1.68;border:none;position:relative;
  background:var(--surface);color:var(--ink)}
.note p{margin:0;font-size:16px;line-height:1.68;max-width:none}
.note p + p{margin-top:10px}
.note-extra{background:#f2f2f8}.note-extra>p>strong:first-child{color:#4b4790}
.note-fix{background:#fbf0ea}.note-fix>p>strong:first-child{color:#9a4a1f}
.note-link{background:#edf3f8}.note-link>p>strong:first-child{color:#2d5f8f}
:root[data-theme="dark"] .note-extra{background:#1d1d2a}:root[data-theme="dark"] .note-extra>p>strong:first-child{color:#aaa6ea}
:root[data-theme="dark"] .note-fix{background:#2a1c15}:root[data-theme="dark"] .note-fix>p>strong:first-child{color:#ec9f73}
:root[data-theme="dark"] .note-link{background:#17212b}:root[data-theme="dark"] .note-link>p>strong:first-child{color:#8dbbe6}
.note + ol,.note + ul{margin-top:-6px}

/* ---------- grifos de frequência em prova ---------- */
mark.exam1,mark.exam2,mark.exam3,mark.exam4,mark.exam5,mark.hot{padding:1px 3px;border-radius:4px;cursor:help;color:inherit;font-weight:inherit;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.exam1{background:#d8f3e3}
mark.exam2{background:#fdf0bf}
mark.exam3,mark.hot{background:#fcd9a8}
mark.exam4{background:#f8bfb5}
mark.exam5{background:#1c2331;color:#ffe3a3}
mark.exam5 *{color:#ffe3a3}
:root[data-theme="dark"] mark.exam1,:root[data-theme="dark"] mark.exam2,:root[data-theme="dark"] mark.exam3,
:root[data-theme="dark"] mark.exam4,:root[data-theme="dark"] mark.hot,
:root[data-theme="dark"] mark.exam1 *,:root[data-theme="dark"] mark.exam2 *,:root[data-theme="dark"] mark.exam3 *,
:root[data-theme="dark"] mark.exam4 *,:root[data-theme="dark"] mark.hot *{color:#1b2230!important}
:root[data-theme="dark"] mark.exam5{box-shadow:inset 0 0 0 1px #4a5568}
.examcard{margin:24px 0;padding:18px 22px;border:none;background:#f8f3e1;border-radius:18px}
.examcard h4{margin:0 0 8px;font-size:14px;color:#765800;font-family:var(--sans);letter-spacing:0;font-weight:600}
.examcard p{font-size:15px!important;max-width:none!important}
:root[data-theme="dark"] .examcard{background:#26220f}:root[data-theme="dark"] .examcard h4{color:#e3c25c}
.exam-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:14px 0}
.exam-legend span{padding:3px 9px;border-radius:999px;font-weight:500}
:root[data-theme="dark"] .exam-legend span[style*="#111111"]{box-shadow:inset 0 0 0 1px #4a5568}
.q-source{display:inline-block;margin:0;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;letter-spacing:0;
  font-family:var(--sans);text-transform:none}
.q-source.real{background:var(--ok-bg);color:var(--ok)}
.q-source.adapted{background:var(--warn-bg);color:var(--warn-ink)}
.q-source.original{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- quiz ---------- */
.qzone{margin-top:72px;padding-top:0;border-top:none;max-width:none}
.qzone-title{font-family:var(--serif);font-size:clamp(28px,2.6vw,34px);line-height:1.12;margin:0 0 12px;font-weight:400;
  color:var(--ink);letter-spacing:-.01em}
.lede{font-family:var(--sans);font-size:14.5px;color:var(--muted);max-width:68ch;line-height:1.6;margin:0 0 24px}
.q{border:none;border-radius:22px;padding:22px 24px 20px;margin:0 0 16px;background:var(--surface)}
.q-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.q-head>.q-source{order:2;margin-top:3px}
.q-num{order:1;flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--on-ink);
  font-family:var(--sans);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;margin:0}
.q-stem{order:3;flex:1 0 100%;min-width:0}
.q-stem p{margin:0 0 12px;font-size:16.5px;line-height:1.65;color:var(--ink);max-width:none}
.q-stem .fig{margin:8px 0 16px}
.q-stem .fig img{max-height:420px}
.opts{display:flex;flex-direction:column;gap:0;margin:4px 0 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);background:var(--raised);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);font-size:15.5px;line-height:1.5;
  color:var(--ink);transition:border-color .15s ease,background-color .15s ease,transform .16s var(--ease-out)}
.opt:active{transform:scale(.995)}
.opt-letter{flex:none;width:26px;height:26px;min-width:26px;border-radius:50%;border:1px solid var(--control);font-weight:500;font-size:13px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.opt-text{flex:1;min-width:0;padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--raised);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .opt-letter{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.opt.is-correct{border-color:var(--ok-line);background:var(--ok-bg);box-shadow:none}
.opt.is-correct .opt-letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-wrong{border-color:var(--bad-line);background:var(--bad-bg);box-shadow:none}
.opt.is-wrong .opt-letter{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .opt.is-correct .opt-letter,:root[data-theme="dark"] .opt.is-wrong .opt-letter{color:#0d1110}
.q.done .opt{cursor:default}
.q.done .opt:active{transform:none}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:var(--control)}:root[data-theme="dark"] .opt:hover{border-color:#4a524d}}
.q-actions{display:flex;gap:8px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.btn-reveal,.btn-grade,.btn-reset{border:none;border-radius:999px;height:40px;padding:0 20px;font-family:var(--sans);font-weight:500;font-size:14.5px;
  cursor:pointer;background:var(--ink);color:var(--on-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background-color .15s ease,opacity .15s ease,transform .16s var(--ease-out)}
.btn-reveal:active,.btn-grade:active,.btn-reset:active{transform:scale(.97)}
.btn-reveal{background:var(--surface-2);color:var(--ink)}
.btn-reset{background:var(--surface-2);color:var(--ink)}
.btn-grade{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-grade{color:#0d1110}
.btn-reveal[hidden],.btn-grade[hidden],.btn-reset[hidden]{display:none}
.q-why{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:var(--surface-2);font-size:15px;line-height:1.6}
.q-why[hidden]{display:none}
.q-why p{margin:0 0 10px;font-size:15px;line-height:1.6;max-width:none}
.q-why p:last-child{margin:0}
.q-why:has(.q-verdict.ok){background:var(--ok-bg)}
.q-why:has(.q-verdict.no){background:var(--bad-bg)}
.q-verdict{font-family:var(--sans);font-weight:600}
.q-verdict.ok{color:var(--ok)}.q-verdict.no{color:var(--bad)}
.q-why hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.q-open textarea{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;
  background:var(--raised);color:var(--ink);resize:vertical;outline:none}
.q-open textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scorebar{position:sticky;top:12px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--border);border-radius:22px;padding:14px 20px;margin:22px 0 16px;font-family:var(--sans);font-size:15px}
#scoretext{flex:1 1 auto;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.closing{margin-top:56px;padding-top:24px;border-top:1px solid var(--border)}

/* ---------- ampliar imagem ---------- */
.lightbox{position:fixed;inset:0;background:rgba(18,20,18,.82);display:none;place-items:center;z-index:900;padding:30px;cursor:zoom-out}
.lightbox.open{display:grid}
.lightbox img{max-width:96vw;max-height:84vh;border-radius:12px;background:#fff}
.lightbox figcaption{color:#e6e9e4;font-family:var(--sans);font-size:14.5px;margin-top:14px;max-width:70ch;text-align:center;line-height:1.5}
.lb-close{position:absolute;top:18px;right:22px;background:rgba(255,255,255,.12);border:none;color:#fff;font-family:var(--sans);
  font-size:14px;font-weight:500;border-radius:999px;height:38px;padding:0 18px;cursor:pointer}

/* ---------- dica "caiu em prova" ---------- */
#mc-tooltip{background:#2b302d!important;color:#eef0ec!important;border:none!important;border-radius:12px!important;padding:12px 14px!important;
  font-family:var(--sans)!important;font-size:13px!important;line-height:1.5!important;box-shadow:0 12px 32px rgba(20,22,20,.28)!important}
#mc-tooltip div{color:#c3c8c1!important;font-size:12px!important;letter-spacing:0!important;font-weight:600}
#mc-tooltip .mc-chip{background:#3b413d!important;color:#eef0ec!important;border:none!important;border-radius:999px!important;padding:3px 10px!important;
  font-size:12px!important}
#mc-tooltip .mc-chip:hover{background:var(--accent)!important;color:#0d1110!important}

/* ---------- concluir (vem da barra lateral do app) ---------- */
.done-t{position:absolute;top:6px;right:0;display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13.5px;font-weight:500;
  color:var(--ink-2);height:38px;padding:0 16px 0 12px;border-radius:999px;cursor:pointer;background:var(--surface);border:none;user-select:none;
  letter-spacing:0;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.done-t:active{transform:scale(.97)}
.done-t .d{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--control);background:var(--raised);
  transition:background-color .2s ease,border-color .2s ease}
.done-t.on{color:var(--ok);background:var(--ok-bg)}
.done-t.on .d{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--ok-bg)}
@media (max-width:700px){.done-t{position:static;margin-top:14px}.pane-title.has-done{padding-right:0}}

@media (max-width:900px){
  .hero{padding:24px 16px 0}
  .shell{padding:0 16px 72px}
  .q{padding:18px 16px;border-radius:18px}
  .note{padding:16px 18px}
  .prose p,.intro p,.prose li,.intro li{font-size:16.5px}
  .prose h2,.intro h2{font-size:27px;margin-top:44px}
  .opts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media print{
  .hero,.scorebar,.q-actions,.strip,.done-t{display:none}
  body{background:#fff!important;color:#000}
  .pane[hidden],.q-why[hidden]{display:block!important}
  .q,.fig{break-inside:avoid}
}

/* ---------- anterior / próximo ---------- */
.navfoot{display:flex;justify-content:space-between;gap:12px;margin-top:64px;padding-top:24px;border-top:1px solid var(--border)}
.navfoot button{border:none;background:var(--surface);border-radius:16px;padding:14px 18px;font-family:var(--sans);font-size:14.5px;font-weight:500;cursor:pointer;
  color:var(--ink);max-width:48%;text-align:left;line-height:1.4;transition:background-color .15s ease,transform .16s var(--ease-out)}
.navfoot button:last-child{text-align:right;margin-left:auto}
.navfoot button:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.navfoot button:hover{background:var(--surface-2)}}

/* ---------- botão grande de concluir, no fim do segmento ---------- */
.cel-fin{display:flex;justify-content:center;margin:34px 0 8px}
.cel-finish{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;border:none;border-radius:999px;background:var(--accent);color:#fff;
  font:500 16px/1 var(--sans);cursor:pointer;transition:background-color .2s ease,color .2s ease,transform .16s var(--ease-out)}
:root[data-theme="dark"] .cel-finish{color:#0d1110}
.cel-finish:active{transform:scale(.97)}
.cel-finish svg{width:20px;height:20px}
.cel-finish svg circle{fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.cel-finish svg path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease-out)}
.cel-finish.on{background:var(--ok-bg);color:var(--ok)}
:root[data-theme="dark"] .cel-finish.on{color:var(--ok)}
.cel-finish.on svg path{stroke-dashoffset:0}

<script id="app-data" type="application/json">{"segments": [{"id": "s1", "num": 1, "title": "Isquemia miocárdica: o desequilíbrio entre oferta e demanda", "images": [], "content": "\n<p>Tudo em cardiopatia isquêmica começa de um jeito simples: o miocárdio precisa de oxigênio continuamente para manter a contração, e ele recebe esse oxigênio quase exclusivamente pelas artérias coronárias &mdash; não existe reserva de O2 armazenada no músculo cardíaco como existe glicogênio no fígado. Isquemia miocárdica é, por definição, qualquer situação em que a oferta de sangue oxigenado cai abaixo da demanda metabólica do músculo.</p>\n<p>Repare que isso é uma equação de dois lados: dá para ficar isquêmico tanto por reduzir a oferta (uma placa entupindo a coronária) quanto por aumentar a demanda muito além do que a oferta consegue acompanhar (um coração hipertrofiado que precisa de mais O2 por grama de tecido do que a rede capilar disponível consegue entregar).</p>\n\n<p>Em cerca de 90% dos casos, a causa da isquemia é a <strong><mark class=\"exam4\" data-refs=\"82:9,81:3\">obstrução do fluxo coronariano por aterosclerose</mark></strong> &mdash; é isso que chamamos de Doença Arterial Coronariana (DAC). É importante gravar que essa obstrução se desenvolve de forma lenta e progressiva, ao longo de décadas, e que os sintomas só aparecem quando a obstrução já é bastante significativa: <strong><mark class=\"exam2\" data-refs=\"82:?\">acima de 75%</mark></strong> para desencadear sintomas durante atividade física, e <strong><mark class=\"exam2\" data-refs=\"82:?\">acima de 90%</mark></strong> para causar sintomas em repouso.</p>\n\n<p>📌 <strong>EXTRA:</strong> essa diferença entre 75% e 90% cai muito em prova e faz todo sentido fisiológico se você pensar em termos de reserva de fluxo coronariano. Em repouso, a demanda de O2 é baixa, então mesmo uma luz bem reduzida ainda consegue, por enquanto, entregar o suficiente — só falha quando a obstrução é quase total (90%).</p>\n<p>Já durante o esforço a demanda dispara, e uma artéria com \"apenas\" 75% de obstrução já não consegue vasodilatar o suficiente para atender a essa demanda extra, gerando angina desencadeada por esforço. É exatamente por isso que a angina estável é, por definição, uma angina de esforço.</p>\n\n<h3>Epidemiologia</h3>\n<p>A cardiopatia isquêmica é a principal causa de morte em vários países, incluindo o Brasil, respondendo por cerca de <strong>7 milhões de mortes por ano</strong> no mundo. O perfil clássico é o de adultos do sexo masculino de meia idade, com pico de incidência por volta dos <strong>70 anos</strong>.</p>\n<p>Os fatores de risco se dividem em não modificáveis (predisposição genética) e modificáveis — tabagismo, ansiedade, estresse crônico, dieta e sedentarismo, além da chamada <strong>Síndrome Metabólica</strong> (dislipidemia + HAS + diabetes mellitus + obesidade, um combo que multiplica o risco cardiovascular). Vale destacar que houve um declínio real na incidência da doença nas últimas décadas, atribuído a ações preventivas e a melhorias no diagnóstico e no tratamento.</p>\n\n<h3>Patogênese: o desequilíbrio oferta x demanda em detalhe</h3>\n<p>Do lado da oferta (o que reduz o fluxo coronariano): aterosclerose, formação de trombo sobre a placa, vasoespasmo e ruptura da placa — vamos destrinchar cada um desses mecanismos no próximo segmento, porque eles se encadeiam entre si.</p>\n<p>Do lado da demanda (o que aumenta a necessidade de O2 do miocárdio): hipertrofia cardíaca e qualquer situação que aumente a frequência cardíaca. Aqui vale diferenciar sobrecarga aguda (atividade física, estresse emocional — eleva a demanda momentaneamente) de sobrecarga crônica (que leva à hipertrofia miocárdica como resposta adaptativa, mas que paga um preço: mais massa muscular pedindo mais O2, sem crescimento proporcional da rede de capilares que a irriga).</p>\n\n<p>A gravidade final da isquemia em cada paciente é multifatorial, dependendo de quatro variáveis que se combinam:</p>\n<ol>\n<li><strong>Velocidade de progressão, extensão e duração</strong> da obstrução coronariana — uma obstrução que se instala em segundos (trombo agudo) é muito mais perigosa que uma que se desenvolve ao longo de anos, mesmo que o grau final de obstrução seja parecido;</li>\n<li><strong>Estado do miocárdio</strong> — hipertrophy e sobrecarga funcional prévia deixam o músculo mais vulnerável;</li>\n<li><strong>Existência de circulação colateral</strong> — vasos colaterais surgem por neoangiogênese, geralmente em resposta a uma isquemia crônica de baixo grau, e por isso são mais comuns em idosos e em obstruções que evoluem lentamente (precisam de tempo para se formar). Uma boa circulação colateral pode \"salvar\" um território que, de outra forma, sofreria infarto extenso;</li>\n<li><strong>Condições circulatórias sistêmicas</strong> — pressão arterial e capacidade de transporte de O2 no sangue (por exemplo, um paciente anêmico tem menos capacidade de carrear O2 por volume de sangue, o que agrava qualquer grau de obstrução coronariana já existente).</li>\n</ol>\n", "questions": [{"vignette": "Homem, 68 anos, hipertenso de longa data, com hipertrofia ventricular esquerda documentada ao ecocardiograma, refere dor torácica típica desencadeada por esforços leves (subir um lance de escadas). O cateterismo mostra obstrução de 65% da artéria descendente anterior — um grau que, isoladamente, costuma ser assintomático mesmo aos esforços. Qual é a explicação mais provável para esse paciente ser sintomático com uma obstrução considerada moderada?", "options": ["A hipertrofia miocárdica aumenta a demanda de O2 do músculo sem crescimento proporcional da rede capilar, reduzindo a reserva de perfusão coronariana disponível", "Obstruções de 65% da luz arterial já ultrapassam o limiar angiográfico de significância hemodinâmica (70%), o que por si só explicaria os sintomas mesmo em esforços leves", "A hipertrofia ventricular esquerda reduz a demanda metabólica do miocárdio, o que deveria proteger o paciente e não o contrário", "A hipertrofia ventricular esquerda impede a formação de circulação colateral eficaz, o que explicaria a discordância entre o grau de obstrução angiográfica e a gravidade clínica do paciente", "A obstrução de 65% já ultrapassa o valor angiográfico usado para firmar diretamente o diagnóstico de infarto agudo, dispensando confirmação por troponina ou alterações eletrocardiográficas"], "correct": 0, "explanation": ["Correta: a massa muscular hipertrofiada consome mais O2 por batimento, mas a angiogênese capilar não acompanha esse crescimento na mesma proporção — isso reduz a reserva de fluxo coronariano e faz com que graus de obstrução que seriam toleráveis em um coração normal já causem isquemia sintomática em um coração hipertrofiado.", "Errada: o enunciado da aula fixa os limiares em >75% (esforço) e >90% (repouso), não 70% — 65% isoladamente não seria esperado gerar sintomas em um coração sem outros fatores agravantes.", "Errada: é o oposto — a hipertrofia aumenta a demanda metabólica, não reduz.", "Errada: hipertrofia não impede colateralização; o mecanismo central discutido na aula para esse tipo de caso é a desproporção entre demanda de O2 aumentada e rede capilar, não a colateralização.", "Errada: obstrução angiográfica não define infarto — infarto é definido por necrose (clínica + ECG + biomarcadores), não apenas pelo grau de estenose, qualquer que seja o percentual."], "source": "original"}, {"vignette": "Mulher, 74 anos, com diagnóstico de DAC estabelecido há 15 anos, obstrução crônica de 88% da artéria circunflexa identificada em exame de imagem, permanece relativamente assintomática mesmo durante esforços moderados. Qual mecanismo mais provavelmente explica essa tolerância inesperada a uma obstrução tão avançada?", "options": ["Desenvolvimento de circulação colateral, favorecido pelo caráter lento e progressivo da obstrução ao longo de muitos anos", "O envelhecimento reduz progressivamente a demanda metabólica basal do miocárdio a ponto de compensar quase totalmente uma obstrução de 88%", "Obstruções crônicas só costumam gerar isquemia sintomática quando ultrapassam 95% de estenose luminal, patamar ainda não atingido nesse caso", "A paciente provavelmente já sofreu um infarto silencioso prévio, que necrosou e eliminou o território de risco dependente da circunflexa antes da obstrução progredir até 88%", "O remodelamento vascular induzido pela hipertensão arterial crônica da paciente promove dilatação compensatória da luz da artéria circunflexa, atenuando o efeito da placa"], "correct": 0, "explanation": ["Correta: um dos quatro determinantes multifatoriais da gravidade da isquemia é justamente a existência de circulação colateral — que precisa de tempo para se formar por neoangiogênese e por isso é mais comum em obstruções lentas e progressivas, como no caso.", "Errada: a demanda metabólica não cai a esse ponto com a idade; ela pode estar reduzida por menor atividade física, mas isso não é o mecanismo central discutido para tolerância a obstruções crônicas graves.", "Errada: não existe esse patamar fixo de 95% citado na aula; obstruções crônicas podem, sim, gerar isquemia e infarto — o que muda é a chance de compensação por colaterais, não um limiar numérico distinto.", "Errada: é uma suposição não sustentada pelo enunciado, que não descreve nenhum evento clínico prévio nem alteração eletrocardiográfica compatível com necrose antiga.", "Errada: hipertensão não promove dilatação compensatória da luz arterial; pelo contrário, é fator de risco para progressão da aterosclerose."], "source": "original"}, {"vignette": "Homem, 45 anos, tabagista (20 cigarros/dia há 20 anos), sedentário, com IMC de 33, glicemia de jejum de 142 mg/dL em duas ocasiões e triglicerídeos de 280 mg/dL, procura a UBS para avaliação de risco cardiovascular. Qual combinação de achados caracteriza a Síndrome Metabólica, principal cluster de risco discutido na aula para cardiopatia isquêmica?", "options": ["Dislipidemia, hipertensão arterial sistêmica, diabetes mellitus e obesidade, associados entre si", "Tabagismo isolado, já que os demais achados (glicemia de jejum alterada e triglicerídeos elevados) representam apenas alterações laboratoriais transitórias sem valor diagnóstico", "Sedentarismo associado a IMC elevado, dispensando confirmação laboratorial de glicemia ou perfil lipídico para fechar o diagnóstico", "Obesidade central associada a triglicerídeos elevados, sem necessidade de avaliar pressão arterial ou glicemia para fechar o diagnóstico", "Predisposição genética somada à idade acima de 40 anos, independentemente dos achados metabólicos laboratoriais já apresentados pelo paciente"], "correct": 0, "explanation": ["Correta: a aula define a Síndrome Metabólica exatamente como a associação de dislipidemia, HAS, DM e obesidade — o paciente do caso já reúne evidências de dislipidemia (triglicerídeos altos), hiperglicemia sugestiva de DM e obesidade.", "Errada: tabagismo é fator de risco importante e independente, mas os achados de glicemia e triglicerídeos não são transitórios nem irrelevantes — eles compõem, junto de outros critérios, a própria Síndrome Metabólica.", "Errada: sedentarismo e obesidade são fatores de risco, mas a síndrome metabólica é definida por critérios metabólicos/laboratoriais combinados, e não dispensa essa confirmação.", "Errada: obesidade e dislipidemia isoladas não fecham o diagnóstico de síndrome metabólica; é preciso a combinação com os demais componentes, incluindo pressão arterial e glicemia.", "Errada: predisposição genética e idade são fatores de risco não modificáveis citados à parte, distintos da definição de síndrome metabólica, que depende dos achados metabólicos."], "source": "original"}]}, {"id": "s2", "num": 2, "title": "Da placa aterosclerótica à oclusão: aterosclerose, trombose e vasoespasmo", "images": [{"key": "evolucao-placa-ruptura-trombo.jpg", "caption": "Sequência esquemática da doença aterosclerótica coronariana. Da artéria normal (três camadas: íntima, média, adventícia) evolui-se para a obstrução coronariana fixa por placa aterosclerótica rica em lipídios (correlato clínico: angina típica/estável). Quando essa placa sofre ruptura, expõe material trombogênico e há agregação plaquetária. A partir daí, dois destinos são possíveis: um trombo mural, com obstrução variável e risco de êmbolos (correlato: angina instável ou IAM sem supra de ST), ou um trombo oclusivo, que fecha completamente a luz do vaso (correlato: IAM com supra de ST — infarto transmural)."}, {"key": "trombo-placa-ateromatosa-DA-hipertrofia.jpg", "caption": "À esquerda, corte transversal de uma coronária mostrando a luz quase obliterada por placa ateromatosa amarelada, com trombo vinhoso sobrejacente ocupando o que restou do lúmen. À direita, corte transversal do coração evidenciando hipertrofia concêntrica acentuada do ventrículo esquerdo — miocárdio muito espessado — com a seta apontando o óstio da artéria descendente anterior (DA). Note como, nesse coração hipertrofiado, a massa muscular aumentada eleva a demanda de O2 sem crescimento proporcional da rede capilar, tornando qualquer obstrução coronariana associada ainda mais perigosa."}, {"key": "histologia-trombo-mural-vs-oclusivo.jpg", "caption": "Cortes histológicos de coronárias trombosadas (coloração HE). Em A, trombo mural (parcial) — ainda existe luz residual pérvia, seta indicando o trombo aderido a uma parte da parede. Em B, trombo oclusivo — o trombo (mais denso, avermelhado) preenche totalmente a luz do vaso, sem qualquer canal residual. Essa diferença anatômica é exatamente o que separa, na prática clínica, uma síndrome coronariana sem supra de ST (trombo mural/suboclusivo) de uma com supra de ST (trombo oclusivo completo)."}], "content": "\n<p>Já vimos que 90% dos casos de cardiopatia isquêmica vêm da aterosclerose. Mas o processo raramente para na simples formação da placa — o que decide se um paciente vai ter angina estável (previsível, controlável) ou um infarto (evento agudo, potencialmente fatal) é a <strong>sequência de eventos que acontece sobre a placa</strong>, e essa sequência tem três atores principais: a própria aterosclerose, a trombose e o vasoespasmo.</p>\n<p>Eles não agem isoladamente — na prática, formam um ciclo vicioso que se retroalimenta.</p>\n\n<h3>Aterosclerose</h3>\n<p>É a causa mais comum (90%) de obstrução coronariana. Os locais mais afetados são a <strong><mark class=\"exam3\" data-refs=\"81:19\">região proximal da artéria descendente anterior (DA), da coronária direita (CD) e da circunflexa (CX)</mark></strong> — vale gravar essas três siglas porque elas vão reaparecer quando falarmos de territórios de infarto. Como já vimos, a obstrução precisa ser mais crítica (≥90%) para causar sintomas em repouso do que durante atividade (≥75%), porque a demanda em repouso é menor.</p>\n<img loading=lazy decoding=async src=\"{evolucao-placa-ruptura-trombo.jpg}\" class=\"fig\">\n\n<h3>Trombose: quando a placa se rompe</h3>\n<p>Quando o ateroma se rompe, ele expõe o endotélio lesado e substâncias teciduais pró-coagulantes que normalmente ficam \"escondidas\" sob uma capa fibrosa intacta. Essa exposição desencadeia agregação plaquetária, formando um trombo sobre a placa rota. É esse trombo — não a placa em si — que costuma ser o evento agudo final que precipita a síndrome coronariana aguda.</p>\n<img loading=lazy decoding=async src=\"{trombo-placa-ateromatosa-DA-hipertrofia.jpg}\" class=\"fig\">\n\n<h3>Vasoespasmo: o terceiro elemento do ciclo vicioso</h3>\n<p>O endotélio normal produz substâncias vasodilatadoras — óxido nítrico (NO) e prostaciclinas. Quando há lesão endotelial (como na ruptura da placa), esse equilíbrio se rompe: a agregação plaquetária libera <strong>tromboxano A2</strong>, um potente vasoconstritor.</p>\n<p>O resultado é redução adicional da luz do vaso por espasmo, o que, por sua vez, <strong>aumenta a chance de nova ruptura da placa ou de progressão da trombose</strong> — fechando um ciclo vicioso entre trombo e vasoespasmo que se autoalimenta (trombo → agregação plaquetária → TXA2 → vasoespasmo → maior chance de ruptura em outro ponto → nova agregação plaquetária → mais TXA2...).</p>\n<img loading=lazy decoding=async src=\"{histologia-trombo-mural-vs-oclusivo.jpg}\" class=\"fig\">\n\n<p>📌 <strong>EXTRA — por que isso importa clinicamente:</strong> essa distinção entre trombo mural (suboclusivo) e trombo oclusivo é exatamente a base fisiopatológica da classificação das síndromes coronarianas agudas em \"com supra de ST\" (oclusão completa, transmural) e \"sem supra de ST\" (suboclusão, subendocárdica) — conceito que vamos aprofundar nos próximos segmentos quando falarmos de angina instável, IAM e os padrões de lesão no ECG.</p>\n", "questions": [{"image": "histologia-trombo-mural-vs-oclusivo.jpg", "vignette": "Paciente admitido com dor torácica intensa e supradesnivelamento do segmento ST em todas as derivações precordiais ao ECG. A imagem acima mostra dois padrões histológicos possíveis de trombose coronariana (A e B). Qual padrão é o correlato anatomopatológico mais provável do quadro clínico desse paciente, e por quê?", "options": ["Padrão B, pois o trombo oclusivo fecha completamente a luz do vaso, produzindo isquemia transmural — o substrato do supradesnivelamento de ST", "Padrão A, pois o trombo mural progride rapidamente para oclusão completa na quase totalidade dos casos, produzindo supra de ST", "Nenhum dos dois, pois o supradesnivelamento de ST nesse contexto decorre de vasoespasmo associado, e não do padrão histológico da trombose observado na imagem", "Padrão A, porque trombos murais tendem a se formar sobre placas de maior volume, resultando em território isquêmico mais extenso do que o produzido pelo trombo oclusivo", "Padrão B, pois o tabagismo do paciente seria o fator determinante que converteria o trombo mural em oclusivo nesse contexto"], "correct": 0, "explanation": ["Correta: o trombo oclusivo (B) fecha totalmente a luz do vaso, interrompendo o fluxo para toda a espessura da parede (transmural) — esse padrão de isquemia transmural é o que se traduz no ECG como supradesnivelamento de ST.", "Errada: o trombo mural (A), por definição, mantém uma luz residual pérvia — a progressão rápida e quase universal para oclusão completa não é o que caracteriza esse padrão.", "Errada: no quadro descrito (supra difuso em todas as precordiais), o correlato mais provável é a oclusão trombótica completa (padrão B), não um vasoespasmo isolado sem relação com o trombo.", "Errada: não há essa relação — o que diferencia A de B é a completude da oclusão (e não o volume da placa subjacente), e é justamente a oclusão completa (B) que gera a maior extensão de isquemia transmural.", "Errada: tabagismo é fator de risco para doença coronariana em geral, mas não é citado como o mecanismo que converte um trombo mural em oclusivo — o que determina o padrão B é a trombose completa sobre a placa rota."], "source": "original"}, {"vignette": "Em um paciente com ruptura recente de placa aterosclerótica coronariana, a agregação plaquetária local libera tromboxano A2 (TXA2) na parede do vaso. Qual é o efeito fisiológico direto do TXA2 nesse contexto, e qual sua principal consequência clínica?", "options": ["Vasoconstrição, reduzindo ainda mais a luz do vaso e aumentando o risco de progressão da trombose ou de nova ruptura em outro ponto da placa", "Vasodilatação, funcionando como um mecanismo compensatório natural que protege contra a isquemia", "Inibição da agregação plaquetária, encerrando o processo trombótico espontaneamente", "Produção aumentada de óxido nítrico pelo endotélio lesado, normalizando o tônus vascular", "Nenhum efeito vascular relevante, atuando apenas como marcador laboratorial"], "correct": 0, "explanation": ["Correta: TXA2 é um potente vasoconstritor liberado pelas plaquetas ativadas; a vasoconstrição resultante reduz ainda mais a luz do vaso e alimenta o ciclo vicioso trombo-vasoespasmo, aumentando o risco de eventos isquêmicos adicionais.", "Errada: é o oposto — TXA2 é vasoconstritor, não vasodilatador (os vasodilatadores fisiológicos do endotélio normal são NO e prostaciclina, que ficam reduzidos justamente quando há lesão endotelial).", "Errada: TXA2 promove agregação plaquetária adicional, não a inibe.", "Errada: a lesão endotelial reduz, e não aumenta, a produção de NO.", "Errada: TXA2 tem efeito vascular direto e clinicamente relevante, não é apenas um marcador."], "source": "original"}, {"vignette": "Em relação à distribuição anatômica da aterosclerose coronariana discutida na aula, assinale a alternativa correta sobre os locais mais comumente acometidos.", "options": ["A região proximal das artérias descendente anterior (DA), coronária direita (CD) e circunflexa (CX) são os locais mais afetados", "A aterosclerose acomete preferencialmente a porção distal das artérias coronárias, poupando quase sempre os segmentos proximais", "Apenas a artéria circunflexa apresenta acometimento proximal relevante, enquanto a descendente anterior e a coronária direita costumam ser poupadas pela aterosclerose", "A aterosclerose coronariana acomete de forma igualmente provável os segmentos proximais e distais dos três grandes troncos epicárdicos, sem preferência anatômica", "Os vasos intramiocárdicos de pequeno calibre concentram a maior carga aterosclerótica, poupando relativamente os grandes troncos epicárdicos proximais"], "correct": 0, "explanation": ["Correta: a aula é explícita ao afirmar que os locais mais afetados são a região proximal de DA, CD e CX — informação relevante inclusive para prever qual território miocárdico está em risco.", "Errada: a tendência é justamente o oposto — a doença costuma ser mais proeminente nos segmentos proximais dos grandes vasos epicárdicos.", "Errada: as três artérias (DA, CD, CX) são citadas como preferencialmente acometidas em sua porção proximal, não apenas a circunflexa.", "Errada: existe, sim, um padrão preferencial de distribuição — a região proximal de DA, CD e CX — e não uma distribuição igualmente provável entre proximal e distal.", "Errada: é o oposto — a aterosclerose clinicamente relevante para o IAM ocorre nos grandes vasos epicárdicos proximais, não nos pequenos vasos intramiocárdicos."], "source": "original"}]}, {"id": "s3", "num": 3, "title": "Angina Pectoris: as três formas clínicas", "images": [], "content": "\n<p>Angina pectoris é o nome que damos a <strong>ataques paroxísticos e recorrentes</strong> de desconforto ou dor precordial — ela surge de forma súbita e \"vai e volta\" (paroxística).</p>\n<p>A isquemia responsável por essa dor é de <strong>curta duração, entre 15 segundos e 15 minutos</strong>, e esse é o ponto-chave que define angina como uma síndrome clínica <strong>insuficiente para provocar necrose</strong> do miocárdio. Assim que a isquemia ultrapassa aproximadamente 15-20 minutos de forma contínua, já não estamos mais falando de angina, e sim de um possível infarto em curso.</p>\n\n<p>📌 <strong>EXTRA:</strong> essa é uma das distinções mais cobradas em prova — angina, por definição, <mark class=\"exam3\" data-refs=\"78:17,81:9\">não eleva marcadores de necrose miocárdica (troponina, CK-MB)</mark>, porque não há morte celular. É justamente a dosagem de troponina que, na prática clínica, separa uma angina instável (troponina negativa) de um infarto sem supradesnivelamento de ST — os dois têm apresentação clínica e ECG muito parecidos, mas só o infarto tem necrose detectável.</p>\n\n<p>Existem três formas clínicas de angina, e cada uma tem um mecanismo fisiopatológico diferente por trás:</p>\n\n<h3>1 — Angina Estável (ou Típica)</h3>\n<p>É a forma mais comum. Ocorre quando há redução da perfusão coronariana a um nível crítico (obstrução fixa por placa, ao redor de 75% de obstrução ativa), de modo que a sintomatologia surge precisamente quando a demanda cardíaca aumenta — por exemplo, durante atividade física ou estresse físico/emocional.</p>\n<p>Costuma durar cerca de 5 a 10 minutos e, ponto importante, <strong><mark class=\"exam2\" data-refs=\"80:11,81:21\">melhora com repouso e com uso de vasodilatadores</mark></strong> (nitrato sublingual), porque ambos reduzem a demanda ou aumentam momentaneamente a oferta.</p>\n\n<h3>2 — Angina Instável (ou Crescente)</h3>\n<p>Aqui a dor já não depende de esforço — ocorre também a pequenos esforços ou mesmo em repouso, e tem duração mais prolongada (>10 minutos). Ela decorre da <strong><mark class=\"exam2\" data-refs=\"81:aberta1\">ruptura de placa com trombose parcial (trombo mural)</mark></strong> — lembra do segmento anterior? É exatamente o mesmo mecanismo que discutimos ali. É considerada grave, porém transitória, e o dado mais importante clinicamente: <strong><mark class=\"exam2\" data-refs=\"81:9\">geralmente antecede o infarto agudo do miocárdio</mark></strong>. Pode melhorar parcialmente com vasodilatador, mas de forma menos previsível que a angina estável — e por isso é considerada uma emergência que exige investigação e conduta imediatas.</p>\n\n<h3>3 — Angina de Prinzmetal (ou de Repouso)</h3>\n<p>É a forma menos comum e a mais \"diferente\" das três: ocorre no repouso, sem qualquer relação com esforço físico, e resulta de <strong><mark class=\"exam4\" data-refs=\"82:16,81:9,78:17\">espasmo coronariano</mark></strong> — sem relação direta obrigatória com a presença de ateroma (embora possa coexistir). Por ser puramente vasoespástica, responde rapidamente a vasodilatadores. É mais comum em pacientes mais jovens e está associada ao tabagismo.</p>\n", "questions": [{"vignette": "Homem, 58 anos, hipertenso, relata episódios recorrentes de dor precordial em aperto que surgem sempre ao subir dois lances de escada e cessam espontaneamente após cerca de 5 minutos de repouso. Nunca ocorreram em repouso. O uso de nitrato sublingual, quando testado, aliviou rapidamente a dor. Qual é o diagnóstico mais provável e o mecanismo fisiopatológico subjacente?", "options": ["Angina estável, por redução da perfusão coronariana a um nível crítico frente ao aumento da demanda desencadeado pelo esforço", "Angina instável, por ruptura de placa com trombose mural, já que houve alívio com nitrato", "Angina de Prinzmetal, por espasmo coronariano puro, dado o alívio rápido com vasodilatador", "Infarto agudo do miocárdio subendocárdico, pois a dor durou aproximadamente 5 minutos", "Trata-se de dor de origem musculoesquelética, não isquêmica, já que o alívio espontâneo em cerca de 5 minutos descartaria qualquer origem coronariana"], "correct": 0, "explanation": ["Correta: o padrão clássico de angina estável é exatamente esse — dor desencadeada de forma previsível pelo esforço (aumento de demanda), com duração de minutos, aliviada por repouso e por vasodilatador.", "Errada: angina instável se caracteriza por dor a pequenos esforços OU em repouso e duração mais prolongada (>10min); o alívio com nitrato, por si só, não define instabilidade — ocorre também na angina estável.", "Errada: Prinzmetal ocorre classicamente em repouso, sem relação com esforço — o padrão descrito é o oposto (desencadeado por esforço).", "Errada: infarto é definido por necrose miocárdica prolongada, com duração de isquemia >15-20min e biomarcadores positivos; uma dor de 5 minutos aliviada com repouso não configura infarto.", "Errada: a própria descrição (dor desencadeada por esforço, aliviada por repouso e nitrato) é o padrão clássico de isquemia miocárdica transitória — alívio rápido não descarta origem coronariana, é esperado na angina estável."], "source": "original"}, {"vignette": "Mulher, 63 anos, diabética, relata que a dor precordial que antes só surgia em grandes esforços agora aparece também ao realizar tarefas domésticas leves e, na última semana, chegou a acordá-la à noite, durando cerca de 20 minutos em um dos episódios. Procurou o pronto-socorro. Qual é a interpretação clínica mais adequada desse quadro e a conduta que ele justifica?", "options": ["Trata-se de um quadro de angina instável (padrão em crescendo), que exige avaliação de emergência pelo risco de progressão para infarto agudo do miocárdio", "Trata-se de angina estável em sua apresentação típica, podendo ser manejada apenas ambulatorialmente sem urgência", "Trata-se de angina de Prinzmetal, já que houve um episódio noturno, sem necessidade de investigação adicional", "Não há indicação de investigação cardiológica, pois a diabetes mellitus protege contra eventos coronarianos agudos", "O quadro é incompatível com origem cardíaca, pois a duração de 20 minutos excluiria qualquer etiologia isquêmica"], "correct": 0, "explanation": ["Correta: piora progressiva da angina (menor limiar de esforço, aparecimento em repouso, maior duração) é o padrão 'em crescendo' que define angina instável — condição que, como visto na aula, geralmente antecede o infarto agudo do miocárdio e exige avaliação de emergência.", "Errada: angina estável tem padrão previsível e estável ao longo do tempo; a piora progressiva descrita foge desse padrão.", "Errada: Prinzmetal não é definida por horário isolado, e sim por ausência de relação com esforço e mecanismo puramente vasoespástico; o caso mostra clara piora relacionada a esforços cada vez menores, sugerindo instabilização de placa, não vasoespasmo isolado.", "Errada: diabetes é fator de risco para doença coronariana (inclusive para isquemia silenciosa por neuropatia autonômica), não fator protetor.", "Errada: episódios de isquemia prolongados (próximos ou acima de 15-20min) são justamente o que preocupa quanto à progressão para infarto, e não algo que exclua causa cardíaca."], "source": "original"}, {"vignette": "Homem de 33 anos, usuário eventual de cocaína, apresenta episódios recorrentes de dor torácica em repouso, principalmente durante a madrugada. O eletrocardiograma realizado durante um episódio demonstra elevação transitória do segmento ST, que desaparece rapidamente após uso de nitrato sublingual. A cineangiocoronariografia revela artérias coronárias sem estenoses significativas. Qual é o melhor diagnóstico para o caso?", "options": ["Angina estável", "Angina instável", "Angina de Prinzmetal", "Infarto agudo do miocárdio", "Angina microvascular (síndrome X)"], "correct": 2, "explanation": ["Errada: a angina estável é desencadeada por esforço, com obstrução fixa à coronariografia — o oposto do caso.", "Errada: a angina instável decorre de ruptura de placa com trombo mural, e a coronariografia mostraria lesão obstrutiva.", "Correta: dor em repouso, de madrugada, com supra transitório de ST que reverte com nitrato e coronárias angiograficamente normais é o quadro clássico de angina de Prinzmetal (vasoespasmo coronariano), associada a uso de cocaína e tabagismo.", "Errada: no IAM a troponina estaria elevada e a alteração de ST não seria transitória/reversível com nitrato.", "Errada: a angina microvascular cursa com dor tipicamente desencadeada por esforço, sem o padrão de supra transitório em repouso."], "source": "real", "sourceLabel": "Parcial 82, Questão 16"}]}, {"id": "s4", "num": 4, "title": "Infarto Agudo do Miocárdio: conceito, diagnóstico e padrões anatômicos", "images": [{"key": "ecg-normal-vs-infarto.jpg", "caption": "Traçado eletrocardiográfico esquemático normal (esquerda) comparado ao traçado após um infarto (direita). Observe, à direita, o supradesnivelamento do segmento ST e o aparecimento de onda Q patológica — os dois achados eletrocardiográficos clássicos associados à necrose miocárdica transmural."}, {"key": "padroes-subendocardico-vs-transmural.jpg", "caption": "Diagrama comparando os dois padrões de infarto. No infarto subendocárdico, a necrose atinge apenas a região interna da parede ventricular — a mais distante da fonte de suprimento arterial (a artéria coronária corre pela superfície epicárdica), sendo por isso a região mais suscetível à isquemia. No infarto transmural, a necrose atinge toda a espessura da parede, da zona de perfusão (área em risco) até a área de infarto completo."}, {"key": "padroes-territorios-DA-CX-CD.jpg", "caption": "Territórios de infarto transmural conforme a artéria ocluída. A oclusão permanente do ramo descendente anterior esquerdo (DA, 40 a 55% dos casos) acomete a parede anterior do VE e a metade anterior do septo interventricular. A oclusão do ramo circunflexo esquerdo (CX, 10 a 20%) acomete a parede livre/lateral do VE. A oclusão da coronária direita (CD, 30%) acomete a parede posterior do VE e a metade posterior do septo interventricular — a CD também irriga o ventrículo direito, exceto sua parede anterior, que recebe irrigação da própria DA."}], "content": "\n<p>O infarto agudo do miocárdio (IAM) — o \"ataque cardíaco\" — é, por definição, uma <strong>área de necrose isquêmica do miocárdio</strong>, resultante de isquemia intensa e prolongada (lembre-se: ultrapassando aquele limite de 15-20 minutos que separava a angina do infarto). É um evento grave e potencialmente fatal, e sua sintomatologia é bastante variável, dependendo do tamanho da área acometida, da localização e das complicações associadas (que veremos em detalhe mais adiante).</p>\n\n<p>Um dado importante: cerca de <strong><mark class=\"exam1\" data-refs=\"82:?\">25% dos infartos são assintomáticos</mark></strong> (\"infarto silencioso\"). 📌 <strong>EXTRA:</strong> a principal explicação clássica para isso é a neuropatia autonômica, especialmente em pacientes diabéticos — a lesão das fibras nervosas aferentes que carregam a sensação dolorosa faz com que o paciente não sinta a dor típica, mesmo com necrose miocárdica em curso.</p>\n<p>É por isso que, em pacientes diabéticos com fatores de risco cardiovascular, um índice de suspeição elevado para síndrome coronariana aguda é essencial mesmo na ausência de dor torácica clássica.</p>\n\n<h3>Diagnóstico do IAM: a tríade clássica</h3>\n<p>O diagnóstico se apoia em três pilares que se complementam:</p>\n<ul>\n<li>Clínica: dor precordial em aperto/opressão/pontada, que pode irradiar para o membro superior esquerdo, região cervical esquerda ou abdome (essa irradiação abdominal se relaciona à face diafragmática do coração). Acompanha-se de palidez e mal-estar (por baixa perfusão sistêmica), dispneia e taquicardia (compensatória, mediada pelo sistema simpático).</li>\n<li>ECG: <mark class=\"exam4\" data-refs=\"82:13,78:aberta3\">supradesnivelamento do segmento ST e onda Q patológica são os achados clássicos de necrose transmural</mark>, entre outras alterações possíveis.</li>\n<li><strong>Alterações bioquímicas:</strong> marcadores de lesão miocárdica — troponina e CK-MB — que se elevam no sangue quando há necrose de miócitos e liberação de seu conteúdo intracelular.</li>\n</ul>\n<img loading=lazy decoding=async src=\"{ecg-normal-vs-infarto.jpg}\" class=\"fig\">\n\n<h3>Padrões anatômicos de infarto: subendocárdico x transmural</h3>\n<p>A parede ventricular pode ser dividida, para fins didáticos, em duas metades: a subendocárdica (interna) e a subepicárdica (externa). Como as artérias coronárias correm pela superfície epicárdica e mandam ramos perfurantes em direção ao endocárdio, <strong><mark class=\"exam3\" data-refs=\"79:12,80:11\">a região subendocárdica é a mais distante da fonte de suprimento sanguíneo</mark></strong>, e por isso é a mais suscetível ao infarto quando há redução do fluxo.</p>\n<img loading=lazy decoding=async src=\"{padroes-subendocardico-vs-transmural.jpg}\" class=\"fig\">\n\n<p>Essa diferença anatômica se traduz diretamente no ECG: na <strong>lesão subendocárdica</strong>, o traçado mostra <strong><mark class=\"exam3\" data-refs=\"80:11\">infradesnivelamento</mark></strong> do segmento ST; na lesão transmural (toda a espessura da parede), o traçado mostra <strong>supradesnivelamento</strong> do segmento ST. É essa correlação anatomo-eletrocardiográfica que sustenta, na prática clínica, a classificação das síndromes coronarianas agudas em \"com supra\" e \"sem supra\" de ST.</p>\n\n<h3>Territórios de infarto conforme a artéria acometida</h3>\n<p>Cada uma das três principais artérias coronárias irriga um território específico do ventrículo esquerdo, e conhecer essa correlação é essencial para prever quais complicações mecânicas e elétricas podem surgir a partir da localização do infarto.</p>\n<img loading=lazy decoding=async src=\"{padroes-territorios-DA-CX-CD.jpg}\" class=\"fig\">\n\n<p>📌 <strong>EXTRA — correlação com as derivações do ECG</strong> (não está explicitamente na aula, mas é extremamente cobrada em prova e complementa perfeitamente o conteúdo acima): infartos da parede anterior (território da DA) alteram classicamente as derivações precordiais V1-V4; infartos laterais (território da CX) alteram D1, aVL, V5-V6; e infartos inferiores (território da CD) alteram D2, D3 e aVF.</p>\n<p>Saber essa tríade território-artéria-derivação permite, só de olhar o ECG, inferir qual artéria provavelmente está ocluída.</p>\n", "questions": [{"image": "ecg-normal-vs-infarto.jpg", "vignette": "Paciente masculino, 60 anos, chega ao pronto-socorro com dor precordial iniciada há 40 minutos, irradiando para o membro superior esquerdo, associada a sudorese e taquicardia. O ECG realizado mostra o padrão ilustrado à direita na imagem acima, em comparação com o traçado normal à esquerda. Quais são os dois achados eletrocardiográficos mostrados na imagem que, em conjunto com o quadro clínico, sustentam fortemente o diagnóstico de infarto com necrose transmural?", "options": ["Supradesnivelamento do segmento ST e onda Q patológica", "Infradesnivelamento do segmento ST e onda T apiculada", "Prolongamento isolado do intervalo PR, sem qualquer alteração de ST", "Ausência completa de onda P, sugerindo fibrilação atrial associada", "Alargamento isolado do complexo QRS, sem qualquer alteração de ST-T"], "correct": 0, "explanation": ["Correta: a imagem mostra exatamente os dois achados clássicos do infarto com necrose transmural — supradesnivelamento do segmento ST e surgimento de onda Q patológica, achados citados explicitamente na aula como parte do diagnóstico de IAM.", "Errada: infradesnivelamento do ST é o padrão de lesão subendocárdica (não transmural), e onda T apiculada não é o achado destacado na imagem.", "Errada: a imagem não evidencia alteração de intervalo PR, e a questão pede justamente os achados de ST/onda Q que estão presentes no traçado.", "Errada: a imagem mostra ondas P preservadas em ambos os traçados — o achado central é a alteração de ST e o aparecimento da onda Q, não uma arritmia atrial.", "Errada: o achado central ilustrado é a alteração do segmento ST e a onda Q, não uma alteração isolada de QRS sem relação com ST-T."], "source": "original"}, {"vignette": "Mulher, 75 anos, tabagista, hipertensa há 30 anos, acordou de madrugada com intensa dor precordial, associada a falta de ar, diaforese, palidez e sensação de ansiedade. O eletrocardiograma revelou alterações sugestivas de isquemia miocárdica, incluindo supradesnivelamento do segmento ST em derivações correspondentes à parede posterosseptal do ventrículo esquerdo, apenas. Considerando o caso descrito e o padrão mais comum de irrigação miocárdica, é correto afirmar que seria observada obstrução na artéria:", "options": ["Circunflexa", "Coronária direita", "Coronária esquerda (tronco)", "Descendente anterior", "Artéria pulmonar"], "correct": 1, "explanation": ["Errada: a circunflexa (CX) irriga classicamente a parede lateral/livre do VE, não a posterosseptal.", "Correta: a coronária direita (CD) é a que mais comumente irriga a parede posterior do VE e a metade posterior do septo interventricular — padrão de dominância direita, o mais frequente na população.", "Errada: 'coronária esquerda' isolada não é uma resposta anatômica específica de território nesse contexto.", "Errada: a descendente anterior (DA) irriga a parede anterior do VE e a metade anterior do septo — não a posterosseptal.", "Errada: a artéria pulmonar não participa da irrigação do miocárdio ventricular esquerdo."], "source": "real", "sourceLabel": "Parcial 82, Questão 13"}, {"vignette": "Mulher, 71 anos, diabética de longa data com neuropatia periférica documentada, é internada por insuficiência cardíaca descompensada. Durante a investigação, um ECG de rotina revela onda Q patológica em parede inferior, sem qualquer relato prévio de dor torácica por parte da paciente. Qual é a explicação fisiopatológica mais provável para esse achado incidental de infarto sem história de dor?", "options": ["Neuropatia autonômica associada ao diabetes, que compromete as fibras aferentes responsáveis pela sensação dolorosa, resultando em infarto silencioso", "A paciente certamente está mentindo sobre a ausência de sintomas prévios", "Ondas Q patológicas em parede inferior costumam refletir apenas sobrecarga ventricular direita crônica, sem indicar necrose miocárdica prévia", "Diabetes mellitus é fator protetor contra infarto do miocárdio, o que torna o achado inexplicável", "A ausência de dor torna esse achado eletrocardiográfico incompatível com infarto prévio, sugerindo mais provavelmente um artefato técnico no traçado"], "correct": 0, "explanation": ["Correta: como discutido na aula, cerca de 25% dos infartos são assintomáticos, e a neuropatia diabética (incluindo a autonômica, que compromete fibras aferentes cardíacas) é a explicação clássica para infartos silenciosos em pacientes diabéticos.", "Errada: não há elementos no caso que sustentem essa suposição; o infarto silencioso é uma entidade clínica real e bem documentada.", "Errada: onda Q patológica é um achado eletrocardiográfico consistente com necrose miocárdica prévia (infarto transmural antigo), não um sinal isolado de sobrecarga ventricular direita.", "Errada: diabetes é fator de risco para doença coronariana, não fator protetor.", "Errada: é exatamente o oposto do que a aula ensina — a ausência de dor não exclui necrose nem sugere artefato; o infarto silencioso é definido justamente pela ausência de sintomas apesar da necrose estabelecida."], "source": "original"}]}, {"id": "s5", "num": 5, "title": "Resposta do miocárdio à isquemia e morfologia temporal do infarto", "images": [{"key": "morfologia-ate-1dia-bandas-contracao.jpg", "caption": "Morfologia do infarto até 1 dia de evolução (12-24h). Necrose por coagulação: fibras hipereosinofílicas (mais rosadas que o normal), bandas de hipercontração (setas) e cariólise (perda progressiva dos núcleos celulares). Ainda não há infiltrado inflamatório significativo neste estágio inicial — este é o clássico infarto 'branco/pálido' à macroscopia."}, {"key": "morfologia-2a6dias-infiltrado-neutrofilico.jpg", "caption": "Morfologia do infarto entre 2 e 6 dias de evolução. Observe a intensa infiltração por neutrófilos entre as fibras necróticas (que já perderam seus núcleos). Macroscopicamente, essa é a fase da área amarelada, friável, com bordas hiperemiadas — reflexo tanto da perda de estrutura tecidual quanto do influxo inflamatório agudo. Esta é também a janela de maior risco para ruptura mecânica do miocárdio, como veremos no segmento sobre complicações."}, {"key": "morfologia-1a2semanas-tecido-granulacao.jpg", "caption": "Morfologia do infarto entre 7 e 14 dias de evolução. Já se observa tecido de granulação — proliferação fibrovascular jovem, com neoformação de pequenos vasos (neovasos) e infiltrado inflamatório associado, começando a substituir o tecido necrótico. Macroscopicamente, a área se torna deprimida e castanho-acinzentada."}, {"key": "morfologia-mais4a6semanas-fibrose.jpg", "caption": "Morfologia do infarto com mais de 4 a 6 semanas de evolução. O tecido de granulação amadurece e é substituído por fibrose — colágeno denso ocupando a área antes ocupada pelos miócitos necróticos, com cardiomiócitos hipertróficos remanescentes nas bordas adjacentes. Macroscopicamente, a área se apresenta esbranquiçada — é a cicatriz definitiva do infarto."}], "content": "\n<p>Uma coisa que costuma confundir muita gente é achar que, assim que a coronária entope, o miocárdio já \"morre visivelmente\". Na verdade, existe uma sequência temporal bem definida entre isquemia, morte celular, e o momento em que essas alterações finalmente se tornam visíveis ao microscópio e, depois, a olho nu.</p>\n<p>Entender essa linha do tempo é essencial tanto para datar infartos em necropsia (pergunta clássica de prova prática) quanto para entender por que a reperfusão precoce salva miocárdio.</p>\n\n<h3>A resposta funcional precede a resposta morfológica</h3>\n<p>A sequência é a seguinte: a <strong><mark class=\"exam1\" data-refs=\"82:?\">contratilidade se perde cerca de 2 minutos após o início da isquemia</mark></strong> — um mecanismo, na verdade, adaptativo: ao parar de contrair, o miocárdio reduz sua própria demanda de O2, tentando \"economizar\" energia enquanto a oferta está comprometida.</p>\n<p>Se a isquemia persistir, o dano celular se torna <strong><mark class=\"exam2\" data-refs=\"79:12\">irreversível entre 20 e 40 minutos</mark></strong> — esse é o ponto de não retorno, quando a lesão reversível se torna morte celular definitiva. A necrose resultante é do tipo coagulação: inicialmente, a arquitetura e os contornos gerais do tecido são preservados (dá para reconhecer que aquilo já foi músculo cardíaco), mesmo com as células já mortas por dentro.</p>\n\n<p>📌 <strong>EXTRA — por que isso importa na prática forense/clínica:</strong> como a alteração morfológica (o que se vê ao microscópio ou macroscopicamente) sempre surge depois da morte celular real, um paciente que morre subitamente poucas horas após o início da dor torácica pode ter, à necropsia convencional com HE, um coração de aparência quase normal — mesmo já tendo sofrido infarto irreversível.</p>\n<p>Nesses casos, técnicas histoquímicas especiais (como a coloração com cloreto de trifeniltetrazólio, TTC) conseguem revelar a área infartada antes que as alterações fiquem visíveis pela histologia de rotina, porque dependem de enzimas que já estão inativas no tecido morto mesmo sem alteração estrutural visível ainda.</p>\n\n<h3>A linha do tempo morfológica do infarto</h3>\n<p>Vamos percorrer, estágio por estágio, o que se vê macro e microscopicamente — essa tabela é provavelmente a parte mais cobrada em prova prática de toda a aula:</p>\n\n<table class=\"tbl\">\n<tr><th>Tempo decorrido</th><th>Achados macroscópicos</th><th>Achados microscópicos</th></tr>\n<tr><td>4 a 12 horas</td><td>Ainda sem alteração visível</td><td><mark class=\"exam5\" data-refs=\"82:14,78:17,81:aberta1\">Necrose em bandas de contração</mark>; células começam a perder o núcleo</td></tr>\n<tr><td>12h a 1 dia</td><td>Área pálida, demarcada (infarto \"branco\")</td><td>+ hipereosinofilia das fibras</td></tr>\n<tr><td>2 a 6 dias</td><td>Área amarelada; friável; bordas hiperemiadas</td><td>Células sem núcleo; <mark class=\"exam5\" data-refs=\"82:14,81:aberta1,78:17\">infiltração intensa de neutrófilos</mark></td></tr>\n<tr><td>7 a 14 dias</td><td>Área deprimida, castanho-acinzentada</td><td><mark class=\"exam5\" data-refs=\"80:13,78:17,80:aberta2\">Tecido de granulação</mark> (proliferação fibrovascular jovem com neovascularização)</td></tr>\n<tr><td>Mais de 4 a 6 semanas</td><td>Área branca (cicatriz)</td><td><mark class=\"exam5\" data-refs=\"80:aberta2,78:17,80:13\">Fibrose</mark></td></tr>\n</table>\n\n<img loading=lazy decoding=async src=\"{morfologia-ate-1dia-bandas-contracao.jpg}\" class=\"fig\">\n<img loading=lazy decoding=async src=\"{morfologia-2a6dias-infiltrado-neutrofilico.jpg}\" class=\"fig\">\n<img loading=lazy decoding=async src=\"{morfologia-1a2semanas-tecido-granulacao.jpg}\" class=\"fig\">\n<img loading=lazy decoding=async src=\"{morfologia-mais4a6semanas-fibrose.jpg}\" class=\"fig\">\n\n<p>📌 <strong>EXTRA — correlação clínica com a fase de maior fragilidade:</strong> repare que a janela de 2 a 6 dias é justamente a fase em que o tecido perdeu sua arquitetura normal (necrose com infiltrado neutrofílico), mas ainda não teve tempo de começar a ser reparado por fibrose — é o miocárdio mecanicamente mais frágil de toda a evolução do infarto.</p>\n<p>Não é coincidência que seja exatamente nessa janela que as complicações mecânicas mais temidas (ruptura de parede livre, ruptura de septo, ruptura de músculo papilar) são mais prováveis, como veremos adiante.</p>\n\n\n<p>📌 <strong>EXTRA — atenção a esta pegadinha de prova:</strong> a necrose em bandas de contração da tabela acima aparece mesmo sem reperfusão, mas é <strong>muito mais intensa e extensa quando há reperfusão precoce</strong> de uma área já isquêmica (angioplastia, trombolítico) — o cálcio que reentra maciçamente nas células reperfundidas, ainda viáveis mas já lesadas, provoca hipercontração irreversível dos sarcômeros.</p>\n<p>Por isso, num caso de prova em que o paciente foi reperfundido (angioplastia/trombolítico) e evolui a óbito horas depois, o achado histológico esperado na necropsia é justamente a <strong>necrose em bandas de contração</strong> — guarde essa associação: <mark class=\"exam4\" data-refs=\"82:14,78:17,81:aberta1\">reperfusão recente + óbito precoce = bandas de contração</mark>. Veja o Segmento 6 para entender o mecanismo completo da lesão de reperfusão.</p>", "questions": [{"image": "morfologia-2a6dias-infiltrado-neutrofilico.jpg", "vignette": "Em uma necropsia, o patologista encontra, na parede do ventrículo esquerdo, uma área de necrose amarelada e friável, com bordas nitidamente hiperemiadas. Ao exame microscópico, como o ilustrado acima, observa-se infiltração intensa de neutrófilos entre fibras miocárdicas que já perderam seus núcleos. Com base nesses achados, qual é o tempo de evolução mais provável do infarto?", "options": ["2 a 6 dias", "Menos de 12 horas", "7 a 14 dias", "Mais de 6 semanas", "Entre 20 e 40 minutos"], "correct": 0, "explanation": ["Correta: área amarelada, friável, com bordas hiperemiadas macroscopicamente, associada a infiltrado neutrofílico intenso e perda de núcleos à microscopia, é exatamente o padrão descrito na aula para a janela de 2 a 6 dias de evolução.", "Errada: nas primeiras 12 horas ainda não há alteração macroscópica visível, e a coloração amarelada/friável com infiltrado neutrofílico intenso ainda não estaria presente.", "Errada: entre 7 e 14 dias, o achado esperado é tecido de granulação (proliferação fibrovascular), não infiltrado neutrofílico predominante com fibras ainda necróticas sem substituição.", "Errada: após 4-6 semanas, a área já é branca, fibrótica — não amarelada e friável.", "Errada: 20-40 minutos é a janela em que o dano celular se torna irreversível a nível funcional/bioquímico, mas é tempo demais curto para qualquer achado morfológico visível, seja macro ou microscopicamente."], "source": "original"}, {"vignette": "Comparando dois cortes histológicos de infarto do miocárdio, o patologista observa, no primeiro, proliferação fibrovascular jovem com neoformação de pequenos vasos e infiltrado inflamatório associado; no segundo, colágeno denso substituindo completamente as fibras necróticas, com hipertrofia de cardiomiócitos adjacentes. Qual é a sequência correta de evolução temporal entre esses dois achados?", "options": ["Tecido de granulação (7-14 dias) precede a fibrose madura/cicatriz (mais de 4-6 semanas)", "A colagenização densa característica da fibrose madura já se inicia nos primeiros dias do infarto, ocorrendo em paralelo à formação do tecido de granulação, sem relação de precedência entre os dois achados", "Os dois achados podem coexistir na mesma peça quando o infarto tem extensão heterogênea, refletindo apenas variação espacial da lesão, sem relação de sequência temporal entre eles", "Tecido de granulação já pode ser identificado nas primeiras 12 horas de evolução do infarto, antes mesmo da fase de infiltração neutrofílica intensa", "Fibrose madura corresponde a uma fase intermediária e reversível do reparo, que pode retroceder para tecido de granulação em infartos submetidos a reperfusão tardia"], "correct": 0, "explanation": ["Correta: a sequência de reparo tecidual segue exatamente essa ordem — tecido de granulação (fibrovascular, jovem, entre 7 e 14 dias) amadurece progressivamente até se tornar fibrose/cicatriz definitiva (após 4-6 semanas), com colágeno denso substituindo o tecido necrótico.", "Errada: a fibrose madura, com colágeno denso, é o estágio final do reparo (após 4-6 semanas) e não se inicia nos primeiros dias — ela sucede, e não antecede ou acompanha em paralelo, o tecido de granulação.", "Errada: mesmo quando há heterogeneidade espacial em infartos extensos, o tecido de granulação e a fibrose madura continuam representando estágios sequenciais e distintos de um mesmo processo de reparo, não eventos sem relação temporal.", "Errada: nas primeiras 12 horas ainda não há sequer alteração morfológica clara, muito menos tecido de granulação, que surge bem mais tarde (7-14 dias), após a fase de infiltração neutrofílica.", "Errada: a fibrose é o estágio final e definitivo da cicatrização do infarto — não há regressão para tecido de granulação, independentemente do momento da reperfusão."], "source": "original"}, {"vignette": "Mulher, 75 anos, tabagista, hipertensa há 30 anos, com IAM confirmado por ECG (supradesnivelamento de ST) e elevação de marcadores. Foi submetida à angioplastia e encaminhada à UTI; cerca de 9 horas após a internação, evoluiu com arritmia e, apesar das manobras de reanimação, foi constatado óbito. Considerando a temporalidade do evento, quais aspectos microscópicos são esperados na área acometida do coração?", "options": ["Fibrose cicatricial", "Tecido de granulação", "Necrose em bandas de contração", "Infiltrado neutrofílico com fagocitose das fibras necróticas", "Ausência de qualquer alteração microscópica, mesmo com TTC"], "correct": 2, "explanation": ["Errada: fibrose cicatricial é achado tardio, de mais de 4 a 6 semanas de evolução — muito além das poucas horas do caso.", "Errada: tecido de granulação surge entre 7 e 14 dias, não em poucas horas.", "Correta: nas primeiras 24 horas (e sobretudo quando há reperfusão, como no caso — paciente foi angioplastado), o achado histológico esperado é a necrose em bandas de contração, decorrente da hipercontração dos sarcômeros por sobrecarga de cálcio nas células reperfundidas ainda viáveis, porém já lesadas.", "Errada: o infiltrado neutrofílico intenso é típico da janela de 2 a 6 dias, não de poucas horas.", "Errada: mesmo sem alteração visível à HE de rotina em óbitos muito precoces, técnicas como o TTC conseguem revelar a área infartada."], "source": "real", "sourceLabel": "Parcial 82, Questão 14"}]}, {"id": "s6", "num": 6, "title": "Reperfusão miocárdica: miocárdio atordoado e lesão de reperfusão", "images": [{"key": "diagrama-reperfusao-tempo-salvamento.jpg", "caption": "Efeito do tempo de reperfusão sobre a extensão do dano miocárdico após oclusão aguda de uma artéria coronária. Com reperfusão muito precoce (<20 minutos), há salvamento quase completo da área em risco. Com reperfusão intermediária (2-4h), há salvamento apenas parcial — um núcleo central já necrosado (vermelho/roxo) persiste, cercado por tecido viável, porém com disfunção pós-isquemia (miocárdio atordoado, em amarelo). Com oclusão permanente, toda a área em risco evolui para necrose consolidada (azul escuro)."}, {"key": "reperfusao-tardia-infarto-hemorragico.jpg", "caption": "Peças cardíacas de infarto reperfundido tardiamente, após a necrose já estar estabelecida. Note as áreas hemorrágicas (vermelho-vivo/arroxeado) dentro da zona infartada — esse aspecto hemorrágico é a marca macroscópica da lesão de reperfusão, resultante da entrada de sangue sob pressão em um tecido cuja microcirculação já estava lesada e incapaz de conter as hemácias dentro dos vasos."}, {"key": "histologia-lesao-reperfusao-hemorragica.jpg", "caption": "Corte histológico correspondente à lesão de reperfusão: extravasamento de hemácias (áreas avermelhadas/alaranjadas) entremeadas às fibras miocárdicas necróticas, confirmando o caráter hemorrágico do infarto reperfundido tardiamente."}], "content": "\n<p>O objetivo central do tratamento do IAM é claro: <strong>impedir ou reduzir os danos ao miocárdio</strong>. As três estratégias principais para isso — trombolíticos, angioplastia coronariana com implante de stent, e cirurgia (revascularização miocárdica) — têm todas o mesmo objetivo fisiológico comum: promover a reperfusão, ou seja, restabelecer o fluxo sanguíneo pela artéria ocluída o mais rápido possível.</p>\n\n<p>Só que aqui entra uma pergunta que costuma surpreender quem está vendo isso pela primeira vez: <strong><mark class=\"exam2\" data-refs=\"82:?\">a reperfusão é sempre benéfica? Não.</mark></strong> Isso parece contraintuitivo — reabrir uma artéria entupida deveria ser sempre bom, certo? A resposta depende inteiramente do tempo decorrido entre a oclusão e a reperfusão.</p>\n\n<h3>A corrida contra o tempo: da região subendocárdica à transmural</h3>\n<p>A progressão da necrose segue uma \"onda\" que se espalha do subendocárdio em direção ao epicárdio (lembra por que a região subendocárdica é a mais vulnerável, do segmento anterior?). Os marcos temporais são: aos <strong>30-40 minutos</strong> de oclusão, já há infarto estabelecido na região subendocárdica; por volta de <strong>3 horas</strong>, o infarto já avançou até a metade interna da parede. Quanto mais cedo a reperfusão acontecer dentro dessa janela, maior a quantidade de miocárdio salvo.</p>\n<img loading=lazy decoding=async src=\"{diagrama-reperfusao-tempo-salvamento.jpg}\" class=\"fig\">\n\n<h3>Miocárdio atordoado (stunned myocardium)</h3>\n<p>Quando a reperfusão acontece em tempo hábil para impedir a necrose (mas não instantaneamente), o miocárdio salvo ainda assim <strong>demora a retornar ao seu estado bioquímico e funcional normal</strong> — mesmo estando viável, ele fica temporariamente \"atordoado\", contraindo mal por um período (horas a dias) antes de se recuperar completamente. Isso se traduz clinicamente em disfunção ventricular transitória pós-isquemia prolongada, mesmo após reperfusão bem-sucedida.</p>\n\n<p>📌 <strong>EXTRA — um diferencial muito cobrado em prova:</strong> não confunda miocárdio atordoado com <strong>miocárdio hibernante</strong>. O atordoado é uma disfunção pós-isquêmica AGUDA e transitória, que se resolve espontaneamente em dias, mesmo com o fluxo já normalizado.</p>\n<p>Já o hibernante é uma adaptação CRÔNICA a um fluxo cronicamente reduzido (mas não ausente) — o miócito reduz deliberadamente sua função contrátil como estratégia de sobrevivência a longo prazo diante de isquemia persistente, e essa disfunção só se resolve quando (e se) a artéria for revascularizada.</p>\n\n<h3>Lesão de reperfusão: quando reabrir tarde demais faz mal</h3>\n<p>Quando a reperfusão ocorre <strong>depois que a necrose já se estabeleceu</strong>, o resultado paradoxal é que <mark class=\"exam3\" data-refs=\"82:?\">ela <strong>torna o infarto hemorrágico</strong></mark>. O mecanismo: ao reabrir o vaso, o sangue volta a fluir sob pressão através de uma microcirculação que já está estruturalmente lesada pela necrose — incapaz de conter as hemácias dentro dos vasos, elas extravasam para dentro do tecido necrótico já estabelecido, produzindo um infarto hemorrágico.</p>\n<img loading=lazy decoding=async src=\"{reperfusao-tardia-infarto-hemorragico.jpg}\" class=\"fig\">\n<img loading=lazy decoding=async src=\"{histologia-lesao-reperfusao-hemorragica.jpg}\" class=\"fig\">\n\n<p>📌 <strong>EXTRA — mecanismos moleculares da lesão de reperfusão</strong> (complemento de alto rendimento): além do componente hemorrágico mecânico, a reperfusão tardia desencadeia o chamado \"paradoxo da reperfusão\" — a reintrodução abrupta de oxigênio gera uma explosão de espécies reativas de oxigênio (estresse oxidativo), há sobrecarga intracelular de cálcio nos miócitos já lesados, e ocorre um influxo adicional de neutrófilos que amplifica a lesão inflamatória local.</p>\n<p>Todos esses mecanismos contribuem para que a reperfusão tardia possa, paradoxalmente, aum
