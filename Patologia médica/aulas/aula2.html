entar (e não apenas deixar de reduzir) a extensão final do dano tecidual.</p>\n", "questions": [{"vignette": "Paciente com IAM com supradesnivelamento de ST, com dor torácica iniciada há cerca de 2-3 horas, é rapidamente encaminhado para angioplastia primária, ainda dentro da fase de necrose subendocárdica/intramural (antes da progressão para necrose transmural completa). Em relação ao possível benefício dessa reperfusão precoce, assinale a alternativa correta.", "options": ["Uma reperfusão realizada nesse momento pode salvar a metade interna (subendocárdica) do miocárdio em risco, limitando a extensão final do infarto", "A reperfusão nesse momento tem efeito equivalente sobre a extensão final da necrose, seja realizada ainda nas primeiras horas ou apenas após dias de evolução", "A reperfusão só é benéfica se realizada após a necrose transmural já estar completamente estabelecida", "Nesse estágio ainda subendocárdico, a reperfusão precoce tende a converter a necrose em hemorrágica, mesmo sendo realizada dentro das primeiras horas do quadro", "A reperfusão nesse estágio resgata preferencialmente a musculatura subepicárdica já necrosada, sem impacto sobre a faixa subendocárdica ainda viável"], "correct": 0, "explanation": ["Correta: quanto mais precoce a reperfusão dentro da janela de progressão da necrose (que avança do subendocárdio para o epicárdio), maior a quantidade de miocárdio salvo — nesse estágio, é possível resgatar a metade interna da parede que ainda não necrosou.", "Errada: o tempo de reperfusão é justamente a variável central que determina a extensão final do dano — reperfundir nas primeiras horas (como no caso) salva muito mais miocárdio do que reperfundir tardiamente.", "Errada: reperfusão após necrose transmural estabelecida tende a ser deletéria (infarto hemorrágico), não benéfica.", "Errada: o risco de infarto hemorrágico está associado à reperfusão tardia, após necrose transmural já estabelecida — reperfundir precocemente, como no caso, é benéfico, não deletério.", "Errada: é o oposto — a necrose progride do subendocárdio para o epicárdio, e é justamente a faixa subendocárdica ainda viável (não a subepicárdica já necrosada) que pode ser resgatada pela reperfusão precoce."], "source": "adapted", "sourceLabel": "Parcial 80, Questão 12"}, {"vignette": "Paciente com IAM tratado por angioplastia primária dentro da janela recomendada apresenta, nas primeiras 48 horas após o procedimento, disfunção contrátil segmentar significativa em território correspondente à artéria tratada, apesar de o vaso estar angiograficamente pérvio e sem evidência de nova oclusão. A função contrátil se normaliza espontaneamente nos dias seguintes. Qual conceito discutido na aula melhor explica esse quadro transitório?", "options": ["Miocárdio atordoado — disfunção contrátil pós-isquêmica transitória em tecido que foi salvo da necrose, mas que ainda demora a retornar ao seu estado bioquímico e funcional normal", "Miocárdio hibernante — adaptação crônica a um fluxo cronicamente reduzido, que persistiria indefinidamente até nova revascularização", "Novo infarto agudo do miocárdio, já que houve disfunção contrátil documentada", "Rejeição do stent implantado durante o procedimento de angioplastia", "Pericardite constritiva pós-procedimento"], "correct": 0, "explanation": ["Correta: disfunção contrátil transitória, que se resolve espontaneamente em poucos dias apesar do vaso estar pérvio, é a definição clássica de miocárdio atordoado — miocárdio viável, mas que demora a se recuperar funcionalmente após a agressão isquêmica.", "Errada: miocárdio hibernante é uma condição crônica associada a fluxo cronicamente reduzido (não normalizado por revascularização recente) e não se resolveria espontaneamente em poucos dias sem intervenção adicional — no caso, o vaso já está pérvio e a disfunção se resolve sozinha.", "Errada: não há evidência de nova oclusão ou de necrose adicional no caso; a disfunção é transitória e reversível, incompatível com um novo evento necrótico.", "Errada: o quadro descrito (disfunção contrátil transitória autolimitada) não corresponde a uma complicação mecânica do stent, e sim a um fenômeno fisiológico conhecido pós-reperfusão.", "Errada: pericardite constritiva cursaria com quadro clínico e ecocardiográfico completamente diferente, sem relação com a disfunção contrátil segmentar transitória descrita."], "source": "original"}, {"vignette": "Sobre os benefícios e riscos da reperfusão miocárdica após oclusão coronariana aguda, assinale a alternativa correta.", "options": ["A reperfusão não é sempre benéfica: quanto mais precoce, maior o salvamento miocárdico, mas quando tardia (após a necrose já estabelecida), pode transformar o infarto em hemorrágico", "A reperfusão é sempre benéfica quando realizada dentro das primeiras 12 horas do início dos sintomas, independentemente de a necrose transmural já estar estabelecida", "A reperfusão só apresenta benefício comprovado quando realizada entre 6 e 12 horas do início dos sintomas, sendo ineficaz fora dessa janela específica", "A reperfusão deve ser postergada em infartos subendocárdicos até que a necrose se torne transmural, momento em que traria maior benefício", "O tempo decorrido entre a oclusão e a reperfusão influencia apenas o risco de arritmias de reperfusão, sem qualquer relação com a extensão final da necrose"], "correct": 0, "explanation": ["Correta: como visto na aula, a resposta à pergunta 'a reperfusão é sempre benéfica?' é explicitamente 'não' — o benefício depende do tempo, sendo máximo quando muito precoce (<20min, salvamento quase completo) e podendo se tornar deletério (infarto hemorrágico) quando tardio.", "Errada: mesmo dentro das primeiras 12 horas, se a necrose transmural já estiver estabelecida a reperfusão pode causar infarto hemorrágico — o benefício depende do estágio da necrose, não apenas de uma janela fixa de 12 horas.", "Errada: a reperfusão é mais benéfica quanto mais precoce (inclusive antes de 6h), e não há essa janela fixa de benefício exclusivo entre 6 e 12h — o valor da reperfusão despenca com o tempo, de forma contínua.", "Errada: é o oposto — reperfundir enquanto a necrose ainda é subendocárdica (antes de se tornar transmural) é o que permite salvar mais miocárdio; postergar até a transmuralidade reduz o benefício e aumenta o risco de infarto hemorrágico.", "Errada: o tempo é a variável central que determina tanto a quantidade de miocárdio salvo quanto o risco de lesão de reperfusão — não se limita a um efeito isolado sobre arritmias."], "source": "original"}]}, {"id": "s7", "num": 7, "title": "Complicações do Infarto Agudo do Miocárdio", "images": [{"key": "complicacoes-ruptura-VE-e-septo.jpg", "caption": "Complicações mecânicas do IAM. Em A, ruptura da parede livre do ventrículo esquerdo (seta) — complicação catastrófica que leva a tamponamento cardíaco por hemopericárdio. Em B, ruptura do septo interventricular (seta), criando uma comunicação interventricular (CIV) adquirida, com shunt esquerda-direita agudo."}, {"key": "complicacoes-papilares-trombo-mural.jpg", "caption": "Em C, ruptura de músculo papilar, resultando em insuficiência valvar mitral aguda grave por perda súbita do suporte das cordoalhas tendíneas. Em D (imagem à direita), formação de trombo mural (seta) aderido à parede endocárdica de uma área discinética/aneurismática — substrato para fenômenos tromboembólicos sistêmicos."}, {"key": "aneurisma-ventricular-cardiaco.jpg", "caption": "Aneurisma ventricular cardíaco: dilatação sacular da parede ventricular, com afinamento e fibrose da área previamente infartada, que perde sua capacidade contrátil normal e se torna uma zona discinética (que se expande, em vez de contrair, durante a sístole)."}], "content": "\n<p>As complicações do infarto agudo do miocárdio não são acasos aleatórios — elas dependem diretamente de três variáveis que já vimos ao longo da aula: a extensão do IAM, o <strong>grau de comprometimento da parede</strong> (subendocárdico ou transmural) e a localização do infarto. Vamos organizar as principais complicações e, sempre que possível, amarrar cada uma ao mecanismo fisiopatológico que já discutimos nos segmentos anteriores.</p>\n\n<h3>Complicações funcionais/hemodinâmicas</h3>\n<p><strong>Insuficiência cardíaca</strong> e edema pulmonar surgem quando há infarto extenso do ventrículo esquerdo — o sangue que não consegue ser ejetado adequadamente se acumula retrogradamente, primeiro no próprio VE e depois na circulação pulmonar.</p>\n<p>Quando a extensão do dano é grande o suficiente para comprometer criticamente o débito cardíaco, o quadro evolui para <strong>choque cardiogênico</strong> — instabilidade hemodinâmica com má perfusão tecidual sistêmica (um verdadeiro estado de choque de origem cardíaca).</p>\n\n<h3>Complicações mecânicas: a fragilidade tecidual da janela de 2-6 dias</h3>\n<p>Lembra que no segmento sobre morfologia dissemos que a janela de <strong>2 a 6 dias</strong> é a fase de maior fragilidade mecânica do tecido infartado (necrose já instalada, arquitetura perdida, mas fibrose ainda não iniciada)? Pois é exatamente nessa janela que as complicações mecânicas mais temidas costumam ocorrer:</p>\n\n<p><strong>Ruptura do miocárdio</strong> pode acontecer em diferentes estruturas:</p>\n<img loading=lazy decoding=async src=\"{complicacoes-ruptura-VE-e-septo.jpg}\" class=\"fig\">\n<ul>\n<li>Ruptura da parede livre do ventrículo → sangue extravasa para o saco pericárdico, causando <strong><mark class=\"exam4\" data-refs=\"81:aberta1\">tamponamento cardíaco</mark></strong> (compressão externa do coração pelo acúmulo de sangue no pericárdio, comprometendo o enchimento diastólico) — evento frequentemente fatal em minutos;</li>\n<li>Ruptura do <strong>septo interventricular</strong> → cria uma <strong>comunicação interventricular (CIV)</strong> adquirida, com shunt agudo entre os ventrículos, sobrecarregando subitamente a circulação pulmonar.</li>\n</ul>\n\n<img loading=lazy decoding=async src=\"{complicacoes-papilares-trombo-mural.jpg}\" class=\"fig\">\n<p><strong>Insuficiência valvar aguda</strong> ocorre classicamente por <mark class=\"exam3\" data-refs=\"81:aberta1,78:aberta3\">ruptura de músculo papilar</mark> — o suporte estrutural da valva mitral se perde subitamente, e a valva passa a regurgitar de forma grave e aguda, precipitando edema pulmonar fulminante.</p>\n\n<p><strong>Aneurisma cardíaco</strong> é diferente das rupturas acima: aqui a parede fica friável e adelgaçada, mas <strong>não chega a se romper</strong> — em vez disso, dilata progressivamente sob a pressão intraventricular, formando uma bolsa discinética (que se expande, em vez de contrair, durante a sístole).</p>\n<img loading=lazy decoding=async src=\"{aneurisma-ventricular-cardiaco.jpg}\" class=\"fig\">\n\n<p>📌 <strong>EXTRA:</strong> tanto o aneurisma quanto qualquer área discinética/acinética do ventrículo são um terreno propício para a formação de trombo mural — o sangue fica estagnado exatamente naquela região que não contrai adequadamente, favorecendo a coagulação local segundo a tríade de Virchow (estase sanguínea, disfunção endotelial e hipercoagulabilidade).</p>\n<p>Esse trombo mural, por sua vez, é a origem de <strong>fenômenos tromboembólicos</strong> sistêmicos — fragmentos podem se soltar e embolizar para o cérebro (AVC), membros (isquemia aguda de membro) ou outros órgãos.</p>\n\n<h3>Arritmias cardíacas</h3>\n<p>São uma das complicações mais importantes do IAM, sendo a principal causa de morte muito precoce (nos primeiros minutos a horas) — vamos aprofundar esse ponto no próximo segmento, ao falar de morte súbita cardíaca.</p>\n\n\n<h3>Pericardite pós-infarto — a complicação que costuma faltar na revisão</h3>\n<p>Duas formas, e provas gostam de diferenciá-las pelo tempo:</p>\n<ul>\n<li><strong><mark class=\"exam3\" data-refs=\"82:?\">Pericardite fibrinosa peri-infarto (epistenocárdica)</mark></strong> — surge precocemente, entre o <strong>2º e o 4º dia</strong>, por extensão direta da inflamação transmural até o epicárdio adjacente. Cursa com atrito pericárdico e dor pleurítica que piora ao decúbito e melhora ao inclinar o tronco para frente.</li>\n<li><strong>Síndrome de Dressler</strong> — muito mais tardia (<strong>semanas a poucos meses</strong> após o IAM), de natureza autoimune (resposta contra antígenos miocárdicos expostos pela necrose). Cursa com febre, pericardite, pleurite e, às vezes, derrame pericárdico/pleural.</li>\n</ul>\n<p>📌 <strong>EXTRA — por que isso cai junto com as complicações mecânicas:</strong> uma das perguntas clássicas de prova pede para você distinguir, num paciente poucos dias após o IAM com dor torácica nova, se está diante de reinfarto, <strong>pericardite fibrinosa</strong> ou ruptura — o contexto (febre baixa e atrito pericárdico vs. instabilidade hemodinâmica franca com tamponamento) é o que decide.</p>", "questions": [{"vignette": "Paciente de 72 anos foi internado devido a quadro de infarto agudo do miocárdio, recebendo tratamento de suporte. No 4º dia de evolução, apresentou instalação súbita de hipotensão grave, turgência jugular, abafamento de bulhas cardíacas e pulso paradoxal. O ecocardiograma no leito mostrou acúmulo de conteúdo líquido e viscoso no pericárdio, e o paciente evoluiu a óbito apesar das tentativas de tratamento. Qual mecanismo fisiopatológico melhor explica o desfecho?", "options": ["Ruptura da parede livre do ventrículo, favorecida pela fragilidade tecidual máxima da janela de 2 a 6-7 dias pós-infarto, levando a hemopericárdio e tamponamento cardíaco", "Arritmia fatal (fibrilação ventricular) ocorrida nos primeiros minutos do infarto, sem qualquer componente mecânico", "Formação de aneurisma ventricular cardíaco crônico, que rompeu espontaneamente após meses de evolução", "Embolia pulmonar maciça a partir de trombo mural formado na área discinética do infarto, cursando com cor pulmonale agudo e colapso hemodinâmico", "Pericardite fibrinosa peri-infarto evoluindo excepcionalmente com derrame volumoso e tamponamento cardíaco subagudo"], "correct": 0, "explanation": ["Correta: entre o 2º e o 6-7º dia, o tecido necrótico já perdeu sua arquitetura (digestão enzimática pelos neutrófilos) mas ainda não foi reparado por fibrose — é a janela de maior fragilidade mecânica, predispondo à ruptura da parede livre, hemopericárdio e tamponamento cardíaco (tríade de Beck: hipotensão, turgência jugular, bulhas abafadas).", "Errada: haveria colapso hemodinâmico imediato nos primeiros minutos, sem o intervalo de 4 dias e sem o achado ecocardiográfico de líquido pericárdico compressivo.", "Errada: o aneurisma cardíaco não rompe (a parede dilata, mas não se rompe) e é um evento tardio, de semanas a meses.", "Errada: o quadro descrito (tríade de Beck + líquido pericárdico ao ecocardiograma) é específico de tamponamento cardíaco por hemopericárdio, não de embolia pulmonar, que não produziria esse achado ecocardiográfico.", "Errada: a pericardite fibrinosa peri-infarto cursa classicamente com atrito pericárdico e dor pleurítica, sem o colapso hemodinâmico súbito e grave (tríade de Beck) descrito no caso, que é típico de ruptura de parede livre."], "source": "adapted", "sourceLabel": "Parcial 82, Questão Aberta 1"}, {"image": "complicacoes-papilares-trombo-mural.jpg", "vignette": "Paciente, 5 dias após IAM inferior, desenvolve subitamente dispneia intensa, edema agudo de pulmão e um sopro sistólico novo e importante em foco mitral, com irradiação para axila. Qual complicação mecânica do IAM, ilustrada no painel C da imagem acima, melhor explica esse quadro?", "options": ["Ruptura de músculo papilar, causando insuficiência mitral aguda grave por perda do suporte das cordoalhas tendíneas", "Formação de trombo mural (painel D), que por si só já explicaria o sopro sistólico novo", "Ruptura da parede livre do ventrículo esquerdo, sem qualquer relação com a valva mitral", "Pericardite constritiva de instalação subaguda, cursando com sopro sistólico irradiado para axila por atrito pericárdico intenso", "Angina instável recorrente, com sopro sistólico transitório decorrente de disfunção isquêmica reversível do músculo papilar"], "correct": 0, "explanation": ["Correta: sopro sistólico novo em foco mitral associado a edema agudo de pulmão dias após IAM (especialmente inferior, território frequentemente relacionado à irrigação dos músculos papilares posteromediais pela CD) é o quadro clássico de ruptura de músculo papilar com insuficiência mitral aguda grave, representada no painel C.", "Errada: trombo mural (painel D) não produz sopro valvar — ele é uma complicação relacionada a estase sanguínea em áreas discinéticas, associada a risco de embolização sistêmica, não a disfunção valvar aguda.", "Errada: ruptura de parede livre cursa com tamponamento cardíaco (hipotensão, turgência jugular, bulhas abafadas), não com sopro sistólico mitral e edema pulmonar por regurgitação valvar.", "Errada: pericardite constritiva não produz sopro sistólico mitral irradiado para axila — esse achado é típico de insuficiência mitral aguda por disfunção estrutural da valva, não de doença pericárdica.", "Errada: angina, por definição, não causa dano estrutural permanente (sem necrose); o sopro novo e importante com edema agudo de pulmão descrito é mais compatível com ruptura (não disfunção transitória) do músculo papilar."], "source": "adapted", "sourceLabel": "Parcial 78, Questão Aberta 3"}, {"vignette": "Paciente com histórico de IAM extenso de parede anterior há 3 meses, evolui em acompanhamento ambulatorial com uma área discinética documentada em ecocardiograma na topografia do infarto prévio (aneurisma ventricular). Durante consulta de rotina, apresenta quadro súbito de hemiparesia à direita e afasia. Qual é o mecanismo fisiopatológico mais provável ligando o aneurisma ventricular ao evento neurológico agudo?", "options": ["Formação de trombo mural na área discinética do aneurisma, por estase sanguínea local, com posterior embolização sistêmica para a circulação cerebral", "O aneurisma ventricular, por si só, comprime diretamente estruturas cerebrais, causando o déficit neurológico", "Aneurismas ventriculares só se associam a fenômenos tromboembólicos quando localizados na parede inferior, não na parede anterior como no caso descrito", "O quadro neurológico decorre de vasoespasmo cerebral desencadeado pelo mesmo mecanismo fisiopatológico da angina de Prinzmetal, sem relação com o aneurisma ventricular", "A área discinética do aneurisma libera diretamente êmbolos de tecido miocárdico necrótico para a circulação cerebral"], "correct": 0, "explanation": ["Correta: áreas discinéticas/aneurismáticas favorecem a estase sanguínea local (um dos componentes da tríade de Virchow), propiciando a formação de trombo mural, que pode se fragmentar e embolizar sistemicamente — inclusive para a circulação cerebral, causando um AVC isquêmico embólico, como sugerido pelo quadro de hemiparesia e afasia súbitas.", "Errada: não há relação anatômica de contiguidade entre um aneurisma cardíaco e estruturas cerebrais que justifique compressão direta.", "Errada: é exatamente o oposto do que foi discutido — áreas discinéticas/aneurismáticas, independentemente da localização, são um terreno clássico para formação de trombo mural e fenômenos tromboembólicos.", "Errada: o quadro de déficit neurológico focal agudo (hemiparesia + afasia) é muito mais sugestivo de evento embólico cerebral a partir do trombo mural do aneurisma do que de vasoespasmo cerebral, mecanismo não estabelecido na aula.", "Errada: o material embolizado nesse contexto é o trombo formado sobre a área discinética, não fragmentos de tecido miocárdico necrótico propriamente ditos."], "source": "original"}]}, {"id": "s8", "num": 8, "title": "Cardiopatia Isquêmica Crônica e Morte Súbita Cardíaca", "images": [{"key": "cardiopatia-cronica-cardiomegalia.jpg", "caption": "Peça cardíaca de paciente com cardiopatia isquêmica crônica: note a cardiomegalia, com hipertrofia e dilatação do ventrículo esquerdo, além de áreas de fibrose entremeadas ao miocárdio viável remanescente — o retrato morfológico de um coração que acumulou múltiplas agressões isquêmicas ao longo do tempo."}], "content": "\n<p>Fechamos a aula com os dois últimos quadros clínicos da doença isquêmica do coração — ambos representam, de certa forma, os \"desfechos de longo prazo\" possíveis depois de um ou mais eventos isquêmicos: um é a consequência lenta e progressiva do acúmulo de dano miocárdico; o outro é o desfecho mais abrupto e dramático possível.</p>\n\n<h3>3) Cardiopatia Isquêmica Crônica</h3>\n<p>É uma <strong>complicação do IAM</strong> — mais especificamente, o resultado de <strong>insuficiência cardíaca progressiva</strong> em decorrência do dano acumulado ao miocárdio por alterações isquêmicas repetidas, geralmente por um ou mais infartos prévios.</p>\n<p>Conceitualmente, ela representa a <strong><mark class=\"exam3\" data-refs=\"80:aberta2,78:17,80:13\">exaustão da capacidade de hipertrofia compensatória</mark></strong> do miocárdio ainda viável: depois de anos tentando compensar a perda progressiva de massa contrátil funcionante hipertrofiando o tecido remanescente, esse mecanismo adaptativo se esgota, e a função de bomba do coração declina de forma progressiva e irreversível.</p>\n<img loading=lazy decoding=async src=\"{cardiopatia-cronica-cardiomegalia.jpg}\" class=\"fig\">\n<p>A morfologia reflete exatamente essa história: cardiomegalia, com hipertrofia e dilatação do ventrículo esquerdo (a câmara tentando compensar, mas já claudicando), e áreas de fibrose espalhadas pelo miocárdio — as cicatrizes deixadas por infartos anteriores, muitas vezes silenciosos.</p>\n\n<h3>4) Morte Súbita Cardíaca</h3>\n<p>É definida por um critério temporal bem específico: o óbito acontece <strong><mark class=\"exam3\" data-refs=\"80:19\">em minutos, ou em até 24 horas</mark></strong> após o evento isquêmico inicial. O evento decisivo que efetivamente causa a morte, na grande maioria dos casos, é uma <strong><mark class=\"exam2\" data-refs=\"80:19,82:13\">arritmia fatal — fibrilação ventricular (FV)</mark></strong>.</p>\n\n<p>📌 <strong>EXTRA — como isso se conecta com o resto da aula:</strong> vale a pena amarrar esse conceito ao que vimos no segmento de complicações. Uma morte muito precoce após o início da dor torácica (minutos a poucas horas) tem uma probabilidade muito maior de ser causada por arritmia (FV) do que por uma complicação mecânica como ruptura da parede livre — porque, como vimos, a ruptura mecânica depende de uma janela de fragilidade tecidual que só se instala entre 2 e 6 dias após o infarto (quando a necrose já está estabelecida, mas a fibrose ainda não começou).</p>\n<p>Já a instabilidade elétrica que gera FV pode ocorrer a qualquer momento desde os primeiros minutos de isquemia, o que explica por que arritmias são a causa mais comum de morte nas primeiríssimas horas do IAM, enquanto rupturas mecânicas concentram-se mais tardiamente, na primeira semana.</p>\n\n<h3>Fechando com uma questão real de prova de residência</h3>\n<p>Essa é a questão que estava literalmente na última página da sua aula (HSSJJ, 2009), e ela sintetiza perfeitamente a distinção mais importante entre angina instável e infarto sem supra de ST, que já discutimos nos segmentos 3 e 4 — mas vale reforçar aqui, no fechamento.</p>\n", "questions": [{"vignette": "Um paciente com história de infarto agudo do miocárdio aos 65 anos, tratado com sucesso na época, apresentou progressiva redução da capacidade funcional do coração ao longo dos anos seguintes. Aos 75 anos, retorna ao ambulatório com queixas de insuficiência cardíaca congestiva. Considerando os diagnósticos prévio e atual, e o mecanismo que leva à descompensação ao longo desse intervalo, assinale a alternativa correta.", "options": ["Trata-se de cardiopatia isquêmica crônica; a descompensação decorre do dano isquêmico miocárdico acumulado e da exaustão da hipertrofia compensatória do miocárdio remanescente", "Trata-se de cardiopatia hipertensiva primária, com hipertrofia concêntrica evoluindo para disfunção diastólica de forma independente do infarto prévio", "Trata-se de miocardite viral subaguda, desencadeada por infecção respiratória recente, sem relação com o evento isquêmico ocorrido 10 anos antes", "Trata-se de estenose mitral reumática de longa data, descompensada por fibrilação atrial de início recente", "Trata-se de doença de Chagas crônica, com miocardiopatia dilatada e aneurisma de ponta característicos da forma cardíaca tardia"], "correct": 0, "explanation": ["Correta: o diagnóstico prévio (IAM) somado ao quadro atual (ICC progressiva) define cardiopatia isquêmica crônica — o miocárdio viável tenta compensar a perda de massa contrátil hipertrofiando-se, mas esse mecanismo se esgota (exaustão da hipertrofia compensatória), levando a declínio progressivo e irreversível da função de bomba.", "Errada: não há dado de hipertensão de longa data no enunciado, e o quadro é explicado diretamente pelo IAM prévio e pela exaustão da hipertrofia compensatória, não por uma cardiopatia hipertensiva primária.", "Errada: não há relato de infecção recente no enunciado, e a evolução lenta e progressiva ao longo de 10 anos é incompatível com miocardite viral subaguda, sendo mais coerente com cardiopatia isquêmica crônica.", "Errada: não há dado de valvopatia nem de fibrilação atrial no caso; a história prévia de IAM é o elemento central que explica a descompensação.", "Errada: não há dado epidemiológico (área endêmica) nem clínico sugestivo de Chagas no enunciado; o quadro é explicado diretamente pelo IAM prévio documentado."], "source": "adapted", "sourceLabel": "Parcial 80, Questão Aberta 2"}, {"vignette": "Dois pacientes dão entrada no pronto-socorro com dor precordial típica de início recente. O paciente 1 evolui a óbito 30 minutos após o início da dor, antes mesmo de qualquer intervenção. O paciente 2, que recebeu o mesmo diagnóstico inicial, evolui a óbito no 4º dia de internação, com quadro súbito de hipotensão grave e tamponamento cardíaco. Considerando os mecanismos discutidos na aula, qual é a causa mais provável de morte em cada caso, respectivamente?", "options": ["Paciente 1: arritmia fatal (fibrilação ventricular); Paciente 2: ruptura mecânica da parede livre do ventrículo, complicação típica da janela de maior fragilidade tecidual (2-6 dias)", "Paciente 1: ruptura da parede livre do ventrículo; Paciente 2: arritmia fatal, já que ambas as complicações ocorrem sempre no mesmo intervalo de tempo", "Ambos os pacientes morreram por choque cardiogênico refratário, decorrente de extensa área de necrose transmural presente em ambos os casos", "Paciente 1: embolia pulmonar maciça a partir de trombose venosa profunda; Paciente 2: espasmo coronariano fatal do tipo Prinzmetal", "O tempo de evolução após o início do IAM reflete apenas a gravidade do choque cardiogênico instalado, não distinguindo mecanismos fisiopatológicos diferentes de morte"], "correct": 0, "explanation": ["Correta: morte muito precoce (minutos) após o início da dor é classicamente atribuída a arritmia fatal (FV) — a definição de morte súbita cardíaca; já a morte no 4º dia, com tamponamento cardíaco, é consistente com ruptura mecânica da parede livre, complicação que se concentra justamente na janela de maior fragilidade tecidual (2-6 dias), quando a necrose já está estabelecida mas a fibrose de reparo ainda não começou.", "Errada: é a inversão dos mecanismos corretos — ruptura mecânica da parede livre não ocorre em 30 minutos (o tecido ainda não teve tempo de desenvolver a fragilidade estrutural necessária), e arritmia fatal não é o mecanismo típico associado especificamente ao 4º dia com tamponamento.", "Errada: os dois casos têm mecanismos fisiopatológicos distintos e bem definidos (arritmia fatal precocíssima versus ruptura mecânica tardia) — descrevê-los genericamente como choque cardiogênico ignora essa diferença central discutida na aula.", "Errada: nenhuma das descrições clínicas (morte súbita em 30min; tamponamento cardíaco no 4º dia) corresponde a embolia pulmonar ou a angina de Prinzmetal, que não causam tamponamento cardíaco.", "Errada: é justamente o oposto do que a aula ensina — o tempo de evolução após o início do IAM é uma pista fisiopatológica importante para diferenciar arritmia fatal precoce de complicações mecânicas mais tardias."], "source": "adapted", "sourceLabel": "Parcial 79, Questão 9"}, {"vignette": "Questão de residência (HSSJJ, 2009) — Por definição, qual é a diferença fundamental entre angina instável e infarto sem elevação do segmento ST?", "options": ["No infarto sem supra de ST existem marcadores de necrose detectáveis, o que não ocorre na angina instável", "A dor precordial costuma ser mais prolongada e refratária ao nitrato na angina instável do que no infarto sem supra de ST", "O infarto sem elevação do segmento ST cursa obrigatoriamente com ECG completamente normal, sendo o diagnóstico firmado apenas pelos biomarcadores", "Na angina instável, os marcadores de necrose encontram-se apenas levemente acima dos valores normais", "A diferença entre angina instável e infarto sem elevação do segmento ST está apenas na duração da dor torácica, não na presença de necrose miocárdica"], "correct": 0, "explanation": ["Correta: essa é exatamente a diferença fundamental entre as duas condições, e conecta diretamente com o que vimos no segmento 3 — angina, por definição (inclusive a instável), não causa necrose miocárdica, e portanto não eleva marcadores como troponina; já o infarto sem supra de ST, apesar de também não elevar o segmento ST no ECG, JÁ representa necrose estabelecida (ainda que geralmente subendocárdica, não transmural), com marcadores de necrose positivos.", "Errada: a duração e a refratariedade da dor não são o critério que define a diferença fundamental entre as duas condições — o critério é a presença ou ausência de necrose detectável por biomarcadores.", "Errada: o infarto sem supra de ST pode, sim, apresentar alterações eletrocardiográficas (como infradesnivelamento de ST ou inversão de onda T) — ele não cursa obrigatoriamente com ECG normal.", "Errada: na angina instável, por definição, não há necrose miocárdica, e portanto os marcadores de necrose devem estar negativos (não apenas 'levemente elevados') — qualquer elevação de biomarcador já reclassificaria o quadro como infarto.", "Errada: existe, sim, uma diferença fundamental e clinicamente crucial entre as duas condições, que é justamente a presença de necrose miocárdica detectável (biomarcadores positivos) no infarto sem supra de ST, e não a duração da dor."], "source": "original"}]}, {"id": "s9", "num": 9, "title": "O que mais cai em prova: casos comentados e pegadinhas mais cobradas", "images": [], "content": "\n<p>Este segmento foi montado a partir da análise de provas antigas do departamento (Parciais 78 a 82) sobre cardiopatia isquêmica. O padrão de cobrança é sempre o mesmo: caso clínico (situação-problema) + comando de resposta, frequentemente com um único caso puxando 2 a 3 perguntas em sequência. Os pontos abaixo são os que mais se repetem e que merecem reforço, mesmo já tendo aparecido nos segmentos anteriores.</p>\n\n<h3>1 — A sequência cronológica da aterogênese, aplicada a um caso de dor torácica</h3>\n<p>É comum a prova descrever um caso de síndrome coronariana aguda e, na sequência, pedir a <strong>ordem cronológica dos eventos</strong> que formaram a placa causadora, contando a partir da lesão endotelial: <strong>(1) acúmulo de lipoproteínas na íntima → (2) adesão de monócitos/plaquetas ao endotélio lesado → (3) migração de células musculares lisas da média para a íntima → (4) síntese e deposição de matriz extracelular</strong> pelas células musculares lisas.</p>\n<p>Não confunda com a sequência de eventos agudos sobre a placa já formada (Segmento 2): ruptura → trombose → vasoespasmo. São duas linhas do tempo diferentes, e a prova gosta de testar as duas no mesmo caso — uma para a formação da placa (meses a anos antes) e outra para o evento agudo (minutos a horas antes da chegada ao pronto-socorro).</p>\n\n<h3>2 — Diferenciar reinfarto, pericardite e ruptura num paciente com dor nova pós-IAM</h3>\n<table class=\"tbl\">\n<tr><th></th><th>Reinfarto</th><th>Pericardite fibrinosa</th><th>Ruptura de parede livre</th></tr>\n<tr><td>Quando</td><td>Qualquer momento</td><td>2º–4º dia</td><td>2º–7º dia (pico da fragilidade)</td></tr>\n<tr><td>Dor</td><td>Recorrência da dor anginosa típica</td><td>Pleurítica, piora ao deitar, melhora ao inclinar para frente</td><td>Instalação súbita, associada a colapso hemodinâmico</td></tr>\n<tr><td>Exame/ECG</td><td>Novas alterações de ST, novo pico de troponina</td><td>Atrito pericárdico; supra difuso de ST (côncavo) sem imagem em espelho</td><td>Tríade de Beck (hipotensão + turgência jugular + bulhas abafadas)</td></tr>\n</table>\n\n<h3>3 — Reconhecer a angina de Prinzmetal num enunciado</h3>\n<p>Os elementos que fecham o diagnóstico num caso: dor em repouso, tipicamente de madrugada, sem relação com esforço; coronariografia sem obstrução significativa (ou desproporcionalmente leve para a intensidade do quadro); alívio rápido com nitrato; mais comum em pacientes <strong>jovens e tabagistas</strong>. Não confunda com angina instável, que também ocorre em repouso, mas tem por trás uma placa rota com trombo — e coronariografia alterada.</p>\n\n<h3>4 — A distinção mais cobrada de toda a aula: angina instável x IAM sem supra de ST</h3>\n<p>Clínica e ECG podem ser idênticos nas duas situações. O que separa uma da outra, por definição, é a troponina: <mark class=\"exam4\" data-refs=\"78:17,81:9\">positiva = infarto (há necrose); negativa = angina instável (isquemia sem necrose)</mark>. Essa é, literalmente, a questão de prova de residência com que a aula original termina — e por isso reforçamos aqui.</p>\n\n<h3>5 — Morte precoce x morte tardia pós-IAM: qual mecanismo pensar primeiro</h3>\n<p>Se a morte ocorre nos <strong>primeiros minutos a horas</strong>, pense primeiro em <strong>arritmia (fibrilação ventricular)</strong> — a instabilidade elétrica não depende de nenhuma janela de fragilidade tecidual.</p>\n<p>Se ocorre entre o <strong>2º e o 7º dia</strong>, pense em <strong>complicação mecânica</strong> (ruptura de parede livre, septo ou músculo papilar) — depende da digestão enzimática do tecido necrótico já instalada, mas ainda sem fibrose de reparo. Se ocorre semanas a meses depois, pense em <strong>aneurisma ventricular com trombo mural embolizante</strong> ou em <strong>insuficiência cardíaca progressiva</strong> por cardiopatia isquêmica crônica.</p>\n\n<aside class=\"note-fix\">⚠️ <strong>Pegadinhas clássicas destas provas:</strong>\n<ul>\n<li>Angina, por definição, não eleva troponina — se o enunciado disser \"troponina elevada\", já não é mais angina, é infarto.</li>\n<li>A região <strong><mark class=\"exam3\" data-refs=\"79:12,80:11\">subendocárdica</strong> é a mais vulnerável à isquemia</mark> (não a subepicárdica) — é a mais distante do suprimento que corre pela superfície.</li>\n<li>Reperfusão tardia (após necrose já estabelecida) piora o dano (infarto hemorrágico) — reperfusão não é sempre benéfica; depende do tempo.</li>\n<li>Miocárdio atordoado (agudo, reversível em dias, já sem obstrução) ≠ miocárdio hibernante (crônico, só reverte se revascularizar).</li>\n<li>Circulação colateral é mais comum e mais eficaz em obstruções lentas e crônicas — não se forma a tempo numa oclusão trombótica aguda.</li>\n</ul></aside>\n", "questions": [{"vignette": "Homem, 62 anos, tabagista e hipertenso, é internado com dor precordial típica, supradesnivelamento de ST em parede anterior e troponina positiva. A angiografia confirma trombo oclusivo sobre placa aterosclerótica rota na descendente anterior. Investigando a formação dessa placa ao longo dos anos anteriores ao evento agudo, qual é a sequência cronológica correta dos eventos, a partir da lesão endotelial crônica?", "options": ["Acúmulo de lipoproteínas na íntima → adesão de monócitos/plaquetas → migração de células musculares lisas da média para a íntima → síntese e deposição de matriz extracelular", "Síntese de matriz extracelular → migração de células musculares lisas → adesão de monócitos/plaquetas → acúmulo de lipoproteínas na íntima", "Migração de células musculares lisas → acúmulo de lipoproteínas → síntese de matriz extracelular → adesão de monócitos/plaquetas", "Adesão de monócitos/plaquetas → síntese de matriz extracelular → acúmulo de lipoproteínas → migração de células musculares lisas", "Todos os eventos ocorrem simultaneamente, sem sequência cronológica definida"], "correct": 0, "explanation": ["Correta: após a lesão endotelial, o LDL fica retido e se acumula na íntima, o que desencadeia a adesão de monócitos/plaquetas; estes recrutam células musculares lisas da média, que passam a sintetizar e depositar a matriz extracelular que forma a capa fibrosa.", "Errada: inverte completamente a ordem — a síntese de matriz é o evento final, não o inicial.", "Errada: a migração de células musculares lisas é um evento intermediário/tardio, não o primeiro após a lesão endotelial.", "Errada: a adesão de monócitos ocorre logo após o acúmulo lipídico, não antes dele.", "Errada: a aterogênese segue uma cascata sequencial bem definida, e não eventos simultâneos e desordenados."], "source": "original"}, {"vignette": "Mulher, 70 anos, 3 dias após IAM inferior tratado clinicamente, evolui com dor torácica pleurítica que piora ao deitar e melhora ao inclinar o tronco para frente, associada a atrito à ausculta cardíaca, sem sinais de instabilidade hemodinâmica. O ECG mostra supradesnivelamento difuso e côncavo de ST, sem imagem em espelho. Qual é o diagnóstico mais provável?", "options": ["Pericardite fibrinosa peri-infarto (epistenocárdica)", "Ruptura subaguda da parede livre do ventrículo esquerdo, contida por aderências pericárdicas, cursando com dor pleurítica progressiva e atrito à ausculta", "Reinfarto por nova oclusão trombótica da artéria culpada, com dor pleurítica postural e atrito pericárdico reativo à necrose adicional", "Ruptura parcial de músculo papilar posteromedial, cursando com dor pleurítica postural e atrito pericárdico associado ao sopro mitral", "Síndrome de Dressler, reação autoimune peri-infarto que tipicamente já se manifesta entre o 2º e o 4º dia de evolução pós-IAM"], "correct": 0, "explanation": ["Correta: dor pleurítica, postural, com atrito pericárdico e supra difuso/côncavo de ST, no 2º ao 4º dia pós-IAM, é o quadro clássico da pericardite fibrinosa peri-infarto, por extensão da inflamação transmural até o epicárdio.", "Errada: mesmo quando contida, a ruptura de parede livre tende a cursar com instabilidade hemodinâmica; o quadro estável, postural e com supra difuso côncavo de ST descrito é característico de pericardite, não de ruptura contida.", "Errada: reinfarto reproduziria dor anginosa típica (não pleurítica/postural) e um novo pico de troponina, achados não descritos no caso.", "Errada: ruptura de músculo papilar cursaria com sopro sistólico novo e edema agudo de pulmão, não com dor pleurítica postural e atrito pericárdico isolados, como no caso.", "Errada: a síndrome de Dressler é mais tardia (semanas a meses após o IAM), e não no 3º dia como no caso — o quadro descrito nesse momento é o da pericardite fibrinosa peri-infarto precoce."], "source": "adapted", "sourceLabel": "Parcial 80, Questão 12"}, {"vignette": "Homem, 29 anos, tabagista importante, procura o pronto-socorro por episódios recorrentes de dor precordial intensa que o acordam de madrugada, sem qualquer relação com esforço físico. Durante um episódio monitorizado, o ECG mostra supradesnivelamento transitório de ST que reverte completamente após nitrato sublingual. A cineangiocoronariografia realizada entre as crises não mostra obstrução significativa. Marcadores de necrose permanecem normais em todas as dosagens. Qual o mecanismo fisiopatológico responsável pelo quadro?", "options": ["Espasmo coronariano (angina de Prinzmetal), sem relação obrigatória com aterosclerose significativa", "Ruptura de placa aterosclerótica com trombose oclusiva completa, revertida espontaneamente pela ação de mecanismos fibrinolíticos endógenos a cada episódio", "Infarto agudo do miocárdio subendocárdico recorrente, com elevação transitória de troponina que normaliza espontaneamente entre os episódios", "Angina estável desencadeada por redução fixa e crítica da luz coronariana, com os episódios noturnos explicados por queda postural da pressão de perfusão coronariana", "Ruptura parcial de músculo papilar com regurgitação mitral intermitente, produzindo sopro sistólico transitório durante as crises de dor torácica"], "correct": 0, "explanation": ["Correta: dor em repouso, de madrugada, com supra transitório de ST que reverte com nitrato, coronárias sem lesão obstrutiva relevante e marcadores sempre normais — é o retrato da angina de Prinzmetal, mais comum em jovens tabagistas.", "Errada: uma oclusão trombótica completa recorrente, mesmo com fibrinólise endógena, deixaria evidência de necrose (troponina positiva) em algum dos episódios, o que não ocorre no caso.", "Errada: por definição, infarto implica necrose miocárdica com elevação de troponina — no caso, os marcadores permanecem normais em todas as dosagens, o que exclui infarto.", "Errada: angina estável é desencadeada por esforço, não por repouso/madrugada, e a coronariografia do caso não mostra obstrução fixa relevante que sustente esse mecanismo.", "Errada: não há sopro nem qualquer achado compatível com disfunção valvar descritos no caso, que é dominado por alterações transitórias de ST revertidas por nitrato."], "source": "original"}]}], "quiz": [{"vignette": "Homem, 64 anos, hipertenso e dislipidêmico, é diagnosticado com cardiopatia isquêmica crônica após anos de episódios recorrentes de angina. Investigando a etiologia mais provável desse quadro, qual mecanismo fisiopatológico de base é responsável pela grande maioria (cerca de 90%) dos casos de cardiopatia isquêmica?", "options": ["Obstrução do fluxo coronariano por aterosclerose (doença arterial coronariana)", "Miocardite viral crônica, com fibrose intersticial difusa que mimetiza o padrão isquêmico observado na angina", "Vasoespasmo coronariano isolado (angina de Prinzmetal), responsável pela maioria dos casos crônicos mesmo sem lesão aterosclerótica associada", "Embolia coronariana recorrente de origem valvar, a partir de vegetações em válvula mitral calcificada", "Espessamento congênito idiopático da parede das artérias coronárias, presente desde o nascimento e progressivo com a idade"], "correct": 0, "explanation": ["Correta: a aula estabelece explicitamente que 90% dos casos de isquemia miocárdica decorrem de obstrução do fluxo coronariano por aterosclerose (DAC).", "Errada: miocardite crônica não é a causa discutida como predominante na aula, nem se apresenta tipicamente como episódios recorrentes de angina desencadeada por esforço.", "Errada: vasoespasmo é um dos mecanismos discutidos, mas não é isoladamente a causa mais comum — a grande maioria dos casos crônicos decorre de aterosclerose, com ou sem componente vasoespástico associado.", "Errada: embolia valvar não foi discutida como causa relevante de cardiopatia isquêmica crônica na aula, e não há dado de valvopatia no enunciado.", "Errada: não é a etiologia predominante descrita na aula; a cardiopatia isquêmica crônica do caso é explicada pela aterosclerose adquirida, não por uma anomalia congênita."], "source": "original"}, {"vignette": "Mulher, 60 anos, hipertensa, relata dor precordial em aperto que surge sempre ao subir dois lances de escada. Ao ser orientada sobre o manejo imediato desse tipo de episódio, qual medida classicamente promove alívio da dor, e por qual mecanismo?", "options": ["Repouso e uso de vasodilatadores (nitrato)", "Exercício físico intenso e prolongado, que redistribuiria o fluxo coronariano para a área isquêmica por vasodilatação reflexa induzida pelo esforço", "Aumento da frequência cardíaca por estímulo simpático, que encurtaria a diástole e melhoraria paradoxalmente a perfusão coronariana", "Restrição hídrica isolada, que reduziria a pré-carga e, consequentemente, o consumo miocárdico de oxigênio", "Nenhuma medida farmacológica promove alívio consistente, sendo a angioplastia de urgência a única conduta eficaz mesmo num episódio típico de angina estável"], "correct": 0, "explanation": ["Correta: a angina estável melhora com repouso (reduz demanda) e vasodilatadores (aumentam relativamente a oferta), como visto no segmento sobre angina.", "Errada: exercício aumenta a demanda de O2 do miocárdio, piorando (e não aliviando) a angina estável — não existe essa redistribuição benéfica de fluxo pelo esforço.", "Errada: o aumento de frequência cardíaca eleva a demanda miocárdica de O2 e reduz o tempo diastólico de perfusão coronariana, piorando a isquemia, não melhorando-a.", "Errada: não foi discutida relação entre restrição hídrica isolada e alívio da angina estável; a medida clássica é repouso associado a vasodilatador.", "Errada: a angina estável tipicamente responde bem a repouso e vasodilatadores (nitrato) no próprio episódio, não exigindo angioplastia de urgência para alívio sintomático imediato."], "source": "original"}, {"vignette": "Homem, 55 anos, apresenta episódio típico de dor precordial em aperto ao caminhar, que cede espontaneamente após alguns minutos de repouso, sem elevação de troponina na investigação subsequente. Qual é a duração típica da isquemia responsável por esse tipo de dor, insuficiente para causar necrose miocárdica?", "options": ["Entre 15 segundos e 15 minutos", "Entre 6 e 12 horas", "Menos de 1 segundo", "Mais de 24 horas", "Exatamente 40 minutos, sempre"], "correct": 0, "explanation": ["Correta: a aula define angina como isquemia de curta duração, entre 15 segundos e 15 minutos, insuficiente para provocar necrose.", "Errada: esse intervalo já seria compatível com necrose estabelecida (infarto), não com angina.", "Errada: menos de 1 segundo não é fisiologicamente compatível com um quadro de dor isquêmica percebida clinicamente.", "Errada: infartos evoluem ao longo de horas a semanas, mas a angina propriamente dita é definida por um intervalo bem mais curto.", "Errada: não existe esse valor fixo exato definido na aula; o intervalo é uma faixa (15s a 15min)."], "source": "original"}, {"vignette": "\"O ECG permite determinar, com razoável precisão e elevada frequência, a localização do infarto (...) existem vários fatores limitantes quando se consideram o diagnóstico do infarto e sua localização: o grau de lesão miocárdica, o estágio em que se encontra o infarto, o local do infarto e infartos múltiplos.\" (Mário López, Semiologia Médica). Em relação ao infarto agudo do miocárdio (IAM), assinale a alternativa CORRETA:", "options": ["O IAM ocorre mais frequentemente no ventrículo direito, em correspondência com a porção anterior do septo interventricular e ápice do coração", "O miocárdio localizado na região epicárdica é mais vulnerável à hipóxia do que o miocárdio localizado na porção subendocárdica", "A isquemia ou necrose do miocárdio provoca arritmias que podem desencadear insuficiência cardíaca aguda e morte súbita", "O tempo de início de necrose das fibras miocárdicas a partir da interrupção do fluxo arterial coronariano só se inicia após 4 a 6h, sendo isso importante pois nenhum achado microscópico é esperado em caso de óbito anterior a esse tempo", "O supradesnivelamento do segmento ST e a onda Q patológica indicam necrose restrita exclusivamente ao subendocárdio"], "correct": 2, "explanation": ["Errada: o IAM ocorre mais frequentemente no ventrículo esquerdo, não no direito.", "Errada: é o miocárdio subendocárdico que é mais vulnerável à hipóxia, por ser a região mais distante do suprimento arterial (que corre pela superfície epicárdica).", "Correta: a isquemia/necrose miocárdica é um substrato arritmogênico importante — arritmias (sobretudo fibrilação ventricular) são a principal causa de morte súbita muito precoce no IAM, e também podem desencadear insuficiência cardíaca aguda.", "Errada: a necrose se inicia entre 20 e 40 minutos de isquemia contínua (não 4-6h), e técnicas histoquímicas especiais (TTC) podem revelar a área infartada mesmo antes de alterações visíveis à HE de rotina.", "Errada: supra de ST + onda Q patológica é o padrão de necrose transmural (toda a espessura da parede), não restrita ao subendocárdio (que cursaria com infra de ST)."], "source": "real", "sourceLabel": "Parcial 79, Questão 12"}, {"vignette": "Homem de 33 anos, usuário eventual de cocaína, apresenta episódios recorrentes de dor torácica em repouso, principalmente durante a madrugada. O eletrocardiograma realizado durante um episódio demonstra elevação transitória do segmento ST, que desaparece rapidamente após uso de nitrato sublingual. A cineangiocoronariografia revela artérias coronárias sem estenoses significativas. Qual é o melhor diagnóstico para o caso?", "options": ["Angina estável", "Angina instável", "Angina de Prinzmetal", "Infarto agudo do miocárdio", "Angina microvascular (síndrome X)"], "correct": 2, "explanation": ["Errada: a angina estável se relaciona a esforço, com obstrução fixa à coronariografia.", "Errada: a angina instável decorreria de ruptura de placa/trombo mural, com coronariografia alterada.", "Correta: dor em repouso, de madrugada, supra transitório de ST revertido por nitrato e coronárias angiograficamente normais — quadro clássico de angina de Prinzmetal por vasoespasmo coronariano, associado a cocaína/tabagismo.", "Errada: no IAM a troponina estaria positiva e a alteração de ST não seria transitória.", "Errada: a angina microvascular cursa tipicamente com dor desencadeada por esforço."], "source": "real", "sourceLabel": "Parcial 82, Questão 16"}, {"vignette": "Paciente com doença arterial coronariana estabelecida é submetido a cineangiocoronariografia seriada ao longo do acompanhamento. Em relação aos limiares de obstrução coronariana necessários para desencadear sintomas nesse paciente, qual afirmação está correta?", "options": ["Obstruções acima de 75% costumam causar sintomas durante atividade física, enquanto obstruções acima de 90% causam sintomas mesmo em repouso", "Obstruções entre 50% e 70% já costumam causar sintomas mesmo em repouso, independentemente do nível de atividade física do paciente", "Obstruções abaixo de 50% tornam-se sintomáticas assim que o paciente atinge frequência cardíaca acima de 100 batimentos por minuto", "O limiar sintomático depende exclusivamente da pressão arterial sistêmica do paciente no momento do esforço, não do grau de obstrução coronariana", "Obstruções acima de 90% só se tornam sintomáticas quando há anemia grave concomitante, permanecendo assintomáticas na sua ausência"], "correct": 0, "explanation": ["Correta: como visto no segmento 1, sintomas surgem com obstruções >75% durante esforço e >90% em repouso, refletindo a maior demanda de O2 durante atividade física.", "Errada: obstruções nessa faixa costumam ser toleráveis mesmo ao esforço; sintomas em repouso são esperados apenas com obstruções mais avançadas (>90%), conforme discutido no segmento 1.", "Errada: obstruções abaixo de 50% costumam ser assintomáticas mesmo durante esforço significativo, na maioria dos pacientes, não havendo esse limiar fixo de frequência cardíaca.", "Errada: o nível de atividade física (demanda de O2) é a variável central que determina o limiar sintomático, e não a pressão arterial sistêmica isoladamente.", "Errada: é exatamente o oposto — obstruções acima de 90% são o limiar clássico para sintomas mesmo em repouso, independentemente da presença de anemia associada."], "source": "original"}, {"vignette": "Homem, 68 anos, hipertenso de longa data com hipertrofia ventricular esquerda concêntrica ao ecocardiograma, passa a apresentar angina desencadeada por esforços que antes eram bem tolerados, na ausência de progressão significativa da obstrução coronariana angiográfica. Por que um coração com hipertrofia miocárdica significativa apresenta maior vulnerabilidade à isquemia, mesmo diante de graus de obstrução que seriam bem tolerados por um coração normal?", "options": ["Porque a massa muscular aumentada eleva a demanda de O2 sem crescimento proporcional da rede capilar que a irriga", "Porque a hipertrofia reduz diretamente o calibre das artérias coronárias epicárdicas por compressão extrínseca constante", "Porque a hipertrofia acelera a degeneração de colaterais já formadas, revertendo anos de neoangiogênese compensatória prévia", "Porque corações hipertrofiados têm, por definição, artérias coronárias anatomicamente mais estreitas desde o nascimento", "A relação entre hipertrofia miocárdica e isquemia se dá apenas por aumento da pressão diastólica final, sem qualquer desproporção entre demanda e rede capilar"], "correct": 0, "explanation": ["Correta: como discutido no segmento 1, a hipertrofia aumenta a demanda metabólica de O2 do músculo sem um crescimento proporcional da rede capilar, reduzindo a reserva de perfusão coronariana disponível para atender essa demanda extra.", "Errada: a hipertrofia não age por compressão extrínseca direta e constante das grandes artérias epicárdicas como mecanismo central discutido na aula.", "Errada: não há essa afirmação na aula; o mecanismo central discutido é o aumento da demanda de O2 sem crescimento capilar proporcional, não a degeneração de colaterais previamente formadas.", "Errada: não há relação de causa congênita entre hipertrofia (que é adquirida) e o calibre anatômico das coronárias.", "Errada: existe, sim, uma relação bem estabelecida entre hipertrofia e maior vulnerabilidade isquêmica centrada na desproporção entre demanda de O2 aumentada e rede capilar insuficiente, não apenas na pressão diastólica final."], "source": "original"}, {"vignette": "Paciente chega ao pronto-socorro com dor torácica típica e ECG inconclusivo. Para confirmar bioquimicamente a lesão miocárdica antes de firmar o diagnóstico de infarto, quais são os dois principais marcadores solicitados?", "options": ["Troponina e CK-MB", "Amilase e lipase", "TSH e T4 livre", "Ureia e creatinina", "Bilirrubina direta e indireta"], "correct": 0, "explanation": ["Correta: a aula cita explicitamente troponina e CK-MB como marcadores de lesão miocárdica utilizados no diagnóstico bioquímico do IAM.", "Errada: amilase e lipase são marcadores de lesão pancreática, sem relação direta com o diagnóstico de IAM.", "Errada: TSH e T4 livre são marcadores de função tireoidiana, não de lesão miocárdica.", "Errada: ureia e creatinina avaliam função renal, não lesão miocárdica direta.", "Errada: bilirrubinas avaliam função hepática/hemólise, não lesão miocárdica."], "source": "original"}, {"image": "histologia-trombo-mural-vs-oclusivo.jpg", "vignette": "Um paciente apresenta quadro clínico e eletrocardiográfico de síndrome coronariana aguda sem supradesnivelamento do segmento ST, com troponina positiva (caracterizando infarto sem supra de ST). Qual padrão histológico de trombose coronariana, entre os ilustrados na imagem (A ou B), é o correlato anatomopatológico mais esperado nesse cenário?", "options": ["Padrão A (trombo mural, com luz residual pérvia), compatível com isquemia subendocárdica (não transmural)", "Padrão B (trombo oclusivo), já que qualquer necrose exige oclusão total do vaso", "O padrão histológico de trombose não influencia o tipo de infarto resultante, que dependeria apenas da localização anatômica da lesão coronariana", "Padrão A, mecanismo restrito a pacientes do sexo feminino por menor calibre basal das artérias coronárias", "Padrão B, mecanismo predominante apenas em pacientes idosos, por maior carga aterosclerótica basal acumulada"], "correct": 0, "explanation": ["Correta: infarto sem supra de ST tipicamente se associa a necrose subendocárdica (não transmural), decorrente de obstrução suboclusiva/trombo mural (padrão A) — há necrose (troponina positiva) mas não o grau de oclusão total necessário para gerar isquemia transmural e supra de ST.", "Errada: trombo oclusivo (B) está mais associado a infarto transmural com supra de ST, não ao quadro sem supra descrito.", "Errada: existe, sim, uma correlação bem estabelecida entre o grau de oclusão trombótica (padrão histológico) e o padrão eletrocardiográfico/anatômico do infarto, independentemente da localização.", "Errada: não há relação entre o padrão histológico de trombose e o sexo do paciente — o padrão A se associa ao infarto sem supra de ST em qualquer sexo.", "Errada: não há relação entre o padrão histológico de trombose e a idade do paciente como critério isolado — o padrão B se associa à oclusão completa e ao infarto com supra de ST, independentemente da faixa etária."], "source": "original"}, {"vignette": "Paciente com IAM com supradesnivelamento de ST só consegue ser submetido à angioplastia várias horas após o início dos sintomas, quando a necrose transmural já estava estabelecida. Qual é o principal mecanismo molecular que explica por que essa reperfusão tardia pode agravar, em vez de apenas deixar de beneficiar, o dano miocárdico?", "options": ["Extravasamento de hemácias por uma microcirculação já lesada, somado a explosão de espécies reativas de oxigênio, sobrecarga de cálcio intracelular e influxo adicional de neutrófilos", "A reperfusão tardia apenas acelera a eliminação de detritos necróticos pelos neutrófilos, sem qualquer componente hemorrágico associado a esse processo", "A reperfusão tardia provoca queda abrupta e direta da pressão arterial sistêmica do paciente, sendo esse o mecanismo hemodinâmico central do dano miocárdico adicional", "A reperfusão tardia estimula a formação acelerada de tecido de granulação, antecipando a fase de cicatrização sem qualquer efeito deletério adicional sobre o tecido", "A diferença entre reperfusão precoce e tardia está apenas na velocidade de resolução dos sintomas clínicos, não no mecanismo molecular de dano tecidual"], "correct": 0, "explanation": ["Correta: como discutido no segmento 6, a lesão de reperfusão tardia envolve extravasamento hemorrágico por microcirculação já lesada, além do 'paradoxo da reperfusão' — estresse oxidativo, sobrecarga de cálcio e infiltração neutrofílica adicional, todos contribuindo para ampliar o dano tecidual.", "Errada: a reperfusão tardia tem, sim, efeitos deletérios bem documentados envolvendo extravasamento hemorrágico por microcirculação lesada, não sendo um processo limpo restrito à eliminação de detritos.", "Errada: o mecanismo central discutido não é hemodinâmico sistêmico, e sim local/microvascular e molecular (extravasamento hemorrágico, estresse oxidativo, sobrecarga de cálcio, infiltração neutrofílica).", "Errada: a reperfusão tardia não acelera a cicatrização de forma benéfica — pelo contrário, pode agravar o dano tecidual local por lesão de reperfusão, incluindo o componente hemorrágico.", "Errada: existe diferença fisiopatológica marcante entre reperfusão precoce (salvamento tecidual) e tardia (risco de lesão hemorrágica por mecanismo molecular distinto), como discutido extensamente no segmento 6."], "source": "original"}, {"vignette": "Observe os seguintes eventos patológicos relacionados à evolução do infarto agudo do miocárdio: I - Formação de tecido de granulação; II - Necrose dos cardiomiócitos; III - Fibrose cicatricial; IV - Infiltração de neutrófilos. Qual é a sequência cronológica correta destes eventos?", "options": ["I, II, III e IV", "II, I, III e IV", "II, IV, I e III", "I, II, IV e III", "IV, II, I e III"], "correct": 2, "explanation": ["Errada: coloca fibrose e tecido de granulação antes da infiltração neutrofílica, invertendo a ordem real.", "Errada: coloca o tecido de granulação antes da infiltração de neutrófilos.", "Correta: primeiro a necrose dos cardiomiócitos (coagulação, desde as primeiras horas), depois a infiltração de neutrófilos (2-6 dias), depois o tecido de granulação (7-14 dias) e, por fim, a fibrose cicatricial (>4-6 semanas) — essa sequência é tão cobrada que aparece de forma praticamente idêntica em mais de uma prova antiga.", "Errada: coloca a fibrose antes do tecido de granulação, invertendo a ordem final.", "Errada: a infiltração neutrofílica não precede a necrose — ela é uma resposta a ela."], "source": "real", "sourceLabel": "Parcial 81, Questão 2 (repetida, com o mesmo enunciado e gabarito, na Parcial 79, Questão 2)"}, {"vignette": "Paciente idoso, com obstrução coronariana crônica de instalação lenta e progressiva ao longo de décadas, apresenta território miocárdico relativamente preservado apesar de estenose grave à angiografia, em contraste com um paciente jovem que evolui com infarto extenso após oclusão trombótica aguda de gravidade angiográfica semelhante. Em relação à circulação colateral coronariana como fator modulador da gravidade da isquemia miocárdica, assinale a alternativa correta.", "options": ["A circulação colateral se forma por neoangiogênese, sendo mais comum em obstruções crônicas e progressivas, e mais frequente em pacientes idosos", "A circulação colateral se forma por vasodilatação reflexa imediata de vasos pré-existentes, em poucos minutos, diante de qualquer obstrução coronariana aguda", "A circulação colateral influencia o desfecho clínico apenas em obstruções agudas, perdendo relevância prognóstica nas obstruções crônicas progressivas", "A circulação colateral é mais eficiente em pacientes jovens, por maior capacidade angiogênica basal do endotélio coronariano", "A formação de circulação colateral depende exclusivamente da presença de diabetes mellitus associado, não do tempo de evolução da obstrução coronariana"], "correct": 0, "explanation": ["Correta: como discutido no segmento 1, a circulação colateral se forma por neoangiogênese, um processo que demora, sendo por isso mais associada a obstruções crônicas e progressivas — e, consequentemente, mais comum em pacientes idosos, que tiveram tempo para desenvolvê-la.", "Errada: a neoangiogênese é um processo que demanda tempo (semanas a anos), incompatível com formação em minutos diante de uma obstrução aguda, como no paciente jovem do enunciado.", "Errada: é o oposto — a circulação colateral é mais relevante justamente nas obstruções crônicas progressivas, que dão tempo para sua formação, sendo um dos determinantes discutidos da gravidade final da isquemia.", "Errada: é o oposto do discutido — colaterais são mais comuns em idosos, justamente por terem tido mais tempo de obstrução crônica progressiva para desenvolvê-las, não por maior capacidade angiogênica basal.", "Errada: a formação de colaterais depende diretamente do tempo de evolução (obstruções lentas favorecem sua formação; obstruções agudas não dão tempo suficiente), e não da presença isolada de diabetes."], "source": "original"}, {"vignette": "Paciente com IAM prévio evolui, entre o 3º e o 5º dia de internação, com instalação súbita de hipotensão grave, turgência jugular, abafamento de bulhas cardíacas e pulso paradoxal; o ecocardiograma à beira do leito mostra acúmulo de conteúdo líquido no pericárdio. Assinale a alternativa que explica corretamente o mecanismo fisiopatológico do óbito.", "options": ["O período de 2 a 6-7 dias após o IAM é o de maior fragilidade da parede ventricular necrótica (digestão enzimática do tecido pelos neutrófilos), predispondo à ruptura da parede livre, hemopericárdio e tamponamento cardíaco", "Trata-se de uma arritmia fatal ocorrida nos primeiros minutos do infarto, sem qualquer alteração estrutural da parede", "A cicatriz fibrótica já consolidada, formada ao longo de mais de 6 semanas de evolução, sofreu ruptura espontânea por fragilidade colágena residual", "O quadro decorre de embolia pulmonar maciça, sem relação com o infarto miocárdico prévio", "Trata-se de síndrome de Dressler, reação autoimune peri-infarto que surge tipicamente semanas após o evento, sem risco de tamponamento agudo"], "correct": 0, "explanation": ["Correta: a tríade de Beck (hipotensão + turgência jugular + bulhas abafadas) associada a líquido pericárdico à ecocardiografia, no intervalo de dias após o IAM, é o quadro clássico de ruptura da parede livre com tamponamento cardíaco — justamente na janela de maior fragilidade mecânica do tecido necrótico.", "Errada: haveria colapso hemodinâmico imediato, sem o intervalo de dias nem o achado de líquido pericárdico compressivo.", "Errada: cicatriz fibrótica madura (>6 semanas) é tecido resistente e não se rompe espontaneamente dessa forma — a fragilidade máxima ocorre bem antes, na janela de 2 a 6-7 dias, quando a necrose ainda não foi substituída por colágeno.", "Errada: o quadro descrito é específico de tamponamento cardíaco, não de tromboembolismo pulmonar.", "Errada: a síndrome de Dressler é tardia (semanas a meses) e autoimune, incompatível com o intervalo de 3 a 5 dias e com o quadro agudo de tamponamento (tríade de Beck) descrito no caso."], "source": "adapted", "sourceLabel": "Parcial 82, Questão Aberta 1"}, {"vignette": "Um patologista, ao avaliar um coração em necropsia, precisa diferenciar se a morte de um paciente com IAM prévio ocorreu por ruptura mecânica da parede ventricular ou por arritmia fatal muito precoce. Considerando os conceitos discutidos ao longo da aula sobre morfologia temporal do infarto e complicações mecânicas, qual achado temporal tornaria a hipótese de ruptura mecânica da parede livre mais provável que a de arritmia fatal muito precoce?", "options": ["Óbito ocorrido entre o 2º e o 6º dia após o início dos sintomas isquêmicos, período de maior fragilidade estrutural do tecido necrótico", "Óbito ocorrido nos primeiros 10 minutos após o início da dor torácica, antes mesmo de qualquer alteração estrutural detectável", "Óbito ocorrido mais de 8 semanas após o evento isquêmico, quando a fibrose já estaria plenamente estabelecida e consolidada", "O intervalo de tempo entre o início dos sintomas e o óbito reflete apenas a gravidade da arritmia instalada, não ajudando a diferenciar os dois mecanismos propostos", "Ruptura mecânica da parede livre ocorre exclusivamente nas primeiras 2 horas após o início da dor torácica"], "correct": 0, "explanation": ["Correta: como discutido nos segmentos 5, 7 e 8, a janela de 2 a 6 dias é a fase de maior fragilidade mecânica do miocárdio infartado (necrose já estabelecida, mas fibrose de reparo ainda não iniciada), tornando essa a janela temporal clássica para ruptura mecânica da parede livre — diferente da arritmia fatal, que tipicamente ocorre muito mais precocemente (minutos a poucas horas).", "Errada: óbito em 10 minutos é típico de arritmia fatal (morte súbita cardíaca), não de ruptura mecânica, que exige tempo para o tecido desenvolver a fragilidade estrutural necessária.", "Errada: após 8 semanas, a fibrose já estaria consolidada e o tecido cicatricial é mais resistente, tornando a ruptura mecânica clássica menos provável (a cicatriz fibrótica madura raramente rompe da mesma forma que o tecido necrótico friável da fase aguda).", "Errada: o intervalo de tempo é justamente a informação central que permite diferenciar os dois mecanismos (arritmia fatal precocíssima versus ruptura mecânica na janela de maior fragilidade tecidual), como discutido ao longo da aula.", "Errada: ruptura mecânica da parede livre concentra-se classicamente na janela de 2-6 dias (não nas primeiras 2 horas), justamente pela necessidade de a necrose já estar estabelecida associada à fragilidade tecidual característica dessa fase."], "source": "original"}, {"image": "diagrama-infra-vs-supra-ST.jpg", "vignette": "A imagem acima esquematiza as duas metades da parede ventricular (subendocardica e subepicardica) e seus respectivos padroes eletrocardiograficos de lesao. Um paciente cuja lesao esta restrita a metade subendocardica da parede deve apresentar, no ECG, qual alteracao caracteristica do segmento ST, segundo o diagrama?", "options": ["Infradesnivelamento do segmento ST, ja que a lesao subendocardica nao atinge toda a espessura da parede", "Supradesnivelamento do segmento ST, identico ao padrao da lesao transmural", "Nenhuma alteracao especifica de ST, pois a lesao subendocardica se manifesta preferencialmente por alteracoes isoladas da onda T, e nao do segmento ST", "Inversao da onda P associada a discreto infradesnivelamento de ST, achado combinado tipico da lesao subendocardica segundo o diagrama", "Bloqueio de ramo completo associado a supradesnivelamento de ST, padrao caracteristico atribuido pelo diagrama a lesao subendocardica extensa"], "correct": 0, "explanation": ["Correta: como ilustrado no diagrama e discutido no segmento 4, a lesao subendocardica (que nao atinge toda a espessura da parede) se traduz classicamente em infradesnivelamento do segmento ST, diferente da lesao transmural, que causa supradesnivelamento.", "Errada: supradesnivelamento e o padrao da lesao transmural (toda a espessura da parede), nao da lesao subendocardica isolada.", "Errada: lesoes subendocardicas tem, sim, traducao eletrocardiografica caracteristica de ST (infradesnivelamento), conforme o diagrama discutido no segmento 4, e nao apenas alteracoes de onda T.", "Errada: o diagrama trata da relacao entre profundidade da lesao na parede ventricular e o segmento ST isoladamente, nao havendo alteracao de onda P associada a esse padrao.", "Errada: bloqueio de ramo nao e o achado correlacionado a profundidade da lesao isquemica discutido no diagrama, e supradesnivelamento de ST e o padrao da lesao transmural, nao da subendocardica."], "source": "original"}]}</script>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const IMAGES = JSON.parse(document.getElementById('app-images').textContent);
const SEGMENTS = DATA.segments;
const QUIZ = DATA.quiz;

// Estado: respostas do usuário por pergunta, para persistir enquanto navega nesta sessão
const answered = {}; // key -> selectedIndex

let currentView = 'home'; // 'home' | 's1'..'s8' | 'quiz'

function resolveImages(html){
  return html.replace(/\{([a-zA-Z0-9_.\-]+\.jpg)\}/g, function(m, key){
    return IMAGES[key] || '';
  });
}

function letterFor(i){ return String.fromCharCode(65+i); }

function renderFigure(imgObj){
  const src = IMAGES[imgObj.key] || '';
  return `<figure class="fig-wrap">
    <img loading=lazy decoding=async class="fig" src="${src}" alt="${escapeHtml(imgObj.caption.slice(0,80))}">
    <figcaption>${escapeHtml(imgObj.caption)}</figcaption>
  </figure>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderQuestionCard(q, keyId, idxLabel){
  const optsHtml = q.options.map((opt,i)=>{
    return `<button class="qoption" data-idx="${i}" onclick="selectAnswer('${keyId}', ${i}, ${q.correct}, this)">
      <span class="optletter">${letterFor(i)}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join('');

  const imgHtml = q.image ? `<img loading=lazy decoding=async class="qimg" src="${IMAGES[q.image]||''}" alt="Imagem da questão">` : '';

  const srcMap = {
    real: 'Prova real — ' + (q.sourceLabel||''),
    adapted: 'Adaptada da ' + (q.sourceLabel||''),
    original: 'Questão da aula'
  };
  const srcClass = q.source || 'original';
  const srcBadge = `<span class="q-source ${srcClass}">${srcMap[srcClass] || 'Questão da aula'}</span>`;

  return `<div class="qcard" id="qcard-${keyId}">
    ${srcBadge}
    <div class="qmeta">${idxLabel}</div>
    ${imgHtml}
    <p class="qvignette">${escapeHtml(q.vignette)}</p>
    <div class="qoptions" id="opts-${keyId}">${optsHtml}</div>
    <div class="qfeedback" id="fb-${keyId}"></div>
  </div>`;
}

function selectAnswer(keyId, chosenIdx, correctIdx, btnEl){
  if (answered[keyId] !== undefined) return; // já respondida
  answered[keyId] = chosenIdx;

  const optsWrap = document.getElementById('opts-'+keyId);
  const buttons = optsWrap.querySelectorAll('.qoption');
  buttons.forEach((b,i)=>{
    b.setAttribute('disabled','disabled');
    if (i === correctIdx) b.classList.add('reveal-correct');
    if (i === chosenIdx && i !== correctIdx) b.classList.add('selected-incorrect');
    if (i === chosenIdx && i === correctIdx) b.classList.add('selected-correct');
  });

  const fb = document.getElementById('fb-'+keyId);
  const q = getQuestionByKey(keyId);
  const isCorrect = chosenIdx === correctIdx;
  fb.className = 'qfeedback show ' + (isCorrect ? 'ok' : 'bad');
  let explainHtml = '';
  if (q.explanation && q.explanation.length){
    explainHtml = '<div class="fb-explain">' + q.explanation.map((e,i)=>`<div>${letterFor(i)}) ${escapeHtml(e)}</div>`).join('') + '</div>';
  }
  fb.innerHTML = `<div class="fb-title">${isCorrect ? '✓ Correto' : '✕ Não é essa'}</div>${explainHtml}`;

  if (keyId.startsWith('quiz-')) updateQuizProgress();
}

// registro global das perguntas para lookup por keyId
const QUESTION_INDEX = {};
SEGMENTS.forEach(s=>{
  s.questions.forEach((q,i)=>{
    QUESTION_INDEX[`${s.id}-q${i}`] = q;
  });
});
QUIZ.forEach((q,i)=>{ QUESTION_INDEX[`quiz-${i}`] = q; });

function getQuestionByKey(keyId){ return QUESTION_INDEX[keyId]; }

function renderSegment(seg){
  let html = '';
  html += `<div class="seg-eyebrow">Segmento ${seg.num} de ${SEGMENTS.length}</div>`;
  html += `<h2 class="seg-title">${escapeHtml(seg.title)}</h2>`;

  // conteúdo — precisa resolver placeholders {arquivo.jpg} dentro de <img loading=lazy decoding=async> e também inserir figuras dedicadas via seg.images
  let bodyHtml = resolveImages(seg.content);
  // envolve as tags <img loading=lazy decoding=async src="..." class="fig"> com figure + acha a legenda correspondente pela ordem
  let imgPointer = 0;
  bodyHtml = bodyHtml.replace(/<img loading=lazy decoding=async src="([^"]+)" class="fig">/g, function(m, src){
    let cap = '';
    if (seg.images[imgPointer]) { cap = seg.images[imgPointer].caption; }
    imgPointer++;
    return `<figure class="fig-wrap"><img loading=lazy decoding=async class="fig" src="${src}" alt="${escapeHtml((cap||'').slice(0,80))}"><figcaption>${escapeHtml(cap)}</figcaption></figure>`;
  });

  html += `<div class="content-body">${bodyHtml}</div>`;

  html += `<div class="qsection">
    <div class="qsection-title">Perguntas de verificação — Segmento ${seg.num}</div>`;
  seg.questions.forEach((q,i)=>{
    html += renderQuestionCard(q, `${seg.id}-q${i}`, `Questão ${i+1} de 3`);
  });
  html += `</div>`;

  const idx = SEGMENTS.findIndex(s=>s.id===seg.id);
  const prev = idx>0 ? SEGMENTS[idx-1] : null;
  const next = idx<SEGMENTS.length-1 ? SEGMENTS[idx+1] : null;

  html += `<div class="segnav">
    <div>${prev ? `<button class="pillbtn ghost" onclick="goTo('${prev.id}')">← ${escapeHtml(prev.title.split(':')[0])}</button>` : `<button class="pillbtn ghost" onclick="goTo('home')">← Início</button>`}</div>
    <div>${next ? `<button class="pillbtn" onclick="goTo('${next.id}')">${escapeHtml(next.title.split(':')[0])} →</button>` : `<button class="pillbtn" onclick="goTo('quiz')">Ir para o Quiz Final →</button>`}</div>
  </div>`;

  html += `<div class="footer-note">Masterclass gerada a partir do material de aula "Sistema Cardiovascular — Aula 2: Cardiopatia Isquêmica" (CMMG). Trechos marcados com 📌 EXTRA foram acrescentados além do conteúdo original do PDF.</div>`;

  document.getElementById('content').innerHTML = html;
  document.getElementById('progressLabel').textContent = `Segmento ${seg.num} · ${seg.title}`;
  document.getElementById('progressFill').style.width = `${(seg.num/(SEGMENTS.length+1))*100}%`;
}

function updateQuizProgress(){
  const answeredCount = QUIZ.filter((q,i)=>answered[`quiz-${i}`]!==undefined).length;
  const el = document.getElementById('quizProgressText');
  if (el) el.textContent = `${answeredCount} de ${QUIZ.length} respondidas`;

  if (answeredCount === QUIZ.length){
    let correctCount = 0;
    QUIZ.forEach((q,i)=>{ if (answered[`quiz-${i}`] === q.correct) correctCount++; });
    const scoreWrap = document.getElementById('quizScoreWrap');
    if (scoreWrap){
      const pct = Math.round((correctCount/QUIZ.length)*100);
      let msg = 'Vale revisar os segmentos com mais atenção antes da prova.';
      if (pct >= 80) msg = 'Excelente domínio do conteúdo — pronto para residência.';
      else if (pct >= 60) msg = 'Bom resultado — revise os pontos que errou antes da prova.';
      scoreWrap.innerHTML = `<div class="scorebox">
        <div class="big">${correctCount}<span style="font-size:28px;color:var(--ink-soft)">/${QUIZ.length}</span></div>

}

function goTo(view){
  currentView = view;
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else {
    const seg = SEGMENTS.find(s=>s.id===view);
    if (seg) renderSegment(seg);
