 /* S2 */
 {id:'s2', title:'Patologia: lobar, broncopneumonia e intersticial', short:'Patologia', d:['pato'],
  quick: `
  ${D.svg(svgFases,'As quatro fases clássicas da pneumonia lobar.')}
  ${D.tbl(['Padrão','Lesão','Agentes típicos'],[
   ['<b>Lobar</b>','exsudato preenche um lobo inteiro de forma homogênea','<b>S. pneumoniae</b>, Klebsiella'],
   ['<b>Broncopneumonia</b>','focos múltiplos, centrados em bronquíolos, em um ou ambos os pulmões','<b>S. aureus</b>, <b>H. influenzae</b>, Gram-negativos'],
   ['<b>Intersticial</b>','inflamação dos <b>septos</b>, alvéolos sem exsudato (membranas hialinas)','<b>vírus</b>, atípicos (Mycoplasma, Chlamydophila)']])}
  <p>Complicações: abscesso, <b>derrame parapneumônico</b>, <b>empiema</b>, bacteremia (meningite, endocardite).</p>`,
  deep: `
  <h3>A pneumonia lobar e suas fases</h3>
  ${D.svg(svgFases,'Congestão → hepatização vermelha → hepatização cinzenta → resolução. Fases didáticas; o antibiótico interrompe a sequência.')}
  <ol>
   <li><b>Congestão</b> (1–2 dias): pulmão pesado, vermelho, úmido; capilares ingurgitados, alvéolos com edema seroso, poucos neutrófilos e muitas bactérias.</li>
   <li><b>Hepatização vermelha</b> (2–4 dias): alvéolos repletos de <b>neutrófilos, hemácias e fibrina</b>; o lobo fica firme, sem ar, vermelho e com consistência de fígado. É aqui que a semiologia de consolidação é mais exuberante e o escarro pode ser cor de ferrugem.</li>
   <li><b>Hepatização cinzenta</b> (4–8 dias): hemácias lisadas, persistência de fibrina e neutrófilos degenerados; superfície seca e acinzentada.</li>
   <li><b>Resolução</b> (&gt; 8 dias): enzimas digerem o exsudato, que é reabsorvido, expectorado ou fagocitado por macrófagos; como o arcabouço não foi destruído, a arquitetura é restaurada. Se o exsudato se organiza (fibroblastos), há <b>carnificação</b>.</li>
  </ol>
  ${D.fig('img/c6-lobar-macro.jpg','Pneumonia lobar, macroscopia: um lobo inteiro consolidado, de aspecto sólido e homogêneo, contrastando com o lobo aerado.', WC)}
  ${D.fig('img/c6-lobar-he.jpg','Pneumonia lobar aguda (HE): alvéolos preenchidos por exsudato rico em neutrófilos e fibrina, com septos preservados — por isso a resolução restaura a arquitetura.', WC)}
  ${D.fig('img/c6-lobar-40x.jpg','Biópsia pulmonar em maior aumento: espaços alveolares abarrotados de neutrófilos.', WC)}
  <h3>Broncopneumonia</h3>
  <p>Começa nos <b>bronquíolos</b> e se espalha aos alvéolos vizinhos, formando <b>focos múltiplos</b>, frequentemente bilaterais e basais. Típica de extremos de idade, debilitados, pós-viral, aspirativa e hospitalar. Agentes: <b>S. aureus</b>, <b>H. influenzae</b>, Pseudomonas, Klebsiella.</p>
  ${D.fig('img/c6-bronco-he.jpg','Broncopneumonia (HE): exsudato neutrofílico centrado em bronquíolo e alvéolos adjacentes, com parênquima aerado entre os focos.', WC)}
  <h3>Pneumonia intersticial (atípica)</h3>
  <p>A inflamação ocupa os <b>septos alveolares</b> (linfócitos, macrófagos, plasmócitos), com alvéolos relativamente livres de exsudato; nos casos graves, <b>membranas hialinas</b> (dano alveolar difuso). Clínica “atípica”: tosse seca, sintomas sistêmicos maiores que os achados de exame, raio-X pior que o exame físico. Agentes: <b>vírus</b> (influenza, SARS-CoV-2, VSR) e <b>atípicos</b> (Mycoplasma, Chlamydophila, Legionella).</p>
  <h3>Complicações</h3>
  <ul>
   <li><b>Abscesso</b>: necrose liquefativa com cavitação (S. aureus, Klebsiella, anaeróbios da aspiração).</li>
   <li><b>Derrame parapneumônico</b> e <b>empiema</b> (pus no espaço pleural) — ver seção 5.</li>
   <li><b>Bacteremia</b> com focos à distância: meningite, endocardite, artrite séptica.</li>
  </ul>
  ${D.integ('<p>Necrose <b>liquefativa</b> no abscesso pulmonar (enzimas de neutrófilos) — o mesmo tipo de necrose do infarto cerebral (${D.lk(9,"AVC")}). Na pneumonia lobar não complicada não há necrose: o septo sobrevive.</p>','Integração · Patologia')}`,
  qs:[
   {q:'Lobo firme, vermelho, sem ar, com alvéolos repletos de neutrófilos, hemácias e fibrina. Fase:',
    o:['Congestão','Hepatização vermelha','Hepatização cinzenta','Resolução','Carnificação'], a:1, d:['pato'], e:'Consistência de fígado + hemácias.'},
   {q:'Inflamação predominante nos septos alveolares com alvéolos livres de exsudato sugere:',
    o:['Pneumonia lobar pneumocócica','Broncopneumonia estafilocócica','Pneumonia intersticial viral ou por atípicos','Abscesso pulmonar','Empiema'], a:2, d:['pato','micro'], e:'Padrão intersticial.'},
   {q:'Por que a pneumonia lobar não complicada costuma restaurar totalmente a arquitetura pulmonar?',
    o:['Porque há necrose coagulativa','Porque os septos alveolares não são destruídos e o exsudato é reabsorvido','Porque forma granulomas','Porque há fibrose reparadora','Porque não há neutrófilos'], a:1, d:['pato'], hard:true, e:'Arcabouço preservado.'}
  ]},

 {id:'s3', title:'Microbiologia: quem causa a PAC', short:'Agentes', d:['micro'],
  quick: `
  ${D.tbl(['Agente','Pistas'],[
   ['<b>S. pneumoniae</b>','Gram + <b>diplococo lanceolado</b>, cápsula; α-hemolítico, catalase −, <b>optoquina sensível</b>, bile solúvel. Lobar, escarro ferruginoso.'],

  deep: `
  <h3>Streptococcus pneumoniae, o pneumococo</h3>
  ${D.fig('img/c6-pneumo-gram.jpg','Gram de S. pneumoniae: cocos Gram-positivos aos pares (diplococos), em forma de chama de vela (lanceolados).', WC)}
  ${D.fig('img/c6-pneumo-escarro.jpg','Escarro corado pelo Gram: diplococos Gram-positivos encapsulados (halo claro ao redor) entre neutrófilos — amostra de boa qualidade.', WC)}
  ${D.tbl(['Característica','Detalhe'],[
   ['Morfologia','<b>diplococo Gram-positivo lanceolado</b>'],
   ['Provas','<b>catalase negativo</b> (diferencia de estafilococos), <b>α-hemolítico</b> (esverdeado em ágar-sangue), <b>sensível à optoquina</b> e <b>solúvel em bile</b> (diferencia de S. viridans)'],
   ['Principal fator de virulência','<b>cápsula polissacarídica</b> — antifagocítica; base das vacinas (&gt; 90 sorotipos)'],
   ['Outros','<b>pneumolisina</b> (toxina que forma poros), <b>IgA protease</b>, autolisina'],
   ['Reservatório e transmissão','nasofaringe humana (colonização), gotículas'],
   ['Doenças','pneumonia, otite média, sinusite, <b>meningite</b>, bacteremia']])}
  ${D.pearl('<p>Como a cápsula é o principal fator de virulência, a defesa depende de <b>anticorpos opsonizantes</b> + complemento + <b>baço</b>. Asplênicos e portadores de anemia falciforme têm infecções pneumocócicas fulminantes. A vacina conjugada transforma o polissacarídeo em antígeno T-dependente (memória, eficaz em lactentes) — ${D.lk(1,"Vacinação")}.</p>')}
  <h3>Outros agentes</h3>
  <ul>
   <li><b>Haemophilus influenzae</b>: cocobacilo Gram-negativo; DPOC (${D.lk(5,'DPOC')}), idosos.</li>
   <li><b>Staphylococcus aureus</b>: cocos Gram-positivos em cachos, catalase e coagulase positivos; pneumonia necrosante, frequentemente <b>após influenza</b>; pneumatoceles.</li>
   <li><b>Klebsiella pneumoniae</b>: bacilo Gram-negativo com cápsula espessa; etilistas e diabéticos; escarro mucoide-sanguinolento em “geleia de groselha”; abaulamento de cisura.</li>
   <li><b>Atípicos</b>: <i>Mycoplasma pneumoniae</i> (sem parede: imune aos β-lactâmicos; crioaglutininas; jovens), <i>Chlamydophila pneumoniae</i> e <i>Legionella pneumophila</i> (intracelulares; Legionella dá quadro grave, diarreia, hiponatremia, diagnóstico por antígeno urinário).</li>
   <li><b>Vírus</b>: influenza A (H1N1) — infiltrado intersticial bilateral —, SARS-CoV-2, VSR.</li>
   <li><b>Anaeróbios</b> da orofaringe: aspiração, abscesso.</li>
   <li><b>Fungos</b>: <i>Histoplasma capsulatum</i> (cavernas, morcegos), <i>Coccidioides</i>, <i>Pneumocystis jirovecii</i> no imunossuprimido.</li>
  </ul>
  ${D.trap('<p><b>Pneumococo × S. aureus no Gram</b>: ambos Gram-positivos, mas o pneumococo é diplococo lanceolado e <b>catalase-negativo</b>; o estafilococo forma <b>cachos</b> e é <b>catalase-positivo</b>.</p>')}`,
  qs:[
   {q:'Cocos Gram-positivos aos pares, lanceolados, α-hemolíticos, sensíveis à optoquina. Agente:',
    o:['S. aureus','S. pyogenes','S. pneumoniae','Enterococcus','S. viridans'], a:2, d:['micro'], e:'Optoquina sensível e bile solúvel = pneumococo.', img:'img/c6-pneumo-gram.jpg'},
   {q:'Principal fator de virulência do pneumococo, alvo das vacinas:',
    o:['Pneumolisina','Proteína A','Cápsula polissacarídica','Lipopolissacarídeo','Coagulase'], a:2, d:['micro','prev'], e:'Antifagocítica; sorotipos definidos por ela.'},
   {q:'Por que β-lactâmicos não tratam Mycoplasma pneumoniae?',
    o:['Porque produz β-lactamase','Porque não tem parede celular','Porque é intracelular obrigatório','Porque tem cápsula','Porque é Gram-negativo'], a:1, d:['micro','farmaco'], e:'β-lactâmicos inibem síntese de parede (PBP).'}

 {id:'s4', title:'Semiologia: FTV, percussão e ruídos', short:'Semiologia', d:['semio','prope'],
  quick: `
  ${D.svg(svgFTV,'Consolidação aumenta a transmissão do som; derrame a bloqueia.')}
  ${D.tbl(['Síndrome','Expansibilidade','FTV','Percussão','Ausculta'],[
   ['<b>Consolidação</b> (pneumonia)','↓ local','<b>↑</b>','<b>maciça/submaciça</b>','crepitantes, <b>sopro tubário</b>, broncofonia/egofonia ↑'],
   ['<b>Derrame pleural</b>','↓','<b>↓ ou abolido</b>','<b>maciça</b> (Signorelli)','MV ↓/abolido; egofonia na borda superior'],
   ['<b>Pneumotórax</b>','↓','↓/abolido','<b>timpânica</b>','MV abolido'],
   ['Atelectasia','↓','↓ (brônquio ocluído)','maciça','MV abolido; desvio para o lado'],
   ['Hiperinsuflação (DPOC)','↓ difusa','↓','hipersonora','MV ↓ difuso']])}
  <div class="widget" data-w="pulmao" data-cfg="c6"></div>`,
  deep: `
  <h3>Como se forma o frêmito toracovocal</h3>
  <p>A voz (ex.: “trinta e três”) faz vibrar as cordas vocais; a vibração percorre a coluna de ar da traqueia e dos brônquios, passa ao parênquima e chega à parede, onde a mão a percebe. O pulmão normal, cheio de ar entremeado de septos, é um <b>mau condutor</b>: funciona como filtro que atenua sobretudo as frequências altas. Tudo o que <b>torna o meio mais homogêneo e denso</b> (consolidação) <b>melhora</b> a transmissão; tudo o que <b>interpõe uma barreira</b> entre o pulmão e a parede (líquido ou ar na pleura, espessamento pleural) ou <b>impede a entrada do som</b> (brônquio obstruído) a <b>reduz</b>.</p>
  ${D.svg(svgFTV,'A condição para o FTV aumentar é dupla: parênquima consolidado E brônquio pérvio levando a vibração até ele.')}
  <h3>Percussão</h3>
  <p>O som depende da relação ar/tecido sob o dedo. <b>Som claro pulmonar</b> no normal; <b>maciço/submaciço</b> quando o ar é substituído por exsudato (consolidação) ou líquido (derrame); <b>hipersonoro</b> no excesso de ar no parênquima (enfisema); <b>timpânico</b> com ar livre na pleura (pneumotórax).</p>
  <h3>Sons respiratórios e ruídos adventícios</h3>
  <ul>
   <li><b>Murmúrio vesicular</b>: som de baixa intensidade gerado pela turbulência nas vias de médio calibre e filtrado pelo parênquima.</li>
   <li><b>Som brônquico/traqueal</b>: audível normalmente sobre a traqueia; quando aparece na periferia, sobre parênquima consolidado com brônquio pérvio, chama-se <b>sopro tubário</b> — o parênquima sólido deixa de filtrar.</li>
   <li><b>Estertores finos (crepitantes)</b>: teleinspiratórios, não mudam com a tosse; abertura súbita de alvéolos/bronquíolos colabados por exsudato ou transudato (pneumonia, congestão, fibrose).</li>
   <li><b>Estertores grossos (bolhosos)</b>: início da inspiração e expiração, mudam com a tosse; secreção nas vias maiores.</li>
   <li><b>Sibilos</b> e <b>roncos</b>: estreitamento das vias (Leito 05).</li>
   <li><b>Atrito pleural</b>: folhetos inflamados; nos dois tempos; associado à dor pleurítica.</li>
  </ul>
  <h3>Ressonância vocal</h3>
  <p>Na consolidação: <b>broncofonia</b> (voz mais nítida), <b>pectorilóquia</b> (sílabas distinguíveis, inclusive sussurradas — pectorilóquia áfona) e <b>egofonia</b> (“i” soa como “ê”, voz anasalada, “de cabra”), mais típica na borda superior de um derrame.</p>
  <div class="widget" data-w="pulmao" data-cfg="c6"></div>
  ${D.trap('<p><b>Consolidação × derrame</b>: ambos são maciços à percussão. Quem separa é o <b>FTV</b> — aumentado na consolidação, diminuído/abolido no derrame. Se o paciente tiver as duas coisas (pneumonia com derrame), o FTV estará ↑ acima e ↓ abaixo da linha do líquido.</p>')}
  ${D.integ('<p>O mesmo estertor crepitante aparece na <b>congestão</b> da IC (${D.lk(4,"ICC chagásica")}), mas lá é bilateral, de bases, sem febre, com FTV normal; na pneumonia, é focal e vem com sinais de consolidação.</p>','Integração')}`,
  qs:[
   {q:'Base direita com macicez, FTV abolido e MV abolido. Síndrome mais provável:',
    o:['Consolidação','Derrame pleural','Pneumotórax','Enfisema','Normal'], a:1, d:['semio'], e:'Líquido pleural é barreira: FTV ↓.'},
   {q:'Sopro tubário na periferia do tórax indica:',
    o:['Pneumotórax','Consolidação com brônquio pérvio','Derrame volumoso','Broncoespasmo','Obesidade'], a:1, d:['semio'], e:'Parênquima sólido conduz o som brônquico.'},
   {q:'Por que o FTV está aumentado no paciente?',
    o:['Porque há ar na pleura','Porque o exsudato substitui o ar alveolar e torna o meio melhor condutor da vibração','Porque o pulmão está hiperinsuflado','Porque o brônquio está ocluído','Porque há espessamento pleural'], a:1, d:['semio','fisio'], e:'Meio homogêneo = melhor condução.'}
  ]},
 /* S5 */
 {id:'s5', title:'Derrame pleural: exsudato × transudato', short:'Exsudato × transudato', d:['lab','pato','fisio'],
  quick: `
  ${D.tbl(['','Transudato','Exsudato'],[
   ['Mecanismo','<b>pressões</b> (hidrostática ↑ ou oncótica ↓), membrana íntegra','<b>permeabilidade ↑</b> (inflamação, infecção, neoplasia) ou drenagem linfática ↓'],
   ['Aspecto','límpido, citrino, pobre em células e proteínas','turvo, rico em proteínas, células, fibrina'],
   ['Causas','<b>IC</b>, cirrose, síndrome nefrótica, hipoalbuminemia','<b>pneumonia</b>, TB, câncer, TEP, colagenoses, pancreatite']])}
  <p><b>Light: exsudato se ≥ 1</b> → proteína P/S &gt; 0,5 · LDH P/S &gt; 0,6 · LDH pleural &gt; 2/3 do limite superior da sérica.</p>
  <p><b>Derrame parapneumônico complicado/empiema</b> → <b>drenar</b>: pus, Gram/cultura +, <b>pH &lt; 7,2</b>, <b>glicose &lt; 60</b>.</p>
  <div class="widget" data-w="light"></div>`,
  deep: `
  <h3>Starling na pleura</h3>
  <p>O líquido pleural normal (poucos mL) é filtrado pelos capilares da pleura parietal e drenado pelos linfáticos. O derrame surge quando a entrada supera a saída. Lembrando as forças de Starling (${D.lk(4,'ICC chagásica')}): se a <b>pressão hidrostática sobe</b> (IC) ou a <b>oncótica cai</b> (hipoalbuminemia), o líquido filtrado é pobre em proteína: <b>transudato</b>. Se a <b>permeabilidade aumenta</b> (inflamação: histamina, citocinas, lesão endotelial) ou a <b>drenagem linfática falha</b> (tumor), passam proteínas, células e fibrina: <b>exsudato</b>.</p>
  ${D.integ('<p>É o mesmo conceito da Patologia Geral: <b>edema</b> transudativo (hemodinâmico) × <b>exsudato</b> inflamatório (aumento de permeabilidade vascular). Exsudato purulento = pus (neutrófilos + restos necróticos).</p>','Integração · Patologia')}
  <h3>Como identificar: toracocentese e critérios de Light</h3>
  <p>Todo derrame novo e significativo (&gt; 10 mm na USG ou no decúbito lateral) sem causa óbvia deve ser puncionado. Mede-se proteína e LDH no líquido e no soro. O derrame é <b>exsudato se preencher pelo menos um</b> critério:</p>
  <ol><li>proteína pleural / sérica <b>&gt; 0,5</b></li><li>LDH pleural / sérica <b>&gt; 0,6</b></li><li>LDH pleural <b>&gt; 2/3</b> do limite superior normal da LDH sérica</li></ol>
  <div class="widget" data-w="light"></div>
  ${D.extra('<p>Light é muito sensível para exsudato, mas classifica erroneamente ~25% dos transudatos de pacientes com IC em uso de diurético (o diurético concentra proteína). Nesse caso, um <b>gradiente de albumina soro − pleura &gt; 1,2 g/dL</b> confirma transudato.</p>')}
  <h3>Derrame parapneumônico</h3>
  ${D.tbl(['Tipo','Características','Conduta'],[
   ['Não complicado','exsudato estéril, pH ≥ 7,2, glicose ≥ 60','antibiótico'],
   ['Complicado','invasão bacteriana: <b>pH &lt; 7,2</b>, <b>glicose &lt; 60 mg/dL</b>, LDH muito alta, Gram/cultura +, loculações','<b>drenagem torácica</b> + antibiótico'],
   ['Empiema','<b>pus</b> no espaço pleural','<b>drenagem</b> (± fibrinolítico, cirurgia)']])}
  <p>Por que pH e glicose caem? Neutrófilos e bactérias consomem glicose por glicólise e produzem ácido lático e CO₂, que não são removidos de um espaço loculado.</p>
  ${D.fig('img/c6-derrame.jpg','Derrame pleural em radiografia com decúbito lateral (imagem rotacionada): o líquido livre escorre para a parede dependente e forma uma faixa opaca; as setas medem sua espessura (≥ 10 mm = volume suficiente para puncionar).', WC)}
  ${D.extra('<p>Outros dados do líquido: <b>ADA &gt; 40 U/L</b> com linfócitos sugere tuberculose; citologia oncótica para neoplasia; triglicerídeos &gt; 110 mg/dL = quilotórax; amilase alta = pancreatite ou ruptura esofágica.</p>')}`,

 {id:'s6', title:'Raio-X de tórax na pneumonia', short:'Raio-X', d:['lab'],
  quick: `
  <ul>
   <li><b>Consolidação</b>: opacidade homogênea com <b>broncograma aéreo</b> (brônquios com ar desenhados sobre alvéolos opacos).</li>
   <li><b>Sinal da silhueta</b>: opacidade que apaga a borda de uma estrutura está em contato com ela. Borda cardíaca D = <b>lobo médio</b>; hemidiafragma D = <b>lobo inferior</b>; botão aórtico = LSE; borda cardíaca E = língula.</li>
   <li>Padrões: <b>lobar</b> (lobo inteiro), <b>broncopneumonia</b> (focos múltiplos), <b>intersticial</b> (reticular difuso, viral/atípico).</li>
   <li>Derrame: velamento do seio costofrênico, curva de Damoiseau.</li>
  </ul>
  ${D.fig('img/c6-slide-lid.jpg','Pneumonia em lobo inferior direito: opacidade na base direita (setas), com a borda cardíaca direita preservada.', SL)}`,
  deep: `
  <h3>O que procurar</h3>
  <p>O raio-X confirma a pneumonia (infiltrado novo), mostra a extensão (multilobar = gravidade), detecta complicações (derrame, cavitação) e serve de base para comparação. A consolidação aparece como <b>opacidade</b> homogênea, de limites mal definidos (exceto onde encosta numa cisura), frequentemente com <b>broncograma aéreo</b>: o brônquio continua com ar, e por isso aparece escuro desenhado sobre o fundo branco dos alvéolos preenchidos.</p>
  <h3>Sinal da silhueta (localização)</h3>
  <p>Duas estruturas de mesma densidade em contato perdem o contorno entre si. Opacidade que <b>apaga a borda cardíaca direita</b> está no <b>lobo médio</b> (anterior); a que <b>apaga o hemidiafragma direito</b> e preserva a borda cardíaca está no <b>lobo inferior</b> (posterior). O <b>perfil</b> confirma.</p>
  ${D.fig('img/c6-slide-lobar-paperfil.jpg','PA (A) e perfil (B) de pneumonia lobar: no perfil, a opacidade se projeta sobre a coluna/posterior, limitada pela cisura (setas).', SL)}
  ${D.fig('img/c6-slide-lobar-medio.jpg','Pneumonia lobar: área de condensação no terço médio do pulmão direito.', SL)}
  ${D.fig('img/c6-slide-lse.jpg','Pneumonia em lobo superior esquerdo.', SL)}
  <h3>Padrões morfológicos</h3>
  ${D.fig('img/c6-slide-bronco.jpg','Broncopneumonia bilateral: múltiplos focos de opacidade, mal definidos, em ambos os pulmões.', SL)}
  ${D.fig('img/c6-slide-intersticial.jpg','Padrão intersticial: opacidades reticulares difusas, inflamação dos septos (vírus e atípicos).', SL)}
  ${D.fig('img/c6-slide-h1n1.jpg','Pneumonia por influenza A (H1N1): infiltrados intersticiais difusos, bilaterais, peribrônquicos, consolidações menos definidas.', SL)}
  ${D.extra('<p>A melhora radiológica é <b>lenta</b> (semanas a 2–3 meses, mais em idosos): não se repete raio-X para “ver se curou” antes de 6–8 semanas, salvo piora clínica. Em tabagistas e &gt; 50 anos, um controle tardio ajuda a afastar neoplasia por trás da pneumonia (${D.lk(3,"Câncer de pulmão")}). A <b>USG pulmonar</b> à beira-leito detecta consolidação (hepatização) e derrame com boa acurácia.</p>')}`,
  qs:[
   {q:'Opacidade que apaga a borda cardíaca direita, com hemidiafragma visível. Localização:',
    o:['Lobo inferior direito','Lobo médio','Lobo superior direito','Língula','Lobo inferior esquerdo'], a:1, d:['lab'], e:'Sinal da silhueta.'},
   {q:'Opacidade bilateral, reticular, difusa, em paciente com quadro gripal grave. Padrão e agente provável:',
    o:['Lobar; pneumococo','Intersticial; vírus (ex.: influenza)','Broncopneumonia; S. aureus','Derrame; TB','Abscesso; anaeróbios'], a:1, d:['lab','micro'], e:'Padrão intersticial.', img:'img/c6-slide-h1n1.jpg'},
   {q:'O broncograma aéreo significa:',
    o:['Brônquio obstruído','Ar nos brônquios dentro de parênquima consolidado','Pneumotórax','Derrame pleural','Enfisema'], a:1, d:['lab'], e:'Sinal de consolidação alveolar.'}
  ]},
 /* S7 */
 {id:'s7', title:'Laboratório, sepse e rim', short:'Laboratório', d:['lab','fisio'],
  quick: `
  <ul>
   <li><b>Leucocitose com desvio à esquerda</b> (bastões ↑): medula libera formas jovens por G-CSF/IL-1/TNF.</li>
   <li><b>PCR</b> e procalcitonina ↑: fase aguda (IL-6 → fígado).</li>
   <li>Internado: <b>hemoculturas</b>, escarro (Gram/cultura), <b>antígeno urinário</b> pneumococo/Legionella, gasometria, <b>lactato</b>.</li>
   <li>Ureia 48 / creatinina 1,4 + hipotensão → provável <b>LRA pré-renal</b> (hipoperfusão na sepse).</li>
  </ul>`,
  deep: `
  <h3>Hemograma</h3>
  <p><b>Leucocitose neutrofílica com desvio à esquerda</b>: IL-1, TNF e G-CSF mobilizam o pool marginal e aceleram a saída de neutrófilos da medula, inclusive <b>bastões</b> e formas mais jovens (${D.lk(7,'Hemograma')}). Granulações tóxicas e corpúsculos de Döhle podem aparecer. <b>Leucopenia</b> (&lt; 4.000) numa pneumonia é sinal de <b>gravidade</b>, não de benignidade.</p>
  <h3>Resposta de fase aguda</h3>
  <p>Macrófagos alveolares liberam <b>IL-1, IL-6 e TNF-α</b>. A IL-6 faz o fígado produzir <b>PCR</b>, fibrinogênio e ferritina; IL-1 e TNF atuam no hipotálamo (PGE2 → febre). A <b>procalcitonina</b> sobe mais em infecção bacteriana que viral e ajuda a decidir a suspensão do antibiótico.</p>
  <h3>Microbiológico (no internado)</h3>
  <ul>
   <li><b>Hemoculturas</b> (2 pares) antes do antibiótico, sem atrasá-lo.</li>
   <li><b>Escarro</b>: Gram e cultura — amostra válida tem &gt; 25 neutrófilos e &lt; 10 células epiteliais por campo de pequeno aumento.</li>
   <li><b>Antígenos urinários</b> de pneumococo e Legionella; PCR viral (influenza, SARS-CoV-2).</li>
  </ul>
  <h3>Sepse, oxigenação e rim</h3>
  <p>Sepse é disfunção orgânica por resposta desregulada à infecção. No paciente: <b>neurológica</b> (confusão), <b>respiratória</b> (SatO₂ 88%, FR 32), <b>cardiovascular</b> (95/60, FC 110) e <b>renal</b> (creatinina 1,4). Vasodilatação mediada por NO e citocinas, extravasamento capilar e hipovolemia (febre, taquipneia, baixa ingesta) reduzem a perfusão renal → <b>LRA pré-renal</b>: a relação ureia/creatinina alta e a recuperação com volume a caracterizam. Conduta: hemoculturas, <b>antibiótico na primeira hora</b>, lactato, <b>cristaloide 30 mL/kg</b> se hipotensão ou lactato ≥ 4, vasopressor se PAM &lt; 65 após volume.</p>
  ${D.integ('<p><b>Losartana</b>: em hipotensão e LRA, suspender temporariamente (o BRA dilata a arteríola eferente e reduz a pressão de filtração quando o rim depende da angiotensina II). <b>Ajuste de dose</b> dos antibióticos pelo clearance de creatinina — ${D.lk(8,"Fármaco e rim")}.</p>','Integração · Farmacologia e rim')}
  ${D.extra('<p><b>Gasometria</b> provável: hipoxemia com hipocapnia (taquipneia) — alcalose respiratória; se houver hipoperfusão, acidose metabólica com lactato alto. SatO₂ alvo 92–96% (não é DPOC).</p>')}`,
  qs:[
   {q:'O “desvio à esquerda” no hemograma corresponde a:',
    o:['Linfocitose','Aumento de formas jovens de neutrófilos (bastões)','Eosinofilia','Anemia microcítica','Plaquetose'], a:1, d:['lab'], e:'Liberação medular acelerada na infecção bacteriana.'},
   {q:'A PCR elevada na pneumonia é produzida principalmente:',
    o:['Pelos neutrófilos','Pelo fígado, sob estímulo da IL-6','Pelo pulmão','Pelo rim','Pelos linfócitos B'], a:1, d:['lab','imuno'], e:'Proteína de fase aguda hepática.'},
   {q:'Por que suspender temporariamente a losartana no paciente?',
    o:['Interage com ceftriaxona','Hipotensão e LRA: o BRA reduz a pressão de filtração glomerular dependente da angiotensina II','Causa pneumonia','Aumenta a febre','Provoca tosse'], a:1, d:['farmaco','fisio'], hard:true, e:'Dilatação da arteríola eferente.'}
  ]},
 /* S8 */
 {id:'s8', title:'Tratamento e prevenção', short:'Tratamento', d:['farmaco','prev','clin'],
  quick: `
  ${D.tbl(['Cenário','Esquema empírico'],[
   ['Ambulatorial, sem comorbidade','<b>amoxicilina</b> ou macrolídeo (azitromicina/claritromicina)'],
   ['Ambulatorial com comorbidade ou antibiótico recente','β-lactâmico + macrolídeo, ou quinolona respiratória'],
   ['<b>Enfermaria</b>','<b>ceftriaxona + azitromicina</b> (ou quinolona respiratória isolada)'],
   ['<b>UTI</b>','ceftriaxona + azitromicina ou ceftriaxona + quinolona respiratória']])}
  <ul>
   <li>β-lactâmicos: inibem <b>PBP</b> (transpeptidação da parede). Macrolídeos: <b>50S</b>. Quinolonas: <b>DNA girase/topoisomerase IV</b>.</li>
   <li>Duração: <b>5–7 dias</b> na maioria, após estabilidade clínica.</li>
   <li>Prevenção: vacina <b>pneumocócica</b> e <b>influenza</b>; avaliar deglutição pós-AVC.</li>
  </ul>
  <p>O paciente (CURB-65 = 4, sepse): <b>internação</b>, O₂, volume, hemoculturas, <b>ceftriaxona + azitromicina</b>, avaliar UTI.</p>`,
  deep: `
  ${D.fig('img/c6-slide-trat.jpg','Esquemas empíricos de antibiótico para PAC por cenário (ambulatório, enfermaria, UTI) e duração.', SL)}
  <h3>A lógica do esquema</h3>
  <p>O tratamento é <b>empírico</b>: precisa cobrir pneumococo (o principal) e, no paciente internado, também <b>atípicos</b> (Legionella mata se não for coberta). Por isso β-lactâmico (pneumococo, H. influenzae) + macrolídeo (atípicos; efeito imunomodulador) ou uma quinolona respiratória isolada (cobre ambos).</p>
  ${D.tbl(['Classe','Mecanismo','Espectro na PAC','Efeitos adversos importantes'],[
   ['<b>β-lactâmicos</b> (amoxicilina, ceftriaxona)','ligam-se às <b>PBP</b> → inibem a transpeptidação do peptidoglicano → lise (<b>bactericida</b>, tempo-dependente)','pneumococo, H. influenzae; <b>não</b> cobrem atípicos','alergia (anafilaxia), diarreia/C. difficile'],
   ['<b>Macrolídeos</b> (azitromicina, claritromicina)','subunidade <b>50S</b> → inibem a translocação (<b>bacteriostático</b>)','atípicos, pneumococo (resistência crescente)','<b>prolongamento do QT</b>, GI; claritromicina <b>inibe CYP3A4</b>'],
   ['<b>Quinolonas respiratórias</b> (levofloxacino, moxifloxacino)','inibem <b>DNA girase</b> e topoisomerase IV (bactericida, concentração-dependente)','pneumococo + atípicos + Gram −','<b>QT longo</b>, <b>tendinopatia/ruptura de tendão</b> (idosos), disglicemia, neuropatia, delirium']])}
  ${D.integ('<p><b>Farmacodinâmica dos antibióticos</b>: β-lactâmicos dependem do <b>tempo acima da CIM</b> (dose fracionada); quinolonas e aminoglicosídeos da <b>concentração máxima/CIM</b> e da AUC (dose única diária). Ajuste pela função renal — ${D.lk(8,"Fármaco e rim")}.</p>','Integração · Farmacologia')}
  ${D.trap('<p><b>Clopidogrel</b> é pró-fármaco ativado pelo <b>CYP2C19</b> (e em parte 3A4). Inibidores potentes (omeprazol, fluconazol) reduzem a ativação. A azitromicina praticamente não inibe CYP; a claritromicina inibe CYP3A4 — por isso a <b>azitromicina</b> é o macrolídeo preferido em pacientes polimedicados.</p>')}
  <h3>Medidas gerais</h3>
  <ul>
   <li>Oxigênio para SatO₂ ≥ 92%; hidratação; antitérmico; profilaxia de TEV.</li>
   <li><b>Antibiótico precoce</b> (na sepse, na 1ª hora).</li>
   <li>Critérios de estabilidade para trocar para via oral e planejar alta: afebril, FC &lt; 100, FR &lt; 24, PAS ≥ 90, SatO₂ ≥ 90%, deglutindo e com estado mental basal.</li>
   <li>Corticoide sistêmico: considerar na PAC grave com choque refratário (evidência recente), não de rotina.</li>
  </ul>
  <h3>Prevenção</h3>
  <ul>
   <li><b>Vacina pneumocócica</b> para ≥ 60–65 anos e grupos de risco (conjugada, VPC13/VPC20, ± polissacarídica VPP23) e <b>influenza anual</b>; covid-19 e VSR em idosos — ${D.lk(1,'Vacinação')}.</li>
   <li>Avaliação fonoaudiológica da <b>deglutição</b> após AVC; higiene oral; cabeceira elevada.</li>
   <li>Cessação do tabagismo e do etilismo (quando houver).</li>
  </ul>`,
  qs:[
   {q:'Paciente internado em enfermaria com PAC. Esquema empírico adequado:',
    o:['Amoxicilina isolada','Ceftriaxona + azitromicina','Vancomicina + meropeném','Azitromicina isolada','Fluconazol'], a:1, d:['farmaco','clin'], e:'Cobre pneumococo e atípicos.'},
   {q:'Mecanismo de ação da ceftriaxona:',
    o:['Inibe a subunidade 30S','Liga-se às PBP e inibe a síntese de parede','Inibe DNA girase','Inibe a síntese de ácido fólico','Desorganiza a membrana'], a:1, d:['farmaco'], e:'β-lactâmico.'},
   {q:'Idoso em uso de levofloxacino refere dor súbita no calcanhar. Efeito adverso a considerar:',
    o:['Ototoxicidade','Tendinopatia/ruptura do tendão de Aquiles','Síndrome do homem vermelho','Nefrotoxicidade','Anemia aplástica'], a:1, d:['farmaco'], e:'Risco maior em idosos e com corticoide.'}
  ]}
 ],

 dq:[
  {q:'Explique a formação do frêmito toracovocal e por que ele está aumentado na pneumonia e diminuído no derrame pleural.',
   a:'<p>O FTV é a vibração gerada pelas cordas vocais durante a fala, transmitida pela coluna de ar da árvore traqueobrônquica e pelo parênquima até a parede torácica, onde é percebida pela palma da mão. O parênquima normal, com ar e septos, atenua essa vibração.</p><p>Na <b>pneumonia</b>, o exsudato substitui o ar alveolar (consolidação); com o brônquio pérvio, o meio fica mais homogêneo e denso e conduz melhor a vibração → <b>FTV aumentado</b>. No <b>derrame pleural</b>, o líquido se interpõe entre o pulmão e a parede e afasta o parênquima, funcionando como barreira que dissipa a vibração → <b>FTV diminuído ou abolido</b>. Em ambos a percussão é maciça; o FTV diferencia.</p>',
   k:['Origem nas cordas vocais e transmissão pela via aérea','Parênquima aerado atenua','Consolidação melhora a condução (com brônquio pérvio)','Derrame é barreira entre pulmão e parede','Percussão maciça nos dois; FTV diferencia']},
  {q:'Diferencie exsudato de transudato quanto ao mecanismo de formação, às características e à forma de identificação laboratorial.',
   a:'<p><b>Transudato</b>: forma-se por desequilíbrio das forças de Starling com membrana capilar íntegra — aumento da pressão hidrostática (IC) ou redução da oncótica (cirrose, síndrome nefrótica). Líquido límpido, pobre em proteínas e células.</p><p><b>Exsudato</b>: forma-se por aumento da permeabilidade capilar (inflamação, infecção, neoplasia) ou falha da drenagem linfática; rico em proteínas, células (neutrófilos, linfócitos) e fibrina; turvo. Causas: pneumonia, TB, câncer, TEP.</p><p>Identificação: <b>toracocentese</b> com dosagem de proteína e LDH no líquido e no soro — <b>critérios de Light</b>: exsudato se proteína P/S &gt; 0,5, LDH P/S &gt; 0,6 ou LDH pleural &gt; 2/3 do LSN sérico (basta um).</p>',
   k:['Transudato: pressões hidrostática/oncótica, membrana íntegra','Exsudato: permeabilidade aumentada/inflamação','Composição (proteínas, células)','Exemplos de causas','Critérios de Light com valores']},
  {q:'Descreva as fases anatomopatológicas da pneumonia lobar e relacione com os achados clínicos e radiológicos do paciente.',

 roadmap: `<h3>Mapa do leito</h3><p>A criança e seus determinantes → como se faz e se lê a série vermelha → classificar anemias → anemia megaloblástica (a do paciente) → leucograma e plaquetas → parasitoses intestinais → desidratação e manejo → prevenção. O desvio à esquerda que você vê aqui reaparece na pneumonia do ${D.lk(6,'Pneumonia')}; a anemia ferropriva, na retocolite do ${D.lk(10,'RCU')}.</p>`,

 /* S1 */
 {id:'s1', title:'Lendo o caso: a criança e seu território', short:'A criança', d:['clin','prev','semio'],
  quick: `
  <ul>
   <li><b>Diarreia aguda</b> (&lt; 14 dias) sobre quadro <b>crônico</b> (6 meses): fezes fétidas, acinzentadas/claras, flatulência, distensão → <b>má absorção</b> (giardíase é a principal hipótese).</li>
   <li><b>Desnutrição crônica</b>: estatura/idade Z &lt; −2 (baixa estatura) e peso/idade Z &lt; −2.</li>
   <li><b>Desidratação</b>: irritado, olhos fundos, turgor ↓ → Plano B.</li>
   <li><b>Carências</b>: palidez, língua lisa, anemia macrocítica.</li>
   <li><b>Determinantes</b>: sem esgoto, água de poço, fossa, frutas sem higienização, desmame precoce, leite de vaca in natura.</li>
  </ul>
  ${D.trap('<p>No slide, IMC Z &lt; −1 está chamado de “magreza”. Pelas curvas da OMS/SISVAN, <b>magreza é Z &lt; −2</b> (e acentuada &lt; −3); entre −2 e +1 é eutrofia. O que define o problema dessa criança é a <b>baixa estatura</b> (Z &lt; −2): desnutrição <b>crônica</b>.</p>')}`,
  deep: `
  <h3>Diarreia: aguda, persistente, crônica</h3>
  <p>Diarreia é ≥ 3 evacuações amolecidas/líquidas em 24 h. <b>Aguda</b>: até 14 dias; <b>persistente</b>: 14–30 dias; <b>crônica</b>: &gt; 30 dias. A criança tem um episódio agudo (6 dias) sobre <b>6 meses</b> de sintomas intermitentes — cólicas, flatulência, fezes alternando pastosas e líquidas. As características das fezes ajudam a localizar:</p>
  ${D.tbl(['Padrão','Fezes','Sugere'],[
   ['Delgado (alta)','volumosas, aquosas, <b>fétidas</b>, claras/acinzentadas, gordurosas (<b>esteatorreia</b>), restos alimentares, sem sangue','má absorção: <b>giárdia</b>, doença celíaca, intolerância à lactose'],
   ['Cólon (baixa)','pequeno volume, frequentes, <b>muco, sangue</b>, tenesmo, urgência','disenteria: Shigella, ameba, colite inflamatória (${D.lk(10,"RCU")})']])}
  <p>Fezes acinzentadas e muito fétidas apontam para gordura não absorvida; o muco pode aparecer em qualquer inflamação intestinal. Febre baixa e cólica são inespecíficas.</p>
  <h3>Antropometria</h3>
  <p>Os índices são comparados às curvas da OMS em <b>escore Z</b> (desvios-padrão da mediana):</p>
  ${D.tbl(['Índice','Significado','Ponto de corte'],[
   ['Estatura/idade','crescimento linear; reflete <b>agravos crônicos</b>','Z &lt; −2 = <b>baixa estatura</b>; &lt; −3 muito baixa'],
   ['Peso/idade','visão global; não distingue agudo de crônico','Z &lt; −2 = baixo peso'],
   ['IMC/idade (ou peso/estatura)','agravo <b>agudo</b>, emagrecimento','Z &lt; −2 = magreza; &lt; −3 magreza acentuada']])}
  <p>A criança tem <b>baixa estatura</b> e <b>baixo peso</b> com IMC ainda acima de −2: típico da <b>desnutrição crônica</b> (stunting), produto de anos de dieta pobre e infecções intestinais repetidas — um ciclo em que a infecção causa má absorção e perda de apetite, e a desnutrição piora a imunidade e a barreira intestinal.</p>
  ${D.clin('<p><b>Edema em criança desnutrida</b>: edema bilateral depressível classifica a desnutrição como <b>grave</b> (forma edematosa, kwashiorkor), independentemente do peso, e muda a conduta (internação, protocolo da OMS, hidratação cautelosa com solução específica). Aqui o edema é “discreto maleolar”: pedir <b>albumina</b> e reavaliar com cuidado. A hipoalbuminemia pode vir da ingestão proteica pobre e da enteropatia perdedora de proteína.</p>')}
  <h3>Outros sinais</h3>
  <p><b>Língua lisa</b> (glossite atrófica, despapilada): carência de folato, B12, ferro ou riboflavina — as papilas são renovadas rapidamente e dependem de síntese de DNA. <b>Palidez</b> ++/4+: anemia. <b>Taquicardia</b> (123 bpm; normal aos 5 anos ~80–120): desidratação, dor, anemia.</p>
  ${D.trap('<p>O <b>chá de boldo</b> é muito usado para “problemas digestivos”, mas não trata diarreia e o boldo (<i>Peumus boldus</i>) contém boldina e óleos com potencial hepatotóxico; não é recomendado em crianças. Na diarreia, chás e refrigerantes não substituem o <b>soro de reidratação oral</b>.</p>')}`,

 /* S2 */
 {id:'s2', title:'O hemograma: como é feito e a série vermelha', short:'Série vermelha', d:['lab'],
  quick: `
  <p>Hemograma = <b>eritrograma</b> + <b>leucograma</b> + <b>plaquetas</b>, feito em contador automatizado com sangue em EDTA; o esfregaço revisa a morfologia.</p>
  ${D.tbl(['Parâmetro','O que é','Fórmula'],[
   ['Hb (g/dL)','define anemia','medida'],
   ['Ht (%)','volume das hemácias / volume total','≈ 3 × Hb'],
   ['<b>VCM</b> (fL)','<b>tamanho</b> médio da hemácia','Ht × 10 / hemácias (milhões)'],
   ['HCM (pg)','<b>massa</b> de Hb por hemácia','Hb × 10 / hemácias'],
   ['<b>CHCM</b> (g/dL)','<b>concentração</b> de Hb na hemácia','Hb × 100 / Ht'],
   ['<b>RDW</b> (%)','variação do tamanho (anisocitose)','—'],
   ['Reticulócitos','produção medular recente','—']])}
  ${D.pearl('<p>Valores mudam com a idade: anemia aos 6–59 meses é Hb &lt; 11; aos <b>5–11 anos, &lt; 11,5</b>; VCM normal da criança é <b>menor</b> que o do adulto (~75–87 fL aos 5 anos). Sempre use a referência da idade.</p>')}`,
  deep: `
  <h3>Como o hemograma é feito</h3>
  <p>Sangue venoso em tubo com <b>EDTA</b> (anticoagulante que quela cálcio) passa por um contador automatizado: impedância elétrica (cada célula, ao atravessar uma abertura, altera a corrente proporcionalmente a seu volume — daí o VCM), espectrofotometria (Hb, após lise) e citometria de fluxo/laser (diferencial de leucócitos). O <b>esfregaço</b> corado (Wright/Giemsa/Leishman) é revisado quando há alarmes: células imaturas, plaquetas agregadas, morfologia anormal.</p>
  ${D.fig('img/c7-esfregaco.png','Esfregaço de sangue periférico normal: hemácias, plaquetas (P) e os cinco leucócitos — linfócito (L), neutrófilo (N), monócito (M), eosinófilo (E), basófilo (B).', WC)}
  <h3>Eritrograma</h3>
  <p>A <b>hemoglobina</b> define anemia. O <b>hematócrito</b> é a fração do volume ocupada pelas hemácias. Os <b>índices hematimétricos</b> são médias:</p>
  <ul>
   <li><b>VCM</b> = Ht × 10 / hemácias (milhões/mm³). Classifica as anemias: micro (&lt; 80 no adulto), normo (80–100), macrocíticas (&gt; 100).</li>
   <li><b>HCM</b> = Hb × 10 / hemácias. É <b>peso</b>: cai com a microcitose (célula pequena tem menos Hb) e sobe com a macrocitose.</li>
   <li><b>CHCM</b> = Hb × 100 / Ht. É <b>concentração</b>: o verdadeiro índice de “cor”. Baixa na ferropriva/talassemia (hipocromia); alta (&gt; 36) na <b>esferocitose</b>.</li>
   <li><b>RDW</b>: coeficiente de variação do volume (anisocitose). Sobe cedo na ferropriva e na megaloblástica; costuma ser normal no traço talassêmico.</li>
   <li><b>Reticulócitos</b>: hemácias jovens com RNA residual (1–2 dias no sangue). Medem a <b>resposta medular</b>: altos na hemólise e no sangramento; baixos quando a medula não produz (carências, aplasia, invasão).</li>
  </ul>
  ${D.extra('<p>Valores pediátricos aproximados aos 5 anos: Hb 11,5–13,5 g/dL; VCM 75–87 fL; leucócitos 5.000–15.500/µL; plaquetas 150–450 mil. Recém-nascidos têm Hb e VCM altos (Hb fetal, até ~6 meses), que caem até o nadir fisiológico por volta de 2 meses.</p>')}
  ${D.integ('<p><b>Ht ≈ 3 × Hb</b> serve de checagem rápida de coerência. No paciente: 10,6 × 3 ≈ 31,8 (laudo: 31,7%). E CHCM = 10,6 × 100 / 31,7 = 33,4 — normal.</p>','Integração · Cálculo')}
  <div class="widget" data-w="hemo"></div>`,
  qs:[
   {q:'O índice que expressa a concentração de hemoglobina dentro da hemácia e se eleva na esferocitose é:',
    o:['VCM','HCM','CHCM','RDW','Reticulócitos'], a:2, d:['lab'], e:'CHCM = Hb × 100 / Ht.'},
   {q:'Anemia com reticulócitos aumentados sugere:',
    o:['Aplasia de medula','Deficiência de ferro não tratada','Hemólise ou sangramento agudo','Anemia de doença renal crônica','Deficiência de B12'], a:2, d:['lab'], e:'Medula respondendo.'},
   {q:'Por que o VCM de referência do laudo (80–100 fL) não é adequado para essa criança?',

 /* S3 */
 {id:'s3', title:'Classificando as anemias pelo VCM', short:'Classificar anemias', d:['lab','pato','fisio'],
  quick: `
  ${D.tbl(['VCM','Causas principais'],[
   ['<b>&lt; 80 — microcítica</b>','<b>ferropriva</b>, talassemias, doença crônica (tardia), sideroblástica'],
   ['<b>80–100 — normocítica</b>','sangramento agudo, hemólise, doença crônica, DRC, aplasia, ferropriva inicial'],
   ['<b>&gt; 100 — macrocítica</b>','<b>megaloblástica</b> (B12, folato), álcool, hepatopatia, hipotireoidismo, reticulocitose, mielodisplasia, fármacos (hidroxiureia, metotrexato)']])}
  ${D.tbl(['Microcíticas','Ferro','Ferritina','Transferrina/TIBC','RDW'],[
   ['Ferropriva','↓','<b>↓</b>','<b>↑</b>','↑'],['Doença crônica','↓','<b>normal/↑</b>','↓','normal'],['Traço talassêmico','normal','normal','normal','normal']])}
  <div class="widget" data-w="anemia"></div>`,
  deep: `
  <h3>O raciocínio</h3>
  <p>Toda anemia responde a duas perguntas: <b>qual o tamanho da hemácia</b> (VCM) e <b>a medula está respondendo</b> (reticulócitos)? Com elas, o diagnóstico diferencial cai pela metade.</p>
  <h3>Microcíticas: falta hemoglobina para encher a célula</h3>
  <p>Quando a síntese de Hb falha — por falta de <b>ferro</b> (heme) ou de <b>cadeias de globina</b> (talassemia) —, o precursor faz divisões extras até atingir uma concentração de Hb “suficiente”, e a hemácia sai pequena e pálida.</p>
  ${D.fig('img/c7-ferropriva.jpg','Anemia ferropriva no esfregaço: hemácias pequenas (microcitose), com halo central claro aumentado (hipocromia), variação de tamanho (anisocitose) e de forma (poiquilocitose).', WC)}
  <ul>
   <li><b>Ferropriva</b>: a mais comum no mundo. Ferritina (estoque) baixa é o dado mais específico; transferrina/TIBC sobe (o fígado produz mais transportador); saturação de transferrina &lt; 16–20%; RDW alto; trombocitose reativa. Clínica: palidez, fadiga, <b>coiloníquia</b>, glossite, queilite angular, <b>pica</b> (geofagia, pagofagia).</li>
   <li><b>Anemia de doença crônica</b>: a IL-6 aumenta a <b>hepcidina</b>, que degrada a ferroportina — o ferro fica preso em macrófagos e enterócitos. Ferro sérico baixo, mas <b>ferritina normal ou alta</b> e transferrina baixa.</li>
   <li><b>Talassemia</b> (traço): microcitose acentuada com anemia leve, hemácias em número normal ou aumentado, RDW normal, ferro normal. Índice de Mentzer (VCM/hemácias) &lt; 13 sugere talassemia; eletroforese de Hb confirma (β-talassemia: HbA2 ↑).</li>
  </ul>
  ${D.fig('img/c7-coiloniquia.jpg','Coiloníquia (unhas “em colher”): sinal de deficiência de ferro crônica.', WC)}
  ${D.integ('<p><b>Leite de vaca in natura antes de 1 ano</b> é causa clássica de ferropenia infantil: pouco ferro e de baixa biodisponibilidade, cálcio e caseína inibem a absorção e as proteínas podem causar micro-hemorragias intestinais. Ancilostomídeos (seção 6) também causam ferropriva. Vale dosar ferritina nesta criança: deficiências mistas são comuns.</p>','Integração · Pediatria')}
  <h3>Macrocíticas</h3>
  <p>Divididas em <b>megaloblásticas</b> (falha de síntese de DNA: B12, folato, fármacos antifolato/antimetabólitos) e <b>não megaloblásticas</b> (álcool, hepatopatia, hipotireoidismo, reticulocitose — o reticulócito é maior —, mielodisplasia). VCM &gt; 115 é quase exclusivo de megaloblástica.</p>
  <div class="widget" data-w="anemia"></div>
  ${D.trap('<p><b>Deficiência mista</b> de ferro (microcitose) + folato (macrocitose) pode dar <b>VCM normal</b>: a pista é o <b>RDW muito alto</b> (populações de tamanhos diferentes) e o esfregaço.</p>')}`,
  qs:[
   {q:'Ferro baixo, ferritina 420 ng/mL e transferrina baixa em paciente com doença inflamatória crônica. Mecanismo:',
    o:['Perda de ferro','Hepcidina elevada bloqueando a ferroportina','Defeito de globina','Deficiência de B12','Hemólise'], a:1, d:['fisio','lab'], e:'Anemia de doença crônica.'},
   {q:'O exame mais específico para confirmar deficiência de ferro é:',
    o:['Ferro sérico','Ferritina baixa','VCM','Hemoglobina','Contagem de plaquetas'], a:1, d:['lab'], e:'Reflete o estoque (cuidado: sobe na inflamação).'},
   {q:'Unhas em colher na imagem sugerem deficiência de:',
    o:['B12','Ferro','Zinco','Vitamina C','Folato'], a:1, d:['semio'], e:'Coiloníquia.', img:'img/c7-coiloniquia.jpg'}
  ]},
 /* S4 */
 {id:'s4', title:'Anemia megaloblástica: a anemia do paciente', short:'Megaloblástica', d:['pato','fisio','lab'],
  quick: `
  ${D.svg(svgMegalo,'B12 e folato são necessários para fabricar timidina; sem ela, o núcleo atrasa.')}
  <ul>
   <li>Sangue: <b>macro-ovalócitos</b>, <b>neutrófilos hipersegmentados</b> (≥ 6 lobos), reticulócitos baixos, LDH e bilirrubina indireta ↑ (eritropoese ineficaz).</li>
   <li><b>Folato</b>: estoque de 3–4 meses; perde-se com dieta pobre, má absorção, fervura dos alimentos, leite de cabra.</li>
   <li><b>B12</b>: estoque de anos; só ela causa <b>neuropatia</b> (degeneração combinada subaguda) e eleva o <b>ácido metilmalônico</b>.</li>
   <li>Ambas elevam a homocisteína.</li>
  </ul>
  ${D.trap('<p><b>Nunca dar ácido fólico sozinho antes de excluir deficiência de B12</b>: corrige a anemia, mas a lesão neurológica progride.</p>')}`,
  deep: `
  <h3>Por que falta de vitamina faz hemácia grande</h3>
  ${D.svg(svgMegalo,'O metil-THF só é reciclado a THF pela metionina sintase, que depende de B12 (“armadilha do folato”). Sem THF, falta o doador de carbono para a timidilato sintase.')}
  <p>A síntese de <b>timidina</b> (dTMP) depende do folato reduzido; e a reciclagem do folato depende da <b>B12</b> (metionina sintase converte homocisteína em metionina e metil-THF em THF). Na falta de qualquer um, o DNA é replicado devagar, enquanto RNA e hemoglobina seguem normais: o citoplasma amadurece antes do núcleo (<b>assincronia núcleo-citoplasma</b>). O precursor cresce, divide-se menos e muitos morrem ainda na medula (<b>eritropoese ineficaz</b>): medula hipercelular, sangue com poucas células, LDH e bilirrubina indireta elevados.</p>
  ${D.fig('img/c7-hiperseg.jpg','Neutrófilo hipersegmentado (≥ 6 lobos) entre macrócitos: um dos sinais mais precoces da deficiência de B12 ou folato.', WC)}
  ${D.fig('img/c7-hiperseg2.jpg','Outro exemplo de neutrófilo hipersegmentado na deficiência de B12.', WC)}
  <h3>B12 × folato</h3>
  ${D.tbl(['','Vitamina B12 (cobalamina)','Folato'],[
   ['Fonte','apenas alimentos de origem animal','vegetais verdes, frutas, fígado; destruído pelo cozimento prolongado'],
   ['Absorção','fator intrínseco (células parietais) → <b>íleo terminal</b>','<b>jejuno proximal</b>'],
   ['Estoque','3–5 anos (adulto)','3–4 meses'],
   ['Causas','anemia perniciosa, gastrectomia, ressecção ileal, Crohn, metformina, IBP, veganismo, <i>Diphyllobothrium</i>','dieta pobre, má absorção (celíaca, giárdia), gestação, álcool, metotrexato, fenitoína, sulfametoxazol-trimetoprima'],
   ['Neurológico','<b>sim</b> (cordão posterior e lateral, neuropatia, demência)','não'],
   ['Ácido metilmalônico','<b>↑</b>','normal'],
   ['Homocisteína','↑','↑']])}
  <p><b>Na criança do leito</b>: dieta pobre e monótona, desnutrição crônica e diarreia crônica com <b>má absorção intestinal</b> (giardíase pode causar atrofia vilositária e prejudicar a absorção de folato e B12). A <b>língua lisa</b> é a mesma assincronia nuclear nas células de renovação rápida da mucosa. A investigação: dosar <b>B12 e folato</b> (e ferritina), reticulócitos, LDH, bilirrubinas, esfregaço; parasitológico de fezes.</p>
  ${D.integ('<p><b>Farmacologia</b>: metotrexato inibe a di-hidrofolato redutase; trimetoprima e pirimetamina também (fraco em humanos); fenitoína reduz absorção de folato. O <b>ácido folínico</b> (leucovorina) é o resgate porque já vem reduzido.</p>','Integração · Farmacologia')}
  ${D.extra('<p>Tratamento: corrigir a causa (tratar a parasitose, dieta). Folato oral; B12 oral em dose alta ou IM se má absorção. A resposta é rápida: <b>pico de reticulócitos em 5–7 dias</b>; atenção à <b>hipocalemia</b> nos primeiros dias (o potássio entra nas células novas).</p>')}`,
  qs:[
   {q:'Achado no esfregaço que sugere deficiência de B12/folato mesmo antes da anemia:',
    o:['Esferócitos','Neutrófilos hipersegmentados','Hemácias em alvo','Corpos de Howell-Jolly','Esquizócitos'], a:1, d:['lab','pato'], e:'≥ 6 lobos (ou &gt; 5% com 5 lobos).', img:'img/c7-hiperseg.jpg'},
   {q:'Qual dado laboratorial diferencia deficiência de B12 da de folato?',

 /* S5 */
 {id:'s5', title:'Leucograma e plaquetas', short:'Leucograma', d:['lab','imuno'],
  quick: `
  <ul>
   <li>Interprete sempre o <b>valor absoluto</b> (% × leucócitos totais).</li>
   <li><b>Neutrofilia com desvio à esquerda</b> (bastões ↑): infecção bacteriana.</li>
   <li><b>Linfocitose</b>: viroses (mononucleose, CMV, coqueluche); <b>linfopenia</b>: desnutrição, corticoide, HIV.</li>
   <li><b>Eosinofilia</b> (&gt; 500/µL): <b>helmintos</b>, alergia/atopia, fármacos. Protozoários intestinais (giárdia, ameba) em geral <b>não</b> dão eosinofilia.</li>
   <li>Plaquetas 150–450 mil; ↑ na ferropriva e inflamação; ↓ em sepse, aplasia, megaloblástica, hiperesplenismo.</li>
  </ul>
  <div class="widget" data-w="leuco"></div>`,
  deep: `
  <h3>Relativo × absoluto</h3>
  <p>No paciente: eosinófilos 8% × 11.500 = <b>920/µL</b> (eosinofilia leve-moderada; &gt; 1.500 é hipereosinofilia); neutrófilos 56% = 6.440; linfócitos 34% = 3.910; monócitos 1% = 115 (baixos). O percentual engana: um “linfócitos 60%” pode ser só neutropenia.</p>
  <h3>Cada célula</h3>
  ${D.tbl(['Célula','% normal','Função','Aumento','Diminuição'],[
   ['<b>Neutrófilo</b>','45–70 (adulto)','fagocitose de bactérias e fungos','infecção bacteriana, corticoide, estresse, tabagismo','quimioterapia, viroses, B12/folato, autoimune'],
   ['<b>Linfócito</b>','20–45','imunidade adaptativa (T, B, NK)','viroses, coqueluche, LLC','desnutrição, HIV, corticoide, radiação'],
   ['<b>Monócito</b>','2–10','vira macrófago nos tecidos','TB, endocardite, recuperação de infecção','aplasia, corticoide'],
   ['<b>Eosinófilo</b>','1–5','helmintos, alergia (IgE, IL-5)','<b>helmintíases</b>, asma, atopia, fármacos','corticoide, estresse agudo'],
   ['<b>Basófilo</b>','0–1','histamina; hipersensibilidade','LMC, alergia','—']])}
  ${D.fig('img/c7-eosinofilo.jpg','Eosinófilos: grânulos alaranjados grosseiros e núcleo bilobulado.', WC)}
  <h3>Desvio à esquerda</h3>
  <p>Na infecção bacteriana, IL-1, TNF e G-CSF mobilizam o compartimento de reserva medular, que libera neutrófilos cada vez mais jovens: <b>bastonetes</b> (&gt; 5–10%), metamielócitos, mielócitos. É o “desvio à esquerda” (nas tabelas antigas, as células jovens ficavam à esquerda). Granulações tóxicas e corpúsculos de Döhle reforçam.</p>
  ${D.fig('img/c7-bastonete.jpg','Bastonete: neutrófilo jovem com núcleo em faixa/“C”, sem segmentação.', WC)}
  ${D.integ('<p>Na criança do leito <b>não há</b> desvio nem neutrofilia: a diarreia não parece bacteriana invasiva. Compare com a pneumonia do ${D.lk(6,"Pneumonia")} (18.500 com desvio).</p>','Integração')}
  <h3>Por que helminto dá eosinofilia (e giárdia não)</h3>
  <p>Helmintos são grandes demais para fagocitose; a resposta é <b>Th2</b>: IL-4 (troca de classe para IgE), <b>IL-5</b> (produção e ativação de eosinófilos) e IL-13. Eosinófilos se ligam à IgE que reveste o verme e degranulam proteína básica principal. A eosinofilia é maior na fase de <b>migração tecidual</b> das larvas (ciclo pulmonar de Ascaris, ancilostomídeos e Strongyloides — síndrome de Löffler). Protozoários intestinais, como a giárdia, ficam na luz e não induzem eosinofilia: a eosinofilia desta criança aponta para <b>poliparasitismo</b> com helmintos.</p>
  <div class="widget" data-w="leuco"></div>
  <h3>Plaquetas</h3>
  <p>Contagem normal 150.000–450.000/µL; VPM (volume plaquetário médio) alto indica plaquetas jovens (destruição periférica). <b>Trombocitose</b> reativa: ferropriva, inflamação, pós-esplenectomia. <b>Plaquetopenia</b>: sepse, aplasia, megaloblástica grave, hiperesplenismo, PTI, dengue. Antes de valorizar plaquetopenia isolada, excluir <b>pseudoplaquetopenia</b> por agregação induzida pelo EDTA (ver no esfregaço).</p>`,
  qs:[
   {q:'Leucócitos 11.500 com eosinófilos 8%. Contagem absoluta de eosinófilos e interpretação:',
    o:['92/µL, normal','920/µL, eosinofilia','9.200/µL, hipereosinofilia','80/µL, eosinopenia','800/µL, normal'], a:1, d:['lab'], e:'0,08 × 11.500 = 920.'},
   {q:'Citocina central na produção e ativação de eosinófilos:',
    o:['IL-2','IL-5','IFN-γ','IL-12','TNF-α'], a:1, d:['imuno'], e:'Resposta Th2.'},
   {q:'Qual parasita intestinal tipicamente NÃO causa eosinofilia?',
    o:['Ascaris lumbricoides','Strongyloides stercoralis','Giardia lamblia','Ancilostomídeos','Toxocara canis'], a:2, d:['micro','lab'], e:'Protozoário luminal.'}
  ]},
 /* S6 */
 {id:'s6', title:'Parasitoses intestinais', short:'Parasitoses', d:['micro'],
  quick: `
  ${D.tbl(['Parasita','Transmissão','Clínica-chave','Tratamento'],[
   ['<b>Giardia</b> (protozoário)','cisto na água/alimentos (fecal-oral)','<b>esteatorreia</b>, flatulência, má absorção, déficit de crescimento','metronidazol, tinidazol, secnidazol'],
   ['<b>Ascaris</b>','ovos no solo/alimentos','obstrução intestinal, Löffler, desnutrição','albendazol, mebendazol'],
   ['<b>Ancilostomídeos</b>','<b>larva penetra a pele</b> (pés descalços)','<b>anemia ferropriva</b>, Löffler','albendazol'],
   ['<b>Strongyloides</b>','larva pela pele; <b>autoinfecção</b>','eosinofilia, hiperinfecção em imunossuprimidos','ivermectina (albendazol alternativa)'],
   ['<b>Trichuris</b>','ovos','disenteria, prolapso retal','albendazol']])}
  <p>Diagnóstico: <b>parasitológico de fezes</b> em 3 amostras de dias diferentes (eliminação intermitente).</p>`,
  deep: `
  <h3>Giardia lamblia (G. intestinalis / duodenalis)</h3>
  ${D.svg(svgGiardia,'Do cisto ingerido à má absorção.')}
  ${D.fig('img/c7-giardia.jpg','Trofozoíto de Giardia: forma de pera, dois núcleos (aspecto de “rosto”), flagelos e disco ventral de adesão.', WC)}
  ${D.fig('img/c7-giardia-sem.jpg','Microscopia eletrônica de varredura: o disco ventral que adere à mucosa duodenal.', WC)}
  <p>Protozoário flagelado, a parasitose intestinal por protozoário mais comum em crianças no Brasil. O <b>cisto</b> resiste à cloração habitual e é infectante em pequena dose; transmite-se por <b>água contaminada</b> (poços, fossas próximas), alimentos (frutas não lavadas), mãos e creches. O <b>trofozoíto</b> se fixa ao epitélio duodenal-jejunal pelo disco ventral, encurta as vilosidades, reduz as dissacaridases (intolerância à lactose secundária) e interfere com sais biliares → <b>esteatorreia</b>, flatulência, distensão, cólicas, fezes fétidas e claras; crônica, causa <b>má absorção de gordura, vitaminas lipossolúveis, B12 e folato</b> e <b>déficit de crescimento</b> — tudo que a criança tem. Diagnóstico: cistos/trofozoítos nas fezes (3 amostras), antígeno fecal (ELISA/imunofluorescência).</p>
  <p><b>Tratamento</b>: metronidazol (5–7 dias) ou dose única de <b>tinidazol</b> ou <b>secnidazol</b>; nitazoxanida é alternativa.</p>
  ${D.integ('<p><b>Metronidazol</b>: pró-fármaco reduzido dentro de anaeróbios/protozoários, gera radicais que lesam o DNA. Efeitos: gosto metálico, náuseas e <b>efeito dissulfiram-like</b> com álcool (no adulto). Ver farmacologia antimicrobiana no ${D.lk(6,"Pneumonia")}.</p>','Integração · Farmacologia')}
  <h3>Geo-helmintos (a explicação da eosinofilia)</h3>
  ${D.fig('img/c7-ascaris.jpg','Ovo fértil de Ascaris lumbricoides: casca grossa, mamilonada, acastanhada.', WC)}
  ${D.fig('img/c7-ancilostomo.jpg','Ovo de ancilostomídeo: casca fina e lisa, com blastômeros no interior.', WC)}
  ${D.fig('img/c7-trichuris.jpg','Ovo de Trichuris trichiura: forma de barril com dois “tampões” polares.', WC)}
  ${D.fig('img/c7-strongy.jpg','Larva rabditoide de Strongyloides nas fezes: diferente dos outros, elimina larvas (não ovos) e pode se autoinfectar.', WC)}
  <ul>
   <li><b>Ascaris lumbricoides</b>: ingestão de ovos (solo, frutas). Larva atravessa a parede intestinal → fígado → pulmão (<b>síndrome de Löffler</b>: tosse, infiltrado migratório, eosinofilia) → sobe a árvore brônquica, é deglutida → adulto no delgado. Massas de vermes: obstrução, migração para colédoco.</li>
   <li><b>Ancilostomídeos</b> (<i>Necator americanus</i>, <i>Ancylostoma duodenale</i>): larva penetra a pele (pés descalços), ciclo pulmonar, adulto suga sangue no duodeno → <b>anemia ferropriva</b> (o “Jeca Tatu”).</li>
   <li><b>Strongyloides stercoralis</b>: larva pela pele; <b>autoinfecção</b> mantém a infecção por décadas; corticoide/HTLV-1 → hiperinfecção grave. Diagnóstico por larvas (Baermann-Moraes).</li>
   <li><b>Trichuris</b>: cólon; infecção maciça dá disenteria, prolapso retal e anemia.</li>
  </ul>
  ${D.pearl('<p>Em área de alta prevalência, a OMS recomenda <b>tratamento preventivo em massa</b> de escolares com <b>albendazol 400 mg dose única</b> periodicamente. Mas nada substitui <b>saneamento</b>: sem esgoto e água tratada, a reinfecção é questão de meses.</p>')}`,
  qs:[

   {q:'Parasita que penetra pela pele dos pés descalços e causa anemia ferropriva:',

 {id:'s7', title:'Desidratação e manejo da diarreia', short:'Desidratação', d:['clin','semio','farmaco'],
  quick: `
  ${D.tbl(['Plano','Quando','O quê'],[
   ['<b>A</b>','sem desidratação','domicílio: mais líquidos, <b>SRO após cada evacuação</b>, manter alimentação, <b>zinco</b>, sinais de alerta'],
   ['<b>B</b>','<b>com desidratação</b> (≥ 2 sinais)','<b>SRO 50–100 mL/kg em 4–6 h na unidade</b>, reavaliar; depois Plano A'],
   ['<b>C</b>','desidratação grave','<b>hidratação venosa</b> (fase rápida e manutenção)']])}
  <ul>
   <li><b>Zinco</b> por 10–14 dias: 10 mg/dia (&lt; 6 meses) ou 20 mg/dia (≥ 6 meses).</li>
   <li><b>Não</b> usar antidiarreicos/antieméticos de rotina; antibiótico só em disenteria/cólera ou tratamento específico (giárdia).</li>
  </ul>
  <div class="widget" data-w="desidrata"></div>`,
  deep: `
  <h3>Avaliação do estado de hidratação</h3>
  <p>O Ministério da Saúde usa uma tabela com estado geral, olhos, sede, sinal da prega, pulso e enchimento capilar. <b>Dois ou mais sinais</b> da coluna “com desidratação” classificam o paciente; se houver ≥ 2 sinais de gravidade (incluindo pelo menos um entre comatoso/hipotônico, não consegue beber, pulso ausente, enchimento &gt; 5 s), é desidratação grave.</p>
  <div class="widget" data-w="desidrata"></div>
  <h3>Por que o soro oral funciona</h3>
  <p>Mesmo com a mucosa lesada, o <b>cotransporte sódio-glicose (SGLT1)</b> do enterócito continua funcionando: a glicose “puxa” sódio, e a água segue por osmose. A SRO de baixa osmolaridade da OMS (Na 75 mmol/L, glicose 75 mmol/L, osmolaridade 245) reduz o volume das fezes e os vômitos em relação à fórmula antiga. Água de coco e chás não têm a composição adequada.</p>
  ${D.integ('<p>A descoberta do SGLT1 e da SRO é chamada de um dos maiores avanços médicos do século XX — é fisiologia do transporte epitelial salvando milhões de crianças.</p>','Integração · Fisiologia')}
  <h3>A criança do leito</h3>
  <ul>
   <li><b>Plano B</b> na unidade, com a ressalva da desnutrição: na criança com desnutrição grave/edema, a OMS recomenda solução com menos sódio e mais potássio (ReSoMal) e infusão mais lenta, pelo risco de sobrecarga.</li>
   <li><b>Zinco</b> 20 mg/dia por 10–14 dias: reduz duração e recorrência da diarreia (repara mucosa, imunidade).</li>
   <li><b>Alimentação</b> mantida assim que hidratada; nada de jejum.</li>
   <li><b>Parasitológico de fezes</b> e <b>tratamento</b> de giárdia (secnidazol/tinidazol/metronidazol) e dos helmintos (albendazol).</li>
   <li>Investigar e repor carências: B12, folato, ferro, vitamina A; seguimento nutricional e de crescimento.</li>
   <li><b>Sinais de alerta</b> para retorno: piora da diarreia, vômitos repetidos, sangue nas fezes, muita sede, recusa alimentar, febre alta, sonolência.</li>
  </ul>
  ${D.trap('<p>Loperamida e outros antidiarreicos são <b>contraindicados em crianças</b> (íleo, depressão do SNC) e podem prolongar infecções invasivas.</p>')}`,
  qs:[
   {q:'Criança irritada, com olhos fundos, prega desaparecendo lentamente, bebendo avidamente. Plano:',
    o:['A','B','C','Internação em UTI','Apenas zinco'], a:1, d:['clin'], e:'≥ 2 sinais de desidratação.'},
   {q:'Mecanismo que torna a SRO eficaz mesmo na diarreia:',
    o:['Bloqueio da secreção de cloro','Cotransporte sódio-glicose (SGLT1) preservado','Aumento da motilidade','Inibição da bomba de prótons','Absorção passiva de potássio'], a:1, d:['fisio'], e:'Glicose arrasta sódio e água.'},
   {q:'Suplemento recomendado por 10–14 dias na diarreia infantil:',
    o:['Ferro','Zinco','Vitamina D','Cálcio','Probiótico obrigatório'], a:1, d:['clin','prev'], e:'Reduz duração e recorrência.'}

 {id:'s8', title:'Prevenção e determinantes sociais', short:'Prevenção', d:['prev','human'],
  quick: `
  <ul>
   <li><b>Saneamento</b> (esgoto, água tratada) é a medida que mais reduz diarreia e parasitoses.</li>
   <li><b>Aleitamento materno exclusivo até 6 meses</b> e continuado até 2 anos ou mais; <b>leite de vaca não deve ser introduzido antes de 1 ano</b>.</li>
   <li>Higiene das mãos, filtrar/ferver água, lavar frutas, calçados.</li>
   <li>Vacina de <b>rotavírus</b> (${D.lk(1,'Vacinação')}); suplementação de vitamina A e ferro nos programas do MS; acompanhamento do crescimento na APS.</li>
  </ul>`,
  deep: `
  <h3>A doença como produto do território</h3>
  <p>Essa criança é um retrato dos <b>determinantes sociais da saúde</b>: sem esgoto, água de poço próximo à fossa, desmame precoce, dieta pobre. A diarreia e as parasitoses causam desnutrição; a desnutrição deixa a mucosa e a imunidade frágeis, e a criança adoece mais — o <b>ciclo diarreia-desnutrição</b>. Tratar o episódio sem mudar o território garante a recorrência.</p>
  ${D.tbl(['Nível de prevenção','Exemplo no caso'],[
   ['Primordial / promoção','saneamento básico, renda, educação materna, segurança alimentar'],
   ['Primária (proteção específica)','água tratada, lavagem de mãos e frutas, calçados, aleitamento, vacina de rotavírus, tratamento preventivo em massa'],
   ['Secundária','acompanhamento do crescimento na puericultura, hemograma/parasitológico quando indicado, diagnóstico precoce'],
   ['Terciária','reabilitação nutricional, tratamento das carências, evitar sequelas no desenvolvimento'],
   ['Quaternária','não usar antidiarreicos, antibióticos ou exames desnecessários']])}
  <h3>Alimentação infantil</h3>
  <p><b>Aleitamento exclusivo até 6 meses</b> (não 2) e continuado com alimentação complementar até 2 anos ou mais. <b>Leite de vaca integral não deve ser oferecido antes dos 12 meses</b> (ferropenia, sobrecarga renal de solutos, alergia); <b>in natura</b> (não pasteurizado/fervido) ainda traz risco de brucelose, tuberculose bovina e outras infecções.</p>
  <h3>O papel da Atenção Primária</h3>
  <p>A UBS/ESF é a porta de entrada e coordena o cuidado: busca ativa, visita domiciliar do agente comunitário, puericultura com curvas de crescimento, orientação sobre água (filtração, fervura, hipoclorito de sódio 2,5%: 2 gotas por litro, 30 minutos), notificação de surtos de doença diarreica (monitorização das doenças diarreicas agudas), articulação intersetorial com o saneamento.</p>
  ${D.integ('<p><b>Humanística</b>: a mãe usou boldo e água de coco — saberes populares a serem acolhidos sem julgamento, oferecendo a alternativa eficaz (SRO). Comunicação clara, linguagem acessível e plano escrito aumentam a adesão.</p>','Integração · Humanística')}`,
  qs:[
   {q:'Até que idade é recomendado o aleitamento materno exclusivo?',
    o:['2 meses','4 meses','6 meses','12 meses','24 meses'], a:2, d:['prev'], e:'Exclusivo até 6 meses, complementado até 2 anos ou mais.'},
   {q:'Acompanhamento do crescimento e hemograma para detectar anemia em crianças assintomáticas de risco é prevenção:',
    o:['Primária','Secundária','Terciária','Quaternária','Primordial'], a:1, d:['prev'], e:'Detecção precoce.'},
   {q:'Medida de maior impacto populacional sobre diarreia e geo-helmintíases:',

  ]}

D.W.cg = (w) => {
  const inp=(id,l,v,st)=>`<label style="font-size:14px">${l}<input id="${id}" type="number" step="${st}" value="${v}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink)"></label>`;
  w.innerHTML=`<h4>Calculadora: Cockcroft-Gault e CKD-EPI 2021</h4><p class="wsub">Carregado com os dados da paciente. Mude e veja o que acontece com as decisões.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">${inp('cg_i','Idade (anos)',74,1)}${inp('cg_p','Peso (kg)',65,0.5)}${inp('cg_c','Creatinina (mg/dL)',1.9,0.1)}<label style="font-size:14px">Sexo<select id="cg_s" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink)"><option value="f">feminino</option><option value="m">masculino</option></select></label></div>
  <div data-o style="margin-top:12px;padding:12px;border-radius:8px;background:var(--paper-2);font-size:15px"></div>`;
  const g=id=>w.querySelector('#'+id); let n=0;
  function calc(){
    const a=+g('cg_i').value, p=+g('cg_p').value, c=+g('cg_c').value, f=g('cg_s').value==='f';
    if(!(a>0&&p>0&&c>0)) return;
    const cg=(140-a)*p/(72*c)*(f?0.85:1);
    const k=f?0.7:0.9, al=f?-0.241:-0.302;
    const ep=142*Math.pow(Math.min(c/k,1),al)*Math.pow(Math.max(c/k,1),-1.2)*Math.pow(0.9938,a)*(f?1.012:1);
    const st= ep>=90?'G1':ep>=60?'G2':ep>=45?'G3a':ep>=30?'G3b':ep>=15?'G4':'G5';
    const nit = cg<30?'<b style="color:var(--red)">evitar</b> (Beers 2023: ClCr &lt; 30 → ineficaz e tóxica)':cg<60?'uso curto possível com cautela (bulas antigas: evitar &lt; 60)':'pode usar';
    const met = ep<30?'<b style="color:var(--red)">contraindicada</b>':ep<45?'<b style="color:var(--amber)">não iniciar; se em uso, máx. 1.000 mg/dia</b>':'dose plena, monitorar TFG';

    n++; if(n>3) D.award('w:c8.cg',10,'clearance calculado');
  }
  w.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',calc)); calc();
};
D.W.pk = (w) => {
  w.innerHTML=`<h4>Simulador: acúmulo de um fármaco de eliminação renal</h4><p class="wsub">Doses repetidas a cada 6 h. Meia-vida normal de 4 h. Mexa na função renal e depois tente corrigir.</p>
  <label style="font-size:14px;display:block">Função renal: <b data-fv>100%</b><input data-f type="range" min="15" max="100" value="100" style="width:100%"></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button class="btn sm" data-m="0">Sem ajuste</button><button class="btn sm" data-m="1">Reduzir a dose</button><button class="btn sm" data-m="2">Aumentar o intervalo</button></div>
  <svg viewBox="0 0 640 260" style="width:100%;height:auto;display:block" data-svg></svg><div data-o style="font-size:14.5px;margin-top:6px"></div>`;
  let mode=0, n=0;
  const sv=w.querySelector('[data-svg]');
  function draw(){
    const f=+w.querySelector('[data-f]').value/100; w.querySelector('[data-fv]').textContent=Math.round(f*100)+'%';
    const t12=4/f, k=Math.log(2)/t12; let dose=1.94, tau=6;
    if(mode===1) dose=1.94*f; if(mode===2) tau=6/f;
    const T=72, X=t=>40+t/T*580, Y=c=>230-Math.min(c,9)/9*210;
    let c=0, pts=[], last=-1, peak=0, trough=0;
    for(let t=0;t<=T;t+=0.1){ const td=Math.round(t*10)/10; const nd=Math.floor(td/tau+1e-9); if(nd!==last){ c+=dose; last=nd; } else c*=Math.exp(-k*0.1); pts.push([X(td),Y(c)]); if(td>T-tau-0.05){ peak=Math.max(peak,c); trough=trough?Math.min(trough,c):c; } }
    sv.innerHTML=`<rect x="40" y="${Y(9)}" width="580" height="${Y(4)-Y(9)}" fill="var(--red-soft)"/><rect x="40" y="${Y(4)}" width="580" height="${Y(1)-Y(4)}" fill="var(--green-soft)"/>
    <text x="46" y="${Y(4)-6}" style="font:11px Inter;fill:var(--red)">tóxico</text><text x="46" y="${Y(1)-6}" style="font:11px Inter;fill:var(--green)">janela terapêutica</text><text x="46" y="${Y(0)-6}" style="font:11px Inter;fill:var(--ink-dim)">subterapêutico</text>
    <line x1="40" y1="230" x2="620" y2="230" stroke="var(--ink-dim)"/><line x1="40" y1="20" x2="40" y2="230" stroke="var(--ink-dim)"/>
    ${[0,12,24,36,48,60,72].map(h=>`<text x="${X(h)-8}" y="248" style="font:11px Inter;fill:var(--ink-dim)">${h}h</text>`).join('')}
    <path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}" fill="none" stroke="var(--teal-600)" stroke-width="2.4"/>`;
    const tox=peak>4, sub=trough<1&&!tox;
    w.querySelector('[data-o]').innerHTML=`Meia-vida: <b>${t12.toFixed(1)} h</b> · pico no estado de equilíbrio ≈ <b>${peak.toFixed(1)}</b> · vale ≈ <b>${trough.toFixed(1)}</b> → ${tox?'<b style="color:var(--red)">acúmulo tóxico</b>':sub?'<b style="color:var(--amber)">vales abaixo da janela</b>':'<b style="color:var(--green)">dentro da janela</b>'}. ${mode===0&&f<0.6?'O equilíbrio demora ~5 meias-vidas para chegar — e chega mais alto.':''}${mode===1?'Dose menor no mesmo intervalo: média correta, picos menores (bom para fármacos tempo-dependentes).':''}${mode===2?'Mesma dose com intervalo maior: picos semelhantes ao normal (bom para fármacos concentração-dependentes, como aminoglicosídeos).':''}`;
    n++; if(n>6 && mode>0 && f<0.5 && !tox) D.award('w:c8.pk',15,'dose ajustada');
  }
  w.querySelector('[data-f]').addEventListener('input',draw);
  w.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mode=+b.dataset.m; w.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('pri',x===b)); draw(); });
  w.querySelector('[data-m="0"]').classList.add('pri'); draw();
};

 ${D.pearl('<p>Uma creatinina “só um pouco alta” numa idosa magra esconde uma perda grande de função: a creatinina depende da <b>massa muscular</b>. Antes de prescrever fármaco de eliminação renal, <b>calcule o clearance</b>.</p>')}`,

 sections:[
 /* S1 */
 {id:'s1', title:'Infecção urinária e a E. coli', short:'ITU', d:['micro','lab','clin'],
  quick: `
  <ul>
   <li><b>Cistite</b>: disúria, polaciúria, urgência, dor suprapúbica, sem febre. <b>Pielonefrite</b>: febre, calafrios, dor lombar, Giordano +.</li>
   <li><b>ITU complicada</b>: alteração anatômica/funcional (estenose, cálculo, sonda), homem, gestante, DM, imunossupressão, DRC → urocultura obrigatória, tratamento mais longo, nitrofurantoína não é boa escolha.</li>
   <li>EAS: <b>piúria</b> (leucocitúria), <b>nitrito +</b> (Enterobacterales reduzem nitrato), hematúria. Urocultura: ≥ 10⁵ UFC/mL (em sintomáticos, ≥ 10³ já é significativo).</li>
   <li><b>E. coli</b> (≈ 80% das cistites): bacilo Gram-negativo, fermenta lactose; adesinas <b>fímbria tipo 1 (FimH)</b> → bexiga; <b>fímbria P</b> → pielonefrite.</li>
  </ul>`,
  deep: `
  <h3>Patogênese</h3>
  <p>A ITU é quase sempre <b>ascendente</b>: uropatógenos da flora intestinal colonizam o introito vaginal e a uretra e sobem à bexiga. Na mulher, a uretra curta facilita. Fatores da paciente: <b>idade</b> (pós-menopausa: atrofia urogenital, perda de lactobacilos, pH vaginal ↑), <b>diabetes</b> (glicosúria, neuropatia vesical, imunidade), <b>estenose uretral</b> (fluxo turbulento, resíduo pós-miccional — urina parada é meio de cultura) e radioterapia pélvica prévia (cistite actínica, fibrose).</p>
  ${D.fig('img/c8-ecoli.jpg','E. coli no Gram: bacilos Gram-negativos (rosados), curtos.', WC)}
  ${D.tbl(['Fator de virulência da UPEC','Função'],[
   ['<b>Fímbria tipo 1</b> (adesina FimH)','liga-se a resíduos de <b>manose</b> do urotélio → cistite; forma comunidades intracelulares'],
   ['<b>Fímbria P</b> (Pap)','liga-se a glicolipídios do rim → <b>pielonefrite</b>'],
   ['Hemolisina, CNF-1','lesão tecidual'],
   ['Sideróforos (aerobactina)','captação de ferro'],
   ['Cápsula (antígeno K) e LPS (O)','resistência ao complemento, inflamação, febre']])}
  <h3>Diagnóstico</h3>
  <ul>
   <li><b>EAS</b>: leucocitúria (piúria), <b>nitrito positivo</b> (só Enterobacterales; enterococo e estafilococo não reduzem nitrato), esterase leucocitária, hematúria, bacteriúria.</li>
   <li><b>Urocultura com antibiograma</b>: em cistite não complicada de mulher jovem pode ser dispensada; nesta paciente (complicada) é obrigatória.</li>
   <li>Coleta de jato médio após higiene; ≥ 10⁵ UFC/mL é o critério clássico.</li>
  </ul>
  ${D.trap('<p><b>Bacteriúria assintomática</b> em idosa ou diabética <b>não se trata</b> (exceto gestante e antes de procedimento urológico). Tratar só piúria sem sintomas gera resistência e efeitos adversos — prevenção quaternária.</p>')}
  ${D.integ('<p>A escolha empírica para cistite não complicada no Brasil costuma ser <b>fosfomicina</b> (dose única) ou <b>nitrofurantoína</b> (5 dias, 100 mg 6/6 h ou 12/12 h na forma macrocristalina). Ambas concentram na urina. Mas a nitrofurantoína depende do rim para chegar lá.</p>','Integração · Farmacologia')}`,
  qs:[

   {q:'Nitrito positivo no EAS sugere:',
    o:['Enterococo','Enterobacterales (como E. coli)','Staphylococcus saprophyticus','Candida','Uretrite por clamídia'], a:1, d:['lab','micro'], e:'Redução de nitrato a nitrito.'},

 /* S2 */
 {id:'s2', title:'Fisiologia renal e taxa de filtração glomerular', short:'TFG', d:['fisio','lab'],
  quick: `
  <ul>
   <li><b>TFG</b> normal ≈ 120 mL/min/1,73 m²; cai ~1 mL/min/ano após os 40.</li>
   <li>Determinantes: pressão hidrostática glomerular (arteríola <b>aferente</b> dilatada por prostaglandinas; <b>eferente</b> contraída por angiotensina II), oncótica, coeficiente de filtração.</li>
   <li><b>Creatinina</b> depende da massa muscular: idosa magra pode ter creatinina “quase normal” com TFG baixa.</li>
   <li>Estimativas: <b>Cockcroft-Gault</b> (ClCr, mL/min — ajuste de dose), <b>CKD-EPI 2021</b> (TFGe, mL/min/1,73 m² — estadiar DRC), cistatina C, clearance de urina de 24 h; padrão-ouro: inulina/iohexol.</li>
  </ul>
  <div class="widget" data-w="cg"></div>`,
  deep: `
  ${D.fig('img/c8-slide-nefron.jpg','O néfron: glomérulo (filtração), túbulo proximal, alça de Henle, túbulo distal e ducto coletor; excreção = filtração − reabsorção + secreção.', SL)}
  <h3>Como o glomérulo filtra</h3>
  ${D.fig('img/c8-glomerulo.png','Tipos celulares do glomérulo: endotélio fenestrado, membrana basal, podócitos (fendas de filtração) e mesângio.', WC)}
  <p>A barreira de filtração (endotélio fenestrado, membrana basal, fendas dos podócitos) deixa passar água e pequenos solutos e retém proteínas grandes e com carga negativa. A <b>TFG</b> = Kf × (ΔP hidrostática − Δπ oncótica). O rim mantém a TFG estável em ampla faixa de pressão arterial (<b>autorregulação</b>: reflexo miogênico e feedback tubuloglomerular), e ajusta o tônus das arteríolas:</p>
  ${D.tbl(['Situação','Aferente','Eferente','TFG'],[
   ['Prostaglandinas (PGE2, PGI2)','<b>dilata</b>','—','mantém em hipovolemia'],
   ['Angiotensina II','—','<b>contrai</b>','mantém em hipovolemia'],
   ['<b>AINE</b> (bloqueia PG)','contrai','—','<b>↓</b>'],
   ['<b>IECA/BRA</b> (bloqueia AII)','—','dilata','<b>↓</b>'],
   ['AINE + IECA/BRA + diurético','“triple whammy”','','<b>LRA</b> em idosos']])}
  <h3>Medir a TFG</h3>
  <p><b>Clearance</b> é o volume de plasma completamente “limpo” de uma substância por minuto. Uma substância livremente filtrada, nem reabsorvida nem secretada, tem clearance = TFG (<b>inulina</b>, padrão-ouro, só pesquisa). Na prática:</p>
  <ul>
   <li><b>Creatinina sérica</b>: produzida pelo músculo em taxa constante; é filtrada e um pouco <b>secretada</b> (superestima a TFG). Depende de massa muscular, dieta (carne), idade, sexo. Relação hiperbólica com a TFG: só sobe acima do normal quando metade da função já se foi.</li>
   <li><b>Clearance de creatinina em urina de 24 h</b> = (Cr urinária × volume urinário) / (Cr sérica × tempo). Útil em extremos de massa muscular; erro frequente de coleta.</li>
   <li><b>Cockcroft-Gault</b>: ClCr = (140 − idade) × peso / (72 × Cr) × 0,85 se mulher. Em mL/min, não indexado — <b>usado para ajuste de doses</b> (estudos de bula foram feitos com ele).</li>
   <li><b>CKD-EPI 2021</b> (sem raça): TFGe em mL/min/1,73 m² — <b>estadiar e acompanhar DRC</b>.</li>
   <li><b>Cistatina C</b>: produzida por todas as células nucleadas, menos dependente de músculo; útil em idosos, sarcopênicos, amputados.</li>
  </ul>
  <div class="widget" data-w="cg"></div>
  ${D.integ('<p>A paciente: (140 − 74) × 65 / (72 × 1,9) × 0,85 = <b>≈ 27 mL/min</b>. Com o mesmo 1,9, um homem de 30 anos e 90 kg teria ≈ 72 mL/min. A creatinina isolada engana.</p>','Integração · Cálculo')}`,

   {q:'Clearance de creatinina (Cockcroft-Gault) da paciente: 74 anos, 65 kg, Cr 1,9, sexo feminino:',

   {q:'Por que a creatinina sérica superestima a função renal em idosos magros?',
    o:['Porque é reabsorvida no túbulo','Porque a produção depende da massa muscular, que está reduzida','Porque é metabolizada no fígado','Porque é secretada pelo intestino','Porque cai com a idade a TFG'], a:1, d:['lab','fisio'], e:'Menos músculo, menos creatinina.'},
   {q:'O AINE reduz a TFG em hipovolemia porque:',
    o:['Dilata a eferente','Bloqueia as prostaglandinas que dilatam a arteríola aferente','Estimula a renina','Aumenta a oncótica','Obstrui o túbulo'], a:1, d:['farmaco','fisio'], e:'Perda da vasodilatação aferente.'}
