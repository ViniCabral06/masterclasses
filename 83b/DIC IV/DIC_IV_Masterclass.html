${D.dbox('pato',`<p>Neuropatia tóxica: degeneração axonal distal comprimento-dependente. Nefropatia diabética: espessamento da membrana basal, expansão mesangial, <b>nódulos de Kimmelstiel-Wilson</b>, arteriolosclerose hialina (aferente e eferente) → albuminúria → DRC. NTA (isquemia, aminoglicosídeo, contraste): necrose das células tubulares, cilindros granulosos “marrom-barrentos”.</p>`)}
${D.dbox('farmaco',`<p>Fármacos que exigem ajuste/evitação na DRC (lista de bolso): nitrofurantoína (&lt; 30), metformina (&lt; 30 contraindicada; 30–45 reduzir), aminoglicosídeos e vancomicina (nível sérico), enoxaparina, gabapentina/pregabalina, digoxina, lítio, aciclovir, sulfametoxazol-trimetoprima (hipercalemia), AINEs (evitar). <b>Metformina</b> também reduz <b>B12</b> (neuropatia; anemia megaloblástica — ${D.lk(7,'Hemograma')}).</p>`)}

  {q:'Como é essa dor no peito? Onde dói?', a:'Dói aqui no meio do peito, queimando, às vezes vai pro braço esquerdo. Dura uns 10 minutos. Já tive descansando também.'},
  {q:'Desde quando?', a:'A dor tem uns 3 anos; piorou de um ano pra cá. Falaram que era estresse.'},
  {q:'Como é a falta de ar?', a:'Subir escada já me cansa. E durmo com dois travesseiros. Tem noite que acordo sufocada e preciso sentar na beira da cama.'},
  {q:'Como são as palpitações?', a:'O coração bate rápido e todo desencontrado. Começa de repente. Às vezes dura horas.'},

  {q:'Já desmaiou?', a:'Nunca desmaiei.'},
  {q:'Inchaço nas pernas? Tosse?', a:'Inchaço não. Tosse seca de noite, às vezes.'},
  {q:'Teve muita dor de garganta ou dor nas juntas na infância?', a:'Ah, tinha muita amigdalite. Lembro que com uns 10 anos fiquei de cama com os joelhos inchados, uma dor que mudava de junta.'},
  {q:'Usou injeção de benzetacil por muito tempo?', a:'Tomei umas vezes quando criança, depois parei.'},
  {q:'Tem pressão alta, diabetes? Usa remédios?', a:'Pressão alta controlada, tomo losartana.'},
  {q:'Fuma?', a:'Fumei 15 anos, um maço por dia. Parei faz 15 anos.'},
  {q:'Está grávida ou pensa em engravidar?', a:'Não. Tenho dois filhos, as gestações foram bem.'},
  {q:'Alguém na família tem problema de coração?', a:'Pai e mãe hipertensos.'}],
 persona:'Você é Maria, 41 anos, auxiliar administrativa. Queixa: “Meu coração dispara e de noite eu acordo sem ar.” Dor retroesternal em queimação há 3 anos, pior há 1 ano, irradia para MSE e epigástrio, dura até 10 minutos, aos esforços e em repouso; disseram que era estresse. Dispneia aos médios esforços (subir escada), ortopneia (2 travesseiros), dispneia paroxística noturna. Palpitações rápidas e irregulares, início súbito, duram horas. Tosse seca noturna. Sem síncope, sem edema. Na infância: amigdalites de repetição e, aos 10 anos, artrite migratória de joelhos (ficou de cama); tomou benzetacil algumas vezes e parou. HAS em losartana. Ex-tabagista (15 anos, 1 maço/dia; parou há 15 anos). Pais hipertensos. Dois filhos, gestações sem problemas. Responda só o que for perguntado, em linguagem leiga.',

  {q:'Palpitações rápidas, “desencontradas”, de início súbito, numa paciente com EM sugerem:', o:['Taquicardia sinusal','Fibrilação atrial','Extrassístoles isoladas','Bradicardia','Normal'], a:1, d:['clin'], e:'AE dilatado → FA (Leito 02); risco de embolia (Leito 09).'},

/* ================= 3 ================= */
{id:3, th:'Anamnese Cardiovascular', icon:'🫀', dic:[4,10], time:600,
 title:'Falta de ar, pernas inchadas e o barbeiro',
 door:'Ambulatório. <b>Benedito</b>, 58 anos, lavrador do norte de Minas, vem com a filha. Queixa de “canseira e inchaço nas pernas”.',
 task:'Realize a anamnese cardiovascular, incluindo os dados epidemiológicos relevantes, e apresente a hipótese.',
 actor:[
  {q:'O que o senhor está sentindo?', a:'“Uma canseira que não acaba e as pernas inchando.”'},
  {q:'A falta de ar aparece com qual esforço?', a:'Antes eu capinava o dia todo. Agora cansa pra trocar de roupa.'},
  {q:'Consegue deitar reto?', a:'Durmo com três travesseiros. Se deito reto, sufoco.'},
  {q:'Já desmaiou ou ficou tonto de repente?', a:'Duas vezes este ano eu apaguei de repente, sem aviso. Caí no curral.'},
  {q:'Sente o coração disparar ou falhar?', a:'Falha, parece que dá uns pulos.'},
  {q:'O inchaço é nas duas pernas? Piora no fim do dia?', a:'Nas duas, deixa marca do dedo. Piora de tarde.'},
  {q:'Tem dificuldade para engolir ou intestino preso?', a:'A comida às vezes entala, tenho que beber água. Intestino é preso, fico 5, 6 dias sem ir.'},
  {q:'Como era a casa onde o senhor cresceu?', a:'Casa de pau-a-pique, na roça. Tinha muito barbeiro na parede.'},
  {q:'Já recebeu transfusão? Alguém da família tem doença de Chagas?', a:'Transfusão nunca. Minha mãe tinha Chagas, morreu nova do coração.'},
  {q:'Usa algum remédio?', a:'Furosemida, um de pressão que começa com “enala”, e o da tireoide.'},
  {q:'Fuma, bebe?', a:'Parei de fumar há 7 anos e de beber há 2.'},
  {q:'Está dormindo bem?', a:'Acordo muito de noite. A filha diz que eu paro de respirar e depois respiro forte.'}],
 persona:'Você é Benedito, 58 anos, lavrador do norte de Minas, acompanhado da filha. Queixa: “uma canseira que não acaba e as pernas inchando”. Dispneia progressiva, hoje aos mínimos esforços (trocar de roupa); ortopneia com 3 travesseiros; edema bilateral vespertino com cacifo; duas síncopes súbitas sem pródromo este ano; palpitações tipo “falhas”; disfagia (comida entala, precisa de água); constipação de 5–6 dias; insônia e respiração periódica observada pela filha (para e depois respira forte). Infância em casa de pau-a-pique com barbeiros. Mãe com Chagas, morreu jovem do coração. Sem transfusões. Usa furosemida, enalapril e levotiroxina. Ex-tabagista há 7 anos, ex-etilista há 2. Responda só o que for perguntado, em linguagem simples do interior.',
 check:['#Segurança e abertura', ...ID, ...ATT,
  '#Sintomas',
  {t:'Dispneia: grau de esforço (grandes/médios/pequenos), ortopneia, DPN', c:true},
  {t:'Edema: localização, simetria, horário, cacifo'},
  {t:'Síncope: circunstância, pródromos, recuperação (alarme: arritmia/bloqueio)', c:true},
  {t:'Palpitações e características'},
  {t:'Alterações do sono, padrão de Cheyne-Stokes, astenia'},
  '#Integração com outros sistemas',
  {t:'Pesquisa disfagia e constipação (formas digestivas do Chagas)'},
  {t:'Epidemiologia: moradia na infância, contato com triatomíneo, transfusões, mãe com Chagas', c:true},
  '#Antecedentes',
  {t:'Medicamentos com nome e dose, comorbidades (hipotireoidismo)'},
  {t:'Tabagismo, etilismo; história familiar'},
  '#Fechamento',
  {t:'Classifica funcionalmente (NYHA IV) e levanta hipótese de cardiopatia chagásica com IC e arritmia'}],
 post:[
  {q:'Classe funcional NYHA de quem cansa ao trocar de roupa:', o:['I','II','III','IV','Não se aplica'], a:2, d:['clin'], hard:true, e:'Pela guia, trocar de roupa é pequeno esforço: limitação acentuada = NYHA III. Classe IV = sintomas em repouso ou a qualquer atividade.'},
  {q:'Síncope súbita sem pródromo num chagásico sugere principalmente:', o:['Vasovagal','Arritmia (BAV, taquicardia ventricular)','Hipoglicemia','Crise convulsiva','Ansiedade'], a:1, d:['clin','pato'], e:'Destruição do sistema de condução; risco de morte súbita.'},
  {q:'Respiração com períodos de apneia seguidos de incursões progressivamente maiores e depois menores é:', o:['Kussmaul','Cheyne-Stokes','Biot','Taquipneia','Apneia obstrutiva'], a:1, d:['semio'], e:'Pela guia: IC esquerda, doença coronariana, lesões centrais.'},
  {q:'Disfagia e constipação crônica no chagásico se devem a:', o:['Efeito da furosemida','Destruição dos plexos mioentéricos (megaesôfago e megacólon)','Hipotireoidismo isolado','Câncer de esôfago sempre','Ansiedade'], a:1, d:['pato'], e:'Plexo de Auerbach (Leito 04 e anatomia da parede intestinal do Leito 10).'}],
 pearls:'<p>No Chagas, a anamnese cardiovascular <b>não termina no coração</b>: pergunte por disfagia, constipação, moradia, barbeiro, transfusão e mãe com Chagas (transmissão congênita). <b>Síncope sem pródromo</b> é sinal de alarme para arritmia. Atenção à pegadinha de classificação: “trocar de roupa” é pequeno esforço (NYHA III), sintoma em repouso é IV.</p>'},

  {q:'O que trouxe você aqui?', a:'“Estou com diarreia com sangue faz dois meses.”'},

  {q:'Tem dor na barriga? Onde, como?', a:'Uma cólica espalhada, nota 7. Não vai pra lugar nenhum.'},

  {q:'O sangue é vivo ou escuro, tipo borra de café?', a:'Vermelho vivo, misturado com as fezes.'},

  {q:'Água e saneamento?', a:'Água tratada e esgoto em casa.'},
  {q:'Dor nas juntas, olhos vermelhos, feridas na pele ou na boca?', a:'Às vezes o joelho dói. Olho não.'},
  {q:'Pele ou olhos amarelados? Urina escura?', a:'Não.'},
  {q:'Já teve alguma doença? Cirurgias?', a:'Hepatite A quando criança. Nunca operei.'},
  {q:'Na família alguém tem doença do intestino ou câncer?', a:'Que eu saiba, não. Mãe tem pressão alta e diabetes.'},
  {q:'Fuma? Bebe?', a:'Não fumo, não bebo. Faço academia 3 vezes por semana.'},
  {q:'Menstruação, contraceptivo?', a:'Uso pílula. Menstruação regular, a última foi há duas semanas.'}],
 persona:'Você é Juliana, 27 anos, administradora, de Salvador. Queixa: “Estou com diarreia com sangue faz dois meses.” 6–8 evacuações/dia, líquidas, sangue vivo misturado e muco, despertar noturno para evacuar, tenesmo e urgência, cólica difusa 7/10 sem irradiação. Perda de peso não quantificada, astenia, pele seca e descamativa. Sem febre, sem vômitos. Sem uso de antibióticos ou AINE, sem viagens, água tratada e saneamento. Artralgia ocasional de joelho. Sem icterícia ou colúria. Hepatite A na infância, sem cirurgias. Mãe com HAS e DM. Não fuma, não bebe, academia 3x/semana. Usa anticoncepcional oral, DUM há 2 semanas. Responda só o que for perguntado.',

  {m:'Hepatimetria (linha hemiclavicular D)', f:'Limite superior no 5º EIC; limite inferior 5 cm abaixo do rebordo: <b>hepatimetria ≈ 16 cm</b>.', img:'img/th-hepatimetria.jpg'},

  {m:'Macicez móvel', f:'<b>Positiva</b>: em decúbito lateral, a macicez se desloca para o flanco declive.', img:'img/th-macicez-movel.jpg'},
  {m:'Sinal do piparote (com a mão de um assistente na linha média)', f:'Negativo (ascite moderada, grau II).', img:'img/th-piparote.jpg'},

  {m:'Palpação profunda e do fígado (simples / Lemos-Torres / Mathieu)', f:'Fígado palpável <b>5 cm abaixo do rebordo costal D</b>, borda romba, superfície lisa, consistência aumentada, <b>doloroso</b>. Refluxo hepatojugular positivo.', img:'img/th-palp-simples.jpg'},
  {m:'Baço (palpação simples / Schuster)', f:'Não palpável.', img:'img/th-schuster.jpg'},
  {m:'Percussão do hipocôndrio D (Jobert / Torres-Homem)', f:'Maciço e indolor à percussão (Jobert e Torres-Homem negativos).'}],
 check:['#Preparo', {t:'Higieniza as mãos, assepsia do estetoscópio, luvas', c:true}, {t:'Paciente urinou; decúbito dorsal, braços ao lado, abdome exposto do xifoide à sínfise; examinador à direita'}, {t:'Aquece as mãos e o estetoscópio; começa pelas áreas indolores'},
  '#Sequência',
  {t:'Respeita a ordem: inspeção → ausculta → percussão → palpação', c:true},
  {t:'Inspeção: forma, simetria, abaulamentos, cicatrizes, peristaltismo, pulsações, hérnias, circulação colateral'},
  {t:'Ausculta nos 4 quadrantes (≈ 2 min cada) e pesquisa de sopros'},
  '#Percussão',
  {t:'Percussão geral para explicar o abdome globoso (gordura, líquido ou gás)'},
  {t:'Hepatimetria na linha hemiclavicular direita', c:true},
  {t:'Espaço de Traube'},
  {t:'Pesquisa de ascite: Skoda, macicez móvel e piparote com apoio da mão na linha média', c:true},
  '#Palpação',
  {t:'Superficial em todos os quadrantes (tensão, dor, hérnias, irritação peritoneal)'},
  {t:'Profunda em sequência padronizada (ex.: horária a partir do HE)'},
  {t:'Palpa o fígado na inspiração profunda (simples, Lemos-Torres ou Mathieu) e descreve borda, superfície, consistência, sensibilidade'},
  {t:'Palpa o baço (inclusive em posição de Schuster)'},
  '#Síntese',
  {t:'Conclui: hepatomegalia congestiva dolorosa + ascite grau II → hipertensão venosa pós-hepática (IC direita)'}],
 post:[
  {q:'Por que a ausculta vem antes da percussão e da palpação?', o:['É mais rápida','Percutir e palpar podem estimular o peristaltismo e mascarar hipoperistalse','O paciente prefere','Para aquecer o estetoscópio','Não há motivo'], a:1, d:['semio'], e:'Literal da guia.'},
  {q:'Pela guia, ascite grau II é comprovada por:', o:['Somente ultrassom','Semicírculos de Skoda e macicez móvel','Piparote positivo','Sinal de Jobert','Sinal de Murphy'], a:1, d:['prope'], e:'Grau III: piparote; grau I: só imagem.'},
  {q:'Timpanismo à percussão do hipocôndrio direito (sinal de Jobert) indica:', o:['Abscesso hepático','Pneumoperitônio','Esplenomegalia','Ascite','Normal'], a:1, d:['semio'], e:'Patognomônico pela guia; ex.: perfuração no megacólon tóxico (Leito 10).'},
  {q:'Na ascite por IC direita, a classificação pela guia é de hipertensão portal:', o:['Pré-sinusoidal','Sinusoidal','Pós-hepática','Não relacionada ao fígado','Não há hipertensão portal'], a:2, d:['fisio'], e:'Congestão retrógrada (fígado em noz-moscada, Leito 04).'}],
 pearls:'<p>Erros que custam ponto: palpar antes de auscultar, começar pela área dolorosa, esquecer o Traube e não usar a mão do assistente no piparote. Hepatimetria normal varia de 6 a 12 cm e é subjetiva: confirme a hepatomegalia palpando. Fígado congesto é <b>liso, rombo e doloroso</b>; cirrótico é endurecido e irregular.</p>'},

/* ================= 7 ================= */
{id:7, th:'Exame Proctológico', icon:'🔎', dic:[10], time:420,
 title:'Sangue nas fezes: o toque retal na RCU',
 door:'Ambulatório. Mesma paciente de 27 anos com diarreia sanguinolenta e tenesmo. O exame será no modelo de simulação.',
 task:'Realize o exame proctológico completo (inspeção, palpação, toque retal e anuscopia) e descreva os achados.',
 exam:[
  {m:'Posicionamento', f:'Posição de <b>Sims</b> (decúbito lateral esquerdo, perna esquerda estendida, direita fletida a 90°).', img:'img/th-sims.jpg'},
  {m:'Inspeção estática', f:'Pele perianal íntegra, sem plicomas, fissuras, fístulas ou condilomas; leve hiperemia perianal pelas evacuações frequentes.', img:'img/th-perianal.jpg'},
  {m:'Inspeção dinâmica (pedir para fazer força)', f:'Sem prolapso hemorroidário ou retal.'},
  {m:'Palpação perianal', f:'Sem calor, flutuação, áreas endurecidas ou trajetos fibrosos.'},
  {m:'Toque retal: tônus e mucosa', f:'Tônus esfincteriano preservado; mucosa retal <b>granulosa, dolorosa</b> ao toque; ampola com fezes líquidas; anel anorretal palpável; contração do puborretal presente.'},
  {m:'Inspeção da luva', f:'<b>Sangue vivo e muco</b> aderidos à luva.'},
  {m:'Anuscopia', f:'Mucosa do canal anal e reto distal <b>hiperemiada, friável, com perda do padrão vascular</b> e erosões, a partir da linha pectínea.', img:'img/th-anuscopio.jpg'}],
 check:['#Preparo', {t:'Higieniza as mãos, calça luvas, explica o exame e obtém consentimento', c:true}, {t:'Garante privacidade (lençol) e oferece acompanhante'},
  {t:'Posiciona em Sims ou genupeitoral'},
  '#Sequência',
  {t:'Inspeção estática: pele, pelos, esfíncter, resíduos, cicatrizes, secreções, sangramento'},
  {t:'Inspeção dinâmica pedindo esforço evacuatório'},
  {t:'Palpação perianal (calor, dor, flutuação, infiltração, trajetos)'},
  '#Toque retal',
  {t:'Lubrifica a luva (e anestésico tópico)'},
  {t:'Comprime a borda anterior do orifício e aguarda o relaxamento antes de introduzir, em direção anterior', c:true},
  {t:'Examina toda a circunferência da mucosa, ampola, anel anorretal e estruturas extrarretais'},
  {t:'Pesquisa a contração do puborretal (esforço não evacuatório)'},
  {t:'Observa e descreve o material na luva (sangue, muco, pus, fezes)', c:true},
  '#Anuscopia',
  {t:'Lubrifica e introduz com mandril, direção ao umbigo, retira o mandril e avalia a mucosa'},
  {t:'Descreve as alterações com a distância da borda anal'},
  '#Integração',
  {t:'Relaciona com a RCU (proctite contínua) e indica retossigmoidoscopia/colonoscopia com biópsia'}],
 post:[
  {q:'Pela guia, em afecções anais agudas e muito dolorosas (fissura, trombose hemorroidária), o exame deve:', o:['Ser completo sempre','Restringir-se à inspeção e palpação perianal','Começar pela anuscopia','Ser feito sem luvas','Ser adiado indefinidamente'], a:1, d:['prope'], e:'Respeitar a dor.'},
  {q:'A estrutura palpada posteriormente que forma o ângulo anorretal e garante a continência é:', o:['Esfíncter interno','Músculo puborretal (anel anorretal)','Próstata','Cóccix','Útero'], a:1, d:['prope'], e:'Parte do levantador do ânus.'},
  {q:'Sangue e muco na luva com mucosa retal granulosa e friável sugerem:', o:['Hemorroida apenas','Proctite (RCU)','Fissura','Constipação','Normal'], a:1, d:['clin'], e:'A RCU sempre começa no reto.'},
  {q:'Posição que retifica a junção retossigmoide e facilita o retossigmoidoscópio:', o:['Sims','Genupeitoral','Trendelenburg','Litotomia','Decúbito dorsal'], a:1, d:['prope'], e:'Joelhos e tórax apoiados.'}],
 pearls:'<p>O exame proctológico <b>completa o exame do abdome</b>. O momento mais avaliado é a introdução do dedo: comprimir a borda anterior e <b>esperar o esfíncter relaxar</b>. Ao retirar, descreva sempre a luva. Na RCU, a proctite é universal — o toque e a anuscopia já mostram a doença.</p>'},

/* ================= 8 ================= */
{id:8, th:'Exame Proctológico (toque prostático)', icon:'🔎', dic:[3,8], time:420,
 title:'Jato fraco, levanta à noite e a doxazosina',

  {m:'Inspeção estática e dinâmica', f:'Sem lesões, sem prolapso.'},
  {m:'Toque: próstata', f:'Próstata <b>aumentada (~2 vezes)</b>, superfície <b>lisa</b>, consistência <b>fibroelástica</b>, simétrica, sulco mediano apagado, indolor, sem nódulos.', img:'img/th-toque.jpg'},
  {m:'Toque: mucosa e ampola', f:'Mucosa lisa, ampola com fezes formadas; puborretal contrai bem.'},
  {m:'Luva', f:'Fezes formadas, sem sangue ou muco.'}],
 check:['#Preparo', {t:'Higieniza as mãos, luvas, explica e pede consentimento', c:true}, {t:'Privacidade e posição adequada'},
  '#Técnica', {t:'Lubrifica a luva e o orifício'}, {t:'Comprime a borda anterior, espera relaxar e introduz em direção anterior', c:true},
  {t:'No homem, avalia primeiro a próstata (anterior, na linha média)'},
  {t:'Descreve tamanho, superfície, consistência, simetria, sulco mediano, sensibilidade, nódulos', c:true},
  {t:'Avalia mucosa, anel anorretal e pede contração do puborretal'},
  {t:'Descreve a luva'},
  '#Integração',
  {t:'Diferencia HPB (lisa, fibroelástica, simétrica) de câncer (pétrea, nodular, irregular)'},
  {t:'Comenta a doxazosina (α1) e o risco de hipotensão postural; PSA como decisão compartilhada'}],
 post:[
  {q:'Próstata pétrea, nodular e assimétrica ao toque sugere:', o:['HPB','Câncer de próstata','Prostatite crônica sempre','Normal','Cálculo'], a:1, d:['pato','semio'], e:'Zona periférica, acessível ao toque.'},
  {q:'Mecanismo da doxazosina na HPB:', o:['Inibe a 5α-redutase','Bloqueia receptores α1 do músculo liso prostático e do colo vesical','Antimuscarínico','Agonista β3','Diurético'], a:1, d:['farmaco'], e:'Relaxa → melhora o jato; hipotensão postural.'},
  {q:'Resíduo pós-miccional elevado por obstrução prostática favorece:', o:['Proteção contra ITU','Infecção urinária e hidronefrose','Hipercalemia isolada','Hipotireoidismo','Nada'], a:1, d:['fisio'], e:'Urina parada; obstrução → LRA pós-renal (Leito 08).'},
  {q:'Nitrofurantoína para ITU num idoso com ClCr 25 mL/min:', o:['Ideal','Evitar (ineficaz e neurotóxica)','Dobrar a dose','Associar à doxazosina','Sem relação com o rim'], a:1, d:['farmaco'], e:'Leito 08.'}],
 pearls:'<p>A próstata é a <b>primeira estrutura avaliada no homem</b>: anterior, linha média, logo acima do esfíncter. Descreva como um laudo: tamanho, superfície, consistência, simetria, sulco, dor, nódulos. HPB = lisa e fibroelástica; câncer = pétrea e nodular. O rim e os fármacos entram na conversa: obstrução causa LRA pós-renal e muda doses.</p>'},

  {m:'Nível de consciência / Glasgow', f:'Lúcido; Glasgow 14 (O4, V4 pela afasia, M6).'},
  {m:'Pupilas e reflexo fotomotor direto e consensual', f:'Isocóricas, fotorreagentes, reflexos direto e consensual presentes.'},

  {m:'Boca: língua e palato', f:'Língua com discreto desvio para a D; palato simétrico; <b>disartria</b>.'},
  {m:'Fala e linguagem', f:'Compreende comandos simples; fala não fluente, frases curtas: <b>afasia de expressão</b>.'},

  {m:'Mingazzini e Barré (MMII)', f:'Queda do MID após ~15 s.', img:'img/th-manobras.jpg'},
  {m:'Força (MRC)', f:'MSD e MID <b>grau 3</b> (vencem a gravidade, não sustentam 10 s); esquerda grau 5.'},
  {m:'Reflexos bicipital, tricipital, patelar, aquileu', f:'<b>Vivos à direita</b> (início agudo pode ter hiporreflexia), normais à esquerda.', img:'img/th-reflexos.jpg'},
  {m:'Cutâneo-plantar', f:'<b>Extensor à direita (Babinski)</b>; flexor à esquerda.', img:'img/th-plantar.jpg'},
  {m:'Índex-nariz', f:'Prejudicado à D pela paresia; normal à E.'},
  {m:'Romberg e marcha', f:'Não realizados com segurança (paciente não sustenta ortostase sem apoio).'},
  {m:'Fundoscopia / reflexo vermelho', f:'Reflexo vermelho presente bilateralmente; sem papiledema.', img:'img/th-reflexo-vermelho.jpg'}],
 check:['#Preparo', {t:'Higieniza mãos e equipamentos; apresenta-se; ambiente silencioso', c:true}, {t:'Pergunta o último momento visto bem e pede glicemia capilar', c:true},
  '#Exame craniocaudal',
  {t:'Nível de consciência (Glasgow)'},
  {t:'Pupilas e reflexo fotomotor direto e consensual'},
  {t:'Movimentos oculares e campo visual por confrontação (1 m, um olho coberto)'},
  {t:'Sensibilidade tátil em 3 regiões da face, braços e pernas'},
  {t:'Mímica facial (franzir, sorrir, bico) e diferencia central × periférica', c:true},
  {t:'Boca: abertura, língua, palato, voz'},
  {t:'Manobras deficitárias: braços estendidos, Mingazzini, Barré (≈ 40 s)'},
  {t:'Gradua a força pela escala 0–5'},
  {t:'Reflexos com o posicionamento da guia: bicipital (decúbito), tricipital e patelar (sentado), aquileu (ajoelhado na cadeira)'},
  {t:'Reflexo cutâneo-plantar (borda lateral da planta)'},
  {t:'Coordenação (índex-nariz), Romberg e marcha quando seguro'},
  '#Síntese e conduta',
  {t:'Localiza: hemisfério E, território da ACM (afasia + hemiparesia D braquiofacial + paralisia facial central)', c:true},

  {q:'Pela guia, o reflexo aquileu é pesquisado com o paciente:', o:['Em decúbito dorsal','Sentado com pés pendentes','De joelhos sobre uma cadeira, pés para fora do assento','Em pé','Em decúbito ventral'], a:2, d:['prope'], e:'Raiz L5–S2.'},
  {q:'Pela guia, força grau 3 significa:', o:['Sem contração','Contração sem movimento','Vence a gravidade mas não sustenta 10 s','Vence resistência parcial','Normal'], a:2, d:['prope'], e:'Gradação da guia de TH.'},
  {q:'No AVC hemisférico agudo, o olhar desvia:', o:['Para o lado da lesão','Para o lado parético','Para cima','Não desvia','Para baixo'], a:0, d:['semio'], e:'“Olha para a lesão.”'}],
 pearls:'<p>A guia pede o diagnóstico em três tempos: <b>sindrômico</b> (síndrome piramidal + afasia), <b>topográfico</b> (ACM esquerda) e <b>etiológico</b> (cardioembolia por FA — as bulhas arrítmicas). No OSCE de AVC, <b>tempo e glicemia</b> contam pontos antes de qualquer martelo. Babinski agudo pode já estar presente mesmo com hiporreflexia de choque.</p>'},

/* ================= 10 ================= */
{id:10, th:'Semiologia Neurológica Fundamental', icon:'🧠', dic:[8,7], time:540,
 title:'Formigamento que sobe dos pés',

  {m:'Pares cranianos e mímica facial', f:'Normais; sem paralisia facial.'},
  {m:'Sensibilidade tátil e dolorosa', f:'Hipoestesia em <b>bota</b> até o terço médio das coxas e em <b>luva</b> nos punhos, simétrica.'},

  '#Exame dirigido',
  {t:'Sensibilidade tátil/dolorosa comparando distal × proximal e lados; mapeia o limite'},
  {t:'Sensibilidade vibratória (diapasão) e propriocepção do hálux'},
  {t:'Força distal × proximal e manobras deficitárias'},
  {t:'Reflexos profundos com posicionamento correto; aquileu ajoelhado na cadeira'},
  {t:'Cutâneo-plantar'},

 post:[

  {q:'No paciente cerebelar, ao contrário do Romberg sensitivo:', o:['Só cai ao fechar os olhos','Tem instabilidade já de olhos abertos (astasia/distasia), base alargada','Não tem desequilíbrio','Cai sempre para o mesmo lado','Melhora ao fechar os olhos'], a:1, d:['semio'], e:'Cerebelo não depende da visão para mostrar o déficit.'},

D.W.caderneta = (w) => {
  let pool = CHIPS.map((c,i)=>({t:c[0],a:c[1],i})).sort(()=>Math.random()-.5);
  let sel = null, placed = {}, errors = 0;
  w.innerHTML = `<h4>Monte a caderneta (CNV 2025, 0–4 anos)</h4><p class="wsub">Toque numa vacina e depois na idade em que ela é aplicada. Acertou, ela fica na idade; errou, ela volta para a pilha.</p>
  <div class="cdn-pool" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
  <div class="cdn-ages" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px"></div>
  <div class="cdn-st mono" style="margin-top:10px;font-size:13px"></div>`;
  const poolEl = w.querySelector('.cdn-pool'), agesEl = w.querySelector('.cdn-ages'), st = w.querySelector('.cdn-st');
  function paint(){
    poolEl.innerHTML = pool.filter(c=>!placed[c.i]).map(c=>`<button class="btn sm" data-i="${c.i}" style="${sel===c.i?'background:var(--teal-600);color:#fff;border-color:var(--teal-600)':''}">${c.t}</button>`).join('') || '<b style="color:var(--green)">Caderneta completa!</b>';
    agesEl.innerHTML = AGES.map(a=>`<button data-a="${a}" style="all:unset;box-sizing:border-box;cursor:pointer;border:1px dashed var(--line-2);border-radius:8px;padding:8px;min-height:64px;background:var(--paper)"><b style="font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-600)">${a}</b><div style="font-size:12.5px;line-height:1.35;margin-top:4px">${pool.filter(c=>placed[c.i]&&c.a===a).map(c=>c.t).join('<br>')}</div></button>`).join('');
    const n = Object.keys(placed).length;
    st.textContent = `${n}/${CHIPS.length} colocadas · ${errors} erro(s)`;
    poolEl.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; paint(); });
    agesEl.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      if(sel==null){ D.toast('Escolha uma vacina primeiro'); return; }
      const c = pool.find(x=>x.i===sel);
      if(c.a===b.dataset.a){ placed[c.i]=1; sel=null; if(Object.keys(placed).length===CHIPS.length){ D.award('w:c1.caderneta', errors<=3?30:15, 'caderneta montada'); } }
      else { errors++; D.toast(`${c.t}: não é ${b.dataset.a}`); sel=null; }
      paint();
    });
  }
  paint();
};

    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{

      if(!ok){ const cb=row.querySelector(`button[data-k="${r[1]}"]`); cb.style.borderColor='var(--green)'; }
      const fb=row.querySelector('.fb'); fb.hidden=false; fb.innerHTML=`<b style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Certo.':'Não.'}</b> ${r[2]}`;
      const n=Object.keys(ans).length, k=Object.values(ans).filter(Boolean).length;
      w.querySelector('.rg-st').innerHTML = `${k}/${n} corretas` + (n===RESG.length? ` · <b>Plano final:</b> hoje = Pneumo 10, ACWY, SCR, DTP, VIP, hepatite A e influenza (sítios diferentes, mesmo dia); em ≥30 dias = tetraviral; aos 4 anos = DTP, febre amarela e varicela.`:'');
      if(n===RESG.length) D.award('w:c1.resgate', Math.round(k/RESG.length*30), 'caderneta resgatada');
    });
    box.appendChild(row);
  });

  <p>Um caso aparentemente simples (“criança saudável, vacina atrasada”) treina o raciocínio que o examinador quer ver: <b>primeiro avaliar a criança, depois a caderneta, depois decidir</b>. Vamos destrinchar cada dado.</p>
  <h3>1. A criança está bem? (semiologia pediátrica)</h3>
  <p><b>Antropometria.</b> Para uma menina de 3 anos, a mediana da OMS é cerca de 13,9 kg e 95 cm. Com 14,5 kg e 96 cm ela está muito próxima do percentil 50 nos dois parâmetros, e o IMC (14,5 / 0,96² ≈ 15,7 kg/m²) também está perto da mediana. Ou seja: <b>eutrófica, com crescimento adequado</b>. Isso importa porque a desnutrição grave altera a resposta imune — mas, atenção, <b>desnutrição não é contraindicação</b> à vacinação; pelo contrário, é motivo a mais para vacinar.</p>
  <p><b>Sinais vitais.</b> FC de 100 bpm e FR de 22 ipm estão dentro das faixas esperadas para pré-escolares (FC ≈ 80–120; FR ≈ 20–30). A PA de 90/60 mmHg é interpretada em <b>percentis por sexo, idade e estatura</b> (tabelas da Academia Americana de Pediatria, 2017) e está adequada. Temperatura 36,7 °C: afebril.</p>
  ${D.integ('<p><b>Propedêutica/TH:</b> em criança, PA se mede com manguito cuja bolsa de borracha cubra cerca de 40% da circunferência do braço na largura e 80–100% no comprimento. Manguito pequeno superestima a PA. A partir dos 3 anos a PA deve ser aferida em toda consulta de rotina.</p>','Integração · Propedêutica')}
  <h3>2. O que a caderneta provavelmente mostra</h3>
  <p>O enunciado diz que o primeiro ano foi feito “conforme o calendário”. Traduzindo para o Calendário Nacional de Vacinação (CNV) 2025, ela recebeu:</p>

  <p>Depois disso, “as vacinas subsequentes ficaram atrasadas”. Então <b>faltam as doses de 12 meses</b> (reforço da pneumo, meningo ACWY, tríplice viral) e <b>de 15 meses</b> (1º reforço DTP, reforço VIP, tetraviral, hepatite A), além da influenza anual. As doses de <b>4 anos</b> (2º reforço DTP, reforço de febre amarela, varicela) ainda <b>não venceram</b> — ela tem 3.</p>
  <h3>3. Por que atrasou? A pergunta que muda a abordagem</h3>
  <p>A OMS descreve a <b>hesitação vacinal</b> pelo modelo dos “3 Cs”: <b>confiança</b> (desconfia da vacina ou do sistema), <b>complacência</b> (acha que a doença não é ameaça) e <b>conveniência</b> (barreiras de acesso, horário, distância, informação). Aqui a mãe não recusou nada: mudou de casa, teve dificuldades e não foi orientada. É um problema de <b>conveniência e de falha do serviço</b> — o que pede acolhimento e facilitação, não confronto. Voltaremos a isso na seção de humanística.</p>
  <h3>4. As três regras que guiam o resgate</h3>
  <ol>
   <li><b>Dose aplicada é dose válida.</b> Não se reinicia esquema por atraso; completa-se o que falta.</li>

 /* ---------------- S2 ---------------- */
 {id:'s2', title:'Imunologia das vacinas: do antígeno à memória', short:'Imunologia', d:['imuno','fisio'],
  quick: `
  <ul>
   <li><b>Vacina</b> = apresentar antígeno sem a doença para gerar <b>memória imunológica</b> (imunidade <b>ativa artificial</b>).</li>
   <li><b>Resposta primária</b>: latência de 7–14 dias, predomínio de <b>IgM</b>, IgG baixa. <b>Secundária</b> (reforço): latência de 1–3 dias, <b>IgG alta e de alta afinidade</b> → é por isso que existem reforços.</li>
   <li><b>Polissacarídeo puro</b> = antígeno <b>T-independente</b>: IgM, sem memória, ruim em <b>menores de 2 anos</b>.</li>
   <li><b>Conjugada</b> (polissacarídeo + proteína carreadora) vira <b>T-dependente</b>: troca de classe para IgG, memória, funciona desde 2 meses (Hib, pneumo 10, meningo C/ACWY).</li>
   <li><b>Viva atenuada</b> se replica → antígeno no citosol → <b>MHC I → CD8</b> + MHC II → CD4/B → resposta celular e humoral forte com 1–2 doses.</li>
   <li><b>Inativada/subunidade/toxoide</b> → MHC II → anticorpos; precisa de <b>adjuvante (alumínio)</b> e várias doses.</li>
  </ul>
  ${D.svg(svgResposta,'Resposta primária × secundária: o reforço encontra linfócitos de memória e gera IgG mais rápida, mais alta e mais afim.')}
  ${D.pearl('<p>Anticorpos maternos (IgG transplacentária) neutralizam vacinas vivas injetáveis no 1º ano → por isso tríplice viral só aos 12 meses.</p>')}`,
  deep: `
  <p>Entender a imunologia por trás do calendário transforma uma tabela decorada em lógica. Quase toda regra do PNI (idade de início, número de doses, intervalo, reforço) é consequência de um dos mecanismos abaixo.</p>
  <h3>Imunidade ativa × passiva, natural × artificial</h3>
  ${D.tbl(['','Natural','Artificial'],[
   ['<b>Ativa</b> (o próprio corpo produz; tem memória; demora)','infecção','<b>vacina</b>'],
   ['<b>Passiva</b> (recebe anticorpo pronto; imediata; sem memória; dura semanas)','IgG transplacentária, IgA do leite','soro, imunoglobulina (ex.: IGHAHB no RN de mãe HBsAg+)']])}
  <p>No RN de mãe HBsAg positiva fazemos <b>as duas ao mesmo tempo</b>: imunoglobulina (passiva, protege já) + vacina (ativa, protege depois), em sítios diferentes, idealmente nas primeiras 12 horas.</p>
  <h3>Do antígeno à memória, passo a passo</h3>
  ${D.chain(['Antígeno + sinal de perigo (adjuvante ou PAMP do próprio patógeno)','Célula dendrítica captura e migra ao linfonodo','Apresenta peptídeo no MHC a linfócitos T virgens','T CD4 auxiliar ativa linfócito B específico','Centro germinativo: troca de classe, maturação de afinidade','Plasmócitos longevos (medula) + B e T de memória'])}
  <p>A <b>imunidade inata</b> é o “interruptor”: sem sinal de perigo (padrões moleculares reconhecidos por receptores tipo Toll e afins) a célula dendrítica não amadurece e o linfócito pode virar tolerante. Vacinas vivas trazem seus próprios sinais de perigo; vacinas inativadas e de subunidade precisam de um <b>adjuvante</b> — no Brasil, sobretudo os <b>sais de alumínio</b>, que formam um depósito no músculo, recrutam células inatas e ativam o inflamassoma. Isso explica duas coisas práticas: a <b>dor e o nódulo local</b> após vacinas adsorvidas, e a ordem de <b>nunca congelar</b> vacinas com alumínio (o gel se desfaz e a vacina perde potência).</p>
  <h3>Por que existem reforços</h3>
  ${D.svg(svgResposta,'Resposta primária (IgM e IgG baixas, latência longa) × secundária (IgG rápida, alta e de alta afinidade).')}
  <p>Na <b>resposta primária</b> há latência de 1–2 semanas, pico de IgM e pouca IgG. Na <b>secundária</b>, os linfócitos de memória já existem em grande número: a latência cai para 1–3 dias, a IgG sobe muito mais e tem maior afinidade (passou por mais ciclos de hipermutação somática). Os reforços do calendário (15 meses, 4 anos, dT a cada 10 anos) exploram exatamente isso e também compensam o declínio dos anticorpos com o tempo — especialmente para <b>toxoides</b> (tétano, difteria) e para a <b>pertussis</b>, cuja proteção cai em poucos anos.</p>
  <h3>Antígeno T-independente × T-dependente: a lógica das conjugadas</h3>
  <p>Bactérias encapsuladas (pneumococo, Hib, meningococo) escapam da fagocitose pela cápsula de <b>polissacarídeo</b>. Anticorpo contra a cápsula opsoniza a bactéria — é a proteção que queremos. O problema: polissacarídeo não é processado em peptídeo nem apresentado em MHC II, então <b>não recruta linfócito T</b>. Ele ativa diretamente linfócitos B da zona marginal do baço por ligação cruzada de receptores. Resultado: IgM, pouca troca de classe, <b>sem memória</b> e sem efeito de reforço. Como a zona marginal só amadurece por volta dos 2 anos, <b>menores de 2 anos praticamente não respondem</b> a vacina polissacarídica pura (como a VPP23).</p>
  ${D.svg(svgConjugada,'A proteína carreadora transforma o polissacarídeo em antígeno T-dependente.')}
  <p>A solução foi <b>conjugar</b> o polissacarídeo a uma proteína carreadora (toxoide tetânico, CRM197 diftérico, proteína D do <i>H. influenzae</i>). O linfócito B que reconhece o polissacarídeo internaliza o conjugado inteiro e apresenta os <b>peptídeos da proteína</b> no MHC II; um T folicular específico para esse peptídeo dá o “segundo sinal” (CD40L, IL-21) e abre o centro germinativo. Ganha-se troca de classe para IgG, memória, resposta a reforço e eficácia desde os 2 meses. Bônus populacional: conjugadas reduzem o <b>estado de portador nasofaríngeo</b>, gerando proteção de rebanho.</p>
  ${D.trap('<p><b>VPP23</b> (polissacarídica 23-valente) no CNV infantil é só para <b>indígenas a partir de 5 anos</b>. Antes dos 2 anos ela não funciona; por isso o lactente recebe a <b>conjugada</b> (VPC10).</p>')}
  <h3>Vivas × inativadas: quem vê o CD8</h3>
  ${D.svg(svgViva,'Uma vacina viva se replica dentro da célula e acessa a via do MHC I; a inativada fica restrita, em grande parte, à via exógena do MHC II.')}
  <p>Proteínas produzidas <b>dentro</b> da célula infectada são degradadas no proteassoma e apresentadas no <b>MHC classe I</b> a linfócitos <b>T CD8 citotóxicos</b>. Só um microrganismo que se replica (ou uma plataforma que faz a célula produzir o antígeno, como RNAm e vetor viral) acessa bem essa via. Antígenos “de fora” (inativados, subunidades, toxoides) são fagocitados e vão para o <b>MHC classe II</b> → T CD4 → anticorpos. Daí as diferenças práticas:</p>
  ${D.tbl(['','Viva atenuada','Inativada / subunidade / toxoide'],[
   ['Resposta','celular (CD8) + humoral','predominantemente humoral'],
   ['Doses','1–2 costumam bastar','várias + reforços'],
   ['Adjuvante','não precisa','em geral sim (alumínio)'],
   ['Anticorpo materno','interfere (neutraliza a replicação)','interfere menos'],
   ['Imunodeprimido / gestante','contraindicada (risco de doença vacinal)','pode (pode responder pior)'],
   ['Conservação','sensível ao calor e à luz','sensível ao congelamento']])}
  ${D.pearl('<p><b>Por que tríplice viral só aos 12 meses?</b> A IgG materna contra sarampo atravessa a placenta e neutraliza o vírus vacinal antes que ele se replique. Por volta de 12 meses esses anticorpos caíram o suficiente. Em surto, aplica-se uma <b>dose zero</b> de 6 a 11 meses — que <b>não conta</b> para a rotina.</p>')}
  ${D.extra('<p><b>RNAm (covid-19):</b> a nanopartícula lipídica entrega o RNAm ao citosol; a célula produz a proteína S, que é apresentada tanto no MHC I quanto no MHC II — por isso gera CD8 sem ser vírus vivo. O RNAm não entra no núcleo e é degradado em dias.</p>')}
  ${D.integ('<p>A pergunta discursiva da prova (“por que vacinas vivas podem causar manifestações leves semelhantes à doença e por que isso não é perigoso no imunocompetente?”) se responde com esta seção: o vírus atenuado <b>se replica de forma limitada</b>, o que gera inflamação e sintomas leves (febre, exantema), mas a <b>imunidade inata e a adaptativa íntegras</b> controlam a replicação antes de doença grave. Ver aba Discursivas.</p>','Integração · Prova')}`,
  qs:[
   {q:'Lactente de 4 meses recebe a vacina pneumocócica 10-valente. Por que não se usa a polissacarídica 23-valente, que cobre mais sorotipos?',
    o:['Porque a VPP23 é viva e contraindicada no lactente','Porque polissacarídeos são antígenos T-independentes, pouco imunogênicos antes dos 2 anos e sem memória','Porque a VPP23 só protege contra otite','Porque a VPC10 dispensa reforço','Porque a VPP23 causa intussuscepção'],

 {id:'s3', title:'Tipos de vacinas e o agente por trás de cada uma', short:'Tipos e agentes', d:['micro','imuno'],
  quick: `
  <h4>Vivas atenuadas do calendário infantil</h4>
  <p><b>BCG · rotavírus · tríplice viral (SCR) · tetraviral (SCRV) · varicela · febre amarela</b> (a VOP também era, mas saiu do calendário).</p>
  ${D.pearl('<p>Mnemônico: <b>“Bebê Rodou, Sarou, Virou Amarelo”</b> — <b>B</b>CG, <b>Ro</b>tavírus, <b>S</b>CR/SCRV, <b>V</b>aricela, febre <b>Amarela</b>. Três vias: ID (BCG), VO (rotavírus) e SC (as virais injetáveis).</p>')}
  ${D.tbl(['Vacina','Tipo','Agente'],[
   ['BCG','viva (bactéria)','<i>Mycobacterium bovis</i> atenuado'],
   ['Rotavírus','viva','rotavírus humano G1P[8]'],
   ['SCR / SCRV / varicela','vivas','sarampo, caxumba, rubéola, varicela-zóster'],
   ['Febre amarela','viva','cepa 17DD (Bio-Manguinhos)'],
   ['Hepatite B','subunidade recombinante','HBsAg produzido em levedura'],

  ${D.fig('img/c1-bcg-zn.jpg','BCG corado por Ziehl-Neelsen: bacilos <b>álcool-ácido resistentes</b> (vermelhos) — a parede rica em ácidos micólicos retém a fucsina.', CC('CC BY-SA 3.0','Y tambe'))}`,
  deep: `
  <p>“Identificar as vacinas com vírus atenuado” é objetivo do slide, mas a prova costuma pedir mais: <b>o que é atenuar</b>, qual o agente e o que isso implica. Esta seção junta microbiologia e imunologia.</p>
  <h3>Como se atenua um microrganismo</h3>
  <p>Atenuar é selecionar uma variante que <b>ainda se replica</b> (por isso imuniza bem) mas <b>perdeu a virulência</b>. O método clássico é a <b>passagem seriada</b> em condições artificiais: o agente se adapta ao novo ambiente e acumula mutações que o tornam pouco apto a causar doença no hospedeiro original.</p>
  <ul>
   <li><b>BCG (bacilo de Calmette-Guérin):</b> Calmette e Guérin cultivaram <i>Mycobacterium bovis</i> por cerca de 13 anos, em mais de 230 passagens em batata com glicerina e bile bovina. A cepa perdeu, entre outras, a região genômica <b>RD1</b> (que codifica o sistema de secreção ESX-1, essencial para a virulência). No Brasil usa-se historicamente a cepa <b>Moreau-Rio de Janeiro</b>.</li>
   <li><b>Febre amarela 17D:</b> obtida por passagens do vírus selvagem em tecidos de embrião de galinha; no Brasil, a subcepa <b>17DD</b> é produzida por Bio-Manguinhos/Fiocruz em ovos embrionados.</li>
   <li><b>Sarampo, caxumba, rubéola e varicela:</b> passagens em culturas celulares (fibroblastos de embrião de galinha, células diploides humanas).</li>
   <li><b>Rotavírus G1P[8]</b> (monovalente): cepa humana atenuada por passagens em cultura.</li>
  </ul>
  ${D.trap('<p>Atenuado ≠ morto. O risco teórico de uma viva é <b>reverter à virulência</b> ou causar doença em quem não controla a replicação (imunodeprimido, gestante). Foi exatamente o que tirou a <b>VOP</b> do calendário: a pólio paralítica associada à vacina e os poliovírus derivados da vacina circulantes.</p>')}
  <h3>Os agentes, um por um (microbiologia)</h3>
  ${D.tbl(['Agente','Classificação','O que cai em prova'],[

  ${D.pearl('<p>A <b>penta</b> é a vacina mais “mista” do calendário: toxoides (D, T), bactéria inteira inativada (P de células inteiras), conjugada (Hib) e subunidade recombinante (HB). A pertussis de <b>células inteiras</b> é a responsável pela maioria das reações sistêmicas — e por isso existe a versão <b>acelular</b> no CRIE.</p>')}
  ${D.extra('<p><b>Caxumba e meningite asséptica:</b> algumas cepas vacinais de caxumba (ex.: Urabe, Leningrad-Zagreb) associam-se a meningite asséptica benigna 2–3 semanas após a vacina; é um ESAVI conhecido e autolimitado.</p>')}`,

 {id:'s4', title:'O Calendário Nacional de Vacinação (0 a 5 anos)', short:'Calendário', d:['prev','clin'],

  <div class="widget" data-w="caderneta"></div>`,
  deep: `
  <p>O calendário não é uma lista arbitrária: cada idade foi escolhida combinando <b>epidemiologia</b> (quando a criança corre mais risco), <b>imunologia</b> (quando ela consegue responder e quando os anticorpos maternos deixam de atrapalhar) e <b>logística</b> (agrupar doses para reduzir visitas). Abaixo, o CNV 2025 do Ministério da Saúde (documento oficial da disciplina), com o “porquê” de cada linha.</p>
  <h3>Ao nascer</h3>
  <p><b>BCG</b>, intradérmica, dose única, na maternidade ou na primeira visita (até 4a11m29d). Protege contra as <b>formas graves</b> da tuberculose (<b>miliar e meníngea</b>) — não impede a infecção pulmonar do adulto. Adiar se RN com <b>peso &lt; 2 kg</b> (pouco tecido cutâneo). <b>Hepatite B</b>, IM, idealmente nas primeiras 12–24 h (até 30 dias), porque a transmissão vertical tem altíssima taxa de cronificação no RN (≈90%).</p>
  <h3>2, 4 e 6 meses: o “combo” do lactente</h3>
  <p><b>Penta</b> (DTP + Hib + HB) e <b>VIP</b> aos 2, 4 e 6 meses; intervalo recomendado de 60 dias, mínimo de 30. <b>Pneumo 10</b> e <b>rotavírus</b> aos 2 e 4 meses. A idade de início (6–8 semanas) é o equilíbrio entre proteger cedo (coqueluche e doença pneumocócica matam sobretudo no 1º semestre) e ter resposta adequada. Idade mínima da penta: 6 semanas.</p>
  <p><b>Rotavírus</b> tem as janelas mais rígidas: 1ª dose de <b>1 mês e 15 dias a 11 meses e 29 dias</b>; 2ª dose de 3 meses e 15 dias a <b>23 meses e 29 dias</b>. A rigidez vem da segurança: o risco natural de <b>intussuscepção</b> aumenta com a idade, e aplicar a 1ª dose tardiamente somaria o pequeno risco vacinal ao pico natural.</p>
  <h3>3 e 5 meses: Meningo C; 12 meses: ACWY</h3>
  <p>Esquema básico de <b>Meningo C</b> conjugada aos 3 e 5 meses e reforço aos 12 meses — agora com a <b>meningocócica ACWY</b>, que amplia a proteção para os sorogrupos A, W e Y (o W cresceu na América do Sul na última década).</p>
  <h3>6 meses em diante: influenza e covid</h3>
  <p><b>Influenza</b>: rotina de 6 meses a 5a11m29d; na primovacinação, <b>2 doses com 30 dias</b>; quem já recebeu em temporada anterior, 1 dose anual. <b>Covid-19</b> (Pfizer pediátrica): 6, 7 e 9 meses; reforço anual apenas para imunocomprometidos e crianças com comorbidades.</p>
  <h3>9 meses: febre amarela</h3>
  <p>Dose aos 9 meses e reforço aos 4 anos, <b>em todo o país</b>. Contraindicada antes dos 6 meses (risco de encefalite); entre 6 e 8 meses só em área de transmissão ativa, como “dose zero”.</p>
  <h3>12 e 15 meses: o fim do “efeito materno”</h3>
  <p>Aos 12 meses: <b>reforço da pneumo 10</b>, <b>Meningo ACWY</b> e <b>tríplice viral</b> (sarampo, caxumba, rubéola). Aos 15 meses: <b>1º reforço de DTP</b>, <b>reforço de VIP</b>, <b>tetraviral</b> (que corresponde à <b>2ª dose de SCR e 1ª de varicela</b>) e <b>hepatite A</b> (dose única).</p>
  <h3>4 anos</h3>
  <p><b>2º reforço de DTP</b>, <b>reforço de febre amarela</b> e <b>varicela</b> (2ª dose). A partir daí, dT a cada 10 anos (antecipar para 5 anos em ferimento de risco).</p>
  ${D.fig('img/c1-pni-slide-5.jpg','Tabela do PNI usada no slide (nascimento a 6 meses). Compare com o calendário acima.', 'Slide do Caso 1 · CMMG')}
  ${D.fig('img/c1-pni-slide-6.jpg','Continuação da tabela do slide (7 meses a 5 anos). Note a <b>VOPb aos 15 meses e 4 anos</b> e a <b>Meningo C</b> no reforço — ambos já mudaram no CNV 2025.', 'Slide do Caso 1 · CMMG')}
  ${D.trap('<p>Desde o fim de 2024 a <b>VOP saiu</b> do calendário: todas as doses de pólio são <b>VIP</b>, e no CNV 2025 o reforço é único, aos 15 meses. Uma questão que pergunte “qual vacina viva é dada aos 4 anos” e liste VOP está desatualizada.</p>')}
  <h3>Regras de administração que mais caem</h3>
  ${D.tbl(['Regra','Detalhe'],[
   ['Simultaneidade','todas as vacinas podem ser feitas no mesmo dia, em sítios diferentes (≥2,5 cm se no mesmo músculo)'],

   ['Intervalo menor que o mínimo','dose inválida → repetir respeitando o intervalo'],

  <div class="widget" data-w="caderneta"></div>

 {id:'s5', title:'Resgatando a caderneta da paciente', short:'Resgate da caderneta', d:['clin','prev'],
  quick: `
  ${D.tbl(['Quando','O que fazer'],[
   ['<b>Hoje</b> (mesmo dia, sítios diferentes)','Pneumo 10 (dose única) · Meningo ACWY · Tríplice viral · DTP 1º reforço · VIP reforço · Hepatite A · Influenza'],

  <div class="widget" data-w="resgate"></div>`,
  deep: `
  <p>Esta é a pergunta-chave do caso. A banca quer ver você aplicar as regras do calendário a uma criança concreta. Vamos montar o plano vacina por vacina, com a regra que justifica cada decisão (todas do CNV 2025).</p>
  <h3>O que vence hoje</h3>
  <ul>
   <li><b>Pneumocócica 10 (reforço).</b> Regra: criança entre 12 meses e 4a11m29d sem esquema completo <b>ou sem reforço</b> → <b>1 dose</b>. Ela tem as 2 doses do 1º ano; falta o reforço. Faz hoje.</li>
   <li><b>Meningocócica ACWY.</b> Regra: com comprovação vacinal de Meningo C mas sem reforço, entre 12 meses e 4a11m29d → <b>1 dose de reforço com ACWY</b>.</li>
   <li><b>Tríplice viral (SCR).</b> Perdeu a dose dos 12 meses. Faz hoje.</li>
   <li><b>DTP – 1º reforço.</b> Esquema básico com penta completo; 1º reforço indicado de 15 meses a 6a11m29d, no mínimo 6 meses após a 3ª dose. Faz hoje.</li>
   <li><b>VIP – reforço.</b> Reforço único (15 meses), aplicável até 4a11m29d. Faz hoje.</li>
   <li><b>Hepatite A.</b> Dose única de 15 meses a 4a11m29d. Faz hoje.</li>
   <li><b>Influenza.</b> Rotina de 6 meses a 5a11m29d; com dose em temporada anterior, 1 dose; sem nenhuma, 2 doses com 30 dias.</li>
  </ul>
  ${D.pearl('<p>Sete vacinas hoje parece muito para a família, mas <b>cada dose adiada é uma chance de a criança não voltar</b>. A literatura de oportunidades perdidas mostra que adiar é a principal causa de esquema incompleto. Explique, acolha e, se a família pedir para dividir, priorize as de maior risco epidemiológico (tríplice viral, meningo e pneumo).</p>')}
  <h3>O que fica para depois</h3>
  <ul>
   <li><b>Tetraviral (SCRV)</b> — exige 1 dose prévia de SCR (que ela recebe hoje) e, por ser viva injetável não simultânea, <b>intervalo de 30 dias</b> após a SCR. A SCRV dará a 2ª dose de sarampo/caxumba/rubéola e a 1ª de varicela.</li>
   <li><b>Aos 4 anos:</b> <b>DTP 2º reforço</b> (respeitando ≥ 6 meses após o 1º), <b>febre amarela reforço</b> e <b>varicela</b> (2ª dose).</li>
  </ul>
  <h3>O que NÃO fazer — e por quê</h3>
  <ul>
   <li><b>BCG:</b> já recebeu ao nascer. Desde 2019 o Ministério da Saúde <b>não recomenda revacinar</b> crianças que não desenvolveram cicatriz; a ausência de cicatriz não significa ausência de proteção.</li>
   <li><b>Hepatite B:</b> dose ao nascer + 3 doses de penta completam o esquema.</li>
   <li><b>Rotavírus:</b> completo — e, de todo modo, a idade máxima passou.</li>
   <li><b>Covid-19:</b> 3 doses no 1º ano; dose anual só para imunocomprometidos e crianças com comorbidades.</li>
  </ul>
  <div class="widget" data-w="resgate"></div>
  ${D.fig('img/c1-bcg-cicatriz.jpg','Cicatriz de BCG no ombro de um lactente. No Brasil, a BCG é aplicada na inserção inferior do deltoide direito; a lesão evolui por semanas até a cicatriz. Sem cicatriz? Não revacinar.', CC('CC BY-SA 4.0','Gzzz'))}
  ${D.trap('<p>E se a caderneta tivesse sido <b>perdida</b> e não houvesse registro no SI-PNI? Sem comprovação, considera-se <b>não vacinada</b> e aplica-se o esquema conforme a idade atual. O registro nominal eletrônico existe para evitar isso.</p>')}
  ${D.clin('<p>Antes de aplicar: triagem rápida de contraindicações (imunodeficiência, corticoide em dose alta, convivente imunodeprimido, alergia grave a componente, reação grave a dose anterior), checar a apresentação da tríplice disponível (a do Serum Institute é contraindicada em alergia grave à proteína do leite de vaca) e orientar os eventos esperados de cada vacina.</p>')}`,
  qs:[
   {q:'Para a paciente (3 anos, sem doses após 12 meses), a tetraviral deve ser:',
    o:['Aplicada hoje junto com a tríplice viral','Aplicada hoje no lugar da tríplice viral','Aplicada ≥ 30 dias após a tríplice viral','Dispensada, pois a varicela será dada aos 4 anos','Aplicada apenas após os 5 anos'],
    a:2, d:['clin','prev'], e:'A SCRV exige 1 dose prévia de SCR. Por serem vivas injetáveis, se não forem simultâneas, intervalo de 30 dias.'},
   {q:'A mãe pergunta se a filha deve repetir a BCG porque “não ficou marquinha”. Resposta adequada:',
    o:['Sim, repetir uma vez','Sim, se o PPD for negativo','Não; o MS não recomenda revacinar por ausência de cicatriz','Sim, até 5 anos','Repetir apenas se houver contato com tuberculose'],
    a:2, d:['prev','clin'], e:'Desde 2019, a ausência de cicatriz não indica revacinação. A BCG é dose única.'},
   {q:'Qual pneumocócica a paciente deve receber agora?',
    o:['Nenhuma: perdeu o reforço','1 dose de VPC10 (reforço)','2 doses de VPC10 com 60 dias','VPP23','Reiniciar com 3 doses'],
    a:1, d:['prev'], e:'Entre 12 meses e 4a11m29d sem reforço, 1 dose de VPC10. VPP23 é só para indígenas ≥ 5 anos no CNV infantil.'}
  ]},
 /* ---------------- S6 ---------------- */
 {id:'s6', title:'ESAVI: eventos adversos gerais e das vacinas vivas', short:'Eventos adversos', d:['pato','imuno','clin','farmaco'],
  quick: `
  <h4>Gerais (qualquer vacina)</h4>
  <ul>
   <li><b>Locais</b>: dor, eritema, edema, calor, nódulo (alumínio) — inflamação aguda local; compressa fria.</li>
   <li><b>Sistêmicos</b>: febre, irritabilidade, sonolência, inapetência nas primeiras 24–48 h; antitérmico se necessário (não profilático).</li>
   <li><b>Anafilaxia</b> (hipersensibilidade tipo I): rara, minutos após; <b>adrenalina IM 0,01 mg/kg</b> (máx. 0,3 mg na criança) na face anterolateral da coxa.</li>
   <li><b>EHH</b> (episódio hipotônico-hiporresponsivo) e <b>convulsão febril</b>: sobretudo após componente <b>pertussis de células inteiras</b> → próximas doses com DTP <b>acelular</b> (CRIE).</li>
  </ul>
  <h4>Específicos das vivas</h4>
  ${D.tbl(['Vacina','ESAVI típico','Quando'],[
   ['BCG','úlcera > 1 cm, abscesso, linfadenite axilar supurada; disseminada no imunodeprimido','semanas a meses'],
   ['SCR/SCRV','febre e exantema; parotidite; trombocitopenia; meningite asséptica (caxumba)','5–12 dias (febre/exantema); 2–3 semanas (plaquetas)'],
   ['Febre amarela','febre, cefaleia, mialgia; doença neurológica; doença viscerotrópica (rara, &gt; 60 anos)','3–7 dias; até 30 dias'],
   ['Rotavírus','intussuscepção (muito rara)','1ª semana após 1ª dose'],
   ['Varicela','poucas vesículas (exantema variceliforme)','até 1 mês'],
   ['VOP (saiu)','paralisia flácida associada à vacina','4–40 dias']])}
  ${D.trap('<p>Alergia a <b>ovo</b> não contraindica a tríplice viral. Alergia grave à <b>proteína do leite de vaca</b> contraindica a tríplice do <b>Serum Institute</b> (contém lactoalbumina). Intolerância à lactose não contraindica nada.</p>')}`,
  deep: `
  <p>ESAVI = <b>evento supostamente atribuível à vacinação ou imunização</b> (termo que substituiu “EAPV”). “Supostamente” porque coincidência temporal não é causalidade: a investigação define se há relação. Esta seção junta <b>patologia</b> (inflamação e hipersensibilidade), <b>imunologia</b> e conduta.</p>
  <h3>1. Reações locais: inflamação aguda em miniatura</h3>
  <p>Dor, rubor, calor e edema no local são os <b>sinais cardinais da inflamação aguda</b> (Celsus), com a perda de função como quinto (Virchow). O mecanismo é o da Patologia I: a agulha e o adjuvante liberam padrões de dano e de perigo, mastócitos e macrófagos liberam histamina, prostaglandinas e citocinas, há vasodilatação (rubor e calor), aumento de permeabilidade com exsudato (edema) e sensibilização de nociceptores por PGE2 e bradicinina (dor). O <b>nódulo</b> após vacinas com alumínio é um granuloma de corpo estranho/reação ao depósito do adjuvante, mais comum quando a aplicação fica superficial (no subcutâneo em vez do músculo).</p>
  ${D.integ('<p><b>Patologia I:</b> reação local = inflamação aguda (vasodilatação, aumento de permeabilidade, exsudato rico em proteínas, migração de neutrófilos). Lesão da BCG = inflamação <b>granulomatosa</b> (macrófagos epitelioides, células gigantes, com ou sem necrose caseosa) — o mesmo padrão da tuberculose.</p>','Integração · Patologia')}
  <h3>2. Reações sistêmicas</h3>
  <p><b>Febre</b> é mediada por citocinas pirogênicas (IL-1, IL-6, TNF) que induzem PGE2 no hipotálamo e elevam o ponto de ajuste térmico. Nas vacinas inativadas surge nas primeiras <b>24–48 h</b>. Nas <b>vivas</b>, aparece quando o vírus vacinal se replica: <b>5 a 12 dias</b> na tríplice viral, <b>3 a 7 dias</b> na febre amarela — essa diferença de tempo é muito cobrada. Antitérmico <b>profilático não é recomendado</b> (pode reduzir a resposta a algumas vacinas); trata-se a febre se ocorrer.</p>
  <h3>3. Hipersensibilidade: os 4 tipos aplicados às vacinas</h3>
  ${D.tbl(['Tipo','Mecanismo','Exemplo vacinal'],[
   ['I (imediata)','IgE em mastócitos → degranulação','anafilaxia a gelatina, neomicina, proteína do ovo (febre amarela), lactoalbumina (SCR do Serum)'],
   ['II (citotóxica)','anticorpo contra antígeno de superfície celular','trombocitopenia após tríplice viral (mecanismo imune, autolimitada)'],
   ['III (imunocomplexos)','complexo antígeno-anticorpo deposita e ativa complemento','<b>reação de Arthus</b>: edema doloroso intenso após excesso de doses de toxoide tetânico'],
   ['IV (tardia, celular)','linfócitos T e macrófagos','reação local à BCG; é também o princípio do PPD']])}
  <h3>4. Anafilaxia: reconhecer e agir</h3>
  <p>Rara (cerca de 1 por milhão de doses), quase sempre nos primeiros 15–30 minutos — por isso a criança deve ser observada após a vacinação. Quadro: urticária/angioedema + comprometimento respiratório (estridor, sibilância) e/ou cardiovascular (hipotensão, palidez, hipotonia).</p>
  ${D.chain(['Chamar ajuda, decúbito dorsal com MMII elevados','<b>Adrenalina 1:1000 IM, 0,01 mg/kg</b> (máx. 0,3 mg na criança) no vasto lateral','Repetir a cada 5–15 min se necessário','O2, acesso venoso, expansão com SF 20 mL/kg se hipotensão','Anti-histamínico e corticoide são adjuvantes, nunca substituem a adrenalina','Notificar; contraindicar o componente'])}
  ${D.integ('<p><b>Farmacologia:</b> adrenalina é agonista α1 (vasoconstrição, reverte hipotensão e edema), β1 (inotropismo, cronotropismo) e β2 (broncodilatação e estabilização de mastócitos via AMPc). Via IM na coxa tem absorção mais rápida e previsível que a SC.</p>','Integração · Farmacologia')}
  <h3>5. Componente pertussis de células inteiras</h3>
  <p>A pertussis de células inteiras (na penta e na DTP) contém lipopolissacarídeo e outras moléculas muito reatogênicas. Eventos: febre alta, choro persistente (≥ 3 h), <b>convulsão febril</b> (até 72 h) e o <b>episódio hipotônico-hiporresponsivo</b> (EHH: palidez/cianose, hipotonia e redução da resposta a estímulos, geralmente nas primeiras 48 h, benigno). Conduta para as doses seguintes: <b>DTP acelular</b> (DTPa) pelo CRIE. Já a <b>encefalopatia</b> nos 7 dias seguintes <b>contraindica</b> o componente pertussis.</p>
  <h3>6. As vivas, uma a uma</h3>
  <h4>BCG</h4>
  <p>Evolução esperada: mácula → pápula → pústula → crosta → úlcera de até 1 cm → cicatriz, ao longo de cerca de 6 a 12 semanas (às vezes até 24). <b>Não</b> se coloca curativo oclusivo nem pomada. São ESAVI: <b>úlcera &gt; 1 cm</b> que não cicatriza, <b>abscesso</b> subcutâneo (frio ou quente), <b>linfadenopatia regional</b> (axilar, supra/infraclavicular) não supurada &gt; 3 cm ou supurada, granuloma, queloide e, no imunodeficiente, <b>BCG disseminada</b>. Tratamento das formas locais indicadas: <b>isoniazida</b>. Lembre: <i>M. bovis</i> é naturalmente resistente à pirazinamida.</p>
  ${D.fig('img/c1-bcg-kawasaki.jpg','Reativação inflamatória no sítio da BCG (aqui, aplicada por multipunção, método usado em alguns países asiáticos) durante a doença de Kawasaki. Eritema e induração na cicatriz da BCG são achado sugestivo dessa vasculite em lactentes.', CC('CC BY-SA 4.0','Dong Soo Kim'))}
  ${D.extra('<p><b>Kawasaki e BCG:</b> por reatividade cruzada entre uma proteína de choque térmico micobacteriana e a humana, a cicatriz da BCG pode ficar eritematosa e endurecida na fase aguda da doença de Kawasaki — pista diagnóstica útil em lactentes.</p>')}
  <h4>Tríplice viral / tetraviral</h4>
  <p>Febre (às vezes ≥ 39,5 °C) e <b>exantema</b> discreto entre o 5º e o 12º dia; linfadenopatia; <b>parotidite</b>; <b>trombocitopenia</b> (≈ 1 em 30–40 mil doses, 2–3 semanas após, autolimitada); <b>convulsão febril</b> (maior com a tetraviral na 1ª dose); <b>meningite asséptica</b> por algumas cepas de caxumba. O exantema vacinal <b>não transmite</b>.</p>
  ${D.fig('img/c1-sarampo.jpg','Sarampo selvagem no 4º dia de exantema (maculopapular, confluente, de progressão cefalocaudal). A vacina pode dar um exantema leve, mas nada comparável a isso — e o sarampo tem letalidade relevante em desnutridos e lactentes.', 'Wikimedia Commons · CDC/NIP/Barbara Rice · Domínio público')}
  <h4>Febre amarela</h4>
  <p>Febre, cefaleia e mialgia em 3–7 dias. Eventos graves raros: <b>doença neurológica aguda</b> (encefalite, síndrome de Guillain-Barré, ADEM) e <b>doença viscerotrópica aguda</b> (quadro semelhante à febre amarela selvagem, com falência de múltiplos órgãos), cujo risco cresce acima dos 60 anos e em doenças do timo. Produzida em ovo: alergia grave a ovo exige avaliação. <b>Nutriz</b> vacinada com bebê &lt; 6 meses: suspender o aleitamento por 10 dias.</p>
  <h4>Rotavírus</h4>
  <p>Irritabilidade, vômitos e diarreia leves. Risco muito pequeno de <b>intussuscepção</b>, concentrado na 1ª semana após a 1ª dose → orientar sinais (choro intenso intermitente, vômitos, fezes em “geleia de framboesa”). Contraindicada com história de intussuscepção, malformação intestinal não corrigida e imunodeficiência combinada grave. Se a criança regurgitar, <b>não repetir</b> a dose.</p>
  <h4>Varicela</h4>
  <p>Poucas vesículas no local ou à distância até cerca de 1 mês; a transmissão do vírus vacinal é muito rara e só ocorre se houver lesões.</p>
  ${D.fig('img/c1-varicela.jpg','Varicela selvagem: lesões em diferentes estágios ao mesmo tempo (mácula, pápula, vesícula, crosta) — o “céu estrelado”. O exantema vacinal tem poucas lesões.', 'Wikimedia Commons · Camiloaranzales · Domínio público')}
  <h3>7. Contraindicações × falsas contraindicações</h3>
  ${D.tbl(['Contraindicam vivas','Adiar','NÃO contraindicam'],[
   ['imunodeficiência congênita ou adquirida; quimioterapia/radioterapia; corticoide ≥ 2 mg/kg/dia (ou ≥ 20 mg/dia de prednisona) por ≥ 14 dias — aguardar 1 mês após suspender; gestação; anafilaxia a componente','doença aguda moderada a grave; para SCR/varicela, uso recente de imunoglobulina ou hemoderivado','resfriado, febre baixa, diarreia leve, uso de antibiótico, desnutrição, prematuridade, aleitamento (exceto FA &lt; 6 m), alergias não relacionadas, história familiar de ESAVI ou convulsão, doença neurológica estável']])}
  ${D.clin('<p>ESAVI grave (óbito, hospitalização, risco de vida, anomalia congênita, incapacidade) → notificação em até <b>24 horas</b> pelo e-SUS Notifica. O <b>CRIE</b> (Centro de Referência para Imunobiológicos Especiais) fornece alternativas, como DTP acelular e VIP para imunodeprimidos e seus contatos.</p>')}`,
  qs:[
   {q:'Criança de 1 ano recebe tríplice viral. Oito dias depois tem febre de 38,8 °C e exantema maculopapular discreto, em bom estado geral. Interpretação:',
    o:['Sarampo selvagem; isolamento e notificação imediata como caso confirmado','Evento esperado pela replicação do vírus vacinal, autolimitado','Anafilaxia tardia','Contraindicação absoluta à tetraviral','Reação de Arthus'],
    a:1, d:['pato','imuno','clin'], e:'Febre e exantema entre o 5º e o 12º dia após SCR são ESAVI esperados da replicação limitada do vírus atenuado. Não contraindicam a próxima dose.'},
   {q:'Lactente de 3 meses, 4 h após a penta, fica pálido, hipotônico e pouco responsivo, recuperando-se espontaneamente em 30 minutos. Para as próximas doses:',
    o:['Suspender definitivamente vacinas contra coqueluche','Manter penta com antitérmico profilático','Usar DTP acelular (CRIE)','Aplicar apenas dT','Aplicar penta por via subcutânea'],
    a:2, d:['clin','imuno'], e:'Episódio hipotônico-hiporresponsivo é associado ao componente pertussis de células inteiras; não é contraindicação ao componente pertussis, mas as próximas doses devem usar a forma acelular.'},
   {q:'Dois minutos após vacinação, criança de 15 kg apresenta urticária generalizada, estridor e hipotensão. Medida inicial correta:',
    o:['Difenidramina IV','Hidrocortisona IV','Adrenalina 1:1000, 0,15 mg IM na coxa','Adrenalina 1 mg IV em bolus','Salbutamol inalatório e observação'],
    a:2, d:['farmaco','clin'], e:'Anafilaxia: adrenalina 0,01 mg/kg IM (15 kg → 0,15 mg; máx. 0,3 mg na criança). Anti-histamínico e corticoide são adjuvantes. Adrenalina IV em bolus de 1 mg é dose de parada cardíaca.'}
  ]},
 /* ---------------- S7 ---------------- */
 {id:'s7', title:'Na sala de vacina: técnica, rede de frio, comunicação e prevenção', short:'Técnica e prevenção', d:['th','human','prev'],
  quick: `
  ${D.tbl(['Via','Vacinas','Local / técnica'],[
   ['Intradérmica (ID)','BCG','inserção inferior do deltoide <b>direito</b>; agulha curta, bisel para cima, ~15°; forma pápula; 0,05 ou 0,1 mL conforme o produto'],
   ['Subcutânea (SC)','SCR, SCRV, varicela, febre amarela','região deltoide/face externa do braço; agulha 13 mm; prega cutânea'],
   ['Intramuscular (IM)','penta, DTP, VIP, pneumo, meningo, HB, HA, influenza, covid','<b>vasto lateral da coxa</b> em &lt; 2 anos; <b>deltoide</b> a partir de 2 anos; 90°; evitar glúteo'],
   ['Oral (VO)','rotavírus','bisnaga inteira (1,5 mL); se regurgitar, não repetir']])}
  <ul>
   <li><b>Rede de frio:</b> +2 °C a +8 °C. Inativadas com alumínio <b>não podem congelar</b>; vivas são sensíveis ao calor e à luz.</li>
   <li><b>Vacina = prevenção primária</b>, nível de <b>proteção específica</b> (Leavell e Clark).</li>
   <li><b>Imunidade de rebanho:</b> limiar ≈ 1 − 1/R0 → sarampo (R0 12–18) exige ≈ 95% de cobertura.</li>
   <li><b>Humanística:</b> acolher sem culpar; o ECA torna obrigatória a vacinação recomendada pelas autoridades sanitárias.</li>
  </ul>
  ${D.fig('img/c1-im-coxa.jpg','Vasto lateral (face anterolateral, terço médio da coxa): local de escolha para IM em menores de 2 anos.', CC('CC BY-SA 4.0','BruceBlaus'))}`,
  deep: `
  <h3>1. Técnica (TH IV)</h3>
  <p>Antes de qualquer via: <b>higiene das mãos</b>, conferir a caderneta e a prescrição, triar contraindicações, checar o imunobiológico (nome, lote, validade, aspecto, temperatura), explicar à família e posicionar a criança no colo do responsável com contenção segura. Os “certos” da imunização: <b>pessoa, vacina, dose, via, local, idade/intervalo e registro</b>. Pele limpa não precisa de antissepsia com álcool; na BCG o álcool é evitado.</p>
  <h4>Intradérmica — BCG</h4>
  <p>Na <b>inserção inferior do músculo deltoide direito</b> (padronizado no Brasil para facilitar a identificação da cicatriz). Seringa de 1 mL, agulha curta e fina de bisel curto, <b>bisel para cima</b>, ângulo de cerca de 15°, quase paralela à pele. Injetar lentamente: forma-se uma <b>pápula</b> esbranquiçada em “casca de laranja” que some em minutos. Volume: <b>0,05 mL</b> (apresentação do Serum Institute em menores de 1 ano) ou <b>0,1 mL</b>, conforme o produto disponível. Não massagear.</p>
  ${D.fig('img/c1-mantoux.jpg','Técnica intradérmica, aqui no teste tuberculínico (PPD): agulha quase paralela, bisel para cima, formando a pápula. A BCG usa a mesma técnica, no deltoide direito.', 'Wikimedia Commons · CDC/Greg Knobloch · Domínio público')}
  <h4>Subcutânea — tríplice, tetraviral, varicela, febre amarela</h4>
  <p>Face externa superior do braço (região deltoide). Agulha curta (13 mm), formar prega cutânea e introduzir a 90° (45° em crianças muito magras). Volume 0,5 mL.</p>
  <h4>Intramuscular</h4>
  <p><b>Menores de 2 anos:</b> músculo <b>vasto lateral</b> da coxa, terço médio da face anterolateral — maior massa muscular, longe de nervos e vasos importantes. <b>A partir de 2 anos</b> (se massa muscular adequada): <b>deltoide</b>, 3–5 cm abaixo do acrômio. Ângulo de 90°. Não é necessário aspirar. Evitar o glúteo (gordura abundante em crianças, risco ao nervo isquiático). Duas vacinas no mesmo músculo: distância ≥ 2,5 cm.</p>
  ${D.fig('img/c1-im-deltoide.jpg','Deltoide: região de 3–5 cm abaixo do acrômio, acima da linha axilar. É o sítio IM preferido a partir dos 2 anos (como na paciente de 3 anos).', CC('CC BY-SA 4.0','BruceBlaus'))}
  ${D.trap('<p>Na paciente de 3 anos, as IM podem ir no <b>deltoide</b> (ou vasto lateral). Em um lactente, a resposta “glúteo” está sempre errada.</p>')}
  <h3>2. Rede de frio</h3>
  <p>Cadeia de armazenamento, transporte e manipulação que mantém as vacinas entre <b>+2 °C e +8 °C</b> desde o laboratório até a sala de vacina. As <b>adsorvidas em alumínio</b> (penta, DTP, HB, HA, pneumo, meningo) perdem a potência <b>irreversivelmente</b> se congeladas. As <b>vivas</b> são sensíveis a calor e luz (a tríplice e a febre amarela reconstituídas têm validade de poucas horas). Leitura de temperatura registrada no início e no fim do expediente.</p>
  <h3>3. Medicina preventiva</h3>
  ${D.tbl(['Nível (Leavell e Clark)','Exemplo'],[
   ['Primária — promoção da saúde','saneamento, educação, alimentação'],
   ['Primária — <b>proteção específica</b>','<b>vacinação</b>, quimioprofilaxia'],
   ['Secundária','diagnóstico precoce, rastreamento'],
   ['Terciária','reabilitação, limitar sequelas'],
   ['Quaternária (Jamoulle)','evitar intervenção desnecessária (ex.: sorologia antes de vacinar)']])}
  <p><b>Imunidade de rebanho</b> (coletiva): quando uma fração suficiente da população está imune, cada caso gera menos de um caso novo e a cadeia se interrompe, protegendo quem não pode ser vacinado (lactentes jovens, imunodeprimidos). O limiar teórico é <b>1 − 1/R0</b>, em que R0 é o número médio de casos secundários numa população totalmente suscetível.</p>
  ${D.fig('img/c1-rebanho.jpg','Imunidade coletiva: com poucos imunizados (topo) a doença se espalha; com muitos (base), o contágio é contido e até os não vacinados ficam protegidos.', CC('CC BY-SA 4.0','Tkarcher'))}
  ${D.fig('img/c1-limiar.jpg','Limiar de imunidade coletiva em função do R0 (HIT = 1 − 1/R0). R0 = 2 → 50%; R0 = 15 (sarampo) → ≈ 93%. Com a eficácia vacinal &lt; 100%, a cobertura necessária fica ainda maior: daí a meta de 95%.', CC('CC BY-SA 4.0','ARAKI Satoru'))}
  ${D.extra('<p>A queda de cobertura vacinal a partir de meados da década de 2010 trouxe o sarampo de volta ao Brasil: o país perdeu o certificado de eliminação em 2019, após o surto iniciado em 2018, e só voltou a ser reconhecido como livre da circulação endêmica em 2024. Coberturas de tríplice viral abaixo de 95% em muitos municípios mantêm o risco de reintrodução.</p>')}
  <h3>4. Humanística: a conversa com essa mãe</h3>
  <p>A mãe chega provavelmente com culpa (“as vacinas estão atrasadas”). A postura que funciona é a de <b>parceria</b>: reconhecer as dificuldades reais (mudanças, agenda), valorizar que ela trouxe a filha, explicar o plano de forma simples e garantir o acesso (horários, retorno marcado, contato da UBS do novo endereço). Técnicas úteis: <b>perguntas abertas</b>, <b>escuta ativa</b>, <b>informação em pequenos blocos</b> e checagem do entendimento (“para eu saber se expliquei bem, me conta o que a gente vai fazer hoje e no mês que vem?”).</p>

 dq:[
  {q:'As vacinas vivas atenuadas podem produzir manifestações leves semelhantes à doença natural. Como esse fenômeno pode ser explicado do ponto de vista imunológico e por que ele não costuma representar risco para indivíduos imunocompetentes?',
   a:'<p>A vacina viva contém o agente <b>capaz de se replicar</b>, porém com virulência reduzida pela atenuação (passagens seriadas, perda de genes de virulência). Ao se multiplicar de forma limitada, ele infecta algumas células e é reconhecido pela <b>imunidade inata</b> (PAMPs → receptores tipo Toll), que libera <b>citocinas pirogênicas</b> (IL-1, IL-6, TNF, interferons). Essas citocinas causam febre (via PGE2 hipotalâmica), mal-estar e, no caso dos vírus exantemáticos, exantema leve — reproduzindo em pequena escala a doença natural, tipicamente na janela da replicação (5–12 dias na tríplice viral; 3–7 na febre amarela).</p><p>No imunocompetente isso não é perigoso porque: (1) a cepa atenuada tem <b>replicação restrita e baixa virulência</b>; (2) a <b>resposta inata</b> contém a replicação inicial; (3) a <b>resposta adaptativa</b> (T CD8 via MHC I, T CD4 e anticorpos neutralizantes) elimina o agente e gera <b>memória</b>. Já no imunodeprimido (ou no feto) esse controle falha e o vírus vacinal pode causar doença disseminada — por isso vivas são contraindicadas nesses grupos.</p>',
   k:['Cita replicação limitada do agente atenuado','Relaciona com imunidade inata e citocinas (IL-1, IL-6, TNF/interferon)','Explica febre/exantema como “doença em miniatura” na janela de replicação','Explica controle pela imunidade adaptativa (CD8, anticorpos) e geração de memória','Contrasta com imunodeprimido/gestante como população de risco']},
  {q:'Explique por que a vacina pneumocócica usada no lactente é conjugada e por que ela, ao contrário da polissacarídica 23-valente, induz memória imunológica.',
   a:'<p>A proteção contra o pneumococo depende de anticorpos opsonizantes contra o <b>polissacarídeo capsular</b>. Polissacarídeo isolado é antígeno <b>T-independente</b>: ativa linfócitos B da zona marginal por ligação cruzada do BCR, sem processamento em MHC II e sem ajuda de T CD4. Resultado: IgM predominante, pouca troca de classe, <b>sem memória</b>, sem efeito de reforço e baixíssima resposta em <b>menores de 2 anos</b>, cuja zona marginal esplênica é imatura.</p><p>Na <b>conjugada</b>, o polissacarídeo é ligado covalentemente a uma proteína carreadora. O B específico para o polissacarídeo internaliza o conjugado e apresenta <b>peptídeos da proteína em MHC II</b> a T foliculares, que fornecem CD40L e IL-21. Forma-se centro germinativo com troca para IgG, maturação de afinidade, plasmócitos longevos e <b>B de memória</b>, permitindo resposta desde os 2 meses e efeito de reforço. Ainda reduz o estado de portador nasofaríngeo, com proteção coletiva.</p>',
   k:['Identifica polissacarídeo como antígeno T-independente','Explica ausência de memória e má resposta em menores de 2 anos','Descreve a proteína carreadora e apresentação em MHC II a T CD4/folicular','Cita troca de classe, centro germinativo e memória','Menciona redução de portador/rebanho (bônus)']},
  {q:'Elabore o plano vacinal para a paciente do caso (3 anos, esquema completo no 1º ano, nenhuma dose após os 12 meses), justificando o que é aplicado hoje, o que é agendado e o que não é feito.',
   a:'<p><b>Hoje</b> (mesmo dia, sítios diferentes): pneumocócica 10 (dose única de reforço, pois tem entre 12 meses e 4a11m29d sem reforço), meningocócica ACWY (reforço, já tem 2 doses de Meningo C), tríplice viral (dose dos 12 meses perdida), DTP 1º reforço, VIP reforço, hepatite A e influenza (1 dose se teve dose prévia; 2 com 30 dias se nunca).</p><p><b>Em ≥ 30 dias:</b> tetraviral (2ª dose de SCR e 1ª de varicela; exige SCR prévia e intervalo de 30 dias entre vivas injetáveis não simultâneas).</p><p><b>Aos 4 anos:</b> DTP 2º reforço (≥ 6 meses após o 1º), febre amarela reforço e varicela.</p><p><b>Não fazer:</b> BCG (dose única; não revacinar sem cicatriz), hepatite B (completa com HB ao nascer + 3 pentas), rotavírus (completo; idade máxima ultrapassada) e covid (completa; reforço só para imunocomprometidos/comorbidades).</p><p>Princípios: dose aplicada é dose válida; não reiniciar esquema; vacinar no mesmo dia para evitar oportunidade perdida; registrar e orientar ESAVI.</p>',
   k:['Lista as vacinas de hoje (pneumo, ACWY, SCR, DTP, VIP, HA, influenza)','Agenda a tetraviral com intervalo de 30 dias e justifica','Agenda DTP, febre amarela e varicela aos 4 anos','Justifica não repetir BCG, HB, rotavírus','Cita “dose aplicada é dose válida” / não reiniciar esquema']}

 sections:[
 /* S1 */
 {id:'s1', title:'Anatomia e ciclo cardíaco: por que as valvas abrem e fecham', short:'Ciclo cardíaco', d:['fisio'],
  quick: `
  <ul>
   <li><b>Valvas atrioventriculares</b> (mitral à esquerda, tricúspide à direita): presas por <b>cordas tendíneas</b> aos músculos papilares; abrem na diástole.</li>
   <li><b>Valvas semilunares</b> (aórtica e pulmonar): abrem na sístole.</li>
   <li>Valvas são <b>passivas</b>: abrem e fecham por <b>gradiente de pressão</b>.</li>
  </ul>
  ${D.tbl(['Fase','Valvas AV','Semilunares','Evento sonoro'],[
   ['Contração isovolumétrica','fechadas','fechadas','<b>B1</b> no início'],
   ['Ejeção','fechadas','abertas','sopros de ejeção'],
   ['Relaxamento isovolumétrico','fechadas','fechadas','<b>B2</b> no início'],
   ['Enchimento rápido','abertas','fechadas','estalido (EM) · <b>B3</b>'],
   ['Diástase → sístole atrial','abertas','fechadas','<b>B4</b> · reforço pré-sistólico']])}
  ${D.svg(svgCiclo,'Pressões no VE, AE e aorta. B1 = fechamento das AV; B2 = fechamento das semilunares.')}`,
  deep: `
  <p>Todo o exame cardíaco é a tradução sonora de um único fenômeno: <b>valvas que se abrem e se fecham porque a pressão de um lado passou a do outro</b>. Valvas não têm músculo próprio; os músculos papilares só impedem que os folhetos AV invertam para o átrio durante a sístole. Entender o ciclo é entender bulhas e sopros.</p>
  <h3>Anatomia funcional</h3>
  <p>O coração tem quatro câmaras: <b>átrio direito</b> (recebe as cavas), <b>ventrículo direito</b> (bombeia para a artéria pulmonar), <b>átrio esquerdo</b> (recebe as quatro veias pulmonares) e <b>ventrículo esquerdo</b> (bombeia para a aorta). Entre átrios e ventrículos estão as valvas <b>atrioventriculares</b> — <b>tricúspide</b> (três folhetos) e <b>mitral</b> (dois: anterior e posterior) — ancoradas por cordas tendíneas aos músculos papilares. Nas saídas dos ventrículos ficam as <b>semilunares</b>, <b>pulmonar</b> e <b>aórtica</b>, com três válvulas em bolso cada.</p>
  ${D.fig('img/c2-slide-em-mayo.jpg','Coração normal × estenose mitral: o orifício mitral estreitado represa sangue no átrio esquerdo.', SL)}
  <h3>As fases do ciclo, uma a uma</h3>
  ${D.svg(svgCiclo,'Diagrama simplificado (modelo de Wiggers) das pressões no lado esquerdo.')}
  <ol>
   <li><b>Contração isovolumétrica.</b> O VE começa a contrair; a pressão ventricular ultrapassa a atrial e <b>fecha a mitral</b> (componente principal de <b>B1</b>). Por alguns milissegundos todas as valvas estão fechadas e o volume não muda.</li>
   <li><b>Ejeção (rápida e lenta).</b> A pressão do VE ultrapassa a aórtica (≈ 80 mmHg) e <b>abre a aórtica</b>. Abertura normal é silenciosa; uma valva aórtica ou pulmonar estenótica gera <b>sopro sistólico de ejeção</b>.</li>
   <li><b>Relaxamento isovolumétrico.</b> O VE relaxa, sua pressão cai abaixo da aórtica e <b>fecha a aórtica</b> (A2) — e, à direita, a pulmonar (P2): <b>B2</b>.</li>
   <li><b>Enchimento rápido.</b> A pressão do VE cai abaixo da do AE e <b>abre a mitral</b>. É aqui que surge o <b>estalido de abertura</b> se a valva estiver espessada e “em domo”, e a <b>B3</b> se o ventrículo receber um grande volume rapidamente.</li>
   <li><b>Diástase.</b> Enchimento lento, pressões quase iguais.</li>
   <li><b>Sístole atrial.</b> O átrio contrai e completa 15–25% do enchimento (mais em ventrículos rígidos). É a origem da <b>B4</b> e do <b>reforço pré-sistólico</b> do ruflar mitral — que <b>desaparece na fibrilação atrial</b>.</li>
  </ol>
  ${D.fig('img/c2-wiggers.jpg','Diagrama de Wiggers completo: pressões aórtica, atrial e ventricular, volume ventricular, ECG e fonocardiograma no mesmo eixo de tempo. Note B1 logo após o QRS e B2 no fim da onda T.', CC('CC BY-SA 4.0','adh30 / DanielChangMD'))}
  ${D.pearl('<p>Correlação com o ECG: <b>B1 coincide com o fim do QRS</b> (sístole elétrica antes da mecânica); <b>B2 com o fim da onda T</b>. Palpar o pulso carotídeo enquanto ausculta também separa sístole de diástole: o pulso vem logo após B1.</p>')}
  <h3>Por que a diástole é a fase vulnerável</h3>
  <p>Com o aumento da frequência cardíaca, a <b>diástole encurta muito mais que a sístole</b>. Para quem depende de tempo de enchimento (estenose mitral) ou de perfusão coronariana (que ocorre sobretudo na diástole no VE), taquicardia é desastre. Guarde essa ideia: ela explica por que a paciente piora com esforço e palpitações, e por que o tratamento usa <b>betabloqueador</b>.</p>
  ${D.integ('<p>A mesma lógica de “tempo de diástole” aparece no <b>Leito 04</b> (ICFEp, isquemia) e na farmacologia dos betabloqueadores.</p>','Integração')}`,

 /* S2 */
 {id:'s2', title:'Bulhas e sopros: a gênese do som', short:'Bulhas e sopros', d:['semio','fisio'],
