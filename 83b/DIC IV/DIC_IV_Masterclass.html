 /* S3 */
 {id:'s3', title:'Farmacocinética: o que o corpo faz com o fármaco', short:'Farmacocinética', d:['farmaco'],
  quick: `
  ${D.svg(svgADME,'ADME e a fórmula da meia-vida.')}
  <ul>
   <li><b>Biodisponibilidade (F)</b>: fração da dose que chega inalterada à circulação sistêmica (IV = 100%); ↓ por absorção incompleta e <b>metabolismo de primeira passagem</b>.</li>
   <li><b>Vd</b>: volume aparente em que o fármaco se distribui; alto = lipofílico/tecidual.</li>
   <li><b>Clearance</b>: volume de plasma depurado por tempo; define a <b>dose de manutenção</b>.</li>
   <li><b>Meia-vida</b>: tempo para a concentração cair à metade; <b>estado de equilíbrio em ~4–5 t½</b>.</li>
   <li>Cinética de 1ª ordem (fração constante) × <b>ordem zero</b> (quantidade constante: etanol, fenitoína e AAS em doses altas).</li>
  </ul>
  <div class="widget" data-w="pk"></div>`,
  deep: `
  ${D.svg(svgADME,'Farmacocinética = o percurso do fármaco no corpo.')}
  <h3>Absorção e biodisponibilidade</h3>
  <p>Depende da via, da lipossolubilidade, do grau de ionização (pH local e pKa), da formulação, do fluxo sanguíneo e da área absortiva. Por via oral, o fármaco passa pela veia porta e pode ser extensamente metabolizado no fígado (e no enterócito) antes de chegar à circulação: <b>efeito de primeira passagem</b> (nitroglicerina, propranolol, morfina). Vias sublingual, retal (parcialmente), transdérmica, inalatória e parenteral escapam dele.</p>
  <h3>Distribuição</h3>
  <p><b>Vd = quantidade no corpo / concentração plasmática</b>. Fármacos muito ligados à albumina ou hidrossolúveis ficam no plasma (Vd pequeno); lipofílicos se acumulam em tecidos (Vd grande). Só a <b>fração livre</b> age e é eliminada: hipoalbuminemia (desnutrição, cirrose, nefrótica) aumenta a fração livre de fármacos como fenitoína e varfarina. Barreiras: hematoencefálica, placentária.</p>
  <h3>Metabolismo</h3>
  <p><b>Fase I</b> (oxidação, redução, hidrólise; <b>CYP450</b> — 3A4, 2D6, 2C9, 2C19, 1A2) cria ou expõe grupos funcionais; <b>fase II</b> (glicuronidação, sulfatação, acetilação, conjugação com glutationa) torna o composto hidrossolúvel para excreção. <b>Indutores</b> (rifampicina, carbamazepina, fenitoína, tabaco para CYP1A2, erva-de-são-joão) aceleram; <b>inibidores</b> (claritromicina, cetoconazol, fluconazol, suco de grapefruit, ritonavir) aumentam níveis. Pró-fármacos dependem do metabolismo para ativar (clopidogrel, enalapril, codeína).</p>
  <h3>Excreção renal</h3>
  <p>Excreção = <b>filtração glomerular</b> (só fração livre) + <b>secreção tubular</b> ativa (transportadores OAT/OCT no túbulo proximal; penicilinas, metformina) − <b>reabsorção tubular</b> (passiva, favorecida pela forma não ionizada; alcalinizar a urina aumenta a excreção de ácidos fracos como o AAS). Quando a TFG cai, o clearance dos fármacos de eliminação renal cai junto.</p>
  <h3>Meia-vida, acúmulo e estado de equilíbrio</h3>
  <p><b>t½ = 0,693 × Vd / CL</b>. Na cinética de 1ª ordem, a cada t½ elimina-se metade do que resta; com doses repetidas, o equilíbrio (entrada = saída) chega em ~4–5 t½, e após suspensão, ~4–5 t½ para eliminar. Se o CL cai à metade, a t½ dobra e a concentração média no equilíbrio dobra — e o fármaco <b>sai da janela terapêutica</b>. Para atingir rapidamente o alvo, usa-se <b>dose de ataque</b> (depende do Vd); a <b>dose de manutenção</b> depende do CL.</p>
  <div class="widget" data-w="pk"></div>
  ${D.pearl('<p>Ajuste renal: <b>reduzir a dose</b> mantendo o intervalo, ou <b>aumentar o intervalo</b> mantendo a dose. A escolha depende da farmacodinâmica: β-lactâmicos (tempo acima da CIM) preferem dose menor e intervalo mantido; aminoglicosídeos (pico/CIM) preferem intervalo maior.</p>')}`,
  qs:[
   {q:'Um fármaco com t½ de 8 h, iniciado sem dose de ataque, atinge o estado de equilíbrio em aproximadamente:',
    o:['8 h','16 h','32–40 h','72 h','1 semana'], a:2, d:['farmaco'], e:'4–5 meias-vidas.'},
   {q:'Se o clearance de um fármaco cai pela metade (Vd constante), a meia-vida:',
    o:['Cai pela metade','Não muda','Dobra','Quadruplica','Zera'], a:2, d:['farmaco'], e:'t½ = 0,693 × Vd / CL.'},
   {q:'A biodisponibilidade oral baixa da morfina se deve principalmente a:',
    o:['Má dissolução','Metabolismo de primeira passagem hepático','Excreção renal rápida','Ligação a proteínas','Barreira hematoencefálica'], a:1, d:['farmaco'], e:'Por isso a dose oral é maior que a IV.'}
  ]},
 /* S4 */
 {id:'s4', title:'Farmacodinâmica, janela terapêutica e o idoso', short:'Farmacodinâmica', d:['farmaco'],
  quick: `
  ${D.svg(svgDR,'Potência (posição da curva) × eficácia (altura); índice terapêutico.')}
  <ul>
   <li><b>Afinidade</b>: força de ligação ao receptor. <b>Eficácia</b>: efeito máximo. <b>Potência</b>: dose para 50% do efeito (DE50).</li>
   <li><b>Agonista total, parcial, antagonista</b> (competitivo desloca a curva à direita sem reduzir o máximo; não competitivo reduz o máximo).</li>
   <li><b>Índice terapêutico</b> = DT50/DE50; <b>janela terapêutica</b> = faixa entre concentração mínima eficaz e tóxica. Janela estreita: digoxina, lítio, varfarina, fenitoína, aminoglicosídeos, teofilina.</li>
   <li><b>Idoso</b>: ↓ água e massa magra, ↑ gordura, ↓ albumina, ↓ fluxo hepático, <b>↓ TFG</b>, mais sensibilidade no SNC, polifarmácia → <b>Critérios de Beers</b>.</li>
  </ul>`,
  deep: `
  <h3>Do receptor ao efeito</h3>
  <p>Farmacodinâmica é o que o fármaco faz no organismo: liga-se a um alvo (receptor, enzima, canal, transportador) e desencadeia uma resposta. <b>Afinidade</b> é a capacidade de ligar; <b>atividade intrínseca/eficácia</b> é a capacidade de ativar. Agonista total tem eficácia máxima; parcial, eficácia submáxima (e pode antagonizar o total); antagonista tem afinidade sem eficácia.</p>
  ${D.svg(svgDR,'Esquerda: A e B têm a mesma eficácia, A é mais potente; C tem menor eficácia. Direita: curvas de efeito e de toxicidade; a distância entre elas é a margem de segurança.')}
  ${D.trap('<p><b>Potência não é eficácia.</b> Um fármaco mais potente precisa de menos miligramas para o mesmo efeito, mas não necessariamente produz um efeito maior. Clinicamente, eficácia importa mais.</p>')}
  <h3>Janela terapêutica</h3>
  <p>É a faixa de concentração plasmática entre a mínima eficaz e a mínima tóxica. Tudo que muda a farmacocinética — absorção, metabolismo, ligação a proteínas e, sobretudo, <b>eliminação</b> — empurra a concentração para fora da janela. Na DRC, fármacos de eliminação renal acumulam (digoxina, lítio, aminoglicosídeos, vancomicina, metformina, gabapentina, enoxaparina, nitrofurantoína). Fármacos de janela estreita exigem <b>monitorização de nível sérico</b>.</p>
  <h3>O idoso: farmacocinética e farmacodinâmica mudam</h3>
  ${D.tbl(['Alteração','Consequência'],[
   ['↓ água corporal e massa magra','Vd ↓ de hidrossolúveis (lítio, digoxina) → níveis ↑'],
   ['↑ gordura','Vd ↑ de lipossolúveis (benzodiazepínicos) → t½ ↑, efeito prolongado'],
   ['↓ albumina','fração livre ↑ (fenitoína, varfarina)'],
   ['↓ massa e fluxo hepático','metabolismo de fase I ↓ (fase II relativamente preservada)'],
   ['<b>↓ TFG</b>','acúmulo de fármacos renais; creatinina engana'],
   ['↑ sensibilidade (SNC, barorreflexo)','quedas, delirium, hipotensão postural']])}
  <p>Os <b>Critérios de Beers (AGS 2023)</b> listam medicamentos potencialmente inapropriados em idosos — inclusive a <b>nitrofurantoína com ClCr &lt; 30 mL/min</b> (ineficácia e toxicidade) e o uso prolongado dela (toxicidade pulmonar e hepática).</p>
  ${D.integ('<p><b>Humanística e segurança do paciente</b>: reações adversas são causa importante de internação em idosos. Reconciliação medicamentosa, checagem de função renal antes de prescrever e notificação de eventos adversos à farmacovigilância (Anvisa) fazem parte da boa prática.</p>','Integração · Humanística')}`,
  qs:[
   {q:'Um antagonista competitivo desloca a curva dose-resposta do agonista:',
    o:['Para baixo, reduzindo o efeito máximo','Para a direita, sem reduzir o efeito máximo','Para a esquerda','Não altera','Para cima'], a:1, d:['farmaco'], e:'Superável com mais agonista.'},
   {q:'Fármaco com janela terapêutica estreita e eliminação renal, que exige nível sérico:',
    o:['Paracetamol','Lítio','Amoxicilina','Omeprazol','Loratadina'], a:1, d:['farmaco'], e:'Também digoxina, aminoglicosídeos, vancomicina.'},
   {q:'No idoso, benzodiazepínicos lipofílicos têm efeito prolongado principalmente porque:',
    o:['O Vd diminui','O aumento de gordura eleva o Vd e prolonga a meia-vida','A TFG aumenta','A albumina aumenta','A absorção cai'], a:1, d:['farmaco'], hard:true, e:'t½ = 0,693 × Vd / CL.'}
  ]},
 /* S5 */
 {id:'s5', title:'Nitrofurantoína e a neuropatia tóxica', short:'Nitrofurantoína', d:['farmaco','pato'],
  quick: `
  ${D.svg(svgNitro,'Na insuficiência renal, a nitrofurantoína falha na urina e se acumula no sangue.')}
  <ul>
   <li><b>Mecanismo</b>: reduzida por <b>nitrorredutases bacterianas</b> a intermediários reativos que lesam DNA, ribossomos e enzimas (bactericida, múltiplos alvos → pouca resistência).</li>
   <li>Espectro: E. coli, S. saprophyticus, enterococo; <b>não</b> Proteus, Pseudomonas. Só para <b>cistite</b> (não atinge rim/sangue).</li>
   <li>Toxicidades: <b>polineuropatia</b> (sensitivo-motora, ascendente, axonal), <b>pulmonar</b> (pneumonite aguda; fibrose no uso crônico), <b>hepatite</b>, hemólise na <b>deficiência de G6PD</b>, GI.</li>
   <li>Risco de neuropatia: <b>insuficiência renal</b>, <b>diabetes</b>, anemia, <b>deficiência de B12</b>, idade.</li>
  </ul>`,
  deep: `
  <h3>Como age</h3>
  <p>A nitrofurantoína entra na bactéria e é reduzida por <b>flavoproteínas (nitrorredutases)</b> a intermediários reativos que atacam DNA, proteínas ribossomais e enzimas do ciclo de Krebs. Como atinge vários alvos ao mesmo tempo, a resistência é rara. A absorção oral é boa, mas a meia-vida plasmática é curta (~20 min) e cerca de 30–40% é excretada inalterada na urina, onde atinge concentrações bactericidas. Por isso é um fármaco “de urina”: <b>só serve para cistite</b>.</p>
  ${D.svg(svgNitro,'Mesmo fármaco, dois rins, dois destinos.')}
  <h3>Por que a paciente adoeceu</h3>
  <p>Com ClCr ≈ 27 mL/min, a filtração e a secreção caem: a concentração urinária fica <b>subterapêutica</b> (falha do tratamento) e a plasmática <b>sobe</b>, expondo os nervos. O mecanismo da neurotoxicidade não é totalmente esclarecido — envolve estresse oxidativo, inibição de enzimas do metabolismo energético e do transporte axonal, lesando primeiro as <b>fibras mais longas</b>. Somam-se fatores de vulnerabilidade da paciente: <b>diabetes</b> (neuropatia subclínica prévia), <b>metformina</b> (reduz absorção de B12 no íleo — deficiência de B12 também causa neuropatia) e a <b>quimioterapia</b> prévia (platinas e taxanos são neurotóxicos).</p>
  <h3>Patologia: neuropatia axonal comprimento-dependente</h3>
  <p>Na degeneração axonal tóxico-metabólica, o neurônio não consegue manter a porção mais distal do axônio: a degeneração começa na extremidade e progride em direção ao corpo celular (<b>“dying back”</b>). Por isso os sintomas começam nos <b>pés</b> (axônios mais longos do corpo, ~1 m), sobem pelas pernas e, quando alcançam o nível dos joelhos, atingem as mãos — padrão <b>“em bota e luva”</b>. Na biópsia: perda de fibras mielinizadas, ovoides de mielina (degeneração walleriana-like), poucos sinais de desmielinização segmentar. Recuperação lenta (o axônio regenera ~1 mm/dia) e às vezes incompleta.</p>
  ${D.clin('<p><b>Diagnóstico diferencial obrigatório</b>: fraqueza <b>ascendente rápida</b> com parestesias é também o quadro da <b>síndrome de Guillain-Barré</b> (polirradiculoneuropatia desmielinizante autoimune, frequentemente pós-infecciosa): arreflexia, dissociação albuminocitológica no líquor, risco de insuficiência respiratória. A eletroneuromiografia separa padrão <b>axonal</b> (amplitudes ↓, tóxico) de <b>desmielinizante</b> (velocidade ↓, bloqueio de condução).</p>')}
  ${D.extra('<p>A nitrofurantoína colore a urina de marrom-escuro (inofensivo) e deve ser tomada com alimento (melhora absorção e tolerância GI). A forma macrocristalina tem liberação mais lenta e menos náusea.</p>')}`,

    o:['Inibe PBP','Reduzida por nitrorredutases bacterianas a intermediários que lesam DNA e ribossomos','Inibe DNA girase','Inibe a subunidade 30S','Bloqueia síntese de folato'], a:1, d:['farmaco'], e:'Múltiplos alvos.'},
   {q:'Por que os sintomas da neuropatia tóxica começam nos pés?',

 {id:'s6', title:'Semiologia da polineuropatia', short:'Exame neurológico', d:['semio','prope'],
  quick: `
  ${D.tbl(['Avaliar','Como','Achado na polineuropatia'],[
   ['Força','escala MRC 0–5, distal × proximal','fraqueza distal (dorsiflexão do pé) que sobe'],
   ['Reflexos','aquileu, patelar, bicipital','<b>aquileu ↓/abolido</b> primeiro (arreflexia global no Guillain-Barré)'],
   ['Sensibilidade dolorosa e térmica','agulha, tubo frio (fibras finas)','↓ em bota e luva'],
   ['Vibratória e propriocepção','diapasão 128 Hz no hálux; posição do hálux (fibras grossas)','↓ distal'],
   ['Monofilamento 10 g','pontos plantares (pé diabético)','perda da sensibilidade protetora'],
   ['Romberg','pés juntos, olhos abertos → fechados','<b>positivo</b> se perda proprioceptiva (ataxia sensitiva)'],
   ['Marcha','observar','escarvante (pé caído), talonante']])}`,
  deep: `
  <h3>Localizar antes de nomear</h3>
  <p>Fraqueza e parestesia nos membros inferiores podem vir do encéfalo, da medula, da raiz, do plexo, do nervo, da junção ou do músculo. O padrão da paciente — <b>distal, simétrico, sensitivo e motor, ascendente</b> — localiza no <b>nervo periférico de forma difusa</b> (polineuropatia). Contrastes úteis:</p>
  ${D.tbl(['Topografia','Pistas'],[
   ['Lesão medular','nível sensitivo no tronco, hiper-reflexia e Babinski (após fase de choque), bexiga neurogênica'],
   ['Polineuropatia','distal e simétrica (bota e luva), hiporreflexia distal, sem nível sensitivo'],
   ['Mononeuropatia','território de um nervo (ex.: fibular → pé caído com sensibilidade do dorso do pé)'],
   ['Miopatia','fraqueza proximal, sem alteração sensitiva, reflexos preservados'],
   ['Junção (miastenia)','fraqueza flutuante, fatigável, ptose/diplopia']])}
  <h3>O exame</h3>
  <ul>
   <li><b>Força</b> (MRC): 0 sem contração; 1 contração sem movimento; 2 movimento sem gravidade; 3 vence gravidade; 4 vence alguma resistência; 5 normal. Testar dorsiflexão e flexão plantar, extensão do joelho, flexão do quadril.</li>
   <li><b>Reflexos profundos</b> (martelo): aquileu (S1), patelar (L4), bicipital (C5–6), tricipital (C7). A polineuropatia axonal abole primeiro o <b>aquileu</b>.</li>
   <li><b>Sensibilidade</b>: superficial (dor, temperatura — fibras finas; tato), profunda (vibração com <b>diapasão de 128 Hz</b> no hálux/maléolo; posição segmentar do hálux — fibras grossas). Comparar distal × proximal e direita × esquerda, mapeando o limite.</li>
   <li><b>Romberg</b>: o paciente fica de pé, pés juntos; se cai ao fechar os olhos, depende da visão para compensar a perda proprioceptiva (positivo).</li>
   <li>Pé diabético: <b>monofilamento de 10 g</b>, inspeção, pulsos, calçados.</li>
  </ul>
  ${D.integ('<p>Na DIC, o exame motor e a escala de força reaparecem no ${D.lk(9,"AVC")} — lá com padrão central (hemiparesia, hiper-reflexia, Babinski).</p>','Integração')}`,
  qs:[
   {q:'Paciente com fraqueza distal simétrica, parestesia em bota e aquileus abolidos. Localização:',
    o:['Córtex motor','Medula espinhal','Nervo periférico (polineuropatia)','Junção neuromuscular','Músculo'], a:2, d:['semio'], e:'Padrão distal e simétrico.'},
   {q:'Instrumento para avaliar a sensibilidade vibratória:',
    o:['Monofilamento 10 g','Diapasão de 128 Hz','Martelo de reflexos','Agulha','Algodão'], a:1, d:['prope'], e:'Testa fibras grossas (coluna posterior).'},
   {q:'Romberg positivo indica principalmente:',
    o:['Lesão cerebelar','Déficit proprioceptivo (ataxia sensitiva)','Fraqueza proximal','Vertigem periférica sempre','Hemiparesia'], a:1, d:['semio'], hard:true, e:'Piora ao retirar a visão.'}
  ]},

 {id:'s7', title:'Rim doente: LRA, DRC e a conduta', short:'LRA, DRC e conduta', d:['clin','pato','lab','farmaco'],
  quick: `
  <ul>
   <li><b>LRA</b> (KDIGO): Cr ↑ ≥ 0,3 mg/dL em 48 h, ou ≥ 1,5× a basal em 7 dias, ou diurese &lt; 0,5 mL/kg/h por 6 h. Pré-renal, renal (NTA, nefrite intersticial) ou <b>pós-renal (obstrução)</b>.</li>
   <li><b>DRC</b>: TFG &lt; 60 ou marcador de lesão (albuminúria) por <b>≥ 3 meses</b>. Estágios G1–G5 × A1–A3.</li>
   <li>Complicações: hipercalemia, acidose metabólica, anemia (↓ EPO), distúrbio mineral-ósseo, hipervolemia, uremia.</li>
   <li>TRS: hemodiálise (fístula arteriovenosa), diálise peritoneal, transplante.</li>
  </ul>
  <h4>Conduta no caso</h4>
  <p><b>Suspender a nitrofurantoína</b>; antibiótico guiado por antibiograma com ajuste renal; <b>suspender metformina</b> (TFGe &lt; 30); investigar <b>obstrução</b> (USG, resíduo) e se a disfunção é aguda ou crônica; dosar B12; notificar RAM.</p>`,
  deep: `
  ${D.fig('img/c8-slide-lra-drc.jpg','Rim normal, rim na insuficiência renal aguda (aumentado, edemaciado) e na crônica (reduzido, contraído, cortical fina).', SL)}
  <h3>Aguda ou crônica?</h3>
  <p>Sem creatinina prévia, não se sabe. Pistas de cronicidade: <b>rins pequenos</b> e hiperecogênicos na USG (exceto DM, amiloidose, policística), anemia normocítica, hiperparatireoidismo secundário, história de DM de longa data. A paciente tem razões para ambas: <b>DRC diabética</b> e/ou <b>pós-renal</b> (estenose de uretra; radioterapia pélvica pode causar estenose ureteral e hidronefrose) e/ou piora aguda pela infecção.</p>
  ${D.tbl(['LRA','Mecanismo','Pistas'],[
   ['Pré-renal','hipoperfusão (desidratação, IC, sepse, AINE, IECA)','ureia/Cr alta, sódio urinário &lt; 20, FeNa &lt; 1%'],
   ['Renal intrínseca','necrose tubular aguda (isquemia, aminoglicosídeo, contraste), nefrite intersticial (β-lactâmicos, AINE, IBP), glomerulonefrite','cilindros granulosos/hemáticos/leucocitários'],
   ['<b>Pós-renal</b>','obstrução bilateral (próstata, estenose uretral, tumor pélvico)','hidronefrose na USG, bexigoma, resíduo pós-miccional']])}
  <h3>DRC: estadiamento e complicações</h3>
  ${D.fig('img/c8-slide-kdigo.jpg','Classificação KDIGO da DRC: TFG (G1–G5) × albuminúria (A1–A3); as cores indicam risco de progressão e eventos.', SL)}
  <p>Causas principais no Brasil: <b>hipertensão</b> e <b>diabetes</b>. Complicações conforme a TFG cai: hipercalemia e acidose (menos excreção de K⁺ e H⁺), <b>anemia</b> (↓ eritropoetina), <b>distúrbio mineral-ósseo</b> (↓ calcitriol, ↑ fósforo, ↑ PTH), hipervolemia e hipertensão, <b>uremia</b> (náuseas, prurido, pericardite, encefalopatia, neuropatia, sangramento por disfunção plaquetária).</p>
  ${D.integ('<p><b>Hipercalemia</b> grave: gluconato de cálcio (estabiliza a membrana cardíaca), <b>insulina + glicose</b> e <b>β2-agonista inalatório</b> (deslocam K⁺ para dentro das células — ${D.lk(5,"DPOC")}), depois remoção (diurético, resinas, diálise).</p>','Integração · Farmacologia')}
  <h3>Terapia renal substitutiva</h3>
  ${D.fig('img/c8-slide-hd.jpg','Hemodiálise: o sangue sai pela fístula arteriovenosa, passa pelo dialisador (membrana semipermeável, difusão contra o dialisato) e retorna.', SL)}
  ${D.fig('img/c8-slide-fistula.jpg','Fístula arteriovenosa: anastomose cirúrgica (ex.: artéria radial + veia cefálica) que arterializa a veia para punções repetidas. Ao exame: frêmito palpável e sopro contínuo.', SL)}
  ${D.fig('img/c8-slide-dp.jpg','Diálise peritoneal: o peritônio funciona como membrana; solução infundida pelo cateter permanece horas e é drenada com toxinas e excesso de líquido.', SL)}
  <p>Indicações de diálise de urgência (mnemônico <b>AEIOU</b>): <b>A</b>cidose refratária, distúrbios <b>E</b>letrolíticos (hipercalemia refratária), <b>I</b>ntoxicações dialisáveis (lítio, metanol, salicilato), <b>O</b>verload (hipervolemia refratária, edema agudo), <b>U</b>remia sintomática (pericardite, encefalopatia).</p>
  <h3>A conduta, passo a passo</h3>
  <ol>
   <li><b>Suspender a nitrofurantoína</b> (causa provável da neuropatia; e ineficaz com ClCr &lt; 30).</li>
   <li>Escolher antibiótico pelo <b>antibiograma</b>, cobrindo ITU complicada, com <b>ajuste renal</b> (ex.: cefalosporina oral ou amoxicilina-clavulanato com dose corrigida; fosfomicina para cistite), 7 dias.</li>
   <li><b>Metformina</b>: TFGe ≈ 27 → <b>suspender</b> (risco de acidose lática); alternativas: insulina ou iDPP-4 com ajuste (linagliptina não precisa).</li>
   <li>Investigar a função renal: <b>USG de rins e vias urinárias</b> (hidronefrose? resíduo?), EAS/relação albumina-creatinina, repetir creatinina, eletrólitos, gasometria venosa.</li>
   <li>Neuropatia: exame seriado, <b>ENMG</b>, dosar <b>B12</b>, glicemia/HbA1c; atentar para Guillain-Barré se progredir (capacidade vital, deglutição).</li>
   <li><b>Notificar</b> a reação adversa (farmacovigilância), revisar todas as prescrições pela TFG, orientar a paciente.</li>
  </ol>`,
  qs:[
   {q:'Critério KDIGO para lesão renal aguda:',
    o:['Creatinina &gt; 1,2 mg/dL','Aumento de creatinina ≥ 0,3 mg/dL em 48 h','TFG &lt; 60 por 3 meses','Albuminúria &gt; 30 mg/g','Ureia &gt; 50'], a:1, d:['lab','clin'], e:'Ou ≥ 1,5× basal em 7 dias, ou oligúria.'},
   {q:'Com TFGe de 27 mL/min/1,73 m², a conduta com a metformina é:',

    o:['Pulso ausente','Frêmito palpável e sopro contínuo','Cianose distal','Sopro sistólico apenas','Edema duro'], a:1, d:['semio','prope'], e:'Fluxo turbulento de alta velocidade.'}
  ]}

 dq:[
  {q:'Explique, com base na farmacocinética, por que a paciente desenvolveu toxicidade pela nitrofurantoína e como isso se relaciona com a janela terapêutica.',
   a:'<p>A nitrofurantoína é absorvida por via oral, tem meia-vida plasmática curta e é eliminada principalmente pelo rim (filtração e secreção), concentrando-se na urina. Com ClCr de ≈ 27 mL/min (Cockcroft-Gault), o <b>clearance renal cai</b>, a <b>meia-vida aumenta</b> (t½ = 0,693 × Vd / CL) e o fármaco <b>acumula no plasma</b>, ultrapassando a concentração tóxica — a concentração sai da <b>janela terapêutica</b> para cima no sangue, enquanto na urina fica abaixo do nível eficaz (falha terapêutica). Os metabólitos reativos lesam os axônios mais longos, causando polineuropatia sensitivo-motora ascendente, potencializada por diabetes e possível deficiência de B12 (metformina).</p>',
   k:['Eliminação predominantemente renal','ClCr reduzido → t½ ↑ e acúmulo','Saída da janela terapêutica (tóxico no sangue)','Concentração urinária insuficiente (falha)','Fatores de risco associados (DM, B12)']},
  {q:'Calcule o clearance de creatinina da paciente pela fórmula de Cockcroft-Gault, interprete o resultado e explique por que a creatinina isolada subestima a gravidade.',
   a:'<p>ClCr = (140 − 74) × 65 / (72 × 1,9) × 0,85 = 4.290 / 136,8 × 0,85 ≈ <b>27 mL/min</b>. Corresponde a função renal gravemente reduzida (faixa G4, 15–29), o que contraindica a nitrofurantoína (&lt; 30) e a metformina (TFGe &lt; 30) e exige ajuste de outros fármacos de eliminação renal.</p><p>A creatinina é produzida pelo músculo; idosas têm menor massa muscular e produzem menos creatinina, então um valor “pouco elevado” (1,9) corresponde a uma perda de função muito maior do que em um jovem musculoso. Além disso, a relação creatinina × TFG é hiperbólica: a creatinina só sobe quando grande parte dos néfrons já foi perdida.</p>',
   k:['Aplica a fórmula corretamente','Resultado ≈ 27 mL/min','Interpreta a gravidade/estágio','Relaciona com contraindicações (nitrofurantoína, metformina)','Explica dependência da massa muscular/idade']},
  {q:'Defina farmacocinética e farmacodinâmica, biodisponibilidade, meia-vida e janela terapêutica, dando um exemplo de como cada uma pode ser alterada no idoso.',
   a:'<p><b>Farmacocinética</b>: o que o organismo faz com o fármaco (absorção, distribuição, metabolismo, excreção). <b>Farmacodinâmica</b>: o que o fármaco faz no organismo (ligação ao alvo, mecanismo, efeitos). <b>Biodisponibilidade</b>: fração da dose que chega inalterada à circulação sistêmica (↓ pelo metabolismo de primeira passagem; no idoso, menor fluxo hepático pode aumentá-la para fármacos de alta extração). <b>Meia-vida</b>: tempo para a concentração plasmática cair à metade; depende de Vd e CL — no idoso, ↓ TFG reduz CL e ↑ gordura aumenta Vd de lipossolúveis, prolongando a t½. <b>Janela terapêutica</b>: faixa entre concentração mínima eficaz e tóxica; no idoso, acúmulo e maior sensibilidade farmacodinâmica (SNC) facilitam a toxicidade.</p>',
   k:['Farmacocinética × farmacodinâmica','Biodisponibilidade e primeira passagem','Meia-vida (Vd, CL)','Janela terapêutica','Exemplos de alterações no idoso']}
 ],

  <p>Afasia de <b>expressão</b> (fala não fluente, compreensão preservada) localiza na <b>área de Broca</b> (giro frontal inferior, hemisfério dominante — esquerdo em ~95% dos destros). Hemiparesia direita com face e braço: <b>córtex motor esquerdo</b> lateral ou suas fibras — território da <b>artéria cerebral média esquerda</b>. O desvio da boca para a esquerda é a <b>paralisia facial central direita</b>: o lado direito da boca cai e o esquerdo, normal, “puxa”. Sensibilidade preservada sugere ramo superior da ACM. As <b>bulhas arrítmicas</b> sugerem <b>fibrilação atrial</b>: trombo no átrio esquerdo que embolizou para a ACM — o mecanismo mais provável, ao lado da aterosclerose (HAS, tabagismo, obesidade).</p>

  <h3>O caminho da via piramidal</h3>
  ${D.svg(svgVias,'Corticoespinal e corticonuclear.')}
  <p>Do córtex, as fibras descem pela <b>coroa radiada</b>, convergem no <b>ramo posterior da cápsula interna</b> (onde uma lesão pequena causa déficit grande e proporcionado), passam pelo pedúnculo cerebral, ponte e pirâmide bulbar, onde ~85–90% <b>cruzam</b> (decussação das pirâmides) e descem no funículo lateral da medula até o neurônio motor inferior do corno anterior.</p>
  ${D.tbl(['Sinal','Neurônio motor superior (AVC)','Neurônio motor inferior (nervo)'],[
   ['Tônus','espasticidade (aguda: flacidez)','flacidez'],['Reflexos','hiper-reflexia, clônus','hipo/arreflexia'],['Plantar','<b>Babinski</b> (extensor)','flexor'],['Trofismo','atrofia tardia, por desuso','atrofia precoce, fasciculações'],['Distribuição','padrão (hemicorpo)','território de raiz/nervo']])}
  <h3>Linguagem</h3>
  <p><b>Broca</b> (frontal inferior): afasia de expressão — fala lenta, telegráfica, esforço, compreensão relativamente preservada, o paciente percebe o déficit. <b>Wernicke</b> (temporal superior posterior): afasia de compreensão — fala fluente, sem sentido, parafasias, não compreende, frequentemente não percebe. <b>Disartria</b> é diferente: problema motor da articulação (a linguagem está intacta). O paciente A tem as duas.</p>
  ${D.integ('<p>Em AVC de hemisfério <b>não dominante</b> (direito), em vez de afasia surgem <b>negligência</b> do hemiespaço esquerdo, <b>anosognosia</b> (não reconhece o déficit) e apraxia de vestir — relevante para o caso B.</p>','Integração · Neurologia')}`,

  <p>A <b>carótida interna</b> dá a <b>ACA</b> e a <b>ACM</b>; as <b>vertebrais</b> formam a <b>basilar</b>, que se divide nas <b>ACP</b>. O polígono de Willis conecta os sistemas, mas é incompleto em muitas pessoas. A <b>ACM</b> é a mais acometida (continuação direta da carótida: o êmbolo “segue o fluxo”). Seus ramos <b>lenticuloestriados</b>, finos e perpendiculares, irrigam núcleos da base e cápsula interna — alvo da lipo-hialinose hipertensiva (lacunas e hemorragias profundas).</p>

 /* S4 */
 {id:'s4', title:'Isquemia e necrose: fisiopatologia e anatomia patológica', short:'Isquemia → necrose', d:['pato','fisio'],
  quick: `
  <ul>
   <li><b>Isquemia</b>: fluxo insuficiente para a demanda — lesão <b>reversível</b> se reperfundida a tempo. <b>Necrose</b>: morte celular <b>irreversível</b>.</li>
   <li><b>Núcleo</b> (necrose em minutos) e <b>penumbra</b> (disfuncional, salvável) → alvo da reperfusão.</li>
   <li>Cascata: ATP ↓ → bomba Na⁺/K⁺ falha → glutamato → Ca²⁺ → enzimas, radicais → edema citotóxico.</li>
   <li>No encéfalo: <b>necrose liquefativa</b>. Sequência: neurônios vermelhos (12–24 h) → neutrófilos (1–3 d) → macrófagos (3 d–3 sem) → gliose e cavitação (semanas–meses).</li>
   <li>Infarto <b>pálido</b> (trombótico) × <b>hemorrágico</b> (embólico com reperfusão).</li>
  </ul>
  <div class="widget" data-w="relogio"></div>`,
  deep: `
  <h3>Isquemia não é necrose</h3>
  <p><b>Isquemia</b> é a redução do fluxo sanguíneo com oferta insuficiente de O₂ e glicose. O neurônio é a célula mais vulnerável do corpo: sem reserva de glicogênio, depende de fluxo contínuo. Com fluxo abaixo de ~20 mL/100 g/min cessa a função elétrica (déficit clínico), mas a célula ainda vive; abaixo de ~10, morre em minutos. Por isso o infarto tem um <b>núcleo</b> já necrótico cercado por <b>penumbra</b> — tecido em silêncio elétrico, mas viável, que pode ser salvo se o fluxo voltar. Recuperação rápida e completa (&lt; 24 h, sem lesão na RM) é o <b>AIT</b>: um aviso.</p>
  ${D.svg(svgCascata,'Do fluxo baixo à morte celular.')}
  <p>Sem ATP, a <b>Na⁺/K⁺-ATPase</b> para; a membrana despolariza; canais de Ca²⁺ abrem; o neurônio libera <b>glutamato</b>, que ativa receptores NMDA e AMPA dos vizinhos — <b>excitotoxicidade</b>. O cálcio intracelular ativa proteases (calpaínas), fosfolipases, endonucleases e a NO-sintase, gerando <b>radicais livres</b>; a mitocôndria falha. Sódio e água entram: <b>edema citotóxico</b>. Depois, a quebra da barreira hematoencefálica soma <b>edema vasogênico</b>. A reperfusão salva a penumbra, mas pode gerar lesão de reperfusão e transformação hemorrágica.</p>
  <h3>Por que a necrose cerebral é liquefativa</h3>
  <p>Em quase todos os órgãos, o infarto produz <b>necrose coagulativa</b> (arquitetura preservada por dias). No encéfalo, rico em lipídios e pobre em estroma colágeno, as enzimas lisossomais dos neurônios e da micróglia/macrófagos <b>digerem o tecido</b>, que vira uma massa amolecida e depois uma cavidade cheia de líquido. O SNC não cicatriza com fibroblastos: o reparo é a <b>gliose</b> (astrócitos).</p>
  <div class="widget" data-w="relogio"></div>
  ${D.tbl(['Tempo','Macroscopia','Microscopia'],[
   ['0–12 h','nada visível','alterações sutis'],
   ['12–24 h','área pálida, amolecida, limites mal definidos','<b>neurônios vermelhos</b>: eosinofilia, núcleo picnótico'],
   ['1–3 dias','edema, amolecimento','<b>neutrófilos</b>'],
   ['3 dias–3 semanas','liquefação','<b>macrófagos</b> espumosos (fagocitam mielina), neovascularização'],
   ['semanas–meses','<b>cavidade</b> cística','<b>gliose</b> reativa na margem']])}
  ${D.integ('<p>No coração (${D.lk(4,"ICC chagásica")}), o infarto é coagulativo e cicatriza com fibrose; no cérebro, é liquefativo e termina em cavidade com gliose. Mesmo insulto (isquemia), tecidos diferentes, desfechos diferentes.</p>','Integração · Patologia')}
  <p><b>Infarto hemorrágico (vermelho)</b>: quando um êmbolo se fragmenta e o vaso reabre, o sangue extravasa pelos capilares lesados — por isso infartos cardioembólicos e pós-trombólise têm mais transformação hemorrágica. <b>Infarto pálido</b>: oclusão persistente, típica da trombose aterosclerótica.</p>`,
  qs:[
   {q:'A área de tecido cerebral isquêmico, sem função elétrica mas ainda viável, é chamada de:',
    o:['Núcleo do infarto','Penumbra isquêmica','Gliose','Encefalomalácia','Edema vasogênico'], a:1, d:['fisio','pato'], e:'Alvo da reperfusão.'},
   {q:'O tipo de necrose típico do infarto cerebral é:',
    o:['Coagulativa','Liquefativa','Caseosa','Gordurosa','Fibrinoide'], a:1, d:['pato'], e:'Enzimas + tecido rico em lipídios e pobre em estroma.'},
   {q:'Neurônios com citoplasma intensamente eosinofílico e núcleo picnótico aparecem após:',
    o:['Minutos','12–24 horas','1 semana','1 mês','1 ano'], a:1, d:['pato'], e:'“Neurônios vermelhos”.'}
  ]},
 /* S5 */
 {id:'s5', title:'AVC isquêmico: causas, imagem e tratamento', short:'AVC isquêmico', d:['clin','lab','farmaco'],
  quick: `
  <ul>
   <li><b>TOAST</b>: aterosclerose de grandes artérias, <b>cardioembolia</b> (FA), pequenos vasos (lacuna), outras (dissecção, trombofilia), indeterminada.</li>
   <li><b>TC sem contraste</b> primeiro: excluir hemorragia (na isquemia precoce costuma ser normal). Angio-TC para oclusão de grande vaso. RM difusão: mais sensível.</li>
   <li><b>Trombólise IV</b> até <b>4,5 h</b>: alteplase 0,9 mg/kg (10% em bolus) ou tenecteplase 0,25 mg/kg. PA &lt; 185/110 antes e &lt; 180/105 depois. Glicemia antes.</li>
   <li><b>Trombectomia</b> mecânica: oclusão de grande vaso, até 6 h (e até 24 h selecionados).</li>
   <li>Depois: AAS (24 h após trombólise), estatina de alta intensidade, <b>anticoagulação na FA</b>, controle de PA, cessar tabagismo.</li>
  </ul>`,
  deep: `
  ${D.fig('img/c9-slide-causas.jpg','Principais fontes do AVC isquêmico: aterosclerose intracraniana e carotídea (trombo/êmbolo artéria-artéria), placa no arco aórtico, doença de pequenas artérias penetrantes, êmbolo cardíaco (fibrilação atrial, doença valvar, trombo no VE).', SL)}
  <h3>Mecanismos</h3>
  ${D.tbl(['TOAST','Mecanismo','Pistas'],[
   ['Aterosclerose de grande artéria','placa carotídea/intracraniana → trombose ou êmbolo','estenose ≥ 50%, AIT de repetição no mesmo território, sopro carotídeo'],
   ['<b>Cardioembolia</b>','trombo no AE (FA), VE (IAM, cardiomiopatia), valvas','<b>FA</b>, início máximo súbito, vários territórios, transformação hemorrágica'],
   ['Pequenos vasos (lacunar)','lipo-hialinose das perfurantes (HAS, DM)','síndrome lacunar, lesão &lt; 1,5 cm'],
   ['Outras causas','dissecção, vasculite, trombofilia, anemia falciforme','jovens'],
   ['Indeterminada','—','investigação incompleta ou múltiplas causas']])}
  ${D.integ('<p><b>Fibrilação atrial</b>: o átrio não contrai, o sangue estagna na auriculeta esquerda e forma trombo. Estenose mitral (${D.lk(2,"Estenose mitral")}) e cardiopatia chagásica (${D.lk(4,"ICC chagásica")}) são grandes fontes embólicas. Investigar com <b>ECG</b> (ritmo irregularmente irregular, sem onda P), Holter, ecocardiograma. Prevenção: anticoagulante oral guiado pelo <b>CHA₂DS₂-VASc</b>.</p>','Integração · Cardiologia')}
  <h3>Imagem</h3>
  <p>A <b>TC sem contraste</b> é o primeiro exame porque é rápida e detecta sangue (hiperdenso) com alta sensibilidade. Na isquemia de poucas horas costuma ser <b>normal</b> — como no caso A — ou mostrar sinais sutis (artéria cerebral média hiperdensa = trombo; apagamento de sulcos; perda da diferenciação córtico-subcortical; escore ASPECTS). A <b>angio-TC</b> mostra a oclusão de grande vaso (candidato à trombectomia). A <b>RM com difusão</b> mostra o infarto em minutos.</p>
  <h3>Tratamento agudo</h3>
  <ol>
   <li>ABC, glicemia capilar (hipoglicemia imita AVC), acesso, monitorização, NIHSS, horário do <b>último momento visto bem</b>.</li>
   <li>TC (e angio-TC).</li>
   <li><b>Trombólise IV</b> se dentro de 4,5 h, sem hemorragia, sem contraindicações (cirurgia/sangramento recente, AVC/TCE grave em 3 meses, plaquetas &lt; 100 mil, anticoagulação plena com INR &gt; 1,7, PA não controlável). O fármaco converte plasminogênio em <b>plasmina</b>, que degrada a fibrina do trombo. Principal risco: <b>hemorragia</b> intracraniana (~6%).</li>
   <li><b>Trombectomia</b> se oclusão de grande vaso proximal.</li>
   <li>PA: no não trombolisado, tolerar até 220/120 (a penumbra depende da pressão); no trombolisado, &lt; 180/105.</li>
   <li>Unidade de AVC: posição, temperatura, glicemia, <b>avaliação da deglutição antes de dar comida</b> (pneumonia aspirativa — ${D.lk(6,'Pneumonia')}), profilaxia de TEV, mobilização precoce.</li>
  </ol>
  ${D.clin('<p><b>Caso A</b>: 2 h de evolução, TC sem sangue, PA 170×100 (&lt; 185/110) → <b>candidato à trombólise IV</b> se não houver contraindicações; angio-TC para avaliar trombectomia (afasia + hemiparesia sugerem oclusão proximal da ACM). Depois: ECG/Holter (FA?), eco, anticoagulação após o período agudo, estatina, cessar tabagismo.</p>')}`,
  qs:[
   {q:'Janela clássica para trombólise intravenosa no AVC isquêmico:',
    o:['1 h','4,5 h','12 h','24 h','72 h'], a:1, d:['clin','farmaco'], e:'Do último momento visto bem.'},
   {q:'Mecanismo de ação da alteplase:',
    o:['Inibe a agregação plaquetária','Converte plasminogênio em plasmina, que degrada fibrina','Inibe a trombina','Antagoniza a vitamina K','Bloqueia o receptor P2Y12'], a:1, d:['farmaco'], e:'Ativador do plasminogênio tecidual recombinante.'},
   {q:'Por que a TC de crânio do caso A pode ser normal mesmo com AVC isquêmico?',
    o:['Porque não houve AVC','Porque nas primeiras horas a isquemia ainda não altera a densidade do tecido de forma visível','Porque a TC só vê ossos','Porque foi feita com contraste','Porque o AVC é hemorrágico'], a:1, d:['lab'], e:'A TC serve para excluir sangramento.', img:'img/c9-slide-tc1.jpg'}
  ]},
 /* S6 */
 {id:'s6', title:'AVC hemorrágico: intraparenquimatoso e subaracnóideo', short:'AVC hemorrágico', d:['pato','clin','lab'],
  quick: `
  ${D.tbl(['','Hemorragia intraparenquimatosa (HIP)','Hemorragia subaracnóidea (HSA)'],[
   ['Causa principal','<b>HAS</b> (primária); idoso: <b>angiopatia amiloide</b> (lobar)','<b>aneurisma sacular</b> roto (Willis)'],
   ['Clínica','déficit focal progressivo, cefaleia, vômitos, rebaixamento','<b>cefaleia súbita explosiva</b>, rigidez de nuca, síncope'],
   ['Locais','<b>putâmen</b> &gt; tálamo &gt; ponte &gt; cerebelo &gt; lobar','cisternas da base'],
   ['Imagem','hematoma hiperdenso no parênquima','sangue nas cisternas e sulcos (Fisher)'],
   ['Conduta-chave','<b>PAS → ~140</b>, reverter anticoagulação, neurocirurgia em casos selecionados','tratar aneurisma (clipe/embolização), <b>nimodipina</b>, prevenir vasoespasmo']])}
  <p><b>Primária</b> (~80% das HIP): hipertensiva e angiopatia amiloide. <b>Secundária</b>: MAV, aneurisma, tumor, anticoagulantes/coagulopatia, cocaína/anfetaminas, transformação hemorrágica de infarto, trombose venosa.</p>`,
  deep: `
  ${D.fig('img/c9-slide-hemorragias.jpg','Hemorragias intracranianas: epidural (entre crânio e dura, arterial, lente biconvexa), subdural (entre dura e aracnoide, venosa, crescente), subaracnóidea (no espaço do líquor) e intraparenquimatosa.', SL)}
  <h3>Hemorragia intraparenquimatosa hipertensiva</h3>
  <p>A hipertensão crônica lesa as pequenas artérias perfurantes (lenticuloestriadas, talamoperfurantes, paramedianas da ponte): <b>lipo-hialinose</b> (deposição de material hialino, perda de músculo liso) e <b>microaneurismas de Charcot-Bouchard</b>. Num pico pressórico, a parede rompe e o sangue disseca o parênquima. Locais típicos, em ordem: <b>putâmen</b> (como no caso B), tálamo, ponte, cerebelo. O hematoma cresce nas primeiras horas (por isso baixar a PA cedo), comprime, gera edema e hipertensão intracraniana; pode abrir para os ventrículos.</p>
  ${D.fig('img/c9-hic.png','TC: hemorragia nos núcleos da base (asterisco) com halo de edema (setas). O hematoma agudo é hiperdenso porque a hemoglobina concentrada atenua mais os raios X.', WC)}
  <h3>Primária × secundária</h3>
  ${D.tbl(['Primária (~80%)','Secundária'],[
   ['<b>Hipertensiva</b>: profunda (núcleos da base, tálamo, ponte, cerebelo)','<b>MAV</b>, cavernomas (jovens)'],
   ['<b>Angiopatia amiloide</b>: depósito de β-amiloide em vasos corticais; hemorragias <b>lobares</b> recorrentes em idosos','<b>aneurisma</b> roto com hematoma'],
   ['','<b>anticoagulantes</b>/trombolíticos, coagulopatias, plaquetopenia'],
   ['','<b>cocaína</b>, anfetaminas (picos pressóricos, vasculite)'],
   ['','tumores, transformação hemorrágica de infarto, trombose venosa cerebral']])}
  <h3>Hemorragia subaracnóidea</h3>
  <p>~85% não traumáticas são por ruptura de <b>aneurisma sacular</b> (“em baga”), que se forma em bifurcações do polígono de Willis por fraqueza congênita da camada média somada a HAS e tabagismo (associação com rins policísticos e coarctação). Clínica: <b>cefaleia súbita, a pior da vida</b> (“em trovoada”), náuseas, vômitos, síncope, <b>rigidez de nuca</b>. TC sem contraste (sensível nas primeiras horas); se normal e suspeita alta, punção lombar (xantocromia). Complicações: ressangramento, <b>vasoespasmo</b> (dias 3–14, isquemia tardia — prevenido com <b>nimodipina</b>), hidrocefalia, hiponatremia. A <b>escala de Fisher</b> gradua o sangue na TC e prediz vasoespasmo.</p>
  ${D.fig('img/c9-hsa.jpg','TC na hemorragia subaracnóidea: sangue hiperdenso preenchendo as cisternas da base e fissuras.', WC)}
  <h3>Conduta na HIP (caso B)</h3>
  <ul>
   <li>Via aérea (rebaixamento), cabeceira a 30°, glicemia, temperatura.</li>
   <li><b>Reduzir a PAS para ~140 mmHg</b> (faixa 130–150) na primeira hora, com anti-hipertensivo IV titulável — limita a expansão do hematoma.</li>
   <li>Reverter anticoagulação, se houver (vitamina K + complexo protrombínico; antídotos específicos).</li>
   <li>Tratar hipertensão intracraniana; neurocirurgia em hematoma cerebelar &gt; 3 cm com compressão de tronco ou hidrocefalia; drenagem ventricular.</li>
   <li>Não usar trombolítico, antiagregante ou anticoagulante.</li>
  </ul>`,
  qs:[
   {q:'Local mais comum de hemorragia intraparenquimatosa hipertensiva:',
    o:['Lobo occipital','Putâmen','Corpo caloso','Bulbo','Hipocampo'], a:1, d:['pato'], e:'Lenticuloestriadas.'},
   {q:'Idoso normotenso com hemorragias lobares recorrentes. Causa provável:',
    o:['HAS','Angiopatia amiloide cerebral','Aneurisma sacular','MAV','Trauma'], a:1, d:['pato'], e:'β-amiloide em vasos corticais.'},
   {q:'Fármaco usado para prevenir isquemia por vasoespasmo após hemorragia subaracnóidea:',
    o:['Alteplase','Nimodipina','Heparina','Manitol de rotina','AAS'], a:1, d:['farmaco'], e:'Bloqueador de canal de cálcio.'}
  ]},
 /* S7 */
 {id:'s7', title:'Dor, terminações nervosas livres e hipertensão intracraniana', short:'Dor e HIC', d:['fisio','semio'],
  quick: `
  <ul>
   <li><b>Terminações nervosas livres</b> = nociceptores (fibras Aδ e C): pele, mucosas, periósteo, articulações, vísceras, <b>meninges (dura-máter)</b>, <b>vasos</b> (grandes artérias da base, seios venosos).</li>
   <li><b>O parênquima cerebral não tem nociceptores</b>: o AVC isquêmico costuma ser indolor; a cefaleia vem de tração/distensão das meninges e vasos.</li>
   <li>A dor da cabeça é conduzida pelo <b>trigêmeo</b> (supratentorial) e por C2–C3 e vago (fossa posterior).</li>
   <li><b>HIC</b> (Monro-Kellie): cefaleia, vômitos, rebaixamento, papiledema; <b>tríade de Cushing</b> (hipertensão, bradicardia, respiração irregular) = herniação iminente.</li>
  </ul>`,
  deep: `
  <h3>Onde estão as terminações nervosas livres</h3>
  <p>As <b>terminações nervosas livres</b> são os receptores mais simples: ramificações amielínicas (fibras <b>C</b>) ou pouco mielinizadas (<b>Aδ</b>) sem cápsula, que respondem a estímulos mecânicos intensos, térmicos e químicos (bradicinina, prostaglandinas, H⁺, K⁺, substância P). Estão na <b>epiderme e derme</b>, córnea, mucosas, <b>periósteo</b>, cápsulas articulares, tendões, músculos, vísceras e, na cabeça, na <b>dura-máter</b>, nos <b>seios venosos</b> e nas <b>grandes artérias</b> da base e meníngeas. O <b>tecido cerebral</b>, a pia-aracnoide da convexidade e o plexo coroide <b>não</b> têm nociceptores — neurocirurgiões operam o cérebro de pacientes acordados.</p>
  ${D.tbl(['Estrutura','Sensível à dor?'],[['Parênquima cerebral','<b>não</b>'],['Dura-máter, foice, tentório','sim'],['Seios venosos e veias de drenagem','sim'],['Artérias do polígono de Willis e meníngeas','sim'],['Couro cabeludo, músculos, periósteo','sim']])}
  <p><b>Aplicação</b>: o caso A (isquemia cortical) <b>não tem cefaleia</b> — a lesão ocorre em tecido insensível. O caso B tem <b>cefaleia intensa</b> porque o hematoma desloca e distende estruturas sensíveis (vasos, dura), o sangue que chega ao líquor irrita as meninges e a pressão intracraniana sobe. Na HSA, o sangue no espaço subaracnóideo produz cefaleia explosiva e sinais meníngeos.</p>
  ${D.integ('<p>Os nociceptores meníngeos supratentoriais são inervados pelo <b>trigêmeo (V1)</b>; a dor é referida na fronte e órbita. Na fossa posterior, por C2–C3: dor occipital e nucal. É a base anatômica também da enxaqueca (sistema trigeminovascular).</p>','Integração · Neuroanatomia')}
  <h3>Hipertensão intracraniana</h3>
  <p>Doutrina de <b>Monro-Kellie</b>: o crânio é rígido e contém parênquima, sangue e líquor. Um volume novo (hematoma, edema) é compensado deslocando líquor e sangue venoso; esgotada a complacência, a pressão sobe exponencialmente. A <b>pressão de perfusão cerebral = PAM − PIC</b>: se a PIC sobe, a perfusão cai. Sinais: cefaleia, <b>vômitos</b>, rebaixamento, papiledema, paralisia do VI par; <b>tríade de Cushing</b> (hipertensão com bradicardia e respiração irregular) e <b>anisocoria</b> (herniação do úncus comprimindo o III par) indicam herniação. No caso B, as pupilas ainda isocóricas são um bom sinal.</p>
  ${D.trap('<p>A PA de 210×120 no caso B é tanto causa (rompeu o vaso) quanto, em parte, resposta (reflexo de Cushing para manter perfusão). Por isso a redução deve ser <b>controlada</b> (PAS ~140), não abrupta.</p>')}`,

 {id:'s8', title:'Exame neurológico, NIHSS e prevenção', short:'Exame e prevenção', d:['semio','prev'],

  <h3>O exame neurológico no AVC</h3>

  <p>Exame complementar fora da NIHSS: força pela escala MRC, tônus, reflexos profundos (assimetria), <b>Babinski</b>, marcha, pares cranianos, sinais meníngeos (rigidez de nuca, Kernig, Brudzinski — positivos na HSA).</p>

  ${D.integ('<p><b>Humanística</b>: o AVC muda a vida da família. A comunicação de prognóstico, o planejamento de cuidados e o apoio ao cuidador fazem parte do tratamento; a afasia exige estratégias (frases curtas, perguntas fechadas, tempo para responder).</p>','Integração · Humanística')}`,

   a:'<p><b>Isquemia</b> é a redução do fluxo sanguíneo com oferta insuficiente de O₂ e glicose; a lesão celular é <b>reversível</b> se o fluxo for restaurado a tempo (penumbra; AIT). <b>Necrose</b> é a morte celular <b>irreversível</b>, com perda da integridade da membrana e reação inflamatória.</p><p>No encéfalo, a necrose é <b>liquefativa</b>: 12–24 h, neurônios vermelhos (citoplasma eosinofílico, núcleo picnótico); 1–3 dias, infiltrado de neutrófilos e edema; 3 dias a 3 semanas, macrófagos espumosos fagocitando mielina e neovascularização, com liquefação; semanas a meses, cavidade cística circundada por gliose (astrócitos) — sem fibrose. Infartos embólicos com reperfusão podem ser hemorrágicos.</p>',

D.W.rcucrohn = (w) => {
  const it=[['Começa no reto e se estende de forma contínua','r'],['Lesões salteadas (skip lesions)','c'],['Inflamação transmural','c'],['Restrita à mucosa','r'],['Granulomas não caseosos','c'],['Abscessos de cripta e depleção de mucina','r'],['Fístulas e estenoses','c'],['Pseudopólipos e perda de haustrações (cano de chumbo)','r'],['Aspecto em “pedra de calçamento” e úlceras serpiginosas','c'],['Pode acometer da boca ao ânus (íleo terminal é o mais típico)','c'],['Sangramento retal e tenesmo como queixa principal','r'],['Associação com colangite esclerosante primária e p-ANCA','r'],['ASCA positivo','c'],['Tabagismo é fator de risco (piora)','c'],['Tabagismo parece “proteger”','r'],['Doença perianal (fístulas, abscessos)','c']];
  let pool=it.map((x,i)=>i).sort(()=>Math.random()-0.5), k=0, ok=0;
  function paint(){
    if(k>=pool.length){ w.innerHTML=`<h4>RCU ou Crohn?</h4><p class="wsub">Resultado: <b>${ok}/${it.length}</b>.</p><button class="btn sm" data-r>Refazer</button>`; D.award('w:c10.dii', Math.round(ok*20/it.length), 'DII diferenciada'); w.querySelector('[data-r]').onclick=()=>{pool=it.map((x,i)=>i).sort(()=>Math.random()-0.5);k=0;ok=0;paint();}; return; }
    const c=it[pool[k]];
    w.innerHTML=`<h4>RCU ou Crohn?</h4><p class="wsub">Característica ${k+1}/${it.length}</p><p style="font-size:17px;background:var(--paper);padding:12px;border-radius:8px">${c[0]}</p><div style="display:flex;gap:8px"><button class="btn" data-q="r" style="flex:1;justify-content:center">Retocolite ulcerativa</button><button class="btn" data-q="c" style="flex:1;justify-content:center">Doença de Crohn</button></div><div class="fb" style="margin-top:8px;font-size:14.5px;min-height:22px"></div>`;
    w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ if(w.dataset.l) return; w.dataset.l=1; const r=b.dataset.q===c[1]; if(r) ok++; b.style.background=r?'var(--green-soft)':'var(--red-soft)'; w.querySelector('.fb').innerHTML=`<b style="color:${r?'var(--green)':'var(--red)'}">${r?'Certo':'É '+(c[1]==='r'?'RCU':'Crohn')}.</b>`; setTimeout(()=>{ delete w.dataset.l; k++; paint(); }, r?650:1400); });
  }
  paint();
};
D.W.truelove = (w) => {
  const inp=(id,l,v,st)=>`<label style="font-size:14px">${l}<input id="${id}" type="number" step="${st}" value="${v}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink)"></label>`;
  w.innerHTML=`<h4>Gravidade da RCU: Truelove e Witts</h4><p class="wsub">Carregado com os dados da paciente.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">${inp('tw_e','Evacuações com sangue/dia',7,1)}${inp('tw_t','Temperatura (°C)',36.5,0.1)}${inp('tw_f','FC (bpm)',87,1)}${inp('tw_h','Hb (g/dL)',10.5,0.1)}${inp('tw_v','VHS (mm/h)',35,1)}</div>
  <div data-o style="margin-top:12px;padding:12px;border-radius:8px;background:var(--paper-2);font-size:15px"></div>`;
  const g=id=>+w.querySelector('#'+id).value; let n=0;
  function calc(){
    const e=g('tw_e'), sis=[g('tw_t')>37.8&&'febre > 37,8 °C', g('tw_f')>90&&'FC > 90', g('tw_h')<10.5&&'Hb < 10,5', g('tw_v')>30&&'VHS > 30'].filter(Boolean);
    let r;
    if(e>=6 && sis.length>=1) r=`<b style="color:var(--red);font-size:18px">GRAVE</b> — ≥ 6 evacuações com sangue + ${sis.join(', ')}. Internação, corticoide IV, profilaxia de TEV, excluir infecção (C. difficile, CMV), avaliar resgate.`;
    else if(e<4 && sis.length===0) r=`<b style="color:var(--green);font-size:18px">LEVE</b> — &lt; 4 evacuações, sem toxicidade sistêmica. Mesalazina oral + tópica.`;
    else r=`<b style="color:var(--amber);font-size:18px">MODERADA</b> — entre leve e grave. Mesalazina em dose plena; corticoide oral se não responder.`;
    w.querySelector('[data-o]').innerHTML=r+`<br><span style="font-size:13.5px;color:var(--ink-dim)">A paciente: 6–8 evacuações com sangue e <b>VHS 35</b> preenchem o critério de grave, mesmo afebril e com FC normal (Hb 10,5 está no limite). Na prática, a avaliação global e a endoscopia (Mayo) complementam.</span>`;
    n++; if(n>3) D.award('w:c10.tw',10,'gravidade classificada');
  }
  w.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc)); calc();
};

  <h3>A parede em quatro camadas</h3>
  ${D.svg(svgCamadas,'Mucosa, submucosa, muscular própria e serosa.')}
  <ol>
   <li><b>Mucosa</b>: epitélio, <b>lâmina própria</b> (tecido conjuntivo frouxo com linfócitos, plasmócitos, macrófagos — o maior órgão imune do corpo, o GALT) e <b>muscular da mucosa</b>.</li>
   <li><b>Submucosa</b>: vasos, linfáticos, glândulas de Brunner (duodeno), <b>plexo de Meissner</b> (secreção).</li>
   <li><b>Muscular própria</b>: circular interna e longitudinal externa, com o <b>plexo de Auerbach</b> (motilidade) entre elas.</li>
   <li><b>Serosa</b> (peritônio visceral) ou adventícia nas porções retroperitoneais.</li>
  </ol>
  <h3>Delgado × cólon</h3>
  <p>O <b>delgado</b> multiplica sua superfície com pregas circulares, <b>vilosidades</b> e <b>microvilosidades</b> (borda em escova com dissacaridases). Nas criptas estão as <b>células-tronco</b> (renovação do epitélio a cada 3–5 dias), as <b>células de Paneth</b> (defensinas, lisozima) e as enteroendócrinas. O <b>cólon</b> não tem vilosidades: a mucosa é plana, com <b>criptas retas, paralelas, “em tubo de ensaio”</b>, ricas em <b>células caliciformes</b> (muco protetor); absorve água e sódio e abriga a microbiota que fermenta fibras em ácidos graxos de cadeia curta (o <b>butirato</b> é o combustível do colonócito).</p>
  ${D.fig('img/c10-rcu-he.jpg','Mucosa colônica na RCU ativa (HE, aumento intermediário): criptas distorcidas e ramificadas (o normal seria retas e paralelas), lâmina própria cheia de células inflamatórias.', WC)}
  <h3>Anatomia e irrigação</h3>
  <p>Ceco, cólon ascendente, transverso, descendente, sigmoide e reto. Irrigação: <b>artéria mesentérica superior</b> (ileocólica, cólica direita, cólica média) até ~⅔ do transverso; <b>mesentérica inferior</b> (cólica esquerda, sigmóideas, retal superior) daí em diante; o reto médio e inferior recebem ramos das ilíacas internas. As áreas de transição (<b>flexura esplênica</b> — ponto de Griffiths; junção retossigmoide) são vulneráveis à <b>colite isquêmica</b>.</p>
  ${D.integ('<p>Ferro absorvido no <b>duodeno</b>, B12 no <b>íleo terminal</b>, ácidos biliares no íleo. A RCU poupa o delgado (anemia por perda de sangue); o Crohn ileal causa deficiência de B12 e de sais biliares (${D.lk(7,"anemia megaloblástica")}).</p>','Integração')}`,

 {id:'s3', title:'Fisiopatologia da doença inflamatória intestinal', short:'Fisiopatologia', d:['imuno','fisio'],
  quick: `
  <ul>
   <li>DII = resposta imune <b>desregulada</b> contra a microbiota intestinal em hospedeiro <b>geneticamente suscetível</b>, com <b>barreira epitelial</b> defeituosa e gatilhos ambientais.</li>
   <li><b>Crohn</b>: Th1/Th17 (IFN-γ, IL-12, IL-23, IL-17), <b>NOD2</b>, autofagia; granulomas.</li>
   <li><b>RCU</b>: resposta tipo <b>Th2 atípica</b> (IL-13 de células NKT), dano epitelial, muco reduzido.</li>
   <li>Ambiente: tabagismo piora Crohn e “protege” RCU; antibióticos precoces, dieta ocidental, urbanização.</li>
  </ul>`,
  deep: `
  <h3>Um equilíbrio rompido</h3>
  <p>O intestino convive com ~10¹⁴ bactérias graças a uma barreira (muco, junções de oclusão, defensinas, IgA secretora) e a uma imunidade <b>tolerante</b> (células T regulatórias, IL-10, TGF-β). Na DII, essa tolerância falha: a resposta contra antígenos da microbiota se perpetua e lesa o próprio tecido.</p>
  ${D.tbl(['','Crohn','RCU'],[
   ['Genética','<b>NOD2/CARD15</b> (sensor de peptidoglicano), ATG16L1/IRGM (autofagia), IL23R','HLA, genes da barreira epitelial; IL23R também'],
   ['Resposta','<b>Th1 e Th17</b>: IFN-γ, TNF, IL-12/23, IL-17 → granulomas, transmural','<b>Th2 atípica</b>: IL-13 de células NKT → lesão epitelial, superficial'],
   ['Barreira','defeito de defensinas (Paneth, íleo)','muco mais fino, menos butirato'],
   ['Tabagismo','<b>piora</b>','paradoxalmente <b>reduz o risco</b> (não recomendado!)'],
   ['Apendicectomia','—','reduz o risco']])}
  ${D.integ('<p>Os <b>anticorpos</b> são marcadores, não causa: <b>p-ANCA</b> (padrão perinuclear de anticorpos anticitoplasma de neutrófilo) em ~60–70% das RCU e só ~10–20% dos Crohn; <b>ASCA</b> (anti-<i>Saccharomyces cerevisiae</i>) em ~50–60% dos Crohn. Atenção: há resumos que invertem — <b>p-ANCA = RCU, ASCA = Crohn</b>.</p>','Integração · Imunologia')}
  <h3>Por que sangra</h3>
  <p>Na RCU, neutrófilos invadem o epitélio das criptas (<b>criptite</b>) e se acumulam na luz delas (<b>abscessos de cripta</b>); as criptas se rompem, a mucosa ulcera e a lâmina própria, rica em capilares, fica exposta: sangue, muco e exsudato nas fezes. O reto inflamado perde complacência: <b>urgência e tenesmo</b>. A perda crônica de sangue esgota o ferro.</p>`,

  deep: `
  ${D.fig('img/c10-rcu-endo.jpg','Colonoscopia na RCU: mucosa eritematosa, friável, sem padrão vascular, com erosões e exsudato — de forma contínua.', WC)}
  ${D.fig('img/c10-rcu-macro.jpg','Peça de colectomia na RCU crônica: inúmeros pseudopólipos (ilhas de mucosa regenerada entre áreas ulceradas).', WC)}
  <h3>RCU: doença da mucosa, contínua, que começa no reto</h3>
  <p>A RCU sempre envolve o <b>reto</b> e se estende para proximal sem áreas poupadas (proctite → colite esquerda → pancolite; classificação de Montreal E1–E3). Na fase ativa, a mucosa é eritematosa, granular, friável (sangra ao toque), com úlceras rasas; com a cronicidade, formam-se <b>pseudopólipos</b>, perdem-se as haustrações e o cólon fica encurtado e tubular (“<b>cano de chumbo</b>” no enema baritado). Como a inflamação é superficial, não há fístulas nem estenoses relevantes (uma estenose na RCU deve levantar suspeita de câncer).</p>
  ${D.fig('img/c10-rcu-he2.jpg','RCU ativa (HE, maior aumento): neutrófilos invadindo o epitélio das criptas (criptite) e acumulados na luz (abscessos de cripta), depleção de mucina, plasmócitos na lâmina própria.', WC)}
  <p>Na histologia, a chave da <b>cronicidade</b> (o que separa DII de colite infecciosa aguda) é a <b>distorção arquitetural das criptas</b> (ramificadas, encurtadas, irregulares) e a <b>plasmocitose basal</b>; a <b>atividade</b> é dada pelos neutrófilos (criptite, abscessos de cripta). A inflamação crônica com ciclos de lesão e regeneração leva à <b>displasia</b> e ao <b>adenocarcinoma</b>.</p>
  <h3>Crohn: transmural e salteado</h3>
  <p>A inflamação atravessa toda a parede: fissuras profundas viram <b>fístulas</b> (enteroentéricas, enterovesicais, perianais) e <b>abscessos</b>; a fibrose leva a <b>estenoses</b> (sinal do barbante no trânsito). Mucosa em <b>pedra de calçamento</b> (úlceras lineares entrecruzando mucosa edemaciada), <b>gordura mesentérica envolvendo a alça</b> (“creeping fat”), <b>granulomas não caseosos</b> (em ~30–40% das biópsias).</p>
  <div class="widget" data-w="rcucrohn"></div>`,
  qs:[
   {q:'Achado histológico que indica atividade da RCU:',
    o:['Granuloma não caseoso','Abscesso de cripta','Fibrose transmural','Cariorrexe em vilos','Metaplasia de Paneth isolada'], a:1, d:['pato'], e:'Neutrófilos na luz das criptas.'},
   {q:'Doença inflamatória intestinal com fístulas perianais e lesões salteadas no íleo terminal:',
    o:['RCU','Crohn','Colite isquêmica','Colite pseudomembranosa','Diverticulite'], a:1, d:['pato'], e:'Transmural e salteada.'},
   {q:'Ilhas de mucosa regenerada entre áreas ulceradas na peça de colectomia:',
    o:['Pólipos adenomatosos','Pseudopólipos inflamatórios','Pólipos hiperplásicos','Lipomas','Divertículos'], a:1, d:['pato'], e:'Típicos da RCU crônica.', img:'img/c10-rcu-macro.jpg'}
  ]},
 /* S5 */
 {id:'s5', title:'Exame físico do abdome', short:'Exame do abdome', d:['semio','prope'],
  quick: `
  <p><b>Sequência</b>: inspeção → <b>ausculta</b> → percussão → palpação (a palpação antes da ausculta altera os ruídos).</p>
  <ul>
   <li><b>Inspeção</b>: forma (plano, globoso, escavado), cicatrizes, <b>cicatriz umbilical</b> (protrusa = hérnia), circulação colateral, abaulamentos, peristaltismo visível.</li>
   <li><b>Ausculta</b>: RHA (normais, aumentados na diarreia/obstrução inicial, abolidos no íleo); sopros vasculares.</li>
   <li><b>Percussão</b>: timpanismo (gás) × macicez (víscera, líquido); hepatimetria; Traube; <b>macicez móvel</b> e piparote (ascite).</li>
   <li><b>Palpação</b>: superficial (dor, tensão), profunda (massas, órgãos), fígado e baço; sinais: <b>Blumberg</b>, Rovsing, Murphy, Giordano.</li>
  </ul>`,
  deep: `
  <h3>Divisão do abdome</h3>
  <p>Em <b>quatro quadrantes</b> (linhas mediana e umbilical) ou <b>nove regiões</b> (hipocôndrios, epigástrio, flancos, mesogástrio/umbilical, fossas ilíacas, hipogástrio). O cólon descendente e o sigmoide projetam-se no flanco e fossa ilíaca esquerdos; o ceco na fossa ilíaca direita.</p>
  <h3>Técnica</h3>
  <ol>
   <li><b>Preparo</b>: paciente em decúbito dorsal, braços ao lado do corpo, joelhos levemente fletidos se necessário, bexiga vazia, examinador à direita, mãos aquecidas, começar longe da área dolorosa.</li>
   <li><b>Inspeção estática e dinâmica</b>: forma, simetria, pele, cicatrizes, umbigo, veias, hérnias (pedir para tossir ou elevar a cabeça — manobra de Valsalva), movimentos peristálticos visíveis (obstrução).</li>
   <li><b>Ausculta</b> antes de tocar: ruídos hidroaéreos (ouvir ao menos 1 min; ausentes só após 2–3 min), sopros (aorta, renais, ilíacas).</li>
   <li><b>Percussão</b> nos quadrantes; limites hepáticos (hepatimetria na linha hemiclavicular, 6–12 cm); espaço de Traube (timpânico; maciço na esplenomegalia); ascite: macicez de flancos, <b>macicez móvel</b>, sinal do piparote.</li>
   <li><b>Palpação superficial</b> (sensibilidade, defesa, hiperestesia) e <b>profunda</b> (massas: localização, tamanho, consistência, mobilidade, pulsação); fígado (mão em garra/Mathieu, borda), baço (Schuster).</li>
  </ol>
  ${D.tbl(['Sinal','Como','Significado'],[
   ['<b>Blumberg</b>','dor à descompressão brusca no ponto de McBurney','irritação peritoneal (apendicite)'],
   ['Descompressão dolorosa difusa','idem em qualquer ponto','peritonite'],
   ['Rovsing','compressão da FIE causa dor na FID','apendicite'],
   ['Murphy','interrupção da inspiração à palpação do ponto cístico','colecistite'],
   ['Giordano','punho-percussão lombar dolorosa','pielonefrite, cálculo'],
   ['Piparote / macicez móvel','onda líquida / mudança da macicez com decúbito','ascite']])}
  ${D.clin('<p><b>A paciente</b>: abdome plano, flácido, <b>cicatriz umbilical protrusa</b> (pequena hérnia umbilical ou variação anatômica — examinar com Valsalva), sem circulação colateral, RHA presentes, timpânico, sem ascite, <b>indolor</b>, sem massas ou visceromegalias. Um exame normal não exclui RCU; distensão, timpanismo aumentado, RHA abolidos e dor/defesa sugeririam <b>megacólon tóxico</b> ou perfuração. O <b>toque retal</b> (sangue, muco, dor, massas) faz parte da avaliação de sangramento retal.</p>')}`,
  qs:[
   {q:'Sequência correta do exame físico do abdome:',
    o:['Inspeção, palpação, percussão, ausculta','Inspeção, ausculta, percussão, palpação','Ausculta, inspeção, palpação, percussão','Palpação, inspeção, ausculta, percussão','Percussão, palpação, ausculta, inspeção'], a:1, d:['semio'], e:'Palpar antes altera os ruídos.'},
   {q:'Dor à descompressão brusca no ponto de McBurney:',
    o:['Sinal de Murphy','Sinal de Blumberg','Sinal de Giordano','Sinal de Rovsing','Sinal de Cullen'], a:1, d:['semio'], e:'Irritação peritoneal.'},
   {q:'Mudança da área de macicez ao mudar o decúbito indica:',
    o:['Esplenomegalia','Ascite','Hepatomegalia','Bexigoma','Meteorismo'], a:1, d:['semio','prope'], e:'Macicez móvel.'}
  ]},
 /* S6 */
 {id:'s6', title:'O ferro e a hematopoese', short:'Ferro', d:['fisio','lab'],
  quick: `
  ${D.svg(svgFerro,'Absorção, transporte, uso, reciclagem e estoque do ferro.')}
  <ul>
   <li>Ferro é essencial para o <b>heme</b> (Hb, mioglobina, citocromos, catalase) e enzimas Fe-S (cadeia respiratória, ribonucleotídeo redutase → síntese de DNA).</li>
   <li>Absorção no <b>duodeno</b>: Fe³⁺ → Fe²⁺ (Dcytb), entra por <b>DMT1</b>, sai por <b>ferroportina</b>; viaja na <b>transferrina</b>; estoca em <b>ferritina</b>.</li>
   <li><b>Hepcidina</b> (fígado) degrada a ferroportina; sobe na inflamação (IL-6) e com ferro alto.</li>
   <li>Na RCU: perda de sangue (<b>ferropriva</b>) + inflamação (<b>doença crônica</b>) → anemia mista. Ferro <b>IV</b> preferido na doença ativa.</li>
  </ul>`,
  deep: `
  <h3>Para que serve o ferro</h3>
  <p>O ferro alterna entre Fe²⁺ e Fe³⁺, o que permite transportar O₂ (Fe²⁺ do <b>heme</b> na hemoglobina e mioglobina) e transferir elétrons (<b>citocromos</b> da cadeia respiratória, CYP450). Também está em centros ferro-enxofre e na <b>ribonucleotídeo redutase</b>, necessária para a síntese de DNA. Cerca de 70% dos 3–4 g de ferro corporal estão na hemoglobina.</p>
  ${D.svg(svgFerro,'O ferro circula num sistema quase fechado: a medula usa ~20–25 mg/dia, quase todos reciclados pelos macrófagos; a dieta repõe apenas 1–2 mg/dia — por isso perdas crônicas de sangue esgotam o estoque.')}
  <h3>Da hemácia ao heme</h3>
  <p>O eritroblasto capta ferro-transferrina pelo <b>receptor de transferrina</b> (endocitose). Na mitocôndria, a <b>ferroquelatase</b> insere o Fe²⁺ na protoporfirina IX formando o <b>heme</b>, que se une às globinas. Sem ferro: menos hemoglobina, divisões extras do precursor, hemácias <b>microcíticas e hipocrômicas</b>; a protoporfirina livre (zinco-protoporfirina) aumenta.</p>
  <h3>Regulação: hepcidina</h3>
  <p>Não existe via de excreção regulada de ferro; o controle é na <b>absorção</b>. A <b>hepcidina</b>, produzida pelo fígado, liga-se à <b>ferroportina</b> e a degrada: o ferro fica preso no enterócito (que descama) e no macrófago. Ela sobe com ferro alto e com <b>inflamação (IL-6)</b>, e cai com anemia, hipóxia e eritropoese ativa.</p>
  <h3>Na paciente</h3>
  <p>Anemia <b>microcítica e hipocrômica</b> (VCM 70, HCM 25), <b>ferro sérico baixo</b>, <b>plaquetose</b> reativa: <b>ferropriva</b> por perda de sangue intestinal crônica. A inflamação ativa (PCR, VHS) soma um componente de <b>anemia de doença crônica</b> e reduz a absorção oral (hepcidina alta). Para separar: <b>ferritina</b> (&lt; 30 sem inflamação, &lt; 100 com inflamação sugere ferropenia), <b>saturação de transferrina</b> (&lt; 20%), TIBC.</p>
  ${D.pearl('<p>Na DII ativa, o ferro <b>intravenoso</b> (carboximaltose, sacarato) é preferido: o oral é mal absorvido (hepcidina alta), irrita a mucosa inflamada e piora os sintomas. Tratar a inflamação também melhora a anemia.</p>')}
  ${D.integ('<p>Compare com o ${D.lk(7,"Hemograma")}: lá, anemia macrocítica por carência de folato/B12 e má absorção; aqui, microcítica por perda de sangue + inflamação. O VCM aponta o caminho.</p>','Integração · Hematologia')}`,
  qs:[
   {q:'Proteína que exporta ferro do enterócito e do macrófago para o plasma, alvo da hepcidina:',
    o:['DMT1','Ferroportina','Transferrina','Ferritina','Hemossiderina'], a:1, d:['fisio'], e:'Hepcidina a degrada.'},
   {q:'Ferritina de 60 ng/mL numa paciente com RCU ativa e PCR alta:',
    o:['Exclui ferropenia','Não exclui ferropenia, pois a ferritina sobe na inflamação','Indica sobrecarga de ferro','Indica talassemia','Indica deficiência de B12'], a:1, d:['lab'], e:'Com inflamação, corte ~100.'},
   {q:'Por que o ferro IV é preferido na DII ativa?',
    o:['É mais barato','A absorção oral está reduzida pela hepcidina e o ferro oral irrita a mucosa','O oral causa hipercalemia','O IV não causa reação','O oral é contraindicado em mulheres'], a:1, d:['farmaco','clin'], e:'Eficácia e tolerância.'}
  ]},
 /* S7 */
 {id:'s7', title:'Diagnóstico e gravidade', short:'Diagnóstico', d:['lab','clin'],
  quick: `
  <ul>
   <li>Diagnóstico = clínica + <b>colonoscopia com biópsias</b> (padrão-ouro) + exclusão de infecção.</li>
   <li>Laboratório: hemograma, PCR/VHS, albumina, ferro/ferritina, <b>calprotectina fecal</b> (inflamação intestinal; ajuda a separar de SII), coprocultura, toxina de C. difficile, parasitológico.</li>
   <li>Sorologia: <b>p-ANCA</b> (RCU), ASCA (Crohn) — apoio, não diagnóstico.</li>
   <li>Extensão (Montreal): E1 proctite, E2 colite esquerda, E3 pancolite. Gravidade: <b>Truelove-Witts</b>, Mayo.</li>
  </ul>
  <div class="widget" data-w="truelove"></div>`,
  deep: `
  <h3>Exames</h3>
  ${D.tbl(['Exame','O que mostra'],[
   ['Hemograma','anemia (ferropriva/doença crônica), leucocitose, <b>plaquetose</b>'],
   ['PCR, VHS','atividade inflamatória (PCR sobe menos na RCU que no Crohn)'],
   ['Albumina','gravidade, desnutrição'],
   ['<b>Calprotectina fecal</b>','proteína de neutrófilos nas fezes: inflamação intestinal (alta na DII, normal na SII); acompanha resposta ao tratamento'],
   ['Coprocultura, toxina de <b>C. difficile</b>, parasitológico','excluir infecção (e infecção sobreposta em surto)'],
   ['p-ANCA / ASCA','apoio diagnóstico (sensibilidade moderada)'],
   ['<b>Colonoscopia + biópsias</b>','extensão, gravidade (Mayo endoscópico), histologia (cronicidade), rastreio de displasia'],
   ['Raio-X de abdome','na colite grave: dilatação do cólon (megacólon tóxico &gt; 6 cm)']])}
  <h3>Gravidade</h3>
  <div class="widget" data-w="truelove"></div>
  <p>Os critérios de <b>Truelove e Witts</b> classificam a crise em leve, moderada ou grave. Grave: ≥ 6 evacuações com sangue por dia + pelo menos um sinal de toxicidade (FC &gt; 90, T &gt; 37,8 °C, Hb &lt; 10,5, VHS &gt; 30). O <b>escore de Mayo</b> combina frequência, sangramento, aspecto endoscópico e avaliação médica (0–12).</p>
  ${D.clin('<p>A paciente preenche critério de <b>colite grave</b> por Truelove-Witts (≥ 6 evacuações com sangue + VHS 35), embora clinicamente estável. Isso pede avaliação cuidadosa (internação para corticoide IV se a crise se confirmar), rastreio de infecção e colonoscopia/retossigmoidoscopia com cautela (na colite grave, preferir retossigmoidoscopia sem preparo agressivo, pelo risco de perfuração).</p>')}`,
  qs:[
   {q:'Exame não invasivo que ajuda a diferenciar DII de síndrome do intestino irritável:',
    o:['p-ANCA','Calprotectina fecal','Sangue oculto','Amilase','TSH'], a:1, d:['lab'], e:'Marcador de inflamação intestinal.'},
   {q:'Exame padrão-ouro para o diagnóstico de RCU:',
    o:['Tomografia','Colonoscopia com biópsias','p-ANCA','Enema opaco','Calprotectina'], a:1, d:['lab'], e:'Extensão + histologia.'},
   {q:'Pelos critérios de Truelove-Witts, a crise é grave quando há ≥ 6 evacuações com sangue e:',
    o:['Dor abdominal','Pelo menos um sinal sistêmico (FC > 90, T > 37,8, Hb < 10,5 ou VHS > 30)','Tenesmo','Muco','Perda de peso'], a:1, d:['clin'], e:'Toxicidade sistêmica.'}
  ]},
 /* S8 */
 {id:'s8', title:'Tratamento, complicações e manifestações extraintestinais', short:'Tratamento', d:['farmaco','clin','prev'],
  quick: `
  ${D.tbl(['Gravidade/fase','Tratamento'],[
   ['Leve a moderada','<b>mesalazina (5-ASA)</b> oral + <b>tópica</b> (supositório/enema); indução e manutenção'],
   ['Moderada sem resposta','<b>corticoide</b> oral (só indução, nunca manutenção)'],
   ['Corticodependente/refratária','<b>tiopurinas</b> (azatioprina), <b>biológicos</b> (anti-TNF: infliximabe, adalimumabe; vedolizumabe; ustequinumabe), <b>inibidores de JAK</b> (tofacitinibe)'],
   ['Grave','internação, <b>corticoide IV</b>, profilaxia de TEV, resgate (infliximabe/ciclosporina), <b>colectomia</b>']])}
  <ul>
   <li>Complicações: <b>megacólon tóxico</b>, perfuração, hemorragia, <b>câncer colorretal</b> (colonoscopia de vigilância a partir de 8 anos de doença extensa).</li>
   <li>Extraintestinais: <b>eritema nodoso</b>, <b>pioderma gangrenoso</b>, artrite/espondilite, uveíte/episclerite, <b>colangite esclerosante primária</b> (RCU, p-ANCA).</li>
  </ul>`,
  deep: `
  <h3>Farmacologia</h3>
  ${D.tbl(['Classe','Mecanismo','Observações'],[
   ['<b>Aminossalicilatos</b> (mesalazina; sulfassalazina = sulfapiridina + 5-ASA, liberada por bactérias do cólon)','ação <b>tópica</b> na mucosa: inibe COX/LOX, NF-κB, ativa PPAR-γ, sequestra radicais','base da RCU leve-moderada; formulações orais pH/tempo-dependentes; supositório (reto) e enema (até flexura esplênica); sulfassalazina: oligospermia, deficiência de folato'],
   ['<b>Corticoides</b> (prednisona, budesonida MMX, hidrocortisona IV)','inibem transcrição de citocinas (NF-κB, AP-1)','<b>indução</b>; não mantêm remissão; efeitos: osteoporose, diabetes, infecção, catarata'],
   ['<b>Tiopurinas</b> (azatioprina, 6-MP)','antimetabólitos das purinas → apoptose de linfócitos T','início lento (3 meses); dosar <b>TPMT</b> (mielotoxicidade); pancreatite, linfoma'],
   ['<b>Anti-TNF</b> (infliximabe, adalimumabe, golimumabe)','anticorpos que neutralizam TNF-α','rastrear <b>TB latente</b> e hepatite B antes; infecções'],
   ['<b>Vedolizumabe</b>','anti-integrina α4β7: impede linfócitos de migrarem para o intestino','seletivo para o intestino'],
   ['<b>Ustequinumabe</b>','anti-p40 (IL-12/IL-23)','—'],
   ['<b>Inibidores de JAK</b> (tofacitinibe, upadacitinibe)','bloqueiam sinalização de várias citocinas','oral; risco de herpes-zóster, trombose']])}
  ${D.integ('<p>Antes de imunossupressão, atualizar <b>vacinas</b> — vivas atenuadas são contraindicadas sob imunossupressão importante (${D.lk(1,"Vacinação")}) — e rastrear tuberculose latente e hepatites.</p>','Integração · Prevenção')}
  <h3>Complicações</h3>
  ${D.fig('img/c10-megacolon.jpg','Megacólon tóxico na RCU: cólon transverso muito dilatado, sem haustrações. Inflamação transmural na colite grave paralisa a musculatura — risco de perfuração.', WC)}
  <ul>
   <li><b>Megacólon tóxico</b>: dilatação (&gt; 6 cm) + toxicidade sistêmica; desencadeado por hipocalemia, opioides, antidiarreicos, colonoscopia. Emergência: jejum, sonda, corticoide IV, antibiótico, cirurgia se não melhora em 24–72 h ou perfura.</li>
   <li><b>Câncer colorretal</b>: risco proporcional à <b>extensão</b> e à <b>duração</b>; colonoscopia de vigilância a cada 1–3 anos a partir de <b>8 anos</b> de pancolite ou colite esquerda (imediatamente se houver colangite esclerosante).</li>
   <li>Hemorragia maciça, perfuração, trombose venosa (DII ativa é estado pró-trombótico → profilaxia de TEV na internação).</li>
  </ul>
  <h3>Manifestações extraintestinais</h3>
  ${D.fig('img/c10-eritema-nodoso.jpg','Eritema nodoso: nódulos subcutâneos dolorosos, avermelhados, na face anterior das pernas (paniculite septal); acompanha a atividade intestinal.', WC)}
  ${D.fig('img/c10-pioderma.jpg','Pioderma gangrenoso: úlceras dolorosas de bordas violáceas e solapadas; pode surgir no local de trauma (patergia); curso independente da atividade intestinal.', WC)}
  ${D.tbl(['Acompanha a atividade intestinal','Independente da atividade'],[
   ['eritema nodoso, artrite periférica de grandes articulações, episclerite, aftas orais','pioderma gangrenoso (parcial), espondilite anquilosante/sacroileíte, uveíte, <b>colangite esclerosante primária</b>']])}
  ${D.extra('<p><b>Colangite esclerosante primária</b>: inflamação e fibrose dos ductos biliares (“contas de rosário” na colangiorressonância); ~70% dos pacientes têm DII, quase sempre RCU; p-ANCA frequente; aumenta risco de colangiocarcinoma e de câncer colorretal.</p>')}
  ${D.clin('<p><b>Plano para a paciente</b>: confirmar com colonoscopia/biópsias e excluir infecção; pela gravidade (Truelove-Witts), avaliar internação e corticoide IV, ou, se estável e moderada, mesalazina oral + tópica em dose plena ± corticoide oral; <b>ferro IV</b>; hidratação; vacinas e rastreios antes de imunossupressão; seguimento com calprotectina e colonoscopia.</p>')}`,
  qs:[
   {q:'Fármaco de primeira linha para indução e manutenção da RCU leve a moderada:',
    o:['Infliximabe','Mesalazina','Prednisona contínua','Azatioprina','Metronidazol'], a:1, d:['farmaco'], e:'5-ASA tópico na mucosa.'},
   {q:'Antes de iniciar anti-TNF, é obrigatório rastrear:',
    o:['Deficiência de G6PD','Tuberculose latente e hepatite B','Doença celíaca','Hipotireoidismo','Lúpus'], a:1, d:['farmaco','prev'], e:'Reativação de infecções.'},
   {q:'Úlceras cutâneas dolorosas de bordas violáceas, solapadas, em paciente com RCU:',
    o:['Eritema nodoso','Pioderma gangrenoso','Psoríase','Herpes-zóster','Vasculite leucocitoclástica'], a:1, d:['semio','clin'], e:'Dermatose neutrofílica.', img:'img/c10-pioderma.jpg'}
  ]}
 ],
 quiz:[
  {q:'Mulher de 25 anos, diarreia sanguinolenta há 3 meses, tenesmo, colonoscopia com inflamação contínua desde o reto até o sigmoide. Diagnóstico mais provável:',
   o:['Crohn','Retocolite ulcerativa (colite esquerda)','Colite isquêmica','Síndrome do intestino irritável','Câncer de reto'], a:1, d:['clin'], e:'Contínua a partir do reto.'},
  {q:'Granulomas não caseosos na biópsia de paciente com DII sugerem:',
   o:['RCU','Crohn','Infecção por Shigella','Colite actínica','Tuberculose sempre'], a:1, d:['pato'], e:'Resposta Th1.'},
  {q:'Na RCU, a doença acomete:',

 dq:[
  {q:'Compare a retocolite ulcerativa e a doença de Crohn quanto à localização, profundidade, achados anatomopatológicos e complicações.',
   a:'<p><b>RCU</b>: acomete sempre o <b>reto</b> e se estende de forma <b>contínua</b> para proximal, restrita ao cólon; inflamação <b>mucosa</b>; macroscopia com mucosa friável, úlceras rasas, pseudopólipos e, na cronicidade, cólon tubular (cano de chumbo); microscopia com <b>criptite e abscessos de cripta</b>, distorção arquitetural, plasmocitose basal, depleção de mucina; complicações: hemorragia, <b>megacólon tóxico</b>, displasia e <b>câncer colorretal</b>.</p><p><b>Crohn</b>: qualquer segmento da boca ao ânus, sobretudo <b>íleo terminal</b>, com lesões <b>salteadas</b>; inflamação <b>transmural</b>; úlceras aftoides/serpiginosas, pedra de calçamento, parede espessa, gordura serpenteante; <b>granulomas não caseosos</b>, agregados linfoides transmurais, fissuras; complicações: <b>fístulas, estenoses, abscessos</b>, doença perianal, má absorção (B12, sais biliares).</p>',

   a:'<p>O ferro da dieta é reduzido a Fe²⁺ (Dcytb) e absorvido no <b>duodeno</b> pelo <b>DMT1</b>; o heme tem transportador próprio. Sai do enterócito pela <b>ferroportina</b>, é oxidado e transportado pela <b>transferrina</b> até a medula, onde entra pelo receptor de transferrina e a <b>ferroquelatase</b> o insere na protoporfirina para formar o <b>heme</b> da hemoglobina. Macrófagos reciclam o ferro das hemácias velhas; o estoque é a <b>ferritina</b>. A <b>hepcidina</b>, hepática, degrada a ferroportina e sobe na inflamação (IL-6).</p><p>A paciente tem anemia <b>microcítica e hipocrômica</b> com ferro sérico baixo e plaquetose: <b>ferropriva</b> por perda crônica de sangue pela mucosa colônica ulcerada, somada a componente de <b>doença crônica</b> (hepcidina alta pela inflamação, que reduz absorção e libera pouco ferro dos estoques). Por isso a reposição IV é preferida na doença ativa.</p>',
