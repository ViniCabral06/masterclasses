 objectives:['Priorizar problemas num paciente com múltiplas doenças','Integrar fisiopatologia, semiologia, exames e farmacologia dos 10 leitos','Aplicar ajustes de fármacos à função renal e às interações','Planejar prevenção individual e familiar'],
 roadmap: `<h3>Os quatro atos</h3><p><b>Ato 1</b> — sala de emergência (prioridades). <b>Ato 2</b> — o rim e os fármacos. <b>Ato 3</b> — o AVC no 3º dia. <b>Ato 4</b> — alta, prevenção e a família. Depois, o quiz de 30 questões no estilo APIC.</p>`,
 sections:[
 {id:'s1', title:'Ato 1 — Sala de emergência: o que mata primeiro', short:'Ato 1: emergência', d:['clin','lab','fisio'],
  quick: `
  <ol>
   <li><b>Hipercalemia (6,4) com T apiculada</b> → gluconato de cálcio IV já; insulina + glicose; β2 nebulizado; suspender espironolactona e IECA.</li>
   <li><b>Insuficiência respiratória hipercápnica</b> (pH 7,29, PaCO₂ 58) → O₂ controlado (SatO₂ 88–92%) + <b>VNI</b>; broncodilatadores.</li>
   <li><b>Sepse por pneumonia</b> (CURB-65 = 5) → hemoculturas, <b>ceftriaxona + azitromicina</b> na 1ª hora, lactato.</li>
   <li><b>Perfil hemodinâmico frio e úmido</b> (C): congesto e mal perfundido ao mesmo tempo — volume só em pequenos bolus guiados por reavaliação; vasopressor/inotrópico se a hipoperfusão persistir; diurético depois de perfundir.</li>
   <li><b>FA com resposta rápida</b> → tratar a causa (febre, hipóxia, sepse); evitar betabloqueador em dose alta no choque.</li>
  </ol>`,
  deep: `
  <h3>Ordenando o caos</h3>
  <p>O ECG com <b>T apiculada</b> e K⁺ de 6,4 é o risco mais imediato de morte (arritmia): <b>gluconato de cálcio</b> estabiliza a membrana em minutos sem baixar o potássio; <b>insulina regular + glicose</b> e <b>salbutamol</b> deslocam K⁺ para dentro das células (Na⁺/K⁺-ATPase — o mesmo mecanismo da hipocalemia dos β2 do ${D.lk(5,'DPOC')}); depois, remoção (diurético se diurese, resinas, diálise se refratária). As causas estão na prescrição: <b>IECA + espironolactona</b> numa <b>LRA</b> (${D.lk(8,'Fármaco e rim')}).</p>
  ${D.svg(D.ecg({rhythm:'fa',hr:118,t:'apiculada',label:'FA + T apiculada'}),'ECG esquemático do seu Antônio: FA com resposta rápida e ondas T em tenda.')}
  <p>A gasometria mostra <b>acidose respiratória aguda sobre crônica</b> (HCO₃⁻ 27 = compensação renal prévia insuficiente para o CO₂ atual) — exacerbação de DPOC desencadeada pela pneumonia. <b>VNI</b> reduz intubação e mortalidade; O₂ titulado para 88–92% para não piorar a hipercapnia.</p>
  <p><b>CURB-65</b>: confusão (1), ureia &gt; 50 (1), FR ≥ 30 (1), PA (PAD ≤ 60) (1), idade (1) = <b>5</b> → UTI. Consolidação na base D com FTV aumentado e sopro tubário (${D.lk(6,'Pneumonia')}), crepitantes finos bilaterais de congestão (${D.lk(4,'ICC chagásica')}): duas causas de crepitante no mesmo tórax — o <b>FTV</b> e a distribuição separam.</p>
  ${D.fig('img/us-blinhas.jpg','POCUS à beira-leito ajudaria aqui: linhas B bilaterais (congestão) somadas a uma consolidação focal à direita (pneumonia).', USL)}
  ${D.clin('<p><b>Frio e úmido</b> (perfil C de Stevenson) com sepse: o paciente precisa de perfusão sem afogar o pulmão. Abordagem prática: alvo de PAM ≥ 65, pequenos bolus guiados por reavaliação (POCUS: VCI, linhas B), noradrenalina se hipotensão persistir, <b>dobutamina</b> se baixo débito cardíaco; diurético quando perfundido.</p>')}`,
  qs:[
   {q:'Primeira medida diante de K⁺ 6,4 com ondas T apiculadas:',

 {id:'s2', title:'Ato 2 — O rim, os fármacos e o sangue', short:'Ato 2: rim e fármacos', d:['farmaco','lab','fisio','pato'],
  quick: `
  <ul>
   <li><b>LRA</b> (KDIGO 2: Cr 1,1 → 2,6 = 2,4×): pré-renal (sepse, desidratação, baixo débito) + fármacos (IECA, diurético, espironolactona).</li>
   <li>ClCr (Cockcroft-Gault) = (140 − 71) × 58 / (72 × 2,6) ≈ <b>21 mL/min</b>.</li>
   <li><b>Suspender</b>: metformina (acidose lática), espironolactona, IECA (temporário). <b>Ajustar</b>: antibióticos renais.</li>
   <li>Hemograma: leucocitose com <b>desvio à esquerda</b> (bacteriana); anemia normocítica leve (doença crônica/DRC).</li>
  </ul>`,
  deep: `
  <h3>Por que o rim caiu</h3>
  <p>Hipoperfusão (sepse, baixo débito cardíaco, desidratação pela febre e pelo diurético) + perda das defesas da TFG: o <b>IECA</b> dilata a eferente (perde a pressão de filtração dependente de angiotensina II) e o <b>diurético</b> contrai o volume. Sem AINE, falta só um para o “triple whammy”. ${D.lk(8,'Fármaco e rim')}.</p>
  ${D.svg(D.US.rim,'O ultrassom renal decide se há obstrução (hidronefrose) e se a doença é crônica (rins pequenos e hiperecogênicos). No seu Antônio, creatinina recente de 1,1 sugere lesão aguda.')}
  <h3>Prescrição revisada</h3>
  ${D.tbl(['Fármaco','Decisão','Por quê'],[
   ['Metformina','<b>suspender</b>','TFG &lt; 30, hipoperfusão, lactato alto → acidose lática; usar insulina no hospital'],
   ['Espironolactona e enalapril','<b>suspender temporariamente</b>','hipercalemia e LRA; reintroduzir na recuperação (são pilares da ICFEr)'],
   ['Carvedilol','reduzir/suspender no choque','depressão inotrópica no perfil C; manter assim que estável'],
   ['Furosemida','retomar quando perfundido','congestão'],
   ['Ceftriaxona','sem ajuste renal','excreção biliar e renal'],
   ['Azitromicina','sem ajuste; ECG','QT com quinolonas/antiarrítmicos'],
   ['Formoterol + tiotrópio','manter; nebulização no agudo','tiotrópio acumula pouco; atenção à retenção urinária'],
   ['Enoxaparina profilática','ajustar (ClCr &lt; 30)','acúmulo e sangramento']])}
  <h3>O sangue</h3>
  <p>Leucocitose de 21.000 com <b>14% de bastões</b>: desvio à esquerda (G-CSF, liberação medular — ${D.lk(7,'Hemograma')}). Hb 11,2 normocítica: inflamação crônica (hepcidina) e DRC incipiente (eritropoetina); se fosse microcítica, procurar sangramento (${D.lk(10,'RCU')}).</p>`,
  qs:[
   {q:'Clearance estimado de seu Antônio (71 anos, 58 kg, Cr 2,6, masculino):',

   {q:'Por que suspender a metformina agora?',
    o:['Causa hipoglicemia na sepse','Risco de acidose lática com TFG &lt; 30 e hipoperfusão','Interage com ceftriaxona','Causa hipercalemia','Piora a FA'], a:1, d:['farmaco'], e:'Excreção renal + lactato.'},
   {q:'Leucocitose com 14% de bastões indica:',

 {id:'s3', title:'Ato 3 — Terceiro dia: “ele não está mexendo o braço direito”', short:'Ato 3: AVC', d:['semio','clin','pato','farmaco'],
  quick: `
  <p>No 3º dia, já sem febre, seu Antônio acorda com <b>afasia de expressão</b> e <b>hemiparesia direita braquiofacial</b>. Último momento visto bem: 23 h; encontrado às 6 h.</p>
  <ul>
   <li>Território: <b>ACM esquerda</b>. Mecanismo: <b>cardioembólico</b> (FA + cardiopatia chagásica com possível trombo apical).</li>
   <li>Trombólise IV: <b>fora da janela</b> (último momento visto bem &gt; 4,5 h — AVC ao despertar); avaliar <b>trombectomia</b> (até 24 h, com imagem favorável).</li>
   <li>Prevenção secundária: <b>anticoagulação</b> (CHA₂DS₂-VASc alto), iniciada após dias conforme o tamanho do infarto.</li>
  </ul>`,
  deep: `
  <h3>Localizar e explicar</h3>
  <p>Afasia de Broca + hemiparesia D de predomínio braquiofacial + paralisia facial central D = <b>ACM esquerda</b>, divisão superior (${D.lk(9,'AVC')}). Fontes de êmbolo no paciente: <b>FA</b> não anticoagulada e <b>aneurisma apical chagásico</b> com trombo (${D.lk(4,'ICC chagásica')}). O <b>ecocardiograma</b> (transtorácico, depois transesofágico se preciso) procura trombo; o <b>Doppler de carótidas</b> exclui aterosclerose concomitante (ex-tabagista, HAS, DM).</p>
  ${D.svg(D.US.carotida,'Esquema: o Doppler de carótidas faz parte da investigação etiológica mesmo quando há FA — as duas causas podem coexistir.')}
  <h3>Por que não trombolisar</h3>
  <p>A janela conta a partir do <b>último momento visto bem</b> (23 h), não de quando foi encontrado: já são 7 h. Trombectomia mecânica pode ser oferecida até 24 h se houver oclusão de grande vaso e infarto pequeno com penumbra grande na imagem. Além disso, ClCr baixo e eventual anticoagulação não são contraindicações à trombectomia.</p>
  <h3>Patologia esperada</h3>
  <p>Necrose <b>liquefativa</b>; infarto <b>hemorrágico</b> é mais comum no cardioembólico (reperfusão do vaso após fragmentação do êmbolo) — por isso a anticoagulação plena é adiada alguns dias nos infartos extensos.</p>
  <h3>Anticoagulante na FA com DRC</h3>
  <p>CHA₂DS₂-VASc: IC (1), HAS (1), idade ≥ 65 (1) e ≥ 75? não, DM (1), AVC (2) → <b>6</b>. Escolha: <b>DOAC</b> com ajuste à função renal (apixabana) ou varfarina (RNI 2–3; obrigatória se estenose mitral moderada/grave ou prótese mecânica — ${D.lk(2,'Estenose mitral')}). Dabigatrana é muito renal: evitar com ClCr baixo.</p>`,

 {id:'s4', title:'Ato 4 — Alta, prevenção e a família', short:'Ato 4: alta e família', d:['prev','human','micro','th'],
  quick: `
  <ul>
   <li>Seu Antônio: vacinas (influenza, pneumocócica, covid, VSR, dTpa), reabilitação pulmonar e motora, fonoaudiologia (afasia e <b>deglutição</b>), anticoagulação, reintrodução gradual de IECA/espironolactona com potássio e creatinina, insulina/iDPP-4 em vez de metformina enquanto TFG &lt; 30.</li>
   <li>Família: <b>sorologia para Chagas</b> dos moradores expostos ao mesmo domicílio e das mulheres em idade fértil da família (transmissão congênita), além de vigilância do domicílio (barbeiro).</li>
   <li>Neta de 5 anos com diarreia: avaliar hidratação (Planos A/B/C), parasitológico, hemograma, caderneta de vacinas.</li>
  </ul>`,

  <h3>A neta</h3>

 dq:[
  {q:'Liste, em ordem de prioridade, os problemas do seu Antônio na admissão e justifique a primeira conduta para cada um.',
   a:'<p>1) <b>Hipercalemia com alteração de ECG</b> (T apiculada): gluconato de cálcio IV (estabiliza a membrana), insulina + glicose e β2 nebulizado (deslocam K⁺), suspender IECA e espironolactona. 2) <b>Insuficiência respiratória hipercápnica</b> (pH 7,29, PaCO₂ 58, SatO₂ 86%): VNI e O₂ titulado 88–92%, broncodilatadores. 3) <b>Sepse por pneumonia</b> (CURB-65 = 5, lactato 3,4): hemoculturas, ceftriaxona + azitromicina na 1ª hora, ressuscitação guiada. 4) <b>IC descompensada perfil C</b>: restaurar perfusão (noradrenalina/dobutamina conforme o caso) antes de diurético. 5) <b>LRA</b> pré-renal + fármacos: suspender metformina, IECA, espironolactona; ajustar doses. 6) <b>FA rápida</b>: tratar a causa; anticoagulação depois.</p>',
   k:['Hipercalemia primeiro (cálcio + shift)','Insuficiência respiratória: VNI e O₂ titulado','Sepse: antibiótico precoce e hemoculturas','Perfil C: perfusão antes de diurético','LRA: suspensão/ajuste de fármacos']},
  {q:'Explique as duas fontes possíveis de êmbolo do AVC e como investigá-las.',
   a:'<p><b>Fibrilação atrial</b>: estase na auriculeta esquerda → trombo; investigar com ECG/monitorização e ecocardiograma transesofágico. <b>Cardiomiopatia chagásica</b>: aneurisma apical do VE com trombo mural; ecocardiograma transtorácico. Excluir aterosclerose carotídea concomitante com Doppler de carótidas (ex-tabagista, HAS, DM). A prevenção secundária é anticoagulação (CHA₂DS₂-VASc 6), preferindo DOAC ajustado à função renal (apixabana) ou varfarina.</p>',
   k:['FA e trombo na auriculeta','Aneurisma apical chagásico','Ecocardiograma (TT/TE)','Doppler de carótidas','Anticoagulação com escolha adequada à função renal']},
  {q:'Discuta como a função renal alterou a farmacocinética dos medicamentos de seu Antônio, dando três exemplos.',
   a:'<p>Com ClCr ≈ 21 mL/min, fármacos de eliminação renal têm clearance reduzido, meia-vida prolongada e acumulam acima da janela terapêutica. Exemplos: <b>metformina</b> (acúmulo → acidose lática; suspensa), <b>espironolactona/IECA</b> (efeito farmacodinâmico amplificado → hipercalemia), <b>enoxaparina</b> e <b>dabigatrana</b> (acúmulo → sangramento; ajustar ou evitar). Antibióticos renais exigem ajuste; a ceftriaxona não. O cálculo do clearance (Cockcroft-Gault) deve preceder a prescrição.</p>',
   k:['Clearance reduzido → t½ ↑ e acúmulo','Metformina','IECA/espironolactona e potássio','Anticoagulantes renais','Cálculo do ClCr antes de prescrever']}
