  <div class="widget" data-w="audioquiz" data-cfg="c2"></div>`,
  deep: `
  <h3>Bulhas: sons de fechamento</h3>
  <p>As bulhas normais nascem da <b>desaceleração súbita do sangue</b> e da vibração de folhetos, cordas e paredes no momento em que uma valva fecha. A abertura de valvas normais é silenciosa.</p>
  <h4>B1</h4>
  <p>Fechamento da mitral (M1) e da tricúspide (T1), quase simultâneos. Sua <b>intensidade depende da distância que os folhetos percorrem</b> para fechar: se no início da sístole eles ainda estão bem abertos, fecham “de longe” e com força → B1 hiperfonética. Por isso B1 é <b>alta</b> quando o PR é curto, na taquicardia e na <b>estenose mitral com folhetos móveis</b> (o gradiente AE-VE mantém a valva aberta até o último instante); e é <b>baixa</b> quando o PR é longo, na disfunção do VE e na EM muito calcificada (o folheto não se move).</p>
  <h4>B2 e o desdobramento fisiológico</h4>
  <p>A2 (aórtica) e P2 (pulmonar). Na <b>inspiração</b>, a pressão intratorácica cai, mais sangue chega ao VD e a ejeção pulmonar se prolonga; ao mesmo tempo, o leito pulmonar retém sangue e chega um pouco menos ao VE. Resultado: <b>P2 atrasa e A2 adianta → B2 desdobra</b>. Na expiração, os dois componentes se fundem.</p>
  ${D.tbl(['Desdobramento de B2','Mecanismo','Exemplo'],[
   ['Fisiológico','varia com a respiração','normal'],
   ['Amplo (persiste na expiração)','atraso de P2','bloqueio de ramo direito, estenose pulmonar'],
   ['Fixo','VD com volume aumentado e sem variação respiratória','<b>comunicação interatrial</b>'],
   ['Paradoxal (só na expiração)','atraso de A2','bloqueio de ramo esquerdo, estenose aórtica grave']])}
  <p><b>B2 hiperfonética</b> na base esquerda indica <b>P2 intensa = hipertensão pulmonar</b> — exatamente o que a paciente tem.</p>
  <h4>B3 e B4: sons de enchimento</h4>
  <p><b>B3</b> surge no enchimento rápido, quando um grande volume entra num ventrículo dilatado/complacente e a parede “freia” bruscamente: normal em crianças e jovens; patológica (galope ventricular) na insuficiência cardíaca e nas sobrecargas de volume (insuficiência mitral). <b>B4</b> surge quando o átrio contrai contra um ventrículo <b>rígido</b> (hipertrofia, isquemia, HAS) — exige contração atrial, portanto <b>não existe na fibrilação atrial</b>. Ambas são graves (baixa frequência): ouça com a <b>campânula</b>.</p>
  <h3>Sopros: turbulência</h3>
  <p>Sangue normalmente flui em regime <b>laminar</b> e silencioso. Ele vira <b>turbulento</b> — e audível — quando a velocidade sobe, o orifício se estreita, a viscosidade cai (anemia) ou o fluxo passa de um calibre pequeno para um grande (número de Reynolds alto). As vibrações da parede e do sangue são o sopro.</p>
  ${D.svg(svgSopros,'Formas dos principais sopros no fonocardiograma.')}
  ${D.fig('img/c2-fono.jpg','Fonocardiogramas: normal, estenose aórtica (diamante), regurgitação mitral (platô), regurgitação aórtica (decrescendo diastólico), estenose mitral (ruflar com reforço pré-sistólico) e persistência do canal arterial (contínuo, “em maquinaria”).', CC('CC BY-SA 3.0','Madhero88 / trad. Usien6'))}
  <h4>Como descrever um sopro (o que o examinador espera ouvir de você)</h4>
  <ol>
   <li><b>Fase</b>: sistólico, diastólico ou contínuo (e em que parte: proto, meso, tele, holo).</li>
   <li><b>Localização</b> (foco de máxima intensidade) e <b>irradiação</b>.</li>
   <li><b>Intensidade</b> (Levine, 1 a 6; a partir de 4 há <b>frêmito</b>).</li>
   <li><b>Timbre e frequência</b>: rude, aspirativo, em ruflar, musical; agudo ou grave.</li>
   <li><b>Forma</b>: crescendo-decrescendo, platô, decrescendo.</li>
   <li><b>Variação com manobras</b> e posição.</li>
  </ol>
  ${D.tbl(['Grau (Levine)','Descrição'],[['1','muito fraco, só com atenção'],['2','fraco, audível logo'],['3','moderado, sem frêmito'],['4','alto, <b>com frêmito</b>'],['5','muito alto, ouvido com parte do estetoscópio na pele'],['6','audível com o estetoscópio afastado do tórax']])}
  <h3>Biblioteca de sons (gravações reais)</h3>

   ${D.audio('audio/split-2nd-heart-sound.mp3','Desdobramento fisiológico de B2','referência de normalidade')}

  <ul>
   <li><b>Campânula</b> (pressão leve) = sons <b>graves</b>: ruflar mitral, B3, B4. <b>Diafragma</b> (firme) = <b>agudos</b>: B1, B2, sopros aspirativos e de regurgitação.</li>

  deep: `
  <h3>Sequência e preparo</h3>
  <p>Ambiente silencioso, tórax desnudo (respeitando o pudor, com lençol), paciente em decúbito dorsal com cabeceira a 30–45°, examinador à <b>direita</b> do paciente. Higienize as mãos e aqueça o estetoscópio. A ordem clássica no tórax é <b>inspeção → palpação → percussão (pouco útil no coração) → ausculta</b>.</p>
  <h3>Inspeção e palpação</h3>
  <p><b>Ictus cordis</b> (choque da ponta) é o impacto da ponta do VE contra a parede durante a contração isovolumétrica. Normal: 4º ou 5º EIC esquerdo na linha hemiclavicular, ocupando <b>1–2 polpas digitais</b>, pouco intenso, que se desloca 1–2 cm em decúbito lateral esquerdo. <b>Desviado para baixo e para fora e alargado</b> = dilatação do VE; <b>propulsivo/sustentado</b> = hipertrofia.</p>
  <p>Agora leia o exame da paciente:</p>
  <ul>
   <li><b>Abaulamento paraesternal esquerdo</b> e <b>pulsação epigástrica</b> → o <b>VD</b> está aumentado (hipertrofia/dilatação por hipertensão pulmonar). O VD é a câmara mais anterior, encostada no esterno; quando cresce, empurra a parede paraesternal e transmite pulsação ao epigástrio. A pulsação de VD pode ser confirmada colocando a polpa dos dedos sob o rebordo costal esquerdo: ela bate na ponta dos dedos durante a inspiração profunda.</li>
   <li><b>Ictus não palpável</b> → coerente com <b>VE não aumentado</b> (a EM poupa o VE) e com o VD dilatado rodando o coração e afastando a ponta do VE da parede.</li>
  </ul>
  ${D.pearl('<p>Frêmito = sopro palpável (grau ≥ 4). Na EM pode haver <b>frêmito diastólico no ápice</b>, sentido melhor em decúbito lateral esquerdo.</p>')}
  <h3>Ausculta: onde e como</h3>
  ${D.fig('img/c2-slide-focos.jpg','Focos de ausculta: aórtico, pulmonar, tricúspide e mitral. Os focos são áreas de <b>projeção do som</b> de cada valva, não a localização anatômica da valva.', SL)}
  <p>Percorra todos os focos (e as áreas entre eles), primeiro com o <b>diafragma</b> e depois com a <b>campânula</b>, identificando B1 e B2 com ajuda do pulso carotídeo. Em cada foco, pergunte: ritmo? B1 e B2 normais? Há sons extras? Há sopro sistólico? Diastólico?</p>
  <div class="widget" data-w="ausculta2"></div>
  <h3>Manobras dinâmicas (propedêutica)</h3>
  ${D.tbl(['Manobra','Efeito hemodinâmico','O que muda'],[
   ['<b>Rivero-Carvallo</b> (inspiração profunda)','↑ retorno ao coração direito','sopros da <b>tricúspide</b> aumentam (diferencia IT de IM)'],
   ['<b>Valsalva</b> (fase de esforço)','↓ pré-carga','quase todos diminuem; <b>aumentam</b> cardiomiopatia hipertrófica obstrutiva e prolapso (clique mais precoce)'],
   ['<b>Agachamento</b> / elevar pernas','↑ pré-carga (e pós-carga no agachamento)','a maioria aumenta; CMH e prolapso diminuem'],
   ['<b>Handgrip</b> (preensão isométrica)','↑ pós-carga','regurgitações (IM, IAo, CIV) aumentam; EAo e CMH diminuem'],
   ['<b>Decúbito lateral esquerdo</b>','aproxima a ponta do VE da parede','realça ruflar mitral, B3 e B4 do VE'],
   ['Sentado, inclinado para frente, expiração','aproxima a base da parede','realça a insuficiência aórtica e o atrito pericárdico']])}
  ${D.integ('<p><b>TH/Propedêutica:</b> na estação de OSCE de ausculta, o avaliador quer ver: apresentar-se, higienizar as mãos, posicionar o paciente, auscultar os 5 focos com diafragma e campânula, palpar o pulso para identificar a sístole, reposicionar em decúbito lateral esquerdo para o foco mitral e descrever o achado com a terminologia correta.</p>','Integração · OSCE')}`,

 {id:'s4', title:'Estenose mitral: fisiopatologia passo a passo', short:'Fisiopatologia da EM', d:['fisio','clin'],
  quick: `
  ${D.svg(svgEM,'Da valva estreita aos sintomas.')}
  <ul>
   <li><b>Área normal</b>: 4–6 cm². <b>EM grave</b>: ≤ 1,5 cm² (muito grave ≤ 1,0).</li>
   <li>Sintomas da paciente explicados: <b>dispneia/DPN/tosse</b> = congestão pulmonar; <b>palpitações</b> = AE dilatado (FA paroxística); <b>dor torácica</b> = hipertensão pulmonar com isquemia do VD (ou doença coronariana associada).</li>
   <li>Ausculta: <b>B1 ↑</b> (folhetos ainda abertos no fim da diástole), <b>estalido</b> (folhetos em domo param bruscamente), <b>ruflar</b> (fluxo turbulento AE → VE), <b>reforço pré-sistólico</b> (contração atrial), <b>P2 ↑</b> (HP).</li>
  </ul>
  ${D.pearl('<p>Quanto <b>mais próximo de B2</b> o estalido, <b>mais grave</b> a estenose (a pressão do AE é tão alta que abre a valva mais cedo). A <b>duração</b> do ruflar, e não sua intensidade, acompanha a gravidade.</p>')}`,
  deep: `
  <p>A estenose mitral (EM) é um problema de <b>esvaziamento do átrio esquerdo</b>. Tudo o que a paciente sente sai dessa frase.</p>
  ${D.fig('img/c2-slide-valva.jpg','Valva mitral normal × estenótica vista de cima: comissuras fundidas transformam a abertura numa fenda.', SL)}
  <h3>1. O gradiente</h3>
  <p>A área mitral normal é de <b>4 a 6 cm²</b>; o sangue passa do AE ao VE quase sem diferença de pressão. Quando a área cai, só um <b>gradiente</b> (pressão do AE maior que a do VE durante toda a diástole) mantém o fluxo. O gradiente depende do <b>fluxo ao quadrado</b> e, de forma crítica, do <b>tempo de diástole</b>. Sintomas costumam aparecer com área &lt; 2,5 cm² no esforço; pela diretriz AHA/ACC, EM <b>grave</b> é área ≤ <b>1,5 cm²</b>, e <b>muito grave</b> ≤ 1,0 cm².</p>
  ${D.svg(svgEM,'Cascata fisiopatológica da estenose mitral.')}
  <h3>2. Para trás: átrio e pulmão</h3>
  <p>A pressão do AE se transmite às veias e capilares pulmonares. Acima de ≈ 25 mmHg, a pressão hidrostática capilar supera a oncótica e o líquido extravasa para o interstício e depois para os alvéolos (<b>edema pulmonar</b>). Daí a <b>dispneia aos esforços</b>, a <b>ortopneia</b> e a <b>dispneia paroxística noturna</b> (no decúbito, o retorno venoso aumenta e o edema de membros inferiores é reabsorvido para a circulação), e a <b>tosse</b>. A ruptura de pequenas veias brônquicas dilatadas causa <b>hemoptise</b>.</p>
  <p>O <b>AE dilata</b>; o miocárdio atrial distendido e fibrosado (a cardite reumática também lesa o átrio) vira substrato de <b>fibrilação atrial</b> — as <b>palpitações</b> da paciente. Na FA, o sangue estagna no apêndice atrial: <b>trombo</b> e <b>embolia sistêmica</b>, com destaque para o <b>AVC cardioembólico</b> ${D.lk(9,'AVC')}.</p>
  ${D.extra('<p><b>Síndrome de Ortner</b>: rouquidão por compressão do nervo laríngeo recorrente esquerdo entre a aorta e a artéria pulmonar dilatada/AE aumentado. O AE grande também pode comprimir o esôfago (disfagia) — base do sinal do esôfago contrastado deslocado no RX.</p>')}
  <h3>3. Hipertensão pulmonar e o coração direito</h3>
  <p>No início, a hipertensão pulmonar é <b>passiva</b> (transmissão retrógrada da pressão do AE). Com o tempo há <b>vasoconstrição arteriolar reativa</b> e remodelamento (hipertrofia da média, fibrose da íntima) — mecanismo de proteção que reduz o edema, mas sobrecarrega o VD. O VD hipertrofia e dilata (<b>abaulamento paraesternal, pulsação epigástrica</b>), pode surgir <b>insuficiência tricúspide funcional</b> e, por fim, congestão sistêmica (turgência jugular, hepatomegalia, edema). A <b>P2 hiperfonética</b> é o marcador auscultatório da HP.</p>
  ${D.extra('<p><b>Sopro de Graham Steell</b>: sopro diastólico de insuficiência pulmonar funcional, no foco pulmonar, causado pela HP grave da EM.</p>')}
  <h3>4. Para frente: débito cardíaco</h3>
  <p>O VE é <b>poupado</b>: recebe menos sangue, não dilata, e por isso o <b>ictus é normal</b> e a área cardíaca pode até ser normal no RX (a dilatação é de AE e câmaras direitas). Mas o débito não consegue subir no esforço: <b>fadiga</b>.</p>
  <h3>5. E a dor torácica?</h3>
  <p>Dor torácica ocorre em uma minoria dos pacientes com EM: pode vir da <b>isquemia do VD</b> hipertrofiado e com alta pressão, de <b>embolia coronariana</b> ou de <b>doença coronariana concomitante</b>. Esta paciente tem fatores de risco (HAS, ex-tabagista, história familiar), então a dor merece investigação própria — e não o rótulo de “estresse”.</p>
  <h3>6. A ausculta explicada pelo mecanismo</h3>
  ${D.tbl(['Achado','Por quê'],[
   ['<b>B1 hiperfonética</b>','o gradiente mantém os folhetos abertos até o fim da diástole; o fechamento parte “de longe” e com tensão súbita'],
   ['<b>Estalido de abertura</b>','os folhetos fundidos nas comissuras abrem em domo e param bruscamente; quanto maior a pressão do AE, mais cedo após B2'],
   ['<b>Ruflar diastólico</b>','turbulência do fluxo AE → VE; grave, melhor com campânula'],
   ['<b>Reforço pré-sistólico</b>','a contração atrial acelera o fluxo no fim da diástole; some na FA'],
   ['<b>B2 hiperfonética</b>','P2 intensa pela hipertensão pulmonar']])}
  ${D.audio('audio/mitral-stenosis.mp3','Estenose mitral','B1 forte, estalido e ruflar')}
  ${D.audio('audio/mitral-stenosis-atrial-fibrillation.mp3','Estenose mitral com fibrilação atrial','ritmo irregular e perda do reforço pré-sistólico')}
  ${D.audio('audio/mitral-stenosis-murmur.mp3','Ruflar mitral isolado','ouça a baixa frequência do sopro diastólico')}
  <p class="credit mono" style="font-size:11px;color:var(--ink-faint)">${AUD}</p>
  ${D.trap('<p>Na EM avançada, com folhetos <b>calcificados e imóveis</b>, B1 e o estalido podem ficar <b>diminuídos</b> ou sumir. B1 hiperfonética implica valva ainda móvel — dado que favorece a valvoplastia por balão.</p>')}`,

   {q:'A dispneia paroxística noturna da paciente é explicada principalmente por:',

  ]},

 {id:'s5', title:'Patologia e microbiologia: da faringite à valva em “boca de peixe”', short:'Febre reumática', d:['pato','micro','imuno','prev'],
  quick: `
  ${D.chain(['Faringite por <i>S. pyogenes</i> (grupo A)','Anticorpos e linfócitos T contra proteína M e carboidrato do grupo A','<b>Mimetismo molecular</b> com miosina, laminina e tecido valvar','Febre reumática aguda (pancardite)','Surtos repetidos → fibrose, fusão de comissuras','<b>Estenose mitral</b> anos a décadas depois'])}
  <ul>
   <li><b>Aguda</b>: <b>corpúsculos de Aschoff</b> (necrose fibrinoide + linfócitos + <b>células de Anitschkow</b> em “lagarta”), verrugas nas linhas de fechamento, placas de MacCallum no AE.</li>
   <li><b>Crônica</b>: folhetos espessados, comissuras fundidas, cordas curtas e fundidas → valva em <b>“boca de peixe”</b> ou “casa de botão”.</li>
   <li><b>Critérios de Jones</b> maiores: cardite, artrite, coreia de Sydenham, eritema marginado, nódulos subcutâneos.</li>
   <li><b>Profilaxia secundária</b>: penicilina G benzatina a cada 21 dias.</li>
  </ul>
  ${D.fig('img/c2-em-macro.jpg','Estenose mitral vista pelo átrio esquerdo aberto: orifício reduzido, folhetos espessados e comissuras fundidas (“boca de peixe”).', 'Wikimedia Commons · CDC · Domínio público')}`,
  deep: `
  <h3>Microbiologia: o agente</h3>
  <p><i>Streptococcus pyogenes</i> — <b>cocos Gram-positivos em cadeia</b>, catalase-negativos, <b>beta-hemolíticos</b>, <b>grupo A de Lancefield</b> (carboidrato C da parede). Identificação laboratorial clássica: sensível à <b>bacitracina</b> e PYR-positivo. Fatores de virulência: <b>proteína M</b> (antifagocítica, principal antígeno de mimetismo), cápsula de ácido hialurônico, <b>estreptolisina O</b> (lábil ao oxigênio, antigênica → base do teste <b>ASLO</b>) e S, exotoxinas pirogênicas.</p>
  ${D.pearl('<p>Febre reumática segue <b>faringite</b>, nunca impetigo. Glomerulonefrite pós-estreptocócica segue faringite <b>ou</b> pele. Por que? Cepas “reumatogênicas” (certos tipos M) são de orofaringe.</p>')}
  <h3>Imunopatogênese: mimetismo molecular</h3>
  <p>Em indivíduos geneticamente suscetíveis, a resposta contra o estreptococo reconhece também tecidos próprios: a <b>proteína M</b> tem semelhança estrutural com <b>miosina cardíaca</b> e tropomiosina; a <b>N-acetilglicosamina</b> do carboidrato do grupo A se assemelha a glicoproteínas e à <b>laminina</b> do endotélio valvar. Anticorpos se ligam ao endotélio valvar (hipersensibilidade <b>tipo II</b>), expressam moléculas de adesão e abrem caminho para <b>linfócitos T CD4</b> autorreativos (componente <b>tipo IV</b>, Th1/Th17) infiltrarem a valva. Surtos repetidos acumulam dano.</p>
  <h3>Patologia da fase aguda: pancardite</h3>
  <p>A febre reumática aguda acomete as três camadas: <b>pericardite</b> fibrinosa (“pão com manteiga”), <b>miocardite</b> com os característicos <b>corpúsculos de Aschoff</b> e <b>endocardite</b> (valvulite) com pequenas <b>vegetações verrucosas</b> de 1–2 mm ao longo das linhas de fechamento dos folhetos.</p>
  ${D.fig('img/c2-aschoff.jpg','Corpúsculo de Aschoff na miocardite reumática (HE): foco de inflamação perivascular com necrose fibrinoide, linfócitos, plasmócitos e macrófagos ativados.', CC('CC BY-SA 2.0','Ed Uthman, MD'))}
  ${D.fig('img/c2-anitschkow.jpg','Células de Anitschkow (maior aumento): macrófagos com cromatina condensada em barra central ondulada — a “lagarta” (caterpillar cells). Quando multinucleadas, são as células gigantes de Aschoff.', CC('CC BY-SA 2.0','Ed Uthman, MD'))}
  <p>No átrio esquerdo podem surgir as <b>placas de MacCallum</b>, áreas subendocárdicas espessadas pelo jato regurgitante.</p>
  <h3>Patologia crônica: a cardiopatia reumática</h3>
  <p>A cicatrização da valvulite produz <b>fibrose</b> e <b>neovascularização</b> dos folhetos, <b>fusão das comissuras</b>, <b>encurtamento, espessamento e fusão das cordas tendíneas</b> e, com o tempo, <b>calcificação</b>. A mitral é acometida em quase todos os casos (isolada em cerca de dois terços), seguida da aórtica. A valva assume o aspecto de <b>“boca de peixe”</b> ou <b>“casa de botão”</b>.</p>
  ${D.fig('img/c2-em-macro.jpg','Estenose mitral reumática vista pelo átrio: orifício em fenda, folhetos espessos, comissuras fundidas.', 'Wikimedia Commons · CDC · Domínio público')}
  ${D.fig('img/c2-frd-macro.jpg','Cardiopatia reumática com o VE aberto: folhetos mitrais espessados e cordas tendíneas encurtadas, espessadas e fundidas.', 'Wikimedia Commons · CDC/Dr. Edwin P. Ewing, Jr. · Domínio público')}
  ${D.integ('<p><b>Patologia I:</b> inflamação crônica → reparo por <b>fibrose</b> (deposição de colágeno por fibroblastos ativados por TGF-β) → retração cicatricial. É o mesmo princípio da cirrose ou da estenose de esôfago por cáustico: tecido que cicatriza perde forma e função.</p>','Integração · Patologia')}
  <h3>Diagnóstico da febre reumática aguda: critérios de Jones</h3>
  ${D.tbl(['Maiores','Menores'],[
   ['<b>Cardite</b> (clínica ou subclínica ao eco)','artralgia'],
   ['<b>Poliartrite</b> migratória de grandes articulações (em população de risco, também monoartrite/poliartralgia)','febre'],
   ['<b>Coreia de Sydenham</b>','VHS e/ou PCR elevadas'],
   ['<b>Eritema marginado</b>','intervalo PR prolongado'],
   ['<b>Nódulos subcutâneos</b>','']])}
  <p>Diagnóstico do 1º surto: <b>2 maiores</b> ou <b>1 maior + 2 menores</b>, <b>mais</b> evidência de infecção estreptocócica recente (ASLO elevado, cultura ou teste rápido positivo). A coreia isolada já basta.</p>
  ${D.fig('img/c2-eritema.jpg','Eritema marginado: lesões anulares/serpiginosas, não pruriginosas, de bordas eritematosas e centro claro, em tronco e raiz de membros.', CC('CC BY-SA 4.0','Adsie'))}
  <h3>Prevenção (Medicina Preventiva)</h3>
  <ul>
   <li><b>Primária</b>: tratar a faringite estreptocócica — penicilina G benzatina em dose única IM (ou amoxicilina por 10 dias) — idealmente até o 9º dia de sintomas.</li>
   <li><b>Secundária</b>: <b>penicilina G benzatina a cada 21 dias</b> (1.200.000 UI se &gt; 20 kg; 600.000 UI se ≤ 20 kg). Duração (diretriz brasileira): sem cardite, até 21 anos ou 5 anos após o último surto; cardite com lesão residual leve ou resolvida, até 25 anos ou 10 anos após o surto; lesão moderada a grave, até os 40 anos ou por toda a vida; após cirurgia valvar, por toda a vida. Vale o critério que durar mais.</li>
  </ul>
  ${D.extra('<p>A cardiopatia reumática é uma doença de <b>pobreza</b>: aglomeração domiciliar, acesso limitado a atendimento para dor de garganta. Ainda é causa importante de cirurgia valvar no Brasil e de insuficiência cardíaca em adultos jovens.</p>')}`,
  qs:[
   {q:'Biópsia endomiocárdica mostra foco inflamatório com necrose fibrinoide e macrófagos com cromatina em barra ondulada. O achado é:',
    img:'img/c2-anitschkow.jpg',
    o:['Granuloma caseoso','Corpúsculo de Aschoff com células de Anitschkow','Miocardite viral linfocítica','Infarto em organização','Amiloidose'],
    a:1, d:['pato'], e:'Corpúsculo de Aschoff é patognomônico de cardite reumática; as células de Anitschkow (lagarta) são macrófagos ativados.'},
   {q:'O mecanismo central da lesão valvar na febre reumática é:',
    o:['Invasão direta da valva pelo estreptococo','Toxina estreptocócica circulante','Mimetismo molecular entre antígenos estreptocócicos e proteínas cardíacas','Deposição de imunocomplexos na valva apenas','Degeneração mixomatosa'],
    a:2, d:['imuno','micro','pato'], e:'Reação cruzada de anticorpos e linfócitos T contra proteína M/carboidrato do grupo A e miosina/laminina valvar. A valva é estéril.'},
   {q:'Adolescente de 16 anos teve febre reumática com cardite leve, hoje sem lesão residual. Profilaxia secundária:',
    o:['Não é necessária','Penicilina benzatina a cada 21 dias até 25 anos ou por 10 anos após o último surto (o que for mais longo)','Amoxicilina diária por 1 ano','Penicilina benzatina por toda a vida','Apenas antes de procedimentos dentários'],
    a:1, d:['prev','farmaco'], e:'Cardite prévia com resolução ou lesão leve: até 25 anos ou 10 anos do último surto, o que durar mais.'}
  ]},
 /* S6 */
 {id:'s6', title:'Exames complementares: RX, ECG e ecocardiograma', short:'RX, ECG e eco', d:['lab','semio'],
  quick: `
  ${D.tbl(['Exame','Achados na EM'],[
   ['<b>RX de tórax</b>','<b>duplo contorno</b> à direita; <b>bailarina</b> (carina aberta, brônquio-fonte E elevado); abaulamento do 3º arco à E (apêndice atrial); tronco pulmonar proeminente; cefalização; <b>linhas B de Kerley</b>; esôfago contrastado desviado'],
   ['<b>ECG</b>','<b>P mitrale</b> (P ≥ 120 ms, bífida em DII; componente negativo amplo em V1); <b>FA</b>; sobrecarga de VD (eixo para a direita, R ampla em V1)'],
   ['<b>Ecocardiograma</b>','<b>exame definidor</b>: área valvar, gradiente médio, pressão sistólica da artéria pulmonar, escore de Wilkins, trombo (transesofágico)']])}
  <div class="widget" data-w="hotspot" data-cfg="c2rx"></div>`,
  deep: `
  <h3>Radiografia de tórax</h3>
  <p>Na PA, a silhueta cardíaca esquerda tem quatro arcos: <b>botão aórtico</b>, <b>tronco da pulmonar</b>, <b>apêndice atrial esquerdo</b> (normalmente plano ou côncavo) e <b>VE</b>. À direita, cava superior e átrio direito.</p>
  ${D.fig('img/c2-slide-rx-anat.jpg','Anatomia radiológica da silhueta cardíaca em PA. O átrio esquerdo é posterior e central: quando cresce, aparece “por dentro” do contorno direito e abre a carina.', SL)}
  <p>Sinais de <b>aumento do AE</b>:</p>
  <ul>
   <li><b>Duplo contorno</b> na borda direita (AE ultrapassando o AD).</li>
   <li><b>Abaulamento do apêndice atrial</b> entre o tronco pulmonar e o VE (3º arco; alguns autores contam como 4º).</li>
   <li><b>Sinal da bailarina</b>: elevação e horizontalização do brônquio-fonte esquerdo, com abertura do ângulo da carina (&gt; 90°).</li>
   <li>No perfil com bário: <b>deslocamento posterior do esôfago</b>.</li>
  </ul>
  ${D.fig('img/c2-slide-rx-dc.jpg','Estenose mitral: (1) duplo contorno (seta curva), (2) abaulamento do 3º arco (seta reta) e (3) esôfago contrastado deslocado posteriormente no perfil.', SL)}
  <div class="widget" data-w="hotspot" data-cfg="c2rx"></div>
  <p>Sinais de <b>congestão venocapilar pulmonar</b>: <b>cefalização</b> (redistribuição do fluxo para os lobos superiores), edema intersticial com <b>linhas B de Kerley</b> — linhas finas, horizontais, de 1–2 cm, perpendiculares à pleura nas bases, que são <b>septos interlobulares espessados por edema</b> —, e, na fase alveolar, opacidades em “asa de borboleta”. Na HP, o <b>tronco da artéria pulmonar</b> fica proeminente.</p>
  ${D.fig('img/c2-slide-rx-kerley.jpg','Congestão pulmonar: linhas B de Kerley nas bases (pontas de seta brancas), cefalização e cardiomegalia.', SL)}
  ${D.trap('<p>Na EM pura o <b>índice cardiotorácico pode ser normal</b> (o VE não cresce). No caso, o RX mostrou aumento do coração porque já há sobrecarga de câmaras direitas — sinal de doença avançada.</p>')}
  <h3>Eletrocardiograma</h3>
  <ul>
   <li><b>P mitrale</b>: onda P com duração ≥ 120 ms, bífida (“em M”) em DII, com o componente negativo terminal amplo em V1 (índice de Morris ≥ 1 mm × 40 ms) — despolarização prolongada do AE aumentado.</li>
   <li><b>Fibrilação atrial</b>: ausência de onda P, linha de base irregular (ondas f), RR irregularmente irregular.</li>
   <li><b>Sobrecarga do VD</b>: desvio do eixo para a direita, R ampla em V1, alterações de repolarização em V1–V3.</li>
  </ul>
  ${D.fig('img/c2-fa-ecg.jpg','Fibrilação atrial: RR irregularmente irregular, sem ondas P, com ondas f na linha de base. Na EM, a FA é a principal causa de descompensação e de embolia.', CC('CC BY-SA 4.0','Ewingdo'))}
  <h3>Ecocardiograma: o exame que decide</h3>
  <ul>
   <li><b>Área valvar</b> por planimetria (eixo curto) e pelo tempo de meia-pressão (PHT ≥ 150 ms sugere EM grave).</li>
   <li><b>Gradiente transmitral médio</b> (dependente da FC).</li>
   <li><b>Pressão sistólica da artéria pulmonar</b>.</li>
   <li><b>Escore de Wilkins</b> (mobilidade, espessamento, calcificação e acometimento subvalvar, 1–4 cada): ≤ 8 favorece valvoplastia por balão.</li>
   <li><b>Ecocardiograma transesofágico</b>: pesquisa de <b>trombo no apêndice atrial esquerdo</b> antes de valvoplastia.</li>
  </ul>
  ${D.integ('<p>Investigação da dor torácica: com fatores de risco (HAS, tabagismo, história familiar), pede-se também ECG em repouso, troponina se dor recente e, de forma eletiva, estratificação de doença coronariana (teste funcional ou angiotomografia/cateterismo antes de cirurgia valvar).</p>','Integração · Clínica')}`,
  qs:[
   {q:'Radiografia de tórax mostra brônquio-fonte esquerdo elevado com abertura do ângulo da carina. Qual câmara está aumentada?',
    o:['Ventrículo esquerdo','Átrio direito','Átrio esquerdo','Ventrículo direito','Aorta ascendente'],
    a:2, d:['lab'], e:'Sinal da bailarina: o AE, logo abaixo da carina, empurra o brônquio-fonte esquerdo para cima.'},
   {q:'Linhas B de Kerley correspondem a:',
    o:['Brônquios dilatados','Septos interlobulares espessados por edema/linfáticos distendidos','Atelectasias laminares','Vasos pulmonares calcificados','Fibrose apical'],
    a:1, d:['lab','pato'], e:'São linhas horizontais periféricas nas bases, sinal de edema intersticial (pressão capilar pulmonar elevada).'},
   {q:'Qual exame define a gravidade da estenose mitral e a indicação de valvoplastia por balão?',
    o:['Radiografia de tórax','ECG','Ecocardiograma','Dosagem de BNP','Teste ergométrico'],
    a:2, d:['lab','clin'], e:'O eco mede área valvar, gradiente, PSAP e escore de Wilkins; o transesofágico exclui trombo atrial antes do procedimento.'}
  ]},

 {id:'s7', title:'Diagnóstico diferencial: outras valvopatias e a dor “de estresse”', short:'Diferenciais', d:['semio','clin','human'],

  deep: `
  <h3>As outras valvopatias que a prova compara com a EM</h3>
  ${D.tbl(['Lesão','Fisiopatologia','Sopro e sinais'],[
   ['<b>Estenose aórtica</b> (idoso: degenerativa; jovem: bicúspide ou reumática)','sobrecarga de <b>pressão</b> do VE → hipertrofia concêntrica → isquemia relativa','sistólico de ejeção em diamante, foco aórtico → carótidas; B2 hipofonética; pulso <i>parvus et tardus</i>; <b>angina, síncope e dispneia</b>; agachamento ↑, Valsalva ↓'],

   ['<b>Insuficiência mitral</b> (primária: prolapso, reumática, endocardite; secundária: dilatação do VE, isquemia)','volume regurgitado ao AE → dilatação de AE e VE','holossistólico em platô, ápice → axila; B3; aumenta com handgrip'],
   ['<b>Prolapso da valva mitral</b>','degeneração mixomatosa','clique mesossistólico ± sopro telessistólico; Valsalva/ortostatismo adiantam o clique'],
   ['<b>Estenose tricúspide</b> (rara, reumática)','represa sangue no AD','ruflar na borda esternal baixa que aumenta na inspiração'],
   ['<b>Insuficiência tricúspide</b> (quase sempre funcional, por HP)','sobrecarga de VD e AD','holossistólico que aumenta na inspiração; onda v gigante no pulso jugular; fígado pulsátil']])}
  <div class="aud-grid">
   ${D.audio('audio/aortic-stenosis-murmur.mp3','Estenose aórtica','crescendo-decrescendo')}
   ${D.audio('audio/aortic-regurgitation.mp3','Insuficiência aórtica','diastólico aspirativo')}

   ${D.audio('audio/mitral-regurgitation-murmur-3rd-heart-sound.mp3','IM com B3','sobrecarga de volume')}
   ${D.audio('audio/mitral-valve-prolapse.mp3','Prolapso mitral','clique + sopro tardio')}
   ${D.audio('audio/austin-flint-murmur.mp3','Austin Flint','ruflar funcional da IAo')}
  </div>
  <p class="credit mono" style="font-size:11px;color:var(--ink-faint)">${AUD}</p>
  ${D.fig('img/c2-slide-rx-setas.jpg','Revisão de imagem: sinais do AE aumentado (setas). O mesmo RX aparece na seção de exames com pontos interativos.', SL)}
  <h3>A dor torácica da paciente</h3>
  <p>Dor retroesternal em queimação, irradiada para o membro superior esquerdo, aos esforços e em repouso, com até 10 minutos de duração, em mulher hipertensa, ex-tabagista e com história familiar. O diagnóstico diferencial obrigatório inclui:</p>
  <ul>
   <li><b>Síndrome coronariana / angina</b>: fatores de risco presentes; avaliar ECG, troponina, estratificação.</li>
   <li><b>Dor da hipertensão pulmonar</b> (isquemia do VD) — coerente com P2 hiperfonética e sinais de VD.</li>
   <li><b>Esofágica</b> (refluxo, espasmo; o AE grande também comprime o esôfago).</li>
   <li><b>Tromboembolismo pulmonar</b> e <b>embolia coronariana</b> se houver FA.</li>
  </ul>
  <h3>Humanística: “é só estresse”</h3>
  <p>O caso relata anos de atendimentos em que a dor foi atribuída ao estresse. Isso ilustra três vieses estudados em segurança do paciente: o <b>viés de ancoragem</b> (fixar na primeira hipótese), o <b>fechamento prematuro</b> (parar de pensar quando surge uma explicação plausível) e o <b>ofuscamento diagnóstico</b> (atribuir sintomas físicos a um rótulo psicológico). Há evidência consistente de que mulheres com dor torácica recebem menos investigação cardiológica que homens. O antídoto é <b>exame físico completo</b> (bastava auscultar em decúbito lateral esquerdo) e <b>escuta</b>: validar o sintoma, explicar o raciocínio e investigar antes de concluir por causa emocional.</p>
  ${D.pearl('<p>Uma frase para a discursiva de humanística: “o exame físico bem feito é um ato de respeito ao paciente — foi ele que revelou o diagnóstico que anos de consultas não viram”.</p>')}`,

 /* S8 */
 {id:'s8', title:'Conduta: tratamento clínico, intervenção e prevenção', short:'Tratamento', d:['farmaco','clin','prev'],
  quick: `
  <ul>
   <li><b>Controle da FC</b> (prolonga a diástole): <b>betabloqueador</b> (ou bloqueador de canal de cálcio não di-hidropiridínico; digoxina na FA).</li>

   a:'<p><b>B1 hiperfonética:</b> o gradiente AE-VE mantém os folhetos mitrais amplamente abertos até o final da diástole; quando a contração ventricular começa, os folhetos fecham partindo de uma posição distante e sob tensão súbita, gerando som mais intenso (desde que a valva ainda seja móvel).</p><p><b>Estalido de abertura:</b> no fim do relaxamento isovolumétrico a pressão do VE cai abaixo da do AE (que está elevada) e a mitral abre; como as comissuras estão fundidas, os folhetos abrem em domo e são freados bruscamente, produzindo um som seco e agudo logo após B2. Quanto maior a pressão do AE, mais precoce o estalido.</p><p><b>Ruflar diastólico:</b> o sangue atravessa o orifício estreito com alta velocidade e turbulência durante o enchimento ventricular, gerando sopro de baixa frequência no ápice.</p><p><b>Reforço pré-sistólico:</b> a contração atrial no fim da diástole aumenta o fluxo transmitral; por isso desaparece na fibrilação atrial.</p>',

   a:'<p>A redução da área mitral exige um gradiente diastólico, elevando a pressão no AE. Essa pressão se transmite às veias e capilares pulmonares (congestão: dispneia, DPN, tosse). Inicialmente a hipertensão pulmonar é passiva; depois surge vasoconstrição e remodelamento arteriolar (HP reativa). O VD, que bombeia contra essa pressão, hipertrofia e dilata. Achados da paciente: <b>B2 hiperfonética</b> (P2 intensa da HP), <b>abaulamento paraesternal esquerdo e pulsação epigástrica</b> (impulsão do VD aumentado) e <b>ictus impalpável</b> (VE poupado/rodado). Na evolução: insuficiência tricúspide funcional e congestão sistêmica.</p>',

D.register({
 id:3, title:'Semiologia respiratória e câncer de pulmão', sub:'Pedreiro de 54 anos, ex-tabagista de 120 maços-ano, com dispneia, hemoptise, rouquidão, emagrecimento e linfonodo supraclavicular.',
 disc:['semio','prope','pato','lab','clin','prev','human','farmaco'],
 vignette: `
 <p>Homem de <b>54 anos</b>, procedente de cidade de grande porte, <b>pedreiro</b>, viúvo. Há 1 ano com <b>dispneia progressiva</b>, hoje aos pequenos esforços, acompanhada de <b>tosse com secreção esbranquiçada</b>, <b>halitose</b> e <b>hemoptise ocasional</b>. <b>Disfonia</b> de início recente. Nega febre, calafrios e dor torácica. <b>Emagreceu 9 kg em 7 meses</b>, sem intenção.</p>
 <p>Hiperplasia prostática benigna em uso de <b>doxazosina</b> à noite. <b>Ex-tabagista há 3 meses (120 maços-ano)</b>; etilista social. Sem história familiar de câncer. Foi solicitada radiografia de tórax.</p>
 ${D.tbl(['Exame físico','Achado','Leitura'],[
  ['Geral','REG, afebril, corado, hidratado; <b>49 kg</b>, 1,62 m, <b>IMC 18,7</b>','perda de ~15% do peso em 7 meses → <b>consumo</b> (sinal de alarme)'],
  ['Sinais vitais','FC 88, FR 16, PA 130/80','estáveis'],
  ['Linfonodos','<b>linfonodomegalia supraclavicular palpável</b>','disseminação linfática; alvo mais fácil para biópsia; muda o estadiamento (N3)'],
  ['Respiratório','<b>MV diminuído à esquerda</b> com <b>sibilos à esquerda</b>; expansibilidade preservada','obstrução brônquica <b>parcial</b> e <b>localizada</b>'],
  ['Cardiovascular, abdome, neurológico','normais','sem sinais evidentes de metástase hepática ou cerebral ao exame']])}
 ${D.pearl('<p>Tabagismo pesado + emagrecimento + hemoptise + rouquidão + sibilo <b>localizado</b> + linfonodo supraclavicular = <b>câncer de pulmão localmente avançado</b> até prova em contrário. A rouquidão sugere lesão do <b>nervo laríngeo recorrente esquerdo</b>.</p>')}`,
 objectives:['Compreender os passos de uma anamnese, correlacionando habilidades de comunicação com ênfase no sistema respiratório','Correlacionar a fisiopatologia das doenças respiratórias com as alterações do exame físico e os principais sintomas: tosse, hemoptise, epistaxe e dispneia'],
 roadmap: `<h3>Mapa do leito</h3><p>A primeira metade do leito é <b>semiologia pura</b> (anamnese, sintomas e exame do tórax — vale para todos os casos respiratórios: <b>Leitos 05 e 06</b>). A segunda é o <b>câncer de pulmão</b>: carcinogênese, tipos histológicos, síndromes paraneoplásicas, investigação, prevenção e a conversa difícil.</p>
 ${D.integ('<p>Use este leito como base para a <b>DPOC</b> ('+'Leito 05) e a <b>pneumonia</b> (Leito 06): a tabela de síndromes pleuropulmonares da seção 4 reaparece nos dois.</p>','Integração')}`,
 sections:[
 /* S1 */
 {id:'s1', title:'Anamnese respiratória e habilidades de comunicação', short:'Anamnese', d:['semio','human','farmaco'],
  quick: `
  ${D.tbl(['Etapa','No caso'],[
   ['Identificação','54 anos, pedreiro (exposição ocupacional), viúvo, urbano'],
   ['Queixa principal','“falta de ar” há 1 ano'],
   ['HMA','dispneia progressiva (pequenos esforços), tosse com secreção, halitose, hemoptise, disfonia recente, emagrecimento de 9 kg/7 meses'],
   ['ISDA / HPP','HPB em uso de doxazosina'],
   ['Hábitos','<b>120 maços-ano</b>, parou há 3 meses; etilismo social'],
   ['História familiar','negativa para câncer']])}
  <ul>
   <li><b>Maços-ano</b> = maços por dia × anos fumando (1 maço = 20 cigarros).</li>
   <li>Comunicação: começar com <b>perguntas abertas</b>, depois fechadas; <b>escuta ativa</b>; <b>resumir</b> e checar; perguntar o que o paciente pensa e teme.</li>
   <li>Parar de fumar há pouco tempo pode ser <b>consequência</b> dos sintomas (“parou porque piorou”) — pergunte por quê.</li>
  </ul>
  ${D.integ('<p><b>Doxazosina</b>: antagonista seletivo α1 → relaxa músculo liso da próstata e dos vasos. Efeito adverso típico: <b>hipotensão postural</b> (especialmente na 1ª dose — por isso à noite). Em paciente emagrecido e desidratado, risco de quedas.</p>','Integração · Farmacologia')}`,
  deep: `
  <p>O objetivo do slide junta duas coisas: <b>a estrutura da anamnese</b> e as <b>habilidades de comunicação</b>. A banca do OSCE avalia as duas ao mesmo tempo.</p>
  <h3>A estrutura (e o que procurar em cada parte)</h3>
  ${D.tbl(['Parte','Foco respiratório','O que o caso nos deu'],[
   ['Identificação','idade, sexo, <b>profissão atual e pregressas</b>, procedência','pedreiro → sílica cristalina e, em obras antigas, amianto'],
   ['Queixa e duração','nas palavras do paciente','dispneia há 1 ano'],
   ['HMA','início, evolução, fatores de piora/melhora, sintomas associados; <b>caracterizar cada sintoma</b>','dispneia progressiva; tosse produtiva; hemoptise; halitose; disfonia; perda de peso'],
   ['Interrogatório sistemático','sintomas constitucionais, dor óssea, cefaleia, sintomas neurológicos (metástases)','nega febre, calafrios, dor torácica'],
   ['Antecedentes','TB prévia, pneumonias de repetição, DPOC, cardiopatia, medicações','HPB, doxazosina'],
   ['Hábitos','<b>tabagismo</b> (maços-ano, idade de início e de parada, tentativas), álcool, drogas inalatórias','120 maços-ano, parou há 3 meses'],
   ['Família','câncer de pulmão em parentes de 1º grau','negativa'],
   ['Social','moradia, renda, rede de apoio, animais (aves, fungos)','viúvo: rede de apoio?']])}
  <h3>Calcular a carga tabágica</h3>
  <p>Maços-ano = (cigarros por dia ÷ 20) × anos de tabagismo. <b>120 maços-ano</b> equivale, por exemplo, a 3 maços por dia durante 40 anos — exposição altíssima. O risco relativo de câncer de pulmão em fumantes pesados chega a 20–30 vezes o de não fumantes. A cessação reduz o risco progressivamente, mas ele permanece elevado por décadas; e parar <b>há apenas 3 meses</b> frequentemente significa que o paciente parou <b>porque já estava doente</b> (o chamado “ex-fumante doente”).</p>
  <h3>Sinais de alarme no relato</h3>
  <ul>
   <li><b>Emagrecimento involuntário</b>: 9 kg em 7 meses, de cerca de 58 para 49 kg → <b>~15% do peso</b>. Perda &gt; 5% em 6–12 meses já merece investigação.</li>
   <li><b>Hemoptise</b> em tabagista &gt; 40 anos.</li>
   <li><b>Disfonia</b> persistente &gt; 3 semanas (laringoscopia obrigatória; aqui sugere lesão do laríngeo recorrente).</li>
   <li><b>Dispneia progressiva</b>.</li>
  </ul>
  <h3>Habilidades de comunicação que a banca observa</h3>
  <ol>
   <li><b>Abertura</b>: apresentar-se, confirmar o nome, explicar o objetivo, garantir privacidade.</li>
   <li><b>Funil de perguntas</b>: abertas (“me conte o que está acontecendo”) → focadas → fechadas para detalhes (“a tosse tem sangue?”).</li>
   <li><b>Escuta ativa</b>: não interromper nos primeiros minutos, sinais de atenção, eco (“o senhor disse que emagreceu…”).</li>
   <li><b>Explorar a perspectiva do paciente</b> (método clínico centrado na pessoa): ideias, preocupações, expectativas e impacto na vida (ICE).</li>
   <li><b>Sumarizar</b> e checar o entendimento.</li>
   <li><b>Linguagem sem julgamento</b> sobre o tabagismo: perguntar como quem coleta dado, não como quem acusa.</li>
  </ol>
  ${D.pearl('<p>Uma pergunta que faz diferença: “O senhor parou de fumar há 3 meses — o que o fez parar?”. A resposta (“comecei a tossir sangue”) já é um dado clínico.</p>')}
  ${D.integ('<p><b>Doxazosina</b>: bloqueio α1 no músculo liso do colo vesical e da próstata reduz a resistência ao fluxo urinário. O mesmo bloqueio nos vasos causa vasodilatação e <b>hipotensão ortostática</b>, máxima após a 1ª dose (“efeito de primeira dose”) — por isso se toma à noite. Não explica os sintomas respiratórios, mas importa num paciente consumido, que pode cair ao se levantar.</p>','Integração · Farmacologia')}`,
  qs:[
   {q:'Paciente fuma 1,5 maço por dia há 30 anos. Sua carga tabágica é:',
    o:['30 maços-ano','45 maços-ano','20 maços-ano','60 maços-ano','15 maços-ano'], a:1, d:['semio'], e:'1,5 × 30 = 45 maços-ano.'},
   {q:'Qual dado da anamnese do caso é o maior sinal de alarme de doença consumptiva?',
    o:['Etilismo social','Uso de doxazosina','Perda de 9 kg em 7 meses','Ser viúvo','Morar em cidade grande'], a:2, d:['semio','clin'], e:'Perda involuntária de ~15% do peso indica processo consumptivo (neoplasia, TB, HIV, endocrinopatias).'},
   {q:'Ao abordar o tabagismo do paciente, a conduta comunicacional mais adequada é:',
    o:['Dizer que a doença é consequência do cigarro','Perguntar sem julgamento sobre quantidade, duração e motivo da cessação','Evitar o tema para não constrangê-lo','Registrar apenas “tabagista” sem detalhar','Perguntar só ao familiar'],
    a:1, d:['human','semio'], e:'Coleta objetiva e sem culpabilização, quantificando a exposição (maços-ano) e explorando a motivação.'}
  ]},
 /* S2 */
 {id:'s2', title:'Os sintomas: tosse, expectoração, hemoptise, epistaxe e dispneia', short:'Sintomas', d:['semio','fisio'],
  quick: `
  ${D.tbl(['Sintoma','O que caracterizar','No caso'],[
   ['Tosse','duração (aguda &lt; 3 sem., subaguda 3–8, crônica &gt; 8), seca/produtiva, horário, desencadeantes','crônica, produtiva'],
   ['Expectoração','cor, volume, odor, sangue','esbranquiçada (mucoide); halitose → necrose/infecção pós-obstrutiva'],
   ['Hemoptise','volume, frequência, raias × sangue vivo','ocasional'],
   ['Dispneia','tempo, progressão, esforço (mMRC), ortopneia, DPN','progressiva, pequenos esforços'],
   ['Disfonia','início, duração','recente → nervo laríngeo recorrente']])}
  ${D.tbl(['','Hemoptise','Hematêmese','Epistaxe posterior'],[
   ['Origem','via aérea inferior','trato digestivo alto','fossa nasal'],
   ['Aspecto','vermelho vivo, espumoso','escuro, “borra de café”, com alimento','escorre pela orofaringe'],
   ['pH','alcalino','ácido','—'],
   ['Contexto','tosse, doença pulmonar','náusea, vômito, hepatopatia','sangue na narina; exame nasal']])}`,
  deep: `
  <h3>Tosse</h3>
  ${D.svg(svgTosse,'Arco reflexo da tosse.')}
  <p>A tosse é um reflexo protetor em três fases: <b>inspiratória</b> (enche os pulmões), <b>compressiva</b> (a glote fecha e os músculos expiratórios elevam a pressão intratorácica a até 300 mmHg) e <b>expulsiva</b> (a glote abre e o ar sai a alta velocidade, arrastando secreções). Classifica-se pela duração: <b>aguda</b> (&lt; 3 semanas, geralmente infecção viral), <b>subaguda</b> (3–8 semanas, pós-infecciosa) e <b>crônica</b> (&gt; 8 semanas). No não fumante com RX normal, as causas crônicas mais comuns são síndrome da tosse das vias aéreas superiores, asma, refluxo e IECA. No <b>tabagista</b>, toda tosse nova ou que muda de padrão pede RX de tórax.</p>
  <h3>Expectoração</h3>
  ${D.tbl(['Tipo','Aspecto','Sugere'],[
   ['Mucoide','clara, viscosa','bronquite crônica, asma'],
   ['Purulenta','amarela/esverdeada (mieloperoxidase dos neutrófilos)','infecção bacteriana, bronquiectasia'],
   ['Fétida','odor pútrido','anaeróbios: abscesso, necrose tumoral, pneumonia aspirativa'],
   ['Rósea espumosa','espuma com sangue','edema agudo de pulmão'],
   ['Hemoptoica','raias de sangue','bronquite, CA, TB']])}
  <p>A <b>halitose</b> do paciente, com tosse produtiva, sugere necrose tumoral ou <b>infecção pós-obstrutiva</b> (secreção estagnada além do brônquio estreitado).</p>
  <h3>Hemoptise</h3>
  <p>Eliminação, pela tosse, de sangue proveniente das vias aéreas abaixo da glote. Origem quase sempre na circulação <b>brônquica</b> (sistêmica, de alta pressão), não na pulmonar. Principais causas no Brasil: <b>tuberculose</b> (e suas sequelas), <b>bronquiectasias</b>, <b>câncer de pulmão</b>, infecções; lembrar <b>estenose mitral</b> ${D.lk(2,'EM')}. No câncer, o sangramento vem da superfície tumoral friável e neovascularizada. <b>Hemoptise maciça</b> (definições variam, em geral &gt; 400–600 mL/24 h ou qualquer volume que comprometa a via aérea) mata por <b>asfixia</b>, não por hemorragia: posicionar o paciente com o <b>lado que sangra para baixo</b>, proteger a via aérea, broncoscopia/embolização de artéria brônquica.</p>
  <h3>Epistaxe</h3>
  <p>Sangramento nasal: <b>anterior</b> (90%, plexo de Kiesselbach, área de Little; criança, trauma digital, ar seco) ou <b>posterior</b> (idoso, hipertenso, artéria esfenopalatina; mais grave). A epistaxe posterior pode escorrer para a faringe e ser confundida com hemoptise — por isso o objetivo do slide a inclui: sempre examine nariz e orofaringe antes de rotular “hemoptise”.</p>
  <h3>Dispneia</h3>
  <p>Sensação desconfortável de respirar, resultado do desequilíbrio entre o <b>comando respiratório</b> enviado pelo cérebro e a <b>resposta mecânica</b> obtida (dissociação neuromecânica), somado a quimiorreceptores (hipoxemia, hipercapnia) e receptores pulmonares. Quantifique pela escala <b>mMRC</b> (0 = só em exercício intenso; 4 = ao vestir-se/não sai de casa). Pergunte por <b>ortopneia</b> e <b>DPN</b> (sugerem causa cardíaca), sibilância, relação com esforço.</p>
  <p>No paciente, a dispneia pode somar vários mecanismos: obstrução brônquica pelo tumor, possível <b>paralisia diafragmática</b> (nervo frênico), derrame pleural, linfangite carcinomatosa, DPOC associada ao tabagismo e anemia de doença crônica.</p>
  ${D.pearl('<p><b>Disfonia</b> + tumor à esquerda = nervo <b>laríngeo recorrente esquerdo</b>, que contorna o arco aórtico (sob o ligamento arterioso) e fica vulnerável a linfonodos da janela aortopulmonar. O direito contorna a subclávia, mais alto.</p>')}`,
  qs:[
   {q:'Paciente elimina sangue vermelho vivo, espumoso, após acessos de tosse; pH alcalino. A origem mais provável é:',
    o:['Estômago','Esôfago','Vias aéreas inferiores','Nasofaringe anterior','Cavidade oral'], a:2, d:['semio'], e:'Hemoptise: vermelho vivo, espumoso, alcalino, precedido de tosse.'},
   {q:'Rouquidão em tumor pulmonar esquerdo deve-se principalmente a:',
    o:['Invasão do nervo frênico','Compressão do nervo laríngeo recorrente esquerdo, que contorna o arco aórtico','Metástase cerebral','Síndrome de Horner','Candidíase laríngea'], a:1, d:['semio','pato'], e:'O laríngeo recorrente esquerdo passa sob o arco aórtico e é comprimido por tumor ou linfonodos da janela aortopulmonar.'},
   {q:'Na hemoptise maciça por lesão em pulmão direito, o paciente deve ser posicionado:',
    o:['Em decúbito lateral esquerdo','Em decúbito lateral direito (lado que sangra para baixo)','Em Trendelenburg','Sentado inclinado para frente','Em prona'], a:1, d:['clin'], hard:true, e:'Lado que sangra para baixo protege o pulmão sadio da aspiração de sangue; a morte é por asfixia.'}
  ]},
 /* S3 */
 {id:'s3', title:'Exame do tórax: inspeção, palpação, percussão e ausculta', short:'Exame do tórax', d:['semio','prope','th'],
  quick: `
  ${D.tbl(['Etapa','Avalia','Normal'],[
   ['Inspeção estática','forma do tórax, abaulamentos, retrações, cicatrizes, circulação colateral','tórax simétrico'],
   ['Inspeção dinâmica','FR, ritmo, amplitude, tiragem, uso de musculatura acessória','12–20 ipm, ritmo regular'],
   ['Palpação','<b>expansibilidade</b> (ápices e bases), <b>frêmito toracovocal</b> (“trinta e três”)','simétricos'],
   ['Percussão','som claro pulmonar, macicez, hipersonoridade, timpanismo','claro pulmonar'],
   ['Ausculta','MV, sons adventícios, ausculta da voz','MV presente, sem ruídos adventícios']])}
  ${D.tbl(['Adventício','Tipo','Mecanismo'],[
   ['Estertores finos (crepitantes)','descontínuo, fim da inspiração','abertura de alvéolos com líquido/fibrose'],
   ['Estertores grossos (bolhosos)','descontínuo, início da inspiração e expiração','secreção em brônquios'],
   ['Sibilos','contínuo, agudo, musical','estreitamento de vias aéreas'],
   ['Roncos','contínuo, grave','secreção em vias maiores; muda com a tosse'],
   ['Estridor','contínuo, inspiratório, alto','obstrução de laringe/traqueia'],
   ['Atrito pleural','“couro”, nas duas fases','pleurite']])}
  <div class="widget" data-w="audioquiz" data-cfg="resp"></div>`,
  deep: `
  <p>Paciente sentado, tórax desnudo, examinador comparando sempre <b>lado a lado e simetricamente</b>. A face posterior concentra a maior parte do pulmão (lobos inferiores); a anterior, os lobos superiores e o médio.</p>
  <h3>Inspeção</h3>
  <p><b>Estática</b>: forma (normal, em barril, pectus excavatum/carinatum, cifoescoliose), abaulamentos e retrações, cicatrizes, circulação colateral (síndrome da VCS), baqueteamento digital. <b>Dinâmica</b>: frequência, ritmo (Cheyne-Stokes, Kussmaul, Biot), amplitude, tiragem intercostal, uso de musculatura acessória, respiração paradoxal.</p>
  <h3>Palpação</h3>
  <p><b>Expansibilidade</b>: mãos espalmadas nos ápices e depois nas bases, polegares próximos à coluna; pedir inspiração profunda e observar o afastamento simétrico. <b>Frêmito toracovocal (FTV)</b>: vibração da voz (“trinta e três”) transmitida à parede, palpada com a borda ulnar ou palma das mãos, comparando lados. O FTV depende de o som chegar à parede: <b>aumenta</b> quando o parênquima se torna sólido e o brônquio está pérvio (<b>consolidação</b>), <b>diminui</b> quando algo se interpõe ou o brônquio está ocluído (<b>derrame</b>, <b>pneumotórax</b>, <b>atelectasia obstrutiva</b>, enfisema).</p>
  <h3>Percussão</h3>
  <p>Dígito-digital, do ápice para a base, comparando lados. Sons: <b>claro pulmonar</b> (normal), <b>submaciço/maciço</b> (consolidação, atelectasia, derrame), <b>hipersonoro</b> (enfisema) e <b>timpânico</b> (pneumotórax). No derrame, a macicez é móvel com o decúbito (pesquisa da curva de Damoiseau e do espaço de Traube).</p>
  <h3>Ausculta</h3>
  <p>Com o diafragma, boca entreaberta, respirações profundas. <b>Sons normais</b>: traqueal (sobre a traqueia), brônquico (perto do manúbrio), broncovesicular (região esternal superior e interescapulovertebral alta) e <b>murmúrio vesicular</b> (na maior parte do tórax). O parênquima aerado funciona como <b>filtro passa-baixa</b>: abafa as altas frequências do som traqueal e o transforma no suave murmúrio. Quando o pulmão se consolida, o filtro some e o som <b>brônquico</b> aparece onde não deveria.</p>
  <div class="aud-grid">
   ${D.audio('audio/normal-breath-sounds.mp3','Murmúrio vesicular','normal')}
   ${D.audio('audio/normal-bronchial-breath-sounds.mp3','Som brônquico','normal na traqueia; patológico na periferia')}
   ${D.audio('audio/crackles.mp3','Estertores','descontínuos')}
   ${D.audio('audio/wheezing.mp3','Sibilos','contínuos, musicais')}
   ${D.audio('audio/stridor.mp3','Estridor','obstrução alta')}
   ${D.audio('audio/friction-rub.mp3','Atrito pleural','pleurite')}
   ${D.audio('audio/e-a-change.mp3','Egofonia','“i” vira “ê”')}
  </div>
  <p class="credit mono" style="font-size:11px;color:var(--ink-faint)">${AUD}</p>
  <h4>Ausculta da voz</h4>
  <p><b>Broncofonia</b> (voz falada mais nítida), <b>pectorilóquia fônica e afônica</b> (até o sussurro é compreendido) e <b>egofonia</b> (voz anasalada, “caprina”) indicam transmissão aumentada — consolidação ou limite superior de derrame. Voz <b>diminuída</b> = derrame, pneumotórax, atelectasia obstrutiva.</p>
  <div class="widget" data-w="audioquiz" data-cfg="resp"></div>
  ${D.trap('<p>Roncos e estertores grossos <b>mudam com a tosse</b> (a secreção se move); estertores finos <b>não</b>. Sibilo localizado e fixo sugere obstrução por tumor ou corpo estranho.</p>')}`,
  qs:[
   {q:'Frêmito toracovocal aumentado em base direita, com macicez e som brônquico, sugere:',
    o:['Derrame pleural','Pneumotórax','Consolidação com brônquio pérvio','Atelectasia obstrutiva','Enfisema'], a:2, d:['semio','prope'], e:'Parênquima sólido com via aérea pérvia transmite melhor a voz e o som brônquico.'},
   {q:'Ruído contínuo, alto, predominantemente inspiratório, audível sem estetoscópio sobre o pescoço:',
    o:['Sibilo','Ronco','Estridor','Estertor fino','Atrito pleural'], a:2, d:['semio'], e:'Estridor: obstrução de via aérea alta (laringe/traqueia).'},
   {q:'Estertores finos no fim da inspiração, que não se modificam com a tosse, indicam:',

 {id:'s4', title:'O exame do paciente explicado: sibilo localizado e MV diminuído', short:'Exame do paciente', d:['semio','fisio','pato'],
  quick: `
  <ul>
   <li><b>Sibilo localizado à esquerda</b> = estreitamento <b>parcial</b> de um brônquio (tumor endobrônquico ou compressão extrínseca). Monofônico e <b>fixo</b>.</li>
   <li><b>MV diminuído à esquerda</b> = menos ar chega ao parênquima distal.</li>
   <li><b>Expansibilidade preservada</b> = ainda não há atelectasia volumosa nem derrame grande.</li>
   <li>Se o brônquio fechar: <b>atelectasia</b> → MV e FTV abolidos, macicez, traqueia desviada <b>para o mesmo lado</b>.</li>
  </ul>
  ${D.tbl(['Síndrome','FTV','Percussão','MV','Traqueia'],[
   ['Consolidação','↑','maciça','som brônquico','central'],
   ['Atelectasia (obstrutiva)','↓/abolido','maciça','↓/abolido','<b>desvia para o lado afetado</b>'],
   ['Derrame pleural','↓/abolido','maciça','↓/abolido','desvia para o lado oposto (grande)'],
   ['Pneumotórax','↓/abolido','timpânica','↓/abolido','oposto (hipertensivo)'],
   ['Enfisema','↓ difuso','hipersonora','↓ difuso','central']])}
  <div class="widget" data-w="pulmao" data-cfg="c3"></div>`,
  deep: `
  <p>Agora juntamos semiologia e fisiopatologia para explicar <b>cada achado</b> do paciente.</p>
  <h3>Sibilos à esquerda: por que localizados?</h3>
  <p>Sibilos nascem da <b>oscilação das paredes</b> de uma via aérea estreitada, quando o ar passa em alta velocidade (efeito Bernoulli: a pressão lateral cai, a parede colapsa parcialmente e vibra). Na asma e na DPOC, o estreitamento é <b>difuso</b> → sibilos <b>polifônicos</b>, em todo o tórax, variáveis. No paciente, o estreitamento é de <b>um</b> brônquio (do lobo superior esquerdo ou do brônquio-fonte esquerdo) → sibilo <b>monofônico, localizado e fixo</b>, que não muda com a tosse nem melhora com broncodilatador. Esse sibilo “que não fecha com o diagnóstico de asma” é sinal clássico de <b>tumor ou corpo estranho</b>.</p>
  <h3>MV diminuído à esquerda</h3>
  <p>Com a luz brônquica reduzida, menos ar entra no território distal e o murmúrio se torna fraco. Outros mecanismos podem somar: secreção retida (pneumonia pós-obstrutiva), derrame pleural incipiente, paralisia de hemidiafragma esquerdo por invasão do frênico.</p>
  <div class="widget" data-w="pulmao" data-cfg="c3"></div>
  <h3>Expansibilidade preservada</h3>
  <p>Indica que não há, por ora, grande atelectasia, derrame volumoso ou paralisia diafragmática importante. É um dado que localiza a doença na <b>via aérea</b>, não no espaço pleural.</p>
  <h3>E se o brônquio fechar? A tabela que serve a todos os leitos</h3>
  ${D.tbl(['Síndrome','Inspeção / expansibilidade','FTV','Percussão','Ausculta','Mediastino'],[
   ['<b>Consolidação</b> (pneumonia)','↓ no lado','<b>↑</b>','maciça','<b>som brônquico</b>, estertores, broncofonia','central'],
   ['<b>Atelectasia</b> obstrutiva','↓, retração','↓/abolido','maciça','MV ↓/abolido','<b>para o lado afetado</b>'],
   ['<b>Derrame pleural</b>','↓, abaulamento se grande','↓/abolido','maciça (Damoiseau)','MV abolido; egofonia na borda','para o lado oposto'],
   ['<b>Pneumotórax</b>','↓','↓/abolido','<b>timpânica</b>','MV abolido','oposto se hipertensivo'],
   ['<b>Enfisema/DPOC</b>','tórax em barril, ↓ difusa','↓ difuso','<b>hipersonora</b>','MV ↓ difuso, expiração prolongada','central'],
   ['<b>Obstrução brônquica parcial</b> (o caso)','normal','normal ou ↓','normal','<b>sibilo localizado</b>, MV ↓','central']])}
  ${D.integ('<p>Você vai usar exatamente esta tabela no ' + 'Leito 05 (DPOC) e no Leito 06 (consolidação da pneumonia).</p>','Integração')}
  <h3>Linfonodo supraclavicular</h3>
  <p>Pesquisa: examinador atrás do paciente sentado, polpas digitais na fossa supraclavicular enquanto o paciente faz Valsalva ou flexiona levemente a cabeça para o lado examinado. Linfonodo supraclavicular palpável em adulto tem alto valor preditivo para malignidade. Drenagem: o <b>direito</b> recebe mediastino, pulmões e esôfago; o <b>esquerdo</b> (Virchow) recebe também o abdome via ducto torácico — o <b>sinal de Troisier</b> (linfonodo de Virchow palpável) lembra neoplasia gástrica. No caso, o linfonodo é o melhor <b>alvo de biópsia</b>: acessível e, se positivo, já estadia a doença (N3).</p>
  ${D.fig('img/c3-baqueteamento.jpg','Baqueteamento digital: perda do ângulo entre a unha e a prega ungueal (&gt; 180°), unhas em vidro de relógio e falanges distais alargadas. Associa-se a câncer de pulmão (sobretudo não pequenas células), bronquiectasias, fibrose, cardiopatias cianóticas. Não foi descrito no paciente, mas deve ser pesquisado.', CC('CC BY-SA 4.0','Desherinka'))}`,
  qs:[
   {q:'Sibilo monofônico, localizado no terço superior do hemitórax esquerdo, que não se altera com tosse nem broncodilatador, em tabagista, sugere:',
    o:['Asma','DPOC exacerbada','Obstrução brônquica localizada por tumor','Edema pulmonar','Pneumotórax'], a:2, d:['semio','clin'], e:'Sibilo localizado e fixo = obstrução focal (tumor, corpo estranho, estenose).'},
   {q:'Atelectasia obstrutiva do pulmão esquerdo provoca desvio da traqueia:',
    o:['Para a direita','Para a esquerda','Não desvia','Para frente','Para trás'], a:1, d:['semio','lab'], e:'Perda de volume puxa o mediastino para o lado afetado (ao contrário do derrame volumoso).'},
   {q:'Qual combinação indica derrame pleural?',

 {id:'s5', title:'Patologia: carcinogênese e tipos histológicos', short:'Patologia', d:['pato'],
  quick: `
  ${D.tbl(['Tipo','Frequência','Localização','Marcos'],[
   ['<b>Adenocarcinoma</b>','o mais comum (~40%)','<b>periférico</b>','glândulas, mucina; TTF-1+; EGFR/ALK em não fumantes; osteoartropatia hipertrófica'],
   ['<b>Carcinoma escamoso</b>','~25–30%','<b>central</b>','<b>pérolas de queratina</b>, pontes intercelulares; p40/p63+; cavitação; <b>hipercalcemia (PTHrP)</b>'],
   ['<b>Pequenas células</b>','~15%','<b>central</b>','células pequenas, núcleo hipercromático, <b>moldagem nuclear</b>, necrose; neuroendócrino; <b>SIADH, Cushing, Lambert-Eaton</b>'],
   ['Grandes células','raro','periférico','diagnóstico de exclusão']])}
  ${D.fig('img/c3-hist-colecao.jpg','Histologia: pulmão normal (superior esquerda), adenocarcinoma (superior direita), carcinoma escamoso (inferior direita, com queratinização) e carcinoma de pequenas células (inferior esquerda).', CC('CC BY-SA 4.0','Yale Rosen / Atlas of Pulmonary Pathology'))}`,
  deep: `
  <h3>Carcinogênese: do cigarro à mutação</h3>
  ${D.svg(svgCarcino,'Sequência morfológica e molecular da carcinogênese pulmonar (sobretudo do carcinoma escamoso).')}
  <p>A fumaça contém mais de 60 carcinógenos. Os mais importantes, os <b>hidrocarbonetos aromáticos policíclicos</b> (benzo[a]pireno) e as <b>nitrosaminas</b> (NNK), são pró-carcinógenos: enzimas do <b>citocromo P450</b> os convertem em metabólitos reativos (ex.: benzo[a]pireno diol-epóxido) que se ligam ao DNA formando <b>adutos</b>. Se não reparados, geram mutações características — <b>transversões G→T</b> em <b>TP53</b> e <b>KRAS</b>. Somam-se perdas cromossômicas (3p, 9p com <i>CDKN2A</i>/p16, 17p), ativação de telomerase e <b>cancerização de campo</b>: todo o epitélio exposto acumula lesões, o que explica tumores primários múltiplos.</p>
  ${D.integ('<p><b>Patologia I — adaptação celular:</b> a <b>metaplasia escamosa</b> brônquica do fumante é uma adaptação (epitélio mais resistente substitui o colunar ciliado), mas perde o clearance mucociliar e é o terreno da displasia. Metaplasia é reversível; displasia de alto grau e carcinoma in situ são etapas pré-invasivas.</p>','Integração · Patologia')}
  <p><b>Exposição ocupacional</b> (o paciente é pedreiro): <b>sílica cristalina</b> (carcinógeno do grupo 1 da IARC, além de causar silicose) e, em construções antigas, <b>amianto</b> — cujo efeito com o tabaco é <b>multiplicativo</b> (risco ~50 vezes maior). Outros: radônio, arsênio, cromo, níquel. Vale registrar no prontuário: tem implicação previdenciária (doença relacionada ao trabalho).</p>
  <h3>Os tipos histológicos</h3>
  <p>O câncer de pulmão divide-se em <b>não pequenas células (CPNPC, ~85%)</b> e <b>pequenas células (CPCP, ~15%)</b>. A divisão importa porque comportamento e tratamento são diferentes.</p>
  <h4>Adenocarcinoma</h4>
  <p>O tipo <b>mais frequente</b>, inclusive em <b>mulheres</b> e <b>não fumantes</b>. Tipicamente <b>periférico</b>. Forma glândulas, papilas ou cresce ao longo dos septos alveolares (padrão <b>lepídico</b>, antigo “bronquioloalveolar”); produz mucina; marcador <b>TTF-1</b> e napsina A. Concentra as <b>alterações acionáveis</b>: mutação de <b>EGFR</b> (mais em asiáticos, mulheres, não fumantes), rearranjos de <b>ALK</b> e <b>ROS1</b>, <b>KRAS</b> (fumantes) — que orientam terapia-alvo.</p>
  ${D.fig('img/c3-adeno.jpg','Adenocarcinoma com crescimento lepídico: células atípicas revestindo septos alveolares preservados.', CC('CC BY 2.0','Ed Uthman'))}
  <h4>Carcinoma de células escamosas (epidermoide)</h4>
  <p>O mais associado ao tabagismo depois do de pequenas células. Tipicamente <b>central</b> (brônquios principais/lobares) — causa obstrução, atelectasia, pneumonia pós-obstrutiva e <b>hemoptise</b>. Pode <b>cavitar</b>. Histologia: ninhos de células poligonais com <b>pérolas de queratina</b>, disqueratose e <b>pontes intercelulares</b>; marcadores <b>p40</b>/p63. Síndrome paraneoplásica clássica: <b>hipercalcemia humoral</b> por <b>PTHrP</b>.</p>
  ${D.fig('img/c3-escamoso.jpg','Carcinoma escamoso de pulmão: lóbulos de células poligonais com citoplasma eosinofílico e atipia nuclear moderada.', CC('CC BY-SA 4.0','Calicut Medical College'))}
  <h4>Carcinoma de pequenas células (CPCP)</h4>
  <p>Quase exclusivo de fumantes, <b>central</b>, <b>neuroendócrino</b> (sinaptofisina, cromogranina, CD56), crescimento e metástases muito precoces — ao diagnóstico, a maioria já é doença extensa. Histologia: células pequenas (&lt; 3 linfócitos), citoplasma escasso, cromatina “sal e pimenta”, sem nucléolo, <b>moldagem nuclear</b>, artefato de esmagamento, muitas mitoses e necrose. Responde bem inicialmente a quimioterapia e radioterapia, mas recidiva. Síndromes paraneoplásicas: <b>SIADH</b>, <b>Cushing ectópico</b> (ACTH), <b>Lambert-Eaton</b>, encefalite límbica (anti-Hu).</p>
  ${D.fig('img/c3-pequenas.jpg','Carcinoma de pequenas células (anotado): células pequenas, citoplasma mínimo, cromatina fina, ausência de nucléolos, moldagem nuclear e esmagamento.', CC('CC0','Mikael Häggström'))}
  ${D.fig('img/c3-macro.jpg','Peça de pneumonectomia: tumor branco-acinzentado, firme, junto ao hilo, num pulmão escurecido por antracose (pigmento de carvão do tabaco e da poluição).', CC('CC BY 3.0','Emmanuelm'))}
  ${D.fig('img/c3-slide-macro.jpg','Imagem do material da disciplina: pulmão normal × pulmão de fumante com câncer.', SL)}
  ${D.pearl('<p>Pensou em <b>central</b>? Escamoso e pequenas células (“<b>S</b>quamous e <b>S</b>mall são <b>S</b>entrais”). <b>Periférico</b>? Adenocarcinoma.</p>')}`,
  qs:[
   {q:'Biópsia brônquica mostra ninhos de células poligonais com pérolas de queratina e pontes intercelulares. O paciente apresenta cálcio sérico de 13 mg/dL. O tipo e o mecanismo são:',
    o:['Adenocarcinoma; metástase óssea','Carcinoma escamoso; PTHrP','Pequenas células; ACTH ectópico','Grandes células; vitamina D','Carcinoide; serotonina'], a:1, d:['pato','clin'], e:'Escamoso produz PTHrP → hipercalcemia humoral da malignidade.'},
   {q:'Qual imagem histológica é de carcinoma de pequenas células?',
    img:'img/c3-pequenas.jpg',
    o:['Glândulas com mucina','Células pequenas, citoplasma escasso, moldagem nuclear e esmagamento','Pérolas de queratina','Células gigantes multinucleadas com nucléolos proeminentes','Granuloma com necrose caseosa'], a:1, d:['pato'], e:'Moldagem nuclear, cromatina fina e citoplasma mínimo são característicos.'},
   {q:'Mulher de 45 anos, nunca fumante, com nódulo pulmonar periférico. O tipo histológico mais provável e uma alteração molecular frequente são:',
    o:['Escamoso; TP53','Pequenas células; RB1','Adenocarcinoma; EGFR','Mesotelioma; BAP1','Carcinoide; MEN1'], a:2, d:['pato'], e:'Adenocarcinoma é o mais comum em não fumantes; mutações de EGFR são mais frequentes nesse grupo.'}
  ]},
 /* S6 */
 {id:'s6', title:'Manifestações: locais, regionais, metástases e síndromes paraneoplásicas', short:'Manifestações', d:['clin','pato','semio'],
  quick: `
  ${D.tbl(['Mecanismo','Manifestação'],[
   ['Tumor central','tosse, hemoptise, sibilo localizado, atelectasia, pneumonia pós-obstrutiva'],
   ['Laríngeo recorrente','<b>rouquidão</b> (mais à esquerda)'],
   ['Frênico','paralisia diafragmática, dispneia'],
   ['Ápice (Pancoast)','dor em ombro/braço (C8–T1), atrofia da mão, <b>Horner</b> (ptose, miose, anidrose)'],
   ['Veia cava superior','edema de face e MMSS, pletora, circulação colateral, cefaleia'],
   ['Pleura','derrame, dor pleurítica'],
   ['Metástases','<b>cérebro, osso, adrenal, fígado</b>']])}
  ${D.tbl(['Paraneoplásica','Tipo associado'],[
   ['Hipercalcemia (PTHrP)','escamoso'],['SIADH (hiponatremia)','pequenas células'],['Cushing ectópico (ACTH)','pequenas células, carcinoide'],['Lambert-Eaton','pequenas células'],['Osteoartropatia hipertrófica / baqueteamento','adenocarcinoma'],['Trousseau (tromboflebite migratória)','adenocarcinomas']])}`,
  deep: `
  <h3>Crescimento local e regional</h3>
  <p>Cerca de um quarto dos tumores é assintomático e achado de imagem. Os demais se manifestam por: <b>crescimento endobrônquico</b> (tosse, hemoptise, sibilo, atelectasia, pneumonia que não resolve), <b>invasão de estruturas vizinhas</b> e <b>disseminação</b>.</p>
  ${D.tbl(['Estrutura','Consequência'],[
   ['Nervo laríngeo recorrente','rouquidão, aspiração'],
   ['Nervo frênico','elevação e paralisia do hemidiafragma'],
   ['Plexo braquial e cadeia simpática (tumor de Pancoast, sulco superior)','dor no ombro e na face ulnar do braço, atrofia dos intrínsecos da mão, <b>síndrome de Horner</b> ipsilateral'],
   ['Veia cava superior','<b>síndrome da VCS</b>: edema de face, pescoço e MMSS, pletora, turgência e circulação colateral, cefaleia, piora ao deitar'],
   ['Esôfago','disfagia'],
   ['Pericárdio','derrame, tamponamento, arritmias'],
   ['Pleura e parede','derrame pleural, dor localizada e persistente']])}
  ${D.fig('img/c3-pancoast-rx.jpg','Tumor de Pancoast (P) no ápice direito: atenção ao ápice no RX de todo tabagista com dor no ombro.', CC('CC BY-SA 3.0','Jmarchn'))}
  ${D.fig('img/c3-horner-esq.jpg','Via simpática do olho: hipotálamo → medula (C8–T2, centro cilioespinal) → cadeia simpática → gânglio cervical superior → plexo carotídeo. O tumor de Pancoast lesa o 2º neurônio no ápice pulmonar: <b>ptose leve, miose e anidrose</b> ipsilaterais.', CC('CC BY-SA 3.0','Suraj Rajan'))}
  ${D.fig('img/c3-vcs.jpg','Síndrome da veia cava superior: circulação colateral exuberante no tórax anterior pela obstrução ao retorno venoso.', CC('CC BY-SA 4.0','EMAHkempny'))}
  <h3>Metástases</h3>
  <p>Sítios mais comuns: <b>cérebro</b> (cefaleia, convulsão, déficit focal), <b>ossos</b> (dor, fraturas, hipercalcemia), <b>suprarrenais</b> (geralmente silenciosas), <b>fígado</b>, pulmão contralateral, pericárdio. A ausência de sintomas não exclui: o estadiamento é por imagem.</p>
  <h3>Síndromes paraneoplásicas</h3>
  <p>Manifestações à distância do tumor e das metástases, por <b>hormônios</b> produzidos pelo tumor ou por <b>autoanticorpos</b> com reação cruzada.</p>
  ${D.tbl(['Síndrome','Mecanismo','Tipo típico','Pista clínica'],[
   ['<b>Hipercalcemia humoral</b>','PTHrP (age no receptor do PTH; PTH fica <b>suprimido</b>)','escamoso','poliúria, constipação, confusão, encurtamento do QT'],

   ['<b>Osteoartropatia hipertrófica</b>','fatores de crescimento (VEGF, PDGF) de plaquetas que escapam do filtro pulmonar','adenocarcinoma','baqueteamento + periostite + artralgia'],

  ${D.trap('<p><b>Lambert-Eaton × miastenia gravis</b>: no Lambert-Eaton (pré-sináptico) a força <b>melhora</b> com a repetição e há disautonomia e hiporreflexia; na miastenia (pós-sináptico, anti-receptor de acetilcolina) a força <b>piora</b> com a repetição e a musculatura ocular é acometida cedo.</p>')}

 /* S7 */
 {id:'s7', title:'Investigação: imagem, broncoscopia, biópsia e estadiamento', short:'Investigação', d:['lab','clin','pato'],
  quick: `
  ${D.chain(['RX de tórax','TC de tórax com contraste (+ abdome superior)','Biópsia do sítio mais acessível que estadie mais alto (aqui: <b>linfonodo supraclavicular</b>)','Histologia + imuno-histoquímica + biologia molecular (EGFR, ALK, ROS1, PD-L1)','Estadiamento: PET-CT, RM de crânio','TNM → tratamento'])}
  <ul>
   <li>Linfonodo <b>supraclavicular</b> comprometido = <b>N3</b> → no mínimo estádio <b>IIIB</b>.</li>
   <li>Tratamento, em linhas gerais: I–II → cirurgia; III → quimiorradioterapia (+ imunoterapia de consolidação); IV → terapia sistêmica (alvo, imunoterapia, quimio).</li>
  </ul>
  <div class="widget" data-w="hotspot" data-cfg="c3tc"></div>`,
  deep: `
  <h3>Radiografia de tórax</h3>
  <p>Primeiro exame. Achados possíveis: <b>massa hilar</b> ou peri-hilar, nódulo periférico, <b>atelectasia</b> lobar (o “sinal do S de Golden” quando a atelectasia do lobo superior direito contorna uma massa hilar), derrame pleural, alargamento mediastinal, elevação de hemicúpula diafragmática (frênico), lesões ósseas.</p>
  ${D.fig('img/c3-slide-rx-normal.jpg','RX de tórax normal (material da disciplina), para comparação.', SL)}
  ${D.fig('img/c3-slide-rx-massa.jpg','RX patológico do material: opacidade peri-hilar e de lobo superior à direita, com áreas aeradas de permeio — aspecto de massa central com componente pós-obstrutivo.', SL)}
  <h3>Tomografia</h3>
  <p>A TC com contraste define tamanho, localização, relação com brônquios, vasos, pleura e parede, e linfonodos mediastinais; incluir o <b>abdome superior</b> (fígado e suprarrenais). O <b>PET-CT</b> detecta linfonodos e metástases metabolicamente ativas. <b>RM de crânio</b> para estadiamento cerebral em doença avançada ou candidatos a tratamento curativo.</p>
  <div class="widget" data-w="hotspot" data-cfg="c3tc"></div>
  ${D.fig('img/c3-slide-tc.jpg','Cortes de TC do material da disciplina: processo proliferativo pulmonar.', SL)}
  <h3>Obtendo tecido: “biopsiar o que estadia mais alto”</h3>
  <p>A regra é escolher o sítio <b>mais acessível</b> que, se positivo, defina o <b>estádio mais avançado</b> — diagnóstico e estadiamento num só procedimento. No paciente, o <b>linfonodo supraclavicular</b> palpável cumpre as duas condições (punção ou biópsia excisional). Outras vias: <b>broncoscopia</b> com biópsia, escovado e lavado (tumores centrais), <b>EBUS</b> (ultrassom endobrônquico com punção de linfonodos mediastinais), biópsia transtorácica guiada por TC (periféricos), toracocentese com citologia (derrame).</p>
  ${D.fig('img/c3-broncoscopia.jpg','Broncoscopia: tumor infiltrando e estreitando a luz brônquica (setas). É a imagem endoscópica do “sibilo localizado”.', CC('CC BY-SA 3.0','Wikimedia'))}
  <h3>Do tecido ao tratamento</h3>
  <p>A amostra precisa responder: é câncer? É CPNPC ou CPCP? Qual subtipo (imuno-histoquímica: TTF-1 para adenocarcinoma, p40 para escamoso, marcadores neuroendócrinos para CPCP)? Há <b>alteração acionável</b> (EGFR, ALK, ROS1, BRAF, KRAS G12C…)? Qual a expressão de <b>PD-L1</b> (imunoterapia)?</p>
  <h3>Estadiamento TNM (noções)</h3>
  ${D.tbl(['Componente','Ideia'],[
   ['T','tamanho e invasão local (T1 ≤ 3 cm … T4 &gt; 7 cm ou invasão de mediastino, coração, grandes vasos, traqueia, esôfago, vértebra)'],
   ['N','N1 hilar ipsilateral · N2 mediastinal ipsilateral/subcarinal · <b>N3 contralateral ou supraclavicular</b>'],
   ['M','M1a pleura/pericárdio/pulmão contralateral · M1b metástase única extratorácica · M1c múltiplas']])}
  <p>Com <b>N3</b> e sem metástases, o estádio é <b>IIIB ou IIIC</b> (conforme o T). Se houver M1, estádio IV.</p>
  ${D.tbl(['Estádio (CPNPC)','Estratégia geral'],[
   ['I–II','cirurgia (lobectomia + linfadenectomia); adjuvância conforme o caso'],
   ['III ressecável','tratamento multimodal (quimioimunoterapia neoadjuvante/cirurgia)'],
   ['III irressecável','quimiorradioterapia + imunoterapia de consolidação'],
   ['IV','terapia-alvo se houver alteração acionável; senão imunoterapia ± quimioterapia; cuidados paliativos integrados']])}
  ${D.extra('<p>CPCP é estadiado de forma prática em <b>limitado</b> (cabe num campo de radioterapia) e <b>extenso</b>. Tratamento: quimioterapia com platina + etoposídeo, associada a imunoterapia na doença extensa e a radioterapia na limitada.</p>')}`,
  qs:[
   {q:'No paciente, qual o melhor procedimento inicial para obter diagnóstico histológico?',
    o:['Toracotomia exploradora','Biópsia/punção do linfonodo supraclavicular palpável','Citologia de escarro seriada apenas','PET-CT','Mediastinoscopia de rotina'], a:1, d:['clin','lab'], e:'Sítio acessível que, se positivo, já define N3 — diagnóstico e estadiamento ao mesmo tempo.'},
   {q:'Linfonodo supraclavicular comprometido em câncer de pulmão corresponde a:',
    o:['N1','N2','N3','M1a','M1b'], a:2, d:['lab','clin'], e:'Supraclavicular (ipsi ou contralateral) e mediastinal contralateral = N3.'},
   {q:'Adenocarcinoma de pulmão estádio IV com mutação ativadora de EGFR. Primeira linha preferencial:',
    o:['Radioterapia exclusiva','Inibidor de tirosina-quinase de EGFR (ex.: osimertinibe)','Cirurgia','Observação','Quimioterapia com platina e etoposídeo'], a:1, d:['clin','farmaco'], hard:true, e:'Alteração acionável → terapia-alvo, com maior resposta e sobrevida que quimioterapia.'}
  ]},
 /* S8 */
 {id:'s8', title:'Prevenção, rastreamento e a conversa difícil', short:'Prevenção e comunicação', d:['prev','human'],
  quick: `
  <ul>
   <li><b>Prevenção primária</b>: não começar e <b>parar de fumar</b> (abordagem cognitivo-comportamental + farmacoterapia: reposição de nicotina, bupropiona, vareniclina).</li>
   <li><b>Rastreamento</b> (prevenção secundária): <b>TC de tórax de baixa dose anual</b> para 50–80 anos com <b>≥ 20 maços-ano</b>, fumantes ou que pararam há &lt; 15 anos (USPSTF 2021). Reduz mortalidade (NLST, NELSON). Riscos: falso-positivos, sobrediagnóstico, radiação.</li>
   <li><b>SPIKES</b> para comunicar más notícias: <b>S</b>etting, <b>P</b>ercepção, <b>I</b>nvitation (convite), <b>K</b>nowledge (informação), <b>E</b>moções, <b>S</b>trategy/Summary.</li>
  </ul>
  ${D.pearl('<p>Este paciente <b>não</b> é caso de rastreamento: rastreamento é para <b>assintomáticos</b>. Ele tem sintomas → é <b>investigação diagnóstica</b>.</p>')}`,
  deep: `
  <h3>Prevenção primária: o cigarro</h3>
  <p>O tabagismo responde por cerca de 85% dos casos de câncer de pulmão. O Brasil reduziu muito a prevalência de fumantes com políticas de controle (proibição de propaganda, ambientes livres de fumo, advertências, impostos), mas surgem novos desafios, como os <b>cigarros eletrônicos</b> entre jovens (proibidos para comercialização no país). A cessação tem benefício em qualquer idade e mesmo após o diagnóstico de câncer (melhor resposta ao tratamento, menos complicações).</p>
  ${D.tbl(['Fármaco','Mecanismo','Observação'],[
   ['Terapia de reposição de nicotina (adesivo, goma, pastilha)','agonista nicotínico em dose controlada, sem os tóxicos da fumaça','combinar adesivo (base) + goma/pastilha (fissura)'],
   ['Bupropiona','inibe a recaptação de dopamina e noradrenalina','contraindicada em epilepsia e transtornos alimentares'],
   ['Vareniclina','<b>agonista parcial</b> do receptor nicotínico α4β2: reduz a fissura e bloqueia a recompensa do cigarro','náusea é o efeito mais comum']])}
  ${D.integ('<p><b>Farmacologia:</b> vareniclina é o exemplo clássico de <b>agonista parcial</b> — ativa o receptor o suficiente para aliviar a abstinência e, ocupando-o, impede que a nicotina produza o efeito máximo. Ótimo para a prova de farmacodinâmica.</p>','Integração · Farmacologia')}
  <h3>Rastreamento (prevenção secundária)</h3>
  <p>O <b>NLST</b> (EUA) mostrou redução de cerca de 20% na mortalidade por câncer de pulmão com TC de baixa dose anual em fumantes pesados; o <b>NELSON</b> (Europa), cerca de 24% em homens. A USPSTF (2021) recomenda rastreamento anual para <b>50 a 80 anos</b>, <b>≥ 20 maços-ano</b>, fumantes atuais ou que pararam há <b>menos de 15 anos</b>. No SUS ainda não há programa organizado de rastreamento.</p>
  ${D.tbl(['Problema do rastreamento','Explicação'],[
   ['Falso-positivo','nódulos benignos levam a exames e biópsias (dano, ansiedade)'],
   ['Sobrediagnóstico','detectar câncer indolente que nunca causaria sintomas'],
   ['Viés de antecipação (lead time)','diagnóstico mais cedo parece aumentar a sobrevida sem mudar a data da morte'],
   ['Viés de duração (length time)','rastreamento pega mais os tumores lentos, de melhor prognóstico'],
   ['Radiação','acumulada em exames repetidos']])}
  ${D.integ('<p><b>Medicina Preventiva:</b> rastreamento só vale para população <b>assintomática</b>, doença com fase pré-clínica detectável, teste aceitável e tratamento precoce que mude o desfecho (critérios de Wilson e Jungner). O paciente do caso é sintomático: trata-se de diagnóstico, não de rastreamento.</p>','Integração · Preventiva')}
  <h3>Comunicando o diagnóstico: protocolo SPIKES</h3>
  ${D.tbl(['Etapa','O que fazer com este paciente'],[
   ['<b>S</b> — Setting (ambiente)','sala reservada, sem interrupções, sentado, perguntar se quer alguém junto (é viúvo: quem é sua rede?)'],
   ['<b>P</b> — Percepção','“O que o senhor já entendeu sobre os exames até agora?”'],
   ['<b>I</b> — Convite','“Como o senhor prefere que eu explique os resultados?”'],
   ['<b>K</b> — Conhecimento','aviso prévio (“infelizmente não são boas notícias”), linguagem simples, em pequenos blocos, sem jargão'],
   ['<b>E</b> — Emoções','silêncio, nomear a emoção, validar (“imagino que seja muito difícil ouvir isso”)'],
   ['<b>S</b> — Estratégia e resumo','próximos passos concretos, garantir que não ficará sozinho, combinar retorno']])}
  ${D.pearl('<p><b>Cuidados paliativos precoces</b>, integrados ao tratamento oncológico desde o diagnóstico de doença avançada, melhoraram qualidade de vida e humor — e, no estudo de Temel (2010), até a sobrevida — em câncer de pulmão metastático. Paliativo não é “quando não há mais nada a fazer”.</p>')}`,
  qs:[
   {q:'Segundo a USPSTF (2021), qual destes indivíduos tem indicação de rastreamento com TC de baixa dose?',
    o:['45 anos, 30 maços-ano, fumante','62 anos, 25 maços-ano, parou há 10 anos','70 anos, 15 maços-ano, fumante','58 anos, 40 maços-ano, parou há 20 anos','O paciente do caso'], a:1, d:['prev'], e:'50–80 anos, ≥ 20 maços-ano, fumante ou parou há < 15 anos. O paciente do caso é sintomático (não é rastreamento).'},
   {q:'A vareniclina auxilia a cessação do tabagismo porque é:',
    o:['Antagonista competitivo do receptor nicotínico','Agonista parcial do receptor nicotínico α4β2','Inibidor da MAO','Agonista total opioide','Inibidor da recaptação de serotonina'], a:1, d:['farmaco'], e:'Agonista parcial: alivia a abstinência e reduz o efeito recompensador da nicotina.'},
   {q:'No protocolo SPIKES, perguntar “o que o senhor já sabe sobre seus exames?” corresponde a:',
    o:['Setting','Perception','Invitation','Knowledge','Emotions'], a:1, d:['human'], e:'Avaliar a percepção do paciente antes de informar.'}
  ]}
 ],
