 dq:[
  {q:'Correlacione os achados do exame respiratório do paciente (MV diminuído e sibilos à esquerda, expansibilidade preservada) com a fisiopatologia do tumor e diga como o exame mudaria se o brônquio fosse completamente obstruído.',
   a:'<p>O tumor central estreita <b>parcialmente</b> um brônquio do pulmão esquerdo. O ar, ao passar em alta velocidade pelo segmento estreitado, faz as paredes oscilarem e gera <b>sibilo monofônico, localizado e fixo</b>. Menos ar chega ao parênquima distal, e o <b>murmúrio vesicular diminui</b> do lado esquerdo. Como não há ainda colapso volumoso nem líquido pleural, a <b>expansibilidade é preservada</b>.</p><p>Com <b>obstrução completa</b>, o ar distal é reabsorvido e ocorre <b>atelectasia</b>: redução da expansibilidade, <b>FTV abolido</b> (o brônquio ocluído não transmite a voz), <b>macicez</b> à percussão, <b>MV abolido</b>, e <b>desvio da traqueia e do mediastino para o lado afetado</b> pela perda de volume. Pode haver pneumonia pós-obstrutiva (febre, secreção fétida).</p>',
   k:['Explica sibilo localizado/monofônico pela obstrução parcial','Explica MV diminuído pela redução do fluxo distal','Interpreta expansibilidade preservada (sem colapso/derrame grande)','Descreve atelectasia: FTV abolido, macicez, MV abolido','Cita desvio do mediastino para o lado afetado']},
  {q:'Explique a carcinogênese pulmonar induzida pelo tabaco, das alterações moleculares às morfológicas.',
   a:'<p>Carcinógenos da fumaça (hidrocarbonetos policíclicos como benzo[a]pireno, nitrosaminas como NNK) são ativados pelo citocromo P450 a metabólitos reativos que formam <b>adutos de DNA</b>. Falhas de reparo geram mutações (transversões G→T) em genes como <b>TP53</b> e <b>KRAS</b>, perdas de 3p e 9p (CDKN2A), ativação de telomerase — acúmulo progressivo de alterações (modelo de múltiplas etapas), em todo o epitélio exposto (cancerização de campo).</p><p>Morfologicamente: o epitélio colunar ciliado sofre <b>hiperplasia basal</b> e <b>metaplasia escamosa</b> (adaptação), seguida de <b>displasia</b>, <b>carcinoma in situ</b> e <b>carcinoma invasor</b>. Esse caminho é típico do carcinoma escamoso central; o adenocarcinoma segue via da hiperplasia adenomatosa atípica e do adenocarcinoma in situ.</p>',
   k:['Cita carcinógenos e ativação metabólica (CYP450)','Cita adutos de DNA e mutações (TP53, KRAS)','Menciona modelo de múltiplas etapas/cancerização de campo','Descreve metaplasia escamosa → displasia → CIS → invasor','Diferencia via do adenocarcinoma (bônus)']},

 {id:'s1', title:'A circulação e os determinantes do débito cardíaco', short:'Circulação e débito', d:['fisio'],

  <h3>Frank-Starling</h3>
  ${D.svg(svgStarling,'Curvas de Frank-Starling normal e na IC. Diuréticos movem o paciente para a esquerda (menos congestão); inotrópicos para cima (mais débito).')}
  <p>Mais estiramento do sarcômero aumenta a sobreposição útil de actina e miosina e a sensibilidade ao cálcio → mais força. No coração doente, a curva é <b>achatada e desviada para baixo</b>: o aumento de pré-carga produz pouco ganho de débito e cruza logo o limiar de congestão. Isso explica a lógica do tratamento: <b>diurético</b> desloca o ponto para a esquerda (alivia congestão sem perder muito débito); <b>inotrópico</b> sobe a curva; <b>vasodilatador</b> reduz a pós-carga e também melhora o volume sistólico.</p>
  ${D.pearl('<p>Pulso <b>filiforme</b> e PA de 100/70 (pressão de pulso de 30 mmHg) traduzem volume sistólico baixo. Uma pressão de pulso proporcional (PAS − PAD)/PAS &lt; 25% sugere índice cardíaco baixo; no paciente ≈ 30%, no limite.</p>')}`,

   {q:'Insuficiência do ventrículo direito causa congestão principalmente em:',
    o:['Capilares pulmonares','Veias sistêmicas (jugular, fígado, membros)','Artéria aorta','Átrio esquerdo','Artérias coronárias'], a:1, d:['fisio'], e:'O sangue represa a montante do VD: veias cavas e sistêmicas.'},
   {q:'Segundo a lei de Frank-Starling, no coração insuficiente o aumento da pré-carga:',
    o:['Aumenta muito o débito','Aumenta pouco o débito e favorece a congestão','Não altera nada','Reduz a pressão capilar pulmonar','Aumenta a contratilidade intrínseca'], a:1, d:['fisio'], e:'Curva achatada: pouco ganho de volume sistólico, muita elevação de pressões de enchimento.'},

 {id:'s2', title:'Fisiopatologia: do dano ao remodelamento', short:'Fisiopatologia', d:['fisio','pato'],
  quick: `
  ${D.svg(svgNeuro,'O ciclo vicioso neuro-hormonal.')}
  ${D.tbl(['Tipo','FEVE','Mecanismo'],[
   ['ICFEr (reduzida)','≤ 40%','falha de contração (sistólica), dilatação'],
   ['IC com FE levemente reduzida','41–49%','intermediária'],
   ['ICFEp (preservada)','≥ 50%','falha de relaxamento/enchimento (diastólica), rigidez'],
   ['IC com FE melhorada','era ≤ 40%, subiu ≥ 10 pontos e &gt; 40%','recuperação sob tratamento']])}
  <ul>
   <li><b>Edema</b> na IC = <b>transudato</b>: aumento da pressão hidrostática capilar (forças de Starling), com retenção renal de sódio e água.</li>
   <li><b>Remodelamento</b>: dilatação, hipertrofia excêntrica, fibrose, apoptose — perpetuados por angiotensina II, aldosterona e catecolaminas. Por isso os remédios que <b>bloqueiam</b> esses sistemas prolongam a vida.</li>
  </ul>`,
  deep: `
  <h3>Definição</h3>
  <p>Insuficiência cardíaca é a síndrome clínica em que o coração não consegue fornecer débito adequado às necessidades dos tecidos, ou só o faz à custa de <b>pressões de enchimento elevadas</b>. As duas faces — <b>baixo débito</b> e <b>congestão</b> — aparecem inteiras neste paciente.</p>
  <h3>O ciclo neuro-hormonal</h3>
  ${D.svg(svgNeuro,'A ativação neuro-hormonal começa compensatória e se torna o motor da progressão.')}
  <p>Quando o débito cai, barorreceptores e o aparelho justaglomerular “leem” uma hipovolemia que não existe e disparam três sistemas:</p>
  <ul>
   <li><b>Simpático</b>: taquicardia e inotropismo (compensam no início), vasoconstrição (aumenta a pós-carga), arritmias, e toxicidade direta (sobrecarga de cálcio, apoptose) — a causa da pele fria e sudoreica do paciente.</li>
   <li><b>SRAA</b>: angiotensina II (vasoconstrição, sede, hipertrofia e fibrose) e aldosterona (retenção de Na⁺ e água, perda de K⁺, fibrose miocárdica e vascular).</li>
   <li><b>ADH</b>: retenção de água livre → hiponatremia (marcador de gravidade).</li>
  </ul>
  <p>Contrarregulação: o miocárdio estirado libera <b>peptídeos natriuréticos</b> (ANP, BNP), que promovem natriurese e vasodilatação — por isso o BNP serve para diagnóstico, e inibir sua degradação (neprilisina) é estratégia terapêutica (sacubitril).</p>
  <h3>Remodelamento</h3>
  <p>Mudança de tamanho, forma e função do ventrículo: perda de miócitos (necrose, apoptose), hipertrofia dos remanescentes, <b>fibrose intersticial</b>, dilatação e esfericidade da câmara. O VE dilatado aumenta a tensão de parede (Laplace) e o consumo de O₂, e pode gerar insuficiência mitral funcional. O tratamento que <b>muda a história natural</b> é justamente o que bloqueia esses sistemas (IECA/BRA/INRA, betabloqueador, antagonista mineralocorticoide) — e não os diuréticos, que só aliviam sintomas.</p>
  <h3>FEVE: os fenótipos</h3>
  ${D.fig('img/c4-slide-feve.jpg','Classificação por fração de ejeção do VE (definição universal, Bozkurt 2021).', SL)}
  <p>Na <b>ICFEr</b>, o problema principal é a contração (sístole): ventrículo dilatado e hipocontrátil — é o fenótipo da cardiomiopatia chagásica. Na <b>ICFEp</b>, a contração é preservada, mas o ventrículo é rígido e relaxa mal (idosos, mulheres, HAS, obesidade, diabetes, fibrilação atrial): pequenas variações de volume elevam muito a pressão diastólica.</p>
  <h3>Por que há edema? (Patologia I)</h3>
  <p>As <b>forças de Starling</b> determinam o movimento de líquido no capilar: pressão hidrostática capilar (empurra para fora) × pressão oncótica plasmática (puxa para dentro), modulada pela permeabilidade e pela drenagem linfática. Na IC, a <b>pressão hidrostática venocapilar aumenta</b> e o rim retém sódio e água; o líquido extravasado é pobre em proteínas e células — <b>transudato</b>. Quando a filtração supera a capacidade linfática surge edema intersticial (linhas de Kerley) e depois alveolar.</p>
  ${D.integ('<p>Transudato (IC, cirrose, nefrose) × exsudato (inflamação, infecção, neoplasia): a diferença está no mecanismo — pressão × permeabilidade. Critérios de Light no ' + 'Leito 06.</p>','Integração · Patologia')}
  ${D.trap('<p>Ascite e edema na IC direita com <b>proteína baixa</b> no líquido = transudato. Mas na ascite cardíaca o gradiente soro-ascite de albumina é alto (≥ 1,1) e a proteína do líquido costuma ser relativamente <b>alta</b> (≥ 2,5 g/dL), porque os sinusoides hepáticos são permeáveis — diferencia de cirrose.</p>')}`,
  qs:[
   {q:'Qual hormônio, ativado na IC, causa retenção de sódio e fibrose miocárdica, e é bloqueado pela espironolactona?',
    o:['ANP','Aldosterona','ADH','Cortisol','Insulina'], a:1, d:['fisio','farmaco'], e:'Aldosterona age no receptor mineralocorticoide; espironolactona é seu antagonista.'},
   {q:'O edema pulmonar da IC é um transudato porque decorre principalmente de:',
    o:['Aumento da permeabilidade capilar por inflamação','Aumento da pressão hidrostática capilar','Redução da drenagem linfática por tumor','Hipoalbuminemia grave isolada','Lesão alveolar difusa'], a:1, d:['pato','fisio'], e:'Pressão venocapilar elevada empurra líquido pobre em proteínas para o interstício.'},
   {q:'IC com FEVE de 45% é classificada como:',
    o:['ICFEr','IC com FE levemente reduzida','ICFEp','IC com FE melhorada','Normal'], a:1, d:['clin'], e:'41–49%.'}
  ]},

 {id:'s3', title:'Doença de Chagas: o parasita e a cardiomiopatia', short:'Chagas', d:['micro','pato','prev'],
  quick: `
  <ul>
   <li>Agente: <b><i>Trypanosoma cruzi</i></b> (protozoário flagelado). Vetor: <b>triatomíneo (barbeiro)</b> — transmissão pelas <b>fezes</b> depositadas na picada.</li>
   <li>Outras vias: <b>oral</b> (açaí, caldo de cana contaminados — surtos na Amazônia), transfusional, <b>congênita</b>, transplante.</li>
   <li>Formas: <b>tripomastigota</b> (sangue, infectante), <b>amastigota</b> (intracelular, se multiplica no miócito), epimastigota (no inseto).</li>
   <li>Fase aguda (chagoma, <b>sinal de Romaña</b>) → <b>forma indeterminada</b> (maioria) → em 20–30%, <b>cardíaca</b> e/ou <b>digestiva</b> (megaesôfago, megacólon) décadas depois.</li>
   <li><b>Cardiomiopatia chagásica</b>: miocardite crônica fibrosante, <b>aneurisma apical</b>, <b>BRD + BDAS</b>, arritmias ventriculares, morte súbita, tromboembolismo.</li>
  </ul>
  ${D.fig('img/c4-tcruzi.jpg','Tripomastigotas de <i>T. cruzi</i> em esfregaço de sangue (Giemsa): forma em “C”, flagelo e cinetoplasto volumoso.', 'Wikimedia Commons · CDC · Domínio público')}`,
  deep: `
  <h3>Microbiologia e ciclo</h3>
  <p><i>Trypanosoma cruzi</i> é um protozoário flagelado da ordem Kinetoplastida (o <b>cinetoplasto</b> é o DNA mitocondrial concentrado, visível como um ponto junto ao flagelo). Formas:</p>
  ${D.tbl(['Forma','Onde','Papel'],[
   ['<b>Tripomastigota metacíclico</b>','fezes do barbeiro','infecta o hospedeiro'],
   ['<b>Amastigota</b>','dentro das células (miócito, macrófago, neurônio entérico)','multiplica-se por divisão binária; forma “ninhos”'],
   ['<b>Tripomastigota sanguíneo</b>','sangue','dissemina; é ingerido pelo barbeiro'],
   ['<b>Epimastigota</b>','intestino do inseto','multiplica-se no vetor']])}
  ${D.fig('img/c4-triatoma.jpg','<i>Triatoma infestans</i>, o “barbeiro” domiciliado clássico. Pica à noite, geralmente no rosto, e defeca durante o repasto; o paciente coça e introduz o parasita na pele ou na conjuntiva.', CC('CC BY 4.0','Catálogo de triatomíneos argentinos'))}
  <p><b>Transmissão</b>: vetorial (casas de pau a pique, zona rural — o paciente mora em zona rural), <b>oral</b> (hoje a principal via de casos agudos no Brasil, em surtos na região Norte), transfusional (controlada pela triagem sorológica), <b>congênita</b> (por isso rastreia-se a gestante em área endêmica), transplante e acidente laboratorial. O Brasil foi certificado em 2006 pela interrupção da transmissão vetorial pelo <i>T. infestans</i>, mas outras espécies e a via oral mantêm casos.</p>
  <h3>História natural</h3>
  <p><b>Fase aguda</b> (semanas): muitas vezes oligossintomática; febre, linfadenopatia, hepatoesplenomegalia; porta de entrada visível (<b>chagoma de inoculação</b> na pele ou <b>sinal de Romaña</b> — edema bipalpebral unilateral indolor); raramente miocardite aguda ou meningoencefalite. Parasitemia alta: diagnóstico por <b>exame direto</b> (gota espessa, esfregaço).</p>
  <p><b>Fase crônica</b>: parasitemia baixa → diagnóstico por <b>sorologia</b> (duas técnicas diferentes reagentes, ex.: ELISA e imunofluorescência). A maioria fica na <b>forma indeterminada</b> (sorologia positiva, ECG e RX normais). Ao longo de 10–30 anos, cerca de 20–30% desenvolvem a <b>forma cardíaca</b> e uma parcela, a <b>forma digestiva</b> (denervação dos plexos mioentéricos → megaesôfago e megacólon). O paciente teve a fase aguda há 30 anos — cronologia típica.</p>
  ${D.fig('img/c4-megaesofago.jpg','Megaesôfago chagásico ao esofagograma: destruição dos neurônios do plexo mioentérico (Auerbach) → acalasia secundária, dilatação e disfagia.', 'Wikimedia Commons · Domínio público')}
  <h3>Patogênese da cardiomiopatia chagásica</h3>
  <p>Quatro mecanismos se somam: (1) <b>persistência do parasita</b> em baixos níveis, mantendo inflamação; (2) <b>autoimunidade</b> por mimetismo molecular entre antígenos do parasita e proteínas cardíacas; (3) <b>disautonomia</b> por destruição de neurônios parassimpáticos; (4) <b>alterações microvasculares</b> (isquemia focal, espasmo). Resultado: <b>miocardite crônica linfocitária focal e fibrosante</b>, com fibrose que atinge o sistema de condução e regiões típicas.</p>
  ${D.tbl(['Achado','Explicação'],[
   ['<b>Aneurisma apical</b> do VE','afinamento fibroso da ponta (região de microcirculação terminal); sítio de trombo e de circuitos de taquicardia ventricular'],
   ['<b>BRD + bloqueio divisional anterossuperior esquerdo</b>','fibrose do ramo direito e do fascículo anterior — a combinação eletrocardiográfica mais típica'],
   ['Arritmias ventriculares e <b>morte súbita</b>','cicatrizes como substrato de reentrada; principal causa de morte'],
   ['Bradiarritmias e BAV','fibrose do sistema de condução'],
   ['Tromboembolismo (AVC, TEP)','aneurisma, dilatação, FA'],
   ['Dor torácica atípica','isquemia microvascular com coronárias normais']])}
  ${D.pearl('<p>Um paciente jovem, de zona rural, com IC, <b>arritmia</b>, <b>BRD + BDAS</b> e coronárias normais: pense em Chagas antes de qualquer coisa.</p>')}
  ${D.integ('<p><b>Medicina Preventiva e Humanização:</b> doença negligenciada, ligada à pobreza e à moradia. Cuidado integral inclui investigar familiares (filhos de mãe infectada), orientar a não doar sangue, notificar casos agudos (doença de notificação compulsória imediata) e apoiar a melhoria habitacional.</p>','Integração')}
  ${D.extra('<p><b>Benznidazol</b> (ou nifurtimox) é indicado na fase aguda, na congênita, em crianças e adolescentes e em adultos na fase crônica sem cardiopatia avançada. No estudo BENEFIT (2015), em cardiomiopatia já estabelecida, reduziu a parasitemia mas <b>não</b> reduziu eventos clínicos.</p>')}`,
  qs:[
   {q:'Forma de <i>T. cruzi</i> que se multiplica dentro dos miócitos:',
    o:['Tripomastigota metacíclico','Epimastigota','Amastigota','Promastigota','Esporozoíto'], a:2, d:['micro'], e:'Amastigotas intracelulares formam “ninhos” e se dividem por fissão binária.'},
   {q:'O achado eletrocardiográfico mais característico da cardiopatia chagásica crônica é:',
    o:['Bloqueio de ramo esquerdo isolado','Bloqueio de ramo direito associado a bloqueio divisional anterossuperior esquerdo','Onda Q em parede inferior','QT curto','Onda delta'], a:1, d:['lab','pato'], e:'Fibrose do ramo direito e do fascículo anterior.'},
   {q:'Na fase crônica da doença de Chagas, o diagnóstico laboratorial é feito por:',
    o:['Gota espessa','Duas sorologias por técnicas diferentes','Hemocultura apenas','Biópsia endomiocárdica obrigatória','Xenodiagnóstico como primeira escolha'], a:1, d:['lab','micro'], e:'Parasitemia baixa na fase crônica; sorologia (ex.: ELISA + IFI).'}
  ]},
 /* S4 */
 {id:'s4', title:'Sinais e sintomas: o porquê de cada um (e o exame do paciente)', short:'Sinais e sintomas', d:['semio','prope','fisio'],
  quick: `
  ${D.tbl(['Sinal/sintoma','Mecanismo'],[
   ['Dispneia aos esforços → em repouso','congestão pulmonar reduz complacência; hipoxemia; baixo débito muscular'],
   ['<b>Ortopneia</b>','no decúbito, sangue dos MMII e do abdome volta ao tórax → ↑ pressão capilar pulmonar'],
   ['<b>DPN</b>','reabsorção noturna do edema periférico + menor drive respiratório no sono'],
   ['Crepitações','transudato nos alvéolos'],
   ['<b>Turgência jugular</b>, refluxo hepatojugular','pressão venosa central elevada'],
   ['Hepatomegalia, ascite, edema','congestão sistêmica + retenção de Na⁺'],
   ['B3','enchimento rápido em ventrículo dilatado e com pressão alta'],
   ['Pele fria, úmida, cianose, enchimento lento, pulso filiforme','baixo débito + vasoconstrição simpática']])}
  ${D.box('core','Critérios de Framingham (2 maiores ou 1 maior + 2 menores)','<p><b>Maiores:</b> DPN · turgência jugular · crepitações · cardiomegalia · edema agudo de pulmão · B3 · PVC &gt; 16 cmH₂O · refluxo hepatojugular · perda &gt; 4,5 kg em 5 dias com tratamento.<br><b>Menores:</b> edema de tornozelos · tosse noturna · dispneia aos esforços · hepatomegalia · derrame pleural · CV ↓ 1/3 · FC ≥ 120.</p>')}
  <div class="widget" data-w="pulmao" data-cfg="c4"></div>`,
  deep: `
  <h3>Cada sintoma tem um mecanismo</h3>
  <h4>Dispneia, ortopneia e DPN</h4>
  <p>A pressão capilar pulmonar elevada causa edema intersticial que <b>enrijece o pulmão</b> (mais trabalho respiratório), estimula receptores J justacapilares e, ao inundar alvéolos, causa <b>hipoxemia</b> (shunt). No <b>decúbito</b>, cerca de 500 mL de sangue migram dos membros e vísceras para o tórax: o ventrículo doente não acomoda o volume extra e a pressão capilar sobe — <b>ortopneia</b> (o paciente dorme com vários travesseiros ou sentado). Na <b>DPN</b>, após 1–2 horas deitado o edema periférico é reabsorvido e o sono reduz a resposta respiratória: o paciente acorda sufocado e melhora ao sentar.</p>
  <h4>Turgência jugular</h4>
  <p>A veia jugular interna funciona como um <b>manômetro do átrio direito</b>. Paciente a 45°, mede-se a altura do topo da coluna pulsátil acima do ângulo de Louis; somando ~5 cm (distância até o AD) estima-se a PVC. Normal: até 3–4 cm acima do ângulo (PVC ≤ 8 cmH₂O). O <b>refluxo hepatojugular</b> (compressão do hipocôndrio direito por 10 s aumenta a jugular ≥ 3 cm e mantém) indica que o VD não acomoda o retorno aumentado.</p>
  ${D.fig('img/c4-turgencia.jpg','Turgência jugular externa evidente em paciente com IC grave e hipertensão pulmonar.', CC('CC BY-SA 3.0','Ferencga'))}
  <h4>Edema, hepatomegalia e ascite</h4>
  <p>Pressão venosa sistêmica alta + retenção de sódio. O edema é <b>gravitacional</b> (tornozelos no paciente que deambula, região sacral no acamado), <b>mole e com cacifo</b> (sinal de Godet). A congestão hepática aumenta o fígado (doloroso à palpação na congestão aguda pela distensão da cápsula de Glisson) e pode causar ascite.</p>
  ${D.fig('img/c4-cacifo.jpg','Edema com cacifo (sinal de Godet): a pressão digital desloca o líquido intersticial e deixa uma depressão que demora a desaparecer.', CC('CC BY-SA 3.0','James Heilman, MD'))}
  <h4>B3</h4>
  <p>No enchimento rápido, o sangue entra num ventrículo dilatado e com pressão diastólica alta; a desaceleração brusca gera a B3 (“galope ventricular”). Em adultos, é um dos sinais mais específicos de disfunção sistólica.</p>
  <div class="aud-grid">
   ${D.audio('audio/third-heart-sound.mp3','B3','galope protodiastólico')}
   ${D.audio('audio/summation-gallop.mp3','Galope de soma','B3 + B4 fundidas na taquicardia')}
   ${D.audio('audio/crackles.mp3','Crepitações','congestão alveolar')}
  </div>
  <p class="credit mono" style="font-size:11px;color:var(--ink-faint)">${AUD}</p>
  <h4>Baixo débito</h4>
  <p>Pele <b>fria, pálida e úmida</b> (vasoconstrição e sudorese simpáticas), <b>cianose</b> periférica (maior extração de O₂ no sangue lento), <b>enchimento capilar &gt; 3 s</b>, <b>pulso filiforme</b>, PA com pressão de pulso estreita, oligúria, confusão mental.</p>
  <h3>O exame do paciente, achado por achado</h3>
  <div class="widget" data-w="pulmao" data-cfg="c4"></div>
  <ul>
   <li><b>Crepitações em todo o tórax, SatO₂ 89%, FR 30</b> → edema pulmonar avançado.</li>
   <li><b>FTV e sons respiratórios diminuídos difusamente</b> → edema de parede, derrame pleural e hipoventilação podem contribuir.</li>
   <li><b>“Timpanismo” à percussão</b> → <b>dado discordante</b>. Congestão e derrame dão <b>macicez</b> nas bases; timpanismo sugeriria pneumotórax. Se houvesse hiperinsuflação por enfisema (ex-tabagista), o termo correto seria <b>hipersonoridade</b>. Em prova, questione o dado e reexamine — é assim na vida real.</li>
   <li><b>Bulhas hipofonéticas</b> → baixa contratilidade; considere também <b>derrame pericárdico</b> (Chagas, hipotireoidismo) e edema de parede.</li>
   <li><b>Bulhas arrítmicas</b> → extrassístoles ventriculares frequentes ou fibrilação atrial (ECG define).</li>
   <li><b>Ictus palpável</b> → avaliar se desviado e difuso (dilatação do VE).</li>
  </ul>
  ${D.box('core','Critérios de Framingham — o paciente','<p>Maiores presentes: turgência jugular, crepitações, cardiomegalia (RX), possível DPN. Menores: edema de MMII, hepatomegalia, dispneia. <b>Diagnóstico clínico de IC confirmado com folga.</b></p>')}`,
  qs:[
   {q:'A ortopneia na IC esquerda resulta principalmente de:',
    o:['Fadiga diafragmática','Aumento do retorno venoso ao tórax no decúbito, elevando a pressão capilar pulmonar','Broncoespasmo noturno','Apneia do sono','Ansiedade'], a:1, d:['fisio','semio'], e:'Redistribuição de volume para o tórax em decúbito.'},
   {q:'Para estimar a pressão venosa central pela jugular, o paciente deve estar:',
    o:['Em decúbito zero','Com cabeceira a 45° e cabeça levemente rodada para o lado oposto','Sentado a 90° com Valsalva','Em Trendelenburg','Em pé'], a:1, d:['prope'], e:'A 45°, mede-se a coluna acima do ângulo de Louis (+5 cm = PVC estimada).'},
   {q:'No paciente, “timpanismo à percussão” difuso com crepitações e congestão deve ser interpretado como:',
    o:['Achado típico de edema pulmonar','Dado discordante: congestão/derrame produzem macicez; reexaminar e considerar outra causa','Prova de derrame pleural','Sinal de consolidação','Achado normal'], a:1, d:['semio'], hard:true, e:'Timpanismo = ar livre (pneumotórax); hiperinsuflação dá hipersonoridade. Congestão e derrame dão macicez.'}
  ]},
 /* S5 */
 {id:'s5', title:'Patologia da congestão: pulmão, fígado e coração', short:'Patologia', d:['pato'],
  quick: `
  ${D.tbl(['Órgão','Congestão aguda','Congestão crônica'],[
   ['<b>Pulmão</b>','capilares distendidos, edema alveolar','septos espessados e fibrosados, <b>siderófagos</b> (“células da insuficiência cardíaca”) → induração parda'],
   ['<b>Fígado</b>','dilatação de sinusoides centrolobulares','<b>fígado em noz-moscada</b>: congestão/necrose centrolobular (zona 3) + periferia preservada; tardiamente, fibrose (“cirrose cardíaca”)'],
   ['<b>Baço</b>','—','esplenomegalia congestiva'],
   ['<b>Coração chagásico</b>','—','miocardite linfocitária focal, fibrose, aneurisma apical, trombo mural']])}
  ${D.fig('img/c4-nozmoscada.jpg','Fígado em noz-moscada: áreas centrolobulares escuras (congestão e necrose) alternando com periferia lobular clara.', CC('CC BY 3.0','Fortea et al.'))}`,
  deep: `
  <h3>Hiperemia × congestão</h3>
  <p><b>Hiperemia</b> é processo <b>ativo</b>: dilatação arteriolar aumenta o fluxo (tecido vermelho e quente — inflamação, exercício). <b>Congestão</b> é <b>passiva</b>: o sangue não consegue sair pelo lado venoso (tecido azulado/cianótico). A IC é a causa clássica de congestão passiva sistêmica (VD) e pulmonar (VE).</p>
  <h3>Pulmão</h3>
  <p>Na <b>congestão aguda</b>, capilares alveolares ingurgitados, edema intersticial e depois alveolar (material róseo, homogêneo, na luz). Na <b>crônica</b>, micro-hemorragias levam hemácias aos alvéolos; os macrófagos fagocitam e degradam a hemoglobina, acumulando <b>hemossiderina</b> (pigmento castanho-dourado, azul na coloração de Perls) — são os <b>siderófagos</b>, chamados “<b>células da insuficiência cardíaca</b>”. Septos espessados e fibrosados dão ao pulmão o aspecto de <b>induração parda</b>.</p>
  ${D.fig('img/c4-siderofago.jpg','Congestão pulmonar crônica: siderófago (seta) — macrófago alveolar carregado de hemossiderina, a “célula da insuficiência cardíaca”.', CC('CC0','Mikael Häggström'))}
  <h3>Fígado</h3>
  <p>A veia centrolobular é o ponto mais distante da oferta arterial e o primeiro a sofrer com o refluxo venoso. Os hepatócitos da <b>zona 3</b> (centrolobular) sofrem hipóxia, atrofiam e necrosam; a periferia (zona 1, perto do espaço porta) fica preservada, às vezes com esteatose. O corte mostra o padrão em <b>noz-moscada</b>. Na IC prolongada, a fibrose em ponte entre veias centrais constitui a “cirrose cardíaca”. Clinicamente: hepatomegalia dolorosa, aumento de bilirrubina e de transaminases (na “hepatite isquêmica” do baixo débito, as transaminases podem passar de 1.000).</p>
  ${D.fig('img/c4-hepatopatia.jpg','Hepatopatia congestiva (HE): sinusoides centrolobulares dilatados e repletos de hemácias, com atrofia das traves de hepatócitos.', CC('CC BY-SA 3.0','Nephron'))}
  ${D.integ('<p><b>Patologia I:</b> necrose centrolobular hepática é necrose <b>coagulativa</b> por hipóxia. O mesmo padrão zonal aparece no choque.</p>','Integração')}
  <h3>Coração chagásico</h3>
  <p>Macroscopia: <b>cardiomegalia</b> com dilatação das quatro câmaras, paredes de espessura normal ou afinadas, <b>aneurisma de ponta</b> do VE (afinamento fibroso “em dedo de luva”) e <b>trombos murais</b>. Microscopia: <b>miocardite crônica</b> com infiltrado linfo-histiocitário focal, miocitólise, <b>fibrose intersticial e de substituição</b> difusa (inclusive no sistema de condução), raros ninhos de amastigotas, e lesão de neurônios dos gânglios cardíacos (ganglionite).</p>
  ${D.integ('<p><b>Patologia I:</b> fibrose = reparo por tecido conjuntivo após perda de células sem capacidade de regeneração (miócitos são células permanentes). A cicatriz não contrai e conduz mal — origem da IC e das arritmias.</p>','Integração')}`,
  qs:[
   {q:'Macrófagos alveolares com pigmento castanho, Perls positivo, em paciente com IC crônica, são:',
    img:'img/c4-siderofago.jpg',
    o:['Células epitelioides','Siderófagos (“células da insuficiência cardíaca”)','Células de Anitschkow','Células de Langhans','Pneumócitos tipo II'], a:1, d:['pato'], e:'Hemossiderina de micro-hemorragias por congestão crônica.'},
   {q:'O padrão em “noz-moscada” do fígado na IC direita reflete:',
    o:['Esteatose difusa','Congestão e necrose centrolobular (zona 3) com periferia preservada','Inflamação portal','Colestase','Granulomas'], a:1, d:['pato'], e:'A zona 3 é a mais vulnerável à hipóxia e ao refluxo venoso.'},

    o:['É ativa, por dilatação arteriolar','É passiva, por dificuldade de drenagem venosa','Ocorre só na inflamação','Deixa o tecido quente e vermelho vivo','Não ocorre na IC'], a:1, d:['pato'], e:'Congestão é passiva (venosa); hiperemia é ativa (arterial).'}
  ]},

 {id:'s6', title:'Exames: radiografia, ECG, peptídeos natriuréticos e ecocardiograma', short:'Exames', d:['lab'],
  quick: `
  ${D.tbl(['Exame','Na IC / no caso'],[
   ['<b>RX de tórax</b>','<b>cardiomegalia</b> (ICT &gt; 0,5), <b>cefalização</b>, hilos congestos, <b>linhas B de Kerley</b>, edema alveolar, <b>derrame pleural</b>'],
   ['<b>BNP / NT-proBNP</b>','elevados (BNP &gt; 100 pg/mL; NT-proBNP &gt; 300 pg/mL na IC aguda); ajudam a separar dispneia cardíaca de pulmonar'],
   ['<b>ECG</b>','no Chagas: <b>BRD + BDAS</b>, extrassístoles ventriculares, FA, BAV, áreas eletricamente inativas'],
   ['<b>Ecocardiograma</b>','FEVE, dilatação, <b>aneurisma apical</b>, trombo, pressões, valvas'],
   ['Laboratório','troponina, creatinina/ureia, <b>Na⁺ e K⁺</b> (diurético + IECA + espironolactona!), hemograma, TSH, sorologia para Chagas']])}
  <div class="widget" data-w="hotspot" data-cfg="c4rx"></div>`,
  deep: `
  <h3>Radiografia de tórax: a sequência da congestão</h3>
  ${D.tbl(['Pressão capilar pulmonar (aprox.)','Achado'],[
   ['≈ 12–18 mmHg','<b>cefalização</b> (redistribuição para os ápices)'],
   ['≈ 18–25 mmHg','<b>edema intersticial</b>: linhas B de Kerley, espessamento peribrônquico, hilos borrados'],
   ['&gt; 25 mmHg','<b>edema alveolar</b>: opacidades peri-hilares em “asa de borboleta”'],
   ['qualquer fase','<b>derrame pleural</b> (mais à direita ou bilateral), cardiomegalia']])}
  <div class="widget" data-w="hotspot" data-cfg="c4rx"></div>
  ${D.fig('img/c4-congestao-rx.jpg','Radiografia anotada de IC: cardiomegalia, cefalização, linhas de Kerley e derrame pleural.', CC('CC0','Mikael Häggström'))}
  ${D.fig('img/c4-kerley.jpg','Linhas B de Kerley (setas): septos interlobulares espessados por edema, perpendiculares à pleura nas bases.', CC('CC0','Mikael Häggström'))}
  <h3>ECG</h3>
  <p>Quase nunca é normal na ICFEr. No Chagas, procure a combinação <b>bloqueio de ramo direito</b> (rSR’ em V1, QRS ≥ 120 ms, S alargada em DI e V6) + <b>bloqueio divisional anterossuperior esquerdo</b> (eixo &lt; −45°, rS em DII, DIII e aVF), além de extrassístoles ventriculares polimórficas, fibrilação atrial, bradiarritmias e BAV.</p>
  ${D.fig('img/c4-brd.jpg','Padrão do bloqueio de ramo direito: rSR’ (“orelhas de coelho”) em V1 e S larga em V6/DI.', CC('CC0','A. Rad / Mrmw'))}
  <h3>Peptídeos natriuréticos</h3>
  <p>O <b>BNP</b> (e o fragmento inerte <b>NT-proBNP</b>) é liberado pelo miocárdio ventricular estirado. Valores baixos praticamente excluem IC aguda como causa da dispneia (alto valor preditivo negativo). Aumentam também com idade, insuficiência renal, FA e TEP; obesidade reduz. O <b>sacubitril</b> eleva o BNP (inibe sua degradação) — nesses pacientes, use o NT-proBNP para seguimento.</p>
  <h3>Ecocardiograma</h3>
  <p>Exame central: FEVE (define o fenótipo), diâmetros, alterações segmentares (no Chagas, acinesia inferolateral e <b>aneurisma apical</b>), <b>trombo</b>, função do VD, pressões pulmonares, valvas (insuficiência mitral funcional), pericárdio.</p>
  <h3>Laboratório que muda conduta</h3>
  <ul>
   <li><b>Potássio</b>: furosemida espolia K⁺; enalapril e espironolactona retêm K⁺. A combinação exige monitorização (risco de hipo e hipercalemia, ambas arritmogênicas).</li>
   <li><b>Sódio</b>: hiponatremia (ADH) indica gravidade.</li>
   <li><b>Função renal</b>: síndrome cardiorrenal (baixo débito + congestão renal).</li>
   <li><b>Troponina</b>: a dor torácica de 2 dias exige excluir síndrome coronariana; na IC descompensada, pequenas elevações são comuns.</li>
   <li><b>TSH</b>: o paciente usa levotiroxina — hipo ou hipertireoidismo (excesso de reposição) descompensam a IC.</li>
  </ul>`,
  qs:[
   {q:'Linhas B de Kerley na radiografia indicam:',
    o:['Edema intersticial por pressão capilar pulmonar elevada','Pneumonia lobar','Pneumotórax','Fibrose apical por TB','Atelectasia'], a:0, d:['lab'], e:'Septos interlobulares espessados por edema/linfáticos distendidos.'},

  ]},

  deep: `
  <h3>NYHA: sintomas</h3>
  ${D.fig('img/c4-slide-nyha.jpg','Classificação funcional da New York Heart Association.', SL)}
  <p>Mede a <b>limitação funcional</b> e pode melhorar ou piorar com o tratamento. O paciente, dispneico em repouso, está em <b>classe IV</b>.</p>
  <h3>Estágios A–D: estrutura</h3>
  ${D.tbl(['Estágio','Definição','Exemplo'],[
   ['A','risco de IC, sem doença estrutural','HAS, diabetes, sorologia positiva para Chagas na forma indeterminada'],
   ['B','doença estrutural, sem sintomas','disfunção do VE assintomática'],
   ['C','doença estrutural com sintomas atuais ou prévios','a maioria dos pacientes tratados'],
   ['D','IC avançada refratária','candidatos a transplante, suporte circulatório, paliação']])}
  <p>Os estágios só avançam — por isso são úteis para prevenção (agir em A e B).</p>
  <h3>Perfis hemodinâmicos de Stevenson</h3>
  <p>Na IC aguda, a beira-leito responde a duas perguntas: <b>está congesto?</b> (ortopneia, jugular, edema, estertores, B3, refluxo hepatojugular) e <b>está bem perfundido?</b> (extremidades, pressão de pulso, sonolência, oligúria, PA). As respostas definem o perfil e orientam o tratamento.</p>
  ${D.svg(svgStev,'Perfis A, B, L e C. O paciente está no C.')}
  <div class="widget" data-w="stevenson"></div>
  ${D.pearl('<p>O perfil é dinâmico: um paciente C tratado com inotrópico e diurético deve migrar para B e depois A. Um B que recebe diurético demais pode virar L.</p>')}`,

 {id:'s8', title:'Tratamento e cuidado integral', short:'Tratamento', d:['farmaco','clin','human'],
  quick: `
  <h4>Agora (perfil C)</h4>
  <ul><li>O₂/VNI conforme saturação e esforço; monitorização; <b>inotrópico</b> (dobutamina) para restaurar perfusão; <b>diurético de alça IV</b> após melhora da perfusão; tratar a causa da descompensação (arritmia, infecção, isquemia, má adesão, tireoide); <b>não iniciar betabloqueador</b> agora.</li></ul>
  <h4>Depois (ICFEr crônica): os 4 pilares que reduzem mortalidade</h4>
  ${D.tbl(['Pilar','Exemplos','Paciente'],[
   ['IECA / BRA / <b>INRA</b> (sacubitril-valsartana)','enalapril, losartana, sacubitril-valsartana','usa enalapril → considerar trocar por INRA'],
   ['<b>Betabloqueador</b>','carvedilol, bisoprolol, succinato de metoprolol','<b>falta</b> → iniciar após estabilizar'],
   ['<b>Antagonista mineralocorticoide</b>','espironolactona','usa'],
   ['<b>iSGLT2</b>','dapagliflozina, empagliflozina','<b>falta</b> → associar']])}
  <p>Diurético alivia sintomas (não reduz mortalidade). No Chagas: <b>amiodarona</b> para arritmias ventriculares, <b>CDI</b> em indicações, <b>anticoagulação</b> se trombo, FA ou embolia.</p>`,
  deep: `
  <h3>Fase aguda: perfil C</h3>
  <ol>
   <li><b>Suporte</b>: cabeceira elevada, O₂ para SatO₂ ≥ 90–92%, ventilação não invasiva se desconforto (reduz pré e pós-carga e o trabalho respiratório), monitorização, acesso venoso, diurese.</li>
   <li><b>Restaurar perfusão</b>: <b>dobutamina</b> (agonista β1: ↑ AMPc → ↑ cálcio intracelular → ↑ contratilidade); alternativas: milrinona (inibidor da PDE3), levosimendana (sensibilizador de cálcio). Vasopressor (noradrenalina) se hipotensão grave.</li>
   <li><b>Descongestionar</b>: furosemida IV (dose maior que a domiciliar), monitorando diurese, creatinina e K⁺.</li>
   <li><b>Gatilho</b>: arritmia (FA, TV), isquemia, infecção, embolia, má adesão (sal, água, remédios), álcool, disfunção tireoidiana, AINEs.</li>
   <li><b>Betabloqueador</b>: não iniciar em choque/baixo débito; em quem já usa, reduzir ou suspender temporariamente conforme a gravidade.</li>
  </ol>
  <h3>Fase crônica: terapia que muda a história natural (ICFEr)</h3>
  ${D.tbl(['Classe','Mecanismo','Cuidados'],[
   ['<b>IECA</b> (enalapril) / <b>BRA</b> / <b>INRA</b> (sacubitril-valsartana)','bloqueiam o SRAA (e o INRA ainda inibe a neprilisina, ↑ peptídeos natriuréticos)','hipotensão, hipercalemia, piora renal; IECA → tosse e angioedema (bradicinina); 36 h de intervalo entre IECA e INRA'],
   ['<b>Betabloqueador</b> (carvedilol, bisoprolol, succinato de metoprolol)','bloqueia a toxicidade simpática, ↓ FC, antiarrítmico, reverte remodelamento','iniciar em dose baixa no paciente estável (“start low, go slow”); bradicardia, hipotensão'],
   ['<b>Espironolactona</b>','antagonista do receptor mineralocorticoide: antifibrótico','hipercalemia; ginecomastia'],
   ['<b>iSGLT2</b> (dapagliflozina, empagliflozina)','natriurese e glicosúria, efeitos metabólicos e renais','benefício independente de diabetes; infecção genital'],
   ['Diurético de alça (furosemida)','bloqueia NKCC2','sintomático; hipocalemia, hipovolemia'],
   ['Hidralazina + nitrato','vasodilatação arterial e venosa','alternativa se intolerância ao SRAA'],
   ['Ivabradina','bloqueia a corrente If do nó sinusal','FC ≥ 70 em ritmo sinusal apesar de BB'],
   ['Digoxina','inibe Na⁺/K⁺-ATPase','controle de sintomas/FA; janela estreita']])}
  ${D.integ('<p><b>Farmacologia:</b> o paciente toma 3 dos 4 pilares parcialmente (enalapril, espironolactona) e está sem betabloqueador e sem iSGLT2. Após estabilizado (perfil A), o plano é completar a terapia e titular as doses. Revise o <b>Leito 08</b> para ajuste renal e interações (ex.: AINE + IECA + diurético = “triplo golpe” no rim).</p>','Integração · Farmacologia')}
  <h3>Particularidades da cardiomiopatia chagásica</h3>
  <ul>
   <li><b>Arritmias ventriculares</b>: amiodarona; <b>CDI</b> para prevenção secundária (e primária em selecionados).</li>
   <li><b>Bradiarritmias/BAV</b>: marca-passo.</li>
   <li><b>Tromboembolismo</b>: anticoagulação se trombo, aneurisma com trombo, FA ou embolia prévia.</li>
   <li>Betabloqueador pode ser limitado por bradicardia/distúrbios de condução.</li>
   <li>Transplante cardíaco em IC avançada (com risco de reativação sob imunossupressão).</li>
  </ul>
  ${D.integ('<p><b>Endocrinologia:</b> hipotireoidismo causa bradicardia, disfunção diastólica, derrame pericárdico e dislipidemia; excesso de levotiroxina causa taquicardia e FA. E a <b>amiodarona</b>, muito usada no Chagas, contém iodo e causa hipo ou hipertireoidismo — monitore TSH.</p>','Integração · Endócrino')}
  <h3>Humanização e integralidade</h3>
  <p>O slide lista essa disciplina como integrada. Na prática:</p>
  <ul>
   <li><b>Determinantes sociais</b>: Chagas é doença da pobreza rural; acesso a especialista, transporte, custo dos remédios (vários estão na Farmácia Popular).</li>
   <li><b>Educação para o autocuidado</b>: pesar-se diariamente (ganho &gt; 2 kg em 3 dias = procurar a equipe), restrição de sódio, uso correto dos remédios, sinais de alarme.</li>
   <li><b>Rede</b>: vínculo com a Atenção Primária (equipe de Saúde da Família), reabilitação cardíaca, apoio psicológico.</li>
   <li><b>Família</b>: rastrear filhos (transmissão congênita), orientar quanto à doação de sangue.</li>
   <li><b>Cuidados paliativos</b> na IC avançada: controle de sintomas e decisões compartilhadas.</li>
  </ul>`,

D.register({
 id:5, title:'DPOC', sub:'Homem de 68 anos, tabagista desde os 16, com dispneia progressiva, tosse matinal e tórax em barril: obstrução, espirometria e β2-agonistas.',
 disc:['fisio','semio','pato','farmaco','lab','clin','prev'],
 vignette: `
 <p>Homem de <b>68 anos</b>, aposentado, casado, com <b>dispneia progressiva há 2 anos</b> e <b>tosse crônica</b>. Piora da falta de ar nos últimos 6 meses aos esforços leves (subir escadas, caminhar longas distâncias). Tosse intermitente, <b>pior pela manhã</b>, cada vez mais frequente. <b>Cansaço</b>. Sem febre ou hemoptise. <b>Infecções respiratórias recorrentes</b> não tratadas adequadamente.</p>
 <p><b>Tabagista desde os 16 anos</b>, cerca de <b>30 cigarros/dia</b> (≈ 1,5 maço × 52 anos ≈ <b>78 maços-ano</b>). HAS controlada com <b>enalapril 10 mg/dia</b>.</p>
 ${D.tbl(['Exame físico','Achado','Tradução'],[
  ['Geral','BEG, <b>emagrecido</b>, com dificuldade respiratória','fenótipo enfisematoso; caquexia pulmonar (pior prognóstico)'],
  ['Sinais vitais','PA 145/90, FC 84, FR 20 <b>com uso de musculatura acessória</b>, <b>SatO₂ 92%</b>','trabalho respiratório aumentado; hipoxemia leve'],
  ['Inspeção','<b>aumento do diâmetro anteroposterior</b> (tórax em barril), <b>tiragem intercostal</b>','hiperinsuflação'],
  ['Palpação','<b>expansibilidade e FTV diminuídos</b>','ar aprisionado; menos transmissão'],
  ['Percussão','“<b>hipertimpânico</b>”','hipersonoridade por excesso de ar'],
  ['Ausculta','<b>MV diminuído difusamente</b>','fluxo reduzido + enfisema'],
  ['Coração','<b>bulhas hipofonéticas</b>, ritmo regular','pulmão hiperinsuflado entre o coração e a parede']])}
 ${D.pearl('<p>Tabagismo pesado + dispneia progressiva + tosse crônica + hiperinsuflação ao exame = <b>DPOC</b> até a espirometria dizer o contrário. É ela que confirma: <b>VEF1/CVF &lt; 0,70 pós-broncodilatador</b>.</p>')}`,
 objectives:['Compreender a fisiologia da doença pulmonar obstrutiva crônica (DPOC)','Conhecer as alterações radiológicas e ao exame físico relacionadas à DPOC','Entender os volumes e capacidades pulmonares','Estudar os mecanismos de ação dos β-agonistas'],
 roadmap: `<h3>Mapa do leito</h3><p>Fisiologia (volumes, mecânica) → fisiopatologia (bronquite, bronquiolite, enfisema) → semiologia → espirometria e imagem → classificação GOLD → farmacologia dos broncodilatadores → tratamento. Base semiológica no ${D.lk(3,'exame do tórax')}; a complicação cardíaca (cor pulmonale) conversa com o ${D.lk(4,'IC direita')}; vacinas no ${D.lk(1,'vacinação')}.</p>`,
 sections:[
 /* S1 */
 {id:'s1', title:'Volumes, capacidades e mecânica respiratória', short:'Volumes e mecânica', d:['fisio'],
  quick: `
  ${D.tbl(['Volume / capacidade','Definição','Na DPOC'],[
   ['Volume corrente (VC)','ar de uma respiração tranquila (~500 mL)','—'],
   ['Volume de reserva inspiratório (VRI)','o que ainda entra após inspiração normal','↓'],
   ['Volume de reserva expiratório (VRE)','o que ainda sai após expiração normal','↓'],
   ['<b>Volume residual (VR)</b>','o que sobra após expiração máxima (espirometria não mede)','<b>↑↑ (aprisionamento)</b>'],
   ['Capacidade inspiratória (CI = VC + VRI)','—','↓ (hiperinsuflação)'],
   ['<b>Capacidade residual funcional (CRF = VRE + VR)</b>','volume de repouso','<b>↑</b>'],
   ['Capacidade vital (CV = VRI + VC + VRE)','—','↓ ou normal'],
   ['<b>Capacidade pulmonar total (CPT)</b>','tudo','<b>↑</b> (enfisema)']])}
  ${D.fig('img/c5-slide-volumes.jpg','Volumes e capacidades pulmonares no espirograma.', SL)}
  ${D.pearl('<p>Capacidade = soma de volumes. VR, CRF e CPT <b>não</b> são medidos pela espirometria (precisam de pletismografia, diluição de hélio ou lavagem de nitrogênio).</p>')}`,
  deep: `
  <h3>Volumes e capacidades</h3>
  ${D.fig('img/c5-slide-volumes.jpg','Espirograma com volumes (VC, VRI, VRE, VR) e capacidades (CI, CRF, CV, CPT).', SL)}
  <p>São <b>quatro volumes</b> que não se sobrepõem — corrente, reserva inspiratório, reserva expiratório e residual — e <b>quatro capacidades</b>, que são somas deles: inspiratória (VC + VRI), residual funcional (VRE + VR), vital (VRI + VC + VRE) e pulmonar total (todos). Valores típicos num adulto: CPT ≈ 6 L, CV ≈ 4,5–5 L, CRF ≈ 2,5 L, VR ≈ 1,2 L.</p>
  <h3>Por que a CRF fica onde fica</h3>
  <p>No repouso, ao fim da expiração, duas forças se equilibram: o <b>recolhimento elástico do pulmão</b> (tende a colapsar — fibras elásticas e tensão superficial) e a <b>tendência da parede torácica a expandir</b>. A CRF é o ponto de equilíbrio. Se o pulmão perde elasticidade (enfisema), o equilíbrio se desloca para volumes maiores: <b>hiperinsuflação estática</b>.</p>
  <h3>O fluxo expiratório e o “ponto de igual pressão”</h3>
  <p>Na expiração forçada, a pressão pleural fica positiva e comprime as vias aéreas. Dentro delas, a pressão cai ao longo do trajeto até a boca. Há um ponto em que a pressão intraluminal iguala a pleural (<b>ponto de igual pressão</b>); a partir dele, a via tende a colapsar. No pulmão normal, esse ponto fica em brônquios cartilaginosos, que resistem. Quanto maior o recolhimento elástico, maior a pressão que “empurra” o ar e mais longe o ponto fica dos alvéolos.</p>
  <p>Na DPOC, com <b>menor recolhimento elástico</b> (enfisema) e <b>maior resistência</b> das pequenas vias (bronquiolite), o ponto de igual pressão migra para <b>pequenas vias sem cartilagem</b>, que colapsam precocemente: o ar fica preso. Por isso o fluxo expiratório é limitado e não melhora com mais esforço.</p>
  ${D.integ('<p><b>Semiologia:</b> a respiração com <b>lábios semicerrados</b> cria uma resistência na boca que mantém a pressão dentro das vias aéreas (uma “PEEP” autoimposta), afasta o ponto de igual pressão das pequenas vias e reduz o colapso — o paciente descobre isso sozinho.</p>','Integração · Semiologia')}
  <h3>Hiperinsuflação dinâmica: a verdadeira causa da dispneia</h3>
  <p>No esforço, a frequência respiratória sobe e o tempo expiratório encurta; como o esvaziamento já é lento, o paciente começa a inspirar antes de terminar de expirar. O volume pulmonar de fim de expiração sobe a cada ciclo: <b>hiperinsuflação dinâmica</b>. Consequências: o diafragma fica retificado e encurtado (pior vantagem mecânica), a capacidade inspiratória diminui (pouca “folga” para aumentar o volume corrente), o trabalho elástico aumenta. O paciente sente que “não consegue puxar o ar”. Broncodilatadores aliviam a dispneia em boa parte por <b>desinsuflar</b> o pulmão (GOLD 2024).</p>`,
  qs:[
   {q:'Qual parâmetro NÃO pode ser medido pela espirometria simples?',
    o:['Capacidade vital forçada','VEF1','Volume residual','Volume de reserva expiratório','Capacidade inspiratória'], a:2, d:['fisio','lab'], e:'O VR não é exalado; exige pletismografia ou técnicas de diluição.'},
   {q:'A capacidade residual funcional corresponde a:',
    o:['VC + VRI','VRE + VR','VRI + VC + VRE','VR apenas','CPT − VR'], a:1, d:['fisio'], e:'Volume que fica no pulmão ao fim de uma expiração tranquila.'},
   {q:'Por que o paciente com DPOC tem mais dispneia ao esforço?',
    o:['Porque a CPT diminui','Porque a hiperinsuflação dinâmica reduz a capacidade inspiratória e piora a mecânica diafragmática','Porque o VR cai','Porque a complacência aumenta e melhora a ventilação','Porque o débito cardíaco aumenta'], a:1, d:['fisio'], hard:true, e:'Menor tempo expiratório → aprisionamento progressivo de ar.'}
  ]},
 /* S2 */
 {id:'s2', title:'Fisiopatologia e patologia: bronquite, bronquiolite e enfisema', short:'Fisiopatologia', d:['pato','fisio'],
  quick: `
  ${D.tbl(['Componente','Lesão','Consequência'],[
   ['<b>Bronquite crônica</b> (definição clínica: tosse produtiva ≥ 3 meses/ano por 2 anos seguidos)','hipertrofia de glândulas submucosas (<b>índice de Reid &gt; 0,4</b>), metaplasia de células caliciformes, metaplasia escamosa','hipersecreção, tosse matinal, infecções'],
   ['<b>Bronquiolite</b> (pequenas vias &lt; 2 mm)','inflamação, fibrose peribronquiolar, tampões de muco','<b>principal sítio da obstrução</b>'],
   ['<b>Enfisema</b> (definição anatômica)','destruição das paredes alveolares sem fibrose evidente','perda de recolhimento elástico e de superfície de troca']])}
  ${D.svg(svgProtease,'Desequilíbrio protease-antiprotease.')}
  <ul>
   <li><b>Centroacinar</b>: tabaco, lobos <b>superiores</b>. <b>Panacinar</b>: deficiência de α1-antitripsina, <b>bases</b>, jovens.</li>
   <li>Hipoxemia → <b>vasoconstrição hipóxica</b> → hipertensão pulmonar → <b>cor pulmonale</b> (IC direita).</li>
  </ul>`,
  deep: `
  <p>GOLD define DPOC como condição heterogênea com sintomas respiratórios crônicos por anormalidades das <b>vias aéreas</b> (bronquite, bronquiolite) e/ou dos <b>alvéolos</b> (enfisema), que causam <b>obstrução persistente</b>, muitas vezes progressiva, ao fluxo aéreo. Cerca de 80% dos casos se devem ao tabagismo, mas só 15–25% dos fumantes desenvolvem DPOC: há suscetibilidade individual (genética, desenvolvimento pulmonar na infância, infecções). Outras causas: queima de biomassa (fogão a lenha), exposição ocupacional, tuberculose prévia, asma.</p>
  ${D.fig('img/c5-slide-bronq-enf.jpg','Bronquite crônica (inflamação e excesso de muco) e enfisema (alvéolos coalescidos sem elasticidade).', SL)}
  <h3>Bronquite crônica</h3>
  <p>Irritantes da fumaça estimulam <b>hipertrofia das glândulas submucosas</b> e <b>hiperplasia/metaplasia de células caliciformes</b>: mais muco, mais espesso. O <b>índice de Reid</b> (espessura das glândulas ÷ distância epitélio-cartilagem) passa de 0,4. O epitélio ciliado sofre metaplasia escamosa; o clearance mucociliar falha; bactérias colonizam (H. influenzae, M. catarrhalis, pneumococo) → infecções recorrentes, como as do paciente. A tosse é pior pela <b>manhã</b> porque o muco acumulado durante a noite é mobilizado ao acordar.</p>
  <h3>Bronquiolite: onde está a obstrução</h3>
  <p>As vias &lt; 2 mm de diâmetro são as mais afetadas: inflamação crônica, fibrose da parede, estreitamento, tampões de muco e perda numérica de bronquíolos. São “silenciosas” — muitas são destruídas antes que o VEF1 caia.</p>
  ${D.fig('img/c5-slide-vias.jpg','DPOC: alvéolos colapsados e coalescidos (enfisema), via aérea estreitada, músculo liso contraído e muco (bronquite).', SL)}
  <h3>Enfisema e o desequilíbrio protease-antiprotease</h3>
  ${D.svg(svgProtease,'Proteases de neutrófilos e macrófagos superam as antiproteases (α1-antitripsina), digerindo a elastina alveolar.')}
  <p>A fumaça recruta <b>macrófagos</b> e <b>neutrófilos</b> (a nicotina é quimiotática). Eles liberam <b>elastase neutrofílica</b> e metaloproteinases (<b>MMP-12</b>). A principal defesa é a <b>α1-antitripsina</b>, produzida pelo fígado — e os <b>oxidantes</b> do cigarro oxidam um resíduo de metionina do seu sítio ativo, inativando-a. Proteases vencem, a elastina dos septos é digerida, os alvéolos coalescem em espaços maiores. Somam-se apoptose de células alveolares e estresse oxidativo.</p>
  ${D.fig('img/c5-enfisema-centro.jpg','Enfisema centroacinar, macroscopia: múltiplos espaços aéreos dilatados com pigmento antracótico, concentrados no centro dos lóbulos (lobos superiores do tabagista).', 'Wikimedia Commons')}
  ${D.fig('img/c5-enfisema-he.jpg','Enfisema (HE): septos alveolares finos e rotos, espaços aéreos muito aumentados e coalescentes, sem fibrose.', 'Wikimedia Commons')}
  ${D.tbl(['Tipo','Distribuição','Associação'],[
   ['<b>Centroacinar</b> (centrolobular)','bronquíolo respiratório no centro do ácino; lobos <b>superiores</b>','<b>tabagismo</b> (o tipo do paciente)'],
   ['<b>Panacinar</b>','ácino inteiro; lobos <b>inferiores</b>','<b>deficiência de α1-antitripsina</b> (jovem, pouco ou nenhum tabagismo, pode ter hepatopatia)'],
   ['Parasseptal','periferia, junto à pleura','bolhas subpleurais → pneumotórax espontâneo em jovens altos'],
   ['Bolhoso','espaços &gt; 1 cm','compressão de pulmão adjacente']])}
  ${D.fig('img/c5-bolhoso.jpg','Enfisema bolhoso: grandes bolhas (> 1 cm) que comprimem o parênquima vizinho e podem romper (pneumotórax).', 'Wikimedia Commons')}
  ${D.extra('<p><b>Deficiência de α1-antitripsina</b> (gene SERPINA1, alelo Z): a proteína mal dobrada fica retida no hepatócito (glóbulos PAS-positivos resistentes à diástase → cirrose) e falta no pulmão (enfisema panacinar precoce). A OMS recomenda dosar α1-AT ao menos uma vez em todo paciente com DPOC.</p>')}
  ${D.fig('img/c5-a1at.jpg','Fígado na deficiência de α1-antitripsina (PAS-diástase): glóbulos magenta dentro dos hepatócitos — proteína mal dobrada retida no retículo endoplasmático.', 'Wikimedia Commons')}
  <h3>Consequências sistêmicas e o coração direito</h3>
  <p>Áreas mal ventiladas e bem perfundidas (bronquite) e áreas perfundidas sem parede alveolar (enfisema) criam <b>desequilíbrio V/Q</b> → <b>hipoxemia</b> e, na doença avançada, <b>hipercapnia</b>. A hipóxia alveolar causa <b>vasoconstrição pulmonar hipóxica</b> difusa (útil localmente, danosa quando generalizada); com o remodelamento vascular e a perda de leito capilar, instala-se <b>hipertensão pulmonar</b> e o VD hipertrofia e falha: <b>cor pulmonale</b> — turgência jugular, edema, hepatomegalia ${D.lk(4,'IC direita')}. A hipoxemia crônica estimula eritropoetina → <b>policitemia</b>.</p>
  ${D.fig('img/c5-slide-fenotipos.jpg','Fenótipos clássicos: “blue bloater” (bronquite predominante: cianose, edema, policitemia, sobrepeso) × “pink puffer” (enfisema predominante: emagrecido, taquipneico, lábios semicerrados, tórax em barril). O paciente é mais “pink puffer”.', SL)}`,
  qs:[
   {q:'Fumante de 40 anos com enfisema panacinar de bases e alterações hepáticas. Suspeita:',
    o:['Fibrose cística','Deficiência de α1-antitripsina','Asbestose','Sarcoidose','Bronquiectasia idiopática'], a:1, d:['pato'], e:'Panacinar de bases + hepatopatia em jovem: SERPINA1 (alelo Z).'},
   {q:'O principal sítio de obstrução ao fluxo aéreo na DPOC está:',
    o:['Na traqueia','Nos brônquios principais','Nas pequenas vias aéreas (< 2 mm)','Nos alvéolos','Na laringe'], a:2, d:['pato','fisio'], e:'Bronquiolite crônica: inflamação, fibrose e tampões de muco.'},
   {q:'O mecanismo pelo qual o tabaco favorece o enfisema inclui:',
    o:['Aumento da produção hepática de α1-antitripsina','Oxidação e inativação da α1-antitripsina e recrutamento de neutrófilos produtores de elastase','Deposição de colágeno nos septos','Formação de granulomas','Hipersensibilidade tipo I'], a:1, d:['pato'], e:'Protease vence antiprotease.'}
  ]},
 /* S3 */
 {id:'s3', title:'Semiologia da DPOC: o tórax hiperinsuflado', short:'Exame físico', d:['semio','prope'],
  quick: `
  ${D.tbl(['Achado','Mecanismo'],[
   ['<b>Tórax em barril</b> (↑ diâmetro AP)','hiperinsuflação; costelas horizontalizadas'],
   ['Uso de musculatura acessória, <b>tiragem</b>, posição de tripé','diafragma retificado e ineficiente'],
   ['<b>Lábios semicerrados</b>','mantém pressão na via aérea, reduz colapso expiratório'],
   ['<b>Sinal de Hoover</b>','retração paradoxal das costelas inferiores na inspiração (diafragma plano)'],
   ['Expansibilidade e FTV ↓','ar aprisionado'],
   ['Percussão <b>hipersonora</b>, macicez hepática rebaixada','excesso de ar; diafragma baixo'],
   ['MV ↓ difusamente, <b>expiração prolongada</b>, sibilos/roncos','obstrução difusa'],
   ['Bulhas hipofonéticas, ictus impalpável','pulmão entre coração e parede']])}
  ${D.trap('<p><b>Baqueteamento digital NÃO é achado da DPOC.</b> Num DPOC com baqueteamento, procure câncer de pulmão, bronquiectasias ou fibrose. E “timpanismo” é termo do pneumotórax: no enfisema, o correto é <b>hipersonoridade</b>.</p>')}
  <div class="widget" data-w="pulmao" data-cfg="c5"></div>`,
  deep: `
  <h3>Inspeção</h3>
  <p>O <b>tórax em barril</b> (diâmetro anteroposterior próximo ao laterolateral, costelas horizontalizadas, aumento do espaço intercostal) é a tradução visual da hiperinsuflação. O paciente usa <b>musculatura acessória</b> (esternocleidomastóideos, escalenos), apresenta <b>tiragem intercostal</b> e frequentemente adota a <b>posição de tripé</b> (inclinado para frente, apoiado nos braços), que fixa a cintura escapular e melhora a mecânica do diafragma rebaixado. Expira com <b>lábios semicerrados</b>.</p>
  <p><b>Sinal de Hoover</b>: com o diafragma plano, sua contração puxa as costelas inferiores para dentro na inspiração (em vez de expandir). <b>Sinal de Campbell</b>: descida da traqueia na inspiração. Na fase avançada: cianose, edema, turgência jugular (cor pulmonale), caquexia.</p>
  ${D.fig('img/c5-barril.jpg','Radiografia em perfil de tórax em barril: diâmetro anteroposterior aumentado, espaço retroesternal amplo e diafragma retificado.', 'Wikimedia Commons')}
  <h3>Palpação e percussão</h3>
  <p>Expansibilidade diminuída simetricamente; FTV diminuído (o ar é mau condutor da vibração). Percussão <b>hipersonora</b> difusa, com rebaixamento do limite superior da macicez hepática e redução da área de macicez cardíaca. Nota sobre o caso: o slide usa “hipertimpânico”; o termo semiológico clássico para o enfisema é hipersonoridade.</p>
  <h3>Ausculta</h3>
  <p><b>MV globalmente diminuído</b>, <b>tempo expiratório prolongado</b> (relação I:E de 1:3 ou mais), sibilos e roncos (sobretudo nas exacerbações), estertores grossos se houver secreção. Bulhas hipofonéticas e às vezes mais audíveis no epigástrio (o coração fica verticalizado, “em gota”).</p>
  <div class="widget" data-w="pulmao" data-cfg="c5"></div>
  ${D.integ('<p>Compare com a <b>consolidação</b> do Leito 06 e a <b>obstrução localizada</b> do Leito 03: a DPOC é <b>difusa e simétrica</b>, com hipersonoridade.</p>','Integração')}
  ${D.trap('<p><b>Enalapril</b> pode causar tosse seca (acúmulo de bradicinina por inibição da ECA, que também degrada bradicinina). No caso, a tosse é crônica, matinal e com história tabágica — típica de bronquite —, mas lembrar do IECA no diagnóstico diferencial de tosse é ponto de prova.</p>')}`,
  qs:[
   {q:'Achado de percussão esperado no enfisema:',
    o:['Macicez difusa','Hipersonoridade difusa','Timpanismo localizado','Submacicez em bases','Som claro pulmonar normal'], a:1, d:['semio'], e:'Excesso de ar no parênquima.'},
   {q:'Retração paradoxal das últimas costelas na inspiração em paciente com DPOC é o sinal de:',
    o:['Lasègue','Hoover','Kussmaul','Trousseau','Murphy'], a:1, d:['semio'], e:'Diafragma retificado traciona as costelas para dentro.'},
   {q:'Baqueteamento digital em paciente com DPOC deve levantar suspeita de:',
    o:['DPOC grave típica','Câncer de pulmão ou bronquiectasias','Exacerbação viral','Uso de β2-agonista','Nada, é esperado'], a:1, d:['semio','clin'], e:'Baqueteamento não faz parte da DPOC.'}
  ]},
 /* S4 */
 {id:'s4', title:'Espirometria e imagem', short:'Espirometria e RX', d:['lab'],
  quick: `
  <ul>
   <li><b>Diagnóstico</b>: <b>VEF1/CVF &lt; 0,70 após broncodilatador</b> (obstrução persistente) em contexto clínico compatível.</li>
   <li><b>Gravidade da obstrução</b> (VEF1 % previsto): GOLD 1 ≥ 80 · GOLD 2 50–79 · GOLD 3 30–49 · GOLD 4 &lt; 30.</li>
   <li>Curva fluxo-volume <b>côncava</b> (“escavada”); VR e CPT ↑ na pletismografia; <b>DLCO ↓</b> no enfisema.</li>
   <li><b>RX</b>: hipertransparência, diafragmas retificados e rebaixados, ↑ espaço retroesternal, coração em gota, costelas horizontalizadas, bolhas.</li>
  </ul>
  ${D.svg(svgFluxo,'Curvas fluxo-volume e volume-tempo.')}
  <div class="widget" data-w="espiro"></div>`,
  deep: `
  <h3>Espirometria</h3>
  <p>O paciente inspira até a CPT e expira o mais forte e rápido possível, por pelo menos 6 segundos. Medem-se a <b>CVF</b> (todo o volume expirado) e o <b>VEF1</b> (o que sai no 1º segundo). Repete-se após <b>broncodilatador</b> (ex.: 400 µg de salbutamol).</p>
  ${D.svg(svgFluxo,'Na obstrução, o VEF1 cai mais que a CVF (relação baixa) e a curva fluxo-volume fica côncava; na restrição, ambos caem e a relação é normal ou alta.')}
  ${D.tbl(['Padrão','VEF1/CVF','VEF1','CVF','Exemplo'],[
   ['Obstrutivo','<b>&lt; 0,70</b>','↓','normal ou ↓','DPOC, asma'],
   ['Restritivo','normal ou ↑','↓','↓ (confirmar CPT ↓)','fibrose, obesidade, doença neuromuscular'],
   ['PRISm','≥ 0,70','&lt; 80%','—','“espirometria alterada com relação preservada” (GOLD 2024)']])}
  <p>Na <b>asma</b>, a obstrução é tipicamente <b>reversível</b> (aumento do VEF1 ≥ 12% e ≥ 200 mL após broncodilatador, variável no tempo); na DPOC, é <b>persistente</b> — pode haver alguma resposta ao broncodilatador, mas a relação continua &lt; 0,70.</p>
  <div class="widget" data-w="espiro"></div>
  <h4>Outros exames funcionais</h4>
  <ul>
   <li><b>Pletismografia</b>: VR, CRF e CPT aumentados (aprisionamento e hiperinsuflação).</li>
   <li><b>DLCO</b> (difusão do monóxido de carbono): <b>reduzida no enfisema</b> (perda de superfície capilar-alveolar), normal na bronquite e na asma.</li>
   <li><b>Gasometria</b>: hipoxemia; hipercapnia com bicarbonato elevado (compensação renal) na doença avançada.</li>
   <li><b>Oximetria</b>, teste de caminhada de 6 minutos, hemograma (policitemia, eosinófilos para decidir corticoide inalatório), α1-antitripsina.</li>
  </ul>
  <h3>Radiografia de tórax</h3>
  ${D.fig('img/c5-slide-rx-pa.jpg','PA de tórax enfisematoso (esquerda) × normal (direita): pulmões hipertransparentes, diafragmas retificados e rebaixados (setas), coração verticalizado.', SL)}
  ${D.fig('img/c5-slide-rx-perfil-anot.jpg','Perfil na DPOC: aumento do diâmetro AP, aumento do espaço retroesternal e retificação do diafragma.', SL)}
  ${D.fig('img/c5-slide-rx-perfil.jpg','Perfil normal × enfisematoso.', SL)}
  <p>Sinais de hiperinsuflação: mais de 6 arcos costais anteriores (ou 10 posteriores) acima do diafragma; diafragmas <b>retificados</b> e rebaixados; espaço aéreo retroesternal aumentado no perfil (&gt; 2,5 cm); <b>coração em gota</b> (verticalizado e estreito); hipertransparência; bolhas. O RX <b>não diagnostica</b> DPOC (pode ser normal), mas exclui diagnósticos diferenciais e complicações (pneumonia, pneumotórax, câncer). A <b>TC</b> quantifica e tipifica o enfisema e rastreia câncer em tabagistas elegíveis.</p>
  ${D.integ('<p><b>ECG</b> no cor pulmonale: <b>P pulmonale</b> (P apiculada ≥ 2,5 mm em DII), desvio do eixo para a direita, sobrecarga do VD, baixa voltagem (hiperinsuflação).</p>','Integração · ECG')}`,

 {id:'s5', title:'Avaliação e classificação: GOLD 2024', short:'Classificação GOLD', d:['clin'],
  quick: `
  ${D.tbl(['Eixo','Ferramenta'],[
   ['Gravidade da obstrução','GOLD 1–4 (VEF1 % previsto)'],
   ['Sintomas','<b>mMRC</b> (dispneia, 0–4) e <b>CAT</b> (impacto, 0–40)'],
   ['Risco','exacerbações no último ano']])}
  ${D.tbl(['Grupo','Critério','Tratamento inicial'],[
   ['<b>A</b>','0–1 exacerbação moderada (sem internação) + mMRC 0–1 / CAT &lt; 10','um broncodilatador'],
   ['<b>B</b>','0–1 exacerbação + mMRC ≥ 2 / CAT ≥ 10','<b>LABA + LAMA</b>'],
   ['<b>E</b>','≥ 2 exacerbações moderadas ou ≥ 1 com internação','<b>LABA + LAMA</b> (+ ICS se eosinófilos ≥ 300)']])}
  ${D.trap('<p>O antigo esquema <b>ABCD</b> (com C e D) foi substituído em 2023 pelo <b>ABE</b>. O slide de “dica” com C e D está desatualizado.</p>')}
  <div class="widget" data-w="goldabe"></div>`,
  deep: `
  <h3>Três perguntas, três ferramentas</h3>
  <p>A avaliação GOLD separa <b>quanto o pulmão está obstruído</b> (VEF1, GOLD 1–4), <b>quanto o paciente sofre</b> (sintomas) e <b>quanto ele está em risco</b> (exacerbações). Cada eixo informa algo diferente: um paciente com VEF1 de 45% pode ter poucos sintomas, e outro com VEF1 de 65% pode exacerbar várias vezes ao ano.</p>
  ${D.fig('img/c5-slide-gold14.jpg','Gravidade espirométrica GOLD 1–4.', SL)}
  ${D.fig('img/c5-slide-mmrc.jpg','Escala de dispneia mMRC (0–4). O paciente, que se cansa ao subir escadas e em caminhadas longas, está pelo menos em mMRC 1–2.', SL)}
  ${D.fig('img/c5-slide-cat.jpg','COPD Assessment Test (CAT): 8 itens de 0 a 5; ≥ 10 = sintomas significativos.', SL)}
  ${D.fig('img/c5-slide-abe.jpg','Ferramenta ABE do GOLD (2023/2024).', SL)}
  <div class="widget" data-w="goldabe"></div>
  <h3>Exacerbação</h3>
  <p>Piora aguda (&lt; 14 dias) de dispneia e/ou tosse e escarro, frequentemente com taquipneia/taquicardia, por inflamação aumentada das vias aéreas — na maioria desencadeada por <b>infecções virais ou bacterianas</b> e poluição. Graduada como leve (só SABA), moderada (corticoide oral e/ou antibiótico) ou grave (internação/emergência). Exacerbações aceleram a queda do VEF1 e aumentam a mortalidade: prevenir é objetivo central. As “infecções respiratórias recorrentes” do paciente provavelmente eram exacerbações não tratadas.</p>
  ${D.fig('img/c5-slide-abcd-antigo.jpg','Esquema ABCD antigo (anterior a 2023), que ainda circula em materiais. Hoje, C e D foram fundidos no grupo E.', SL)}
  ${D.extra('<p>Prognóstico multidimensional: <b>índice BODE</b> — IMC (<b>B</b>ody mass), <b>O</b>bstrução (VEF1), <b>D</b>ispneia (mMRC) e <b>E</b>xercício (caminhada de 6 min). Emagrecimento, como o do paciente, piora o prognóstico.</p>')}`,

   {q:'Paciente com 1 internação por exacerbação no último ano, mMRC 1 e CAT 8. Grupo GOLD:',
    o:['A','B','C','D','E'], a:4, d:['clin'], e:'Qualquer internação por exacerbação → E, independentemente dos sintomas.'},

 /* S6 */
 {id:'s6', title:'Farmacologia: β2-agonistas e antimuscarínicos', short:'β2-agonistas', d:['farmaco'],
  quick: `
  ${D.svg(svgBeta,'β2 → Gs → AMPc → PKA → relaxamento; antimuscarínico bloqueia o M3 (via Gq).')}
  ${D.tbl(['Classe','Exemplos','Início / duração'],[
   ['<b>SABA</b>','<b>salbutamol</b>, fenoterol','minutos / 4–6 h (resgate)'],
   ['<b>LABA</b>','<b>formoterol</b> (início rápido), salmeterol (início lento)','12 h'],
   ['Ultra-LABA','indacaterol, olodaterol, vilanterol','24 h'],
   ['SAMA','ipratrópio','6–8 h'],
   ['<b>LAMA</b>','<b>tiotrópio</b>, umeclidínio, glicopirrônio','24 h']])}
  <ul>
   <li>Efeitos adversos β2: <b>tremor</b>, taquicardia/palpitações, <b>hipocalemia</b>, hiperglicemia, ansiedade.</li>
   <li>Antimuscarínicos: <b>boca seca</b>, retenção urinária, glaucoma de ângulo fechado (cuidado na nebulização), constipação.</li>
  </ul>
  ${D.trap('<p><b>Formoterol é LABA</b> (de longa ação), apesar do início rápido. Resumos que o chamam de “β2 de curta ação” estão errados.</p>')}`,
  deep: `
  <h3>O receptor β2 e a via do AMPc</h3>
  ${D.svg(svgBeta,'Mecanismo molecular dos broncodilatadores.')}
  <p>O receptor <b>β2-adrenérgico</b> é um receptor acoplado à proteína <b>Gs</b>. O agonista ativa a <b>adenilil ciclase</b>, que converte ATP em <b>AMPc</b>; o AMPc ativa a <b>proteína quinase A (PKA)</b>, que fosforila a <b>quinase da cadeia leve da miosina</b> (inativando-a), reduz o cálcio intracelular e abre canais de potássio (hiperpolarização). Resultado: relaxamento do músculo liso brônquico. Efeitos adicionais: inibição da liberação de mediadores por mastócitos e aumento do batimento ciliar.</p>
  <h3>Seletividade e efeitos adversos</h3>
  <p>A seletividade β2 é <b>relativa</b> e dose-dependente; e há receptores β2 em vários tecidos:</p>
  ${D.tbl(['Efeito adverso','Mecanismo'],[
   ['<b>Tremor</b>','β2 no músculo esquelético'],
   ['<b>Taquicardia</b>, palpitações, arritmias','β1 cardíaco (seletividade perdida) e vasodilatação β2 → taquicardia reflexa'],
   ['<b>Hipocalemia</b>','β2 estimula a Na⁺/K⁺-ATPase → K⁺ entra nas células'],
   ['Hiperglicemia','glicogenólise hepática'],
   ['Taquifilaxia','dessensibilização: fosforilação do receptor (GRK), β-arrestina, internalização']])}
  ${D.integ('<p>A <b>hipocalemia</b> dos β2-agonistas é usada a nosso favor no tratamento da <b>hipercalemia</b> (salbutamol nebulizado desloca K⁺ para dentro das células) — ver Leito 08.</p>','Integração · Farmacologia')}
  <h3>Classes e uso</h3>
  <ul>
   <li><b>SABA</b> (salbutamol, fenoterol): resgate, início em minutos.</li>
   <li><b>LABA</b>: <b>formoterol</b> tem início rápido (minutos) e duração de 12 h; <b>salmeterol</b> é muito lipofílico, fica ancorado na membrana (“exossítio”), início lento, 12 h. Ultra-LABA (indacaterol, olodaterol, vilanterol): 24 h.</li>
   <li><b>Antimuscarínicos</b>: o tônus vagal (acetilcolina em receptores <b>M3</b>, via Gq → IP3 → Ca²⁺) é o principal componente reversível da obstrução na DPOC — por isso os LAMA são tão eficazes nela (mais que na asma). Ipratrópio (curta), tiotrópio (longa, ligação prolongada ao M3). Compostos quaternários, pouco absorvidos: efeitos sistêmicos discretos.</li>
   <li><b>LABA + LAMA</b>: mecanismos complementares (um relaxa diretamente, o outro bloqueia a constrição vagal) → mais broncodilatação e menos resgate.</li>
   <li><b>Corticoide inalatório</b>: anti-inflamatório; benefício na DPOC restrito a exacerbadores com eosinofilia; aumenta pneumonia e candidíase oral.</li>
   <li>Outros: <b>roflumilaste</b> (inibidor da PDE4, para bronquite crônica com exacerbações), <b>azitromicina</b> crônica (exacerbadores), teofilina (janela terapêutica estreita, metabolizada pelo CYP1A2 — o tabagismo induz o CYP1A2 e reduz seus níveis).</li>
  </ul>
  <h3>A via inalatória</h3>
  <p>Entrega o fármaco diretamente no órgão-alvo: efeito rápido com dose pequena e pouca exposição sistêmica (alto índice terapêutico). Mas só funciona com <b>técnica correta</b>: no aerossol dosimetrado, agitar, expirar, acoplar o <b>espaçador</b>, disparar e inspirar lenta e profundamente, pausa de 10 segundos; nos inaladores de pó, inspiração rápida e forte. Erros de técnica são a principal causa de “falha do tratamento”.</p>
  ${D.integ('<p><b>Farmacocinética</b> (Leito 08): na via inalatória, a fração deglutida sofre metabolismo de primeira passagem; a biodisponibilidade sistêmica vem sobretudo do que é absorvido no pulmão.</p>','Integração')}`,
  qs:[
   {q:'O segundo mensageiro que medeia a broncodilatação pelos β2-agonistas é:',
    o:['IP3','AMPc','GMPc','DAG','Cálcio'], a:1, d:['farmaco'], e:'Gs → adenilil ciclase → AMPc → PKA.'},
   {q:'Paciente usa salbutamol nebulizado repetidamente na emergência. Distúrbio eletrolítico esperado:',
    o:['Hipercalemia','Hipocalemia','Hipernatremia','Hipercalcemia','Hipermagnesemia'], a:1, d:['farmaco','lab'], e:'β2 ativa a Na⁺/K⁺-ATPase e desloca K⁺ para o intracelular.'},
   {q:'Qual destes é um broncodilatador de LONGA ação?',
    o:['Salbutamol','Fenoterol','Formoterol','Ipratrópio','Adrenalina'], a:2, d:['farmaco'], e:'Formoterol: LABA de início rápido.'}
  ]},
 /* S7 */
 {id:'s7', title:'Tratamento, exacerbações e prognóstico', short:'Tratamento', d:['clin','prev','farmaco'],
  quick: `
  <h4>Para todos</h4>
  <ul>
   <li><b>Cessar o tabagismo</b> — junto com a oxigenoterapia nos hipoxêmicos, é o que muda a mortalidade.</li>
   <li><b>Vacinas</b>: influenza, pneumocócica, covid-19, VSR (≥ 60 anos), dTpa, herpes-zóster.</li>
   <li><b>Reabilitação pulmonar</b> e atividade física; técnica inalatória; plano de ação.</li>
  </ul>
  <h4>Oxigenoterapia domiciliar (≥ 15 h/dia)</h4>
  <p>PaO₂ ≤ 55 mmHg ou SatO₂ ≤ 88%; ou PaO₂ 56–59 com cor pulmonale, HP ou policitemia (Ht &gt; 55%).</p>
  <h4>Exacerbação</h4>
  <p>SABA ± SAMA, <b>prednisona 40 mg por 5 dias</b>, antibiótico se escarro purulento, O₂ com alvo de <b>SatO₂ 88–92%</b>, <b>VNI</b> se acidose respiratória (pH &lt; 7,35 e PaCO₂ &gt; 45).</p>`,
  deep: `
  <h3>Não farmacológico</h3>
  ${D.fig('img/c5-slide-mort.jpg','Intervenções que reduzem mortalidade na DPOC: cessação do tabagismo, reabilitação pulmonar (após internação), oxigenoterapia domiciliar prolongada, VNI domiciliar em hipercápnicos, terapia tripla em exacerbadores selecionados, cirurgia redutora de volume em casos específicos.', SL)}
  <ul>
   <li><b>Cessação do tabagismo</b>: a única intervenção que reduz a velocidade de queda do VEF1. Abordagem cognitivo-comportamental + farmacoterapia (reposição de nicotina, bupropiona, vareniclina) — ver ${D.lk(3,'cessação')}.</li>
   <li><b>Reabilitação pulmonar</b>: treino físico, educação, nutrição — melhora dispneia, capacidade de exercício e qualidade de vida; após internação, reduz mortalidade.</li>
   <li><b>Vacinação</b> ${D.lk(1,'vacinas')}: influenza anual, pneumocócica (conjugada), covid-19, VSR (≥ 60 anos), dTpa (coqueluche), herpes-zóster (≥ 50 anos).</li>
   <li><b>Nutrição</b>: o paciente é emagrecido; caquexia piora prognóstico.</li>
  </ul>
  ${D.fig('img/c5-slide-vacinas.jpg','Recomendações de vacinação para DPOC estável (GOLD).', SL)}
  <h3>Farmacológico de manutenção</h3>
  ${D.fig('img/c5-slide-trat.jpg','Tratamento farmacológico inicial por grupo GOLD (ABE).', SL)}
  <p>O paciente, sintomático (dispneia em atividades leves, mMRC ≥ 2 provável), sem relato claro de exacerbações tratadas, seria classificado como <b>B</b> (ou <b>E</b>, se as “infecções recorrentes” forem consideradas exacerbações moderadas) → <b>LABA + LAMA</b>, SABA de resgate. Reavaliar sintomas, exacerbações e técnica em cada consulta; escalonar para terapia tripla (LABA + LAMA + ICS) se exacerbações persistirem com eosinófilos ≥ 100–300.</p>
  <h3>Oxigenoterapia domiciliar prolongada</h3>
  <p>Indicada (≥ 15 h/dia) com <b>PaO₂ ≤ 55 mmHg</b> ou SatO₂ ≤ 88% em repouso, confirmada em duas medidas com o paciente estável; ou PaO₂ 56–59 mmHg com cor pulmonale, hipertensão pulmonar ou policitemia (hematócrito &gt; 55%). Aumenta a sobrevida. O paciente, com SatO₂ de 92%, ainda não preenche critério.</p>
  <h3>Exacerbação: o que fazer</h3>
  <ol>
   <li><b>Broncodilatadores de curta ação</b> (SABA ± SAMA).</li>
   <li><b>Corticoide sistêmico</b>: prednisona 40 mg/dia por <b>5 dias</b>.</li>
   <li><b>Antibiótico</b> se escarro purulento (ou ventilação mecânica): cobre H. influenzae, M. catarrhalis, pneumococo (ex.: amoxicilina-clavulanato).</li>
   <li><b>Oxigênio controlado</b>: alvo de SatO₂ <b>88–92%</b>.</li>
   <li><b>VNI</b> se acidose respiratória (pH &lt; 7,35 com PaCO₂ &gt; 45 mmHg): reduz intubação e mortalidade.</li>
  </ol>
  ${D.pearl('<p>Por que O₂ demais piora a hipercapnia no DPOC? Não é só a “perda do drive hipóxico”. O principal mecanismo é a <b>reversão da vasoconstrição hipóxica</b> (aumenta o fluxo para áreas mal ventiladas e piora o V/Q) somada ao <b>efeito Haldane</b> (hemoglobina oxigenada libera CO₂). Daí o alvo de 88–92%.</p>')}
  ${D.integ('<p><b>Gasometria</b> esperada na exacerbação hipercápnica: acidose respiratória aguda sobre crônica — PaCO₂ alta, bicarbonato elevado (compensação renal prévia), pH baixo.</p>','Integração · Laboratório')}`,
  qs:[
   {q:'Qual intervenção reduz a velocidade de declínio do VEF1 na DPOC?',
    o:['LABA','Corticoide inalatório','Cessação do tabagismo','Teofilina','Mucolítico'], a:2, d:['prev','clin'], e:'Parar de fumar é a intervenção modificadora de doença.'},
   {q:'Exacerbação de DPOC com pH 7,29 e PaCO₂ 62 mmHg, consciente e colaborativo. Conduta ventilatória:',
    o:['Intubação imediata','Ventilação não invasiva','O₂ a 15 L/min com máscara não reinalante','Observação','Fisioterapia apenas'], a:1, d:['clin'], e:'Acidose respiratória: VNI reduz intubação e mortalidade.'},
   {q:'Indicação de oxigenoterapia domiciliar prolongada:',
    o:['SatO₂ 92% em repouso','PaO₂ 54 mmHg em repouso, estável','Dispneia mMRC 2','Qualquer DPOC GOLD 3','PaO₂ 65 mmHg'], a:1, d:['clin'], e:'PaO₂ ≤ 55 mmHg (ou SatO₂ ≤ 88%).'}
  ]}
 ],

  <p>Pneumonia é a inflamação aguda do parênquima pulmonar (alvéolos e interstício) causada por agente infeccioso. A <b>PAC</b> é adquirida na comunidade; a <b>hospitalar</b> surge ≥ 48 h após a internação e tem outros agentes (Gram-negativos, MRSA). O paciente tem o quadro típico: início agudo, febre alta, expectoração purulenta, dor pleurítica (a pleura visceral não dói; a dor vem da <b>pleura parietal</b> inflamada pela contiguidade) e exame focal de consolidação.</p>
  <h3>Por que o paciente pegou pneumonia?</h3>
  <p>As defesas do pulmão incluem o reflexo de tosse e de deglutição, o clearance mucociliar, a IgA secretora, os macrófagos alveolares e o surfactante. Os fatores do paciente: <b>idade</b> (imunossenescência, tosse menos eficaz) e <b>AVC prévio</b> — mesmo com boa recuperação, a disfagia orofaríngea silenciosa favorece <b>microaspiração</b> de flora da orofaringe. O <b>brônquio principal direito</b> é mais curto, largo e vertical: material aspirado tende a ir para o <b>lobo inferior direito</b> (em decúbito, para os segmentos posteriores) — exatamente onde está a consolidação.</p>
  ${D.integ('<p>A disfagia pós-AVC e a avaliação fonoaudiológica da deglutição são pontos de prevenção da pneumonia aspirativa — ver ${D.lk(9,"AVC")}.</p>','Integração · Neurologia')}
  <h3>Gravidade: onde tratar</h3>
  ${D.fig('img/c6-slide-curb.jpg','CURB-65: 0–1 mortalidade baixa (tratamento ambulatorial), 2 intermediária (considerar internação), ≥ 3 alta (internação; 4–5 avaliar UTI).', SL)}
  <div class="widget" data-w="curb"></div>
  <p>O paciente também preenche critérios de <b>sepse</b>: no qSOFA, FR ≥ 22, alteração do nível de consciência e PAS ≤ 100 (3/3). A hipotensão (95/60) com taquicardia e creatinina elevada sugere hipoperfusão. A SatO₂ de 88% exige oxigênio. O <b>escore de gravidade não substitui o julgamento</b>: hipoxemia, por si só, já indica internação.</p>
  ${D.extra('<p>Critérios ATS/IDSA de PAC grave (UTI): maiores = choque séptico com vasopressor ou ventilação mecânica; menores (≥ 3) = FR ≥ 30, PaO₂/FiO₂ ≤ 250, infiltrado multilobar, confusão, ureia elevada, leucopenia, plaquetopenia, hipotermia, hipotensão com necessidade de volume agressivo.</p>')}`,
  qs:[
   {q:'Qual o CURB-65 do paciente (confuso, ureia 48, FR 32, PA 95/60, 68 anos)?',
    o:['2','3','4','5','1'], a:2, d:['clin'], e:'C + R + B (PAD 60 ≤ 60) + 65 = 4. Ureia 48 não pontua.'},
   {q:'Por que o lobo inferior direito é o sítio clássico da pneumonia aspirativa?',

   {q:'CRB-65 difere do CURB-65 por:',
