as assertivas I e III."],"gab":2,"com":["A IV está errada: o sopro da estenose aórtica é sistólico (ejetivo), não diastólico.","A IV está errada e a I é correta (angina pela hipertrofia).","<b>Justificativa oficial:</b> O sopro esperado na estenose aórtica é sistólico. Tornando incorreta a assertiva IV.","Falta a II: o débito fixo causa pré-síncope e escurecimento visual no esforço."],"imgs":[],"par":1,"alr":1},{"id":"EDS.15","prova":"EDS","n":"15","key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/ conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam - de forma involuntária - a resistência vascular periférica. Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente, ao assumir a posição de cócoras?","cmd":"","alts":["Shunt arteriovenoso, esquerda-direita.","Shunt arteriovenoso, direita - esquerda.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":1,"com":["No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrograda a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (shunt) que cursam com passagem de sangue da direita para a esquerda.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"par":1,"alr":1},{"id":"EDS.16","prova":"EDS","n":"16","key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Dor precordial típica em aperto, irradiada para o membro superior esquerdo e a mandíbula, que surge aos esforços e melhora com o repouso, em adultos jovens.","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato sublingual, sem relação com isquemia, notadamente em adultos jovens.","Dor torácica de origem musculoesquelética, que piora à palpação e aos movimentos do tronco, notadamente em pacientes idosos e diabéticos.","Sinais e ou sintomas de etiologia isquêmica cardíaca, que podem surgir de forma desvinculada da precordialgia típica, notadamente em paciente idosos e diabéticos."],"gab":3,"com":["Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica.","<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de inicio súbito, sem precordialgia; sintomas - dispepsia."],"imgs":[],"par":1,"alr":1},{"id":"EDS.17","prova":"EDS","n":"17","key":"C37","tema":"a11","seg":"s1","mod":"prova","enun":"Nome dado a Cianose que tende melhorar com a oferta de oxigênio (O2) suplementar.","cmd":"Assinale uma alternativa.","alts":["Cianose central.","Cianose periférica.","Cianose por metemoglobinemia.","Cianose segmentar por estase venosa."],"gab":0,"com":["<b>Justificativa oficial:</b> As cianoses que cursam com déficits de bomba (circulatória Q; ventilatória V), em seus mais diferentes níveis (tecidual, orgânico etc.) são denominadas de centrais. Por cursarem com hipoxemia (baixa quantidade de O2 no sangue - ligado a Hb), elas tendem a responder melhor a oferta de O2 suplementar.","A periférica é de baixo fluxo (o sangue chega saturado); melhora com calor e massagem, não com O2.","Na hemoglobinopatia o problema é a hemoglobina anormal; o O2 não corrige.","A estase venosa é periférica e localizada; não responde ao O2."],"imgs":[],"par":1,"alr":1}],"disc":[{"id":"ED.D6","prova":"ED","n":"6","mod":"prova","disc":1,"enun":"Situação-Problema: Masculino, 56 anos de idade, DM2, HAS, dislipidemia, dor precordial em aperto há 20 minutos, sudorese, dispneia e dor em membro superior esquerdo e mandíbula esquerda. Diagnosticado com IAM.\nComando: Classifique a dor precordial, a dor no membro superior esquerdo e a dor na mandíbula esquerda, respectivamente:","resp":"• Dor precordial: dor visceral.\n• Dor no membro superior esquerdo: dor referida.\n• Dor na mandíbula esquerda: dor referida.","tema":"a4","seg":"s2"},{"id":"ED.D7","prova":"ED","n":"7","mod":"prova","disc":1,"enun":"Situação-Problema: Achados faciais: fronte olímpica; nariz em sela; mandíbula prognata; dentes de Hutchinson.\nComando: a) Qual o nome dado a este tipo facial? b) Qual a condição de base associada?","resp":"• a) Fácies Luética (ou Fácies Sifilítica / Fácies da Sífilis ).\n• b) Sífilis congênita.","tema":"a3","seg":"s3"},{"id":"P82.D1","prova":"P82","n":"1","mod":"prova","disc":1,"enun":"Situação-Problema: Traços anatômicos faciais encontrados durante o exame físico geral: fronte olímpica, nariz em sela, mandíbula prognata, dentes de Hutchinson.\nComando: a) Qual o nome dado a este tipo facial? b) Qual a condição de base, ou doença, está associada a este tipo facial?","resp":"a) Fácies Luética (aceita: Fácies de sífilis congênita / Fácies sifilítica).\nb) Sífilis congênita.","tema":"a3","seg":"s3"},{"id":"P82.D2","prova":"P82","n":"2","mod":"prova","disc":1,"enun":"Situação-Problema: Paciente apresenta distúrbio motor da fala, decorrente de alteração no controle dos músculos envolvidos na fonação e na articulação, com fala imprecisa, lenta, arrastada ou pouco inteligível, sem prejuízo primário da compreensão ou da formulação da linguagem.\nComando: Qual é o termo técnico utilizado para designar esse distúrbio?","resp":"Disartria","tema":"a3","seg":"s1"},{"id":"P82.D3","prova":"P82","n":"3","mod":"prova","disc":1,"enun":"Situação-Problema: Paciente masculino, 56 anos, hipertenso, dislipidêmico, DM2, com dor precordial em aperto há 20 minutos, sudorese, dispneia e dor em membro superior esquerdo e mandíbula. Diagnosticado com IAM.\nComando: Com base na semiologia da dor, classifique a dor precordial, a dor no membro superior esquerdo e a dor na mandíbula, respectivamente.","resp":"Dor precordial: dor visceral.\nDor no membro superior esquerdo: dor referida.\nDor na mandíbula: dor referida.","tema":"a4","seg":"s2"},{"id":"P80.D1","prova":"P80","n":"1","mod":"prova","disc":1,"enun":"Situação-Problema: Ao grafarmos no prontuário médico um achado durante o exame clínico do paciente devemos estar atentos ao local correto. Analise a informação observada por você durante o exame clínico: 'Paciente em bom estado geral. Consciente, lúcido e orientado. Afebril.'\nComando: Em qual campo do Exame Clínico a informação acima mencionada deverá ser registrada? (Indique o campo específico e/ou subcampo)","resp":"Exame físico; subcampo: Ectoscopia (ou Exame Físico Geral).","tema":"a3","seg":"s1"},{"id":"P80.D2","prova":"P80","n":"2","mod":"prova","disc":1,"enun":"Situação-Problema: Homem de 56 anos com dor precordial em aperto iniciada há 20 minutos, sudorese, dispneia e dor em membro superior esquerdo e mandíbula esquerda. Diagnosticado com IAM.\nComando: Classifique a dor precordial, a dor no membro superior esquerdo e a dor na mandíbula esquerda, respectivamente.","resp":"Dor precordial: visceral.\nDor no membro superior esquerdo: referida.\nDor na mandíbula: referida.","tema":"a4","seg":"s2"},{"id":"P80.D3","prova":"P80","n":"3","mod":"prova","disc":1,"enun":"Situação-Problema: Motorista de aplicativo, 45 anos, com dor no pescoço recorrente tratada como vício postural. Relata surgimento de lesões de pele vesiculares na nuca à esquerda acompanhadas de formigamento prévio, sem cruzar a linha média. HIV positivo há 13 anos. Durante a ectoscopia, você observou a lesão mostrada na figura abaixo:\n🚨 [IMAGEM NECESSÁRIA / PRECISA DA IMAGEM: Fotografia clínica da nuca esquerda com exantema vesicular em dermátomo (Herpes-Zóster cervical)]\nComando: Baseado nos seus conhecimentos de Semiologia da Dor e Exame Clínico, formule uma única hipótese diagnóstica que consiga explicar os sintomas e sinais apresentados pelo paciente.","resp":"Herpes-zóster (ou Zóster / Herpes-zoster cervical).","tema":"a4","seg":"s4"}],"cai":[{"key":"C7","tipo":"som","titulo":"Equivalente anginoso: isquemia sem precordialgia (idosos e diabéticos)","tema":"a9","seg":"s2","study":"a9/s2","ids":["S77.8","S78.8","S79.22","S80.5","S81.24","S82.17","EDS.16"],"provas":["S77","S78","S79","S80","S81","S82","EDS"],"n":7,"rep":"S81.24","letras":["A"],"first":"S77","last":"EDS"},{"key":"C10","tipo":"som","titulo":"Pneumotórax: FTV diminuído, percussão timpânica, ausculta abolida","tema":"a12","seg":"s5","study":"a12/s5","ids":["S77.11","S78.19","S79.8","S80.16","S81.15","EDS.1"],"provas":["S77","S78","S79","S80","S81","EDS"],"n":6,"rep":"S81.15","letras":["A"],"first":"S77","last":"EDS"},{"key":"C18","tipo":"som","titulo":"B3: início da diástole, enchimento rápido, sobrecarga de volume","tema":"a6","seg":"s2","study":"a6/s2","ids":["S77.19","S78.12","S79.31","S81.3","S82.12","EDS.8"],"provas":["S77","S78","S79","S81","S82","EDS"],"n":6,"rep":"S81.3","letras":["B","C"],"first":"S77","last":"EDS"},{"key":"C33","tipo":"som","titulo":"Broncovesicular é som de ausculta; claro pulmonar é de percussão","tema":"a12","seg":"s4","study":"a12/s4","ids":["S78.24","S79.3","S80.20","S81.14","S82.10","EDS.4"],"provas":["S78","S79","S80","S81","S82","EDS"],"n":6,"rep":"S81.14","letras":["A","B"],"first":"S78","last":"EDS"},{"key":"C27","tipo":"som","titulo":"Derrame pleural: expansibilidade, FTV e sons reduzidos, percussão submaciça","tema":"a12","seg":"s5","study":"a12 PSA de rastreio pedido pelo paciente: decisão compartilhada","tema":"a1","seg":"s2","study":"a1/s2","ids":["P82.22"],"provas":["P82"],"n":1,"rep":"P82.22","letras":["D"],"first":"P82","last":"P82"},{"key":"p:dip","tipo":"par","titulo":"Questão bônus: doença inflamatória pélvica e o tratamento empírico","tema":"a4","seg":"s1","study":"a4/s1","ids":["P81.7-Bônus"],"provas":["P81"],"n":1,"rep":"P81.7-Bônus","letras":["C"],"first":"P81","last":"P81"},{"key":"p:rsass","tipo":"par","titulo":"Revisão sintomatológica: crânio-caudal, por aparelhos, sintomas gerais antes","tema":"a2","seg":"s1","study":"a2/s1","ids":["P80.20"],"provas":["P80"],"n":1,"rep":"P80.20","letras":["C"],"first":"P80","last":"P80"},{"key":"C24","tipo":"som","titulo":"Síncope cardíaca: sem pródromos, sem esboço de defesa","tema":"a10","seg":"s4","study":"a10/s4","ids":["S78.7"],"provas":["S78"],"n":1,"rep":"S78.7","letras":["D"],"first":"S78","last":"S78"},{"key":"p:tep","tipo":"par","titulo":"TEP com irritação diafragmática: dor aguda referida para o ombro","tema":"a4","seg":"s2","study":"a4/s2","ids":["P80.10"],"provas":["P80"],"n":1,"rep":"P80.10","letras":["C"],"first":"P80","last":"P80"},{"key":"p:topicos2","tipo":"par","titulo":"Vacinas, alergias e internações vão na HPP; tabagismo vai nos hábitos","tema":"a2","seg":"s3","study":"a2/s3","ids":["P80.3"],"provas":["P80"],"n":1,"rep":"P80.3","letras":["D"],"first":"P80","last":"P80"},{"key":"C61","tipo":"som","titulo":"Cianose: segmentar por retorno venoso; central responde ao O<sub>2</sub>; sinal tardio","tema":"a11","seg":"s1","study":"a11/s1","ids":["S82.7"],"provas":["S82"],"n":1,"rep":"S82.7","letras":["D"],"first":"S82","last":"S82"},{"key":"C62","tipo":"som","titulo":"Etiqueta (não julgamento) e capacidade de síntese na anamnese","tema":"a1","seg":"s2","study":"a1/s2","ids":["S82.25"],"provas":["S82"],"n":1,"rep":"S82.25","letras":["B"],"first":"S82","last":"S82"}],"notaDor":"Para a Turma 83, o professor não deu a aula teórica de Semiologia da Dor; as questões de dor da parcial foram entregues no Estudo Dirigido como forma de anulação. Para as outras turmas, a dor costuma cair na parcial (Parciais 80, 81 e 82)."},"raiox":{"limites":"Montado com as justificativas oficiais das somativas 77 a 82 (174 itens; 4 eram de outras matérias e ficaram de fora), as parciais 80, 81 e 82, o Estudo Dirigido (texto original) e o Estudo Dirigido da Somativa (enunciado original). As somativas chegaram só como justificativa: o enunciado delas foi reconstruído. É tendência do acervo, não garantia.","formato":[["Caso curto → achado esperado","Um paciente com uma condição (HVD, BRD, derrame, pneumotórax) e a pergunta: o que você encontra no exame? A alternativa certa traz o conjunto de achados; as erradas trazem o achado da doença vizinha.",["C0","C1","C27"]],["Achado → mecanismo","O professor dá o achado (B3, B4, cianose que melhora com O2, poliúria na FA) e pede a causa ou o mecanismo.",["C18","C5","C37"]],["O termo técnico exato","Bradicardia × bradisfigmia, platipneia × ortopneia, fácies atípica = incaracterística. Não aceita termo aproximado.",["C30","p:fc55","p:fp55"]],["Afirmativas I a IV (parcial)","Nas parciais, muitas questões são \"analise as assertivas\" com combinações (apenas I; I e III; todas).",["p:biotipo","p:qp"]],["Em que campo registrar (parcial)","Uma lista de informações da anamnese e a pergunta: QP, HMA, HPP, HF, HV ou RS?",["p:topicos","p:topicos3"]],["Cálculo","Carga tabágica, inclusive com cigarro de palha.",["p:palha","p:tabaco20"]]],"distratores":[["Troca de câmara ou de lado","O achado do VE oferecido para a doença do VD (ictus propulsivo desviado na HVD), ou o sopro mitral no lugar do tricúspide.","Ictus na HVD, Rivero-Carvallo."],["Troca do tempo do ciclo","Sistólico × diastólico; B3 (início da diástole) × B4 (fim da diástole); desdobramento na inspiração × na expiração.","B3/B4, desdobramento invertido do BRE."],["Termo parecido","Bradicardia no lugar de bradisfigmia, ortopneia no lugar de platipneia, melena no lugar de \"evacuação com sangue\".","Dados vitais, dispneias, QP."],["Percussão × ausculta","Som de ausculta oferecido como som de percussão (broncovesicular) e vice-versa (claro pulmonar).","Exame respiratório."],["Síndrome vizinha","Derrame e pneumotórax diminuem o FTV; a alternativa errada troca a percussão (maciço × timpânico).","Derrame, pneumotórax."],["Palavra absoluta","\"B3 é sempre patológica\", \"a dor psicogênica não existe\", \"toda síncope é cardíaca\".","B3 fisiológica, dor psicogênica, síncope."]],"recados":[["a1","Aula 1 · Anamnese I",[["s1","Sinal é objetivo, \"dá pra ver\". Sintoma não se vê: o paciente conta."],["s3","O caso do slide \"Masculino, 46 anos, HAS, tabagista, dislipidêmico... dor precordial típica há 40 minutos\" <b>não é anamnese</b>: é um resumo de caso, sem a estrutura e sem as palavras do paciente. A versão correta separa cada informação no seu campo."],["s4","Os atributos devem ser interrogados <b>depois</b> do relato livre, sem interromper o paciente. Essa ordem já caiu numa parcial sobre dor abdominal."]]],["a2","Aula 2 · Anamnese II",[["s2","\"Amplificar o sintoma quando presente\": se o paciente refere disfagia, aprofunde a descrição como na HMA (para sólidos ou líquidos? progressiva? há quanto tempo?)."],["s3","Pergunte como foi feito o diagnóstico de uma doença prévia: sintomas, evolução, tratamento, complicações. Aprenda com o relato do paciente, mesmo que você não vá registrar tudo. Você estará aprendendo sobre outras doenças."]]],["a3","Aula 3 · Exame físico geral",[["s1","O nome depende de onde se contou. <b>Contou no coração (ausculta)?</b> Bradi ou taquicardia, em bpm. <b>Contou no pulso (palpação)?</b> Bradi ou taquisfigmia, em ppm. Essa distinção caiu em quase toda prova."],["s1","\"Vai cobrar a diferença dos dois\": <b>dislalia × disartria</b>. Dislalia é trocar letras (o Cebolinha); disartria é o defeito motor de articular a fala, com a compreensão e a formulação da linguagem preservadas."],["s2","Embora descritas no exame físico geral, hidratação e desidratação também são diagnósticos."],["s3","\"Não se assuste com o grande número de doenças. Preocupe-se, nesse momento, com a construção de um bom exame clínico.\""],["s3","Nas anotações do slide de sífilis: \"dentes em amora; fronte olímpica; nariz em sela; mandíbula projetada para frente\". Essa sequência caiu como discursiva duas vezes (nome da fácies + doença de base)."]]],["a4","Aula 4 · Semiologia da dor",[["s2","Anotação do slide: \"dor em estruturas distantes do órgão lesado\"."]]],["a5","Aula 5 · Exame cardiovascular I",[["s1","\"Percussão: não precisa mais.\" E: <b>\"Não existe exame físico direcionado de aparelhos que prescinda do exame físico geral.\"</b> Antes do precórdio, olhe a ectoscopia (cianose, edema, turgência jugular, baqueteamento)."],["s1","Anotação do slide: \"Hipertrofia ventricular direita → pulsação epigástrica, levantamento do precórdio, retração sistólica apical\". A pulsação epigástrica é \"comum em crianças\"."],["s3","\"B1 = fechamento das atrioventriculares, discute hiperfonese. B2 = fechamento das semilunares, discute desdobramentos.\" A mitral fecha antes da tricúspide e a aórtica antes da pulmonar: o coração esquerdo fecha primeiro."],["s3","Anotação: \"Tom variável de B1, uma hora forte, outra hora fraco → fibrilação atrial: o nó sinusal perde o comando elétrico do átrio.\""]]],["a6","Aula 6 · Bulhas: desdobramentos, B3 e B4",[["s1","Anotação do slide: \"atrasar o que já é atrasado\". No BRD, o pulmonar já atrasa pelo bloqueio, e na inspiração o retorno venoso \"aumenta o trabalho de quem já era atrasado\"."],["s2","Anotação do slide: \"Ficha uma 3ª bulha, mas ela desaparece quando entra em fibrilação atrial → é B4: depende da contração atrial para acontecer; está fibrilando, tremendo\". E: \"B3 = diástole início, fase de enchimento rápido, sobrecarga de volume, choque do sangue chegando no ventrículo. B4 = diástole final, contração atrial, sobrecarga pressórica, ventrículo hipertrofiado\"."],["s3","\"Ritmo de galope = sempre patológico.\""]]],["a7","Aula 7 · Sopros e pericárdio",[["s4","O material da aula cita a tríade de Beck como hipotensão, hipofonese de bulhas e pulso paradoxal > 10 mmHg. Na literatura clássica, o terceiro item é a <b>turgência jugular</b>; o pulso paradoxal é achado associado. Saiba os dois."]]],["a10","Aula 10 · Síncope",[["s1","\"Todo episódio sincopal merece avaliação médica atenciosa e cuidadosa\": desde causas benignas até afecções potencialmente graves."]]],["a12","Aula 12 · Exame do aparelho respiratório",[["s2","\"Afecções pleurais são <b>antipáticas</b> ao FTV; afecções do parênquima são <b>simpáticas</b>.\" Ou seja: pleura (derrame, pneumotórax) diminui o FTV; parênquima consolidado aumenta."]]]]},"r1h":{"blocos":[{"t":"Bulhas e desdobramentos","min":12,"why":"É o bloco que mais rende questão: desdobramento invertido, BRD, B3 e B4 voltaram em 3 a 5 somativas cada (a Somativa 82 repetiu desdobramento invertido, B3 e B4).","items":[["Os quatro desdobramentos","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Desdobramento</th><th>Quando aparece</th><th>Causa típica</th></tr></thead><tbody><tr><td>Fisiológico de B2</td><td>Só na inspiração, some na expiração</td><td>Normal: a inspiração aumenta o retorno ao VD e atrasa P2</td></tr><tr><td>Persistente e variável (B1 e B2)</td><td>Nos dois tempos, maior na inspiração</td><td><b>BRD</b>: o VD despolariza atrasado</td></tr><tr><td>Persistente e fixo de B2</td><td>Igual na inspiração e na expiração</td><td><b>CIA</b>: o shunt iguala o volume das duas câmaras</td></tr><tr><td>Invertido (paradoxal) de B2</td><td>Na <b>expiração</b>, some na inspiração</td><td><b>BRE</b>: A2 atrasa e passa a vir depois de P2</td></tr></tbody></table></div><div class=\"flx\"><span>Inspiração</span><i>→</i><span>↑ retorno venoso ao VD</span><i>→</i><span>P2 atrasa</span><i>→</i><span>desdobramento fisiológico</span></div>","C4"],["BRD: B1 e B2 desdobradas o tempo todo","No bloqueio de ramo direito o VD contrai atrasado nos dois ruídos: desdobramento de B1 e de B2, persistente e <b>variável</b> (piora na inspiração). Fixo é CIA; invertido é BRE.","C1"],["B3 × B4","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th></th><th>B3</th><th>B4</th></tr></thead><tbody><tr><td>Momento</td><td>Início da diástole (enchimento rápido)</td><td>Fim da diástole (pré-sistólica, contração atrial)</td></tr><tr><td>Mecanismo</td><td>Sobrecarga de <b>volume</b>: sangue bate num ventrículo cheio</td><td>Sobrecarga de <b>pressão</b>: átrio empurra contra ventrículo rígido</td></tr><tr><td>Exemplos</td><td>IC sistólica, insuficiência mitral; fisiológica em criança, atleta e <b>gestante</b></td><td>Estenose aórtica, HAS, hipertrofia</td></tr><tr><td>Galope</td><td>Ventricular</td><td>Atrial (some na <b>fibrilação atrial</b>: não há contração atrial)</td></tr></tbody></table></div>","C18"],["B4 desaparece na fibrilação atrial","B4 depende da contração do átrio. Na FA o átrio não contrai de forma eficaz: não há B4 e não há galope atrial.","C31"]]},{"t":"Ictus, biotipo e sopros","min":10,"why":"Ictus pelo biotipo e Rivero-Carvallo caíram em 5 somativas; a retração apical da HVD, em 4.","items":[["Ictus muda com o biotipo","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Biotipo</th><th>Coração</th><th>Ictus</th></tr></thead><tbody><tr><td>Longilíneo</td><td>Verticalizado</td><td>Mais baixo e medial (6º EIC)</td></tr><tr><td>Normolíneo</td><td>Oblíquo</td><td>5º EIC na linha hemiclavicular esquerda</td></tr><tr><td>Brevilíneo</td><td>Horizontalizado</td><td>Mais alto e lateral (4º EIC)</td></tr></tbody></table></div><p>Variação pelo biotipo não é doença. O longilíneo também é o perfil do pneumotórax espontâneo.</p>","C6"],["HVD: a ponta passa a ser o VD","<div class=\"flx\"><span>Hipertrofia do VD</span><i>→</i><span>a ponta vira VD</span><i>→</i><span>retração sistólica apical</span><i>→</i><span>levantamento em massa e pulsação epigástrica</span></div><p>Ictus propulsivo desviado para baixo e para fora é do <b>VE</b>.</p>","C40"],["Os sopros da prova","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Lesão</th><th>Tempo</th><th>Foco e irradiação</th><th>Pista</th></tr></thead><tbody><tr><td>Estenose aórtica</td><td>Sistólico ejetivo</td><td>Aórtico → carótidas</td><td>Angina, síncope ao esforço, ictus propulsivo, B4</td></tr><tr><td>Insuficiência aórtica</td><td>Diastólico aspirativo</td><td>Aórtico acessório</td><td>Pulso em martelo d'água</td></tr><tr><td>Estenose mitral</td><td><b>Diastólico</b> (ruflar)</td><td>Mitral, em decúbito lateral esquerdo</td><td>Hiperfonese de B1, estalido de abertura</td></tr><tr><td>Insuficiência mitral</td><td>Sistólico regurgitativo</td><td>Mitral → axila</td><td>Refluxo VE → AE, B3</td></tr><tr><td>Insuficiência tricúspide</td><td>Sistólico</td><td>Tricúspide</td><td><b>Rivero-Carvallo</b>: aumenta na inspiração</td></tr></tbody></table></div>","C23"],["Rivero-Carvallo","<div class=\"flx\"><span>Inspiração profunda</span><i>→</i><span>↑ retorno venoso ao coração direito</span><i>→</i><span>↑ sopro da IT</span></div><p>Separa o sopro tricúspide (cresce na inspiração) do mitral (não cresce).</p>","C3"]]},{"t":"Dor torácica e síncope","min":10,"why":"O equivalente anginoso caiu nas 6 somativas (77 a 82). Síncope com sinal de alarme cardíaco caiu em 5.","items":[["Três dores que a prova separa","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th></th><th>Isquêmica (angina/IAM)</th><th>Dissecção de aorta</th><th>Equivalente anginoso</th></tr></thead><tbody><tr><td>Caráter</td><td>Aperto, peso, <b>sinal de Levine</b></td><td>Rasgando, intensa <b>desde o início</b></td><td>Sem dor no peito</td></tr><tr><td>Onde</td><td>Retroesternal → MSE, mandíbula</td><td>Interescapular, migra</td><td>Dispneia, sudorese, náusea, fadiga</td></tr><tr><td>Pista</td><td>Esforço, alivia no repouso/nitrato</td><td><b>PA diferente</b> entre os braços</td><td>Idoso, <b>diabético</b>, mulher</td></tr></tbody></table></div>","C7"],["Sinal de Levine","Punho cerrado sobre o precórdio: o paciente mostra a dor em aperto da isquemia. Caiu nas somativas e nas parciais 80 e 81.","C25"],["Dissecção aguda","Dor máxima já no começo, em rasgão, nas costas (interescapular), com assimetria de pulso ou de PA. Não é dor que \"vai aumentando\".","C8"],["Síncope: de onde vem","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Tipo</th><th>Como chega</th><th>O que sugere</th></tr></thead><tbody><tr><td>Reflexa (vasovagal)</td><td>Pródromos (calor, náusea, visão turva): dá tempo de <b>esboçar defesa</b></td><td>Benigna, gatilho (dor, calor, ficar em pé)</td></tr><tr><td>Ortostática</td><td>Ao levantar; idoso, diurético, desidratação</td><td>Queda da PA em pé</td></tr><tr><td>Cardíaca</td><td><b>Sem pródromos</b>, no esforço ou deitado, com palpitação; paciente se machuca</td><td>Arritmia ou obstrução (estenose aórtica): investigar já</td></tr></tbody></table></div><p>Ortostatismo num jovem saudável <b>não</b> é sinal de alarme cardíaco.</p>","C2"]]},{"t":"Pulso, ritmo e dados vitais","min":6,"why":"O professor cobra o termo exato: bradicardia é da ausculta, bradisfigmia é do pulso.","items":[["O nome depende de onde se contou","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Contado na</th><th>Unidade</th><th>Abaixo de 60</th><th>Acima de 100</th></tr></thead><tbody><tr><td>Ausculta cardíaca (FC)</td><td>bpm</td><td>Bradicardia</td><td>Taquicardia</td></tr><tr><td>Palpação do pulso (FP)</td><td>ppm</td><td><b>Bradisfigmia</b></td><td><b>Taquisfigmia</b></td></tr></tbody></table></div><p>FR normal até 20 irpm (acima: taquipneia). Febre acima de 37,8 °C na prova do professor.</p>","C30"],["FC de 55 na ausculta","Se a frequência veio da ausculta (bpm), o termo é bradicardia, qualquer que seja o motivo.","C53"],["Fibrilação atrial","<div class=\"flx\"><span>Átrio fibrila</span><i>→</i><span>ritmo irregularmente irregular</span><i>→</i><span>B1 de intensidade variável, sem B4</span><i>→</i><span>dissociação pulso-ausculta (déficit de pulso)</span></div><p>Na somativa ainda apareceu a queixa urinária (poliúria) pelo peptídeo natriurético atrial.</p>","C5"]]},{"t":"Respiratório: sinais e exame","min":14,"why":"Pneumotórax caiu em 5 somativas; derrame e broncovesicular em 5; platipneia em 4.","items":[["A tabela que resolve a questão","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th></th><th>Derrame pleural</th><th>Pneumotórax</th><th>Consolidação</th></tr></thead><tbody><tr><td>Expansibilidade</td><td>↓</td><td>↓</td><td>↓</td></tr><tr><td>FTV</td><td>↓ ou abolido</td><td>↓ ou abolido</td><td><b>↑</b></td></tr><tr><td>Percussão</td><td><b>Maciço/submaciço</b></td><td><b>Timpânico</b> (hipersonoro)</td><td>Maciço/submaciço</td></tr><tr><td>Ausculta</td><td>MV ↓ ou abolido</td><td>MV abolido</td><td>Sopro tubário, estertores</td></tr></tbody></table></div><p>FTV diminui no derrame e no pneumotórax: quem separa é a <b>percussão</b>.</p>","C10"],["Percussão × ausculta","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Percussão (som)</th><th>Ausculta (som)</th></tr></thead><tbody><tr><td>Claro pulmonar, timpânico, maciço, submaciço</td><td>Murmúrio vesicular, broncovesicular, brônquico (traqueal)</td></tr></tbody></table></div><p>\"Broncovesicular\" nunca é som de percussão; o hipocôndrio direito é maciço (fígado).</p>","C33"],["As dispneias pela posição","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Nome</th><th>Piora</th><th>Melhora</th></tr></thead><tbody><tr><td>Ortopneia</td><td>Deitado</td><td>Sentado (IC)</td></tr><tr><td><b>Platipneia</b></td><td><b>Em pé</b></td><td>Deitado</td></tr><tr><td>Trepopneia</td><td>Num decúbito lateral</td><td>No outro decúbito</td></tr><tr><td>Dispneia paroxística noturna</td><td>Acorda à noite com falta de ar</td><td>Sentando ou levantando</td></tr></tbody></table></div>","C9"],["Cianose central melhora com O2","Cianose central (pulmonar, sangue arterial dessaturado) melhora com oxigênio; a periférica (vasoconstrição, estase) melhora aquecendo ou elevando o membro.","C37"],["DPOC: os dois fenótipos","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th></th><th>Soprador rosado</th><th>Congesto azulado</th></tr></thead><tbody><tr><td>Base</td><td>Enfisema</td><td>Bronquite crônica</td></tr><tr><td>Aspecto</td><td>Magro, lábios franzidos, tórax em tonel</td><td>Cianose, edema, obeso</td></tr><tr><td>Tosse</td><td>Pouca</td><td><b>Produtiva crônica</b></td></tr></tbody></table></div><p>Asma e DPOC são distúrbios <b>obstrutivos</b>; a asma agudiza de repente, com tosse noturna e chiado.</p>","C22"]]},{"t":"Anamnese, dor e exame geral (base da parcial)","min":8,"why":"Caem nas parciais e voltam na somativa: exame clínico, campos da anamnese, classificação da dor e carga tabágica.","items":[["Exame clínico","<div class=\"flx\"><span>Anamnese</span><i>→</i><span>+ exame físico</span><i>→</i><span>= exame clínico</span></div><p>Exame complementar fica de fora. \"A clínica é soberana\". No atestado \"ao exame clínico\", o médico usou só anamnese e exame físico.</p>","C11"],["Onde vai cada informação","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Informação</th><th>Campo</th></tr></thead><tbody><tr><td>\"Evacuação com sangue\" (palavras do paciente)</td><td>QP (nunca \"melena\")</td></tr><tr><td>Vacinas, alergias, cirurgias, internações, doenças controladas</td><td>HPP</td></tr><tr><td>Tabagismo, álcool, atividade física</td><td>Hábitos de vida</td></tr><tr><td>Pai morreu de IAM aos 54 anos</td><td>HF</td></tr><tr><td>Sintomas sem relação com a QP</td><td>RS / anamnese especial</td></tr><tr><td>\"BEG, lúcido, afebril\"</td><td>Exame físico geral (não é RS)</td></tr></tbody></table></div>","C20"],["Classificar a dor","<div class=\"tw\"><table class=\"cobt\"><thead><tr><th>Tipo</th><th>Exemplo da prova</th></tr></thead><tbody><tr><td>Nociceptiva somática profunda</td><td>Torção de joelho (aguda)</td></tr><tr><td>Nociceptiva visceral</td><td>Cólica biliar, dor precordial do IAM</td></tr><tr><td>Referida</td><td>Ombro na irritação diafragmática; MSE e mandíbula no IAM</td></tr><tr><td>Neuropática</td><td>Dor com disestesia do zóster</td></tr><tr><td>Psicogênica</td><td>Existe, sem substrato anatômico ou exame que a defina</td></tr></tbody></table></div>","p:psico"],["Carga tabágica","<div class=\"flx\"><span>cigarros por dia ÷ 20</span><i>→</i><span>× anos fumando</span><i>→</i><span>= anos-maço</span></div><p>Cigarro de palha: 1 palha = 5 cigarros industrializados. 8 palhas/dia = 40 cigarros = 2 maços × 25 anos = <b>50 anos-maço</b>.</p>","p:palha"]]}]},"revf":{"a1":{"lema":"Sintoma se conta, sinal se vê. A anamnese tem ordem, e cada informação tem o seu campo.","cards":[["Sintoma × sinal × exame clínico","<div class=\"cmp c2\"><div><b>Sintoma</b><ul><li>Subjetivo: o paciente <b>relata</b></li><li>Vem da <b>anamnese</b></li><li>Dor, tontura, náusea, cansaço</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Sinal</b><ul><li>Objetivo: o examinador <b>observa ou mede</b></li><li>Vem do <b>exame físico</b></li><li>Febre aferida, icterícia, sopro, edema</li></ul></div></div><div class=\"flx\"><span>Anamnese</span><i aria-hidden=\"true\">→</i><span>+ Exame físico</span><i aria-hidden=\"true\">→</i><span>= <b>Exame clínico</b></span></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> \"Ao exame clínico\" inclui o ECG e a radiografia.</p><p class=\"ok\"><b>O certo</b> <mark class=\"f5\" data-refs=\"S77.12,S79.24,S80.4,S81.23,S78.4,P82.15,P81.Atestado-Médico,P80.9\">Exame clínico é anamnese + exame físico</mark>. Exames complementares ficam de fora.</p></div><div class=\"gk\"><b>Grave isto</b><p>\"A clínica é soberana\": o complementar confirma ou afasta a hipótese que a clínica levantou. Ele não substitui a anamnese nem o exame.</p></div>",["C11","C21","p:atestado","p:soberana"]],["Técnicas da entrevista","<p>Técnica <b>mista</b>: primeiro o relato livre, com perguntas abertas; depois as perguntas dirigidas.</p><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Técnica</th><th>O que o médico faz</th><th>Exemplo</th></tr></thead><tbody><tr><th scope=\"row\">Facilitação</th><td>Estimula a continuar, com gesto ou palavra</td><td>\"Hum-hum… continue.\"</td></tr><tr><th scope=\"row\">Reflexão</th><td>Repete uma palavra do paciente</td><td>\"O peito apertava?\"</td></tr><tr><th scope=\"row\">Esclarecimento</th><td>Pede para definir um termo vago</td><td>\"O que o senhor chama de tontura?\"</td></tr><tr><th scope=\"row\">Confrontação</th><td>Aponta uma contradição ou emoção</td><td>\"Diz que está bem, mas parece preocupado.\"</td></tr><tr><th scope=\"row\">Interpretação</th><td>Tira uma conclusão do que ouviu</td><td>\"Parece que a dor piora quando está nervoso.\"</td></tr><tr><th scope=\"row\">Apoio e empatia</th><td>Acolhe a emoção</td><td>\"Entendo que isso assusta.\"</td></tr><tr><th scope=\"row\">Decisão compartilhada</th><td>Expõe riscos e benefícios e decide junto</td><td>PSA de rastreio pedido pelo paciente</td></tr></tbody></table></div>",["p:psa"]],["A anamnese em ordem","<div class=\"flx\"><span>Identificação</span><i aria-hidden=\"true\">→</i><span>QP</span><i aria-hidden=\"true\">→</i><span>HMA</span><i aria-hidden=\"true\">→</i><span>RS / AE / IS</span><i aria-hidden=\"true\">→</i><span>HPP</span><i aria-hidden=\"true\">→</i><span>HF</span><i aria-hidden=\"true\">→</i><span>HV</span><i aria-hidden=\"true\">→</i><span>HSC</span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Campo</th><th>O que entra</th></tr></thead><tbody><tr><th scope=\"row\">Identificação</th><td>Nome, idade, sexo, cor, estado civil, profissão, naturalidade, <b>procedência</b> (de onde veio recentemente), residência</td></tr><tr><th scope=\"row\">QP</th><td>O motivo da consulta, <b>curto, entre aspas, nas palavras do paciente</b>, com a duração</td></tr><tr><th scope=\"row\">HMA</th><td>A história da QP em ordem cronológica, com os 7 atributos</td></tr></tbody></table></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> QP: \"melena há 2 dias\".</p><p class=\"ok\"><b>O certo</b> QP: \"<mark class=\"f5\" data-refs=\"S78.2,S79.11,S80.14,P82.9,P80.12\">evacuação com sangue há 2 dias</mark>\". Nada de termo técnico nem de diagnóstico na QP.</p></div>",["C20","p:qp"]],["HMA: os 7 atributos do sintoma","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Atributo</th><th>Pergunta</th><th>Na dor torácica</th></tr></thead><tbody><tr><th scope=\"row\">1. Localização</th><td>Onde? Irradia?</td><td>Retroesternal, irradia para o braço esquerdo</td></tr><tr><th scope=\"row\">2. Características</th><td>Como é?</td><td>Aperto, peso</td></tr><tr><th scope=\"row\">3. Intensidade</th><td>Quanto, de 0 a 10?</td><td>8/10</td></tr><tr><th scope=\"row\">4. Cronologia</th><td>Quando começou, quanto dura, como evoluiu?</td><td>Há 2 h, contínua</td></tr><tr><th scope=\"row\">5. Circunstâncias</th><td>O que fazia quando começou?</td><td>Subindo escada</td></tr><tr><th scope=\"row\">6. Piora e melhora</th><td>O que piora? O que alivia?</td><td>Piora ao esforço, alivia no repouso</td></tr><tr><th scope=\"row\">7. Manifestações associadas</th><td>O que vem junto?</td><td>Sudorese, náusea</td></tr></tbody></table></div><div class=\"gk\"><b>Grave isto</b><p>Urgência não dispensa a anamnese: ela fica mais curta e dirigida, mas existe.</p></div>",["C49","p:abd"]]]},"a2":{"lema":"RS varre o corpo de cima a baixo; HPP guarda o passado, mesmo o que já está controlado.","cards":[["Revisão de sistemas (RS = AE = IS)","<div class=\"flx\"><span>Sintomas gerais (febre, peso, astenia)</span><i aria-hidden=\"true\">→</i><span>Pele</span><i aria-hidden=\"true\">→</i><span>Cabeça e COONG</span><i aria-hidden=\"true\">→</i><span>Pescoço</span><i aria-hidden=\"true\">→</i><span>Tórax</span><i aria-hidden=\"true\">→</i><span>Abdome</span><i aria-hidden=\"true\">→</i><span>Geniturinário</span><i aria-hidden=\"true\">→</i><span>Locomotor</span><i aria-hidden=\"true\">→</i><span>Neuro e psiquismo</span></div><p><mark class=\"f5\" data-refs=\"P82.16,P81.5,P80.20,S80.9,S81.28\">Crânio-caudal, sintomas gerais primeiro, por aparelho, mesmo sem ligação com a QP</mark>. Sintoma presente é caracterizado; os negativos vão por extenso.</p><div class=\"cmp c2\"><div><b>Vai na HMA</b><ul><li>A QP e tudo o que se liga a ela</li><li>Vertigem com zumbido que motivou a consulta</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Vai na RS</b><ul><li>Os demais sintomas, aparelho por aparelho</li><li>Plenitude auricular, sintomas de outros sistemas</li></ul></div></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Escrever \"RS: NDN\".</p><p class=\"ok\"><b>O certo</b> Escrever o que foi perguntado e negado. NDN (\"nada digno de nota\") é sigla a evitar.</p></div>",["p:rs","p:rsass","p:vertigem","p:aereg","p:ouvido","C49"]],["Termos que a prova troca","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Termo</th><th>Significa</th><th>Não confunda com</th></tr></thead><tbody><tr><th scope=\"row\">Disfagia</th><td>Dificuldade para deglutir</td><td><b>Odinofagia</b>: dor ao deglutir</td></tr><tr><th scope=\"row\">Melena</th><td>Fezes pretas, pastosas e fétidas: sangramento <b>alto</b></td><td><b>Enterorragia</b>: sangue vivo pelo ânus, sangramento <b>baixo</b></td></tr><tr><th scope=\"row\">Dispepsia</th><td>Desconforto ou má digestão no epigástrio</td><td><b>Pirose</b>: queimação retroesternal (azia)</td></tr><tr><th scope=\"row\">Menorragia</th><td>Fluxo aumentado no período menstrual</td><td><b>Metrorragia</b>: sangramento fora do ciclo; <b>menometrorragia</b>: os dois</td></tr><tr><th scope=\"row\">Dismenorreia</th><td>Cólica menstrual</td><td><b>Dispareunia</b>: dor na relação sexual</td></tr></tbody></table></div>",[]],["Cada informação no seu campo","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Campo</th><th>Entra</th><th>Pegadinha comum</th></tr></thead><tbody><tr><th scope=\"row\">HPP (antecedentes pessoais)</th><td>Doenças prévias <b>mesmo controladas</b>, internações, cirurgias, alergias, traumas, transfusões, GPA, <b>vacinas</b>, medicamentos</td><td>HAS controlada ainda é HPP</td></tr><tr><th scope=\"row\">HF (familiares)</th><td>Doenças e causa de morte de pais, irmãos e filhos</td><td>Infarto do pai é HF, não HPP</td></tr><tr><th scope=\"row\">HV (hábitos de vida)</th><td>Alimentação, atividade física, <b>tabagismo</b>, álcool, drogas, sono</td><td>Tabagismo é HV, não HPP</td></tr><tr><th scope=\"row\">HSC (socioeconômica)</th><td>Moradia, saneamento, renda, escolaridade, trabalho</td><td></td></tr></tbody></table></div><div class=\"gk\"><b>Grave isto</b><p><mark class=\"f5\" data-refs=\"S77.14,S78.21,S79.7,S80.6,P82.18,P81.20\">A HPP registra o que tem interesse médico mesmo sem doença ativa</mark>: alergia, vacina, cirurgia antiga.</p></div>",["C13","p:hpp","p:topicos","p:topicos2","p:topicos3"]],["Carga tabágica (anos-maço)","<div class=\"flx\"><span>Cigarros por dia ÷ 20</span><i aria-hidden=\"true\">→</i><span>= maços por dia</span><i aria-hidden=\"true\">→</i><span>× anos fumando</span><i aria-hidden=\"true\">→</i><span>= <b>anos-maço</b></span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Caso</th><th>Conta</th><th>Resultado</th></tr></thead><tbody><tr><th scope=\"row\">20 cigarros/dia por 15 anos</th><td>1 maço × 15</td><td><b><mark class=\"f1\" data-refs=\"P81.18\">15 anos-maço</mark></b></td></tr><tr><th scope=\"row\">10 cigarros/dia por 30 anos</th><td>0,5 maço × 30</td><td>15 anos-maço</td></tr><tr><th scope=\"row\">4 cigarros de palha/dia por 10 anos</th><td><mark class=\"f2\" data-refs=\"P82.14,P81.4\">1 palha = 5 cigarros</mark> → 20 cigarros = 1 maço × 10</td><td>10 anos-maço</td></tr></tbody></table></div>",["p:tabaco20","p:palha"]]]},"a3":{"lema":"O exame físico geral começa no primeiro olhar: estado geral, fácies, biotipo e postura já dão pistas.","cards":[["Dados vitais","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Parâmetro</th><th>Normal</th><th>Acima</th><th>Abaixo</th></tr></thead><tbody><tr><th scope=\"row\">FC (ausculta, bpm)</th><td>60–100</td><td>Taqui<b>cardia</b></td><td>Bradi<b>cardia</b></td></tr><tr><th scope=\"row\">FP (palpação, ppm)</th><td>60–100</td><td>Taqui<b>sfigmia</b></td><td>Bradi<b>sfigmia</b></td></tr><tr><th scope=\"row\">FR (irpm)</th><td>14/16–20</td><td>Taquipneia</td><td>Bradipneia</td></tr><tr><th scope=\"row\">Temperatura</th><td>Até 37,8 °C</td><td><b>Febre: > 37,8 °C</b></td><td>Hipotermia</td></tr></tbody></table></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Pulso radial de 110 ppm: \"taquicárdico\".</p><p class=\"ok\"><b>O certo</b> <mark class=\"f5\" data-refs=\"P82.2,P81.2,S78.17,S81.5,S82.19\">Pulso é esfigmia: taquisfígmico</mark>. Cardia (coração) só na ausculta.</p></div>",["C29","C57","p:vitais","C30"]],["Estado geral, consciência e fala","<p><mark class=\"f4\" data-refs=\"S78.11,S79.14,S80.11,P82.7\">BEG / REG / MEG, lúcido e afebril são do exame físico geral (ectoscopia)</mark>, feito em todos os casos desde o primeiro contato. Não é revisão de sistemas.</p><div class=\"cmp c2\"><div><b>Dislalia</b><ul><li><b>Troca de fonemas</b></li><li>\"Pato\" por \"prato\"</li><li>Comum na criança</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Disartria</b><ul><li>Distúrbio <b>motor</b> da articulação</li><li>Linguagem preservada</li><li>AVC, doenças neuromusculares</li></ul></div></div><p><b>LOTE</b> = lúcido e orientado no tempo e no espaço.</p>",["C26","p:beg","p:ecto"]],["Biotipos","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>Longilíneo</th><th>Normolíneo</th><th>Brevilíneo</th></tr></thead><tbody><tr><th scope=\"row\">Ângulo de Charpy</th><td>Agudo (< 90°)</td><td>≈ 90°</td><td>Obtuso (> 90°)</td></tr><tr><th scope=\"row\">Coração</th><td>Verticalizado</td><td>Oblíquo</td><td>Horizontalizado</td></tr><tr><th scope=\"row\">Ictus cordis</th><td>6º EIC, mais medial</td><td><b>5º EIC na LHC</b></td><td>4º EIC, mais lateral</td></tr><tr><th scope=\"row\">Detalhe de prova</th><td><mark class=\"f5\" data-refs=\"S77.13,S80.27,S81.9,P82.6,P81.13,P80.1,S82.9\">Pneumotórax espontâneo</mark></td><td>Referência</td><td>Pescoço curto, tórax largo</td></tr></tbody></table></div><div class=\"gk\"><b>Grave isto</b><p><mark class=\"f5\" data-refs=\"S77.7,S78.9,S79.5,S81.27,S77.13,S80.27,S81.9,P82.6,P81.13,P80.1,S82.6,S82.9\">O biotipo muda a posição do ictus e a leitura dos exames de imagem</mark>. Variação pelo biotipo não é doença.</p></div>",["C6","C12","p:biotipo"]],["Estado nutricional","<div class=\"cmp c2\"><div><b>O que se avalia</b><ul><li>Peso, altura e IMC</li><li>Panículo adiposo</li><li>Massa muscular (sarcopenia)</li><li>Relevos ósseos</li><li>Fâneros, pele e mucosas</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Leitura</b><ul><li>Relevos ósseos salientes: desnutrição</li><li>Cabelo fino e quebradiço: carência</li><li>Perda muscular: sarcopenia</li></ul></div></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Ganhou 5 kg em poucas horas: engordou.</p><p class=\"ok\"><b>O certo</b> <mark class=\"f5\" data-refs=\"S79.20,S81.8,P82.1,P81.3,P80.13,S82.8\">Variação de peso em horas é líquido (edema, ascite)</mark>, não gordura.</p></div>",["C45","p:nutri"]],["Fácies","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Fácies</th><th>O que se vê</th><th>Pense em</th></tr></thead><tbody><tr><th scope=\"row\">Atípica</th><td>Nada característico</td><td><mark class=\"f5\" data-refs=\"S79.9,S81.21,P82.19,P80.18,S82.24\">Normal: atípica = incaracterística</mark></td></tr><tr><th scope=\"row\">Cushingoide</th><td>Lua cheia, rubor, acne, hirsutismo</td><td><mark class=\"f4\" data-refs=\"P82.13,P81.1,S81.22,S82.16\">Corticoide, Cushing</mark></td></tr><tr><th scope=\"row\">Hipertireoidea</th><td>Exoftalmia, olhar de espanto</td><td><mark class=\"f2\" data-refs=\"P82.20,P81.10\">Hipertireoidismo (Graves)</mark></td></tr><tr><th scope=\"row\">Mixedematosa</th><td>Face inchada, pálida, apática</td><td>Hipotireoidismo</td></tr><tr><th scope=\"row\">Acromegálica</th><td>Mandíbula, nariz e lábios grandes</td><td>Excesso de GH</td></tr><tr><th scope=\"row\">Renal</th><td>Edema palpebral, palidez</td><td>Síndrome nefrótica</td></tr><tr><th scope=\"row\">Adenoideana</th><td>Face alongada, boca entreaberta, palato ogival</td><td><mark class=\"f1\" data-refs=\"P80.4\">Hipertrofia de adenoides</mark></td></tr><tr><th scope=\"row\">Luética</th><td>Fronte olímpica, nariz em sela, dentes de Hutchinson</td><td><mark class=\"f2\" data-refs=\"P81.9,P80.19\">Sífilis congênita</mark></td></tr><tr><th scope=\"row\">Parkinsoniana</th><td>Inexpressiva, em máscara</td><td>Parkinson</td></tr><tr><th scope=\"row\">Miastênica</th><td>Ptose palpebral bilateral</td><td>Miastenia gravis</td></tr><tr><th scope=\"row\">Hipocrática</th><td>Olhos fundos, nariz afilado, palidez</td><td>Doença grave, fase terminal</td></tr></tbody></table></div>",["C41","p:atipica","p:cush","C60","p:hipert","p:adenoide","p:sifilis"]],["Atitude e decúbito","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Posição</th><th>Por que alivia</th><th>Doença</th></tr></thead><tbody><tr><th scope=\"row\">Cócoras</th><td><mark class=\"f5\" data-refs=\"S78.15,S79.29,S80.23,S81.29,S82.3\">Aumenta a resistência periférica e reduz o shunt D→E</mark></td><td>Tetralogia de Fallot</td></tr><tr><th scope=\"row\">Genupeitoral (prece maometana)</th><td>Diminui a compressão do coração</td><td>Derrame pericárdico</td></tr><tr><th scope=\"row\">Ortopneia (sentado)</th><td>Reduz o retorno venoso ao pulmão congesto</td><td>Insuficiência cardíaca</td></tr><tr><th scope=\"row\">Deitado sobre o lado doente</th><td>Imobiliza a pleura inflamada</td><td>Dor pleurítica</td></tr></tbody></table></div>",["C28"]],["Pele, mucosas e edema","<p>Descrição padrão: mucosas <b>coradas, hidratadas, anictéricas e acianóticas</b>. Baqueteamento digital (dedos em baqueta, unhas em vidro de relógio): doença pulmonar ou cardíaca crônica.</p><div class=\"cmp c2\"><div><b>Edema mole</b><ul><li>Deixa cacifo (Godet)</li><li>IC, insuficiência renal, hipoalbuminemia</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Edema duro</b><ul><li>Pouco ou nenhum cacifo</li><li>Linfedema, mixedema</li></ul></div></div>",[]]]},"a4":{"lema":"Classifique toda dor em três perguntas: de onde vem, qual o mecanismo e há quanto tempo.","cards":[["Pelo mecanismo","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Tipo</th><th>O que acontece</th><th>Exemplo de prova</th></tr></thead><tbody><tr><th scope=\"row\">Nociceptiva</th><td>Lesão do tecido, vias nervosas íntegras</td><td><mark class=\"f4\" data-refs=\"ED.4,P82.8,P81.8,P80.16\">Cólica biliar</mark>, entorse de joelho</td></tr><tr><th scope=\"row\">Neuropática</th><td>Lesão do próprio sistema nervoso: queimação, choque, alodinia, no dermátomo</td><td><mark class=\"f2\" data-refs=\"ED.5,P81.11\">Herpes-zóster</mark></td></tr><tr><th scope=\"row\">Mista</th><td>As duas juntas</td><td>Lombociatalgia, dor do câncer</td></tr><tr><th scope=\"row\">Psicogênica</th><td><mark class=\"f4\" data-refs=\"ED.2,P82.11,P81.22,P80.5\">Sem substrato anatômico, mas genuína; diagnóstico de exclusão</mark></td><td>Mais comum com transtornos do humor; manejo multiprofissional</td></tr></tbody></table></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Dor psicogênica é \"inventada\" ou fingimento.</p><p class=\"ok\"><b>O certo</b> Ela existe e dói de verdade; só não há lesão nem exame que a defina.</p></div>",["p:psico","p:colecisto","p:exemplos","p:dip"]],["Pela origem","<div class=\"cmp c3\"><div><b>Somática superficial</b><ul><li>Pele e mucosas</li><li>Bem localizada</li><li>Pontada, queimação</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Somática profunda</b><ul><li>Músculo, osso, articulação</li><li>Localização razoável</li><li><mark class=\"f3\" data-refs=\"P82.10,P81.Torção-Joelho,P80.11\">Torção de joelho</mark></li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Visceral</b><ul><li>Órgãos</li><li><b>Vaga, difusa, mal localizada</b></li><li>Cólica, náusea, sudorese</li></ul></div></div>",["p:joelho","p:colecisto"]],["Dor longe da origem","<div class=\"cmp c3\"><div><b>Referida</b><ul><li>Convergência no <b>mesmo segmento medular</b></li><li>IAM → braço esquerdo e mandíbula</li><li><mark class=\"f2\" data-refs=\"P82.21,P80.10\">Ombro após videolaparoscopia ou TEP: irritação do diafragma</mark></li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Irradiada</b><ul><li>Segue o <b>trajeto de um nervo</b> ou raiz</li><li>Ciatalgia: lombar → face posterior da perna</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Disseminação fascial</b><ul><li>A <b>infecção se espalha</b> pelas fáscias</li><li>Gangrena de Fournier</li></ul></div></div><div class=\"gk\"><b>Grave isto</b><p><mark class=\"f3\" data-refs=\"ED.1,P82.3,ED.5,P81.11\">Referida é pelo segmento medular; irradiada é pelo nervo</mark>.</p></div>",["p:dist","p:ombro","p:tep","p:exemplos"]],["Decálogo da dor e tempo","<ol class=\"dec\"><li>Localização</li><li>Irradiação</li><li>Qualidade (caráter)</li><li>Intensidade (0–10)</li><li>Duração</li><li>Evolução</li><li>Relação com funções do organismo</li><li>Fatores desencadeantes ou agravantes</li><li>Fatores de alívio</li><li>Manifestações associadas</li></ol><div class=\"cmp c2\"><div><b>Aguda</b><ul><li><b>Menos de 3 meses</b></li><li>Alerta de lesão</li><li>Ex.: <mark class=\"f3\" data-refs=\"ED.3,P81.6,P80.8\">dor no membro do adolescente há dias</mark></li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Crônica</b><ul><li><b>3 meses ou mais</b></li><li>Vira doença em si</li><li>Ex.: lombalgia de anos</li></ul></div></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Classificar como \"subaguda\".</p><p class=\"ok\"><b>O certo</b> Nesta classificação só existem aguda (< 3 meses) e crônica (≥ 3 meses).</p></div>",["p:cresc","p:joelho","p:abd"]]]},"a5":{"lema":"O ictus é a ponta do VE; cada foco escuta uma valva, e B1 abre a sístole enquanto B2 abre a diástole.","cards":[["Ictus cordis","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Situação</th><th>Como fica o ictus</th></tr></thead><tbody><tr><th scope=\"row\">Normal (normolíneo)</th><td><b>5º EIC na LHC esquerda</b>, 1 a 2 polpas digitais</td></tr><tr><th scope=\"row\">Hipertrofia do VE</th><td><mark class=\"f4\" data-refs=\"S78.6,S80.18,S81.13,S82.22\">Propulsivo, desviado para baixo e para fora, mais de 2 polpas</mark></td></tr><tr><th scope=\"row\">Hipertrofia do VD</th><td><mark class=\"f4\" data-refs=\"S79.4,S81.30,S77.1,S80.3\">A ponta vira VD: retração sistólica apical, levantamento em massa, pulsação epigástrica</mark></td></tr><tr><th scope=\"row\">Biotipo</th><td><mark class=\"f5\" data-refs=\"S77.7,S78.9,S79.5,S81.27,S82.6\">Longilíneo 6º EIC · normolíneo 5º · brevilíneo 4º</mark></td></tr></tbody></table></div>",["C6","C40","C0"]],["Focos de ausculta","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Foco</th><th>Onde fica</th><th>Escuta</th></tr></thead><tbody><tr><th scope=\"row\">Aórtico</th><td>2º EIC direito, paraesternal</td><td>Valva aórtica</td></tr><tr><th scope=\"row\">Pulmonar</th><td>2º EIC esquerdo, paraesternal</td><td>Valva pulmonar</td></tr><tr><th scope=\"row\">Aórtico acessório (Erb)</th><td>3º EIC esquerdo</td><td>Insuficiência aórtica</td></tr><tr><th scope=\"row\">Tricúspide</th><td>Base do apêndice xifoide (4º–5º EIC esquerdo)</td><td>Valva tricúspide</td></tr><tr><th scope=\"row\">Mitral</th><td>5º EIC na LHC esquerda (ictus)</td><td>Valva mitral</td></tr></tbody></table></div><div class=\"cmp c2\"><div><b>Decúbito lateral esquerdo + campânula</b><ul><li>B3, B4</li><li>Ruflar da estenose mitral</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Sentado, inclinado para a frente, em expiração</b><ul><li>Sopros da base</li><li>Insuficiência aórtica, atrito pericárdico</li></ul></div></div>",[]],["B1 × B2","<div class=\"flx\"><span>B1</span><i aria-hidden=\"true\">→</i><span>sístole (pequeno silêncio)</span><i aria-hidden=\"true\">→</i><span>B2</span><i aria-hidden=\"true\">→</i><span>diástole (grande silêncio)</span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>B1</th><th>B2</th></tr></thead><tbody><tr><th scope=\"row\">O que fecha</th><td>Mitral e tricúspide (AV)</td><td>Aórtica e pulmonar (semilunares)</td></tr><tr><th scope=\"row\">Marca</th><td>Início da sístole</td><td>Início da diástole</td></tr><tr><th scope=\"row\">Melhor foco</th><td>Ponta (mitral)</td><td>Base (aórtico e pulmonar)</td></tr><tr><th scope=\"row\">Mais forte</th><td>Estenose mitral não calcificada, taquicardia</td><td>A2: HAS · P2: hipertensão pulmonar</td></tr><tr><th scope=\"row\">Detalhe</th><td><b>Intensidade variável</b>: FA, BAVT</td><td>Clangorosa (metálica): aortite luética</td></tr></tbody></table></div>",[]],["Fonese de B1: o que muda e por quê","<div class=\"flx\"><span>Cúspides mais abertas quando o VE contrai</span><i aria-hidden=\"true\">→</i><span>caminho maior até fechar</span><i aria-hidden=\"true\">→</i><span>fecham com mais força</span><i aria-hidden=\"true\">→</i><span><b>B1 mais forte</b></span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>B1</th><th>Causa</th><th>Por quê</th></tr></thead><tbody><tr><th scope=\"row\">Hiperfonética</th><td>PR curto, taquicardia, febre, anemia, hipertireoidismo, exercício</td><td>A sístole chega com as cúspides ainda bem abertas e o VE contrai com força</td></tr><tr><th scope=\"row\">Hiperfonética</th><td>Estenose mitral <b>não calcificada</b></td><td>O gradiente AE → VE mantém a valva aberta até o fim da diástole; folhetos tensos fecham de longe</td></tr><tr><th scope=\"row\">Hiperfonética</th><td>Criança, tórax fino</td><td>Menos tecido entre o coração e o estetoscópio</td></tr><tr><th scope=\"row\">Hipofonética</th><td>PR longo (BAV de 1º grau)</td><td>As cúspides já estão quase fechadas quando o VE contrai</td></tr><tr><th scope=\"row\">Hipofonética</th><td>Estenose mitral <b>calcificada</b></td><td>Folhetos rígidos quase não se movem</td></tr><tr><th scope=\"row\">Hipofonética</th><td>Insuficiência mitral</td><td>A valva não fecha por completo</td></tr><tr><th scope=\"row\">Hipofonética</th><td>IC grave, choque, infarto extenso</td><td>Contração fraca: o ventrículo empurra devagar</td></tr><tr><th scope=\"row\">Hipofonética</th><td>Obesidade, enfisema, derrame pericárdico</td><td>O som atravessa mais gordura, ar ou líquido</td></tr><tr><th scope=\"row\">Variável</th><td><mark class=\"f5\" data-refs=\"S77.6,S78.16,S79.25,S80.17,S81.20,S82.18\">Fibrilação atrial</mark></td><td>Cada diástole tem uma duração: o ventrículo enche diferente e as cúspides estão em posições diferentes</td></tr><tr><th scope=\"row\">Variável (em canhão)</th><td>BAVT</td><td>Átrio e ventrículo dissociados: quando a contração atrial cai logo antes da ventricular, B1 sai muito forte</td></tr></tbody></table></div><div class=\"gk\"><b>Grave isto</b><p>B1 forte = cúspides abertas e móveis no início da sístole. B1 fraca = cúspides já fechando, rígidas ou que não fecham, ou som que não atravessa.</p></div>",["C5","C51"]]]},"a6":{"lema":"Desdobramento mostra quem fecha atrasado; B3 é volume no começo da diástole, B4 é pressão no fim.","cards":[["Os quatro desdobramentos","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Desdobramento</th><th>Quando se ouve</th><th>Causa</th></tr></thead><tbody><tr><th scope=\"row\">Fisiológico de B2</th><td>Só na <b>inspiração</b></td><td>Normal: a inspiração aumenta o retorno ao VD e atrasa P2</td></tr><tr><th scope=\"row\">Persistente e variável (B1 e B2)</th><td>Nas duas fases, maior na inspiração</td><td><mark class=\"f3\" data-refs=\"S77.2,S80.10,S81.7\">BRD: o VD despolariza atrasado</mark></td></tr><tr><th scope=\"row\">Persistente e fixo de B2</th><td>Igual na inspiração e na expiração</td><td><mark class=\"f1\" data-refs=\"S80.15\">CIA</mark></td></tr><tr><th scope=\"row\">Invertido (paradoxal) de B2</th><td>Só na <b>expiração</b>; some na inspiração</td><td><mark class=\"f5\" data-refs=\"S77.5,S78.29,S79.23,S81.26,S80.2,S82.15\">BRE: A2 vem depois de P2</mark></td></tr></tbody></table></div><div class=\"flx\"><span>Inspiração</span><i aria-hidden=\"true\">→</i><span>↑ retorno venoso ao VD</span><i aria-hidden=\"true\">→</i><span>P2 atrasa</span><i aria-hidden=\"true\">→</i><span>B2 desdobra (fisiológico)</span></div><div class=\"gk\"><b>Grave isto</b><p>Fisiológico = inspiração · <b>Fixo = CIA</b> · <b>Invertido = BRE</b> · Variável de B1 e B2 = BRD.</p></div>",["C4","C1","C47","C50","C43"]],["B3 × B4","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>B3</th><th>B4</th></tr></thead><tbody><tr><th scope=\"row\">Momento</th><td><mark class=\"f5\" data-refs=\"S77.19,S78.12,S79.31,S81.3,S82.12\">Início da diástole (enchimento rápido)</mark></td><td><mark class=\"f5\" data-refs=\"S79.10,S81.17,S77.20,S78.1,S82.1\">Fim da diástole, pré-sistólica (contração atrial)</mark></td></tr><tr><th scope=\"row\">Mecanismo</th><td>Sobrecarga de <b>volume</b></td><td>Sobrecarga de <b>pressão</b> (ventrículo rígido)</td></tr><tr><th scope=\"row\">Exemplos</th><td>IC sistólica, insuficiência mitral</td><td>Estenose aórtica, HAS, hipertrofia</td></tr><tr><th scope=\"row\">Fisiológica?</th><td><mark class=\"f4\" data-refs=\"S78.25,S79.19,S80.1,S82.5\">Sim: criança, atleta, gestante</mark></td><td>Raramente</td></tr><tr><th scope=\"row\">Galope</th><td>Ventricular</td><td>Atrial</td></tr><tr><th scope=\"row\">Detalhe</th><td></td><td><mark class=\"f4\" data-refs=\"S78.22,S79.18,S80.12,S82.31\">Some na fibrilação atrial (o átrio não contrai)</mark></td></tr></tbody></table></div>",["C18","C19","C42","C34","C31"]],["Ritmo tríplice × galope","<div class=\"cmp c2\"><div><b>Ritmo tríplice</b><ul><li>Três tempos, por B3 ou B4</li><li><b>Pode ser fisiológico</b></li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Ritmo de galope</b><ul><li>Ritmo tríplice com sofrimento do miocárdio</li><li><b>Sempre patológico</b>: um \"pedido de socorro\"</li></ul></div></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Todo ritmo com B3 é galope.</p><p class=\"ok\"><b>O certo</b> <mark class=\"f4\" data-refs=\"S79.17,S78.25,S79.19,S80.1,S82.5\">B3 e B4 podem ser fisiológicas; galope não</mark>.</p></div>",["C44","C34","C31"]]]},"a7":{"lema":"Pense na valva: aberta e estreita é estenose; fechada e vazando é insuficiência. O resto sai daí.","cards":[["A regra que resolve quase tudo","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Valvas</th><th>Estenose</th><th>Insuficiência</th></tr></thead><tbody><tr><th scope=\"row\">Semilunares (aórtica, pulmonar)</th><td><b>Sistólico</b> (ejetivo, em diamante)</td><td><b>Diastólico</b> (aspirativo)</td></tr><tr><th scope=\"row\">AV (mitral, tricúspide)</th><td><b>Diastólico</b> (ruflar)</td><td><b>Sistólico</b> (holossistólico, regurgitativo)</td></tr></tbody></table></div><div class=\"flx\"><span>Quando a valva deveria estar aberta</span><i aria-hidden=\"true\">→</i><span>e está estreita</span><i aria-hidden=\"true\">→</i><span>= estenose</span></div><div class=\"flx\"><span>Quando a valva deveria estar fechada</span><i aria-hidden=\"true\">→</i><span>e vaza</span><i aria-hidden=\"true\">→</i><span>= insuficiência</span></div><p>Intensidade de 1+ a 6+; <b>frêmito</b> (sopro palpável) a partir de 4+.</p>",[]],["As valvopatias da prova","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Lesão</th><th>Sopro</th><th>Foco e irradiação</th><th>Pistas</th></tr></thead><tbody><tr><th scope=\"row\">Estenose aórtica</th><td><mark class=\"f4\" data-refs=\"S78.6,S80.18,S81.13,S82.22\">Sistólico ejetivo</mark></td><td>Aórtico → carótidas</td><td>Angina, síncope, dispneia; ictus propulsivo; B4; pulso parvus et tardus</td></tr><tr><th scope=\"row\">Insuficiência aórtica</th><td>Diastólico aspirativo</td><td>Aórtico acessório (Erb)</td><td>Pulso em martelo d'água; Austin Flint</td></tr><tr><th scope=\"row\">Estenose mitral</th><td><mark class=\"f1\" data-refs=\"S80.28\">Ruflar diastólico</mark></td><td>Mitral, em DLE com campânula</td><td>B1 hiperfonética, estalido de abertura</td></tr><tr><th scope=\"row\">Insuficiência mitral</th><td><mark class=\"f2\" data-refs=\"S78.27,S82.11\">Holossistólico (refluxo VE → AE)</mark></td><td>Mitral → axila</td><td>B3</td></tr><tr><th scope=\"row\">Insuficiência tricúspide</th><td><mark class=\"f5\" data-refs=\"S77.4,S78.14,S79.30,S81.4,S82.20\">Sistólico que aumenta na inspiração</mark></td><td>Tricúspide</td><td>Rivero-Carvallo positivo</td></tr></tbody></table></div>",["C23","C54","C35","C3"]],["Rivero-Carvallo e epônimos","<div class=\"flx\"><span>Inspiração profunda</span><i aria-hidden=\"true\">→</i><span>↑ retorno venoso ao coração direito</span><i aria-hidden=\"true\">→</i><span>↑ sopro no foco tricúspide</span><i aria-hidden=\"true\">→</i><span>= <mark class=\"f5\" data-refs=\"S77.4,S78.14,S79.30,S81.4,S80.30,S82.20\">origem tricúspide (IT)</mark></span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Nome</th><th>O que é</th></tr></thead><tbody><tr><th scope=\"row\">Austin Flint</th><td>Ruflar na ponta na insuficiência aórtica grave</td></tr><tr><th scope=\"row\">Graham Steell</th><td>Diastólico pulmonar na hipertensão pulmonar</td></tr><tr><th scope=\"row\">Corrigan</th><td>Pulso amplo e célere (martelo d'água) da insuficiência aórtica</td></tr></tbody></table></div>",["C3","C55"]],["Pericárdio","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Quadro</th><th>Achados</th></tr></thead><tbody><tr><th scope=\"row\">Pericardite</th><td>Dor que <b>melhora inclinado para a frente</b> e piora deitado; atrito pericárdico</td></tr><tr><th scope=\"row\">Derrame pericárdico</th><td>Bulhas abafadas; alívio na posição genupeitoral</td></tr><tr><th scope=\"row\">Tamponamento</th><td><b>Tríade de Beck</b>: hipotensão, bulhas hipofonéticas, turgência jugular; pulso paradoxal</td></tr></tbody></table></div>",[]]]},"a8":{"lema":"Cardia se ausculta, esfigmia se palpa. O ritmo e o pulso contam a doença antes do ECG.","cards":[["FC × FP","<div class=\"cmp c2\"><div><b>Frequência cardíaca (FC)</b><ul><li>Contada na <b>ausculta</b></li><li>Em bpm</li><li>Taqui<b>cardia</b> / bradi<b>cardia</b></li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Frequência de pulso (FP)</b><ul><li>Contada na <b>palpação</b></li><li>Em ppm</li><li>Taqui<b>sfigmia</b> / bradi<b>sfigmia</b></li></ul></div></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Pulso radial de 50 ppm: bradicardia.</p><p class=\"ok\"><b>O certo</b> <mark class=\"f5\" data-refs=\"S78.20,S79.27,S81.1,P80.14,S82.27\">50 ppm no pulso é bradisfigmia</mark>; <mark class=\"f3\" data-refs=\"S80.24,S81.6,P82.12\">55 bpm na ausculta é bradicardia</mark>. Normal: 60–100.</p></div><div class=\"gk\"><b>Grave isto</b><p>FC maior que FP = <b>déficit de pulso</b> (FA, extrassístoles): nem toda contração gera pulso.</p></div>",["C30","C53","C36","p:fp55","p:fc55"]],["Ritmos","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Ritmo</th><th>Na ausculta e no pulso</th><th>Detalhe de prova</th></tr></thead><tbody><tr><th scope=\"row\">Sinusal</th><td>Regular</td><td>O normal</td></tr><tr><th scope=\"row\">Extrassístoles</th><td>Batimento precoce seguido de pausa</td><td>Pode dar déficit de pulso</td></tr><tr><th scope=\"row\">Fibrilação atrial</th><td><mark class=\"f5\" data-refs=\"S80.17,S81.20,S77.6,S78.16,S79.25,S82.18\">Irregularmente irregular, B1 variável, sem B4</mark></td><td><mark class=\"f3\" data-refs=\"S77.6,S78.16,S79.25\">Dissociação pulso-ausculta; poliúria pelo ANP</mark></td></tr><tr><th scope=\"row\">BAVT</th><td>FC baixa, B1 em canhão; onda <i>a</i> em canhão no pulso venoso</td><td>Síncope de Stokes-Adams</td></tr></tbody></table></div>",["C5","C51"]],["Pulsos que a prova cobra","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Pulso</th><th>Como é</th><th>Doença</th></tr></thead><tbody><tr><th scope=\"row\">Parvus et tardus</th><td>Pequeno e lento para subir</td><td>Estenose aórtica</td></tr><tr><th scope=\"row\">Martelo d'água (Corrigan)</th><td>Amplo, sobe e cai rápido</td><td>Insuficiência aórtica</td></tr><tr><th scope=\"row\">Paradoxal</th><td>PAS cai mais de 10 mmHg na inspiração</td><td>Tamponamento, asma grave</td></tr><tr><th scope=\"row\">Alternante</th><td>Um batimento forte, um fraco</td><td>Insuficiência cardíaca grave</td></tr></tbody></table></div>",[]],["Pressão arterial","<div class=\"flx\"><span>Repouso de 5 min, bexiga vazia</span><i aria-hidden=\"true\">→</i><span>Braço apoiado na altura do coração</span><i aria-hidden=\"true\">→</i><span>Manguito do tamanho certo</span><i aria-hidden=\"true\">→</i><span>Estimar a PAS pelo pulso</span><i aria-hidden=\"true\">→</i><span>Insuflar 20–30 acima</span><i aria-hidden=\"true\">→</i><span>Desinsuflar devagar</span><i aria-hidden=\"true\">→</i><span>Korotkoff I = PAS · V = PAD</span></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Erro</th><th>Efeito</th></tr></thead><tbody><tr><th scope=\"row\">Manguito pequeno para o braço</th><td>Superestima a PA</td></tr><tr><th scope=\"row\">Manguito grande demais</th><td>Subestima a PA</td></tr><tr><th scope=\"row\">Braço abaixo do coração</th><td>Superestima a PA</td></tr><tr><th scope=\"row\">Diferença > 20 mmHg entre os braços</th><td>Não é erro: pense em <b>dissecção de aorta</b></td></tr></tbody></table></div>",["C8"]]]},"a9":{"lema":"Na dor torácica, o padrão diz a causa: aperto ao esforço é isquemia, rasgar súbito é aorta, mudar com a posição é pericárdio.","cards":[["Dor isquêmica","<div class=\"cmp c2\"><div><b>Típica</b><ul><li>Aperto ou peso retroesternal</li><li>Irradia para braço esquerdo, mandíbula e pescoço</li><li>Piora com esforço e emoção</li><li>Alivia com repouso ou nitrato</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>O gesto</b><ul><li><mark class=\"f5\" data-refs=\"S78.10,S79.12,S80.8,P81.17,P80.2\">Sinal de Levine: punho cerrado sobre o precórdio</mark></li></ul></div></div><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>Angina estável</th><th>Angina instável</th><th>Infarto</th></tr></thead><tbody><tr><th scope=\"row\">Quando</th><td>Ao esforço</td><td>Em repouso ou piora do padrão</td><td>Em repouso</td></tr><tr><th scope=\"row\">Duração</th><td>Poucos minutos</td><td>Mais longa</td><td>Mais de 20 min</td></tr><tr><th scope=\"row\">Alívio</th><td>Repouso, nitrato</td><td>Parcial</td><td>Não alivia</td></tr></tbody></table></div>",["C25","p:levine"]],["Equivalente anginoso","<div class=\"gk\"><b>Grave isto</b><p><mark class=\"f5\" data-refs=\"S77.8,S78.8,S79.22,S80.5,S81.24,S82.17\">Isquemia sem a dor típica</mark>: <b>idosos e diabéticos</b> (neuropatia) se apresentam com dispneia, cansaço, sudorese, náusea ou síncope. É o assunto que mais se repete nas somativas.</p></div><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> \"Sem dor no peito, não é infarto.\"</p><p class=\"ok\"><b>O certo</b> No idoso diabético, dispneia súbita ou mal-estar pode ser o próprio infarto.</p></div>",["C7"]],["Dissecção aguda da aorta","<div class=\"flx\"><span>HAS, Marfan</span><i aria-hidden=\"true\">→</i><span>Dor súbita, já máxima no início, rasgante</span><i aria-hidden=\"true\">→</i><span>Irradia para o dorso (interescapular)</span><i aria-hidden=\"true\">→</i><span>PA e pulso diferentes entre os braços</span><i aria-hidden=\"true\">→</i><span>Complica: IAo aguda, tamponamento, AVC</span></div><p><mark class=\"f4\" data-refs=\"S77.9,S78.3,S80.22,S82.13\">Stanford A (aorta ascendente) é emergência cirúrgica</mark>.</p>",["C8"]],["Outras causas","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Causa</th><th>Pista no exame</th></tr></thead><tbody><tr><th scope=\"row\">Pericardite</th><td>Melhora inclinado para a frente; atrito pericárdico</td></tr><tr><th scope=\"row\">Pneumotórax</th><td>Súbita com dispneia; timpanismo e murmúrio abolido; jovem longilíneo</td></tr><tr><th scope=\"row\">TEP</th><td>Dispneia súbita, taquicardia; dor pleurítica</td></tr><tr><th scope=\"row\">Costocondrite (osteomuscular)</th><td>A dor é <b>reproduzida à palpação</b></td></tr><tr><th scope=\"row\">Herpes-zóster</th><td>Queimação em faixa no dermátomo; vesículas depois</td></tr></tbody></table></div>",[]]]},"a10":{"lema":"Síncope reflexa avisa antes e deixa a pessoa se defender; a cardíaca derruba sem aviso.","cards":[["Definições","<div class=\"cmp c3\"><div><b>Síncope</b><ul><li>Perda <b>súbita e transitória</b> da consciência e do tônus postural</li><li>Recuperação espontânea e completa</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Pré-síncope</b><ul><li>Sensação de desmaio iminente</li><li>Sem perder a consciência</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Lipotimia</b><ul><li>Mal-estar com fraqueza</li><li>Sem perda completa da consciência</li></ul></div></div>",[]],["Os tipos","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Tipo</th><th>Quem e quando</th><th>Pistas</th></tr></thead><tbody><tr><th scope=\"row\">Vasovagal (reflexa)</th><td>Jovem, muito tempo em pé, calor, dor, emoção</td><td><mark class=\"f3\" data-refs=\"S80.31,S81.2,S82.30\">Pródromos (palidez, suor, náusea, visão turva) permitem esboço de defesa</mark>; cansaço depois</td></tr><tr><th scope=\"row\">Seio carotídeo (reflexa)</th><td>Idoso, ao virar o pescoço, colarinho apertado</td><td>Massagem: pausa ≥ 3 s ou queda ≥ 50 mmHg</td></tr><tr><th scope=\"row\">Hipotensão ortostática</th><td>Ao ficar em pé</td><td>Queda ≥ 20 de PAS ou ≥ 10 de PAD; hipovolemia, remédios, disautonomia</td></tr><tr><th scope=\"row\">Cardíaca</th><td>Cardiopata, no esforço ou deitado</td><td><mark class=\"f5\" data-refs=\"S78.7,S77.3,S78.18,S80.26,S81.25,S82.23\">Sem pródromos, sem defesa (machuca na queda)</mark>; Stokes-Adams no BAVT</td></tr></tbody></table></div>",["C56","C24","C2"]],["Sinais de alarme (pensar em causa cardíaca)","<ul class=\"alarm\"><li>Durante o esforço ou deitado</li><li>Sem pródromos</li><li>Palpitação logo antes</li><li>Cardiopatia ou IC conhecida</li><li>Morte súbita na família</li><li>Lesão por queda (não houve defesa)</li></ul><div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> Síncope de jovem em pé no calor, com náusea antes, é alarme.</p><p class=\"ok\"><b>O certo</b> <mark class=\"f5\" data-refs=\"S77.3,S78.18,S80.26,S81.25,S82.23\">É o padrão vasovagal; alarme é síncope sem aviso, no esforço ou em cardiopata</mark>.</p></div>",["C2","C24"]]]},"a11":{"lema":"Cianose central melhora com oxigênio; a periférica, com calor. A posição da dispneia aponta o órgão.","cards":[["Cianose","<p>Aparece com desoxi-hemoglobina acima de ~5 g/dL: é sinal tardio, e anemia grave dificulta vê-la.</p><div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>Central</th><th>Periférica</th><th>Segmentar</th></tr></thead><tbody><tr><th scope=\"row\">Mecanismo</th><td>Sangue arterial dessaturado (pulmão, shunt)</td><td>Extração aumentada: frio, vasoconstrição, baixo débito</td><td><mark class=\"f2\" data-refs=\"P80.7,S82.7\">Estase venosa local, trombose</mark></td></tr><tr><th scope=\"row\">Onde</th><td>Língua e mucosas + extremidades</td><td>Só extremidades; mucosas róseas</td><td>Um membro ou segmento</td></tr><tr><th scope=\"row\">Extremidades</th><td>Quentes</td><td>Frias</td><td>Variável</td></tr><tr><th scope=\"row\">Teste</th><td><mark class=\"f4\" data-refs=\"S78.30,S79.16,S81.12,S82.21\">Melhora com O<sub>2</sub></mark></td><td>Melhora ao aquecer ou massagear</td><td>Melhora ao elevar o membro</td></tr></tbody></table></div>",["C37","p:cianose"]],["Dispneias posicionais","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Nome</th><th>Piora</th><th>Alivia</th><th>Pense em</th></tr></thead><tbody><tr><th scope=\"row\">Ortopneia</th><td>Deitado</td><td>Sentado</td><td>Insuficiência cardíaca</td></tr><tr><th scope=\"row\">Dispneia paroxística noturna</th><td>Acorda horas após deitar</td><td>Sentar ou levantar</td><td>Insuficiência cardíaca</td></tr><tr><th scope=\"row\">Platipneia</th><td><mark class=\"f4\" data-refs=\"S77.10,S79.6,S80.29,S81.10\">Em pé</mark></td><td>Deitado</td><td>Shunt intracardíaco ou pulmonar, síndrome hepatopulmonar</td></tr><tr><th scope=\"row\">Trepopneia</th><td>Num decúbito lateral</td><td>No decúbito oposto</td><td>Doença pleural, derrame unilateral</td></tr></tbody></table></div><div class=\"gk\"><b>Grave isto</b><p><mark class=\"f5\" data-refs=\"S77.10,S79.6,S80.29,S81.10,S78.23\">Platipneia é o contrário da ortopneia</mark>: piora em pé e melhora deitado.</p></div>",["C9","C32"]],["Tosse, expectoração e hemoptise","<div class=\"flx\"><span>Aguda: < 3 semanas</span><i aria-hidden=\"true\">→</i><span>Subaguda: 3 a 8 semanas</span><i aria-hidden=\"true\">→</i><span>Crônica: > 8 semanas</span></div><div class=\"cmp c2\"><div><b>Hemoptise</b><ul><li>Sai com a <b>tosse</b></li><li>Vermelho vivo, espumosa</li><li>Vias aéreas inferiores</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Hematêmese</b><ul><li>Sai com o <b>vômito</b></li><li>Escura, em borra de café, com restos de alimento</li><li>Trato digestivo alto</li></ul></div></div>",[]]]},"a12":{"lema":"Pleura é \"antipática\" (o FTV cai); parênquima é \"simpático\" (o FTV sobe). A percussão separa ar de líquido.","cards":[["A tabela das síndromes","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>Expansibilidade</th><th>FTV</th><th>Percussão</th><th>Ausculta</th></tr></thead><tbody><tr><th scope=\"row\">Normal</th><td>Normal</td><td>Normal</td><td><mark class=\"f1\" data-refs=\"S79.26\">Claro pulmonar</mark></td><td>Murmúrio vesicular</td></tr><tr><th scope=\"row\">Derrame pleural</th><td>↓</td><td>↓ ou abolido</td><td><mark class=\"f5\" data-refs=\"S78.13,S79.1,S80.21,S81.18,S77.16,S82.28\">Maciça ou submaciça</mark></td><td>MV ↓ ou abolido; egofonia no limite superior</td></tr><tr><th scope=\"row\">Pneumotórax</th><td>↓</td><td>↓ ou abolido</td><td><mark class=\"f5\" data-refs=\"S77.11,S78.19,S79.8,S80.16,S81.15\">Timpânica</mark></td><td>MV abolido</td></tr><tr><th scope=\"row\">Consolidação (pneumonia)</th><td>↓ no local</td><td><b>↑</b></td><td>Submaciça</td><td>Estertores finos, sopro tubário</td></tr><tr><th scope=\"row\">Enfisema</th><td>↓ global</td><td>↓</td><td>Hipersonora</td><td>MV ↓ difuso</td></tr></tbody></table></div><div class=\"cmp c2\"><div><b>Derrame</b><ul><li>Tudo diminui</li><li>Percussão <b>maciça</b>: líquido</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Pneumotórax</b><ul><li>Tudo diminui</li><li>Percussão <b>timpânica</b>: ar</li></ul></div></div><div class=\"gk\"><b>Grave isto</b><p>Ar ou líquido na pleura funcionam como <b>isolante acústico</b>: FTV e murmúrio caem nos dois. Só a percussão separa.</p></div>",["C10","C27","C15","C46"]],["Inspeção e ritmos","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Ritmo</th><th>Padrão</th><th>Causa</th></tr></thead><tbody><tr><th scope=\"row\">Cheyne-Stokes</th><td>Ondas que crescem e decrescem, com apneia</td><td>IC grave, AVC</td></tr><tr><th scope=\"row\">Biot</th><td>Irregular, com apneias sem padrão</td><td>Lesão de tronco, hipertensão intracraniana</td></tr><tr><th scope=\"row\">Kussmaul</th><td>Profunda e regular</td><td>Acidose metabólica (cetoacidose)</td></tr></tbody></table></div><p>Tórax em <b>tonel</b> (diâmetro AP = laterolateral): enfisema. FR normal: 12 a 20 irpm.</p>",[]],["Percussão × ausculta","<div class=\"pg\"><p class=\"no\"><b>Pegadinha</b> \"Ausculta com som claro pulmonar.\"</p><p class=\"ok\"><b>O certo</b> <mark class=\"f4\" data-refs=\"S78.24,S80.20,S79.26,S82.10\">Claro pulmonar é som de percussão; broncovesicular é som de ausculta</mark>.</p></div><div class=\"cmp c2\"><div><b>Sons de percussão</b><ul><li>Claro pulmonar: normal</li><li>Timpânico: pneumotórax</li><li><mark class=\"f1\" data-refs=\"S80.19\">Maciço: fígado (hipocôndrio direito)</mark>, derrame volumoso</li><li>Hipersonoro: enfisema</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Sons de ausculta normais</b><ul><li>Traqueal: sobre a traqueia</li><li><b>Broncovesicular</b>: região esternal superior e interescapular</li><li>Murmúrio vesicular: o resto do tórax</li></ul></div></div>",["C33","C46","C52"]],["Ruídos adventícios","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Ruído</th><th>Quando e como</th><th>Pense em</th></tr></thead><tbody><tr><th scope=\"row\">Estertores finos</th><td>Fim da inspiração, como velcro</td><td>Líquido no alvéolo: pneumonia, IC, fibrose</td></tr><tr><th scope=\"row\">Estertores grossos</th><td>Início da inspiração e expiração</td><td>Secreção em vias maiores</td></tr><tr><th scope=\"row\">Sibilos</th><td>Musicais, agudos, na expiração</td><td>Estreitamento: asma, DPOC</td></tr><tr><th scope=\"row\">Roncos</th><td>Graves, mudam com a tosse</td><td>Secreção em brônquios grandes</td></tr><tr><th scope=\"row\">Estridor</th><td>Inspiratório, alto, audível de longe</td><td>Obstrução alta (laringe, traqueia)</td></tr><tr><th scope=\"row\">Atrito pleural</th><td>Áspero, nas duas fases</td><td>Pleurite</td></tr></tbody></table></div>",[]],["De onde vem cada som (fisiopatologia)","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th>Achado</th><th>O que gera o som</th><th>Por isso…</th></tr></thead><tbody><tr><th scope=\"row\">Murmúrio vesicular</th><td>Fluxo turbulento nas vias maiores, filtrado pelo pulmão cheio de ar (o ar \"corta\" os agudos)</td><td>É suave e mais inspiratório</td></tr><tr><th scope=\"row\">Som brônquico na periferia (sopro tubário)</th><td>A consolidação é sólida e conduz o som das vias maiores até a parede</td><td>Vem junto com FTV ↑, broncofonia e pectorilóquia</td></tr><tr><th scope=\"row\">FTV aumentado</th><td>Tecido sólido (pneumonia) transmite melhor a vibração da voz</td><td>Parênquima \"simpático\"</td></tr><tr><th scope=\"row\">FTV diminuído</th><td>Líquido ou ar na pleura refletem a vibração (isolante)</td><td>Pleura \"antipática\": derrame e pneumotórax</td></tr><tr><th scope=\"row\">Estertores finos</th><td>Pequenas vias e alvéolos colados por líquido ou fibrose se abrem de repente no fim da inspiração</td><td>Não mudam com a tosse; som de velcro</td></tr><tr><th scope=\"row\">Estertores grossos</th><td>Ar borbulhando em secreção nas vias maiores</td><td>Mudam com a tosse</td></tr><tr><th scope=\"row\">Sibilos</th><td>A parede de uma via estreitada vibra com o fluxo acelerado</td><td>Predominam na expiração, quando a via fica ainda mais estreita</td></tr><tr><th scope=\"row\">Roncos</th><td>Secreção espessa vibrando nos brônquios grandes</td><td>Graves; mudam com a tosse</td></tr><tr><th scope=\"row\">Estridor</th><td>Obstrução de via alta, fora do tórax, que colapsa com a pressão negativa</td><td>É inspiratório e se ouve de longe</td></tr><tr><th scope=\"row\">Atrito pleural</th><td>Folhetos inflamados e ásperos raspando um no outro</td><td>Some quando o derrame separa os folhetos</td></tr><tr><th scope=\"row\">Egofonia</th><td>O líquido filtra as frequências da voz no limite superior do derrame</td><td>Voz anasalada, \"de cabra\"</td></tr></tbody></table></div><div class=\"cmp c2\"><div><b>Percussão: ar</b><ul><li>Claro pulmonar: ar dentro do parênquima</li><li>Hipersonoro: ar demais (enfisema)</li><li>Timpânico: ar livre (pneumotórax, espaço de Traube)</li></ul></div><i class=\"vs\" aria-hidden=\"true\">×</i><div><b>Percussão: sem ar</b><ul><li>Submaciço: consolidação, derrame pequeno</li><li>Maciço: fígado, derrame volumoso</li></ul></div></div>",["C10","C27","C33"]],["Asma × DPOC","<div class=\"tw\"><table class=\"cobt rvt\"><thead><tr><th></th><th>Asma</th><th>DPOC</th></tr></thead><tbody><tr><th s
