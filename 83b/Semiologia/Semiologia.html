ão</td><td>Qualquer, inclusive repouso</td></tr>\n<tr><td>Duração</td><td>&lt; 5 minutos</td><td>Até ~20 minutos</td><td>&gt; 20 minutos</td></tr>\n<tr><td>Alívio</td><td>Repouso, nitrato</td><td>Parcial</td><td>Não alivia com repouso</td></tr>\n<tr><td>Exame físico</td><td>Muitas vezes normal</td><td>Pode ter B4, sopro de IM transitório</td><td>Sudorese, B4, B3, sopro de IM, sinais de choque</td></tr></table>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> O exame físico pode ser normal na síndrome coronariana: quem decide é a história, o ECG e os marcadores.</p></div>","qs":{"p":[{"enun":"Homem de 60 anos descreve dor no peito em aperto. Ao ser perguntado onde dói, fecha a mão e a apoia sobre o esterno.","cmd":"Como se chama esse gesto?","alts":["Sinal de Levine","Sinal de Homans","Sinal de Torres-Homem","Sinal de Rivero-Carvallo"],"gab":0,"com":["Correta.","Homans é da TVP.","Torres-Homem é do abscesso hepático.","Rivero-Carvallo é uma manobra de ausculta."],"imgs":[]},{"enun":"Paciente tem dor retroesternal em aperto ao subir uma ladeira, que dura 3 minutos e passa com o repouso, sempre no mesmo padrão há 1 ano.","cmd":"Qual a classificação?","alts":["Angina instável","Infarto agudo do miocárdio","Angina estável","Dor pleurítica"],"gab":2,"com":["A instável é em repouso ou com piora do padrão.","O IAM dura mais de 20 minutos.","Correta.","A dor pleurítica piora com a respiração."],"imgs":[]},{"enun":"Paciente com dor precordial em aperto há 40 minutos, em repouso, com sudorese e náuseas.","cmd":"Qual a hipótese principal?","alts":["Angina estável de esforço","Infarto agudo do miocárdio","Dor osteomuscular da parede torácica","Pericardite aguda com dor pleurítica"],"gab":1,"com":["A estável dura menos de 5 minutos e alivia com o repouso.","Correta.","A osteomuscular é reproduzida à palpação.","A pericardite muda com a posição."],"imgs":[]}]},"pv":["S80.8","P81.17"]},{"id":"s2","titulo":"Equivalente anginoso","html":"\n<p class=\"lead\">Nem toda isquemia dói no peito.</p>\n<p><mark class=\"f5\" data-refs=\"S77.8,S78.8,S79.22,S80.5,S81.24,S82.17,EDS.16\"><b>Equivalente anginoso</b> são manifestações da isquemia miocárdica <b>sem a precordialgia típica</b>: dispneia, cansaço desproporcional, náuseas, sudorese, mal-estar epigástrico, síncope</mark>. <mark class=\"f5\" data-refs=\"S77.8,S78.8,S79.22,S80.5,S81.24,S82.17,EDS.16\">São mais frequentes em <b>idosos, diabéticos</b> (neuropatia autonômica) e mulheres</mark>.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Caiu como definição direta: equivalente anginoso = isquemia sem a dor típica, sobretudo em idosos e diabéticos. Distratores: \"dor que imita angina sem ser isquêmica\" e \"angina que alivia com nitrato\".</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Diabético com dispneia súbita ou mal-estar inexplicado: pense em isquemia mesmo sem dor no peito.</p></div>","qs":{"p":[{"enun":"Diabética de 72 anos chega com dispneia súbita, sudorese e mal-estar, sem dor no peito. O ECG mostra isquemia.","cmd":"Como se chama essa forma de apresentação?","alts":["Dor referida","Pré-síncope","Equivalente anginoso","Angina de Prinzmetal"],"gab":2,"com":["Dor referida exige dor.","Não descreve a isquemia sem dor.","Correta.","Prinzmetal é angina por vasoespasmo, com dor."],"imgs":[]},{"enun":"Por que diabéticos apresentam mais equivalentes anginosos?","cmd":"Assinale a alternativa correta.","alts":["A glicemia alta bloqueia a isquemia miocárdica","O diabético não tem aterosclerose coronariana","A neuropatia autonômica reduz a dor visceral","A insulina tem efeito analgésico sobre o coração"],"gab":2,"com":["A glicemia não impede isquemia.","O diabético tem mais aterosclerose.","Correta.","Não é o mecanismo."],"imgs":[]},{"enun":"Qual paciente tem maior chance de infarto sem dor torácica típica?","cmd":"Assinale a alternativa correta.","alts":["Adolescente saudável","Jovem atleta","Adulto jovem sem fatores de risco","Idoso diabético"],"gab":3,"com":["Baixo risco.","Baixo risco.","Baixo risco.","Correta."],"imgs":[]}]},"pv":["S81.24"]},{"id":"s3","titulo":"Dissecção aguda da aorta","html":"\n<p class=\"lead\">É a causa de dor torácica que não pode passar despercebida: o tratamento é diferente do infarto e o anticoagulante pode matar.</p>\n<table class=\"cmp\"><tr><th>Item</th><th>Dissecção aguda da aorta</th></tr>\n<tr><td>Fatores de risco</td><td>HAS mal controlada (principal), Marfan, valva aórtica bicúspide, cocaína, gestação, trauma</td></tr>\n<tr><td>Dor</td><td><mark class=\"f4\" data-refs=\"S77.9,S78.3,S80.22,S82.13\"><b>Súbita, já em intensidade máxima</b> (10/10), \"rasgando\", lancinante</mark></td></tr>\n<tr><td>Irradiação</td><td><mark class=\"f4\" data-refs=\"S77.9,S78.3,S80.22,S82.13\">Para o dorso, <b>região interescapular</b>, e migra conforme a dissecção avança</mark></td></tr>\n<tr><td>Exame físico</td><td><mark class=\"f4\" data-refs=\"S77.9,S78.3,S80.22,S82.13\"><b>Diferença de PA e de amplitude de pulso entre os membros superiores</b> (&gt; 20 mmHg)</mark>; sopro diastólico de IAo aguda; <mark class=\"f4\" data-refs=\"S77.9,S78.3,S80.22,S82.13\">abafamento de bulhas e turgência jugular (tamponamento)</mark>; síndrome de Horner; déficits neurológicos</td></tr>\n<tr><td>Classificação</td><td>Stanford A (aorta ascendente, cirúrgica) × B (só descendente); DeBakey I, II, III</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>O caso da dor súbita, rasgante, para a região interescapular, em hipertenso, pede os achados que <b>reforçam</b> a dissecção: diferença de PA e de pulso entre os braços. Distratores: dor reproduzida à palpação (osteomuscular), atrito que melhora inclinado (pericardite), sibilos (asma).</p></div>","qs":{"p":[{"enun":"Hipertenso de 65 anos com dor torácica súbita, máxima desde o início, \"rasgando\", irradiada para o dorso. PA 180/100 mmHg no braço direito e 140/80 no esquerdo.","cmd":"Qual a hipótese principal?","alts":["Pericardite aguda","Pneumotórax hipertensivo","Infarto agudo do miocárdio","Dissecção aguda da aorta"],"gab":3,"com":["A pericardite muda com a posição e dá atrito.","O pneumotórax dá dispneia e timpanismo.","O IAM tem instalação mais gradual e não dá assimetria de PA.","Correta."],"imgs":[]},{"enun":"Na dissecção que acomete a raiz da aorta, qual achado de ausculta pode surgir?","cmd":"Assinale a alternativa correta.","alts":["Sopro diastólico de insuficiência aórtica","Sopro sistólico de estenose mitral","Desdobramento fixo e amplo de B2","Estalido de abertura da valva mitral"],"gab":0,"com":["Correta.","Não existe sopro sistólico na estenose mitral.","É da CIA.","É da estenose mitral."],"imgs":[]},{"enun":"Qual é o principal fator de risco para a dissecção aguda da aorta?","cmd":"Assinale a alternativa correta.","alts":["Anemia ferropriva crônica","Hipotireoidismo descompensado","Hipertensão mal controlada","Asma de difícil controle"],"gab":2,"com":["Não é fator de risco.","Não é fator de risco.","Correta.","Não é fator de risco."],"imgs":[]}]},"pv":["S80.22"]},{"id":"s4","titulo":"Outras causas de dor torácica","html":"\n<p class=\"lead\">O diagnóstico diferencial usa os mesmos atributos do decálogo da dor.</p>\n<table class=\"cmp\"><tr><th>Causa</th><th>Pista principal</th></tr>\n<tr><td>Pericardite</td><td>Piora deitado, melhora inclinado para frente; atrito</td></tr>\n<tr><td>Tromboembolismo pulmonar</td><td>Dispneia súbita, dor pleurítica, taquicardia, fator de risco para TVP</td></tr>\n<tr><td>Pneumotórax</td><td>Dor súbita e dispneia em jovem longilíneo ou tabagista; timpanismo, MV abolido</td></tr>\n<tr><td>Dor pleurítica (pneumonia)</td><td>Em pontada, piora na inspiração e na tosse; febre</td></tr>\n<tr><td>Doença do refluxo, espasmo esofágico</td><td>Queimação, relação com a alimentação e o decúbito; pode aliviar com nitrato (espasmo)</td></tr>\n<tr><td>Osteomuscular (costocondrite)</td><td>Localizada, reproduzida à palpação, piora com o movimento</td></tr>\n<tr><td>Herpes-zóster</td><td>Dor em queimação num dermátomo, depois vesículas</td></tr>\n<tr><td>Ansiedade, pânico</td><td>Associada a palpitações, parestesias, hiperventilação; diagnóstico de exclusão</td></tr></table>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Dor reproduzida à palpação fala a favor de causa osteomuscular, mas não exclui isquemia: um paciente pode ter as duas.</p></div>","qs":{"p":[{"enun":"Jovem de 22 anos, alto e magro, tem dor torácica súbita à esquerda e dispneia. Hemitórax esquerdo timpânico, MV abolido.","cmd":"Qual a hipótese?","alts":["Infarto agudo do miocárdio","Costocondrite","Pericardite","Pneumotórax espontâneo"],"gab":3,"com":["Improvável no perfil e não dá timpanismo.","Não dá timpanismo nem MV abolido.","Não dá timpanismo.","Correta."],"imgs":[]},{"enun":"Paciente com dor torácica localizada, que piora ao mover o tronco e é reproduzida ao pressionar a junção condrocostal.","cmd":"Qual a causa mais provável?","alts":["Dissecção aguda da aorta","Osteomuscular (costocondrite)","Angina instável","Pericardite"],"gab":1,"com":["A dissecção é súbita, rasgante.","Correta.","A angina não é reproduzida à palpação.","A pericardite muda com a posição, não com a palpação."],"imgs":[]},{"enun":"Idoso com dor em queimação em faixa no hemitórax direito; dias depois surgem vesículas no mesmo trajeto.","cmd":"Qual o diagnóstico?","alts":["Embolia pulmonar","Herpes-zóster","Pneumonia","Refluxo gastroesofágico"],"gab":1,"com":["Não dá vesículas.","Correta. Dor neuropática num dermátomo.","Não segue dermátomo.","Não dá vesículas."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"Sinal de Levine:","cmd":"Assinale a alternativa correta.","alts":["Mão fechada sobre o precórdio, dor em aperto","Dor na panturrilha à dorsiflexão","Dor à percussão do hipocôndrio direito","Sopro que aumenta na inspiração"],"gab":0,"com":["Correta.","Homans.","Torres-Homem.","Rivero-Carvallo."],"imgs":[]},{"enun":"IAM: dor com duração de:","cmd":"Assinale a alternativa correta.","alts":["Menos de 5 minutos","Exatamente 10 minutos","Mais de 20 minutos","Segundos"],"gab":2,"com":["Estável.","Não é o critério.","Correta.","Não é isquêmica."],"imgs":[]},{"enun":"Equivalente anginoso é mais comum em:","cmd":"Assinale a alternativa correta.","alts":["Atletas","Adolescentes","Idosos e diabéticos","Gestantes jovens"],"gab":2,"com":["Baixo risco.","Baixo risco.","Correta.","Baixo risco."],"imgs":[]},{"enun":"Dissecção aguda da aorta: a dor é:","cmd":"Assinale a alternativa correta.","alts":["Progressiva, em dias, sem pico","Em queimação, pós-prandial","Reproduzida à palpação local","Súbita, máxima no início, rasgante"],"gab":3,"com":["Não.","Refluxo.","Osteomuscular.","Correta."],"imgs":[]},{"enun":"Achado que reforça dissecção de aorta:","cmd":"Assinale a alternativa correta.","alts":["Diferença de PA entre os braços","Atrito pericárdico que melhora inclinado","Dor à palpação do esterno","Sibilos difusos"],"gab":0,"com":["Correta.","Pericardite.","Osteomuscular.","Asma."],"imgs":[]},{"enun":"Dor torácica que alivia sentado e inclinado para frente:","cmd":"Assinale a alternativa correta.","alts":["Pericardite","Dissecção","Pneumotórax","IAM"],"gab":0,"com":["Correta.","Não muda com a posição.","Não muda com a posição.","Não muda com a posição."],"imgs":[]},{"enun":"Despertar adrenérgico na isquemia inclui:","cmd":"Assinale a alternativa correta.","alts":["Sudorese, palidez, náuseas","Bradicardia e calor","Rubor facial e sono","Prurido"],"gab":0,"com":["Correta.","Não.","Não.","Não."],"imgs":[]},{"enun":"Dor em faixa num dermátomo seguida de vesículas:","cmd":"Assinale a alternativa correta.","alts":["IAM","Pericardite","Herpes-zóster","Refluxo"],"gab":2,"com":["Não.","Não.","Correta.","Não."],"imgs":[]}],"widgets":[{"id":"dtor","titulo":"Qual a causa da dor torácica?","desc":"Associe a pista à causa.","cats":[["isq","Isquêmica"],["dis","Dissecção"],["per","Pericardite"],["pnx","Pneumotórax"],["ost","Osteomuscular"]],"cards":[["Sinal de Levine","isq"],["Dor rasgante para a região interescapular","dis"],["Melhora inclinado para frente","per"],["Timpanismo e MV abolido","pnx"],["Reproduzida à palpação","ost"],["Diferença de PA entre os braços","dis"],["Alivia com repouso e nitrato","isq"],["Atrito pericárdico","per"],["Jovem longilíneo, dor súbita e dispneia","pnx"],["Piora ao mover o tronco","ost"]]}],"gl":[["Sinal de Levine","Mão fechada sobre o precórdio: dor isquêmica em aperto.",1],["Angina estável","Esforço, < 5 min, alivia com repouso.",1],["Angina instável","Repouso ou piora do padrão.",1],["Equivalente anginoso","Isquemia sem dor típica: idosos, diabéticos.",2],["Dissecção da aorta","Dor súbita rasgante, dorso, diferença de PA entre braços.",3],["Stanford A","Dissecção da aorta ascendente.",3],["Costocondrite","Dor reproduzida à palpação condrocostal.",4]],"vf":[["O sinal de Levine é ligado à isquemia miocárdica.",true,"Punho cerrado sobre o precórdio."],["Equivalente anginoso é dor que imita angina sem isquemia.",false,"É isquemia sem a dor típica."],["Na dissecção a dor é gradual.",false,"É súbita, já máxima."],["A diferença de PA entre os braços reforça a dissecção.",true,"> 20 mmHg."],["Dor reproduzida à palpação exclui isquemia.",false,"Fala a favor de osteomuscular, mas não exclui."],["IAM: dor > 20 minutos.",true,"Não alivia com repouso."]],"check":["Descrever a dor isquêmica típica pelo decálogo","Reconhecer o sinal de Levine e seus distratores","Diferenciar angina estável, instável e IAM","Definir equivalente anginoso","Reconhecer a dissecção e os achados que a reforçam"],"resumo":[["Segmento 1","Dor isquêmica: aperto, retroesternal, irradia para MSE e mandíbula, piora com esforço. Levine: punho cerrado. Estável < 5 min; IAM > 20 min."],["Segmento 2","Equivalente anginoso: isquemia sem dor típica, idosos e diabéticos."],["Segmento 3","Dissecção: HAS, dor súbita máxima rasgante, interescapular, diferença de PA e pulso entre os braços, IAo aguda, tamponamento."],["Segmento 4","Pericardite (posição), pneumotórax (timpanismo), osteomuscular (palpação), zóster (dermátomo)."]],"freq":[["Equivalente anginoso: isquemia sem precordialgia (idosos e diabéticos)",7,"S77.8, S78.8, S79.22, S80.5, S81.24, S82.17, EDS.16"],["Dissecção aguda de aorta: dor intensa desde o início, interescapular, PA diferente entre os braços",4,"S77.9, S78.3, S80.22, S82.13"],["Sinal de Levine: punho cerrado sobre o precórdio",3,"S78.10, S79.12, S80.8"],["Punho cerrado sobre o precórdio: sinal de Levine",2,"P81.17, P80.2"]],"cob":{"rk":{"t":"Pista da história → causa da dor","c":["Pista","Causa"],"d":["<b>Pista</b>: o atributo da dor que mais diferencia.","<b>Causa</b>: o diagnóstico que ela sugere."],"x":[["Punho cerrado sobre o precórdio (Levine)","isquemia"],["Súbita, máxima, rasgante, interescapular","dissecção"],["Melhora inclinado para frente","pericardite"],["Sem dor, em idoso diabético","equivalente anginoso"]],"ex":"Dissecção: diferença de PA e de pulso entre os membros superiores reforça o diagnóstico.","b":"Angina estável < 5 min; instável até 20 min; IAM > 20 min."},"figs":[],"keys":["C7","C8","C25","p:levine"]}},{"id":"a10","num":10,"nome":"Síncope","tema":"Definições (síncope, pré-síncope, lipotimia), síncope reflexa e vasovagal, hipotensão ortostática e síncope cardíaca com os sinais de alarme","segs":[{"id":"s1","titulo":"Síncope, pré-síncope e lipotimia","html":"\n<p class=\"lead\"><mark class=\"f5\" data-refs=\"S77.3,S78.18,S80.26,S81.25,S82.23,EDS.13\">Síncope é a <b>perda súbita e transitória da consciência e do tônus muscular postural</b>, com recuperação espontânea e completa</mark>, causada por hipoperfusão cerebral global e transitória.</p>\n<table class=\"cmp\"><tr><th>Termo</th><th>O que é</th></tr>\n<tr><td>Síncope</td><td>Perde a consciência e o tônus postural; cai</td></tr>\n<tr><td>Pré-síncope</td><td>Sensação de desmaio iminente (escurecimento visual, fraqueza, sudorese), sem perder a consciência</td></tr>\n<tr><td>Lipotimia</td><td>Mal-estar com fraqueza, sem perda completa da consciência; termo usado como sinônimo de pré-síncope</td></tr></table>\n<h3>O que não é síncope</h3>\n<ul><li><b>Convulsão</b>: aura, movimentos tônico-clônicos prolongados, liberação esfincteriana, mordedura lateral da língua, confusão pós-ictal demorada.</li><li><b>Hipoglicemia, intoxicação</b>: a perda de consciência não é transitória e espontânea.</li><li><b>AVC, AIT</b>: déficit focal; raramente causam síncope.</li></ul>\n<h3>Três grupos de causas</h3>\n<table class=\"cmp\"><tr><th>Grupo</th><th>Mecanismo</th><th>Gravidade</th></tr>\n<tr><td>Reflexa (neuromediada)</td><td>Reflexo inadequado: vasodilatação e/ou bradicardia</td><td>A mais comum, benigna</td></tr>\n<tr><td>Hipotensão ortostática</td><td>Falha da vasoconstrição ao ficar em pé</td><td>Intermediária</td></tr>\n<tr><td>Cardíaca</td><td>Arritmia ou obstrução ao fluxo</td><td>A mais grave: risco de morte súbita</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Todo episódio sincopal merece avaliação médica atenciosa e cuidadosa\": desde causas benignas até afecções potencialmente graves.</p></div>","qs":{"p":[{"enun":"Mulher de 30 anos relata que, numa fila, sentiu a vista escurecer, suou frio e precisou sentar, sem perder a consciência.","cmd":"Como classificar o episódio?","alts":["Acidente isquêmico transitório","Síncope","Pré-síncope","Crise convulsiva"],"gab":2,"com":["Não houve déficit focal.","Síncope exige perda da consciência e do tônus.","Correta. Não houve perda da consciência.","Não houve movimentos nem pós-ictal."],"imgs":[]},{"enun":"Paciente perde a consciência, tem movimentos tônico-clônicos por 2 minutos, morde a lateral da língua e fica confuso por 30 minutos.","cmd":"O que sugere o quadro?","alts":["Crise convulsiva","Hipotensão ortostática","Pré-síncope","Síncope vasovagal"],"gab":0,"com":["Correta.","Recuperação rápida, sem pós-ictal longo.","Na pré-síncope não há perda da consciência.","A síncope tem recuperação rápida e completa."],"imgs":[]},{"enun":"Qual o grupo de síncope mais grave?","cmd":"Assinale a alternativa correta.","alts":["Reflexa vasovagal","Situacional","Cardíaca","Hipotensão ortostática por desidratação"],"gab":2,"com":["Benigna.","Benigna.","Correta. Risco de morte súbita.","Intermediária."],"imgs":[]}]},"pv":["S81.25"]},{"id":"s2","titulo":"Síncope reflexa e vasovagal","html":"\n<p class=\"lead\">A síncope reflexa é a mais comum. O reflexo vasovagal (bradicardia + vasodilatação) derruba o fluxo cerebral.</p>\n<table class=\"cmp\"><tr><th>Característica</th><th>Síncope vasovagal</th></tr>\n<tr><td>Quem</td><td>Jovens hígidos (distribuição bimodal: jovens e idosos)</td></tr>\n<tr><td>Gatilhos</td><td><mark class=\"f5\" data-refs=\"S77.3,S78.18,S80.26,S81.25,S82.23,EDS.13\"><b>Ortostatismo prolongado</b>, ambiente quente e cheio</mark>, dor, medo, visão de sangue, emoção</td></tr>\n<tr><td>Pródromos</td><td><mark class=\"f4\" data-refs=\"S80.31,S81.2,S82.30,EDS.12\">Sudorese, palidez, náuseas, escurecimento visual, calor: <b>segundos antes</b></mark></td></tr>\n<tr><td>Defesa</td><td><mark class=\"f4\" data-refs=\"S80.31,S81.2,S82.30,EDS.12\">Os pródromos permitem um <b>esboço de defesa</b> (encostar na parede, sentar), minimizando fraturas e contusões</mark></td></tr>\n<tr><td>Recuperação</td><td>Rápida, mas pode haver <b>cansaço</b> depois</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>\"Acerca da síncope vasovagal\": o certo é \"habitualmente a presença de sintomas prodrômicos permite um esboço de defesa\". Errados: lesões graves (é da cardíaca), dor torácica e palpitações antes (cardíaca), ausência de sintomas antes (cardíaca).</p></div>\n<h3>Outras síncopes reflexas</h3>\n<ul><li><b>Situacional</b>: ao urinar (miccional), tossir, evacuar, deglutir.</li><li><b>Hipersensibilidade do seio carotídeo</b>: idoso, ao virar o pescoço, fazer a barba ou usar colarinho apertado. A massagem do seio causa pausa ≥ 3 segundos ou queda da PAS ≥ 50 mmHg.</li></ul>","qs":{"p":[{"enun":"Estudante de 19 anos, saudável, desmaia após 2 horas em pé numa formatura em ambiente quente. Antes, sentiu calor, náuseas e a vista escureceu, e conseguiu se apoiar numa cadeira.","cmd":"Qual o tipo mais provável?","alts":["Síncope vasovagal","Síncope por estenose aórtica","Hipersensibilidade do seio carotídeo","Síncope cardíaca por arritmia"],"gab":0,"com":["Correta. Jovem, ortostatismo prolongado, pródromos e defesa.","Improvável no perfil.","Típica de idosos.","A cardíaca costuma não ter pródromos."],"imgs":[]},{"enun":"Idoso de 78 anos desmaia sempre que vira a cabeça bruscamente ou ao fazer a barba.","cmd":"Qual a hipótese?","alts":["Hipotensão ortostática ao levantar","Hipersensibilidade do seio carotídeo","Síncope miccional noturna","Síncope vasovagal clássica por emoção"],"gab":1,"com":["O gatilho é ficar em pé.","Correta.","O gatilho é a micção.","O gatilho é mecânico no pescoço."],"imgs":[]},{"enun":"Homem de 70 anos desmaia logo após urinar à noite.","cmd":"Como se classifica?","alts":["Crise convulsiva noturna","Pré-síncope sem perda de consciência","Síncope situacional (miccional)","Síncope cardíaca por arritmia"],"gab":2,"com":["Não há movimentos nem pós-ictal.","Houve perda da consciência.","Correta.","Há gatilho claro."],"imgs":[]}]},"pv":["S81.2"]},{"id":"s3","titulo":"Hipotensão ortostática","html":"\n<p class=\"lead\">Ao ficar em pé, ~500 mL de sangue descem para as pernas. Normalmente a vasoconstrição e a taquicardia compensam. Quando falham, a PA cai e o cérebro é hipoperfundido.</p>\n<h3>Critério</h3>\n<p>Queda da <b>PAS ≥ 20 mmHg</b> ou da <b>PAD ≥ 10 mmHg</b> até 3 minutos depois de ficar em pé.</p>\n<ol class=\"steps\"><li>Paciente deitado por 5 minutos: mede PA e FC.</li><li>Fica em pé.</li><li>Mede de novo em 1 e em 3 minutos.</li></ol>\n<table class=\"cmp\"><tr><th>Causa</th><th>Exemplos</th></tr>\n<tr><td>Hipovolemia</td><td>Desidratação, hemorragia, diarreia</td></tr>\n<tr><td>Medicamentos</td><td>Anti-hipertensivos, diuréticos, nitratos, antidepressivos</td></tr>\n<tr><td>Disautonomia</td><td>Diabetes, Parkinson, idosos</td></tr>\n<tr><td>Álcool</td><td>Vasodilatação</td></tr></table>","qs":{"p":[{"enun":"Idoso em uso de três anti-hipertensivos: PA deitado 140/85; em pé, após 2 minutos, 112/78, com tontura.","cmd":"Qual a interpretação?","alts":["Normal para a idade","Hipersensibilidade do seio carotídeo","Síncope vasovagal","Hipotensão ortostática"],"gab":3,"com":["Queda ≥ 20 é critério.","Gatilho no pescoço.","Não houve gatilho emocional ou ortostatismo prolongado.","Correta. Queda de 28 na PAS."],"imgs":[]},{"enun":"Qual o critério de hipotensão ortostática?","cmd":"Assinale a alternativa correta.","alts":["PAS em pé abaixo de 120 mmHg em qualquer momento","Queda da PAS ≥ 20 ou da PAD ≥ 10 mmHg em pé","Aumento da FC ≥ 10 bpm nos primeiros minutos em pé","Queda da PAS ≥ 10 ou da PAD ≥ 5 mmHg ao ficar em pé"],"gab":1,"com":["Não é o critério.","Correta.","Não é o critério.","Os valores são maiores."],"imgs":[]},{"enun":"Diabético de longa data com neuropatia tem tontura sempre que levanta da cama.","cmd":"Qual o mecanismo provável?","alts":["Disautonomia, com falha da vasoconstrição","Arritmia ventricular induzida pelo esforço","Estenose aórtica com baixo débito fixo","Crise convulsiva com aura de tontura"],"gab":0,"com":["Correta.","Não há relação com a postura.","Ligada ao esforço.","Não se relaciona à postura."],"imgs":[]}]},"pv":[]},{"id":"s4","titulo":"Síncope cardíaca e os sinais de alarme","html":"\n<p class=\"lead\">A síncope cardíaca é a que mata. Por isso as provas cobram os sinais que a sugerem.</p>\n<table class=\"cmp\"><tr><th>Característica</th><th>Síncope cardíaca</th></tr>\n<tr><td>Pródromos</td><td><mark class=\"f5\" data-refs=\"S78.7,S77.3,S78.18,S80.26,S81.25,S82.23,EDS.13\"><b>Ausentes</b>: não há esboço de defesa</mark></td></tr>\n<tr><td>Consequência</td><td><mark class=\"f5\" data-refs=\"S77.3,S78.18,S80.26,S81.25,S82.23,EDS.13\"><b>Lesões traumáticas</b> na face e em extremidades ósseas</mark></td></tr>\n<tr><td>Contexto</td><td><mark class=\"f5\" data-refs=\"S77.3,S78.18,S80.26,S81.25,S82.23,EDS.13\"><b>Cardiopatia conhecida</b></mark>, síncope ao <b>esforço</b> ou deitado, palpitações antes, história familiar de morte súbita</td></tr>\n<tr><td>Causas</td><td>Arritmias (BAVT: <b>Stokes-Adams</b>; taquicardia ventricular), estenose aórtica, cardiomiopatia hipertrófica, TEP</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Sinais de alarme para causa cardíaca caiu como assertivas 1 a 4: certos são <b>ausência de pródromos</b>, <b>lesões traumáticas</b> e <b>cardiopatia conhecida</b>. O errado é \"ortostatismo prolongado em jovem hígido\", que sugere <b>vasovagal</b>.</p></div>\n<div class=\"pearl\"><b>Pérola de prova</b><p>O idoso com estenose aórtica que desmaia ao caminhar e corta o supercílio: \"habitualmente não há sintomas pré-sincopais que permitam um esboço de defesa\".</p></div>\n<table class=\"cmp\"><tr><th></th><th>Vasovagal</th><th>Cardíaca</th></tr>\n<tr><td>Pródromos</td><td>Sim</td><td>Não</td></tr>\n<tr><td>Defesa</td><td>Sim</td><td>Não</td></tr>\n<tr><td>Lesões</td><td>Leves</td><td>Graves</td></tr>\n<tr><td>Gatilho</td><td>Ortostatismo, emoção</td><td>Esforço, ou nenhum</td></tr>\n<tr><td>Quem</td><td>Jovem hígido</td><td>Cardiopata</td></tr></table>","qs":{"p":[{"enun":"Homem de 75 anos, cardiopata, cai sem aviso enquanto lia sentado e fratura o nariz. Recupera-se em segundos.","cmd":"Qual a hipótese mais preocupante?","alts":["Síncope cardíaca por arritmia","Hipotensão ortostática","Síncope situacional","Síncope vasovagal"],"gab":0,"com":["Correta. Sem pródromos, com lesão, cardiopata.","Ele estava sentado, sem mudar de posição.","Não houve gatilho situacional.","Teria pródromos e gatilho."],"imgs":[]},{"enun":"Paciente com BAVT tem episódios de perda súbita da consciência sem pródromos.","cmd":"Como se chamam essas crises?","alts":["Crises de pânico","Crises de ausência","Crises de Stokes-Adams","Crises vasovagais"],"gab":2,"com":["Não causam perda da consciência por bradiarritmia.","São epilépticas.","Correta.","Têm pródromos."],"imgs":[]},{"enun":"Qual achado sugere síncope de causa cardíaca?","cmd":"Assinale a alternativa correta.","alts":["Síncope durante o esforço físico","Náuseas e sudorese antes do desmaio","Visão de sangue como gatilho","Ortostatismo prolongado em jovem hígido"],"gab":0,"com":["Correta.","Pródromos sugerem vasovagal.","Sugere vasovagal.","Sugere vasovagal."],"imgs":[]}]},"pv":["S81.25","S78.7"]}],"quiz":[{"enun":"Síncope é:","cmd":"Assinale a alternativa correta.","alts":["Perda súbita de força em um lado do corpo","Perda súbita e transitória da consciência e do tônus","Perda de consciência prolongada, por horas","Sensação de desmaio sem perda de consciência"],"gab":1,"com":["Déficit focal.","Correta.","Não é transitória.","Pré-síncope."],"imgs":[]},{"enun":"Na vasovagal, os pródromos:","cmd":"Assinale a alternativa correta.","alts":["São dor torácica e palpitação","Causam lesões graves","Não existem","Permitem um esboço de defesa"],"gab":3,"com":["Cardíaca.","Cardíaca.","Existem.","Correta."],"imgs":[]},{"enun":"Hipotensão ortostática: queda da PAS de:","cmd":"Assinale a alternativa correta.","alts":["≥ 20 mmHg","≥ 50 mmHg","Qualquer queda","≥ 5 mmHg"],"gab":0,"com":["Correta.","Exagero.","Não.","Pouco."],"imgs":[]},{"enun":"Sinal de alarme para síncope cardíaca:","cmd":"Assinale a alternativa correta.","alts":["Ortostatismo prolongado em jovem","Visão de sangue","Ausência de pródromos","Calor e sudorese antes"],"gab":2,"com":["Vasovagal.","Vasovagal.","Correta.","Vasovagal."],"imgs":[]},{"enun":"Hipersensibilidade do seio carotídeo: na massagem, pausa de:","cmd":"Assinale a alternativa correta.","alts":["≥ 3 segundos","≥ 1 segundo","≥ 10 segundos","Qualquer pausa"],"gab":0,"com":["Correta.","Pouco.","Não.","Não."],"imgs":[]},{"enun":"Stokes-Adams ocorre em:","cmd":"Assinale a alternativa correta.","alts":["Convulsão","Hipotensão ortostática","BAVT","Vasovagal"],"gab":2,"com":["Não.","Não.","Correta.","Não."],"imgs":[]},{"enun":"Síncope ao esforço num idoso com sopro sistólico no foco aórtico:","cmd":"Assinale a alternativa correta.","alts":["Vasovagal","Ortostática","Situacional","Estenose aórtica"],"gab":3,"com":["Não.","Não.","Não.","Correta."],"imgs":[]},{"enun":"Diferencia convulsão de síncope:","cmd":"Assinale a alternativa correta.","alts":["Palidez cutânea intensa","Recuperação rápida e completa","Pródromos de calor e náusea","Confusão pós-ictal prolongada"],"gab":3,"com":["Síncope.","Síncope.","Síncope.","Correta."],"imgs":[]}],"widgets":[{"id":"sinc","titulo":"Vasovagal ou cardíaca?","desc":"Classifique cada pista.","cats":[["vv","Vasovagal"],["ca","Cardíaca"],["or","Ortostática"]],"cards":[["Pródromos de calor e sudorese","vv"],["Sem pródromos, com fratura","ca"],["Ortostatismo prolongado em jovem","vv"],["Cardiopatia conhecida","ca"],["Ao levantar da cama, em uso de diurético","or"],["Ao esforço, com sopro aórtico","ca"],["Visão de sangue","vv"],["Queda da PAS de 25 mmHg em pé","or"],["Stokes-Adams","ca"],["Cansaço após o episódio","vv"]]}],"gl":[["Síncope","Perda súbita e transitória da consciência e do tônus postural.",1],["Pré-síncope","Sensação de desmaio sem perder a consciência.",1],["Lipotimia","Mal-estar com fraqueza, sem perda completa da consciência.",1],["Vasovagal","Reflexa, com pródromos e defesa.",2],["Seio carotídeo","Pausa ≥ 3 s ou queda ≥ 50 mmHg na massagem.",2],["Hipotensão ortostática","Queda ≥ 20/10 mmHg ao ficar em pé.",3],["Stokes-Adams","Síncope do BAVT.",4]],"vf":[["Na vasovagal, os pródromos permitem defesa.",true,"Segundos antes."],["Ortostatismo prolongado em jovem sugere causa cardíaca.",false,"Sugere vasovagal."],["Lesões traumáticas sugerem causa cardíaca.",true,"Sem defesa."],["Síncope cardíaca costuma ter pródromos longos.",false,"Habitualmente não há pródromos."],["A hipotensão ortostática é queda ≥ 20 da PAS.",true,"Ou ≥ 10 da PAD."],["A síncope reflexa é a mais comum.",true,"E a mais benigna."]],"check":["Definir síncope, pré-síncope e lipotimia","Diferenciar síncope de convulsão","Reconhecer a vasovagal e seus pródromos","Aplicar o critério de hipotensão ortostática","Listar os sinais de alarme para causa cardíaca"],"resumo":[["Segmento 1","Síncope: perda súbita e transitória da consciência e do tônus postural. Reflexa (comum), ortostática, cardíaca (grave)."],["Segmento 2","Vasovagal: jovem, ortostatismo, pródromos, defesa, cansaço após. Seio carotídeo: idoso, pescoço."],["Segmento 3","Hipotensão ortostática: queda ≥ 20 PAS ou ≥ 10 PAD em pé. Hipovolemia, remédios, disautonomia."],["Segmento 4","Cardíaca: sem pródromos, sem defesa, lesões, cardiopatia, esforço. Stokes-Adams no BAVT."]],"freq":[["Síncope: sinais de alarme para causa cardíaca (ortostatismo do jovem não é)",6,"S77.3, S78.18, S80.26, S81.25, S82.23, EDS.13"],["Síncope vasovagal: pródromos permitem esboço de defesa",4,"S80.31, S81.2, S82.30, EDS.12"],["Síncope cardíaca: sem pródromos, sem esboço de defesa",1,"S78.7"]],"cob":{"rk":{"t":"Pródromos → defesa → tipo de síncope","c":["Pródromos","Defesa","Lesões","Tipo"],"d":["<b>Pródromos</b>: segundos de calor, sudorese, escurecimento?","<b>Defesa</b>: consegue se apoiar ou sentar?","<b>Lesões</b>: leves ou graves (face, extremidades)?","<b>Tipo</b>: vasovagal ou cardíaca."],"x":[["Sim","sim","leves","vasovagal"],["Não","não","graves","cardíaca"]],"ex":"Sinais de alarme cardíaca: sem pródromos + lesões traumáticas + cardiopatia conhecida. Ortostatismo em jovem = vasovagal.","b":"Hipotensão ortostática: queda ≥ 20 da PAS ou ≥ 10 da PAD ao ficar em pé."},"figs":[],"keys":["C2","C56","C24"]}},{"id":"a11","num":11,"nome":"Sinais e sintomas respiratórios","tema":"Cianose (central, periférica, mista, segmentar), dispneias posicionais (ortopneia, DPN, platipneia, trepopneia), tosse, expectoração e hemoptise","segs":[{"id":"s1","titulo":"Cianose","html":"\n<p class=\"lead\">Cianose é a coloração azulada da pele e das mucosas, que aparece quando a <b>desoxi-hemoglobina passa de ~5 g/dL</b> no sangue capilar. Por isso é um <mark class=\"f1\" data-refs=\"S82.7\">sinal <b>tardio</b> e pouco sensível de hipoxemia</mark>: taquicardia, taquipneia e alterações neurológicas costumam vir antes.</p>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Hipóxia (falta de O<sub>2</sub> nos tecidos) não é o mesmo que hipoxemia (O<sub>2</sub> baixo no sangue arterial). E a anemia <b>dificulta</b> ver a cianose: com pouca hemoglobina, é difícil chegar a 5 g/dL de desoxi-Hb.</p></div>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Mecanismo</th><th>Onde aparece</th><th>Com O<sub>2</sub> / aquecimento</th></tr>\n<tr><td><b>Central</b></td><td>Sangue arterial já sai pouco oxigenado (pulmão, shunt direita-esquerda como Fallot, altitude)</td><td>Mucosas (língua, lábios) e extremidades; extremidades quentes</td><td><mark class=\"f5\" data-refs=\"S78.30,S79.16,S81.12,S82.21,EDS.17\"><b>Melhora com O<sub>2</sub> suplementar</b></mark> (exceto no shunt)</td></tr>\n<tr><td><b>Periférica</b></td><td>Fluxo lento: os tecidos extraem mais O<sub>2</sub> (frio, IC, choque, Raynaud)</td><td>Extremidades frias; mucosas poupadas</td><td>Melhora com aquecimento e massagem</td></tr>\n<tr><td><b>Mista</b></td><td>As duas juntas (IC grave com congestão pulmonar)</td><td>Mucosas e extremidades</td><td>Melhora parcial</td></tr>\n<tr><td><b>Segmentar</b></td><td><mark class=\"f2\" data-refs=\"P80.7,S82.7\">Problema no retorno venoso ou no fluxo de <b>um segmento</b> (trombose venosa, estase)</mark></td><td>Só o segmento</td><td>—</td></tr>\n<tr><td>Por hemoglobinopatia</td><td>Meta-hemoglobina, sulfo-hemoglobina</td><td>Generalizada, sem hipoxemia proporcional</td><td>Não melhora com O<sub>2</sub></td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>\"Cianose que tende a melhorar com O<sub>2</sub> suplementar\": <b>central</b>. Na parcial, o certo foi \"cianose segmentar e periférica por complicação no retorno venoso de um segmento\". Distratores: \"precoce, com 2% de desoxi-Hb\" e \"a central não responde ao O<sub>2</sub>\".</p></div>","qs":{"p":[{"enun":"Paciente com pneumonia extensa tem cianose nos lábios e na língua, com extremidades quentes. Recebe O2 por cateter e a cianose melhora.","cmd":"Qual o tipo?","alts":["Cianose periférica","Cianose central","Cianose segmentar","Cianose por meta-hemoglobina"],"gab":1,"com":["A periférica poupa as mucosas e as extremidades são frias.","Correta.","Não é restrita a um segmento.","Não melhora com O2."],"imgs":[]},{"enun":"Mulher em dia frio tem dedos azulados e frios, que melhoram ao aquecer as mãos; língua rosada.","cmd":"Qual o tipo?","alts":["Cianose periférica","Cianose por hemoglobinopatia","Cianose central","Cianose mista"],"gab":0,"com":["Correta.","Não melhoraria com o aquecimento.","Na central a língua fica azulada.","Não há componente central."],"imgs":[]},{"enun":"Paciente com anemia grave (Hb 6 g/dL) e hipoxemia importante tem pouca cianose.","cmd":"Por que a cianose é discreta?","alts":["A anemia protege o paciente contra a hipoxemia tecidual","Com pouca hemoglobina, é difícil atingir 5 g/dL de desoxi-Hb","A anemia causa vasodilatação periférica que mascara a cor","A cianose não depende da quantidade de hemoglobina"],"gab":1,"com":["A anemia não protege.","Correta.","Não é o mecanismo.","Ela depende da quantidade de desoxi-Hb."],"imgs":[]},{"enun":"Homem de 64 anos, com massa no mediastino que comprime a veia cava superior, apresenta face, pescoço e membros superiores arroxeados e edemaciados. Língua e membros inferiores estão com coloração normal.","cmd":"Como classificar essa cianose?","alts":["Central, por hipoxemia, que melhora com O2 suplementar","Segmentar e periférica, por obstrução do retorno venoso","Generalizada, por meta-hemoglobina, sem hipoxemia proporcional","Fisiológica, pela exposição ao frio, que melhora com aquecimento"],"gab":1,"com":["A língua está corada e só o segmento drenado pela cava está cianótico: não é central.","Correta. A compressão venosa extrínseca (neoplásica) causa cianose segmentar (regional) e periférica (tissular).","Na meta-hemoglobina a cianose é generalizada, sem respeitar um território venoso.","Não há frio no caso, e a cianose ao frio atinge extremidades, não o território da cava."],"imgs":[]}]},"pv":["S81.12","P80.7","S82.7"]},{"id":"s2","titulo":"Dispneia e suas formas posicionais","html":"\n<p class=\"lead\">Dispneia é a sensação subjetiva de falta de ar, de respiração difícil ou desconfortável. A posição que a provoca ou alivia ajuda a achar a causa.</p>\n<table class=\"cmp\"><tr><th>Termo</th><th>Quando aparece</th><th>Alivia com</th><th>Pensar em</th></tr>\n<tr><td><b>Ortopneia</b></td><td>Ao deitar</td><td><mark class=\"f1\" data-refs=\"S78.23\">Sentar ou elevar a cabeceira (vários travesseiros)</mark></td><td>IC esquerda: o retorno venoso aumenta deitado e congestiona o pulmão</td></tr>\n<tr><td><b>Dispneia paroxística noturna</b></td><td>Acorda com falta de ar 1 a 3 h depois de deitar</td><td>Sentar ou levantar, demora</td><td><mark class=\"f1\" data-refs=\"S78.23\">IC esquerda; mesma fisiopatologia da ortopneia</mark></td></tr>\n<tr><td><b>Platipneia</b></td><td><mark class=\"f5\" data-refs=\"S77.10,S79.6,S80.29,S81.10,S78.23\">Ao ficar <b>em pé</b> (ortostatismo)</mark></td><td><mark class=\"f5\" data-refs=\"S77.10,S79.6,S80.29,S81.10,S78.23\"><b>Decúbito dorsal</b></mark></td><td>Síndrome hepatopulmonar, shunts intracardíacos, pneumectomia</td></tr>\n<tr><td><b>Trepopneia</b></td><td><mark class=\"f1\" data-refs=\"S78.23\">Em um <b>decúbito lateral</b></mark></td><td>O decúbito oposto</td><td><mark class=\"f1\" data-refs=\"S78.23\">Afecções pleurais (derrame), lesão pulmonar unilateral</mark></td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Assertivas da dispneia: certas — platipneia surge em pé e alivia deitado; trepopneia surge num decúbito lateral e sugere afecção pleural; DPN se relaciona à ortopneia. Errada — \"na ortopneia o paciente alivia no decúbito dorsal\": na ortopneia ele alivia <b>sentado</b>.</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Platipneia é o oposto da ortopneia. Ortopneia: \"orto\" de ereto, a falta de ar melhora ereto. Platipneia: \"plati\" de plano, melhora no plano (deitado).</p></div>\n<h3>Graduar a dispneia</h3>\n<p>Aos grandes, médios ou pequenos esforços, ou em repouso (classes da NYHA na IC; escala mMRC na DPOC).</p>","qs":{"p":[{"enun":"Paciente cirrótico tem falta de ar quando fica em pé, que melhora quando se deita de costas.","cmd":"Como se chama?","alts":["Trepopneia","Dispneia paroxística noturna","Platipneia","Ortopneia"],"gab":2,"com":["Trepopneia é no decúbito lateral.","A DPN acorda o paciente à noite.","Correta.","Na ortopneia piora deitado."],"imgs":[]},{"enun":"Paciente com IC usa três travesseiros para dormir; deitado plano fica sem ar.","cmd":"Como se chama?","alts":["Platipneia","Ortopneia","Trepopneia","Taquipneia"],"gab":1,"com":["A platipneia piora em pé.","Correta.","A trepopneia é num decúbito lateral.","Taquipneia é FR alta."],"imgs":[]},{"enun":"Paciente com derrame pleural volumoso à direita sente falta de ar ao deitar sobre o lado esquerdo e melhora deitando sobre o direito.","cmd":"Como se chama?","alts":["Dispneia paroxística noturna","Platipneia","Trepopneia","Ortopneia"],"gab":2,"com":["Não é noturna paroxística.","Não é em pé.","Correta. O pulmão bom fica para cima e ventila melhor com o derrame por baixo.","Não é ao deitar de costas."],"imgs":[]}]},"pv":["S81.10","S78.23"]},{"id":"s3","titulo":"Tosse, expectoração e hemoptise","html":"\n<p class=\"lead\">A tosse é um reflexo de defesa. Descrever a tosse e o escarro orienta o diagnóstico.</p>\n<table class=\"cmp\"><tr><th>Item</th><th>O que perguntar</th></tr>\n<tr><td>Duração</td><td>Aguda (&lt; 3 semanas), subaguda (3 a 8), crônica (&gt; 8)</td></tr>\n<tr><td>Tipo</td><td>Seca ou produtiva</td></tr>\n<tr><td>Horário</td><td>Noturna e de madrugada (asma, refluxo, IC); matinal (bronquite crônica, tabagismo)</td></tr>\n<tr><td>Escarro</td><td>Mucoide (claro), purulento (amarelo-esverdeado), hemoptoico, espumoso rosado (edema agudo de pulmão), em \"geleia de chocolate\"</td></tr></table>\n<h3>Hemoptise × hematêmese × epistaxe</h3>\n<table class=\"cmp\"><tr><th></th><th>Hemoptise</th><th>Hematêmese</th></tr>\n<tr><td>Origem</td><td>Vias aéreas inferiores</td><td>Trato digestivo alto</td></tr>\n<tr><td>Como sai</td><td>Com a tosse</td><td>Com o vômito</td></tr>\n<tr><td>Aspecto</td><td>Vermelho vivo, espumoso, pH alcalino</td><td>Escuro (\"borra de café\"), com restos alimentares, pH ácido</td></tr>\n<tr><td>Antes</td><td>Sensação de borbulhar no peito</td><td>Náuseas</td></tr></table>\n<p>Escarro com raias de sangue = <b>hemoptoico</b>. Hemoptise maciça (&gt; 500 mL em 24 h) é emergência. Causas: tuberculose, bronquiectasias, câncer de pulmão, TEP, estenose mitral.</p>","qs":{"p":[{"enun":"Paciente elimina sangue vermelho vivo e espumoso ao tossir, após sensação de borbulhar no peito.","cmd":"Como se chama?","alts":["Melena","Epistaxe","Hematêmese","Hemoptise"],"gab":3,"com":["Fezes escuras.","Sangue do nariz.","Sai com o vômito.","Correta."],"imgs":[]},{"enun":"Paciente com IC aguda elimina escarro espumoso e rosado, com dispneia intensa.","cmd":"Qual a hipótese?","alts":["Edema agudo de pulmão","Tuberculose","Asma","Pneumonia lobar"],"gab":0,"com":["Correta.","Hemoptoico, crônico.","Escarro mucoide.","Escarro purulento ou ferruginoso."],"imgs":[]},{"enun":"Tosse seca há 10 semanas, pior de madrugada, em paciente com chiado ocasional.","cmd":"Como classificar e qual a hipótese?","alts":["Tosse aguda; resfriado","Tosse subaguda; pneumonia","Tosse crônica; asma","Tosse crônica; edema agudo de pulmão"],"gab":2,"com":["Mais de 8 semanas é crônica.","10 semanas é crônica.","Correta.","O edema agudo é agudo e com escarro rosado."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"Cianose que melhora com O2:","cmd":"Assinale a alternativa correta.","alts":["Periférica","Por meta-hemoglobina","Central","Segmentar"],"gab":2,"com":["Melhora com aquecimento.","Não melhora.","Correta.","Não."],"imgs":[]},{"enun":"A cianose aparece com desoxi-Hb acima de:","cmd":"Assinale a alternativa correta.","alts":["~15 g/dL","~5 g/dL","~0,5 g/dL","~2%"],"gab":1,"com":["Muito alto.","Correta.","Muito baixo.","É o distrator da parcial."],"imgs":[]},{"enun":"Cianose com extremidades frias e mucosas róseas:","cmd":"Assinale a alternativa correta.","alts":["Por shunt","Central","Mista","Periférica"],"gab":3,"com":["Central.","Mucosas azuladas.","Mucosas azuladas.","Correta."],"imgs":[]},{"enun":"Platipneia:","cmd":"Assinale a alternativa correta.","alts":["Dispneia em pé que alivia deitado","Dispneia em decúbito lateral","Dispneia noturna paroxística","Dispneia deitado que alivia sentado"],"gab":0,"com":["Correta.","Trepopneia.","DPN.","Ortopneia."],"imgs":[]},{"enun":"Na ortopneia o paciente alivia:","cmd":"Assinale a alternativa correta.","alts":["Em pé, apenas, caminhando","Em decúbito dorsal horizontal","Em decúbito lateral esquerdo","Sentado ou com cabeceira alta"],"gab":3,"com":["Não é o mais característico.","É o erro da assertiva IV.","Trepopneia.","Correta."],"imgs":[]},{"enun":"Trepopneia sugere:","cmd":"Assinale a alternativa correta.","alts":["Asma","IC esquerda","Afecção pleural","Síndrome hepatopulmonar"],"gab":2,"com":["Não.","Ortopneia, DPN.","Correta.","Platipneia."],"imgs":[]},{"enun":"Tosse crônica dura mais de:","cmd":"Assinale a alternativa correta.","alts":["3 dias","8 semanas","1 semana","6 meses"],"gab":1,"com":["Não.","Correta.","Não.","Não."],"imgs":[]},{"enun":"Hemoptise:","cmd":"Assinale a alternativa correta.","alts":["Sangue eliminado junto com o vômito","Sangue proveniente do nariz","Sangue das vias aéreas inferiores na tosse","Fezes com sangue vivo ou escurecido"],"gab":2,"com":["Hematêmese.","Epistaxe.","Correta.","Enterorragia ou melena."],"imgs":[]}],"widgets":[{"id":"disp","titulo":"Que dispneia é essa?","desc":"Classifique cada descrição.","cats":[["orto","Ortopneia"],["dpn","DPN"],["plat","Platipneia"],["trep","Trepopneia"]],"cards":[["Piora deitado, alivia sentado","orto"],["Acorda à noite com falta de ar","dpn"],["Piora em pé, alivia deitado","plat"],["Piora num decúbito lateral","trep"],["Três travesseiros para dormir","orto"],["Síndrome hepatopulmonar","plat"],["Derrame pleural","trep"],["IC esquerda, 2 h após deitar","dpn"]]},{"id":"cian","titulo":"Central ou periférica?","desc":"Classifique a cianose.","cats":[["c","Central"],["p","Periférica"]],"cards":[["Melhora com O2","c"],["Melhora com aquecimento","p"],["Língua azulada","c"],["Extremidades frias, mucosas róseas","p"],["Pneumonia extensa","c"],["Fenômeno de Raynaud","p"],["Tetralogia de Fallot","c"],["Choque com vasoconstrição","p"]]}],"gl":[["Cianose","Desoxi-Hb > ~5 g/dL; sinal tardio.",1],["Cianose central","Mucosas, extremidades quentes, melhora com O2.",1],["Cianose periférica","Extremidades frias, melhora com aquecimento.",1],["Cianose segmentar","Um segmento: estase, trombose venosa.",1],["Ortopneia","Dispneia deitado, alivia sentado.",2],["Platipneia","Dispneia em pé, alivia deitado.",2],["Trepopneia","Dispneia num decúbito lateral; pleura.",2],["Hemoptise","Sangue das vias aéreas inferiores, com a tosse.",3]],"vf":[["A cianose é sinal precoce de hipoxemia.",false,"É tardio (~5 g/dL)."],["A cianose central melhora com O2.",true,"Exceto no shunt."],["Na ortopneia o paciente alivia no decúbito dorsal.",false,"Alivia sentado."],["Trepopneia pode sinalizar afecção pleural.",true,"Derrame."],["A anemia facilita ver a cianose.",false,"Dificulta."],["A DPN se relaciona à ortopneia.",true,"Mesma fisiopatologia."]],"check":["Diferenciar cianose central, periférica, mista e segmentar","Explicar por que a cianose é tardia e some na anemia","Definir ortopneia, DPN, platipneia e trepopneia","Classificar a tosse e o escarro","Diferenciar hemoptise de hematêmese"],"resumo":[["Segmento 1","Cianose: desoxi-Hb > 5 g/dL. Central melhora com O2; periférica com aquecimento; segmentar por estase venosa."],["Segmento 2","Ortopneia (alivia sentado), DPN (IC), platipneia (em pé, alivia deitado), trepopneia (decúbito lateral, pleura)."],["Segmento 3","Tosse aguda < 3 sem, crônica > 8. Hemoptise: com a tosse, vermelho vivo, espumosa."]],"freq":[["Platipneia: dispneia que piora em pé (o contrário da ortopneia)",4,"S77.10, S79.6, S80.29, S81.10"],["Cianose central melhora com O2",5,"S78.30, S79.16, S81.12, S82.21, EDS.17"],["Cianose segmentar periférica por dificuldade de retorno venoso",1,"P80.7"],["Platipneia, ortopneia, trepopneia e DPN",1,"S78.23"],["Cianose: segmentar por retorno venoso; central responde ao O<sub>2</sub>; sinal tardio",1,"S82.7"]],"cob":{"rk":{"t":"Posição → dispneia","c":["Piora","Alivia","Nome","Causa típica"],"d":["<b>Piora</b>: a posição que provoca.","<b>Alivia</b>: a posição que melhora.","<b>Nome</b>: o termo cobrado.","<b>Causa</b>: a doença associada."],"x":[["Deitado","sentado","ortopneia","IC esquerda"],["Em pé","deitado de costas","platipneia","hepatopulmonar, shunt"],["Um decúbito lateral","o lado oposto","trepopneia","derrame pleural"]],"ex":"Cianose que melhora com O2 = central.","b":"A assertiva errada clássica: \"na ortopneia o paciente sente alívio no decúbito dorsal\"."},"figs":[],"keys":["C9","C37","p:cianose","C32"]}},{"id":"a12","num":12,"nome":"Exame do aparelho respiratório","tema":"Inspeção do tórax, FR e ritmos, palpação (expansibilidade e FTV), percussão, ausculta, derrame pleural e pneumotórax, asma e DPOC","segs":[{"id":"s1","titulo":"Inspeção: tipos de tórax, FR e ritmos respiratórios","html":"\n<p class=\"lead\">O exame do tórax segue inspeção, palpação, percussão e ausculta, sempre comparando um lado com o outro.</p>\n<h3>Tipos de tórax</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"torax-tipos\" alt=\"\"><figcaption>Tipos de tórax: normal, em tonel (enfisematoso), pectus carinatum (peito de pombo), pectus excavatum (de sapateiro), cifoescoliótico.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Como é</th><th>Associação</th></tr>\n<tr><td>Em tonel</td><td>Diâmetro anteroposterior aumentado, igual ao laterolateral; costelas horizontalizadas</td><td>Enfisema, DPOC</td></tr>\n<tr><td>Pectus carinatum</td><td>Esterno projetado para frente</td><td>Raquitismo, congênito</td></tr>\n<tr><td>Pectus excavatum</td><td>Depressão do esterno inferior</td><td>Congênito, Marfan</td></tr>\n<tr><td>Cifoescoliótico</td><td>Desvio da coluna, assimetria</td><td>Restrição ventilatória</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"torax-pectus\" alt=\"\"><figcaption>Pectus excavatum e carinatum.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"torax-deformidades\" alt=\"\"><figcaption>Outras deformidades torácicas.</figcaption></figure>\n<h3>Frequência respiratória</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"fr-idade\" alt=\"\"><figcaption>FR normal por idade: recém-nascido 40 a 60; lactente 30 a 50; adulto 12 a 20 irpm.</figcaption></figure>\n<p>Adulto: <b>12 a 20 irpm</b>. Acima: taquipneia; abaixo: bradipneia; ausência: apneia. Conte sem avisar o paciente, por 1 minuto.</p>\n<h3>Ritmos respiratórios</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ritmos-1\" alt=\"\"><figcaption>Ritmos respiratórios: Cheyne-Stokes, Biot, Kussmaul.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ritmos-2\" alt=\"\"><figcaption>Ritmos respiratórios: suspirosa, apnêustica e outros.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Ritmo</th><th>Padrão</th><th>Causa</th></tr>\n<tr><td>Cheyne-Stokes</td><td>Amplitude cresce e decresce, seguida de apneia (em ondas)</td><td>IC grave, lesão neurológica, uremia</td></tr>\n<tr><td>Biot</td><td>Irregular, com apneias, sem padrão</td><td>Lesão de tronco, meningite, hipertensão intracraniana</td></tr>\n<tr><td>Kussmaul</td><td>Inspirações profundas e ruidosas, ritmo regular</td><td>Acidose metabólica (cetoacidose diabética)</td></tr>\n<tr><td>Suspirosa</td><td>Respiração normal interrompida por suspiros</td><td>Ansiedade</td></tr></table>","qs":{"p":[{"enun":"Diabético tipo 1 em cetoacidose respira de forma profunda, ruidosa e regular.","cmd":"Qual o ritmo?","alts":["Biot","Cheyne-Stokes","Kussmaul","Suspirosa"],"gab":2,"com":["Irregular com apneias.","Em ondas com apneia.","Correta. Compensação da acidose metabólica.","Interrompida por suspiros."],"imgs":["ritmos-1"]},{"enun":"Idoso com IC grave tem respiração cuja amplitude cresce, depois decresce, seguida de pausa, de forma cíclica.","cmd":"Qual o ritmo?","alts":["Cheyne-Stokes","Kussmaul","Apnêustica","Biot"],"gab":0,"com":["Correta.","Profunda e regular.","Inspiração prolongada com pausa.","Sem padrão."],"imgs":[]},{"enun":"Enfisematoso tem diâmetro anteroposterior igual ao laterolateral e costelas horizontalizadas.","cmd":"Qual o tipo de tórax?","alts":["Cifoescoliótico","Pectus excavatum","Pectus carinatum","Em tonel"],"gab":3,"com":["Desvio da coluna.","Depressão do esterno.","Esterno projetado.","Correta."],"imgs":["q-pectus"]}]},"pv":[]},{"id":"s2","titulo":"Palpação: expansibilidade e frêmito toracovocal","html":"\n<p class=\"lead\">A palpação avalia a <b>expansibilidade</b> (quanto o tórax se move) e o <b>frêmito toracovocal</b> (FTV, a vibração da voz que chega à parede).</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"expansibilidade\" alt=\"\"><figcaption>Expansibilidade: mãos nos ápices e nas bases, polegares próximos à coluna; na inspiração profunda, os polegares se afastam igualmente dos dois lados.</figcaption></figure>\n<p>Expansibilidade <b>reduzida num lado</b>: derrame pleural, pneumotórax, atelectasia, pneumonia extensa, dor. Reduzida dos dois lados: DPOC, obesidade.</p>\n<h3>Frêmito toracovocal</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ftv\" alt=\"\"><figcaption>FTV: o paciente diz \"trinta e três\" enquanto o examinador palpa com a face palmar, comparando pontos simétricos.</figcaption></figure>\n<p>A vibração da voz passa melhor pelo <b>sólido</b> (parênquima consolidado) e pior pelo <b>ar</b> ou pelo <b>líquido</b> fora do pulmão.</p>\n<table class=\"cmp\"><tr><th>FTV</th><th>Causas</th></tr>\n<tr><td><b>Aumentado</b></td><td>Consolidação (pneumonia), com brônquio pérvio</td></tr>\n<tr><td><b>Diminuído ou abolido</b></td><td>Derrame pleural, pneumotórax, atelectasia com obstrução brônquica, espessamento pleural, enfisema, obesidade</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Afecções pleurais são <b>antipáticas</b> ao FTV; afecções do parênquima são <b>simpáticas</b>.\" Ou seja: pleura (derrame, pneumotórax) diminui o FTV; parênquima consolidado aumenta.</p></div>","qs":{"p":[{"enun":"Paciente com pneumonia lobar à direita.","cmd":"O que se espera do FTV no lobo acometido?","alts":["Igual ao lado normal","Diminuído","Aumentado","Abolido"],"gab":2,"com":["A consolidação muda o FTV.","Seria no derrame ou pneumotórax.","Correta. O parênquima consolidado transmite melhor a vibração.","Seria no derrame volumoso."],"imgs":[]},{"enun":"Paciente com derrame pleural volumoso à esquerda.","cmd":"O que se espera da expansibilidade e do FTV à esquerda?","alts":["Expansibilidade e FTV aumentados","Expansibilidade reduzida e FTV aumentado","Expansibilidade normal e FTV normal","Expansibilidade e FTV reduzidos"],"gab":3,"com":["O líquido limita e isola.","O líquido isola o FTV.","O derrame volumoso muda ambos.","Correta."],"imgs":[]},{"enun":"Para pesquisar o FTV, o que se pede ao paciente?","cmd":"Assinale a alternativa correta.","alts":["Que respire rápido e profundo pela boca","Que tussa com força várias vezes seguidas","Que prenda a respiração em inspiração","Que diga \"trinta e três\" durante a palpação"],"gab":3,"com":["Não é a técnica.","A tosse não é usada.","Não gera vibração vocal.","Correta."],"imgs":[]}]},"pv":[]},{"id":"s3","titulo":"Percussão","html":"\n<p class=\"lead\">A percussão mostra o que há sob a parede: ar, líquido ou sólido.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"percussao\" alt=\"\"><figcaption>Percussão digito-digital: o dedo médio da mão dominante golpeia a falange do dedo médio da outra mão, apoiada no espaço intercostal.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Som</th><th>Onde é normal</th><th>Onde é patológico</th></tr>\n<tr><td><mark class=\"f1\" data-refs=\"S79.26\"><b>Claro pulmonar</b> (ou sonoro)</mark></td><td>Sobre o pulmão normal</td><td>—</td></tr>\n<tr><td><b>Timpânico</b></td><td>Espaço de Traube (estômago)</td><td>Pneumotórax</td></tr>\n<tr><td><b>Hipersonoro</b></td><td>—</td><td>Enfisema, asma em crise</td></tr>\n<tr><td><b>Submaciço</b></td><td>Transição</td><td>Derrame pleural, consolidação</td></tr>\n<tr><td><b>Maciço</b></td><td><mark class=\"f1\" data-refs=\"S80.19\">Sobre o fígado, no hipocôndrio direito</mark>, sobre o coração</td><td>Derrame volumoso, grande consolidação</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Percussão × ausculta: <mark class=\"f1\" data-refs=\"S79.26\">o <b>som claro pulmonar</b> é de percussão</mark>. Murmúrio vesicular, som broncovesicular, estertores e sibilos são de ausculta. E descendo pela linha hemiclavicular direita até o hipocôndrio direito, o som é <mark class=\"f1\" data-refs=\"S80.19\"><b>maciço</b>, do fígado</mark>.</p></div>","qs":{"p":[{"enun":"Qual som é obtido pela percussão, e não pela ausculta?","cmd":"Assinale a alternativa correta.","alts":["Murmúrio vesicular","Estertor crepitante","Sopro tubário","Som timpânico"],"gab":3,"com":["É de ausculta.","É de ausculta.","É de ausculta.","Correta."],"imgs":[]},{"enun":"Paciente com pneumotórax à direita.","cmd":"Que som se espera à percussão do lado direito?","alts":["Submaciço","Claro pulmonar","Maciço","Timpânico"],"gab":3,"com":["Derrame ou consolidação.","Normal.","Líquido ou sólido.","Correta."],"imgs":[]},{"enun":"Enfisematoso com tórax em tonel é percutido.","cmd":"Que som se espera?","alts":["Timpânico exclusivo no ápice","Hipersonoro","Submaciço","Maciço"],"gab":1,"com":["Não é o padrão.","Correta. Excesso de ar no parênquima.","Seria líquido ou consolidação.","Seria líquido ou sólido."],"imgs":[]}]},"pv":["S79.26","S80.19"]},{"id":"s4","titulo":"Ausculta: sons normais e ruídos adventícios","html":"\n<p class=\"lead\">A ausculta compara pontos simétricos, do ápice à base, com o paciente respirando pela boca, profundo e devagar.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ausculta-sequencia\" alt=\"\"><figcaption>Sequência de ausculta: pontos simétricos na face anterior, lateral e posterior, comparando os dois lados.</figcaption></figure>\n<h3>Sons normais: depende do lugar</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sons-normais\" alt=\"\"><figcaption>Sons normais: som traqueal (sobre a traqueia), som broncovesicular (região esternal superior e interescapular) e murmúrio vesicular (na maior parte do tórax).</figcaption></figure>\n<table class=\"cmp\"><tr><th>Som</th><th>Onde é normal</th><th>Característica</th></tr>\n<tr><td>Traqueal (brônquico)</td><td>Sobre a traqueia, no pescoço</td><td>Alto, áspero; expiração mais longa</td></tr>\n<tr><td><mark class=\"f4\" data-refs=\"S78.24,S80.20,S82.10,EDS.4\"><b>Broncovesicular</b></mark></td><td><mark class=\"f4\" data-refs=\"S78.24,S80.20,S82.10,EDS.4\">Região esternal superior, interescapular, 1º e 2º EIC</mark></td><td>Intermediário; inspiração e expiração iguais</td></tr>\n<tr><td>Murmúrio vesicular</td><td>Na maior parte do tórax</td><td>Suave; inspiração mais longa que a expiração</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>\"No paciente hígido, som normal a depender do sítio examinado\": <b>broncovesicular</b>. Estertores, sibilos e sopro tubário fora da traqueia são sempre patológicos.</p></div>\n<h3>Murmúrio vesicular alterado</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"mv-alteracoes\" alt=\"\"><figcaption>MV diminuído ou abolido: derrame pleural, pneumotórax, atelectasia, enfisema, obesidade.</figcaption></figure>\n<h3>Ruídos adventícios</h3>\n<table class=\"cmp\"><tr><th>Ruído</th><th>Como é</th><th>Mecanismo e causa</th></tr>\n<tr><td>Estertores finos (crepitantes)</td><td>No fim da inspiração, como \"cabelo atritado\"; não mudam com a tosse</td><td>Abertura de alvéolos com líquido: pneumonia, congestão, fibrose</td></tr>\n<tr><td>Estertores grossos (bolhosos)</td><td>Início da inspiração e expiração; mudam com a tosse</td><td>Secreção em brônquios: bronquite, bronquiectasia</td></tr>\n<tr><td>Roncos</td><td>Graves, contínuos</td><td>Secreção em vias de grosso calibre</td></tr>\n<tr><td>Sibilos</td><td>Agudos, contínuos, \"chiado\", mais na expiração</td><td>Estreitamento das vias aéreas: asma, DPOC</td></tr>\n<tr><td>Estridor</td><td>Inspiratório, alto</td><td>Obstrução alta (laringe, traqueia)</td></tr>\n<tr><td>Atrito pleural</td><td>Áspero, nas duas fases, localizado</td><td>Pleurite; some quando o derrame se instala</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"estertores\" alt=\"\"><figcaption>Estertores finos e grossos.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"roncos-sibilos\" alt=\"\"><figcaption>Roncos e sibilos.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"estridor\" alt=\"\"><figcaption>Estridor: obstrução alta.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"atrito\" alt=\"\"><figcaption>Atrito pleural.</figcaption></figure>\n<h3>Voz e sopros</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"broncofonia\" alt=\"\"><figcaption>Ressonância vocal: broncofonia, pectorilóquia fônica e afônica, aumentadas na consolidação.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"egofonia\" alt=\"\"><figcaption>Egofonia: voz anasalada, \"de cabra\", no limite superior do derrame pleural.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopros-pulm\" alt=\"\"><figcaption>Sopro tubário (consolidação com brônquio pérvio), cavitário e pleural.</figcaption></figure>","qs":{"p":[{"enun":"Paciente com pneumonia tem, no fim da inspiração, ruído como cabelo atritado entre os dedos, que não muda com a tosse.","cmd":"Qual o ruído?","alts":["Estertores grossos (bolhosos)","Atrito pleural inspiratório","Roncos de vias aéreas","Estertores finos (crepitantes)"],"gab":3,"com":["Mudam com a tosse.","Nas duas fases, áspero.","Contínuos e graves.","Correta."],"imgs":["estertores"]},{"enun":"Asmático em crise tem ruído agudo e contínuo, predominante na expiração.","cmd":"Qual o ruído?","alts":["Estertores finos","Sopro tubário","Sibilos","Estridor"],"gab":2,"com":["Descontínuos.","Na consolidação.","Correta.","Inspiratório, obstrução alta."],"imgs":[]},{"enun":"Criança com obstrução laríngea por corpo estranho tem som alto na inspiração, audível sem estetoscópio.","cmd":"Qual o ruído?","alts":["Ronco","Estridor","Sibilo","Atrito"],"gab":1,"com":["Grave.","Correta.","Expiratório, vias menores.","Pleural."],"imgs":[]}]},"pv":["S81.14"]},{"id":"s5","titulo":"Síndromes pleurais: derrame e pneumotórax","html":"\n<p class=\"lead\">Derrame e pneumotórax são as síndromes mais cobradas nas somativas. Os dois isolam o pulmão da parede, então FTV e sons respiratórios caem. O que separa um do outro é a <b>percussão</b>.</p>\n<table class=\"cmp\"><tr><th>Etapa</th><th>Derrame pleural</th><th>Pneumotórax</th><th>Consolidação (pneumonia)</th></tr>\n<tr><td>Inspeção / expansibilidade</td><td><mark class=\"f5\" data-refs=\"S77.16,S78.13,S79.1,S80.21,S81.18,S82.28,EDS.2\">Reduzida no lado acometido</mark></td><td><mark class=\"f5\" data-refs=\"S77.11,S78.19,S79.8,S80.16,S81.15,EDS.1\">Reduzida</mark></td><td>Reduzida</td></tr>\n<tr><td>FTV</td><td><mark class=\"f5\" data-refs=\"S77.16,S78.13,S79.1,S80.21,S81.18,S82.28,EDS.2\">Diminuído ou abolido</mark></td><td><mark class=\"f5\" data-refs=\"S77.11,S78.19,S79.8,S80.16,S81.15,EDS.1\">Diminuído ou abolido</mark></td><td><b>Aumentado</b></td></tr>\n<tr><td>Percussão</td><td><mark class=\"f5\" data-refs=\"S77.16,S78.13,S79.1,S80.21,S81.18,S82.28,EDS.2\"><b>Submaciça ou maciça</b></mark></td><td><mark class=\"f5\" data-refs=\"S77.11,S78.19,S79.8,S80.16,S81.15,EDS.1\"><b>Timpânica</b></mark></td><td>Submaciça</td></tr>\n<tr><td>Ausculta</td><td><mark class=\"f5\" data-refs=\"S77.16,S78.13,S79.1,S80.21,S81.18,S82.28,EDS.2\">MV diminuído ou abolido</mark>; egofonia no limite superior</td><td><mark class=\"f5\" data-refs=\"S77.11,S78.19,S79.8,S80.16,S81.15,EDS.1\">MV diminuído ou abolido</mark></td><td>Estertores finos, sopro tubário, broncofonia</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>\"O derrame pleural atua como um <b>isolante acústico</b>, tanto para a palpação (frêmito) quanto para a ausculta.\" O pneumotórax também. As questões do derrame vieram em assertivas I a IV, e <b>todas</b> estavam certas (expansibilidade reduzida, FTV reduzido, percussão submaciça, sons diminuídos).</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>O pneumotórax tem tudo diminuído, como o derrame, menos a percussão: <b>timpânica</b>. O distrator mais comum troca a percussão por \"submaciça\".</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> No pneumotórax hipertensivo, a traqueia desvia para o lado oposto, com turgência jugular e hipotensão: emergência, descompressão imediata.</p></div>","qs":{"p":[{"enun":"Mulher de 50 anos com câncer de mama tratado chega com dispneia progressiva. RX: derrame pleural volumoso à direita.","cmd":"Qual conjunto de achados se espera à direita?","alts":["Expansibilidade reduzida, FTV aumentado, percussão timpânica, sopro tubário","Expansibilidade normal, FTV normal, percussão hipersonora, sibilos","Expansibilidade e FTV reduzidos, percussão submaciça, MV diminuído","Expansibilidade aumentada, FTV reduzido, percussão maciça, estertores"],"gab":2,"com":["FTV aumentado e sopro tubário são da consolidação; timpanismo é do pneumotórax.","O derrame volumoso muda o exame.","Correta.","A expansibilidade fica reduzida."],"imgs":[]},{"enun":"Jovem com pneumotórax espontâneo à esquerda.","cmd":"Quais achados à esquerda?","alts":["FTV diminuído, percussão timpânica, MV diminuído ou abolido","FTV aumentado, percussão maciça, sopro tubário","FTV normal, percussão claro pulmonar, MV normal","FTV diminuído, percussão submaciça, MV abolido"],"gab":0,"com":["Correta.","É a consolidação.","O pneumotórax muda o exame.","Submaciça é do derrame."],"imgs":[]},{"enun":"Por que o FTV diminui no derrame pleural?","cmd":"Assinale a alternativa correta.","alts":["O líquido entre pulmão e parede funciona como isolante","O paciente fala mais baixo por causa da dor pleurítica","O pulmão fica consolidado embaixo do derrame","O líquido aumenta a transmissão da vibração vocal"],"gab":0,"com":["Correta.","Não é o mecanismo.","Consolidação aumentaria o FTV.","O líquido isola."],"imgs":[]}]},"pv":["S81.15","S81.18","S77.16"]},{"id":"s6","titulo":"Síndromes obstrutivas: asma e DPOC","html":"\n<p class=\"lead\"><mark class=\"f5\" data-refs=\"S81.16,S77.15,S78.26,S78.5,S79.21,S81.31,S82.29,S82.4,EDS.3\">Asma e DPOC são <b>síndromes obstrutivas</b>: o problema é o fluxo de ar que sai, sobretudo na expiração</mark>.</p>\n<table class=\"cmp\"><tr><th></th><th>Asma</th><th>DPOC</th></tr>\n<tr><td>Definição</td><td><mark class=\"f5\" data-refs=\"S77.18,S80.13,S81.19,S82.14,EDS.6\">Doença inflamatória crônica das vias aéreas, com <b>exacerbações agudas</b> (broncoespasmo e inflamação)</mark></td><td>Obstrução crônica, progressiva, pouco reversível; ligada ao tabagismo</td></tr>\n<tr><td>Instalação</td><td><mark class=\"f5\" data-refs=\"S77.18,S80.13,S81.19,S82.14,EDS.6\">Crises <b>súbitas</b>; o paciente procura atendimento na crise, sem tempo de se adaptar</mark></td><td><mark class=\"f5\" data-refs=\"S77.18,S80.13,S81.19,S78.5,S79.21,S81.31,S82.14,EDS.6\"><b>Lenta</b>, por anos; o paciente se adapta e subvaloriza os sintomas</mark></td></tr>\n<tr><td>Sintomas</td><td><mark class=\"f5\" data-refs=\"S77.18,S80.13,S81.19,S82.14,EDS.6\">Tosse crônica, pior à noite e de madrugada; dispneia aguda e \"chieira\" na crise</mark></td><td><mark class=\"f5\" data-refs=\"S78.5,S79.21,S81.31,S77.17,S79.28,S80.25,S82.2,EDS.5\">Tosse diária produtiva, dispneia crônica progressiva</mark></td></tr>\n<tr><td>Exame</td><td>Sibilos, expiração prolongada, hipersonoridade; na crise grave, pulso paradoxal e \"silêncio respiratório\"</td><td>Tórax em tonel, MV diminuído, hipersonoridade, cianose</td></tr>\n<tr><td>Acompanhamento</td><td><mark class=\"f3\" data-refs=\"S77.15,S78.26,S82.4\"><b>Pico de fluxo</b> (peak flow): subir para perto do previsto = melhora objetiva da obstrução</mark></td><td>Espirometria</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Assertiva errada da asma: \"instalação e progressão lenta, permitindo a adaptação e a procura tardia ao médico\". Isso é a <b>DPOC</b>. Na asma, a crise é súbita e o paciente procura atendimento logo.</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Asma grave: pulso paradoxal acima de 15% e <b>silêncio respiratório</b> (tórax que não sibila porque quase não entra ar) são sinais de gravidade, não de melhora.</p></div>\n<h3>Os dois fenótipos clássicos da DPOC</h3>\n<table class=\"cmp\"><tr><th></th><th><mark class=\"f5\" data-refs=\"S77.17,S79.28,S80.25,S78.5,S79.21,S81.31,S82.2,EDS.5\">Congesto azulado (<i>blue bloater</i>)</mark></th><th>Soprador rosado (<i>pink puffer</i>)</th></tr>\n<tr><td>Predomínio</td><td>Bronquite crônica</td><td>Enfisema</td></tr>\n<tr><td>Aspecto</td><td><mark class=\"f5\" data-refs=\"S77.17,S79.28,S80.25,S82.2,EDS.5\">Cianótico, edemaciado (cor pulmonale), geralmente com sobrepeso</mark></td><td>Magro, rosado, tórax em tonel</td></tr>\n<tr><td>Tosse</td><td><mark class=\"f5\" data-refs=\"S77.17,S79.28,S80.25,S78.5,S79.21,S81.31,S82.2,EDS.5\"><b>Produtiva, volumosa</b>, diária</mark></td><td>Pouca tosse</td></tr>\n<tr><td>Respiração</td><td>Pouco esforço aparente</td><td>Lábios semicerrados, uso de musculatura acessória</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Tórax em tonel + tosse produtiva volumosa diária + cianose facial + dispneia crônica progressiva: síndrome <b>obstrutiva</b>, fenótipo <b>congesto azulado</b>. O tonel confunde, mas a tosse volumosa e a cianose decidem.</p></div>","qs":{"p":[{"enun":"Tabagista de 66 anos, magro, tórax em tonel, pouca tosse, respira com os lábios semicerrados e está rosado.","cmd":"Qual fenótipo?","alts":["Congesto azulado","Restritivo","Asma grave","Soprador rosado"],"gab":3,"com":["Teria tosse produtiva e cianose.","A DPOC é obstrutiva.","A história é de DPOC.","Correta. Predomínio de enfisema."],"imgs":[]},{"enun":"Asmática em crise grave: pouca entrada de ar e quase nenhum sibilo na ausculta.","cmd":"Como interpretar?","alts":["Asma controlada após a broncodilatação","Melhora da crise com menor obstrução","Silêncio respiratório: sinal de gravidade","Pneumotórax obrigatoriamente associado"],"gab":2,"com":["Não.","Quase não entra ar.","Correta.","Pode ocorrer, mas não é obrigatório."],"imgs":[]},{"enun":"Como a asma é classificada no diagnóstico sindrômico?","cmd":"Assinale a alternativa correta.","alts":["Obstrutiva","Restritiva","Parenquimatosa","Pleural"],"gab":0,"com":["Correta.","Fibroses, deformidades.","Pneumonias.","Derrame, pneumotórax."],"imgs":[]}]},"pv":["S81.19","S80.25","S81.31","S78.26","S81.16"]}],"quiz":[{"enun":"Kussmaul ocorre em:","cmd":"Assinale a alternativa correta.","alts":["Acidose metabólica","IC grave descompensada","Alcalose respiratória","Crise de ansiedade"],"gab":0,"com":["Correta.","Cheyne-Stokes.","Não.","Suspirosa."],"imgs":["q-ritmos"]},{"enun":"FTV aumentado:","cmd":"Assinale a alternativa correta.","alts":["Derrame","Pneumotórax","Consolidação","Enfisema"],"gab":2,"com":["Diminui.","Diminui.","Correta.","Diminui."],"imgs":[]},{"enun":"Percussão timpânica no tórax:","cmd":"Assinale a alternativa correta.","alts":["Pneumotórax","Derrame","Consolidação","Normal"],"gab":0,"com":["Correta.","Submaciça.","Submaciça.","Claro pulmonar."],"imgs":[]},{"enun":"Som de percussão normal sobre o pulmão:","cmd":"Assinale a alternativa correta.","alts":["Murmúrio vesicular","Maciço","Timpânico","Claro pulmonar"],"gab":3,"com":["É de ausculta.","Fígado.","Espaço de Traube.","Correta."],"imgs":[]},{"enun":"Som normal na região interescapular:","cmd":"Assinale a alternativa correta.","alts":["Sopro tubário","Sibilo","Estertor crepitante","Broncovesicular"],"gab":3,"com":["Patológico fora da traqueia.","Patológico.","Patológico.","Correta."],"imgs":[]},{"enun":"Egofonia ocorre:","cmd":"Assinale a alternativa correta.","alts":["Na ausculta da traqueia normal","No pneumotórax volumoso","No limite superior do derrame","Na asma em crise com sibilos"],"gab":2,"com":["Não.","Não.","Correta.","Não."],"imgs":[]},{"enun":"Asma: a crise é:","cmd":"Assinale a alternativa correta.","alts":["Lenta, por anos","Sem sibilos","Súbita","Sempre assintomática"],"gab":2,"com":["DPOC.","Tem sibilos.","Correta.","Não."],"imgs":[]},{"enun":"Congesto azulado tem:","cmd":"Assinale a alternativa correta.","alts":["Lábios semicerrados e magreza","Tosse produtiva volumosa e cianose","Estridor","Pouca tosse e pele rosada"],"gab":1,"com":["Soprador rosado.","Correta.","Não.","Soprador rosado."],"imgs":[]},{"enun":"Derrame pleural: FTV:","cmd":"Assinale a alternativa correta.","alts":["Diminuído","Normal","Sempre assimétrico para mais","Aumentado"],"gab":0,"com":["Correta.","Não.","Não.","Consolidação."],"imgs":[]},{"enun":"Estertores finos:","cmd":"Assinale a alternativa correta.","alts":["Inspiratórios altos, de origem laríngea","Contínuos e agudos, como sibilos","Fim da inspiração, sem mudar com tosse","Mudam com a tosse, por secreção"],"gab":2,"com":["Estridor.","Sibilos.","Correta.","Grossos."],"imgs":[]}],"widgets":[{"id":"sind","titulo":"Monte a síndrome","desc":"Classifique o achado na síndrome.","cats":[["der","Derrame pleural"],["pnx","Pneumotórax"],["con","Consolidação"]],"cards":[["Percussão timpânica","pnx"],["FTV aumentado","con"],["Egofonia no limite superior","der"],["Sopro tubário","con"],["Percussão submaciça e FTV diminuído","der"],["Estertores finos","con"],["Traqueia desviada para o lado oposto (hipertensivo)","pnx"],["Isolante acústico líquido","der"]]},{"id":"dpoc","titulo":"Asma, congesto azulado ou soprador rosado?","desc":"Classifique cada pista.","cats":[["as","Asma"],["ca","Congesto azulado"],["sr","Soprador rosado"]],"cards":[["Crise súbita com chiado","as"],["Tosse produtiva volumosa diária","ca"],["Lábios semicerrados, magro","sr"],["Cianose e edema","ca"],["Tosse pior de madrugada","as"],["Tórax em tonel, pouca tosse, rosado","sr"],["Peak flow para acompanhar a crise","as"],["Bronquite crônica","ca"]]}],"gl":[["Tórax em tonel","AP = LL; enfisema.",1],["Cheyne-Stokes","Ondas crescentes e decrescentes com apneia.",1],["Kussmaul","Profunda e regular; acidose metabólica.",1],["FTV","Vibração da voz (\"trinta e três\") na parede.",2],["Claro pulmonar","Som de percussão normal do pulmão.",3],["Broncovesicular","Som normal na região esternal superior e interescapular.",4],["Estertores finos","Fim da inspiração; líquido alveolar.",4],["Egofonia","Voz \"de cabra\" no limite superior do derrame.",4],["Isolante acústico","Líquido ou ar pleural reduz FTV e sons.",5],["Congesto azulado","DPOC com bronquite, tosse volumosa, cianose.",6]],"vf":[["No pneumotórax a percussão é submaciça.",false,"É timpânica."],["No derrame, FTV e sons diminuem.",true,"Isolante acústico."],["Na consolidação o FTV aumenta.",true,"Parênquima simpático."],["O murmúrio vesicular é som de percussão.",false,"É de ausculta."],["A asma tem instalação lenta e adaptação do paciente.",false,"Isso é a DPOC."],["Silêncio respiratório na asma é sinal de gravidade.",true,"Quase não entra ar."]],"check":["Reconhecer tipos de tórax e ritmos respiratórios","Pesquisar expansibilidade e FTV","Separar sons de percussão e de ausculta","Montar o exame do derrame, do pneumotórax e da consolidação","Diferenciar asma de DPOC e os dois fenótipos"],"resumo":[["Segmento 1","Tonel (enfisema), pectus. FR 12–20. Cheyne-Stokes (IC), Biot (tronco), Kussmaul (acidose)."],["Segmento 2","Pleura antipática (FTV ↓), parênquima simpático (FTV ↑)."],["Segmento 3","Claro pulmonar normal; timpânico no pneumotórax; maciço no fígado e no derrame volumoso; hipersonoro no enfisema."],["Segmento 4","Broncovesicular normal na região esternal e interescapular. Finos (líquido alveolar), sibilos (estreitamento), estridor (alto)."],["Segmento 5","Derrame: tudo ↓ e percussão submaciça. Pneumotórax: tudo ↓ e percussão timpânica."],["Segmento 6","Asma e DPOC obstrutivas. Asma: crise súbita, noturna, peak flow. DPOC: lenta. Congesto azulado × soprador rosado."]],"freq":[["Pneumotórax: FTV diminuído, percussão timpânica, ausculta abolida",6,"S77.11, S78.19, S79.8, S80.16, S81.15, EDS.1"],["Broncovesicular é som de ausculta; claro pulmonar é de percussão",6,"S78.24, S79.3, S80.20, S81.14, S82.10, EDS.4"],["Derrame pleural: expansibilidade, FTV e sons reduzidos, percussão submaciça",6,"S78.13, S79.1, S80.21, S81.18, S82.28, EDS.2"],["Asma: agudização súbita, tosse noturna e chiado",5,"S77.18, S80.13, S81.19, S82.14, EDS.6"],["Congesto azulado: tosse produtiva crônica e cianose",5,"S77.17, S79.28, S80.25, S82.2, EDS.5"],["DPOC: obstrutiva; congesto azulado × soprador rosa",3,"S78.5, S79.21, S81.31"],["Asma é obstrutiva; o peak flow mede a melhora",3,"S77.15, S78.26, S82.4"],["Claro pulmonar: som de percussão",1,"S79.26"],["Derrame pleural: submacicez, FTV e sons diminuídos, expansibilidade reduzida",1,"S77.16"],["Diagnóstico sindrômico: a asma é obstrutiva",3,"S81.16, S82.29, EDS.3"],["Hipocôndrio direito: som maciço (fígado)",1,"S80.19"]],"cob":{"rk":{"t":"Síndrome pleural × parenquimatosa","c":["Síndrome","FTV","Percussão","Ausculta"],"d":["<b>Síndrome</b>: o que há entre o pulmão e a parede, ou dentro do pulmão.","<b>FTV</b>: pleura isola (↓); consolidação transmite (↑).","<b>Percussão</b>: líquido submaciço, ar timpânico.","<b>Ausculta</b>: isolante ↓; consolidação com estertores e sopro tubário."],"x":[["Derrame pleural","↓","submaciça","MV ↓, egofonia"],["Pneumotórax","↓","timpânica","MV ↓ ou abolido"],["Consolidação","↑","submaciça","estertores finos, sopro tubário"]],"ex":"No derrame, as quatro assertivas (expansibilidade ↓, FTV ↓, submaciça, sons ↓) estavam todas certas.","b":"Asma = obstrutiva, crise súbita; a \"instalação lenta com adaptação\" é da DPOC."},"figs":[["percussao","Técnica da percussão.","s3"],["sons-normais","Onde cada som normal é ouvido.","s4"],["egofonia","Egofonia no derrame.","s4"],["torax-tipos","Tipos de tórax.","s1"]],"keys":["C10","C33","C27","C17","C16","C22","C14","C46","C15","C59","C52"]}}],"aw":{"a1":8,"a2":6,"a3":17,"a4":2,"a5":8,"a6":25,"a7":10,"a8":12,"a9":11,"a10":7,"a11":8,"a12":28},"fora":["S79:2","S80:7","S81:11","S82:26"],"levels":[["Calouro",0],["Anamnesista",150],["Ectoscopista",400],["Palpador",800],["Percussionista",1300],["Auscultador",2000],["Semiologista",2800],["Interno de clínica",3800],["Residente",5000],["Professor",6500]],"temas":[["a1","Aula 1 · Anamnese I"],["a2","Aula 2 · Anamnese II"],["a3","Aula 3 · Exame físico geral"],["a4","Aula 4 · Semiologia da dor"],["a5","Aula 5 · Exame cardiovascular I"],["a6","Aula 6 · Bulhas: desdobramentos, B3 e B4"],["a7","Aula 7 · Sopros e pericárdio"],["a8","Aula 8 · Ritmos, pulsos e pressão arterial"],["a9","Aula 9 · Dor torácica"],["a10","Aula 10 · Síncope"],["a11","Aula 11 · Sinais e sintomas respiratórios"],["a12","Aula 12 · Exame do aparelho respiratório"]],"prova":{"list":[{"id":"S77.1","jid":"S77:1","prova":77,"item":1,"key":"C0","tema":"a5","seg":"s1","mod":"prova","enun":"Paciente de 52 anos, com hipertensão pulmonar e hipertrofia ventricular direita (HVD) confirmada no ecocardiograma, é examinado na enfermaria. O professor pede que o aluno descreva o que espera encontrar na inspeção e na palpação do precórdio.","cmd":"Assinale a alternativa com os achados esperados nesse paciente.","alts":["Ictus propulsivo, desviado para baixo e para fora, ocupando três polpas digitais","Ictus no 5º EIC sobre a linha hemiclavicular, sem nenhuma outra pulsação visível","Retração sistólica apical, levantamento em massa do precórdio e pulsações epigástricas","Frêmito diastólico no foco mitral e ictus em cúpula, palpado em decúbito lateral"],"gab":2,"com":["Ictus propulsivo e desviado para baixo e para fora é sinal de hipertrofia/dilatação do VE, e não do VD.","É o ictus normal do normolíneo; na HVD a ponta passa a ser formada pelo VD e o achado muda.","<b>Justificativa oficial:</b> O ictus é definido como o choque da ponta cardíaca. A musculatura do ventrículo esquerdo é a principal (muitas vezes a única) responsável pelo ictus. Em casos de HVD, espera-se maior contribuição (ou contribuição exclusiva da musculatura do VD) na composição da ponta do coração, levando a um movimento de retração apical sistólica - diferente ou paradoxal à propulsão do ictus. A HVD, pela maior relação do VD com a parede anterior do tórax, pode levar ao levantamento em massa do precórdio. Embora não exclusivas de HVD, as pulsações epigástricas podem ser encontradas em casos de HVD.","Frêmito diastólico no foco mitral é da estenose mitral; não é o que a HVD produz."],"imgs":[],"ed":0,"rec":1},{"id":"S77.2","jid":"S77:2","prova":77,"item":2,"key":"C1","tema":"a6","seg":"s1","mod":"prova","enun":"Homem de 58 anos faz eletrocardiograma pré-operatório que mostra bloqueio completo de ramo dire
