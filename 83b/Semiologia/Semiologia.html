é hábito de vida."],["Vacinação em dia é registrada na HPP.",true,"Status vacinal é antecedente pessoal."],["Sintoma presente na RS deve ser caracterizado com seus atributos.",true,"Vale a técnica mista."],["Melena indica sangramento digestivo baixo.",false,"Indica sangramento alto (sangue digerido)."],["20 cigarros industrializados correspondem a 1 maço.",true,"Base do cálculo de anos-maço."]],"check":["Dizer para que serve a RS e o que não vai nela","Seguir a ordem: sintomas gerais e crânio-caudal","Diferenciar disfagia × odinofagia, melena × enterorragia, dispepsia × pirose","Listar o que entra na HPP (inclusive o que não é doença)","Distribuir informações entre HPP, HV, HF, RS, HMA e Id","Calcular anos-maço (industrializado e de palha)"],"resumo":[["Segmento 1","RS = revisão de sintomas por aparelho, começando pelos gerais e seguindo crânio-caudal. Sintoma presente é caracterizado. Negativos por extenso, sem NDN."],["Segmento 2","Disfagia × odinofagia; melena × enterorragia; dispepsia × pirose; menorragia × menometrorragia × dismenorreia."],["Segmento 3","HPP: doenças prévias (mesmo controladas), internações, cirurgias, alergias, traumas, transfusões, GPA, vacinas, medicamentos. Tabagismo é HV."],["Segmento 4","HF: doenças dos familiares. HV: alimentação, atividade física, tabaco, álcool, drogas. Anos-maço = maços/dia × anos."]],"freq":[["HPP registra informação de interesse médico mesmo sem doença",4,"S77.14, S78.21, S79.7, S80.6"],["Anamnese especial (RS) na cefaleia: o que entra na revisão de sistemas",2,"P82.4, P80.21"],["Carga tabágica com cigarro de palha (1 palha = 5 cigarros)",2,"P82.14, P81.4"],["Em que campo registrar: HPP, HV, HF e RS",2,"P82.5, P80.15"],["HPP registra doenças, cirurgias, alergias e internações, mesmo controladas",2,"P82.18, P81.20"],["Revisão de sistemas: sintomas gerais e de cada aparelho, mesmo sem ligação com a QP",2,"P82.16, P81.5"],["RS = sintomas; QP curta; urgência não dispensa a anamnese; HF",2,"S80.9, S81.28"],["Vertigem com zumbido: o que vai na RS e o que vai na HMA",2,"P82.17, P81.16"],["Carga tabágica: 20 cigarros por dia há 15 anos = 15 anos-maço",1,"P81.18"],["HF, HPP, HMA e identificação: cada informação no seu campo",1,"P80.22"],["Plenitude auricular: o que poderia compor a anamnese especial",1,"P80.17"],["Revisão sintomatológica: crânio-caudal, por aparelhos, sintomas gerais antes",1,"P80.20"],["Vacinas, alergias e internações vão na HPP; tabagismo vai nos hábitos",1,"P80.3"]],"cob":{"rk":{"t":"Em que campo registrar","c":["Informação","É sintoma do paciente?","É doença ou dado de saúde prévio?","É hábito ou é de um familiar?"],"d":["<b>Informação</b>: um dado colhido na entrevista.","<b>É sintoma?</b> Se é a queixa atual, vai na HMA; se é de outro aparelho ou negado, vai na RS.","<b>É dado prévio de saúde?</b> Doença, cirurgia, alergia, internação, vacina, GPA: HPP.","<b>Hábito ou familiar?</b> Tabaco, álcool, atividade física: HV. Doença de pai, mãe, irmão: HF."],"x":[["\"Nega tosse e dispneia\"","sim, negado","—","RS"],["\"Vacinação em dia\"","não","sim","HPP"],["\"Tabagista ativo\"","não","não","HV"],["\"Pai morreu de IAM aos 54\"","não","não","HF"]],"ex":"Tabagismo é HV, nunca HPP. Vacinas e alergias são HPP. Sintoma negado é RS.","b":"Anos-maço = (cigarros/dia ÷ 20) × anos. Cigarro de palha vale mais de um industrializado."},"figs":[],"keys":["C13","p:aereg","p:palha","p:topicos","p:hpp","p:rs","C49","p:vertigem","p:tabaco20","p:topicos3","p:ouvido","p:rsass","p:topicos2"]}},{"id":"a3","num":3,"nome":"Exame físico geral","tema":"Dados vitais, estado geral, consciência, fala, biotipo, nutrição, fácies, atitude, pele e fâneros","segs":[{"id":"s1","titulo":"Dados vitais, estado geral, consciência e fala","html":"\n<p class=\"lead\">\"A medicina de excelência só é possível se o exame clínico for excelente.\" O exame físico começa pelos dados vitais e pelo exame físico geral, também chamado <b>ectoscopia</b> ou somatoscopia, antes do exame de cada aparelho.</p>\n<h3>Estrutura do exame físico</h3>\n<ol class=\"steps\"><li><b>Dados vitais</b>: PA, FC/FP, FR, temperatura.</li><li><b>Exame físico geral</b> (ectoscopia ou somatoscopia).</li><li><b>Exame por sistemas e aparelhos</b> (em Semiologia I: aparelho respiratório e cardiovascular).</li></ol>\n<p>A ectoscopia ajuda a avaliar a doença de base e sua repercussão sistêmica, levanta achados que contribuem para a hipótese, acompanha a evolução, encontra achados inesperados (às vezes mais importantes que o motivo da consulta) e ajuda a definir a conduta. <mark class=\"f1\" data-refs=\"P81.19\">Todos esses usos da ectoscopia foram cobrados juntos numa parcial, e todas as assertivas estavam corretas</mark>.</p>\n<h3>Dados vitais: valores de referência no adulto em repouso</h3>\n<table class=\"cmp\"><tr><th>Dado</th><th>Normal</th><th>Abaixo</th><th>Acima</th></tr>\n<tr><td>Frequência cardíaca (ausculta, bpm)</td><td><mark class=\"f5\" data-refs=\"S78.28,S79.13,S80.24,S81.6,P82.12\">60 a 100 bpm</mark></td><td>Bradicardia</td><td>Taquicardia</td></tr>\n<tr><td>Frequência de pulso (palpação, ppm)</td><td><mark class=\"f5\" data-refs=\"S78.17,S78.20,S79.27,S81.1,P80.14,S82.27,EDS.11\">60 a 100 ppm</mark></td><td>Bradisfigmia</td><td>Taquisfigmia</td></tr>\n<tr><td>Frequência respiratória</td><td><mark class=\"f3\" data-refs=\"S78.17,S81.5,S82.19\">14/16 a 20 irpm</mark> (eupneico, normopneico)</td><td>Bradipneia</td><td>Taquipneia</td></tr>\n<tr><td>Temperatura axilar</td><td>36 a 37,3 °C (afebril)</td><td>Hipotermia (&lt; 35 °C)</td><td><mark class=\"f3\" data-refs=\"S78.17,S81.5,S82.19\">Febre: acima de 37,8 °C</mark> (37,4 a 37,8 = febrícula, estado subfebril)</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>O nome depende de onde se contou. <b>Contou no coração (ausculta)?</b> Bradi ou taquicardia, em bpm. <b>Contou no pulso (palpação)?</b> Bradi ou taquisfigmia, em ppm. Essa distinção caiu em quase toda prova.</p></div>\n<p>Exemplos que caíram: TAX 37,0 °C, PA 110/60, FP 106 ppm, FR 16 → <mark class=\"f2\" data-refs=\"P82.2,P81.2\">\"taquisfígmico\"</mark>; FC 110 pela ausculta, TAX 38,2 °C, FR 24 → taquicárdico, febril e taquipneico; e um adulto de 35 anos com pulso acelerado contado na palpação → <mark class=\"f2\" data-refs=\"P82.2,P81.2\">\"afebril, taquisfígmico, normopneico\"</mark>.</p>\n<h3>Registro normal da ectoscopia</h3>\n<div class=\"pearl\"><b>Modelo do professor</b><p>\"Paciente em bom estado geral (BEG), lúcido e orientado no tempo e espaço (LOTE), fácies atípica, normolíneo, boa postura, ativo, desenvolvimento físico normal, corado, hidratado, anictérico, acianótico, afebril, eupneico, ausência de edemas ou de movimentos involuntários, marcha normal incaracterística.\"</p></div>\n<h3>Estado geral</h3>\n<p>Bom (BEG), regular (REG) ou mau estado geral (MEG): é a impressão global do examinador. <mark class=\"f5\" data-refs=\"S78.11,S79.14,S80.11,P82.7,P80.D1\">Por ser uma observação do médico, \"BEG\" é registrado no exame físico geral (ectoscopia), e não na revisão de sistemas</mark>.</p>\n<h3>Nível de consciência</h3>\n<p>Consciência é a percepção do mundo exterior e de si mesmo. Gradação: <b>lúcido e orientado no tempo e espaço (LOTE)</b> → letárgico/sonolento (dorme se não estimulado) → obnubilado, confuso, desorientado → torporoso (só abre os olhos ao estímulo) → coma (superficial ou profundo). No paciente consciente, a cognição se avalia com o <b>Mini-Mental</b>; no inconsciente, com a <b>escala de Glasgow</b>.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"consciencia\" alt=\"\"><figcaption>Níveis de consciência, do paciente lúcido ao coma. A escala de Glasgow (abertura ocular, resposta verbal e motora) quantifica o rebaixamento.</figcaption></figure>\n<h3>Fala e linguagem</h3>\n<table class=\"cmp\"><tr><th>Termo</th><th>O que é</th><th>Exemplo</th></tr>\n<tr><td>Afonia</td><td>Ausência de voz</td><td>Laringite intensa</td></tr>\n<tr><td>Disfonia</td><td>Alteração da qualidade vocal (rouca, fanhosa, bitonal)</td><td>Nódulo de prega vocal</td></tr>\n<tr><td><b>Dislalia</b></td><td>Troca de fonemas (de letras). Inclui disritmolalia: gagueira e taquilalia</td><td>\"Cebolinha\": \"o lato loeu a loupa\"</td></tr>\n<tr><td><b>Disartria</b></td><td><mark class=\"f1\" data-refs=\"P82.D2\">Distúrbio motor da fala: alteração dos músculos da fala ou da coordenação, por lesão neurológica</mark>. Voz arrastada, baixa, monótona e lenta</td><td>AVE, Parkinson</td></tr>\n<tr><td>Disfasia</td><td>Alteração da <b>linguagem</b> por lesão cortical: compreensão, expressão ou mista</td><td>AVE, TCE</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Vai cobrar a diferença dos dois\": <b>dislalia × disartria</b>. Dislalia é trocar letras (o Cebolinha); disartria é o defeito motor de articular a fala, com a compreensão e a formulação da linguagem preservadas.</p></div>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"fala\" alt=\"\"><figcaption>Distúrbios da fala e da linguagem: disfonia e afonia (voz), dislalia (fonemas), disartria (motora) e disfasia (linguagem).</figcaption></figure>","qs":{"p":[{"enun":"Paciente de 40 anos, ao exame: FP 54 ppm (palpação do pulso radial), FR 22 irpm, TAX 37,6 °C.","cmd":"Assinale a descrição correta.","alts":["Bradicárdico, taquipneico e febril","Bradisfígmico, taquipneico e subfebril","Bradisfígmico, eupneico e febril","Bradicárdico, eupneico e afebril"],"gab":1,"com":["Bradicardia exige contagem na ausculta, e 37,6 °C ainda não é febre.","Correta. Pulso < 60 é bradisfigmia; FR > 20 é taquipneia; 37,6 °C é febrícula (subfebril), febre é > 37,8 °C.","FR 22 é taquipneia, e 37,6 °C não é febre.","Pulso não se chama bradicardia, e FR 22 não é eupneia."],"imgs":[]},{"enun":"Após um AVC, paciente compreende tudo o que lhe é dito e sabe o que quer responder, mas fala de forma arrastada, lenta e pouco articulada.","cmd":"Qual o termo técnico?","alts":["Disfasia","Disartria","Disfonia","Dislalia"],"gab":1,"com":["Disfasia afeta a compreensão ou a formulação da linguagem, preservadas aqui.","Correta. Defeito motor da articulação, com linguagem preservada.","Disfonia é alteração da qualidade da voz.","Dislalia é troca de fonemas, sem lesão motora."],"imgs":[]},{"enun":"Paciente de 75 anos dorme o tempo todo quando não é estimulado, mas acorda ao ser chamado e responde de forma adequada.","cmd":"Como classificar o nível de consciência?","alts":["Em coma superficial","Obnubilado e confuso","Torporoso","Letárgico (sonolento)"],"gab":3,"com":["Em coma não desperta ao chamado.","Obnubilado responde de forma confusa e desorientada.","Torporoso só abre os olhos ao estímulo, sem responder bem.","Correta. Dorme quando não requisitado, desperta ao chamado."],"imgs":[]}]},"pv":["S80.11","P82.2","P82.7","S78.17","P81.19","S81.5","P82.D2","P80.D1"]},{"id":"s2","titulo":"Biotipos, peso, IMC e estado nutricional","html":"\n<p class=\"lead\">O biotipo (tipo morfológico) muda a posição normal das estruturas internas e a leitura dos exames. É assunto de questão quase toda prova.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"biotipos\" alt=\"\"><figcaption>Brevilíneo (baixo, tórax largo, ângulo de Charpy obtuso), normolíneo (mediolíneo) e longilíneo (alto, tórax estreito e alongado, ângulo de Charpy agudo).</figcaption></figure>\n<table class=\"cmp\"><tr><th></th><th>Brevilíneo</th><th>Normolíneo</th><th>Longilíneo</th></tr>\n<tr><td>Corpo</td><td>Baixo, pescoço curto, tórax largo</td><td>Intermediário</td><td>Alto, pescoço longo, tórax estreito</td></tr>\n<tr><td>Ângulo de Charpy</td><td>Obtuso (&gt; 90°)</td><td>~90°</td><td>Agudo (&lt; 90°)</td></tr>\n<tr><td>Coração</td><td>Horizontalizado</td><td>Oblíquo</td><td>Verticalizado (\"em gota\")</td></tr>\n<tr><td>Ictus cordis</td><td><mark class=\"f5\" data-refs=\"S77.7,S78.9,S79.5,S81.27,S77.13,S80.27,S81.9,S82.6,S82.9\">4º EIC, ~2 cm por fora da LHC</mark></td><td>5º EIC, na LHC</td><td>6º EIC, ~2 cm por dentro da LHC</td></tr></table>\n<p>O que caiu (três parciais e uma somativa, sempre com \"todas corretas\"): <mark class=\"f5\" data-refs=\"S77.13,S80.27,S81.9,P82.6,P81.13,P80.1,S82.9\">o ictus varia de posição nos biotipos sem significar doença; jovens longilíneos do sexo masculino têm maior incidência de pneumotórax espontâneo; e conhecer o biotipo melhora a interpretação de exames de imagem, como a radiografia de tórax</mark>.</p>\n<h3>Avaliação do estado nutricional na ectoscopia</h3>\n<ul><li>Estado geral, peso, estatura, panículo adiposo, IMC.</li><li>Desenvolvimento físico.</li><li>Pele, pelos e olhos: turgor, textura, brilho.</li><li>Musculatura: eutrófica, hipotrófica (sarcopenia) ou hipertrófica.</li><li>Desnutrição: sarcopenia, redução do panículo, alteração de textura de pele e cabelos, olhos fundos, proeminência de relevos ósseos.</li></ul>\n<p><mark class=\"f5\" data-refs=\"S79.20,S81.8,P82.1,P81.3,P80.13,S82.8\">São parâmetros nutricionais da ectoscopia: proeminência de relevos ósseos, alterações de cor, brilho e textura de pele e fâneros, e sarcopenia</mark>.</p>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>A pegadinha que caiu quatro vezes: \"variação de 5 kg em menos de 24 h, obtida pela pesagem\". Está <b>errada</b> por dois motivos: perder ou ganhar 5 kg em horas é <b>mobilização de líquido</b> (desidratação, edema, diurese), e não mudança nutricional; e pesar o paciente não é estritamente ectoscopia (inspeção).</p></div>\n<h3>IMC = peso (kg) ÷ altura² (m)</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"imc\" alt=\"\"><figcaption>Classificação do IMC no adulto.</figcaption></figure>\n<table class=\"cmp\"><tr><th>IMC</th><th>Classificação</th></tr>\n<tr><td>&lt; 16</td><td>Desnutrição grave</td></tr><tr><td>16 a 16,99</td><td>Desnutrição moderada</td></tr><tr><td>17 a 18,49</td><td>Desnutrição leve</td></tr>\n<tr><td>18,5 a 24,99</td><td>Eutrófico</td></tr><tr><td>25 a 29,99</td><td>Sobrepeso</td></tr><tr><td>30 a 34,99</td><td>Obesidade grau I</td></tr>\n<tr><td>35 a 39,99</td><td>Obesidade grau II</td></tr><tr><td>≥ 40</td><td>Obesidade grau III</td></tr></table>\n<p>Atenção: massa muscular, desidratação e edema distorcem o IMC. O risco cardiovascular se relaciona mais à <b>obesidade central</b> (circunferência abdominal, relação cintura/quadril).</p>\n<h3>Hidratação</h3>\n<p>Avalia-se pelo estado geral, alteração abrupta do peso, umidade das mucosas, umidade, elasticidade e turgor da pele (sinal da prega), fontanelas (em crianças) e olhos.</p>\n<table class=\"cmp\"><tr><th>Grau</th><th>Achados</th></tr>\n<tr><td>Normal</td><td>Alerta, olhos normais, sem sinal da prega</td></tr>\n<tr><td>Leve</td><td>Alerta, olhos normais, sem prega, mucosas pouco ressecadas</td></tr>\n<tr><td>Moderada</td><td>Irritado, olhos secos, prega discreta, boca seca, saliva espessa, diurese reduzida</td></tr>\n<tr><td>Grave</td><td>Prostrado, olhos fundos, prega acentuada, boca muito seca sem saliva, diurese reduzida</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Embora descritas no exame físico geral, hidratação e desidratação também são diagnósticos.</p></div>","qs":{"p":[{"enun":"Paciente de 1,60 m e 77 kg.","cmd":"Qual a classificação pelo IMC?","alts":["Sobrepeso","Obesidade grau I","Obesidade grau II","Eutrófico"],"gab":1,"com":["Sobrepeso vai até 29,99.","Correta. 77 ÷ 2,56 ≈ 30,1.","Grau II começa em 35.","Eutrófico vai até 24,99."],"imgs":[]},{"enun":"Na ectoscopia de uma idosa internada há 20 dias, o estudante descreve: relevos ósseos proeminentes, pele fina e sem brilho, cabelos quebradiços e redução da massa muscular.","cmd":"O que esses achados indicam?","alts":["Edema por hipoalbuminemia","Desnutrição, avaliada pela ectoscopia","Desidratação aguda grave","Biotipo longilíneo normal da idade"],"gab":1,"com":["Edema aumentaria o volume, não deixaria os relevos ósseos proeminentes.","Correta. São os parâmetros nutricionais que a prova cobra.","Desidratação dá mucosas secas, prega, olhos fundos e variação rápida de peso.","Biotipo não explica perda de massa e alteração de fâneros."],"imgs":[]},{"enun":"Jovem de 19 anos, alto e magro, com tórax estreito, tem dor torácica súbita e dispneia após tossir.","cmd":"Qual hipótese ganha força pelo biotipo?","alts":["Derrame pleural volumoso","Pneumonia lobar","Pneumotórax espontâneo","Embolia pulmonar"],"gab":2,"com":["O derrame não tem relação com o biotipo e costuma ter instalação lenta.","A pneumonia cursa com febre e tosse produtiva.","Correta. Jovens longilíneos do sexo masculino têm maior incidência.","A embolia se liga a fatores trombóticos, não ao biotipo."],"imgs":["biotipos"]}]},"pv":["S81.9","P82.6","P82.1","S81.8"]},{"id":"s3","titulo":"Fácies","html":"\n<p class=\"lead\">Fácies é o conjunto de dados exibidos na face: traços anatômicos mais a expressão fisionômica (olhar, posição da boca). O professor avisou: <b>fácies vai cair</b>. E caiu em todas as parciais.</p>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Não se assuste com o grande número de doenças. Preocupe-se, nesse momento, com a construção de um bom exame clínico.\"</p></div>\n<h3>Fácies atípica (normal)</h3>\n<p><mark class=\"f5\" data-refs=\"S79.9,S81.21,P82.19,P80.18,S82.24\">Fácies normal, sem traços de nenhuma síndrome, é chamada <b>fácies atípica</b> ou, como preferem alguns autores, <b>incaracterística</b></mark>. O termo \"atípica\" pode confundir com atipias celulares, daí a sinonímia. A expressão pode mostrar dor, tristeza, ansiedade, medo ou apreensão sem que a fácies deixe de ser atípica.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-atipica-hipocratica\" alt=\"\"><figcaption>Fácies atípica (normal) e fácies hipocrática: palidez, rosto afilado, olhos fundos, parados e inexpressivos, nas doenças graves e terminais e na desnutrição grave.</figcaption></figure>\n<h3>As fácies da aula</h3>\n<table class=\"cmp\"><tr><th>Fácies</th><th>Achados</th><th>Condição</th></tr>\n<tr><td>Hipocrática</td><td>Palidez, rosto afilado, olhos fundos, parados e inexpressivos</td><td>Doenças graves, terminais, desnutrição</td></tr>\n<tr><td>Renal</td><td>Edema periorbitário, acentuado pela manhã; palidez cutâneo-mucosa</td><td>Doenças renais difusas (síndrome nefrótica, glomerulonefrite)</td></tr>\n<tr><td><mark class=\"f2\" data-refs=\"P82.20,P81.10\">Hipertireoidea</mark></td><td>Exoftalmia, olhos brilhantes, rosto magro, expressão de espanto e ansiedade</td><td>Doença de Basedow-Graves</td></tr>\n<tr><td>Mixedematosa</td><td>Rosto arredondado, nariz e lábios grossos, pele seca e espessada, pálpebras infiltradas, supercílios escassos</td><td>Hipotireoidismo</td></tr>\n<tr><td>Acromegálica</td><td>Maçãs do rosto, mandíbula, nariz, lábios e orelhas aumentados; mãos e dedos grossos</td><td>Acromegalia (excesso de GH)</td></tr>\n<tr><td><mark class=\"f4\" data-refs=\"S81.22,P82.13,P81.1,S82.16\">Cushingoide (lua cheia)</mark></td><td>Rosto arredondado, atenuação dos traços, rubor, acne, hirsutismo</td><td>Síndrome de Cushing (adrenal, hipófise) ou corticoide exógeno prolongado</td></tr>\n<tr><td><mark class=\"f1\" data-refs=\"P80.4\">Adenoidiana</mark></td><td>Rosto alongado e magro, boca entreaberta, nariz pequeno, maxila estreita, palato ogival, protrusão e apinhamento dentário</td><td>Hipertrofia de adenoide (respirador oral)</td></tr>\n<tr><td><mark class=\"f4\" data-refs=\"P81.9,P80.19,ED.D7,P82.D1\">Sífilis congênita (luética)</mark></td><td>Fronte olímpica, nariz em sela, mandíbula prognata, dentes de Hutchinson, molares em amora</td><td>Sífilis congênita</td></tr>\n<tr><td>Parkinsoniana</td><td>Olhar fixo, cabeça inclinada para frente e imóvel, fisionomia impassível (em máscara), supercílios elevados, fronte enrugada</td><td>Doença de Parkinson</td></tr>\n<tr><td>Miastênica</td><td>Ptose palpebral bilateral, testa franzida para tentar abrir os olhos</td><td>Miastenia gravis e outras neuromiopatias</td></tr>\n<tr><td>Assimétrica</td><td>Desvio da comissura e assimetria</td><td>Paralisia facial central ou periférica</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-renal-hipertireoidea\" alt=\"\"><figcaption>Fácies renal (edema periorbitário, palidez) e hipertireoidea (exoftalmia, olhar de espanto, rosto magro).</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-mixedematosa-acromegalica\" alt=\"\"><figcaption>Fácies mixedematosa (face infiltrada, pálpebras edemaciadas, supercílios escassos) e acromegálica (mandíbula, nariz e lábios aumentados).</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-cushingoide-adenoidiana\" alt=\"\"><figcaption>Fácies cushingoide (lua cheia, rubor) e adenoidiana (rosto alongado, boca entreaberta).</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-sifilis-parkinsoniana\" alt=\"\"><figcaption>Sífilis congênita (fronte olímpica, nariz em sela, dentes de Hutchinson) e parkinsoniana (fisionomia em máscara, olhar fixo).</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"facies-miastenica-assimetrica\" alt=\"\"><figcaption>Fácies miastênica (ptose bilateral, fronte franzida) e assimétrica (paralisia facial).</figcaption></figure>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Nas anotações do slide de sífilis: \"dentes em amora; fronte olímpica; nariz em sela; mandíbula projetada para frente\". Essa sequência caiu como discursiva duas vezes (nome da fácies + doença de base).</p></div>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Na discursiva, escreva as duas partes: <b>a) fácies luética (sifilítica, de sífilis congênita); b) sífilis congênita</b>.</p></div>","qs":{"p":[{"enun":"Observe a imagem.","cmd":"Qual o tipo de fácies?","alts":["Fácies renal","Fácies cushingoide","Fácies acromegálica","Fácies mixedematosa"],"gab":3,"com":["A renal tem edema periorbitário com palidez, sem espessamento da pele e dos traços.","A cushingoide tem rubor, acne e hirsutismo.","A acromegálica tem crescimento ósseo de mandíbula e nariz.","Correta. Face infiltrada, pálpebras edemaciadas, pele seca e supercílios escassos: hipotireoidismo."],"imgs":["q-mixedematosa"]},{"enun":"Criança de 8 anos, respiradora oral crônica com roncos noturnos, tem rosto alongado, boca sempre entreaberta, palato ogival e dentes apinhados.","cmd":"Qual a fácies?","alts":["Adenoidiana","Acromegálica","Miastênica","Parkinsoniana"],"gab":0,"com":["Correta. Hipertrofia de adenoide → respiração oral → alterações do crescimento facial.","Acromegálica é do adulto com excesso de GH.","Miastênica é ptose com fronte franzida.","Parkinsoniana é a face em máscara."],"imgs":[]},{"enun":"Observe a imagem do paciente.","cmd":"Qual fácies e qual a condição associada?","alts":["Fácies hipocrática; doença terminal","Fácies parkinsoniana; doença de Parkinson","Fácies assimétrica; paralisia facial","Fácies miastênica; miastenia gravis"],"gab":1,"com":["Na hipocrática há rosto afilado e olhos fundos.","Correta. Fisionomia impassível, olhar fixo, em máscara.","Na assimétrica há desvio de um lado da face.","Na miastênica predomina a ptose palpebral."],"imgs":["q-parkinsoniana"]}]},"pv":["P82.20","P82.13","S81.21","P82.19","P81.9","P80.4","S81.22","ED.D7","P82.D1"]},{"id":"s4","titulo":"Atitude, postura e decúbito","html":"\n<p class=\"lead\">Atitude é a posição que o paciente adota, no leito ou fora dele, por comodidade, hábito ou para aliviar um sintoma, de forma voluntária ou involuntária.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"atitude-postura\" alt=\"\"><figcaption>Atitudes e posturas: cócoras, genupeitoral (prece maometana), ortopneica e opistótono.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Atitude</th><th>Tipo</th><th>Condição clássica</th><th>Por quê</th></tr>\n<tr><td>Ativa</td><td>—</td><td>Normal</td><td>O paciente muda de posição livremente</td></tr>\n<tr><td>Passiva</td><td>—</td><td>Coma, paralisias graves</td><td>Fica na posição em que é colocado</td></tr>\n<tr><td>Antálgica</td><td>Voluntária</td><td>Dor</td><td>Posição que reduz a dor</td></tr>\n<tr><td><b>Cócoras</b></td><td>Voluntária</td><td><mark class=\"f5\" data-refs=\"S78.15,S79.29,S80.23,S81.29,S82.3,EDS.15\">Tetralogia de Fallot: shunt direita-esquerda</mark></td><td>Agachar aumenta a resistência vascular periférica, reduz o desvio de sangue do VD para a aorta e melhora a oxigenação</td></tr>\n<tr><td>Genupeitoral (prece maometana)</td><td>Voluntária</td><td>Derrame pericárdico, pericardite</td><td>O coração se afasta do pericárdio parietal e facilita o enchimento</td></tr>\n<tr><td>Ortopneica</td><td>Voluntária</td><td>Insuficiência cardíaca, asma</td><td>Sentado, reduz o retorno venoso e a congestão pulmonar</td></tr>\n<tr><td>Opistótono</td><td>Involuntária</td><td>Tétano, meningite</td><td>Contratura da musculatura dorsal, corpo em arco</td></tr></table>\n<h3>Decúbitos</h3>\n<table class=\"cmp\"><tr><th>Decúbito</th><th>Condição</th></tr>\n<tr><td>Ventral</td><td>Cólica intestinal</td></tr>\n<tr><td>Lateral, <b>sobre o lado acometido</b></td><td>Dor pleurítica: imobiliza o lado doente e deixa o sadio livre para expandir</td></tr>\n<tr><td>Dorsal com pernas fletidas</td><td>Processos inflamatórios pelviperitoneais</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A questão das cócoras pede o mecanismo: o paciente aumenta a resistência periférica de forma involuntária, o que alivia o <b>shunt direita-esquerda</b>. No shunt esquerda-direita, o aumento da pressão à esquerda pioraria o desvio.</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Na tetralogia de Fallot há estenose da via de saída do VD, CIV, dextroposição da aorta e hipertrofia do VD. Quando a resistência sistêmica sobe (cócoras), passa menos sangue venoso do VD para a aorta pela CIV, e a cianose melhora.</p></div>","qs":{"p":[{"enun":"Criança de 4 anos com cardiopatia congênita cianótica, após brincar, para e se agacha por alguns minutos até a cianose melhorar.","cmd":"Qual o mecanismo do alívio?","alts":["Aumento da resistência vascular periférica, reduzindo o shunt direita-esquerda","Redução da resistência vascular periférica, reduzindo o shunt esquerda-direita","Aumento do retorno venoso, que melhora o enchimento do ventrículo esquerdo","Redução da pressão intratorácica, que melhora a ventilação dos ápices"],"gab":0,"com":["Correta. É o mecanismo pedido na questão da somativa.","O agachamento aumenta, e não reduz, a resistência; e o shunt é direita-esquerda.","O retorno venoso não explica a melhora da cianose.","Não é um efeito ventilatório."],"imgs":[]},{"enun":"Paciente com pericardite e derrame pericárdico refere alívio da dor ao ficar ajoelhado, com o tronco inclinado e o peito apoiado sobre os joelhos.","cmd":"Qual o nome dessa atitude?","alts":["Ortopneica, sentado com as pernas pendentes","Cócoras, com os joelhos fletidos sobre o tronco","Opistótono, com hiperextensão do tronco","Genupeitoral (prece maometana)"],"gab":3,"com":["Ortopneica é sentado, com as pernas pendentes.","Cócoras é agachado, típica do Fallot.","Opistótono é involuntário, o corpo em arco.","Correta."],"imgs":[]},{"enun":"Paciente com pneumonia e dor pleurítica à direita prefere deitar-se:","cmd":"Assinale a alternativa correta.","alts":["Em decúbito lateral direito, sobre o lado acometido","Em decúbito lateral esquerdo, sobre o lado sadio","Em decúbito ventral","Em decúbito dorsal com pernas fletidas"],"gab":0,"com":["Correta. Deitar sobre o lado doente reduz sua mobilidade e a dor.","Deitar sobre o lado sadio deixaria o doente expandir e doer.","Decúbito ventral é da cólica intestinal.","Dorsal com pernas fletidas é dos processos pelviperitoneais."],"imgs":[]}]},"pv":["S81.29"]},{"id":"s5","titulo":"Pele, mucosas, fâneros, edema, circulação colateral, marcha e movimentos","html":"\n<p class=\"lead\">O fim da ectoscopia percorre pele, mucosas, fâneros (cabelos, pelos, unhas), edema, circulação colateral, marcha e movimentos involuntários.</p>\n<h3>Pele</h3>\n<p>Avalie umidade, coloração, temperatura, textura e espessura, turgor e elasticidade, sensibilidade e mobilidade, integridade e lesões elementares.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"pele-achados\" alt=\"\"><figcaption>Achados de pele: cianose (doenças pulmonares, cardíacas, autoimunes), dermatite ocre (estase venosa, insuficiência venosa), acantose nigricans (diabetes, obesidade, síndrome metabólica), lesão eritematodescamativa da pelagra (vitamina B3, alcoolismo) e úlcera (insuficiência vascular).</figcaption></figure>\n<h3>Mucosas: registre sempre os quatro</h3>\n<table class=\"cmp\"><tr><th>Avaliação</th><th>Normal</th><th>Alterado</th></tr>\n<tr><td>Cor</td><td>Corado</td><td>Descorado (palidez, anemia), graduado em cruzes</td></tr>\n<tr><td>Icterícia</td><td>Anictérico</td><td>Ictérico</td></tr>\n<tr><td>Cianose</td><td>Acianótico</td><td>Cianótico</td></tr>\n<tr><td>Hidratação</td><td>Hidratado</td><td>Desidratado</td></tr></table>\n<h3>Fâneros</h3>\n<ul><li><b>Pelos</b>: hipertricose (aumento difuso), hirsutismo (padrão masculino na mulher), hipotricose, atricose ou alopecia, madarose (perda de cílios e supercílios). Avalie textura, brilho e implantação.</li>\n<li><b>Unhas</b>: alteração de textura e cor (micoses, melanoma) e <b>baqueteamento digital</b>, com unhas em vidro de relógio, nas doenças pulmonares e cardíacas crônicas.</li></ul>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"unhas\" alt=\"\"><figcaption>Unhas: alteração de cor e textura (micose, melanoma) e baqueteamento digital com unhas em vidro de relógio.</figcaption></figure>\n<h3>Edema</h3>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Causas</th></tr>\n<tr><td>Anasarca (generalizado)</td><td>Insuficiência cardíaca, insuficiência renal, desnutrição</td></tr>\n<tr><td>Localizado</td><td>Alérgico, inflamatório</td></tr>\n<tr><td>Mole (depressível, cacifo)</td><td>Insuficiência cardíaca, insuficiência renal</td></tr>\n<tr><td>Duro</td><td>Flebites, erisipelas de repetição, linfedema de longa duração</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"edema\" alt=\"\"><figcaption>Edema: anasarca, edema localizado, sinal do cacifo (edema mole) e edema duro do linfedema.</figcaption></figure>\n<h3>Circulação colateral</h3>\n<p>Aparece quando há dificuldade ou impedimento do fluxo nos troncos venosos principais (cava superior, cava inferior, tronco braquiocefálico) ou hipertensão no sistema porta (cirrose, esquistossomose hepatoesplênica).</p>\n<h3>Marchas</h3>\n<p>Pequenos passos (Parkinson), parética/espástica (\"ceifante\", após AVC), claudicante, atáxica (cerebelar ou sensitiva).</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"colateral-marchas\" alt=\"\"><figcaption>Circulação colateral abdominal e tipos de marcha.</figcaption></figure>\n<h3>Movimentos involuntários</h3>\n<ul><li>Tiques; fasciculações e mioclonias.</li><li>Tetania: sinal de Trousseau na hipocalcemia.</li><li>Convulsões tônicas, clônicas e tônico-clônicas.</li><li>Coreia (\"dança\"): Sydenham (febre reumática), Huntington.</li><li>Tremores: de repouso (Parkinson), <i>flapping</i>/asterixe (encefalopatia hepática), vibratório (hipertireoidismo, emocional).</li></ul>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Cianose também se pesquisa na ectoscopia, mas é tema da aula de sinais e sintomas respiratórios: lá estão central × periférica e a resposta ao oxigênio.</p></div>","qs":{"p":[{"enun":"Observe a imagem das mãos de um paciente com doença pulmonar crônica.","cmd":"Qual o achado?","alts":["Dermatite ocre por estase venosa crônica","Baqueteamento digital com unhas em vidro de relógio","Acantose nigricans nas dobras dorsais dos dedos","Onicomicose com espessamento e descoloração das unhas"],"gab":1,"com":["Dermatite ocre é a pigmentação das pernas na estase venosa.","Correta. Aumento das falanges distais e convexidade da unha.","Acantose é escurecimento aveludado de dobras (pescoço, axilas).","Onicomicose altera cor e textura da unha, sem baqueteamento."],"imgs":["q-baqueteamento"]},{"enun":"Mulher de 62 anos com linfedema crônico do membro superior após mastectomia e erisipelas de repetição. Ao pressionar o edema, não fica depressão.","cmd":"Como se classifica esse edema?","alts":["Edema mole, generalizado","Anasarca","Edema mole, localizado","Edema duro, localizado"],"gab":3,"com":["Não é generalizado e não é mole (sem cacifo).","Anasarca é generalizada.","O cacifo ausente indica edema duro.","Correta. Linfedema de longa data e erisipelas de repetição dão edema duro."],"imgs":[]},{"enun":"Paciente cirrótico apresenta veias dilatadas e tortuosas na parede abdominal, ao redor do umbigo.","cmd":"Qual o mecanismo?","alts":["Hipertensão portal com desvio do fluxo para circulação colateral","Insuficiência cardíaca direita com estase de capilares cutâneos","Hipoalbuminemia com edema da parede abdominal","Obstrução arterial que dilata as artérias da parede abdominal"],"gab":0,"com":["Correta. O fluxo portal busca caminhos alternativos.","A IC direita causa edema e turgência jugular, não colateral periumbilical.","Hipoalbuminemia causa edema, não veias dilatadas.","A circulação colateral é venosa."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"Pulso radial contado em 112 ppm. Qual o termo correto?","cmd":"Assinale a alternativa correta.","alts":["Taquisfigmia","Taquipneia","Taquicardia","Normosfigmia"],"gab":0,"com":["Correta. Pulso acima de 100.","Taquipneia é da FR.","Taquicardia é contada na ausculta.","Acima de 100 não é normal."],"imgs":[]},{"enun":"A partir de qual temperatura axilar o paciente é considerado febril na prova?","cmd":"Assinale a alternativa correta.","alts":["Acima de 37,3 °C","Acima de 37,8 °C","Acima de 37,0 °C","Acima de 38,5 °C"],"gab":1,"com":["37,4 a 37,8 é febrícula.","Correta.","37,0 ainda é normal.","38,5 é febre alta, mas o limite é 37,8."],"imgs":[]},{"enun":"\"Paciente em BEG, LOTE, corado, hidratado\" é registrado em:","cmd":"Assinale a alternativa correta.","alts":["Identificação do paciente","HMA (história da moléstia atual)","Revisão de sistemas","Exame físico geral (ectoscopia)"],"gab":3,"com":["Identificação é dado pessoal.","HMA é a história da queixa.","RS é de sintomas.","Correta."],"imgs":[]},{"enun":"Criança que troca o R pelo L (\"o lato loeu\") tem:","cmd":"Assinale a alternativa correta.","alts":["Disartria","Disfonia","Disfasia","Dislalia"],"gab":3,"com":["Disartria é defeito motor.","Disfonia é de voz.","Disfasia é de linguagem.","Correta."],"imgs":[]},{"enun":"Fronte olímpica, nariz em sela e dentes de Hutchinson indicam:","cmd":"Assinale a alternativa correta.","alts":["Acromegalia","Síndrome de Cushing","Sífilis congênita","Hipertrofia de adenoide"],"gab":2,"com":["Acromegalia dá mandíbula e nariz grandes.","Cushing dá lua cheia.","Correta.","Adenoidiana dá rosto alongado."],"imgs":[]},{"enun":"No brevilíneo, o ictus cordis normal é palpado:","cmd":"Assinale a alternativa correta.","alts":["No 4º EIC, por fora da LHC","No 5º EIC, na LHC","No 6º EIC, por dentro da LHC","No 3º EIC, na linha paraesternal"],"gab":0,"com":["Correta. O coração horizontaliza.","Esse é o normolíneo.","Esse é o longilíneo.","Não é a posição de nenhum biotipo."],"imgs":[]},{"enun":"Mulher de 30 anos com exoftalmia, olhar brilhante, rosto magro e expressão de espanto.","cmd":"Qual a fácies?","alts":["Renal","Mixedematosa","Hipertireoidea","Cushingoide"],"gab":2,"com":["Renal é edema periorbitário.","Mixedematosa é do hipotireoidismo.","Correta.","Cushingoide é lua cheia."],"imgs":["q-hipertireoidea"]},{"enun":"Edema periorbitário bilateral, pior pela manhã, com palidez, sugere:","cmd":"Assinale a alternativa correta.","alts":["Fácies renal","Fácies miastênica","Fácies mixedematosa","Fácies hipocrática"],"gab":0,"com":["Correta.","Miastênica é ptose.","Mixedematosa tem pele espessa e supercílios escassos.","Hipocrática é rosto afilado."],"imgs":[]},{"enun":"Observe a imagem.","cmd":"Qual o tipo de fácies?","alts":["Acromegálica","Renal","Cushingoide","Hipertireoidea"],"gab":2,"com":["Acromegálica: proeminência óssea.","Renal: edema palpebral e palidez.","Correta. Lua cheia, rubor, acne.","Hipertireoidea: exoftalmia."],"imgs":["q-cushingoide"]},{"enun":"Paciente de 1,80 m e 58 kg.","cmd":"Qual a classificação pelo IMC?","alts":["Desnutrição leve","Desnutrição grave","Desnutrição moderada","Eutrófico"],"gab":0,"com":["Correta. 58 ÷ 3,24 ≈ 17,9.","Grave é abaixo de 16.","Moderada é 16 a 16,99.","Eutrófico começa em 18,5."],"imgs":[]},{"enun":"Observe a imagem.","cmd":"Qual o tipo de fácies?","alts":["Cushingoide","Mixedematosa","Acromegálica","Adenoidiana"],"gab":2,"com":["Cushingoide: face em lua cheia.","Mixedematosa: face edemaciada, pele seca, supercílios escassos.","Correta. Proeminência das arcadas supraorbitárias, nariz e lábios grossos, prognatismo.","Adenoidiana: boca entreaberta, nariz afilado."],"imgs":["q-acromegalica"]},{"enun":"Observe a imagem.","cmd":"Qual o tipo de fácies?","alts":["Parkinsoniana","Hipocrática","Miastênica","Renal"],"gab":2,"com":["Parkinsoniana: inexpressiva, sem ptose típica.","Hipocrática: rosto afilado, olhos fundos.","Correta. Ptose palpebral bilateral; o paciente franze a testa e inclina a cabeça para enxergar.","Renal: edema periorbitário."],"imgs":["q-miastenica"]},{"enun":"Observe a imagem de uma criança.","cmd":"Qual o tipo de fácies?","alts":["Mixedematosa","Cushingoide","Acromegálica","Adenoidiana"],"gab":3,"com":["Mixedematosa: face edemaciada do hipotireoidismo.","Cushingoide: lua cheia.","Acromegálica: proeminências ósseas.","Correta. Boca entreaberta, nariz pequeno e afilado, respiração oral por hipertrofia de adenoides."],"imgs":["q-adenoidiana"]},{"enun":"Observe a imagem.","cmd":"Qual a fácies?","alts":["Hipertireoidea","Miastênica","Renal","Cushingoide"],"gab":2,"com":["Hipertireoidea: exoftalmia e olhar vivo.","Miastênica: ptose.","Correta. Edema periorbitário e palidez.","Cushingoide: lua cheia e rubor."],"imgs":["q-renal"]},{"enun":"Observe a pele da nuca na imagem: placa escurecida e de aspecto aveludado.","cmd":"Qual o achado e a associação mais comum?","alts":["Acantose nigricans; resistência à insulina","Vitiligo; doença autoimune da pele","Melasma; alteração hormonal da gestação","Icterícia; hepatopatia com bilirrubina alta"],"gab":0,"com":["Correta.","Vitiligo é despigmentação.","Melasma é facial, plano.","Icterícia é amarela e difusa."],"imgs":["q-acantose"]}],"widgets":[{"id":"facies","titulo":"Qual é a fácies?","desc":"Associe cada achado à fácies correta.","cats":[["cus","Cushingoide"],["mix","Mixedematosa"],["hip","Hipertireoidea"],["sif","Luética"],["ade","Adenoidiana"],["par","Parkinsoniana"],["ren","Renal"]],"cards":[["Lua cheia, rubor e acne","cus"],["Uso prolongado de prednisona","cus"],["Supercílios escassos, pele seca","mix"],["Exoftalmia e olhar de espanto","hip"],["Nariz em sela e fronte olímpica","sif"],["Dentes de Hutchinson","sif"],["Boca entreaberta, palato ogival","ade"],["Fisionomia em máscara","par"],["Edema periorbitário matinal","ren"],["Pálpebras infiltradas, nariz e lábios grossos","mix"]]},{"id":"vitais","titulo":"Nomeie o dado vital","desc":"Classifique cada achado.","cats":[["tc","Taquicardia"],["ts","Taquisfigmia"],["bc","Bradicardia"],["bs","Bradisfigmia"],["tp","Taquipneia"],["fb","Febre"]],"cards":[["FC 112 bpm na ausculta","tc"],["FP 108 ppm no pulso radial","ts"],["FC 52 bpm na ausculta","bc"],["FP 50 ppm no pulso radial","bs"],["FR 26 irpm","tp"],["TAX 38,4 °C","fb"],["FP 55 ppm em atleta","bs"],["FC 55 bpm em uso de betabloqueador","bc"]]}],"gl":[["Ectoscopia","Exame físico geral (somatoscopia).",1],["LOTE","Lúcido e orientado no tempo e espaço.",1],["Bradisfigmia","Pulso abaixo de 60 ppm.",1],["Disartria","Distúrbio motor da fala, linguagem preservada.",1],["Dislalia","Troca de fonemas.",1],["Ângulo de Charpy","Ângulo infraesternal; agudo no longilíneo, obtuso no brevilíneo.",2],["Sarcopenia","Perda de massa muscular.",2],["Fácies atípica","Fácies normal; sinônimo: incaracterística.",3],["Fácies luética","Fronte olímpica, nariz em sela, dentes de Hutchinson: sífilis congênita.",3],["Genupeitoral","Prece maometana: alívio no derrame pericárdico.",4],["Baqueteamento digital","Dedos em baqueta e unhas em vidro de relógio.",5],["Madarose","Perda de cílios e supercílios.",5]],"vf":[["FP de 50 ppm é bradicardia.",false,"É bradisfigmia; bradicardia é contada na ausculta."],["\"BEG\" é registrado na revisão de sistemas.",false,"É achado de exame físico geral."],["Variação de 5 kg em menos de 24 h é parâmetro nutricional.",false,"É mobilização de líquido."],["Fácies atípica é a fácies normal.",true,"Sinônimo: incaracterística."],["No longilíneo o ictus fica no 6º EIC, medial à LHC.",true,"O coração verticaliza."],["A posição de cócoras alivia o shunt esquerda-direita.",false,"Alivia o shunt direita-esquerda (Fallot)."],["Febre é temperatura axilar acima de 37,8 °C.",true,"37,4 a 37,8 é febrícula."]],"check":["Dar os valores normais de FC/FP, FR e temperatura","Usar bradi/taquicardia × bradi/taquisfigmia corretamente","Registrar BEG/LOTE no campo certo","Diferenciar dislalia × disartria × disfasia","Dizer o ictus de cada biotipo e a relação com pneumotórax","Listar parâmetros nutricionais da ectoscopia e a pegadinha dos 5 kg","Reconhecer as fácies (cushingoide, luética, adenoidiana, hipertireoidea, atípica)","Explicar o alívio da cócoras no shunt direita-esquerda"],"resumo":[["Segmento 1","Dados vitais: FC/FP 60–100, FR 14/16–20, febre > 37,8 °C. Coração = cardia; pulso = esfigmia. BEG é ectoscopia. Dislalia (troca de letras) × disartria (motora)."],["Segmento 2","Biotipo muda o ictus (4º, 5º, 6º EIC), predispõe pneumotórax no longilíneo e muda a leitura da imagem. Nutrição: relevos ósseos, fâneros, sarcopenia; 5 kg em horas é líquido."],["Segmento 3","Fácies atípica = incaracterística. Cushingoide, hipertireoidea, mixedematosa, acromegálica, renal, adenoidiana, luética, parkinsoniana, miastênica, hipocrática."],["Segmento 4","Cócoras: Fallot (shunt D→E). Genupeitoral: derrame pericárdico. Ortopneia: IC. Decúbito sobre o lado doente na dor pleurítica."],["Segmento 5","Mucosas: corado, anictérico, acianótico, hidratado. Baqueteamento: doença pulmonar/cardíaca. Edema mole (IC, IR) × duro (linfedema)."]],"freq":[["Posição de cócoras alivia o shunt direita-esquerda",6,"S78.15, S79.29, S80.23, S81.29, S82.3, EDS.15"],["Biotipo: ictus, pneumotórax do longilíneo e leitura de exames de imagem",4,"S77.13, S80.27, S81.9, S82.9"],["Biotipos: ictus, pneumotórax do longilíneo e leitura de exames",3,"P82.6, P81.13, P80.1"],["Estado geral (BEG/REG/MEG) é exame físico geral, não revisão de sistemas",3,"S78.11, S79.14, S80.11"],["Parâmetros do estado nutricional no exame físico geral",3,"P82.1, P81.3, P80.13"],["Dados vitais: afebril, taquisfígmico, normopneico",2,"P82.2, P81.2"],["Exoftalmia e expressão de espanto: fácies hipertireoidea",2,"P82.20, P81.10"],["Face em lua cheia, rubor, acne e hirsutismo: fácies cushingoide",2,"P82.13, P81.1"],["Fácies atípica = fácies incaracterística",3,"S79.9, S81.21, S82.24"],["Fácies normal: atípica ou incaracterística",2,"P82.19, P80.18"],["Nariz em sela, dentes de Hutchinson, fronte olímpica: sífilis congênita",2,"P81.9, P80.19"],["Variação de peso em horas = líquido; pesar não é ectoscopia",3,"S79.20, S81.8, S82.8"],["\"BEG, lúcido, afebril\" vai no exame físico geral",1,"P82.7"],["Dados vitais: febre > 37,8 °C, FP 60–100 ppm, FR até 20 irpm",1,"S78.17"],["Ectoscopia: recomendada em todos os casos e desde o primeiro contato",1,"P81.19"],["Face alongada, boca entreaberta e palato ogival: fácies adenoideana",1,"P80.4"],["Fácies cushingoide (corticoide)",2,"S81.22, S82.16"],["Taquicardia (ausculta), febre > 37,8 °C, taquipneia > 20",2,"S81.5, S82.19"]],"cob":{"rk":{"t":"Onde se contou define o nome","c":["Contagem","Onde foi feita","Unidade","Nome"],"d":["<b>Contagem</b>: um número de eventos por minuto.","<b>Onde foi feita</b>: no coração (ausculta) ou no pulso (palpação).","<b>Unidade</b>: bpm (batimentos) no coração; ppm (pulsações) no pulso.","<b>Nome</b>: -cardia para o coração; -sfigmia para o pulso."],"x":[["55","ausculta","bpm","bradicardia"],["55","pulso radial","ppm","bradisfigmia"],["106","pulso radial","ppm","taquisfigmia"]],"ex":"FC/FP normal 60–100. Febre > 37,8 °C. FR 14/16–20 irpm.","b":"Fácies atípica = incaracterística. Luética: fronte olímpica, nariz em sela, dentes de Hutchinson. Cushingoide: lua cheia, rubor, acne, hirsutismo."},"figs":[["biotipos","Biotipos: ictus no 4º EIC (brevilíneo), 5º (normolíneo) e 6º (longilíneo); longilíneo jovem e pneumotórax.","s2"],["facies-sifilis-parkinsoniana","Fácies luética: fronte olímpica, nariz em sela, dentes de Hutchinson.","s3"],["facies-cushingoide-adenoidiana","Cushingoide (lua cheia, rubor) e adenoidiana (respirador oral).","s3"],["atitude-postura","Cócoras (Fallot) e genupeitoral (derrame pericárdico).","s4"]],"keys":["C28","C12","p:biotipo","C26","p:nutri","p:vitais","p:hipert","p:cush","C41","p:atipica","p:sifilis","C45","p:beg","C29","p:ecto","p:adenoide","C60","C57"]}},{"id":"a4","num":4,"nome":"Semiologia da dor","tema":"Classificação da dor, referida × irradiada, decálogo, aguda × crônica, neuropática e psicogênica","segs":[{"id":"s1","titulo":"O que é dor e a classificação por mecanismo e origem","html":"\n<p class=\"lead\">Dor é o sintoma mais frequente da medicina e o tema mais cobrado das parciais: caiu nas Parciais 80, 81 e 82 e no Estudo Dirigido.</p>\n<div class=\"warn\"><b>Turma 83</b><p>Para a Turma 83, o professor não deu a aula teórica de Semiologia da Dor; as questões de dor da parcial foram entregues no Estudo Dirigido, como forma de anulação. Para as outras turmas, a dor costuma cair na parcial.</p></div>\n<p>A IASP define dor como <b>\"uma experiência sensorial e emocional desagradável associada a uma lesão tecidual real ou potencial, ou descrita nos termos dessa lesão\"</b>. Duas consequências: a dor é sempre subjetiva (é sintoma), e tem componente emocional. Por isso é considerada o <b>quinto sinal vital</b> e deve ser graduada em todo atendimento.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-indice\" alt=\"\"><figcaption>Roteiro da aula de dor: conceito, vias, classificação por mecanismo, por origem, quanto à distância e quanto ao tempo.</figcaption></figure>\n<h3>Duas fibras, duas dores</h3>\n<table class=\"cmp\"><tr><th>Fibra</th><th>Condução</th><th>Dor</th></tr>\n<tr><td>A-delta (mielinizada, fina)</td><td>Rápida</td><td>Primeira dor: aguda, em picada, bem localizada</td></tr>\n<tr><td>C (amielínica)</td><td>Lenta</td><td>Segunda dor: surda, em queimação, difusa, persistente</td></tr></table>\n<h3>Classificação pelo mecanismo</h3>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Mecanismo</th><th>Exemplos</th></tr>\n<tr><td><b>Nociceptiva</b></td><td>Ativação de nociceptores por lesão tecidual; vias nervosas íntegras</td><td><mark class=\"f4\" data-refs=\"ED.4,P82.8,P81.8,P80.16\">Cólica biliar por cálculo impactado no infundíbulo, há 2 horas</mark>; queimadura; pós-operatório; fratura</td></tr>\n<tr><td><b>Neuropática</b></td><td>Lesão ou disfunção do próprio sistema nervoso somatossensorial</td><td>Zóster, neuropatia diabética, ciatalgia, dor pós-AVE, membro fantasma</td></tr>\n<tr><td>Mista</td><td>Os dois mecanismos juntos</td><td>Câncer invadindo plexo nervoso</td></tr>\n<tr><td><b>Psicogênica</b> (nociplástica)</td><td>Sem substrato anatômico demonstrável; fatores emocionais e psicológicos</td><td>Dor crônica difusa com transtorno do humor</td></tr></table>\n<h3>Classificação pela origem (dentro da nociceptiva)</h3>\n<table class=\"cmp\"><tr><th>Origem</th><th>Estruturas</th><th>Como é</th></tr>\n<tr><td>Somática superficial</td><td>Pele e mucosas</td><td>Bem localizada (aponta com um dedo), em picada, corte ou queimação</td></tr>\n<tr><td>Somática profunda</td><td>Músculos, tendões, ligamentos, fáscias, periósteo, cápsula articular, peritônio parietal</td><td>Mais difusa, surda, latejante, em cãibra</td></tr>\n<tr><td><b>Visceral</b></td><td>Órgãos torácicos e abdominais, peritônio visceral</td><td>Profunda, vaga, difusa, mal localizada; vem com náusea, sudorese, palidez</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-somatica-visceral\" alt=\"\"><figcaption>Dor somática (bem localizada, inervação densa) × dor visceral (difusa, mal localizada, com fenômenos autonômicos).</figcaption></figure>\n<p>Na víscera oca obstruída (vesícula, ureter, intestino), a dor é em <b>cólica</b>: crises intensas que vêm e vão. Se a parede inflama (colecistite), a dor fica contínua e, quando o peritônio parietal é atingido, passa a ser somática e bem localizada (sinal de Murphy). Na víscera maciça (fígado, pâncreas), a dor é surda pela distensão da cápsula.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A cólica biliar caiu igual em quatro provas: dor intensa e contínua no hipocôndrio direito há 2 horas, cálculo impactado no infundíbulo. A resposta é sempre <b>nociceptiva</b>. Os distratores chamam de neuropática, psicogênica ou crônica.</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>A dor precordial do infarto é <b>visceral</b> (do miocárdio). Já a dor no braço esquerdo e na mandíbula do mesmo paciente é <b>referida</b> (próximo segmento).</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> A questão bônus da Parcial 81 era de outra disciplina: dor pélvica com doença inflamatória pélvica, com resposta <mark class=\"f1\" data-refs=\"P81.7-Bônus\">ceftriaxona e azitromicina</mark>. Fica nos simulados, mas não é matéria de Semiologia.</p></div>","qs":{"p":[{"enun":"Paciente com cólica renal por cálculo ureteral obstrutivo há 3 horas, dor intensa em flanco direito, em ondas.","cmd":"Como se classifica a dor pelo mecanismo e pela origem?","alts":["Psicogênica, visceral","Nociceptiva, visceral","Nociceptiva, somática superficial","Neuropática, somática profunda"],"gab":1,"com":["Há lesão orgânica clara.","Correta. Nociceptores do ureter distendido: víscera oca.","Superficial é da pele.","As vias nervosas estão íntegras: não é neuropática."],"imgs":[]},{"enun":"Durante a coleta de sangue, a paciente sente uma picada bem localizada, que ela aponta com a ponta do dedo.","cmd":"Qual a origem dessa dor?","alts":["Visceral","Somática profunda","Neuropática","Somática superficial"],"gab":3,"com":["Visceral é mal localizada.","Profunda é de músculo, tendão, periósteo.","Não há lesão do sistema nervoso.","Correta. Pele: inervação densa, dor bem localizada."],"imgs":[]},{"enun":"Paciente com apendicite: começa com dor vaga periumbilical e, horas depois, a dor se fixa na fossa ilíaca direita, bem localizada e pior à palpação.","cmd":"O que explica a mudança?","alts":["A dor periumbilical era irradiada pelo nervo femoral até a fossa ilíaca","A inflamação atingiu o peritônio parietal: a dor passou a ser somática","A dor periumbilical era psicogênica e a da fossa ilíaca é visceral","O apêndice perfurou e a dor virou neuropática, de localização precisa"],"gab":1,"com":["Não é dor irradiada por nervo.","Correta. Peritônio visceral → dor vaga; parietal → dor somática bem localizada.","A dor inicial é visceral, não psicogênica.","Perfuração não torna a dor neuropática."],"imgs":[]}]},"pv":["ED.4","P81.7-Bônus"]},{"id":"s2","titulo":"Dor à distância: referida, irradiada e por disseminação fascial","html":"\n<p class=\"lead\">Quando a dor aparece longe do órgão lesado, a prova quer saber o mecanismo. São três situações diferentes, e todas já caíram.</p>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Anotação do slide: \"dor em estruturas distantes do órgão lesado\".</p></div>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-referida-irradiada\" alt=\"\"><figcaption>Dor referida (convergência de fibras viscerais e somáticas no mesmo segmento medular) × dor irradiada (segue o trajeto de um nervo ou raiz).</figcaption></figure>\n<table class=\"cmp\"><tr><th></th><th>Dor referida</th><th>Dor irradiada</th><th>Disseminação fascial</th></tr>\n<tr><td>Mecanismo</td><td>Convergência de fibras viscerais e cutâneas no mesmo neurônio do corno posterior da medula: o córtex \"atribui\" à pele</td><td>Estímulo ou compressão de um nervo ou raiz: a dor percorre o trajeto dele</td><td>A infecção se espalha pelos planos fasciais, menos inervados, e a dor aparece longe do foco aparente</td></tr>\n<tr><td>Trajeto</td><td>Não segue um nervo; segue o metâmero (segmento) de origem</td><td>Segue exatamente o nervo ou o dermátomo</td><td>Segue a extensão anatômica da infecção</td></tr>\n<tr><td>Exemplos</td><td>Braço esquerdo e mandíbula no IAM; ombro direito na colecistite e no pós-operatório de laparoscopia; ombro no TEP com irritação diafragmática</td><td>Ciatalgia: dor da coluna lombar descendo pela face posterior da coxa até o pé</td><td><mark class=\"f2\" data-refs=\"ED.1,P82.3\">Gangrena de Fournier, fasceíte necrosante</mark></td></tr></table>\n<h3>Os casos que caíram</h3>\n<ul><li><mark class=\"f3\" data-refs=\"ED.D6,P82.D3,P80.D2\">IAM: dor precordial em aperto, dor no membro superior esquerdo e na mandíbula → <b>visceral; referida; referida</b></mark>. Caiu como discursiva em três provas.</li>\n<li><mark class=\"f1\" data-refs=\"P82.21\">Dor no ombro direito 12 h após colecistectomia por videolaparoscopia, por irritação diafragmática do pneumoperitônio → <b>dor referida</b></mark>. O diafragma é inervado pelo frênico (C3–C5), que compartilha segmentos com os nervos supraclaviculares do ombro.</li>\n<li><mark class=\"f1\" data-refs=\"P80.10\">Mulher de 21 anos com anticoncepcional, dor ventilatório-dependente à direita por TEP com acometimento da pleura diafragmática e dor no ombro direito → <b>dor aguda referida</b></mark>.</li>\n<li><mark class=\"f2\" data-refs=\"ED.1,P82.3\">Infecção de partes moles: pelo risco de extensão por planos fasciais e músculo-aponeuróticos com limiares diferentes de dor, a dor à distância do foco aparente deve ser valorizada. Exemplo clássico: gangrena de Fournier</mark>.</li></ul>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>\"Irradiada\" é a palavra-armadilha. Na fala comum se diz que a dor do infarto \"irradia\" para o braço, mas na classificação semiológica ela é <b>referida</b>: não segue o trajeto de um nervo. Irradiada, em prova, é a dor que acompanha um nervo, como a ciatalgia.</p></div>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-distancia\" alt=\"\"><figcaption>Dor à distância do foco: na infecção de partes moles (Fournier), a dor longe da lesão aparente sinaliza extensão pelos planos fasciais.</figcaption></figure>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Na discursiva do IAM, escreva as três respostas na ordem pedida: <b>dor precordial: visceral; membro superior esquerdo: referida; mandíbula: referida</b>.</p></div>","qs":{"p":[{"enun":"Homem de 45 anos com hérnia de disco L5-S1 refere dor lombar que desce pela face posterior da coxa e da perna até a planta do pé esquerdo, com formigamento.","cmd":"Como se classifica a dor no membro inferior?","alts":["Por disseminação fascial","Irradiada","Visceral","Referida"],"gab":1,"com":["Não há infecção de partes moles.","Correta. Segue o trajeto da raiz comprimida e do nervo isquiático.","Não há víscera envolvida.","Referida não segue o trajeto de um nervo."],"imgs":[]},{"enun":"Paciente com colecistite aguda refere dor no hipocôndrio direito e também na ponta do ombro direito.","cmd":"A dor no ombro é:","alts":["Referida, por convergência no segmento do nervo frênico","Irradiada, pelo trajeto do nervo frênico até o ombro","Somática superficial, por lesão da pele do ombro","Psicogênica, por não haver lesão no ombro"],"gab":0,"com":["Correta. Irritação diafragmática → frênico (C3–C5) → dor percebida no ombro.","O frênico não termina no ombro; a dor é atribuída ao dermátomo que divide o segmento.","A pele do ombro está íntegra.","Há substrato orgânico, só que distante."],"imgs":[]},{"enun":"Paciente diabético com pequena ferida perineal refere dor intensa na raiz da coxa e no abdome inferior, longe da ferida, com crepitação à palpação.","cmd":"Qual a interpretação correta?","alts":["Dor à distância por disseminação fascial: sinal de extensão da infecção","Dor psicogênica, desproporcional ao tamanho pequeno da ferida perineal","Dor irradiada pelo nervo femoral, típica da neuropatia diabética","Dor referida pelo nervo pudendo, sem importância para a gravidade"],"gab":0,"com":["Correta. É o raciocínio da gangrena de Fournier cobrado nas parciais.","A dor desproporcional é um sinal de alarme, não de psicogenia.","A crepitação e o contexto apontam infecção extensa, não neuropatia.","A dor longe do foco aparente é justamente o alerta de gravidade."],"imgs":[]}]},"pv":["ED.1","P82.21","P80.10","ED.D6","P82.D3","P80.D2"]},{"id":"s3","titulo":"Decálogo da dor, escalas e classificação temporal","html":"\n<p class=\"lead\">O decálogo expande os sete atributos de um sintoma para dez, específicos para dor. E a classificação temporal tem uma regra que o professor deixou bem clara.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-decalogo\" alt=\"\"><figcaption>Decálogo semiológico da dor.</figcaption></figure>\n<ol class=\"steps\"><li><b>Localização</b> precisa.</li><li><b>Irradiação</b> ou propagação.</li><li><b>Qualidade ou caráter</b>: aperto, queimação, pontada, cólica, peso, latejante.</li><li><b>Intensidade</b>, graduada de 0 a 10.</li><li><b>Duração</b> do episódio.</li><li><b>Evolução</b>: melhora, piora, frequência das crises.</li><li><b>Relação com funções orgânicas</b>: respiração, deglutição, micção, evacuação, ciclo menstrual.</li><li><b>Fatores desencadeantes ou agravantes</b>: esforço, frio, tosse, palpação.</li><li><b>Fatores atenuantes</b>: repouso, posição, analgésico, nitrato.</li><li><b>Manifestações associadas</b>: sudorese, náusea, vômitos, dispneia, síncope.</li></ol>\n<p><mark class=\"f1\" data-refs=\"P81.14\">A caracterização da dor abdominal envolve esses atributos, interrogados idealmente após o relato livre do paciente, sem interrupções</mark>.</p>\n<h3>Escalas de intensidade</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-escalas\" alt=\"\"><figcaption>Escalas de dor: numérica (0–10), visual analógica (EVA), de faces (crianças, pacientes com dificuldade de comunicação) e verbal (leve, moderada, intensa).</figcaption></figure>\n<h3>Aguda × crônica</h3>\n<table class=\"cmp\"><tr><th></th><th>Dor aguda</th><th>Dor crônica</th></tr>\n<tr><td>Duração</td><td><b>Menos de 3 meses</b></td><td><b>3 meses ou mais</b></td></tr>\n<tr><td>Função</td><td>Alerta protetor de lesão real ou iminente</td><td>Perde a função protetora; vira \"dor-doença\"</td></tr>\n<tr><td>Comportamento</td><td>Some com a cura da lesão</td><td>Persiste, com sensibilização central e repercussão emocional</td></tr></table>\n<p><mark class=\"f3\" data-refs=\"ED.3,P81.6,P80.8\">Adolescente de 12 anos com dor profunda e vaga nas pernas, 5/10, pior à noite, há <b>1 mês e meio</b> (hipótese de dor do crescimento) → <b>dor aguda</b></mark>.</p>\n<div class=\"prof\"><b>O professor em aula</b><p>\"Define-se como dor crônica aquela que persiste durante três meses ou mais. Embora alguns autores utilizem a classificação protraída e subaguda como sinonímia, a literatura de referência adotada não trata de tais definições.\"</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Os distratores \"subaguda\" e \"protraída\" aparecem de propósito. Para este professor, só existe <b>aguda</b> (&lt; 3 meses) e <b>crônica</b> (≥ 3 meses).</p></div>\n<p><mark class=\"f3\" data-refs=\"P82.10,P81.Torção-Joelho,P80.11\">Torção do joelho no futebol há 2 dias, dor em toda a articulação, latejante, que alivia com repouso e piora ao subir escadas, lesão ligamentar confirmada → <b>dor aguda, somática profunda</b></mark>. Ligamento é estrutura somática profunda, e 2 dias é agudo.</p>","qs":{"p":[{"enun":"Mulher de 50 anos com dor lombar mecânica há 10 semanas, sem irradiação, que melhora com repouso.","cmd":"Pela classificação temporal adotada na disciplina, a dor é:","alts":["Subaguda","Protraída","Aguda","Crônica"],"gab":2,"com":["A literatura adotada não usa \"subaguda\".","A literatura adotada não usa \"protraída\".","Correta. 10 semanas é menos de 3 meses.","Crônica é a partir de 3 meses."],"imgs":[]},{"enun":"Paciente relata que a dor torácica \"piora quando respiro fundo e quando tusso\".","cmd":"Qual item do decálogo foi descrito?","alts":["Manifestações associadas, como náusea e sudorese","Qualidade ou caráter da dor, como pontada","Relação com funções orgânicas e agravantes","Duração e evolução temporal da dor"],"gab":2,"com":["Manifestação associada seria outro sintoma.","Caráter seria aperto, pontada, queimação.","Correta. Respiração e tosse são funções orgânicas que agravam a dor.","Duração é quanto tempo dura o episódio."],"imgs":[]},{"enun":"Corredor com estiramento muscular na panturrilha há 4 dias, dor surda e difusa no músculo, pior ao andar.","cmd":"Classifique a dor.","alts":["Aguda, somática profunda","Aguda, visceral","Crônica, somática superficial","Aguda, neuropática"],"gab":0,"com":["Correta. Músculo é estrutura somática profunda; 4 dias é agudo.","Músculo não é víscera.","Não é crônica nem da pele.","Não há lesão de nervo."],"imgs":[]}]},"pv":["ED.3","P82.10","P81.14"]},{"id":"s4","titulo":"Dor neuropática e dor psicogênica","html":"\n<p class=\"lead\">As duas classes que mais aparecem em questões de \"assinale a correta\" com várias armadilhas.</p>\n<h3>Dor neuropática</h3>\n<p>É causada por lesão ou disfunção do próprio sistema nervoso somatossensorial, periférico ou central. Descritores típicos: queimação, choque elétrico, agulhadas, formigamento, dormência, <b>disestesia</b> (sensação anormal desagradável), <b>alodinia</b> (dor com estímulo que normalmente não dói) e hiperpatia. Costuma respeitar um dermátomo ou território nervoso.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-neuropatica\" alt=\"\"><figcaption>Dor neuropática: zóster no dermátomo, neuropatia diabética em bota e luva, radiculopatia, dor central pós-AVE.</figcaption></figure>\n<p><mark class=\"f2\" data-refs=\"ED.5,P81.11\">Entre os exemplos \"1. dor hemifacial esquerda com disestesia, secundária ao zóster facial; 2. dor no membro superior esquerdo no infarto; 3. dor epigástrica concomitante à dor na fossa ilíaca direita na apendicite\", só o item 1 é neuropático</mark>. O 2 é referido; o 3 é visceral.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"dor-zoster-colecistite\" alt=\"\"><figcaption>Zóster: vesículas agrupadas sobre base eritematosa, num dermátomo. A dor pode vir antes das lesões e confundir o diagnóstico.</figcaption></figure>\n<p>Discursiva que caiu: <mark class=\"f1\" data-refs=\"P80.D3\">motorista de aplicativo de 45 anos com dor cervical recorrente tratada como vício postural, depois com lesões de pele no mesmo território → hipótese única: <b>herpes-zóster</b></mark>. A dor neuropática pode preceder as vesículas em dias.</p>\n<h3>Dor psicogênica</h3>\n<ul><li><mark class=\"f4\" data-refs=\"ED.2,P82.11,P81.22,P80.5\">Não tem substrato anatômico nem alteração específica de exames que a defina, e deve ser considerada como diagnóstico diferencial, sobretudo em quadros crônicos ou com tendência a cronificar</mark>.</li>\n<li><mark class=\"f4\" data-refs=\"ED.2,P82.11,P81.22,P80.5\">É <b>genuína</b>: o paciente sofre de verdade, com absenteísmo, perda de prazer e incapacidade</mark>.</li>\n<li><mark class=\"f4\" data-refs=\"ED.2,P82.11,P81.22,P80.5\">Transtornos do humor são mais prevalentes nesses pacientes que na população geral, e eles demandam atendimento multiprofissional</mark>.</li>\n<li>O diagnóstico é clínico e de exclusão.</li></ul>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Dor psicogênica <b>não</b> é dor simulada. Na simulação o paciente mente para ter ganho secundário (atestado, por exemplo); na psicogênica não há fingimento. Distratores típicos: \"não deve ser valorizada\", \"é sempre simulação\", \"o exame de imagem confirma o diagnóstico\".</p></div>","qs":{"p":[{"enun":"Diabético de longa data refere queimação e formigamento nos dois pés, pior à noite; o lençol encostando nos pés causa dor.","cmd":"Qual o tipo de dor e o termo para a dor com o lençol?","alts":["Nociceptiva; hiperalgesia","Neuropática; alodinia","Psicogênica; disestesia","Neuropática; dor referida"],"gab":1,"com":["Há lesão de nervo, não de tecido.","Correta. Neuropatia diabética; dor com estímulo que normalmente não dói é alodinia.","Há substrato orgânico (neuropatia).","O termo para o lençol que dói é alodinia."],"imgs":[]},{"enun":"Paciente de 38 anos com dor difusa há 2 anos, exames normais, transtorno depressivo associado e afastamento do trabalho.","cmd":"Assinale a afirmação correta.","alts":["Exames normais provam que a dor é simulada para obter o afastamento do trabalho","A dor deve ser classificada como aguda, pois os exames complementares são normais","A dor pode ser psicogênica, o sofrimento é real e exige abordagem multiprofissional","A dor deve ser classificada como neuropática, por ser difusa e prolongada"],"gab":2,"com":["Psicogênica não é simulação.","2 anos é crônica.","Correta. É o que caiu em quatro provas.","Neuropática exige lesão do sistema nervoso."],"imgs":[]},{"enun":"Idosa com dor em faixa no hemitórax direito há 3 dias, em queimação e choque, sem lesões; hoje surgiram vesículas no mesmo trajeto.","cmd":"Qual o diagnóstico mais provável?","alts":["Pleurite com dor somática profunda","Herpes-zóster com dor neuropática pré-eruptiva","Infarto agudo do miocárdio com dor referida","Dor psicogênica com somatização cutânea"],"gab":1,"com":["A pleurite não causa vesículas.","Correta. A dor no dermátomo precede as vesículas.","A dor em faixa num dermátomo com vesículas não é do IAM.","Há lesão orgânica evidente."],"imgs":[]}]},"pv":["ED.2","ED.5","P80.D3"]}],"quiz":[{"enun":"A dor precordial do IAM é classificada como:","cmd":"Assinale a alternativa correta.","alts":["Visceral","Somática profunda","Irradiada","Neuropática"],"gab":0,"com":["Correta.","Somática profunda é de músculo, tendão.","Irradiada segue um nervo.","Não há lesão do sistema nervoso."],"imgs":[]},{"enun":"A dor na mandíbula durante um IAM é:","cmd":"Assinale a alternativa correta.","alts":["Irradiada","Somática superficial","Psicogênica","Referida"],"gab":3,"com":["Não segue o trajeto de um nervo.","A mandíbula está íntegra.","Há lesão orgânica.","Correta."],"imgs":[]},{"enun":"Dor de 4 meses de duração é:","cmd":"Assinale a alternativa correta.","alts":["Aguda","Subaguda","Protraída","Crônica"],"gab":3,"com":["Aguda é < 3 meses.","Termo não adotado.","Termo não adotado.","Correta. ≥ 3 meses."],"imgs":[]},{"enun":"O mecanismo da dor referida é:","cmd":"Assinale a alternativa correta.","alts":["Convergência visceral e somática no mesmo segmento medular","Extensão da infecção pelos planos fasciais profundos","Compressão de uma raiz nervosa com dor no seu trajeto","Lesão do córtex sensitivo com mapa corporal alterado"],"gab":0,"com":["Correta.","É a disseminação fascial.","É a irradiada.","Não é lesão cortical."],"imgs":[]},{"enun":"Dor em queimação num dermátomo, com vesículas agrupadas, é:","cmd":"Assinale a alternativa correta.","alts":["Somática profunda","Neuropática","Visceral","Psicogênica"],"gab":1,"com":["Não é de músculo ou tendão.","Correta. Zóster.","Não é de víscera.","Há lesão orgânica."],"imgs":[]},{"enun":"Sobre a dor psicogênica, é correto:","cmd":"Assinale a alternativa correta.","alts":["É confirmada por ressonância funcional","Só ocorre em quadros agudos e breves","É genuína e o diagnóstico é de exclusão","É sinônimo de simulação pelo paciente"],"gab":2,"com":["Não há substrato em exames.","Costuma ser crônica.","Correta.","Não é simulação."],"imgs":[]},{"enun":"Cólica biliar por cálculo impactado há 2 horas é dor:","cmd":"Assinale a alternativa correta.","alts":["Crônica","Psicogênica","Neuropática","Nociceptiva"],"gab":3,"com":["2 horas é aguda.","Há lesão orgânica.","Não há lesão nervosa.","Correta."],"imgs":[]},{"enun":"Na gangrena de Fournier, a dor à distância do foco aparente deve ser:","cmd":"Assinale a alternativa correta.","alts":["Tratada como psicogênica, desproporcional à lesão","Tratada como irradiada do nervo pudendo, sem gravidade","Desconsiderada, por ser apenas dor referida","Valorizada, por indicar extensão pelos planos fasciais"],"gab":3,"com":["Há infecção grave.","Não é irradiada.","Não é referida e é sinal de alarme.","Correta."],"imgs":[]}],"widgets":[{"id":"dor","titulo":"Classifique a dor","desc":"Associe cada caso à classificação pedida na prova.","cats":[["noc","Nociceptiva visceral"],["som","Somática profunda"],["ref","Referida"],["irr","Irradiada"],["neu","Neuropática"],["psi","Psicogênica"]],"cards":[["Dor precordial do IAM","noc"],["Cólica biliar há 2 h","noc"],["Braço esquerdo no IAM","ref"],["Ombro direito após laparoscopia","ref"],["Ciatalgia até o pé","irr"],["Zóster facial com disestesia","neu"],["Neuropatia diabética em bota","neu"],["Entorse de joelho há 2 dias","som"],["Dor difusa crônica, exames normais, depressão","psi"],["Ombro direito no TEP com pleura diafragmática","ref"]]}],"gl":[["Dor (IASP)","Experiência sensorial e emocional desagradável associada a lesão tecidual real ou potencial.",1],["Nociceptiva","Ativação de nociceptores; vias nervosas íntegras.",1],["Visceral","Dor de órgãos; vaga, difusa, mal localizada.",1],["Dor referida","Percebida longe da víscera, por convergência no mesmo segmento medular.",2],["Dor irradiada","Segue o trajeto de um nervo ou raiz.",2],["Disseminação fascial","Dor à distância por extensão da infecção (Fournier).",2],["Dor aguda","< 3 meses.",3],["Dor crônica","≥ 3 meses.",3],["Alodinia","Dor com estímulo normalmente indolor.",4],["Disestesia","Sensação anormal e desagradável.",4],["Dor psicogênica","Sem substrato anatômico; genuína; diagnóstico de exclusão.",4]],"vf":[["A dor no braço esquerdo do IAM é irradiada.",false,"É referida: não segue o trajeto de um nervo."],["Dor de 45 dias é aguda.",true,"Menos de 3 meses."],["Dor psicogênica é sinônimo de simulação.",false,"O sofrimento é genuíno."],["A dor da cólica biliar é nociceptiva.",true,"Ativação de nociceptores da víscera."],["A ciatalgia é exemplo de dor irradiada.",true,"Segue o trajeto do nervo isquiático."],["Na prova deste professor, dor de 2 meses é subaguda.",false,"A literatura adotada não usa subaguda: é aguda."]],"check":["Classificar dor por mecanismo (nociceptiva, neuropática, mista, psicogênica)","Classificar por origem (somática superficial, profunda, visceral)","Diferenciar referida × irradiada × disseminação fascial","Responder a discursiva do IAM (visceral; referida; referida)","Usar o corte de 3 meses para aguda × crônica, sem \"subaguda\"","Reconhecer dor neuropática (zóster) e as verdades sobre a psicogênica","Listar o decálogo da dor"],"resumo":[["Segmento 1","Nociceptiva (lesão tecidual), neuropática (lesão do sistema nervoso), mista, psicogênica. Somática superficial, profunda e visceral. Cólica biliar = nociceptiva."],["Segmento 2","Referida = convergência no segmento medular (IAM → braço e mandíbula; ombro na laparoscopia e no TEP). Irradiada = trajeto do nervo (ciatalgia). Fournier = disseminação fascial."],["Segmento 3","Decálogo da dor. Aguda < 3 meses; crônica ≥ 3 meses; sem subaguda. Entorse de joelho = aguda, somática profunda."],["Segmento 4","Neuropática: queimação, choque, alodinia, dermátomo (zóster). Psicogênica: sem substrato, genuína, mais transtornos do humor, multiprofissional."]],"freq":[["Cólica biliar: dor nociceptiva (visceral) aguda no hipocôndrio direito",4,"ED.4, P82.8, P81.8, P80.16"],["Dor psicogênica: existe, sem substrato anatômico nem exame que a defina",4,"ED.2, P82.11, P81.22, P80.5"],["Dor no membro do adolescente: classificar a duração (aguda)",3,"ED.3, P81.6, P80.8"],["Torção de joelho: dor aguda, somática profunda",3,"P82.10, P81.Torção-Joelho, P80.11"],["Dor percebida longe da origem: referida × irradiada",2,"ED.1, P82.3"],["Exemplos de dor neuropática (zóster) × referida (IAM)",2,"ED.5, P81.11"],["Dor abdominal: caracterizar todos os atributos do sintoma",1,"P81.14"],["Dor no ombro após videolaparoscopia: dor referida (diafragma)",1,"P82.21"],["Questão bônus: doença inflamatória pélvica e o tratamento empírico",1,"P81.7-Bônus"],["TEP com irritação diafragmática: dor aguda referida para o ombro",1,"P80.10"]],"cob":{"rk":{"t":"Classificar uma dor em três perguntas","c":["Onde nasce","Mecanismo","Onde é sentida","Quanto tempo"],"d":["<b>Onde nasce</b>: pele, estrutura profunda, víscera ou nervo.","<b>Mecanismo</b>: nociceptiva (tecido), neuropática (nervo) ou psicogênica.","<b>Onde é sentida</b>: no local, referida (outro ponto do mesmo segmento) ou irradiada (trajeto do nervo).","<b>Quanto tempo</b>: aguda (&lt; 3 meses) ou crônica (≥ 3 meses)."],"x":[["Miocárdio isquêmico","nociceptiva visceral","braço e mandíbula = referida","aguda"],["Raiz L5-S1","neuropática","coxa e perna = irradiada","aguda ou crônica"],["Ligamento do joelho","nociceptiva somática profunda","no local","aguda (2 dias)"]],"ex":"IAM: precordial visceral; braço esquerdo referida; mandíbula referida.","b":"Dor psicogênica: sem substrato, genuína, mais transtornos do humor, abordagem multiprofissional. Não é simulação."},"figs":[["dor-referida-irradiada","Referida (convergência no segmento) × irradiada (trajeto do nervo).","s2"],["dor-somatica-visceral","Somática bem localizada × visceral difusa.","s1"],["dor-zoster-colecistite","Zóster: dor neuropática no dermátomo.","s4"]],"keys":["p:colecisto","p:psico","p:cresc","p:joelho","p:dist","p:exemplos","p:abd","p:ombro","p:dip","p:tep"]}},{"id":"a5","num":5,"nome":"Exame cardiovascular I","tema":"Inspeção e palpação do precórdio, ictus cordis, focos e posições de ausculta, ciclo cardíaco, B1 e B2","segs":[{"id":"s1","titulo":"Inspeção e palpação do precórdio e o ictus cordis","html":"\n<p class=\"lead\">O exame do aparelho cardiovascular tem inspeção, palpação e ausculta. A percussão do coração caiu em desuso.</p>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Percussão: não precisa mais.\" E: <b>\"Não existe exame físico direcionado de aparelhos que prescinda do exame físico geral.\"</b> Antes do precórdio, olhe a ectoscopia (cianose, edema, turgência jugular, baqueteamento).</p></div>\n<h3>Movimentos e batimentos na inspeção e palpação</h3>\n<table class=\"cmp\"><tr><th>Achado</th><th>Significado</th></tr>\n<tr><td><mark class=\"f4\" data-refs=\"S77.1,S80.3,S79.4,S81.30\">Retração sistólica apical</mark></td><td>Hipertrofia de VD</td></tr>\n<tr><td><mark class=\"f2\" data-refs=\"S77.1,S80.3\">Levantamento em massa do precórdio</mark></td><td>Hipertrofia de VD</td></tr>\n<tr><td><mark class=\"f2\" data-refs=\"S77.1,S80.3\">Pulsações epigástricas</mark></td><td>Normal (comum em crianças e magros), HVD ou pulso hepático (sistólico na insuficiência tricúspide, pré-sistólico na estenose tricúspide)</td></tr>\n<tr><td>Choque valvar</td><td>Bulhas hiperfonéticas palpáveis</td></tr>\n<tr><td>Cliques de maior intensidade</td><td>Palpáveis em valvas sob alta pressão</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"hvd-movimentos\" alt=\"\"><figcaption>Movimentos do precórdio: na hipertrofia de VD a ponta passa a ser formada pelo VD, com retração sistólica apical, levantamento em massa do precórdio e pulsações epigástricas.</figcaption></figure>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Anotação do slide: \"Hipertrofia ventricular direita → pulsação epigástrica, levantamento do precórdio, retração sistólica apical\". A pulsação epigástrica é \"comum em crianças\".</p></div>\n<h3>Ictus cordis</h3>\n<p>O ictus é o <b>choque da ponta do coração</b> contra a parede torácica, produzido pela musculatura do <b>ventrículo esquerdo</b> na sístole. No normolíneo fica no <b>5º espaço intercostal esquerdo, sobre a linha hemiclavicular</b>.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ictus-biotipos\" alt=\"\"><figcaption>Posição normal do ictus segundo o biotipo: 4º EIC ~2 cm por fora da LHC no brevilíneo, 5º EIC na LHC no normolíneo e 6º EIC ~2 cm por dentro da LHC no longilíneo.</figcaption></figure>\n<p><mark class=\"f5\" data-refs=\"S77.7,S78.9,S79.5,S81.27,S77.13,S80.27,S81.9,S82.6,S82.9\">O biotipo muda a posição do ictus sem significar doença</mark>: brevilíneo no 4º EIC, por fora da LHC (coração horizontalizado); longilíneo no 6º EIC, por dentro (coração verticalizado).</p>\n<h3>O que avaliar na palpação</h3>\n<table class=\"cmp\"><tr><th>Característica</th><th>Normal</th><th>Alterado</th></tr>\n<tr><td>Localização</td><td>5º EIC na LHC (normolíneo)</td><td>Deslocado para baixo e para fora: dilatação do VE</td></tr>\n<tr><td>Extensão</td><td>1 a 2 polpas digitais</td><td><b>Mais de 2 polpas</b>: difuso (hipertrofia ou dilatação)</td></tr>\n<tr><td>Intensidade</td><td>Discreto</td><td><b>Propulsivo</b>: levanta a mão (hipertrofia do VE)</td></tr>\n<tr><td>Mobilidade</td><td>Desloca 1 a 2 cm com o decúbito lateral</td><td>Fixo: sínfise pericárdica</td></tr>\n<tr><td>Ritmo e frequência</td><td>Coincidem com o pulso</td><td>Irregulares nas arritmias</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ictus-palpacao\" alt=\"\"><figcaption>Palpação do ictus com a polpa dos dedos e, se preciso, em decúbito lateral esquerdo.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ictus-caracteristicas\" alt=\"\"><figcaption>Ictus propulsivo, deslocado e difuso: hipertrofia e dilatação do VE.</figcaption></figure>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A questão da HVD caiu duas vezes: no paciente com hipertrofia do <b>VD</b>, o esperado é retração sistólica apical, levantamento em massa do precórdio e pulsações epigástricas. Ictus propulsivo e desviado para baixo e para fora é do <b>VE</b>.</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Por que a ponta retrai na HVD? O VD hipertrofiado ocupa a ponta; quando ele se contrai na sístole, puxa a parede para dentro, em vez de empurrá-la como faria o VE.</p></div>","qs":{"p":[{"enun":"Paciente com estenose aórtica grave há anos. Ao palpar o precórdio, o ictus está no 6º EIC, 2 cm por fora da LHC, ocupa 3 polpas digitais e levanta a mão do examinador.","cmd":"Como descrever e interpretar o ictus?","alts":["Ictus fixo, que não muda com o decúbito: sínfise pericárdica","Retração sistólica apical: hipertrofia do ventrículo direito","Propulsivo, deslocado e difuso: hipertrofia e dilatação do VE","Normal, pois o ictus desce no paciente longilíneo"],"gab":2,"com":["Não foi descrita a mobilidade.","Retração apical é da HVD.","Correta. Sobrecarga de pressão do VE → hipertrofia; com o tempo, dilatação.","No longilíneo o ictus vai para dentro e não é propulsivo nem difuso."],"imgs":[]},{"enun":"Criança de 6 anos, magra, saudável, tem pulsação visível no epigástrio.","cmd":"Qual a interpretação mais provável?","alts":["Pulso hepático da insuficiência tricúspide","Hipertrofia de VD obrigatoriamente","Achado normal, comum em crianças e magros","Aneurisma de aorta abdominal"],"gab":2,"com":["O pulso hepático exige valvopatia tricúspide.","A HVD é uma das causas, mas não é obrigatória.","Correta. A pulsação epigástrica pode ser normal.","Improvável numa criança saudável."],"imgs":[]},{"enun":"Paciente de 30 anos, brevilíneo, sem doença cardíaca. O ictus está no 4º EIC, 2 cm por fora da LHC, ocupando 1 polpa.","cmd":"Qual a interpretação?","alts":["Normal para o biotipo","Dilatação do VE","Hi
