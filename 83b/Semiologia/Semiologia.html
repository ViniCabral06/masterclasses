1:5","prova":81,"item":5,"key":"C57","tema":"a3","seg":"s1","mod":"prova","enun":"Paciente adulto, no pronto-socorro: FC 110 bpm (contada pela ausculta cardíaca), temperatura axilar 38,2 °C, FR 24 irpm, PA 118/76 mmHg.","cmd":"Assinale a descrição correta dos dados vitais.","alts":["Taquisfígmico, subfebril e eupneico.","Taquicárdico, afebril e taquipneico.","Taquisfígmico, febril e bradipneico.","Taquicárdico, febril e taquipneico."],"gab":3,"com":["A FC foi contada no coração (taquicardia), 38,2 °C é febre e 24 irpm é taquipneia.","Acima de 37,8 °C já é febre.","FR de 24 é taquipneia, e a frequência foi contada no coração.","<b>Justificativa oficial:</b> Falamos em taquicardia quando a frequência cardíaca é medida diretamente no coração, seja por meio da palpação do ictus cordis ou pela ausculta cardíaca. Embora, em condições normais, o número de pulsações por minuto (ppm) seja equivalente ao número de batimentos cardíacos, podem ocorrer situações de dissociação pulso-ausculta, em que o número de batimentos difere do número de pulsações periféricas. O termo esfigmia é conceitualmente mais adequado para designar o pulso arterial (onda de pressão), distinguindo-o do batimento cardíaco em si. Em relação aos parâmetros vitais, considera-se o indivíduo febril quando apresenta temperaturas axilares acima de $37,8^\\circ\\text{C}$ (valor de referência que pode variar conforme a literatura). Já a taquipneia é definida como a frequência respiratória maior que $20$ incursões respiratórias por minuto (irpm)."],"imgs":[],"ed":0,"rec":1},{"id":"S81.6","jid":"S81:6","prova":81,"item":6,"key":"C53","tema":"a8","seg":"s1","mod":"prova","enun":"Registro do prontuário: \"Dados vitais: FC 52 bpm (contada pela ausculta cardíaca); FR 16 irpm; PA 120/80 mmHg; TAX 36,4 °C\".","cmd":"Acerca da frequência encontrada, assinale a alternativa correta.","alts":["Bradicardia, pois a contagem foi feita diretamente no exame cardíaco","Bradisfigmia, pois a frequência está abaixo de 60 por minuto","Normocardia, pois o limite inferior da normalidade é de 50 bpm","Bradisfigmia, pois a ausculta mede o pulso arterial central"],"gab":0,"com":["<b>Justificativa oficial:</b> A frequência cardíaca foi estabelecida através da ausculta. O termo correto é bradicardia, pois a medida foi estabelecida diretamente no exame cardíaco, e não do pulso periférico. A faixa de normalidade da FP e da FC em repouso é de $60$ a $100$ (ppm ou bpm). Frequências acima de $100$ são consideradas taqui (seja cardíaca ou esfígmica). Frequências abaixo de $60$ são consideradas bradi (seja cardíaca ou esfígmica). A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida através da análise dos batimentos por minuto (bpm), seja pela ausculta ou palpação do ictus. Bradi ou taquisfigmia é relativo ao pulso, e é medido pelo número de pulsações por minuto (ppm). A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que o pulso é um fenômeno físico sempre relacionado a um batimento cardíaco. Embora na maioria dos casos seus valores numéricos realmente sejam equivalentes, ou iguais, e que fisiologicamente eles estão inter-relacionados - o pulso depende de um batimento eficaz para ser produzido.","Bradisfigmia é do pulso; aqui foi contado o coração.","O limite inferior é 60.","A ausculta conta batimentos (bpm), não pulsações."],"imgs":[],"ed":0,"rec":1},{"id":"S81.7","jid":"S81:7","prova":81,"item":7,"key":"C1","tema":"a6","seg":"s1","mod":"prova","enun":"Homem de 58 anos faz eletrocardiograma pré-operatório que mostra bloqueio completo de ramo direito (BRD). Está assintomático. Na ausculta cardíaca, o aluno procura alterações das bulhas.","cmd":"Qual o comportamento esperado das bulhas nesse paciente?","alts":["Desdobramento de B2 fixo, de mesma intensidade na inspiração e na expiração","Desdobramento de B1 e de B2, persistente e variável, acentuado na inspiração","Desdobramento invertido de B2, audível na expiração e ausente na inspiração","Retração apical sistólica e pulso paradoxal, sem alteração das bulhas"],"gab":1,"com":["Desdobramento fixo, que não varia com a respiração, é o da CIA.","<b>Justificativa oficial:</b> O bloqueio de ramo direito pode levar ao retardo do fechamento do componente tricúspide de $B_1$, fisiologicamente já atrasado em relação ao mitral, levando ao desdobramento de $B_1$. O mesmo princípio se aplica a $B_2$: o BRD leva ao retardo do fechamento do componente pulmonar de $B_2$, fisiologicamente já atrasado em relação ao componente aórtico. Fato que se exacerba durante a inspiração (pelo aumento do retorno venoso e aumento do trabalho do coração direito), levando a aumentar o desdobramento - tornando-o persistente (inspiratório e expiratório) e variável (melhor audível ou exacerbado na inspiração). A retração apical pode ser encontrada em casos de Hipertrofia Ventricular Direita, e o pulso paradoxal foi colocado como distrator.","Desdobramento invertido (paradoxal) é o do BRE: o componente aórtico atrasa.","A retração apical é da HVD e o pulso paradoxal foi colocado como distrator na justificativa oficial."],"imgs":[],"ed":0,"rec":1},{"id":"S81.8","jid":"S81:8","prova":81,"item":8,"key":"C45","tema":"a3","seg":"s2","mod":"prova","enun":"Na avaliação do estado nutricional de um paciente, durante o exame físico geral ou ectoscopia, analise as assertivas:<br>1. Constatação de uma grande variação de peso (cerca de 5 kg) em um curto período (menos de 24 horas), obtida pela pesagem.<br>2. Proeminência de relevos ósseos.<br>3. Alterações na coloração, brilho e textura de pele e fâneros.<br>4. Sarcopenia.","cmd":"Podem ser consideradas parâmetros de avaliação do estado nutricional na ectoscopia:","alts":["1, 2, 3 e 4.","1 e 2.","1, 3 e 4.","2, 3 e 4."],"gab":3,"com":["A 1 está errada: 5 kg em menos de 24 h é mobilização de líquido, e pesar não é estritamente ectoscopia.","A 1 está errada e a 3 e a 4 estão corretas.","A 1 está errada pelo mesmo motivo.","<b>Justificativa oficial:</b> Grandes variações de peso em curtos períodos de tempo podem estar mais relacionadas à mobilização de líquidos. Pesar o paciente não é, estritamente, ectoscopia."],"imgs":[],"ed":0,"rec":1},{"id":"S81.9","jid":"S81:9","prova":81,"item":9,"key":"C12","tema":"a3","seg":"s2","mod":"prova","enun":"O estudo do biotipo corporal (longilíneo, brevilíneo e normolíneo) possui grande relevância clínica e semiológica, como ilustrado na figura.<br>I. Há maior incidência de pneumotórax espontâneo em jovens longilíneos do sexo masculino, em relação à população geral.<br>II. Há variações normais da posição do ictus nos diferentes biotipos, sem necessariamente significar alterações.<br>III. Conhecer o biotipo permite uma melhor interpretação de exames de imagem, minimizando interpretações equivocadas.","cmd":"Assinale a alternativa que contém as afirmações corretas.","alts":["I e II.","II e III.","I, II e III.","I."],"gab":2,"com":["Falta a III: a conformação de cada biotipo pode confundir a leitura de exames de imagem.","Falta a I: jovens longilíneos do sexo masculino têm mais pneumotórax espontâneo.","<b>Justificativa oficial:</b> O ictus cordis pode estar desviado, de forma normal, até $2,0\\text{ cm}$ para direita da linha hemiclavicular (LH) e para o $4^\\circ$ espaço intercostal esquerdo (EIE) em indivíduos longilíneos, bem como para o $5^\\circ$ EIE e $2,0\\text{ cm}$ para esquerda da LH em indivíduos brevilíneos. Indivíduos jovens, do sexo masculino e longilíneos apresentam maior predisposição, em relação à população geral, a desenvolverem pneumotórax espontâneo, embora a fisiopatologia não seja bem conhecida. Características particulares da conformação anatômica normal de cada biótipo podem confundir a interpretação de exames de imagem, devendo sempre considerar sua potencial interferência na análise desses exames.","Faltam a II e a III, ambas corretas."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S81.10","jid":"S81:10","prova":81,"item":10,"key":"C9","tema":"a11","seg":"s2","mod":"prova","enun":"Paciente relata falta de ar que surge quando se levanta da cama e fica em pé, e que melhora quando volta a deitar-se de costas. Ao contrário do que ocorre no edema agudo de pulmão, ele não tolera a posição ortostática.","cmd":"Esse tipo de dispneia denomina-se:","alts":["Platipneia.","Ortopneia.","Trepopneia.","Dispneia paroxística noturna."],"gab":0,"com":["<b>Justificativa oficial:</b> Nome dado à dispneia que - ao contrário da dispneia do edema agudo de pulmão (Ortopneia) - piora com a posição ortostática: Platipneia. A Trepopneia relaciona-se à dispneia que piora ou melhora com determinado decúbito lateral.","Ortopneia é a dispneia que piora deitado e alivia sentado ou em pé, como no edema agudo de pulmão.","Trepopneia é a dispneia que muda com o decúbito lateral.","A dispneia paroxística noturna acorda o paciente e se relaciona à ortopneia."],"imgs":[],"ed":0,"rec":1},{"id":"S81.12","jid":"S81:12","prova":81,"item":12,"key":"C37","tema":"a11","seg":"s1","mod":"prova","enun":"Nome dado à cianose que tende a melhorar com a oferta de oxigênio (O<sub>2</sub>) suplementar.","cmd":"Assinale uma alternativa.","alts":["Cianose central.","Cianose periférica.","Cianose por metemoglobinemia.","Cianose segmentar por estase venosa."],"gab":0,"com":["<b>Justificativa oficial:</b> As cianoses que cursam com déficits de bomba (circulatória Q; ventilatória V), em seus mais diferentes níveis (tecidual, orgânico etc.) são denominadas de centrais. Por cursarem com hipoxemia (baixa quantidade de $\\text{O}_2$ no sangue - ligado à Hb), elas tendem a responder melhor à oferta de $\\text{O}_2$ suplementar.","A periférica é de baixo fluxo (o sangue chega saturado); melhora com calor e massagem, não com O2.","Na hemoglobinopatia o problema é a hemoglobina anormal; o O2 não corrige.","A estase venosa é periférica e localizada; não responde ao O2."],"imgs":[],"ed":1,"rec":1},{"id":"S81.13","jid":"S81:13","prova":81,"item":13,"key":"C23","tema":"a7","seg":"s2","mod":"prova","enun":"Considerando os principais sinais e sintomas da estenose aórtica, analise as seguintes assertivas:<br>I) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar sintomas de dor cardíaca isquêmica.<br>II) Em função da dificuldade de adaptação a novas demandas metabólicas em órgãos-alvo, o paciente pode queixar-se de sensação de escurecimento visual e sensação pré-sincopal.<br>III) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar ictus propulsivo.<br>IV) Em função da lesão valvar, espera-se encontrar, à ausculta, um sopro diastólico ejetivo melhor audível no foco aórtico.","cmd":"Assinale a opção que contém as assertivas corretas.","alts":["Estão corretas as assertivas I, II, III e IV.","Estão corretas as assertivas II e IV.","Estão corretas as assertivas I, II e III.","Estão corretas as assertivas I e III."],"gab":2,"com":["A IV está errada: o sopro da estenose aórtica é sistólico (ejetivo), não diastólico.","A IV está errada e a I é correta (angina pela hipertrofia).","<b>Justificativa oficial:</b> O sopro esperado na estenose aórtica é sistólico, tornando incorreta a assertiva IV.","Falta a II: o débito fixo causa pré-síncope e escurecimento visual no esforço."],"imgs":[],"ed":1,"rec":1},{"id":"S81.14","jid":"S81:14","prova":81,"item":14,"key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável), esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som broncovesicular.","Som claro pulmonar.","Som timpânico.","Som maciço."],"gab":0,"com":["<b>Justificativa oficial:</b> Som broncovesicular é som de ausculta, que pode ser considerado normal a depender do sítio examinado. Os demais sons, embora possam ser considerados normais a depender do sítio examinado, referem-se a sons produzidos pela percussão torácica e não à ausculta.","Claro pulmonar é normal, mas é som de percussão, não de ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"ed":1,"rec":1},{"id":"S81.15","jid":"S81:15","prova":81,"item":15,"key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório.<br>Em um paciente portador de pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax.","cmd":"Os achados esperados no lado do pneumotórax, referentes à palpação (frêmito toracovocal, FTV), percussão e ausculta para este paciente são, respectivamente:","alts":["FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":0,"com":["<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolida pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líquido); no pneumotórax há ar e o som é timpânico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"ed":1,"rec":1},{"id":"S81.16","jid":"S81:16","prova":81,"item":16,"key":"C59","tema":"a12","seg":"s6","mod":"prova","enun":"O diagnóstico sindrômico pode auxiliar na construção do diagnóstico etiológico (ou nosológico) específico. Citam-se, como exemplos, as diversas afecções abdominais que podem ser categorizadas, inicialmente, em síndromes (abdome obstrutivo, abdome inflamatório, abdome perfurativo e abdome vascular), para posterior diagnóstico da patologia de base.","cmd":"Acerca do diagnóstico geral ou sindrômico das afecções respiratórias, a ASMA é classificada como uma doença:","alts":["Obstrutiva.","Restritiva.","Parenquimatosa.","Mista, obstrutiva e restritiva."],"gab":0,"com":["<b>Justificativa oficial:</b> A ASMA é uma condição inflamatória crônica com períodos de exacerbação, caracterizada pela obstrução (notadamente ao fluxo expiratório) das vias aéreas.","A asma limita o fluxo expiratório; não reduz o volume pulmonar.","A asma é doença das vias aéreas, não do parênquima.","Na asma o padrão é obstrutivo."],"imgs":[],"ed":1,"rec":1},{"id":"S81.17","jid":"S81:17","prova":81,"item":17,"key":"C42","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo com a construção do raciocínio clínico.","cmd":"Aponte a localização esperada no ciclo cardíaco do seguinte achado auscultatório: quarta bulha cardíaca (B4).","alts":["Localizada na diástole, na fase de enchimento rápido.","Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na sístole, logo após o fechamento das valvas AV.","Localizada entre B1 e B2, coincidente com a ejeção ventricular."],"gab":1,"com":["Diástole com enchimento rápido é a posição da B3.","<b>Justificativa oficial:</b> $B_4$ relaciona-se à sobrecarga pressórica, podendo ser auscultada no final da diástole (coincidente com a contração atrial), no período - também - denominado de fase pré-sistólica (ainda na diástole). Relaciona-se a sobrecargas pressóricas.","A B4 vem antes da B1, não depois.","Entre B1 e B2 é sístole; a B4 é telediastólica."],"imgs":[],"ed":1,"rec":1},{"id":"S81.18","jid":"S81:18","prova":81,"item":18,"key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnosticada e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e o ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais: 1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?; 2. derrame pleural à direita, de etiologia tromboembólica? O raio X de tórax confirmou a presença do volumoso derrame pleural à direita.<br>Acerca do exame físico dessa paciente, analise as seguintes assertivas.<br>I) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.<br>II) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.<br>III) Espera-se encontrar uma percussão submaciça no lado acometido.<br>IV) Espera-se encontrar sons respiratórios diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas:","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, e a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando à limitação dos movimentos (expansibilidade) no hemitórax acometido. Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta. Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"ed":1,"rec":1},{"id":"S81.19","jid":"S81:19","prova":81,"item":19,"key":"C17","tema":"a12","seg":"s6","mod":"prova","enun":"A ASMA é definida como uma doença inflamatória crônica das vias aéreas, com períodos agudos de exacerbação, caracterizados por broncoespasmo e exacerbação inflamatória.<br>Analise as seguintes afirmações:<br>1) tosse crônica, exacerbada nos períodos noturnos/madrugada;<br>2) dispneia de instalação aguda e autopercepção de \"chieira\" torácica, nos períodos de exacerbação;<br>3) instalação e progressão lenta da obstrução das vias aéreas, permitindo a adaptação gradual do paciente ao novo estado patológico e a subvalorização de sintomas, retardando a procura do paciente ao médico assistente, muitas vezes por anos. Razão pela qual a procura por assistência ocorre quando a doença encontra-se em fases avançadas.","cmd":"Assinale a opção que contém as afirmações pertinentes à ASMA.","alts":["As afirmações 1 e 2 estão corretas.","As afirmações 1, 2 e 3 estão corretas.","As afirmações 2 e 3 estão corretas.","Apenas a afirmação 3 está correta."],"gab":0,"com":["<b>Justificativa oficial:</b> Os períodos de agudização na ASMA são súbitos, levando o paciente a um novo grau de obstrução das vias aéreas, sem tempo hábil para o paciente se adaptar ao novo estado. Os pacientes costumam procurar assistência imediata durante as crises agudas, cabendo ao médico o entendimento que trata-se de doença crônica, devendo estar atento que, para além do tratamento da crise aguda, há a necessidade de avaliar o tratamento da doença crônica.","A 3 descreve a DPOC: na asma a agudização é súbita e o paciente procura ajuda na hora.","A 3 é da DPOC, de progressão lenta e procura tardia.","A 3 não descreve asma."],"imgs":[],"ed":1,"rec":1},{"id":"S81.20","jid":"S81:20","prova":81,"item":20,"key":"C51","tema":"a8","seg":"s2","mod":"prova","enun":"Homem de 68 anos com fibrilação atrial crônica é examinado na enfermaria pelo aluno.","cmd":"Quais achados são esperados na ausculta e na palpação do pulso?","alts":["Ritmo regular, B1 constante, B4 presente e pulso igual ao número de batimentos","Ritmo irregular, B1 constante, B4 hiperfonética e pulso de amplitude aumentada","Ritmo irregular, fonese variável de B1, ausência de B4 e dissociação pulso-ausculta","Ritmo regular em três tempos por B4, com B1 em canhão e pulso lento e amplo"],"gab":2,"com":["Na FA o ritmo é irregular e não há B4, porque não há contração atrial.","A B1 varia e a B4 desaparece na FA.","<b>Justificativa oficial:</b> Na fibrilação atrial, há perda da contração atrial organizada, o que leva ao desaparecimento da bulha $B_4$ e a um ritmo irregular, auscultado como um ritmo \"caótico\". A fonese variável da primeira bulha ocorre devido à variação nos intervalos entre as sístoles ventriculares, e a dissociação pulso-ausculta (quando nem todas as bulhas correspondem a um pulso periférico) decorre de contrações ventriculares fracas ou muito próximas umas das outras, que não geram débito suficiente para serem percebidas no pulso.","B1 em canhão e pulso lento e amplo são do BAVT."],"imgs":[],"ed":0,"rec":1},{"id":"S81.21","jid":"S81:21","prova":81,"item":21,"key":"C41","tema":"a3","seg":"s3","mod":"prova","enun":"O termo \"fácies atípica\", consagrado na medicina para designar a fácies normal, pode gerar confusão com as atipias celulares. Por isso alguns autores preferem uma sinonímia igualmente consagrada.","cmd":"Qual é essa sinonímia?","alts":["Fácies hipocrática.","Fácies incaracterística.","Fácies típica.","Fácies inexpressiva."],"gab":1,"com":["Hipocrática é a fácies do paciente grave, em fase terminal.","<b>Justificativa oficial:</b> Atípico é formado pelo prefixo \"a\" (não, sem) + \"típico\" (característico, comum). Para a descrição da fácies, literalmente a palavra designa um conjunto de elementos faciais não característico (ou não típico/não comum) de uma doença. Embora a expressão fácies atípica esteja consagrada na medicina para designação da fácies normal (Gauss), alguns autores chamam a atenção para um possível potencial de confusão, por exemplo, com as atipias celulares (que designam alterações ou desvios da normalidade). Fácies incaracterística é a sinonímia, igualmente consagrada, para designar esse tipo facial.","\"Típica\" seria característica de uma doença: é o oposto.","Fácies inexpressiva (em máscara) é a parkinsoniana."],"imgs":[],"ed":0,"rec":1},{"id":"S81.22","jid":"S81:22","prova":81,"item":22,"key":"C60","tema":"a3","seg":"s3","mod":"prova","enun":"Mulher de 42 anos, com lúpus, usa prednisona há mais de um ano. Observe a fácies na imagem: rosto arredondado, rubor, acne e aumento de pelos.","cmd":"Qual é o tipo de fácies?","alts":["Fácies mixedematosa.","Fácies acromegálica.","Fácies renal.","Fácies cushingoide."],"gab":3,"com":["Mixedematosa (hipotireoidismo): face pálida, infiltrada, apática, com edema palpebral e perda do terço externo das sobrancelhas.","Acromegálica: proeminência de mandíbula, nariz, lábios e arcos supraorbitários.","Renal: edema palpebral bilateral e palidez, sem rubor ou hirsutismo.","<b>Justificativa oficial:</b> Fácies cushingoide, típica da síndrome de Cushing ou do uso prolongado de corticoides."],"imgs":["q-cushingoide"],"ed":0,"rec":1},{"id":"S81.23","jid":"S81:23","prova":81,"item":23,"key":"C11","tema":"a1","seg":"s1","mod":"prova","enun":"Em prontuários, laudos e atestados, é comum a expressão \"ao exame clínico\". O professor pergunta à turma o que exatamente esse termo engloba.","cmd":"O exame clínico é definido pelo conjunto de informações obtidas por meio de:","alts":["Anamnese e exame físico.","Exame físico, exclusivamente.","Anamnese, exame físico e exames complementares.","Ectoscopia e dados vitais."],"gab":0,"com":["<b>Justificativa oficial:</b> Exame clínico é definido pelo conjunto de informações obtidas pela anamnese e exame físico.","O exame físico é só uma das partes; os sintomas vêm da anamnese.","Exames complementares não fazem parte do exame clínico.","Ectoscopia e dados vitais são partes do exame físico geral."],"imgs":[],"ed":0,"rec":1},{"id":"S81.24","jid":"S81:24","prova":81,"item":24,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S81.25","jid":"S81:25","prova":81,"item":25,"key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias, desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope, alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio.<br>Analise as seguintes assertivas.<br>1. Ausência de pródromos ou gatilhos detectáveis.<br>2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.<br>3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em indivíduo jovem (adolescente/adulto jovem) previamente hígido.<br>4. Histórico de cardiopatia de base conhecida pelo médico e paciente.","cmd":"São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas:","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vaso-vagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"ed":1,"rec":1},{"id":"S81.26","jid":"S81:26","prova":81,"item":26,"key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido (até recentemente denominado de paradoxal) da segunda bulha (B2), analise as seguintes assertivas.<br>1. O desdobramento ocorre na fase expiratória.<br>2. O bloqueio completo de ramo esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.<br>3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.<br>4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As assertivas 1, 2 e 3 estão corretas.","As assertivas 1 e 2 estão corretas.","As assertivas 2 e 4 estão corretas.","As assertivas 3 e 4 estão corretas."],"gab":1,"com":["A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; não é persistente.","<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","Ambas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"ed":1,"rec":1},{"id":"S81.27","jid":"S81:27","prova":81,"item":27,"key":"C6","tema":"a5","seg":"s1","mod":"prova","enun":"Três estudantes saudáveis servem de modelo na aula prática de exame do precórdio. O indivíduo A é brevilíneo, o B é normolíneo e o C é longilíneo, como na figura.","cmd":"Assinale a correlação correta entre o biotipo e a posição em que se espera palpar o ictus cordis.","alts":["A: 4º EIC, lateral à LHC; B: 5º EIC, sobre a LHC; C: 6º EIC, medial à LHC","A: 6º EIC, medial à LHC; B: 5º EIC, sobre a LHC; C: 4º EIC, lateral à LHC","A, B e C: 5º EIC, sobre a LHC, pois o biotipo não altera a posição do ictus","A: 5º EIC, sobre a LHC; B: 4º EIC, lateral à LHC; C: 6º EIC, medial à LHC"],"gab":0,"com":["<b>Justificativa oficial:</b> Em indivíduos longilíneos (C) o ictus pode estar deslocado medialmente e para baixo ($6^\\circ$ EIC, $2\\text{ cm}$ da linha hemiclavicular medialmente). Nos indivíduos brevilíneos (A) o ictus pode estar deslocado lateralmente ($2,0\\text{ cm}$ da linha hemiclavicular para esquerda) e para cima ($4^\\circ$ EIC). Nos indivíduos normolíneos (B) o ictus habitualmente é palpado no $5^\\circ$ EIC, sob a linha hemiclavicular esquerda.","Inverteu brevilíneo e longilíneo: no longilíneo o coração verticaliza e o ictus desce e vai para dentro.","O biotipo muda a posição normal do ictus, sem significar doença.","O normolíneo é o que tem ictus no 5º EIC sobre a linha hemiclavicular (LHC)."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S81.28","jid":"S81:28","prova":81,"item":28,"key":"C49","tema":"a2","seg":"s1","mod":"prova","enun":"Analise as afirmações sobre os componentes da anamnese:<br>I) Na Revisão de Sistemas (Interrogatório Sintomatológico) busca-se, de forma detalhada, a existência ou a ausência de sintomas.<br>II) Na Queixa Principal, deve-se preferir palavras ou frases curtas, nas palavras do paciente, sempre que possível.<br>III) Em situações de urgência, os demais elementos da anamnese podem ser dispensados, bastando a queixa principal.<br>IV) A História Familiar registra a presença ou a ausência de situações mórbidas ou de interesse para a saúde nos familiares do paciente.","cmd":"Estão corretas as afirmações:","alts":["I, II, III e IV.","I e III.","I, II e IV.","II, III e IV."],"gab":2,"com":["A III está errada: mesmo na urgência os demais elementos são fundamentais, feitos de forma direcionada.","A III está errada.","<b>Justificativa oficial:</b> Na Revisão de Sistemas - também denominada Interrogatório Sintomatológico - busca-se de forma detalhada a existência ou ausência de sintomas (não confundir com sinais). Na Queixa Principal deve-se preferir frases ou palavras curtas, nas palavras do paciente, sempre que possível. Mesmo em situações especiais (urgências, por exemplo), os demais elementos componentes da anamnese são fundamentais, mesmo que realizados de forma mais direcionada para a situação. Na História Patológica Pregressa - ou antecedentes pessoais - buscam-se informações de interesse médico (patológicas ou não) diretamente relacionadas ao paciente. A História Familiar registra a ausência ou presença de situações mórbidas, patológicas ou de interesse para saúde, nos familiares do paciente.","A III está errada e a I está correta."],"imgs":[],"ed":0,"rec":1},{"id":"S81.29","jid":"S81:29","prova":81,"item":29,"key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam, de forma involuntária, a resistência vascular periférica.","cmd":"Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente ao assumir a posição de cócoras?","alts":["Shunt arteriovenoso, direita-esquerda.","Shunt arteriovenoso, esquerda-direita.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":0,"com":["<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrógrada a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (shunt) que cursam com passagem de sangue da direita para a esquerda.","No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"ed":1,"rec":1},{"id":"S81.30","jid":"S81:30","prova":81,"item":30,"key":"C40","tema":"a5","seg":"s1","mod":"prova","enun":"Paciente com estenose pulmonar grave e hipertrofia de ventrículo direito. À inspeção do precórdio, observa-se, a cada sístole, uma depressão na região apical, onde se esperaria o ictus.","cmd":"Esse achado decorre de:","alts":["Hipertrofia do VE, que desloca o ictus para baixo e para fora da linha hemiclavicular","Derrame pericárdico, que afasta o coração da parede torácica e apaga o ictus","Biotipo longilíneo, que verticaliza o coração e desloca o ictus para cima","A ponta do coração passar a ser formada pelo VD, com retração sistólica apical"],"gab":3,"com":["A hipertrofia do VE dá ictus propulsivo e desviado, não retração.","O derrame apaga o ictus, mas não produz retração sistólica.","No longilíneo o ictus desce (6º EIC) e vai para dentro; não retrai.","<b>Justificativa oficial:</b> O ictus está relacionado ao choque da ponta cardíaca, habitualmente composta por musculatura do ventrículo esquerdo (VE). Em casos de HVD a ponta do coração passa a ser composta pela musculatura do VD, levando ao fenômeno observado de retração sistólica apical."],"imgs":[],"ed":0,"rec":1},{"id":"S81.31","jid":"S81:31","prova":81,"item":31,"key":"C22","tema":"a12","seg":"s6","mod":"prova","enun":"Tórax em tonel, tosse diária produtiva e volumosa, cianose facial e dispneia crônica progressiva (de instalação gradativa durante anos).","cmd":"Qual padrão sindrômico respiratório, e qual fenótipo, melhor representariam os sinais e sintomas acima listados?","alts":["Síndrome obstrutiva. Fenótipo \"soprador rosa\".","Síndrome restritiva. Fenótipo \"congesto azulado\".","Síndrome restritiva. Fenótipo \"soprador rosa\".","Síndrome obstrutiva. Fenótipo \"congesto azulado\"."],"gab":3,"com":["O soprador rosa tem pele rósea, pouca secreção e emagrecimento; aqui há cianose e secreção volumosa.","A DPOC é obstrutiva, não restritiva.","A DPOC é obstrutiva, e o fenótipo com cianose e secreção é o congesto azulado.","<b>Justificativa oficial:</b> Os sintomas descritos estão classicamente relacionados às síndromes obstrutivas (DPOC, notadamente). Dentre os extremos fenotípicos das DPOC(s) temos o padrão \"soprador rosa\", que cursa com tonalidade de pele rósea, diminuição do panículo adiposo, sarcopenia e \"pouca\" congestão (secreção), pois predomina o enfisema (doença parenquimatosa). O \"congesto azulado\" descreve justamente a cianose (azulado) e a congestão (secretivo bronquítico). Ambas classificadas como doenças funcionalmente obstrutivas, sendo o soprador rosa portador de uma afecção predominantemente parenquimatosa (enfisema), e o congesto azulado portador de uma afecção predominantemente das vias respiratórias. Atente-se que, na prática, habitualmente encontramos graus intermediários entre esses extremos fenotípicos, associando enfisema (parênquima) e obstrução inflamatória (vias aéreas) em diferentes níveis."],"imgs":[],"ed":1,"rec":1},{"id":"S82.1","jid":"S82:1","prova":82,"item":1,"key":"C19","tema":"a6","seg":"s2","mod":"prova","enun":"Hipertenso de longa data, com hipertrofia ventricular esquerda, tem um som grave logo antes da B1 na ausculta do foco mitral com a campânula.","cmd":"A quarta bulha (B4) relaciona-se a qual tipo de sobrecarga e a qual momento do ciclo cardíaco?","alts":["Sobrecarga volumétrica; início da diástole, no enchimento ventricular rápido","Sobrecarga pressórica; final da diástole, coincidente com a sístole atrial","Sobrecarga pressórica; início da sístole, junto ao fechamento da valva mitral","Sobrecarga volumétrica; final da sístole, durante a ejeção ventricular"],"gab":1,"com":["Sobrecarga de volume e enchimento rápido descrevem a B3.","<b>Justificativa oficial:</b> B4 relaciona-se a sobrecarga pressórica, podendo ser auscultada no período tele-diastólico (final da diástole ou fase pré-sístole), coincidente com a sístole atrial.","O início da sístole é a própria B1; a B4 é telediastólica.","A B4 não é sistólica nem de volume."],"imgs":[],"ed":0,"rec":1},{"id":"S82.2","jid":"S82:2","prova":82,"item":2,"key":"C16","tema":"a12","seg":"s6","mod":"prova","enun":"Homem de 64 anos, tabagista de 50 anos-maço, tem tosse crônica produtiva com expectoração volumosa todos os dias, cianose facial e edema de membros inferiores. Não está emagrecido.","cmd":"Qual fenótipo melhor descreve esse paciente?","alts":["Congesto azulado.","Soprador rosa.","Asmático em crise.","Restritivo intersticial."],"gab":0,"com":["<b>Justificativa oficial:</b> A tosse crônica e produtiva (<b>congestão</b>), a cianose facial (<b>azul</b>) permitem inferir o fenótipo \"Congesto azulado\".","O soprador rosa é emagrecido, sarcopênico, rosado e tem pouca secreção (predomina enfisema).","A asma tem crises súbitas e variáveis, não tosse produtiva diária com cianose crônica.","O quadro é obstrutivo (bronquite crônica), não restritivo."],"imgs":[],"ed":0,"rec":1},{"id":"S82.3","jid":"S82:3","prova":82,"item":3,"key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam, de forma involuntária, a resistência vascular periférica.","cmd":"Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente ao assumir a posição de cócoras?","alts":["Shunt arteriovenoso, direita-esquerda.","Shunt arteriovenoso, esquerda-direita.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":0,"com":["<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrógrada a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (<i>shunt</i>) que cursam com passagem de sangue da direita para a esquerda.","No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"ed":1,"rec":1},{"id":"S82.4","jid":"S82:4","prova":82,"item":4,"key":"C14","tema":"a12","seg":"s6","mod":"prova","enun":"Mulher de 23 anos, asmática, chega ao pronto-socorro em crise. O pico de fluxo expiratório (medido com o aparelho portátil peak flow) é de 45% do previsto. Após o tratamento, sobe para 85% do previsto.","cmd":"Assinale a interpretação correta.","alts":["A asma é restritiva, e o aumento do pico de fluxo indica ganho de volume pulmonar total","A asma é obstrutiva, e o aumento do pico de fluxo indica melhora objetiva da obstrução","A asma é obstrutiva, mas o pico de fluxo não serve para acompanhar a resposta ao tratamento","A asma é parenquimatosa, e o aumento do pico de fluxo indica reabsorção de edema alveolar"],"gab":1,"com":["A asma não é restritiva: limita o fluxo expiratório, não o volume pulmonar.","<b>Justificativa oficial:</b> A ASMA é uma doença inflamatória crônica das vias aéreas, com períodos de exacerbação. A ASMA pode ser classificada como uma doença obstrutiva ao fluxo (e volume) expiratório. O aumento do pico de fluxo, aferido por um instrumento portátil - denominado <i>Peak Flow</i> - pode denotar melhora objetiva do padrão obstrutivo, notadamente quando a medida atinge níveis percentuais próximos àqueles esperados para o paciente hígido, ou próximos ao nível do paciente asmático controlado.","O peak flow é justamente a forma objetiva e portátil de ver a melhora da obstrução.","A asma é doença das vias aéreas, não do parênquima; não há edema alveolar."],"imgs":[],"ed":0,"rec":1},{"id":"S82.5","jid":"S82:5","prova":82,"item":5,"key":"C34","tema":"a6","seg":"s3","mod":"prova","enun":"Gestante de 30 semanas, sem cardiopatia, tem ritmo em três tempos na ausculta, sem as características de galope. Na mesma enfermaria, um paciente com insuficiência cardíaca descompensada tem B3 em galope.","cmd":"Sobre a terceira bulha (B3), assinale a alternativa correta.","alts":["Ocorre na pré-sístole; o galope é atrial e a B3 é sempre patológica na gestação","Ocorre no enchimento rápido; o galope é atrial e indica sobrecarga de pressão","Ocorre no enchimento rápido; o galope é ventricular e pode haver B3 fisiológica na gestação","Ocorre na sístole; o galope é ventricular e indica estenose aórtica grave"],"gab":2,"com":["Pré-sístole e galope atrial são da B4; e a B3 pode ser fisiológica na gestação.","O galope por B3 é ventricular, e a B3 é de volume, não de pressão.","<b>Justificativa oficial:</b> B3 relaciona-se a fase de enchimento rápido (início da diástole). Podendo estar presente em condições que cursam com sobrecarga volumétrica. O ritmo tríplice de galope por B3 é conhecido como galope ventricular. Já o ritmo de três tempos, por adição de B3, sem as características auscultatórias de galope, pode ser audível em algumas condições fisiológicas, como na gestação.","A B3 é diastólica (enchimento rápido), não sistólica."],"imgs":[],"ed":0,"rec":1},{"id":"S82.6","jid":"S82:6","prova":82,"item":6,"key":"C6","tema":"a5","seg":"s1","mod":"prova","enun":"Três estudantes saudáveis servem de modelo na aula prática de exame do precórdio. O indivíduo A é brevilíneo, o B é normolíneo e o C é longilíneo, como na figura.","cmd":"Assinale a correlação correta entre o biotipo e a posição em que se espera palpar o ictus cordis.","alts":["A: 4º EIC, lateral à LHC; B: 5º EIC, sobre a LHC; C: 6º EIC, medial à LHC","A: 6º EIC, medial à LHC; B: 5º EIC, sobre a LHC; C: 4º EIC, lateral à LHC","A, B e C: 5º EIC, sobre a LHC, pois o biotipo não altera a posição do ictus","A: 5º EIC, sobre a LHC; B: 4º EIC, lateral à LHC; C: 6º EIC, medial à LHC"],"gab":0,"com":["<b>Justificativa oficial:</b> Em indivíduos longilíneos (C) o ictus pode estar deslocado medialmente e para baixo (6º EIC, 2 cm da linha hemiclavicular medialmente). Nos indivíduos brevilíneos (A) o ictus pode estar deslocado lateralmente (2,0 cm da linha hemiclavicular para esquerda) e para cima (4º EIC). Nos indivíduos normolíneos (B) o ictus habitualmente é palpado no 5º EIC, sob a linha hemiclavicular esquerda.","Inverteu brevilíneo e longilíneo: no longilíneo o coração verticaliza e o ictus desce e vai para dentro.","O biotipo muda a posição normal do ictus, sem significar doença.","O normolíneo é o que tem ictus no 5º EIC sobre a linha hemiclavicular (LHC)."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S82.7","jid":"S82:7","prova":82,"item":7,"key":"C61","tema":"a11","seg":"s1","mod":"prova","enun":"Acerca da cianose, habitualmente pesquisada em mucosas e extremidades, foram feitas as afirmações abaixo.","cmd":"Assinale a alternativa correta.","alts":["É sinal precoce de hipoxemia: surge antes da taquicardia e da taquipneia, com cerca de 2% de desoxi-hemoglobina","A cianose central, por falha da bomba ventilatória ou circulatória, costuma não responder ao O<sub>2</sub> suplementar","A cianose das extremidades ao frio é patológica e, por ser periférica, melhora com O<sub>2</sub> suplementar","A compressão venosa extrínseca de um segmento, por uma neoplasia, causa cianose segmentar e periférica"],"gab":3,"com":["A cianose é sinal tardio: surge com cerca de 5% (≈5 g/dL) de desoxi-hemoglobina; taquicardia, taquipneia e alterações neurológicas aparecem antes.","É o contrário: a cianose central, por hipoxemia, tende a melhorar com O<sub>2</sub> suplementar.","A cianose ao frio é fisiológica, periférica, e melhora com aquecimento e atrito, não com O<sub>2</sub>.","<b>Justificativa oficial:</b> A cianose pode ser decorrente de complicações no retorno venoso. Como exemplo cita-se a compressão vascular venosa extrínseca (neoplásica, por exemplo) de um segmento corporal. Levando a cianose segmentar (regional) e periférica (tissular).<br><br>As cianoses centrais, relacionadas a alguma falha nos mecanismos de bomba (ventilatória e/ou de perfusão), tendem a responder a oferta de oxigênio suplementar. Um exemplo de cianose não patológica é aquela relacionada a exposição ao frio. Trata-se de uma forma de cianose periférica, não responsiva ao O<sub>2</sub> suplementar, e responsiva ao atrito/aquecimento. A cianose costuma surgir quando os níveis de desoxiemoglobina atingem 5%, não sendo, habitualmente, um sinal precoce de hipoxemia (outros sinais: taquicardia, alterações neurológicas, taquipneia, por exemplo), costumam ser manifestações mais precoces relacionadas à hipoxemia."],"imgs":[],"ed":1,"rec":1},{"id":"S82.8","jid":"S82:8","prova":82,"item":8,"key":"C45","tema":"a3","seg":"s2","mod":"prova","enun":"Na avaliação do estado nutricional de um paciente, durante o exame físico geral ou ectoscopia, analise as assertivas:<br>1. Constatação de uma grande variação de peso (cerca de 5 kg) em um curto período (menos de 24 horas), obtida pela pesagem.<br>2. Proeminência de relevos ósseos.<br>3. Alterações na coloração, brilho e textura de pele e fâneros.<br>4. Sarcopenia.","cmd":"Podem ser consideradas parâmetros de avaliação do estado nutricional na ectoscopia:","alts":["1, 2, 3 e 4.","1 e 2.","1, 3 e 4.","2, 3 e 4."],"gab":3,"com":["A 1 está errada: 5 kg em menos de 24 h é mobilização de líquido, e pesar não é estritamente ectoscopia.","A 1 está errada e a 3 e a 4 estão corretas.","A 1 está errada pelo mesmo motivo.","<b>Justificativa oficial:</b> Grandes variações de peso em curtos períodos de tempo podem estar mais relacionadas a mobilização de líquidos. Pesar o paciente não é, estritamente, ectoscopia."],"imgs":[],"ed":0,"rec":1},{"id":"S82.9","jid":"S82:9","prova":82,"item":9,"key":"C12","tema":"a3","seg":"s2","mod":"prova","enun":"O estudo do biotipo corporal (longilíneo, brevilíneo e normolíneo) possui grande relevância clínica e semiológica, como ilustrado na figura.<br>I. Há maior incidência de pneumotórax espontâneo em jovens longilíneos do sexo masculino, em relação à população geral.<br>II. Há variações normais da posição do ictus nos diferentes biotipos, sem necessariamente significar alterações.<br>III. Conhecer o biotipo permite uma melhor interpretação de exames de imagem, minimizando interpretações equivocadas.","cmd":"Assinale a alternativa que contém as afirmações corretas.","alts":["I e II.","II e III.","I, II e III.","I."],"gab":2,"com":["Falta a III: a conformação de cada biotipo pode confundir a leitura de exames de imagem.","Falta a I: jovens longilíneos do sexo masculino têm mais pneumotórax espontâneo.","<b>Justificativa oficial:</b> O ictus cordis pode estar desviado, de forma normal, até 2,0 cm para direita da linha hemiclavicular (LH) e para o 4º espaço intercostal esquerdo (EIE) em indivíduos longilíneos. Bem como para o 5º EIE e 2,0 cm para esquerda da LH em indivíduos brevilíneos. Indivíduos jovens, do sexo masculino e longilíneos apresentam maior predisposição, em relação à população geral, a desenvolverem pneumotórax espontâneo. Embora a fisiopatologia não seja bem conhecida. Características particulares da conformação anatômica normal de cada biótipo podem confundir a interpretação de exames de imagem, devendo sempre considerar sua potencial interferência na análise desses exames.","Faltam a II e a III, ambas corretas."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S82.10","jid":"S82:10","prova":82,"item":10,"key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável), esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som broncovesicular.","Som claro pulmonar.","Som timpânico.","Som maciço."],"gab":0,"com":["<b>Justificativa oficial:</b> Som broncovesicular é som de ausculta, que pode ser considerado normal a depender do sítio examinado. Os demais sons, embora possam ser considerados normais - a depender do sítio examinado, referem-se a sons produzidos pela percussão torácica e não à ausculta.","Claro pulmonar é normal, mas é som de percussão, não de ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"ed":1,"rec":1},{"id":"S82.11","jid":"S82:11","prova":82,"item":11,"key":"C35","tema":"a7","seg":"s2","mod":"prova","enun":"Mulher de 60 anos com prolapso de valva mitral e insuficiência mitral importante é examinada pelo aluno, que precisa localizar o sopro no ciclo cardíaco.","cmd":"Em que fase do ciclo ocorre o sopro e por quê?","alts":["Na sístole, pelo refluxo do ventrículo esquerdo para o átrio esquerdo","Na diástole, pelo refluxo do átrio esquerdo para o ventrículo esquerdo","Na diástole, pela passagem do sangue por uma valva mitral estreitada","Na sístole, pela ejeção do sangue através da valva aórtica estreitada"],"gab":0,"com":["<b>Justificativa oficial:</b> Durante a sístole ventricular, a válvula mitral insuficiente pode permitir que parte do sangue reflua do ventrículo ao átrio esquerdo, causando turbilhonamento e sopro, nessa fase do ciclo cardíaco (sístole).","Na diástole a mitral está aberta; o sangue passa do AE para o VE normalmente.","Valva mitral estreitada é a estenose mitral (sopro diastólico).","Ejeção por valva aórtica estreita é a estenose aórtica."],"imgs":[],"ed":0,"rec":1},{"id":"S82.12","jid":"S82:12","prova":82,"item":12,"key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo para a construção do raciocínio clínico.","cmd":"Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na diástole, na fase de enchimento rápido.","Localizada na sístole, logo após a primeira bulha.","Localizada no final da sístole, antes da segunda bulha."],"gab":1,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","<b>Justificativa oficial:</b> B3 relaciona-se a sobrecarga volumétrica, podendo ser auscultada no início da diástole. Na fase denominada de enchimento ventricular rápido.","B3 é diastólica; logo após B1 fica o clique de ejeção.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"ed":1,"rec":1},{"id":"S82.13","jid":"S82:13","prova":82,"item":13,"key":"C8","tema":"a9","seg":"s3","mod":"prova","enun":"Homem de 62 anos, hipertenso mal controlado, chega ao pronto-socorro com dor torácica que começou de forma súbita, já com intensidade máxima, descrita como \"rasgando\", irradiada para a região interescapular.","cmd":"Quais achados do exame físico reforçam a principal hipótese diagnóstica?","alts":["Dor reproduzida à palpação do esterno e das articulações condrocostais","Diferença de pressão arterial e de amplitude de pulso entre os membros superiores","Atrito pericárdico que melhora quando o paciente inclina o tórax para frente","Sibilos difusos e tempo expiratório prolongado na ausculta pulmonar"],"gab":1,"com":["Dor reproduzida à palpação sugere causa musculoesquelética (costocondrite), não dissecção.","<b>Justificativa oficial:</b> A dor da dissecção aguda da Ao torácica é classicamente intensa (já em sua instalação), podendo ocorrer irradiação para região interescapular. Outros sinais e sintomas podem associar-se a dor torácica, a depender da localização da dissecção: abafamento de bulhas, ingurgitamento jugular, diferença da PA entre MMSS e diferença de intensidade de pulso entre MMSS.","Atrito que alivia com o tórax inclinado para frente é da pericardite aguda.","Sibilos e expiração prolongada apontam para broncoespasmo (asma, DPOC)."],"imgs":[],"ed":0,"rec":1},{"id":"S82.14","jid":"S82:14","prova":82,"item":14,"key":"C17","tema":"a12","seg":"s6","mod":"prova","enun":"A ASMA é definida como uma doença inflamatória crônica das vias aéreas, com períodos agudos de exacerbação, caracterizados por broncoespasmo e exacerbação inflamatória.<br>Analise as seguintes afirmações:<br>1) tosse crônica, exacerbada nos períodos noturnos/madrugada;<br>2) dispneia de instalação aguda e autopercepção de \"chieira\" torácica, nos períodos de exacerbação;<br>3) instalação e progressão lenta da obstrução das vias aéreas, permitindo a adaptação gradual do paciente ao novo estado patológico e a subvalorização de sintomas, retardando a procura do paciente ao médico assistente, muitas vezes por anos. Razão pela qual a procura por assistência ocorre quando a doença encontra-se em fases avançadas.","cmd":"Assinale a opção que contém as afirmações pertinentes à ASMA.","alts":["As afirmações 1 e 2 estão corretas.","As afirmações 1, 2 e 3 estão corretas.","As afirmações 2 e 3 estão corretas.","Apenas a afirmação 3 está correta."],"gab":0,"com":["<b>Justificativa oficial:</b> Os períodos de agudização na ASMA são súbitos, levando o paciente a um novo grau de obstrução das vias aéreas, sem tempo hábil para o paciente se adaptar ao novo estado. Os pacientes costumam procurar assistência imediata durante as crises agudas. Cabendo ao médico o entendimento que trata-se de doença crônica, devendo estar atento que, para além do tratamento da crise aguda, há a necessidade de avaliar o tratamento da doença crônica.","A 3 descreve a DPOC: na asma a agudização é súbita e o paciente procura ajuda na hora.","A 3 é da DPOC, de progressão lenta e procura tardia.","A 3 não descreve asma."],"imgs":[],"ed":1,"rec":1},{"id":"S82.15","jid":"S82:15","prova":82,"item":15,"key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido (até recentemente denominado de paradoxal) da segunda bulha (B2), analise as seguintes assertivas.<br>1. O desdobramento ocorre na fase expiratória.<br>2. O bloqueio completo de ramo esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.<br>3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.<br>4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As assertivas 1, 2 e 3 estão corretas.","As assertivas 1 e 2 estão corretas.","As assertivas 2 e 4 estão corretas.","As assertivas 3 e 4 estão corretas."],"gab":1,"com":["A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; não é persistente.","<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","Ambas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"ed":1,"rec":1},{"id":"S82.16","jid":"S82:16","prova":82,"item":16,"key":"C60","tema":"a3","seg":"s3","mod":"prova","enun":"Mulher de 42 anos, com lúpus, usa prednisona há mais de um ano. Observe a fácies na imagem: rosto arredondado, rubor, acne e aumento de pelos.","cmd":"Qual é o tipo de fácies?","alts":["Fácies mixedematosa.","Fácies acromegálica.","Fácies renal.","Fácies cushingoide."],"gab":3,"com":["Mixedematosa (hipotireoidismo): face pálida, infiltrada, apática, com edema palpebral e perda do terço externo das sobrancelhas.","Acromegálica: proeminência de mandíbula, nariz, lábios e arcos supraorbitários.","Renal: edema palpebral bilateral e palidez, sem rubor ou hirsutismo.","<b>Justificativa oficial:</b> Fácies cushingoide, típica da síndrome de Cushing ou do uso prolongado de corticoides."],"imgs":["q-cushingoide"],"ed":0,"rec":1},{"id":"S82.17","jid":"S82:17","prova":82,"item":17,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S82.18","jid":"S82:18","prova":82,"item":18,"key":"C51","tema":"a8","seg":"s2","mod":"prova","enun":"Homem de 68 anos com fibrilação atrial crônica é examinado na enfermaria pelo aluno.","cmd":"Quais achados são esperados na ausculta e na palpação do pulso?","alts":["Ritmo regular, B1 constante, B4 presente e pulso igual ao número de batimentos","Ritmo irregular, B1 constante, B4 hiperfonética e pulso de amplitude aumentada","Ritmo irregular, fonese variável de B1, ausência de B4 e dissociação pulso-ausculta","Ritmo regular em três tempos por B4, com B1 em canhão e pulso lento e amplo"],"gab":2,"com":["Na FA o ritmo é irregular e não há B4, porque não há contração atrial.","A B1 varia e a B4 desaparece na FA.","<b>Justificativa oficial:</b> Na fibrilação atrial, há perda da contração atrial organizada, o que leva ao desaparecimento da bulha B4 e a um ritmo irregular, auscultado como um ritmo \"caótico\". A fonese variável da primeira bulha ocorre devido à variação nos intervalos entre as sístoles ventriculares, e a dissociação pulso-ausculta (quando nem todas as bulhas correspondem a um pulso periférico) decorre de contrações ventriculares fracas ou muito próximas umas das outras, que não geram débito suficiente para serem percebidas no pulso.","B1 em canhão e pulso lento e amplo são do BAVT."],"imgs":[],"ed":0,"rec":1},{"id":"S82.19","jid":"S82:19","prova":82,"item":19,"key":"C57","tema":"a3","seg":"s1","mod":"prova","enun":"Paciente adulto, no pronto-socorro: FC 110 bpm (contada pela ausculta cardíaca), temperatura axilar 38,2 °C, FR 24 irpm, PA 118/76 mmHg.","cmd":"Assinale a descrição correta dos dados vitais.","alts":["Taquisfígmico, subfebril e eupneico.","Taquicárdico, afebril e taquipneico.","Taquisfígmico, febril e bradipneico.","Taquicárdico, febril e taquipneico."],"gab":3,"com":["A FC foi contada no coração (taquicardia), 38,2 °C é febre e 24 irpm é taquipneia.","Acima de 37,8 °C já é febre.","FR de 24 é taquipneia, e a frequência foi contada no coração.","<b>Justificativa oficial:</b> Falamos em taquicardia quando a frequência cardíaca é medida diretamente no coração, seja por meio da palpação do ictus cordis ou pela ausculta cardíaca. Embora, em condições normais, o número de pulsações por minuto (ppm) seja equivalente ao número de batimentos cardíacos, podem ocorrer situações de dissociação pulso-ausculta, em que o número de batimentos diferem do número de pulsações periféricas. O termo isfigmia é conceitualmente mais adequado para designar o pulso arterial (onda de pressão), distinguindo-o do batimento cardíaco em si. Em relação aos parâmetros vitais, considera-se o indivíduo febril quando apresenta temperaturas axilares acima de 37,8 °C (valor de referência que pode variar conforme a literatura). Já a taquipneia é definida como a frequência respiratória maior que 20 incursões respiratórias por minuto (irpm)."],"imgs":[],"ed":0,"rec":1},{"id":"S82.20","jid":"S82:20","prova":82,"item":20,"key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero-Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro.","cmd":"Acerca da manobra de Rivero-Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","alts":["Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco mitral, insuficiência mitral, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":0,"com":["<b>Justificativa oficial:</b> A manobra de Rivero Carvallo é utilizada para diferenciar sopros causados pela insuficiência tricúspide da insuficiência mitral - ambos, sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"ed":1,"rec":1},{"id":"S82.21","jid":"S82:21","prova":82,"item":21,"key":"C37","tema":"a11","seg":"s1","mod":"prova","enun":"Nome dado à cianose que tende a melhorar com a oferta de oxigênio (O<sub>2</sub>) suplementar.","cmd":"Assinale uma alternativa.","alts":["Cianose central.","Cianose periférica.","Cianose por metemoglobinemia.","Cianose segmentar por estase venosa."],"gab":0,"com":["<b>Justificativa oficial:</b> As cianoses que cursam com déficits de bomba (circulatória Q; ventilatória V), em seus mais diferentes níveis (tecidual, orgânico etc.) são denominadas de centrais. Por cursarem com hipoxemia (baixa quantidade de O2 no sangue - ligado a Hb), elas tendem a responder melhor a oferta de O2 suplementar.","A periférica é de baixo fluxo (o sangue chega saturado); melhora com calor e massagem, não com O2.","Na hemoglobinopatia o problema é a hemoglobina anormal; o O2 não corrige.","A estase venosa é periférica e localizada; não responde ao O2."],"imgs":[],"ed":1,"rec":1},{"id":"S82.22","jid":"S82:22","prova":82,"item":22,"key":"C23","tema":"a7","seg":"s2","mod":"prova","enun":"Considerando os principais sinais e sintomas da estenose aórtica, analise as seguintes assertivas:<br>I) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar sintomas de dor cardíaca isquêmica.<br>II) Em função da dificuldade de adaptação a novas demandas metabólicas em órgãos-alvo, o paciente pode queixar-se de sensação de escurecimento visual e sensação pré-sincopal.<br>III) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar ictus propulsivo.<br>IV) Em função da lesão valvar, espera-se encontrar, à ausculta, um sopro diastólico ejetivo melhor audível no foco aórtico.","cmd":"Assinale a opção que contém as assertivas corretas.","alts":["Estão corretas as assertivas I, II, III e IV.","Estão corretas as assertivas II e IV.","Estão corretas as assertivas I, II e III.","Estão corretas as assertivas I e III."],"gab":2,"com":["A IV está errada: o sopro da estenose aórtica é sistólico (ejetivo), não diastólico.","A IV está errada e a I é correta (angina pela hipertrofia).","<b>Justificativa oficial:</b> O sopro esperado na estenose aórtica é sistólico. Tornando incorreta a assertiva IV.","Falta a II: o débito fixo causa pré-síncope e escurecimento visual no esforço."],"imgs":[],"ed":1,"rec":1},{"id":"S82.23","jid":"S82:23","prova":82,"item":23,"key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias, desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope, alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio.<br>Analise as seguintes assertivas.<br>1. Ausência de pródromos ou gatilhos detectáveis.<br>2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.<br>3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em indivíduo jovem (adolescente/adulto jovem) previamente hígido.<br>4. Histórico de cardiopatia de base conhecida pelo médico e paciente.","cmd":"São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas:","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vaso-vagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"ed":1,"rec":1},{"id":"S82.24","jid":"S82:24","prova":82,"item":24,"key":"C41","tema":"a3","seg":"s3","mod":"prova","enun":"O termo \"fácies atípica\", consagrado na medicina para designar a fácies normal, pode gerar confusão com as atipias celulares. Por isso alguns autores preferem uma sinonímia igualmente consagrada.","cmd":"Qual é essa sinonímia?","alts":["Fácies hipocrática.","Fácies incaracterística.","Fácies típica.","Fácies inexpressiva."],"gab":1,"com":["Hipocrática é a fácies do paciente grave, em fase terminal.","<b>Justificativa oficial:</b> Atípico é formado pelo prefixo \"a\" (não, sem) + \"típico\" (característico, comum). Para a descrição da fácies, literalmente a palavra designa um conjunto de elementos faciais não característico (ou não típico/ não comum) de uma doença. Embora a expressão fácies atípica esteja consagrada na medicina - para designação da fácies normal (Gauss), alguns autores chamam a atenção para um possível potencial de confusão, por exemplo, com as atipias celulares (que designam alterações ou desvios da normalidade). Fácies incaracterística é a sinonímia, igualmente consagrada, para designar esse tipo facial.","\"Típica\" seria característica de uma doença: é o oposto.","Fácies inexpressiva (em máscara) é a parkinsoniana."],"imgs":[],"ed":0,"rec":1},{"id":"S82.25","jid":"S82:25","prova":82,"item":25,"key":"C62","tema":"a1","seg":"s2","mod":"prova","enun":"Sobre as habilidades esperadas do médico na entrevista clínica, analise as assertivas.<br>I. A etiqueta, entendida como um simulacro de ética, é a capacidade de interagir com o paciente por normas socialmente acordadas, reforçando o princípio do não julgamento.<br>II. Concatenar e sintetizar o que o paciente relata em um texto inteligível e organizado é uma característica desejável na construção da anamnese.<br>III. A organização da história colhida vale também para o seu registro no prontuário, e não só para a entrevista.","cmd":"Estão corretas:","alts":["Apenas I e II.","I, II e III.","Apenas II e III.","Apenas I e III."],"gab":1,"com":["A III também está correta: a síntese organizada vale para a anamnese e para o seu registro em prontuário.","<b>Justificativa oficial:</b> Todas as assertivas estão corretas. A etiqueta (simulacro de ética) refere-se a capacidade de interagir com o paciente através de normas socialmente acordadas, garantindo e reforçando o princípio de não julgamento. A capacidade de concatenar e sintetizar as informações passadas pelo paciente em um texto inteligível e organizado é característica desejável a todo médico na construção da anamnese, e de seu registro em prontuário.","Falta a I: a etiqueta (pequena ética) é justamente a interação por normas socialmente acordadas, sem julgamento.","Falta a II: concatenar e sintetizar o relato é desejável a todo médico."],"imgs":[],"ed":1,"rec":1},{"id":"S82.27","jid":"S82:27","prova":82,"item":27,"key":"C30","tema":"a8","seg":"s1","mod":"prova","enun":"Durante a realização do exame físico de um paciente sob seus cuidados, especificamente na etapa de aferição dos dados vitais, você encontrou uma frequência de pulso (FP) de repouso de 50 ppm (pulsações por minuto). A pressão arterial, a frequência respiratória e a temperatura axilar encontravam-se normais. Você considerou, inicialmente, como possíveis causas para esse achado o uso de medicação betabloqueadora para controle da hipertensão arterial, associado ao hábito relatado pelo paciente de realizar atividades físicas frequentes e de forma regular, obtido durante a anamnese.","cmd":"Acerca da frequência de pulso desse paciente, pode-se afirmar:","alts":["É incorreto chamá-la de bradicardia: foi aferida no pulso (ppm), e não nos batimentos (bpm)","É correto chamá-la de bradicardia: FC e FP são termos sinônimos na prática clínica diária","É correto chamá-la de bradisfigmia só quando houver dissociação entre pulso e ausculta","É incorreto chamá-la de bradi: no atleta a faixa normal de pulso começa em 40 ppm"],"gab":0,"com":["<b>Justificativa oficial:</b> A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus? A Frequência cardíaca (FC) é medida por batimentos por minuto (bpm). Esfígmico é relativo ao pulso e é medido pelo número de pulsações por minuto (ppm). FC - bpm. FP - ppm. A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que pulso é um fenômeno físico distinto de batimento. Embora na maioria absoluta das vezes seus valores numéricos realmente sejam equivalentes ou iguais, e que fisiologicamente são inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos), achado importante para suspeição e/ou diagnóstico de algumas arritmias é um - dentre outros - exemplo da importância prática dessa distinção. Indo além de um suposto preciosismo léxico da nomenclatura médica.","FC (bpm) e FP (ppm) são fenômenos diferentes; a dissociação pulso-ausculta mostra por quê.","Bradisfigmia é qualquer FP abaixo de 60 ppm, com ou sem dissociação.","A faixa de normalidade usada na prova é 60 a 100; 50 ppm é bradisfigmia."],"imgs":[],"ed":1,"rec":1},{"id":"S82.28","jid":"S82:28","prova":82,"item":28,"key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnosticada e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e o ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais: 1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?; 2. derrame pleural à direita, de etiologia tromboembólica? O raio X de tórax confirmou a presença do volumoso derrame pleural à direita.<br>Acerca do exame físico dessa paciente, analise as seguintes assertivas.<br>I) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.<br>II) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.<br>III) Espera-se encontrar uma percussão submaciça no lado acometido.<br>IV) Espera-se encontrar sons respiratórios diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas:","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando a limitação dos movimentos (expansibilidade) no hemitórax acometido.<br><br>Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta.<br><br>Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"ed":1,"rec":1},{"id":"S82.29","jid":"S82:29","prova":82,"item":29,"key":"C59","tema":"a12","seg":"s6","mod":"prova","enun":"O diagnóstico sindrômico pode auxiliar na construção do diagnóstico etiológico (ou nosológico) específico. Citam-se, como exemplos, as diversas afecções abdominais que podem ser categorizadas, inicialmente, em síndromes (abdome obstrutivo, abdome inflamatório, abdome perfurativo e abdome vascular), para posterior diagnóstico da patologia de base.","cmd":"Acerca do diagnóstico geral ou sindrômico das afecções respiratórias, a ASMA é classificada como uma doença:","alts":["Obstrutiva.","Restritiva.","Parenquimatosa.","Mista, obstrutiva e restritiva."],"gab":0,"com":["<b>Justificativa oficial:</b> A ASMA é uma condição inflamatória crônica, com períodos de exacerbação, caracterizada pela obstrução (notadamente ao fluxo expiratório) das vias aéreas.","A asma limita o fluxo expiratório; não reduz o volume pulmonar.","A asma é doença das vias aéreas, não do parênquima.","Na asma o padrão é obstrutivo."],"imgs":[],"ed":1,"rec":1},{"id":"S82.30","jid":"S82:30","prova":82,"item":30,"key":"C56","tema":"a10","seg":"s2","mod":"prova","enun":"Acerca da síncope vasovagal, pode-se afirmar:","cmd":"Assinale uma opção.","alts":["Habitualmente os pacientes apresentam severas lesões de extremidades e contusões graves.","Habitualmente são precedidas de dor torácica de forte intensidade e palpitações.","Habitualmente os pacientes não se queixam de sintomas precedendo o quadro sincopal.","Habitualmente a presença de sintomas prodrômicos permite um esboço de defesa."],"gab":3,"com":["Lesões graves por queda sem defesa sugerem síncope cardíaca, sem pródromos.","Dor torácica forte e palpitações antes da síncope são alarme de causa cardíaca.","Na vasovagal há pródromos (sudorese, palidez, visão turva); ausência de sintomas é da cardíaca.","<b>Justificativa oficial:</b> Habitualmente, a presença de sintomas pré-sincopais (antecedendo o quadro sincopal em segundos) permite um esboço de defesa (encostar em uma parede, assentar-se etc.), podendo minimizar fraturas e contusões."],"imgs":[],"ed":1,"rec":1},{"id":"S82.31","jid":"S82:31","prova":82,"item":31,"key":"C31","tema":"a6","seg":"s3","mod":"prova","enun":"Idoso com estenose aórtica grave e hipertrofia ventricular esquerda tem ritmo tríplice por B4, com características de galope. Meses depois, o eletrocardiograma mostra fibrilação atrial.","cmd":"Assinale a alternativa correta.","alts":["O galope por B4 é atrial e tende a desaparecer com a FA, pela perda da sístole atrial","O galope por B4 é ventricular e se intensifica com a FA, pelo enchimento mais rápido","A B4 indica sobrecarga volumétrica e persiste na FA, por depender do enchimento rápido","A B4 indica sobrecarga pressórica e se intensifica na FA, pela contração atrial forte"],"gab":0,"com":["<b>Justificativa oficial:</b> B4 relaciona-se a sobrecargas pressóricas. Podendo surgir na estenose aórtica, notadamente quando existe hipertrofia ventricular. O ritmo de galope de B4 é conhecido como galope atrial. A fibrilação atrial (perda da sístole atrial) é responsável pelo desaparecimento de B4 que depende, em sua fisiopatologia auscultatória, da presença da sístole atrial.","Galope ventricular é o da B3; e a FA elimina a B4.","A B4 é de pressão e depende da sístole atrial, que a FA elimina.","Na FA não há contração atrial organizada, por isso a B4 desaparece."],"imgs":[],"ed":0,"rec":1}],"par":[{"id":"ED.1","prova":"ED","n":"1","key":"p:dist","tema":"a4","seg":"s2","mod":"prova","enun":"Durante o estudo semiológico da dor, importantes conceitos foram discutidos. Dentre eles, aqueles relacionados à real percepção de dor, por parte do paciente, em locais ou regiões distantes ao sítio de origem dos estímulos nóxicos. Acerca da dor localizada à distância do sítio de acometimento nóxico, podemos afirmar:","cmd":"","alts":["O termo 'dor referida' designa um tipo específico de dor percebida à distância do local de origem. Habitualmente relacionada a compressão nervosa em um nível, e percepção dolorosa distal ao sítio de acometimento. Caracteriza-se por respeitar o mesmo trajeto nervoso. Exemplo clássico: ciatalgia.","O termo 'dor irradiada' designa a dor percebida à distância do local de origem do estímulo nocivo, mas que com ele se relaciona por compartilhamento de vias, tratos ou de representações no Sistema Nervoso Central. Exemplo clássico - dor precordial do infarto do miocárdio irradiada para a mandíbula.","A divisão entre dor irradiada ou referida não comporta importância prática em função da modulação central que ambas recebem na substância g
