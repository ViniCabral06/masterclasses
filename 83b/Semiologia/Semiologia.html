ito (BRD). Está assintomático. Na ausculta cardíaca, o aluno procura alterações das bulhas.","cmd":"Qual o comportamento esperado das bulhas nesse paciente?","alts":["Desdobramento de B2 fixo, de mesma intensidade na inspiração e na expiração","Desdobramento de B1 e de B2, persistente e variável, acentuado na inspiração","Desdobramento invertido de B2, audível na expiração e ausente na inspiração","Retração apical sistólica e pulso paradoxal, sem alteração das bulhas"],"gab":1,"com":["Desdobramento fixo, que não varia com a respiração, é o da CIA.","<b>Justificativa oficial:</b> O bloqueio de ramo direito pode levar ao retardo do fechamento do componente tricúspide de $B_1$, fisiologicamente já atrasado em relação ao mitral, levando ao desdobramento de $B_1$. O mesmo princípio se aplica a $B_2$: o BRD leva ao retardo do fechamento do componente pulmonar de $B_2$, fisiologicamente já atrasado em relação ao componente aórtico. Fato que se exacerba durante a inspiração (pelo aumento do retorno venoso e aumento do trabalho do coração direito), levando a aumentar o desdobramento - tornando-o persistente (inspiratório e expiratório) e variável (melhor audível ou exacerbado na inspiração). A retração apical pode ser encontrada em casos de Hipertrofia Ventricular Direita, e o pulso paradoxal foi colocado como distrator.","Desdobramento invertido (paradoxal) é o do BRE: o componente aórtico atrasa.","A retração apical é da HVD e o pulso paradoxal foi colocado como distrator na justificativa oficial."],"imgs":[],"ed":0,"rec":1},{"id":"S77.3","jid":"S77:3","prova":77,"item":3,"key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias, desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope, alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio.<br>Analise as seguintes assertivas.<br>1. Ausência de pródromos ou gatilhos detectáveis.<br>2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.<br>3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em indivíduo jovem (adolescente/adulto jovem) previamente hígido.<br>4. Histórico de cardiopatia de base conhecida pelo médico e paciente.","cmd":"São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas:","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vaso-vagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"ed":1,"rec":1},{"id":"S77.4","jid":"S77:4","prova":77,"item":4,"key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero-Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro.","cmd":"Acerca da manobra de Rivero-Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","alts":["Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco mitral, insuficiência mitral, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":0,"com":["<b>Justificativa oficial:</b> A manobra de Rivero-Carvallo é utilizada para diferenciar sopros causados pela insuficiência tricúspide da insuficiência mitral - ambos sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"ed":1,"rec":1},{"id":"S77.5","jid":"S77:5","prova":77,"item":5,"key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido (até recentemente denominado de paradoxal) da segunda bulha (B2), analise as seguintes assertivas.<br>1. O desdobramento ocorre na fase expiratória.<br>2. O bloqueio completo de ramo esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.<br>3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.<br>4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As assertivas 1, 2 e 3 estão corretas.","As assertivas 1 e 2 estão corretas.","As assertivas 2 e 4 estão corretas.","As assertivas 3 e 4 estão corretas."],"gab":1,"com":["A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; não é persistente.","<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","Ambas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"ed":1,"rec":1},{"id":"S77.6","jid":"S77:6","prova":77,"item":6,"key":"C5","tema":"a8","seg":"s2","mod":"prova","enun":"Mulher de 74 anos procura o ambulatório por crises de palpitação. Relata que, durante as crises, sente urgência para urinar e urina em maior volume. Ao exame: ritmo cardíaco irregular, intensidade de B1 variável de um batimento para outro e número de pulsações radiais menor que o de batimentos contados na ausculta.","cmd":"Qual o diagnóstico mais provável e a explicação para as queixas urinárias?","alts":["Bloqueio atrioventricular total; liberação de ADH estimulada pela bradicardia","Extrassístoles ventriculares; hipoperfusão renal pelo débito cardíaco baixo","Taquicardia sinusal; aumento do fluxo renal provocado pela ansiedade","Fibrilação atrial; liberação de peptídeo natriurético atrial pela distensão atrial"],"gab":3,"com":["No BAVT o ritmo é lento e regular; o ADH reduz a diurese, não aumenta.","Extrassístoles isoladas não explicam ritmo irregular contínuo com B1 variável; hipoperfusão reduziria a urina.","Na taquicardia sinusal o ritmo é regular e a B1 é constante e hiperfonética.","<b>Justificativa oficial:</b> A FA pode levar a queixas urinárias, relacionadas ao peptídeo natriurético atrial. A variação da fonese de $B_1$ pode ser encontrada nos casos de FA, relacionando-se aos diferentes tempos de enchimento ventricular, estando relacionada às diferentes frequências de estímulos que podem chegar ao VE, a depender do período refratário do NAV. Pode ocorrer dissociação ausculta-pulso nos casos de estímulos elétricos de alta frequência que, porventura, cheguem ao VE. Nestes casos ocorrerá sístole ventricular e fechamento das valvas atrioventriculares, mas o volume de sangue ejetado pode ser insuficiente (pelo enchimento ventricular esquerdo limitado) para gerar pulso periférico palpável."],"imgs":[],"ed":0,"rec":1},{"id":"S77.7","jid":"S77:7","prova":77,"item":7,"key":"C6","tema":"a5","seg":"s1","mod":"prova","enun":"Três estudantes saudáveis servem de modelo na aula prática de exame do precórdio. O indivíduo A é brevilíneo, o B é normolíneo e o C é longilíneo, como na figura.","cmd":"Assinale a correlação correta entre o biotipo e a posição em que se espera palpar o ictus cordis.","alts":["A: 4º EIC, lateral à LHC; B: 5º EIC, sobre a LHC; C: 6º EIC, medial à LHC","A: 6º EIC, medial à LHC; B: 5º EIC, sobre a LHC; C: 4º EIC, lateral à LHC","A, B e C: 5º EIC, sobre a LHC, pois o biotipo não altera a posição do ictus","A: 5º EIC, sobre a LHC; B: 4º EIC, lateral à LHC; C: 6º EIC, medial à LHC"],"gab":0,"com":["<b>Justificativa oficial:</b> Em indivíduos longilíneos (C) o ictus pode estar deslocado medialmente e para baixo ($6^\\circ$ EIC, $2\\text{ cm}$ da linha hemiclavicular medialmente). Nos indivíduos brevilíneos (A) o ictus pode estar deslocado lateralmente ($2,0\\text{ cm}$ da linha hemiclavicular para esquerda) e para cima ($4^\\circ$ EIC). Nos indivíduos normolíneos (B) o ictus habitualmente é palpado no $5^\\circ$ EIC, sob a linha hemiclavicular esquerda.","Inverteu brevilíneo e longilíneo: no longilíneo o coração verticaliza e o ictus desce e vai para dentro.","O biotipo muda a posição normal do ictus, sem significar doença.","O normolíneo é o que tem ictus no 5º EIC sobre a linha hemiclavicular (LHC)."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S77.8","jid":"S77:8","prova":77,"item":8,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S77.9","jid":"S77:9","prova":77,"item":9,"key":"C8","tema":"a9","seg":"s3","mod":"prova","enun":"Homem de 62 anos, hipertenso mal controlado, chega ao pronto-socorro com dor torácica que começou de forma súbita, já com intensidade máxima, descrita como \"rasgando\", irradiada para a região interescapular.","cmd":"Quais achados do exame físico reforçam a principal hipótese diagnóstica?","alts":["Dor reproduzida à palpação do esterno e das articulações condrocostais","Diferença de pressão arterial e de amplitude de pulso entre os membros superiores","Atrito pericárdico que melhora quando o paciente inclina o tórax para frente","Sibilos difusos e tempo expiratório prolongado na ausculta pulmonar"],"gab":1,"com":["Dor reproduzida à palpação sugere causa musculoesquelética (costocondrite), não dissecção.","<b>Justificativa oficial:</b> A dor da dissecção aguda da aorta torácica é classicamente intensa (já em sua instalação), podendo ocorrer irradiação para região interescapular. Outros sinais e sintomas podem associar-se à dor torácica, a depender da localização da dissecção: abafamento de bulhas, ingurgitamento jugular, diferença da PA entre MMSS e diferença de intensidade de pulso entre MMSS.","Atrito que alivia com o tórax inclinado para frente é da pericardite aguda.","Sibilos e expiração prolongada apontam para broncoespasmo (asma, DPOC)."],"imgs":[],"ed":0,"rec":1},{"id":"S77.10","jid":"S77:10","prova":77,"item":10,"key":"C9","tema":"a11","seg":"s2","mod":"prova","enun":"Paciente relata falta de ar que surge quando se levanta da cama e fica em pé, e que melhora quando volta a deitar-se de costas. Ao contrário do que ocorre no edema agudo de pulmão, ele não tolera a posição ortostática.","cmd":"Esse tipo de dispneia denomina-se:","alts":["Platipneia.","Ortopneia.","Trepopneia.","Dispneia paroxística noturna."],"gab":0,"com":["<b>Justificativa oficial:</b> Nome dado à dispneia que - ao contrário da dispneia do edema agudo de pulmão (Ortopneia) - piora com a posição ortostática: Platipneia. A Trepopneia relaciona-se à dispneia que piora ou melhora com determinado decúbito lateral.","Ortopneia é a dispneia que piora deitado e alivia sentado ou em pé, como no edema agudo de pulmão.","Trepopneia é a dispneia que muda com o decúbito lateral.","A dispneia paroxística noturna acorda o paciente e se relaciona à ortopneia."],"imgs":[],"ed":0,"rec":1},{"id":"S77.11","jid":"S77:11","prova":77,"item":11,"key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório.<br>Em um paciente portador de pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax.","cmd":"Os achados esperados no lado do pneumotórax, referentes à palpação (frêmito toracovocal, FTV), percussão e ausculta para este paciente são, respectivamente:","alts":["FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":0,"com":["<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolida pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líquido); no pneumotórax há ar e o som é timpânico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"ed":1,"rec":1},{"id":"S77.12","jid":"S77:12","prova":77,"item":12,"key":"C11","tema":"a1","seg":"s1","mod":"prova","enun":"Em prontuários, laudos e atestados, é comum a expressão \"ao exame clínico\". O professor pergunta à turma o que exatamente esse termo engloba.","cmd":"O exame clínico é definido pelo conjunto de informações obtidas por meio de:","alts":["Anamnese e exame físico.","Exame físico, exclusivamente.","Anamnese, exame físico e exames complementares.","Ectoscopia e dados vitais."],"gab":0,"com":["<b>Justificativa oficial:</b> Exame clínico é definido pelo conjunto de informações obtidas pela anamnese e exame físico.","O exame físico é só uma das partes; os sintomas vêm da anamnese.","Exames complementares não fazem parte do exame clínico.","Ectoscopia e dados vitais são partes do exame físico geral."],"imgs":[],"ed":0,"rec":1},{"id":"S77.13","jid":"S77:13","prova":77,"item":13,"key":"C12","tema":"a3","seg":"s2","mod":"prova","enun":"O estudo do biotipo corporal (longilíneo, brevilíneo e normolíneo) possui grande relevância clínica e semiológica, como ilustrado na figura.<br>I. Há maior incidência de pneumotórax espontâneo em jovens longilíneos do sexo masculino, em relação à população geral.<br>II. Há variações normais da posição do ictus nos diferentes biotipos, sem necessariamente significar alterações.<br>III. Conhecer o biotipo permite uma melhor interpretação de exames de imagem, minimizando interpretações equivocadas.","cmd":"Assinale a alternativa que contém as afirmações corretas.","alts":["I e II.","II e III.","I, II e III.","I."],"gab":2,"com":["Falta a III: a conformação de cada biotipo pode confundir a leitura de exames de imagem.","Falta a I: jovens longilíneos do sexo masculino têm mais pneumotórax espontâneo.","<b>Justificativa oficial:</b> O ictus cordis pode estar desviado, de forma normal, até $2,0\\text{ cm}$ para direita da linha hemiclavicular (LH) e para o $4^\\circ$ espaço intercostal esquerdo (EIE) em indivíduos longilíneos, bem como para o $5^\\circ$ EIE e $2,0\\text{ cm}$ para esquerda da LH em indivíduos brevilíneos. Indivíduos jovens, do sexo masculino e longilíneos apresentam maior predisposição, em relação à população geral, a desenvolverem pneumotórax espontâneo, embora a fisiopatologia não seja bem conhecida. Características particulares da conformação anatômica normal de cada biótipo podem confundir a interpretação de exames de imagem, devendo sempre considerar sua potencial interferência na análise desses exames.","Faltam a II e a III, ambas corretas."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S77.14","jid":"S77:14","prova":77,"item":14,"key":"C13","tema":"a2","seg":"s3","mod":"prova","enun":"Durante a anamnese de uma mulher de 34 anos, o estudante anota: 1) G2P2A0, partos normais; 2) vacinação em dia; 3) nega internações clínicas ou cirúrgicas; 4) hipertensão arterial há 5 anos, em uso de losartana.","cmd":"Quais dessas informações devem ser registradas na História Patológica Pregressa (Antecedentes Pessoais)?","alts":["Apenas 4, pois a HPP registra só doenças.","Apenas 1 e 4.","1, 2, 3 e 4.","Apenas 2 e 3."],"gab":2,"com":["A HPP registra informações de interesse médico mesmo que não patológicas (gestação, vacinas, ausência de internações).","Gestação e vacinação também entram, mesmo sem ser doença.","<b>Justificativa oficial:</b> O campo História Patológica Pregressa (HPP), também denominado Antecedentes Pessoais (AP), é destinado ao registro de informações pessoais do paciente e de interesse médico, mesmo que não patológico. Gestação, vacinação e a não necessidade de internações (clínicas ou cirúrgicas) são informações de interesse médico, embora não signifiquem patologias ou comorbidades.","A hipertensão e a história obstétrica também pertencem à HPP."],"imgs":[],"ed":0,"rec":1},{"id":"S77.15","jid":"S77:15","prova":77,"item":15,"key":"C14","tema":"a12","seg":"s6","mod":"prova","enun":"Mulher de 23 anos, asmática, chega ao pronto-socorro em crise. O pico de fluxo expiratório (medido com o aparelho portátil peak flow) é de 45% do previsto. Após o tratamento, sobe para 85% do previsto.","cmd":"Assinale a interpretação correta.","alts":["A asma é restritiva, e o aumento do pico de fluxo indica ganho de volume pulmonar total","A asma é obstrutiva, e o aumento do pico de fluxo indica melhora objetiva da obstrução","A asma é obstrutiva, mas o pico de fluxo não serve para acompanhar a resposta ao tratamento","A asma é parenquimatosa, e o aumento do pico de fluxo indica reabsorção de edema alveolar"],"gab":1,"com":["A asma não é restritiva: limita o fluxo expiratório, não o volume pulmonar.","<b>Justificativa oficial:</b> A ASMA é uma doença inflamatória crônica das vias aéreas, caracterizada por períodos de exacerbação inflamatória e broncoespasmo. A ASMA pode ser classificada como uma doença obstrutiva ao fluxo (e volume) expiratório. O aumento do pico de fluxo, aferido por um instrumento portátil - denominado Peak Flow - pode denotar melhora objetiva do padrão obstrutivo, notadamente quando a medida atinge níveis percentuais próximos àqueles esperados para o paciente hígido, ou próximos ao nível do paciente asmático controlado.","O peak flow é justamente a forma objetiva e portátil de ver a melhora da obstrução.","A asma é doença das vias aéreas, não do parênquima; não há edema alveolar."],"imgs":[],"ed":0,"rec":1},{"id":"S77.16","jid":"S77:16","prova":77,"item":16,"key":"C15","tema":"a12","seg":"s5","mod":"prova","enun":"Homem de 66 anos, com insuficiência cardíaca descompensada, apresenta dispneia progressiva. A radiografia mostra derrame pleural volumoso à direita. Sobre o exame do hemitórax direito:<br>I. Espera-se encontrar som submaciço à percussão.<br>II. Espera-se encontrar frêmito toracovocal diminuído.<br>III. Espera-se encontrar redução ou abolição dos sons respiratórios.<br>IV. Espera-se encontrar redução da expansibilidade.","cmd":"Estão corretas as assertivas:","alts":["I e II.","I, II e III.","II e IV.","I, II, III e IV."],"gab":3,"com":["Faltam a III e a IV: o líquido isola o som e limita a expansão do hemitórax.","Falta a IV: o hemitórax cheio de líquido expande menos.","Faltam a I e a III: há submacicez e os sons ficam reduzidos ou abolidos.","<b>Justificativa oficial:</b>  I) Espera-se encontrar som submaciço à percussão. II) Espera-se encontrar um frêmito toracovocal diminuído. III) Espera-se encontrar uma redução ou abolição dos sons no lado acometido (o DP atuaria como um isolante acústico - reduzindo os sons e a intensidade do frêmito). IV) Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido."],"imgs":[],"ed":0,"rec":1},{"id":"S77.17","jid":"S77:17","prova":77,"item":17,"key":"C16","tema":"a12","seg":"s6","mod":"prova","enun":"Homem de 64 anos, tabagista de 50 anos-maço, tem tosse crônica produtiva com expectoração volumosa todos os dias, cianose facial e edema de membros inferiores. Não está emagrecido.","cmd":"Qual fenótipo melhor descreve esse paciente?","alts":["Congesto azulado.","Soprador rosa.","Asmático em crise.","Restritivo intersticial."],"gab":0,"com":["<b>Justificativa oficial:</b> A tosse crônica e produtiva (congestão) e a cianose facial (azul) permitem inferir o fenótipo \"Congesto azulado\".","O soprador rosa é emagrecido, sarcopênico, rosado e tem pouca secreção (predomina enfisema).","A asma tem crises súbitas e variáveis, não tosse produtiva diária com cianose crônica.","O quadro é obstrutivo (bronquite crônica), não restritivo."],"imgs":[],"ed":0,"rec":1},{"id":"S77.18","jid":"S77:18","prova":77,"item":18,"key":"C17","tema":"a12","seg":"s6","mod":"prova","enun":"A ASMA é definida como uma doença inflamatória crônica das vias aéreas, com períodos agudos de exacerbação, caracterizados por broncoespasmo e exacerbação inflamatória.<br>Analise as seguintes afirmações:<br>1) tosse crônica, exacerbada nos períodos noturnos/madrugada;<br>2) dispneia de instalação aguda e autopercepção de \"chieira\" torácica, nos períodos de exacerbação;<br>3) instalação e progressão lenta da obstrução das vias aéreas, permitindo a adaptação gradual do paciente ao novo estado patológico e a subvalorização de sintomas, retardando a procura do paciente ao médico assistente, muitas vezes por anos. Razão pela qual a procura por assistência ocorre quando a doença encontra-se em fases avançadas.","cmd":"Assinale a opção que contém as afirmações pertinentes à ASMA.","alts":["As afirmações 1 e 2 estão corretas.","As afirmações 1, 2 e 3 estão corretas.","As afirmações 2 e 3 estão corretas.","Apenas a afirmação 3 está correta."],"gab":0,"com":["<b>Justificativa oficial:</b> Os períodos de agudização na ASMA são súbitos, levando o paciente a um novo grau de obstrução das vias aéreas, sem tempo hábil para o paciente se adaptar ao novo estado. Os pacientes costumam procurar assistência imediata durante as crises agudas, cabendo ao médico o entendimento que trata-se de doença crônica, devendo estar atento que, para além do tratamento da crise aguda, há a necessidade de avaliar o tratamento da doença crônica.","A 3 descreve a DPOC: na asma a agudização é súbita e o paciente procura ajuda na hora.","A 3 é da DPOC, de progressão lenta e procura tardia.","A 3 não descreve asma."],"imgs":[],"ed":1,"rec":1},{"id":"S77.19","jid":"S77:19","prova":77,"item":19,"key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo para a construção do raciocínio clínico.","cmd":"Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na diástole, na fase de enchimento rápido.","Localizada na sístole, logo após a primeira bulha.","Localizada no final da sístole, antes da segunda bulha."],"gab":1,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à sobrecarga volumétrica, podendo ser auscultada no início da diástole, na fase denominada de enchimento ventricular rápido.","B3 é diastólica; logo após B1 fica o clique de ejeção.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"ed":1,"rec":1},{"id":"S77.20","jid":"S77:20","prova":77,"item":20,"key":"C19","tema":"a6","seg":"s2","mod":"prova","enun":"Hipertenso de longa data, com hipertrofia ventricular esquerda, tem um som grave logo antes da B1 na ausculta do foco mitral com a campânula.","cmd":"A quarta bulha (B4) relaciona-se a qual tipo de sobrecarga e a qual momento do ciclo cardíaco?","alts":["Sobrecarga volumétrica; início da diástole, no enchimento ventricular rápido","Sobrecarga pressórica; final da diástole, coincidente com a sístole atrial","Sobrecarga pressórica; início da sístole, junto ao fechamento da valva mitral","Sobrecarga volumétrica; final da sístole, durante a ejeção ventricular"],"gab":1,"com":["Sobrecarga de volume e enchimento rápido descrevem a B3.","<b>Justificativa oficial:</b> $B_4$ relaciona-se à sobrecarga pressórica, podendo ser auscultada no período telediastólico (final da diástole ou fase pré-sístole), coincidente com a sístole atrial.","O início da sístole é a própria B1; a B4 é telediastólica.","A B4 não é sistólica nem de volume."],"imgs":[],"ed":0,"rec":1},{"id":"S78.1","jid":"S78:1","prova":78,"item":1,"key":"C19","tema":"a6","seg":"s2","mod":"prova","enun":"Hipertenso de longa data, com hipertrofia ventricular esquerda, tem um som grave logo antes da B1 na ausculta do foco mitral com a campânula.","cmd":"A quarta bulha (B4) relaciona-se a qual tipo de sobrecarga e a qual momento do ciclo cardíaco?","alts":["Sobrecarga volumétrica; início da diástole, no enchimento ventricular rápido","Sobrecarga pressórica; final da diástole, coincidente com a sístole atrial","Sobrecarga pressórica; início da sístole, junto ao fechamento da valva mitral","Sobrecarga volumétrica; final da sístole, durante a ejeção ventricular"],"gab":1,"com":["Sobrecarga de volume e enchimento rápido descrevem a B3.","<b>Justificativa oficial:</b> $B_4$ relaciona-se à sobrecarga pressórica, podendo ser auscultada no período telediastólico (final da diástole ou fase pré-sístole), coincidente com a sístole atrial.","O início da sístole é a própria B1; a B4 é telediastólica.","A B4 não é sistólica nem de volume."],"imgs":[],"ed":0,"rec":1},{"id":"S78.2","jid":"S78:2","prova":78,"item":2,"key":"C20","tema":"a1","seg":"s3","mod":"prova","enun":"Paciente de 50 anos procura o pronto-socorro dizendo: \"estou evacuando com sangue\". O estudante registra no prontuário: \"QP: melena\".","cmd":"Sobre esse registro da queixa principal, assinale a alternativa correta.","alts":["É inadequado: a QP deve ser grafada nas palavras do paciente, e \"melena\" pode induzir a erro","É adequado: o termo técnico torna o prontuário mais preciso para os demais profissionais","É adequado, desde que o termo técnico seja seguido do tempo de evolução do sintoma","É inadequado: a QP deve conter o diagnóstico provável, como \"hemorragia digestiva\""],"gab":0,"com":["<b>Justificativa oficial:</b> Deve-se, sempre que possível, grafar a queixa principal nas palavras do paciente, utilizando-se, para tanto, de uma palavra, ou ocasionalmente de sentenças curtas e diretas, que traduzam o motivo da consulta. A utilização de termos técnicos em substituição à fala do paciente pode induzir a erros, notadamente, mas não exclusivamente, quando outros profissionais (médicos interconsultores, plantonistas subsequentes, preceptores de residência médica, por exemplo) também avaliarão o caso. Assim, uma queixa espontânea de \"evacuação com sangue\" registrada como \"melena\" poderia dar a entender que uma hematoquezia, uma enterorragia, ou até mesmo uma falsa percepção de sangramento nas fezes (refeição rica em alimentos naturalmente avermelhados) estariam excluídas, antes mesmo da \"evacuação com sangue\" ser melhor caracterizada em etapa posterior da anamnese.","O termo técnico substitui a fala do paciente e pode excluir, sem querer, enterorragia ou hematoquezia.","O tempo de evolução não corrige o problema: a palavra do paciente foi trocada por um diagnóstico.","A QP não deve conter diagnósticos formados."],"imgs":[],"ed":0,"rec":1},{"id":"S78.3","jid":"S78:3","prova":78,"item":3,"key":"C8","tema":"a9","seg":"s3","mod":"prova","enun":"Homem de 62 anos, hipertenso mal controlado, chega ao pronto-socorro com dor torácica que começou de forma súbita, já com intensidade máxima, descrita como \"rasgando\", irradiada para a região interescapular.","cmd":"Quais achados do exame físico reforçam a principal hipótese diagnóstica?","alts":["Dor reproduzida à palpação do esterno e das articulações condrocostais","Diferença de pressão arterial e de amplitude de pulso entre os membros superiores","Atrito pericárdico que melhora quando o paciente inclina o tórax para frente","Sibilos difusos e tempo expiratório prolongado na ausculta pulmonar"],"gab":1,"com":["Dor reproduzida à palpação sugere causa musculoesquelética (costocondrite), não dissecção.","<b>Justificativa oficial:</b> A dor da dissecção aguda da aorta torácica é classicamente intensa (já em sua instalação), podendo ocorrer irradiação para região interescapular. Outros sinais e sintomas podem associar-se à dor torácica, a depender da localização da dissecção: abafamento de bulhas, ingurgitamento jugular, diferença da PA entre MMSS e diferença de intensidade de pulso entre MMSS.","Atrito que alivia com o tórax inclinado para frente é da pericardite aguda.","Sibilos e expiração prolongada apontam para broncoespasmo (asma, DPOC)."],"imgs":[],"ed":0,"rec":1},{"id":"S78.4","jid":"S78:4","prova":78,"item":4,"key":"C21","tema":"a1","seg":"s1","mod":"prova","enun":"Atestado: \"Atesto que William Harvey, 37 anos, não apresenta ao exame clínico sinais e/ou sintomas de doenças que o impeçam de praticar musculação e natação.\"","cmd":"Pode-se inferir que o médico responsável pelo documento:","alts":["Baseou-se na anamnese e no exame físico.","Baseou-se apenas no exame físico, pois sintomas não se examinam.","Solicitou necessariamente eletrocardiograma e teste ergométrico.","Baseou-se apenas na anamnese, pois sinais dependem de exames."],"gab":0,"com":["<b>Justificativa oficial:</b> Ao afirmar que o paciente não apresenta \"ao exame clínico\", infere-se, por definição, que o médico refere-se à anamnese e ao exame físico.","Sintomas são colhidos na anamnese, que também faz parte do exame clínico.","Exames complementares não fazem parte do exame clínico.","Sinais são colhidos no exame físico, que faz parte do exame clínico."],"imgs":[],"ed":0,"rec":1},{"id":"S78.5","jid":"S78:5","prova":78,"item":5,"key":"C22","tema":"a12","seg":"s6","mod":"prova","enun":"Tórax em tonel, tosse diária produtiva e volumosa, cianose facial e dispneia crônica progressiva (de instalação gradativa durante anos).","cmd":"Qual padrão sindrômico respiratório, e qual fenótipo, melhor representariam os sinais e sintomas acima listados?","alts":["Síndrome obstrutiva. Fenótipo \"soprador rosa\".","Síndrome restritiva. Fenótipo \"congesto azulado\".","Síndrome restritiva. Fenótipo \"soprador rosa\".","Síndrome obstrutiva. Fenótipo \"congesto azulado\"."],"gab":3,"com":["O soprador rosa tem pele rósea, pouca secreção e emagrecimento; aqui há cianose e secreção volumosa.","A DPOC é obstrutiva, não restritiva.","A DPOC é obstrutiva, e o fenótipo com cianose e secreção é o congesto azulado.","<b>Justificativa oficial:</b> Os sintomas descritos estão classicamente relacionados às síndromes obstrutivas (DPOC, notadamente). Dentre os extremos fenotípicos das DPOC(s) temos o padrão \"soprador rosa\", que cursa com tonalidade de pele rósea, diminuição do panículo adiposo, sarcopenia e \"pouca\" congestão (secreção), pois predomina o enfisema (doença parenquimatosa). O \"congesto azulado\" descreve justamente a cianose (azulado) e a congestão (secretivo bronquítico). Ambas classificadas como doenças funcionalmente obstrutivas, sendo o soprador rosa portador de uma afecção predominantemente parenquimatosa (enfisema), e o congesto azulado portador de uma afecção predominantemente das vias respiratórias. Atente-se que, na prática, habitualmente encontramos graus intermediários entre esses extremos fenotípicos, associando enfisema (parênquima) e obstrução inflamatória (vias aéreas) em diferentes níveis."],"imgs":[],"ed":1,"rec":1},{"id":"S78.6","jid":"S78:6","prova":78,"item":6,"key":"C23","tema":"a7","seg":"s2","mod":"prova","enun":"Considerando os principais sinais e sintomas da estenose aórtica, analise as seguintes assertivas:<br>I) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar sintomas de dor cardíaca isquêmica.<br>II) Em função da dificuldade de adaptação a novas demandas metabólicas em órgãos-alvo, o paciente pode queixar-se de sensação de escurecimento visual e sensação pré-sincopal.<br>III) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar ictus propulsivo.<br>IV) Em função da lesão valvar, espera-se encontrar, à ausculta, um sopro diastólico ejetivo melhor audível no foco aórtico.","cmd":"Assinale a opção que contém as assertivas corretas.","alts":["Estão corretas as assertivas I, II, III e IV.","Estão corretas as assertivas II e IV.","Estão corretas as assertivas I, II e III.","Estão corretas as assertivas I e III."],"gab":2,"com":["A IV está errada: o sopro da estenose aórtica é sistólico (ejetivo), não diastólico.","A IV está errada e a I é correta (angina pela hipertrofia).","<b>Justificativa oficial:</b> O sopro esperado na estenose aórtica é sistólico, tornando incorreta a assertiva IV.","Falta a II: o débito fixo causa pré-síncope e escurecimento visual no esforço."],"imgs":[],"ed":1,"rec":1},{"id":"S78.7","jid":"S78:7","prova":78,"item":7,"key":"C24","tema":"a10","seg":"s4","mod":"prova","enun":"Homem de 78 anos, com estenose aórtica grave, perde a consciência de forma súbita durante uma caminhada, cai e corta o supercílio. Recupera-se em menos de um minuto, sem confusão.","cmd":"Acerca desse tipo de síncope, assinale a alternativa correta.","alts":["Habitualmente é precedida por sudorese e visão turva, o que permite a defesa","Habitualmente ocorre após ortostatismo prolongado em ambiente quente e cheio","Habitualmente a recuperação é lenta, com confusão mental por várias horas","Habitualmente não há sintomas pré-sincopais que permitam um esboço de defesa"],"gab":3,"com":["Sudorese e visão turva que dão tempo de se proteger são pródromos da síncope reflexa (vasovagal).","Ortostatismo prolongado em ambiente quente é o gatilho clássico da vasovagal.","Recuperação lenta com confusão lembra crise convulsiva; na síncope a recuperação é rápida.","<b>Justificativa oficial:</b> Habitualmente, não há presença de sintomas pré-sincopais que permitem um esboço de defesa."],"imgs":[],"ed":0,"rec":1},{"id":"S78.8","jid":"S78:8","prova":78,"item":8,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S78.9","jid":"S78:9","prova":78,"item":9,"key":"C6","tema":"a5","seg":"s1","mod":"prova","enun":"Três estudantes saudáveis servem de modelo na aula prática de exame do precórdio. O indivíduo A é brevilíneo, o B é normolíneo e o C é longilíneo, como na figura.","cmd":"Assinale a correlação correta entre o biotipo e a posição em que se espera palpar o ictus cordis.","alts":["A: 4º EIC, lateral à LHC; B: 5º EIC, sobre a LHC; C: 6º EIC, medial à LHC","A: 6º EIC, medial à LHC; B: 5º EIC, sobre a LHC; C: 4º EIC, lateral à LHC","A, B e C: 5º EIC, sobre a LHC, pois o biotipo não altera a posição do ictus","A: 5º EIC, sobre a LHC; B: 4º EIC, lateral à LHC; C: 6º EIC, medial à LHC"],"gab":0,"com":["<b>Justificativa oficial:</b> Em indivíduos longilíneos (C) o ictus pode estar deslocado medialmente e para baixo ($6^\\circ$ EIC, $2\\text{ cm}$ da linha hemiclavicular medialmente). Nos indivíduos brevilíneos (A) o ictus pode estar deslocado lateralmente ($2,0\\text{ cm}$ da linha hemiclavicular para esquerda) e para cima ($4^\\circ$ EIC). Nos indivíduos normolíneos (B) o ictus habitualmente é palpado no $5^\\circ$ EIC, sob a linha hemiclavicular esquerda.","Inverteu brevilíneo e longilíneo: no longilíneo o coração verticaliza e o ictus desce e vai para dentro.","O biotipo muda a posição normal do ictus, sem significar doença.","O normolíneo é o que tem ictus no 5º EIC sobre a linha hemiclavicular (LHC)."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S78.10","jid":"S78:10","prova":78,"item":10,"key":"C25","tema":"a9","seg":"s1","mod":"prova","enun":"Durante a anamnese de um paciente com dor torácica, ele aponta a região precordial com a mão e o punho cerrados, em movimentos circulares, para mostrar onde e como dói.","cmd":"Esse sinal semiológico, ligado à isquemia miocárdica, é conhecido como:","alts":["Sinal de Levine.","Sinal de Lewis.","Sinal de Kussmaul.","Sinal de Musset."],"gab":0,"com":["<b>Justificativa oficial:</b> O sinal de Levine é definido por sinal semiológico em que o paciente exibe - com a mão e punho cerrados, em movimentos circulares - a região do tórax anterior, para apontar o local doloroso durante um quadro de isquemia miocárdica (Extraído do livro-texto de referência).","Lewis não é o nome do sinal; a justificativa oficial frisa: \"Levine, não de Lewis\".","Kussmaul é o aumento da pressão venosa jugular na inspiração (pericardite constritiva).","Musset é o balanço da cabeça na insuficiência aórtica."],"imgs":[],"ed":0,"rec":1},{"id":"S78.11","jid":"S78:11","prova":78,"item":11,"key":"C26","tema":"a3","seg":"s1","mod":"prova","enun":"Ao final do atendimento, o estudante precisa registrar no prontuário a informação: \"Paciente em bom estado geral (BEG)\".","cmd":"Em qual etapa do exame clínico essa informação deve ser registrada?","alts":["Anamnese, na revisão de sistemas (sintomas gerais).","Exame físico, no exame físico geral (ectoscopia).","Anamnese, na história da moléstia atual.","Exame físico, no exame do aparelho cardiovascular."],"gab":1,"com":["A revisão de sistemas registra sintomas; o estado geral é um sinal observado pelo médico.","<b>Justificativa oficial:</b> O estado geral (BEG, REG, MEG) do paciente é componente do exame físico (achado, sinal, informação observada), especificamente do exame físico geral, não confundindo-se com a etapa da anamnese, notadamente com a etapa denominada Revisão Sintomatológica (revisão sistemática de sintomas), outra designação para Anamnese Especial, em que são registrados sintomas.","A HMA registra a história do sintoma principal contada pelo paciente.","O estado geral pertence ao exame físico geral, não a um aparelho específico."],"imgs":[],"ed":0,"rec":1},{"id":"S78.12","jid":"S78:12","prova":78,"item":12,"key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo para a construção do raciocínio clínico.","cmd":"Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na diástole, na fase de enchimento rápido.","Localizada na sístole, logo após a primeira bulha.","Localizada no final da sístole, antes da segunda bulha."],"gab":1,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à sobrecarga volumétrica, podendo ser auscultada no início da diástole, na fase denominada de enchimento ventricular rápido.","B3 é diastólica; logo após B1 fica o clique de ejeção.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"ed":1,"rec":1},{"id":"S78.13","jid":"S78:13","prova":78,"item":13,"key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnosticada e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e o ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais: 1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?; 2. derrame pleural à direita, de etiologia tromboembólica? O raio X de tórax confirmou a presença do volumoso derrame pleural à direita.<br>Acerca do exame físico dessa paciente, analise as seguintes assertivas.<br>I) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.<br>II) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.<br>III) Espera-se encontrar uma percussão submaciça no lado acometido.<br>IV) Espera-se encontrar sons respiratórios diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas:","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, e a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando à limitação dos movimentos (expansibilidade) no hemitórax acometido. Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta. Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"ed":1,"rec":1},{"id":"S78.14","jid":"S78:14","prova":78,"item":14,"key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero-Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro.","cmd":"Acerca da manobra de Rivero-Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","alts":["Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco mitral, insuficiência mitral, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":0,"com":["<b>Justificativa oficial:</b> A manobra de Rivero-Carvallo é utilizada para diferenciar sopros causados pela insuficiência tricúspide da insuficiência mitral - ambos sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"ed":1,"rec":1},{"id":"S78.15","jid":"S78:15","prova":78,"item":15,"key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam, de forma involuntária, a resistência vascular periférica.","cmd":"Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente ao assumir a posição de cócoras?","alts":["Shunt arteriovenoso, direita-esquerda.","Shunt arteriovenoso, esquerda-direita.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":0,"com":["<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrógrada a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (shunt) que cursam com passagem de sangue da direita para a esquerda.","No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"ed":1,"rec":1},{"id":"S78.16","jid":"S78:16","prova":78,"item":16,"key":"C5","tema":"a8","seg":"s2","mod":"prova","enun":"Mulher de 74 anos procura o ambulatório por crises de palpitação. Relata que, durante as crises, sente urgência para urinar e urina em maior volume. Ao exame: ritmo cardíaco irregular, intensidade de B1 variável de um batimento para outro e número de pulsações radiais menor que o de batimentos contados na ausculta.","cmd":"Qual o diagnóstico mais provável e a explicação para as queixas urinárias?","alts":["Bloqueio atrioventricular total; liberação de ADH estimulada pela bradicardia","Extrassístoles ventriculares; hipoperfusão renal pelo débito cardíaco baixo","Taquicardia sinusal; aumento do fluxo renal provocado pela ansiedade","Fibrilação atrial; liberação de peptídeo natriurético atrial pela distensão atrial"],"gab":3,"com":["No BAVT o ritmo é lento e regular; o ADH reduz a diurese, não aumenta.","Extrassístoles isoladas não explicam ritmo irregular contínuo com B1 variável; hipoperfusão reduziria a urina.","Na taquicardia sinusal o ritmo é regular e a B1 é constante e hiperfonética.","<b>Justificativa oficial:</b> A FA pode levar a queixas urinárias, relacionadas ao peptídeo natriurético atrial. A variação da fonese de $B_1$ pode ser encontrada nos casos de FA, relacionando-se aos diferentes tempos de enchimento ventricular, estando relacionada às diferentes frequências de estímulos que podem chegar ao VE, a depender do período refratário do NAV. Pode ocorrer dissociação ausculta-pulso nos casos de estímulos elétricos de alta frequência que, porventura, cheguem ao VE. Nestes casos ocorrerá sístole ventricular e fechamento das valvas atrioventriculares, mas o volume de sangue ejetado pode ser insuficiente (pelo enchimento ventricular esquerdo limitado) para gerar pulso periférico palpável."],"imgs":[],"ed":0,"rec":1},{"id":"S78.17","jid":"S78:17","prova":78,"item":17,"key":"C29","tema":"a3","seg":"s1","mod":"prova","enun":"Analise as afirmações sobre os dados vitais do adulto em repouso:<br>1) Considera-se febril o paciente com temperatura axilar acima de 37,8 °C.<br>2) A frequência de pulso normal situa-se entre 60 e 100 ppm; usa-se bradi, normo ou taquisfígmico para o pulso.<br>3) A frequência respiratória normal encontra-se na faixa de 14/16 até 20 irpm.","cmd":"Estão corretas as afirmações:","alts":["1 e 2, apenas.","1, 2 e 3.","2 e 3, apenas.","2, apenas."],"gab":1,"com":["A 3 também está correta: a FR normal do adulto vai de 14/16 a 20 irpm.","<b>Justificativa oficial:</b>  1) Considera-se febril o paciente com TAX acima de $37,8^\\circ\\text{C}$. 2) A frequência de pulso normal situa-se entre $60$ e $100\\text{ ppm}$. Usa-se o termo bradi, normo ou taquisfigmico para as medidas de frequência de pulso. Bradi, normo ou taquicárdico refere-se ao número de batimentos (avaliado pela ausculta ou palpação do ictus). 3) Frequências respiratórias normais (para adultos) encontram-se na faixa de $14/16$ até $20\\text{ irpm}$ (com variações - além da idade/sexo - na literatura).","A 1 também está correta: febre é TAX acima de 37,8 °C.","A 1 e a 3 também estão corretas."],"imgs":[],"ed":0,"rec":1},{"id":"S78.18","jid":"S78:18","prova":78,"item":18,"key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias, desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope, alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio.<br>Analise as seguintes assertivas.<br>1. Ausência de pródromos ou gatilhos detectáveis.<br>2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.<br>3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em indivíduo jovem (adolescente/adulto jovem) previamente hígido.<br>4. Histórico de cardiopatia de base conhecida pelo médico e paciente.","cmd":"São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas:","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vaso-vagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"ed":1,"rec":1},{"id":"S78.19","jid":"S78:19","prova":78,"item":19,"key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório.<br>Em um paciente portador de pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax.","cmd":"Os achados esperados no lado do pneumotórax, referentes à palpação (frêmito toracovocal, FTV), percussão e ausculta para este paciente são, respectivamente:","alts":["FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":0,"com":["<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolida pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líquido); no pneumotórax há ar e o som é timpânico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"ed":1,"rec":1},{"id":"S78.20","jid":"S78:20","prova":78,"item":20,"key":"C30","tema":"a8","seg":"s1","mod":"prova","enun":"Durante a realização do exame físico de um paciente sob seus cuidados, especificamente na etapa de aferição dos dados vitais, você encontrou uma frequência de pulso (FP) de repouso de 50 ppm (pulsações por minuto). A pressão arterial, a frequência respiratória e a temperatura axilar encontravam-se normais. Você considerou, inicialmente, como possíveis causas para esse achado o uso de medicação betabloqueadora para controle da hipertensão arterial, associado ao hábito relatado pelo paciente de realizar atividades físicas frequentes e de forma regular, obtido durante a anamnese.","cmd":"Acerca da frequência de pulso desse paciente, pode-se afirmar:","alts":["É incorreto chamá-la de bradicardia: foi aferida no pulso (ppm), e não nos batimentos (bpm)","É correto chamá-la de bradicardia: FC e FP são termos sinônimos na prática clínica diária","É correto chamá-la de bradisfigmia só quando houver dissociação entre pulso e ausculta","É incorreto chamá-la de bradi: no atleta a faixa normal de pulso começa em 40 ppm"],"gab":0,"com":["<b>Justificativa oficial:</b> A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus? A Frequência Cardíaca (FC) é medida por batimentos por minuto (bpm). Esfígmico é relativo ao pulso e é medido pelo número de pulsações por minuto (ppm). FC - bpm. FP - ppm. A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que pulso é um fenômeno físico distinto de batimento. Embora na maioria absoluta das vezes seus valores numéricos realmente sejam equivalentes ou iguais, e que fisiologicamente são inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos), achado importante para suspeição e/ou diagnóstico de algumas arritmias, é um dentre outros exemplos da importância prática dessa distinção, indo além de um suposto preciosismo léxico da nomenclatura médica.","FC (bpm) e FP (ppm) são fenômenos diferentes; a dissociação pulso-ausculta mostra por quê.","Bradisfigmia é qualquer FP abaixo de 60 ppm, com ou sem dissociação.","A faixa de normalidade usada na prova é 60 a 100; 50 ppm é bradisfigmia."],"imgs":[],"ed":1,"rec":1},{"id":"S78.21","jid":"S78:21","prova":78,"item":21,"key":"C13","tema":"a2","seg":"s3","mod":"prova","enun":"Durante a anamnese de uma mulher de 34 anos, o estudante anota: 1) G2P2A0, partos normais; 2) vacinação em dia; 3) nega internações clínicas ou cirúrgicas; 4) hipertensão arterial há 5 anos, em uso de losartana.","cmd":"Quais dessas informações devem ser registradas na História Patológica Pregressa (Antecedentes Pessoais)?","alts":["Apenas 4, pois a HPP registra só doenças.","Apenas 1 e 4.","1, 2, 3 e 4.","Apenas 2 e 3."],"gab":2,"com":["A HPP registra informações de interesse médico mesmo que não patológicas (gestação, vacinas, ausência de internações).","Gestação e vacinação também entram, mesmo sem ser doença.","<b>Justificativa oficial:</b> O campo História Patológica Pregressa (HPP), também denominado Antecedentes Pessoais (AP), é destinado ao registro de informações pessoais do paciente e de interesse médico, mesmo que não patológico. Gestação, vacinação e a não necessidade de internações (clínicas ou cirúrgicas) são informações de interesse médico, embora não signifiquem patologias ou comorbidades.","A hipertensão e a história obstétrica também pertencem à HPP."],"imgs":[],"ed":0,"rec":1},{"id":"S78.22","jid":"S78:22","prova":78,"item":22,"key":"C31","tema":"a6","seg":"s3","mod":"prova","enun":"Idoso com estenose aórtica grave e hipertrofia ventricular esquerda tem ritmo tríplice por B4, com características de galope. Meses depois, o eletrocardiograma mostra fibrilação atrial.","cmd":"Assinale a alternativa correta.","alts":["O galope por B4 é atrial e tende a desaparecer com a FA, pela perda da sístole atrial","O galope por B4 é ventricular e se intensifica com a FA, pelo enchimento mais rápido","A B4 indica sobrecarga volumétrica e persiste na FA, por depender do enchimento rápido","A B4 indica sobrecarga pressórica e se intensifica na FA, pela contração atrial forte"],"gab":0,"com":["<b>Justificativa oficial:</b> $B_4$ relaciona-se a sobrecargas pressóricas, podendo surgir na estenose aórtica, notadamente quando existe hipertrofia ventricular. O ritmo de galope de $B_4$ é conhecido como galope atrial. A fibrilação atrial (perda da sístole atrial) é responsável pelo desaparecimento de $B_4$ que depende, em sua fisiopatologia auscultatória, da presença da sístole atrial.","Galope ventricular é o da B3; e a FA elimina a B4.","A B4 é de pressão e depende da sístole atrial, que a FA elimina.","Na FA não há contração atrial organizada, por isso a B4 desaparece."],"imgs":[],"ed":0,"rec":1},{"id":"S78.23","jid":"S78:23","prova":78,"item":23,"key":"C32","tema":"a11","seg":"s2","mod":"prova","enun":"Analise as afirmações:<br>I) Platipneia é a dispneia que surge quando o paciente assume a posição ortostática e que é aliviada com o decúbito dorsal.<br>II) Trepopneia é a dispneia que surge com a mudança de decúbito lateral e pode sinalizar afecções pleurais.<br>III) A dispneia paroxística noturna relaciona-se, fisiopatologicamente, à ortopneia.<br>IV) Na ortopneia, o paciente sente alívio ao assumir o decúbito dorsal.","cmd":"Estão corretas as afirmações:","alts":["I, II, III e IV.","I e IV.","I, II e III.","II e III."],"gab":2,"com":["A IV está errada: na ortopneia o paciente não tolera deitar e alivia sentado ou em pé.","A IV está errada, e a II e a III estão corretas.","<b>Justificativa oficial:</b> Conceitual. Platipneia é o nome dado à dispneia que surge quando o paciente assume a posição ortostática, e que é aliviada com o decúbito dorsal. Em termos gerais, seria o contrário da Ortopneia, em que o paciente sente alívio quando assume a posição ortostática ou assentado, e não tolera o decúbito em função da dispneia que se instala/agrava nessa posição. A Platipneia pode sinalizar eventuais patologias, como a pericardite, por exemplo. A Trepopneia está relacionada à dispneia que surge com a mudança de decúbito lateral, podendo sinalizar afecções pleurais (pleurite, derrame pleural), por exemplo (o paciente tende a apresentar alívio quando em decúbito lateral sobre o lado acometido). A dispneia paroxística noturna relaciona-se, fisiopatologicamente, à Ortopneia.","Falta a I, correta."],"imgs":[],"ed":0,"rec":1},{"id":"S78.24","jid":"S78:24","prova":78,"item":24,"key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável), esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som broncovesicular.","Som claro pulmonar.","Som timpânico.","Som maciço."],"gab":0,"com":["<b>Justificativa oficial:</b> Som broncovesicular é som normal que pode ser encontrado pela ausculta, a depender do sítio torácico auscultado. Os demais sons, embora normais (a depender do sítio examinado), referem-se à percussão, e não à ausculta.","Claro pulmonar é normal, mas é som de percussão, não de ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"ed":1,"rec":1},{"id":"S78.25","jid":"S78:25","prova":78,"item":25,"key":"C34","tema":"a6","seg":"s3","mod":"prova","enun":"Gestante de 30 semanas, sem cardiopatia, tem ritmo em três tempos na ausculta, sem as características de galope. Na mesma enfermaria, um paciente com insuficiência cardíaca descompensada tem B3 em galope.","cmd":"Sobre a terceira bulha (B3), assinale a alternativa correta.","alts":["Ocorre na pré-sístole; o galope é atrial e a B3 é sempre patológica na gestação","Ocorre no enchimento rápido; o galope é atrial e indica sobrecarga de pressão","Ocorre no enchimento rápido; o galope é ventricular e pode haver B3 fisiológica na gestação","Ocorre na sístole; o galope é ventricular e indica estenose aórtica grave"],"gab":2,"com":["Pré-sístole e galope atrial são da B4; e a B3 pode ser fisiológica na gestação.","O galope por B3 é ventricular, e a B3 é de volume, não de pressão.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à fase de enchimento rápido (início da diástole), podendo estar presente em condições que cursam com sobrecarga volumétrica. O ritmo tríplice de galope por $B_3$ é conhecido como galope ventricular. Já o ritmo de três tempos, por adição de $B_3$, sem as características auscultatórias de galope, pode ser audível em algumas condições fisiológicas, como na gestação.","A B3 é diastólica (enchimento rápido), não sistólica."],"imgs":[],"ed":0,"rec":1},{"id":"S78.26","jid":"S78:26","prova":78,"item":26,"key":"C14","tema":"a12","seg":"s6","mod":"prova","enun":"Mulher de 23 anos, asmática, chega ao pronto-socorro em crise. O pico de fluxo expiratório (medido com o aparelho portátil peak flow) é de 45% do previsto. Após o tratamento, sobe para 85% do previsto.","cmd":"Assinale a interpretação correta.","alts":["A asma é restritiva, e o aumento do pico de fluxo indica ganho de volume pulmonar total","A asma é obstrutiva, e o aumento do pico de fluxo indica melhora objetiva da obstrução","A asma é obstrutiva, mas o pico de fluxo não serve para acompanhar a resposta ao tratamento","A asma é parenquimatosa, e o aumento do pico de fluxo indica reabsorção de edema alveolar"],"gab":1,"com":["A asma não é restritiva: limita o fluxo expiratório, não o volume pulmonar.","<b>Justificativa oficial:</b> A ASMA é uma doença inflamatória crônica das vias aéreas, com períodos de exacerbação. A ASMA pode ser classificada como uma doença obstrutiva ao fluxo (e volume) expiratório. O aumento do pico de fluxo, aferido por um instrumento portátil denominado Peak Flow, pode denotar melhora objetiva do padrão obstrutivo, notadamente quando a medida atinge níveis percentuais próximos àqueles esperados para o paciente hígido, ou próximos ao nível do paciente asmático controlado.","O peak flow é justamente a forma objetiva e portátil de ver a melhora da obstrução.","A asma é doença das vias aéreas, não do parênquima; não há edema alveolar."],"imgs":[],"ed":0,"rec":1},{"id":"S78.27","jid":"S78:27","prova":78,"item":27,"key":"C35","tema":"a7","seg":"s2","mod":"prova","enun":"Mulher de 60 anos com prolapso de valva mitral e insuficiência mitral importante é examinada pelo aluno, que precisa localizar o sopro no ciclo cardíaco.","cmd":"Em que fase do ciclo ocorre o sopro e por quê?","alts":["Na sístole, pelo refluxo do ventrículo esquerdo para o átrio esquerdo","Na diástole, pelo refluxo do átrio esquerdo para o ventrículo esquerdo","Na diástole, pela passagem do sangue por uma valva mitral estreitada","Na sístole, pela ejeção do sangue através da valva aórtica estreitada"],"gab":0,"com":["<b>Justificativa oficial:</b> Durante a sístole ventricular, a válvula mitral insuficiente pode permitir que parte do sangue reflua do ventrículo ao átrio esquerdo, causando turbilhonamento e sopro, nessa fase do ciclo cardíaco (sístole).","Na diástole a mitral está aberta; o sangue passa do AE para o VE normalmente.","Valva mitral estreitada é a estenose mitral (sopro diastólico).","Ejeção por valva aórtica estreita é a estenose aórtica."],"imgs":[],"ed":0,"rec":1},{"id":"S78.28","jid":"S78:28","prova":78,"item":28,"key":"C36","tema":"a8","seg":"s1","mod":"prova","enun":"Na aula de dados vitais, o professor pede que os alunos definam a faixa de normalidade e a nomenclatura correta da frequência cardíaca (FC) e da frequência de pulso (FP) em repouso.","cmd":"Assinale a alternativa correta.","alts":["Normal de 50 a 90; acima de 90 pelo pulso é taquicardia, e pela ausculta, taquisfigmia","Normal de 60 a 100; acima de 100, pelo pulso ou pela ausculta, é sempre taquicardia","Normal de 60 a 100; acima de 100 pela ausculta é taquicardia, e pelo pulso, taquisfigmia","Normal de 70 a 110; abaixo de 70 pela ausculta é bradisfigmia, e pelo pulso, bradicardia"],"gab":2,"com":["Faixa errada e nomes trocados: taquisfigmia é do pulso, taquicardia é do coração.","O nome depende de onde foi contado: pulso (esfigmia) ou coração (cardia).","<b>Justificativa oficial:</b> A faixa de normalidade da FP e da FC em repouso é de $60$ a $100$ (ppm ou bpm). Frequências acima de $100$ são consideradas taqui (seja cardíaca ou esfígmica). Frequências abaixo de $60$ são consideradas bradi (seja cardíaca ou esfígmica). A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida através da análise dos batimentos por minuto (bpm), seja pela ausculta ou palpação do ictus. Bradi ou taquisfigmia é relativo ao pulso, e é medido pelo número de pulsações por minuto (ppm). A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que o pulso é um fenômeno físico sempre relacionado a um batimento cardíaco. Embora na maioria dos casos seus valores numéricos realmente sejam equivalentes, ou iguais, e que fisiologicamente eles estão inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos) é, por exemplo, achado importante para suspeição clínica de algumas arritmias, como a Fibrilação Atrial e as Extrassístoles. A importância prática dessa distinção (FC e FP) vai muito além de um suposto preciosismo léxico da nomenclatura médica.","Faixa errada e nomes trocados."],"imgs":[],"ed":0,"rec":1},{"id":"S78.29","jid":"S78:29","prova":78,"item":29,"key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido (até recentemente denominado de paradoxal) da segunda bulha (B2), analise as seguintes assertivas.<br>1. O desdobramento ocorre na fase expiratória.<br>2. O bloqueio completo de ramo esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.<br>3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.<br>4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As assertivas 1, 2 e 3 estão corretas.","As assertivas 1 e 2 estão corretas.","As assertivas 2 e 4 estão corretas.","As assertivas 3 e 4 estão corretas."],"gab":1,"com":["A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; não é persistente.","<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","Ambas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"ed":1,"rec":1},{"id":"S78.30","jid":"S78:30","prova":78,"item":30,"key":"C37","tema":"a11","seg":"s1","mod":"prova","enun":"Nome dado à cianose que tende a melhorar com a oferta de oxigênio (O<sub>2</sub>) suplementar.","cmd":"Assinale uma alternativa.","alts":["Cianose central.","Cianose periférica.","Cianose por metemoglobinemia.","Cianose segmentar por estase venosa."],"gab":0,"com":["<b>Justificativa oficial:</b> As cianoses que cursam com déficits de bomba (circulatória Q; ventilatória V), em seus mais diferentes níveis (tecidual, orgânico etc.) são denominadas de centrais. Por cursarem com hipoxemia (baixa quantidade de $\\text{O}_2$ no sangue - ligado à Hb), elas tendem a responder melhor à oferta de $\\text{O}_2$ suplementar.","A periférica é de baixo fluxo (o sangue chega saturado); melhora com calor e massagem, não com O2.","Na hemoglobinopatia o problema é a hemoglobina anormal; o O2 não corrige.","A estase venosa é periférica e localizada; não responde ao O2."],"imgs":[],"ed":1,"rec":1},{"id":"S79.1","jid":"S79:1","prova":79,"item":1,"key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnosticada e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e o ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais: 1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?; 2. derrame pleural à direita, de etiologia tromboembólica? O raio X de tórax confirmou a presença do volumoso derrame pleural à direita.<br>Acerca do exame físico dessa paciente, analise as seguintes assertivas.<br>I) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.<br>II) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.<br>III) Espera-se encontrar uma percussão submaciça no lado acometido.<br>IV) Espera-se encontrar sons respiratórios diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas:","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, e a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando à limitação dos movimentos (expansibilidade) no hemitórax acometido. Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta. Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"ed":1,"rec":1},{"id":"S79.3","jid":"S79:3","prova":79,"item":3,"key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável), esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som claro pulmonar.","Som broncovesicular.","Som timpânico.","Som maciço."],"gab":1,"com":["Claro pulmonar é normal, mas é som de percussão, não de ausculta.","<b>Justificativa oficial:</b> Som broncovesicular é som de ausculta, que pode ser considerado normal a depender do sítio examinado. Os demais sons referem-se a sons produzidos pela percussão torácica e não à ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"ed":1,"rec":1},{"id":"S79.4","jid":"S79:4","prova":79,"item":4,"key":"C40","tema":"a5","seg":"s1","mod":"prova","enun":"Paciente com estenose pulmonar grave e hipertrofia de ventrículo direito. À inspeção do precórdio, observa-se, a cada sístole, uma depressão na região apical, onde se esperaria o ictus.","cmd":"Esse achado decorre de:","alts":["Hipertrofia do VE, que desloca o ictus para baixo e para fora da linha hemiclavicular","Derrame pericárdico, que afasta o coração da parede torácica e apaga o ictus","Biotipo longilíneo, que verticaliza o coração e desloca o ictus para cima","A ponta do coração passar a ser formada pelo VD, com retração sistólica apical"],"gab":3,"com":["A hipertrofia do VE dá ictus propulsivo e desviado, não retração.","O derrame apaga o ictus, mas não produz retração sistólica.","No longilíneo o ictus desce (6º EIC) e vai para dentro; não retrai.","<b>Justificativa oficial:</b> O ictus está relacionado ao choque da ponta cardíaca, habitualmente composta por musculatura do ventrículo esquerdo (VE). Em casos de HVD a ponta do coração passa a ser composta pela musculatura do VD, levando ao fenômeno observado de retração sistólica apical."],"imgs":[],"ed":0,"rec":1},{"id":"S79.5","jid":"S79:5","prova":79,"item":5,"key":"C6","tema":"a5","seg":"s1","mod":"prova","enun":"Três estudantes saudáveis servem de modelo na aula prática de exame do precórdio. O indivíduo A é brevilíneo, o B é normolíneo e o C é longilíneo, como na figura.","cmd":"Assinale a correlação correta entre o biotipo e a posição em que se espera palpar o ictus cordis.","alts":["A: 4º EIC, lateral à LHC; B: 5º EIC, sobre a LHC; C: 6º EIC, medial à LHC","A: 6º EIC, medial à LHC; B: 5º EIC, sobre a LHC; C: 4º EIC, lateral à LHC","A, B e C: 5º EIC, sobre a LHC, pois o biotipo não altera a posição do ictus","A: 5º EIC, sobre a LHC; B: 4º EIC, lateral à LHC; C: 6º EIC, medial à LHC"],"gab":0,"com":["<b>Justificativa oficial:</b> Em indivíduos longilíneos (C) o ictus pode estar deslocado medialmente e para baixo ($6^\\circ$ EIC, $2\\text{ cm}$ da linha hemiclavicular medialmente). Nos indivíduos brevilíneos (A) o ictus pode estar deslocado lateralmente ($2,0\\text{ cm}$ da linha hemiclavicular para esquerda) e para cima ($4^\\circ$ EIC). Nos indivíduos normolíneos (B) o ictus habitualmente é palpado no $5^\\circ$ EIC, sob a linha hemiclavicular esquerda.","Inverteu brevilíneo e longilíneo: no longilíneo o coração verticaliza e o ictus desce e vai para dentro.","O biotipo muda a posição normal do ictus, sem significar doença.","O normolíneo é o que tem ictus no 5º EIC sobre a linha hemiclavicular (LHC)."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S79.6","jid":"S79:6","prova":79,"item":6,"key":"C9","tema":"a11","seg":"s2","mod":"prova","enun":"Paciente relata falta de ar que surge quando se levanta da cama e fica em pé, e que melhora quando volta a deitar-se de costas. Ao contrário do que ocorre no edema agudo de pulmão, ele não tolera a posição ortostática.","cmd":"Esse tipo de dispneia denomina-se:","alts":["Platipneia.","Ortopneia.","Trepopneia.","Dispneia paroxística noturna."],"gab":0,"com":["<b>Justificativa oficial:</b> Nome dado à dispneia que - ao contrário da dispneia do edema agudo de pulmão (Ortopneia) - piora com a posição ortostática: Platipneia. A Trepopneia relaciona-se à dispneia que piora ou melhora com determinado decúbito lateral.","Ortopneia é a dispneia que piora deitado e alivia sentado ou em pé, como no edema agudo de pulmão.","Trepopneia é a dispneia que muda com o decúbito lateral.","A dispneia paroxística noturna acorda o paciente e se relaciona à ortopneia."],"imgs":[],"ed":0,"rec":1},{"id":"S79.7","jid":"S79:7","prova":79,"item":7,"key":"C13","tema":"a2","seg":"s3","mod":"prova","enun":"Durante a anamnese de uma mulher de 34 anos, o estudante anota: 1) G2P2A0, partos normais; 2) vacinação em dia; 3) nega internações clínicas ou cirúrgicas; 4) hipertensão arterial há 5 anos, em uso de losartana.","cmd":"Quais dessas informações devem ser registradas na História Patológica Pregressa (Antecedentes Pessoais)?","alts":["Apenas 4, pois a HPP registra só doenças.","Apenas 1 e 4.","1, 2, 3 e 4.","Apenas 2 e 3."],"gab":2,"com":["A HPP registra informações de interesse médico mesmo que não patológicas (gestação, vacinas, ausência de internações).","Gestação e vacinação também entram, mesmo sem ser doença.","<b>Justificativa oficial:</b> O campo História Patológica Pregressa (HPP), também denominado Antecedentes Pessoais (AP), é destinado ao registro de informações pessoais do paciente e de interesse médico, mesmo que não patológico. Gestação, vacinação e a não necessidade de internações (clínicas ou cirúrgicas) são informações de interesse médico, embora não signifiquem patologias ou comorbidades.","A hipertensão e a história obstétrica também pertencem à HPP."],"imgs":[],"ed":0,"rec":1},{"id":"S79.8","jid":"S79:8","prova":79,"item":8,"key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório.<br>Em um paciente portador de pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax.","cmd":"Os achados esperados no lado do pneumotórax, referentes à palpação (frêmito toracovocal, FTV), percussão e ausculta para este paciente são, respectivamente:","alts":["FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":0,"com":["<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolida pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líq
