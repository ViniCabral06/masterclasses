uido); no pneumotórax há ar e o som é timpânico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"ed":1,"rec":1},{"id":"S79.9","jid":"S79:9","prova":79,"item":9,"key":"C41","tema":"a3","seg":"s3","mod":"prova","enun":"O termo \"fácies atípica\", consagrado na medicina para designar a fácies normal, pode gerar confusão com as atipias celulares. Por isso alguns autores preferem uma sinonímia igualmente consagrada.","cmd":"Qual é essa sinonímia?","alts":["Fácies hipocrática.","Fácies incaracterística.","Fácies típica.","Fácies inexpressiva."],"gab":1,"com":["Hipocrática é a fácies do paciente grave, em fase terminal.","<b>Justificativa oficial:</b> Atípico é formado pelo prefixo \"a\" (não, sem) + \"típico\" (característico, comum). Para a descrição da fácies, literalmente a palavra designa um conjunto de elementos faciais não característico (ou não típico/não comum) de uma doença. Embora a expressão fácies atípica esteja consagrada na medicina para designação da fácies normal (Gauss), alguns autores chamam a atenção para um possível potencial de confusão, por exemplo, com as atipias celulares (que designam alterações ou desvios da normalidade). Fácies incaracterística é a sinonímia, igualmente consagrada, para designar esse tipo facial.","\"Típica\" seria característica de uma doença: é o oposto.","Fácies inexpressiva (em máscara) é a parkinsoniana."],"imgs":[],"ed":0,"rec":1},{"id":"S79.10","jid":"S79:10","prova":79,"item":10,"key":"C42","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo com a construção do raciocínio clínico.","cmd":"Aponte a localização esperada no ciclo cardíaco do seguinte achado auscultatório: quarta bulha cardíaca (B4).","alts":["Localizada na diástole, na fase de enchimento rápido.","Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na sístole, logo após o fechamento das valvas AV.","Localizada entre B1 e B2, coincidente com a ejeção ventricular."],"gab":1,"com":["Diástole com enchimento rápido é a posição da B3.","<b>Justificativa oficial:</b> $B_4$ relaciona-se à sobrecarga pressórica, podendo ser auscultada no final da diástole (coincidente com a contração atrial), no período - também - denominado de fase pré-sistólica (ainda na diástole). Relaciona-se a sobrecargas pressóricas.","A B4 vem antes da B1, não depois.","Entre B1 e B2 é sístole; a B4 é telediastólica."],"imgs":[],"ed":1,"rec":1},{"id":"S79.11","jid":"S79:11","prova":79,"item":11,"key":"C20","tema":"a1","seg":"s3","mod":"prova","enun":"Paciente de 50 anos procura o pronto-socorro dizendo: \"estou evacuando com sangue\". O estudante registra no prontuário: \"QP: melena\".","cmd":"Sobre esse registro da queixa principal, assinale a alternativa correta.","alts":["É inadequado: a QP deve ser grafada nas palavras do paciente, e \"melena\" pode induzir a erro","É adequado: o termo técnico torna o prontuário mais preciso para os demais profissionais","É adequado, desde que o termo técnico seja seguido do tempo de evolução do sintoma","É inadequado: a QP deve conter o diagnóstico provável, como \"hemorragia digestiva\""],"gab":0,"com":["<b>Justificativa oficial:</b> Deve-se, sempre que possível, grafar a queixa principal nas palavras do paciente, utilizando-se, para tanto, de uma palavra, ou ocasionalmente de sentenças curtas e diretas, que traduzam o motivo da consulta. A utilização de termos técnicos em substituição à fala do paciente pode induzir a erros, notadamente, mas não exclusivamente, quando outros profissionais (médicos interconsultores, plantonistas subsequentes, preceptores de residência médica, por exemplo) também avaliarão o caso. Assim, uma queixa espontânea de \"evacuação com sangue\" registrada como \"melena\" poderia dar a entender que uma hematoquezia, uma enterorragia, ou até mesmo uma falsa percepção de sangramento nas fezes (refeição rica em alimentos naturalmente avermelhados) estariam excluídas, antes mesmo da \"evacuação com sangue\" ser melhor caracterizada em etapa posterior da anamnese.","O termo técnico substitui a fala do paciente e pode excluir, sem querer, enterorragia ou hematoquezia.","O tempo de evolução não corrige o problema: a palavra do paciente foi trocada por um diagnóstico.","A QP não deve conter diagnósticos formados."],"imgs":[],"ed":0,"rec":1},{"id":"S79.12","jid":"S79:12","prova":79,"item":12,"key":"C25","tema":"a9","seg":"s1","mod":"prova","enun":"Durante a anamnese de um paciente com dor torácica, ele aponta a região precordial com a mão e o punho cerrados, em movimentos circulares, para mostrar onde e como dói.","cmd":"Esse sinal semiológico, ligado à isquemia miocárdica, é conhecido como:","alts":["Sinal de Levine.","Sinal de Lewis.","Sinal de Kussmaul.","Sinal de Musset."],"gab":0,"com":["<b>Justificativa oficial:</b> O sinal de Levine é definido por sinal semiológico em que o paciente exibe - com a mão e punho cerrados, em movimentos circulares - a região do tórax anterior, para apontar o local doloroso durante um quadro de isquemia miocárdica (Extraído do livro-texto de referência).","Lewis não é o nome do sinal; a justificativa oficial frisa: \"Levine, não de Lewis\".","Kussmaul é o aumento da pressão venosa jugular na inspiração (pericardite constritiva).","Musset é o balanço da cabeça na insuficiência aórtica."],"imgs":[],"ed":0,"rec":1},{"id":"S79.13","jid":"S79:13","prova":79,"item":13,"key":"C36","tema":"a8","seg":"s1","mod":"prova","enun":"Na aula de dados vitais, o professor pede que os alunos definam a faixa de normalidade e a nomenclatura correta da frequência cardíaca (FC) e da frequência de pulso (FP) em repouso.","cmd":"Assinale a alternativa correta.","alts":["Normal de 50 a 90; acima de 90 pelo pulso é taquicardia, e pela ausculta, taquisfigmia","Normal de 60 a 100; acima de 100, pelo pulso ou pela ausculta, é sempre taquicardia","Normal de 60 a 100; acima de 100 pela ausculta é taquicardia, e pelo pulso, taquisfigmia","Normal de 70 a 110; abaixo de 70 pela ausculta é bradisfigmia, e pelo pulso, bradicardia"],"gab":2,"com":["Faixa errada e nomes trocados: taquisfigmia é do pulso, taquicardia é do coração.","O nome depende de onde foi contado: pulso (esfigmia) ou coração (cardia).","<b>Justificativa oficial:</b> A faixa de normalidade da FP e da FC em repouso é de $60$ a $100$ (ppm ou bpm). Frequências acima de $100$ são consideradas taqui (seja cardíaca ou esfígmica). Frequências abaixo de $60$ são consideradas bradi (seja cardíaca ou esfígmica). A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida através da análise dos batimentos por minuto (bpm), seja pela ausculta ou palpação do ictus. Bradi ou taquisfigmia é relativo ao pulso, e é medido pelo número de pulsações por minuto (ppm). A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que o pulso é um fenômeno físico sempre relacionado a um batimento cardíaco. Embora na maioria dos casos seus valores numéricos realmente sejam equivalentes, ou iguais, e que fisiologicamente eles estão inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos) é, por exemplo, achado importante para suspeição clínica de algumas arritmias, como a Fibrilação Atrial e as Extrassístoles. A importância prática dessa distinção (FC e FP) vai muito além de um suposto preciosismo léxico da nomenclatura médica.","Faixa errada e nomes trocados."],"imgs":[],"ed":0,"rec":1},{"id":"S79.14","jid":"S79:14","prova":79,"item":14,"key":"C26","tema":"a3","seg":"s1","mod":"prova","enun":"Ao final do atendimento, o estudante precisa registrar no prontuário a informação: \"Paciente em bom estado geral (BEG)\".","cmd":"Em qual etapa do exame clínico essa informação deve ser registrada?","alts":["Anamnese, na revisão de sistemas (sintomas gerais).","Exame físico, no exame físico geral (ectoscopia).","Anamnese, na história da moléstia atual.","Exame físico, no exame do aparelho cardiovascular."],"gab":1,"com":["A revisão de sistemas registra sintomas; o estado geral é um sinal observado pelo médico.","<b>Justificativa oficial:</b> O estado geral (BEG, REG, MEG) do paciente é componente do exame físico (achado, sinal, informação observada), especificamente do exame físico geral, não confundindo-se com a etapa da anamnese, notadamente com a etapa denominada Revisão Sintomatológica (revisão sistemática de sintomas), outra designação para Anamnese Especial, em que são registrados sintomas.","A HMA registra a história do sintoma principal contada pelo paciente.","O estado geral pertence ao exame físico geral, não a um aparelho específico."],"imgs":[],"ed":0,"rec":1},{"id":"S79.15","jid":"S79:15","prova":79,"item":15,"key":"C43","tema":"a6","seg":"s1","mod":"prova","enun":"Na aula de bulhas, o professor pede que o aluno associe cada situação ao desdobramento de B2 que ela produz: bloqueio de ramo direito (BRD), bloqueio de ramo esquerdo (BRE), desdobramento fisiológico e comunicação interatrial (CIA).","cmd":"Assinale a associação correta.","alts":["BRD: persistente não fixo; BRE: invertido; fisiológico: só na inspiração; CIA: persistente fixo","BRD: persistente fixo; BRE: invertido; fisiológico: só na expiração; CIA: persistente não fixo","BRD: invertido; BRE: persistente não fixo; fisiológico: só na inspiração; CIA: persistente fixo","BRD: persistente não fixo; BRE: persistente fixo; fisiológico: só na expiração; CIA: invertido"],"gab":0,"com":["<b>Justificativa oficial:</b> O BRD poderia levar a um desdobramento persistente, não fixo (ocorreria na expiração, mas se intensificaria com a inspiração). O BRE poderia levar a um desdobramento invertido ou paradoxal de $B_2$ (presente na expiração, desaparecendo na inspiração). O desdobramento fisiológico de $B_2$ pode ocorrer na inspiração, desaparecendo na expiração. A CIA pode levar a um desdobramento persistente (inspiratório e expiratório) e fixo (sem variação ou intensificação com a fase do ciclo respiratório).","Fixo é a CIA (não o BRD), e o fisiológico aparece na inspiração.","BRD e BRE trocados: o invertido é do BRE.","BRE é invertido, CIA é fixo e o fisiológico é inspiratório."],"imgs":[],"ed":0,"rec":1},{"id":"S79.16","jid":"S79:16","prova":79,"item":16,"key":"C37","tema":"a11","seg":"s1","mod":"prova","enun":"Nome dado à cianose que tende a melhorar com a oferta de oxigênio (O<sub>2</sub>) suplementar.","cmd":"Assinale uma alternativa.","alts":["Cianose central.","Cianose periférica.","Cianose por metemoglobinemia.","Cianose segmentar por estase venosa."],"gab":0,"com":["<b>Justificativa oficial:</b> As cianoses que cursam com déficits de bomba (circulatória Q; ventilatória V), em seus mais diferentes níveis (tecidual, orgânico etc.) são denominadas de centrais. Por cursarem com hipoxemia (baixa quantidade de $\\text{O}_2$ no sangue - ligado à Hb), elas tendem a responder melhor à oferta de $\\text{O}_2$ suplementar.","A periférica é de baixo fluxo (o sangue chega saturado); melhora com calor e massagem, não com O2.","Na hemoglobinopatia o problema é a hemoglobina anormal; o O2 não corrige.","A estase venosa é periférica e localizada; não responde ao O2."],"imgs":[],"ed":1,"rec":1},{"id":"S79.17","jid":"S79:17","prova":79,"item":17,"key":"C44","tema":"a6","seg":"s3","mod":"prova","enun":"Sobre o ritmo tríplice (em três tempos) e o ritmo de galope, analise o raciocínio de um estudante durante o plantão.","cmd":"Assinale a alternativa correta.","alts":["Toda B3 ou B4 é patológica, e o galope é uma variante benigna do ritmo tríplice","Só a B4 pode ser fisiológica; o galope ventricular tem sempre origem atrial","Há B3 ou B4 fisiológicas; o galope indica sofrimento miocárdico e descompensação iminente","O ritmo tríplice é sempre fisiológico; o galope só ocorre em valvopatias"],"gab":2,"com":["Há condições fisiológicas com ritmo tríplice (gestação, jovens); e o galope é o sinal grave.","A B3 também pode ser fisiológica, e o galope ventricular é por B3.","<b>Justificativa oficial:</b> Podem existir condições fisiológicas que cursam com $B_3$ ou $B_4$. Embora a presença de um ritmo em três tempos (por $B_3$ ou $B_4$) exija uma investigação minuciosa, apontando para uma condição patológica de base, existem condições não patológicas que podem cursar com ritmo tríplice. De forma diversa, os ritmos de galope, ventricular (por $B_3$) ou atrial (por $B_4$) significam um \"pedido de socorro\" miocárdico, indicando descompensação iminente ou sofrimento miocárdico.","O ritmo tríplice exige investigação, e o galope indica sofrimento do miocárdio."],"imgs":[],"ed":0,"rec":1},{"id":"S79.18","jid":"S79:18","prova":79,"item":18,"key":"C31","tema":"a6","seg":"s3","mod":"prova","enun":"Idoso com estenose aórtica grave e hipertrofia ventricular esquerda tem ritmo tríplice por B4, com características de galope. Meses depois, o eletrocardiograma mostra fibrilação atrial.","cmd":"Assinale a alternativa correta.","alts":["O galope por B4 é atrial e tende a desaparecer com a FA, pela perda da sístole atrial","O galope por B4 é ventricular e se intensifica com a FA, pelo enchimento mais rápido","A B4 indica sobrecarga volumétrica e persiste na FA, por depender do enchimento rápido","A B4 indica sobrecarga pressórica e se intensifica na FA, pela contração atrial forte"],"gab":0,"com":["<b>Justificativa oficial:</b> $B_4$ relaciona-se a sobrecargas pressóricas, podendo surgir na estenose aórtica, notadamente quando existe hipertrofia ventricular. O ritmo de galope de $B_4$ é conhecido como galope atrial. A fibrilação atrial (perda da sístole atrial) é responsável pelo desaparecimento de $B_4$ que depende, em sua fisiopatologia auscultatória, da presença da sístole atrial.","Galope ventricular é o da B3; e a FA elimina a B4.","A B4 é de pressão e depende da sístole atrial, que a FA elimina.","Na FA não há contração atrial organizada, por isso a B4 desaparece."],"imgs":[],"ed":0,"rec":1},{"id":"S79.19","jid":"S79:19","prova":79,"item":19,"key":"C34","tema":"a6","seg":"s3","mod":"prova","enun":"Gestante de 30 semanas, sem cardiopatia, tem ritmo em três tempos na ausculta, sem as características de galope. Na mesma enfermaria, um paciente com insuficiência cardíaca descompensada tem B3 em galope.","cmd":"Sobre a terceira bulha (B3), assinale a alternativa correta.","alts":["Ocorre na pré-sístole; o galope é atrial e a B3 é sempre patológica na gestação","Ocorre no enchimento rápido; o galope é atrial e indica sobrecarga de pressão","Ocorre no enchimento rápido; o galope é ventricular e pode haver B3 fisiológica na gestação","Ocorre na sístole; o galope é ventricular e indica estenose aórtica grave"],"gab":2,"com":["Pré-sístole e galope atrial são da B4; e a B3 pode ser fisiológica na gestação.","O galope por B3 é ventricular, e a B3 é de volume, não de pressão.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à fase de enchimento rápido (início da diástole), podendo estar presente em condições que cursam com sobrecarga volumétrica. O ritmo tríplice de galope por $B_3$ é conhecido como galope ventricular. Já o ritmo de três tempos, por adição de $B_3$, sem as características auscultatórias de galope, pode ser audível em algumas condições fisiológicas, como na gestação.","A B3 é diastólica (enchimento rápido), não sistólica."],"imgs":[],"ed":0,"rec":1},{"id":"S79.20","jid":"S79:20","prova":79,"item":20,"key":"C45","tema":"a3","seg":"s2","mod":"prova","enun":"Na avaliação do estado nutricional de um paciente, durante o exame físico geral ou ectoscopia, analise as assertivas:<br>1. Constatação de uma grande variação de peso (cerca de 5 kg) em um curto período (menos de 24 horas), obtida pela pesagem.<br>2. Proeminência de relevos ósseos.<br>3. Alterações na coloração, brilho e textura de pele e fâneros.<br>4. Sarcopenia.","cmd":"Podem ser consideradas parâmetros de avaliação do estado nutricional na ectoscopia:","alts":["1, 2, 3 e 4.","1 e 2.","1, 3 e 4.","2, 3 e 4."],"gab":3,"com":["A 1 está errada: 5 kg em menos de 24 h é mobilização de líquido, e pesar não é estritamente ectoscopia.","A 1 está errada e a 3 e a 4 estão corretas.","A 1 está errada pelo mesmo motivo.","<b>Justificativa oficial:</b> Grandes variações de peso em curtos períodos de tempo podem estar mais relacionadas à mobilização de líquidos. Pesar o paciente não é, estritamente, ectoscopia."],"imgs":[],"ed":0,"rec":1},{"id":"S79.21","jid":"S79:21","prova":79,"item":21,"key":"C22","tema":"a12","seg":"s6","mod":"prova","enun":"Tórax em tonel, tosse diária produtiva e volumosa, cianose facial e dispneia crônica progressiva (de instalação gradativa durante anos).","cmd":"Qual padrão sindrômico respiratório, e qual fenótipo, melhor representariam os sinais e sintomas acima listados?","alts":["Síndrome obstrutiva. Fenótipo \"soprador rosa\".","Síndrome restritiva. Fenótipo \"congesto azulado\".","Síndrome restritiva. Fenótipo \"soprador rosa\".","Síndrome obstrutiva. Fenótipo \"congesto azulado\"."],"gab":3,"com":["O soprador rosa tem pele rósea, pouca secreção e emagrecimento; aqui há cianose e secreção volumosa.","A DPOC é obstrutiva, não restritiva.","A DPOC é obstrutiva, e o fenótipo com cianose e secreção é o congesto azulado.","<b>Justificativa oficial:</b> Os sintomas descritos estão classicamente relacionados às síndromes obstrutivas (DPOC, notadamente). Dentre os extremos fenotípicos das DPOC(s) temos o padrão \"soprador rosa\", que cursa com tonalidade de pele rósea, diminuição do panículo adiposo, sarcopenia e \"pouca\" congestão (secreção), pois predomina o enfisema (doença parenquimatosa). O \"congesto azulado\" descreve justamente a cianose (azulado) e a congestão (secretivo bronquítico). Ambas classificadas como doenças funcionalmente obstrutivas, sendo o soprador rosa portador de uma afecção predominantemente parenquimatosa (enfisema), e o congesto azulado portador de uma afecção predominantemente das vias respiratórias. Atente-se que, na prática, habitualmente encontramos graus intermediários entre esses extremos fenotípicos, associando enfisema (parênquima) e obstrução inflamatória (vias aéreas) em diferentes níveis."],"imgs":[],"ed":1,"rec":1},{"id":"S79.22","jid":"S79:22","prova":79,"item":22,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S79.23","jid":"S79:23","prova":79,"item":23,"key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido (até recentemente denominado de paradoxal) da segunda bulha (B2), analise as seguintes assertivas.<br>1. O desdobramento ocorre na fase expiratória.<br>2. O bloqueio completo de ramo esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.<br>3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.<br>4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As assertivas 1, 2 e 3 estão corretas.","As assertivas 1 e 2 estão corretas.","As assertivas 2 e 4 estão corretas.","As assertivas 3 e 4 estão corretas."],"gab":1,"com":["A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; não é persistente.","<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","Ambas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"ed":1,"rec":1},{"id":"S79.24","jid":"S79:24","prova":79,"item":24,"key":"C11","tema":"a1","seg":"s1","mod":"prova","enun":"Em prontuários, laudos e atestados, é comum a expressão \"ao exame clínico\". O professor pergunta à turma o que exatamente esse termo engloba.","cmd":"O exame clínico é definido pelo conjunto de informações obtidas por meio de:","alts":["Anamnese e exame físico.","Exame físico, exclusivamente.","Anamnese, exame físico e exames complementares.","Ectoscopia e dados vitais."],"gab":0,"com":["<b>Justificativa oficial:</b> Exame clínico é definido pelo conjunto de informações obtidas pela anamnese e exame físico.","O exame físico é só uma das partes; os sintomas vêm da anamnese.","Exames complementares não fazem parte do exame clínico.","Ectoscopia e dados vitais são partes do exame físico geral."],"imgs":[],"ed":0,"rec":1},{"id":"S79.25","jid":"S79:25","prova":79,"item":25,"key":"C5","tema":"a8","seg":"s2","mod":"prova","enun":"Mulher de 74 anos procura o ambulatório por crises de palpitação. Relata que, durante as crises, sente urgência para urinar e urina em maior volume. Ao exame: ritmo cardíaco irregular, intensidade de B1 variável de um batimento para outro e número de pulsações radiais menor que o de batimentos contados na ausculta.","cmd":"Qual o diagnóstico mais provável e a explicação para as queixas urinárias?","alts":["Bloqueio atrioventricular total; liberação de ADH estimulada pela bradicardia","Extrassístoles ventriculares; hipoperfusão renal pelo débito cardíaco baixo","Taquicardia sinusal; aumento do fluxo renal provocado pela ansiedade","Fibrilação atrial; liberação de peptídeo natriurético atrial pela distensão atrial"],"gab":3,"com":["No BAVT o ritmo é lento e regular; o ADH reduz a diurese, não aumenta.","Extrassístoles isoladas não explicam ritmo irregular contínuo com B1 variável; hipoperfusão reduziria a urina.","Na taquicardia sinusal o ritmo é regular e a B1 é constante e hiperfonética.","<b>Justificativa oficial:</b> A FA pode levar a queixas urinárias, relacionadas ao peptídeo natriurético atrial. A variação da fonese de $B_1$ pode ser encontrada nos casos de FA, relacionando-se aos diferentes tempos de enchimento ventricular, estando relacionada às diferentes frequências de estímulos que podem chegar ao VE, a depender do período refratário do NAV. Pode ocorrer dissociação ausculta-pulso nos casos de estímulos elétricos de alta frequência que, porventura, cheguem ao VE. Nestes casos ocorrerá sístole ventricular e fechamento das valvas atrioventriculares, mas o volume de sangue ejetado pode ser insuficiente (pelo enchimento ventricular esquerdo limitado) para gerar pulso periférico palpável."],"imgs":[],"ed":0,"rec":1},{"id":"S79.26","jid":"S79:26","prova":79,"item":26,"key":"C46","tema":"a12","seg":"s3","mod":"prova","enun":"Durante a aula prática, o professor pede que o aluno separe os sons do exame do tórax em sons de percussão e sons de ausculta.","cmd":"Qual dos sons abaixo é obtido pela percussão, e não pela ausculta com o estetoscópio?","alts":["Murmúrio vesicular.","Som broncovesicular.","Som traqueal.","Som claro pulmonar."],"gab":3,"com":["Murmúrio vesicular é som de ausculta.","Broncovesicular é som de ausculta.","Som traqueal é som de ausculta.","<b>Justificativa oficial:</b> O som Claro Pulmonar é passível de ser ouvido (diferente de auscultado com o estetoscópio) à percussão. Os demais sons listados nas outras opções são sons de ausculta (realizados com o estetoscópio, não sendo sons produzidos pela percussão)."],"imgs":[],"ed":0,"rec":1},{"id":"S79.27","jid":"S79:27","prova":79,"item":27,"key":"C30","tema":"a8","seg":"s1","mod":"prova","enun":"Durante a realização do exame físico de um paciente sob seus cuidados, especificamente na etapa de aferição dos dados vitais, você encontrou uma frequência de pulso (FP) de repouso de 50 ppm (pulsações por minuto). A pressão arterial, a frequência respiratória e a temperatura axilar encontravam-se normais. Você considerou, inicialmente, como possíveis causas para esse achado o uso de medicação betabloqueadora para controle da hipertensão arterial, associado ao hábito relatado pelo paciente de realizar atividades físicas frequentes e de forma regular, obtido durante a anamnese.","cmd":"Acerca da frequência de pulso desse paciente, pode-se afirmar:","alts":["É incorreto chamá-la de bradicardia: foi aferida no pulso (ppm), e não nos batimentos (bpm)","É correto chamá-la de bradicardia: FC e FP são termos sinônimos na prática clínica diária","É correto chamá-la de bradisfigmia só quando houver dissociação entre pulso e ausculta","É incorreto chamá-la de bradi: no atleta a faixa normal de pulso começa em 40 ppm"],"gab":0,"com":["<b>Justificativa oficial:</b> A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida por batimentos por minuto (bpm). Esfígmico é relativo ao pulso e é medido pelo número de pulsações por minuto (ppm). FC - bpm. FP - ppm. A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que pulso é um fenômeno físico distinto de batimento, embora na maioria absoluta da população seus valores numéricos realmente sejam equivalentes ou iguais, e que fisiologicamente são inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos), achado importante para suspeição e/ou diagnóstico de algumas arritmias, é um - dentre outros - exemplo da importância prática dessa distinção, indo além de um suposto preciosismo léxico da nomenclatura médica.","FC (bpm) e FP (ppm) são fenômenos diferentes; a dissociação pulso-ausculta mostra por quê.","Bradisfigmia é qualquer FP abaixo de 60 ppm, com ou sem dissociação.","A faixa de normalidade usada na prova é 60 a 100; 50 ppm é bradisfigmia."],"imgs":[],"ed":1,"rec":1},{"id":"S79.28","jid":"S79:28","prova":79,"item":28,"key":"C16","tema":"a12","seg":"s6","mod":"prova","enun":"Homem de 64 anos, tabagista de 50 anos-maço, tem tosse crônica produtiva com expectoração volumosa todos os dias, cianose facial e edema de membros inferiores. Não está emagrecido.","cmd":"Qual fenótipo melhor descreve esse paciente?","alts":["Congesto azulado.","Soprador rosa.","Asmático em crise.","Restritivo intersticial."],"gab":0,"com":["<b>Justificativa oficial:</b> A tosse crônica e produtiva (congestão) e a cianose facial (azul) permitem inferir o fenótipo \"Congesto azulado\".","O soprador rosa é emagrecido, sarcopênico, rosado e tem pouca secreção (predomina enfisema).","A asma tem crises súbitas e variáveis, não tosse produtiva diária com cianose crônica.","O quadro é obstrutivo (bronquite crônica), não restritivo."],"imgs":[],"ed":0,"rec":1},{"id":"S79.29","jid":"S79:29","prova":79,"item":29,"key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam, de forma involuntária, a resistência vascular periférica.","cmd":"Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente ao assumir a posição de cócoras?","alts":["Shunt arteriovenoso, direita-esquerda.","Shunt arteriovenoso, esquerda-direita.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":0,"com":["<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrógrada a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (shunt) que cursam com passagem de sangue da direita para a esquerda.","No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"ed":1,"rec":1},{"id":"S79.30","jid":"S79:30","prova":79,"item":30,"key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero-Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro.","cmd":"Acerca da manobra de Rivero-Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","alts":["Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco mitral, insuficiência mitral, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":0,"com":["<b>Justificativa oficial:</b> A manobra de Rivero-Carvallo é utilizada para diferenciar sopros causados pela insuficiência tricúspide da insuficiência mitral - ambos sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"ed":1,"rec":1},{"id":"S79.31","jid":"S79:31","prova":79,"item":31,"key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo para a construção do raciocínio clínico.","cmd":"Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na sístole, logo após a primeira bulha.","Localizada na diástole, na fase de enchimento rápido.","Localizada no final da sístole, antes da segunda bulha."],"gab":2,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","B3 é diastólica; logo após B1 fica o clique de ejeção.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à sobrecarga volumétrica, podendo ser auscultada no início da diástole, na fase denominada de enchimento ventricular rápido.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"ed":1,"rec":1},{"id":"S80.1","jid":"S80:1","prova":80,"item":1,"key":"C34","tema":"a6","seg":"s3","mod":"prova","enun":"Gestante de 30 semanas, sem cardiopatia, tem ritmo em três tempos na ausculta, sem as características de galope. Na mesma enfermaria, um paciente com insuficiência cardíaca descompensada tem B3 em galope.","cmd":"Sobre a terceira bulha (B3), assinale a alternativa correta.","alts":["Ocorre na pré-sístole; o galope é atrial e a B3 é sempre patológica na gestação","Ocorre no enchimento rápido; o galope é atrial e indica sobrecarga de pressão","Ocorre no enchimento rápido; o galope é ventricular e pode haver B3 fisiológica na gestação","Ocorre na sístole; o galope é ventricular e indica estenose aórtica grave"],"gab":2,"com":["Pré-sístole e galope atrial são da B4; e a B3 pode ser fisiológica na gestação.","O galope por B3 é ventricular, e a B3 é de volume, não de pressão.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à fase de enchimento rápido (início da diástole), podendo estar presente em condições que cursam com sobrecarga volumétrica. O ritmo tríplice de galope por $B_3$ é conhecido como galope ventricular. Já o ritmo de três tempos, por adição de $B_3$, sem as características auscultatórias de galope, pode ser audível em algumas condições fisiológicas, como na gestação.","A B3 é diastólica (enchimento rápido), não sistólica."],"imgs":[],"ed":0,"rec":1},{"id":"S80.2","jid":"S80:2","prova":80,"item":2,"key":"C47","tema":"a6","seg":"s1","mod":"prova","enun":"Homem de 70 anos tem bloqueio completo de ramo esquerdo (BRE) ao eletrocardiograma. O aluno ausculta o foco pulmonar com atenção às fases da respiração.","cmd":"Qual alteração da segunda bulha é esperada?","alts":["Desdobramento fixo de B2, igual na inspiração e na expiração","Desdobramento persistente de B2, acentuado na inspiração","Desdobramento invertido de B2 (P2 antes de A2), mais nítido na expiração","Hiperfonese do componente pulmonar de B2, sem desdobramento"],"gab":2,"com":["Desdobramento fixo é o da CIA.","Persistente e acentuado na inspiração é o do BRD.","<b>Justificativa oficial:</b> O bloqueio de ramo esquerdo (BRE) provoca um atraso na despolarização do ventrículo esquerdo, o que retarda o fechamento da valva aórtica (componente $A_2$ da segunda bulha). Como o fechamento da valva pulmonar ($P_2$) ocorre antes de $A_2$, isso resulta em um desdobramento paradoxal ou invertido da segunda bulha ($B_2$), ou seja, a ordem fisiológica ($A_2$-$P_2$) é invertida para ($P_2$-$A_2$), sendo o desdobramento mais perceptível na expiração e podendo desaparecer na inspiração, o oposto do padrão fisiológico.","Hiperfonese de P2 é da hipertensão pulmonar."],"imgs":[],"ed":0,"rec":1},{"id":"S80.3","jid":"S80:3","prova":80,"item":3,"key":"C0","tema":"a5","seg":"s1","mod":"prova","enun":"Paciente de 52 anos, com hipertensão pulmonar e hipertrofia ventricular direita (HVD) confirmada no ecocardiograma, é examinado na enfermaria. O professor pede que o aluno descreva o que espera encontrar na inspeção e na palpação do precórdio.","cmd":"Assinale a alternativa com os achados esperados nesse paciente.","alts":["Ictus propulsivo, desviado para baixo e para fora, ocupando três polpas digitais","Ictus no 5º EIC sobre a linha hemiclavicular, sem nenhuma outra pulsação visível","Retração sistólica apical, levantamento em massa do precórdio e pulsações epigástricas","Frêmito diastólico no foco mitral e ictus em cúpula, palpado em decúbito lateral"],"gab":2,"com":["Ictus propulsivo e desviado para baixo e para fora é sinal de hipertrofia/dilatação do VE, e não do VD.","É o ictus normal do normolíneo; na HVD a ponta passa a ser formada pelo VD e o achado muda.","<b>Justificativa oficial:</b> O ictus é definido como o choque da ponta cardíaca. A musculatura do ventrículo esquerdo é a principal (muitas vezes a única) responsável pelo ictus. Em casos de HVD, espera-se maior contribuição (ou contribuição exclusiva da musculatura do VD) na composição da ponta do coração, levando a um movimento de retração apical sistólica - diferente ou paradoxal à propulsão do ictus. A HVD, pela maior relação do VD com a parede anterior do tórax, pode levar ao levantamento em massa do precórdio. Embora não exclusivas de HVD, as pulsações epigástricas podem ser encontradas em casos de HVD.","Frêmito diastólico no foco mitral é da estenose mitral; não é o que a HVD produz."],"imgs":[],"ed":0,"rec":1},{"id":"S80.4","jid":"S80:4","prova":80,"item":4,"key":"C11","tema":"a1","seg":"s1","mod":"prova","enun":"Em prontuários, laudos e atestados, é comum a expressão \"ao exame clínico\". O professor pergunta à turma o que exatamente esse termo engloba.","cmd":"O exame clínico é definido pelo conjunto de informações obtidas por meio de:","alts":["Anamnese e exame físico.","Exame físico, exclusivamente.","Anamnese, exame físico e exames complementares.","Ectoscopia e dados vitais."],"gab":0,"com":["<b>Justificativa oficial:</b> Exame clínico é definido pelo conjunto de informações obtidas pela anamnese e exame físico.","O exame físico é só uma das partes; os sintomas vêm da anamnese.","Exames complementares não fazem parte do exame clínico.","Ectoscopia e dados vitais são partes do exame físico geral."],"imgs":[],"ed":0,"rec":1},{"id":"S80.5","jid":"S80:5","prova":80,"item":5,"key":"C7","tema":"a9","seg":"s2","mod":"prova","enun":"A expressão equivalente anginoso refere-se a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações isquêmicas cardíacas sem a precordialgia típica, notadamente em idosos e diabéticos","Dor precordial típica em aperto, irradiada para o braço esquerdo e a mandíbula, em adultos jovens","Sintomas de origem esofágica que imitam a angina e melhoram com nitrato, típicos de adultos jovens","Dor torácica musculoesquelética que piora à palpação, mais comum em idosos e em diabéticos"],"gab":0,"com":["<b>Justificativa oficial:</b> A expressão equivalente anginoso refere-se a sintomas que, habitualmente, podem surgir desvinculados da precordialgia, em casos de isquemia miocárdica, levando a eventual erro de interpretação de sua etiologia. Ex: sinais - taquipneia de início súbito, sem precordialgia; sintomas - dispepsia.","Essa é a angina típica, justamente o contrário do equivalente anginoso.","Espasmo esofágico imita angina, mas não é isquemia cardíaca; equivalente anginoso é isquemia.","Dor musculoesquelética não é isquêmica; o equivalente anginoso é isquemia sem a dor típica."],"imgs":[],"ed":1,"rec":1},{"id":"S80.6","jid":"S80:6","prova":80,"item":6,"key":"C13","tema":"a2","seg":"s3","mod":"prova","enun":"Durante a anamnese de uma mulher de 34 anos, o estudante anota: 1) G2P2A0, partos normais; 2) vacinação em dia; 3) nega internações clínicas ou cirúrgicas; 4) hipertensão arterial há 5 anos, em uso de losartana.","cmd":"Quais dessas informações devem ser registradas na História Patológica Pregressa (Antecedentes Pessoais)?","alts":["Apenas 4, pois a HPP registra só doenças.","Apenas 1 e 4.","1, 2, 3 e 4.","Apenas 2 e 3."],"gab":2,"com":["A HPP registra informações de interesse médico mesmo que não patológicas (gestação, vacinas, ausência de internações).","Gestação e vacinação também entram, mesmo sem ser doença.","<b>Justificativa oficial:</b> O campo História Patológica Pregressa (HPP), também denominado Antecedentes Pessoais (AP), é destinado ao registro de informações pessoais do paciente e de interesse médico, mesmo que não patológico. Gestação, vacinação e a não necessidade de internações (clínicas ou cirúrgicas) são informações de interesse médico, embora não signifiquem patologias ou comorbidades.","A hipertensão e a história obstétrica também pertencem à HPP."],"imgs":[],"ed":0,"rec":1},{"id":"S80.8","jid":"S80:8","prova":80,"item":8,"key":"C25","tema":"a9","seg":"s1","mod":"prova","enun":"Durante a anamnese de um paciente com dor torácica, ele aponta a região precordial com a mão e o punho cerrados, em movimentos circulares, para mostrar onde e como dói.","cmd":"Esse sinal semiológico, ligado à isquemia miocárdica, é conhecido como:","alts":["Sinal de Lewis.","Sinal de Kussmaul.","Sinal de Musset.","Sinal de Levine."],"gab":3,"com":["Lewis não é o nome do sinal; a justificativa oficial frisa: \"Levine, não de Lewis\".","Kussmaul é o aumento da pressão venosa jugular na inspiração (pericardite constritiva).","Musset é o balanço da cabeça na insuficiência aórtica.","<b>Justificativa oficial:</b> O sinal de Levine/Lavine - não de Lewis - é definido por sinal semiológico em que o paciente exibe - com a mão e punho cerrados, em movimentos circulares - a região do tórax anterior, para apontar o local doloroso durante um quadro de isquemia miocárdica (extraído dos livros-textos de referência)."],"imgs":[],"ed":0,"rec":1},{"id":"S80.9","jid":"S80:9","prova":80,"item":9,"key":"C49","tema":"a2","seg":"s1","mod":"prova","enun":"Analise as afirmações sobre os componentes da anamnese:<br>I) Na Revisão de Sistemas (Interrogatório Sintomatológico) busca-se, de forma detalhada, a existência ou a ausência de sintomas.<br>II) Na Queixa Principal, deve-se preferir palavras ou frases curtas, nas palavras do paciente, sempre que possível.<br>III) Em situações de urgência, os demais elementos da anamnese podem ser dispensados, bastando a queixa principal.<br>IV) A História Familiar registra a presença ou a ausência de situações mórbidas ou de interesse para a saúde nos familiares do paciente.","cmd":"Estão corretas as afirmações:","alts":["I, II, III e IV.","I e III.","I, II e IV.","II, III e IV."],"gab":2,"com":["A III está errada: mesmo na urgência os demais elementos são fundamentais, feitos de forma direcionada.","A III está errada.","<b>Justificativa oficial:</b> Na Revisão de Sistemas - também denominada Interrogatório Sintomatológico - busca-se de forma detalhada a existência ou ausência de sintomas (não confundir com sinais). Na Queixa Principal deve-se preferir frases ou palavras curtas, nas palavras do paciente, sempre que possível. Mesmo em situações especiais (urgências, por exemplo), os demais elementos componentes da anamnese são fundamentais, mesmo que realizados de forma mais direcionada para a situação. Na História Patológica Pregressa - ou antecedentes pessoais - buscam-se informações de interesse médico (patológicas ou não) diretamente relacionadas ao paciente. A História Familiar registra a ausência ou presença de situações mórbidas, patológicas ou de interesse para saúde, nos familiares do paciente.","A III está errada e a I está correta."],"imgs":[],"ed":0,"rec":1},{"id":"S80.10","jid":"S80:10","prova":80,"item":10,"key":"C1","tema":"a6","seg":"s1","mod":"prova","enun":"Homem de 58 anos faz eletrocardiograma pré-operatório que mostra bloqueio completo de ramo direito (BRD). Está assintomático. Na ausculta cardíaca, o aluno procura alterações das bulhas.","cmd":"Qual o comportamento esperado das bulhas nesse paciente?","alts":["Desdobramento de B2 fixo, de mesma intensidade na inspiração e na expiração","Desdobramento de B1 e de B2, persistente e variável, acentuado na inspiração","Desdobramento invertido de B2, audível na expiração e ausente na inspiração","Retração apical sistólica e pulso paradoxal, sem alteração das bulhas"],"gab":1,"com":["Desdobramento fixo, que não varia com a respiração, é o da CIA.","<b>Justificativa oficial:</b> O bloqueio de ramo direito pode levar ao retardo do fechamento do componente tricúspide de $B_1$, fisiologicamente já atrasado em relação ao mitral, levando ao desdobramento de $B_1$. O mesmo princípio se aplica a $B_2$: o BRD leva ao retardo do fechamento do componente pulmonar de $B_2$, fisiologicamente já atrasado em relação ao componente aórtico. Fato que se exacerba durante a inspiração (pelo aumento do retorno venoso e aumento do trabalho do coração direito), levando a aumentar o desdobramento - tornando-o persistente (inspiratório e expiratório) e variável (melhor audível ou exacerbado na inspiração). A retração apical pode ser encontrada em casos de Hipertrofia Ventricular Direita, e o pulso paradoxal foi colocado como distrator.","Desdobramento invertido (paradoxal) é o do BRE: o componente aórtico atrasa.","A retração apical é da HVD e o pulso paradoxal foi colocado como distrator na justificativa oficial."],"imgs":[],"ed":0,"rec":1},{"id":"S80.11","jid":"S80:11","prova":80,"item":11,"key":"C26","tema":"a3","seg":"s1","mod":"prova","enun":"Ao final do atendimento, o estudante precisa registrar no prontuário a informação: \"Paciente em bom estado geral (BEG)\".","cmd":"Em qual etapa do exame clínico essa informação deve ser registrada?","alts":["Anamnese, na revisão de sistemas (sintomas gerais).","Exame físico, no exame físico geral (ectoscopia).","Anamnese, na história da moléstia atual.","Exame físico, no exame do aparelho cardiovascular."],"gab":1,"com":["A revisão de sistemas registra sintomas; o estado geral é um sinal observado pelo médico.","<b>Justificativa oficial:</b> O estado geral (BEG, REG, MEG) do paciente é componente do exame físico (achado, sinal, informação observada), especificamente do exame físico geral, não confundindo-se com a etapa da anamnese, notadamente com a etapa denominada Revisão Sintomatológica (revisão sistemática de sintomas), outra designação para Anamnese Especial, em que são registrados sintomas.","A HMA registra a história do sintoma principal contada pelo paciente.","O estado geral pertence ao exame físico geral, não a um aparelho específico."],"imgs":[],"ed":0,"rec":1},{"id":"S80.12","jid":"S80:12","prova":80,"item":12,"key":"C31","tema":"a6","seg":"s3","mod":"prova","enun":"Idoso com estenose aórtica grave e hipertrofia ventricular esquerda tem ritmo tríplice por B4, com características de galope. Meses depois, o eletrocardiograma mostra fibrilação atrial.","cmd":"Assinale a alternativa correta.","alts":["O galope por B4 é atrial e tende a desaparecer com a FA, pela perda da sístole atrial","O galope por B4 é ventricular e se intensifica com a FA, pelo enchimento mais rápido","A B4 indica sobrecarga volumétrica e persiste na FA, por depender do enchimento rápido","A B4 indica sobrecarga pressórica e se intensifica na FA, pela contração atrial forte"],"gab":0,"com":["<b>Justificativa oficial:</b> $B_4$ relaciona-se a sobrecargas pressóricas, podendo surgir na estenose aórtica, notadamente quando existe hipertrofia ventricular. O ritmo de galope de $B_4$ é conhecido como galope atrial. A fibrilação atrial (perda da sístole atrial) é responsável pelo desaparecimento de $B_4$ que depende, em sua fisiopatologia auscultatória, da presença da sístole atrial.","Galope ventricular é o da B3; e a FA elimina a B4.","A B4 é de pressão e depende da sístole atrial, que a FA elimina.","Na FA não há contração atrial organizada, por isso a B4 desaparece."],"imgs":[],"ed":0,"rec":1},{"id":"S80.13","jid":"S80:13","prova":80,"item":13,"key":"C17","tema":"a12","seg":"s6","mod":"prova","enun":"A ASMA é definida como uma doença inflamatória crônica das vias aéreas, com períodos agudos de exacerbação, caracterizados por broncoespasmo e exacerbação inflamatória.<br>Analise as seguintes afirmações:<br>1) tosse crônica, exacerbada nos períodos noturnos/madrugada;<br>2) dispneia de instalação aguda e autopercepção de \"chieira\" torácica, nos períodos de exacerbação;<br>3) instalação e progressão lenta da obstrução das vias aéreas, permitindo a adaptação gradual do paciente ao novo estado patológico e a subvalorização de sintomas, retardando a procura do paciente ao médico assistente, muitas vezes por anos. Razão pela qual a procura por assistência ocorre quando a doença encontra-se em fases avançadas.","cmd":"Assinale a opção que contém as afirmações pertinentes à ASMA.","alts":["As afirmações 1 e 2 estão corretas.","As afirmações 1, 2 e 3 estão corretas.","As afirmações 2 e 3 estão corretas.","Apenas a afirmação 3 está correta."],"gab":0,"com":["<b>Justificativa oficial:</b> Os períodos de agudização na ASMA são súbitos, levando o paciente a um novo grau de obstrução das vias aéreas, sem tempo hábil para o paciente se adaptar ao novo estado. Os pacientes costumam procurar assistência imediata durante as crises agudas, cabendo ao médico o entendimento que trata-se de doença crônica, devendo estar atento que, para além do tratamento da crise aguda, há a necessidade de avaliar o tratamento da doença crônica.","A 3 descreve a DPOC: na asma a agudização é súbita e o paciente procura ajuda na hora.","A 3 é da DPOC, de progressão lenta e procura tardia.","A 3 não descreve asma."],"imgs":[],"ed":1,"rec":1},{"id":"S80.14","jid":"S80:14","prova":80,"item":14,"key":"C20","tema":"a1","seg":"s3","mod":"prova","enun":"Paciente de 50 anos procura o pronto-socorro dizendo: \"estou evacuando com sangue\". O estudante registra no prontuário: \"QP: melena\".","cmd":"Sobre esse registro da queixa principal, assinale a alternativa correta.","alts":["É inadequado: a QP deve ser grafada nas palavras do paciente, e \"melena\" pode induzir a erro","É adequado: o termo técnico torna o prontuário mais preciso para os demais profissionais","É adequado, desde que o termo técnico seja seguido do tempo de evolução do sintoma","É inadequado: a QP deve conter o diagnóstico provável, como \"hemorragia digestiva\""],"gab":0,"com":["<b>Justificativa oficial:</b> Deve-se, sempre que possível, grafar a queixa principal nas palavras do paciente, utilizando-se, para tanto, de uma palavra, ou ocasionalmente de sentenças curtas e diretas, que traduzam o motivo da consulta. A utilização de termos técnicos em substituição à fala do paciente pode induzir a erros, notadamente, mas não exclusivamente, quando outros profissionais (médicos interconsultores, plantonistas subsequentes, preceptores de residência médica, por exemplo) também avaliarão o caso. Assim, uma queixa espontânea de \"evacuação com sangue\" registrada como \"melena\" poderia dar a entender que uma hematoquezia, uma enterorragia, ou até mesmo uma falsa percepção de sangramento nas fezes (refeição rica em alimentos naturalmente avermelhados) estariam excluídas, antes mesmo da \"evacuação com sangue\" ser melhor caracterizada em etapa posterior da anamnese.","O termo técnico substitui a fala do paciente e pode excluir, sem querer, enterorragia ou hematoquezia.","O tempo de evolução não corrige o problema: a palavra do paciente foi trocada por um diagnóstico.","A QP não deve conter diagnósticos formados."],"imgs":[],"ed":0,"rec":1},{"id":"S80.15","jid":"S80:15","prova":80,"item":15,"key":"C50","tema":"a6","seg":"s1","mod":"prova","enun":"Criança de 8 anos, assintomática, tem sopro sistólico suave no foco pulmonar. O ecocardiograma mostra comunicação interatrial (CIA) do tipo ostium secundum.","cmd":"Que alteração da segunda bulha é esperada?","alts":["Desdobramento persistente e fixo, sem variação com a respiração","Desdobramento só na inspiração, que desaparece na expiração","Desdobramento invertido, mais nítido na expiração","B2 única, sem desdobramento em nenhuma fase"],"gab":0,"com":["<b>Justificativa oficial:</b> A Comunicação Interatrial (CIA), especialmente do tipo *ostium secundum*, provoca um shunt esquerda-direita persistente, que resulta em aumento crônico do fluxo sanguíneo no ventrículo direito e na artéria pulmonar. Esse aumento de volume leva a um atraso constante no fechamento da valva pulmonar ($P_2$), independentemente da fase respiratória. Assim, o componente $P_2$ da segunda bulha ($B_2$) permanece sempre retardado, gerando um desdobramento fixo e persistente de $B_2$, auscultado tanto na inspiração quanto na expiração.","Só na inspiração é o desdobramento fisiológico.","Invertido é o do BRE.","Na CIA o P2 atrasa sempre, então há desdobramento."],"imgs":[],"ed":0,"rec":1},{"id":"S80.16","jid":"S80:16","prova":80,"item":16,"key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório.<br>Em um paciente portador de pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax.","cmd":"Os achados esperados no lado do pneumotórax, referentes à palpação (frêmito toracovocal, FTV), percussão e ausculta para este paciente são, respectivamente:","alts":["FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":0,"com":["<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolida pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líquido); no pneumotórax há ar e o som é timpânico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"ed":1,"rec":1},{"id":"S80.17","jid":"S80:17","prova":80,"item":17,"key":"C51","tema":"a8","seg":"s2","mod":"prova","enun":"Homem de 68 anos com fibrilação atrial crônica é examinado na enfermaria pelo aluno.","cmd":"Quais achados são esperados na ausculta e na palpação do pulso?","alts":["Ritmo regular, B1 constante, B4 presente e pulso igual ao número de batimentos","Ritmo irregular, B1 constante, B4 hiperfonética e pulso de amplitude aumentada","Ritmo irregular, fonese variável de B1, ausência de B4 e dissociação pulso-ausculta","Ritmo regular em três tempos por B4, com B1 em canhão e pulso lento e amplo"],"gab":2,"com":["Na FA o ritmo é irregular e não há B4, porque não há contração atrial.","A B1 varia e a B4 desaparece na FA.","<b>Justificativa oficial:</b> Na fibrilação atrial, há perda da contração atrial organizada, o que leva ao desaparecimento da bulha $B_4$ e a um ritmo irregular, auscultado como um ritmo \"caótico\". A fonese variável da primeira bulha ocorre devido à variação nos intervalos entre as sístoles ventriculares, e a dissociação pulso-ausculta (quando nem todas as bulhas correspondem a um pulso periférico) decorre de contrações ventriculares fracas ou muito próximas umas das outras, que não geram débito suficiente para serem percebidas no pulso.","B1 em canhão e pulso lento e amplo são do BAVT."],"imgs":[],"ed":0,"rec":1},{"id":"S80.18","jid":"S80:18","prova":80,"item":18,"key":"C23","tema":"a7","seg":"s2","mod":"prova","enun":"Considerando os principais sinais e sintomas da estenose aórtica, analise as seguintes assertivas:<br>I) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar sintomas de dor cardíaca isquêmica.<br>II) Em função da dificuldade de adaptação a novas demandas metabólicas em órgãos-alvo, o paciente pode queixar-se de sensação de escurecimento visual e sensação pré-sincopal.<br>III) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar ictus propulsivo.<br>IV) Em função da lesão valvar, espera-se encontrar, à ausculta, um sopro diastólico ejetivo melhor audível no foco aórtico.","cmd":"Assinale a opção que contém as assertivas corretas.","alts":["Estão corretas as assertivas I, II, III e IV.","Estão corretas as assertivas II e IV.","Estão corretas as assertivas I, II e III.","Estão corretas as assertivas I e III."],"gab":2,"com":["A IV está errada: o sopro da estenose aórtica é sistólico (ejetivo), não diastólico.","A IV está errada e a I é correta (angina pela hipertrofia).","<b>Justificativa oficial:</b> O sopro esperado na estenose aórtica é sistólico, tornando incorreta a assertiva IV.","Falta a II: o débito fixo causa pré-síncope e escurecimento visual no esforço."],"imgs":[],"ed":1,"rec":1},{"id":"S80.19","jid":"S80:19","prova":80,"item":19,"key":"C52","tema":"a12","seg":"s3","mod":"prova","enun":"O aluno percute o hemitórax direito de um indivíduo hígido, descendo pela linha hemiclavicular até a altura do hipocôndrio direito.","cmd":"Que som espera encontrar na altura do hipocôndrio direito?","alts":["Som maciço.","Murmúrio vesicular.","Som broncovesicular.","Estertores finos."],"gab":0,"com":["<b>Justificativa oficial:</b> No hipocôndrio direito, espera-se encontrar um som maciço à percussão, de forma fisiológica, dada a posição do fígado e sua cobertura/proteção por parte do arcabouço ósseo da caixa torácica. A questão pergunta sobre sons de percussão. Nos demais itens, temos sons de ausculta pulmonar (realizada com o estetoscópio).","Murmúrio vesicular é som de ausculta, e a pergunta é sobre percussão.","Broncovesicular é som de ausculta.","Estertores são ruídos adventícios da ausculta."],"imgs":[],"ed":0,"rec":1},{"id":"S80.20","jid":"S80:20","prova":80,"item":20,"key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável), esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som broncovesicular.","Som claro pulmonar.","Som timpânico.","Som maciço."],"gab":0,"com":["<b>Justificativa oficial:</b> Som broncovesicular é som normal que pode ser encontrado pela ausculta, a depender do sítio torácico auscultado. Os demais sons, embora normais (a depender do sítio examinado), referem-se à percussão, e não à ausculta.","Claro pulmonar é normal, mas é som de percussão, não de ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"ed":1,"rec":1},{"id":"S80.21","jid":"S80:21","prova":80,"item":21,"key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnosticada e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e o ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais: 1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?; 2. derrame pleural à direita, de etiologia tromboembólica? O raio X de tórax confirmou a presença do volumoso derrame pleural à direita.<br>Acerca do exame físico dessa paciente, analise as seguintes assertivas.<br>I) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.<br>II) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.<br>III) Espera-se encontrar uma percussão submaciça no lado acometido.<br>IV) Espera-se encontrar sons respiratórios diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas:","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, e a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando à limitação dos movimentos (expansibilidade) no hemitórax acometido. Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta. Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"ed":1,"rec":1},{"id":"S80.22","jid":"S80:22","prova":80,"item":22,"key":"C8","tema":"a9","seg":"s3","mod":"prova","enun":"Homem de 62 anos, hipertenso mal controlado, chega ao pronto-socorro com dor torácica que começou de forma súbita, já com intensidade máxima, descrita como \"rasgando\", irradiada para a região interescapular.","cmd":"Quais achados do exame físico reforçam a principal hipótese diagnóstica?","alts":["Dor reproduzida à palpação do esterno e das articulações condrocostais","Diferença de pressão arterial e de amplitude de pulso entre os membros superiores","Atrito pericárdico que melhora quando o paciente inclina o tórax para frente","Sibilos difusos e tempo expiratório prolongado na ausculta pulmonar"],"gab":1,"com":["Dor reproduzida à palpação sugere causa musculoesquelética (costocondrite), não dissecção.","<b>Justificativa oficial:</b> A dor da dissecção aguda da aorta torácica é classicamente intensa (já em sua instalação), podendo ocorrer irradiação para região interescapular. Outros sinais e sintomas podem associar-se à dor torácica, a depender da localização da dissecção: abafamento de bulhas, ingurgitamento jugular, diferença da PA entre MMSS e diferença de intensidade de pulso entre MMSS.","Atrito que alivia com o tórax inclinado para frente é da pericardite aguda.","Sibilos e expiração prolongada apontam para broncoespasmo (asma, DPOC)."],"imgs":[],"ed":0,"rec":1},{"id":"S80.23","jid":"S80:23","prova":80,"item":23,"key":"C28","tema":"a3","seg":"s4","mod":"prova","enun":"A posição de cócoras (agachado) pode ser uma posição de alívio/conforto para determinados pacientes. Ao assumirem essa posição, os pacientes aumentam, de forma involuntária, a resistência vascular periférica.","cmd":"Dentre as afecções ou patologias listadas abaixo, qual poderia estar relacionada a algum grau de alívio/conforto relatado pelo paciente ao assumir a posição de cócoras?","alts":["Shunt arteriovenoso, direita-esquerda.","Shunt arteriovenoso, esquerda-direita.","Estenose mitral com congestão pulmonar.","Derrame pericárdico com restrição diastólica."],"gab":0,"com":["<b>Justificativa oficial:</b> O aumento da resistência vascular periférica (posição de cócoras) pode levar de forma retrógrada a um aumento das pressões intravasculares à esquerda, diminuindo assim a passagem de sangue venoso (pouco oxigenado) para o lado do sangue arterial (oxigenado), em casos de comunicação (shunt) que cursam com passagem de sangue da direita para a esquerda.","No shunt esquerda-direita o sangue já vai da esquerda para a direita; aumentar a pressão à esquerda não alivia.","A estenose mitral não melhora com cócoras; o paciente congesto prefere sentar (ortopneia).","No derrame pericárdico a posição de alívio é a genupeitoral (prece maometana)."],"imgs":[],"ed":1,"rec":1},{"id":"S80.24","jid":"S80:24","prova":80,"item":24,"key":"C53","tema":"a8","seg":"s1","mod":"prova","enun":"Registro do prontuário: \"Dados vitais: FC 52 bpm (contada pela ausculta cardíaca); FR 16 irpm; PA 120/80 mmHg; TAX 36,4 °C\".","cmd":"Acerca da frequência encontrada, assinale a alternativa correta.","alts":["Bradicardia, pois a contagem foi feita diretamente no exame cardíaco","Bradisfigmia, pois a frequência está abaixo de 60 por minuto","Normocardia, pois o limite inferior da normalidade é de 50 bpm","Bradisfigmia, pois a ausculta mede o pulso arterial central"],"gab":0,"com":["<b>Justificativa oficial:</b> A frequência cardíaca foi estabelecida através da ausculta. O termo correto é bradicardia, pois a medida foi estabelecida diretamente no exame cardíaco, e não do pulso periférico. A faixa de normalidade da FP e da FC em repouso é de $60$ a $100$ (ppm ou bpm). Frequências acima de $100$ são consideradas taqui (seja cardíaca ou esfígmica). Frequências abaixo de $60$ são consideradas bradi (seja cardíaca ou esfígmica). A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida através da análise dos batimentos por minuto (bpm), seja pela ausculta ou palpação do ictus. Bradi ou taquisfigmia é relativo ao pulso, e é medido pelo número de pulsações por minuto (ppm). A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que o pulso é um fenômeno físico sempre relacionado a um batimento cardíaco. Embora na maioria dos casos seus valores numéricos realmente sejam equivalentes, ou iguais, e que fisiologicamente eles estão inter-relacionados - o pulso depende de um batimento eficaz para ser produzido.","Bradisfigmia é do pulso; aqui foi contado o coração.","O limite inferior é 60.","A ausculta conta batimentos (bpm), não pulsações."],"imgs":[],"ed":0,"rec":1},{"id":"S80.25","jid":"S80:25","prova":80,"item":25,"key":"C16","tema":"a12","seg":"s6","mod":"prova","enun":"Homem de 64 anos, tabagista de 50 anos-maço, tem tosse crônica produtiva com expectoração volumosa todos os dias, cianose facial e edema de membros inferiores. Não está emagrecido.","cmd":"Qual fenótipo melhor descreve esse paciente?","alts":["Congesto azulado.","Soprador rosa.","Asmático em crise.","Restritivo intersticial."],"gab":0,"com":["<b>Justificativa oficial:</b> A tosse crônica e produtiva (congestão) e a cianose facial (azul) permitem inferir o fenótipo \"Congesto azulado\".","O soprador rosa é emagrecido, sarcopênico, rosado e tem pouca secreção (predomina enfisema).","A asma tem crises súbitas e variáveis, não tosse produtiva diária com cianose crônica.","O quadro é obstrutivo (bronquite crônica), não restritivo."],"imgs":[],"ed":0,"rec":1},{"id":"S80.26","jid":"S80:26","prova":80,"item":26,"key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias, desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope, alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio.<br>Analise as seguintes assertivas.<br>1. Ausência de pródromos ou gatilhos detectáveis.<br>2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.<br>3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em indivíduo jovem (adolescente/adulto jovem) previamente hígido.<br>4. Histórico de cardiopatia de base conhecida pelo médico e paciente.","cmd":"São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas:","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vaso-vagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"ed":1,"rec":1},{"id":"S80.27","jid":"S80:27","prova":80,"item":27,"key":"C12","tema":"a3","seg":"s2","mod":"prova","enun":"O estudo do biotipo corporal (longilíneo, brevilíneo e normolíneo) possui grande relevância clínica e semiológica, como ilustrado na figura.<br>I. Há maior incidência de pneumotórax espontâneo em jovens longilíneos do sexo masculino, em relação à população geral.<br>II. Há variações normais da posição do ictus nos diferentes biotipos, sem necessariamente significar alterações.<br>III. Conhecer o biotipo permite uma melhor interpretação de exames de imagem, minimizando interpretações equivocadas.","cmd":"Assinale a alternativa que contém as afirmações corretas.","alts":["I e II.","II e III.","I.","I, II e III."],"gab":3,"com":["Falta a III: a conformação de cada biotipo pode confundir a leitura de exames de imagem.","Falta a I: jovens longilíneos do sexo masculino têm mais pneumotórax espontâneo.","Faltam a II e a III, ambas corretas.","<b>Justificativa oficial:</b> O ictus cordis pode estar desviado, de forma normal, até $2,0\\text{ cm}$ para direita da linha hemiclavicular (LH) e para o $4^\\circ$ espaço intercostal esquerdo (EIE) em indivíduos longilíneos, bem como para o $5^\\circ$ EIE e $2,0\\text{ cm}$ para esquerda da LH em indivíduos brevilíneos. Indivíduos jovens, do sexo masculino e longilíneos apresentam maior predisposição, em relação à população geral, a desenvolverem pneumotórax espontâneo, embora a fisiopatologia não seja bem conhecida. Características particulares da conformação anatômica normal de cada biótipo podem confundir a interpretação de exames de imagem, devendo sempre considerar sua potencial interferência na análise desses exames."],"imgs":["biotipos"],"ed":0,"rec":1},{"id":"S80.28","jid":"S80:28","prova":80,"item":28,"key":"C54","tema":"a7","seg":"s2","mod":"prova","enun":"Na revisão para a prova, o professor lista quatro lesões valvares e pergunta qual delas daria um sopro em fase diferente das outras.","cmd":"Dentre as lesões valvares abaixo, qual pode cursar com sopro diastólico?","alts":["Insuficiência mitral.","Estenose mitral.","Estenose aórtica.","Insuficiência tricúspide."],"gab":1,"com":["Insuficiência mitral: sopro sistólico (refluxo VE → AE).","<b>Justificativa oficial:</b> Dentre as alternativas apresentadas, a única lesão valvar que poderia levar a um sopro diastólico seria a estenose mitral. Todas as demais alternativas cursariam com sopros sistólicos.","Estenose aórtica: sopro sistólico ejetivo.","Insuficiência tricúspide: sopro sistólico (refluxo VD → AD)."],"imgs":[],"ed":0,"rec":1},{"id":"S80.29","jid":"S80:29","prova":80,"item":29,"key":"C9","tema":"a11","seg":"s2","mod":"prova","enun":"Paciente relata falta de ar que surge quando se levanta da cama e fica em pé, e que melhora quando volta a deitar-se de costas. Ao contrário do que ocorre no edema agudo de pulmão, ele não tolera a posição ortostática.","cmd":"Esse tipo de dispneia denomina-se:","alts":["Platipneia.","Ortopneia.","Trepopneia.","Dispneia paroxística noturna."],"gab":0,"com":["<b>Justificativa oficial:</b> Nome dado à dispneia que - ao contrário da dispneia do edema agudo de pulmão (Ortopneia) - piora com a posição ortostática: Platipneia. A Trepopneia relaciona-se à dispneia que piora ou melhora com determinado decúbito lateral.","Ortopneia é a dispneia que piora deitado e alivia sentado ou em pé, como no edema agudo de pulmão.","Trepopneia é a dispneia que muda com o decúbito lateral.","A dispneia paroxística noturna acorda o paciente e se relaciona à ortopneia."],"imgs":[],"ed":0,"rec":1},{"id":"S80.30","jid":"S80:30","prova":80,"item":30,"key":"C55","tema":"a7","seg":"s3","mod":"prova","enun":"Paciente com sopro sistólico no foco tricúspide. Durante a inspiração profunda seguida de apneia, o sopro aumenta de intensidade.","cmd":"A manobra intensifica o sopro da insuficiência tricúspide porque:","alts":["A inspiração reduz o retorno venoso e aumenta o refluxo para o átrio esquerdo","A inspiração aumenta o retorno venoso e o fluxo pela valva direita lesada","A apneia eleva a pressão no ventrículo esquerdo e o refluxo pela valva mitral","A expiração forçada aproxima o coração da parede e amplifica o som do sopro"],"gab":1,"com":["A inspiração aumenta, e não reduz, o retorno venoso; e o refluxo da IT vai para o átrio direito.","<b>Justificativa oficial:</b> A manobra de Rivero-Carvallo intensifica os sopros do lado direito do coração (principalmente o da insuficiência tricúspide) porque a inspiração aumenta o retorno venoso sistêmico, elevando o fluxo sanguíneo através da válvula comprometida, o que amplifica o sopro.","A manobra age no coração direito; a IM não muda com ela.","A manobra é feita em inspiração, não em expiração forçada."],"imgs":[],"ed":0,"rec":1},{"id":"S80.31","jid":"S80:31","prova":80,"item":31,"key":"C56","tema":"a10","seg":"s2","mod":"prova","enun":"Acerca da síncope vasovagal, pode-se afirmar:","cmd":"Assinale uma opção.","alts":["Habitualmente os pacientes apresentam severas lesões de extremidades e contusões graves.","Habitualmente são precedidas de dor torácica de forte intensidade e palpitações.","Habitualmente os pacientes não se queixam de sintomas precedendo o quadro sincopal.","Habitualmente a presença de sintomas prodrômicos permite um esboço de defesa."],"gab":3,"com":["Lesões graves por queda sem defesa sugerem síncope cardíaca, sem pródromos.","Dor torácica forte e palpitações antes da síncope são alarme de causa cardíaca.","Na vasovagal há pródromos (sudorese, palidez, visão turva); ausência de sintomas é da cardíaca.","<b>Justificativa oficial:</b> Habitualmente, a presença de sintomas pré-sincopais (antecedendo o quadro sincopal em segundos) permite um esboço de defesa (encostar em uma parede, assentar-se etc.), podendo minimizar fraturas e contusões."],"imgs":[],"ed":1,"rec":1},{"id":"S81.1","jid":"S81:1","prova":81,"item":1,"key":"C30","tema":"a8","seg":"s1","mod":"prova","enun":"Durante a realização do exame físico de um paciente sob seus cuidados, especificamente na etapa de aferição dos dados vitais, você encontrou uma frequência de pulso (FP) de repouso de 50 ppm (pulsações por minuto). A pressão arterial, a frequência respiratória e a temperatura axilar encontravam-se normais. Você considerou, inicialmente, como possíveis causas para esse achado o uso de medicação betabloqueadora para controle da hipertensão arterial, associado ao hábito relatado pelo paciente de realizar atividades físicas frequentes e de forma regular, obtido durante a anamnese.","cmd":"Acerca da frequência de pulso desse paciente, pode-se afirmar:","alts":["É incorreto chamá-la de bradicardia: foi aferida no pulso (ppm), e não nos batimentos (bpm)","É correto chamá-la de bradicardia: FC e FP são termos sinônimos na prática clínica diária","É correto chamá-la de bradisfigmia só quando houver dissociação entre pulso e ausculta","É incorreto chamá-la de bradi: no atleta a faixa normal de pulso começa em 40 ppm"],"gab":0,"com":["<b>Justificativa oficial:</b> A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida por batimentos por minuto (bpm). Esfígmico é relativo ao pulso e é medido pelo número de pulsações por minuto (ppm). FC - bpm. FP - ppm. A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que pulso é um fenômeno físico distinto de batimento, embora na maioria absoluta da população seus valores numéricos realmente sejam equivalentes ou iguais, e que fisiologicamente são inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos), achado importante para suspeição e/ou diagnóstico de algumas arritmias, é um - dentre outros - exemplo da importância prática dessa distinção, indo além de um suposto preciosismo léxico da nomenclatura médica.","FC (bpm) e FP (ppm) são fenômenos diferentes; a dissociação pulso-ausculta mostra por quê.","Bradisfigmia é qualquer FP abaixo de 60 ppm, com ou sem dissociação.","A faixa de normalidade usada na prova é 60 a 100; 50 ppm é bradisfigmia."],"imgs":[],"ed":1,"rec":1},{"id":"S81.2","jid":"S81:2","prova":81,"item":2,"key":"C56","tema":"a10","seg":"s2","mod":"prova","enun":"Acerca da síncope vasovagal, pode-se afirmar:","cmd":"Assinale uma opção.","alts":["Habitualmente os pacientes apresentam severas lesões de extremidades e contusões graves.","Habitualmente são precedidas de dor torácica de forte intensidade e palpitações.","Habitualmente os pacientes não se queixam de sintomas precedendo o quadro sincopal.","Habitualmente a presença de sintomas prodrômicos permite um esboço de defesa."],"gab":3,"com":["Lesões graves por queda sem defesa sugerem síncope cardíaca, sem pródromos.","Dor torácica forte e palpitações antes da síncope são alarme de causa cardíaca.","Na vasovagal há pródromos (sudorese, palidez, visão turva); ausência de sintomas é da cardíaca.","<b>Justificativa oficial:</b> Habitualmente, a presença de sintomas pré-sincopais (antecedendo o quadro sincopal em segundos) permite um esboço de defesa (encostar em uma parede, assentar-se etc.), podendo minimizar fraturas e contusões."],"imgs":[],"ed":1,"rec":1},{"id":"S81.3","jid":"S81:3","prova":81,"item":3,"key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole), estamos contribuindo para a construção do raciocínio clínico.","cmd":"Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na sístole, logo após a primeira bulha.","Localizada na diástole, na fase de enchimento rápido.","Localizada no final da sístole, antes da segunda bulha."],"gab":2,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","B3 é diastólica; logo após B1 fica o clique de ejeção.","<b>Justificativa oficial:</b> $B_3$ relaciona-se à sobrecarga volumétrica, podendo ser auscultada no início da diástole, na fase denominada de enchimento ventricular rápido.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"ed":1,"rec":1},{"id":"S81.4","jid":"S81:4","prova":81,"item":4,"key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero-Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro.","cmd":"Acerca da manobra de Rivero-Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","alts":["Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco mitral, insuficiência mitral, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":0,"com":["<b>Justificativa oficial:</b> A manobra de Rivero-Carvallo é utilizada para diferenciar sopros causados pela insuficiência tricúspide da insuficiência mitral - ambos sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"ed":1,"rec":1},{"id":"S81.5","jid":"S8
