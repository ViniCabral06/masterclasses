pertrofia do VD","Derrame pericárdico"],"gab":0,"com":["Correta. No brevilíneo o coração horizontaliza.","A dilatação desloca para baixo e para fora, com ictus difuso.","A HVD dá retração apical.","O derrame apaga o ictus."],"imgs":["ictus-biotipos"]}]},"pv":["S81.27","S81.30","S80.3"]},{"id":"s2","titulo":"Focos de ausculta e posições do paciente","html":"\n<p class=\"lead\">Os focos de ausculta não correspondem à posição anatômica das valvas: são os pontos onde o som de cada valva chega melhor à parede.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"focos-ausculta\" alt=\"\"><figcaption>Focos de ausculta: aórtico (2º EIC direito, paraesternal), pulmonar (2º EIC esquerdo, paraesternal), aórtico acessório (3º EIC esquerdo, ponto de Erb), tricúspide (base do apêndice xifoide, borda esternal esquerda baixa) e mitral (5º EIC esquerdo na LHC, no ictus).</figcaption></figure>\n<table class=\"cmp\"><tr><th>Foco</th><th>Onde</th><th>O que se ouve melhor</th></tr>\n<tr><td>Aórtico</td><td>2º EIC direito, junto ao esterno</td><td>B2 (componente aórtico), sopros aórticos</td></tr>\n<tr><td>Pulmonar</td><td>2º EIC esquerdo, junto ao esterno</td><td>Desdobramentos de B2, sopros pulmonares</td></tr>\n<tr><td>Aórtico acessório (Erb)</td><td>3º EIC esquerdo, junto ao esterno</td><td>Sopro diastólico da insuficiência aórtica</td></tr>\n<tr><td>Tricúspide</td><td>Base do apêndice xifoide, à esquerda</td><td>B1, sopros tricúspides, manobra de Rivero-Carvallo</td></tr>\n<tr><td>Mitral</td><td>5º EIC esquerdo na LHC (ictus)</td><td>B1, B3, B4, sopros mitrais</td></tr></table>\n<p>Ordem prática: base → ponta (aórtico, pulmonar, aórtico acessório, tricúspide, mitral), ouvindo também as áreas entre os focos, axila e pescoço (irradiação).</p>\n<h3>Posições de ausculta</h3>\n<p>O médico fica <b>sempre à direita do paciente</b>.</p>\n<table class=\"cmp\"><tr><th>Posição</th><th>Para quê</th></tr>\n<tr><td>Decúbito dorsal</td><td>Posição padrão</td></tr>\n<tr><td>Sentado, com o tórax inclinado para frente</td><td>Intensifica sons da <b>base</b> do coração (sopro da insuficiência aórtica, atrito pericárdico)</td></tr>\n<tr><td>Decúbito lateral esquerdo, mão esquerda sob a cabeça</td><td>Sons da <b>valva mitral</b>: ruflar da estenose mitral e <b>B3</b>, com a <b>campânula</b></td></tr>\n<tr><td>Em pé, debruçado sobre uma mesa</td><td>O coração se aproxima da parede: útil na hipofonese de bulhas e na insuficiência aórtica</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"posicoes-ausculta\" alt=\"\"><figcaption>Posições de ausculta: sentado inclinado para frente, decúbito lateral esquerdo e em pé debruçado.</figcaption></figure>\n<h3>Diafragma × campânula</h3>\n<table class=\"cmp\"><tr><th>Peça</th><th>Sons</th><th>Exemplos</th></tr>\n<tr><td>Diafragma (pressionado)</td><td>Agudos</td><td>B1, B2, sopros de regurgitação, atrito</td></tr>\n<tr><td>Campânula (apoiada de leve)</td><td>Graves</td><td>B3, B4, ruflar da estenose mitral</td></tr></table>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Se a campânula for apertada com força, a pele vira um diafragma e os sons graves somem: apoie de leve.</p></div>","qs":{"p":[{"enun":"Para ouvir melhor uma possível B3 e o ruflar diastólico da estenose mitral, qual a melhor técnica?","cmd":"Assinale a alternativa correta.","alts":["Decúbito lateral esquerdo, no foco mitral, com a campânula","Sentado e inclinado para frente, no foco aórtico, com o diafragma","Decúbito dorsal, no foco pulmonar, com o diafragma","Em pé, no foco tricúspide, com a campânula pressionada"],"gab":0,"com":["Correta. Aproxima a ponta da parede; a campânula capta sons graves.","Essa posição favorece os sons da base, como a insuficiência aórtica.","O foco pulmonar não é o lugar dos sons mitrais.","A campânula pressionada perde os sons graves."],"imgs":[]},{"enun":"Onde fica o foco aórtico acessório (ponto de Erb)?","cmd":"Assinale a alternativa correta.","alts":["3º EIC esquerdo, junto ao esterno","2º EIC direito, junto ao esterno","2º EIC esquerdo, junto ao esterno","5º EIC esquerdo, na LHC"],"gab":0,"com":["Correta.","Esse é o foco aórtico.","Esse é o foco pulmonar.","Esse é o foco mitral."],"imgs":["focos-ausculta"]},{"enun":"Paciente obeso, com bulhas muito abafadas no decúbito dorsal.","cmd":"Qual posição pode ajudar a ouvir melhor?","alts":["Decúbito ventral","Decúbito lateral direito","Em pé, debruçado sobre uma mesa","Trendelenburg"],"gab":2,"com":["Não é uma posição de ausculta.","A posição lateral usada é a esquerda.","Correta. O coração se aproxima da parede.","Não é uma posição de ausculta cardíaca."],"imgs":[]}]},"pv":[]},{"id":"s3","titulo":"Ciclo cardíaco, B1 e B2","html":"\n<p class=\"lead\">Entender o ciclo cardíaco é o que permite localizar qualquer som (bulha extra, sopro, estalido) na sístole ou na diástole.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"ciclo-tum-ta\" alt=\"\"><figcaption>Ciclo na ausculta: B1 (\"tum\") abre a sístole (pequeno silêncio); B2 (\"tá\") abre a diástole (grande silêncio). B1 coincide com o pulso.</figcaption></figure>\n<ol class=\"steps\"><li><b>B1 (\"tum\")</b>: fechamento das valvas <b>atrioventriculares</b> (mitral e tricúspide). Marca o início da <b>sístole</b>. Melhor nos focos mitral e tricúspide. Coincide com o pulso carotídeo.</li><li><b>Pequeno silêncio</b>: sístole ventricular.</li><li><b>B2 (\"tá\")</b>: fechamento das valvas <b>semilunares</b> (aórtica e pulmonar). Marca o início da <b>diástole</b>. Melhor nos focos da base.</li><li><b>Grande silêncio</b>: diástole, mais longa que a sístole (encurta na taquicardia).</li></ol>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"B1 = fechamento das atrioventriculares, discute hiperfonese. B2 = fechamento das semilunares, discute desdobramentos.\" A mitral fecha antes da tricúspide e a aórtica antes da pulmonar: o coração esquerdo fecha primeiro.</p></div>\n<h3>O que muda a intensidade de B1</h3>\n<table class=\"cmp\"><tr><th>Fator</th><th>B1 hiperfonética</th><th>B1 hipofonética</th></tr>\n<tr><td><b>Posição dos folhetos</b> no início da sístole (principal fator)</td><td>Folhetos mais abertos (\"mais baixos\"): estados hipercinéticos, taquicardia, diástole curta</td><td>Folhetos já quase fechados</td></tr>\n<tr><td>Pressão intra-atrial</td><td>Estenose mitral sem calcificação</td><td>—</td></tr>\n<tr><td>Valva</td><td>Valva fibrosa, não calcificada (timbre metálico)</td><td>Estenose mitral calcificada</td></tr>\n<tr><td>Força do ventrículo</td><td>—</td><td>Músculo \"doente\": miocardite, IC, IAM</td></tr>\n<tr><td>Transmissão</td><td>—</td><td>Musculatura peitoral, panículo adiposo, enfisema, derrame pericárdico</td></tr></table>\n<p><b>Intensidade variável</b> de B1 (ora hiperfonética, ora normal, ora hipofonética): fibrilação atrial (enchimentos diferentes a cada batimento) e BAVT. O mascaramento de B1 ocorre nos sopros sistólicos de regurgitação.</p>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Anotação: \"Tom variável de B1, uma hora forte, outra hora fraco → fibrilação atrial: o nó sinusal perde o comando elétrico do átrio.\"</p></div>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"b1-alteracoes\" alt=\"\"><figcaption>Alterações de B1: hiperfonese (folhetos abertos, estenose mitral não calcificada), hipofonese (miocárdio doente, calcificação, transmissão ruim) e intensidade variável (FA).</figcaption></figure>\n<h3>O que muda B2</h3>\n<table class=\"cmp\"><tr><th>Alteração</th><th>Causas</th></tr>\n<tr><td>Hiperfonese de B2 no foco aórtico</td><td>Hipertensão arterial sistêmica</td></tr>\n<tr><td>Hiperfonese de B2 no foco pulmonar</td><td>Hipertensão pulmonar; aumento de débito, CIA, PCA</td></tr>\n<tr><td>Hipofonese de B2</td><td>Baixo débito, calcificação ou soldadura das sigmoides, má transmissão</td></tr>\n<tr><td>B2 seca</td><td>Endurecimento ou fibrose das sigmoides</td></tr>\n<tr><td>B2 clangorosa no foco aórtico</td><td>Aortite luética (sífilis)</td></tr>\n<tr><td>Desdobramentos</td><td>Fisiológico, persistente (fixo ou não fixo), invertido (próxima aula)</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"b2-alteracoes\" alt=\"\"><figcaption>Alterações de B2: hiperfonese aórtica (HAS) e pulmonar (hipertensão pulmonar), hipofonese, B2 clangorosa (aortite luética) e desdobramentos.</figcaption></figure>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Na B2, a regra é a pressão a jusante: quanto maior a pressão na aorta (HAS) ou na artéria pulmonar (hipertensão pulmonar), mais forte a valva fecha e mais alta a B2 naquele foco.</p></div>","qs":{"p":[{"enun":"Paciente com taquicardia sinusal de 130 bpm por febre. Na ausculta, B1 está mais intensa que o habitual.","cmd":"Qual o mecanismo?","alts":["A diástole curta faz a sístole começar com os folhetos AV abertos","A taquicardia calcifica os folhetos valvares e aumenta o ruído","A febre aumenta a pressão na artéria pulmonar e reforça a bulha","A taquicardia diminui a força de contração do VE e o fechamento"],"gab":0,"com":["Correta. Posição dos folhetos é o principal fator da intensidade de B1.","Não há calcificação aguda.","Isso mudaria B2, não B1.","Menos força daria hipofonese."],"imgs":[]},{"enun":"Hipertenso de longa data, sem outras doenças. Que alteração de bulha é esperada?","cmd":"Assinale a alternativa correta.","alts":["Hipofonese de B1 no foco mitral","B2 clangorosa no foco pulmonar","Hiperfonese de B2 no foco pulmonar","Hiperfonese de B2 no foco aórtico"],"gab":3,"com":["HAS não reduz B1.","B2 clangorosa é aórtica, da aortite luética.","Foco pulmonar hiperfonético é da hipertensão pulmonar.","Correta. Pressão aórtica alta fecha a valva com força."],"imgs":[]},{"enun":"Sobre o ciclo cardíaco na ausculta, assinale a correta.","cmd":"Assinale a alternativa correta.","alts":["B2 é o fechamento das valvas AV e coincide com o pulso","B1 é o fechamento das semilunares e abre a diástole","O grande silêncio corresponde à sístole ventricular","B1 é o fechamento das AV, abre a sístole e coincide com o pulso"],"gab":3,"com":["B2 é das semilunares; o pulso coincide com B1.","Fechamento das semilunares é B2.","O grande silêncio é a diástole.","Correta."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"O ictus cordis é produzido por:","cmd":"Assinale a alternativa correta.","alts":["Átrio esquerdo","Ventrículo direito","Ventrículo esquerdo","Aorta ascendente"],"gab":2,"com":["O átrio não toca a parede.","O VD só forma a ponta na HVD.","Correta.","A aorta não forma a ponta."],"imgs":[]},{"enun":"Ictus ocupando 3 polpas digitais é:","cmd":"Assinale a alternativa correta.","alts":["Típico do brevilíneo, de tórax curto","Difuso, sugerindo hipertrofia ou dilatação","Típico do derrame pericárdico volumoso","Normal, dentro do esperado no adulto"],"gab":1,"com":["O biotipo muda a posição, não a extensão.","Correta. Normal é até 2 polpas.","O derrame apaga o ictus.","Normal é 1 a 2."],"imgs":[]},{"enun":"Retração sistólica apical sugere:","cmd":"Assinale a alternativa correta.","alts":["Hipertrofia de VD","Estenose mitral","Hipertrofia de VE","Insuficiência aórtica"],"gab":0,"com":["Correta.","Estenose mitral não causa retração apical.","HVE dá ictus propulsivo.","IAo dá ictus amplo."],"imgs":[]},{"enun":"O foco mitral fica:","cmd":"Assinale a alternativa correta.","alts":["No 2º EIC direito, junto ao esterno","Na base do apêndice xifoide","No 3º EIC esquerdo, na borda esternal","No 5º EIC esquerdo, na LHC"],"gab":3,"com":["Esse é o aórtico.","Esse é o tricúspide.","Esse é o acessório.","Correta."],"imgs":[]},{"enun":"A campânula é usada para sons:","cmd":"Assinale a alternativa correta.","alts":["Qualquer som, desde que pressionada","Agudos, como atrito pericárdico","Graves, como B3, B4 e o ruflar mitral","Agudos, como B1 e B2"],"gab":2,"com":["Pressionada ela vira diafragma.","Diafragma.","Correta.","Diafragma."],"imgs":[]},{"enun":"B1 com intensidade que varia a cada batimento sugere:","cmd":"Assinale a alternativa correta.","alts":["Estenose aórtica","Hipertensão arterial","Fibrilação atrial","Comunicação interatrial"],"gab":2,"com":["EAo dá sopro sistólico.","HAS altera B2.","Correta.","CIA dá desdobramento fixo de B2."],"imgs":[]},{"enun":"B2 clangorosa no foco aórtico lembra:","cmd":"Assinale a alternativa correta.","alts":["Miocardite","Aortite luética","Estenose pulmonar","Fibrilação atrial"],"gab":1,"com":["Miocardite reduz B1.","Correta.","Foco pulmonar.","FA altera B1."],"imgs":[]},{"enun":"Paciente sentado e inclinado para frente favorece a ausculta de:","cmd":"Assinale a alternativa correta.","alts":["Sons da base, como a insuficiência aórtica","Sons de B4 de origem ventricular esquerda","Sons tricúspides, como o sopro da insuficiência","Sons mitrais, como B3 e o ruflar diastólico"],"gab":0,"com":["Correta.","B4: campânula na ponta.","Tricúspide: decúbito dorsal.","Mitral: decúbito lateral esquerdo."],"imgs":[]}],"widgets":[{"id":"foco","titulo":"Em que foco?","desc":"Associe cada som ao foco onde é mais bem ouvido.","cats":[["ao","Aórtico"],["pu","Pulmonar"],["ac","Aórtico acessório"],["tr","Tricúspide"],["mi","Mitral"]],"cards":[["B2 hiperfonética da HAS","ao"],["Desdobramento de B2","pu"],["Sopro diastólico da insuficiência aórtica","ac"],["Sopro que aumenta na Rivero-Carvallo","tr"],["B3","mi"],["Ruflar diastólico da estenose mitral","mi"],["Sopro sistólico ejetivo da estenose aórtica","ao"],["B2 hiperfonética da hipertensão pulmonar","pu"]]}],"gl":[["Ictus cordis","Choque da ponta do VE; 5º EIC na LHC no normolíneo.",1],["Ictus propulsivo","Levanta a mão do examinador: hipertrofia do VE.",1],["Retração sistólica apical","Ponta formada pelo VD hipertrofiado.",1],["Ponto de Erb","Foco aórtico acessório, 3º EIC esquerdo.",2],["Campânula","Sons graves (B3, B4, ruflar).",2],["B1","Fechamento das valvas AV; início da sístole.",3],["B2","Fechamento das semilunares; início da diástole.",3],["B2 clangorosa","Timbre metálico no foco aórtico: aortite luética.",3]],"vf":[["A percussão ainda é etapa obrigatória do exame cardíaco.",false,"O professor: \"não precisa mais\"."],["Ictus de 3 polpas é difuso.",true,"Normal é 1 a 2 polpas."],["A posição dos folhetos é o principal fator da intensidade de B1.",true,"Folhetos mais abertos → B1 mais forte."],["B1 coincide com o pulso.",true,"Abre a sístole."],["Na HAS espera-se hiperfonese de B2 no foco pulmonar.",false,"No foco aórtico."],["O médico fica à esquerda do paciente.",false,"Sempre à direita."]],"check":["Citar os achados de HVD na inspeção e palpação","Descrever o ictus normal e o propulsivo, difuso e deslocado","Localizar os 5 focos de ausculta","Escolher a posição e a peça do estetoscópio para cada som","Explicar B1 e B2 e os fatores da intensidade de cada uma"],"resumo":[["Segmento 1","Ictus = ponta do VE, 5º EIC na LHC, 1–2 polpas; muda com o biotipo. HVD: retração sistólica apical, levantamento em massa, pulsação epigástrica."],["Segmento 2","Focos: aórtico, pulmonar, acessório (Erb), tricúspide, mitral. Decúbito lateral esquerdo + campânula para B3 e sons mitrais; sentado inclinado para sons da base."],["Segmento 3","B1 = fechamento AV (início da sístole); B2 = semilunares (início da diástole). B1 alta: folhetos abertos, EM não calcificada; variável: FA. B2 alta: HAS (aórtico), HP (pulmonar)."]],"freq":[["Biotipo e posição do ictus cordis",5,"S77.7, S78.9, S79.5, S81.27, S82.6"],["HVD: a ponta vira VD e aparece retração sistólica apical",2,"S79.4, S81.30"],["Ictus na hipertrofia de VD: retração apical e levantamento em massa",2,"S77.1, S80.3"]],"cob":{"rk":{"t":"Qual ventrículo está na ponta","c":["Doença","Ventrículo hipertrofiado","O que forma a ponta","Achado"],"d":["<b>Doença</b>: o que sobrecarrega o coração.","<b>Ventrículo hipertrofiado</b>: o esquerdo (sobrecarga sistêmica) ou o direito (sobrecarga pulmonar).","<b>O que forma a ponta</b>: normalmente o VE; na HVD, o VD.","<b>Achado</b>: VE grande empurra (ictus propulsivo, deslocado); VD na ponta puxa (retração apical)."],"x":[["Estenose aórtica","VE","VE","ictus propulsivo, difuso"],["Hipertensão pulmonar","VD","VD","retração sistólica apical, levantamento em massa, pulsação epigástrica"],["Normolíneo saudável","—","VE","ictus no 5º EIC na LHC, 1–2 polpas"]],"ex":"HVD: retração sistólica apical + levantamento em massa do precórdio + pulsações epigástricas.","b":"Ictus por biotipo: brevilíneo 4º EIC por fora; normolíneo 5º EIC na LHC; longilíneo 6º EIC por dentro."},"figs":[["hvd-movimentos","Movimentos do precórdio na hipertrofia de VD.","s1"],["ictus-biotipos","Ictus em cada biotipo.","s1"],["focos-ausculta","Os focos de ausculta.","s2"]],"keys":["C6","C40","C0"]}},{"id":"a6","num":6,"nome":"Bulhas: desdobramentos, B3 e B4","tema":"Desdobramentos de B2 (fisiológico, BRD, CIA, BRE), terceira e quarta bulhas, ritmo tríplice e galope","segs":[{"id":"s1","titulo":"Desdobramentos de B2","html":"\n<p class=\"lead\">O ritmo normal é regular, em dois tempos (tum-tá). Quando os componentes aórtico (A2) e pulmonar (P2) de B2 se separam o bastante para serem ouvidos, há desdobramento (\"tum-tlá\"). Este é um dos temas que mais caem nas somativas.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"conducao-respiracao\" alt=\"\"><figcaption>Efeito da respiração: na inspiração, a pressão intratorácica fica mais negativa, mais sangue chega ao coração direito, o VD esvazia mais devagar e P2 atrasa.</figcaption></figure>\n<h3>A lógica: o que atrasa, e quando</h3>\n<p>Normalmente A2 vem antes de P2, quase juntos. Duas coisas podem separá-los:</p>\n<ul><li><b>Respiração</b>: na inspiração, aumenta o retorno venoso para o coração direito; o VD tem mais trabalho e <b>P2 atrasa ainda mais</b>.</li><li><b>Condução elétrica</b>: um bloqueio de ramo atrasa a contração do ventrículo daquele lado.</li></ul>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Anotação do slide: \"atrasar o que já é atrasado\". No BRD, o pulmonar já atrasa pelo bloqueio, e na inspiração o retorno venoso \"aumenta o trabalho de quem já era atrasado\".</p></div>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Quando se ouve</th><th>Por quê</th><th>Causa clássica</th></tr>\n<tr><td><b>Fisiológico</b></td><td><mark class=\"f1\" data-refs=\"S79.15\">Só na inspiração; some na expiração</mark></td><td>Inspiração atrasa P2</td><td>Normal, sobretudo em jovens</td></tr>\n<tr><td><b>Persistente não fixo</b></td><td><mark class=\"f4\" data-refs=\"S77.2,S80.10,S81.7,S79.15\">Na inspiração e na expiração, <b>mais amplo na inspiração</b></mark></td><td>O bloqueio atrasa P2 o tempo todo, e a inspiração atrasa mais</td><td><mark class=\"f4\" data-refs=\"S77.2,S80.10,S81.7,S79.15\">Bloqueio de ramo direito (BRD)</mark></td></tr>\n<tr><td><b>Persistente fixo</b></td><td><mark class=\"f2\" data-refs=\"S80.15,S79.15\">Na inspiração e na expiração, <b>igual nas duas</b></mark></td><td>Os átrios se comunicam: a variação respiratória é dividida entre os dois lados</td><td><mark class=\"f2\" data-refs=\"S80.15,S79.15\">Comunicação interatrial (CIA)</mark></td></tr>\n<tr><td><b>Invertido (paradoxal)</b></td><td><mark class=\"f5\" data-refs=\"S77.5,S78.29,S79.23,S81.26,S80.2,S79.15,S82.15,EDS.10\"><b>Só na expiração</b>; some na inspiração</mark></td><td>A2 atrasa e passa a vir depois de P2; na inspiração P2 atrasa, \"alcança\" A2 e B2 fica única</td><td><mark class=\"f5\" data-refs=\"S77.5,S78.29,S79.23,S81.26,S80.2,S79.15,S82.15,EDS.10\">Bloqueio de ramo esquerdo (BRE)</mark></td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"desdobramentos\" alt=\"\"><figcaption>Os quatro desdobramentos de B2 nas duas fases da respiração.</figcaption></figure>\n<h3>O BRD também desdobra B1</h3>\n<p><mark class=\"f3\" data-refs=\"S77.2,S80.10,S81.7\">No BRD, o fechamento da tricúspide atrasa como o da pulmonar: pode haver desdobramento de <b>B1 e de B2</b>, persistente e variável, acentuado na inspiração</mark>. O desdobramento de B1 não é patológico por si; o BRD é causa quando é intenso.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A questão das assertivas do desdobramento invertido caiu várias vezes: certas são \"ocorre na fase expiratória\" e \"o BRE é causa possível\". Erradas: \"é persistente, mais intenso na expiração\" (na inspiração ele some) e \"não varia com a respiração porque a causa é elétrica\" (varia: aparece na expiração, some na inspiração).</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Não confunda os dois \"persistentes\": <b>não fixo</b> (varia com a respiração) é o BRD; <b>fixo</b> (não varia) é a CIA.</p></div>","qs":{"p":[{"enun":"Jovem de 18 anos, saudável. No foco pulmonar, B2 se desdobra na inspiração e fica única na expiração.","cmd":"Qual a interpretação?","alts":["Desdobramento persistente fixo, por CIA","Desdobramento invertido, por BRE","Desdobramento fisiológico","Desdobramento persistente não fixo, por BRD"],"gab":2,"com":["Na CIA ele aparece nas duas fases, igual.","O invertido aparece só na expiração.","Correta. Só na inspiração, por atraso de P2 com o retorno venoso.","No BRD aparece nas duas fases."],"imgs":[]},{"enun":"Paciente com desdobramento de B2 audível na expiração, que desaparece na inspiração.","cmd":"Qual a causa mais provável?","alts":["Bloqueio de ramo direito","Comunicação interatrial","Bloqueio de ramo esquerdo","Estenose pulmonar leve"],"gab":2,"com":["O BRD dá desdobramento nas duas fases, maior na inspiração.","A CIA dá desdobramento fixo.","Correta. Desdobramento invertido: A2 atrasa e vem depois de P2.","A estenose pulmonar atrasa P2, dando desdobramento mais amplo, não invertido."],"imgs":[]},{"enun":"Criança com sopro sistólico suave no foco pulmonar e B2 desdobrada com o mesmo intervalo na inspiração e na expiração.","cmd":"Qual a hipótese?","alts":["Desdobramento fisiológico","Bloqueio de ramo direito","Comunicação interatrial","Bloqueio de ramo esquerdo"],"gab":2,"com":["O fisiológico some na expiração.","O BRD varia com a respiração.","Correta. Desdobramento persistente e fixo.","O BRE dá desdobramento invertido."],"imgs":[]}]},"pv":["S81.26","S81.7","S80.2","S80.15","S79.15"]},{"id":"s2","titulo":"Terceira e quarta bulhas","html":"\n<p class=\"lead\">B3 e B4 são bulhas extras, graves, ouvidas com a campânula no foco mitral (ou tricúspide, se do VD). Cada uma tem um momento no ciclo e um tipo de sobrecarga.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"b3b4-linha\" alt=\"\"><figcaption>Posição de B3 e B4 no ciclo: B3 logo depois de B2 (início da diástole, enchimento rápido); B4 logo antes de B1 (fim da diástole, contração atrial).</figcaption></figure>\n<table class=\"cmp\"><tr><th></th><th>B3</th><th>B4</th></tr>\n<tr><td>Momento</td><td><mark class=\"f5\" data-refs=\"S77.19,S78.12,S79.31,S81.3,S78.25,S79.19,S80.1,S82.12,S82.5,EDS.8\">Início da diástole (protodiastólica), fase de <b>enchimento rápido</b></mark></td><td><mark class=\"f5\" data-refs=\"S79.10,S81.17,S77.20,S78.1,S82.1,EDS.7\">Fim da diástole (<b>pré-sistólica</b>), coincide com a <b>contração atrial</b></mark></td></tr>\n<tr><td>Mecanismo</td><td>Sangue que chega rápido e choca um ventrículo complacente e cheio</td><td>Átrio contraindo contra um ventrículo rígido, hipertrofiado</td></tr>\n<tr><td>Sobrecarga</td><td><b>De volume</b></td><td><mark class=\"f3\" data-refs=\"S77.20,S78.1,S82.1\"><b>De pressão</b></mark></td></tr>\n<tr><td>Exemplos</td><td>IC com VE dilatado, insuficiência mitral; fisiológica em crianças, jovens e gestantes</td><td>HAS com HVE, estenose aórtica, cardiomiopatia hipertrófica, isquemia</td></tr>\n<tr><td>Ritmo</td><td>\"Tum-tá-tu\" (Kentucky)</td><td>\"Tu-tum-tá\" (Tennessee)</td></tr>\n<tr><td>Na fibrilação atrial</td><td>Pode persistir</td><td><mark class=\"f4\" data-refs=\"S78.22,S79.18,S80.12,S82.31\"><b>Desaparece</b>: não há contração atrial</mark></td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Anotação do slide: \"Ficha uma 3ª bulha, mas ela desaparece quando entra em fibrilação atrial → é B4: depende da contração atrial para acontecer; está fibrilando, tremendo\". E: \"B3 = diástole início, fase de enchimento rápido, sobrecarga de volume, choque do sangue chegando no ventrículo. B4 = diástole final, contração atrial, sobrecarga pressórica, ventrículo hipertrofiado\".</p></div>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"b3b4-coracao\" alt=\"\"><figcaption>B3: enchimento rápido num ventrículo dilatado (volume). B4: contração atrial contra um ventrículo hipertrofiado e rígido (pressão).</figcaption></figure>\n<div class=\"pearl\"><b>Pérola de prova</b><p>As duas questões \"aponte a localização no ciclo\" caíram com o mesmo enunciado, uma para cada bulha. B3: <b>\"na diástole, na fase de enchimento rápido\"</b>. B4: <b>\"na fase pré-sistólica, coincidente com a contração atrial\"</b>.</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Truque para lembrar: B<b>3</b> vem logo depois de B2 (2 → 3); B<b>4</b> vem logo antes de B1 do ciclo seguinte, colada nela. B4 = \"A\" de átrio: depende do átrio contrair.</p></div>","qs":{"p":[{"enun":"Idoso hipertenso com HVE no ecocardiograma. Na ausculta do foco mitral com a campânula, há um som grave imediatamente antes de B1.","cmd":"Qual é o som e o que indica?","alts":["B3; sobrecarga de volume com ventrículo dilatado","B4; sobrecarga de pressão com ventrículo rígido","Clique de ejeção; estenose aórtica","Estalido de abertura; estenose mitral"],"gab":1,"com":["B3 vem logo após B2.","Correta. Pré-sistólica, contração atrial contra VE hipertrofiado.","O clique de ejeção vem logo após B1.","O estalido vem logo após B2, na diástole."],"imgs":[]},{"enun":"Paciente com B4 audível evolui para fibrilação atrial. O que se espera da B4?","cmd":"Assinale a alternativa correta.","alts":["Passa a ser ouvida na sístole","Desaparece, pois depende da contração atrial","Transforma-se em B3","Fica mais intensa, pela frequência alta"],"gab":1,"com":["B4 é sempre diastólica.","Correta. Sem sístole atrial eficaz, não há B4.","B3 tem outro mecanismo.","Sem contração atrial, não há B4."],"imgs":[]},{"enun":"Gestante de 32 semanas, saudável, tem um som grave logo após B2 no foco mitral.","cmd":"Qual a interpretação mais provável?","alts":["Desdobramento fixo de B2 por CIA","B3 fisiológica, por aumento do volume circulante","B4 patológica, por hipertrofia ventricular","B3 sempre patológica, indicando IC"],"gab":1,"com":["Desdobramento de B2 é agudo e nos focos da base.","Correta. Na gestação há sobrecarga de volume fisiológica.","B4 vem antes de B1, não depois de B2.","B3 pode ser fisiológica em gestantes, crianças e jovens."],"imgs":[]}]},"pv":["S81.3","S81.17","S78.1"]},{"id":"s3","titulo":"Ritmo tríplice × ritmo de galope","html":"\n<p class=\"lead\">Quando há B3 ou B4, o ritmo fica em três tempos: <b>ritmo tríplice</b>. Se, além disso, vem com taquicardia e sinais de sofrimento do miocárdio, é <b>ritmo de galope</b>.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"galopes\" alt=\"\"><figcaption>Ritmo de galope ventricular (por B3) e atrial (por B4): som semelhante ao trote de um cavalo, com taquicardia e disfunção do miocárdio.</figcaption></figure>\n<table class=\"cmp\"><tr><th></th><th>Ritmo tríplice</th><th>Ritmo de galope</th></tr>\n<tr><td>O que é</td><td>Ritmo em três tempos por B3 ou B4</td><td>Ritmo tríplice em paciente com sofrimento miocárdico</td></tr>\n<tr><td>Pode ser normal?</td><td><mark class=\"f4\" data-refs=\"S79.17,S78.25,S79.19,S80.1,S82.5\">Sim: B3 e B4 podem ser fisiológicas</mark></td><td><mark class=\"f1\" data-refs=\"S79.17\"><b>Nunca</b>: é sempre patológico</mark></td></tr>\n<tr><td>Contexto</td><td>Crianças, jovens, gestantes (B3)</td><td>IC descompensada, IAM, miocardite: \"pedido de socorro\" do coração</td></tr></table>\n<h3>Galope ventricular × atrial</h3>\n<table class=\"cmp\"><tr><th>Tipo</th><th>Bulha</th><th>Sobrecarga</th></tr>\n<tr><td><mark class=\"f4\" data-refs=\"S78.25,S79.19,S80.1,S82.5\">Galope ventricular (protodiastólico)</mark></td><td>B3</td><td>Volume</td></tr>\n<tr><td><mark class=\"f4\" data-refs=\"S78.22,S79.18,S80.12,S82.31\">Galope atrial (pré-sistólico)</mark></td><td>B4</td><td>Pressão; some na fibrilação atrial</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Ritmo de galope = sempre patológico.\"</p></div>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Na estenose aórtica grave com HVE, o galope por B4 é <b>atrial</b> e tende a desaparecer se o paciente entrar em FA. A questão cobrou as duas coisas juntas.</p></div>","qs":{"p":[{"enun":"Paciente com IC descompensada, FC 118 bpm, dispneia e crepitações. A ausculta mostra três tempos com um som grave logo após B2.","cmd":"Qual a interpretação?","alts":["Desdobramento invertido de B2 por bloqueio de ramo","Galope ventricular por B3, sofrimento miocárdico","Galope atrial por B4, com contração atrial vigorosa","Ritmo tríplice fisiológico por B3, comum no jovem"],"gab":1,"com":["Desdobramento é de B2, nos focos da base.","Correta. Ritmo tríplice por B3 com descompensação = galope ventricular.","B4 vem antes de B1.","No contexto de IC descompensada não é fisiológico."],"imgs":[]},{"enun":"Sobre o ritmo de galope, assinale a correta.","cmd":"Assinale a alternativa correta.","alts":["É patológico e indica sofrimento do miocárdio","É sempre causado pela quarta bulha atrial","Pode ser fisiológico em gestantes e crianças","Só ocorre nas valvopatias com sopro associado"],"gab":0,"com":["Correta.","O galope ventricular é por B3.","O ritmo tríplice pode ser fisiológico; o galope, não.","Ocorre em IC, IAM, miocardite."],"imgs":[]},{"enun":"Criança de 10 anos, saudável, com ritmo em três tempos por B3, sem taquicardia ou sinais de doença.","cmd":"Como classificar?","alts":["Ritmo de galope atrial por B4","Desdobramento fisiológico de B2","Ritmo tríplice, possivelmente fisiológico","Ritmo de galope ventricular por B3"],"gab":2,"com":["O galope atrial é por B4.","O desdobramento é de B2.","Correta. B3 pode ser fisiológica em crianças e jovens.","Galope exige sofrimento miocárdico."],"imgs":[]}]},"pv":["S80.1","S80.12","S79.17"]}],"quiz":[{"enun":"Desdobramento de B2 que aumenta na inspiração e persiste na expiração sugere:","cmd":"Assinale a alternativa correta.","alts":["CIA","BRE","Normalidade","BRD"],"gab":3,"com":["CIA: fixo.","BRE: invertido.","O fisiológico some na expiração.","Correta."],"imgs":[]},{"enun":"No desdobramento invertido de B2:","cmd":"Assinale a alternativa correta.","alts":["A2 e P2 ficam sempre separados igualmente","P2 vem muito depois de A2","A2 vem depois de P2","B2 se desdobra só na inspiração"],"gab":2,"com":["É a CIA.","É o BRD.","Correta.","É o fisiológico."],"imgs":[]},{"enun":"A B3 ocorre:","cmd":"Assinale a alternativa correta.","alts":["Coincidente com B1","No início da diástole, no enchimento rápido","No meio da sístole","No fim da diástole, com a contração atrial"],"gab":1,"com":["B3 vem depois de B2.","Correta.","B3 é diastólica.","É a B4."],"imgs":[]},{"enun":"B4 indica sobrecarga de:","cmd":"Assinale a alternativa correta.","alts":["Retorno venoso","Volume","Fluxo pulmonar","Pressão"],"gab":3,"com":["Não é a definição.","Volume é B3.","Não é a definição.","Correta."],"imgs":[]},{"enun":"B4 não existe na:","cmd":"Assinale a alternativa correta.","alts":["Cardiomiopatia hipertrófica","Estenose aórtica","Hipertensão arterial","Fibrilação atrial"],"gab":3,"com":["Na CMH pode haver B4.","Na EAo pode haver B4.","Na HAS a B4 é comum.","Correta."],"imgs":[]},{"enun":"Na CIA, o desdobramento de B2 é:","cmd":"Assinale a alternativa correta.","alts":["Persistente e fixo","Só inspiratório","Persistente não fixo","Invertido"],"gab":0,"com":["Correta.","É o fisiológico.","É o BRD.","É o BRE."],"imgs":[]},{"enun":"O galope ventricular é causado por:","cmd":"Assinale a alternativa correta.","alts":["Estalido de abertura","Clique sistólico","B3","B4"],"gab":2,"com":["O estalido é da estenose mitral.","O clique é de prolapso ou ejeção.","Correta.","B4 é galope atrial."],"imgs":[]},{"enun":"No BRD pode haver desdobramento de:","cmd":"Assinale a alternativa correta.","alts":["Apenas B1","Apenas B4","B1 e B2","Nenhuma bulha"],"gab":2,"com":["B2 também desdobra.","B4 não desdobra.","Correta. Tricúspide e pulmonar atrasam.","O BRD desdobra bulhas."],"imgs":[]}],"widgets":[{"id":"desd","titulo":"Qual desdobramento?","desc":"Associe a descrição à causa.","cats":[["fis","Fisiológico"],["brd","BRD (persistente não fixo)"],["cia","CIA (fixo)"],["bre","BRE (invertido)"]],"cards":[["Só na inspiração","fis"],["Nas duas fases, maior na inspiração","brd"],["Nas duas fases, igual","cia"],["Só na expiração","bre"],["A2 depois de P2","bre"],["Jovem saudável","fis"],["B1 e B2 desdobradas","brd"],["Átrios comunicados","cia"]]},{"id":"b34","titulo":"B3 ou B4?","desc":"Classifique cada característica.","cats":[["b3","B3"],["b4","B4"]],"cards":[["Enchimento rápido","b3"],["Contração atrial","b4"],["Sobrecarga de volume","b3"],["Sobrecarga de pressão","b4"],["Pode ser fisiológica na gestação","b3"],["Some na fibrilação atrial","b4"],["Galope ventricular","b3"],["Galope atrial","b4"],["Logo após B2","b3"],["Logo antes de B1","b4"]]}],"gl":[["Desdobramento fisiológico","B2 desdobrada só na inspiração.",1],["Persistente não fixo","Nas duas fases, maior na inspiração: BRD.",1],["Persistente fixo","Nas duas fases, igual: CIA.",1],["Desdobramento invertido (paradoxal)","Só na expiração, A2 após P2: BRE.",1],["B3","Protodiastólica, enchimento rápido, volume.",2],["B4","Pré-sistólica, contração atrial, pressão.",2],["Ritmo tríplice","Três tempos por B3 ou B4.",3],["Ritmo de galope","Ritmo tríplice com sofrimento miocárdico; sempre patológico.",3]],"vf":[["O desdobramento invertido é persistente, maior na expiração.",false,"Some na inspiração."],["O BRE é causa de desdobramento invertido.",true,"A2 atrasa."],["B4 indica sobrecarga de volume.",false,"Indica sobrecarga de pressão."],["B3 pode ser fisiológica em gestantes.",true,"Volume aumentado."],["O galope é sempre patológico.",true,"Pedido de socorro do miocárdio."],["Na CIA o desdobramento varia com a respiração.",false,"É fixo."]],"check":["Explicar o efeito da inspiração sobre P2","Associar fisiológico, BRD, CIA e BRE ao desdobramento","Resolver a questão das assertivas do desdobramento invertido","Localizar B3 e B4 no ciclo e dizer a sobrecarga de cada","Explicar por que B4 some na FA","Diferenciar ritmo tríplice de galope"],"resumo":[["Segmento 1","Fisiológico: só inspiração. BRD: persistente não fixo (B1 e B2). CIA: persistente fixo. BRE: invertido, só na expiração."],["Segmento 2","B3: início da diástole, enchimento rápido, volume, pode ser fisiológica. B4: pré-sistólica, contração atrial, pressão, some na FA."],["Segmento 3","Ritmo tríplice pode ser fisiológico; galope é sempre patológico. Galope ventricular = B3; atrial = B4."]],"freq":[["B3: início da diástole, enchimento rápido, sobrecarga de volume",6,"S77.19, S78.12, S79.31, S81.3, S82.12, EDS.8"],["Desdobramento invertido de B2: expiração e BRE",6,"S77.5, S78.29, S79.23, S81.26, S82.15, EDS.10"],["B3: galope ventricular; pode ser fisiológica na gestação",4,"S78.25, S79.19, S80.1, S82.5"],["B4 na estenose aórtica: galope atrial; some na fibrilação atrial",4,"S78.22, S79.18, S80.12, S82.31"],["BRD: desdobramento de B1 e B2 persistente e variável",3,"S77.2, S80.10, S81.7"],["B4 é pré-sistólica: coincide com a contração atrial",3,"S79.10, S81.17, EDS.7"],["B4: final da diástole, sístole atrial, sobrecarga de pressão",3,"S77.20, S78.1, S82.1"],["B3/B4 podem ser fisiológicas; galope é \"pedido de socorro\"",1,"S79.17"],["BRE: desdobramento invertido (P2 antes de A2)",1,"S80.2"],["CIA: desdobramento persistente e fixo de B2",1,"S80.15"],["Os 4 desdobramentos: BRD, BRE, fisiológico e CIA",1,"S79.15"]],"cob":{"rk":{"t":"Desdobramento de B2","c":["O que atrasa","Em que fase aparece","Varia com a respiração?","Causa"],"d":["<b>O que atrasa</b>: P2 (inspiração, BRD, CIA) ou A2 (BRE).","<b>Em que fase aparece</b>: inspiração, as duas, ou só expiração.","<b>Varia?</b> Fisiológico e BRD variam; CIA não varia; invertido aparece na expiração e some na inspiração.","<b>Causa</b>: normal, BRD, CIA ou BRE."],"x":[["P2, só na inspiração","inspiração","sim","fisiológico"],["P2 sempre, mais na inspiração","as duas","sim","BRD"],["P2 sempre, igual","as duas","não","CIA"],["A2","só expiração","some na inspiração","BRE"]],"ex":"B3 = enchimento rápido, volume. B4 = contração atrial, pressão, some na FA.","b":"Ritmo tríplice pode ser fisiológico; galope é sempre patológico."},"figs":[["desdobramentos","Os quatro desdobramentos nas duas fases da respiração.","s1"],["b3b4-linha","Onde ficam B3 e B4 no ciclo.","s2"],["galopes","Galope ventricular (B3) e atrial (B4).","s3"]],"keys":["C18","C4","C34","C31","C1","C42","C19","C44","C47","C50","C43"]}},{"id":"a7","num":7,"nome":"Sopros e pericárdio","tema":"Como descrever um sopro, valvopatias (EAo, IAo, EMt, IMt, tricúspide e pulmonar), manobra de Rivero-Carvallo, pericardite e derrame pericárdico","segs":[{"id":"s1","titulo":"O que é um sopro e como descrevê-lo","html":"\n<p class=\"lead\">Sopro é o som produzido pelo <b>fluxo turbulento</b> do sangue: por uma valva estreitada (estenose), por uma valva que não fecha (insuficiência), por uma comunicação anormal ou por um fluxo muito aumentado.</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-est-insuf\" alt=\"\"><figcaption>Estenose × insuficiência: na estenose a valva não abre direito e o sangue passa por um orifício estreito no momento em que deveria passar livre; na insuficiência a valva não fecha e o sangue volta no momento em que deveria estar contido.</figcaption></figure>\n<h3>A regra de ouro para saber a fase do sopro</h3>\n<p>Pergunte: <b>em que fase essa valva deveria estar aberta, e em que fase deveria estar fechada?</b></p>\n<table class=\"cmp\"><tr><th></th><th>Na sístole</th><th>Na diástole</th></tr>\n<tr><td>Valvas semilunares (aórtica e pulmonar)</td><td>Abertas → <b>estenose</b> dá sopro sistólico</td><td>Fechadas → <b>insuficiência</b> dá sopro diastólico</td></tr>\n<tr><td>Valvas AV (mitral e tricúspide)</td><td>Fechadas → <b>insuficiência</b> dá sopro sistólico</td><td>Abertas → <b>estenose</b> dá sopro diastólico</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Sistólicos: EAo, EP, IMt, IT. Diastólicos: IAo, IP, EMt, ET. Basta lembrar que estenose e insuficiência da mesma valva ficam em fases opostas.</p></div>\n<h3>As características que descrevem um sopro</h3>\n<ol class=\"steps\"><li><b>Situação no ciclo</b>: sistólico, diastólico ou contínuo; proto, meso, tele ou holo.</li><li><b>Local de maior intensidade</b>: o foco.</li><li><b>Irradiação</b>: para o pescoço (carótidas) na EAo, para a axila na IMt.</li><li><b>Intensidade</b>: em cruzes (+ a 6+); a partir de 4+ há frêmito palpável.</li><li><b>Timbre e tonalidade</b>: rude, aspirativo, em ruflar, piante.</li><li><b>Forma</b>: em diamante (crescendo-decrescendo, ejetivo), em platô (regurgitação), decrescente.</li><li><b>Modificação com manobras</b>: respiração (Rivero-Carvallo), posição, exercício.</li></ol>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Sopro de fluxo inocente: suave, sistólico, curto, sem frêmito, em crianças, gestantes, febre e anemia. Todo sopro diastólico é patológico.</p></div>","qs":{"p":[{"enun":"Na revisão, o aluno precisa separar sopros sistólicos de diastólicos.","cmd":"Qual lesão produz sopro sistólico?","alts":["Estenose mitral","Estenose tricúspide","Insuficiência mitral","Insuficiência aórtica"],"gab":2,"com":["A estenose mitral dá sopro diastólico (ruflar).","A estenose tricúspide dá sopro diastólico.","Correta. A mitral deveria estar fechada na sístole; o sangue reflui para o átrio.","A insuficiência aórtica dá sopro diastólico."],"imgs":[]},{"enun":"Sopro com intensidade 4+/6+ no foco aórtico.","cmd":"O que se espera encontrar na palpação?","alts":["Ictus impalpável","Frêmito palpável","Retração sistólica apical","Atrito pericárdico"],"gab":1,"com":["O ictus não some pela intensidade do sopro.","Correta. A partir de 4+ o sopro é acompanhado de frêmito.","A retração apical é da HVD.","Atrito é outro achado, do pericárdio."],"imgs":[]},{"enun":"Gestante de 28 semanas tem sopro sistólico suave, 1+/6+, curto, sem frêmito, no foco pulmonar.","cmd":"Qual a interpretação mais provável?","alts":["Estenose pulmonar grave com gradiente alto","Sopro de fluxo inocente, pelo débito alto","Insuficiência pulmonar por dilatação do anel","Sopro diastólico patológico de regurgitação"],"gab":1,"com":["A estenose grave daria sopro rude, intenso e com frêmito.","Correta.","A insuficiência pulmonar é diastólica.","O sopro descrito é sistólico."],"imgs":[]}]},"pv":[]},{"id":"s2","titulo":"As valvopatias e seus sopros","html":"\n<p class=\"lead\">Cada valvopatia tem um sopro típico, um foco, uma irradiação e sinais associados. As somativas cobraram sobretudo a estenose aórtica, a insuficiência mitral e a estenose mitral.</p>\n<h3>Estenose aórtica</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-eao\" alt=\"\"><figcaption>Estenose aórtica: sopro sistólico ejetivo, em diamante, rude, no foco aórtico, irradiado para as carótidas.</figcaption></figure>\n<p><mark class=\"f5\" data-refs=\"S78.6,S80.18,S81.13,S82.22,EDS.14\">Sopro <b>sistólico ejetivo</b> (mesossistólico, em crescendo-decrescendo), rude, no <b>foco aórtico</b>, irradiado para o pescoço</mark>. O VE vence a obstrução com <b>hipertrofia concêntrica</b>.</p>\n<table class=\"cmp\"><tr><th>Sintoma ou sinal</th><th>Mecanismo</th></tr>\n<tr><td><mark class=\"f5\" data-refs=\"S78.6,S80.18,S81.13,S82.22,EDS.14\">Angina</mark></td><td>VE hipertrofiado precisa de mais O<sub>2</sub>, e a perfusão coronariana cai</td></tr>\n<tr><td><mark class=\"f5\" data-refs=\"S78.6,S80.18,S81.13,S82.22,EDS.14\">Síncope, pré-síncope, escurecimento visual aos esforços</mark></td><td>Débito fixo: não sobe com a demanda</td></tr>\n<tr><td>Dispneia</td><td>Disfunção diastólica do VE rígido</td></tr>\n<tr><td><mark class=\"f5\" data-refs=\"S78.6,S80.18,S81.13,S82.22,EDS.14\">Ictus propulsivo</mark></td><td>Hipertrofia do VE</td></tr>\n<tr><td>Pulso <i>parvus et tardus</i></td><td>Ejeção lenta e pequena</td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A questão das assertivas da estenose aórtica caiu em várias somativas com a mesma pegadinha: o sopro é <b>sistólico</b> ejetivo; a assertiva \"sopro <b>diastólico</b> ejetivo no foco aórtico\" está errada. Angina, pré-síncope e ictus propulsivo estão certos.</p></div>\n<h3>Insuficiência aórtica</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-iao\" alt=\"\"><figcaption>Insuficiência aórtica: sopro diastólico aspirativo, decrescente, no foco aórtico acessório, melhor com o paciente sentado e inclinado para frente.</figcaption></figure>\n<p>Sopro <b>diastólico</b>, aspirativo, em decrescendo, no foco aórtico acessório (Erb). Grande volume sistólico com pressão diastólica baixa: <b>pulso em martelo d'água</b> (Corrigan), PA divergente.</p>\n<h3>Estenose mitral</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-emt\" alt=\"\"><figcaption>Estenose mitral: B1 hiperfonética, estalido de abertura da mitral e ruflar diastólico no foco mitral, em decúbito lateral esquerdo com a campânula.</figcaption></figure>\n<p><mark class=\"f1\" data-refs=\"S80.28\">O sopro é <b>diastólico</b>: a mitral deveria estar aberta na diástole</mark>. Tríade: <b>B1 hiperfonética</b> (valva não calcificada), <b>estalido de abertura</b> logo após B2 e <b>ruflar diastólico</b> com reforço pré-sistólico (some na FA). Causa típica: febre reumática.</p>\n<h3>Insuficiência mitral</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-imt\" alt=\"\"><figcaption>Insuficiência mitral: sopro holossistólico, em platô, no foco mitral, irradiado para a axila.</figcaption></figure>\n<p><mark class=\"f2\" data-refs=\"S78.27,S82.11\">Sopro <b>sistólico</b>, porque o VE reflui sangue para o átrio esquerdo durante a sístole</mark>: holossistólico, em platô, no foco mitral, irradiado para a <b>axila</b>. Pode haver B3 (sobrecarga de volume). Causas: prolapso, isquemia, dilatação do VE.</p>\n<h3>Lado direito</h3>\n<table class=\"cmp\"><tr><th>Lesão</th><th>Sopro</th><th>Foco</th></tr>\n<tr><td>Insuficiência tricúspide</td><td>Holossistólico, aumenta na inspiração (Rivero-Carvallo)</td><td>Tricúspide</td></tr>\n<tr><td>Estenose tricúspide</td><td>Diastólico em ruflar</td><td>Tricúspide</td></tr>\n<tr><td>Estenose pulmonar</td><td>Sistólico ejetivo</td><td>Pulmonar</td></tr>\n<tr><td>Insuficiência pulmonar</td><td>Diastólico (Graham Steell, na hipertensão pulmonar)</td><td>Pulmonar</td></tr></table>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-tricuspide\" alt=\"\"><figcaption>Sopros tricúspides.</figcaption></figure>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopro-pulmonar\" alt=\"\"><figcaption>Sopros pulmonares.</figcaption></figure>","qs":{"p":[{"enun":"Idoso de 80 anos com angina aos esforços, episódios de escurecimento visual ao subir escadas e sopro sistólico rude no 2º EIC direito, irradiado para o pescoço.","cmd":"Qual o diagnóstico mais provável?","alts":["Estenose mitral","Insuficiência aórtica","Insuficiência tricúspide","Estenose aórtica"],"gab":3,"com":["A EMt dá ruflar diastólico no foco mitral.","A IAo dá sopro diastólico.","A IT é no foco tricúspide e aumenta na inspiração.","Correta. Tríade angina, síncope, dispneia + sopro sistólico ejetivo no foco aórtico."],"imgs":["q-sopro-eao"]},{"enun":"Mulher de 35 anos com história de febre reumática na infância, dispneia progressiva. B1 hiperfonética, estalido logo após B2 e ruflar diastólico no foco mitral.","cmd":"Qual a lesão?","alts":["Estenose mitral","Comunicação interatrial","Insuficiência mitral","Estenose aórtica"],"gab":0,"com":["Correta.","A CIA dá desdobramento fixo de B2.","A IMt dá sopro holossistólico irradiado para a axila.","A EAo dá sopro sistólico no foco aórtico."],"imgs":["q-sopro-emt"]},{"enun":"Paciente com pulso amplo e de queda rápida, PA 160/40 mmHg e sopro diastólico aspirativo no 3º EIC esquerdo.","cmd":"Qual o diagnóstico?","alts":["Estenose pulmonar","Insuficiência mitral","Insuficiência aórtica","Estenose aórtica"],"gab":2,"com":["Sopro sistólico no foco pulmonar.","Sopro sistólico na ponta.","Correta. Pulso em martelo d'água e PA divergente.","Daria pulso parvus et tardus e sopro sistólico."],"imgs":[]}]},"pv":["S81.13","S80.28","S78.27"]},{"id":"s3","titulo":"Manobra de Rivero-Carvallo e outros sinais","html":"\n<p class=\"lead\">A manobra de Rivero-Carvallo separa um sopro do lado direito (tricúspide) de um sopro do lado esquerdo (mitral) usando a respiração.</p>\n<ol class=\"steps\"><li>Ausculta no <b>foco tricúspide</b>.</li><li>Paciente faz <b>inspiração profunda</b> e segura (apneia).</li><li><mark class=\"f5\" data-refs=\"S77.4,S78.14,S79.30,S81.4,S80.30,S82.20,EDS.9\">Se o sopro <b>sistólico aumenta</b>, ele vem da tricúspide: <b>insuficiência tricúspide</b></mark>.</li></ol>\n<p><b>Por quê?</b> <mark class=\"f1\" data-refs=\"S80.30\">A inspiração deixa a pressão intratorácica mais negativa, aumenta o retorno venoso e o fluxo pelo coração direito, que passa pela valva lesada</mark>. O coração esquerdo não ganha esse volume na hora, então o sopro mitral não aumenta.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Rivero-Carvallo = <b>foco tricúspide</b> + <b>insuficiência tricúspide</b> + <b>sopro sistólico</b> que aumenta na inspiração. Caiu nesse formato de \"três informações corretas\".</p></div>\n<h3>Epônimos de sopros e sinais</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"sopros-eponimos\" alt=\"\"><figcaption>Epônimos ligados às valvopatias.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Epônimo</th><th>O que é</th></tr>\n<tr><td>Austin Flint</td><td>Ruflar diastólico na ponta na insuficiência aórtica grave (o jato regurgitante limita a abertura da mitral)</td></tr>\n<tr><td>Graham Steell</td><td>Sopro diastólico da insuficiência pulmonar por hipertensão pulmonar</td></tr>\n<tr><td>Corrigan</td><td>Pulso em martelo d'água da insuficiência aórtica</td></tr>\n<tr><td>Musset</td><td>Balanço da cabeça a cada batimento (IAo)</td></tr>\n<tr><td>Quincke</td><td>Pulsação capilar no leito ungueal (IAo)</td></tr>\n<tr><td>Gallavardin</td><td>Sopro da EAo que parece musical na ponta</td></tr></table>","qs":{"p":[{"enun":"Durante a manobra de Rivero-Carvallo, o sopro sistólico do foco tricúspide aumenta com a inspiração profunda.","cmd":"Qual a conclusão?","alts":["O sopro é inocente e deve ser ignorado","O sopro é de estenose aórtica","O sopro é de insuficiência tricúspide","O sopro é de insuficiência mitral"],"gab":2,"com":["O aumento inspiratório indica origem direita, não inocência.","A EAo é ouvida no foco aórtico e não aumenta na inspiração.","Correta.","O sopro mitral não aumenta na inspiração."],"imgs":[]},{"enun":"Qual a base fisiológica da manobra de Rivero-Carvallo?","cmd":"Assinale a alternativa correta.","alts":["A inspiração reduz o fluxo pela tricúspide","A apneia aumenta a pressão na aorta","A expiração aumenta o retorno venoso ao coração esquerdo","A inspiração aumenta o retorno venoso ao coração direito"],"gab":3,"com":["Ela aumenta o fluxo.","A apneia é só para manter a inspiração.","É a inspiração, e o efeito é no lado direito.","Correta."],"imgs":[]},{"enun":"Paciente com insuficiência aórtica grave tem, no foco mitral, um ruflar diastólico sem estenose mitral.","cmd":"Como se chama esse sopro?","alts":["Austin Flint","Graham Steell","Gallavardin","Carey Coombs"],"gab":0,"com":["Correta.","É da insuficiência pulmonar.","É da estenose aórtica.","É da cardite reumática aguda."],"imgs":[]}]},"pv":["S81.4","S80.30"]},{"id":"s4","titulo":"Pericardite e derrame pericárdico","html":"\n<p class=\"lead\">O pericárdio inflamado produz dor e atrito; o pericárdio cheio de líquido abafa o coração e pode comprimi-lo (tamponamento).</p>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"pericardite\" alt=\"\"><figcaption>Pericardite: dor torácica que piora ao deitar e alivia ao sentar inclinado para frente (posição de prece maometana); atrito pericárdico na ausculta.</figcaption></figure>\n<h3>Pericardite aguda</h3>\n<ul><li><b>Dor</b>: retroesternal, em pontada, piora com a inspiração e o decúbito dorsal, <b>alivia sentado e inclinado para frente</b> (prece maometana).</li><li><b>Atrito pericárdico</b>: som áspero, \"couro novo\", sistólico e diastólico, mais audível com o paciente inclinado para frente e com o diafragma pressionado. Não muda com a tosse.</li><li>O atrito <b>diminui ou some quando o derrame se instala</b>, pois o líquido afasta os folhetos.</li></ul>\n<h3>Derrame pericárdico e tamponamento</h3>\n<figure class=\"fig\"><img loading=lazy decoding=async data-img=\"derrame-pericardico\" alt=\"\"><figcaption>Derrame pericárdico: bulhas abafadas, ictus impalpável e, no tamponamento, a tríade de Beck.</figcaption></figure>\n<table class=\"cmp\"><tr><th>Achado</th><th>Por quê</th></tr>\n<tr><td>Bulhas hipofonéticas, ictus impalpável</td><td>O líquido afasta o coração da parede</td></tr>\n<tr><td><b>Tríade de Beck</b>: hipotensão, <b>hipofonese de bulhas</b>, turgência jugular</td><td>Compressão do coração (tamponamento)</td></tr>\n<tr><td>Pulso paradoxal (queda > 10 mmHg da PAS na inspiração)</td><td>Na inspiração, o VD cheio empurra o septo e o VE enche menos</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>O material da aula cita a tríade de Beck como hipotensão, hipofonese de bulhas e pulso paradoxal > 10 mmHg. Na literatura clássica, o terceiro item é a <b>turgência jugular</b>; o pulso paradoxal é achado associado. Saiba os dois.</p></div>","qs":{"p":[{"enun":"Homem de 30 anos, com quadro viral há uma semana, tem dor torácica que piora ao deitar e melhora sentado e inclinado para frente. Na ausculta, som áspero nas duas fases do ciclo.","cmd":"Qual o diagnóstico?","alts":["Pericardite aguda com atrito","Pneumotórax espontâneo pós-viral","Infarto agudo do miocárdio inferior","Dissecção aguda da aorta ascendente"],"gab":0,"com":["Correta.","O pneumotórax não dá atrito pericárdico.","A dor isquêmica não muda com a posição.","A dissecção é súbita, rasgante, para o dorso."],"imgs":["pericardite"]},{"enun":"Paciente com pericardite e atrito evolui com derrame pericárdico volumoso.","cmd":"O que se espera do atrito?","alts":["Diminuir ou desaparecer, pelo afastamento dos folhetos","Ficar mais intenso, pois o líquido conduz melhor o som","Passar a ser só diastólico, no enchimento ventricular","Passar a variar com a tosse, como os estertores"],"gab":0,"com":["Correta.","O líquido separa os folhetos.","O atrito não muda de fase pelo derrame.","O atrito não muda com a tosse."],"imgs":[]},{"enun":"Paciente hipotenso, com bulhas muito abafadas e turgência jugular após trauma torácico.","cmd":"Qual a hipótese principal?","alts":["Insuficiência aórtica aguda traumática","Estenose mitral com baixo débito","Pneumonia lobar com sepse grave","Tamponamento cardíaco (tríade de Beck)"],"gab":3,"com":["A IAo dá sopro diastólico e PA divergente.","Não explica o quadro agudo.","Não explica a hipofonese e a turgência.","Correta."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"A estenose aórtica produz sopro:","cmd":"Assinale a alternativa correta.","alts":["Diastólico no foco mitral","Diastólico ejetivo no foco aórtico","Sistólico ejetivo no foco aórtico","Holossistólico na axila"],"gab":2,"com":["É a EMt.","A pegadinha: é sistólico.","Correta.","É a IMt."],"imgs":[]},{"enun":"O sopro da insuficiência mitral irradia para:","cmd":"Assinale a alternativa correta.","alts":["Epigástrio","Dorso","Axila","Pescoço"],"gab":2,"com":["Não é a irradiação típica.","Não é a irradiação típica.","Correta.","EAo."],"imgs":[]},{"enun":"Estalido de abertura logo após B2 sugere:","cmd":"Assinale a alternativa correta.","alts":["Pericardite","Estenose mitral","Insuficiência tricúspide","Estenose aórtica"],"gab":1,"com":["Pericardite dá atrito.","Correta.","IT não tem estalido.","EAo pode ter clique de ejeção, após B1."],"imgs":[]},{"enun":"Pulso em martelo d'água é típico de:","cmd":"Assinale a alternativa correta.","alts":["Estenose mitral","Insuficiência aórtica","Tamponamento","Estenose aórtica"],"gab":1,"com":["EMt não muda o pulso assim.","Correta.","Tamponamento dá pulso paradoxal.","EAo dá parvus et tardus."],"imgs":[]},{"enun":"Sopro que aumenta na inspiração no foco tricúspide:","cmd":"Assinale a alternativa correta.","alts":["Insuficiência tricúspide","Comunicação interventricular","Insuficiência mitral","Estenose aórtica"],"gab":0,"com":["Correta.","Não aumenta com a inspiração.","Não aumenta na inspiração.","Foco aórtico."],"imgs":[]},{"enun":"A pericardite melhora com o paciente:","cmd":"Assinale a alternativa correta.","alts":["Sentado e inclinado para frente","Em decúbito lateral esquerdo","Deitado de costas","Em Trendelenburg"],"gab":0,"com":["Correta.","Não é a posição de alívio.","Piora deitado.","Não é a posição de alívio."],"imgs":[]},{"enun":"A partir de que intensidade o sopro tem frêmito?","cmd":"Assinale a alternativa correta.","alts":["2+/6+","Só em 6+/6+","1+/6+","4+/6+"],"gab":3,"com":["Ainda sem frêmito.","O frêmito já aparece em 4+.","Muito suave.","Correta."],"imgs":[]},{"enun":"Sopro diastólico é:","cmd":"Assinale a alternativa correta.","alts":["Inocente em crianças","Sempre patológico","Sempre inocente","Inocente em gestantes"],"gab":1,"com":["Os inocentes são sistólicos.","Correta.","Os inocentes são sistólicos.","Os inocentes são sistólicos."],"imgs":[]}],"widgets":[{"id":"sopro","titulo":"Sístole ou diástole?","desc":"Classifique o sopro de cada lesão.","cats":[["sis","Sistólico"],["dia","Diastólico"]],"cards":[["Estenose aórtica","sis"],["Insuficiência aórtica","dia"],["Estenose mitral","dia"],["Insuficiência mitral","sis"],["Insuficiência tricúspide","sis"],["Estenose tricúspide","dia"],["Estenose pulmonar","sis"],["Insuficiência pulmonar","dia"],["Sopro de Austin Flint","dia"],["Sopro de fluxo da gestante","sis"]]}],"gl":[["Sopro","Som do fluxo turbulento do sangue.",1],["Frêmito","Sopro palpável, a partir de 4+.",1],["Sopro ejetivo","Em diamante, crescendo-decrescendo (EAo, EP).",2],["Ruflar","Sopro diastólico grave da estenose mitral.",2],["Estalido de abertura","Som logo após B2 na estenose mitral.",2],["Rivero-Carvallo","Sopro tricúspide que aumenta na inspiração.",3],["Austin Flint","Ruflar na ponta na IAo grave.",3],["Atrito pericárdico","Som áspero sistólico e diastólico da pericardite.",4],["Tríade de Beck","Hipotensão, hipofonese de bulhas, turgência jugular.",4]],"vf":[["Na estenose aórtica o sopro é diastólico ejetivo.",false,"É sistólico."],["A insuficiência mitral dá sopro sistólico.",true,"Refluxo na sístole."],["A estenose mitral pode cursar com sopro diastólico.",true,"Ruflar diastólico."],["Rivero-Carvallo é feita no foco mitral.",false,"Foco tricúspide."],["O atrito pericárdico aumenta quando o derrame se instala.",false,"Diminui ou some."],["Todo sopro diastólico é patológico.",true,"Os inocentes são sistólicos."]],"check":["Deduzir a fase do sopro pela valva e pela lesão","Descrever um sopro pelas 7 características","Reconhecer EAo, IAo, EMt e IMt pela ausculta","Explicar a manobra de Rivero-Carvallo","Reconhecer pericardite, atrito e tamponamento"],"resumo":[["Segmento 1","Sopro = fluxo turbulento. Semilunares: estenose sistólica, insuficiência diastólica. AV: o contrário. Frêmito a partir de 4+."],["Segmento 2","EAo: sistólico ejetivo, foco aórtico, carótidas, angina/síncope/dispneia, ictus propulsivo. IAo: diastólico, Erb, martelo d'água. EMt: B1 alta, estalido, ruflar. IMt: holossistólico, axila."],["Segmento 3","Rivero-Carvallo: foco tricúspide, inspiração, sopro sistólico aumenta = IT. Austin Flint, Graham Steell, Corrigan."],["Segmento 4","Pericardite: dor melhora inclinado para frente, atrito. Derrame: bulhas abafadas. Tamponamento: Beck."]],"freq":[["Rivero-Carvallo: foco tricúspide, insuficiência tricúspide, sopro sistólico",6,"S77.4, S78.14, S79.30, S81.4, S82.20, EDS.9"],["Estenose aórtica: angina, pré-síncope, ictus propulsivo; sopro é sistólico",5,"S78.6, S80.18, S81.13, S82.22, EDS.14"],["Estenose mitral: o sopro diastólico da lista",1,"S80.28"],["Insuficiência mitral: sopro sistólico por refluxo VE → AE",2,"S78.27, S82.11"],["Por que Rivero-Carvallo aumenta o sopro da IT: retorno venoso",1,"S80.30"]],"cob":{"rk":{"t":"Valva × fase × lesão","c":["Valva","Fase em que deveria estar aberta","Lesão","Sopro"],"d":["<b>Valva</b>: semilunar (aórtica, pulmonar) ou AV (mitral, tricúspide).","<b>Fase</b>: semilunares abrem na sístole; AV abrem na diástole.","<b>Lesão</b>: estenose atrapalha a fase aberta; insuficiência atrapalha a fase fechada.","<b>Sopro</b>: cai na fase atrapalhada."],"x":[["Aórtica","sístole","estenose","sistólico ejetivo"],["Aórtica","sístole","insuficiência","diastólico"],["Mitral","diástole","estenose","diastólico (ruflar)"],["Mitral","diástole","insuficiência","sistólico (holo, axila)"]],"ex":"EAo: sopro sistólico ejetivo no foco aórtico; a assertiva \"diastólico ejetivo\" é a pegadinha.","b":"Rivero-Carvallo: foco tricúspide + insuficiência tricúspide + sopro sistólico que aumenta na inspiração."},"figs":[["sopro-eao","Estenose aórtica.","s2"],["sopro-emt","Estenose mitral.","s2"],["sopro-imt","Insuficiência mitral.","s2"],["pericardite","Pericardite.","s4"]],"keys":["C3","C23","C54","C35","C55"]}},{"id":"a8","num":8,"nome":"Ritmos, pulsos e pressão arterial","tema":"Frequência cardíaca × frequência de pulso, ritmos (FA, BAVT, extrassístoles), pulso arterial e venoso, aferição da PA","segs":[{"id":"s1","titulo":"Frequência cardíaca × frequência de pulso","html":"\n<p class=\"lead\">O professor cobra a <b>nomenclatura</b>: o nome do achado depende de <b>onde</b> você contou. Esse é um dos temas que mais caem, nas parciais e nas somativas.</p>\n<table class=\"cmp\"><tr><th></th><th>Frequência cardíaca (FC)</th><th>Frequência de pulso (FP)</th></tr>\n<tr><td>Onde se conta</td><td>Na <b>ausculta cardíaca</b> (ou no ictus)</td><td>Na <b>palpação de uma artéria</b> (radial)</td></tr>\n<tr><td>Unidade</td><td><b>bpm</b> (batimentos por minuto)</td><td><b>ppm</b> (pulsações por minuto)</td></tr>\n<tr><td>Normal</td><td><mark class=\"f2\" data-refs=\"S78.28,S79.13\">60 a 100</mark></td><td><mark class=\"f2\" data-refs=\"S78.28,S79.13\">60 a 100</mark></td></tr>\n<tr><td>Abaixo de 60</td><td><mark class=\"f3\" data-refs=\"S80.24,S81.6,P82.12\"><b>Bradicardia</b></mark></td><td><mark class=\"f5\" data-refs=\"S78.20,S79.27,S81.1,P80.14,S82.27,EDS.11\"><b>Bradisfigmia</b></mark></td></tr>\n<tr><td>Acima de 100</td><td><mark class=\"f2\" data-refs=\"S78.28,S79.13\"><b>Taquicardia</b></mark></td><td><mark class=\"f2\" data-refs=\"S78.28,S79.13\"><b>Taquisfigmia</b></mark></td></tr></table>\n<div class=\"pearl\"><b>Pérola de prova</b><p>\"FP 55 ppm\": é <b>incorreto</b> chamar de bradicardia, porque foi aferido no pulso (ppm); o termo é <b>bradisfigmia</b>. \"FC 55 bpm contada pela ausculta\": aí sim, <b>bradicardia</b>, pois o limite inferior é 60 bpm. As duas versões caíram, na parcial e nas somativas.</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Distrator clássico: \"não se pode afirmar bradicardia porque pode haver causa não patológica\". Errado: bradicardia é um <b>dado</b> (FC &lt; 60 bpm), seja qual for a causa; o atleta também está bradicárdico, só que de forma fisiológica.</p></div>\n<h3>Por que FC e FP podem diferir</h3>\n<p>Nem toda contração gera uma onda de pulso palpável: na fibrilação atrial e nas extrassístoles, batimentos com pouco enchimento não chegam ao punho. A diferença entre FC e FP é o <b>déficit de pulso</b> (dissociação pulso-ausculta).</p>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Técnica: conte o pulso radial por 1 minuto inteiro quando o ritmo for irregular. Contar 15 s × 4 só serve para ritmo regular.</p></div>","qs":{"p":[{"enun":"No prontuário: \"FP 112 ppm; FR 18 irpm; PA 120/80 mmHg\".","cmd":"Qual o termo correto para a frequência encontrada?","alts":["Taquicardia","Normosfigmia","Taquipneia","Taquisfigmia"],"gab":3,"com":["Taquicardia é para a contagem na ausculta (bpm).","Acima de 100 não é normal.","Taquipneia é da FR.","Correta. Aferida no pulso (ppm), acima de 100."],"imgs":[]},{"enun":"Paciente com FC de 96 bpm na ausculta e FP de 78 ppm no pulso radial, ritmo irregular.","cmd":"Como se chama essa diferença?","alts":["Bradisfigmia","Pulso alternante","Pulso paradoxal","Déficit de pulso"],"gab":3,"com":["78 ppm não é bradisfigmia.","Pulso alternante é amplitude que alterna.","Pulso paradoxal é queda da PAS na inspiração.","Correta. Típico da fibrilação atrial."],"imgs":[]},{"enun":"Atleta de 25 anos, assintomático, tem FC de 48 bpm na ausculta.","cmd":"Assinale a alternativa correta.","alts":["Não está bradicárdico, por ser atleta treinado","Está com taquicardia relativa ao seu condicionamento","Está com bradisfigmia, pois a FC auscultada foi baixa","Está bradicárdico, provavelmente de forma fisiológica"],"gab":3,"com":["O dado não muda pela causa.","48 bpm é abaixo de 60.","Bradisfigmia é para o pulso.","Correta. Bradicardia é o dado; a interpretação é outra etapa."],"imgs":[]}]},"pv":["S81.1","S81.6","S79.13","P82.12","P80.14"]},{"id":"s2","titulo":"Ritmos: sinusal, extrassístoles, FA e BAVT","html":"\n<p class=\"lead\">Na ausculta e no pulso, o ritmo é regular ou irregular. Alguns ritmos têm sinais que caíram em prova: a fibrilação atrial e o bloqueio AV total.</p>\n<table class=\"cmp\"><tr><th>Ritmo</th><th>O que se encontra</th></tr>\n<tr><td>Taquicardia e bradicardia sinusais</td><td>Regulares; FC acima de 100 ou abaixo de 60</td></tr>\n<tr><td>Arritmia sinusal respiratória</td><td>FC sobe na inspiração e cai na expiração; normal em jovens</td></tr>\n<tr><td>Extrassístoles</td><td>Batimento antecipado seguido de pausa; \"falha\" ou \"soco\" no peito</td></tr>\n<tr><td>Taquicardia paroxística</td><td>Início e fim súbitos, FC muito alta</td></tr></table>\n<h3>Fibrilação atrial</h3>\n<p>O nó sinusal perde o comando: os átrios \"tremem\" e o ventrículo responde de forma irregular.</p>\n<ul><li><mark class=\"f5\" data-refs=\"S80.17,S81.20,S77.6,S78.16,S79.25,S82.18\"><b>Ritmo irregularmente irregular</b></mark></li><li><mark class=\"f3\" data-refs=\"S80.17,S81.20,S82.18\"><b>Fonese variável de B1</b></mark> (enchimentos diferentes a cada batimento)</li><li><mark class=\"f3\" data-refs=\"S80.17,S81.20,S82.18\"><b>Ausência de B4</b></mark> (não há contração atrial)</li><li><mark class=\"f3\" data-refs=\"S80.17,S81.20,S82.18\"><b>Déficit de pulso</b> (dissociação pulso-ausculta)</mark></li><li><mark class=\"f3\" data-refs=\"S77.6,S78.16,S79.25\">Nas crises, <b>urgência urinária e poliúria</b>, pela liberação de <b>peptídeo natriurético atrial</b> com a distensão dos átrios</mark></li></ul>\n<div class=\"pearl\"><b>Pérola de prova</b><p>O caso da senhora com palpitações e vontade de urinar nas crises é FA: o átrio distendido libera ANP, que aumenta a diurese.</p></div>\n<h3>Bloqueio AV total (BAVT)</h3>\n<ul><li>Átrios e ventrículos batem de forma independente; FC ventricular baixa (30 a 40).</li><li><b>B1 em canhão</b>: quando átrio e ventrículo contraem juntos, B1 sai muito alta.</li><li><b>Onda \"a\" em canhão</b> no pulso jugular: átrio contrai contra a tricúspide fechada.</li><li>Pulso amplo e lento.</li><li>Pode dar síncope (Stokes-Adams).</li></ul>","qs":{"p":[{"enun":"Mulher de 74 anos tem crises de palpitação durante as quais urina em grande quantidade. Na crise, ritmo irregular e B1 de intensidade variável.","cmd":"Qual a explicação para a poliúria?","alts":["Hiperglicemia induzida pelo estresse, com diurese osmótica","Aumento do hormônio antidiurético durante a crise de arritmia","Liberação de peptídeo natriurético atrial pela distensão atrial","Insuficiência renal aguda pela arritmia, na fase poliúrica"],"gab":2,"com":["Não há relação com a glicemia.","O ADH reduziria a diurese.","Correta.","A arritmia não lesa o rim agudamente."],"imgs":[]},{"enun":"Paciente com FC de 36 bpm, B1 de intensidade variável com batimentos muito altos (\"em canhão\") e ondas grandes no pulso jugular.","cmd":"Qual o ritmo mais provável?","alts":["Taquicardia sinusal","Bloqueio AV total","Arritmia sinusal respiratória","Fibrilação atrial"],"gab":1,"com":["FC alta.","Correta.","Normal em jovens, sem B1 em canhão.","A FA tem FC geralmente alta e sem onda a."],"imgs":[]},{"enun":"Paciente em fibrilação atrial crônica.","cmd":"Qual achado NÃO se espera?","alts":["Quarta bulha","Déficit de pulso","Ritmo irregular","Fonese variável de B1"],"gab":0,"com":["Correta. Sem contração atrial, não há B4.","Esperado.","Esperado.","Esperado."],"imgs":[]}]},"pv":["S79.25","S81.20"]},{"id":"s3","titulo":"Pulso arterial e pulso venoso","html":"\n<p class=\"lead\">O pulso arterial informa ritmo, frequência, amplitude e forma da onda; o pulso venoso (jugular) informa o coração direito.</p>\n<h3>O que avaliar no pulso arterial</h3>\n<ol class=\"steps\"><li><b>Estado da parede</b>: endurecida (\"cano de chumbo\") na aterosclerose.</li><li><b>Frequência</b> e <b>ritmo</b>.</li><li><b>Amplitude</b>: ampla, normal, pequena.</li><li><b>Tensão</b>: força para comprimir a artéria.</li><li><b>Comparação</b> entre os lados: assimetria sugere obstrução ou dissecção.</li></ol>\n<table class=\"cmp\"><tr><th>Tipo de pulso</th><th>Como é</th><th>Onde aparece</th></tr>\n<tr><td><i>Parvus et tardus</i></td><td>Pequeno e lento para subir</td><td>Estenose aórtica</td></tr>\n<tr><td>Martelo d'água (Corrigan)</td><td>Amplo e de queda rápida</td><td>Insuficiência aórtica</td></tr>\n<tr><td>Bisferiens</td><td>Dois picos na sístole</td><td>Dupla lesão aórtica</td></tr>\n<tr><td>Alternante</td><td>Amplitude alterna batimento a batimento</td><td>IC grave</td></tr>\n<tr><td>Paradoxal</td><td>Amplitude cai na inspiração (PAS cai > 10 mmHg)</td><td>Tamponamento, asma grave</td></tr>\n<tr><td>Filiforme</td><td>Fino, rápido, quase impalpável</td><td>Choque</td></tr></table>\n<h3>Pulso venoso jugular</h3>\n<p>Com o paciente a 45°, observe a jugular interna direita. <b>Turgência jugular</b> acima de 45° indica pressão venosa central alta (IC direita, tamponamento). O <b>refluxo hepatojugular</b> (compressão do fígado aumenta a turgência) reforça. A onda \"a\" (contração atrial) <b>some na FA</b> e fica <b>em canhão no BAVT</b>.</p>","qs":{"p":[{"enun":"Asmático em crise grave: o pulso radial quase desaparece na inspiração, e a PAS cai 18 mmHg na inspiração.","cmd":"Como se chama esse achado?","alts":["Pulso bisferiens","Pulso alternante","Pulso paradoxal","Pulso parvus et tardus"],"gab":2,"com":["Tem dois picos.","Alterna batimento a batimento, sem relação com a respiração.","Correta.","É da estenose aórtica."],"imgs":[]},{"enun":"Paciente com estenose aórtica grave.","cmd":"Qual o pulso esperado?","alts":["Martelo d'água","Paradoxal","Parvus et tardus","Bisferiens"],"gab":2,"com":["É da insuficiência aórtica.","Tamponamento e asma grave.","Correta.","Dupla lesão aórtica."],"imgs":[]},{"enun":"Paciente em fibrilação atrial tem o pulso venoso jugular examinado.","cmd":"O que se espera da onda \"a\"?","alts":["Em canhão","Gigante e regular","Ausente","Duplicada"],"gab":2,"com":["Em canhão é o BAVT.","Não há onda a na FA.","Correta. Não há contração atrial efetiva.","Não ocorre."],"imgs":[]}]},"pv":[]},{"id":"s4","titulo":"Pressão arterial: técnica e erros","html":"\n<p class=\"lead\">A PA é um dado vital com técnica padronizada; erros de técnica mudam o valor e o diagnóstico.</p>\n<ol class=\"steps\"><li>Repouso de 5 minutos, bexiga vazia, sem café, cigarro ou exercício nos 30 minutos anteriores.</li><li>Sentado, costas apoiadas, pernas descruzadas, braço na altura do coração.</li><li>Manguito com largura de 40% e comprimento de 80% da circunferência do braço, 2 a 3 cm acima da fossa cubital.</li><li>Estime a PAS pela palpação do pulso radial e infle 20 a 30 mmHg acima dela.</li><li>Desinfle 2 a 3 mmHg por segundo.</li><li>PAS = 1º som de Korotkoff (fase I); PAD = desaparecimento (fase V).</li><li>Na primeira consulta, meça nos dois braços; use o de maior valor.</li></ol>\n<table class=\"cmp\"><tr><th>Erro</th><th>Efeito</th></tr>\n<tr><td>Manguito estreito para o braço (obeso)</td><td>Superestima a PA</td></tr>\n<tr><td>Manguito largo demais</td><td>Subestima a PA</td></tr>\n<tr><td>Braço abaixo do coração</td><td>Superestima</td></tr>\n<tr><td>Não palpar antes (hiato auscultatório)</td><td>Subestima a PAS</td></tr></table>\n<h3>Achados com nome</h3>\n<ul><li><b>Hipotensão ortostática</b>: queda ≥ 20 mmHg na PAS ou ≥ 10 na PAD ao ficar em pé (aula de síncope).</li><li><b>Diferença &gt; 20 mmHg entre os braços</b>: pensar em dissecção de aorta ou obstrução arterial.</li><li><b>PA divergente</b> (PAS alta, PAD baixa): insuficiência aórtica.</li><li><b>PA convergente</b> (diferencial pequena): estenose aórtica, tamponamento.</li></ul>","qs":{"p":[{"enun":"Paciente obeso, braço de 42 cm, tem a PA medida com manguito padrão de adulto e o valor sai 158/98 mmHg.","cmd":"O que pode ter ocorrido?","alts":["O manguito não muda o valor","O valor é sempre correto se a técnica de ausculta foi boa","O manguito estreito superestimou a PA","O manguito estreito subestimou a PA"],"gab":2,"com":["O tamanho do manguito muda o valor.","O manguito errado gera erro sistemático.","Correta.","O estreito superestima."],"imgs":[]},{"enun":"Qual fase de Korotkoff marca a pressão diastólica no adulto?","cmd":"Assinale a alternativa correta.","alts":["Fase I, primeiro som","Fase V, desaparecimento dos sons","Fase III, sons mais fortes","Fase II, sons abafados"],"gab":1,"com":["Fase I é a sistólica.","Correta.","Não marca a PAD.","Não marca a PAD."],"imgs":[]},{"enun":"Paciente com dor torácica súbita: PA 170/100 no braço direito e 135/80 no esquerdo.","cmd":"O que essa diferença sugere?","alts":["Infarto agudo do miocárdio","Tromboembolismo pulmonar","Dissecção aguda da aorta","Pericardite aguda"],"gab":2,"com":["O IAM não dá assimetria de PA entre os braços.","O TEP não dá assimetria.","Correta. Diferença > 20 mmHg entre os braços.","A pericardite não dá assimetria."],"imgs":[]}]},"pv":[]}],"quiz":[{"enun":"\"FC 55 bpm contada pela ausculta\" é:","cmd":"Assinale a alternativa correta.","alts":["Não se pode afirmar","Bradisfigmia","Bradicardia","Normal"],"gab":2,"com":["Bradicardia é o dado, seja qual for a causa.","É para o pulso.","Correta.","Abaixo de 60."],"imgs":[]},{"enun":"\"FP 52 ppm\" é:","cmd":"Assinale a alternativa correta.","alts":["Bradisfigmia","Taquisfigmia","Normosfigmia","Bradicardia"],"gab":0,"com":["Correta.","É acima de 100.","Abaixo de 60.","É para a ausculta."],"imgs":[]},{"enun":"Na fibrilação atrial NÃO se espera:","cmd":"Assinale a alternativa correta.","alts":["Déficit de pulso","Ritmo irregular","B4","B1 variável"],"gab":2,"com":["Esperado.","Esperado.","Correta.","Esperado."],"imgs":[]},{"enun":"B1 em canhão é típica de:","cmd":"Assinale a alternativa correta.","alts":["Extrassístole","BAVT","Fibrilação atrial","Taquicardia sinusal"],"gab":1,"com":["Não é o sinal típico.","Correta.","A FA dá B1 variável, sem canhão.","B1 forte, sem canhão."],"imgs":[]},{"enun":"Pulso paradoxal é:","cmd":"Assinale a alternativa correta.","alts":["Queda da PAS > 10 mmHg na inspiração","Pulso com dois picos na sístole","Pulso que alterna a amplitude a cada batimento","Pulso amplo, de ascensão e queda rápidas"],"gab":0,"com":["Correta.","Bisferiens.","Alternante.","Martelo d'água."],"imgs":[]},{"enun":"Manguito estreito demais:","cmd":"Assinale a alternativa correta.","alts":["Superestima a PA","Subestima a PA","Altera só a PAD","Não altera"],"gab":0,"com":["Correta.","Esse é o largo.","Altera as duas.","Altera."],"imgs":[]},{"enun":"Onda \"a\" em canhão no pulso jugular sugere:","cmd":"Assinale a alternativa correta.","alts":["Pericardite","Insuficiência aórtica","Fibrilação atrial","BAVT"],"gab":3,"com":["Não é o achado.","Não altera a onda a.","Na FA a onda a some.","Correta."],"imgs":[]},{"enun":"A FC normal no adulto em repouso é:","cmd":"Assinale a alternativa correta.","alts":["60 a 100","70 a 110","50 a 90","40 a 80"],"gab":0,"com":["Correta.","Não é a faixa usada.","Não é a faixa usada.","Não é a faixa usada."],"imgs":[]}],"widgets":[{"id":"freq","titulo":"Nomeie a frequência","desc":"Escolha o termo correto para cada registro.","cats":[["bc","Bradicardia"],["bs","Bradisfigmia"],["tc","Taquicardia"],["ts","Taquisfigmia"],["n","Normal"]],"cards":[["FC 52 bpm na ausculta","bc"],["FP 54 ppm no radial","bs"],["FC 118 bpm na ausculta","tc"],["FP 110 ppm no radial","ts"],["FC 72 bpm","n"],["FP 58 ppm em atleta","bs"],["FC 45 bpm em atleta","bc"],["FP 88 ppm","n"]]}],"gl":[["Frequência cardíaca","Contada na ausculta, em bpm.",1],["Frequência de pulso","Contada na palpação, em ppm.",1],["Bradisfigmia","FP abaixo de 60 ppm.",1],["Taquisfigmia","FP acima de 100 ppm.",1],["Déficit de pulso","FC maior que FP; FA, extrassístoles.",1],["Fibrilação atrial","Ritmo irregular, B1 variável, sem B4.",2],["BAVT","B1 em canhão, onda a em canhão, FC baixa.",2],["Pulso paradoxal","PAS cai > 10 mmHg na inspiração.",3],["Parvus et tardus","Pulso pequeno e lento da EAo.",3],["Korotkoff","Sons da aferição da PA; I = PAS, V = PAD.",4]],"vf":[["FP de 55 ppm é bradicardia.",false,"É bradisfigmia."],["FC de 55 bpm na ausculta é bradicardia, seja qual for a causa.",true,"O dado é a frequência."],["Na FA há B4.",false,"Sem contração atrial."],["A FA pode causar poliúria nas crises.",true,"ANP."],["Manguito estreito superestima a PA.",true,"Exige mais pressão."],["Pulso em martelo d'água é da estenose aórtica.",false,"É da insuficiência."]],"check":["Usar bradicardia/taquicardia × bradisfigmia/taquisfigmia corretamente","Explicar o déficit de pulso","Reconhecer FA e BAVT pelo exame","Nomear os tipos de pulso","Aferir a PA com a técnica correta"],"resumo":[["Segmento 1","FC na ausculta (bpm): bradi/taquicardia. FP no pulso (ppm): bradi/taquisfigmia. Normal 60–100."],["Segmento 2","FA: irregular, B1 variável, sem B4, déficit de pulso, poliúria por ANP. BAVT: B1 em canhão, onda a em canhão, Stokes-Adams."],["Segmento 3","Parvus et tardus (EAo), martelo d'água (IAo), paradoxal (tamponamento, asma), alternante (IC)."],["Segmento 4","PA: repouso, braço no nível do coração, manguito certo, Korotkoff I e V. Diferença > 20 entre braços: dissecção."]],"freq":[["Fibrilação atrial: queixa urinária (ANP), B1 variável e dissociação pulso-ausculta",3,"S77.6, S78.16, S79.25"],["Pulso de 50 ppm: não é bradicardia, é bradisfigmia",5,"S78.20, S79.27, S81.1, S82.27, EDS.11"],["FA: ritmo irregular, B1 variável, sem B4, dissociação pulso-ausculta",3,"S80.17, S81.20, S82.18"],["FC contada na ausculta: bradicardia (e não bradisfigmia)",2,"S80.24, S81.6"],["FC e FP: normal 60–100; taquicardia × taquisfigmia",2,"S78.28, S79.13"],["FC de 55 bpm na ausculta: bradicardia",1,"P82.12"],["FP de 55 ppm no pulso: bradisfigmia, e não bradicardia",1,"P80.14"]],"cob":{"rk":{"t":"Onde contou → nome do achado","c":["Onde contou","Unidade","Abaixo de 60","Acima de 100"],"d":["<b>Onde contou</b>: ausculta cardíaca ou pulso arterial.","<b>Unidade</b>: bpm ou ppm.","<b>Abaixo de 60</b>: bradicardia ou bradisfigmia.","<b>Acima de 100</b>: taquicardia ou taquisfigmia."],"x":[["Ausculta","bpm","bradicardia","taquicardia"],["Pulso radial","ppm","bradisfigmia","taquisfigmia"]],"ex":"\"FP 55 ppm\" → incorreto dizer bradicardia; \"FC 55 bpm pela ausculta\" → bradicardia.","b":"FA: ritmo irregular + B1 variável + sem B4 + déficit de pulso (+ poliúria por ANP)."},"figs":[],"keys":["C5","C30","C51","C53","C36","p:fc55","p:fp55"]}},{"id":"a9","num":9,"nome":"Dor torácica","tema":"Dor isquêmica e sinal de Levine, angina estável × instável × IAM, equivalente anginoso, dissecção aguda da aorta e outras causas","segs":[{"id":"s1","titulo":"Dor torácica isquêmica e o sinal de Levine","html":"\n<p class=\"lead\">Diante de dor torácica, a anamnese (o decálogo da dor) é a principal ferramenta. A dor isquêmica tem um perfil próprio.</p>\n<table class=\"cmp\"><tr><th>Atributo</th><th>Dor isquêmica típica</th></tr>\n<tr><td>Localização</td><td>Retroesternal ou precordial, difusa (o paciente não aponta com um dedo)</td></tr>\n<tr><td>Caráter</td><td>Aperto, peso, opressão, queimação</td></tr>\n<tr><td>Irradiação</td><td>Membro superior esquerdo (face ulnar), mandíbula, pescoço, epigástrio, dorso</td></tr>\n<tr><td>Fatores de piora</td><td>Esforço, frio, emoção, refeição copiosa</td></tr>\n<tr><td>Fatores de alívio</td><td>Repouso, nitrato sublingual</td></tr>\n<tr><td>Sintomas associados</td><td>Sudorese, náuseas, dispneia, palidez (\"despertar adrenérgico\")</td></tr></table>\n<h3>O sinal de Levine</h3>\n<p><mark class=\"f5\" data-refs=\"S78.10,S79.12,S80.8,P81.17,P80.2\">O paciente aponta a região precordial com a <b>mão fechada</b>, o <b>punho cerrado</b> ou a mão em garra, mostrando ao mesmo tempo o local e o <b>caráter em aperto</b> da dor</mark>. É o <b>sinal de Levine</b>, associado à isquemia miocárdica.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>O enunciado do sinal de Levine caiu quase igual em parciais e somativas, com distratores de outros epônimos: Torres-Homem (dor à percussão do hipocôndrio direito no abscesso hepático), Rivero-Carvallo (sopro tricúspide), Homans (dor na panturrilha à dorsiflexão, na TVP).</p></div>\n<h3>Angina estável × instável × IAM</h3>\n<table class=\"cmp\"><tr><th></th><th>Angina estável</th><th>Angina instável</th><th>IAM</th></tr>\n<tr><td>Gatilho</td><td>Esforço, padrão conhecido</td><td>Repouso, ou piora do padr
