elatinosa de Rolando. Tratando-se, portanto, mero preciosismo acadêmico. Exemplo clássico: analgesia congênita.","Em processos infecciosos de tecidos moles cutâneos, pelo risco de extensão por planos fasciais e músculo-aponeuróticos com diferentes limiares para dor, devemos valorizar e investigar a queixa de dor à distância do foco aparente. Exemplo clássico: gangrena de Fournier."],"gab":3,"com":["","","","<b>Comentário:</b> Justificativa literal do professor: 'Em processos infecciosos cutâneos, pode ocorrer dor à distância do foco infeccioso - ponto doloroso original - em função do maior limiar de dor ou menor inervação de estruturas fasciais, mesmo que contíguas. Não há relação com o conceito de dor referida e irradiada (relacionadas a interpretação álgica pelo SNC). Nas demais alternativas a fisiopatologia da dor irradiada foi invertida com a dor referida.'"],"imgs":[],"par":1},{"id":"ED.2","prova":"ED","n":"2","key":"p:psico","tema":"a4","seg":"s4","mod":"prova","enun":"A dor psicogênica é responsável por grande número de atendimentos médicos, causa de absenteísmo, custos extras com exames complementares, polifarmácia e, principalmente, sofrimento para quem vive com essa condição. Sobre a dor psicogênica pode-se afirmar que:","cmd":"","alts":["suspeita-se que seu substrato anatômico encontre-se em uma degeneração do córtex frontal, embora a utilização da ressonância magnética para seu diagnóstico ainda dependa da definição de escores e padronizações para atingir o grau de especificidade necessário para ser incluído no atendimento desses pacientes.","dor psicogênica e dor simulada denotam as mesmas afecções. A diferença, conceitual, entre ambas reside no fato da dor psicogênica estar relacionada diretamente a uma busca, por parte do paciente, de um benefício direto (afastamento do trabalho, por exemplo). Já na dor simulada, o benefício secundário do paciente não está bem definido, podendo estar relacionado a carência afetiva e traumas psíquicos.","suspeita-se que seu substrato seja uma predisposição genética, ligada ao cromossomo Y, que leva a uma alteração dos níveis de neurotransmissores na Substância de Rolando. A utilização da ressonância magnética para seu diagnóstico ainda dependa da definição de escores e padronizações para atingir o grau de especificidade necessário para ser incluído no atendimento desses pacientes.","embora não exista um substrato anatômico ou a alteração específica de exames complementares (de imagem ou não) que possa defini-la, a dor psicogênica deve ser considerada como diagnóstico diferencial em quadros dolorosos, notadamente em casos crônicos ou com tendência a cronificação. Embora um substrato anatômico, ou bioquímico, ainda não esteja definido, o paciente portador de dor psicogênica sofre (absenteísmo, perda de prazer) para além do quadro doloroso."],"gab":3,"com":["","","","<b>Comentário:</b> Justificativa literal do professor: 'Não existe, até o momento, um substrato anatômico para a dor psicogênica, sendo o seu diagnóstico exclusivamente clínico e por exclusão. Embora não exista um substrato para dor psicogênica, o paciente sofre verdadeiramente com o quadro doloroso. Ao contrário da dor simulada, em que o paciente simula uma afecção dolorosa inexistente, em busca de ganhos secundários.'"],"imgs":[],"par":1},{"id":"ED.3","prova":"ED","n":"3","key":"p:cresc","tema":"a4","seg":"s3","mod":"prova","enun":"Paciente masculino, adolescente de doze anos de idade, comparece a consulta ambulatorial trazido pela mãe com queixa de dor localizada no membro inferior direito (especificamente na face anterior da perna direita); profunda e vaga; sem fatores de piora ou melhora observados; sem relação com os movimentos do membro; de intensidade variável ao longo do dia - intensidade média 5/10, pior no período noturno; iniciada há um mês e meio. Acerca desse quadro álgico (referente à dor), podemos afirmar:","cmd":"","alts":["trata-se de dor aguda.","trata-se de dor crônica.","trata-se de dor subaguda.","trata-se de dor protraída."],"gab":0,"com":["<b>Comentário:</b> Justificativa literal do professor: 'Define-se como dor crônica aquela que persiste durante três meses ou mais. Embora alguns autores utilizem a classificação protraída e subaguda como sinonímia, a literatura de referência adotada NÃO trata de tais definições.' Logo, com 1 mês e meio (< 3 meses), trata-se de DOR AGUDA!","","",""],"imgs":[],"par":1},{"id":"ED.4","prova":"ED","n":"4","key":"p:colecisto","tema":"a4","seg":"s1","mod":"prova","enun":"Paciente de 48 anos, sexo feminino, portadora de obesidade grau I, comparece ao pronto-atendimento com queixa de dor intensa em hipocôndrio direito há duas horas, contínua, associada a náusea e vômitos. É realizada analgesia imediata após sua chegada (...) com uma ampola de dipirona endovenosa, com melhora importante da dor. Colhidos exames laboratoriais na urgência e encaminhada para realização de uma ultrassonografia de abdome que evidenciou a presença de cálculos na vesícula biliar, um deles impactado na região do infundíbulo, associado ao borramento da gordura perivesical. Sobre a classificação das dores dessa paciente, é correto afirmar:","cmd":"","alts":["A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como somática profunda.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada como nociceptiva.","A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como psicogênica.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada referida."],"gab":1,"com":["","<b>Comentário:</b> Justificativa literal do professor: 'Trata-se de dor nociceptiva, quanto a fisiopatologia. Os estímulos nóxicos (nocivos) originaram-se no órgão acometido, tendo sido transduzidos, transmitidos e modulados por receptores nervosos, feixes nervosos e comando central específicos.'","",""],"imgs":[],"par":1},{"id":"ED.5","prova":"ED","n":"5","key":"p:exemplos","tema":"a4","seg":"s4","mod":"prova","enun":"Considere os exemplos abaixo: 1. Dor hemifacial esquerda, associada a disestesia, secundária ao zóster facial; 2. Dor localizada no membro superior esquerdo, concomitante a dor precordial em aperto, secundária ao infarto agudo do miocárdio; 3. Dor mesogástrica, concomitante a dor na fossa ilíaca direita, secundária a apendicite aguda. Entre os quadros clínicos descritos, qual(is) pode(m) ser classificado(s) como dor neuropática?","cmd":"","alts":["Apenas o item 1.","Apenas o item 2.","Apenas o item 3.","Os itens 1 e 3."],"gab":0,"com":["<b>Comentário:</b> Justificativa literal do professor: 'A dor decorrente do zóster facial (herpes-zóster) é classicamente classificada como neuropática, pois resulta da lesão e inflamação de nervos sensitivos periféricos pelo vírus Varicella-zoster. A dor no membro superior no IAM é referida. A dor da apendicite é inicialmente visceral e depois somática profunda.'","","",""],"imgs":[],"par":1},{"id":"P82.1","prova":"P82","n":"1","key":"p:nutri","tema":"a3","seg":"s2","mod":"prova","enun":"A dieta costuma figurar como o primeiro tópico na prescrição de pacientes internados (...). Na avaliação do estado nutricional de um paciente, durante o exame físico geral ou ectoscopia, uma série de parâmetros podem ser pesquisados. Analise as assertivas:\n1. Constatação de uma grande variação de peso (cerca de 5kg), em um curto período (menos de 24 horas), obtida pela pesagem do paciente.\n2. Evidente proeminência de relevos dos ossos da face, das extremidades dos membros e dos arcos costais.\n3. Alterações na coloração, brilho e textura da pele, cabelos e fâneros.\n4. Encontro de sarcopenia (diminuição/perda de massa muscular).\nPode-se afirmar que são parâmetros de avaliação do estado nutricional, obteníveis durante a ectoscopia, aqueles contidos nas assertivas:","cmd":"","alts":["1 e 2, apenas","1, 2 e 3.","3 e 4 apenas","2, 3 e 4."],"gab":3,"com":["","","","<b>Comentário:</b> 2, 3 e 4. A variação de 5kg em <24h decorre de retenção líquida/desidratação aguda (parâmetro de hidratação/volemia), não de nutrição."],"imgs":[],"par":1},{"id":"P82.2","prova":"P82","n":"2","key":"p:vitais","tema":"a3","seg":"s1","mod":"prova","enun":"Avalie os seguintes dados encontrados durante o exame físico geral de um paciente adulto (35 anos) do sexo masculino:\n1. temperatura axilar (TAX): 37,3°C\n2. frequência de pulso (FP): 102 ppm\n3. frequência respiratória (FR): 16 irpm\nAssinale a opção correta, que melhor descreve os achados do exame físico geral desse paciente:","cmd":"","alts":["febril; taquicárdico; normopneico.","afebril; taquisfigmico; normopneico.","afebril; taquisfigmico; taquipneico.","febril, taquicardico; taquipneico."],"gab":1,"com":["","<b>Comentário:</b> TAX 37,3°C é afebril (subfebril); FP 102 ppm avalia pulso radial (taquisfigmico); FR 16 irpm é normal (normopneico).","",""],"imgs":[],"par":1},{"id":"P82.3","prova":"P82","n":"3","key":"p:dist","tema":"a4","seg":"s2","mod":"prova","enun":"Durante o estudo semiológico da dor, importantes conceitos foram discutidos. Dentre eles, aqueles relacionados à real percepção de dor, por parte do paciente, em locais ou regiões distantes ao sítio de origem dos estímulos nóxicos. Acerca da dor localizada à distância do sítio de acometimento nóxico, assinale a opção correta:","cmd":"","alts":["O termo 'dor referida' designa um tipo específico de dor percebida à distância do local de origem. Habitualmente relacionada a compressão nervosa em um nível, e percepção dolorosa distal ao sítio de acometimento. Caracteriza-se por respeitar o mesmo trajeto nervoso. Exemplo clássico: ciatalgia.","O termo 'dor irradiada' designa a dor percebida à distância do local de origem do estímulo nocivo, mas que com ele se relaciona por compartilhamento de vias, tratos ou de representações no Sistema Nervoso Central. Exemplo clássico - dor precordial do infarto do miocárdio irradiada para a mandíbula.","A divisão entre dor irradiada ou referida não comporta importância prática em função da modulação central que ambas recebem na substância gelatinosa de Rolando. Tratando-se, portanto, mero preciosismo acadêmico. Exemplo clássico: analgesia congênita.","Em processos infecciosos de tecidos moles cutâneos, pelo risco de extensão por planos fasciais e músculo-aponeuróticos com diferentes limiares para dor, devemos valorizar e investigar a queixa de dor à distância do foco aparente. Exemplo clássico: gangrena de Fournier."],"gab":3,"com":["","","","<b>Comentário:</b> Extensão por planos fasciais na gangrena de Fournier."],"imgs":[],"par":1},{"id":"P82.4","prova":"P82","n":"4","key":"p:aereg","tema":"a2","seg":"s1","mod":"prova","enun":"Acerca da Anamnese Especial (AE), também denominada Revisão Sintomatológica (RS), analise as seguintes informações colhidas durante uma entrevista médica realizada em um paciente que apresenta como queixa principal cefaleia:\nI) Paciente nega febre, calafrios. Refere perda ponderal de 3 kg nos últimos 2 meses por dieta voluntária — registrado em sintomas sistêmicos.\nII) Paciente queixa-se de zumbido unilateral constante sem vertigem — registrado em COONG.\nIII) Relato de palpitações intermitentes ocasionais — registrado em Tórax/Aparelho Cardiovascular.\nIV) Nega dor abdominal, nega alterações do hábito intestinal ou aspecto das fezes — registrado em Abdome/TGI.\nPodem ser consideradas informações corretamente registradas na AE ou RS os itens:","cmd":"","alts":["I e II","I e III","III e IV","I, II, III e IV."],"gab":3,"com":["","","","<b>Comentário:</b> Todas as 4 assertivas representam registros adequados."],"imgs":[],"par":1},{"id":"P82.5","prova":"P82","n":"5","key":"p:topicos","tema":"a2","seg":"s3","mod":"prova","enun":"Você é monitor da Disciplina Fundamentos de Semiologia. Um aluno tem dúvidas em quais tópicos registrar as anotações:\n1. Refere vacinação em dia. Nega passado de internações clínicas ou cirúrgicas;\n2. Sedentário, não tabagista, não etilista;\n3. Mãe falecida aos 61 anos de câncer de mama. Pai vivo, hipertenso e diabético. Irmão mais velho com câncer de cólon;\n4. Nega febre, nega calafrios, nega perda ponderal.\nAssinale a alternativa que traz a correspondência correta:","cmd":"","alts":["1-RS; 2-HV; 3-HF; 4-HMA","1-HV; 2-RS; 3-QP; 4-Id.","1-QP; 2-HMA; 3-RS; 4-HPP.","1-HPP; 2-HV; 3-HF; 4-RS."],"gab":3,"com":["","","","<b>Comentário:</b> 1-HPP; 2-HV; 3-HF; 4-RS."],"imgs":[],"par":1},{"id":"P82.6","prova":"P82","n":"6","key":"p:biotipo","tema":"a3","seg":"s2","mod":"prova","enun":"Acerca do biotipo no paciente longilíneo, normolíneo e brevilíneo analise as assertivas:\nI) O ictus cordis pode sofrer variações de sua posição normal a depender do biotipo do paciente, sem necessariamente significar alteração de caráter patológico.\nII) Indivíduos longilíneos, notadamente jovens do sexo masculino, apresentam maior predisposição, em relação a população geral, a apresentarem pneumotórax espontâneo.\nIII) A interpretação de exames complementares, notadamente de exames de imagem (Raio X de tórax, por exemplo) deve levar em consideração o biotipo do paciente.\nAssinale a opção correta:","cmd":"","alts":["I","II e III","I, II e III","I e II"],"gab":2,"com":["","","<b>Comentário:</b> I, II e III.",""],"imgs":[],"par":1},{"id":"P82.7","prova":"P82","n":"7","key":"p:beg","tema":"a3","seg":"s1","mod":"prova","enun":"Ao grafarmos no prontuário médico um achado positivo, ou negativo, durante o exame clínico do paciente devemos estar atentos ao local correto. Nesse sentido, a informação - 'Bom estado geral. Consciente, lúcido e orientado. Afebril.' - deverá ser registrada em qual item componente do exame clínico?","cmd":"","alts":["Anamnese Especial. Campo: Sintomas gerais.","Exame físico. Campo: Exame físico geral.","Exame físico. Dados vitais.","Todas as assertivas anteriores."],"gab":1,"com":["","<b>Comentário:</b> Exame físico. Campo: Exame físico geral (Ectoscopia).","",""],"imgs":[],"par":1},{"id":"P82.8","prova":"P82","n":"8","key":"p:colecisto","tema":"a4","seg":"s1","mod":"prova","enun":"Paciente de 48 anos, sexo feminino, obesa grau I, dor intensa em hipocôndrio direito há duas horas contínua, náuseas e vômitos. Analgesia imediata com dipirona EV. USG evidencia cálculos na vesícula biliar com cálculo impactado no infundíbulo. Sobre a classificação da dor dessa paciente, é CORRETO afirmar:","cmd":"","alts":["A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como somática profunda.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada como nociceptiva.","A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como psicogênica.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada referida."],"gab":1,"com":["","<b>Comentário:</b> A dor no hipocôndrio direito há 2 horas é nociceptiva.","",""],"imgs":[],"par":1},{"id":"P82.9","prova":"P82","n":"9","key":"p:qp","tema":"a1","seg":"s3","mod":"prova","enun":"Analise as seguintes afirmações sobre a grafia ou registro da Queixa Principal (QP):\nI) A Queixa Principal deve ser grafada (registrada), sempre que possível, nas próprias palavras do paciente.\nII) No caso de múltiplas queixas, orientar o paciente a eleger apenas uma, e as demais em outra consulta agendada.\nIII) Deve-se preferir termos técnicos em detrimento a termos leigos.\nIV) Deve-se preferir sentenças longas e bem explicativas.\nAssinale a alternativa correta:","cmd":"","alts":["Apenas a assertiva I está correta.","Apenas a assertiva III está correta.","Apenas a assertiva IV está correta.","Todas as assertivas (I, II, III e IV) estão corretas."],"gab":0,"com":["<b>Comentário:</b> Apenas a assertiva I está correta.","","",""],"imgs":[],"par":1},{"id":"P82.10","prova":"P82","n":"10","key":"p:joelho","tema":"a4","seg":"s3","mod":"prova","enun":"Paciente masculino, jovem, torção de joelho direito no futebol há dois dias. Aponta a dor abarcando toda a articulação, latejante, aliviada pelo repouso e imobilização, pior ao subir/descer escadas. Confirmada lesão ligamentar. Acerca da dor relatada pelo paciente, podemos afirmar:","cmd":"","alts":["Pode ser classificada como dor aguda, somática profunda.","Pode ser classificada como dor aguda, somática superficial.","Pode ser classificada como dor aguda, visceral.","Pode ser classificada como dor subaguda, somática superficial."],"gab":0,"com":["<b>Comentário:</b> Dor aguda, somática profunda.","","",""],"imgs":[],"par":1},{"id":"P82.11","prova":"P82","n":"11","key":"p:psico","tema":"a4","seg":"s4","mod":"prova","enun":"Acerca da dor psicogênica, assinale a alternativa correta:","cmd":"","alts":["Suspeita-se que seu substrato anatômico encontre-se em degeneração do córtex frontal via ressonância magnética.","Dor psicogênica e dor simulada são semelhantes afecções, diferindo pelo benefício direto versus secundário.","Nos pacientes com dor psicogênica, diagnósticos de transtornos do humor costumam ser mais prevalentes que na população geral. Apesar da exclusão de diagnósticos diferenciais para dor crônica e de não se encontrar substrato anatômico, os pacientes sofrem com o quadro doloroso e demandam atendimento multiprofissional.","Acredita-se que a definição do substrato anatômico na Substância de Rolando estará disponível no próximo biênio com radioisótopos."],"gab":2,"com":["","","<b>Comentário:</b> Transtornos do humor mais prevalentes, sem substrato anatômico, sofrimento real e atendimento multiprofissional.",""],"imgs":[],"par":1},{"id":"P82.12","prova":"P82","n":"12","key":"p:fc55","tema":"a8","seg":"s1","mod":"prova","enun":"Registro do prontuário: 'Dados Vitais: FC: 55 bpm (contada pela ausculta cardíaca); FR: 16 irpm; PA 130/90; TAX 36,5°C'. Acerca da frequência cardíaca encontrada, marque a alternativa correta:","cmd":"","alts":["Pode-se afirmar que o paciente está bradicárdico, pois o limite inferior de normalidade é de 60 batimentos por minuto, independentemente de sua causa.","Não se pode afirmar que o paciente está bradicárdico, pois podem existir eventuais fatores não patológicos como causa da bradicardia.","É incorreto utilizar o termo bradicardia neste caso, tendo em vista que o dado vital aferido aponta para a palpação do pulso (ppm).","Não existe distinção prática entre frequência de pulso e frequência cardíaca."],"gab":0,"com":["<b>Comentário:</b> Como foi contada pela ausculta cardíaca em bpm e é 55 bpm (< 60 bpm), pode-se afirmar que está bradicárdico.","","",""],"imgs":[],"par":1},{"id":"P82.13","prova":"P82","n":"13","key":"p:cush","tema":"a3","seg":"s3","mod":"prova","enun":"Durante o exame físico, observa-se em uma paciente: face arredondada ('em lua cheia'); eritema facial (rubor); atenuação dos traços faciais; acne e hirsutismo. Esses achados são característicos de qual fácies?","cmd":"","alts":["Fácies mixedematosa","Fácies leonina.","Fácies parkinsoniana","Fácies cushingoide."],"gab":3,"com":["","","","<b>Comentário:</b> Fácies cushingoide."],"imgs":[],"par":1},{"id":"P82.14","prova":"P82","n":"14","key":"p:palha","tema":"a2","seg":"s4","mod":"prova","enun":"Paciente masculino, 40 anos de idade, tabagismo ativo desde os 15 anos. Consumo médio de cerca de 8 cigarros de palha por dia. Qual é a carga tabágica em anos/maço?","cmd":"","alts":["25 anos/maço","50 anos/maço","75 anos/maço","100 anos/maço."],"gab":1,"com":["","<b>Comentário:</b> 50 anos-maço.","",""],"imgs":[],"par":1},{"id":"P82.15","prova":"P82","n":"15","key":"p:atestado","tema":"a1","seg":"s1","mod":"prova","enun":"Atestado médico de William Harvey atestando que 'não apresenta ao exame clínico sinais e/ou sintomas de doenças...', estando apto para natação e musculação. Sobre o exposto, assinale a alternativa correta:","cmd":"","alts":["O médico responsável pelo documento baseou-se em informações obtidas exclusivamente da anamnese e do exame físico para firmar o atestado.","baseou-se em anamnese, exame físico e eletrocardiograma.","baseou-se em anamnese, exame físico e teste ergométrico.","baseou-se em anamnese, exame físico, eletrocardiograma e espirometria."],"gab":0,"com":["<b>Comentário:</b> Baseou-se exclusivamente na anamnese e no exame físico.","","",""],"imgs":[],"par":1},{"id":"P82.16","prova":"P82","n":"16","key":"p:rs","tema":"a2","seg":"s1","mod":"prova","enun":"Sobre a Revisão de Sistemas (RS), assinale a opção CORRETA:","cmd":"","alts":["A RS se restringe ao sistema relacionado à queixa principal, dispensando investigação dos demais aparelhos.","A RS permite investigar sintomas gerais e específicos de cada aparelho, como febre, tosse, dispneia ou alterações urinárias, mesmo que não mencionados inicialmente.","A RS é dispensável na prática clínica, pois todos os dados relevantes já são obtidos na história da moléstia atual (HMA).","A RS deve ser realizada apenas quando o paciente não apresenta queixa principal, servindo como substituto da história clínica."],"gab":1,"com":["","<b>Comentário:</b> Permite investigar sintomas gerais e específicos de cada aparelho não relatados na QP/HMA.","",""],"imgs":[],"par":1},{"id":"P82.17","prova":"P82","n":"17","key":"p:vertigem","tema":"a2","seg":"s1","mod":"prova","enun":"Paciente masculino, 35 anos, procura atendimento relatando vertigem rotatória há 1 hora, zumbido unilateral à esquerda, hipoacusia ipsilateral, náuseas e vômitos. Analise os registros:\nI) RS - COONG (ouvidos): abaulamento e coloração leitosa da membrana timpânica à otoscopia.\nII) RS - ABDOME/TGI: regular, fezes bem formadas, 1 evacuação a cada 2 dias.\nIII) RS - TÓRAX/AR: tosse úmida persistente matinal há 1 mês.\nSão informações que poderiam fazer parte da anamnese desse paciente:","cmd":"","alts":["I e II","Apenas I.","I e III.","II e III."],"gab":3,"com":["","","","<b>Comentário:</b> II e III (otoscopia é achado do exame físico, não da anamnese)."],"imgs":[],"par":1},{"id":"P82.18","prova":"P82","n":"18","key":"p:hpp","tema":"a2","seg":"s3","mod":"prova","enun":"Sobre a História Patológica Pregressa (HPP), assinale a opção CORRETA:","cmd":"","alts":["Devem ser registrados apenas os diagnósticos que o paciente consegue relatar com precisão de data e tratamento, evitando incluir informações vagas.","Doenças da infância (como sarampo ou catapora) não devem constar na HPP, pois não apresentam impacto algum na vida adulta.","Antecedentes de internações hospitalares sem diagnóstico definido não precisam ser relatados na HPP.","A HPP deve incluir doenças crônicas, cirurgias, alergias, internações e tratamentos prévios, mesmo que controlados ou aparentemente sem repercussão atual."],"gab":3,"com":["","","","<b>Comentário:</b> A HPP deve abranger crônicas, cirurgias, alergias e internações prévias."],"imgs":[],"par":1},{"id":"P82.19","prova":"P82","n":"19","key":"p:atipica","tema":"a3","seg":"s3","mod":"prova","enun":"Durante o exame físico geral, o estudante observa que o paciente não apresenta características faciais sugestivas de síndrome ou doença específica. Utiliza-se qual termo médico consagrado para designar uma fácies normal sem traços patognomônicos?","cmd":"","alts":["Fácies eutrófica ou compósita.","Fácies atípica ou incaracterística.","Normoface ou normaliface.","Fácies normalis ou normala."],"gab":1,"com":["","<b>Comentário:</b> Fácies atípica ou incaracterística.","",""],"imgs":[],"par":1},{"id":"P82.20","prova":"P82","n":"20","key":"p:hipert","tema":"a3","seg":"s3","mod":"prova","enun":"Mulher de 36 anos, perda de peso não intencional, tremor fino de extremidades em mãos, ansiedade, palpitações e aumento da frequência das evacuações. Ao exame: exoftalmia, olhos brilhantes, expressão de espanto/ansiedade e emagrecimento facial. Qual a fácies mais compatível?","cmd":"","alts":["Fácies hipertireoidea.","Fácies cushingoide.","Fácies sifilítica.","Fácies da trissomia do 21."],"gab":0,"com":["<b>Comentário:</b> Fácies hipertireoidea.","","",""],"imgs":[],"par":1},{"id":"P82.21","prova":"P82","n":"21","key":"p:ombro","tema":"a4","seg":"s2","mod":"prova","enun":"Mulher de 45 anos, obesa, 12 horas após colecistectomia videolaparoscópica sem intercorrências, refere discreta dor no ombro direito ventilatório-dependente. Considerando irritação diafragmática secundária ao pneumoperitônio, a dor no ombro direito pode ser classificada como:","cmd":"","alts":["Trata-se de dor referida.","Trata-se de dor irradiada.","Trata-se de dor psicogênica.","Trata-se de dor neuropática."],"gab":0,"com":["<b>Comentário:</b> Trata-se de dor referida.","","",""],"imgs":[],"par":1},{"id":"P82.22","prova":"P82","n":"22","key":"p:psa","tema":"a1","seg":"s2","mod":"prova","enun":"(Questão Bônus) Homem saudável de 48 anos comparece à UBS para realizar PSA porque viu anúncio para se proteger de câncer de próstata. Considerando que o PSA apresenta elevado risco de falso positivo e baixo valor preditivo positivo, qual a conduta correta?","cmd":"","alts":["Devido ao manifesto desejo do paciente, o médico deve solicitar o exame para preservar a relação médico-paciente.","O médico deve encaminhar o paciente ao urologista, pois só ele pode determinar a necessidade do exame.","O médico deve solicitar o exame, mas alertar sobre falso positivo e risco de biópsia.","O médico deve tomar uma decisão compartilhada, explicando ao paciente sobre os riscos do exame e sua baixa probabilidade de benefício."],"gab":3,"com":["","","","<b>Comentário:</b> Decisão compartilhada orientada por riscos e benefícios."],"imgs":[],"par":1},{"id":"P81.5","prova":"P81","n":"5","key":"p:rs","tema":"a2","seg":"s1","mod":"prova","enun":"A Revisão de Sistemas (RS) é parte da anamnese destinada a investigar sinais e sintomas em diferentes aparelhos e sistemas do corpo humano, auxiliando na identificação de queixas que o paciente não relatou espontaneamente. Sobre a RS, assinale a opção CORRETA:","cmd":"","alts":["A RS se restringe ao sistema relacionado à queixa principal, dispensando investigação dos demais aparelhos.","A RS permite investigar sintomas gerais e específicos de cada aparelho, como febre, tosse, dispneia ou alterações urinárias, mesmo que não mencionados inicialmente.","A RS é dispensável na prática clínica, pois todos os dados relevantes já são obtidos na história da moléstia atual (HMA).","A RS deve ser realizada apenas quando o paciente não apresenta queixa principal, servindo como substituto da história clínica."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: Permite investigar sintomas gerais e específicos de cada aparelho não relatados na QP/HMA.","",""],"imgs":[],"par":1},{"id":"P81.Torção-Joelho","prova":"P81","n":"Torção Joelho","key":"p:joelho","tema":"a4","seg":"s3","mod":"prova","enun":"A caracterização semiológica minuciosa da dor constitui recurso essencial para a prática clínica. Paciente masculino, jovem, torção no joelho direito durante futebol há dois dias. Aponta dor abrangendo com as mãos toda a superfície articular do joelho, latejante, aliviada pelo repouso e imobilização, pior ao subir e descer escadas, sem parestesias. Confirmada lesão ligamentar. Acerca da dor descrita por este paciente, pode-se afirmar:","cmd":"","alts":["deve ser caracterizada como dor crônica, somática, uma vez que persiste por mais de 48 horas após a lesão inicial.","pode ser caracterizada como dor neuropática, pois decorre de lesão de nervos periféricos, apresentando padrão irradiado e queimação.","deve ser considerada dor psicogênica, uma vez que não há substrato orgânico associado, evidenciado pela melhora com o repouso.","pode ser classificada como dor aguda, somática profunda, em razão de sua origem musculoesquelética e tempo de evolução recente."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: Dor aguda, somática profunda."],"imgs":[],"par":1},{"id":"P81.9","prova":"P81","n":"9","key":"p:sifilis","tema":"a3","seg":"s3","mod":"prova","enun":"Analise o seguinte conjunto de alterações faciais:\n- Nariz em sela;\n- Dentes de Hutchinson;\n- Molares em amora (ou em framboesa);\n- Fronte olímpica.\nPode-se afirmar que essas alterações são classicamente relacionadas ao seguinte tipo de fácies:","cmd":"","alts":["sífilis primária.","sífilis secundária.","sífilis congênita.","sífilis terciária."],"gab":2,"com":["","","<b>Comentário:</b> Gabarito C: sífilis congênita.",""],"imgs":[],"par":1},{"id":"P81.2","prova":"P81","n":"2","key":"p:vitais","tema":"a3","seg":"s1","mod":"prova","enun":"Analise os seguintes dados vitais, obtidos durante o exame físico de um paciente adulto, masculino jovem:\nTAX = 37,0°C; PA = 110/60 mmHg; FP = 106 ppm; FR = 16 irpm.\nPode-se afirmar que o paciente encontra-se:","cmd":"","alts":["taquicárdico.","febril.","taquipneico.","taquisfigmico."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: taquisfigmico (frequência de pulso periférico em ppm > 100)."],"imgs":[],"par":1},{"id":"P81.10","prova":"P81","n":"10","key":"p:hipert","tema":"a3","seg":"s3","mod":"prova","enun":"Paciente do sexo feminino, 36 anos, perda de peso não intencional, tremor fino de extremidades em mãos, ansiedade, palpitações e aumento da frequência evacuatória. No exame físico geral: exoftalmia e olhos brilhantes; expressão de ansiedade/espanto; emagrecimento facial. Qual é a fácies característica desse quadro?","cmd":"","alts":["Fácies Hipertireoidea.","Fácies de Cushing.","Fácies Sifilítica.","Fácies da Trissomia do 21."],"gab":0,"com":["<b>Comentário:</b> Gabarito A: Fácies Hipertireoidea (Doença de Basedow-Graves).","","",""],"imgs":[],"par":1},{"id":"P81.18","prova":"P81","n":"18","key":"p:tabaco20","tema":"a2","seg":"s4","mod":"prova","enun":"Um paciente informa que fuma há quinze anos, cerca de 20 cigarros brancos (industrializados) por dia. Qual é a carga tabágica em anos/maço?","cmd":"","alts":["7,5 anos/maço.","15 anos/maço.","30 anos/maço.","20 anos/maço."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: (20/20) × 15 = 15 anos/maço.","",""],"imgs":[],"par":1},{"id":"P81.13","prova":"P81","n":"13","key":"p:biotipo","tema":"a3","seg":"s2","mod":"prova","enun":"O estudo do biotipo corporal (longilíneo, brevilíneo e normolíneo) possui grande relevância clínica e semiológica, como ilustrado pela figura abaixo:\nAnalise as assertivas abaixo e marque a alternativa que contém as afirmações corretas:\nI - há maior incidência de pneumotórax espontâneo em jovens longilíneos do sexo masculino, em relação à população geral;\nII - há variações normais da posição do ictus nos diferentes biotipos, sem necessariamente significar alterações;\nIII - permite uma melhor interpretação de exames de imagens, minimizando interpretações equivocadas.","cmd":"","alts":["I.","I e II.","I, II e III.","II e III."],"gab":2,"com":["","","<b>Comentário:</b> Gabarito C: Todas corretas (I, II e III).",""],"imgs":["biotipos"],"par":1},{"id":"P81.1","prova":"P81","n":"1","key":"p:cush","tema":"a3","seg":"s3","mod":"prova","enun":"Durante o exame físico, você observa em uma paciente as seguintes características:\n- Face arredondada ('em lua cheia');\n- Eritema facial (rubor);\n- Atenuação dos traços faciais;\n- Acne e hirsutismo.\nEsses achados são característicos de qual tipo de fácies?","cmd":"","alts":["Fácies mixedematosa.","Fácies leonina.","Fácies parkinsoniana.","Fácies cushingoide."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: Fácies cushingoide."],"imgs":[],"par":1},{"id":"P81.22","prova":"P81","n":"22","key":"p:psico","tema":"a4","seg":"s4","mod":"prova","enun":"A dor psicogênica é uma condição responsável por um expressivo número de atendimentos médicos; absenteísmo laboral e escolar; aumento de custos e sofrimento daqueles que dela padecem. Sobre este tipo de dor, assinale a alternativa correta:","cmd":"","alts":["Trata-se de uma dor sem base orgânica, cuja origem está em fatores emocionais ou psicológicos, sendo genuína e capaz de causar incapacidade significativa.","É um quadro simulado pelo paciente, que apresenta queixas dolorosas inexistentes com o objetivo de obter ganhos secundários.","Por não apresentar substrato orgânico comprovável, não deve ser considerada pelo médico na prática clínica, uma vez que não há tratamento eficaz.","O diagnóstico de dor psicogênica exige a exclusão prévia de todas as possíveis causas orgânicas, devendo-se recorrer exclusivamente a exames de imagem e laboratoriais para sua confirmação."],"gab":0,"com":["<b>Comentário:</b> Gabarito A: Dor sem base orgânica, genuína e capaz de causar incapacidade significativa.","","",""],"imgs":[],"par":1},{"id":"P81.19","prova":"P81","n":"19","key":"p:ecto","tema":"a3","seg":"s1","mod":"prova","enun":"A realização da ectoscopia pelo médico, durante o exame físico, é importante etapa para obter informações relevantes acerca do estado geral do paciente, sendo recomendada para todos os casos. Sobre esse assunto, considere as assertivas:\n1. Pode auxiliar a obter informações sobre a extensão da patologia de base e grau de comprometimento sistêmico.\n2. Pode auxiliar no encontro de achados gerais que contribuem para hipótese diagnóstica.\n3. Pode auxiliar na avaliação da evolução do quadro e resposta ao tratamento.\n4. Pode auxiliar a orientar condutas terapêuticas e propedêuticas.\nSão exemplos da importância da ectoscopia os itens listados nas assertivas:","cmd":"","alts":["1 e 2 apenas.","1 e 3 apenas.","1, 2 e 3.","Todas as assertivas (1 a 4) estão corretas."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: Todas as assertivas (1 a 4) estão corretas."],"imgs":[],"par":1},{"id":"P81.17","prova":"P81","n":"17","key":"p:levine","tema":"a9","seg":"s1","mod":"prova","enun":"Leia a assertiva abaixo: 'Nome dado e/ou sinal semiológico em que o paciente aponta a região precordial, com o punho cerrado e/ou com a mão em garra. Indicando assim, além do ponto doloroso, uma outra característica semiológica da dor em aperto. Sinal, esse, habitualmente descrito nos quadros em que a isquemia miocárdica é a condição subjacente.' Assinale a opção que indica o consagrado nome dado a esse sinal:","cmd":"","alts":["Sinal de Levine.","Sinal de Torres-Homem.","Sinal de Rivero-Carvallo.","Sinal de Homans."],"gab":0,"com":["<b>Comentário:</b> Gabarito A: Sinal de Levine.","","",""],"imgs":[],"par":1},{"id":"P81.14","prova":"P81","n":"14","key":"p:abd","tema":"a4","seg":"s3","mod":"prova","enun":"Na anamnese da dor abdominal, diferentes aspectos devem ser investigados para auxiliar na formulação de hipóteses diagnósticas. Sobre a caracterização da dor, assinale a alternativa correta:","cmd":"","alts":["A intensidade da dor é o atributo mais relevante, pois por si só permite distinguir entre dores funcionais e dores orgânicas.","A investigação da dor deve priorizar a localização e a irradiação, pois fatores desencadeantes ou de alívio raramente acrescentam informações.","A caracterização da dor abdominal envolve múltiplos aspectos, comumente conhecidos como 'atributos dos sintomas'. Sintomas, esses, idealmente interrogados após o relato livre do paciente, sem interrupções, e idealmente espontâneo.","O relato espontâneo do paciente possui menor valor que a anamnese médica dirigida por tratar-se de leigos."],"gab":2,"com":["","","<b>Comentário:</b> Gabarito C: Pesquisa dos atributos dos sintomas idealmente após relato livre espontâneo sem interrupções.",""],"imgs":[],"par":1},{"id":"P81.6","prova":"P81","n":"6","key":"p:cresc","tema":"a4","seg":"s3","mod":"prova","enun":"Paciente masculino, adolescente de doze anos de idade, comparece a consulta ambulatorial trazido pela mãe com queixa de dor localizada no membro inferior direito (especificamente na face anterior da perna direita); profunda e vaga; sem fatores de piora ou melhora observados; sem relação com os movimentos do membro; de intensidade variável ao longo do dia - intensidade média 5/10, pior no período noturno; iniciada há um mês e meio. Acerca desse quadro álgico (referente à dor), podemos afirmar:","cmd":"","alts":["trata-se de dor aguda.","trata-se de dor crônica.","trata-se de dor subaguda.","trata-se de dor protraída."],"gab":0,"com":["<b>Comentário:</b> Gabarito A: Trata-se de dor aguda (tempo de evolução < 3 meses).","","",""],"imgs":[],"par":1},{"id":"P81.4","prova":"P81","n":"4","key":"p:palha","tema":"a2","seg":"s4","mod":"prova","enun":"Paciente masculino, 40 anos de idade, informa tabagismo ativo desde os seus 15 anos de idade. Relata um consumo médio, estimado, de cerca de oito (08) cigarros de palha por dia. Qual é a carga tabágica desse paciente, em anos/maço?","cmd":"","alts":["25 anos/maço","50 anos/maço","75 anos/maço","100 anos/maço."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: 50 anos-maço.","",""],"imgs":[],"par":1},{"id":"P81.Atestado-Médico","prova":"P81","n":"Atestado Médico","key":"p:atestado","tema":"a1","seg":"s1","mod":"prova","enun":"Paciente apresenta atestado médico emitido pelo médico assistente declarando estar apto para musculação e natação ao exame clínico. Sobre o exposto, assinale a alternativa correta:","cmd":"","alts":["O médico responsável pelo atestado baseou-se em informações obtidas da anamnese e do exame físico e de um teste ergométrico para firmar o atestado.","O médico responsável pelo atestado baseou-se em informações obtidas exclusivamente da anamnese e do exame físico para firmar o atestado.","O médico responsável pelo atestado baseou-se em informações obtidas da anamnese, exame físico e eletrocardiograma (ECG) de 12 derivações.","O médico responsável pelo atestado baseou-se em anamnese, exame físico, ECG e Raio-X de tórax."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: Baseou-se exclusivamente da anamnese e do exame físico.","",""],"imgs":[],"par":1},{"id":"P81.20","prova":"P81","n":"20","key":"p:hpp","tema":"a2","seg":"s3","mod":"prova","enun":"Durante a coleta da História Patológica Pregressa (HPP), o estudante de medicina deve ter atenção aos elementos que fornecem dados relevantes sobre o estado de saúde atual e possíveis riscos futuros. Sobre a HPP, assinale a opção CORRETA:","cmd":"","alts":["Devem ser registrados apenas os diagnósticos que o paciente consegue relatar com precisão de data e tratamento, evitando incluir informações vagas.","Doenças da infância (como sarampo ou catapora) não devem constar na HPP, pois não apresentam impacto algum na vida adulta.","Antecedentes de internações hospitalares sem diagnóstico definido, não precisam ser relatados na HPP.","A HPP deve incluir doenças crônicas, cirurgias, alergias, internações e tratamentos prévios, mesmo que controlados ou aparentemente sem repercussão atual."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: Inclui doenças crônicas, cirurgias, alergias, internações e tratamentos prévios."],"imgs":[],"par":1},{"id":"P81.3","prova":"P81","n":"3","key":"p:nutri","tema":"a3","seg":"s2","mod":"prova","enun":"Na avaliação do estado nutricional de um paciente, durante o exame físico geral ou ectoscopia, analise as assertivas:\n1. Constatação de uma grande variação de peso (cerca de 5kg), em um curto período (menos de 24 horas), obtida pela pesagem do paciente.\n2. Evidente proeminência de relevos dos ossos da face, das extremidades dos membros e dos arcos costais.\n3. Alterações na coloração, brilho e textura da pele, cabelos e fâneros.\n4. Encontro de sarcopenia (diminuição/perda de massa muscular).\nPode-se afirmar que são parâmetros de avaliação do estado nutricional, obteníveis durante a ectoscopia, aqueles contidos nas assertivas:","cmd":"","alts":["1 e 2, apenas","1, 2 e 3.","3 e 4 apenas","2, 3 e 4."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: 2, 3 e 4."],"imgs":[],"par":1},{"id":"P81.7-Bônus","prova":"P81","n":"7 - Bônus","key":"p:dip","tema":"a4","seg":"s1","mod":"prova","enun":"Paciente de 26 anos agenda consulta com ginecologista devido à dor pélvica com duração de aproximadamente 30 dias. Relata que não tem parceiro fixo e apresentou relação desprotegida. Ao exame especular: secreção purulenta no colo do útero e, no toque vaginal, dor à mobilização do colo e anexos. Ultrassom normal. Para essa paciente, qual esquema antibiótico é o mais recomendado?","cmd":"","alts":["Ceftriaxona e amoxicilina.","Cefalexina e ciprofloxacino.","Ceftriaxona e azitromicina.","Clindamicina e metronidazol."],"gab":2,"com":["","","<b>Comentário:</b> Gabarito C: Ceftriaxona e azitromicina.",""],"imgs":[],"par":1},{"id":"P81.8","prova":"P81","n":"8","key":"p:colecisto","tema":"a4","seg":"s1","mod":"prova","enun":"Paciente de 48 anos, sexo feminino, obesa grau I, dor intensa em hipocôndrio direito há duas horas, contínua, náuseas e vômitos. Analgesia imediata com dipirona EV. USG evidencia cálculos na vesícula com um impactado no infundíbulo. Sobre a classificação da dor dessa paciente, é CORRETO afirmar:","cmd":"","alts":["A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como somática profunda.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada como nociceptiva.","A dor sentida no momento da administração da dipirona e da coleta de sangue pode ser classificada como psicogênica.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada referida."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: Dor nociceptiva.","",""],"imgs":[],"par":1},{"id":"P81.11","prova":"P81","n":"11","key":"p:exemplos","tema":"a4","seg":"s4","mod":"prova","enun":"Considere os exemplos: 1. Dor hemifacial esquerda, associada a disestesia, secundária ao zóster facial; 2. Dor no MSE concomitante a dor precordial em aperto no IAM; 3. Dor mesogástrica concomitante a dor na FID na apendicite. Qual(is) pode(m) ser classificado(s) como dor neuropática?","cmd":"","alts":["Apenas o item 1.","Apenas o item 2.","Apenas o item 3.","Os itens 1 e 3."],"gab":0,"com":["<b>Comentário:</b> Gabarito A: Apenas o item 1 (zóster facial).","","",""],"imgs":[],"par":1},{"id":"P81.16","prova":"P81","n":"16","key":"p:vertigem","tema":"a2","seg":"s1","mod":"prova","enun":"Paciente masculino, 35 anos, vertigem rotatória há 1 hora, zumbido unilateral à esquerda, hipoacusia ipsilateral, náuseas e vômitos. Analise os registros:\nI) RS - COONG (ouvidos): abaulamento, associado a coloração leitosa da membrana timpânica à otoscopia.\nII) RS - ABDOME/TGI: regular, fezes bem formadas, 1 evacuação a cada dois dias.\nIII) RS - TÓRAX/AR: tosse úmida persistente matinal há um mês.\nSão informações que poderiam fazer parte da anamnese desse paciente:","cmd":"","alts":["I e II.","Apenas I.","I e III.","II e III."],"gab":3,"com":["","","","<b>Comentário:</b> Gabarito D: II e III (otoscopia é exame físico)."],"imgs":[],"par":1},{"id":"P81.12","prova":"P81","n":"12","key":"p:soberana","tema":"a1","seg":"s1","mod":"prova","enun":"Da inscrição na camiseta abaixo, podemos fazer algumas considerações semiológicas:\n<i>(Camiseta com a inscrição: \"A CLÍNICA É SOBERANA\".)</i>\nAnalise as assertivas que se seguem e marque a alternativa que contém as assertivas corretas:\nI - A Clínica Médica é soberana e mais importante que as demais especialidades médicas.\nII - A clínica do paciente (anamnese e exame físico) é soberana, independente da especialidade.\nIII - O exame físico é soberano, uma vez que o paciente pode não saber contar a sua história durante a anamnese.","cmd":"","alts":["I e II.","II.","II e III.","Nenhuma das alternativas está correta."],"gab":1,"com":["","<b>Comentário:</b> Gabarito B: Apenas II está correta.","",""],"imgs":[],"par":1},{"id":"P80.1","prova":"P80","n":"1","key":"p:biotipo","tema":"a3","seg":"s2","mod":"prova","enun":"A análise e posterior registro de informações obtidas durante a ectoscopia fornecem importantes informações. Acerca do biotipo no paciente longilíneo, normolíneo e brevilíneo, como ilustrado pela figura abaixo:\nAnalise as assertivas:\nI) O ictus cordis pode sofrer variações de sua posição normal a depender do biotipo, sem necessariamente significar alteração patológica.\nII) Indivíduos longilíneos, notadamente jovens do sexo masculino, apresentam maior predisposição a apresentarem pneumotórax espontâneo.\nIII) A interpretação de exames de imagem (Raio X de tórax) deve levar em consideração o biotipo.\nAssinale a alternativa correta:","cmd":"","alts":["I","II e III","I, II e III","I e II"],"gab":2,"com":["","","<b>Comentário:</b> I, II e III.",""],"imgs":["biotipos"],"par":1},{"id":"P80.2","prova":"P80","n":"2","key":"p:levine","tema":"a9","seg":"s1","mod":"prova","enun":"Sinal semiológico em que o paciente aponta a região precordial com o punho cerrado e/ou com a mão em garra para indicar a dor em aperto da isquemia miocárdica. Assinale a opção que indica o consagrado nome dado a esse sinal:","cmd":"","alts":["Sinal de Levine.","Sinal de Torres-Homem.","Sinal de Rivero-Carvallo.","Sinal de Homans."],"gab":0,"com":["<b>Comentário:</b> Sinal de Levine.","","",""],"imgs":[],"par":1},{"id":"P80.3","prova":"P80","n":"3","key":"p:topicos2","tema":"a2","seg":"s3","mod":"prova","enun":"Analise as informações da anamnese:\n1 - Vacinação em dia;\n2 - Alérgico a camarão e frutos do mar;\n3 - Tabagista ativo (30 anos/maço);\n4 - Internado por três dias há um ano para tratamento de pneumonia.\nSão informações melhor registradas na História Patológica Pregressa (HPP):","cmd":"","alts":["apenas 1 e 2.","apenas 3 e 4.","apenas 1, 2 e 3.","apenas 1, 2 e 4."],"gab":3,"com":["","","","<b>Comentário:</b> apenas 1, 2 e 4 (o item 3, tabagismo, pertence aos Hábitos de Vida - HV)."],"imgs":[],"par":1},{"id":"P80.4","prova":"P80","n":"4","key":"p:adenoide","tema":"a3","seg":"s3","mod":"prova","enun":"Face alongada e magra; boca ligeiramente entreaberta; palato arqueado (ogival); retrognatismo mandibular; narinas elevadas; apinhamento dentário dos frontais. Os referidos achados podem ser encontrados no seguinte tipo facial:","cmd":"","alts":["Fácies adenoideana.","Fácies cushingoide","Fácies mixedematosa.","Fácies hipertireoidea."],"gab":0,"com":["<b>Comentário:</b> Fácies adenoideana.","","",""],"imgs":[],"par":1},{"id":"P80.5","prova":"P80","n":"5","key":"p:psico","tema":"a4","seg":"s4","mod":"prova","enun":"Acerca da dor psicogênica, assinale a alternativa correta:","cmd":"","alts":["Suspeita-se que seu substrato anatômico encontre-se em degeneração do córtex frontal via ressonância magnética.","Dor psicogênica e simulada são idênticas, diferindo apenas pelo benefício direto versus secundário.","Nos pacientes com dor psicogênica, diagnósticos de transtornos do humor costumam ser mais prevalentes que na população geral. Apesar da exclusão de causas orgânicas e ausência de substrato anatômico comprovável, os pacientes sofrem verdadeiramente com o quadro doloroso e frequentemente demandam atendimento multiprofissional.","Acredita-se que marcadores radioisotópicos definirão o substrato na Substância de Rolando no próximo biênio."],"gab":2,"com":["","","<b>Comentário:</b> Transtornos do humor, sofrimento real e demanda multiprofissional.",""],"imgs":[],"par":1},{"id":"P80.7","prova":"P80","n":"7","key":"p:cianose","tema":"a11","seg":"s1","mod":"prova","enun":"Acerca da cianose habitualmente pesquisada em mucosas e extremidades, é correto afirmar:","cmd":"","alts":["é dado sensível e precoce para hipoxemia, por instalar-se quando os níveis de desoxihemoglobina atingem apenas 2%.","a cianose central costuma não responder a oferta de oxigênio suplementar.","não existe cianose fisiológica; toda cianose exige gasometria.","um exemplo de cianose segmentar e periférica é aquela decorrente de complicações no retorno venoso de um segmento corporal."],"gab":3,"com":["","","","<b>Comentário:</b> Cianose segmentar periférica em estase/trombose venosa."],"imgs":[],"par":1},{"id":"P80.8","prova":"P80","n":"8","key":"p:cresc","tema":"a4","seg":"s3","mod":"prova","enun":"Menino de 12 anos com dor localizada nos membros inferiores, profunda e vaga, intensidade média 5/10, pior à noite, iniciada há 1 mês e meio. Hipótese de dor de crescimento. Acerca da classificação temporal da evolução do quadro doloroso:","cmd":"","alts":["trata-se de dor aguda.","Trata-se de dor crônica.","Trata-se de dor somática","Trata-se de dor nociceptiva."],"gab":0,"com":["<b>Comentário:</b> Trata-se de dor aguda (tempo de evolução inferior a 3 meses).","","",""],"imgs":[],"par":1},{"id":"P80.9","prova":"P80","n":"9","key":"p:atestado","tema":"a1","seg":"s1","mod":"prova","enun":"Atestado médico de William Harvey, 37 anos, atestando que 'não apresenta ao exame clínico sintomas e/ou sinais de doenças...', apto para musculação e natação. Pode-se inferir que:","cmd":"","alts":["o médico baseou-se em anamnese, exame físico e eletrocardiograma.","o médico errou em basear-se apenas no exame clínico e deveria aguardar ECG e espirometria.","o médico baseou-se em anamnese, exame físico, ECG, sorologia e teste ergométrico.","o médico que assinou o atestado baseou-se em informações obtidas na anamnese e no exame físico para firmar a impressão de aptidão física do paciente."],"gab":3,"com":["","","","<b>Comentário:</b> Baseou-se na anamnese e no exame físico."],"imgs":[],"par":1},{"id":"P80.10","prova":"P80","n":"10","key":"p:tep","tema":"a4","seg":"s2","mod":"prova","enun":"Mulher de 21 anos, usuária de anticoncepcional oral, com dor torácica ventilatório-dependente à direita, dispneia e dor no ombro direito. Confirmada suspeita de TEV/TEP subsegmentar com acometimento de pleura diafragmática. Acerca da dor localizada no ombro direito da paciente é correto afirmar:","cmd":"","alts":["Pode ser classificada como dor aguda irradiada.","Deve-se, mais provavelmente, a posição desconfortável no tomógrafo.","Pode ser classificada como dor aguda referida.","Trata-se de fator de confusão."],"gab":2,"com":["","","<b>Comentário:</b> Pode ser classificada como dor aguda referida.",""],"imgs":[],"par":1},{"id":"P80.11","prova":"P80","n":"11","key":"p:joelho","tema":"a4","seg":"s3","mod":"prova","enun":"Torção de joelho direito há 2 dias no futebol, dor latejante aliviada por repouso e imobilização, pior ao subir escadas. Suspeita e confirmação de lesão ligamentar. Acerca da dor relatada pelo paciente, podemos afirmar:","cmd":"","alts":["Pode ser classificada como dor aguda, somática profunda.","dor aguda, somática superficial.","dor aguda, visceral.","dor subaguda, somática superficial."],"gab":0,"com":["<b>Comentário:</b> Dor aguda, somática profunda.","","",""],"imgs":[],"par":1},{"id":"P80.12","prova":"P80","n":"12","key":"p:qp","tema":"a1","seg":"s3","mod":"prova","enun":"Sobre a grafia ou registro da Queixa Principal (QP):\nI) Grafada sempre que possível nas próprias palavras do paciente.\nII) Em caso de múltiplas, eleger apenas uma.\nIII) Preferir termos técnicos.\nIV) Preferir sentenças longas.\nAssinale a alternativa correta:","cmd":"","alts":["Apenas a assertiva I está correta.","Apenas a assertiva III.","Apenas a assertiva IV.","Todas as assertivas."],"gab":0,"com":["<b>Comentário:</b> Apenas a assertiva I está correta.","","",""],"imgs":[],"par":1},{"id":"P80.13","prova":"P80","n":"13","key":"p:nutri","tema":"a3","seg":"s2","mod":"prova","enun":"Parâmetros de avaliação do estado nutricional durante a ectoscopia:\n1. Variação de 5kg em <24h;\n2. Proeminência de relevos ósseos;\n3. Alterações na coloração, brilho e textura de pele e fâneros;\n4. Sarcopenia.\nPode-se afirmar que são parâmetros nutricionais na ectoscopia aqueles contidos em:","cmd":"","alts":["1 e 2, apenas","1, 2 e 3.","3 e 4, apenas","2, 3 e 4."],"gab":3,"com":["","","","<b>Comentário:</b> 2, 3 e 4."],"imgs":[],"par":1},{"id":"P80.14","prova":"P80","n":"14","key":"p:fp55","tema":"a8","seg":"s1","mod":"prova","enun":"Registro do prontuário: 'FP: 55 ppm; FR: 16 irpm; PA 130/90; TAX 36,8°C'. Acerca da frequência de pulso encontrada, marque a alternativa correta:","cmd":"","alts":["Pode-se afirmar que o paciente está bradicárdico, pois < 60 bpm.","Não se pode afirmar bradicardia por possíveis fatores não patológicos.","É incorreto utilizar o termo bradicardia neste caso, tendo em vista que o dado vital aferido aponta para a palpação do pulso (ppm).","Não existe distinção prática entre pulso e FC."],"gab":2,"com":["","","<b>Comentário:</b> É incorreto utilizar o termo bradicardia neste caso (o termo correto para pulso periférico em ppm é bradisfigmia).",""],"imgs":[],"par":1},{"id":"P80.15","prova":"P80","n":"15","key":"p:topicos","tema":"a2","seg":"s3","mod":"prova","enun":"Anamnese: 1. Vacinação em dia; 2. Não tabagista, sedentário; 3. Pai falecido de morte súbita aos 54 anos; 4. Nega tosse, dispneia e dor torácica. Assinale a correlação correta:","cmd":"","alts":["1-HPP; 2-HV; 3-HF; 4-HMA.","1-HPP; 2-HV; 3-HF; 4-RS","1-HSC; 2-HV; 3-HF; 4-RS","1-HPP; 2-HV; 3-HSC; 4-RS"],"gab":1,"com":["","<b>Comentário:</b> 1-HPP; 2-HV; 3-HF; 4-RS.","",""],"imgs":[],"par":1},{"id":"P80.16","prova":"P80","n":"16","key":"p:colecisto","tema":"a4","seg":"s1","mod":"prova","enun":"Mulher de 48 anos, obesa grau I, dor intensa contínua em HD há 2 horas, vômitos, cálculo no infundíbulo vesicular. Sobre a classificação das dores dessa paciente:","cmd":"","alts":["A dor sentida na administração de dipirona e coleta de sangue é somática profunda.","A dor abdominal no hipocôndrio direito, iniciada há duas horas, pode ser classificada como nociceptiva.","A dor na dipirona é psicogênica.","A dor no HD é referida."],"gab":1,"com":["","<b>Comentário:</b> A dor abdominal no HD é nociceptiva.","",""],"imgs":[],"par":1},{"id":"P80.17","prova":"P80","n":"17","key":"p:ouvido","tema":"a2","seg":"s1","mod":"prova","enun":"Paciente buscou atendimento com queixa de plenitude auricular e zumbido ('ouvido esquerdo cheio'). Dentre as informações abaixo, assinale aquela que poderia compor a Anamnese Especial (AE/RS/IS):","cmd":"","alts":["Bom estado geral, bom estado nutricional, afebril no campo 'sintomas sistêmicos'.","Presença de rolha de cerume no conduto auditivo externo esquerdo no campo 'COONG'.","Hábito intestinal constipado com evacuação a cada 4-5 dias, fezes endurecidas, no campo 'abdome/trato gastrointestinal'.","Deformidade em varo dos joelhos e marcha claudicante no campo 'aparelho locomotor'."],"gab":2,"com":["","","<b>Comentário:</b> O hábito intestinal é um sintoma investigado na RS (TGI). Cerume, BEG e deformidade/marcha são do exame físico.",""],"imgs":[],"par":1},{"id":"P80.18","prova":"P80","n":"18","key":"p:atipica","tema":"a3","seg":"s3","mod":"prova","enun":"Termo médico consagrado habitualmente utilizado para designar a fácies do paciente não sindrômico (fácies 'normal'):","cmd":"","alts":["Fácies eutrófica ou compósita.","Fácies atípica ou incaracterística.","Fácies normalis ou normala.","Normoface ou normaliface."],"gab":1,"com":["","<b>Comentário:</b> Fácies atípica ou incaracterística.","",""],"imgs":[],"par":1},{"id":"P80.19","prova":"P80","n":"19","key":"p:sifilis","tema":"a3","seg":"s3","mod":"prova","enun":"Nariz em sela, fronte olímpica, dentes de Hutchinson e mandíbula prognata caracterizam habitualmente qual tipo de fácies?","cmd":"","alts":["Atípica.","Normolínea.","Adenoidiana.","Sifilítica (ou Luética)."],"gab":3,"com":["","","","<b>Comentário:</b> Sifilítica (ou Luética)."],"imgs":[],"par":1},{"id":"P80.20","prova":"P80","n":"20","key":"p:rsass","tema":"a2","seg":"s1","mod":"prova","enun":"Sobre a Revisão Sintomatológica (RS) ou Antecedentes Pessoais (AP):\nI) Deve ser realizada no sentido crânio-caudal e por aparelhos, antecedida por sintomas gerais.\nII) O estado geral ('BEG' / 'MEG') é melhor registrado no início da AE.\nIII) Quando o paciente referir um sintoma na AE, devemos caracterizá-lo com seus atributos.\nSão corretas:","cmd":"","alts":["I, apenas.","II, apenas.","I e III, apenas.","Todas as assertivas."],"gab":2,"com":["","","<b>Comentário:</b> I e III apenas (a assertiva II está errada porque BEG/MEG pertence ao exame físico).",""],"imgs":[],"par":1},{"id":"P80.21","prova":"P80","n":"21","key":"p:aereg","tema":"a2","seg":"s1","mod":"prova","enun":"Sobre o registro da Anamnese Especial (AE):\nI) Realizada no sentido crânio-caudal precedida de sintomas gerais.\nII) Ao referir sintoma, caracterizá-lo com início, duração, fatores de alívio e piora.\nIII) Em caso de resposta negativa, preferir registrar os sintomas negados (ex: 'Nega otalgia, nega zumbido') evitando siglas como 'NDN'.\nAssinale a alternativa correta:","cmd":"","alts":["Todas as opções (I, II e III) estão corretas.","Apenas a alternativa III.","Apenas I e III.","Apenas I e II."],"gab":0,"com":["<b>Comentário:</b> Todas as opções (I, II e III) estão corretas.","","",""],"imgs":[],"par":1},{"id":"P80.22","prova":"P80","n":"22","key":"p:topicos3","tema":"a2","seg":"s3","mod":"prova","enun":"Informações de aluno: I) Pai faleceu de IAM aos 54 anos; II) Vacinação em dia sem cartão; III) Dor na região posterior do tórax contínua pior à tosse; IV) Natural e residente em BH. Assinale a opção que melhor relaciona aos campos corretos:","cmd":"","alts":["I - HPP; II - HF; III - QP; IV - Identificação.","I - HPP; II - HF; III - Identificação; IV - HMA.","I - HF; II - HMA; III - HPP; IV - Identificação.","I - HF; II - HPP; III - HMA; IV - Identificação."],"gab":3,"com":["","","","<b>Comentário:</b> I-HF; II-HPP; III-HMA; IV-Identificação. Minha Revisão Personalizada & Painel de Erros Painel Dinâmico de Desempenho • Semiologia Médica I • CMMG Como Funciona este Painel: Conforme você resolve os quizzes ao longo das aulas e os simulados das provas antigas, o sistema armazena suas respostas e compila automaticamente nesta aba: Todas as questões que você errou para você refazer até gabaritar; Todos os trechos que você grifou pessoalmente em rosa usando o marca-texto interativo; Seu percentual de acerto acumulado e prontidão para a prova parcial. Fila de Revisão de Erros (Spaced Repetition) Revise abaixo os itens onde você teve hesitação ou marcou uma alternativa incorreta: Nenhuma questão respondida ainda. Inicie seus estudos pelos módulos ou faça os simulados! Meus Trechos Grifados Pessoalmente (Rosa) Seus apontamentos destacados durante a leitura das aulas: Nenhum trecho grifado pessoalmente ainda. Para grifar, basta selecionar qualquer texto em qualquer aula e clicar no botão flutuante '🖍️ Grifar de Rosa' !"],"imgs":[],"par":1},{"id":"EDS.1","prova":"EDS","n":"1","key":"C10","tema":"a12","seg":"s5","mod":"prova","enun":"A inspeção, palpação, percussão e ausculta são importantes ferramentas na semiotécnica do aparelho respiratório. Em um paciente portador pneumotórax à esquerda, alguns achados semiológicos são esperados no lado acometido, durante o exame físico do aparelho respiratório/tórax. Os achados esperados no lado do pneumotórax, referentes a palpação (frêmito toracovocal - FTV), percussão e ausculta para este paciente são, respectivamente:","cmd":"Assinale a alternativa correta.","alts":["FTV aumentado, percussão maciça e sopro tubário na ausculta","FTV diminuído, percussão submaciça e ausculta abolida ou diminuída","FTV diminuído, percussão timpânica e ausculta abolida ou diminuída","FTV normal, percussão hipersonora e estertores crepitantes"],"gab":2,"com":["FTV aumentado, macicez e sopro tubário são da consolidação (pneumonia).","Percussão submaciça é do derrame pleural (líquido); no pneumotórax há ar e o som é timpânico.","<b>Justificativa oficial:</b> Espera-se no lado acometido pelo pneumotórax: expansibilidade (manobra de pesquisa da capacidade de expansão) reduzida, FTV reduzido, pelo isolamento acústico causado pelo ar na cavidade pleural, percussão timpânica - característica acústica da percussão de estruturas com ar subjacente, ausculta diminuída ou abolido, pelo isolamento acústico causado pelo ar na cavidade pleural. O pneumotórax atua como um \"isolante\" acústico.","O ar na pleura isola o som: o FTV diminui e não há estertores."],"imgs":[],"par":1,"alr":1},{"id":"EDS.2","prova":"EDS","n":"2","key":"C27","tema":"a12","seg":"s5","mod":"prova","enun":"Paciente feminina, 47 anos, diagnóstico de neoplasia mamária diagnóstica e tratada há 03 anos (cirurgia e quimioterapia). Desde então, em controle regular com o oncologista e ginecologista assistente. Procura pronto-atendimento médico em função de dispneia iniciada na tarde de ontem, mas que progrediu durante as últimas 06 horas. O médico do pronto-atendimento, após a realização do exame clínico detalhado, estabeleceu como hipóteses diagnósticas principais:\n1. derrame pleural à direita, de etiologia neoplásica (neoplasia mamária primária com metástase pleural)?;\n2. derrame pleural à direita, de etiologia tromboembólica? O Raio X realizado de tórax confirmou a presença do volumoso derrame pleural à direita. Acerca do exame físico dessa paciente, analise as seguintes assertivas.\nI) Espera-se encontrar uma expansibilidade torácica reduzida no lado acometido.\nII) Espera-se encontrar um frêmito toracovocal reduzido no lado acometido.\nIII) Espera-se encontrar um percussão submaciça no lado acometido.\nIV) Espera-se encontrar sons respiratório diminuídos ou abolidos no lado acometido.","cmd":"Estão corretas as assertivas.","alts":["I, II e III.","II, III e IV.","I e IV.","I, II, III e IV."],"gab":3,"com":["Falta a IV: o líquido é isolante acústico e reduz os sons respiratórios.","Falta a I: o hemitórax com líquido expande menos.","Faltam a II e a III: o FTV cai e a percussão fica submaciça.","<b>Justificativa oficial:</b> Espera-se encontrar uma redução da expansibilidade (manobra de palpação) no lado acometido, em função do derrame pleural existente, a menor capacidade do tórax em acomodar um volume de ar pelo preenchimento prévio da cavidade com líquido, levando a limitação dos movimentos (expansibilidade) no hemitórax acometido. Espera-se encontrar frêmito toracovocal e sons respiratórios diminuídos/abolidos, pois o derrame pleural atua como um isolante acústico, tanto para a palpação (frêmito), quanto para ausculta. Espera-se encontrar uma percussão com som submaciço."],"imgs":[],"par":1,"alr":1},{"id":"EDS.3","prova":"EDS","n":"3","key":"C59","tema":"a12","seg":"s6","mod":"prova","enun":"O diagnóstico sindrômico pode auxiliar na construção do diagnostico etiológico (ou nosológico) específico. Citam-se, como exemplos, as diversas afecções abdominais que podem ser categorizadas, inicialmente, em síndromes (abdome obstrutivo, abdome inflamatório, abdome perfurativo e abdome vascular), para posterior diagnóstico da patologia de base. Acerca do diagnóstico geral ou sindrômico das afecções respiratórias, a ASMA é classificada como uma doença:","cmd":"","alts":["restritiva.","obstrutiva.","parenquimatosa.","mista, obstrutiva e restritiva."],"gab":1,"com":["A asma limita o fluxo expiratório; não reduz o volume pulmonar.","<b>Justificativa oficial:</b> A ASMA é uma condição inflamatória crônica, com períodos de exacerbação, caracterizada pela obstrução (notadamente ao fluxo expiratório ) das vias aéreas.","A asma é doença das vias aéreas, não do parênquima.","Na asma o padrão é obstrutivo."],"imgs":[],"par":1,"alr":1},{"id":"EDS.4","prova":"EDS","n":"4","key":"C33","tema":"a12","seg":"s4","mod":"prova","enun":"Em um paciente hígido (saudável) esperamos encontrar o seguinte som à ausculta pulmonar e considerá-lo normal, a depender do sítio torácico examinado.","cmd":"Assinale a alternativa correta.","alts":["Som broncovesicular.","Som claro pulmonar.","Som timpânico.","Som maciço."],"gab":0,"com":["<b>Justificativa oficial:</b> Som broncovesicular é som de ausculta, que pode ser considerado normal a depender do sítio examinado. Os demais sons, embora possam ser considerados normais - a dependente do sítio examinado, referem-se a sons produzido pela percussão torácica e não à ausculta.","Claro pulmonar é normal, mas é som de percussão, não de ausculta.","Timpânico é som de percussão (normal sobre o espaço de Traube).","Maciço é som de percussão (normal sobre o fígado)."],"imgs":[],"par":1,"alr":1},{"id":"EDS.5","prova":"EDS","n":"5","key":"C16","tema":"a12","seg":"s6","mod":"prova","enun":"Tórax em tonel, tosse diária produtiva e volumosa, cianose facial e dispneia crônica progressiva (de instalação gradativa durante anos). Qual padrão sindrômico respiratório, e qual fenótipo melhor representariam os sinais e sintomas acima listados?","cmd":"","alts":["Síndrome obstrutiva. Fenótipo \"soprador rosa\".","Síndrome obstrutiva. Fenótipo \"congesto azulado\".","Síndrome restritiva. Fenótipo \"congesto azulado\".","Síndrome restritiva. Fenótipo \"soprador rosa\"."],"gab":1,"com":["O soprador rosa é emagrecido, rosado e tem pouca secreção (predomina enfisema); o caso tem cianose e tosse produtiva diária.","<b>Justificativa oficial:</b> Os sintomas descritos estão classicamente relacionados às síndromes obstrutivas (DPOC, notadamente). Dentre os extremos fenotípicos das DPOC(s) temos o padrão \"soprador rosa\", que cursa com tonalidade de pele rósea, diminuição do panículo adiposo, sarcopenia e \"pouca\" cogestão (secreção), pois predomina o enfisema (doença parenquimatosa). O \"congesto azulado\" descreve justamente a cianose (azulado) e a congestão (secretivo - bronquitico). Ambas classificadas com doenças funcionalmente obstrutivas, sendo o soprador rosa portador de uma afecção predominantemente parenquimatosa (enfisema), e o congesto azulado portador de uma afecção predominantemente das vias respiratórias. Atente-se que, na prática, habitualmente encontramos graus intermediários entre esses extremos fenotípicos, associando enfisema (parênquima) e obstrução inflamatória (vias aéreas) em diferentes níveis.","Tórax em tonel, tosse produtiva e dispneia de anos são de doença obstrutiva (DPOC), não restritiva.","Errada nas duas partes: o padrão é obstrutivo, e a cianose com secreção define o congesto azulado."],"imgs":[],"par":1,"alr":1},{"id":"EDS.6","prova":"EDS","n":"6","key":"C17","tema":"a12","seg":"s6","mod":"prova","enun":"A ASMA é definida como uma doença inflamatória crônica das vias aéreas, com períodos agudos de exacerbação, caracterizados por broncoespasmo e exacerbação inflamatória. Analise a seguinte afirmações:\n1) tosse crônica, exacerbada nos períodos noturnos/madrugada;\n2) dispneia de instalação aguda e autopercepção de \"chieira\" torácica, nos período de exacerbação;\n3) instalação e progressão lenta da obstrução das vias aéreas, permitindo a adaptação gradual do paciente ao novo estado patológico e a subvalorização de sintomas, retardando a procura do paciente ao médico assistente, muitas vezes por anos. Razão pela qual a procura por assistência ocorre quando a doença encontra-se em fases avançadas.","cmd":"Assinale a opção que contêm as afirmações pertinentes a ASMA.","alts":["As afirmações 1 e 2 estão corretas.","As afirmações 1, 2 e 3 estão corretas.","As afirmações 2 e 3 estão corretas.","Apenas a afirmação 3 está correta."],"gab":0,"com":["<b>Justificativa oficial:</b> Os períodos de agudização na ASMA são súbitos, levando o paciente a um novo grau de obstrução das vias aéreas, sem tempo hábil para o paciente se adaptar ao novo estado. Os pacientes costumam procurar assistência imediata durante as crise agudas. Cabendo ao médico o entendimento que trata-se de doença crônica, devendo estar atento que, para além do tratamento da crise aguda, há a necessidade de avaliar o tratamento da doença crônica.","A 3 descreve a DPOC: na asma a agudização é súbita e o paciente procura ajuda na hora.","A 3 é da DPOC, de progressão lenta e procura tardia.","A 3 não descreve asma."],"imgs":[],"par":1,"alr":1},{"id":"EDS.7","prova":"EDS","n":"7","key":"C42","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole) estamos contribuindo com a construção do raciocínio clínico. Aponte a localização esperada no ciclo cardíaco do seguinte achado auscultatório: quarta bulha cardíaca (B4).","cmd":"","alts":["Localizada na diástole, na fase de enchimento rápido.","Localizada na sístole, logo após o fechamento das valvas AV.","Localizada entre B1 e B2, coincidente com a ejeção ventricular.","Localizada na fase pré-sistólica, coincidente com a contração atrial."],"gab":3,"com":["Diástole com enchimento rápido é a posição da B3.","A B4 vem antes da B1, não depois.","Entre B1 e B2 é sístole; a B4 é telediastólica.","<b>Justificativa oficial:</b> B4 relaciona-se a sobrecarga pressórica, podendo ser auscultada no final da diástole (coincidente com a contração atrial), no período -também- denominado de fase pré- sistólica (ainda na diástole). Relaciona-se a sobrecarga pressóricas."],"imgs":[],"par":1,"alr":1},{"id":"EDS.8","prova":"EDS","n":"8","key":"C18","tema":"a6","seg":"s2","mod":"prova","enun":"Ao relacionarmos determinado achado do exame físico do aparelho cardiovascular (ACV) com as fases do ciclo cardíaco (sístole e/ou diástole) estamos contribuindo para a construção do raciocínio clínico. Aponte a localização esperada, no ciclo cardíaco, do seguinte achado auscultatório: terceira bulha cardíaca (B3).","cmd":"","alts":["Localizada na fase pré-sistólica, coincidente com a contração atrial.","Localizada na sístole, logo após a primeira bulha.","Localizada na diástole, na fase de enchimento rápido.","Localizada no final da sístole, antes da segunda bulha."],"gab":2,"com":["Pré-sistólica, com a contração atrial, é a posição da B4.","B3 é diastólica; logo após B1 fica o clique de ejeção.","<b>Justificativa oficial:</b> B3 relaciona-se a sobrecarga volumétrica, podendo ser auscultada no início da diástole. Na fase denominada de enchimento ventricular rápido.","O final da sístole antecede B2; a B3 vem depois de B2."],"imgs":[],"par":1,"alr":1},{"id":"EDS.9","prova":"EDS","n":"9","key":"C3","tema":"a7","seg":"s3","mod":"prova","enun":"A manobra de Rivero Carvallo consiste, de forma sumária, na realização da ausculta cardíaca em um foco de ausculta específico. Durante sua realização, o médico solicita ao paciente que proceda uma inspiração profunda, seguida de apneia mantida por alguns segundos, enquanto o examinador avalia eventuais alterações de intensidade do sopro. Acerca da manobra de Rivero Carvallo, assinale a alternativa que traz informações corretas sobre o foco de ausculta, o defeito valvar quando a manobra é dita positiva (aumento da intensidade do sopro) e o tipo de sopro encontrado.","cmd":"","alts":["Foco mitral, insuficiência mitral, sopro sistólico.","Foco tricúspide, insuficiência tricúspide, sopro sistólico.","Foco pulmonar, estenose pulmonar, sopro diastólico.","Foco aórtico, insuficiência aórtica, sopro diastólico."],"gab":1,"com":["Na insuficiência mitral o sopro não muda com a manobra (manobra negativa); e o foco é o tricúspide.","<b>Justificativa oficial:</b> A manobra de Rivero Carvallo é utilizada para diferenciar sopros causas pela insuficiência tricúspide da insuficiência mitral - ambos, sopros sistólicos. Com o receptor do estetoscópio no foco tricúspide, durante a inspiração forçada, espera-se (com a manobra) que os sopros da Insuficiência tricúspide aumentem de intensidade. A manobra, neste caso, é dita positiva. Nos casos de insuficiência mitral, espera-se que o sopro não mude de intensidade durante a manobra (manobra negativa).","A manobra é feita no foco tricúspide, e a estenose pulmonar dá sopro sistólico, não diastólico.","A insuficiência aórtica não é o alvo da manobra, que diferencia IT de IM no foco tricúspide."],"imgs":[],"par":1,"alr":1},{"id":"EDS.10","prova":"EDS","n":"10","key":"C4","tema":"a6","seg":"s1","mod":"prova","enun":"Considerando o desdobramento invertido - até recentemente denominado de paradoxal - da segunda bulha (B2), analise as seguintes assertivas.\n1. O desdobramento ocorre na fase expiratória.\n2. O Bloqueio completo de Ramo Esquerdo (BRE) é uma possível causa de desdobramento invertido de B2.\n3. O desdobramento é persistente (in e expiratório), porém mais intenso na expiração.\n4. Não há variação com a fase respiratória, pois a causa do desdobramento é meramente elétrica (relacionada ao sistema de condução).","cmd":"Assinale a opção que contém a(s) assertiva(s) correta(s) acerca do desdobramento invertido de B2.","alts":["As alternativas 1 e 2 estão corretas.","As alternativas 1, 2 e 3 estão corretas.","As alternativas 2 e 4 estão corretas.","As alternativas 3 e 4 estão corretas."],"gab":0,"com":["<b>Justificativa oficial:</b> O BRE pode levar a um atraso na estimulação elétrica do coração esquerdo, retardando os fenômenos relacionados a ele. O componente valvar aórtico pode estar retardado em relação ao fechamento do componente valvar pulmonar no BRE, a ponto de ocorrer depois dele (desdobramento invertido). Fenômeno melhor percebido na fase expiratória (paradoxal, em relação ao desdobramento dito fisiológico, que é percebido na inspiração). Durante a fase inspiratória, devido ao aumento do retorno venoso, pode ocorrer um retardo (atraso) no fechamento do componente pulmonar, fazendo que ele se funda (temporalmente) com o componente aórtico, levando o examinador a perceber uma segunda bulha única.","A 3 está errada: na inspiração P2 atrasa, funde-se com A2 e a B2 fica única; o invertido não é persistente.","A 4 está errada: o invertido varia com a respiração (aparece na expiração e some na inspiração).","As duas estão erradas: não é persistente e varia com a respiração."],"imgs":[],"par":1,"alr":1},{"id":"EDS.11","prova":"EDS","n":"11","key":"C30","tema":"a8","seg":"s1","mod":"prova","enun":"Durante a realização do exame físico de um paciente sob seus cuidados, especificamente na etapa de aferição dos dados vitais, você encontrou uma frequência de pulso (FP) de repouso de 50 ppm (pulsações por minuto). A pressão arterial, a frequência respiratória e a temperatura axilar encontravam-se normais. Você considerou, inicialmente, como possíveis causas para esse achado (FP=50 ppm) o uso de medicação betabloqueadora para controle da hipertensão arterial, associado ao hábito relatado pelo paciente de realizar atividades físicas frequentes e de forma regular, obtidas durante a anamnese. Acerca da frequência de pulso desse paciente pode-se afirmar:","cmd":"","alts":["é correto utilizar o termo bradicardia neste caso, tendo em vista que frequência de pulso e frequência cardíaca são termos sinônimos na prática clínica diária.","é correto utilizar o termo bradisfigmia neste caso apenas se houver dissociação pulso-ausculta, tendo em vista que o pulso foi aferido em pulsações por minuto.","é incorreto utilizar o termo bradicardia neste caso, tendo em vista que o dado vital foi aferido pelo pulso (ppm), e não pela palpação ou ausculta dos batimentos cardíacos (bpm).","é incorreto considerar a frequência baixa neste caso, tendo em vista que, em quem pratica atividade física regular, o limite inferior normal do pulso de repouso é de 40 ppm."],"gab":2,"com":["FC (bpm) e FP (ppm) são fenômenos diferentes; a dissociação pulso-ausculta mostra por quê.","Bradisfigmia é qualquer FP abaixo de 60 ppm, com ou sem dissociação pulso-ausculta.","<b>Justificativa oficial:</b> A nomenclatura correta dependerá da sede em que foi feita a aferição - pulso? ausculta cardíaca? palpação do ictus, p.e.? Frequência cardíaca (FC) é medida por batimentos por minuto (bpm). Esfigmico é relativo ao pulso e é medido pelo número de pulsações por minuto (ppm). FC - bpm. FP - ppm. A importância desta diferenciação vai além da estritamente conceitual e, quase intuitiva, de que pulso é um fenômeno físico distinto de batimento, embora na maioria absoluta da população seus valores numéricos realmente sejam equivalentes ou iguais, e que fisiologicamente são inter-relacionados - o pulso depende de um batimento eficaz para ser produzido. A dissociação \"pulso-ausculta\" (número de pulsações diferente do número de batimentos), achado importante para suspeição e/ou diagnóstico de algumas arritmias é um - dentre outros - exemplo da importância prática dessa distinção. Indo além de um suposto preciosismo léxico da nomenclatura médica.","A faixa de normalidade usada na prova é 60 a 100; 50 ppm é bradisfigmia, mesmo que explicada pelo betabloqueador e pelo treino."],"imgs":[],"par":1,"alr":1},{"id":"EDS.12","prova":"EDS","n":"12","key":"C56","tema":"a10","seg":"s2","mod":"prova","enun":"Acerca da síncope vasovagal pode-se afirmar.","cmd":"Assinale uma opção.","alts":["Habitualmente os pacientes apresentam severas lesões de extremidades e contusões graves.","Habitualmente são precedidas de dor torácica de forte intensidade e palpitações.","Habitualmente os pacientes não se queixam de sintomas precedendo o quadro sincopal.","Habitualmente a presença de sintomas prodrômicos permitem um esboço de defesa."],"gab":3,"com":["Lesões graves por queda sem defesa sugerem síncope cardíaca, sem pródromos.","Dor torácica forte e palpitações antes da síncope são alarme de causa cardíaca.","Na vasovagal há pródromos (sudorese, palidez, visão turva); ausência de sintomas é da cardíaca.","<b>Justificativa oficial:</b> Habitualmente, a presença de presença de sintomas pré-sincopais (antecedendo o quadro sincopal em segundos) permite um esboço de defesa (encostar em uma parede, assentar- se etc.), podendo minimizar fraturas e contusões. Justificativa do gabarito Habitualmente, a presença de presença de sintomas pré-sincopais (antecedendo o quadro sincopal em segundos) permite um esboço de defesa (encostar em uma parede, assentar- se etc.), podendo minimizar fraturas e contusões."],"imgs":[],"par":1},{"id":"EDS.13","prova":"EDS","n":"13","key":"C2","tema":"a10","seg":"s4","mod":"prova","enun":"Síncope pode ser definida como a perda súbita e transitória da consciência e do tônus muscular postural, podendo ser manifestação comum em diversas patologias - desde causas benignas e transitórias até afecções potencialmente graves. Assim, todo episódio sincopal merece avaliação médica atenciosa e cuidadosa. Na avaliação de um paciente que sofreu um quadro de síncope alguns achados da anamnese e do exame físico podem sugerir uma potencial etiologia cardíaca como causa de base para o episódio. Analise as seguintes assertivas.\n1. Ausência de pródromos ou gatilhos detectáveis.\n2. Presença de lesões traumáticas na face e/ou de extremidades ósseas, denotando ausência de qualquer esboço de defesa.\n3. Relato de ortostatismo por tempo prolongado precedendo o episódio sincopal, em individuo jovem (adolescente /adulto jovem) previamente hígido.\n4. Histórico de cardiopatia de base conhecida pelo médico e paciente. São considerados sinais e/ou sintomas de alarme/alerta para uma potencial patologia cardíaca de base as assertivas.","cmd":"Assinale uma opção.","alts":["1, 2 e 4.","1, 2, 3 e 4.","2, 3 e 4.","1 e 3."],"gab":0,"com":["<b>Justificativa oficial:</b> O ortostatismo prolongado em paciente jovem saudável sugere, ou é mais comum, em quadros sincopais de etiologia vasovagal.","A assertiva 3 descreve o gatilho típico da síncope vasovagal (reflexa), que é benigna.","A assertiva 3 é o cenário clássico da síncope vasovagal, não de causa cardíaca.","Falta a 2 e a 4, que são alarmes; e a 3 aponta para causa reflexa, não cardíaca."],"imgs":[],"par":1,"alr":1},{"id":"EDS.14","prova":"EDS","n":"14","key":"C23","tema":"a7","seg":"s2","mod":"prova","enun":"Considerando os principais sinais e sintomas da estenose Aórtica, analise as seguintes assertivas:\nI) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar sintomas de dor cardíaca isquêmica.\nII) Em função da dificuldade de adaptação a novas demandas metabólicas em órgãos alvo, o paciente pode queixar-se de sensação de escurecimento visual e sensação pré-sincopal.\nIII) Em função da hipertrofia ventricular compensatória, o paciente pode apresentar ictus propulsivo.\nIV) Em função da lesão valvar, espera-se encontrar, à ausculta, um sopro diastólico ejetivo melhor audível o foco aórtico.","cmd":"Assinale a opção que contém as assertivas corretas.","alts":["Estão corretas as assertivas I, II, III e IV.","Estão corretas as assertivas II e IV.","Estão corretas as assertivas I, II, III.","Estão corretas
