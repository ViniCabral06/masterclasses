<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semiologia · Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#130f0e;--surface:#1b1514;--surface-2:#241c1a;--raised:#2e2321;--border:#3b2e2a;
  --ink:#f4ede7;--ink-2:#d2c5bb;--muted:#9a8b80;--accent:#e6a23c;--accent-ink:#1a1206;--safra:#e0607a;
  --ok:#5fbf8b;--bad:#e2685d;--gp:#7f6bc4;--gn:#cf4b6c;
  --card:#f8f3ea;--card-ink:#201a16;--card-ink2:#4a3f37;--card-border:#e3d9c9;--card-soft:#efe7d9;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-io:cubic-bezier(.77,0,.175,1);
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sbw:296px;
}
:root[data-theme="light"]{
  --ground:#e9e2d8;--surface:#f6f1ea;--surface-2:#efe8de;--raised:#ffffff;--border:#d6cabb;
  --ink:#241d19;--ink-2:#4b4038;--muted:#7a6c61;--accent:#b4620a;--accent-ink:#ffffff;--safra:#b3314e;
  --ok:#2f8a5b;--bad:#bd3f35;--card:#fffdf9;--card-border:#e1d6c6;--card-soft:#f4ede1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}

#app{display:grid;grid-template-columns:var(--sbw) 1fr;height:100dvh;transition:grid-template-columns .28s var(--ease-drawer)}
body.sb-off #app{grid-template-columns:60px 1fr}
body.focus #app{grid-template-columns:0 1fr}
body.focus #side{display:none}

/* ---------- sidebar ---------- */
#side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.s-head{display:flex;align-items:center;gap:8px;padding:16px 14px 10px 16px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:600 21px/1.1 var(--serif);letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tools{display:flex;gap:4px}
.ibtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,transform .16s var(--ease-out),color .15s}
.ibtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:var(--raised);color:var(--ink)}}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .i-on{display:none}
body.is-fs .ibtn .i-off,body.focus .ibtn .i-off{display:none}
body.is-fs .ibtn .i-on,body.focus .ibtn .i-on{display:block}
.theme-ic{transition:transform .4s var(--ease-out)}
:root[data-theme="light"] .theme-ic{transform:rotate(180deg)}
.s-xp{padding:4px 16px 10px}
.xp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.xp-row b{color:var(--accent);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s var(--ease-out)}
.s-search{padding:2px 14px 8px;position:relative}
.s-search input{width:100%;background:var(--ground);border:1px solid var(--border);border-radius:10px;color:var(--ink);padding:9px 12px;font:inherit;font-size:14px}
.s-search input::placeholder{color:var(--muted)}
.s-search input:focus{outline:none;border-color:var(--accent)}
#sres{position:absolute;left:14px;right:14px;top:46px;background:var(--raised);border:1px solid var(--border);border-radius:10px;z-index:30;max-height:50vh;overflow:auto;display:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#sres.on{display:block}
#sres button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--border)}
#sres button:last-child{border:0}
#sres button b{display:block;color:var(--ink);font-weight:600;font-size:13px}
#sres button:hover{background:var(--surface-2)}
#sres em{font-style:normal;color:var(--accent)}
.s-nav{flex:1;overflow:auto;padding:4px 8px 16px;scrollbar-width:thin}
.grp>button.gh{width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;text-align:left;font-weight:600;font-size:14px;transition:background .15s}
.grp>button.gh:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--raised);border:2px solid var(--muted);flex:none;transition:background .3s,border-color .3s}
.dot.part{background:var(--accent);border-color:var(--accent)}
.dot.full{background:var(--ok);border-color:var(--ok)}
.gh .t{flex:1;min-width:0}
.gh .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.gh .chev{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .25s var(--ease-out)}
.grp.open .chev{transform:rotate(90deg)}
.items{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-drawer)}
.grp.open .items{grid-template-rows:1fr}
.items>div{overflow:hidden}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px 7px 12px;border-radius:9px;font-size:14px;color:var(--ink-2);transition:background .15s,color .15s,transform .16s var(--ease-out)}
.it:active{transform:scale(.985)}
.it:hover{background:var(--surface-2);color:var(--ink)}
.it.on{background:var(--raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.it .ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.it .ck svg{width:11px;height:11px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.it.done .ck{background:var(--ok);border-color:var(--ok)}
.it.done .ck svg{opacity:1}
.it .lb{flex:1;min-width:0;line-height:1.3}
.sep{height:1px;background:var(--border);margin:8px 10px}
.soon .it{opacity:.5;cursor:default}
body.sb-off .s-head{flex-direction:column;padding:12px 8px}
body.sb-off .brand,body.sb-off .s-xp,body.sb-off .s-search,body.sb-off .s-nav{display:none}
body.sb-off .tools{flex-direction:column}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;min-width:0;height:100dvh}
#top{display:none;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
#top .ttl{flex:1;font:600 15px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{flex:1;overflow:auto;padding:28px clamp(16px,3vw,48px) 72px;scroll-behavior:smooth;scrollbar-width:thin}
.page{max-width:900px;margin:0 auto;animation:pin .26s var(--ease-out)}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
h1.pt{font:600 clamp(28px,4vw,40px)/1.1 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
.psub{color:var(--ink-2);margin:0 0 18px;max-width:62ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--raised);border:1px solid var(--border);font-weight:600;font-size:14px;transition:transform .16s var(--ease-out),background .15s,border-color .15s,opacity .15s}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--muted)}}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#0d1f15;border-color:var(--ok)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:0 0 14px}
.legend span.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* ---------- cartão de leitura ---------- */
.card{background:var(--card);color:var(--card-ink);border-radius:16px;padding:clamp(20px,3.4vw,44px);font:400 18.5px/1.68 var(--serif);border:1px solid var(--card-border);overflow-wrap:anywhere}
.card h3{font:600 26px/1.2 var(--serif);letter-spacing:-.01em;margin:1.6em 0 .5em}
.card h3:first-child{margin-top:0}
.card h4{font:600 19px var(--serif);margin:1.3em 0 .3em}
.card p{margin:.7em 0}
.card .lead{font-size:20.5px;line-height:1.6;color:var(--card-ink);margin-top:0}
.card ul,.card ol{padding-left:1.25em;margin:.6em 0}
.card li{margin:.35em 0}
.card b{font-weight:600}
.card i{font-style:italic}
.card figure.fig{margin:1.4em 0;background:var(--card-soft);border-radius:12px;padding:10px;border:1px solid var(--card-border)}
.card figure.fig img{width:100%;height:auto;border-radius:8px;display:block;background:#fff;transition:opacity .3s}
.card figure.fig figcaption{font:400 15px/1.5 var(--ui);color:var(--card-ink2);padding:10px 4px 2px}
.card table.cmp{width:100%;border-collapse:collapse;font:400 15px/1.45 var(--ui);margin:1.2em 0;display:block;overflow-x:auto}
.card table.cmp th{background:#2a201c;color:#f6efe6;font-weight:600;text-align:left;padding:9px 12px;white-space:nowrap}
.card table.cmp th.gp{background:var(--gp)}
.card table.cmp th.gn{background:var(--gn)}
.card table.cmp td{padding:9px 12px;border-bottom:1px solid var(--card-border);vertical-align:top;min-width:120px}
.card table.cmp tr:nth-child(even) td{background:rgba(120,90,50,.05)}
.card table.cmp td:first-child{font-weight:600}
.prof,.extra,.warn,.pearl{border-radius:12px;padding:14px 18px;margin:1.3em 0;font:400 16px/1.55 var(--ui)}
.prof p,.extra p,.warn p,.pearl p{margin:.3em 0 0}
.prof b,.warn b,.pearl b:first-child{display:block;font-size:12.5px;letter-spacing:.01em;font-weight:700}
.prof{background:#e7f1e0;border-left:4px solid #5d9a45;color:#23331c}
.prof p{font-style:italic;font-family:var(--serif);font-size:18px}
.extra{background:#f5eee1;border-left:4px solid #b7915a;color:#3d3123}
.extra .tag{font-weight:700;color:#8a5a14}
.warn{background:#fbe8e3;border-left:4px solid #c9503f;color:#4a1f18}
.pearl{background:#e9ecf4;border-left:4px solid #5568a8;color:#232a44}
ol.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px;margin:1em 0;font:400 16px/1.5 var(--ui)}
ol.steps li{counter-increment:s;position:relative;display:block;background:var(--card-soft);border-radius:10px;padding:10px 14px 10px 56px}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:8px;width:28px;height:28px;border-radius:50%;background:#2a201c;color:#f6efe6;display:grid;place-items:center;font-weight:700;font-size:14px}
mark{background:none;color:inherit;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark[data-refs]{cursor:help;transition:filter .15s}
mark.f1{background:#cfe9d4}mark.f2{background:#fbe9a6}mark.f3{background:#fbc98d}mark.f4{background:#f4a39a}mark.f5{background:#1f1a17;color:#fff}
mark.hl{background:#f6b6d0;cursor:pointer}
mark.pf{background:transparent;text-decoration:underline wavy #2f6fd6;text-decoration-thickness:2px;text-underline-offset:4px;cursor:help;color:inherit;padding:0}
.pfbox{background:#e6eefb;border-left:4px solid #2f6fd6;color:#172a4a;border-radius:10px;padding:12px 16px;margin:0 0 16px;font:400 16px/1.5 var(--ui)}.pfbox>b:first-child{display:block;color:#1d4f9e;margin-bottom:4px}
[data-theme=dark] .pfbox,[data-theme=dark] .pfhead{background:rgba(70,130,230,.16);color:#dfe8fb;border-left-color:#7fb0ff}[data-theme=dark] .pfbox>b:first-child{color:#9cc2ff}[data-theme=dark] mark.pf{text-decoration-color:#7fb0ff}[data-theme=dark] .pfconf{color:#e8c48a}.pfbox p{margin:0 0 8px}
.pfhead{background:#e6eefb;border-left:4px solid #2f6fd6;color:#172a4a;border-radius:10px;padding:14px 18px;margin-bottom:10px;font:400 16px/1.5 var(--ui)}.pfhead p{margin:6px 0 0}
.pfex{background:var(--card-soft);border-radius:10px;padding:10px 14px;margin:8px 0;font:400 16px/1.5 var(--ui)}.pfex summary{cursor:pointer;font-weight:700}.pfex p{margin:8px 0}.pfconf{color:#8a5a14;font-size:14.5px}
mark.sr{background:#ffe08a;transition:background 1.6s}
.refchip{display:inline-block;background:#1f1a17;color:#fff;border-radius:6px;padding:0 6px;font:600 12.5px var(--ui);cursor:pointer}
#tip{position:fixed;z-index:60;max-width:300px;background:#1f1a17;color:#f6efe6;border-radius:10px;padding:10px 12px;font:500 13px/1.4 var(--ui);pointer-events:none;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .14s,transform .14s var(--ease-out)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;margin-bottom:3px}
#hlbtn{position:fixed;z-index:61;background:#f6b6d0;color:#3a1226;border-radius:9px;padding:6px 12px;font:600 13px var(--ui);display:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* ---------- questões ---------- */
.vblock{margin-top:34px}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
.vh h2{font:600 24px var(--serif);margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;border:1px solid var(--border)}
.seg button{padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.q{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q .qn{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.q .qenun{font:400 17px/1.6 var(--serif);white-space:pre-line;color:var(--ink)}
.q .qcmd{font-weight:600;margin:10px 0 12px;color:var(--ink)}
.q .qimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin:12px 0}
.q .qimgs img{width:100%;height:260px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--border)}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;padding:11px 14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);line-height:1.4;transition:transform .16s var(--ease-out),background .18s,border-color .18s}
.alt:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.alt:hover{border-color:var(--muted)}}
.alt .l{font-weight:700;color:var(--muted)}
.q.locked .alt{pointer-events:none}
.alt.right{background:color-mix(in srgb,var(--ok) 22%,var(--surface-2));border-color:var(--ok)}
.alt.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--surface-2));border-color:var(--bad)}
.alt.right .l{color:var(--ok)}.alt.wrong .l{color:var(--bad)}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted)}
.qcom{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease-drawer)}
.q.locked .qcom{grid-template-rows:1fr}
.qcom>div{overflow:hidden}
.qcom ul{list-style:none;margin:12px 0 0;padding:12px 14px;background:var(--ground);border-radius:11px;display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.qcom li b{color:var(--ink)}
.qcom li.ok b{color:var(--ok)}
.vsum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 16px;color:var(--ink-2);font-size:14px}
.teaser{margin-top:10px;border:1px dashed var(--border);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;color:var(--ink-2);user-select:none}
.teaser .sil{width:54px;height:72px;border-radius:9px;background:var(--accent);filter:blur(7px) saturate(.7);opacity:.7;flex:none}
.teaser span{font-size:14px}
.teaser.got{border-style:solid}
.teaser.got .sil{filter:none;opacity:1}
.anim0{animation:a0 .45s var(--ease-out)}@keyframes a0{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.anim1{animation:a1 .5s var(--ease-out)}@keyframes a1{30%{transform:rotate(-2deg)}60%{transform:rotate(1.6deg)}}
.anim2{animation:a2 .4s var(--ease-out)}@keyframes a2{50%{transform:scale(1.04)}}
.anim3{animation:a3 .45s var(--ease-out)}@keyframes a3{40%{transform:translateY(-8px)}70%{transform:translateY(2px)}}
.anim4{animation:a4 .5s var(--ease-out)}@keyframes a4{50%{transform:rotateX(70deg)}}
.anim5{animation:a5 .45s var(--ease-out)}@keyframes a5{30%{transform:scale(1.05,.94)}60%{transform:scale(.97,1.04)}}
.anim6{animation:a6 .5s var(--ease-out)}@keyframes a6{30%{transform:skewX(-5deg)}60%{transform:skewX(4deg)}}

/* ---------- widgets, revisão, simulado ---------- */
.wgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.panel h3{font:600 22px var(--serif);margin:0 0 4px}
.panel p.d{color:var(--ink-2);margin:0 0 14px;font-size:14px}
.wcard{background:var(--card);color:var(--card-ink);border-radius:14px;padding:26px 20px;min-height:120px;display:grid;place-items:center;text-align:center;font:500 21px/1.35 var(--serif);margin-bottom:12px;transition:transform .2s var(--ease-out),background .2s}
.wcard.ok{background:#d6ecdc}.wcard.no{background:#f3d3cd}
.wopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.wopts button{padding:12px;border-radius:11px;background:var(--raised);border:1px solid var(--border);font-weight:600;transition:transform .16s var(--ease-out),border-color .15s}
.wopts button:active{transform:scale(.97)}
.wopts button:hover{border-color:var(--accent)}
.wstat{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin:10px 0 0;flex-wrap:wrap}
.wstat b{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);transition:background .15s,color .15s}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rv{background:var(--card);color:var(--card-ink);border-radius:16px;padding:clamp(18px,3vw,34px);border:1px solid var(--card-border)}
.rv h3{font:600 24px var(--serif);margin:0 0 12px}
.rv ul{padding-left:1.2em}
.rv li{margin:.5em 0;font:400 17px/1.55 var(--serif)}
.vfi{display:grid;gap:10px}
.vfi>div{border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;font:400 17px/1.5 var(--serif);background:var(--card-soft)}
.vfi .bt{display:flex;gap:8px;margin-top:8px;font:600 14px var(--ui)}
.vfi .bt button{padding:6px 14px;border-radius:9px;background:#2a201c;color:#f6efe6}

/* ---------- memes: silhueta, balão e modal ---------- */
button.teaser{width:100%;font:inherit;text-align:left;background:transparent;transition:transform .16s var(--ease-out),border-color .2s ease}
button.teaser:active{transform:scale(.98)}
button.teaser:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.teaser .silw{position:relative;flex:none;display:block}
.teaser .sil{display:block;overflow:hidden;transform-origin:50% 90%;transition:filter .5s var(--ease-out),opacity .5s var(--ease-out)}
.teaser .sil img{display:block;width:100%;height:100%;object-fit:cover}
.teaser.got .sil{background:var(--surface-2,var(--border))}
.teaser.unlock .sil{animation:mUnlock .6s var(--ease-out)}
@keyframes mUnlock{from{filter:blur(7px);opacity:.6;transform:scale(.92)}to{filter:none;opacity:1;transform:none}}
.mtip{position:absolute;left:-4px;bottom:calc(100% + 10px);z-index:20;width:max-content;max-width:min(240px,70vw);background:var(--ink);color:var(--surface-2);font:500 13.5px/1.4 var(--ui);padding:8px 12px;border-radius:10px;pointer-events:none;opacity:0;transform:translateY(4px) scale(.97);transform-origin:12px 100%;transition:opacity .15s ease,transform .18s var(--ease-out);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mtip::after{content:"";position:absolute;left:22px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}
.teaser.say .mtip{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){
  button.teaser:hover{border-color:var(--accent)}
  button.teaser:hover .mtip{opacity:1;transform:none;transition-delay:.12s}
  button.teaser:not(.got):hover .sil{opacity:.85}
}
/* 7 reações da carta trancada: curtas, transform-only, cada uma volta ao repouso */
.sil.anim0{animation:mA0 .42s var(--ease-out)}
.sil.anim1{animation:mA1 .5s var(--ease-out)}
.sil.anim2{animation:mA2 .38s var(--ease-out)}
.sil.anim3{animation:mA3 .5s var(--ease-out)}
.sil.anim4{animation:mA4 .55s cubic-bezier(.77,0,.175,1)}
.sil.anim5{animation:mA5 .46s var(--ease-out)}
.sil.anim6{animation:mA6 .44s var(--ease-out)}
@keyframes mA0{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(1px)}}
@keyframes mA1{30%{transform:rotate(-7deg)}60%{transform:rotate(4deg)}85%{transform:rotate(-1deg)}}
@keyframes mA2{40%{transform:scale(1.08)}70%{transform:scale(.97)}}
@keyframes mA3{35%{transform:translateY(-9px)}65%{transform:translateY(1px) scale(1.03,.97)}}
@keyframes mA4{50%{transform:perspective(300px) rotateY(160deg) scale(.96)}100%{transform:perspective(300px) rotateY(360deg)}}
@keyframes mA5{30%{transform:scale(1.1,.9)}55%{transform:scale(.95,1.06)}80%{transform:scale(1.02,.99)}}
@keyframes mA6{30%{transform:skewX(-8deg)}60%{transform:skewX(5deg)}85%{transform:skewX(-1deg)}}

/* modal: entra com blur+scale (250ms), sai mais rápido (160ms) */
#mem{background:rgba(10,7,6,0);transition:background-color .25s ease;backdrop-filter:blur(0)}
#mem.in{background:rgba(10,7,6,.62)}
#mem.out{background:rgba(10,7,6,0);transition-duration:.16s}
#mem .mc{transform:scale(.95) translateY(8px);filter:blur(4px);transition:opacity .25s var(--ease-out),transform .3s var(--ease-out),filter .25s var(--ease-out);box-shadow:0 24px 60px rgba(0,0,0,.32)}
#mem.in .mc{filter:none}
#mem.out .mc{opacity:0;transform:scale(.97);filter:blur(2px);transition-duration:.16s}
#mem .mc>*{opacity:0;transform:translateY(6px);transition:opacity .25s var(--ease-out),transform .3s var(--ease-out)}
#mem.in .mc>*{opacity:1;transform:none}
#mem.in .mc>*:nth-child(2){transition-delay:.05s}#mem.in .mc>*:nth-child(3){transition-delay:.1s}#mem.in .mc>*:nth-child(4){transition-delay:.15s}#mem.in .mc>*:nth-child(5){transition-delay:.2s}
#mem.out .mc>*{transition-delay:0s!important}
#mem .tp{color:var(--accent);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
#mem .mci{width:min(520px,100%);padding:18px;gap:14px}

<script>

const DATA={"modules":[{"id":"a1","num":1,"nome":"Anamnese I","tema":"Sinal × sintoma, exame clínico, relação médico-paciente, Id, QP e HMA","segs":[{"id":"s1","titulo":"Semiologia, sinal × sintoma e exame clínico","html":"\n<p class=\"lead\">Semiologia é o estudo dos sinais e sintomas. Tudo o que vem depois no curso (cardiologia, pneumologia, clínica médica) parte daqui: aprender a colher a história e examinar o paciente de forma organizada, para chegar a hipóteses diagnósticas.</p>\n<h3>Anamnese: \"trazer de volta à memória\"</h3>\n<p>A palavra vem do grego <i>aná</i> (trazer de volta) + <i>mnesis</i> (memória). É a entrevista em que o paciente relembra e conta sua história. É a parte mais importante do exame clínico: na maioria dos atendimentos, a hipótese diagnóstica já está montada ao fim da anamnese, e o exame físico serve para confirmar ou descartar.</p>\n<h3>Sinal × sintoma</h3>\n<table class=\"cmp\"><tr><th></th><th>Sintoma</th><th>Sinal</th></tr>\n<tr><td>Natureza</td><td>Subjetivo: o paciente sente e relata</td><td>Objetivo: o examinador vê, palpa, ausculta, mede</td></tr>\n<tr><td>Onde é colhido</td><td><b>Anamnese</b></td><td><b>Exame físico</b></td></tr>\n<tr><td>Exemplos</td><td>Dor, náusea, tontura, palpitação, dispneia relatada</td><td>Febre medida, icterícia, sopro, edema, taquipneia contada</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Sinal é objetivo, \"dá pra ver\". Sintoma não se vê: o paciente conta.</p></div>\n<p>Alguns achados são as duas coisas ao mesmo tempo: o paciente <i>refere</i> que está amarelado (sintoma) e o médico <i>vê</i> a icterícia (sinal). Por isso a regra do professor: <b>\"Confie, mas confira. Acredite, mas cheque.\"</b> O exame físico é a chance de checar o que foi relatado.</p>\n<h3>Exame clínico = anamnese + exame físico</h3>\n<p>Esse é o conceito que mais cai da aula. <b><mark class=\"f5\" data-refs=\"S77.12,S79.24,S80.4,S81.23,S78.4,P82.15,P81.Atestado-Médico,P80.9\">Exame clínico é a soma da anamnese (sintomas) com o exame físico (sinais)</mark>.</b> Exames complementares (laboratório, imagem, ECG) <b>não</b> fazem parte do exame clínico: eles complementam o exame clínico, como o nome diz.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>O atestado de \"William Harvey\" caiu em várias provas: <i>\"não apresenta ao exame clínico sinais e/ou sintomas de doenças que o impeçam de praticar musculação e natação\"</i>. A conclusão correta é sempre a mesma: o médico se baseou na <b>anamnese e no exame físico</b>. Não se pode inferir que pediu ECG ou teste ergométrico, nem que usou só uma das duas etapas.</p></div>\n<h3>\"A clínica é soberana\"</h3>\n<p>Uma frase repetida pelo professor e que já apareceu numa camiseta na prova: <b><mark class=\"f1\" data-refs=\"P81.12\">\"A clínica é soberana\"</mark></b>. Quer dizer que o exame clínico (anamnese + exame físico) orienta tudo: exames complementares só têm valor quando interpretados à luz da clínica. Um exame \"normal\" não descarta uma doença quando a clínica é forte, e um exame \"alterado\" num paciente sem quadro clínico compatível pode ser um falso positivo.</p>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>As pegadinhas da camiseta: dizer que \"a Clínica Médica é soberana e mais importante que as outras especialidades\" está errado (não se trata da especialidade); e afirmar que \"o exame físico é soberano porque o paciente pode não saber contar sua história\" está errado. Soberana é <b>a clínica</b>, isto é, o conjunto anamnese + exame físico, e não uma das partes isoladas.</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> A frase de Osler na aula, \"Deixe que o paciente fale, ele contará o seu diagnóstico\", resume por que a anamnese é a etapa de maior rendimento diagnóstico. Estudos clássicos de ambulatório mostram que a história sozinha chega ao diagnóstico na maior parte das consultas.</p></div>","qs":{"p":[{"enun":"Na enfermaria, o estudante anota: \"paciente refere tontura ao se levantar; ao exame, PA em pé 20 mmHg menor que deitado\".","cmd":"Assinale a classificação correta dos dois achados.","alts":["Tontura é sintoma (anamnese); queda da PA medida é sinal (exame físico)","Ambos são sintomas, pois se referem a uma queixa trazida pelo paciente","Tontura é sinal (exame físico); queda da PA medida é sintoma (anamnese)","Ambos são sinais, pois foram registrados pelo médico no prontuário"],"gab":0,"com":["Correta. O que o paciente sente e conta é sintoma; o que o médico mede é sinal.","A PA medida pelo examinador é dado objetivo, logo sinal.","Inverteu os conceitos: a tontura não se vê, é relatada.","Registrar no prontuário não transforma sintoma em sinal; a tontura continua subjetiva."],"imgs":[]},{"enun":"Relatório de alta: \"Ao exame clínico, paciente sem alterações. Eletrocardiograma e radiografia de tórax normais.\"","cmd":"Qual afirmação sobre esse registro está correta?","alts":["O exame clínico se refere apenas ao exame físico, e a anamnese fica à parte","O exame clínico incluiu o ECG, pois ele é feito à beira do leito pelo médico","O ECG e a radiografia são exames complementares e não fazem parte do exame clínico","O exame clínico se refere apenas à anamnese, e o exame físico fica à parte"],"gab":2,"com":["A anamnese também faz parte do exame clínico.","Ser feito à beira do leito não torna o ECG parte do exame clínico.","Correta. Exame clínico = anamnese + exame físico; o resto complementa.","O exame físico também faz parte do exame clínico."],"imgs":[]},{"enun":"Paciente de 60 anos com dor torácica típica e alterações clínicas de isquemia tem a primeira troponina normal. O interno sugere alta.","cmd":"Com base no princípio \"a clínica é soberana\", qual a conduta mais adequada?","alts":["Repetir apenas a anamnese, pois o exame físico não acrescenta nada aqui","Dar alta, pois o exame complementar é mais objetivo que a história clínica","Dar alta, pois a troponina normal descarta qualquer causa cardíaca de dor","Manter a investigação, pois um exame normal não descarta doença com clínica forte"],"gab":3,"com":["O exame físico faz parte da clínica e também é essencial.","Inverte o princípio: a clínica orienta a leitura dos exames.","Um único exame normal não descarta isquemia num quadro típico.","Correta. O exame complementar é interpretado à luz da clínica, que aqui é forte."],"imgs":[]}]},"pv":["S81.23","P82.15","P81.12","S78.4"]},{"id":"s2","titulo":"Relação médico-paciente e técnicas da entrevista","html":"\n<p class=\"lead\">A anamnese é o início da relação médico-paciente. A forma como a entrevista é conduzida muda o que o paciente conta, e portanto muda o diagnóstico.</p>\n<h3>Habilidades e qualidades esperadas</h3>\n<ul><li><b>Interesse pelo paciente</b> e <b>escuta qualificada</b>: ouvir sem interromper.</li>\n<li><mark class=\"f1\" data-refs=\"S82.25\"><b>Etiqueta</b> (ética + \"eta\" = \"pequena ética\")</mark>: cumprimentar, apresentar-se, chamar pelo nome, respeitar a privacidade. Na prova ela aparece como \"simulacro de ética\": interagir com o paciente por normas socialmente acordadas, reforçando o não julgamento.</li>\n<li><b>Empatia</b>, <b>ética</b> e <b>não julgamento</b>: o paciente só conta o uso de álcool, drogas ou a vida sexual se não se sentir julgado.</li>\n<li><mark class=\"f1\" data-refs=\"S82.25\"><b>Síntese e concatenação</b> das informações: transformar o relato em uma história clínica cronológica</mark>, inteligível e organizada, na anamnese e no registro em prontuário.</li></ul>\n<h3>Objetivos da anamnese</h3>\n<ol class=\"steps\"><li>Estabelecer condições para uma boa relação médico-paciente.</li><li>Fazer a história clínica, registrando de forma detalhada e cronológica o problema de saúde.</li><li>Avaliar os sintomas de cada sistema corporal.</li><li>Fixar os componentes da anamnese (Id, QP, HMA, AE/RS, HPP, HF, HV, HSC) e entender o papel de cada um no raciocínio clínico.</li></ol>\n<h3>Técnicas de entrevista</h3>\n<table class=\"cmp\"><tr><th>Técnica</th><th>Como é</th><th>Vantagem e risco</th></tr>\n<tr><td>Relato livre</td><td>O paciente conta a história do jeito dele</td><td>Traz a perspectiva do paciente; pode ser longo e desorganizado</td></tr>\n<tr><td>Anamnese dirigida</td><td>O médico conduz com perguntas específicas</td><td>Objetiva; pode induzir respostas e perder informações</td></tr>\n<tr><td><b>Técnica mista</b></td><td>Começa livre e depois direciona</td><td>É a recomendada: une as vantagens das duas</td></tr></table>\n<h3>Facilitadores da comunicação</h3>\n<table class=\"cmp\"><tr><th>Técnica</th><th>Exemplo</th></tr>\n<tr><td>Apoio</td><td>\"Eu compreendo.\"</td></tr><tr><td>Facilitação</td><td>Balançar a cabeça, \"hum-hum\", \"continue\".</td></tr>\n<tr><td>Reflexão</td><td>Repetir uma palavra do paciente: \"Pontada?\"</td></tr><tr><td>Esclarecimento</td><td>\"O que o senhor quer dizer com 'fraqueza'?\"</td></tr>\n<tr><td>Confrontação</td><td>\"Por que, então, o senhor parou o remédio?\"</td></tr><tr><td>Interpretação</td><td>\"O senhor parece preocupado.\"</td></tr>\n<tr><td>Resposta empática</td><td>Oferecer um lenço; \"compreendo seu sofrimento\".</td></tr></table>\n<h3>Decisão compartilhada</h3>\n<p>Uma questão bônus da parcial trouxe um homem saudável de 48 anos que pediu um PSA porque viu um anúncio. Como o rastreamento com PSA tem risco alto de falso positivo e baixo valor preditivo positivo, <mark class=\"f1\" data-refs=\"P82.22\">a conduta correta é a decisão compartilhada: explicar riscos e benefícios e decidir junto com o paciente</mark>. Nem negar o exame de forma autoritária, nem pedir só porque o paciente quer.</p>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Decisão compartilhada é a aplicação prática da boa relação médico-paciente: o paciente tem autonomia, e o médico tem o dever de informar com clareza. Vale para rastreamentos (PSA, mamografia antes da idade indicada) e para exames sem indicação clínica.</p></div>","qs":{"p":[{"enun":"Durante a consulta, a paciente diz que sente \"um aperto\". O estudante responde apenas: \"Aperto?\", e espera.","cmd":"Qual técnica de entrevista foi usada?","alts":["Interpretação","Resposta empática","Reflexão","Confrontação"],"gab":2,"com":["Interpretação nomeia um sentimento (\"a senhora parece...\").","Resposta empática acolhe o sofrimento (\"compreendo\", oferecer lenço).","Correta. Repetir uma palavra do paciente para que ele desenvolva é reflexão.","Confrontação aponta uma contradição (\"por que então...?\")."],"imgs":[]},{"enun":"O estudante começa a consulta perguntando: \"A dor é em aperto? Vai para o braço? Piora com esforço?\", sem deixar o paciente falar.","cmd":"Qual o principal problema dessa abordagem?","alts":["Não há problema, pois perguntas fechadas tornam a anamnese mais precisa","É uma anamnese dirigida desde o início, que pode induzir respostas e perder informações","É uma técnica mista, que deve ser evitada por ser demorada e pouco objetiva","É um relato livre, que costuma deixar a história desorganizada demais"],"gab":1,"com":["Perguntas fechadas logo de cara podem sugerir a resposta ao paciente.","Correta. A técnica recomendada é a mista: primeiro o relato livre, depois as perguntas dirigidas.","Técnica mista é justamente a recomendada.","Ele não deixou o paciente falar, então não houve relato livre."],"imgs":[]},{"enun":"Paciente de 25 anos, sem queixas, pede uma tomografia de corpo inteiro \"para prevenir\". Não há indicação clínica.","cmd":"Qual a conduta mais adequada?","alts":["Recusar o exame sem explicação, pois cabe só ao médico decidir sobre exames","Explicar riscos e benefícios e chegar a uma decisão compartilhada com o paciente","Encaminhar a outro profissional, pois o médico não deve discutir pedidos do paciente","Solicitar o exame, pois a autonomia do paciente obriga o médico a pedir o que ele quer"],"gab":1,"com":["Recusar sem explicar fere a relação médico-paciente.","Correta. É o mesmo raciocínio da questão do PSA: informar e decidir junto.","Encaminhar não resolve; a conversa é papel do médico.","A autonomia não obriga a pedir exame sem indicação."],"imgs":[]},{"enun":"Um adolescente conta, na consulta, que usa maconha nos fins de semana. O estudante franze a testa e diz: \"Isso é muito errado, você sabe, né?\". O adolescente passa a responder só \"sim\" e \"não\".","cmd":"Qual qualidade esperada na entrevista falhou?","alts":["O não julgamento, que faz parte da etiqueta esperada na entrevista","A técnica dirigida, porque o estudante deveria ter feito perguntas fechadas","A reflexão, porque o estudante deveria ter repetido a palavra \"maconha\"","A confrontação, que o estudante usou de modo correto, mas cedo demais"],"gab":0,"com":["Correta. Ao julgar, o estudante quebrou a etiqueta; o paciente só conta hábitos como drogas e vida sexual se não se sentir julgado.","Perguntas fechadas não resolvem a quebra de confiança; o problema foi o julgamento.","Repetir a palavra não reparava o julgamento já feito.","Confrontação aponta incoerências do relato; aqui houve julgamento moral, não confrontação."],"imgs":[]},{"enun":"Ao fim da consulta, o estudante anota no prontuário tudo o que ouviu, na ordem em que o paciente falou, com idas e vindas no tempo e repetições.","cmd":"O que o professor espera que ele faça com esse relato?","alts":["Copiar o relato literal, sem reorganizar, para não alterar o que foi dito","Concatenar e sintetizar em história cronológica, inteligível e organizada","Registrar só os exames já feitos, porque o relato não é objetivo","Resumir tudo em uma linha de diagnóstico, sem a história da doença"],"gab":1,"com":["Só a QP fica nas palavras do paciente; a HMA é reorganizada pelo médico.","Correta. A capacidade de síntese e concatenação é desejável a todo médico, na anamnese e no prontuário.","O relato é a base do raciocínio; exames não substituem a história.","A HMA precisa da história detalhada; um diagnóstico sem história não é anamnese."],"imgs":[]}]},"pv":["P82.22","S82.25"]},{"id":"s3","titulo":"Componentes da anamnese, identificação e queixa principal","html":"\n<p class=\"lead\">A anamnese tem componentes mínimos e uma ordem. Saber em que campo registrar cada informação é um dos assuntos que mais caem nas parciais.</p>\n<h3>Componentes mínimos</h3>\n<ol class=\"steps\"><li><b>Identificação (Id)</b></li><li><b>Queixa principal (QP)</b></li><li><b>História da moléstia atual (HMA ou HDA)</b></li><li><b>Revisão de sistemas (RS)</b>, também chamada anamnese especial (AE) ou interrogatório sintomatológico (IS)</li><li><b>Antecedentes pessoais (AP)</b> ou história patológica pregressa (HPP)</li><li><b>Antecedentes familiares (AF)</b> ou história familiar (HF)</li><li><b>Hábitos de vida (HV)</b></li><li><b>Condições socioculturais (HSC)</b></li></ol>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>O caso do slide \"Masculino, 46 anos, HAS, tabagista, dislipidêmico... dor precordial típica há 40 minutos\" <b>não é anamnese</b>: é um resumo de caso, sem a estrutura e sem as palavras do paciente. A versão correta separa cada informação no seu campo.</p></div>\n<h3>Identificação</h3>\n<p>Data e hora, nome (e nome social), nome da mãe, idade, sexo/gênero, cor (etnia, ancestralidade), profissão, estado civil, local de trabalho/ocupação, residência, procedência e religião. A identificação é o início da comunicação e da relação médico-paciente.</p>\n<table class=\"cmp\"><tr><th>Campo</th><th>O que é</th><th>Por que importa</th></tr>\n<tr><td>Naturalidade</td><td>Onde nasceu</td><td>Doenças endêmicas da infância (Chagas, esquistossomose)</td></tr>\n<tr><td>Residência</td><td>Onde mora hoje</td><td>Exposições atuais</td></tr>\n<tr><td>Procedência</td><td>De onde veio recentemente</td><td>Viagens: no exemplo da aula, \"procedente de Natal-RN há 2 dias\"</td></tr>\n<tr><td>Profissão/ocupação</td><td>O que faz</td><td>Doenças ocupacionais, esforço, exposição</td></tr></table>\n<h3>Queixa principal (QP)</h3>\n<p>É o motivo da consulta: uma afirmação breve, anotada entre aspas, <mark class=\"f5\" data-refs=\"S78.2,S79.11,S80.14,P82.9,P80.12,S80.9,S81.28\">preferencialmente nas palavras do paciente</mark>. Perguntas que ajudam: \"O que está incomodando?\", \"Qual o motivo da consulta?\", \"Por que o senhor me procurou?\".</p>\n<ul><li><b>SIC</b> (<i>sic erat scriptum</i>, \"exatamente assim\") indica que a frase foi transcrita como o paciente disse.</li>\n<li>Atenção a <b>diagnósticos formados</b> (\"vim por causa da minha pressão\"), <b>múltiplas queixas</b> e <b>encaminhamentos</b>: a QP continua sendo o que o paciente sente.</li>\n<li>Prefira frases <b>curtas</b>. Sentenças longas e explicativas são da HMA.</li></ul>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A questão das quatro assertivas sobre a QP caiu igual em duas parciais. Só a primeira está certa: <b>grafar nas palavras do paciente</b>. Estão erradas: registrar várias queixas de uma vez, preferir termos técnicos e preferir sentenças longas.</p></div>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Trocar \"estou evacuando com sangue\" por \"QP: melena\" é erro de prova. Melena é fezes escuras e fétidas (sangramento alto); enterorragia e hematoquezia são sangue vivo. O termo técnico, além de tirar a palavra do paciente, pode estar errado e levar o raciocínio para o lugar errado.</p></div>","qs":{"p":[{"enun":"Paciente diz: \"Doutor, desde ontem estou com uma queimação no estômago que sobe pro peito\". O estudante registra: QP: \"pirose há 1 dia\".","cmd":"Qual a crítica correta ao registro?","alts":["Deveria trazer o diagnóstico provável, como \"doença do refluxo\"","Deveria usar as palavras do paciente, como \"queimação no estômago que sobe pro peito\"","Deveria trazer todos os sintomas da consulta, em ordem cronológica","Está correto, pois a QP deve sempre trazer o termo técnico do sintoma"],"gab":1,"com":["A QP não traz diagnóstico.","Correta. A QP é breve, entre aspas, e preferencialmente nas palavras do paciente.","Detalhar a cronologia é papel da HMA.","Os termos técnicos são bem-vindos na RS, mas a QP preserva a fala do paciente."],"imgs":[]},{"enun":"Na identificação, o estudante anota: \"natural de Montes Claros, residente em Belo Horizonte, procedente de Manaus há 3 dias\".","cmd":"O que significa \"procedente\" nesse registro?","alts":["A cidade onde o paciente trabalha, útil para riscos ocupacionais","A cidade onde nasceu, útil para doenças endêmicas","De onde veio recentemente, útil para exposições","A cidade onde mora atualmente, útil para o contexto social"],"gab":2,"com":["Local de trabalho é registrado em ocupação.","Essa é a naturalidade.","Correta. Procedência é o lugar de onde o paciente acabou de chegar.","Essa é a residência."],"imgs":[]},{"enun":"Em qual componente da anamnese deve ser registrado: \"Pai falecido aos 54 anos de infarto\"?","cmd":"Assinale a alternativa correta.","alts":["Revisão de sistemas","História da moléstia atual","História familiar (antecedentes familiares)","História patológica pregressa (antecedentes pessoais)"],"gab":2,"com":["A RS é a revisão dos sintomas do paciente.","A HMA é a história do problema atual do paciente.","Correta. Doenças e óbitos nos familiares vão na HF.","A HPP é do próprio paciente."],"imgs":[]}]},"pv":["S80.14","P82.9"]},{"id":"s4","titulo":"HMA e os sete atributos de um sintoma","html":"\n<p class=\"lead\">A história da moléstia atual (HMA, ou HDA) é o coração da anamnese: é a história cronológica da queixa principal, do início até o momento da consulta.</p>\n<p>A frase de Osler no slide resume o espírito: <b>\"Deixe que o paciente fale, ele contará o seu diagnóstico.\"</b></p>\n<h3>Os sete atributos de um sintoma</h3>\n<table class=\"cmp\"><tr><th>Atributo</th><th>Pergunta</th></tr>\n<tr><td>1. Localização</td><td>Onde se localiza? Há irradiação?</td></tr>\n<tr><td>2. Características</td><td>Descreva o sintoma (aperto, pontada, queimação).</td></tr>\n<tr><td>3. Intensidade</td><td>Qual a intensidade? Gradue sempre que possível (0 a 10).</td></tr>\n<tr><td>4. Cronologia</td><td>Quando começou? Quanto tempo dura? Recorre?</td></tr>\n<tr><td>5. Circunstâncias de ocorrência</td><td>Fatores ambientais, atividades, reações emocionais.</td></tr>\n<tr><td>6. Fatores de piora ou melhora</td><td>Algo faz o sintoma melhorar ou piorar?</td></tr>\n<tr><td>7. Manifestações associadas</td><td>Algo mais aparece junto com o sintoma?</td></tr></table>\n<h3>Como perguntar</h3>\n<ol class=\"steps\"><li><b>Perguntas abertas</b>: \"conte-me mais a respeito de...\". Não interrompa; estimule o paciente a contar.</li><li><b>Perguntas mais específicas</b> para descobrir os atributos, sem influenciar.</li><li><b>Perguntas diretas</b>, oferecendo a possibilidade de resposta positiva ou negativa: \"o senhor percebeu corrimento?\".</li></ol>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Os atributos devem ser interrogados <b>depois</b> do relato livre, sem interromper o paciente. Essa ordem já caiu numa parcial sobre dor abdominal.</p></div>\n<p>Na parcial 81, a questão sobre dor abdominal pedia exatamente isso: <mark class=\"f1\" data-refs=\"P81.14\">a caracterização da dor envolve os atributos do sintoma, interrogados idealmente após o relato livre, sem interrupções</mark>.</p>\n<h3>Exemplo de HMA da aula</h3>\n<div class=\"pearl\"><b>HMA bem escrita</b><p>\"Paciente relata que há cerca de 40 minutos iniciou quadro súbito de dor torácica retroesternal, 'rasgante', irradiada para a região interescapular, intensidade 9 em 10. Nega fatores de piora. Refere discreta melhora quando projeta o tronco para a frente. Associado ao quadro, refere sudorese profusa e sensação de morte iminente.\"</p></div>\n<p>Note que estão ali localização, irradiação, característica, intensidade, cronologia, fatores de melhora e manifestações associadas. E a história familiar do mesmo paciente (tia com síndrome de Marfan) mais o quadro de dor rasgante para o dorso apontam para <b>dissecção de aorta</b>, tema da aula de dor torácica.</p>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Na prática, use um mnemônico para não esquecer os atributos. Um dos mais usados é o decálogo da dor (aula de dor), que expande estes sete em dez.</p></div>","qs":{"p":[{"enun":"Paciente relata dor abdominal. O estudante pergunta: \"Algo faz a dor piorar? Comer, andar, deitar?\".","cmd":"Qual atributo do sintoma está sendo investigado?","alts":["Manifestações associadas","Circunstâncias de ocorrência","Cronologia","Fatores de piora ou melhora"],"gab":3,"com":["Manifestações associadas são outros sintomas que ocorrem junto.","Circunstâncias são o contexto em que o sintoma surgiu.","Cronologia é início, duração e recorrência.","Correta. Perguntar o que agrava ou alivia é o atributo fatores de piora ou melhora."],"imgs":[]},{"enun":"Paciente de 50 anos chega com cefaleia. O estudante, logo após cumprimentá-lo, pergunta: \"A dor é latejante? Piora com luz? Tem enjoo?\".","cmd":"Qual a melhor crítica à condução?","alts":["Deveria ter perguntado primeiro os antecedentes familiares do paciente","Está correta, pois as perguntas sobre atributos devem vir antes do relato livre","Deveria ter feito o exame físico antes de qualquer pergunta sobre a dor","Deveria começar com uma pergunta aberta e deixar o paciente contar antes de caracterizar"],"gab":3,"com":["A HF vem depois da HMA.","A ordem é a inversa: relato livre primeiro.","A anamnese vem antes do exame físico.","Correta. Primeiro relato livre, depois os atributos, sem induzir respostas."],"imgs":[]},{"enun":"\"Dor torácica há 40 minutos, súbita, rasgante, irradiada para o dorso, 9/10, com sudorese profusa.\" Que atributo falta para a descrição ficar completa pelos sete atributos?","cmd":"Assinale a alternativa correta.","alts":["Manifestações associadas","Localização","Fatores de piora ou melhora","Intensidade"],"gab":2,"com":["A sudorese é manifestação associada e foi descrita.","A localização (tórax, com irradiação para o dorso) foi descrita.","Correta. Não foi dito se algo piora ou melhora a dor.","A intensidade (9/10) foi descrita."],"imgs":[]}]},"pv":["P81.14"]}],"quiz":[{"enun":"O termo \"anamnese\" deriva do grego e significa, literalmente:","cmd":"Assinale a alternativa correta.","alts":["Examinar com as mãos","Observar com atenção","Conhecer a doença","Trazer de volta à memória"],"gab":3,"com":["Isso lembra a palpação.","Isso lembra a inspeção.","Isso lembra diagnóstico (gnosis).","Correta. Aná (de novo, trazer de volta) + mnesis (memória)."],"imgs":[]},{"enun":"Um médico do trabalho escreve: \"ao exame clínico, apto\". Ele usou, necessariamente:","cmd":"Assinale a alternativa correta.","alts":["Anamnese e exame físico","Somente o exame físico","Anamnese, exame físico e ECG","Exame físico e exames laboratoriais"],"gab":0,"com":["Correta. É a definição de exame clínico.","Faltou a anamnese.","O ECG é complementar.","Exames laboratoriais não fazem parte do exame clínico."],"imgs":[]},{"enun":"Qual das informações abaixo é um SINAL?","cmd":"Assinale a alternativa correta.","alts":["Sensação de falta de ar ao subir dois lances de escada","Dor em pontada no hemitórax ao respirar fundo","Frequência respiratória de 28 irpm contada","Cansaço que piora no fim do dia, relatado em consulta"],"gab":2,"com":["É sintoma, relatado.","É sintoma, relatado.","Correta. É objetiva e medida pelo examinador.","É sintoma, relatado."],"imgs":[]},{"enun":"A técnica de entrevista recomendada pelo professor é:","cmd":"Assinale a alternativa correta.","alts":["O relato livre do início ao fim, sem perguntas","A dirigida desde o início, para ganhar tempo","O questionário padronizado preenchido pelo paciente","A mista: começa com relato livre e depois direciona"],"gab":3,"com":["Só relato livre deixa lacunas nos atributos.","Dirigida desde o início induz respostas.","Questionário não substitui a entrevista.","Correta."],"imgs":[]},{"enun":"\"O senhor parece preocupado com esse resultado.\" Essa fala é um exemplo de:","cmd":"Assinale a alternativa correta.","alts":["Reflexão","Interpretação","Esclarecimento","Facilitação"],"gab":1,"com":["Reflexão é repetir uma palavra.","Correta. Nomeia um sentimento percebido.","Esclarecimento é pedir que explique um termo.","Facilitação é balançar a cabeça, \"continue\"."],"imgs":[]},{"enun":"Qual destas é a melhor forma de registrar a QP?","cmd":"Assinale a alternativa correta.","alts":["\"Dispneia, tosse, febre, astenia e emagrecimento\"","\"Insuficiência cardíaca descompensada\"","\"Paciente encaminhado pelo cardiologista para avaliação\"","\"Falta de ar há três dias\""],"gab":3,"com":["Múltiplas queixas e termos técnicos.","É um diagnóstico.","Encaminhamento não é queixa.","Correta. Curta, entre aspas, nas palavras do paciente."],"imgs":[]},{"enun":"A sigla SIC, ao lado de uma frase no prontuário, indica que:","cmd":"Assinale a alternativa correta.","alts":["A frase foi transcrita como o paciente disse","A informação foi dada por um acompanhante","O sintoma foi confirmado depois no exame físico","O sintoma é de início súbito e foi bem descrito"],"gab":0,"com":["Correta. Sic erat scriptum: \"exatamente assim\".","Informante é registrado à parte.","SIC não indica confirmação.","Não tem relação com o tempo de início."],"imgs":[]},{"enun":"Dos sete atributos de um sintoma, \"a dor vai para o braço esquerdo\" corresponde a:","cmd":"Assinale a alternativa correta.","alts":["Manifestações associadas","Características","Localização (irradiação)","Circunstâncias de ocorrência"],"gab":2,"com":["Manifestação associada é outro sintoma.","Características é o tipo da dor.","Correta. A irradiação é investigada junto com a localização.","Circunstância é o contexto."],"imgs":[]}],"widgets":[{"id":"campo","titulo":"Em que campo da anamnese vai?","desc":"Arraste cada informação para o campo certo.","cats":[["id","Identificação"],["qp","QP"],["hma","HMA"],["rs","RS/AE"],["hpp","HPP"],["hf","HF"],["hv","HV"]],"cards":[["\"Dor no peito\"","qp"],["Procedente de Natal há 2 dias","id"],["Dor há 40 min, rasgante, 9/10","hma"],["Nega febre, calafrios e perda de peso","rs"],["Vacinação em dia","hpp"],["Alérgico a dipirona","hpp"],["Apendicectomia aos 20 anos","hpp"],["Pai falecido de IAM aos 47 anos","hf"],["Tia com síndrome de Marfan","hf"],["Tabagista 30 anos-maço","hv"],["Sedentário","hv"],["Professor, natural de Diamantina","id"],["G2P2A0","hpp"],["Hábito intestinal: evacua a cada 4 dias","rs"]]}],"gl":[["Anamnese","Entrevista clínica; do grego \"trazer de volta à memória\".",1],["Sintoma","Dado subjetivo, relatado pelo paciente.",1],["Sinal","Dado objetivo, observado pelo examinador.",1],["Exame clínico","Anamnese + exame físico.",1],["Técnica mista","Relato livre seguido de perguntas dirigidas.",2],["Reflexão","Repetir uma palavra do paciente para que ele desenvolva.",2],["Decisão compartilhada","Médico informa riscos e benefícios e decide junto com o paciente.",2],["Procedência","Lugar de onde o paciente veio recentemente.",3],["SIC","\"Exatamente assim\": transcrição literal.",3],["QP","Queixa principal: motivo da consulta, nas palavras do paciente.",3],["HMA/HDA","História cronológica da queixa principal.",4]],"vf":[["Exames complementares fazem parte do exame clínico.",false,"Exame clínico = anamnese + exame físico."],["Sintomas são colhidos na anamnese.",true,"O paciente relata o que sente."],["A QP deve ser escrita preferencialmente em termos técnicos.",false,"Preferencialmente nas palavras do paciente."],["A técnica mista começa com relato livre.",true,"Depois o médico direciona."],["\"A clínica é soberana\" significa que o exame físico vale mais que a anamnese.",false,"Soberano é o conjunto anamnese + exame físico."],["Os atributos do sintoma devem ser perguntados antes do relato livre.",false,"Primeiro o relato livre, sem interrupções."]],"check":["Definir sinal e sintoma e onde cada um é colhido","Dizer o que compõe o exame clínico (e o que não compõe)","Explicar \"a clínica é soberana\" sem cair na pegadinha","Citar as técnicas de entrevista e a recomendada","Listar os componentes mínimos da anamnese em ordem","Registrar a QP corretamente","Citar os sete atributos de um sintoma"],"resumo":[["Segmento 1","Sintoma é subjetivo (anamnese); sinal é objetivo (exame físico). Exame clínico = anamnese + exame físico; exames complementares ficam fora. A clínica é soberana."],["Segmento 2","Técnica mista (relato livre e depois dirigida). Facilitadores: apoio, facilitação, reflexão, esclarecimento, confrontação, interpretação, resposta empática. Decisão compartilhada."],["Segmento 3","Id, QP, HMA, RS/AE/IS, HPP/AP, HF/AF, HV, HSC. QP curta, entre aspas, nas palavras do paciente, sem diagnóstico."],["Segmento 4","HMA cronológica com os 7 atributos: localização, características, intensidade, cronologia, circunstâncias, piora/melhora, manifestações associadas."]],"freq":[["Exame clínico = anamnese + exame físico",4,"S77.12, S79.24, S80.4, S81.23"],["Atestado \"ao exame clínico\": anamnese + exame físico, sem complementares",3,"P82.15, P81.Atestado-Médico, P80.9"],["QP nas palavras do paciente: \"evacuação com sangue\" não é \"melena\"",3,"S78.2, S79.11, S80.14"],["Queixa principal: nas palavras do paciente, curta e única",2,"P82.9, P80.12"],["\"A clínica é soberana\": o que a frase quer dizer",1,"P81.12"],["\"Ao exame clínico\" = anamnese + exame físico",1,"S78.4"],["PSA de rastreio pedido pelo paciente: decisão compartilhada",1,"P82.22"],["Etiqueta (não julgamento) e capacidade de síntese na anamnese",1,"S82.25"]],"cob":{"rk":{"t":"Onde cada dado é colhido","c":["Paciente conta","Sintoma","Anamnese","Exame clínico"],"d":["<b>Paciente conta</b>: o que ele sente e relata.","<b>Sintoma</b>: dado subjetivo; o que o médico vê, mede ou ausculta é sinal.","<b>Anamnese</b>: onde os sintomas são colhidos; os sinais vêm do exame físico.","<b>Exame clínico</b>: anamnese + exame físico. Exame complementar fica fora."],"x":[["\"Estou com falta de ar\"","sintoma","anamnese (QP/HMA)","exame clínico"],["FR de 28 contada","sinal","exame físico","exame clínico"],["Raio X de tórax","exame complementar","fora do exame clínico","complementa"]],"ex":"Atestado \"ao exame clínico\" → anamnese + exame físico. Nunca ECG, nunca só uma das partes.","b":"QP: curta, entre aspas, nas palavras do paciente; sem termo técnico, sem diagnóstico, sem lista de queixas."},"figs":[],"keys":["C11","p:atestado","C20","p:qp","p:soberana","C21","p:psa"]}},{"id":"a2","num":2,"nome":"Anamnese II","tema":"Revisão de sistemas, termos técnicos, HPP, HF, hábitos de vida e carga tabágica","segs":[{"id":"s1","titulo":"Revisão de sistemas (RS / AE / IS)","html":"\n<p class=\"lead\">Revisão de sistemas (RS), anamnese especial (AE) e interrogatório sintomatológico (IS) são três nomes para a mesma etapa: a revisão dos <b>sintomas</b> de cada aparelho, depois da HMA.</p>\n<h3>Para que serve</h3>\n<ul><li><mark class=\"f4\" data-refs=\"S80.9,S81.28,P82.16,P81.5\">Documenta a existência <b>ou a ausência</b> de sintomas comuns de cada sistema corporal</mark>.</li>\n<li>Cumpre a função de atendimento <b>global</b> do paciente.</li>\n<li>Permite reconhecer doenças <b>sem relação</b> com a queixa da HMA: pode ser a \"sede\" onde nasce a suspeita diagnóstica.</li>\n<li>Ajuda a decidir o plano propedêutico e terapêutico e a avaliar práticas de promoção da saúde.</li>\n<li>Para o estudante, treina a visão conjunta de sinais e sintomas.</li></ul>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>A RS é uma revisão <b>sintomatológica</b>. Não se registram ali doenças prévias (HPP), hábitos (HV) nem achados de exame físico como \"BEG\" ou \"corado\".</p></div>\n<h3>Como fazer</h3>\n<ul><li>É a transição das perguntas abertas da HMA para uma anamnese <b>dirigida</b>. Mas vale a técnica mista: <mark class=\"f2\" data-refs=\"P80.20,P82.4,P80.21\">quando o paciente refere um sintoma na RS, ele deve ser caracterizado com seus atributos</mark>, como na HMA.</li>\n<li>Sistematização <b>anatômica, por aparelhos e no sentido crânio-caudal</b>, <mark class=\"f2\" data-refs=\"P82.4,P80.21,P80.20\">precedida pelos sintomas gerais</mark>.</li>\n<li>Registre os sintomas negados por extenso (\"nega otalgia, nega zumbido\"), evitando siglas como \"NDN\" (nada digno de nota).</li>\n<li>Minimize a <b>\"síndrome da mão na maçaneta\"</b>: o paciente que conta a queixa mais importante já com a mão na porta, saindo. Uma RS bem feita puxa essas queixas antes.</li></ul>\n<h3>Roteiro sugerido</h3>\n<table class=\"cmp\"><tr><th>Ordem</th><th>Sistema</th><th>Exemplos de sintomas</th></tr>\n<tr><td>1</td><td>Sintomas gerais</td><td>Febre, calafrios, sudorese, astenia, alteração do peso</td></tr>\n<tr><td>2</td><td>COONG (cabeça, olhos, ouvidos, nariz, garganta)</td><td>Cefaleia, alteração visual, otalgia, zumbido, coriza, odinofagia</td></tr>\n<tr><td>3</td><td>Pele e fâneros</td><td>Prurido, lesões, queda de cabelo</td></tr>\n<tr><td>4</td><td>Tórax (ACV e AR)</td><td>Dor torácica, palpitação, dispneia, tosse</td></tr>\n<tr><td>5</td><td>Abdome (TGI)</td><td>Disfagia, pirose, hábito intestinal, melena</td></tr>\n<tr><td>6</td><td>Urinário e genital</td><td>Disúria, polaciúria, corrimento, ciclo menstrual</td></tr>\n<tr><td>7</td><td>Coluna, ossos, articulações, extremidades</td><td>Artralgia, lombalgia, rigidez</td></tr>\n<tr><td>8</td><td>Músculos; artérias, veias, linfáticos</td><td>Mialgia, claudicação, edema, varizes</td></tr>\n<tr><td>9</td><td>Endócrino, nervoso, psíquico, emocional</td><td>Poliúria, tremor, parestesias, humor, sono</td></tr></table>\n<h3>O que já caiu</h3>\n<p>Nas parciais, a pergunta típica traz um paciente com uma queixa (vertigem rotatória com zumbido; \"ouvido esquerdo cheio\") e pede qual informação poderia compor a RS. A resposta certa é sempre um <b>sintoma de outro aparelho, registrado no campo certo</b>: <mark class=\"f1\" data-refs=\"P80.17\">\"hábito intestinal constipado, evacuação a cada 4-5 dias\", no campo abdome/TGI</mark>. Na questão do paciente com vertigem, <mark class=\"f2\" data-refs=\"P82.17,P81.16\">entram na anamnese tanto os sintomas ligados à queixa quanto sintomas de outros sistemas, como tosse úmida matinal</mark>. Outra questão listou informações da AE registradas cada uma no seu aparelho e <mark class=\"f2\" data-refs=\"P82.4,P80.21\">todas estavam corretas</mark>.</p>\n<div class=\"pearl\"><b>Pérola de prova</b><p>A RS investiga sintomas gerais e específicos de cada aparelho (febre, tosse, dispneia, alterações urinárias) <b>mesmo que não mencionados inicialmente</b>. Essa frase exata foi a alternativa correta em duas parciais.</p></div>","qs":{"p":[{"enun":"Paciente procura atendimento por dor lombar. Na revisão de sistemas, o estudante anota: \"nega febre, nega disúria; refere tosse seca há 3 semanas, sem dispneia\".","cmd":"Qual o valor da tosse encontrada?","alts":["Deve ser descartada, pois a RS só registra sintomas ligados à HMA","Pode levantar uma suspeita sem relação com a queixa principal e deve ser caracterizada","Deve ser registrada no exame físico, pois foi encontrada pelo estudante","Deve ser registrada na HPP, pois não tem relação com a dor lombar"],"gab":1,"com":["A RS é justamente para sintomas que não apareceram na HMA.","Correta. A RS pode ser a sede da suspeita diagnóstica; sintoma presente é caracterizado com seus atributos.","A tosse é relatada, logo é sintoma (anamnese).","A HPP registra doenças prévias, não sintomas atuais."],"imgs":[]},{"enun":"Registro de RS: \"Sintomas gerais: NDN. COONG: NDN. AR: NDN.\"","cmd":"Qual a principal crítica a esse registro?","alts":["Deveria ser registrado no exame físico, e não na anamnese","Deveria listar os sintomas negados por extenso, evitando siglas como NDN","Deveria começar pelo aparelho respiratório, e não pelos sintomas gerais","Está correto, pois a sigla NDN é a forma padrão de registro"],"gab":1,"com":["A RS é parte da anamnese.","Correta. \"Nega febre, nega calafrios...\" deixa claro o que foi perguntado.","A RS começa pelos sintomas gerais e segue crânio-caudal.","A sigla esconde o que foi efetivamente investigado."],"imgs":[]},{"enun":"Paciente com queixa de \"ouvido entupido\" há 2 dias. Qual informação abaixo pertence à revisão de sistemas, no campo correto?","cmd":"Assinale a alternativa correta.","alts":["\"Lúcido e orientado\", no campo sistema nervoso","\"Hipertenso em uso de losartana\", no campo cardiovascular","\"Pai diabético\", no campo endócrino","\"Refere disúria e polaciúria há 1 semana\", no campo urinário"],"gab":3,"com":["\"Lúcido e orientado\" é achado do exame físico.","Doença prévia e medicação vão na HPP.","Doença de familiar vai na HF.","Correta. É um sintoma, registrado no aparelho a que pertence."],"imgs":[]}]},"pv":["P82.4","P82.16","S81.28","P82.17","P80.17","P80.20"]},{"id":"s2","titulo":"Termos técnicos que a prova confunde","html":"\n<p class=\"lead\">Na RS, termos técnicos são aceitos e bem-vindos, desde que usados corretamente. O professor listou pares que os alunos confundem.</p>\n<table class=\"cmp\"><tr><th>Termo</th><th>Significado</th><th>Não confunda com</th></tr>\n<tr><td><b>Disfagia</b></td><td>Dificuldade para deglutir (o alimento \"para\")</td><td><b>Odinofagia</b>: dor ao deglutir</td></tr>\n<tr><td><b>Melena</b></td><td>Fezes pretas, pastosas, fétidas: sangue digerido (sangramento alto)</td><td><b>Enterorragia</b>: sangue vivo pelo ânus, em volume (sangramento baixo); <b>hematoquezia</b>: sangue vivo misturado às fezes</td></tr>\n<tr><td><b>Dispepsia</b></td><td>Desconforto ou dor no andar superior do abdome, empachamento</td><td><b>Pirose</b>: queimação retroesternal que sobe (refluxo)</td></tr>\n<tr><td><b>Menorragia</b></td><td>Menstruação em volume ou duração aumentados, no ciclo normal</td><td><b>Metrorragia</b>: sangramento fora do período menstrual; <b>menometrorragia</b>: as duas coisas</td></tr>\n<tr><td><b>Dismenorreia</b></td><td>Cólica menstrual, dor na menstruação</td><td><b>Dispareunia</b>: dor na relação sexual</td></tr></table>\n<h3>Outros termos que aparecem nas questões</h3>\n<table class=\"cmp\"><tr><th>Termo</th><th>Significado</th></tr>\n<tr><td>Vertigem</td><td>Sensação de rotação (do ambiente ou do corpo). Tontura é termo genérico.</td></tr>\n<tr><td>Zumbido (tinnitus)</td><td>Percepção de som sem fonte externa.</td></tr>\n<tr><td>Hipoacusia</td><td>Diminuição da audição.</td></tr>\n<tr><td>Plenitude auricular</td><td>Sensação de ouvido \"cheio\", \"entupido\".</td></tr>\n<tr><td>Astenia</td><td>Fraqueza, falta de energia.</td></tr>\n<tr><td>Polaciúria × poliúria</td><td>Urinar muitas vezes × urinar grande volume.</td></tr>\n<tr><td>Nictúria</td><td>Acordar à noite para urinar.</td></tr></table>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>\"Amplificar o sintoma quando presente\": se o paciente refere disfagia, aprofunde a descrição como na HMA (para sólidos ou líquidos? progressiva? há quanto tempo?).</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Vertigem rotatória + zumbido unilateral + hipoacusia ipsilateral é a tríade clássica da doença de Ménière, o cenário usado na questão das parciais 81 e 82.</p></div>","qs":{"p":[{"enun":"Paciente relata que \"a comida trava no meio do peito\" quando engole carne, sem dor.","cmd":"Qual o termo técnico correto?","alts":["Pirose","Dispepsia","Disfagia","Odinofagia"],"gab":2,"com":["Pirose é queimação retroesternal.","Dispepsia é desconforto epigástrico.","Correta. Dificuldade para deglutir.","Odinofagia é dor ao deglutir."],"imgs":[]},{"enun":"Paciente relata fezes \"pretas como borra de café, moles e com cheiro muito forte\".","cmd":"Qual o termo e a origem provável do sangramento?","alts":["Melena; sangramento digestivo alto","Hematoquezia; sangramento digestivo alto","Melena; sangramento digestivo baixo","Enterorragia; sangramento digestivo baixo"],"gab":0,"com":["Correta. Sangue digerido indica origem alta (esôfago, estômago, duodeno).","Hematoquezia é sangue vivo misturado às fezes.","O escurecimento acontece porque o sangue foi digerido no trajeto: origem alta.","Enterorragia é sangue vivo."],"imgs":[]},{"enun":"Paciente de 30 anos relata sangramento vaginal entre as menstruações e também menstruações longas e volumosas.","cmd":"Qual o termo correto?","alts":["Menorragia","Menometrorragia","Metrorragia","Dismenorreia"],"gab":1,"com":["Menorragia é só o aumento do fluxo no período menstrual.","Correta. Aumento do fluxo menstrual mais sangramento fora do ciclo.","Metrorragia é só o sangramento fora do período.","Dismenorreia é dor menstrual."],"imgs":[]}]},"pv":[]},{"id":"s3","titulo":"HPP: antecedentes pessoais","html":"\n<p class=\"lead\">A história patológica pregressa (HPP), ou antecedentes pessoais (AP), registra a história de saúde do paciente antes do problema atual.</p>\n<h3>O que entra na HPP</h3>\n<table class=\"cmp\"><tr><th>Item</th><th>Exemplo</th></tr>\n<tr><td>Doenças prévias e crônicas</td><td>Hipertensão, diabetes, asma (mesmo controladas)</td></tr>\n<tr><td>Internações clínicas ou cirúrgicas</td><td>\"Internado há 1 ano por pneumonia\"; apendicectomia</td></tr>\n<tr><td>Alergias</td><td>Medicamentos, contrastes, alimentos (\"alérgico a camarão\")</td></tr>\n<tr><td>Traumatismos</td><td>Fraturas, acidentes</td></tr>\n<tr><td>Transfusões sanguíneas</td><td>Quando e por quê</td></tr>\n<tr><td>História obstétrica (GPA)</td><td>Gestações, partos, abortos</td></tr>\n<tr><td>Status vacinal</td><td>\"Vacinação em dia, embora não porte o cartão\"</td></tr>\n<tr><td>Medicamentos em uso e já usados</td><td>Losartana, metformina</td></tr>\n<tr><td>Desenvolvimento sexual</td><td>Puberdade, menarca, sexarca, menopausa, climatério</td></tr></table>\n<p><mark class=\"f5\" data-refs=\"S77.14,S78.21,S79.7,S80.6,P82.18,P81.20\">A HPP registra informações de interesse médico mesmo que não sejam doenças</mark>: gestações, vacinas, ausência de internações. E <mark class=\"f2\" data-refs=\"P82.18,P81.20\">deve incluir doenças crônicas, cirurgias, alergias, internações e tratamentos prévios, mesmo que controlados ou aparentemente sem repercussão atual</mark>.</p>\n<div class=\"prof\"><b>🗣️ O professor em aula</b><p>Pergunte como foi feito o diagnóstico de uma doença prévia: sintomas, evolução, tratamento, complicações. Aprenda com o relato do paciente, mesmo que você não vá registrar tudo. Você estará aprendendo sobre outras doenças.</p></div>\n<h3>Em que campo registrar: o tema que mais cai</h3>\n<p>Quatro parciais trouxeram listas de informações para o aluno distribuir nos campos. O gabarito segue sempre a mesma lógica:</p>\n<table class=\"cmp\"><tr><th>Informação</th><th>Campo</th></tr>\n<tr><td>Vacinação em dia</td><td><b>HPP</b></td></tr>\n<tr><td>Alérgico a camarão</td><td><b>HPP</b></td></tr>\n<tr><td>Internação por pneumonia há 1 ano</td><td><b>HPP</b></td></tr>\n<tr><td>Tabagista, sedentário, etilista</td><td><b>HV</b> (hábitos de vida), e não HPP</td></tr>\n<tr><td>Pai falecido de IAM / morte súbita aos 54 anos</td><td><b>HF</b></td></tr>\n<tr><td>Nega tosse, dispneia e dor torácica</td><td><b>RS</b></td></tr>\n<tr><td>Dor lombar contínua que piora com a tosse (a queixa)</td><td><b>HMA</b></td></tr>\n<tr><td>Natural e residente em Belo Horizonte</td><td><b>Identificação</b></td></tr></table>\n<p>Respostas que caíram: <mark class=\"f2\" data-refs=\"P82.5,P80.15\">\"1-HPP; 2-HV; 3-HF; 4-RS\"</mark>, <mark class=\"f1\" data-refs=\"P80.3\">\"apenas 1, 2 e 4\" (o tabagismo fica fora da HPP)</mark> e <mark class=\"f1\" data-refs=\"P80.22\">\"I-HF; II-HPP; III-HMA; IV-Identificação\"</mark>.</p>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>A pegadinha clássica é colocar o tabagismo na HPP. Tabagismo é <b>hábito de vida</b>. Já uma doença causada pelo tabaco (DPOC) é HPP.</p></div>","qs":{"p":[{"enun":"Informações colhidas: 1) G3P2A1; 2) etilista social; 3) mãe com câncer de mama; 4) cirurgia de hérnia inguinal aos 30 anos.","cmd":"Quais pertencem à HPP?","alts":["1, 2 e 4","2 e 3","1 e 4","1, 3 e 4"],"gab":2,"com":["Etilismo é hábito de vida (HV).","Etilismo é HV e câncer da mãe é HF.","Correta. História obstétrica e cirurgia prévia são antecedentes pessoais.","Doença da mãe é HF."],"imgs":[]},{"enun":"Paciente de 70 anos nega qualquer doença, mas relata que \"toma um remedinho de pressão há 10 anos, que já está controlada\".","cmd":"Como registrar essa informação?","alts":["Na HPP, como hipertensão arterial em uso de medicação, mesmo controlada","Não registrar, pois a doença está controlada e não tem repercussão atual","Na RS, no campo cardiovascular, como sintoma negado","Na HMA, pois é uma doença presente no momento da consulta"],"gab":0,"com":["Correta. Doença crônica controlada continua sendo antecedente pessoal relevante.","Controlada não quer dizer sem importância (interações, riscos).","Hipertensão é diagnóstico, não sintoma.","A HMA é a história da queixa atual."],"imgs":[]},{"enun":"Em qual campo deve ser registrado \"refere ser vacinado contra hepatite B e tétano, sem o cartão\"?","cmd":"Assinale a alternativa correta.","alts":["Hábitos de vida e condições de moradia","Revisão de sistemas (interrogatório sintomatológico)","Identificação do paciente","HPP (antecedentes pessoais)"],"gab":3,"com":["HV registra alimentação, atividade física, tabaco, álcool.","RS registra sintomas.","Identificação registra dados pessoais e sociais.","Correta. Status vacinal faz parte da HPP."],"imgs":[]}]},"pv":["S80.6","P82.5","P82.18","P80.22","P80.3"]},{"id":"s4","titulo":"História familiar, hábitos de vida e carga tabágica","html":"\n<p class=\"lead\">Os últimos componentes da anamnese situam o paciente na família, nos hábitos e no contexto social. É onde aparece a conta da carga tabágica, que já caiu três vezes.</p>\n<h3>História familiar (HF / AF)</h3>\n<p><mark class=\"f2\" data-refs=\"S80.9,S81.28\">Registra a presença ou ausência de doenças ou situações de interesse para a saúde nos familiares</mark>: HAS, enxaqueca, DM, câncer de mama e de intestino, tuberculose, IAM, doença arterial coronariana, AVE, dislipidemias, colelitíase. Doenças em parentes de primeiro grau em idade precoce aumentam o risco do paciente (no caso da aula: pai falecido aos 47 anos por \"infarto fulminante\", irmão com sequela de AVC aos 49).</p>\n<h3>Hábitos de vida (HV)</h3>\n<ul><li>Alimentação (viciosa, restritiva, \"crudivorista\").</li><li>Ocupação atual e anteriores.</li><li>Atividade física.</li><li>Tabaco e bebidas alcoólicas, com <b>escores de quantificação</b>.</li><li>Drogas ilícitas, anabolizantes e anfetaminas.</li></ul>\n<h3>Condições socioeconômicas e culturais (HSC)</h3>\n<p>Habitação, condições socioeconômicas e culturais, vida conjugal e relacionamento familiar.</p>\n<h3>Carga tabágica (anos-maço)</h3>\n<p>A fórmula é: <b>anos-maço = (cigarros por dia ÷ 20) × anos de tabagismo</b>. Um maço tem 20 cigarros industrializados.</p>\n<ul><li><mark class=\"f1\" data-refs=\"P81.18\">Fumante há 15 anos, 20 cigarros industrializados por dia → 1 maço × 15 anos = <b>15 anos-maço</b></mark>.</li>\n<li>Cigarro de palha: o cigarro de palha é maior e sem filtro, e vale por vários industrializados. <mark class=\"f2\" data-refs=\"P82.14,P81.4\">Fumante desde os 15 anos, hoje com 40 (25 anos de tabagismo), 8 cigarros de palha por dia: o gabarito oficial foi <b>50 anos-maço</b></mark>. A conta que fecha com esse gabarito: 8 palhas × 5 = 40 cigarros/dia = 2 maços × 25 anos = 50.</li></ul>\n<div class=\"warn\"><b>⚠️ Atenção</b><p>Alguns livros usam 1 palha ≈ 4 industrializados, o que daria 40 anos-maço (não estava nas alternativas). As alternativas da prova eram 25, 50, 75 e 100, e o gabarito foi 50: na prova deste professor, use <b>1 cigarro de palha = 5 industrializados</b>.</p></div>\n<div class=\"pearl\"><b>Pérola de prova</b><p>Revise a anamnese completa ao final, como no slide: \"A anamnese completa foi capaz de lhe dar uma visão global do paciente, ou 'só' da doença?\"</p></div>\n<div class=\"extra\"><p><span class=\"tag\">■ EXTRA:</span> Carga tabágica acima de 20 anos-maço é um dos critérios usados para rastreamento de câncer de pulmão com tomografia de baixa dose em adultos de 50 a 80 anos.</p></div>","qs":{"p":[{"enun":"Paciente de 55 anos fuma 30 cigarros industrializados por dia desde os 25 anos.","cmd":"Qual a carga tabágica?","alts":["90 anos-maço","60 anos-maço","45 anos-maço","30 anos-maço"],"gab":2,"com":["Multiplicou cigarros por 3; a conta é 1,5 × 30.","Calculou 2 maços por dia; 30 cigarros são 1,5 maço.","Correta. 30 ÷ 20 = 1,5 maço × 30 anos = 45.","Esqueceu de converter cigarros em maços (30 cigarros = 1,5 maço)."],"imgs":[]},{"enun":"Em que campo da anamnese se registra \"ex-etilista, parou de beber há 5 anos; caminha 3 vezes por semana\"?","cmd":"Assinale a alternativa correta.","alts":["História familiar","Hábitos de vida","Condições socioculturais","História patológica pregressa"],"gab":1,"com":["HF registra doenças dos familiares.","Correta. Álcool e atividade física são hábitos de vida.","HSC registra habitação, renda, vida conjugal.","HPP registra doenças, cirurgias, alergias, vacinas."],"imgs":[]},{"enun":"Paciente de 35 anos tem pai com IAM aos 45 anos e mãe com AVC aos 58. O estudante registra apenas \"HF: NDN\", pois o paciente é saudável.","cmd":"Qual a crítica correta?","alts":["Acertou: a HF só é preenchida quando o paciente já tem a mesma doença","Errou: essas informações deveriam ir na revisão de sistemas","Acertou: doenças dos pais devem ir na HPP do paciente","Errou: a HF registra doenças dos familiares, que aumentam o risco do paciente"],"gab":3,"com":["A HF independe de o paciente estar doente.","A RS registra sintomas do paciente.","A HPP é do próprio paciente.","Correta. Doença cardiovascular precoce em parente de primeiro grau é dado de risco relevante."],"imgs":[]}]},"pv":["P82.14","P81.18"]}],"quiz":[{"enun":"A revisão de sistemas é, essencialmente, uma revisão de:","cmd":"Assinale a alternativa correta.","alts":["Sinais do exame físico","Doenças prévias","Exames complementares","Sintomas"],"gab":3,"com":["Sinais são do exame físico.","Doenças prévias vão na HPP.","Exames não fazem parte da anamnese.","Correta."],"imgs":[]},{"enun":"A ordem recomendada na RS é:","cmd":"Assinale a alternativa correta.","alts":["Aparelho da queixa principal primeiro, depois os demais","Sintomas gerais primeiro, depois sentido crânio-caudal","Qualquer ordem, desde que todos os aparelhos sejam revistos","Sentido caudal-cranial, terminando nos sintomas gerais"],"gab":1,"com":["A queixa principal já foi explorada na HMA.","Correta.","A sistematização evita esquecimentos.","É o inverso."],"imgs":[]},{"enun":"\"Dor ao engolir\" é:","cmd":"Assinale a alternativa correta.","alts":["Dispepsia","Odinofagia","Disfagia","Pirose"],"gab":1,"com":["Dispepsia é desconforto epigástrico.","Correta.","Disfagia é dificuldade, não dor.","Pirose é queimação retroesternal."],"imgs":[]},{"enun":"Fumante de 40 cigarros industrializados por dia há 10 anos tem carga tabágica de:","cmd":"Assinale a alternativa correta.","alts":["400 anos-maço","10 anos-maço","20 anos-maço","40 anos-maço"],"gab":2,"com":["Multiplicou cigarros por anos.","Usou 1 maço por dia.","Correta. 2 maços × 10 anos.","Esqueceu de dividir por 20."],"imgs":[]},{"enun":"Qual destas informações vai na HPP?","cmd":"Assinale a alternativa correta.","alts":["Mãe diabética","Nega disúria","Alergia a penicilina","Sedentarismo"],"gab":2,"com":["Doença da mãe é HF.","Sintoma negado é RS.","Correta.","Sedentarismo é HV."],"imgs":[]},{"enun":"A \"síndrome da mão na maçaneta\" refere-se a:","cmd":"Assinale a alternativa correta.","alts":["O paciente que se recusa a ser examinado","O médico que encerra a consulta antes de examinar o paciente","A dor no punho de quem trabalha abrindo portas","O paciente que conta a queixa importante já saindo da consulta"],"gab":3,"com":["Não é recusa de exame.","Não é sobre o médico.","Não é doença ocupacional.","Correta. Uma RS bem feita reduz isso."],"imgs":[]},{"enun":"Paciente com vertigem rotatória, zumbido e hipoacusia à esquerda relata também tosse úmida matinal há 1 mês. A tosse:","cmd":"Assinale a alternativa correta.","alts":["Deve ser registrada na HF","Pode fazer parte da anamnese, na RS (aparelho respiratório)","Não deve ser registrada, pois não tem relação com a queixa","Deve substituir a queixa principal, por ser mais antiga"],"gab":1,"com":["HF é dos familiares.","Correta.","A RS existe justamente para isso.","A QP é o motivo da consulta."],"imgs":[]},{"enun":"\"Pai falecido aos 54 anos por morte súbita\" vai em:","cmd":"Assinale a alternativa correta.","alts":["HMA","HV","HF","HPP"],"gab":2,"com":["HMA é a queixa atual.","HV são hábitos.","Correta.","HPP é do próprio paciente."],"imgs":[]}],"widgets":[{"id":"termo","titulo":"Qual é o termo técnico?","desc":"Associe a descrição do paciente ao termo correto.","cats":[["dis","Disfagia"],["odi","Odinofagia"],["mel","Melena"],["ent","Enterorragia"],["pir","Pirose"],["ver","Vertigem"]],"cards":[["\"A comida trava ao engolir\"","dis"],["\"Dói para engolir\"","odi"],["\"Fezes pretas e fedidas\"","mel"],["\"Saiu sangue vivo em quantidade\"","ent"],["\"Queimação que sobe pelo peito\"","pir"],["\"Tudo gira à minha volta\"","ver"],["\"O líquido volta pelo nariz ao engolir\"","dis"],["\"Garganta dói ao engolir saliva\"","odi"]]}],"gl":[["RS / AE / IS","Revisão de sistemas, anamnese especial ou interrogatório sintomatológico: revisão dos sintomas por aparelho.",1],["COONG","Cabeça, olhos, ouvidos, nariz e garganta.",1],["NDN","\"Nada digno de nota\": sigla a evitar.",1],["Disfagia","Dificuldade para deglutir.",2],["Odinofagia","Dor ao deglutir.",2],["Melena","Fezes pretas, fétidas: sangramento alto.",2],["Enterorragia","Sangue vivo pelo ânus: sangramento baixo.",2],["Menometrorragia","Fluxo aumentado e sangramento fora do ciclo.",2],["GPA","Gestações, partos e abortos.",3],["Anos-maço","(cigarros/dia ÷ 20) × anos de tabagismo.",4]],"vf":[["A RS registra apenas sintomas relacionados à queixa principal.",false,"Registra sintomas de todos os aparelhos, mesmo não mencionados."],["Tabagismo deve ser registrado na HPP.",false,"Tabagismo
